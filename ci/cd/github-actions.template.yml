# [TEMPLATE: CUI // SP-CTI]
# ICDEV Base GitHub Actions Template
# Classification: CUI // SP-CTI

name: ICDEV CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  ICDEV_CLASSIFICATION: "CUI"
  ICDEV_IMPACT_LEVEL: "IL4"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff
      - run: ruff check . --select E,F,W

  test-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: pytest tests/ -v --tb=short --ignore=tests/e2e

  security-bandit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install bandit
      - run: bandit -r tools/ -ll -f json -o bandit-report.json
      - uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: bandit-report.json
        if: always()
