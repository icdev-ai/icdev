# CUI // SP-CTI
id: inject-03-comms-blackout
title: "Comms Blackout — ML Trajectory Payoff"

body_md: |
  ## COMMS BLACKOUT — CLASSIFICATION: CUI//SP-CTI
  **DTG:** 141942Z MAY 26
  **FROM:** NAVSOC WESTPAC — SATELLITE TASKING AUTHORITY
  **TO:** TASK GROUP 77.4 OPERATIONS

  ---

  ### COMMS BLACKOUT REPORT

  Golf-7 has entered **EMCON Alpha** — all emissions ceased at 141910Z. Last confirmed fix:
  Grid **XB-441**, course 073°, speed 18 knots. SATCOM relay to collection node Alpha-7
  degraded due to PLA electronic warfare activity.

  **No SIGINT available.** No new AIS. Visual reconnaissance not feasible (cloud deck 8/8).

  ---

  ### ML TRAJECTORY PREDICTION REQUIRED

  With all sensors dark, your **ML trajectory model is the only source of positional intelligence**.
  Your data scientist must deploy a fine-tuned model against the last known track and environmental
  data to predict Golf-7's current position and projected course.

  **Available inputs for model:**
  - Last fix: XB-441 @ 141910Z, 073°, 18 kts
  - Historical PLAN Type-054A behavior patterns (training data)
  - Oceanographic data: current sets, thermocline depth, likely acoustic shadow zones
  - Satellite tasking window opens at 142030Z — you need a grid estimate **before** then

  ---

  ### YOUR TASKING

  Your team has **18 minutes** to produce an ML-grounded Trajectory Prediction. Use AI tools to:

  1. **Deploy your fine-tuned trajectory model** — submit the model receipt (model_id required)
  2. **Output a predicted grid** with confidence interval at 142030Z (±nm radius)
  3. **Justify model inputs** — which features drove the prediction?
  4. **Recommend satellite tasking priority** — which grid square should we task first?

  **This inject requires a `finetune.deploy` receipt.** Teams without a fine-tune receipt
  will receive maximum 50% of base score regardless of response quality.

  ---

  *Without ML, we are blind. The model is the intelligence.*

