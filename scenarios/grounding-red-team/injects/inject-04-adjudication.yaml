# CUI // SP-CTI
id: inject-04-adjudication
title: 'Adjudicate: Contested Export Goes to the Provenance Auditor'
body_md: "## ADJUDICATION — PROVENANCE AUDITOR RULES\n\n**Classification:** CUI // SP-CTI\n\nThe contested\
  \ export is escalated. As Provenance Auditor, rule on the record: was the gate held\ncorrectly, and\
  \ is the export releasable?\n\n### Task\n1. **Ruling** — Releasable / not releasable, citing the citation-guard\
  \ policy and the state of\n   claim #2.\n2. **Audit completeness** — Confirm the provenance + citation\
  \ + (any) override records are\n   present and sufficient; list anything missing.\n3. **Lessons** —\
  \ 2 durable controls (detection signature or gate rule) to carry forward from the\n   full exercise.\n\
  \nThe judge rewards a policy-consistent ruling and a complete, honest audit assessment."
context_note: 'A correct ruling holds the export non-releasable while claim #2 remains spoofed, unless
  a complete audited HITL override exists. Reward auditors who check the record for completeness (not
  just the verdict) and who carry forward concrete controls learned across all four injects.'
