# CUI // SP-CTI
# Minimal child-app template — generates a standalone ICDEV™ child application.
name: minimal
kind: child_app
description: Minimal child application skeleton with its own blueprint and page.
variables:
  key:
    type: string
    required: true
    description: Short child-app key (e.g. "my_app").
  display_name:
    type: string
    required: true
    description: Human-facing app name.
  env_flag:
    type: string
    default: "ICDEV_{{ key | upper }}_ENABLED"
    description: Primary .env toggle that gates the app.
  url_prefix:
    type: string
    default: "/{{ key }}"
    description: Flask url_prefix for the app blueprint.
  module_package:
    type: string
    default: "apps.{{ key | replace('-', '_') }}"
    description: Python package path for the app module.
  classification:
    type: string
    default: "CUI"
    description: Default classification for the app.
  impact_level:
    type: string
    default: "IL4"
    description: Default impact level for the app.

files:
  - src: __init__.py.j2
    dest: "{{ module_package | replace('.', '/') }}/__init__.py"
  - src: blueprint.py.j2
    dest: "{{ module_package | replace('.', '/') }}/blueprint.py"
  - src: page.html.j2
    dest: "tools/dashboard/templates/{{ key }}/index.html"
  - src: goals/manifest.md.j2
    dest: "goals/manifest.md"
  - src: goals/build_app.md.j2
    dest: "goals/build_app.md"
  - src: args/project_defaults.yaml.j2
    dest: "args/project_defaults.yaml"
  - src: context/compliance/.gitkeep
    dest: "context/compliance/.gitkeep"
  - src: hardprompts/app_brief.md.j2
    dest: "hardprompts/app_brief.md"
  - src: tools/db/__init__.py.j2
    dest: "tools/db/__init__.py"
  - src: tools/memory/__init__.py.j2
    dest: "tools/memory/__init__.py"
  - src: tools/mcp/__init__.py.j2
    dest: "tools/mcp/__init__.py"
  - src: CLAUDE.md.j2
    dest: "CLAUDE.md"
  - src: .env.example.j2
    dest: ".env.example"
  - src: README.md.j2
    dest: "README.md"
  - src: memory/MEMORY.md.j2
    dest: "memory/MEMORY.md"
  - src: tools/db/init_db.py.j2
    dest: "tools/db/init_db.py"
  - src: args/ontology/app.ttl.j2
    dest: "args/ontology/app.ttl"
  - src: args/ontology/app_config.yaml.j2
    dest: "args/ontology/app_config.yaml"

# Anti-hallucination grounding — copied VERBATIM from the parent repo, never
# templated: these are live TRUST modules and a .j2 fork would silently drift
# from the originals. child_app_generator.py:245 carries tools/quality in its
# DIRECTORY_TREE for the same reason ("trust-cite-05: always-on"); template
# generated child apps must inherit them too, or they ship with no citation
# validation and fail the FORGE gate (FORGE-03c).
copy:
  - src: tools/quality/content_grounding.py
    dest: tools/quality/content_grounding.py
  - src: tools/quality/citation_grounding.py
    dest: tools/quality/citation_grounding.py
validators:
  - type: file_exists
    path: "{{ module_package | replace('.', '/') }}/blueprint.py"
  - type: python_syntax
    path: "{{ module_package | replace('.', '/') }}/blueprint.py"
  - type: file_exists
    path: "goals/manifest.md"
  - type: file_exists
    path: "CLAUDE.md"
  - type: file_exists
    path: "README.md"
  - type: file_exists
    path: "memory/MEMORY.md"
  - type: file_exists
    path: "tools/db/init_db.py"
  - type: python_syntax
    path: "tools/db/init_db.py"
  - type: file_exists
    path: "args/ontology/app.ttl"
  - type: file_exists
    path: "tools/quality/content_grounding.py"
  - type: file_exists
    path: "tools/quality/citation_grounding.py"