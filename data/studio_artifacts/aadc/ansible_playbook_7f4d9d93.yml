---
# Ansible Playbook — AADC Lambda Layer + API Key Rotation
# Generated: 2026-05-19T23:59:00Z
# Run after: terraform apply
# CUI // SP-CTI

- name: AADC Agentic AI Post-Provisioning
  hosts: agent_hosts
  gather_facts: true
  become: true

  vars:
    lambda_layer_dir: "/opt/agent-layers"
    rotation_schedule: "rate(30 days)"

  tasks:
    - name: Install Python dependencies for Lambda layers
      ansible.builtin.pip:
        name:
          - boto3
          - anthropic
          - openai
          - pydantic
          - langchain
        state: present
        extra_args: "--target { lambda_layer_dir }/python"

    - name: Package Lambda layer ZIP
      community.general.archive:
        path: "{ lambda_layer_dir }/python"
        dest: "/tmp/agent-layer.zip"
        format: zip

    - name: Upload Lambda layer to S3
      amazon.aws.s3_object:
        bucket: "{ artifacts_bucket | default('icdev-artifacts') }"
        object: "lambda/agent-layer.zip"
        src: "/tmp/agent-layer.zip"
        mode: put

    - name: Configure API key rotation via SSM
      amazon.aws.ssm_parameter:
        name: "/aadc/{ environment | default('dev') }/api_key_rotation_schedule"
        value: "{ rotation_schedule }"
        string_type: String
        state: present

    - name: Verify Lambda functions deployed
      amazon.aws.lambda_info:
        name: "{ environment | default('dev') }-aadc-{ agent_name | default('icdev-agent') }-orchestrator"
      register: lambda_info
      ignore_errors: true

    - name: Report Lambda status
      ansible.builtin.debug:
        msg: "Agent orchestrator Lambda: { lambda_info.get('configuration', {}).get('State', 'UNKNOWN') }"
