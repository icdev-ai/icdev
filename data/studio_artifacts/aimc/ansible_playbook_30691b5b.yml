---
# Ansible Playbook — AIMC ML Runtime Environment Setup
# Generated: 2026-05-19T23:59:12Z
# Run after: terraform apply
# CUI // SP-CTI

- name: AIMC ML Runtime Environment Setup
  hosts: ml_hosts
  gather_facts: true
  become: true

  vars:
    ml_libs:
      - torch==2.2.0
      - torchvision==0.17.0
      - scikit-learn==1.4.0
      - numpy==1.26.4
      - pandas==2.2.0
      - boto3
      - sagemaker
    sagemaker_agent_dir: "/opt/sagemaker-agent"

  tasks:
    - name: Install ML Python libraries
      ansible.builtin.pip:
        name: "{ item }"
        state: present
      loop: "{ ml_libs }"

    - name: Configure SageMaker local mode
      ansible.builtin.copy:
        dest: "~/.sagemaker/config.yaml"
        content: |
          local_mode:
            container_root: /tmp/sagemaker/containers
            s3_root_uri: s3://{ ml_artifacts_bucket | default('icdev-ml-artifacts') }
        mode: "0600"

    - name: Set ML environment variables
      ansible.builtin.lineinfile:
        path: /etc/environment
        line: "{ item }"
        state: present
      loop:
        - 'SAGEMAKER_DOMAIN="{ sagemaker_domain_name | default("icdev-ml") }"'
        - 'ML_MODEL_NAME="{ model_name | default("icdev-model-v1") }"'
        - 'AWS_DEFAULT_REGION="{ aws_region | default("us-gov-west-1") }"'

    - name: Validate PyTorch installation
      ansible.builtin.command: python3 -c "import torch; print(torch.__version__)"
      register: torch_version
      changed_when: false

    - name: Validate SageMaker SDK
      ansible.builtin.command: python3 -c "import sagemaker; print(sagemaker.__version__)"
      register: sm_version
      changed_when: false

    - name: Report ML runtime status
      ansible.builtin.debug:
        msg:
          - "PyTorch: { torch_version.stdout }"
          - "SageMaker SDK: { sm_version.stdout }"
