---
# Ansible Playbook — BDC Boundary Hardening
# Generated: 2026-05-19T23:58:11Z
# Run after: terraform apply

- name: BDC Authorization Boundary Hardening
  hosts: boundary_hosts
  become: true
  gather_facts: true

  tasks:
    - name: Enforce FIPS 140-2 mode
      ansible.builtin.command:
        cmd: fips-mode-setup --enable
      register: fips_result
      changed_when: "'already' not in fips_result.stdout"
      ignore_errors: true

    - name: Verify FIPS mode is enabled
      ansible.builtin.command:
        cmd: cat /proc/sys/crypto/fips_enabled
      register: fips_check
      changed_when: false

    - name: Report FIPS status
      ansible.builtin.debug:
        msg: "FIPS mode: {{ 'ENABLED' if fips_check.stdout | trim == '1' else 'DISABLED - ACTION REQUIRED' }}"

    - name: Configure auditd for boundary events
      ansible.builtin.copy:
        dest: /etc/audit/rules.d/boundary.rules
        content: |
          # BDC Boundary Audit Rules — NIST AU-2, AU-12
          -a always,exit -F arch=b64 -S socket -k boundary_socket
          -a always,exit -F arch=b64 -S connect -k boundary_connect
          -a always,exit -F arch=b64 -S bind -k boundary_bind
          -w /etc/hosts -p wa -k boundary_hosts
          -w /etc/resolv.conf -p wa -k boundary_dns
          -a always,exit -F arch=b64 -S execve -F uid=0 -k boundary_root_exec
        mode: "0640"
      notify: reload auditd rules

    - name: Set kernel parameters for boundary hardening
      ansible.posix.sysctl:
        name: "{{ item.name }}"
        value: "{{ item.value }}"
        sysctl_set: true
        state: present
        reload: true
      loop:
        - { name: "kernel.dmesg_restrict", value: "1" }
        - { name: "kernel.kptr_restrict", value: "2" }
        - { name: "kernel.yama.ptrace_scope", value: "1" }
        - { name: "net.ipv4.conf.all.log_martians", value: "1" }
        - { name: "net.ipv4.conf.default.log_martians", value: "1" }
        - { name: "net.ipv4.conf.all.send_redirects", value: "0" }
        - { name: "net.ipv4.conf.all.accept_redirects", value: "0" }

    - name: Disable unused network protocols
      ansible.builtin.copy:
        dest: /etc/modprobe.d/boundary-blacklist.conf
        content: |
          install dccp /bin/false
          install sctp /bin/false
          install rds /bin/false
          install tipc /bin/false
        mode: "0644"

    - name: Verify boundary SSM config parameter exists
      ansible.builtin.command:
        cmd: >
          aws ssm get-parameter
          --name "/icdev/boundary/{{ lookup('env','BOUNDARY_NAME') | default('icdev-boundary') }}/config"
          --with-decryption
      register: ssm_boundary_check
      changed_when: false
      ignore_errors: true

    - name: Report boundary SSM config status
      ansible.builtin.debug:
        msg: "Boundary SSM config: {{ 'OK' if ssm_boundary_check.rc == 0 else 'MISSING - Terraform may not have applied yet' }}"

    - name: Verify KMS key alias is accessible
      ansible.builtin.command:
        cmd: >
          aws kms describe-key
          --key-id "alias/icdev-{{ lookup('env','BOUNDARY_NAME') | default('icdev-boundary') }}-boundary"
      register: kms_check
      changed_when: false
      ignore_errors: true

    - name: Report KMS key status
      ansible.builtin.debug:
        msg: "KMS boundary key: {{ 'OK' if kms_check.rc == 0 else 'MISSING' }}"

  handlers:
    - name: reload auditd rules
      ansible.builtin.command:
        cmd: augenrules --load
      changed_when: true
