# CUI // SP-CTI
# AWS Amplify build spec — migrated from Nginx/K8s deployment
version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm use 18
        - node --version
        - npm ci
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: build
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
test:
  phases:
    preTest:
      commands:
        - npm ci
    test:
      commands:
        - npm test -- --watchAll=false --ci
  artifacts:
    baseDirectory: coverage
    files:
      - '**/*'
