# CUI // SP-CTI
# context/migration/refactor_rules.yaml
# Dispatch rules for cam_refactor_engine.py
#
# Each rule matches on (source_tech, strategy_7r) and produces one or more
# refactor jobs of the given type.  Rules are evaluated top-to-bottom;
# ALL matching rules fire (not just the first).
#
# refactor_type values must match the mc_refactor_jobs CHECK constraint:
#   version_upgrade | framework_migration | db_ddl_generation |
#   code_scaffold   | language_translation | ai_integration
#
# scaffold_type is used by cam_refactor_engine to pick the right generator
# when refactor_type == 'code_scaffold' or 'ai_integration'.
#
# If source_repo is set on the app_inventory row the engine will delegate to
# the real AST-based tool (version_migrator / framework_migrator /
# translation_manager) instead of generating a scaffold template.

rules:

  # ── Database tier ────────────────────────────────────────────────────────
  - match_tech: oracle
    match_strategy: rearchitect
    jobs:
      - type: db_ddl_generation
        source_db: oracle
        target_db: aurora-postgresql
        description: "Generate Aurora PostgreSQL DDL + DMS task config from Oracle schema"

  - match_tech: oracle
    match_strategy: rearchitect
    jobs:
      - type: ai_integration
        scaffold_type: pgvector_schema
        ai_service: pgvector
        description: "pgvector extension + HNSW index setup for semantic search"

  - match_tech: mysql
    match_strategy: replatform
    jobs:
      - type: db_ddl_generation
        source_db: mysql
        target_db: aurora-mysql
        description: "Generate Aurora MySQL DDL + DMS task config from MySQL schema"

  - match_tech: postgresql
    match_strategy: replatform
    jobs:
      - type: db_ddl_generation
        source_db: postgresql
        target_db: aurora-postgresql
        description: "Generate Aurora PostgreSQL DDL + pg_dump migration script"

  - match_tech: mongodb
    match_strategy: replatform
    jobs:
      - type: code_scaffold
        scaffold_type: documentdb_migration
        description: "DocumentDB migration scripts + mongomirror config"

  # ── Cache tier ──────────────────────────────────────────────────────────
  - match_tech: redis
    match_strategy: replatform
    jobs:
      - type: code_scaffold
        scaffold_type: elasticache_config
        description: "ElastiCache Terraform + DUMP/RESTORE migration script"

  - match_tech: redis
    match_strategy: replatform
    jobs:
      - type: ai_integration
        scaffold_type: semantic_cache
        ai_service: semantic-cache
        description: "Bedrock embeddings semantic cache layer over ElastiCache"

  # ── Search / analytics tier ──────────────────────────────────────────────
  - match_tech: elasticsearch
    match_strategy: replatform
    jobs:
      - type: code_scaffold
        scaffold_type: opensearch_migration
        description: "S3 snapshot/restore + index template + alias migration scripts"

  - match_tech: elasticsearch
    match_strategy: replatform
    jobs:
      - type: ai_integration
        scaffold_type: bedrock_kb
        ai_service: bedrock-kb
        description: "Bedrock Knowledge Base + OpenSearch vector index integration"

  # ── Pipeline / integration tier ─────────────────────────────────────────
  - match_tech: nifi
    match_strategy: rearchitect
    jobs:
      - type: code_scaffold
        scaffold_type: glue_etl_template
        description: "AWS Glue PySpark ETL job + MSK streaming + EventBridge schedule"

  - match_tech: kafka
    match_strategy: replatform
    jobs:
      - type: code_scaffold
        scaffold_type: msk_migration
        description: "MSK cluster config + MirrorMaker2 replication + producer/consumer"

  # ── Frontend tier ───────────────────────────────────────────────────────
  - match_tech: react
    match_strategy: replatform
    jobs:
      - type: code_scaffold
        scaffold_type: amplify_migration
        description: "Amplify build spec + CloudFront config + CI/CD pipeline migration"

  - match_tech: react
    match_strategy: replatform
    jobs:
      - type: ai_integration
        scaffold_type: bedrock_agents_hook
        ai_service: bedrock-agents
        description: "Bedrock Inline Agent React hook for AI-powered UX"

  # ── Container / infra tier ───────────────────────────────────────────────
  - match_tech: kubernetes
    match_strategy: rehost
    jobs:
      - type: code_scaffold
        scaffold_type: eks_fargate_migration
        description: "EKS Fargate profile + manifest converter + IRSA role bindings"

  - match_tech: kubernetes
    match_strategy: replatform
    jobs:
      - type: code_scaffold
        scaffold_type: eks_fargate_migration
        description: "EKS Fargate profile + manifest converter + IRSA role bindings"

  # ── Language-level upgrades (fire when source_repo is set) ──────────────
  - match_language: python
    match_version_prefix: "2"
    jobs:
      - type: version_upgrade
        source_language: python
        source_version: "2"
        target_version: "3"
        description: "AST-based Python 2 → 3 migration (version_migrator.py)"

  - match_language: java
    match_version_prefix: "8"
    jobs:
      - type: version_upgrade
        source_language: java
        source_version: "8"
        target_version: "17"
        description: "Bytecode-safe Java 8 → 17 migration (version_migrator.py)"

  - match_language: java
    match_version_prefix: "11"
    jobs:
      - type: version_upgrade
        source_language: java
        source_version: "11"
        target_version: "17"
        description: "Java 11 → 17 migration (version_migrator.py)"

  - match_framework: struts
    jobs:
      - type: framework_migration
        source_framework: struts
        target_framework: spring-boot
        description: "Struts → Spring Boot migration (framework_migrator.py)"

  - match_framework: ejb
    jobs:
      - type: framework_migration
        source_framework: ejb
        target_framework: spring
        description: "EJB → Spring migration (framework_migrator.py)"

  - match_framework: wcf
    jobs:
      - type: framework_migration
        source_framework: wcf
        target_framework: aspnet-core-grpc
        description: "WCF → ASP.NET Core gRPC migration (framework_migrator.py)"
