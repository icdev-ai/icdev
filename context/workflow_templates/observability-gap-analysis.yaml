name: Observability Gap Analysis — MITRE Coverage
description: Analyze SOC observability coverage, identify MITRE ATT&CK detection gaps, and generate remediation plan.
category: security
tags: [soc, mitre, observability, detection, odc]
author: builtin
steps:
  - id: log_inventory
    name: Log Source Inventory
    tool: tools/observability_canvas/log_scanner.py
    node_type: tool
    required: true
    timeout: 300
  - id: mitre_map
    name: MITRE ATT&CK Coverage Mapping
    tool: tools/observability_canvas/mitre_mapper.py
    node_type: tool
    required: true
    timeout: 300
    depends_on: [log_inventory]
  - id: gap_report
    name: Gap Report Generation
    tool: tools/observability_canvas/gap_reporter.py
    node_type: tool
    required: true
    timeout: 180
    depends_on: [mitre_map]
  - id: analyst_review
    name: SOC Analyst Review
    tool: ""
    node_type: human
    role: reviewer
    required: true
    depends_on: [gap_report]
  - id: remediation
    name: Remediation Plan Export
    tool: tools/observability_canvas/remediation_exporter.py
    node_type: tool
    required: false
    timeout: 120
    depends_on: [analyst_review]
