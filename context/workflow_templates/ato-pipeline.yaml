name: ATO Pipeline — FIPS + ISSO + SSP
description: End-to-end Authority to Operate workflow covering FIPS 199 categorization, ISSO security review, and System Security Plan generation.
category: compliance
tags: [ato, fips, ssp, isso, nist]
author: builtin
steps:
  - id: fips199
    name: FIPS 199 Security Categorization
    tool: tools/compliance/fips199_categorizer.py
    node_type: tool
    required: true
    timeout: 300
  - id: fips200
    name: FIPS 200 Safeguards Validation
    tool: tools/compliance/fips200_validator.py
    node_type: tool
    required: true
    timeout: 300
    depends_on: [fips199]
  - id: isso_review
    name: ISSO Security Review
    tool: ""
    node_type: human
    role: isso
    required: true
    depends_on: [fips200]
  - id: ssp_gen
    name: SSP Generation
    tool: tools/compliance/ssp_generator.py
    node_type: tool
    required: true
    timeout: 300
    depends_on: [isso_review]
  - id: ao_approval
    name: AO Final Approval
    tool: ""
    node_type: approval
    role: authorizing_official
    approval_policy: any
    depends_on: [ssp_gen]
