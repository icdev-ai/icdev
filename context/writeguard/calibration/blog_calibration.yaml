  - id: cal-blog-13
    score: 4
    text: |
      Hollow tests are one of the most dangerous failure modes of AI-generated
      code. A hollow test executes code without meaningfully verifying behavior —
      it might call a function, capture the return value, and assert nothing.
      ICDEV™'s Anti-Sycophancy Gate (L18) detects 6 categories of hollow patterns:
      assertion-free, tautological, happy-path-only, mirror tests, shallow mocks,
      and hardcoded oracles.
    reasoning: "Original concept (hollow tests), specific tool (L18), 6 named categories, but no metric or CLI example."

