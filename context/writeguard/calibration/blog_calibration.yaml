calibration_examples:
  # --- Score 5 (Outstanding) ---
  - id: cal-blog-01
    score: 5
    text: |
      When a federal agency deployed ICDEV™'s crosswalk engine, implementing AC-2
      automatically populated FedRAMP, CMMC, and 800-171 status — cutting their
      multi-framework assessment from 6 months to 3 weeks. The cATO live evidence
      engine streams OSCAL assessment-results per control, maintaining evidence
      freshness below 30 days. Run: `python tools/compliance/cato_live_engine.py
      --project-id sparkpilot --stream --json`
    reasoning: "Specific tool reference, concrete metric (6mo→3wk), CLI command, named frameworks, real-world scenario."

  - id: cal-blog-02
    score: 5
    text: |
      The compound error problem is not theoretical. If an AI model produces
      correct output 90% of the time, the probability of a correct outcome
      across a five-step workflow drops to roughly 59%. Across ten steps, it
      falls below 35%. ICDEV™'s FORGE framework breaks this chain by separating
      probabilistic AI orchestration from deterministic Python tool execution.
    reasoning: "Original insight (compound error math), concrete numbers, connects theory to architecture solution."

