# CUI // SP-CTI
# AI-ify Semgrep rules — each rule maps to one of the 8 AI-augmentable code patterns.
# metadata.aiify_pattern must match an entry in PATTERN_TYPES (constants.py).
# metadata.ai_paradigm must match an entry in AI_PARADIGMS (constants.py).

rules:
  # ── Pattern 1: nested_conditionals ──────────────────────────────────────────
  - id: aac-nested-conditionals-py
    patterns:
      - pattern: |
          if ...:
            if ...:
              if ...:
                ...
    message: "Nested conditionals (depth ≥ 3) — replace with ML classifier"
    languages: [python]
    severity: INFO
    metadata:
      aiify_pattern: nested_conditionals
      ai_paradigm: ml_classifier

  - id: aac-nested-conditionals-java
    patterns:
      - pattern: |
          if (...) {
            if (...) {
              if (...) {
                ...
              }
            }
          }
    message: "Nested conditionals (depth ≥ 3) — replace with ML classifier"
    languages: [java]
    severity: INFO
    metadata:
      aiify_pattern: nested_conditionals
      ai_paradigm: ml_classifier

  - id: aac-nested-conditionals-go
    patterns:
      - pattern: |
          if ... {
            if ... {
              if ... {
                ...
              }
            }
          }
    message: "Nested conditionals (depth ≥ 3) — replace with ML classifier"
    languages: [go]
    severity: INFO
    metadata:
      aiify_pattern: nested_conditionals
      ai_paradigm: ml_classifier

  # ── Pattern 2: regex_user_input ──────────────────────────────────────────────
  - id: aac-regex-user-input-py
    patterns:
      - pattern: re.$FUNC($PATTERN, $INPUT)
    message: "Regex-based user input parsing — replace with NLP/NLU extractor"
    languages: [python]
    severity: INFO
    metadata:
      aiify_pattern: regex_user_input
      ai_paradigm: nlp_extractor

  - id: aac-regex-user-input-java
    patterns:
      - pattern: Pattern.compile($X).matcher($Y)
    message: "Regex-based user input parsing — replace with NLP/NLU extractor"
    languages: [java]
    severity: INFO
    metadata:
      aiify_pattern: regex_user_input
      ai_paradigm: nlp_extractor

  # ── Pattern 3: string_template_rendering ─────────────────────────────────────
  - id: aac-string-template-rendering-py
    pattern-either:
      - pattern: render_template($TEMPLATE, ...)
      - pattern: $ENV.get_template($X).render(...)
      - pattern: Template($X).render(...)
    message: "Static template rendering — replace with LLM generation"
    languages: [python]
    severity: INFO
    metadata:
      aiify_pattern: string_template_rendering
      ai_paradigm: llm_generation

  - id: aac-string-template-rendering-java
    pattern-either:
      - pattern: $TEMPLATE.process($WRITER, $MODEL)
      - pattern: $ENGINE.getTemplate($X).process(...)
    message: "Static template rendering — replace with LLM generation"
    languages: [java]
    severity: INFO
    metadata:
      aiify_pattern: string_template_rendering
      ai_paradigm: llm_generation

  # ── Pattern 4: scheduled_cron ────────────────────────────────────────────────
  - id: aac-scheduled-cron-py-apscheduler
    patterns:
      - pattern: $SCHEDULER.add_job(...)
    message: "APScheduler job — replace with agentic trigger"
    languages: [python]
    severity: INFO
    metadata:
      aiify_pattern: scheduled_cron
      ai_paradigm: agentic_trigger

  - id: aac-scheduled-cron-py-celery
    patterns:
      - pattern: |
          @$APP.task(...)
          def $FUNC(...):
              ...
    message: "Celery periodic task — replace with agentic trigger"
    languages: [python]
    severity: INFO
    metadata:
      aiify_pattern: scheduled_cron
      ai_paradigm: agentic_trigger

  - id: aac-scheduled-cron-java
    patterns:
      - pattern: |
          @Scheduled(...)
          public $RET $FUNC(...) { ... }
    message: "Spring @Scheduled — replace with agentic trigger"
    languages: [java]
    severity: INFO
    metadata:
      aiify_pattern: scheduled_cron
      ai_paradigm: agentic_trigger

  # ── Pattern 5: hardcoded_threshold ───────────────────────────────────────────
  - id: aac-hardcoded-threshold-py
    pattern-either:
      - pattern: $X > $LITERAL
      - pattern: $X < $LITERAL
      - pattern: $X >= $LITERAL
      - pattern: $X <= $LITERAL
    pattern-where-python: "isinstance($LITERAL, (int, float)) and $LITERAL not in (0, 1)"
    message: "Hardcoded numeric threshold — replace with ML anomaly detection"
    languages: [python]
    severity: INFO
    metadata:
      aiify_pattern: hardcoded_threshold
      ai_paradigm: anomaly_detection

  # ── Pattern 6: db_render_notify_chain ────────────────────────────────────────
  - id: aac-db-render-notify-chain-py
    patterns:
      - pattern: |
          def $FUNC(...):
            ...
            $RESULT = $DB.$QUERY(...)
            ...
            $MSG = render_template(...)
            ...
            $NOTIFIER.send(...)
            ...
    message: "DB→render→notify pipeline — replace with LLM synthesis"
    languages: [python]
    severity: INFO
    metadata:
      aiify_pattern: db_render_notify_chain
      ai_paradigm: llm_generation

  # ── Pattern 7: keyword_list_search ───────────────────────────────────────────
  - id: aac-keyword-list-search-py
    patterns:
      - pattern: $X in [$A, $B, $C, ...]
    message: "Keyword list membership check — replace with vector semantic search"
    languages: [python]
    severity: INFO
    metadata:
      aiify_pattern: keyword_list_search
      ai_paradigm: embedding_retrieval

  - id: aac-keyword-list-search-java
    patterns:
      - pattern: $LIST.contains($X)
    message: "List contains check — replace with vector semantic search"
    languages: [java]
    severity: INFO
    metadata:
      aiify_pattern: keyword_list_search
      ai_paradigm: embedding_retrieval

  # ── Pattern 8: large_rule_table ──────────────────────────────────────────────
  - id: aac-large-rule-table-py
    patterns:
      - pattern: |
          {$K1: $V1, $K2: $V2, $K3: $V3, $K4: $V4, $K5: $V5,
           $K6: $V6, $K7: $V7, $K8: $V8, $K9: $V9, $K10: $V10, ...}
    message: "Large rule/dispatch table — replace with ML/RL decision agent"
    languages: [python]
    severity: INFO
    metadata:
      aiify_pattern: large_rule_table
      ai_paradigm: decision_agent

  - id: aac-large-rule-table-java
    patterns:
      - pattern: |
          Map<$K, $V> $MAP = new HashMap<>();
          $MAP.put(...);
          $MAP.put(...);
          $MAP.put(...);
          $MAP.put(...);
          $MAP.put(...);
          $MAP.put(...);
          $MAP.put(...);
          $MAP.put(...);
          $MAP.put(...);
          $MAP.put(...);
    message: "Large rule table (HashMap) — replace with ML/RL decision agent"
    languages: [java]
    severity: INFO
    metadata:
      aiify_pattern: large_rule_table
      ai_paradigm: decision_agent

  # ── Spring Boot / JVM supplemental rules ─────────────────────────────────────

  # Spring @Pattern annotation — regex constraint on a field
  - id: aac-spring-pattern-annotation-java
    pattern-either:
      - pattern: |
          @Pattern(regexp = $X)
          private $TYPE $FIELD;
      - pattern: |
          @Pattern(regexp = $X, message = $MSG)
          private $TYPE $FIELD;
    message: "Spring @Pattern regexp constraint — replace with NLP-based phone/address normalizer"
    languages: [java]
    severity: INFO
    metadata:
      aiify_pattern: regex_user_input
      ai_paradigm: nlp_extractor

  # Spring Data derived query: findBy…StartingWith / Containing / Like
  - id: aac-spring-data-keyword-query-java
    pattern-either:
      - pattern: $REPO.findBy$X($QUERY, ...)
    message: "Spring Data keyword query — replace with embedding-based semantic search"
    languages: [java]
    severity: INFO
    metadata:
      aiify_pattern: keyword_list_search
      ai_paradigm: embedding_search

  # PageRequest with a numeric literal page size
  - id: aac-pagerequest-literal-java
    patterns:
      - pattern: PageRequest.of($PAGE, $N)
      - metavariable-regex:
          metavariable: $N
          regex: '^\d+$'
    message: "Hardcoded page size in PageRequest.of — replace with adaptive pagination"
    languages: [java]
    severity: INFO
    metadata:
      aiify_pattern: hardcoded_threshold
      ai_paradigm: anomaly_detection

  # Spring @Scheduled — move to agentic workflow trigger
  - id: aac-spring-scheduled-java
    pattern: |
      @Scheduled(...)
      $MODS $RETURN $METHOD(...) {
        ...
      }
    message: "@Scheduled annotation — replace with agentic workflow trigger"
    languages: [java]
    severity: INFO
    metadata:
      aiify_pattern: scheduled_cron
      ai_paradigm: agentic_trigger

  # @ModelAttribute returning a static collection from a repository
  - id: aac-modelattribute-static-collection-java
    pattern: |
      @ModelAttribute($X)
      public $COLLECTION $METHOD() {
        return $REPO.$FIND(...);
      }
    message: "@ModelAttribute static collection — replace with ML-assisted suggestion/autocomplete"
    languages: [java]
    severity: INFO
    metadata:
      aiify_pattern: large_rule_table
      ai_paradigm: decision_agent

  # Spring MVC controller returning a Thymeleaf/JSP view name
  - id: aac-spring-mvc-view-return-java
    patterns:
      - pattern: return "$VIEW";
      - pattern-not: return "redirect:$X";
      - pattern-not: return "forward:$X";
    message: "Static MVC view-name return — consider LLM-augmented content generation"
    languages: [java]
    severity: INFO
    metadata:
      aiify_pattern: string_template_rendering
      ai_paradigm: llm_generation

  # Nested if depth ≥ 2 (Spring validation chains)
  - id: aac-nested-conditionals-java-depth2
    patterns:
      - pattern: |
          if (...) {
            if (...) {
              ...
            }
          }
    message: "Nested conditionals (depth ≥ 2) in Java — replace with ML classifier"
    languages: [java]
    severity: INFO
    metadata:
      aiify_pattern: nested_conditionals
      ai_paradigm: ml_classifier

  # ══════════════════════════════════════════════════════════════════════════════
  # Framework-level architectural patterns (added 2026-05-31)
  # These detect domain-specific AI augmentation opportunities missed by
  # literal code-pattern rules above.
  # ══════════════════════════════════════════════════════════════════════════════

  # ── Django / Python document-management patterns ─────────────────────────────

  # Django signal-based document consumer (post_save on Document model)
  - id: aac-django-document-consumer-py
    patterns:
      - pattern-either:
          - pattern: |
              @receiver($SIGNAL, sender=$MODEL)
              def $FUNC(...):
                ...
                $DOC.$FIELD.save(...)
                ...
          - pattern: |
              def $FUNC(...):
                ...
                $MODEL.objects.create(...)
                ...
                $CONSUMER.consume_document(...)
                ...
    message: "Django document ingestion consumer — replace with agentic document router"
    languages: [python]
    severity: INFO
    metadata:
      aiify_pattern: document_ingestion_pipeline
      ai_paradigm: agentic_trigger

  # OCR library usage (tesseract, pytesseract, OCRmyPDF, pdf2image)
  - id: aac-ocr-pipeline-py
    pattern-either:
      - pattern: pytesseract.$METHOD(...)
      - pattern: $TESS.image_to_string(...)
      - pattern: ocrmypdf.$METHOD(...)
      - pattern: pdf2image.convert_from_path(...)
      - pattern: cv2.imread(...)
    message: "OCR / image-to-text pipeline — replace with layout-aware vision transformer"
    languages: [python]
    severity: INFO
    metadata:
      aiify_pattern: ocr_extraction_pipeline
      ai_paradigm: nlp_extractor

  # Django full-text search (PostgreSQL SearchVector, SearchQuery, SearchRank)
  - id: aac-django-fulltext-search-py
    pattern-either:
      - pattern: SearchVector(...)
      - pattern: SearchQuery(...)
      - pattern: SearchRank(...)
      - pattern: $QS.annotate(search=SearchVector(...))
      - pattern: $QS.filter($Q__search=...)
    message: "Django full-text search — replace with vector semantic search + embeddings"
    languages: [python]
    severity: INFO
    metadata:
      aiify_pattern: fulltext_search_engine
      ai_paradigm: embedding_search

  # Django file upload / ingestion view
  - id: aac-django-upload-view-py
    patterns:
      - pattern: |
          def $FUNC(...):
            ...
            $FILE = request.FILES[$NAME]
            ...
            $DOC.save()
            ...
    message: "Django file upload handler — hook into agentic document processing pipeline"
    languages: [python]
    severity: INFO
    metadata:
      aiify_pattern: document_ingestion_pipeline
      ai_paradigm: agentic_trigger

  # Manual tagging / classification in Django ORM
  - id: aac-django-manual-tags-py
    pattern-either:
      - pattern: $DOC.tags.add(...)
      - pattern: $DOC.tags.set(...)
      - pattern: Tag.objects.get_or_create(...)
      - pattern: $MODEL.objects.update(tags=...)
    message: "Manual document tagging via ORM — replace with ML auto-classifier"
    languages: [python]
    severity: INFO
    metadata:
      aiify_pattern: manual_classification_ui
      ai_paradigm: ml_classifier

  # Metadata extraction (manual or regex-based)
  - id: aac-metadata-extraction-py
    pattern-either:
      - pattern: |
          def $FUNC(...):
            ...
            $META = $DOC.metadata
            ...
            $DOC.$FIELD = $META[$KEY]
            ...
      - pattern: re.$METHOD($PATTERN, $CONTENT)
      - pattern: |
          def parse_metadata(...):
            ...
            return {...}
    message: "Manual / regex metadata extraction — replace with NLP entity extractor"
    languages: [python]
    severity: INFO
    metadata:
      aiify_pattern: metadata_extraction
      ai_paradigm: nlp_extractor

  # Static document routing rules (matchers, dispatchers, pipelines)
  - id: aac-document-routing-py
    pattern-either:
      - pattern: |
          if $DOC.content_type == $TYPE:
            ...
          elif $DOC.content_type == $TYPE2:
            ...
      - pattern: |
          $ROUTES = {
            $K1: $V1,
            $K2: $V2,
            $K3: $V3,
            ...
          }
    message: "Static document routing — replace with ML decision agent"
    languages: [python]
    severity: INFO
    metadata:
      aiify_pattern: document_routing
      ai_paradigm: decision_agent

  # Celery / Huey background document processing task
  - id: aac-celery-document-task-py
    patterns:
      - pattern: |
          @$APP.task(...)
          def $FUNC(...):
            ...
            $DOC.process(...)
            ...
    message: "Celery background document task — consider agentic trigger orchestration"
    languages: [python]
    severity: INFO
    metadata:
      aiify_pattern: scheduled_cron
      ai_paradigm: agentic_trigger

  # ── Flask / FastAPI patterns ──────────────────────────────────────────────────

  # Flask/FastAPI file upload endpoint
  - id: aac-flask-upload-endpoint-py
    patterns:
      - pattern: |
          @$APP.route(..., methods=["POST"])
          def $FUNC(...):
            ...
            $FILE = request.files[$NAME]
            ...
            $DOC.save(...)
            ...
    message: "Flask file upload endpoint — hook into agentic ingestion pipeline"
    languages: [python]
    severity: INFO
    metadata:
      aiify_pattern: document_ingestion_pipeline
      ai_paradigm: agentic_trigger

  # FastAPI upload endpoint
  - id: aac-fastapi-upload-endpoint-py
    patterns:
      - pattern: |
          @$DECORATOR
          async def $FUNC($FILE: UploadFile):
            ...
            $CONTENTS = await $FILE.read(...)
            ...
            $DOC.save(...)
            ...
    message: "FastAPI file upload handler — hook into agentic ingestion pipeline"
    languages: [python]
    severity: INFO
    metadata:
      aiify_pattern: document_ingestion_pipeline
      ai_paradigm: agentic_trigger

  # ── Spring Boot / Java patterns ─────────────────────────────────────────────

  # Spring file upload controller
  - id: aac-spring-upload-controller-java
    patterns:
      - pattern: |
          @$MAPPING(...)
          public $RET $FUNC(@RequestParam("file") MultipartFile $FILE) {
            ...
            $FILE.transferTo(...);
            ...
          }
    message: "Spring Boot file upload — hook into agentic document ingestion"
    languages: [java]
    severity: INFO
    metadata:
      aiify_pattern: document_ingestion_pipeline
      ai_paradigm: agentic_trigger

  # Spring Data JPA full-text search (Elasticsearch, Solr)
  - id: aac-spring-fulltext-search-java
    pattern-either:
      - pattern: $REPO.search(...)
      - pattern: elasticsearchRestTemplate.search(...)
      - pattern: $SOLR.query(...)
    message: "Spring full-text search — replace with vector semantic search + embeddings"
    languages: [java]
    severity: INFO
    metadata:
      aiify_pattern: fulltext_search_engine
      ai_paradigm: embedding_search

  # ── JavaScript / TypeScript (Node.js) patterns ───────────────────────────────

  # Express/Multer file upload
  - id: aac-express-upload-js
    patterns:
      - pattern: |
          $APP.post(..., $UPLOAD.single($NAME), function($REQ, $RES) {
            ...
            $FILE = $REQ.file
            ...
          })
    message: "Express file upload — hook into agentic ingestion pipeline"
    languages: [javascript, typescript]
    severity: INFO
    metadata:
      aiify_pattern: document_ingestion_pipeline
      ai_paradigm: agentic_trigger

  # OCR library in Node.js (tesseract.js)
  - id: aac-ocr-node-js
    pattern-either:
      - pattern: Tesseract.recognize(...)
      - pattern: tesseract.recognize(...)
    message: "Node.js OCR pipeline — replace with layout-aware vision transformer"
    languages: [javascript, typescript]
    severity: INFO
    metadata:
      aiify_pattern: ocr_extraction_pipeline
      ai_paradigm: nlp_extractor

  # ── General cross-language patterns ──────────────────────────────────────────

  # Content-type dispatch table
  - id: aac-content-type-dispatch
    patterns:
      - pattern: |
          $DISPATCH = {
            "application/pdf": $HANDLER1,
            "image/jpeg": $HANDLER2,
            "image/png": $HANDLER3,
            ...
          }
    message: "Static MIME-type dispatch table — replace with ML document classifier"
    languages: [python, java, go, javascript, typescript]
    severity: INFO
    metadata:
      aiify_pattern: document_routing
      ai_paradigm: decision_agent
