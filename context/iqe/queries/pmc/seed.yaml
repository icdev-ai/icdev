# CUI // SP-CTI
# IQE seed queries for Peering Management Canvas (PMC)
queries:
  - q: "Show all active peering sessions"
    collection: pmc.peers
    description: List peers with status=active
  - q: "Which peers have RPKI invalid prefixes?"
    collection: pmc.prefixes
    description: Find prefixes with rpki_status=invalid
  - q: "List all Internet Exchange memberships"
    collection: pmc.ix_memberships
    description: All IX entries ordered by ix_name
  - q: "Show pending peering requests"
    collection: pmc.peering_requests
    description: Peering requests with status=pending
  - q: "What route policies apply to import traffic?"
    collection: pmc.route_policies
    description: Policies with policy_type=import
