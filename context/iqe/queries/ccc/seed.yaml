# CUI // SP-CTI
# IQE seed queries for Circuit & Capacity Canvas (CCC)
queries:
  - q: "Show all active circuits"
    collection: ccc.circuits
    description: List circuits with status=active
  - q: "Which circuits are over 80% utilization?"
    collection: ccc.capacity_plans
    description: Capacity plans where current_utilization_pct > 80
  - q: "List all cross-connects at a facility"
    collection: ccc.cross_connects
    description: Cross-connects ordered by facility
  - q: "Show pending LOA requests"
    collection: ccc.loa
    description: LOA requests with status=pending
  - q: "What DWDM spans are operational?"
    collection: ccc.dwdm_spans
    description: DWDM spans with status=operational
