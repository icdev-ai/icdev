# CUI // SP-CTI
# IQE seed queries for DDoS Security Ops Canvas (DSOC)
queries:
  - q: "Show all active DDoS mitigations"
    collection: dsoc.mitigations
    description: Mitigations with status=active
  - q: "List FlowSpec rules with rate limiting"
    collection: dsoc.flowspec_rules
    description: FlowSpec rules where action=rate-limit
  - q: "Which scrubbing centers are at high load?"
    collection: dsoc.scrubbing_centers
    description: Scrubbing centers with load > 80% capacity
  - q: "Show current RTBH blackhole entries"
    collection: dsoc.rtbh_entries
    description: Active RTBH entries ordered by created_at
  - q: "What threats have been detected in the last 24 hours?"
    collection: dsoc.threats
    description: Active threats with high confidence
