# INTaaS Bias Forensics Rubric — Prometheus-2 evaluation anchors
# Scores article-level bias across 5 dimensions (1-5 scale)

name: "Bias Forensics"
content_type: bias_forensics
description: "Evaluates a news article for bias indicators: loaded language, framing balance, statistical honesty, source transparency, and omission severity."

dimensions:
  loaded_language:
    weight: 0.20
    description: "Does the article use emotionally charged, manipulative, or sensationalized language?"
    anchors:
      1: "Pervasive loaded language. Multiple emotionally manipulative terms per paragraph. Reads like propaganda or opinion disguised as news."
      2: "Frequent loaded words. Adjectives and framing clearly favor one side. Reader is being pushed toward a conclusion."
      3: "Occasional loaded terms but mostly neutral tone. Some word choices reveal author preference without being overtly manipulative."
      4: "Largely neutral language. Rare loaded words, and when present they are in direct quotes rather than editorial voice."
      5: "Entirely neutral, precise language. No emotionally charged words. Facts presented without editorial coloring."

  framing_balance:
    weight: 0.20
    description: "Does the article present multiple perspectives fairly, or does it frame the story from a single viewpoint?"
    anchors:
      1: "Completely one-sided. Only one perspective presented. No mention of opposing views, alternative interpretations, or dissenting voices."
      2: "Dominated by one perspective. Opposing view mentioned briefly or dismissively (strawman). Reader gets a skewed picture."
      3: "Primary perspective with some balance. Opposing view included but given less space or weaker framing."
      4: "Good balance. Multiple perspectives presented with comparable depth. Reader can evaluate both sides."
      5: "Exceptional balance. Multiple diverse perspectives (not just binary). Each viewpoint presented fairly with supporting evidence."

  statistical_honesty:
    weight: 0.20
    description: "Are statistics, data, and numerical claims presented with proper context, base rates, and comparisons?"
    anchors:
      1: "Statistics used misleadingly. Numbers without context, cherry-picked data, percentage changes without base rates, or fabricated precision."
      2: "Statistics present but poorly contextualized. Missing comparison periods, no base rates, or misleading visual framing."
      3: "Statistics generally fair. Some context provided but could be more thorough. No obviously misleading use of data."
      4: "Well-contextualized statistics. Base rates provided, comparison periods noted, source of data cited."
      5: "Exemplary statistical presentation. Full context, multiple data sources, uncertainty acknowledged, methodology referenced."

  source_transparency:
    weight: 0.20
    description: "Are sources clearly identified, diverse, and credible? Or are claims attributed to anonymous or vague sources?"
    anchors:
      1: "No identifiable sources. Claims made without attribution. 'Sources say' or 'it is believed' with no specifics."
      2: "Mostly anonymous sources. One or two named sources but key claims unattributed. Source diversity lacking."
      3: "Mix of named and unnamed sources. Primary claims attributed but some supporting claims vague."
      4: "Well-sourced. Multiple named sources from different perspectives. Claims clearly attributed."
      5: "Exceptionally transparent. Named experts, official documents cited, diverse viewpoints each with clear attribution and credentials."

  omission_severity:
    weight: 0.20
    description: "Are important counterpoints, context, or facts being omitted? Does the article assume conclusions rather than proving them?"
    anchors:
      1: "Critical omissions. Key counterarguments or widely known facts deliberately excluded. Uses absolutist language ('everyone knows', 'obviously') to bypass scrutiny."
      2: "Significant gaps. Important context missing. Assumes reader agreement rather than establishing evidence. Some counterpoints ignored."
      3: "Minor omissions. Most relevant context included but some angles unexplored. No deliberate suppression apparent."
      4: "Thorough coverage. Acknowledges limitations and complexity. Few gaps, and those present are minor."
      5: "Comprehensive. All major perspectives and counterpoints addressed. Complexity acknowledged. No apparent omissions."

few_shot_examples:
  - score: 2
    excerpt: "The radical extremist group has launched yet another dangerous attack on our way of life, leaving experts shocked at the regime's blatant disregard for human decency."
    reasoning: "Heavy loaded language (radical, extremist, dangerous, shocked, blatant). Single-perspective framing. No named sources. No opposing viewpoint."

  - score: 4
    excerpt: "The policy, which supporters call 'long overdue reform,' has drawn criticism from industry groups who argue it could raise consumer costs by 8-12%, according to a CBO analysis. However, proponents point to the Congressional Budget Office's finding that long-term savings could offset initial costs within 5 years."
    reasoning: "Balanced framing (supporters and critics). Named source (CBO). Statistics with context (8-12% with timeframe). Both sides given fair treatment."
