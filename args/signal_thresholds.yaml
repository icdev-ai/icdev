_schema_version: 1
# FathomDesk signal threshold configuration.
# Governs signal_generator filtering and signal_tuner dry-run previews.
thresholds:
  min_confidence: 0.60   # drop signals below this confidence
  min_score: 0.50        # drop signals below this composite score
  max_signals: 20        # cap on emitted signals per run
  long_bias: 0.55        # minimum long-directional ratio for regime filter
  short_bias: 0.45       # minimum short-directional ratio for regime filter
