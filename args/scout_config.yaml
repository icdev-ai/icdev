# [TEMPLATE: CUI // SP-CTI]
# Scout Daemon — Daily Autonomous ICDEV™ Self-Improvement Scanner
# Single unified daemon, runs daily 8am-11pm via Windows Task Scheduler
# Zero Claude cost — Ollama scanner-tier only

classification: "CUI // SP-CTI"

# Master switch
enabled: true
env_override: ICDEV_SCOUT_ENABLED

# Operating window (local time)
schedule:
  window_start_hour: 8       # 8 AM local
  window_end_hour: 23        # 11 PM local
  retry_interval_minutes: 30 # If deferred, retry every 30 min until window closes
  max_retries: 30            # Max retries per day (30 * 30min = 15 hours coverage)

# Pre-flight resource thresholds
preflight:
  cpu_max_percent: 70         # Defer if CPU > 70%
  vram_max_gb: 7.5            # Defer if VRAM usage > 7.5GB (RTX 4060 Ti has 8GB)
  check_ollama: true          # Skip LLM synthesis if Ollama not running
  ollama_url: "http://localhost:11434"
  detect_claude_code: true    # Postpone if Claude Code session active
  claude_code_detection:
    process_names: ["claude", "claude-code"]

# LLM configuration (scanner-tier, zero Claude cost)
llm:
  tier: scanner
  function_name: memory_consolidation  # Maps to scanner tier in llm_config.yaml
  max_tokens: 4096
  summarize_max_tokens: 2048

# ---------------------------------------------------------------------------
# Pillar 1: Self-Introspection
# ---------------------------------------------------------------------------
introspect:
  enabled: true
  analyses:
    - failed_self_heals
    - gate_failures
    - unused_tools
    - slow_pipelines
    - nlq_gaps
    - knowledge_gaps
    - cli_harmonization
    - code_quality
  check_test_coverage: true
  check_dead_code: true
  check_config_drift: true

# ---------------------------------------------------------------------------
# Pillar 2: Trending Open Source
# ---------------------------------------------------------------------------
trending:
  enabled: true
  sources:
    github_trending:
      enabled: true
      languages: [python, go, rust, typescript]
      since: daily
      max_results: 30
      relevance_topics:
        - agentic AI
        - autonomous agents
        - LLM frameworks
        - MCP servers
        - compliance automation
        - DevSecOps
        - local LLM
        - code generation
        - self-healing systems
        - multi-agent
    hackernews:
      enabled: true
      min_score: 100
      max_results: 20
      relevance_keywords:
        - AI agent
        - autonomous
        - LLM
        - local model
        - compliance
        - devsecops
        - code generation
        - multi-agent
        - MCP
        - tool use
    reddit:
      enabled: true
      subreddits:
        - LocalLLaMA
        - MachineLearning
        - artificial
        - LangChain
        - devops
        - selfhosted
      sort: hot
      max_results: 20
      min_upvotes: 50
    arxiv:
      enabled: true
      categories:
        - cs.AI
        - cs.SE
        - cs.MA
        - cs.CL
      max_results: 15
      days_lookback: 14
      relevance_keywords:
        - autonomous agent
        - code generation
        - self-improving
        - tool use
        - multi-agent
        - compliance
        - DevSecOps

# ---------------------------------------------------------------------------
# Pillar 3: Competitive Intel
# ---------------------------------------------------------------------------
competitive:
  enabled: true
  auto_add_threshold:
    min_stars: 500
    relevance_score: 0.7
  max_auto_add_per_day: 5

# ---------------------------------------------------------------------------
# Genesis Build Trigger
# ---------------------------------------------------------------------------
genesis_trigger:
  enabled: true
  max_builds_per_day: 1           # Experimental — single highest-value build
  fallback_depth: 3               # Try top 3 findings before giving up
  risk_tiers:
    green: auto                   # Auto-approve GREEN risk builds
    yellow: sandbox               # YELLOW: build in worktree, require review
    orange: skip                  # ORANGE: skip, log recommendation only
  worktree:
    base_dir: ".worktrees"        # Relative to BASE_DIR
    branch_prefix: "feature/scout-auto"
  validation:
    py_compile: true
    ruff: true
    pytest: true
    bandit: true
    auto_rollback_on_failure: true
  build_timeout_minutes: 60       # Max time for Genesis build + validation
  use_child_app_generator: true   # For new child apps, use child_app_generator.py
  use_forge_validator: true      # Validate via forge_validator.py --gate

# ---------------------------------------------------------------------------
# Digest output
# ---------------------------------------------------------------------------
digest:
  output_dir: "data/scout"
  format: markdown
  max_findings_per_pillar: 20
  include_llm_synthesis: true
  include_actionable_items: true
  include_recommended_actions: true
  include_genesis_results: true

# ---------------------------------------------------------------------------
# Innovation engine integration
# ---------------------------------------------------------------------------
integration:
  feed_to_innovation_signals: true
  update_innovation_config: true
  update_creative_config: true    # Also add trending repos to creative_config.yaml
  min_signal_score: 0.6

# ---------------------------------------------------------------------------
# Heartbeat integration (dashboard visibility)
# ---------------------------------------------------------------------------
heartbeat:
  enabled: true
  check_name: scout_daily_scan

# Audit
audit:
  enabled: true

# ---------------------------------------------------------------------------
# Genesis Reflex (tools/genesis/reflexes/scout.py) — configurable thresholds
# ---------------------------------------------------------------------------
genesis_reflex:
  # GitHub API timeout in seconds
  api_timeout_seconds: 15
  # Text truncation limits for external data
  description_max_chars: 300
  release_body_max_chars: 500
  notes_preview_max_chars: 200
  # How many top-by-stars repos to include in the brief summary
  top_repos_n: 5
  # Anomaly detection — flag repos whose metrics are statistical outliers
  anomaly_detection:
    enabled: true
    # Z-score magnitude required to flag a repo as anomalous (|z| >= threshold)
    z_score_threshold: 2.0
    # Minimum number of repos needed before anomaly detection runs
    min_samples: 3
    # Repo metrics to analyse
    metrics:
      - stars
      - forks
      - open_issues
  # Promote benchmark findings to the kanban board after each scout pass.
  # Disabled by default — the brief is the reflex's contract, and writing to
  # the board is an escalation an operator opts into by flipping this.
  # Cards land as status='suggested'; nothing reaches backlog without a human.
  # The gap-verdict gate and the rate limits (max_per_run, max_per_subsystem)
  # live in args/innovation_promoter.yaml, not here.
  promotion:
    enabled: false
    dry_run: false
