# CUI // SP-CTI
# STRATEGOS I&W Engine — PMESII-PT configuration
# ────────────────────────────────────────────────
# Governs the weighted composite WRI (Weighted Risk Index) computation in
# tools/strategos/iw_engine.py.
#
# pmesii_pt.weights: Per-dimension multipliers for the 8 PMESII-PT axes.
#   Values must be floats in (0, 1]; weights are normalised internally so
#   the final WRI is always in [0, 100] regardless of sum.
#
# pmesii_pt.escalation_ladder: WRI threshold bands mapping to Escalation
#   Ladder rungs 1–5. Boundaries are inclusive at the low end, exclusive at
#   the high end (rung N ← WRI in [min, max)).

pmesii_pt:
  weights:
    political:            0.15   # Regime stability, gov legitimacy, alliance posture
    military:             0.20   # Force posture, readiness, mobilisation tempo
    economic:             0.15   # Sanctions pressure, supply-chain stress, currency
    social:               0.10   # Civil unrest, displacement, civilian morale
    information:          0.15   # Info-ops tempo, PSYOP saturation, cyber effects
    infrastructure:       0.15   # Power / water / transport / comms degradation
    physical_environment: 0.07   # Terrain, weather, seasonality constraints
    time:                 0.03   # Operational tempo, warning-time horizon

  escalation_ladder:
    rung1: { min: 0,  max: 20,  label: "Routine Monitoring",   color: "#10b981" }
    rung2: { min: 20, max: 40,  label: "Elevated Watch",       color: "#22d3ee" }
    rung3: { min: 40, max: 60,  label: "Heightened Readiness", color: "#f59e0b" }
    rung4: { min: 60, max: 80,  label: "Crisis Response",      color: "#f97316" }
    rung5: { min: 80, max: 101, label: "Imminent Action",      color: "#ef4444" }

  # A dimension scoring above this threshold is flagged as a dominant indicator
  dominant_threshold: 0.70
