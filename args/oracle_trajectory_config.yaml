# Oracle Trajectory Lens — configurable thresholds
# Loaded at startup by tools/oracle/lens_trajectory.py.
# Edit here to tune anomaly detection without touching Python code.
#
# trajectory_forecast.fallbacks: used when the fleet has too few data points
#   to derive adaptive values (< adaptive_min_files files with valid metrics).
# trajectory_forecast.anomaly: percentile cutoffs for fleet-relative detection.
# trajectory_forecast.velocity: fallback cutoffs when the dir fleet is too small.
# trajectory_forecast.hotspot: directory converging-complexity detection params.
# trajectory_forecast.urgency: day-range buckets for severity labelling.

trajectory_forecast:
  fallbacks:
    cc_threshold: 15            # cyclomatic complexity ceiling (fallback)
    maintainability_floor: 0.5  # maintainability score floor (fallback)
    min_snapshots: 3            # minimum weekly data points required for regression
    forecast_horizon_days: 365  # only emit predictions within this window

  anomaly:
    adaptive_min_files: 10            # fleet size to enable adaptive threshold derivation
    cc_percentile: 90.0               # flag files heading above this fleet CC percentile
    maintainability_percentile: 10.0  # flag files heading below this fleet maint. percentile
    velocity_percentile: 75.0         # flag dirs in top commit-slope quartile

  velocity:
    fallback_slope_cutoff: 1.0        # commits/week slope to flag (when fleet too small)
    fallback_recent_avg_cutoff: 5.0   # recent 3-week avg commits/week (when fleet too small)

  hotspot:
    min_files: 2                      # files trending up in same dir to declare a hotspot
    critical_fallback: 4              # file-count threshold for critical severity (adaptive fallback)

  urgency:
    days_critical: 30   # < 30 days → critical
    days_warning: 90    # 30–90 days → warning

  llm_calibration:
    function_name: oracle_anomaly_detection  # LLMRouter function name for sparse-fleet calibration
    max_tokens: 200                          # token budget for calibration response
    temperature: 0.0                         # deterministic output — do not raise
    validation:
      cc_threshold_min: 1.0                  # reject LLM suggestions below this CC floor
      maintainability_floor_min: 0.0         # reject maintainability floors below this
      slope_cutoff_min: 0.01                 # reject slope cutoffs below this
      recent_avg_cutoff_min: 0.01            # reject recent-avg cutoffs below this

  confidence:
    cc_breach_max: 0.92        # ceiling for CC threshold breach prediction confidence
    cc_breach_base: 0.55       # base confidence for CC breach (before time-horizon scaling)
    cc_breach_scale: 0.40      # time-horizon scaling factor for CC breach confidence
    maint_decline_max: 0.90    # ceiling for maintainability decline prediction confidence
    maint_decline_base: 0.55   # base confidence for maint. decline (before scaling)
    maint_decline_scale: 0.38  # time-horizon scaling factor for maint. decline confidence
    hotspot_max: 0.88          # ceiling for converging-hotspot prediction confidence
    hotspot_base: 0.55         # base confidence for hotspot (before per-file increment)
    hotspot_per_file: 0.06     # per-trending-file confidence increment for hotspot
    velocity_fixed: 0.70       # fixed confidence assigned to high commit-velocity predictions
