# CUI // SP-CTI
# FathomDesk Phase 7.6 — delta/strike target config for the strike picker.
#
# Maps each strike_slot (from args/options_strategies.yaml leg templates)
# to either a target delta (for delta-based selection when chain has
# greeks) or an ATM offset (for naive fallback when delta is missing).
#
# Hot-reloadable via mtime check.

_schema_version: 1

# Call-side delta targets per slot. Slots on the put side mirror these
# magnitudes with sign flipped (puts have delta ∈ [-1, 0]).
delta_targets:
  atm:        0.50     # at-the-money
  itm_near:   0.65     # one strike in the money
  otm_near:   0.30     # ~1σ OTM — standard short-leg target
  otm_far:    0.15     # ~2σ OTM — standard long-leg in debit spreads

# When the chain lacks delta data (common with yfinance fallback), walk
# the strike ladder by integer steps away from ATM. Positive = further OTM.
atm_offset_steps:
  atm:        0
  itm_near:   -1       # one strike closer to ITM
  otm_near:   1
  otm_far:    2

# Safety rails — reject strikes that are absurdly far from spot.
max_strike_distance_pct: 30       # ±30% of spot is the hard cap
