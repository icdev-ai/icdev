# CUI // SP-CTI
# AlphaDesk challenge sandbox config — Phase 6.3.5.
#
# Each active attempt gets its own isolated "sandbox" paper portfolio.
# Real paper portfolio (/portfolio) is never touched — the user can
# experiment freely without risk to their main paper track record.
#
# Hot-reloaded via file-mtime cache (tools/trading/challenges/sandbox_engine.py).
#
# Per-challenge starting_cash override lives in args/challenges_catalog.yaml
# under `starting_cash_usd:` (optional; falls back to `default_starting_cash_usd`).

_schema_version: 1

# Default seed cash when a sandbox is created. $100k is the standard
# paper-trading convention and matches the live paper portfolio default.
default_starting_cash_usd: 100000

# Market-order fill behavior. Phase 6.3.5 follow-up: slippage +
# commission now apply. Tune conservatively — over-modeling friction
# discourages trading; under-modeling makes paper look easier than live.
#
# slippage_bps: basis points moved AGAINST the trade direction from the
#   live quote. 5 bps = 0.05% — realistic for liquid large-caps; tighten
#   to 2 for mega-liquid mega-caps, widen to 20+ for thin names.
# commission_usd: flat USD deducted from cash_after per fill. Most retail
#   is commission-free in 2026, so 0 is a reasonable default; operators
#   running stricter educational tenants can raise it.
fill_policy:
  order_type: market     # only "market" is implemented; limit/stop deferred
  slippage_bps: 5        # 0.05% vs live quote, always against the trader
  commission_usd: 0      # flat per-fill fee

# Safety rails — prevent user footguns.
limits:
  max_position_pct: 100  # max % of portfolio a single position can be
                          # (100 = no cap; lower this if operators want
                          # to enforce diversification via code)
  allow_short_sell: false # 6.3.5 is long-only
  min_order_usd: 0        # minimum order size (0 = no floor)
