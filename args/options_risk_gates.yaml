# CUI // SP-CTI
# FathomDesk Phase 7.6 — risk gates for the confirm-to-execute path.
#
# Consumed by tools/trading/options/preflight.py. Every proposal
# generated by build_proposal() is run through these gates before the
# AI Assist UI shows the Execute button.
#
# Gates are either WARN (surfaces in the UI, user can still proceed) or
# BLOCK (Execute button is disabled).
#
# Hot-reloadable via mtime check.

_schema_version: 1

# Maximum allowed dollar loss as a % of account equity. Hard-block.
max_loss_pct_of_equity: 2.0

# IV-regime sanity — warn when the posture is misaligned. (20 / 80 are
# conservative defaults — edit per desk preference.)
iv_warn_band:
  low_percentile:  20   # below this, selling premium is hard to justify
  high_percentile: 80   # above this, buying premium is expensive

# Minimum broker options-approval tier for unlimited-loss strategies.
# Values: 'L1' (covered only), 'L2' (single-leg long), 'L3' (spreads +
# shorts), 'L4' (uncovered/naked).
undefined_risk_required_tier: L3

# Broad DTE sanity rail — reject proposals outside these windows.
min_dte_days: 0
max_dte_days: 180

# Dollar floor — if the max_loss rounds to under this, skip the equity
# check (avoids false-blocks on tiny test orders).
max_loss_floor_usd: 25
