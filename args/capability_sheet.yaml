challenges:
  - id: 1
    domain: "Compliance & ATO"
    challenge: "Authority to Operate (ATO) takes 12-18 months of manual paperwork"
    business_impact: "Schedule slips, mission capability is delayed, and program cost balloons while teams chase signatures."
    solution: "Treat compliance as code: ICDEV auto-generates ATO artifacts directly from the build and runs continuous (cATO) monitoring on an append-only audit trail, so authorization evidence is produced as the system is built, not after."
    modules: "icdev-comply (SSP/POAM/STIG/SBOM), classification_manager, audit trail (NIST AU), cATO monitor"
    compliance: "NIST 800-53, FedRAMP, RMF, cATO"
    outcome: "18-month ATO cycle to 6-8 weeks (target); evidence auto-generated"
    so_what: "Mission capability fielded quarters earlier; program office avoids 12+ months of assessment limbo and its associated cost overrun."
    status: approved

  - id: 2
    domain: "Compliance & ATO"
    challenge: "Compliance evidence is scattered across docs, wikis, and people's heads"
    business_impact: "Assessors can't trace controls to implementation; audits stall; findings re-open repeatedly."
    solution: "Every tool run, decision, and artifact is timestamped to an immutable audit trail with auto-collected, lineage-tracked evidence mapped to controls - one source of truth for assessors."
    modules: "Compliance Evidence Auto-Collection + Lineage, audit_trail, provenance engine"
    compliance: "NIST AU-3, FedRAMP, eMASS"
    outcome: "Manual evidence hunts to continuous, traceable evidence"
    so_what: "Assessors walk away with a pre-packaged evidence package; re-authorization becomes a scheduled event, not a fire drill."
    status: approved

  - id: 3
    domain: "Compliance & ATO"
    challenge: "The same control must be re-proven across many overlapping frameworks"
    business_impact: "Teams re-do work for FedRAMP, then CMMC, then CJIS/HIPAA - 3-6 months of duplicate mapping per regime."
    solution: "A dual-hub crosswalk engine maps one implemented control to 42+ frameworks automatically and flags coverage gaps, so you implement once and audit across every regime."
    modules: "Compliance crosswalk engine, multi-framework compliance, FedRAMP 20x KSI, eMASS integration"
    compliance: "NIST 800-53/171, FedRAMP, CMMC, CJIS, HIPAA, ISO 27001, SOC 2"
    outcome: "5+ siloed mappings to 1 implementation, 42 frameworks"
    so_what: "Win a CMMC contract AND a FedRAMP authorization from the same control implementation - no duplicate engineering work."
    status: approved

  - id: 4
    domain: "Requirements"
    challenge: "Requirements arrive ambiguous; defects surface in week 8, not week 1"
    business_impact: "Vague SOW/CDD language flows unchecked into development; rework and ATO-breaking surprises are expensive."
    solution: "Conversational AI intake (RICOAS) detects ambiguity and missing security/compliance requirements, scores readiness across 5 dimensions, and decomposes accepted requirements into SAFe epics/stories before code is written."
    modules: "icdev-intake (RICOAS), gap_detector, readiness scorer, SAFe decomposer"
    compliance: "SAFe, NIST 800-53 (early control capture)"
    outcome: "Defects caught at intake, not in test; readiness scored up front"
    so_what: "Stop paying 10-100x rework costs to fix defects found in test or production - catch them when changing a requirement costs nothing."
    status: approved

  - id: 5
    domain: "Requirements"
    challenge: "Nobody knows when a requirement quietly expands the ATO boundary"
    business_impact: "A single requirement can push the system into a higher impact level - discovered too late, it forces full re-authorization."
    solution: "Boundary impact analysis tags every requirement RED/ORANGE/YELLOW/GREEN against the authorization boundary; the Boundary Design Canvas visualizes zones and ISA lifecycle so scope changes are caught immediately."
    modules: "icdev-boundary, Boundary Design Canvas (BDC), ISA expiry reflex"
    compliance: "RMF authorization boundary, FedRAMP, NIST CA"
    outcome: "Boundary breaches surfaced at requirement time, not at assessment"
    so_what: "Avoid surprise re-authorization triggered by a single scope-creeping requirement - the difference between a 2-week patch and a 6-month re-assessment."
    status: approved

  - id: 6
    domain: "Risk & Simulation"
    challenge: "Program risk is assessed after the fact, with no real what-if capability"
    business_impact: "PMs commit to cost/schedule without modeling tradeoffs; RED requirements force scope renegotiation late."
    solution: "The Digital Program Twin runs Monte Carlo simulation across schedule, cost, risk, compliance, architecture, and staffing, then generates three Courses of Action (Speed / Balanced / Comprehensive) for an evidence-based decision."
    modules: "icdev-simulate (Digital Program Twin), COA generator, TTX GameDay engine"
    compliance: "RMF risk management, DoD acquisition"
    outcome: "Spreadsheet guesswork to 6-dimension simulation + 3 scored COAs"
    so_what: "Brief decision authority with evidence-backed COA analysis instead of gut-feel slide decks - and rehearse the risk posture in a TTX before the program office commits."
    status: approved

  - id: 7
    domain: "Build & Quality"
    challenge: "Security and quality gates run too late - after code is already merged; E2E tests degrade silently"
    business_impact: "Findings discovered post-merge are 10-100x costlier to fix; E2E selector drift causes false failures and undetected coverage gaps."
    solution: "ANVIL 5-phase TDD writes failing tests first, then runs adversarial multi-agent critique plus SAST/secret/container scans as pre-merge gates. The 3-phase QA Agent autonomously sweeps for E2E coverage gaps every 6 hours and self-heals broken selectors (HITL-gated at confidence < 0.7)."
    modules: "icdev-build (ANVIL), icdev-secure, icdev-review, ACE qa_agent role, Playwright runner, Genesis QA reflex (6h), AI selector self-healer"
    compliance: "NIST SA-11, DevSecOps, OWASP, SLSA"
    outcome: "Post-merge firefighting to design-phase gates; test suite self-maintains; 6-hour autonomous gap detection"
    so_what: "Catch bugs before merge AND keep your test suite self-maintaining - engineers spend time on features, not test archaeology."
    status: approved

  - id: 8
