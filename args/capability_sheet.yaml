# ─────────────────────────────────────────────────────────────
# SHEET 2 — Capability Catalog
# Fields: id, capability, what_it_does, modules, compliance, solves, so_what, status
# ─────────────────────────────────────────────────────────────
capabilities:
  - id: 1
    capability: "FORGE Framework"
    what_it_does: "The architectural backbone: separates probabilistic AI reasoning (orchestration) from deterministic execution (Python tools) across six layers - Goals, Orchestration, Tools, Args, Context, Hard Prompts - so multi-step workflows stay reliable instead of compounding LLM error."
    modules: "goals/manifest, 600+ tools, args/*.yaml, hardprompts/"
    compliance: "MOSA, separation of concerns"
    solves: "7, 8"
    so_what: "At 90% per-step accuracy, a 5-step workflow degrades to 59% end-to-end - FORGE confines the error to orchestration so execution is always deterministic."
    status: approved

  - id: 2
    capability: "ANVIL TDD Build"
    what_it_does: "5-phase true test-driven workflow (Architect to Navigate to Verify(RED) to Integrate(GREEN) to Launch) that writes failing tests first, generates implementation, then runs adversarial multi-agent critique and security scans as pre-merge gates."
    modules: "icdev-build, ANVIL critique phase, test_orchestrator, icdev-review"
    compliance: "NIST SA-11, DevSecOps, SLSA"
    solves: "7, 8"
    so_what: "Bugs caught in the RED phase cost nothing to fix; bugs caught post-merge cost 10-100x. ANVIL shifts the catch point left."
    status: approved

  - id: 3
    capability: "Compliance & ATO Automation"
    what_it_does: "Generates ATO artifacts (SSP, POAM, STIG checklist, SBOM) directly from the build with CUI markings, then runs continuous (cATO) monitoring on an append-only audit trail - compliance produced as a by-product of building."
    modules: "icdev-comply, classification_manager, cATO monitor, audit_trail"
    compliance: "NIST 800-53, FedRAMP, RMF, cATO, DISA STIG"
    solves: "1, 2"
    so_what: "Turn ATO documentation from a 12-month sprint into a background process - evidence accumulates automatically as engineers build."
    status: approved

  - id: 4
    capability: "42-Framework Crosswalk"
    what_it_does: "A dual-hub crosswalk engine maps one implemented control to 42+ compliance frameworks automatically, detects coverage gaps, and recommends which framework delta to close next - implement once, audit everywhere."
    modules: "Compliance crosswalk engine, multi-framework compliance, FedRAMP 20x KSI, eMASS"
    compliance: "NIST 800-53/171, FedRAMP, CMMC, CJIS, HIPAA, ISO 27001, SOC 2, PCI"
    solves: "3"
    so_what: "Win a CMMC contract and a FedRAMP authorization from the same control implementation - no duplicate engineering."
    status: approved

  - id: 5
    capability: "Evidence Auto-Collection & Lineage"
    what_it_does: "Continuously harvests compliance evidence from tool runs and tags it with provenance/lineage mapped to controls, giving assessors a single immutable source of truth."
    modules: "Compliance Evidence Auto-Collection, provenance engine, audit_trail (NIST AU-3)"
