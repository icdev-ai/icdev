    compliance: "ISO/IEC 25010, NIST SA-11"
    outcome: "Subjective review to objective, gated quality metrics"
    so_what: "Replace code-review debates with objective gates - merge only when the numbers clear the bar, regardless of who wrote the code."
    status: approved

