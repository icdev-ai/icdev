# ─────────────────────────────────────────────────────────────
# SHEET 3 — Design Canvases
# Fields: id, canvas, route, use_case, challenge, how_it_solves, status
# ─────────────────────────────────────────────────────────────
canvases:
  - id: 1
    canvas: "NDC - Network Design Canvas"
    route: "/network"
    use_case: "Network architects/engineers designing or documenting an enclave topology."
    challenge: "Network diagrams live in Visio, drift out of date, and are never validated against security intent."
    how_it_solves: "Drag-and-drop topology with intent validation, ACAS/Nessus vulnerability overlay, natural-language query, change-request markup, and NetBox sync - a living, validated network model."
    status: approved

  - id: 2
    canvas: "IDC - Infrastructure Design Canvas"
    route: "/infra"
    use_case: "Cloud/infra engineers planning multi-CSP compute, storage, containers, and serverless."
    challenge: "Infrastructure is designed in slides, then hand-translated to IaC, drifting from its compliance baseline."
    how_it_solves: "Visual multi-CSP design with CSP equivalence mapping, NIST/FedRAMP/CMMC assessment, and one-click IaC emit (Terraform/Pulumi/Ansible/Helm) behind a pre-apply compliance gate."
    status: approved

  - id: 3
    canvas: "SDC - Security Design Canvas"
    route: "/security"
    use_case: "Security engineers and ISSOs threat-modeling a system."
    challenge: "Threat models are one-time Word docs; control coverage and attack paths are never tracked."
    how_it_solves: "STRIDE threat modeling with NIST/FedRAMP/CMMC control mapping, MITRE ATT&CK coverage, an attack-path digital twin, and AI-assisted remediation."
    status: approved

  - id: 4
    canvas: "BDC - Boundary Design Canvas"
    route: "/boundary"
    use_case: "ISSOs/ISSMs defining the ATO, FedRAMP, or SCIF authorization boundary."
    challenge: "Authorization boundaries are ambiguous and ISAs silently expire, putting the ATO at risk."
    how_it_solves: "Visual boundary design with ISA lifecycle tracking (60-day/30-day warnings), PPS matrix generation, and automated boundary-gap detection."
    status: approved

  - id: 5
    canvas: "PDC - Pipeline Design Canvas"
    route: "/devops"
    use_case: "DevSecOps engineers designing CI/CD with security gates."
    challenge: "Security gates are bolted onto pipelines late and inconsistently across teams."
    how_it_solves: "Model the CI/CD DAG, place security gates, export GitLab/GitHub Actions, and run a pre-merge what-if twin with SLSA assessment before changes land."
    status: approved

  - id: 6
    canvas: "ODC - Observability Design Canvas"
    route: "/observability"
    use_case: "SOC and SRE teams designing the SIEM/SOAR and logging stack."
    challenge: "Detection-coverage gaps and log-retention non-compliance are found during incidents or audits."
    how_it_solves: "Design the log/SIEM stack, score MITRE ATT&CK detection coverage, assess NIST AU/SI controls, set retention policy, and project SLO burn-rate."
    status: approved

  - id: 7
    canvas: "DDC - Data Design Canvas"
    route: "/data"
    use_case: "Data architects and privacy officers modeling data and lineage."
    challenge: "Sensitive data (PII/PHI/CUI/SECRET) flows untracked across systems, breaking privacy compliance."
    how_it_solves: "Data modeling with classification, column-level lineage DAG, contracts that block SECRET-to-lower flows, Privacy Act/HIPAA/GDPR assessment, and catalog sync (OpenMetadata/DataHub)."
    status: approved

  - id: 8
    canvas: "QDC - Quality Design Canvas"
    route: "/code-quality"
    use_case: "Engineering leads and QA tracking code health over time."
    challenge: "Code quality is subjective and technical debt accumulates invisibly between reviews."
    how_it_solves: "Measures complexity and code smells, gates on cyclomatic-complexity thresholds, and tracks maintainability trends across the codebase."
    status: approved

  - id: 9
    canvas: "MDC - Migration Design Canvas"
    route: "/migration-canvas"
    use_case: "Modernization teams planning a legacy-to-cloud migration."
    challenge: "Migration scope is unclear and waves aren't sequenced against dependencies or the ATO."
    how_it_solves: "Inventory scanning, 7R disposition advisor, COA selection (Phase A), auto-generated topology sidecar (Phase B), wave planner, and an ATO-coverage bridge so controls survive the move."
    status: approved

