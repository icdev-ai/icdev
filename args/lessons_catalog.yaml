# CUI // SP-CTI
# FathomDesk lesson catalog — the curriculum that powers /lessons.
#
# Each lesson is a markdown file in docs/lessons/{level}/{slug}.md.
# Metadata here controls ordering, title display, read-time, and grouping.
#
# Levels map to CashFlow progression + future Phase 6 gamification:
#   beginner      — "Hello, markets" foundational concepts
#   intermediate  — "How FathomDesk works" mechanics
#   advanced      — reserved for Phase 6.5 (CashFlow-102 style advanced)
#
# Hot-reloaded via file-mtime — edit this + the markdown without restarting.

_schema_version: 1

levels:
  beginner:
    label: Beginner
    icon: 🌱
    order: 1
    unlocks_when: always   # always unlocked — the starting track
    description: >-
      Start here if you're new to investing. Zero jargon. Covers the
      minimum mental model you need to use FathomDesk without being
      overwhelmed.
  intermediate:
    label: Intermediate
    icon: 📚
    order: 2
    unlocks_when: prior_level_complete
    prereq_level: beginner
    description: >-
      How FathomDesk specifically works — its signals, rules, readings,
      and regime framing. You'll know what the numbers mean and when
      to trust them.
  advanced:
    label: Advanced
    icon: 🎓
    order: 3
    unlocks_when: prior_level_complete
    prereq_level: intermediate
    description: >-
      Reserved for advanced topics (CashFlow-102 style). Unlocked once
      you finish the Intermediate track.

lessons:
  # ─── Beginner track ─────────────────────────────────────────────────
  - slug: what-is-a-stock
    level: beginner
    order: 1
    title: "What is a stock, really?"
    summary: "Equity, shares, market cap — the absolute basics in plain English."
    read_minutes: 4
    # Sample quiz — pass_percent defaults to 70 if omitted.
    quiz:
      pass_percent: 70
      questions:
        - id: q1
          text: "When you buy one share of a company, you're buying…"
          options:
            - "A loan to the company that pays you interest"
            - "A small fractional ownership stake in the company"
            - "A promise from the company to buy it back later"
            - "A guaranteed dividend payment"
          correct: 1
          explanation: "A share is a unit of equity ownership. Loans are bonds; dividends aren't guaranteed."
        - id: q2
          text: "What does 'market cap' mean?"
          options:
            - "The maximum price a stock can reach"
            - "Share price × total shares outstanding"
            - "The ceiling the exchange puts on daily trading"
            - "The company's annual revenue"
          correct: 1
          explanation: "Market cap = price × shares outstanding. It's a sizing metric, not a limit or revenue figure."
        - id: q3
          text: "Which of these is true of a stock's price?"
          options:
            - "It's set by the company"
            - "It's set by the government"
            - "It's set by supply and demand between buyers and sellers"
            - "It always matches the company's profit per share"
          correct: 2
          explanation: "Stock prices emerge from the order book — buyer bids meeting seller asks."

  - slug: reading-a-signal
    level: beginner
    order: 2
    title: "How do I read an FathomDesk signal?"
    summary: "Composite score, direction (BUY/SELL/HOLD), confidence. What to trust + what to ignore."
    read_minutes: 5
    prerequisites:
      - what-is-a-stock
    quiz:
      pass_percent: 70
      questions:
        - id: q1
          text: "A signal's 'composite score' is best described as…"
          options:
            - "The stock's current price"
            - "A 0–100 synthesis of multiple analyst agents' outputs"
            - "The company's quarterly earnings"
            - "A random rating"
          correct: 1
          explanation: "FathomDesk blends signals from fundamental/sentiment/technical/news analysts into one 0–100 score."
        - id: q2
          text: "A high 'confidence' value on a signal means…"
          options:
            - "The trade is guaranteed to be profitable"
            - "The analyst agents largely agreed on the direction"
            - "FathomDesk is willing to risk more money on it"
            - "The stock will definitely go up"
          correct: 1
          explanation: "Confidence reflects agent agreement — not profit guarantees. Markets can surprise any model."

  - slug: diversification
    level: beginner
    order: 3
    title: "Don't put all your eggs in one stock"
    summary: "Position sizing, sector spread, concentration risk. Why 5 names is better than 1 even if you love that 1 name."
    read_minutes: 4
    prerequisites:
      - reading-a-signal

  - slug: macro-regimes
    level: beginner
    order: 4
    title: "What is a 'regime' and why should I care?"
    summary: "Risk-on vs risk-off, Fed cycles, GREEN/RED/CRISIS. When the macro wind blows, portfolios blow with it."
    read_minutes: 5
    prerequisites:
      - diversification

  - slug: paper-to-live
    level: beginner
    order: 5
    title: "Paper trading vs real money"
    summary: "Why FathomDesk is paper-only by default, and what it takes to graduate to live trading."
    read_minutes: 3
    prerequisites:
      - macro-regimes

  # ─── Intermediate track ─────────────────────────────────────────────
  - slug: reading-engines
    level: intermediate
    order: 1
    title: "What FathomDesk's Reading engines actually do"
    summary: "Deterministic rule engines → plain-English narrative. No AI magic. Why that matters."
    read_minutes: 6

  - slug: personas
    level: intermediate
    order: 2
    title: "Personas — why the UI looks different for different people"
    summary: "The 8 personas that ship with FathomDesk + how to pick the right one for you."
    read_minutes: 5

  - slug: alerts-and-rules
    level: intermediate
    order: 3
    title: "Alerts — the 6 rule types + when to use each"
    summary: "Price moves, score crosses, direction flips, news impact, regime changes — configured right, this is your early-warning system."
    read_minutes: 7
