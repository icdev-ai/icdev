  cli_name: infra
  display_name: Infrastructure Design Canvas
  description: Cloud, IaC, Terraform, K8s manifest management.
  env_flag: ICDEV_IDC_ENABLED
  extra_env_flags:
  - ICDEV_INFRA_ENABLED
  default_enabled: false
  module: tools.infra_canvas.blueprint
  blueprint_attr: infra_bp
  url_prefix: /infra
  min_il: IL4
  default_roles:
  - developer
  nav:
    section: Canvases
    label: Infrastructure
  iqe:
    adapter_module: tools.iqe.adapters.infra
    collections:
    - infra.resources
    - infra.snapshots
    - infra.ai_decisions
  completeness:
    template: tools/dashboard/templates/infra_canvas/index.html
    blueprint: true
    constants: tools/infra_canvas/constants.py
    db_migration: tools/infra_canvas/db/migrations
    iqe_adapter: true
    nav_link: true
    seed_queries: context/iqe/queries/infra/
