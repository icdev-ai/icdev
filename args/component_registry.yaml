  # ═══════════════════════════════════════════════════════════════════════════
  # Child / Application Modules
  # ═══════════════════════════════════════════════════════════════════════════
  #
  # Child-app completeness: of the 8 canvas completeness components (cvx-gen-02),
  # only the ones meaningful for a self-contained child app are declared here.
  # The forge_validator FORGE-13 gate runs the full 8-point validator only on
  # `kind: canvas` components; these child_app blocks are documentary metadata of
  # which components each app actually ships.
  #   1. page_template — CANVAS-ONLY: the dashboard canvas template dir
  #        (tools/dashboard/templates/<key>/page.html). Child apps template under
  #        their own package, so this point is N/A and is intentionally omitted.
  #   2. icdev_mirror  — CANVAS-ONLY: mirror of point 1. N/A, omitted.
  #   3. blueprint     — applies -> `blueprint: true`
  #   4. backing_module— applies -> `backing_module: true`
  #   5. constants     — applies when the app ships constants.py -> `constants: <path>`
  #   6. db_migration  — child apps carry an app-local db.py rather than a
  #        tools/db migration dir, declared here as `db_module: <path>`
  #   7. nav_link      — applies -> `nav_link: true`
  #   8. iqe           — applies when an IQE adapter is registered -> `iqe_adapter: true`
- key: hitl_workflow
  kind: child_app
  display_name: HITL Workflow
  description: Human-in-the-loop workflow page module.
  env_flag: ICDEV_HITL_ENABLED
  default_enabled: false
  module: tools.workflow_hitl.blueprint
  blueprint_attr: create_wf_page_blueprint
  url_prefix: ''
  min_il: IL4
  default_roles: []
  nav:
    section: Ops
    label: HITL
    # cnr-nav-01: the registry url_prefix is '' but create_wf_page_blueprint mounts
    # its own url_prefix '/workflow', so the landing page is /workflow/ (app.py
    # registers as-is when the blueprint declares its own prefix). Without this
    # explicit link the normalizer emitted href '/'.
    links:
    - label: HITL
      href: /workflow/
  completeness:
    blueprint: true
    backing_module: true
    constants: tools/workflow_hitl/constants.py
    nav_link: true
- key: forge_academy
  kind: child_app
  display_name: FORGE Academy
  description: Gamified developer training.
  env_flag: ICDEV_FORGE_ACADEMY_ENABLED
  default_enabled: false
  module: apps.forge_academy.blueprint
  blueprint_attr: academy_bp
  # Routes are hardcoded to /academy in the blueprint (registered without a
  # url_prefix), so the registry prefix and nav link must match /academy or the
  # derived nav link 404s. A 301 redirect from the legacy /forge-academy paths
  # lives in the blueprint for stale bookmarks. (penta-aca-01)
  url_prefix: /academy
  min_il: IL2
  default_roles: []
  nav:
    # nav.section names the top-level dropdown (nav_tree.sections is keyed by it,
    # see base.html "nav_tree.sections.get('Canvases')"). FORGE Academy renders in
    # the Platforms dropdown under the hardcoded "Training" sub-label. (gdx-doc-02)
    section: Platforms
    label: FORGE Academy
    links:
      - label: Dashboard
        href: /academy
  completeness:
    blueprint: true
    backing_module: true
    constants: apps/forge_academy/constants.py
    db_module: apps/forge_academy/db.py
    nav_link: true
