  cli_name: infra
  display_name: Infrastructure Design Canvas
  description: Cloud, IaC, Terraform, K8s manifest management.
  env_flag: ICDEV_IDC_ENABLED
  extra_env_flags:
  - ICDEV_INFRA_ENABLED
  default_enabled: false
  module: tools.infra_canvas.blueprint
  blueprint_attr: infra_bp
  url_prefix: /infra
  min_il: IL4
  default_roles:
  - developer
  nav:
    section: Canvases
    label: Infrastructure
  iqe:
    adapter_module: tools.iqe.adapters.infra
    collections:
