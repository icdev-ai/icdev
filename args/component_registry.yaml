# CUI // SP-CTI
# Component Registry — single source of truth for ICDEV™ canvases, child apps,
# features, and core extensions.
#
# Consumed by:
#   - tools/config/component_registry.py (loader)
#   - tools/dashboard/app.py (blueprint registration + nav context)
#   - tools/dashboard/app.py::iqe_dispatch() (IQE adapter lookup)
#   - tools/cli/enable.py (toggle derivation)
#   - tools/security/canvas_access.py (default role seeding)
#   - tools/workflow/coherence_checker.py (sync + completeness gates)
#
# Design decisions:
#   - kind: canvas | child_app | feature | core_extension
#   - key: unique technical identifier (matches legacy _CANVAS_DEFS keys)
#   - cli_name: human-facing toggle name used by `icdev enable/disable/status`
#   - env_flag: primary .env toggle that gates the component
#   - extra_env_flags: legacy/secondary flags that must also flip
#   - default_enabled: used when env_flag is not set
#   - module + blueprint_attr: dynamic import location. Optional for `feature`.
#   - url_prefix: Flask url_prefix passed to register_blueprint. Empty string
#     means the blueprint defines its own routes.
#   - iqe: natural-language query adapter and collection list for /api/iqe/dispatch.
#   - nav: navigation metadata (section, label, links, order). Links drive the
#     registry-rendered Canvases menu in base.html.
#   - min_il + default_roles: RBAC metadata mirrored from args/canvas_registry.yaml.
#   - completeness: 8-point canvas completeness gate requirements.
#
# Phase 5 update: nav.links added for all Canvases-menu entries so the dashboard
# menu is data-driven instead of hardcoded in base.html.

