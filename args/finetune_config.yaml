# CUI // SP-CTI
# Fine-Tuning & Custom Model Training Configuration
# Phase 64 Extension — D-FT-1 through D-FT-22
#
# Controls local QLoRA training (Unsloth), cloud fine-tuning (OpenAI/Bedrock/Azure),
# dataset management, evaluation thresholds, auto-promotion, and child app inheritance.

# ── Provider Selection ─────────────────────────────────────────────────
# Auto-detect: local GPU → unsloth_local; no GPU + cloud enabled → cloud
# Override: set default_provider explicitly
default_provider: ""  # unsloth_local | openai | bedrock | azure_openai

# ── Local Training (Unsloth QLoRA) ─────────────────────────────────────
local:
  engine: unsloth
  base_models:
    - qwen3:latest
    - llama3.1:8b
    - mistral:7b
    - gemma2:9b
  default_base_model: qwen3:latest
  quantization: 4bit  # 4bit | 8bit | none
  gradient_checkpointing: true
  use_flash_attention: true
  gguf_quantization: q4_k_m  # q4_k_m | q5_k_m | q8_0 | f16

# ── GPU Configuration (D-FT-8) ─────────────────────────────────────────
gpu:
  min_vram_mb: 8192      # 8GB minimum for QLoRA
  preferred_vram_mb: 24576  # 24GB recommended
  cpu_fallback_serving: true  # Allow Ollama CPU serving (not training)
  cpu_fallback_training: false  # Never allow CPU training
  distributed: auto  # auto | single | multi

# ── LoRA Hyperparameters ────────────────────────────────────────────────
lora:
  default_rank: 16
  default_alpha: 32
  default_dropout: 0.0
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj

# ── Training Defaults ───────────────────────────────────────────────────
training:
  default_learning_rate: 0.0002
  default_epochs: 3
  default_batch_size: 2
  default_max_seq_length: 2048
  warmup_steps: 10
  weight_decay: 0.01
  scheduler: cosine  # cosine | linear | constant
  max_grad_norm: 1.0
  logging_steps: 10
  save_steps: 100
  output_base_dir: data/finetune/jobs

# ── Hyperparameter Search (D-FT-13) ────────────────────────────────────
hyperparam_search:
  method: grid  # grid | random
  max_trials: 9
  search_space:
    lora_rank: [8, 16, 32]
    learning_rate: [0.0001, 0.0002, 0.0005]
    epochs: [2, 3, 5]
    batch_size: [1, 2, 4]

# ── Dataset Configuration (D-FT-9) ─────────────────────────────────────
dataset:
  min_examples: 20
  max_examples_per_dataset: 100000
  auto_generate_pairs: true  # Generate Q&A from RAG chunks (D-FT-10)
  questions_per_chunk: 3
  train_test_split: 0.85
  system_prompt_template: >
    You are a specialized assistant for {purpose}.
    Respond concisely and accurately based on your training.
  content_hash_algorithm: sha256
  dedup_threshold: 0.95  # Cosine similarity for near-duplicate detection

# ── Document Extraction (D-FT-11) ──────────────────────────────────────
extraction:
  supported_formats:
    - pdf
    - docx
    - txt
    - md
  max_file_size_mb: 100
  pdf_provider: rag  # Reuse RAG PDF pipeline (D-RAG-15)
  word_provider: python-docx
  chunk_size: 2000
  chunk_overlap_pct: 10

# ── Evaluation (D-FT-14) ───────────────────────────────────────────────
evaluation:
  auto_eval: true
  metrics:
    - bleu
    - rouge_l
    - perplexity
  test_set_split: 0.15
  llm_judge_enabled: false  # Optional qwen3 LLM-as-judge
  llm_judge_model: qwen3-local
  max_eval_examples: 500

# ── Promotion Thresholds (D-FT-16) ─────────────────────────────────────
promotion:
  auto_promote: true
  thresholds:
    min_bleu: 0.30
    min_rouge_l: 0.40
    min_perplexity_improvement_pct: 10
  require_all_thresholds: true  # All must pass for auto-promote
  manual_override_allowed: true  # --force-promote flag

# ── Auto-Retrain (D-FT-17) ─────────────────────────────────────────────
retrain:
  enabled: true
  new_example_threshold: 50
  cooldown_hours: 24
  max_concurrent_jobs: 2

# ── GGUF Export & Ollama (D-FT-5) ──────────────────────────────────────
export:
  gguf_quantization: q4_k_m
  ollama_model_prefix: ""  # {app}-{purpose}-v{version}
  auto_register_ollama: true
  adapter_output_dir: data/finetune/adapters
  gguf_output_dir: data/finetune/gguf

# ── Cloud Providers (D-FT-20) ──────────────────────────────────────────
cloud:
  openai:
    enabled: false
    api_key_env: OPENAI_API_KEY
    base_model: gpt-4o-mini-2024-07-18
    n_epochs: 3
    poll_interval_seconds: 30
    max_poll_minutes: 360

  bedrock:
    enabled: false
    region: us-gov-west-1
    role_arn_env: BEDROCK_FINETUNE_ROLE_ARN
    base_model_id: amazon.titan-text-express-v1
    s3_bucket_env: BEDROCK_FINETUNE_S3_BUCKET
    poll_interval_seconds: 60
    max_poll_minutes: 720

  azure_openai:
    enabled: false
    endpoint_env: AZURE_OPENAI_ENDPOINT
    api_key_env: AZURE_OPENAI_API_KEY
    api_version: "2024-10-21"
    base_model: gpt-4o-mini-2024-07-18
    poll_interval_seconds: 30
    max_poll_minutes: 360

# ── Marketplace (D-FT-18) ──────────────────────────────────────────────
marketplace:
  require_model_card: true
  require_sbom: true
  require_provenance: true
  package_includes:
    - adapter_config.json
    - adapter_model.safetensors
    - training_metadata.json
    - model_card.md
    - SBOM.json

# ── Child App Integration (D-FT-19) ────────────────────────────────────
child_app:
  copy_adapters: true
  inherit_active_models: true
  scaffold_finetune_tools: true
  adapter_source_dir: data/finetune/adapters

# ── Provenance (D-FT-22) ───────────────────────────────────────────────
provenance:
  enabled: true
  track_source_documents: true
  track_rag_chunks: true
  track_training_pairs: true
  track_dataset_versions: true
  track_training_jobs: true
  track_adapter_artifacts: true

# ── Security (D-FT-4) ──────────────────────────────────────────────────
security:
  cloud_max_classification: CUI  # CUI data can go to IL4/IL5 cloud
  block_secret_to_cloud: true  # SECRET data = local only
  require_classification_label: true
  audit_all_training_events: true

# ── RAG-to-FT Automated Pipeline (D-KARL-5) ──────────────────────────
rag_ft_pipeline:
  enabled: true
  auto_approve_threshold: 0.8
  source_types:
    - innovation_signals
    - research_dossiers
    - compliance_artifacts
  schedule_minutes: 360
  max_pairs_per_run: 100
  default_dataset_name: rag-auto-pipeline
  default_purpose: general

# ── KG-to-FT Pair Generation (D-KARL-6) ──────────────────────────────
kg_ft_pipeline:
  enabled: true
  strategies:
    - entity_relationship
    - community_cluster
    - compliance_crosswalk
  questions_per_entity: 2
  min_community_size: 3
  max_pairs_per_graph: 50

# ── Dataset Taxonomy (D-RAG-24, D-FT-23 — Know Your RAG) ────────────
taxonomy:
  enabled: true
  labels:
    - fact_single
    - summary
    - reasoning
    - unanswerable
  min_label_pct: 10                  # Warn if any label < 10%
  max_label_pct: 60                  # Warn if any label > 60%
  statement_extraction: true         # Use statement extraction for grounded pairs

# ── Quality Feedback Loop (D-KARL-8, D-KARL-9) ──────────────────────
quality_feedback:
  enabled: true
  rag_eval_thresholds:
    min_ndcg: 0.5
    min_mrr: 0.4
    min_faithfulness: 0.6
  consecutive_failures_before_retrain: 3
  target_pairs_per_failing_query: 5
  auto_remediate: true               # D-KARL-9: Auto-generate pairs on degradation
  use_statement_extraction: true     # D-FT-23: Use Know Your RAG statement extraction
  taxonomy_aware_generation: true    # Target weak taxonomy labels
  max_auto_pairs_per_cycle: 50
  min_pairs_per_source: 5            # floor on per-source generation budget
  # Adaptive anomaly detection (aiify rm-6efad-phase-5497):
  # derive RAG quality floors as mean − k·stddev of ft_quality_snapshots history
  # instead of frozen magic numbers; falls back to fallback_floors when sparse.
  anomaly_detection:
    enabled: true
    min_samples: 30                  # min history rows per metric before adapting
    stddev_k: 2.0                    # flag metrics below mean − k·stddev
    fallback_floors:                 # used when < min_samples history exists
      ndcg: 0.30
      mrr: 0.30
      avg_retrieval_score: 0.30
    adaptive_bounds:
      floor_min: 0.05                # clamp adaptive floor lower bound
      floor_max: 0.80                # clamp adaptive floor upper bound
