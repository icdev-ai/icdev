# CUI // SP-CTI
# ICDEV™ Slide Deck Generator Configuration
# Controls deck generation pipeline, graphics, themes, and source connectors.
# Enable with: ICDEV_SLIDES_ENABLED=true in .env

classification: "CUI // SP-CTI"

enabled: ${ICDEV_SLIDES_ENABLED:-true}

# ── Generation Pipeline ─────────────────────────────────────────────────────
pipeline:
  max_slides: 12
  min_slides: 5
  # Slide outline planning temperature (lower = more structured)
  outline_temperature: 0.2
  # Content generation temperature (slightly higher for variety)
  content_temperature: 0.35
  # Max parallel content agent threads
  max_parallel_agents: 4
  # Timeout per LLM call (seconds)
  llm_timeout_seconds: 60
  # Output directory (relative to ICDEV root)
  output_dir: "tools/presentations/slides"

# ── Graphics ────────────────────────────────────────────────────────────────
graphics:
  enabled: ${SLIDES_IMAGE_ENABLED:-true}
  # Provider:
  #   gpt_image_2  -> OpenAI GPT-Image-2 (recommended: best text + diagrams)
  #   imagen_4     -> Google Imagen 4 (enterprise, native 16:9, typography)
  #   ollama_cloud -> Ollama cloud/local image model (SDXL / FLUX)
  #   dalle        -> OpenAI DALL-E 3 (legacy)
  #   gemini       -> Google Imagen 3 (legacy)
  #   matplotlib   -> deterministic air-gap fallback (always available)
  provider: ${SLIDES_IMAGE_PROVIDER:-matplotlib}
  # Image generation model (only used by ollama_cloud / gpt_image_2 / imagen_4 backends)
  # Examples:
  #   gpt_image_2: gpt-image-2
  #   imagen_4:    imagen-4.0-generate-001 | imagen-4.0-fast-generate-001 | imagen-4.0-ultra-generate-001
  #   ollama_cloud: sdxl:latest | flux-schnell | z-image
  model: ${SLIDES_IMAGE_MODEL:-}
  # 16:9 widescreen for slides
  size: "1024x576"
  quality: standard
  # Aspect ratio for providers that support it (e.g. imagen_4)
  aspect_ratio: "16:9"
  # Style hint injected into visual prompt
  style: "professional corporate, dark navy and gold color palette, minimalist, no text, high quality"
  per_slide: true
  # Skip image and use placeholder on timeout
  timeout_seconds: 60
  # Images go into output_dir/images/
  images_subdir: "images"

# ── Research ─────────────────────────────────────────────────────────────────
research:
  # Provider used when ICDEV is not air-gapped
  connected_provider: web_search
  # Fallback when is_airgap() is true (local LLM + RAG/KG only)
  airgap_fallback: rag_kg_local_llm
  max_results: 10
  # seconds to cache a research query result
  cache_ttl_minutes: 60
  # Default citation style for general presentations
  default_citation_style: inline_links

# ── Export Formats ────────────────────────────────────────────────────────────
export_formats:
  available:
    - pptx
    - pdf
    - html
  default:
    - pptx
    - pdf
    - html

# ── Themes ──────────────────────────────────────────────────────────────────
themes:
  default: midnight_executive
  available:
    - midnight_executive
    - govcon_proposal
    - compliance_briefing
    - fun_fiesta
    - creative_aurora
    - adventurous_outdoor
    - minimal_mono
    - bold_neon

# ── Source Connectors ───────────────────────────────────────────────────────
sources:
  # ICDEV feature catalog from KG + manifest shards
  icdev_capabilities:
    enabled: true
    max_capabilities: 30
  # Active canvases from feature flags
  canvases:
    enabled: true
  # Showcase / child apps
  child_apps:
    enabled: true
    max_apps: 10
  # Kanban epics + task burndown
  kanban:
    enabled: true
    max_epics: 8
    include_blockers: true
  # Genesis reflex run summaries
  genesis:
    enabled: true
    max_reflexes: 15
    include_last_run: true

# ── Genesis Reflex (auto weekly deck) ───────────────────────────────────────
genesis_reflex:
  schedule: "0 17 * * 5"     # Friday 17:00
  deck_title_template: "ICDEV™ Weekly Status — {date}"
  default_sources:
    - icdev_capabilities
    - canvases
    - kanban
    - genesis
  default_theme: midnight_executive
  max_slides: 10

# ── Tones ────────────────────────────────────────────────────────────────────
tones:
  default: professional
  available:
    - professional
    - fun
    - creative
    - adventurous
    - minimal
    - bold

# ── LLM Routing Functions ────────────────────────────────────────────────────
llm:
  outline_function: slides_outline_planning
  content_function: slides_content_generation
  revision_function: slides_content_revision
  viz_prompt_function: slides_visual_prompt
  research_function: slides_topic_research
