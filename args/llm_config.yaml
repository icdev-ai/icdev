# -----------------------------------------------------------------------
# Global Settings
# -----------------------------------------------------------------------
settings:
  max_retries: 5
  base_retry_delay_seconds: 1.0
  max_retry_delay_seconds: 30.0
  availability_cache_ttl_seconds: 1800
  prefer_local: false    # Two-tier handles local/cloud split — do not set true (blocks Claude tier2)

# -----------------------------------------------------------------------
# Two-Tier Routing (qwen3 worker → Claude planner/reviewer)
# -----------------------------------------------------------------------
# Claude is the brain. qwen3 handles drafting, research, and scanning.
#
# planner_functions : Claude directly — no qwen3 pre-step (architecture,
#                     orchestration, high-stakes planning)
# worker_functions  : qwen3 drafts a COMPACT structured response, then
#                     Claude verifies/corrects and returns the final answer.
#                     qwen3 output is intentionally short (reduces Claude's
#                     input tokens vs. Claude doing the full task alone).
# scanner_functions : qwen3 only — log analysis, health checks, simple
#                     pattern matching where review adds no value.
#
# Set enabled: false to fall back to normal chain-based routing.
# ── PII Redaction (D-RDT-1 through D-RDT-4, Phase 72 Hermes adaptation) ────
# Pre-LLM redaction + post-LLM de-anonymization for CUI/PII protection.
redaction:
  enabled: true                    # Master toggle for pre-invoke PII redaction
  enforce_at_il4_plus: true        # Auto-enable at IL4+ even if global toggle is off
  skip_for_local_only: true        # Skip redaction when routing is Ollama-only
  deanonymize_response: true       # Restore originals in LLM response
  audit_enabled: true              # Log redaction events to redaction_audit table
  # Functions excluded from redaction — Pulse articles are public evergreen
  # blog posts, not CUI. Redacting org names produces [ORGANIZATION] tokens
  # that leak into published content.
  excluded_functions:
    - pulse_draft
    - pulse_rewrite
    - wg_rewrite
    - narrative_generation

two_tier:
  enabled: true
  tier1_model: qwen3-local    # Worker — research, draft, scan (free/local)
  tier2_model: claude-sonnet-api  # Planner/Reviewer — Anthropic API (not Bedrock)

  # Dual-model mode: swap tier1 + overrides for simultaneous VRAM residency
  # Toggle via: env ICDEV_DUAL_MODEL=true, or dashboard toggle, or API
  # When enabled: tier1 → qwen3-dual (1.7B text-only), overrides swap to dual variants
  # When disabled: tier1 → qwen3-local (9B multimodal), original overrides
  dual_model:
    enabled: ${ICDEV_DUAL_MODEL:-false}
    tier1_override: qwen3-dual           # replaces tier1_model when active
    function_overrides:                   # replaces function_model_overrides entries
      pulse_rewrite: qwen3-dual          # 1.7B text-only instead of 9B
      # pulse_draft stays gemma3-local (already dual-resident)
      # wg_rewrite stays claude-sonnet-api (cloud, no VRAM impact)

  planner_functions:
    - agent_architect
    - agent_orchestrator
    - task_decomposition
    - child_app
    - saas_proxy

  # Worker tier: qwen3 drafts → Claude reviews/corrects (two-step build pattern).
  # Restored 2026-04-30: thinking-mode timeouts resolved (think=False in provider;
  # GPU now active on RTX 4060 Ti with qwen3.5:9b — ~53s latency acceptable).
  worker_functions:
    - code_generation        # qwen3 drafts code → Claude reviews for correctness
    - bdd_preview            # qwen3 drafts BDD specs → Claude tightens acceptance criteria
    - narrative_generation   # qwen3 drafts narrative → Claude refines voice/structure

  scanner_functions:
    - agent_monitor
    - attachment_analysis
    - rag_rerank
    - rag_evaluate
    - ft_pair_generation
    - pulse_draft          # Drafting uses gemma3 (no thinking mode issues)
    - pulse_rewrite        # Rewriting uses qwen3.5 (think:false via provider)
    - codebase_query       # Phase 69: codebase assistant widget (D-CA-5)
    - wg_rewrite           # Claude override via function_model_overrides below

  # Per-function model overrides (scanner tier)
  # Override tier1_model for specific functions
  function_model_overrides:
    pulse_draft: gemma3-local        # gemma3 for article writing (no thinking mode)
    wg_rewrite: claude-sonnet-api    # Claude for WriteGuard rewriting (scanner path, Claude override)
    pulse_rewrite: qwen3-local      # qwen3.5 for Pulse rewriting (think:false via provider)

# -----------------------------------------------------------------------
# RAG Integration (D-RAG-2, Phase 64)
# -----------------------------------------------------------------------
# Controls RAG context injection into two-tier LLM pipeline.
# Full RAG config in args/rag_config.yaml — this section enables/disables
# the injection hook in the LLM router.
rag:
  enabled: true
  injection:
    enabled: true
    injection_top_k: 5
    max_injection_chars: 4000
    function_denylist:
      - attachment_analysis
      - screenshot_validation
      - document_vision
      - ui_analysis
      - diagram_extraction
      - compliance_diagram

# -----------------------------------------------------------------------
# Token Budget Enforcement (Paperclip-inspired per-agent hard-stops)
# -----------------------------------------------------------------------
# Per-agent monthly USD caps. Warning fires at threshold; hard_stop blocks.
# Set enabled: false to disable enforcement globally.
token_budgets:
  enabled: true
  default_monthly_usd: 50.00
  warning_threshold: 0.8          # warn at 80% spend
  hard_stop: true                  # block at 100% (false = warn-only)

  # Per-agent overrides (agent_id from agent_registry.py cards)
  per_agent:
    orchestrator-agent:
      monthly_usd: 100.00         # orchestrator needs higher cap
    builder-agent:
      monthly_usd: 75.00
    compliance-agent:
      monthly_usd: 30.00
    security-agent:
      monthly_usd: 30.00
    knowledge-agent:
      monthly_usd: 20.00
    monitor-agent:
      monthly_usd: 10.00
    # Scanner-tier agents (Ollama-only, zero cloud cost) — generous caps
    genesis-daemon:
      monthly_usd: 5.00           # mostly Ollama, minimal cloud
    proposal-genesis-daemon:
      monthly_usd: 5.00
