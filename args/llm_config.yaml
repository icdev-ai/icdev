# -----------------------------------------------------------------------
# Task Category Capability Matrix
# -----------------------------------------------------------------------
# Maps task categories to preferred models in priority order.
# Used by LLMRouter.get_models_for_category() and CoT/CoD role selection.
# Add new Ollama models to the appropriate categories when you pull them.
task_categories:
  coding:
    preferred: [qwen3-local, codestral-local, claude-sonnet, gpt-4o, llama-local]
    description: "Code generation, debugging, refactoring"

  reasoning:
    preferred: [deepseek-local, qwen3-local, claude-opus, o3, llama-local]
    description: "Multi-step reasoning, chain-of-thought, proofs"

  writing:
    preferred: [llama-local, claude-sonnet, kimi-cloud, gemini-2.5-pro]
    description: "Long-form prose, narrative, documentation"

  vision:
    preferred: [gemma3-local, gemma4-local, llava-local, claude-sonnet, gpt-4o]
    description: "Image analysis, screenshots, UI understanding"

  summarization:
    preferred: [qwen3-local, claude-haiku, gpt-4o-mini, llama-local]
    description: "Document condensation, distillation"

  long_context:
    preferred: [kimi-cloud, claude-opus, gemini-2.5-pro, gpt-oss-cloud]
    description: "Tasks requiring 32K+ context window"

  structured_output:
    preferred: [qwen3-local, claude-sonnet, gpt-4o, gemini-2.5-pro]
    description: "JSON schema adherence, structured extraction"

  agentic:
    preferred: [qwen3-local, claude-sonnet, gpt-4o, llama-local]
    description: "Tool use, multi-step planning, function calling"

