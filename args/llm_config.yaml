  deanonymize_response: true
  enabled: true
  enforce_at_il4_plus: true
  excluded_functions:
  - pulse_draft
  - pulse_rewrite
  - wg_rewrite
  - narrative_generation
  skip_for_local_only: true
response_cache:
  backend: postgresql
  enabled: true
  excluded_functions:
  - pulse_generation
  - news_oracle
  - market_scan
  - fathomdesk_trap
  - attachment_analysis
  - screenshot_validation
  - ui_analysis
  - browser_automation
  match_strategy: exact
  max_entries: 100000
  per_canvas:
    aadc:
      context_cache: true
      ttl_seconds: 3600
    aimc:
      context_cache: true
      ttl_seconds: 3600
    bdc:
      context_cache: true
      ttl_seconds: 3600
    ddc:
      context_cache: true
      ttl_seconds: 7200
    idc:
      context_cache: true
      ttl_seconds: 3600
    mdc:
      context_cache: true
      ttl_seconds: 7200
    ndc:
      context_cache: true
      ttl_seconds: 7200
    odc:
      context_cache: true
      ttl_seconds: 3600
    ohc:
      context_cache: true
      ttl_seconds: 3600
    pdc:
      context_cache: true
      ttl_seconds: 3600
    qdc:
      context_cache: true
      ttl_seconds: 3600
    sdc:
      context_cache: true
      ttl_seconds: 3600
  per_function:
    chat_response:
      ttl_seconds: 1800
    code_generation:
      context_cache: true
      ttl_seconds: 7200
    narrative_generation:
      ttl_seconds: 1800
    network_diagram_extraction:
      context_cache: true
      ttl_seconds: 3600
    nlq_sql:
      ttl_seconds: 600
    persona_gen:
      context_cache: true
      ttl_seconds: 3600
    recommendation:
      ttl_seconds: 3600
    tfw_narrative:
      context_cache: true
      ttl_seconds: 3600
    ttx_judge:
      context_cache: true
