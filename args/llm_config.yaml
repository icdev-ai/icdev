  formal_verification:
    chain: [qwen3-local, leanstral, leanstral-local, claude-opus, o3, gemini-2.5-pro]
    effort: max

  # GovEval Benchmark Evaluation (D-VL-9)
  goveval_judge:
    chain: [qwen3-local, claude-sonnet, leanstral, gpt-4o, gemini-2.5-pro]
    effort: high

  # GovCon Proposal Functions — LOCAL ONLY (Phase 70: Redaction & Data Protection)
  # Proposal content contains CUI program names, past performance, pricing.
  # Route to Ollama only — never send raw proposal content to cloud LLMs.
  # WriteGuard rewrite (wg_rewrite) stays on Claude (rewrites style, not content).
  proposal_drafting:
    chain: [qwen3-local, llama-local]
    effort: medium

  requirement_extraction:
    chain: [kimi-cloud, qwen3-local]
    effort: medium

  bid_scoring:
    chain: [qwen3-local, llama-local]
    effort: low

  color_review:
    chain: [qwen3-local, llama-local]
    effort: medium

  # Failure triage — Claude for diagnose (thinking/reasoning),
  # Ollama for patch (building/code-gen). Explicit two-tier split per
  # the "Claude thinks, Ollama builds" convention.
  failure_triage_diagnose:
    chain: [qwen3-local, claude-sonnet, claude-opus, gpt-4o, gemini-2.5-pro]
    effort: high

  failure_triage_patch:
    chain: [qwen3-local, codestral-local, llama-local, claude-sonnet]
    effort: medium

  chat_response:
    chain: [kimi-cloud, qwen3-local, claude-sonnet, gpt-4o, llama-local]
    effort: low
    disable_thinking: true

  # -----------------------------------------------------------------------
  # Chain-of-Thought role chains
  # Each CoT role uses a different preferred model family for true multi-LLM reasoning.
  # - cot_reasoner: thinking/reasoning-capable models first
  # - cot_critic:   cloud review models first (different perspective from reasoner)
  # - cot_synthesizer: best synthesis models first
  # -----------------------------------------------------------------------
  cot_reasoner:
    chain: [deepseek-local, qwen3-local, claude-opus, o3, llama-local]
    effort: high

  cot_critic:
    chain: [claude-sonnet, qwen3-local, gpt-4o, gemini-2.5-pro, llama-local]
    effort: high

  cot_synthesizer:
    chain: [claude-sonnet, qwen3-local, gpt-4o, gemini-2.5-flash, llama-local]
    effort: high

  # -----------------------------------------------------------------------
  # Chain-of-Debate role chains
  # cod_debater_pool: large diverse pool — get_diverse_models() picks N
  #   distinct models maximizing provider variety (ollama, anthropic, openai, google)
  # cod_judge: best available model for final synthesis / verdict
  # -----------------------------------------------------------------------
  cod_debater_pool:
    chain: [qwen3-local, llama-local, deepseek-local, claude-haiku, claude-sonnet, gpt-4o, gpt-4o-mini, gemini-2.5-flash, kimi-cloud]
    effort: medium

  cod_judge:
    chain: [claude-sonnet, qwen3-local, gpt-4o, gemini-2.5-pro]
    effort: high

  default:
    chain: [qwen3-local, claude-sonnet, gpt-4o, gemini-2.5-flash, llama-local]
    effort: medium

