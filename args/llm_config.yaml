# -----------------------------------------------------------------------
# Global Settings
# -----------------------------------------------------------------------
settings:
  max_retries: 5
  base_retry_delay_seconds: 1.0
  max_retry_delay_seconds: 30.0
  availability_cache_ttl_seconds: 1800
  prefer_local: false    # Two-tier handles local/cloud split — do not set true (blocks Claude tier2)
  # Ollama auto-discovery: on startup, probes /api/tags and registers new models in-memory
  # so they are immediately usable. Does NOT write to this file. Curate capabilities by hand.
  ollama_discovery:
    enabled: true
    probe_providers: [ollama, ollama_cloud]
    default_capabilities: [summarization, writing]
    refresh_interval_seconds: 3600

# -----------------------------------------------------------------------
# Two-Tier Routing (qwen3 worker → Claude planner/reviewer)
# -----------------------------------------------------------------------
# Claude is the brain. qwen3 handles drafting, research, and scanning.
#
# planner_functions : Claude directly — no qwen3 pre-step (architecture,
#                     orchestration, high-stakes planning)
# worker_functions  : qwen3 drafts a COMPACT structured response, then
#                     Claude verifies/corrects and returns the final answer.
#                     qwen3 output is intentionally short (reduces Claude's
#                     input tokens vs. Claude doing the full task alone).
# scanner_functions : qwen3 only — log analysis, health checks, simple
#                     pattern matching where review adds no value.
#
# Set enabled: false to fall back to normal chain-based routing.
# ── PII Redaction (D-RDT-1 through D-RDT-4, Phase 72 Hermes adaptation) ────
# Pre-LLM redaction + post-LLM de-anonymization for CUI/PII protection.
redaction:
  enabled: true                    # Master toggle for pre-invoke PII redaction
  enforce_at_il4_plus: true        # Auto-enable at IL4+ even if global toggle is off
  skip_for_local_only: true        # Skip redaction when routing is Ollama-only
  deanonymize_response: true       # Restore originals in LLM response
  audit_enabled: true              # Log redaction events to redaction_audit table
  # Functions excluded from redaction — Pulse articles are public evergreen
  # blog posts, not CUI. Redacting org names produces [ORGANIZATION] tokens
  # that leak into published content.
  excluded_functions:
    - pulse_draft
    - pulse_rewrite
    - wg_rewrite
    - narrative_generation

two_tier:
  enabled: true
  tier1_model: kimi-cloud       # Worker — kimi-k2.6 cloud first; qwen3-local (no-think) fallback
  tier2_model: claude-sonnet-api  # Planner/Reviewer — Anthropic API (not Bedrock)

  # Dual-model mode: swap tier1 + overrides for simultaneous VRAM residency
  # Toggle via: env ICDEV_DUAL_MODEL=true, or dashboard toggle, or API
  # When enabled: tier1 → qwen3-dual (1.7B text-only), overrides swap to dual variants
  # When disabled: tier1 → qwen3-local (9B multimodal), original overrides
  dual_model:
    enabled: ${ICDEV_DUAL_MODEL:-false}
    tier1_override: qwen3-dual           # replaces tier1_model when active
    function_overrides:                   # replaces function_model_overrides entries
      pulse_rewrite: qwen3-dual          # 1.7B text-only instead of 9B
      # pulse_draft stays gemma3-local (already dual-resident)
      # wg_rewrite stays claude-sonnet-api (cloud, no VRAM impact)

  planner_functions:
    - agent_architect
    - agent_orchestrator
    - agent_mbse
    - agent_modernization
    - agent_requirements_analyst
    - task_decomposition
    - child_app
    - saas_proxy

  # Worker tier: qwen3 drafts → Claude reviews/corrects (two-step build pattern).
  # Restored 2026-04-30: thinking-mode timeouts resolved (think=False in provider;
  # GPU now active on RTX 4060 Ti with qwen3.5:9b — ~53s latency acceptable).
  worker_functions:
    - code_generation        # qwen3 drafts code → Claude reviews for correctness
    - bdd_preview            # qwen3 drafts BDD specs → Claude tightens acceptance criteria
    - narrative_generation   # qwen3 drafts narrative → Claude refines voice/structure

  scanner_functions:
    - agent_monitor
    - attachment_analysis
    - rag_rerank
    - rag_evaluate
    - ft_pair_generation
    - pulse_draft          # Drafting uses gemma3 (no thinking mode issues)
    - pulse_rewrite        # Rewriting uses qwen3.5 (think:false via provider)
    - codebase_query       # Phase 69: codebase assistant widget (D-CA-5)
    - wg_rewrite           # Claude override via function_model_overrides below

  # Per-function model overrides (scanner tier)
  # Override tier1_model for specific functions
  function_model_overrides:
    pulse_draft: gemma3-local        # gemma3 for article writing (no thinking mode)
    wg_rewrite: claude-sonnet-api    # Claude for WriteGuard rewriting (scanner path, Claude override)
    pulse_rewrite: qwen3-local      # qwen3.5 for Pulse rewriting (think:false via provider)

# -----------------------------------------------------------------------
# RAG Integration (D-RAG-2, Phase 64)
# -----------------------------------------------------------------------
# Controls RAG context injection into two-tier LLM pipeline.
# Full RAG config in args/rag_config.yaml — this section enables/disables
# the injection hook in the LLM router.
rag:
  enabled: true
  injection:
    enabled: true
    injection_top_k: 5
    max_injection_chars: 4000
    function_denylist:
      - attachment_analysis
      - screenshot_validation
      - document_vision
      - ui_analysis
      - diagram_extraction
      - compliance_diagram
      - e2e_testing
      - playwright_execution
      - browser_automation
      - ui_verification

# -----------------------------------------------------------------------
# Token Budget Enforcement (Paperclip-inspired per-agent hard-stops)
# -----------------------------------------------------------------------
# Per-agent monthly USD caps. Warning fires at threshold; hard_stop blocks.
# Set enabled: false to disable enforcement globally.
token_budgets:
  enabled: true
  default_monthly_usd: 50.00
  warning_threshold: 0.8          # warn at 80% spend
  hard_stop: true                  # block at 100% (false = warn-only)

  # Per-agent overrides (agent_id from agent_registry.py cards)
  per_agent:
    orchestrator-agent:
      monthly_usd: 100.00         # orchestrator needs higher cap
    builder-agent:
      monthly_usd: 75.00
    compliance-agent:
      monthly_usd: 30.00
    security-agent:
      monthly_usd: 30.00
    knowledge-agent:
      monthly_usd: 20.00
    monitor-agent:
      monthly_usd: 10.00
    mbse-agent:
      monthly_usd: 40.00
    modernization-agent:
      monthly_usd: 50.00
    requirements-analyst-agent:
      monthly_usd: 30.00
    supply-chain-agent:
      monthly_usd: 20.00
    simulation-agent:
      monthly_usd: 40.00
    gateway-agent:
      monthly_usd: 5.00
    devsecops-agent:
      monthly_usd: 30.00
    # Scanner-tier agents (Ollama-only, zero cloud cost) — generous caps
    genesis-daemon:
      monthly_usd: 5.00           # mostly Ollama, minimal cloud
    proposal-genesis-daemon:
      monthly_usd: 5.00

# -----------------------------------------------------------------------
# Module Budget Enforcement (generative_intelligence + predictive_analysis)
# -----------------------------------------------------------------------
# Limits aggregate computational resources per high-cost module.
# Enforced in addition to per-agent token_budgets above.
module_budgets:
  enabled: true
  default_monthly_usd: 200.00
  default_monthly_tokens: 500000
  default_monthly_operations: 1000
  warning_threshold: 0.8
  hard_stop: true

  per_module:
    generative_intelligence:
      monthly_usd: 150.00         # LLM calls, embeddings, chain orchestration
      monthly_tokens: 400000
      monthly_operations: 0       # not used for generative
    predictive_analysis:
      monthly_usd: 50.00          # simulation runs, Monte Carlo, COA generation
      monthly_tokens: 100000       # LLM use inside simulations
      monthly_operations: 500      # simulation scenario runs

# -----------------------------------------------------------------------
# Chain Orchestration (CoT / CoD)
# -----------------------------------------------------------------------
chain_orchestration:
  enabled: true
  default_mode: single
  cost_cap_usd: 0.50
  token_cap: 32000
  timeout_seconds: 120
  cot:
    enabled: true
    max_rounds: 3
    self_consistency_runs: 1
    # Role routing keys — each role uses a distinct preferred model family for true multi-LLM CoT.
    # Takes precedence over *_model keys below. Set to null in per_function to use *_model fallback.
    reasoner_role: cot_reasoner       # deepseek-local → qwen3-local → cloud (thinking-focused)
    critic_role: cot_critic           # claude-sonnet → qwen3-local → cloud (review-focused)
    synthesizer_role: cot_synthesizer # claude-sonnet → qwen3-local → cloud (synthesis-focused)
    # Legacy direct model names — used as fallback when *_role resolves to nothing
    reasoner_model: qwen3-local
    critic_model: claude-sonnet
    synthesizer_model: claude-sonnet
    excluded_functions:
      - pulse_generation
      - news_oracle
      - market_scan
    per_function:
      code_generation:
        max_rounds: 5
        self_consistency_runs: 3
      # INTaaS cluster-level reasoning: local-only CoT to preserve scanner-tier cost model
      news_reasoning:
        max_rounds: 2
        self_consistency_runs: 1
        # Override to local-only by nulling roles and setting direct model names
        reasoner_role: null
        critic_role: null
        synthesizer_role: null
        reasoner_model: qwen3-local
        critic_model: qwen3-local
        synthesizer_model: qwen3-local
  cod:
    enabled: true
    num_debaters: 3
    debate_rounds: 2
    # Role routing keys for true multi-LLM debate.
    judge_role: cod_judge             # claude-sonnet → qwen3-local → cloud (best judgment)
    debater_pool_role: cod_debater_pool  # get_diverse_models() picks N distinct models
    # Legacy direct model names — used as fallback when pool returns nothing
    judge_model: claude-sonnet
    debater_models:
      - qwen3-local
      - claude-sonnet
      - openai-gpt4o
    excluded_functions:
      - pulse_generation
    per_function:
      architecture_review:
        num_debaters: 5
      # INTaaS perspective scoring: bull/bear/neutral debate with local debaters + Claude judge
      intaas_multiperspectivity:
        num_debaters: 3
        debate_rounds: 2
        judge_role: cod_judge
        judge_model: claude-sonnet
        # Override to local-only debaters by nulling pool role and using legacy list
        debater_pool_role: null
        debater_models:
          - qwen3-local
          - qwen3-local
          - qwen3-local
        positions:
          - Bull case (strong buy / buy)
          - Bear case (sell / strong sell)
          - Neutral case (hold / wait)

# -----------------------------------------------------------------------
# Response Cache + Context Caching (D-CACHE-1 through D-CACHE-10)
# Two-level: response_cache = deterministic KV store for full responses
# (PostgreSQL-native with SQLite fallback); context_cache = provider-level
# KV prefix reuse (cache_control: ephemeral on system prompt + last user msg).
# -----------------------------------------------------------------------
response_cache:
  enabled: true
  backend: postgresql
  ttl_seconds: 3600
  max_entries: 100000
  match_strategy: exact
  excluded_functions:
