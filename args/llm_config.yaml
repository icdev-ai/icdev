providers:
  anthropic:
    api_key_env: ANTHROPIC_API_KEY
    base_url: https://api.anthropic.com
    type: anthropic
  bedrock:
    region: ${AWS_DEFAULT_REGION:-us-gov-west-1}
    type: bedrock
  gemini:
    api_key_env: GOOGLE_API_KEY
    type: gemini
  ibm_watsonx:
    api_key_env: IBM_CLOUD_API_KEY
    project_id: ${IBM_WATSONX_PROJECT_ID:-}
    type: ibm_watsonx
    url: ${IBM_WATSONX_URL:-https://us-south.ml.cloud.ibm.com}
  mistral:
    api_key_env: MISTRAL_API_KEY
    base_url: ${MISTRAL_BASE_URL:-https://api.mistral.ai/v1}
    type: openai_compatible
  mistral_vllm:
    api_key_env: MISTRAL_VLLM_API_KEY
    base_url: ${MISTRAL_VLLM_BASE_URL:-http://localhost:8100/v1}
    type: openai_compatible
  ollama:
    base_url: ${OLLAMA_BASE_URL:-http://localhost:11434}
    type: ollama
  ollama_cloud:
    api_key_env: OLLAMA_API_KEY
    base_url: ${OLLAMA_CLOUD_BASE_URL:-https://ollama.com}
    type: ollama
  openai:
    api_key_env: OPENAI_API_KEY
    base_url: https://api.openai.com/v1
    type: openai_compatible
  vllm:
    api_key_env: VLLM_API_KEY
    base_url: ${VLLM_BASE_URL:-http://localhost:8000/v1}
    type: openai_compatible
rag:
  enabled: true
  injection:
    enabled: true
    function_denylist:
    - attachment_analysis
    - screenshot_validation
    - document_vision
    - ui_analysis
    - diagram_extraction
    - compliance_diagram
    - e2e_testing
    - playwright_execution
    - browser_automation
    - ui_verification
    injection_top_k: 5
    max_injection_chars: 4000
redaction:
