# [TEMPLATE: CUI // SP-CTI]
# ICDEV™ LLM Provider Configuration
# Controls which models are used for each function across the platform.
# Single source of truth — replaces scattered hardcoded model IDs.

# -----------------------------------------------------------------------
# Provider Definitions
# -----------------------------------------------------------------------
providers:
  bedrock:
    type: bedrock
    region: ${AWS_DEFAULT_REGION:-us-gov-west-1}
    # Uses boto3 credentials (IAM role, env vars, or ~/.aws/credentials)

  anthropic:
    type: anthropic
    api_key_env: ANTHROPIC_API_KEY
    base_url: https://api.anthropic.com

  openai:
    type: openai_compatible
    api_key_env: OPENAI_API_KEY
    base_url: https://api.openai.com/v1

  ollama:
    type: ollama
    base_url: ${OLLAMA_BASE_URL:-http://localhost:11434}

  gemini:
    type: gemini
    api_key_env: GOOGLE_API_KEY

  vllm:
    type: openai_compatible
    base_url: ${VLLM_BASE_URL:-http://localhost:8000/v1}
    api_key_env: VLLM_API_KEY

  ibm_watsonx:
    type: ibm_watsonx
    api_key_env: IBM_CLOUD_API_KEY
    project_id: ${IBM_WATSONX_PROJECT_ID:-}
    url: ${IBM_WATSONX_URL:-https://us-south.ml.cloud.ibm.com}

  # Mistral AI — OpenAI-compatible API (LeanStral, Mistral Small 4)
  # Cloud: api.mistral.ai (requires MISTRAL_API_KEY)
  # Air-gapped: self-host via vLLM (see mistral_vllm provider below)
  mistral:
    type: openai_compatible
    api_key_env: MISTRAL_API_KEY
    base_url: ${MISTRAL_BASE_URL:-https://api.mistral.ai/v1}

  # Self-hosted Mistral/LeanStral via vLLM (air-gapped deployment)
  # docker pull mistralllm/vllm-ms4:latest
  # vllm serve mistralai/Leanstral-2603 --tensor-parallel-size 4 \
  #   --attention-backend FLASH_ATTN_MLA --tool-call-parser mistral
  mistral_vllm:
    type: openai_compatible
    base_url: ${MISTRAL_VLLM_BASE_URL:-http://localhost:8100/v1}
    api_key_env: MISTRAL_VLLM_API_KEY

