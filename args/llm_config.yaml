    effort: high

  compliance_export:
    chain: [claude-sonnet, gpt-4o-mini, gemini-2.0-flash, qwen3-local, llama-local]
    effort: medium

  # Cross-Language Translation (Phase 43)
  code_translation:
    chain: [claude-opus, claude-sonnet, o3, gemini-2.5-pro, gpt-4o, qwen3-local, codestral-local]
    effort: max

  code_translation_repair:
    chain: [claude-sonnet, gemini-2.5-pro, gpt-4o, qwen3-local, codestral-local]
    effort: high

  code_translation_review:
    chain: [claude-sonnet, gemini-2.5-pro, gpt-4o, qwen3-local, codestral-local]
    effort: high

  test_translation:
    chain: [claude-sonnet, gemini-2.5-pro, gpt-4o, qwen3-local, codestral-local]
    effort: high

  dependency_suggestion:
    chain: [claude-haiku, gpt-4o-mini, gemini-2.0-flash, qwen3-local, codestral-local]
    effort: low

  # RAG Re-ranking (Phase 64, D-RAG-3 — scanner_function, qwen3 only)
  rag_rerank:
    chain: [qwen3-local, gemini-2.0-flash, gpt-4o-mini, llama-local]
    effort: low

  # Fine-tuning pair generation (D-FT-10 — scanner_function, local only)
  ft_pair_generation:
    chain: [qwen3-local, gemini-2.0-flash, llama-local]
    effort: low

  # Compiler-in-the-Loop Verification Repair (LeanStral-adapted, D-VL-1)
  # LeanStral excels at code verification and repair — use when available,
  # fall back to general-purpose models. Air-gapped: leanstral-local via vLLM.
  verify_loop_repair:
    chain: [leanstral, leanstral-local, claude-sonnet, gemini-2.5-pro, gpt-4o, qwen3-local, codestral-local]
    effort: high

  # Formal Verification / Property-Based Testing (D-VL-6)
  # For generating invariant specifications and property tests.
  formal_verification:
    chain: [leanstral, leanstral-local, claude-opus, o3, gemini-2.5-pro, qwen3-local]
    effort: max

  # GovEval Benchmark Evaluation (D-VL-9)
  goveval_judge:
    chain: [claude-sonnet, leanstral, gpt-4o, gemini-2.5-pro, qwen3-local]
    effort: high

  # GovCon Proposal Functions — LOCAL ONLY (Phase 70: Redaction & Data Protection)
  # Proposal content contains CUI program names, past performance, pricing.
  # Route to Ollama only — never send raw proposal content to cloud LLMs.
  # WriteGuard rewrite (wg_rewrite) stays on Claude (rewrites style, not content).
  proposal_drafting:
    chain: [qwen3-local, llama-local]
    effort: medium

  requirement_extraction:
    chain: [qwen3-local, llama-local]
    effort: medium

  bid_scoring:
    chain: [qwen3-local, llama-local]
    effort: low

  color_review:
    chain: [qwen3-local, llama-local]
    effort: medium

  # Failure triage — Claude for diagnose (thinking/reasoning),
  # Ollama for patch (building/code-gen). Explicit two-tier split per
  # the "Claude thinks, Ollama builds" convention.
  failure_triage_diagnose:
    chain: [claude-sonnet, claude-opus, gpt-4o, gemini-2.5-pro, qwen3-local]
    effort: high

  failure_triage_patch:
    chain: [qwen3-local, codestral-local, llama-local, claude-sonnet]
    effort: medium

  chat_response:
    chain: [claude-sonnet, gpt-4o, gemini-2.5-flash, qwen3-local, llama-local]
    effort: low
    disable_thinking: true

  default:
    chain: [claude-sonnet, gpt-4o, gemini-2.5-flash, qwen3-local, llama-local]
    effort: medium

