    chain: [qwen3-local, claude-opus, claude-sonnet, o3, gemini-2.5-pro, gpt-4o, codestral-local]
    effort: max

  code_translation_repair:
    chain: [qwen3-local, claude-sonnet, gemini-2.5-pro, gpt-4o, codestral-local]
