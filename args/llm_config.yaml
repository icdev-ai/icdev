agent_effort_defaults:
  architect-agent: max
  builder-agent: max
  compliance-agent: high
  devsecops-agent: high
  gateway-agent: low
  infra-agent: medium
  knowledge-agent: medium
  mbse-agent: high
  modernization-agent: high
  monitor-agent: low
  orchestrator-agent: high
  requirements-analyst-agent: high
  security-agent: high
  simulation-agent: high
  supply-chain-agent: medium
chain_orchestration:
  cod:
    debate_rounds: 2
    debater_models:
    - qwen3-local
    - claude-sonnet
    - openai-gpt4o
    enabled: true
    excluded_functions:
    - pulse_generation
    judge_model: claude-sonnet
    num_debaters: 3
    per_function:
      architecture_review:
        num_debaters: 5
  cost_cap_usd: 0.5
  cot:
    critic_model: claude-sonnet
    enabled: true
    excluded_functions:
    - pulse_generation
    - news_oracle
    - market_scan
    max_rounds: 3
    per_function:
      code_generation:
        max_rounds: 5
        self_consistency_runs: 3
    reasoner_model: qwen3-local
    self_consistency_runs: 1
    synthesizer_model: claude-sonnet
  default_mode: single
  enabled: true
  timeout_seconds: 120
  token_cap: 32000
