# FedRAMP impact baselines
fedramp_baselines:
  - Low
  - Moderate
  - High
  - LI-SaaS

# DoD/DISA STIG identifier shapes (structural validation, not per-STIG enumeration)
stig:
  vuln_id_min_digits: 5      # V-##### … V-######
  vuln_id_max_digits: 6
  # SRG-XX(-YY)-###### style identifiers must use one of these component codes
  srg_components:
    - OS
    - APP
    - NET
    - DB
    - GPOS
    - APSC
