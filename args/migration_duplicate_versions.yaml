# CUI // SP-CTI
#
# Grandfathered duplicate migration versions — and why each one is safe.
#
# schema_migrations.version is UNIQUE and MigrationRunner.get_pending_migrations
# dedupes by version, keeping the FIRST entry by sort order. Every other entry
# sharing that version is therefore skipped PERMANENTLY and SILENTLY — the
# tables and columns it declares are simply never created.
#
# This file freezes the collisions that already existed as of 2026-07-26 so the
# gate in tools/db/migration_versions.py is actionable instead of perpetually red.
#
# DO NOT ADD ENTRIES HERE to silence a new collision. Renumber the migration to
# the next unused version instead (python tools/db/migrate.py --create "<name>").
# Adding a file to an existing entry shadows one MORE migration and is treated
# as a new violation.
#
# EVERY ENTRY MUST CARRY A REASON. "Grandfathered" was only ever a statement
# that a collision predates the gate, never that it is harmless, and the two are
# not the same: the mvs-audit-03 audit (2026-08-03) rebuilt both backends from
# empty and found SIX entries whose schema no supported backend produced on a
# fresh install — including dashboard_users.role, which rejected four roles the
# RBAC matrix hands out. An entry with no reason is a violation, enforced by
# migration_versions.check()::unexplained_entries.
#
# Re-derive the classification at any time with:
#   python tools/db/shadowed_migration_audit.py \
#       --fresh-db <sqlite built by init_icdev_db.py + migrate.py --up --converge> \
#       --fresh-pg-dsn <postgres built by bootstrap_pg.py + migrate.py --up --converge>
#
# 48 duplicated versions; 60 migrations shadowed. Verdicts as of 2026-08-03:
#   42 benign, 9 not-actually-shadowed, 3 no-DDL, 6 were real gaps (now fixed).
#
