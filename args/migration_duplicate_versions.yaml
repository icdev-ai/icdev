# CUI // SP-CTI
#
# Grandfathered duplicate migration versions.
#
# schema_migrations.version is UNIQUE and MigrationRunner.get_pending_migrations
# dedupes by version, keeping the FIRST entry by sort order. Every other entry
# sharing that version is therefore skipped PERMANENTLY and SILENTLY — the
# tables and columns it declares are simply never created.
#
# This file freezes the collisions that already existed as of 2026-07-26 so the
# gate in tools/db/migration_versions.py is actionable instead of perpetually red.
#
# DO NOT ADD ENTRIES HERE to silence a new collision. Renumber the migration to
# the next unused version instead. Adding a file to an existing entry shadows one
# MORE migration and is treated as a new violation.
#
# 54 duplicated versions; 71 migrations shadowed.
# Regenerate the shadowed list with:
#   python tools/db/migration_versions.py --shadowed --json

