# CUI // SP-CTI
# SOP Workflows — document currency pack (rulebook-driven).
# Generated by: icdev scaffold docmod-pack sop_workflows --flavor rulebook
#
# SCOPE: tool / command / platform drift in standard operating procedures.
# The canonical case is an SOP that still tells the reader to run a build
# through a CI platform the org has retired, or to invoke a CLI that no longer
# exists. Every rule here names a tool, a command invocation, or a hosting
# platform.
#
# EXPLICITLY OUT OF SCOPE: org-structure and role drift ("this SOP names a team
# that no longer exists"). That needs an organizational catalog, which this repo
# does not have. Do not add role/team rules here — file a separate pack instead.
#
# No Python required: the shared RulebookPack evaluator reads the rules file
# below. Write rules in args/docmod/rulebook_sop_workflows.yaml and this pack
# starts finding things on the next docmod sweep.

pack_id: sop_workflows
label: SOP Workflows

# Left DISABLED on purpose. The shipped rules cover industry-wide retirements
# (Travis CI, Docker Compose v1, helm init, ...) and are safe defaults, but they
# have not been validated against this deployment's real document corpus. Run a
# forced scan first (see below), read the findings, tune or delete rules that
# misfire, THEN flip this to true:
#
#   python tools/doc_modernization/scanner.py --json --force
#
# A rulebook edit changes the pack's evidence hash, so a sweep after any edit
# re-scans documents rather than taking the incremental skip.
enabled: false

evaluator: tools.doc_modernization.packs.rulebook_pack.RulebookPack
entity_types: [tool_reference]

# Rules file — the pack's only evidence source.
rulebook_path: args/docmod/rulebook_sop_workflows.yaml

# Defaults for rules that omit these. finding_type MUST be listed in
# tools/doc_modernization/constants.py FINDING_TYPES. Rules pointing at a
# shut-down platform override finding_type to 'stale_reference'.
default_verdict: deprecated
default_finding_type: deprecated_tech
default_severity: medium

# NIST controls this domain implicates, passed to the DocDrift bridge for
# control re-mapping. DECLARED, never inferred from finding text.
#   CM-1 Configuration Management Policy and Procedures — a procedure that
#        invokes a retired build/deploy tool is a stale procedure.
#   SA-5 System Documentation — operating instructions that no longer describe
#        the fielded toolchain.
nist_controls: [CM-1, SA-5]

evidence_sources: [rulebook_sop_workflows]
