# CUI // SP-CTI
# Architecture Patterns — document currency pack (rulebook-driven).
# Generated by: icdev scaffold docmod-pack architecture_patterns --flavor rulebook
#
# SCOPE: obsolete -> modern ARCHITECTURE PATTERN drift in design docs. The
# canonical case is a design or reference document that still prescribes a
# structural approach the industry has moved past — a retired resilience library,
# a 1990s distributed-object RPC stack, a SOAP-first interface, a central ESB, a
# hand-rolled crypto primitive, in-process session state, or a monolithic
# three-tier deployment. Every rule names a NAMED pattern or technology whose
# modern successor is well established.
#
# EXPLICITLY OUT OF SCOPE: tool / command / platform drift in procedures — that
# is the sop_workflows pack. Deployment CONSTRAINTS that are legitimate in this
# product (air-gap / on-prem-only operation is a first-class supported mode here,
# not drift) are deliberately NOT flagged. Do not add rules that contradict a
# supported deployment posture.
#
# No Python required: the shared RulebookPack evaluator reads the rules file
# below. Write rules in args/docmod/rulebook_architecture_patterns.yaml and this
# pack starts finding things on the next docmod sweep.

pack_id: architecture_patterns
label: Architecture Patterns

# Left DISABLED on purpose. The shipped rules cover industry-wide architectural
# supersessions (Hystrix, CORBA/DCOM, SOAP/WSDL, ESB, ...) each with a dated
# authority, but they have not been validated against this deployment's real
# design-document corpus. Architecture prose is looser than command syntax, so
# false positives are the real risk. Run a forced scan first, read the findings,
# tune or delete rules that misfire, THEN flip this to true:
#
#   python tools/doc_modernization/scanner.py --json --force
#
# A rulebook edit changes the pack's evidence hash, so a sweep after any edit
# re-scans documents rather than taking the incremental skip.
enabled: false

evaluator: tools.doc_modernization.packs.rulebook_pack.RulebookPack
entity_types: [architecture_pattern]

# Rules file — the pack's only evidence source.
rulebook_path: args/docmod/rulebook_architecture_patterns.yaml

# Defaults for rules that omit these. finding_type MUST be listed in
# tools/doc_modernization/constants.py FINDING_TYPES. Rules naming a technology
# that is no longer developed/maintained override finding_type to
# 'stale_reference'.
default_verdict: deprecated
default_finding_type: deprecated_tech
default_severity: medium

# NIST controls this domain implicates, passed to the DocDrift bridge for
# control re-mapping. DECLARED, never inferred from finding text.
#   SA-8 Security Engineering Principles — a design that prescribes hand-rolled
#        cryptography or a legacy distributed-object stack violates sound
#        security-engineering guidance.
#   PL-8 Security and Privacy Architecture — the information-security
#        architecture description has drifted from current structural guidance.
nist_controls: [SA-8, PL-8]

evidence_sources: [rulebook_architecture_patterns]
