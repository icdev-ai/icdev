# CUI // SP-CTI
# Architecture Patterns rulebook — the deterministic evidence for this domain.
# Generated by: icdev scaffold docmod-pack architecture_patterns --flavor rulebook
#
# WHAT BELONGS HERE: obsolete -> modern architecture-pattern drift — a design
# document that still prescribes a named structural approach the industry has
# superseded, where a well-established modern successor exists.
#
# WHAT DOES NOT: procedure / tool / command drift (that is sop_workflows), and
# legitimate deployment constraints. On-prem / air-gap operation is a supported
# posture in this product, so it is NOT drift and has no rule here.
#
# Each rule says: "when a document says X, that is out of date, and here is why."
# The verdict comes from the rule, never from an LLM (TRUST rule 1) — the LLM's
# only later role is wording the redline prose around a verdict decided here.
# Findings cite the rule as evidence `rule:<id>`.
#
# Architecture prose is looser than command syntax, so every rule below is
# NARROWED to the anti-pattern phrasing: a bare, still-valid style token (e.g.
# "three-tier architecture", "session affinity") must NOT trip a rule. The
# costly failure mode is a rule that flags every design doc and trains reviewers
# to ignore findings, not a missed match. `citation` gives the authority behind
# the mapping; `confidence` is the seed prior before corpus validation.
#
# Editing this file re-scans every document: the pack hashes these rules as its
# evidence snapshot, so a new rule is picked up on the next sweep.
#
# Defaults if a rule omits them (from args/docmod/packs/architecture_patterns.yaml):
#   verdict: deprecated · finding_type: deprecated_tech · severity: medium

rules:

  # ---- Resilience / fault-tolerance libraries ----------------------------
  - id: arch-hystrix
    pattern: '(?i)\bHystrix\b'
    verdict: deprecated
    finding_type: deprecated_tech
    severity: high
    rationale: >-
      Netflix placed Hystrix into maintenance mode in November 2018 (per its
      GitHub README) and it receives no new features; new resilience designs
      should not standardize on it.
    replacement: Resilience4j, or service-mesh circuit breaking (Istio/Envoy)
    citation: https://github.com/Netflix/Hystrix#hystrix-status
    confidence: 0.9

  # ---- Distributed-object / legacy RPC stacks ----------------------------
  - id: arch-corba-dcom
    # CORBA and DCOM are unambiguous, product-specific acronyms with no common
    # English collision, so bare word-boundary matching is safe here.
    pattern: '(?i)\bCORBA\b|\bDCOM\b'
    verdict: retired
    finding_type: stale_reference
    severity: medium
    rationale: >-
      CORBA and DCOM are 1990s distributed-object RPC stacks; the OMG CORBA
      specification has had no substantive revision since CORBA 3.3 (2012) and
      both are effectively unsupported on modern platforms.
    replacement: gRPC, or a REST API over HTTP/2
    citation: https://www.omg.org/spec/CORBA/
    confidence: 0.85

  # ---- Web-service interface style ---------------------------------------
  - id: arch-soap-wsdl
    # Anchored: SOAP must be adjacent to a service/API/endpoint noun (so "SOAP
    # note", product names, or unrelated tokens do not trip), OR the SOAP-only
    # WSDL descriptor appears.
    pattern: '(?i)\bSOAP(?:[\s-](?:based|first|only))?\s+(?:web\s+)?(?:service|services|API|APIs|endpoint|endpoints)\b|\bWSDL\b'
    verdict: deprecated
    finding_type: deprecated_tech
    severity: medium
    rationale: >-
      SOAP/WSDL interfaces have been superseded for new API design by REST and
      gRPC across the industry since roughly 2015; SOAP-first designs carry XML
      envelope overhead without modern tooling support.
    replacement: a REST/JSON or gRPC interface
    citation: https://learn.microsoft.com/en-us/azure/architecture/best-practices/api-design
    confidence: 0.7

  # ---- Integration topology ----------------------------------------------
  - id: arch-esb
    pattern: '(?i)\bEnterprise\s+Service\s+Bus\b|\bESB\b'
    verdict: deprecated
    finding_type: deprecated_tech
    severity: medium
    rationale: >-
      The centralized Enterprise Service Bus integration pattern has been in
      decline since Gartner's 2015-2016 guidance favoring lightweight API
      gateways and event streaming; a central ESB becomes a scaling and
      deployment bottleneck.
    replacement: an API gateway plus event streaming (e.g. Kafka), or a service mesh
    citation: https://learn.microsoft.com/en-us/azure/architecture/microservices/design/interservice-communication
    confidence: 0.7

  # ---- Cryptography design -----------------------------------------------
  - id: arch-diy-crypto
    # The qualifier must sit immediately before a crypto noun, so "custom
    # dashboard" or "bespoke workflow" do not match — only custom cryptography.
    pattern: '(?i)\b(?:hand-?rolled|home-?grown|home-?brew(?:ed)?|custom|bespoke|proprietary|DIY|roll(?:ing|ed)?\s+(?:your|our|its)\s+own)\s+(?:crypto\w*|cipher|encryption\s+(?:algorithm|scheme|routine))'
    verdict: deprecated
    finding_type: deprecated_tech
    severity: high
    rationale: >-
      Implementing bespoke cryptographic primitives is a long-standing
      anti-pattern; OWASP and NIST guidance direct designers to standard,
      peer-reviewed algorithms and vetted libraries rather than custom crypto.
    replacement: a vetted cryptographic library (libsodium, BouncyCastle, or the platform crypto provider)
    citation: https://owasp.org/www-community/vulnerabilities/Using_a_broken_or_risky_cryptographic_algorithm
    confidence: 0.75

  # ---- Session / state management ----------------------------------------
  - id: arch-inproc-session
    # Requires the full "... session state" phrase after the qualifier, so a
    # stateless "session token" is not flagged, nor is a still-valid
    # load-balancer "session affinity" setting.
    pattern: '(?i)\b(?:in-?memory|in-?process|server-side)\s+session\s+state\b'
    verdict: deprecated
    finding_type: deprecated_tech
    severity: medium
    rationale: >-
      Storing session state in-process pins a user to one instance and blocks
      horizontal scaling; the 12-Factor App methodology (Factor VI, published
      2011 onward) requires stateless processes with state externalized to a
      backing service.
    replacement: stateless token-based auth (e.g. signed JWT), or an externalized session store (Redis)
    citation: https://12factor.net/processes
    confidence: 0.7

  # ---- Deployment decomposition ------------------------------------------
  - id: arch-monolithic-three-tier
    # NARROW BY DESIGN: plain "three-tier architecture" is a legitimate, still
    # valid style and must stay clean. Only the monolithic variant — a single
    # web/app/DB stack scaled as one unit — trips this rule.
    pattern: '(?i)\bmonolithic\s+(?:three|3)[\s-]tier\b|\b(?:three|3)[\s-]tier\s+monolith(?:ic|s)?\b'
    verdict: deprecated
    finding_type: deprecated_tech
    severity: low
    rationale: >-
      A monolithic three-tier deployment scaled as one unit limits independent
      scaling and deployment; cloud-native guidance since roughly 2015 favors
      decomposing the application tier into independently deployable services.
    replacement: independently deployable microservices behind an API gateway
    citation: https://learn.microsoft.com/en-us/azure/architecture/guide/architecture-styles/n-tier
    confidence: 0.6

# ---------------------------------------------------------------------------
# ORG-SPECIFIC RULES — uncomment and tune, do not ship as-is
# ---------------------------------------------------------------------------
# The rules above are industry-wide supersessions. The architecture drift that
# actually bites is often local: a home-grown framework the org retired, a
# bespoke message bus it migrated off. Those cannot ship enabled by default
# because both the pattern and the successor are only knowable per deployment.
# Copy a block, fill in your own names, and validate against a forced scan
# before enabling the pack.
#
#   - id: arch-org-legacy-framework
#     pattern: '(?i)\b<YourLegacyFramework>\b'
#     verdict: retired
#     finding_type: stale_reference
#     severity: high
#     rationale: <Framework> was retired on <DATE>; new services build on <SUCCESSOR> per <ADR/CHANGE RECORD>.
#     replacement: <the current internal platform/framework>
#     citation: <link to the ADR or change record>
#     confidence: 0.95
