# CUI // SP-CTI
# exa-bench-03 — DECLARED agent-adapter capabilities.
#
# Consumed by: tools/agents/capability_matrix.py :: load_declarations
#
# EVERY VALUE IN THIS FILE IS A CLAIM, NOT A MEASUREMENT.
#
# That is the point. This file is the hand-written parity table ICDEV has always
# had; `python tools/agents/capability_matrix.py --json` is what checks it. The
# probe reports each claim next to what it could actually observe at the
# AgentAdapter seam, and the interesting rows are the ones where they disagree:
#
#   confirmed          declared true,  probe observed it
#   OVERCLAIMED        declared true,  probe observed its ABSENCE  <- fix these
#   unverified         declared true,  probe could not determine it
#   undeclared_present declared false, probe observed it anyway    <- update this file
#
# Do NOT edit a value here to make the probe agree. If a row comes back
# overclaimed, either the adapter is missing the capability (fix the adapter) or
# the claim was never true (fix the claim, and say so in a comment). Editing the
# claim to silence the probe reproduces exactly the failure this card is about:
# a parity table that agrees with itself and with nothing else.
#
# The capability names are fixed by CAPABILITIES in capability_matrix.py.
# A name not in that set is ignored — there is no probe that could measure it.
#
# `claude_route` (omx-adapt-04) is the one NON-boolean claim: native_subscription
# | cli_bridge | none. The operator pays for Claude with the claude.ai
# subscription only, so a harness without a native login reaches Claude through
# `icdev claude-bridge serve` and a metered API key is never used. The probe
# fails a route the adapter cannot actually take (an overclaim).
#
# An adapter that would rather own its claim in code can expose a `CAPABILITIES`
# mapping on the adapter object; that wins over this file. Nothing does yet.

declared:

  # Backed by the Claude Code CLI, which does the first seven natively. This block is
  # the brochure claim — the probe scores the ADAPTER, not the product, because
  # a capability the CLI has and the adapter does not surface is unreachable by
  # everything routing through pick_default().
  #
  # omx-adapt-01 corrected three rows the probe had measured absent since
  # exa-bench-03, which kept `capability_matrix.py --gate` exiting 1 on main:
  # the CLI calls tools, runs sub-agents and takes permission modes, but the
  # ADAPTER surfaces none of them -- parse_response() returns tool_calls=[],
  # there is no delegation entry point, and the argv always carries
  # --dangerously-skip-permissions. Fix the adapter, then flip these back.
  claude_cli:
    streaming: true            # spawn() hands back the live process
    tool_calling: false        # CLI runs tools; parse_response() reports none
    sub_agents: false          # CLI has a Task tool; the seam cannot reach it
    interruption: true         # the caller owns the spawned process
    sandbox_passthrough: false # argv fixes --dangerously-skip-permissions
    context_budget: true       # --max-turns
    structured_output: true    # --output-format json
    guard_shell: true          # measured: Claude Code runs commands via $SHELL (omx-guard-04, Linux)
    claude_route: native_subscription  # claude auth status -> claude.ai (omx-spike-02); build_env scrubs metered keys (omx-adapt-04)

  # exa-bench-01. `codex exec --json` emits a JSONL event stream that the
  # adapter parses into AgentResult.structured, and --sandbox is a real flag.
  # No spawn(): nothing dispatches Codex non-blocking yet, so there is nothing
  # to stream from and nothing to kill.
  # omx-adapt-01: streaming corrected to false (measured absent) -- the CLI
  # streams JSONL, but with no spawn() the caller only sees it after exit.
  codex_cli:
    streaming: false           # JSONL arrives only in the returned result
    tool_calling: true
    sub_agents: false
    interruption: false
    sandbox_passthrough: true  # --sandbox, per-session via metadata
    context_budget: false      # the CLI takes no turn/token flag
    structured_output: true
    guard_shell: false         # measured: codex execs its shell by absolute path, L2 cannot see it (omx-guard-04)
    claude_route: none         # OpenAI-shaped, so the bridge SHOULD apply -- unmeasured (omx-spike-02); setup writes no codex config

  # OPT-71. A single-shot router completion. It produces prose: no tools, no
  # files, no stream.
  local_llm_router:
    streaming: false
    tool_calling: false
    sub_agents: false
    interruption: false
    sandbox_passthrough: false
    context_budget: true       # LLMRequest(max_tokens=session.max_tokens)
    structured_output: false
    guard_shell: false         # runs no commands
    claude_route: none         # the router's own claude-cli provider is a router policy (cli_bridge.mode), not this adapter's route

  # hgx-exec-02. The owned rubric-gated loop with the worktree toolset.
  # omx-adapt-01 corrected two rows measured absent: the loop uses tools but
  # parse_response() reports none, and the traversal guard is fixed by the
  # adapter -- a caller cannot CHOOSE a sandbox mode, which is what the
  # capability means.
  local_agent:
    streaming: false
    tool_calling: false        # tools run in the loop; the seam reports none
    sub_agents: false
    interruption: true         # metadata['stop_event']
    sandbox_passthrough: false # traversal-guarded, but not caller-selectable
    context_budget: true       # max_iterations / max_tokens into the loop
    structured_output: true    # grades + verdict on AgentResult.structured
    guard_shell: false         # run_command is an in-process allowlist, not a shell
    claude_route: none         # in-process loop over the router; see local_llm_router

  # exa-bench-02 will implement this. A stub claims nothing; every row below is
  # false so the probe's "absent" findings agree rather than reading as gaps.
  copilot_cli:
    streaming: false
    tool_calling: false
    sub_agents: false
    interruption: false
    sandbox_passthrough: false
    context_budget: false
    structured_output: false
    guard_shell: false         # not measured: copilot was not logged in on the probe host
    claude_route: none         # Claude via Copilot is billed by GitHub; BYOK to the bridge unmeasured (omx-spike-02)

  # omx-adapt-01. Only what omx-spike-01 measured (docs/research/omx-spike-01/
  # findings.md): `opencode run --format json` emits JSONL whose tool_use
  # events and step_finish token counts parse_response() recovers. `run` has no
  # sandbox, turn or token flag and the adapter has no spawn().
  opencode_cli:
    streaming: false           # no spawn(); JSONL arrives with the result
    tool_calling: true         # tool_use events, incl. guard-refused ones
    sub_agents: false
    interruption: false
    sandbox_passthrough: false # opencode run takes no sandbox flag
    context_budget: false      # ...nor a turn/token budget
    structured_output: true    # tokens, cost, stop reason, session id
    guard_wired: true          # icdev-guard.ts plugin -> harness_guard bridge, live-probed (omx-guard-01)
    guard_shell: true          # measured: opencode runs commands via $SHELL (omx-guard-04, Linux)
    claude_route: cli_bridge   # no Anthropic login; bridge round trip measured GO (omx-spike-02); provider icdev-claude (omx-adapt-04)

  # omx-adapt-02. Only what omx-spike-01 measured for Pi (findings.md, "Pi"):
  # `pi --mode json` emits JSONL whose tool_execution_* records and per-message
  # usage parse_response() recovers. No sandbox, turn or token flag, no spawn().
  pi_cli:
    streaming: false           # no spawn(); JSONL arrives with the result
    tool_calling: true         # tool_execution_end, incl. guard-refused ones
    sub_agents: false
    interruption: false
    sandbox_passthrough: false # pi --mode json takes no sandbox flag
    context_budget: false      # ...nor a turn/token budget
    structured_output: true    # usage, cost, stopReason, session id
    guard_wired: true          # -e icdev-guard.ts extension -> harness_guard bridge, live-probed (omx-guard-03)
    guard_shell: false         # measured: pi execs /bin/bash by absolute path (omx-guard-04)
    claude_route: cli_bridge   # its own Anthropic OAuth is REFUSED (400 "extra usage", omx-spike-02); bridge measured GO
