# FathomDesk — SCALE-25K preset (Phase 4 tier 2)
#
# Crosses the PDT threshold ($25k+) — unlocks unlimited day trades.
# Promotes from scale_10k after ≥2 weeks clean. SHORT remains gated until tier 3.

fathomdesk:
  version: "4.0.0-scale-25k"
  mode: "live"
  rollout_phase: "scale_25k"

  watchlist:
    equities: ["AAPL", "MSFT", "GOOGL", "NVDA", "META", "AMZN", "TSLA", "AVGO", "AMD", "NFLX"]
    crypto: ["BTC/USD"]

  risk:
    max_portfolio_usd: 25000.0
    max_position_pct: 0.020          # 2.0%
    max_positions: 12
    max_orders_per_day: 15
    max_orders_per_ticker_per_day: 2
    daily_loss_limit_pct: -0.020     # -2.0%
    drawdown_warn_pct: -0.010
    drawdown_halt_pct: -0.020
    max_portfolio_var: 0.030

  analysis:
    debate_rounds: 2
    min_confidence: 0.65
    auto_execute: true
    auto_approve_buy_min_confidence: 0.75
    require_human_approval_for_sell: false   # SELL auto OK at this tier

  signal_weights:
    fundamental: 0.25
    technical: 0.20
    sentiment: 0.10
    news: 0.10
    macro: 0.25
    perspective: 0.10

  shorting:
    enabled: false                    # still gated — requires locate stub + tier 3

  broker:
    provider: "alpaca"
    base_url_env: "ALPACA_BASE_URL"
    cancel_open_orders_on_kill: true

  audit:
    persist_every_event: true
    retain_days: 730
