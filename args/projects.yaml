- key: kpr
  name: KPR — Kanban Pipeline Repair
  task_prefix: kpr-
  description: 'Close the remaining self-blocking failures in the Governed Delivery
    Pipeline. Two were already fixed on 2026-08-02: PR #1219 (the watcher could never
    auto-merge an unapproved PR because require_approval was hardcoded into the DONE
    path, defeating auto_merge_require_approval) and PR #1226 (a task''s PR was
    invisible unless executor_url happened to be written by the one path that writes
    it, so 10 green PRs were stranded). This card covers what those two exposed. The
    core defect: _enforced_done_ok reads only the LATEST kanban_verifications row,
    and nothing can write a fresh one except a new dispatch — so a task that verifies
    badly once is blocked until it is re-dispatched, and re-dispatch opens a NEW PR
    on a suffixed branch instead of reusing the old one. gdx-aud-01 carrying three
    open PRs (#1135, #1220, #1221) is that loop made visible. Measured blocks as of
    2026-08-02: tsr-core-01-d5 held by "No git commits found on task branch" while
    PR #1146 is green with real changes, and gdx-aud-01 held by an auto-remediation
    that committed 400 uncommitted files.'
  briefs:
  - 'reverify: recompute a task verification against current branch state and write a
    fresh row, so a stale or failed record can be cleared without re-dispatching'
  - 'dedupe: a retry must reuse the task''s existing PR rather than open another one'
  - 'unblock: clear the PRs already green and waiting'
  epics:
  - key: gate
    title: Manual Gate
    priority: critical
  - key: rvfy
    title: RVFY — Re-verification path
    priority: critical
  - key: dup
    title: DUP — One task, one PR
    priority: high
  - key: fix
    title: FIX — Repair the one genuinely failing PR
    priority: high
  - key: stale
    title: STALE — Refresh green PRs gone stale against main
    priority: medium
- key: sdt
  name: SDT - Slides Deck-Type Vocabulary Repair
  description: 'Carded out of TSR. tsr-dash-01-d5 found, and its merged report
    (docs/testing/tsr-dash-01-d5-ambient-fixtures.md section 3) documented, a
    production defect it deliberately left unfixed because the repair is a
    schema change outside a test-remediation card: tools/slides/blueprint.py
    persists deck_type="template_fill" for every template-fill deck, and
    "template_fill" is not in tools/slides/constants.py::DECK_TYPES, from which
    CHECK_DECK_TYPE and therefore the slides_decks CHECK constraint derive. The
    route cannot persist a deck against a correctly-created schema; it only
    appears to work on a database whose slides_decks predates the constraint,
    which is why a clean checkout surfaces it and the shared checkout does not.
    PREMISE CORRECTION verified 2026-08-03 on origin/main: the reported symptom
    has already changed. All 9 tests in tests/slides/test_blueprint.py
    TestTemplateFillRoutes now fail with 401, not with the CHECK violation,
    because the write routes gained require_role(*_SLIDES_WRITE_ROLES) while the
    client fixture never authenticates - _upload returns None and every
    downstream assertion dies on a NoneType subscript. The deck_type defect is
    real but latent behind the auth wall, so it is reachable only after the
    fixture is fixed. Two independent defects, one test file. SECOND CORRECTION:
    the d5 report prescribes editing the hardcoded list in
    tools/slides/db/migrations/002_rich_slides.sql, which cannot work - the
    slides applier skips any migration whose version is not greater than the
    stored one, so an already-applied file never re-runs. Existing databases
    need a NEW migration. DESIGN CONSTRAINT: DECK_TYPES is not only the CHECK
    vocabulary, it is also passed to the index and new-deck templates as the
    user-facing deck-type picker (blueprint.py lines 131 and 141). A
    template-fill deck is produced by uploading a .pptx and filling its shapes,
    never chosen from a menu, so appending it to DECK_TYPES would fix the
    constraint by polluting the wizard. The persisted vocabulary and the
    selectable vocabulary have to become two constants.'
  task_prefix: sdt-
  default_open: true
  briefs:
  - 'AUTH: the client fixture in tests/slides/test_blueprint.py predates the
    require_role gate on the seven slides write routes, so all 9
    TestTemplateFillRoutes tests 401 before reaching the code they test. Fix the
    fixture, not the routes - the gate is correct and deliberate (costly LLM
    spend and destructive upload/edit/delete belong to authoring roles). Follow
    tests/bi_dashboard/test_routes_auth.py, which mirrors _auth_before_request
    by populating g.current_user, and keep the unauthenticated cases that assert
    400 on a bad upload honest rather than blanket-authenticating the whole file
    (sdt-auth-01)'
  - 'VOCAB: split the deck-type vocabulary in tools/slides/constants.py -
    DECK_TYPES stays the selectable set the picker renders, a new
    SYSTEM_DECK_TYPES carries template_fill, and CHECK_DECK_TYPE derives from
    the union so a system-generated deck satisfies the constraint without
    appearing in the wizard. Mirror to icdev/tools/slides/constants.py. Do NOT
    fix this by changing the test expectation or by having the route persist
    "custom" - the deck_type is the provenance of how the deck was made and
    flattening it loses that (sdt-vocab-01)'
  - 'MIG: a new slides migration for databases that already carry the old CHECK.
    PostgreSQL takes DROP CONSTRAINT / ADD CONSTRAINT; SQLite cannot alter a
    CHECK in place and needs the create-copy-drop-rename rebuild. Note the
    applier splits on semicolons and swallows every statement error, so a
    half-applied rebuild would be silent - verify the end state rather than the
    absence of an exception (sdt-mig-01)'
  - 'VV: a regression test proving both halves - a template_fill deck persists
    against a freshly initialised schema, AND template_fill is absent from the
    picker vocabulary the templates receive. The first assertion alone would be
    satisfied by the naive fix this card exists to avoid (sdt-vv-01)'
  epics:
  - key: auth
    title: AUTH — Test fixture reaches the gated routes
    priority: critical
  - key: vocab
    title: VOCAB — Split persisted from selectable deck types
    priority: critical
  - key: mig
    title: MIG — Existing databases
    priority: high
  - key: vv
    title: VV — Regression proof
    priority: high
- key: kax
  name: 'KAX - Kanban Autonomy Hardening'
  description: 'Remove the remaining reasons a human has to touch the board. Scope set from measurement 2026-08-07, not speculation. The first and largest gap is already fixed in PR #1318 (the launcher never started tools/ci/pr_watcher.py, so after its last manual start died on Aug 2 nothing merged CI-green PRs; tasks-reaching-done was 63 on Aug 1 and 121 on Aug 2, then ZERO for Aug 4-6, and it presented as "the dispatcher stopped working" while the dispatcher was idle and correct). What remains are the two failure modes that still require a person. (1) CONFLICT - a PR whose branch has drifted behind main goes DIRTY and no automation rebases it; 2 of 5 open kanban PRs were DIRTY when measured, and xbm-wake-01 sat parked 95.7 hours before escalating "resume cap reached (5/5) - manual intervention required". The escalation itself is correct behaviour; the gap is that nothing attempts the cheap recovery (rebase onto main, push, let CI re-run) before spending a resume, so branches that merge fine after a rebase burn all five attempts and land in a human queue. (2) STALL - nothing watches throughput. The four-day flatline above was found because a human noticed, not because the system said anything, even though an alerts table and a self_monitor reflex already exist. A rule of the shape "no task reached done in N hours while tasks are scheduled" would have fired on day one. Both epics are about making the pipeline notice and repair itself; neither should be built as a new subsystem when the recovery paths and the alerting table already exist - grep first.'
  task_prefix: kax-
  default_open: true
  briefs:
  - |-
    EXEC - the executor-availability path lies about why it gave up, and one dead
    session disables the only working executor for everything else. Traced end to end
    2026-08-12 after two tasks (exa-policy-08, exa-live-01) were quarantined to
    suggested within a 5-minute window and had to be rescued by hand - which is exactly
    the "reason a human has to touch the board" this card exists to remove. Four
    defects, in the order they fire. (1) An operator kill is classified as token
    exhaustion: _detect_token_exhaustion returns True for exit_code < 0 or >= 128, which
    is deliberate and right for an OOM kill (park, preserve the branch) but cannot tell
    an OOM from a person stopping a stuck task. (2) That classification runs
    _degraded_executors.add("claude_cli") with resume_at = now + 300s, so ONE task's
    death removes the primary executor for EVERY other task for five minutes. (3) The
    safety net does not fire: _build_effective_executor_chain ends "if active: return
    active" and only falls back to the original chain when EVERY tier is degraded - but
    nothing ever marks gitlab or ollama_local degraded, because they are never
    successfully tried, so degrading claude_cli always yields a non-empty chain of
    functionally dead fallbacks and quarantine becomes guaranteed rather than possible.
    (4) The reason string is a LITERAL: kanban.py line ~6163 emits "no executor
    available: internet=False, gitlab=unreachable, ollama=unreachable" with nothing
    probing internet, gitlab or ollama. That is why this reads as a network outage when
    the CLI resolves fine, and it is why the 2026-08-01 incident (25 tasks quarantined,
    root cause PATHEXT resolution in claude_cli.py) produced the SAME message from a
    completely different cause. Fixing the message is what makes the other three
    diagnosable. Fifth, smaller: _degraded_executors is module-level in-memory state, so
    with more than one scheduler process the degradation is per-process and inconsistent
    - exa-policy-05 re-dispatched fine at 03:29:56 while exa-live-01 was quarantined 23
    seconds earlier, inside the same window, from a different scheduler
    (kax-exec-01..03)
  epics:
  - key: conflict
    title: CONFLICT - Auto-rebase a drifted PR before spending a resume
    priority: high
  - key: stall
    title: STALL - Alert when board throughput goes to zero
    priority: high
  - key: merge
    title: MERGE - The CLI can land a PR, not just refuse to mark it done
    priority: high
  - key: obs
    title: OBS - pr_watcher liveness is observable
    priority: high
  - key: recover
    title: RECOVER - Autonomous recovery must not act on stale or non-code failures
    priority: high
  - key: exec
    title: EXEC - Executor availability must report the truth and degrade in scope
    priority: high
- key: agov
  name: 'AGOV - Agent Governance (detection, forensics, unattended approval)'
  description: 'Adapt the four things ICDEV genuinely lacks from perplexityai/numbat
    and andrewyng/openworker, and NOTHING else. Scope was set by measuring the repo
    on 2026-08-08, not by reading the two READMEs. PRIOR ART IS CLOSED AND MUST NOT
    BE REOPENED: openworker''s risk.py (READ/WRITE_LOCAL/EXEC/EXTERNAL) is strictly
    WEAKER than what ICDEV already ships in args/agent_approval_policy.yaml plus
    tools/agent_runtime/approval_gate.py, which fails CLOSED on an unenumerated tool
    (default_tier unknown, unknown in require_approval_tiers) and has the
    escalation-asymmetry and command_tools carve-out openworker lacks entirely - do
    not "adopt" it, do not refactor toward it. numbat''s artifact scanning is covered
    by SIPA (tools/integrity/, 39 modules, 5 tables, static-only contract). numbat''s
    OTLP receiver is OUT OF SCOPE: args/otel_collector_config.yaml plus
    tools/observability_canvas/mitre_coverage_twin.py ingest_otel_batch already cover
    it and an in-repo receiver buys nothing. openworker''s personas, skills,
    connectors and desktop shell are covered by 90 role YAMLs in args/ace/roles/, 24
    .agents/skills/icdev-*/SKILL.md, ~44 connectors across tools/databridge and
    tools/gateway, and the icdev chat terminal REPL. WHAT SURVIVES IS FOUR GAPS.
    (1) DET - ICDEV writes rich agent activity into hook_events (HMAC-signed,
    session_id-keyed), agent_executions, ai_telemetry, audit_trail and ace_audit_log,
    and never reads any of it back for detection. There is no rule engine over the
    event stream at all; every block is hardcoded Python in a 1250-line
    .claude/hooks/pre_tool_use.py and the only config-driven rule family is
    args/file_access_tiers.yaml. The consequence that matters is that ICDEV cannot
    express a multi-step chain - "read .env, then POST to an external host" is
    invisible because every check is single-action. Also
    tools/observability/sigma_generator.py emits Sigma rules and nothing consumes
    them. (2) CASE - grep for session_replay / reconstruct_session / session_timeline
    returns ZERO. The forensic raw material exists and is already tamper-evident
    (hook_events.signature HMACs, hash-chained audit from migration 149) but nothing
    joins it by session_id and nothing exports it; SWFT (tools/compliance/
    swft_evidence_bundler.py) and SIPA bundle software supply-chain evidence, not
    agent behaviour. (3) INBOX - tools/agent_runtime/safety.py:78 console_approver
    DENIES ON EOF and approval_gate.py:403 does the same before falling back to
    deny_all_approver, so a headless overnight SAG or cron run refuses every
    irreversible action, and the only way round it today is to inject an
    auto-approver, which discards the gate entirely. openworker''s insight is that
    unattended is NOT an autonomy setting: it does not change what the agent may do
    (the permission mode does), it changes WHERE the ask is delivered - route it to
    an inbox and suspend the session instead of blocking on a console nobody is
    watching. ICDEV has every piece and has joined none: four separate approval gates
    (ace/coworker_thread.py HITLGate, agent_runtime/approval_gate.py,
    integration/approval_manager.py, workflow_hitl/gate.py) and several unrelated
    inbox modules (document_intelligence/inbox.py, agent/mailbox.py,
    agentic_ai_canvas/findings_inbox.py). (4) WAKE - an agent cannot schedule its own
    resumption; ICDEV has external scheduling only (124 Genesis reflexes,
    agent_cron_jobs, the kanban scheduler), so nothing can say "wake me when PR #1342
    goes CI-green". MANUAL-ONLY: this card touches .claude/hooks/pre_tool_use.py and
    the approval gate, and tools/ci/pr_watcher.py auto-merges any CI-green kanban/*
    branch, so every task is gated behind agov-gate-00 via depends_on_task_id (the
    held gate row alone does not hold - the dependency is what
    promote_backlog_to_scheduled.py actually checks) and every PR opens --draft.'
  task_prefix: agov-
  default_open: true
  briefs:
  - 'DET: the core. A rule is one YAML file under args/agent_rules/ with
    id/version/title/severity/tags/enabled/enforce/deny_message and either a
    single-event expr or a sequence, evaluated against a normalized read-only view
    over the tables ICDEV already writes. Monitor-only by DEFAULT - enforcement is
    opt-in per rule in an operator-controlled directory, and detection and
    enforcement share one expression. Conditions are STRUCTURED YAML MATCHERS in the
    style already proven by args/agent_approval_policy.yaml and
    args/file_access_tiers.yaml - decided against CEL and against a restricted-AST
    evaluator, because no new third-party dependency is acceptable here and a
    hand-rolled expression evaluator is a security surface ICDEV would have to
    defend. A second, concrete payoff: agent_approval_policy.yaml:110-116 documents
    a real fail-open it had to work around, where a git_push carrying
    {"note": "mkdir logs"} matched the mkdir DOWNGRADE pattern because patterns run
    against a flattened string; a parsed shell view is the actual fix for that bug
    class (agov-det-01..07)'
  - 'CASE: join the existing per-session records into an ordered timeline and export
    a portable, SHA-256-manifested case bundle that can be verified independently.
    Reuse swft_evidence_bundler.py and prov_recorder.export_prov_json rather than
    writing a third bundler. Verification must re-check the hook_events HMACs and
    the migration-149 hash chain and name WHICH records failed, not return a
    boolean. CLI-only on purpose: a dashboard page would trigger the 8-component
    completeness gate (template + icdev/ mirror + route + module + constants +
    migration + nav + full IQE wiring) and that is a separate card
    (agov-case-01..04)'
  - 'INBOX: separate the autonomy ceiling from the delivery channel. The seam is
    already clean - Approver in approval_gate.py is an injectable callable and every
    gateway adapter exposes the same send_message(channel_user_id, text, thread_id) -
    so an inbox approver is a DROP-IN with no gate signature change. Deliver with an
    embedded [icdev:<item_id>] correlation token so a Slack/Teams/Telegram/email
    reply resolves the right item; in-app is the store of record and channels are
    mirrors. The load-bearing test is that an irreversible action is still GATED in
    unattended mode and merely routed - without it this feature silently becomes an
    auto-approver (agov-inbox-01..05)'
  - 'WAKE: a WakeStore (PENDING -> DUE -> FIRED) plus four agent tools - sleep_for,
    sleep_until, wake_on(job_id), wake_on_event(key). Tick it from the existing
    genesis/reflexes/agent_cron_reflex.py; do NOT add a daemon. Fire event keys from
    tools/ci/pr_watcher.py and the kanban pipeline so "wake me when PR #N is green"
    works, which is the same failure mode that produced a four-day board flatline
    (agov-wake-01..03)'
  epics:
  - key: det
    title: DET - Declarative detection rules over the agent event stream
    priority: high
  - key: inbox
    title: INBOX - Unattended mode and a unified approval inbox
    priority: high
  - key: case
    title: CASE - Agent-session timeline and portable case bundle
    priority: medium
  - key: wake
    title: WAKE - Agent-scheduled resumption
    priority: medium
- key: hgx
  name: HGX - Harness Agent Parity and Graph Runtime
  description: 'Promote ICDEV from a platform that ORCHESTRATES agent harnesses into
    one that IS one. Research 2026-08-08 found five agentic execution surfaces built
    on one primitive (icdev/tools/llm/agent_loop.py, 2161 lines, 143 tests) - SAG
    interactive, ACE coworkers, the kanban rubric loop, the ANVIL agentic runner and
    cortex.agent(mode=single) - each re-deciding its own toolset, safety gate and
    audit trail. The abstraction built to unify them (tools/agents/adapter_base.py
    AgentAdapter + registry.pick_default, OPT-71, four adapters, config at
    args/agent_adapters.yaml) has ZERO consumers. The only executor that can
    autonomously edit files is the vendor claude CLI - args/agent_adapters.yaml says
    so in a comment and _dispatch_via_llm_router says so in its docstring. The owned
    alternative (_dispatch_via_rubric_loop, KANBAN_RUBRIC_LOOP, default off) has five
    tools and no shell, search, test-run or git. SCOPE BOUNDARY, PRIOR ART IS CLOSED -
    the graph layer proposed in plans/agent-runtime-implementation-plan.md and the
    four C:\AI\searches graph-engine docs is LARGELY ALREADY BUILT and those docs are
    wrong on inventory. tools/studio/workflow_runner.py is a durable DAG runtime with
    node_type human gates that survive restart, a single approval inbox via
    gate_bridge.py, run-scoped memory, retries and per-node tool authorization (gate
    MCP-WF-001 in args/security_gates.yaml is Video 3 refund-example isolation,
    already shipped). tools/agent/team_orchestrator.py already does wave-parallel DAG
