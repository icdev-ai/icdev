- key: trust
  name: TRUST — Trustworthy Generation Hardening
  description: Guarantee that everything ICDEV builds and generates cites its sources
    with real data provenance, and that the entire ecosystem enforces data masking.
    Ports DIC's mandatory-citation + abstention model to /rfi and /proposals, makes
    redaction fail-closed with ingestion-time masking and scheduled DB scanning, and
    wires the confabulation detector into every drafting pipeline. Plan file
    .claude/plans/we-implement-anti-hallucination-and-clever-canyon.md.
  task_prefix: trust-
  default_open: true
  briefs:
  - 'cite: Universal citation & provenance — extract a shared citation_grounding core
    from DIC, add mandatory [source:] citations + blocking gate to /proposals and /rfi,
    attach a PROV lineage object to every generated artifact, materialize
    rag_provenance_ledger, and cover generated child apps (trust-cite-01..05)'
  - 'mask: Fail-closed data masking — abort LLM egress when the sanitizer is
    missing/errors, mask at RAG ingestion and document upload, add a scheduled DB-scan
    + remediation reflex, populate the GovCon deny-lists, and add core-engine unit
    tests (trust-mask-01..05)'
  - 'halluc: Anti-hallucination consistency — wire confabulation_detector.check_output
    into the RFI/proposals/DIC generation post-pass and decide the CoD default for
    judgment/architecture sections (trust-halluc-01..02)'
  - 'xcut: Cross-cutting — coherence-checker assertions for citation/ingestion/sources
    coverage plus a CLAUDE.md guardrail and append-only table registration
    (trust-xcut-01..02)'
