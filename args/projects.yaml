  description: 'Successor to cxo (21/21 done). Cortex is ~11k lines, well-architected, and almost entirely SWITCHED OFF — the finding is activation and enforcement, not performance. Measured 2026-08-13 against the live tree. (1) check_vendor_parity, shipped BY cxo-doc-03 to catch exactly this, cannot fire: coherence_checker.py:8313 SKIPS a vendored consumer whose path is absent, and compass/idea_lab are separate private repos ICDEV CI never checks out, so the gate returns pass even with --gate and --changed-files tools/cortex/client.py (verified by simulating an absent root). Root cause is repo topology, not OS — /home/me/standalone skips exactly as C:/AI/standalone does. Consequence: both vendored clients are 2 public methods behind (CortexClient.reason, .agent, added ce78c1aeb 2026-08-09) and vendor_parity.yaml still says last_synced 2026-08-02. (2) tests/cortex/ holds 50 modules; 56 cortex-named modules sit in ci_test_backlog.txt and exactly ONE cortex-related file is gated — so test_tenant_isolation, test_egress_redaction, test_provenance_gate, test_service_keys, test_rest_scopes and test_governance_* have never gated a merge on the one component that enforces tenant isolation, Bell-LaPadula read-down and egress redaction. (3) Five correctness defects that make governance report more than it does: cortex.ask(summarize=True) calls LLMRouter().invoke("summarization"), which is declared ONLY under task_categories and not under routing, so it silently falls back to routing.default whose chain is cloud-first (kimi-cloud first) with no exclude_model_ids and no assert_airgap_ready coverage — an air-gap violation on a CUI path, then swallowed and relabelled with a STRONGER trust label; rest_v1.py re-wraps four already-governed facades so the TRUST chain runs TWICE (2x provenance rows, 2x cortex_audit rows, double-counted metrics) — a defect the codebase documents in its own comment at rest_v1.py:378; the IQE cortex adapters close a caller-owned connection in finally and