    — it holds 129 rows including 65 codegen. The real defect is sharper and was missed: 123 of 129 rows
    have actual_outcome IS NULL, so compute_metrics (which counts only resolved/false_positive/self_resolved/failed)
    derives precision, recall and ECE from roughly six rows. Decisions are recorded; outcomes are not.
    Root cause is record_outcome (tools/genesis/harness/eval_harness.py) issuing a bare UPDATE with no
    rowcount check — when no decision row exists the update touches zero rows and returns silently, so
    every caller believes it succeeded. Two further verified findings: context/capabilities/harness.yaml
    advertises five CLI invocations across three tools that exist nowhere in the repo, and the Claude
    auto-memory path is hardcoded per-machine in two modules while a dynamic derivation of the same slug
    already exists in memory_write.py. This card fixes measurement only — it is the prerequisite for
    the arr and clx cards, both of which are gated behind it.'
