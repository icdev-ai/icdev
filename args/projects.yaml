- key: agx
  name: 'AGX — Agentic Architecture Extension'
  description: 'Adapt the transferable subset of FareedKhan-dev/all-agentic-architectures
    (MIT, 35 patterns on LangGraph) into ICDEV without adopting its stack. ICDEV already
    runs 22 of the 35 in production (CoT=Reflection, reflexion_agent, CoD=Debate,
    invoke_council=Ensemble, agent_loop=ReAct/ToolUse, graph_rag=GraphRAG, NOVA
    skill_generator=Voyager, sandbox_execute=SWE-Agent, SafetyGate=Dry-Run, ...), so
    this card deliberately does NOT rebuild them. Scope is one discipline, one enabler,
    five real gaps, and one honesty mechanism. (a) The deterministic-picker discipline
    — the LLM may only commit to booleans/enums and Python composes every final score,
    ranking, and gate verdict; this is FORGE applied one level deeper and it targets
    ICDEV''s recurring free-form-confidence failure mode (see the per-rule-constant
    confidence lesson and the phantom trust-event class). (b) A uniform
    tools/llm/architectures/ registry with one result envelope so any canvas swaps
    reasoning strategy by config, not code. (c) Real gaps: Chain-of-Verification over
    TRUST citations, Constitutional AI per-rule critique/revise over security_gates,
    Plan-Execute-Verify inside the kanban runner (the structural fix for tasks marked
    done that shipped nothing), Adaptive RAG complexity pre-routing, Self-RAG
    per-document reflection, Self-Discover for ANVIL Architect, budget-capped Tree of
    Thoughts. (d) A cross-architecture benchmark leaderboard so llm_config routing
    cites evidence instead of intuition. HARD CONSTRAINT — LLM-agnostic: upstream
    defaults to Nebius via LangChain; every task here routes exclusively through
    LLMRouter.invoke/invoke_for_role, takes models from args/llm_config.yaml via
    resolve_llm_config_path(), gets multi-model diversity from get_diverse_models(),
    uses get_embedding_provider() for embeddings, and MUST complete air-gapped against
    local Ollama with no cloud fallback. Zero vendor SDK or langchain_* imports; no
