# CUI // SP-CTI
#
# Project registry — rendered as a "Projects in Flight" section below the
# Task Board at /kanban. Every project gets its own collapsible card with:
#   * progress bars per epic (computed from kanban_tasks with id LIKE <prefix>*)
#   * brief links
#   * in-flight + recent-failure summaries
#   * failure_triage activity stats (shared across all projects — global)
#
# Adding a new project = appending an entry here. No code change required.

projects:

  - key: digital-twin
    name: "Digital Twin Roadmap"
    description: >
      Per-canvas digital-twin implementation across 8 epics,
      86 dependency-chained kanban tasks.
    task_prefix: "dt-"
    # Default-expanded on the board (first render). Set to false for
    # projects you want collapsed by default once the list grows.
    default_open: true
    briefs:
      - label: "Inspiration brief — pattern + ICDEV mapping"
        path: "/docs/briefs/digital-twin-inspiration-brief.md"
      - label: "Full market scan + per-canvas plan"
        path: "/docs/briefs/digital-twin-market-canvas-implementation-plan.md"
    epics:
      - key: iqe
        title: "IQE v0.1 — ICDEV Query Engine"
        priority: critical
      - key: bdc
        title: "BDC cATO Twin (Phase 1)"
        priority: critical
      - key: idc-iac
        title: "IDC IaC Generation"
        priority: high
      - key: idc-twin
        title: "IDC IaC Twin (Phase 1)"
        priority: high
      - key: pdc
        title: "PDC Pipeline Twin"
        priority: medium
      - key: sdc
        title: "SDC Attack Path Twin"
        priority: medium
      - key: odc
        title: "ODC MITRE Coverage Twin"
        priority: medium
      - key: ddc
        title: "DDC Lineage Adapter"
        priority: low

  - key: alphadesk-7-6
    name: "AlphaDesk 7.6 — AI-Assisted Options"
    description: >
      LLM-interpretation + deterministic-selection hybrid: intent parser,
      strategy scorer, strike/expiry picker, pre-flight gates, confirm-to-execute
      modal, and a position-coach daemon reflex. LLM stays on interpretation +
      explanation; rules engine owns selection + strike picking (NIST AU auditable).
    task_prefix: "ad76-"
    default_open: true
    briefs:
      - label: "Phase 7.6 brief — scope + safety boundaries"
        path: "/docs/briefs/phase-7.6-ai-options-assist.md"
    epics:
      - key: intake
        title: "Intent parser (LLM + rule fallback)"
        priority: high
      - key: scorer
        title: "Deterministic strategy + strike + expiry picker"
        priority: critical
      - key: confirm
        title: "Pre-flight gates + confirm-to-execute modal"
        priority: critical
      - key: coach
        title: "Position coach daemon + LLM recommendations"
        priority: high
      - key: wrap
        title: "Registration + feature doc + E2E"
        priority: high

  - key: alphadesk-7-7
    name: "AlphaDesk 7.7 — Probability & Compare"
    description: >
      OptionStrat-inspired upgrades on top of 7.6's proposal flow:
      (1) Probability-of-profit + price-cone overlay on the payoff chart
      (Monte Carlo on IV-implied lognormal), and (2) side-by-side compare
      so the top-3 alternates from build_proposal get first-class UI.
      Fully deterministic — no new LLM calls.
    task_prefix: "ad77-"
    default_open: true
    briefs:
      - label: "Phase 7.7 brief — probability + compare"
        path: "/docs/briefs/phase-7.7-probability-compare.md"
    epics:
      - key: prob
        title: "POP + price cone overlay"
        priority: critical
      - key: compare
        title: "Side-by-side strategy comparison"
        priority: high
      - key: wrap
        title: "Registration + docs + E2E"
        priority: high

  - key: alphadesk-7-8
    name: "AlphaDesk 7.8 — Greeks Deep Dive + Quick Wins"
    description: >
      Three OptionStrat-inspired upgrades: (1) Black-Scholes pricer +
      time-T payoff slider (not just expiry intrinsic); (2) portfolio
      net Greeks aggregation card; (3) shareable trade URLs. No new
      LLM calls; all deterministic.
    task_prefix: "ad78-"
    default_open: true
    briefs:
      - label: "Phase 7.8 brief — BS pricer, portfolio greeks, share"
        path: "/docs/briefs/phase-7.8-greeks-share.md"
    epics:
      - key: pricing
        title: "Black-Scholes pricer + time-T payoff"
        priority: critical
      - key: portfolio
        title: "Portfolio net Greeks"
        priority: high
      - key: share
        title: "Shareable trade URLs"
        priority: medium
      - key: wrap
        title: "Registration + docs + E2E"
        priority: high
