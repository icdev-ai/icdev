# [TEMPLATE: CUI // SP-CTI]
# ICDEV™ Industry Research Engine Configuration (Phase 63, D-RES-1 through D-RES-13)
# Deep industry vertical research — produces scored dossiers for child app generation

# =========================================================================
# Pipeline Stages (D-RES-1: session-based, bounded lifecycle)
# =========================================================================
pipeline:
  stages:
    - SCOPE
    - LANDSCAPE
    - REGULATE
    - COMMUNITY
    - ACADEMIC
    - BUILD_BUY
    - SYNTHESIZE
    - FORECAST
    - DOSSIER
  session_lifecycle:
    - created
    - scoping
    - scanning
    - synthesizing
    - dossier_ready
    - reviewed
    - child_app_triggered
    - archived

# =========================================================================
# Vertical Configuration (D-RES-2: declarative JSON, no code changes)
# =========================================================================
verticals:
  config_dir: context/research/verticals
  regulatory_registry: context/research/regulatory_registry.json
  supported_formats: [json]

# =========================================================================
# Source Adapters — 8 data streams (D-RES-3: SOURCE_SCANNERS registry)
# =========================================================================
sources:
  community_forum:
    enabled: true
    scan_interval_hours: 12
    platforms:
      - name: reddit
        sort: hot
        max_results: 100
        min_upvotes: 5
      - name: stackexchange
        sort: votes
        max_results: 50
      - name: discord
        enabled: false
        max_results: 30
      - name: domain_forum
        max_results: 50
    rate_limit:
      requests_per_hour: 60
      burst: 10
      delay_between_requests_seconds: 2

  review_site:
    enabled: true
    scan_interval_hours: 24
    sites:
      - name: g2
        max_per_category: 50
        sort: recent
      - name: capterra
        max_per_category: 50
        sort: recent
      - name: trustpilot
        max_per_category: 30
        sort: recent
    rate_limit:
      requests_per_hour: 30
      burst: 5
      delay_between_requests_seconds: 3

  academic_paper:
    enabled: true
    scan_interval_hours: 168          # weekly
    platforms:
      - name: arxiv
        api: "https://export.arxiv.org/api/query"
        max_results: 100
        sort_by: submittedDate
        sort_order: descending
      - name: ieee
        enabled: false                # requires IEEE Xplore API key
        max_results: 50
      - name: acm
        enabled: false                # requires ACM API
        max_results: 50
      - name: scholar
        enabled: false                # requires SerpAPI key
        max_results: 50
    rate_limit:
      requests_per_hour: 30
      burst: 3
      delay_between_requests_seconds: 5

  regulatory_body:
    enabled: true
    scan_interval_hours: 168          # weekly
    platforms:
      - name: federal_register
        api: "https://www.federalregister.gov/api/v1"
        max_results: 50
      - name: regulations_gov
        api: "https://api.regulations.gov/v4"
        max_results: 50
        enabled: false                # requires API key
      - name: body_rss
        max_results: 30
    rate_limit:
      requests_per_hour: 30
      burst: 5

  open_source:
    enabled: true
    scan_interval_hours: 24
    platforms:
      - name: github
        api: "https://api.github.com"
        sort: stars
        max_results: 100
        min_stars: 50
      - name: awesome_list
        max_results: 50
      - name: package_registry
        registries: [pypi, npm, crates]
        max_results: 30
    rate_limit:
      requests_per_hour: 60
      burst: 10

  saas_commercial:
    enabled: true
    scan_interval_hours: 168          # weekly
    platforms:
      - name: g2_products
        max_results: 30
      - name: producthunt
        max_results: 20
    rate_limit:
      requests_per_hour: 20
      burst: 3

  news_blog:
    enabled: true
    scan_interval_hours: 24
    platforms:
      - name: news
        max_results: 50
      - name: analyst_report
        max_results: 20
      - name: blog
        max_results: 30
    rate_limit:
      requests_per_hour: 30
      burst: 5

  patent:
    enabled: true
    scan_interval_hours: 336          # bi-weekly
    platforms:
      - name: google_patents
        max_results: 30
      - name: uspto
        enabled: false                # requires USPTO API key
        max_results: 30
    rate_limit:
      requests_per_hour: 20
      burst: 3

  # YouTube video scanning — 9th source stream (D-RES-14, D-RES-15)
  video:
    enabled: true                        # enabled for FathomDesk trading research
    scan_interval_hours: 24
    platforms:
      - name: youtube_search
        api: "https://www.googleapis.com/youtube/v3"
        max_results: 50
        min_views: 100
        enabled: true                    # requires YOUTUBE_API_KEY env var
      - name: youtube_manual
        max_results: 20
        enabled: true                    # always available (no API key needed)
      - name: youtube_channel
        max_results: 30
        enabled: true                    # requires YOUTUBE_API_KEY env var
    transcript:
      enabled: true                      # try youtube-transcript-api
      max_length: 10000                  # truncate transcript to N chars
      summarize_with_llm: true           # use two-tier to summarize long transcripts
      llm_function: research_youtube_summarize
    rate_limit:
      requests_per_hour: 30
      burst: 5
      delay_between_requests_seconds: 3

# =========================================================================
# Challenge Scoring — 6-dimension weighted average (D-RES-4, D21)
# =========================================================================
scoring:
  weights:
    market_demand: 0.25               # signal frequency, upvotes, citations
    regulatory_pressure: 0.20         # regulation count, enforcement actions
    technical_complexity: 0.15        # academic paper density, patent activity
    competitive_saturation: 0.15      # inverse: fewer solutions = bigger opportunity
    icdev_readiness: 0.15             # ICDEV™ capability coverage score
    compliance_alignment: 0.10        # maps to existing ICDEV™ framework = 1.0
  enforcement_boost: 1.5             # multiplier for enforcement actions
  deadline_boost: 1.3                # multiplier for regulatory deadlines
  thresholds:
    critical: 0.80                    # score >= 0.80: critical challenge
    notable: 0.50                     # score 0.50-0.79: notable challenge
    appendix: 0.00                    # score < 0.50: appendix only
  max_challenges_per_session: 200

# =========================================================================
# Regulatory Mapping (D-RES-6)
# =========================================================================
regulatory_mapping:
  registry_path: context/research/regulatory_registry.json
  crosswalk_integration: true         # map to ICDEV™ crosswalk frameworks
  coverage_scoring:
    full_match: 1.0                   # maps to existing ICDEV™ framework
    crosswalk_match: 0.5              # crosswalk-able to ICDEV™
    no_match: 0.0                     # no ICDEV™ coverage

# =========================================================================
# Capability Mapping (D-RES-7)
# =========================================================================
capability_mapping:
  catalog_path: context/agentic/icdev_capability_catalog.json
  algorithm: keyword_overlap          # reuse govcon/capability_mapper.py pattern
  min_overlap_score: 0.3              # minimum keyword overlap for mapping
  enhancement_threshold: 0.6          # below this = "enhancement needed"

# =========================================================================
# Build/Buy/Partner Analysis (D-RES-8)
# =========================================================================
build_buy:
  scoring:
    build_factors:
      icdev_coverage: 0.30            # existing ICDEV™ capability coverage
      customization_need: 0.25        # how much customization is needed
      compliance_control: 0.25        # compliance is under our control
      long_term_cost: 0.20            # lower long-term cost than licensing
    buy_factors:
      time_to_market: 0.30            # faster with existing solution
      maturity: 0.25                  # mature, battle-tested solution
      support_ecosystem: 0.25         # vendor support, documentation
      integration_ease: 0.20          # easy to integrate with ICDEV™
    partner_factors:
      domain_expertise: 0.30          # partner has domain expertise
      shared_risk: 0.25               # risk shared across parties
      market_access: 0.25             # partner brings market access
      ip_preservation: 0.20           # we retain IP
  recommendation_thresholds:
    clear_build: 0.70                 # build score >= 0.70 and > buy/partner by 0.15
    clear_buy: 0.70                   # buy score >= 0.70 and > build/partner by 0.15
    hybrid_threshold: 0.15            # if top two within 0.15, recommend hybrid

# =========================================================================
# Dossier Generation (D-RES-9: template-based, no LLM, air-gap safe)
# =========================================================================
dossier:
  template: default                   # default, detailed, minimal
  sections:
    - executive_summary
    - vertical_overview
    - challenge_analysis
    - regulatory_landscape
    - competitive_landscape
    - build_buy_matrix
    - capability_coverage
    - opportunity_assessment
    - recommendations
    - forecast_analysis
    - appendix
  include_charts: true                # SVG bar charts for scores
  include_raw_signals: false          # exclude raw signals by default
  max_challenges_in_body: 30          # critical + notable in main body
  max_signals_in_appendix: 100

# =========================================================================
# Forecast Generation (D-RES-17, D-RES-18, D-RES-19)
# =========================================================================
forecast:
  enabled: true
  method: llm                           # llm or deterministic
  llm_function: research_forecast
  cross_engine: true                    # query innovation + creative engines
  max_predictions: 5
  prediction_types:
    - trend_trajectory
    - greenfield
    - convergence
    - disruption
    - regulatory_shift
  confidence_threshold: 0.3             # minimum confidence to include
  surprise_threshold: 0.2               # minimum surprise to include
  time_horizons:
    - 3mo
    - 6mo
    - 1yr
    - 3yr

# =========================================================================
# Cross-Engine Registration (D-RES-11)
# =========================================================================
innovation_bridge:
  enabled: true
  min_score_for_innovation: 0.70      # cross-register to innovation_signals
  source_label: "research_engine"

creative_bridge:
  enabled: true
  min_score_for_creative: 0.65        # cross-register to creative_signals
  source_label: "research_engine"

# =========================================================================
# Trend Detection
# =========================================================================
trends:
  detection_window_days: 60
  min_signals_for_trend: 5
  velocity_window_days: 14
  stale_after_days: 90
  cross_vertical: true                # detect trends across verticals

# =========================================================================
# Child App Fitness Integration (D-RES-10)
# =========================================================================
fitness:
  hitl_required: true                 # human approval before fitness assessment
  min_dossier_score: 0.60             # minimum overall opportunity score
  auto_trigger: false                 # never auto-trigger fitness assessment

# =========================================================================
# Air-Gapped Mode (D-RES-12)
# =========================================================================
air_gapped:
  enabled: false
  degraded_sources:
    - manual_entry
    - uploaded_documents
  offline_verticals_only: true

# =========================================================================
# Scheduling
# =========================================================================
scheduling:
  daemon_mode: false
  daemon_interval_seconds: 3600       # 1 hour between pipeline runs
  quiet_hours:
    enabled: true
    start: "22:00"
    end: "06:00"
    timezone: "US/Eastern"
