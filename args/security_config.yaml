# CUI // SP-CTI
# ICDEV Security Configuration — Classification-Aware Defaults
# Child apps inherit this and apply security_policy_update / clearance_ceiling adaptations.
---

# Default classification for all artifacts generated by this app.
default_classification: CUI

# Required markings on output files, emails, and UI banners.
required_markings:
  header: "CUI // SP-CTI"
  footer: "CUI // SP-CTI"
  banner_color: "#005a9c"

# Clearance ceiling — no user or agent may operate above this level.
# Child apps inherit the parent's max_clearance and may lower it, never raise it.
clearance_ceiling: SECRET

# User clearance levels allowed in this app (ordered lowest to highest).
clearance_levels:
  - PUBLIC
  - CUI
  - SECRET

# Security policy defaults
policies:
  auth:
    require_mfa: true
    session_timeout_minutes: 30
    password_min_length: 14
    password_complexity: high
  data:
    encryption_at_rest: true
    encryption_in_transit: true
    allowed_ciphers:
      - AES-256-GCM
      - ChaCha20-Poly1305
  audit:
    log_all_access: true
    log_retention_days: 365
    immutable_audit_trail: true
  network:
    allowed_ports: [443, 8443, 8444, 8445, 8446, 8447, 8448, 8449, 8450]
    require_mutual_tls: true
  ai:
    max_prompt_injection_confidence: 0.7
    block_on_high_confidence_injection: true
    require_ai_bom: true

# Framework inheritance — child apps may disable frameworks not applicable
# to their classification level, but never enable a framework the parent
# does not have active.
frameworks:
  nist_800_53: true
  nist_800_207: true
  fedramp: true
  cmmc: true
  owasp_llm_top_10: true
  atlas: true

# ---------------------------------------------------------------------------
# ABAC Policies — XACML-style subject/resource/action/environment rules
# ---------------------------------------------------------------------------
abac_policies:
  - name: tenant_admin_full
    subject:
      role: tenant_admin
    resource:
      type: "*"
    action:
      - "*"
    decision: Permit

  - name: developer_readwrite_own
    subject:
      role: developer
    resource:
      type: project
      owner_id: "${subject.user_id}"
    action:
      - GET
      - POST
      - PUT
      - PATCH
    decision: Permit

  - name: compliance_officer_read_all
    subject:
      role: compliance_officer
    resource:
      type: "*"
    action:
      - GET
    decision: Permit

  - name: auditor_readonly
    subject:
      role: auditor
    resource:
      type: "*"
    action:
      - GET
    decision: Permit

  - name: viewer_readonly
    subject:
      role: viewer
    resource:
      type: "*"
    action:
      - GET
    decision: Permit

  - name: deny_non_admin_delete
    subject:
      role:
        operator: not_in
        values:
          - tenant_admin
          - admin
    resource:
      type: tenant
    action:
      - DELETE
    decision: Deny

  - name: il6_secret_only
    subject:
      clearance_level:
        operator: "<"
        value: 2
    resource:
      classification: SECRET
    action:
      - GET
      - POST
      - PUT
    decision: Deny

  # --- Proposal section write policies ---

  - name: proposal_section_privileged_write
    subject:
      role:
        operator: in
        values:
          - capture_mgr
          - proposal_mgr
          - tenant_admin
          - admin
    resource:
      type: proposal_section
    action:
      - PUT
      - PATCH
    decision: Permit

  - name: proposal_section_writer_own
    subject:
      role: section_writer
    resource:
      type: proposal_section
      writer_email: "${subject.user_id}"
    action:
      - PUT
      - PATCH
    decision: Permit

  - name: proposal_section_writer_deny_unassigned
    subject:
      role: section_writer
    resource:
      type: proposal_section
    action:
      - PUT
      - PATCH
    decision: Deny

  # --- Proposal draft REVIEW policies (approve/reject in api/govcon.py) ---
  # Separation of duties: reviewing/privileged roles decide; a section_writer
  # never self-approves/rejects their own draft.

  - name: proposal_draft_review_privileged
    subject:
      role:
        operator: in
        values:
          - capture_mgr
          - proposal_mgr
          - pm
          - reviewer
          - tenant_admin
          - admin
    resource:
      type: proposal_draft
    action:
      - approve
      - reject
    decision: Permit

  # Renamed from proposal_draft_writer_deny_unassigned. The WRITE family below
  # needs that name for its own section_writer deny, and two rules cannot share
  # one name; no test references this one, so it is the safe side to rename.
  - name: proposal_draft_review_deny_unassigned
    subject:
      role: section_writer
    resource:
      type: proposal_draft
    action:
      - approve
      - reject
    decision: Deny

  # --- Proposal draft WRITE policies (POST rewrite-save in api/govcon.py) ---
  # Disjoint from the review family above: those govern who DECIDES on a draft,
  # these govern who may CHANGE one. Before prop-sec-01 only approve/reject were
  # governed, so the write path was reachable by any authenticated role.

  - name: proposal_draft_privileged_write
    subject:
      role:
        operator: in
        values:
          - capture_mgr
          - proposal_mgr
          - reviewer
          - tenant_admin
          - admin
    resource:
      type: proposal_draft
    action:
      - PUT
      - POST
    decision: Permit

  - name: proposal_draft_writer_own
    subject:
      role: section_writer
    resource:
      type: proposal_draft
      writer_email: "${subject.user_id}"
    action:
      - PUT
      - POST
    decision: Permit

  - name: proposal_draft_writer_deny_unassigned
    subject:
      role: section_writer
    resource:
      type: proposal_draft
    action:
      - PUT
      - POST
    decision: Deny

# ---------------------------------------------------------------------------
# Column-Level Security — per-role, per-table column masking
# ---------------------------------------------------------------------------
column_policies:
  - table: dashboard_users
    role: viewer
    columns:
      email: redact
      api_key_hash: "null"
      password_hash: "null"
  - table: dashboard_users
    role: auditor
    columns:
      api_key_hash: "null"
      password_hash: "null"
  - table: fa_users
    role: viewer
    columns:
      email: redact
      progress_json: "null"
  - table: tenants
    role: viewer
    columns:
      billing_info: "null"
      stripe_customer_id: "null"
  - table: intake_sessions
    role: viewer
    columns:
      customer_name: redact
      customer_org: redact
  - table: intake_requirements
    role: viewer
    columns:
      acceptance_criteria: truncate
      gaps: "null"
      ambiguities: "null"
  - table: chat_messages
    role: viewer
    columns:
      content: truncate
  - table: chat_contexts
    role: viewer
    columns:
      system_prompt: "null"
      context_config: "null"

  # --- Proposal column masking ---

  - table: proposal_opportunities
    role: reviewer
    columns:
      win_themes: "null"
      key_discriminators: "null"
      ptw_low: "null"
      ptw_high: "null"
      estimated_value_low: "null"
      estimated_value_high: "null"
  - table: proposal_opportunities
    role: co
    columns:
      win_themes: "null"
      key_discriminators: "null"
      ptw_low: "null"
      ptw_high: "null"
      estimated_value_low: "null"
      estimated_value_high: "null"
  - table: proposal_competitors
    role: reviewer
    columns:
      strengths: "null"
      weaknesses: "null"
      estimated_price: "null"
      win_probability_pct: "null"
  - table: proposal_competitors
    role: co
    columns:
      strengths: "null"
      weaknesses: "null"
      estimated_price: "null"
      win_probability_pct: "null"
  - table: cpmp_clins
    role: reviewer
    columns:
      value: "null"
  - table: cpmp_clins
    role: co
    columns:
      value: "null"
  - table: pg_cost_volumes
    role: reviewer
    columns:
      total_evaluated_price: "null"
      direct_labor_cost: "null"
      fringe_rate: "null"
      overhead_rate: "null"
      g_and_a_rate: "null"
      fee_rate: "null"
      subcontractor_cost: "null"
      odc_cost: "null"
      ptw_estimate_low: "null"
      ptw_estimate_high: "null"
      calc_benchmark_median: "null"
  - table: pg_cost_volumes
    role: co
    columns:
      total_evaluated_price: "null"
      direct_labor_cost: "null"
      fringe_rate: "null"
      overhead_rate: "null"
      g_and_a_rate: "null"
      fee_rate: "null"
      subcontractor_cost: "null"
      odc_cost: "null"
      ptw_estimate_low: "null"
      ptw_estimate_high: "null"
      calc_benchmark_median: "null"
  - table: pg_win_themes
    role: reviewer
    columns:
      theme_statement: redact
      supporting_evidence: "null"
      target_eval_factor: "null"
      ghost_competitor: "null"
  - table: pg_win_themes
    role: co
    columns:
      theme_statement: redact
      supporting_evidence: "null"
      target_eval_factor: "null"
      ghost_competitor: "null"
  - table: pg_win_loss_records
    role: reviewer
    columns:
      competitor_strengths: "null"
  - table: pg_win_loss_records
    role: co
    columns:
      competitor_strengths: "null"
  - table: proposal_blackhat_assessments
    role: reviewer
    columns:
      price_estimate_low: "null"
      price_estimate_high: "null"
      win_strategy: "null"
      differentiators: "null"
      strengths: "null"
      weaknesses: "null"
      risk_factors: "null"
  - table: proposal_blackhat_assessments
    role: co
    columns:
      price_estimate_low: "null"
      price_estimate_high: "null"
      win_strategy: "null"
      differentiators: "null"
      strengths: "null"
      weaknesses: "null"
      risk_factors: "null"
  # pg_competitor_awards feeds the price-to-win computation. award_amount is
  # deliberately NOT masked here: rate_benchmarker.ptw_analysis() aggregates it
  # server-side, and masking it to NULL at the DB layer would not hide the answer
  # — it would make ptw_analysis silently return "no award amounts" with a bogus
  # recommendation. The derived PTW figures are withheld from these roles at the
  # response layer instead (see _mask_ptw_analysis in dashboard/api/proposals.py),
  # matching the pg_cost_volumes ptw_estimate_* policy above. labor_categories is
  # read by no computation, so it is masked here.
  - table: pg_competitor_awards
    role: reviewer
    columns:
      labor_categories: "null"
  - table: pg_competitor_awards
    role: co
    columns:
      labor_categories: "null"

