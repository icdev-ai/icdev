# CUI // SP-CTI
# Repo-aware kanban dispatch registry (tools/kanban/repo_registry.py).
#
# Maps kanban task-id PREFIXES to the external git repo they build in. A task
# whose id matches no prefix here — or if this file is absent — builds in ICDev
# (the default), so an empty registry is a complete no-op.
#
# The repo's on-disk root is read from an env var (root_env) so this committed
# file stays environment-agnostic. If the env var is unset, matching tasks are
# treated as external-but-unconfigured and are SKIPPED by the dispatcher (never
# built inside ICDev). Set the env var wherever the scheduler runs, e.g.:
#   $env:ICDEV_KANBAN_REPO_COMPASS  = "C:/tmp/compass-premium-ricoas-continue"
#   $env:ICDEV_KANBAN_REPO_IDEA_LAB = "C:/ai/idea_lab"

repos:
  compass:
    base_branch: main
    root_env: ICDEV_KANBAN_REPO_COMPASS
  idea_lab:
    base_branch: main
    root_env: ICDEV_KANBAN_REPO_IDEA_LAB
  # CONCORD — the Evidence-to-Investment Studio. The repo does not exist yet, so
  # ICDEV_KANBAN_REPO_CONCORD is deliberately UNSET: unconfigured external tasks
  # are skipped by the dispatcher rather than built inside the ICDev checkout,
  # where they would fail ICDev's tree-scoped gates and churn. Held additionally
  # behind cncd-gate-00 until the repo is scaffolded.
  #   $env:ICDEV_KANBAN_REPO_CONCORD = "C:/AI/standalone/concord"
  concord:
    base_branch: main
    root_env: ICDEV_KANBAN_REPO_CONCORD
  # ICDEV[domain] split (xit-reg-01, docs/programmes/icdev-domain-split.md). Two
  # sibling repos that do NOT exist yet. Registered BEFORE they exist, on the
  # CONCORD precedent: an unregistered xcore-/xft- task would resolve to the
  # ICDev default and the dispatcher would build a core-extraction or a
  # trading-system task inside this checkout. Both env vars stay UNSET until
  # programme phase P5, so matching tasks are parked, never built here.
  #   $env:ICDEV_KANBAN_REPO_CORE = "C:/ai/icdev-core"
  #   $env:ICDEV_KANBAN_REPO_FT   = "C:/ai/icdev_ft"
  icdev_core:
    base_branch: main
    root_env: ICDEV_KANBAN_REPO_CORE
  icdev_ft:
    base_branch: main
    root_env: ICDEV_KANBAN_REPO_FT
  # ICDEV[RT] -- the retirement + insurance planning parent (card rt, 2026-08-30).
  # Third parent of the ICDEV family, alongside ICDEV[IT] (this repo) and
  # ICDEV[FT]. Registered BEFORE the repo exists, on the CONCORD / ked-reg-01 /
  # xit-reg-02 precedent stated three times above: an unregistered rt- task
  # resolves to the ICDev default and the dispatcher would build a FastAPI/React
  # retirement app -- and, worse, personal financial data -- inside this PUBLIC
  # checkout. The env var stays UNSET until the repo is scaffolded, so matching
  # tasks are PARKED, never built here.
  #   $env:ICDEV_KANBAN_REPO_RT = "C:/ai/icdev_rt"
  icdev_rt:
    base_branch: main
    root_env: ICDEV_KANBAN_REPO_RT

# Longest matching prefix wins. These are the premium/external product streams
# that must NOT run through ICDev's build+validate+merge pipeline.
prefixes:
  prem-cpmp: compass
  prem-msr: compass
  prem-lcatq: compass
  prem-recomp: compass
  prem-ricoas: compass
  prem-ideal: idea_lab
  # ked-reg-01: these five streams were LIVE on the board and missing from this
  # file, so they resolved to the ICDev default — meaning the dispatcher would
  # have built compass/idea_lab work inside the ICDev checkout, where it fails
  # ICDev's tree-scoped gates and churns. test_kanban_external_repos.py now
  # asserts every distinct prem-* stream on the board resolves to a registered
  # repo, so the next one cannot be added without landing here too.
  prem-bid: compass
  prem-rpt: compass
  prem-people: compass
  prem-pstaff: compass
  # prem-p0 (policy-routed LLM) shipped in BOTH ICDev and idea_lab. Its ICDev half
  # is already merged; the stream is registered to idea_lab because that is where
  # any remaining work in it lands.
  prem-p0: idea_lab
  # ked-vfy-01: dispatch-proof stream. Carries the deliberately trivial compass
  # task defined in args/kanban_seed_compass_dispatch.yaml, used to exercise
  # dispatch end to end against a real external repo. Registered separately from
  # the product prefixes so a probe run can never be mistaken for cpmp/msr/ricoas
  # product work — and so the seed task cannot fall through to the ICDev default.
  prem-vfy: compass
  # CONCORD's standalone half. Registered BEFORE the repo exists on purpose: an
  # unregistered cncd- task would resolve to the ICDev default and the dispatcher
  # would try to build a FastAPI/React app inside the ICDev tree. Because
  # ICDEV_KANBAN_REPO_CONCORD is unset, these are skipped instead — external and
  # unconfigured, which is the correct and safe reading.
  #
  # NOTE the ICDEV-side engine uses the separate `bom-` prefix and is absent from
  # this file by design: tools/bom/ genuinely builds in ICDev and must go through
  # ICDev's gates.
  cncd: concord
  # ICDEV[domain] split. `xit-` (the ICDEV[IT] side of the programme) is
  # deliberately ABSENT: it genuinely builds in ICDev and must go through
  # ICDev's gates. `xcore-` and `xft-` build in the two sibling repos above.
  xcore: icdev_core
  xft: icdev_ft
  # FathomDesk decision-engine migration into the FT parent (card fdx,
  # you-are-an-agentic-cozy-parrot.md PROGRAMME 2). Same repo as xft-; parked
  # until ICDEV_KANBAN_REPO_FT is set, and additionally held behind fdx-gate-00.
  # Live-trading code is never built unattended.
  fdx: icdev_ft
  # xit-reg-02: `ftl-` -- the ICDEV[FT] autonomous-trading loop, 53 cards -- was
  # MISSING and therefore fell through to the ICDev default, resolving
  # external=False root=C:/AI/ICDev. This repo is PUBLIC, so releasing
  # ftl-gate-00 (which xit-rm-04 contemplates) would have had the dispatcher
  # build trading work inside it: the xit-leak-01 class, reached through the
  # dispatcher rather than through a commit. Same shape as the ked-reg-01 note
  # above -- a stream LIVE on the board and absent from this file.
  #
  # Root env stays UNSET, so this resolves external + NOT dispatchable = PARKED.
  # Registering a stream never enables it; it only stops it building here.
  ftl: icdev_ft
  # ftp -- ICDEV[FT] production readiness + easy button (card ftp, 2026-08-29).
  # Registered BEFORE seeding, per the xit-reg-02 lesson above: an unregistered
  # ftp- task resolves to the ICDev default and the dispatcher would build FT
  # hardening work inside this PUBLIC checkout. Same repo, same env var: the
  # stream is dispatchable exactly when ICDEV_KANBAN_REPO_FT is set.
  ftp: icdev_ft
  # fni -- ICDEV[FT] News Intelligence (card fni, 2026-09-04). Registered BEFORE
  # seeding, per the ftl-/ftp- discipline above: an unregistered fni- task
  # resolves to the ICDev default and the dispatcher would build a news-analysis
  # feature for the trading parent inside this PUBLIC checkout. Same repo, same
  # env var; additionally held behind fni-gate-00.
  fni: icdev_ft
  # rt -- ICDEV[RT], the retirement + insurance planning parent. Same discipline
  # as ftl-/ftp- above: registered before seeding so the stream cannot fall
  # through to the ICDev default. Dispatchable exactly when
  # ICDEV_KANBAN_REPO_RT is set; additionally held behind rt-gate-00.
  rt: icdev_rt
