# ICDEV™ Security Gate Configuration
# Defines what blocks merges and deployments

code_review:
  require_peer_review: true
  require_security_scan: true
  require_compliance_check: true
  require_tests_pass: true

merge_gates:
  block_on:
    - cat1_stig_finding
    - critical_vulnerability
    - high_vulnerability
    - failed_tests
    # CUI marking gate is classification-aware: only enforced when
    # classification_profiles.yaml -> enforce_cui_marking_gate is true.
    # Use ClassificationResolver.enforce_cui_marking_gate to check at runtime.
    - missing_cui_markings_if_required
    - secrets_detected
    - incomplete_canvas_page          # new_page_completeness gate failure
  warn_on:
    - cat2_stig_finding
    - medium_vulnerability
    - coverage_below_threshold
    # Warn (not block) if classification markings are missing on non-CUI projects
    - classification_markings_inconsistent

deployment_gates:
  block_on:
    - any_merge_gate_failure
    - sbom_not_generated
    - ssp_not_current
    - poam_has_overdue_items
  auto_rollback_on:
    - health_check_failure
    - cat1_finding_post_deploy
    - critical_vuln_runtime
    - error_rate_spike

cssp:
  blocking:
    - critical_requirements_not_satisfied
    - ir_plan_missing
    - siem_not_configured
    - pki_cac_not_configured
  warning:
    - partial_requirements_below_80_pct
    - vuln_scan_overdue_30_days
    - ir_plan_not_tested
    - xacta_sync_overdue

sbd:
  blocking:
    - critical_sbd_requirements_not_satisfied
    - default_credentials_detected
    - no_mfa_configured
    - no_vulnerability_disclosure_policy
    - stack_traces_in_production
  warning:
    - partial_sbd_requirements_below_80_pct
    - memory_unsafe_language_without_tooling
    - sbom_stale_over_30_days
    - threat_model_missing
    - security_headers_incomplete

ivv:
  blocking:
    - critical_ivv_findings_open
    - test_coverage_below_threshold
    - rtm_gaps_in_critical_requirements
    - no_independent_security_assessment
  warning:
    - partial_ivv_requirements_below_70_pct
    - code_review_incomplete
    - bdd_feature_coverage_low
    - pipeline_security_stages_missing

# DB abstraction lint gate — blocks merges that introduce bare sqlite3.connect()
# outside the approved DB-layer files.
# Run: python tools/lint/sqlite3_connect_linter.py --json --gate
db_abstraction_lint:
  blocking:
    - sqlite3_connect_violation   # bare sqlite3.connect() in tools/ without # sqlite3-ok
  note: >
    Violations are detected by tools/lint/sqlite3_connect_linter.py.
    Exempt files: tools/db/storage.py, init_icdev_db.py, migration_runner.py,
    backup_manager.py, */init_db.py.  Suppress a single line with # sqlite3-ok
    only when a direct connection genuinely cannot be avoided.

# Citation-type vocabulary gate (cxo-trust-02) — blocks a citation_type literal
# that is not in tools/provenance/citation_types.py::CITATION_TYPES.
#
# register_citation() validates the vocabulary BEFORE the INSERT and raises
# ValueError; every caller swallows it, so an unknown value means the citation is
# never written — silently, forever. Two subsystems shipped exactly that and
# neither was noticed: tools/cortex/governance.py ("cortex") wrote 0 of 285
# registry rows while its gate recorded "warn", and tools/blockchain/
# asset_ledger.py ("asset_token") left anchor_status "skipped" so GovChain asset
# tokenization never anchored. Two subsystems, one missing gate.
# Run: python tools/lint/citation_type_linter.py --json --gate
citation_type_vocabulary:
  blocking:
    - unknown_citation_type   # citation_type="..." absent from CITATION_TYPES
  note: >
    Detected by tools/lint/citation_type_linter.py. Fix by adding the value to
    CITATION_TYPES and shipping a migration rendered from check_constraint_sql(),
    or by correcting the typo — never by widening the linter. tests/ are exempt
    (a test may assert a bogus type is rejected) and a single line can be
    suppressed with # citation-type-ok when the value is validated elsewhere.

# New Page Completeness Gate (TCH — True Completion Hardening)
# Blocks merges when a new dashboard page ships without all 8 required components
# (template, icdev/ mirror, blueprint route, backing module, nav link, IQE adapter,
# seed queries, IQE widget include). The sub-check also enforces icdev/ mirror
# parity for every .html file in canvas template directories.
# Run: python tools/workflow/coherence_checker.py --check new_page_completeness --json --gate
new_page_completeness:
  blocking:
    - incomplete_canvas_page          # page.html exists but required component(s) missing
    - icdev_mirror_gap                # icdev/ package mirror missing for canvas template
  warning:
    - template_missing_iqe_widget      # page.html lacks iqe_query_widget include
  note: >
    Violations are detected by tools/workflow/coherence_checker.py::check_new_page_completeness.
    Whitelisted canvases are skipped via args/page_completeness_whitelist.yaml.
    Canvas directories without page.html are checked by the mirror-parity sub-check.

# Acceptance Criteria Validation Gate (V&V — "did we build what was asked?")
acceptance_validation:
  blocking:
    - acceptance_criteria_failed
    - ui_page_renders_with_error
    - plan_has_no_acceptance_criteria
  warning:
    - acceptance_criteria_unverified
    - page_content_empty

# Governed Delivery Pipeline gates (Phase 2). These RUN and RECORD per task in
# kanban_verifications and surface in the /kanban pipeline view. They are
# non-blocking by default; enforcement (blocking `done`) is toggled at runtime
# by the KANBAN_PIPELINE_ENFORCE env flag, not by this catalog.
conformance_review:
  blocking: []            # enforced only when KANBAN_PIPELINE_ENFORCE=1
  warning:
    - conformance_review_failed        # implementation drifted from acceptance criteria
    - conformance_review_not_run       # no acceptance criteria / no diff / LLM unavailable
  note: >
    "Did we build the right thing?" — LLM judge over the branch diff vs the task's
    acceptance criteria (tools/testing/conformance_reviewer.py, routed via the
    conformance_review LLM function). Distinct from V&V. Records review_passed /
    review_findings on kanban_verifications.
unit_tests:
  blocking: []            # enforced only when KANBAN_PIPELINE_ENFORCE=1
  warning:
    - unit_tests_failed                # pytest on changed test files failed
  note: >
    pytest gate — runs only the task's CHANGED test files (validated_commit._run_pytest).
    Records pytest_passed / pytest_ran / failed_tests on kanban_verifications.

# Aggregation Guard Gate — blocks when a result set's derived classification exceeds
# the surface ceiling or the requesting user's clearance_level.
# Run: python tools/security/aggregation_guard.py --gate --json
aggregation_guard:
  blocking:
    - derived_classification_exceeds_surface_ceiling   # guard_result() returned action='block'
    - derived_classification_exceeds_user_clearance    # derived > user clearance_level
  warning:
    - aggregation_rule_fired_warn                      # SCG rule matched; derived within ceiling
    - user_volume_throttle_approaching                 # row×entity×time-window near limit
  note: >
    Detected by tools/security/aggregation_guard.py (guard_result / evaluate_rules).
    SCG rules live in args/classification_aggregation.yaml.  Events are written to
    the append-only aggregation_events table (NIST AU-9/AU-10); never UPDATE/DELETE.

dynamic_finding_reproduction:
  blocking:
    - confirmed_dynamic_finding_at_blocking_severity   # replay fired; severity in gate.blocking_severities
  warning:
    - dynamic_finding_without_reproduction             # no PoC stored — reported as a lead, never blocks
    - dynamic_finding_replay_indecisive                # unavailable / error / refused — nothing was learned
    - dynamic_finding_reproduction_not_discriminating  # fires against the fixed build too; it is a tautology
  note: >
    Enforced by tools/security/reproduction_validator.py (enforce / --gate).
    Reproduce-or-drop (oss-poc-01, adapted from STRIX): a DYNAMIC finding blocks
    only when a stored reproduction replays and its vulnerability predicate
    fires. Unreproducible findings are 'unconfirmed' and are structurally
    incapable of blocking — the only way to change that is
    gate.block_on_unconfirmed in args/reproduction_policy.yaml, which exists so
    that re-admitting them is a visible configuration act. STATIC findings
    (bandit/CVSS/STIG) are out of scope and keep their existing thresholds
    below. Replay targets are default-deny allowlisted (own targets only);
    evidence lands in dynamic_findings + the append-only
    finding_replay_attempts (migration 295, NIST AU).

