# API Contract Drift Gate (Phase B / P1.2)
# Detects divergence between the live Flask /api/v1/* route surface and the
# published OpenAPI 3.1 spec served at /api/v1/openapi.json. Implemented by
# tools/workflow/coherence_checker.py::check_openapi_parity (Phase B6).
# Not yet merge-blocking while the frontend is in build-up; flip
# warning->blocking when Phase I closes.
api_contract_drift:
  description: "Warns on any /api/v1/* route missing from OpenAPI spec or any spec path without a live route"
  blocking: []
  warning:
    - route_missing_from_spec
    - spec_path_missing_route
    - operation_missing_response_schema
    - query_param_declared_but_unused
  thresholds:
    max_undocumented_routes: 0
    max_orphan_spec_paths: 0
    # When flipped to true (post-Phase I), `route_missing_from_spec` and
    # `spec_path_missing_route` promote from warning -> blocking.
    enforce_as_blocking: false

fathomdesk_news_pipeline:
  description: "Gates for FathomDeskNews (ADN) RSS ingest, classification, scenario-matching, and aggregation pipeline"
  blocking:
    - news_db_schema_mismatch
  warning:
    - ingestor_feed_parse_failure
    - classifier_backlog_overflow
  thresholds:
    max_feed_parse_failures: 3
    max_classifier_backlog: 500

osv_scanner:
  description: "SCA vulnerability scanning via osv-scanner binary (github.com/google/osv-scanner)"
  enabled: true
  block_on_critical: true
  warn_on_high: true
  target: "requirements.txt"
  binary_required: false  # graceful degradation when binary absent (air-gap)

# Rigor Profile Gate (SA-11, SA-15, CM-6)
# Enforces minimum test/review rigor thresholds per impact level.
# Blocking: il5/il6 systems with a rigor violation; Warning: il2/il4 with a violation.
rigor_profile:
  description: "Impact-level–calibrated rigor enforcement — SA-11 (Developer Testing), SA-15 (Development Process), CM-6 (Configuration Settings)"
  blocking:
    - rigor_violation_on_il5_system
    - rigor_violation_on_il6_system
  warning:
    - rigor_violation_on_il2_system
    - rigor_violation_on_il4_system
  thresholds:
    il2_coverage_min: 60
    il4_coverage_min: 80
    il5_coverage_min: 90
    il6_coverage_min: 95
  nist_controls:
    - SA-11
    - SA-15
    - CM-6

# Theater Detector Gate (SA-11, SI-3)
# Detects security theater — measures that appear protective but lack substance.
# Maps to NIST SA-11 (Developer Testing) and SI-3 (Malicious Code Protection).
theater_detector:
  description: "Detects security theater — nominal controls with no substantive enforcement"
  blocking:
    - block_severity
  warning:
    - warn_severity
  thresholds:
    max_blocking_files: 0
    max_warn_files: 5
    min_clean_pct: 80

# System Graph health gate — warns when any federated source returns 0 nodes,
# indicating a broken DB connection or missing table.
# Evaluated by the coherence_checker or a scheduled awareness health probe.
system_graph:
  warning:
    - system_graph_source_empty    # a federation source returned 0 nodes (broken loader)
    - system_graph_build_slow      # cold build > 10s (layout or DB query regression)
  note: >
    system_graph_source_empty fires when any loader in graph_builder.py returns an
    empty node list for its source (awareness_kg, canvas_kg, kanban_deps, goals,
    migrations, codebase). Check DB connectivity and table existence.
    system_graph_build_slow fires when stats.build_ms > 10000 on an uncached request.

# AI Traceability gate — warn if canvas_ai_decisions table is empty after 24h of activity
# Evaluated by coherence_checker.py or a daily health probe.
ai_trace:
  warning:
    - canvas_ai_decisions_empty   # no AI decisions recorded after >24h of canvas use
  note: >
    canvas_ai_decisions_empty fires when the table is empty more than 24 hours after
    any canvas blueprint has been accessed (evidence that traceability hooks are not firing).
    Check canvas blueprint wiring in tools/network/blueprint.py and peers.

# Security Framework Gates (Phase 74 — sec-fnd)
security_framework:
  description: "Multi-layer security framework gates — context, ABAC, MAC, RLS, column, field, encryption, mTLS"
  blocking:
    - missing_security_context
    - abac_policy_violation_unresolved
    - classification_violation
    - missing_rls_on_classification_table
    - mtls_not_enforced_for_il5_plus
    - encryption_not_configured_for_secret
  warning:
    - security_context_incomplete
    - compartment_bypass_attempt
    - pdp_cache_stale
    - field_filtering_disabled
  thresholds:
    require_security_context: true
    require_abac_for_il4_plus: true
    require_rls_for_classified_tables: true
    require_mtls_for_il5: true
    require_encryption_for_secret: true
    pdp_cache_ttl_seconds: 60

# Ontology Validation Gate
ontology:
  description: "Validates ontology federation integrity — ensures class alignment, property consistency, and subclass closure freshness"
  blocking:
    - ontology_build_failed
    - ontology_alignment_conflict
    - ontology_property_range_violation
  warning:
    - ontology_class_count_below_threshold
    - ontology_closure_stale_over_7_days
    - ontology_external_mapping_outdated
  thresholds:
    min_classes: 10
    closure_max_age_days: 7
    require_external_mappings_current: true

# Adversarial Verify Loop Gate (loop-eng — D-LOOP-1 through D-LOOP-3)
# Governs the second-pass Claude CLI session that reviews completed kanban work.
# fail_open: true means a timeout or unreachable reviewer does NOT block the task.
loop_engineering:
  adversarial_verify_timeout_seconds: 180
  adversarial_verify_fail_open: true
  gepa_min_composite_score: 0.60
  gepa_min_score_delta: 0.05

# ─────────────────────────────────────────────────────────────────────────────
# MCP tool allowlist for Studio workflow steps (dwo-mcp-02)
#
# A `node_type: mcp` workflow step dispatches an MCP tool in-process through
# tools/mcp/tool_registry.py. That registry exposes 500+ tools, many of them
# destructive or classification-sensitive, so the workflow surface is
# DEFAULT-DENY: a tool is callable from a workflow step only when it is named
# below. Anything else is refused before import/dispatch and audited.
#
#   default            — policy for any tool not named here. Always `deny`.
#   allowed            — dispatched with no human gate. Read-only / advisory
#                        tools only: they must not mutate state, spend money,
#                        deploy, or move data across a classification boundary.
#   requires_approval  — dispatched only after an approved `node_type: human`
#                        gate in the same run. State-changing, destructive,
#                        or egress-bearing tools.
#
# Rules for editing this list:
#   * Names must match tool_registry.py keys exactly — a typo silently reads as
#     "not allowlisted" and the step is refused at runtime, not at edit time.
#   * A tool appears in at most ONE of the two lists.
#   * Adding a tool that writes, deletes, deploys, or egresses to `allowed` is
#     a gate violation; it belongs in `requires_approval`.
#   * IL and role limits are NOT restated here. They come from the tool's own
#     registry metadata plus args/component_registry.yaml (min_il /
#     default_roles), evaluated per-dispatch alongside this allowlist.
#   * Refusals and approvals are both audited append-only with tool name,
#     params digest, run id, step id and actor.
mcp_workflow_tools:
  default: deny
  nist_controls: [AC-3, AC-6, AU-2, AU-12, CM-5]

  # Read-only: query, inspect, report. Safe to run unattended inside a workflow.
  allowed:
    - health_check          # platform health probe, no writes
    - get_status            # project/agent status read
    - project_status        # compliance + deployment posture read
    - rag_search            # retrieval over the existing index
    - kg_search             # knowledge-graph query
    - search_knowledge      # learning knowledge-base lookup
    - trace_query           # requirement/artifact traceability read
    - nist_lookup           # control catalog lookup
    - crosswalk_query       # framework crosswalk read
    - stig_check            # STIG evaluation, report-only
    - code_analyze          # static analysis, report-only
    - scan_dependencies     # dependency audit, report-only
    - classification_check  # marking validation, report-only
    - kanban_list_tasks     # board read
    - kanban_get_task       # board read
    - studio_list_workflows # workflow catalog read

  # State-changing, destructive, or egress-bearing: a human gate must be
  # approved in the same run before the executor dispatches these.
  requires_approval:
    - terraform_apply       # mutates cloud infrastructure
    - k8s_deploy            # deploys workloads to a cluster
    - ansible_run           # executes playbooks against hosts
    - rollback              # tears down / reverts a deployment
    - self_heal             # applies unattended remediation
    - kanban_delete_task    # destructive board write
    - rag_delete_source     # destructive index write
    - sandbox_execute       # runs caller-supplied code
    - send_command          # issues a command to a remote agent
    - install_asset         # installs third-party marketplace code
    - publish_asset         # publishes outward to the marketplace
    - emass_sync            # egress of compliance data to eMASS
    - xacta_sync            # egress of compliance data to Xacta

# Named security gate registry — structured entries consumed by mcp_scanner and gate dispatcher
gates:
  - id: AI-TRACE-001
    name: Canvas AI Traceability Gate
    description: Warns when canvas_ai_decisions table is empty after 24h of canvas activity — indicates AI traceability hooks are not firing
    severity: WARN
    block_on: []
    warn_on: [canvas_ai_decisions_empty]
    table: canvas_ai_decisions
    nist_controls: [AU-2, AU-3, SI-4]
    dod_rai: [Traceable]
    nist_ai_rmf: [MEASURE-2.5, MEASURE-2.7, MEASURE-2.8]

  - id: MCP-SEC-001
    name: MCP Server Security Gate
    description: Blocks on HIGH severity MCP server findings (unauthenticated transport, missing TLS, privilege escalation tools)
    severity: HIGH
    block_on: [unauthenticated_transport, privilege_escalation]
    warn_on: [no_tls, missing_classification]
    tool: tools/mcp/mcp_scanner.py
    nist_controls: [SC-8, AC-3, AU-12]

  - id: MCP-WF-001
    name: MCP Workflow Tool Allowlist Gate
    description: Refuses a workflow step that dispatches an MCP tool absent from mcp_workflow_tools.allowed, blocks a mcp_workflow_tools.requires_approval tool until its human gate is approved, and refuses a caller whose impact level or roles do not meet the limits the tool's owning component declares in args/component_registry.yaml. Policy lives in the mcp_workflow_tools section of this file.
    severity: HIGH
    block_on:
      - mcp_tool_not_allowlisted
      - mcp_tool_awaiting_human_approval
      - mcp_tool_approval_rejected
      - mcp_tool_approval_gate_unavailable
      - mcp_tool_exceeds_caller_il
      - mcp_tool_missing_required_role
    warn_on:
      - mcp_tool_unknown_to_registry
    policy: mcp_workflow_tools
    nist_controls: [AC-3, AC-6, AU-2, AU-12, CM-5]

  - id: URL-SEC-001
    name: URL Scheme Validation Gate (B310)
    description: Blocks non-HTTP(S) URI schemes (file:/, ftp:/, custom://) in external interface calls. Detects Bandit B310 — urllib_urlopen called with a scheme outside the http/https allowlist.
    severity: HIGH
    block_on:
      - b310_non_http_scheme_in_urlopen
      - file_scheme_in_external_call
      - custom_scheme_without_allowlist
    warn_on:
      - ftp_scheme_detected
      - scheme_validation_not_enforced
    permitted_schemes: [http, https]
    tool: "python -m bandit -r tools/ --test B310 --severity-level medium --json"
    nist_controls: [SI-10, SC-8, SA-11]
    bandit_test: B310

  # NOC Operations Canvas gates
  - id: NOC-OPS-001
    name: P1 Incident Unacknowledged
    description: Warns when a P1 (critical) NOC incident has been open for more than 15 minutes without acknowledgement.
    severity: WARN
    warn_on: [noc_p1_unacknowledged]
    threshold_minutes: 15
    table: noc_incidents
    query: "SELECT COUNT(*) FROM noc_incidents WHERE severity='p1' AND status='open' AND created_at < NOW() - INTERVAL '15 minutes'"
    nist_controls: [IR-6, SI-4]

  # PMC (Peering Management Canvas) gates
  - id: PMC-RPKI-001
    name: RPKI Invalid High-Traffic Peer
    description: Warns when a high-traffic peer (95th-pct ≥ 1 Gbps) has any RPKI-invalid prefix registered.
    severity: WARN
    warn_on: [pmc_rpki_invalid_high_traffic]
    threshold_traffic_gbps: 1.0
    table: peering_prefixes
    nist_controls: [SC-5, SI-3, RA-5]

  - id: PMC-IRR-001
    name: IRR Unregistered Open Peer
    description: Warns when an active peer with open peering policy has more than 20% of routes unregistered in IRR.
    severity: WARN
    warn_on: [irr_unregistered_open_peer]
    threshold_unregistered_pct: 20
    table: peering_peers
    nist_controls: [SC-5, CM-8]

  # CCC (Circuit & Capacity Canvas) gates
  - id: CCC-UTIL-001
    name: Circuit Critical Utilization
    description: Warns when any active circuit reaches 85% utilization — indicates immediate upgrade needed.
    severity: WARN
    warn_on: [ccc_circuit_critical_utilization]
    threshold_utilization_pct: 85
    table: ccc_circuits
    nist_controls: [CP-2, SA-9, SC-5]

  - id: CCC-EXPIRY-001
    name: Circuit Contract Expiring
    description: Warns when an active circuit contract expires within 90 days with no renewal record.
    severity: WARN
    warn_on: [ccc_contract_expiring_soon]
    threshold_days: 90
    table: ccc_circuits
    nist_controls: [CP-2, SA-9]

  # DSOC (DDoS & Security Ops Canvas) gates
  - id: DSOC-RTBH-001
    name: RTBH Entries Without Auto-Withdraw
    description: Warns when active RTBH entries have no auto_withdraw_minutes set — risk of indefinite null-routing.
    severity: WARN
    warn_on: [dsoc_rtbh_no_auto_withdraw]
    threshold_auto_withdraw_minutes: 0
    table: dsoc_rtbh_entries
    nist_controls: [SC-5, IR-4, CP-2]

  - id: DSOC-SCRUB-001
    name: Scrubbing Center Critical Utilization
    description: Warns when any scrubbing center exceeds 85% of its rated capacity — mitigation may overflow.
    severity: WARN
    warn_on: [dsoc_scrubbing_critical_utilization]
    threshold_utilization_pct: 85
    table: dsoc_scrubbing_centers
    nist_controls: [SC-5, CP-2, SA-9]

  - id: DSOC-THREAT-001
    name: High-Confidence Active Threats Without Mitigation
    description: Warns when threats with confidence >= 90% have no associated active mitigation.
    severity: WARN
    warn_on: [dsoc_unmitigated_high_confidence_threats]
    threshold_confidence_pct: 90
    table: dsoc_threats
    nist_controls: [IR-4, SI-3, SC-5]

  # ACE (Autonomous Coding Engine) HITL gates
  - id: ACE-HITL-001
    name: ace_stale_hitl
    description: ACE team awaiting HITL approval for > 24h -- resolve before deploy
    severity: WARN
    warn_on: [ace_stale_hitl_pending]
    action: block deploy
    condition: "any ace_instances row with state=hitl_pending and started_at < NOW() - INTERVAL '24 hours'"
    table: ace_instances
    query: "SELECT COUNT(*) FROM ace_instances WHERE state='hitl_pending' AND started_at < NOW() - INTERVAL '24 hours'"
    nist_controls: [CA-7, IR-4, SI-4]

  # PVM — Predictive Vulnerability Management HITL gates
  - id: PVM-TRIAGE-001
    name: pvm_stale_triage_pending
    description: Advisory triage items with priority_score >= 0.75 awaiting HITL approval for > 48h
    severity: WARN
    warn_on: [pvm_stale_high_priority_triage]
    action: block deploy
    condition: "any nc_triage_queue row with status=pending and priority_score >= 0.75 and created_at < NOW() - INTERVAL '48 hours'"
    table: nc_triage_queue
    query: "SELECT COUNT(*) FROM nc_triage_queue WHERE status='pending' AND priority_score >= 0.75 AND created_at < NOW() - INTERVAL '48 hours'"
    nist_controls: [RA-5, SI-2, CA-7]

  - id: PVM-PREDICT-001
    name: pvm_critical_risk_unreviewed
    description: Vulnerability predictions with composite risk >= 0.90 older than 24h without triage entry
    severity: WARN
    warn_on: [pvm_unreviewed_critical_risk]
    action: notify
    condition: "nc_vuln_predictions with risk_score_composite >= 0.90 and no matching nc_triage_queue row and created_at < NOW() - INTERVAL '24 hours'"
    table: nc_vuln_predictions
    query: "SELECT COUNT(*) FROM nc_vuln_predictions p WHERE p.risk_score_composite >= 0.90 AND NOT EXISTS (SELECT 1 FROM nc_triage_queue t WHERE t.advisory_id = p.advisory_id) AND p.predicted_at < NOW() - INTERVAL '24 hours'"
    nist_controls: [RA-5, IR-4, SI-2]

# ─────────────────────────────────────────────────────────────────────────────
# Constitutional AI rule set (agx-verify-02)
#
# The SINGLE-SOURCE, data-driven encoding of the constitutional rules that
# tools/quality/constitutional_ai.py critiques LLM-drafted artifacts against,
# rule-by-rule. This is NOT a new parallel policy: each rule restates an
# invariant that already exists elsewhere (the merge_gates block_on/warn_on keys
# above, the CUI/classification marking rules, and the TRUST invariants —
# citation/placeholder/numeric-consistency). `source` names the origin.
#
# severity mirrors the gate lists: `block` = mandatory control (any failure fails
# the artifact — see compose_overall's any-block-fail policy); `warn` = advisory.
# applies_to filters which drafted artifact types the rule is critiqued against.
constitution:
  vocabulary_version: const-1.0
  rules:
    - id: missing_cui_markings_if_required
      severity: block
      source: "merge_gates.block_on + classification marking rules"
      applies_to: [any]
      principle: >-
        The artifact must carry the required CUI (or higher) marking/banner when
        its classification requires it. A CUI artifact without its banner fails.
    - id: classification_markings_inconsistent
      severity: warn
      source: "merge_gates.warn_on + classification marking rules"
      applies_to: [any]
      principle: >-
        Classification markings must be internally consistent — no section may
        carry a banner that conflicts with the artifact's declared classification.
    - id: uncited_claim
      severity: block
      source: "TRUST invariant (citation_guard / citation_grounding)"
      applies_to: [proposal, rfi, dic, tech_writer]
      principle: >-
        Every factual or quantitative claim must carry an inline [source: ...]
        citation attributable to the provided evidence. Unsourced claims fail.
    - id: unresolved_placeholder
      severity: block
      source: "TRUST invariant (placeholder_guard / content_grounding)"
      applies_to: [proposal, rfi, dic, tech_writer]
      principle: >-
        The artifact must contain no unresolved [BRACKETED] placeholder tokens
        (e.g. [UEI_NUMBER]); every placeholder must be filled or removed.
    - id: numeric_contradiction
      severity: warn
      source: "TRUST invariant (content_grounding.check_numeric_claims)"
      applies_to: [proposal, rfi]
      principle: >-
        Numeric claims that recur across sections (ROM totals, prototype
        timelines) must agree; contradictory figures must be reconciled.
    - id: unsupported_superlative
      severity: warn
      source: "Karpathy pre-design heuristic (state assumptions; avoid overreach)"
      applies_to: [proposal, rfi, dic, tech_writer]
      principle: >-
        Absolute or superlative claims ("guaranteed", "the only", "always")
        must be evidenced or softened; unsupported superlatives are flagged.
