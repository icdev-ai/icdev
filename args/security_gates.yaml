    - cui_markings_present_after_strip
    - internal_metadata_leak
    - export_review_not_completed
    - classification_level_exceeded
  warning:
    - export_contains_icdev_references
    - no_export_license_specified
  thresholds:
    require_human_approval: true
    strip_cui_required: true
    strip_internal_metadata: true

# Phase 70 — Redaction & Data Protection (D-RDT-1)
redaction_data_protection:
