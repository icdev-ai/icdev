    audit_all_detections: true

# Phase 72 — ICDEV™ Studio (D361-D366)
studio_workflow:
  description: "Gate for Studio user-created workflows — validates before execution"
  blocking:
    - workflow_circular_dependency
    - workflow_references_nonexistent_tool
    - workflow_yaml_parse_error
  warning:
    - workflow_disconnected_steps
    - workflow_missing_timeout
