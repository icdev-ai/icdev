# CUI // SP-CTI
#
# Entity-currency store — source declarations (cef-fnd-04).
#
# tools/currency/entity_currency.py contains NO table name, NO column name, NO
# vendor, product, protocol or industry. Every one of those is data, and this
# file is where it lives. Adding a fifth provider is an entry here plus a table
# to read; it is not a code change.
#
# THE SHAPES THIS FILE EXISTS TO RECONCILE
#
# The three sources below answer "is it current?" in three incompatible ways:
#
#   product + release cycle + EOL date       (a software release feed)
#   naming authority + a match PATTERN + EOL date  (a hardware EOL feed)
#   a curated STATUS WORD and no date at all       (the curated catalog)
#
# Nothing could ask all three at once, and a fourth provider had nowhere to
# write. Each entry maps its own shape onto the common one.
#
# HOW A SOURCE IS DECLARED
#
#   id            provider id, written verbatim to entity_currency.source
#   kind          external_feed | curated | inventory | derived |
#                 author_supplied | sme_attributed
#   precedence    OPTIONAL integer, lower wins, applied FIRST in `resolution`
#                 (dwr-ev-01). A source that declares none gets
#                 DEFAULT_PRECEDENCE (100) and ties with every other such
#                 source, so the four sources shipped before that key rank
#                 exactly as they did. An EVIDENCE ORDERING in the idiom of
#                 args/docmod/inventory_feeds.yaml, not a confidence: it cannot
#                 be overturned by bumping a prior, and it is not
#                 `authoritative`, which stays the curated catalog's word.
#   order_by      OPTIONAL column list. A table holding several rows per
#                 identity (an author's later statement beside an earlier one)
#                 declares which row the upsert keeps: the LAST read wins.
#   table         the table to read
#   entity_type   literal type for every row, OR entity_type_column to take it
#                 from the row itself (data-driven — preferred when the source
#                 already classifies its own rows)
#   authoritative true = wins resolution outright, ahead of confidence. Only the
#                 curated catalog carries it; see `resolution` at the bottom.
#   confidence    DECLARED PRIOR in [0,1]. Not a measurement — nothing in this
#                 repo has calibrated these. They rank sources against each
#                 other and that is all they do.
#   columns       source column -> canonical field. A field whose column is
#                 absent or NULL simply stays empty.
#   extra_columns carried verbatim into provenance_json. Use for signal this
#                 store has no column for, so it is preserved rather than lost.
#   verdict       how to derive the verdict:
#                   strategy: dates      -> from eol_date/eos_date vs today
#                   strategy: value_map  -> map a column's value through `map`
#
# CANONICAL FIELDS (see the migration comment for the full semantics)
#   entity_key entity_label entity_version namespace
#   eol_date eos_date superseded_by as_of provenance_id

classification: CUI // SP-CTI

# Verdict when a source records the entity but asserts no currency signal at
# all. NEVER guessed upward: an unmapped entity is 'unknown', never 'current'
# and never 'end_of_life' (TRUST — no guessing), and it is written anyway
# because "this source has heard of it and knows nothing" is itself an answer.
unknown_confidence: 0.3

sources:
  - id: docmod_eol_products
    kind: external_feed
    enabled: true
    table: docmod_eol_products
    entity_type: software_release
    confidence: 0.8
    note: >-
      endoflife.date, plus an air-gap seed. 110 rows, 105 of them synced — a
      genuinely working external path. It knows release cycles of software
      products and nothing else: it has never heard of a hardware chassis or a
      protocol version, which is the whole reason this store is not just a view
      over it.
    columns:
      provenance_id: id
      entity_key: product
      entity_label: product
      entity_version: cycle
      eol_date: eol_date
      eos_date: eos_date
      # The feed's own "what should you be on instead" field.
      superseded_by: latest_version
      as_of: synced_at
    extra_columns: [lts, source]
    verdict:
      strategy: dates

  - id: mc_net_eol_data
    kind: external_feed
    enabled: true
    table: mc_net_eol_data
    entity_type: hardware_model
    confidence: 0.75
    note: >-
      The migration-canvas hardware EOL database. entity_key is a match PATTERN
      rather than an exact identity — that is what the source stores, and it is
      recorded as-is rather than being silently reinterpreted. Callers that need
      pattern semantics still go through tools/migration_canvas/eol_sync.py;
      this store carries the assertion, not the matcher.
    columns:
      provenance_id: id
      namespace: vendor
      entity_key: model_pattern
      entity_label: model_pattern
      eol_date: eol_date
      eos_date: eos_date
      as_of: synced_at
    # End-of-service-maintenance — a third date this store has no column for.
    extra_columns: [eosm_date, source]
    verdict:
      strategy: dates

  - id: docmod_catalog_entries
    kind: curated
    enabled: true
    authoritative: true
    table: docmod_catalog_entries
    # Data-driven: the catalog already classifies each row, so the type comes
    # from the row and this file names none of its values.
    entity_type_column: category
    confidence: 0.95
    note: >-
      The team-curated catalog. AUTHORITATIVE — per the defacto_learner
      docstring, curated entries win and learner/feed output is corroboration
      and tie-breaker. Its currency signal is a status word and usually no date
      at all, so `dates` would report every row 'unknown'.
    columns:
      provenance_id: entry_id
      namespace: vendor
      entity_key: product
      entity_label: product
      entity_version: version
      eol_date: eol_date
      eos_date: eos_date
      superseded_by: replacement_entry_id
      as_of: updated_at
    extra_columns: [domain, model_family, source, is_builtin]
    verdict:
      strategy: value_map
      column: status
      # The catalog's own vocabulary on the left, this store's on the right.
      # Not a domain hardcode: these are the three values of a CHECK constraint
      # in migration 257, and mapping them is the whole job of this entry.
      map:
        approved: current
        deprecated: deprecated
        retired: end_of_life
      default: unknown

  - id: dic_author_assertions
    kind: author_supplied
    enabled: true
    # RANKED TOP (dwr-ev-01). An author who uploads a document into the DIC
    # corpus states, with it, what the document asserts about an entity's
    # currency ("still fielded here as of 2026-08-01"). That is the LATEST FACT
    # about THIS estate, and it outranks every feed and the curated catalog —
    # which are facts about a VENDOR's support, not about what is deployed.
    # `precedence`, not `authoritative`: the catalog keeps its word, and the
    # ordering is declared as evidence precedence (inventory_feeds.yaml's
    # idiom) rather than as a confidence a bumped prior could overturn.
    #
    # DISAGREEMENT IS PRESERVED, and this entry cannot change that: it writes
    # its own rows under its own source id, and resolve() reports every other
    # source beside the winner under `others` with conflict:true. NIST EOL
    # saying retired and an author saying fielded is a VISIBLE conflict for a
    # reviewer, never a deleted catalog row.
    precedence: 0
    table: dic_author_assertions
    entity_type_column: entity_type
    # A DECLARED PRIOR like every other confidence here — the highest of the
    # non-curated ones because the assertion is attributed and dated by a
    # human, and nothing in this repo has calibrated it either.
    confidence: 0.9
    # Several statements about one entity may sit in the table (a corrected
    # upload beside the original). The store keeps ONE per identity for this
    # source: the newest AUTHOR clock, then the newest write.
    order_by: [as_of, created_at]
    note: >-
      Author-supplied statements recorded at DIC ingest
      (tools/document_intelligence/author_evidence.py). `as_of` is the
      AUTHOR's clock; `as_of_basis` says whether the author stated it or the
      upload time was defaulted in. Rows carry the document they came with, so
      every assertion is refutable at its origin.
    columns:
      provenance_id: assertion_id
      namespace: namespace
      entity_key: entity_key
      entity_label: entity_label
      entity_version: entity_version
      eol_date: eol_date
      eos_date: eos_date
      superseded_by: superseded_by
      as_of: as_of
    extra_columns: [doc_id, version_id, asserted_by, as_of_basis, status, note]
    verdict:
      strategy: value_map
      column: status
      # The author's vocabulary (author_evidence.AUTHOR_STATUSES, validated at
      # the upload) on the left, this store's on the right. A word missing
      # here is `unknown` — never `current`.
      map:
        current: current
        fielded: current
        in_use: current
        deprecated: deprecated
        end_of_support: end_of_support
        retired: end_of_life
        decommissioned: end_of_life
        unknown: unknown
      default: unknown

  - id: dic_sme_assertions
    kind: sme_attributed
    enabled: true
    # RANKED BESIDE THE AUTHOR, NOT ABOVE THEM (dwr-ev-02). A review comment is
    # an INSTRUCTION until a human explicitly promotes it, and a promoted one is
    # an attributed statement by a named person about THIS estate — the same
    # class of fact as an author's upload declaration, so the same precedence.
    # The pair therefore ties on precedence AND on the declared prior below, and
    # `as_of` decides: the LATER human clock wins and the earlier is preserved
    # under `others` with conflict:true. Ranking an SME comment above an upload
    # would let a 2020 remark beat a 2026 signed statement; ranking it below
    # would let a stale upload beat this morning's correction. Recency between
    # equals is the only rule about evidence here, and the store already has it.
    precedence: 0
    table: dic_sme_assertions
    entity_type_column: entity_type
    # The same DECLARED PRIOR as the author source, for the same reason and with
    # the same caveat: nothing in this repo has calibrated it. Equal on purpose —
    # a different number here would be a precedence rule wearing a confidence.
    confidence: 0.9
    # Several promoted comments may name one entity (two SMEs, or one correcting
    # themselves). Every one stays in dic_sme_assertions; the store keeps ONE per
    # identity for this source: the newest SME clock, then the newest promotion.
    order_by: [as_of, promoted_at]
    note: >-
      Review comments a human explicitly promoted to attributed SME assertions
      (tools/document_intelligence/sme_evidence.py). The CLAIM is typed by the
      promoter — nothing parses the comment prose — while `asserted_by` and
      `as_of` come from the COMMENT, so every row names the person who said it
      and when. `as_of_basis` says whether the SME stated the date or the
      comment's own timestamp was defaulted in. An UNPROMOTED comment has no row
      here and so appears in no citation at all.
    columns:
      provenance_id: assertion_id
      namespace: namespace
      entity_key: entity_key
      entity_label: entity_label
      entity_version: entity_version
      eol_date: eol_date
      eos_date: eos_date
      superseded_by: superseded_by
      as_of: as_of
    # The attribution rides into provenance_json so a citation can name the
    # human without a second lookup, and `comment` carries the statement
    # VERBATIM — a quotation, never something to parse.
    extra_columns:
      [ann_id, doc_id, section_id, asserted_by, promoted_by, promoted_at,
       as_of_basis, status, comment, category]
    verdict:
      strategy: value_map
      column: status
      # author_evidence.AUTHOR_STATUSES on the left — the SAME vocabulary the
      # promoter's claim is validated against, because one status word must not
      # mean different things on an upload and on a promotion. A word missing
      # here is `unknown`, never `current`.
      map:
        current: current
        fielded: current
        in_use: current
        deprecated: deprecated
        end_of_support: end_of_support
        retired: end_of_life
        decommissioned: end_of_life
        unknown: unknown
      default: unknown

# Read-time resolution policy, consumed by entity_currency.resolve(). Applied in
# order; the first discriminating key wins.
#
# `precedence` is FIRST (dwr-ev-01). TWO sources declare it and both declare 0
# (dwr-ev-02: an author's upload declaration and a promoted SME comment are the
# same class of fact), so they tie with each other and fall through to the keys
# below; for every other pair it is a tie at DEFAULT_PRECEDENCE and
# `authoritative` decides as it always has. `authoritative` is deliberately not expressible as a confidence
# number: a curated 'approved' must beat an external feed even when the feed is
# newer and more confident, and a tie-break that can be overturned by bumping a
# prior is not authority. Disagreement is never squashed at write time — every
# source keeps its own row, and resolve() reports the losers alongside the
# winner so a caller can see the conflict rather than inherit it silently.
resolution:
  order:
    - precedence      # a declared evidence precedence, lower first
    - authoritative   # curated sources next, unconditionally
    - confidence      # then the declared prior, descending
    - as_of           # then the source's own clock, most recent first
