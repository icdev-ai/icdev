collection:
  enabled: true
  exclude_routes:
    - /health
    - /static
    - /metrics
  exclude_ips:
    - "127.0.0.1"  # internal health checks

aggregation:
  rollup_interval_hours: 24
  retention_days: 90

scoring:
  low_adoption_threshold: 0.05   # < 5% of sessions = low adoption
  high_error_threshold: 0.10
  signal_threshold: 0.65

scheduling:
  quiet_hours:
    start: "02:00"
    end: "06:00"
    timezone: UTC
