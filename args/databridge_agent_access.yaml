# CUI // SP-CTI
# Which external DataBridge connectors an AGENT may read from.
#
# Consumed by tools/databridge/broker.py.
#
# ---------------------------------------------------------------------------
# This file is an authorization boundary, not a convenience config.
#
# DataBridge connectors reach a customer's own systems — Splunk, ServiceNow,
# SolarWinds, Tenable, GitHub. Before the broker existed, agents could not
# reach them at all, and the only reason was that nobody had wired it up. That
# was an accident. This file is the deliberate version.
#
# Deny-all by default, and a missing or unreadable file also denies: a config
# mistake must not be indistinguishable from a grant.
#
# ---------------------------------------------------------------------------
# READ-ONLY. The broker has no write path. An agent creating a ticket or
# updating a CRM record is a much larger blast radius than reading one, it
# lands in a system ICDEV does not own and cannot roll back, and it needs its
# own approval design. Do not add a `write:` key here expecting it to work.
#
# ---------------------------------------------------------------------------
# Grant shape:
#
#   - name: splunk                  # must match the registered connector name
#     description: SIEM search      # shown to agents by list_available()
#     connection_id: prod-splunk    # row in db_connections holding creds
#     tables: [notable_events]      # ALLOWLIST — not a hint
#     agents: [security_analyst]    # optional; empty means any agent
#     classification_ceiling: UNCLASSIFIED
#
# `tables` is an allowlist because a connector typically exposes far more than
# an agent needs, and "everything the API offers" is not a decision anyone
# consciously made.
#
# `agents` is by role_id. Leaving it empty grants every agent, including
# runtime-generated SMEs — reasonable for a low-sensitivity public data source,
# rarely right for a customer system.
#
# `classification_ceiling` bounds what may be SENT as a query filter. Free-text
# filter values are sanitized fail-closed regardless.

version: databridge-agent-access-1.0

# Master switch. On, for exactly one grant — see below.
#
# What "on" is NOT allowed to mean: a shipped grant against a CUSTOMER system.
# The rule this file has always stated is that an install must not silently
# authorise agents against systems the operator never reviewed, and that rule is
# unchanged. The grant below is a PUBLIC, credential-free, read-only government
# publications feed — a source whose entire content is already world-readable,
# so authorising it discloses nothing and its blast radius is the reading of a
# public web page.
#
# Anything with credentials — Splunk, ServiceNow, SolarWinds, Tenable, a private
# GitHub org — stays commented out, stays a per-deployment decision, and belongs
# to the operator, not to this file. Enforced by tests/test_databridge_first_grant.py,
# which fails on a shipped grant carrying an auth_secret_ref.
enabled: true

connectors:
  # -------------------------------------------------------------------------
  # Federal Register — NIST documents. DOCUMENT CURRENCY.
  #
  # The question a currency backend has to answer is "is the document this one
  # cites still the operative one?", and the Federal Register is the official
  # daily journal of record for exactly that: what an agency has published,
  # corrected, superseded or withdrawn, with a stable public API.
  #
  # Why this one is the right first grant:
  #   * read-only in the strongest sense — the source has no write API at all;
  #   * no credential exists, so there is no secret to leak and no
  #     db_connections.auth_secret_ref to resolve;
  #   * agency-scoped by the query string, so the grant is narrow by
  #     construction rather than by convention;
  #   * UNCLASSIFIED end to end, so the ceiling below is the true ceiling and
  #     not a convenient one.
  #
  # NOT the NIST CSRC publications feed, which is what this grant was first
  # written against. Measured 2026-08-17: every CSRC RSS path 404s
  # (…/CSRC/media/feeds/rss/publications.xml and six variants) while
  # csrc.nist.gov itself serves 200 — the feed has been retired. That URL is
  # also tools/doc_modernization/nist_pubs_sync.py's DEFAULT_FEED_URL, whose
  # live pull swallows every network error by design, so docmod_nist_pubs has
  # been fed by its static seed alone; that is cef-fnd-02's to fix, not this
  # grant's.
  #
  # `tables` is the FEED URL because that is what RSSConnector reads as its
  # table name. That makes this allowlist an exact-URL allowlist: an agent
  # cannot point the connector at another host or widen the agency filter,
  # which matters more here than for a typical connector because feedparser
  # follows redirects and the egress guard only validates the first hop.
  - name: rss
    description: >-
      Federal Register documents published by NIST — the official record of
      which agency documents are current, corrected or superseded. Read-only,
      public, no credentials. Use it to decide whether a document cites a
      superseded publication.
    connection_id: federal-register-nist
    tables:
      - https://www.federalregister.gov/api/v1/documents.rss?conditions%5Bagencies%5D%5B%5D=national-institute-of-standards-and-technology
    # Scoped, not empty. An empty list grants EVERY agent including
    # runtime-generated SMEs; naming the roles that review documents for
    # currency keeps the grant reviewable and keeps `databridge_sources`
    # answering [] for everyone else.
    agents:
      - doc_reviewer
      - docgen_analyst
      - cortex_analyst
    classification_ceiling: UNCLASSIFIED

# ---------------------------------------------------------------------------
