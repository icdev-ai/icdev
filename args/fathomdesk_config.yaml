# FathomDesk agent LLM override configuration.
# Selects the LLM provider+model for each agent role.
# Ollama agents are air-gap safe (no cloud egress required).
# Opus agents are reserved for high-stakes reasoning where accuracy > cost.

# Feature flag: set to false to bypass DebateEngine+RiskManager and use heuristic signal scoring.
ANALYST_PANEL_ENABLED: false

agent_llm_overrides:
  # Fundamental analysis — structured valuation; Sonnet balances cost and depth
  fundamentals_agent: claude-sonnet-4-6

  # Technical analysis — pattern recognition; local Llama3 is sufficient and air-gap safe
  technical_agent: ollama/llama3

  # Sentiment scoring — classification task; local Llama3 is sufficient and air-gap safe
  sentiment_agent: ollama/llama3

  # Macro regime analysis — requires broad cross-domain reasoning; Sonnet handles well
  macro_agent: claude-sonnet-4-6

  # Debate engine — adversarial bull/bear framing; Opus for multi-perspective depth
  debate_engine: claude-opus-4-7

  # Risk manager — high-stakes position sizing and stop decisions; Opus for reliability
  risk_manager: claude-opus-4-7

  # Research manager — synthesizes analyst panel into investment plan; Sonnet is sufficient
  research_manager: claude-sonnet-4-6
