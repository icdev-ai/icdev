# CUI // SP-CTI
# FORGE Academy — AI Competency Framework
# L1-L5 competency levels cross-walked to DoD/NICE frameworks.

levels:
  - id: L1
    name: "AI Aware"
    rank_name: "Recruit"
    xp_min: 0
    xp_max: 499
    gate: "Complete Tier 1 (M01-M10)"
    color: "#888888"
    badge_icon: "shield"
    real_world: "Understands what LLMs are and can use AI tools in daily workflow"
    dod_ai_workforce: ["AI Consumer", "AI-Enabled Workforce"]
    nice_framework: ["KS0001", "KS0002"]
    omm_m25_21_readiness: "Aware of responsible AI principles"
    description: >
      Can explain what large language models are, when AI is appropriate,
      and how to use AI-assisted tools safely. Not yet building AI features.

  - id: L2
    name: "AI Capable"
    rank_name: "Operative"
    xp_min: 500
    xp_max: 1999
    gate: "Complete Tier 1 + role-specific Tier 2 (partial)"
    color: "#4A90E2"
    badge_icon: "diamond"
    real_world: "Builds AI features within their role domain using existing frameworks"
    dod_ai_workforce: ["AI Developer (Junior)", "AI-Enabled Practitioner"]
    nice_framework: ["KS0010", "KS0011", "KS0012"]
    omm_m25_21_readiness: "Can identify rights-impacting and safety-impacting AI systems"
    description: >
      Can build basic AI-powered features: connect to an LLM API, construct
      prompts, build a simple RAG pipeline, create a single-tool agent.
      Works within established frameworks.

  - id: L3
    name: "AI Proficient"
    rank_name: "Specialist"
    xp_min: 2000
    xp_max: 4999
    gate: "Complete Tier 1 + full role Tier 2"
    color: "#00D4FF"
    badge_icon: "star"
    real_world: "Designs and deploys AI systems using AADC/AIMC; owns production AI features"
    dod_ai_workforce: ["AI Developer (Senior)", "AI System Engineer"]
    nice_framework: ["KS0020", "KS0021", "KS0022", "KS0023"]
    omm_m25_21_readiness: "Can produce model cards, document AI inventory items, assess IL suitability"
    description: >
      Can design multi-agent systems using AADC canvas, select and adapt
      foundation models using AIMC, monitor production AI systems, and
      respond to AI incidents. Ready to lead AI features on a team.

  - id: L4
    name: "AI Expert"
    rank_name: "Architect"
    xp_min: 5000
    xp_max: 9999
    gate: "Complete Tier 3 Capstone"
    color: "#FF6B35"
    badge_icon: "star-filled"
    real_world: "Builds AI platforms and infrastructure; leads AI initiatives; mentors others"
    dod_ai_workforce: ["AI Architect", "AI Technical Lead", "CAIO Staff"]
    nice_framework: ["KS0030", "KS0031", "KS0032", "KS0033", "KS0034"]
    omm_m25_21_readiness: "Can lead OMB M-25-21 compliance review; author governance plans"
    description: >
      Can build end-to-end AI platforms, write ICDEV tools and goal workflows,
      design multi-canvas AI architectures, and drive AI transformation
      programs. Platform-level thinking; can build what others use.

  - id: L5
    name: "AI Architect"
    rank_name: "Sensei"
    xp_min: 10000
    xp_max: 999999
    gate: "Sensei rank + GameDay top-10 finish"
    color: "#FFB800"
    badge_icon: "crown"
    real_world: "Defines AI strategy for an organization; teaches and certifies others"
    dod_ai_workforce: ["Chief AI Officer (CAIO)", "AI Strategy Lead", "AI Program Executive"]
    nice_framework: ["KS0040", "KS0041", "KS0042"]
    omm_m25_21_readiness: "CAIO-level: can sign AI governance attestations, define org-wide AI policy"
    description: >
      Can define AI transformation strategy, build organizational AI programs,
      author compliance frameworks, and create competitive AI capabilities.
      Operates at the program and enterprise level.

certifications:
  foundation:
    name: "FORGE AI Foundation"
    short: "FAF"
    color: "#4A90E2"
    gates:
      - "Complete FORGE Academy Tier 1 (M01-M10)"
      - "Complete role-specific Tier 2 missions (minimum 3)"
      - "Pass 20-question adaptive assessment (score ≥ 75%)"
    level_equivalent: "L2"
    expiry_months: 24

  practitioner:
    name: "FORGE AI Practitioner"
    short: "FAP"
    color: "#00D4FF"
    gates:
      - "Hold FORGE AI Foundation certificate"
      - "AADC design assessment score ≥ 80"
      - "Complete at least 1 GameDay scenario"
    level_equivalent: "L3"
    expiry_months: 24

  expert:
    name: "FORGE AI Expert"
    short: "FAE"
    color: "#FFB800"
    gates:
      - "Hold FORGE AI Practitioner certificate"
      - "Complete Tier 3 Capstone (T3-07)"
      - "Top-50% finish in a competitive GameDay"
    level_equivalent: "L4"
    expiry_months: 36

org_readiness:
  # Weights for the composite "Readiness for AI-First Migration" score (0-100)
  components:
    tier2_completion_pct:
      weight: 0.35
      label: "Tier 2 Mission Completion"
      description: "% of cohort that completed at least half their role-specific Tier 2 missions"
    aadc_readiness_score:
      weight: 0.25
      label: "AADC Design Readiness"
      description: "Average AADC assessment score across all designs in the org"
    production_ai_ops_coverage:
      weight: 0.20
      label: "Production AI Ops Coverage"
      description: "% of cohort that completed SRE-AI production ops missions"
    leadership_track_completion:
      weight: 0.20
      label: "Leadership Track Completion"
      description: "% of leadership-role users who completed leadership Tier 2"
  thresholds:
    red: 40
    yellow: 65
    green: 80
  modernization_phase_guidance:
    below_40: "Phase 0 — Foundation work required before AI pilots"
    40_to_65: "Phase 1 — Ready for quick-win AI projects"
    65_to_80: "Phase 2 — Ready for AI augmentation initiatives"
    above_80: "Phase 3+ — Ready for AI-first transformation"
