# CUI // SP-CTI
# ICDEV™ Security Policy Baseline — Accreditation Boundary Controls
# Defines the minimum-viable security control set for IL4/IL5 boundary accreditation.
# Reference: NIST SP 800-53 Rev 5, DISA STIG, FedRAMP Moderate, CMMC Level 2
---

metadata:
  version: "1.0.0"
  classification: CUI
  last_reviewed: "2026-05-16"
  owner: security
  frameworks:
    - NIST 800-53 Rev 5
    - FedRAMP Moderate
    - CMMC Level 2
    - DISA STIG

# ─────────────────────────────────────────────────────────────────────────────
# SC-8 / SC-28 — Encryption Controls
# ─────────────────────────────────────────────────────────────────────────────
encryption:
  id: SC-ENC-001
  nist_controls: [SC-8, SC-8(1), SC-28, SC-28(1)]
  title: Encryption at Rest and in Transit
  description: >
    All CUI data must be encrypted at rest using FIPS 140-2/140-3 validated
    modules and in transit using TLS 1.2 or higher with approved cipher suites.
  status: required
  enforcement: block      # gates will block merge/deploy if violated
  requirements:
    at_rest:
      algorithm: AES-256-GCM
      key_management: AWS_KMS_GOVCLOUD
      fips_validated: true
    in_transit:
      min_tls_version: "1.2"
      preferred_tls_version: "1.3"
      approved_ciphers:
        - TLS_AES_256_GCM_SHA384
        - TLS_CHACHA20_POLY1305_SHA256
        - ECDHE-RSA-AES256-GCM-SHA384
      rejected_ciphers:
        - RC4
        - DES
        - 3DES
        - NULL
      mutual_tls: true
    key_rotation_days: 90
  evidence:
    - type: automated_scan
      tool: openssl_cipher_check
    - type: configuration_review
      artifact: tls_policy_attestation.md

# ─────────────────────────────────────────────────────────────────────────────
# IA-2 / AC-2 — Authentication and Authorization (AuthN/AuthZ)
# ─────────────────────────────────────────────────────────────────────────────
authentication_authorization:
  id: SC-AUTHN-002
  nist_controls: [IA-2, IA-2(1), IA-2(12), AC-2, AC-3, AC-6]
  title: Multi-Factor Authentication and Least-Privilege Access
  description: >
    All human users and privileged service accounts must authenticate via MFA
    using a FIPS 140-2 validated authenticator. Access is governed by ABAC
    with least-privilege enforcement. PIV/CAC required for privileged access.
  status: required
  enforcement: block
  requirements:
    mfa:
      required: true
      privileged_accounts: PIV_CAC
      standard_accounts: TOTP_or_FIDO2
      hardware_token_allowed: true
    session:
      idle_timeout_minutes: 15
      absolute_timeout_minutes: 480
      concurrent_sessions_max: 1
    password_policy:
      min_length: 15
      complexity: high          # upper + lower + digit + special
      history_depth: 24
      max_age_days: 60
      min_age_days: 1
      prohibited_patterns: [username, app_name, sequential]
    access_model: ABAC          # Attribute-Based Access Control (XACML)
    least_privilege: true
    privileged_access_workstation: required_for_admin
    account_review_days: 90
  evidence:
    - type: automated_scan
      tool: identity_policy_checker
    - type: configuration_review
      artifact: mfa_enrollment_report.csv

# ─────────────────────────────────────────────────────────────────────────────
# AU-2 / AU-9 — Audit Logging and Log Protection
# ─────────────────────────────────────────────────────────────────────────────
audit_logging:
  id: SC-AUDIT-003
  nist_controls: [AU-2, AU-3, AU-8, AU-9, AU-9(2), AU-12]
  title: Comprehensive Audit Logging with Immutable Retention
  description: >
    All authentication events, privileged-user actions, data access to CUI,
    and security-relevant configuration changes must be logged. Logs are
    append-only/immutable, timestamped to UTC, and retained for ≥365 days.
  status: required
  enforcement: block
  requirements:
    events_to_log:
      - user_login_success
      - user_login_failure
      - user_logout
      - mfa_challenge_result
      - privilege_escalation
      - account_creation_modification_deletion
      - data_access_cui
      - data_export
      - configuration_change
      - security_policy_change
      - system_startup_shutdown
      - audit_log_access
    log_fields_required:
      - timestamp_utc
      - user_id
      - session_id
      - source_ip
      - action
      - resource
      - outcome          # success | failure
      - classification   # data classification of accessed resource
    retention:
      online_days: 90
      archive_days: 365
      immutable: true    # append-only; UPDATE/DELETE prohibited
    protection:
      integrity_hash: SHA-256
      offload_to_siem: true
      siem_target: splunk_govcloud
      tamper_detection: true
    timestamp:
      format: ISO-8601
      timezone: UTC
      ntp_required: true
  evidence:
    - type: automated_scan
      tool: log_completeness_checker
    - type: configuration_review
      artifact: siem_integration_attestation.md

# ─────────────────────────────────────────────────────────────────────────────
# CM-6 / CM-7 — Configuration Management (Hardening)
# ─────────────────────────────────────────────────────────────────────────────
configuration_management:
  id: SC-CM-004
  nist_controls: [CM-6, CM-6(1), CM-7, CM-7(1), CM-9]
  title: Secure Baseline Configuration and Least Functionality
  description: >
    All system components must be deployed from DISA STIG or CIS Benchmark
    hardened baselines. Unapproved services, ports, and protocols are disabled.
    Configuration drift is detected and remediated automatically.
  status: required
  enforcement: warn       # warn at code-review; block at deploy
  requirements:
    baseline_source: DISA_STIG
    cis_benchmark_level: 2
    approved_os:
      - RHEL 9 (STIG hardened)
      - Ubuntu 22.04 LTS (CIS L2)
    container_hardening:
      non_root_user: true
      read_only_rootfs: true
      no_new_privileges: true
      seccomp_profile: runtime/default
      apparmor_profile: runtime/default
    network:
      default_deny_inbound: true
      allowed_ports_inbound: [443, 8443]
      disable_ipv6_unless_required: true
    services:
      disable_unused: true
      approved_services_only: true
    drift_detection:
      enabled: true
      scan_interval_hours: 6
      auto_remediate_confidence_threshold: 0.9
  evidence:
    - type: automated_scan
      tool: stig_compliance_scanner
    - type: configuration_review
      artifact: hardening_checklist.xlsx

# ─────────────────────────────────────────────────────────────────────────────
# SI-2 / RA-5 — Vulnerability Management
# ─────────────────────────────────────────────────────────────────────────────
vulnerability_management:
  id: SC-VULN-005
  nist_controls: [SI-2, SI-2(2), RA-5, RA-5(2), RA-5(5)]
  title: Continuous Vulnerability Scanning and Patch Management
  description: >
    All components undergo continuous automated vulnerability scanning.
    Critical/High findings must be remediated within SLA windows.
    SBOM is regenerated on every build and attested via in-toto/SLSA.
  status: required
  enforcement: block
  requirements:
    scan_frequency:
      sast: on_every_commit
      sca: on_every_commit
      container: on_every_build
      dast: on_every_deploy_to_staging
      infrastructure: daily
    sla_remediation_days:
      critical: 15
      high: 30
      medium: 90
      low: 180
    sbom:
      generate_on_build: true
      format: CycloneDX_1.5
      attest: true
      attestation_standard: SLSA_L2
    cve_feeds:
      - NVD
      - CISA_KEV
    auto_block_on:
      - critical_cve
      - exploited_in_wild_cve    # CISA KEV
  evidence:
    - type: automated_scan
      tool: grype_container_scanner
    - type: sbom_attestation
      artifact: sbom.cdx.json
