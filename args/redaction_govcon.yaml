# CUI // SP-CTI
# ICDEV™ GovCon-Specific Redaction Configuration
# Domain-specific recognizers for government proposal sensitive data.
# Loaded as custom Presidio recognizers by tools/redaction/govcon_recognizers.py

# ---------------------------------------------------------------------------
# Program Name Deny-List
# ---------------------------------------------------------------------------
# Add your specific program names here. These will be detected and replaced
# with codename surrogates (e.g., "Project ALPHA") before any cloud LLM call.
# Case-insensitive matching with word boundary detection.
program_names:
  # Example entries — replace with your actual program names:
  # - "Eagle Vision 2.0"
  # - "JRDC Phase III"
  # - "Project Thunderdome"
  []

# ---------------------------------------------------------------------------
# Protected Organization Names
# ---------------------------------------------------------------------------
# Your company, teaming partners, and key customer organizations.
# Detected and replaced with surrogates in cloud-bound prompts.
protected_organizations:
  # Example entries:
  # - "Acme Federal Solutions"
  # - "NovaTech Consulting"
  []

# ---------------------------------------------------------------------------
# Agency Codename Mapping
# ---------------------------------------------------------------------------
# Maps real agency names to codenames for surrogate generation.
# If an agency is detected but not in this map, it gets a generic surrogate.
# Applied only on cloud-bound prompts; the real name is restored in the
# response via de-anonymization, so proposals still read normally.
# trust-mask-04: seeded with common DoD/federal agencies so the deny-list is
# active out of the box. Extend/override per engagement.
agency_surrogates:
  "Missile Defense Agency": "Agency ALPHA"
  "Defense Health Agency": "Agency BRAVO"
  "Defense Information Systems Agency": "Agency CHARLIE"
  "Defense Logistics Agency": "Agency DELTA"
  "Defense Threat Reduction Agency": "Agency ECHO"
  "Defense Advanced Research Projects Agency": "Agency FOXTROT"
  "National Geospatial-Intelligence Agency": "Agency GOLF"
  "National Security Agency": "Agency HOTEL"
  "Defense Counterintelligence and Security Agency": "Agency INDIA"
  "Defense Intelligence Agency": "Agency JULIET"
  "Cybersecurity and Infrastructure Security Agency": "Agency KILO"
  "Defense Contract Management Agency": "Agency LIMA"

# ---------------------------------------------------------------------------
# Custom Sensitive Terms (user-defined words and phrases)
# ---------------------------------------------------------------------------
# Add ANY words or phrases that should be detected and redacted/replaced.
# These are matched case-insensitively with word boundaries.
# Each entry can specify treatment: surrogate (replaced with codename),
# redact (replaced with [CUSTOM_TERM]), or mask.
custom_terms:
  # Format: term string → treatment + optional replacement
  # Examples:
  # - term: "Operation Nighthawk"
  #   treatment: surrogate          # Replaced with "Operation PHOENIX" etc.
  # - term: "Site Bravo"
  #   treatment: redact             # Replaced with [CUSTOM_TERM]
  # - term: "2024 proposal strategy"
  #   treatment: redact
  # - term: "internal codename XYZ"
  #   treatment: surrogate
  []

# ---------------------------------------------------------------------------
# Contract Identifier Patterns
# ---------------------------------------------------------------------------
# Regex patterns for DoD/federal contract numbers, CAGE codes, etc.
# These are auto-detected — no deny-list needed.
contract_patterns:
  - name: DoD_contract
    # W91CRB-20-D-0001, FA8750-21-C-0502, N00024-18-C-5100 — the prefix is a
    # 6-character alphanumeric contracting office/activity code (letters and
    # digits in any arrangement), not "letters then digits" (the previous
    # pattern didn't actually match any of its own documented examples).
    pattern: "\\b[A-Z0-9]{6}-\\d{2}-[A-Z]-\\d{4,5}\\b"
    treatment: redact
    confidence: 0.95

  - name: task_order
    # 0001, TO-0001, TO0001
    pattern: "\\b(?:TO[-\\s]?)?\\d{4,6}\\b"
    treatment: redact
    confidence: 0.5
    # Only match when near contract context words
    context_words: ["task order", "delivery order", "CLIN", "contract"]

  - name: solicitation_number
    # W91CRB-24-R-0001, FA8750-24-Q-0001 — same 6-char alphanumeric prefix fix
    # as DoD_contract above.
    pattern: "\\b[A-Z0-9]{6}-\\d{2}-[RQBI]-\\d{4,5}\\b"
    treatment: redact
    confidence: 0.95

  - name: CAGE_code
    # 5-character alphanumeric (e.g., 3AYD7)
    pattern: "\\b[A-Z0-9]{5}\\b"
    treatment: redact
    confidence: 0.4
    # Low base confidence — boost with context
    context_words: ["CAGE", "cage code", "contractor", "vendor", "supplier", "awardee"]

  - name: UEI_number
    # 12-character alphanumeric (SAM.gov Unique Entity Identifier)
    pattern: "\\b[A-Z0-9]{12}\\b"
    treatment: redact
    confidence: 0.4
    context_words: ["UEI", "unique entity", "SAM.gov", "SAM registration"]

  - name: DUNS_number
    # 9-digit (legacy, still used in some records)
    pattern: "\\b\\d{9}\\b"
    treatment: redact
    confidence: 0.3
    context_words: ["DUNS", "D-U-N-S", "Bradstreet"]

# ---------------------------------------------------------------------------
# Financial/Pricing Patterns
# ---------------------------------------------------------------------------
pricing_patterns:
  - name: dollar_amount
    # $1.2M, $450/hr, $12,345,678.00, $1B
    pattern: "\\$[\\d,]+(?:\\.\\d{1,2})?(?:\\s?[MBKmk](?:illion|\\b))?(?:/hr|/hour|/yr|/year|/mo|/month)?"
    treatment: redact
    confidence: 0.8
    placeholder: "[$AMOUNT]"

  - name: rate_percentage
    # 12.5% fringe, 150% overhead, 8% fee
    pattern: "\\b\\d{1,3}(?:\\.\\d{1,2})?\\s?%"
    treatment: redact
    confidence: 0.4
    context_words: ["fringe", "overhead", "G&A", "fee", "profit", "indirect", "wrap rate", "burden"]
    placeholder: "[RATE]"

  - name: labor_rate
    # $125/hr, $150.00 per hour, $95 hourly
    pattern: "\\$\\d{2,4}(?:\\.\\d{2})?\\s?(?:per\\s+hour|/hr|hourly|per\\s+annum|/yr)"
    treatment: redact
    confidence: 0.9
    placeholder: "[$LABOR_RATE]"

# ---------------------------------------------------------------------------
# Past Performance Generalization Rules
# ---------------------------------------------------------------------------
# These rules help de-identify past performance narratives by generalizing
# specific details that could identify the contract/customer.
past_performance:
  # Generalize specific dollar amounts in past perf context
  generalize_amounts: true
  # Replace specific dates with ranges ("March 2023" → "Q1 2023")
  generalize_dates: true
  # Replace specific personnel counts ("team of 47" → "team of 40+")
  generalize_counts: true
  count_rounding: 10       # Round to nearest N

  # Context phrases that trigger past performance mode
  # When these appear, apply stricter generalization
  trigger_phrases:
    - "past performance"
    - "prior contract"
    - "previous engagement"
    - "reference contract"
    - "relevant experience"
    - "case study"
    - "contract performance"
    - "period of performance"

# ---------------------------------------------------------------------------
# Pulse Case Study Sanitization
# ---------------------------------------------------------------------------
pulse_sanitization:
  # Remove agency names from tags
  strip_agency_from_tags: true
  # Replace specific agencies with generic labels in body
  generalize_agencies: true
  agency_replacement: "a federal agency"
  # Remove NAICS codes from public articles
  strip_naics: true
  # Break traceability (don't store opportunity_id in pulse links)
  # WARNING: This prevents bidirectional audit — enable only for public articles
  break_traceability: false
  # Maximum detail level for public case studies
  max_detail_level: general  # general | moderate | detailed
