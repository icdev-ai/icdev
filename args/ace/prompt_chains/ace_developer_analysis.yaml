# ACE Developer Analysis Prompt Chain
# 4-step AI Developer analysis for RICOAS intake requirements.
#
# Variable substitution:
#   $INPUT    — previous step output (Step 1 receives RICOAS requirements text)
#   $ORIGINAL — the initial requirements text (available in all steps)
#   $STEP{step_id} — output from a specific named step
#
# Usage:
#   executor = PromptChainExecutor(config_path=Path("args/ace/prompt_chains/ace_developer_analysis.yaml"))
#   result = executor.execute_chain("ace_developer_analysis", user_input=requirements_text)

prompt_chains:
  ace_developer_analysis:
    description: "AI Developer analysis — enumerate interpretations, flag security risks, recommend approach, verify NIST 800-53 AC compliance"
    max_iterations: 1
    steps:
      - step_id: enumerate_interpretations
        agent: architect
        prompt: |
          You are the ICDEV™ Architect agent performing AI Developer analysis for a RICOAS requirements intake.

          Enumerate 2 to 4 distinct interpretations of the following requirement. For each interpretation:
          - Assign a short label (e.g., "Minimal MVP", "Full Automation", "Hybrid Human-AI")
          - Describe the key assumptions and scope boundary
          - List the primary technical components implied
          - Identify any ambiguities or missing information

          Return your response as a JSON object with this structure:
          {
            "interpretations": [
              {
                "label": "<short label>",
                "assumptions": "<key assumptions>",
                "scope": "<scope boundary>",
                "components": ["<component1>", "<component2>"],
                "ambiguities": ["<ambiguity1>"]
              }
            ]
          }

          Requirement: $INPUT
        timeout_s: 120

      - step_id: security_flags
        agent: security
        prompt: |
          You are the ICDEV™ Security agent. Review the following requirement interpretations
          and flag security concerns for each interpretation.

          For each interpretation, identify:
          - Authentication and authorization risks (focus on NIST 800-53 AC controls)
          - Data exposure or privilege escalation vectors
          - Input validation and injection risks
          - Supply chain or dependency concerns
          - Severity rating: critical / high / medium / low

          Return your response as a JSON object with this structure:
          {
            "security_flags": [
              {
                "interpretation_label": "<label from Step 1>",
                "concerns": [
                  {
                    "description": "<concern description>",
                    "severity": "critical|high|medium|low",
                    "nist_controls_affected": ["AC-2", "AC-3"]
                  }
                ]
              }
            ]
          }

          Interpretations to review:
          $STEP{enumerate_interpretations}

          Original requirement: $ORIGINAL
        timeout_s: 120

      - step_id: recommended_approach
        agent: architect
        prompt: |
          You are the ICDEV™ Architect agent. Based on the interpretations and security flags
          below, recommend the best implementation approach for the original requirement.

          Your recommendation must:
          - Select one interpretation (or synthesize a hybrid) with explicit justification
          - Address the highest-severity security concerns from the security review
          - List the implementation phases (ordered by priority)
          - Identify acceptance criteria for each phase
          - Note any prerequisite decisions or unresolved ambiguities that must be resolved first

          Return your response as a JSON object with this structure:
          {
            "recommended_approach": {
              "selected_interpretation": "<label or 'Hybrid'>",
              "justification": "<why this interpretation is recommended>",
              "security_mitigations": ["<mitigation for each critical/high concern>"],
              "phases": [
                {
                  "phase": 1,
                  "title": "<phase title>",
                  "deliverables": ["<deliverable>"],
                  "acceptance_criteria": ["<criterion>"]
                }
              ],
              "open_decisions": ["<decision or ambiguity to resolve>"]
            }
          }

          Interpretations:
          $STEP{enumerate_interpretations}

          Security flags:
          $STEP{security_flags}

          Original requirement: $ORIGINAL
        timeout_s: 150

      - step_id: compliance_verification
        agent: compliance
        prompt: |
          You are the ICDEV™ Compliance agent. Verify the recommended implementation approach
          against NIST 800-53 AC (Access Control) controls.

          For each applicable AC control family member, assess whether the recommended approach
          fully satisfies, partially satisfies, or does not address the control. For gaps,
          propose a specific remediation action.

          AC control family to evaluate (minimum): AC-1, AC-2, AC-3, AC-4, AC-5, AC-6,
          AC-7, AC-8, AC-14, AC-17, AC-18, AC-19.

          Return your response as a JSON object with this structure:
          {
            "compliance_gaps": [
              {
                "control_id": "AC-2",
                "control_name": "Account Management",
                "status": "satisfied|partial|not_addressed",
                "finding": "<specific gap or confirmation>",
                "remediation": "<required action if partial or not_addressed, else null>"
              }
            ],
            "overall_compliance_posture": "high|medium|low",
            "recommended_controls_to_implement_first": ["AC-2", "AC-3"]
          }

          Recommended approach:
          $STEP{recommended_approach}

          Security flags:
          $STEP{security_flags}

          Original requirement: $ORIGINAL
        timeout_s: 120

# Default settings
defaults:
  timeout_s: 120
  model_effort: high
  record_chain: true
  audit_trail: true
