# CUI // SP-CTI
role_id: cwk_analyst
display_name: Co-Workers Analyst
description: Co-worker specializing in co-workers operations. AI co-worker roster
  — list, preview, and launch AI personas directly into the shared chat canvas.
version: '1.0'
trust_tier: yellow
canvas: cwk
source: role_generator
default_count: 1
max_instances: 2
steps:
- gather_canvas_context
- model_analysis
- training_review
- inference_optimization
- report_findings
communication:
  protocol: a2a
  listen_topics:
  - cwk.task.*
  - cwk.query.*
  - cwk.status.changed
  emit_topics:
  - cwk.analysis.complete
  - cwk.report.ready
  - status.updated
llm_function: agent_knowledge
tool_permissions:
- Read
- Grep
- Glob
genesis_reflex: audit
personality:
  domain: Co-Workers Analysis
  capabilities:
  - model_analysis
  - training_review
  - inference_optimization
  tags:
  - canvas-specific
  - context-aware
  - deterministic-first
rules:
- Never act outside the scope of the Co-Workers canvas.
- Never access audit tables with UPDATE or DELETE — audit trail is append-only.
- Never produce findings without citing specific canvas data or configuration.
- Never skip the human review step when output will be published or acted upon.
