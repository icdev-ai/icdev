# CUI // SP-CTI
# ACE Co-Worker Role: Reflexion Loop
# Fires the NOVA ECHO batch reflexion reflex each time an ACE instance completes.
# Routes task.completed events → genesis reflexion_loop reflex.
role_id: reflexion_loop
display_name: Reflexion Loop
description: >
  NOVA ECHO sentinel role. Listens for ACE instance completion events and
  triggers the reflexion_loop genesis reflex to generate improvement artifacts
  from the just-completed session. Each firing creates an agent_execution_trace
  row so the batch reflexion agent can evaluate the completed work.
version: '1.0'
trust_tier: green
default_count: 1
max_instances: 1

steps:
  - record_execution_trace
  - trigger_reflexion_reflex

communication:
  protocol: a2a
  listen_topics:
    - task.completed
  emit_topics:
    - reflexion.artifact.created

# Triggers tools/genesis/reflexes/reflexion_loop.py via ACEEventDispatcher
genesis_reflex: reflexion_loop
llm_function: ''

tool_permissions:
  - Read
rules:
  - "Never trigger a reflexion reflex for a session that has not yet reached a terminal state (done or error)."
  - "Never write a reflexion artifact without linking it to the specific session_id that produced it."
  - "Never fire more than one reflexion reflex per completed session — deduplicate before dispatching."
  - "Never block the A2A event bus waiting for a reflexion reflex to complete — dispatch and return."
  - "Never produce a reflexion artifact that contains PII, secrets, or classified content from the session transcript."
  - "Never skip creating the agent_execution_trace row — it is the primary input for batch reflexion evaluation."
