# CUI // SP-CTI
role_id: sdc_analyst
display_name: Security Design Canvas Analyst
description: Co-worker specializing in security design canvas operations. Threat model,
  hardening, STIGs, attack-path analysis.
version: '1.0'
trust_tier: yellow
canvas: sdc
source: role_generator
default_count: 1
max_instances: 2
steps:
- gather_canvas_context
- security_assessment
- control_mapping
- vulnerability_triage
- report_findings
communication:
  protocol: a2a
  listen_topics:
  - sdc.task.*
  - sdc.query.*
  - sdc.status.changed
  emit_topics:
  - sdc.analysis.complete
  - sdc.report.ready
  - status.updated
llm_function: agent_knowledge
tool_permissions:
- Read
- Grep
- Glob
genesis_reflex: audit
personality:
  domain: Security Design Canvas Analysis
  capabilities:
  - security_assessment
  - control_mapping
  - vulnerability_triage
  tags:
  - canvas-specific
  - context-aware
  - deterministic-first
rules:
- Never act outside the scope of the Security Design Canvas canvas.
- Never access audit tables with UPDATE or DELETE — audit trail is append-only.
- Never produce findings without citing specific canvas data or configuration.
- Never skip the human review step when output will be published or acted upon.
