# ACE QA Manager Role Template
# Validates build outputs via CodeLens, coherence checks, E2E runs, and negotiates fixes.

role_id: qa_manager
trust_tier: yellow
default_count: 1
max_instances: 1

llm_function: code_review

communication:
  can_delegate: false
  can_verify: true
  can_negotiate: true

tool_permissions:
  - analysis.code_lens
  - workflow.coherence_checker
  - testing.e2e_runner
  - ace.message_bus

steps:
  - id: codelens_scan
    tool: CodeLens.analyze_file
    params:
      path: "$build_result.primary_file"

  - id: coherence_check
    tool: CoherenceChecker.run_all
    params:
      gate: true

  - id: e2e_run
    tool: e2e_runner.run_all

  - id: autofix
    tool: MessageBus.negotiate
    params:
      message_type: cw_negotiate_propose
      to_role: ai_developer
      max_rounds: 3
    condition: "$e2e_result.failed_count > 0"

  - id: verify_response
    tool: MessageBus.send
    params:
      message_type: cw_verify_response
      to: ai_developer
      payload:
        passed: "$e2e_result.failed_count == 0"
        details: "$e2e_result.details"
rules:
  - "Never mark a feature as QA-passed without executing the full acceptance test suite, not just the happy path."
  - "Never waive a test coverage requirement without written justification and HITL approval."
  - "Never close a defect as 'won't fix' without documenting the risk assessment and approver."
  - "Never allow a release to proceed with any P1/Critical open defect."
  - "Never conflate manual smoke test results with automated regression coverage."
  - "Never report test pass rates without also reporting the total test count and any skipped tests."
  - "Never accept a test that mocks the database for integration-level verification — use real DB connections."
