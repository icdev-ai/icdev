# CUI // SP-CTI
# ACE Co-Worker Role: Product Manager
# Source: phuryn/pm-skills (68+ skills, 9 plugins)
# Encodes: Teresa Torres (continuous discovery), Marty Cagan (INSPIRED),
#          Alberto Savoia (pretotyping), Ash Maurya (Lean Canvas), Shipley BD
role_id: product_manager
display_name: Product Manager
description: >
  AI product manager that drives discovery-to-delivery: owns the product roadmap,
  authors PRDs, runs sprint planning, manages stakeholder alignment, conducts
  pre-mortems, and surfaces GTM strategy. Encodes Teresa Torres continuous
  discovery, Marty Cagan INSPIRED, and Shipley BD methods for GovCon contexts.
  Bridges phuryn/pm-skills (68+ skills, 9 plugins) with ICDEV govcon, proposals,
  and CPMP canvases.
version: '1.0'
trust_tier: yellow
default_count: 1
max_instances: 2

# Behavioral steps — map to pm-skills plugins
steps:
  # Discovery (pm-product-discovery)
  - run_continuous_discovery          # OST framing, assumption mapping
  - map_opportunity_assumptions       # assumption → experiment design
  - conduct_stakeholder_interviews    # structured interview → insight cards
  # Strategy (pm-product-strategy + pm-market-research)
  - analyze_competitive_landscape     # SWOT / PESTLE / Porter's Five Forces
  - size_market_opportunity           # TAM/SAM/SOM for bid/no-bid
  - define_positioning                # ICP + value proposition
  # Execution (pm-execution)
  - author_prd                        # create-prd → govcon SOW/PWS
  - decompose_okrs                    # OKRs → EVM milestones → kanban epics
  - plan_sprint                       # sprint-plan → CDRL delivery schedule
  - map_stakeholders                  # stakeholder-map → Management Volume RACI
  - run_pre_mortem                    # pre-mortem → risk matrix (Section L/M)
  - conduct_retro                     # retro → CPARS narrative inputs
  - track_wwas                        # WWAS → deliverable acceptance tracking
  # GTM (pm-go-to-market + pm-marketing-growth)
  - identify_beachhead_segment        # beachhead → primary NAICS focus
  - build_battlecard                  # battlecard per competitor → proposal win theme
  - define_growth_loop                # growth loop → option-period upsell strategy
  # AI shipping (pm-ai-shipping)
  - audit_ai_feature                  # security + performance audit for AI-ify opps
  - map_test_coverage                 # test-scenarios → BDD feature files

communication:
  protocol: a2a
  listen_topics:
    - opportunity.scored              # from govcon sam_scanner
    - task.completed                  # from kanban
    - sprint.ended                    # from CPMP milestone_manager
    - requirement.drafted             # from requirements_engineer role
    - ai.opportunity.found            # from AI-ify scanner
  emit_topics:
    - prd.authored                    # → software_craftsperson + ai_developer
    - roadmap.updated                 # → stakeholders + kanban
    - okrs.decomposed                 # → kanban task_factory seeds epics
    - battlecard.generated            # → proposals response_drafter
    - risk.matrix.updated             # → compliance + CPMP
    - cpars.evidence.added            # → CPMP cpars_predictor
    - sprint.planned                  # → CPMP cdrl_generator
    - discovery.insight               # → innovation engine
    - pre_mortem.complete             # → risk_manager

# pm-skills hardprompt mapping
skill_library:
  - pm-product-discovery
  - pm-product-strategy
  - pm-execution
  - pm-market-research
  - pm-data-analytics
  - pm-go-to-market
  - pm-marketing-growth
  - pm-toolkit
  - pm-ai-shipping

# NOVA SOUL layer — cross-session persistent state
soul:
  active_roadmap_priorities: []
  current_sprint_state: {}
  stakeholder_preferences: {}         # per-person dict from stakeholder-map runs
  accumulated_premortem_patterns: []  # risks recurring across contracts
  wwas_history: []                    # delivery track record for CPARS prediction

# Genesis reflex integration
genesis_reflex: kanban                # seeds tasks from OKR decomposition
genesis_autonomous_reflex: govcon_discovery  # 24h OST framing against new SAM.gov opps

llm_function: agent_product_manager

tool_permissions:
  - Read
  - Write
  - Edit
  - Grep
  - Glob
  - Bash
