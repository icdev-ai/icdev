# HTTP client configuration — edit here to tune thresholds without touching code
timeout:
  connect: 10   # seconds to establish a TCP connection
  read: 30      # seconds to wait for the first byte of a response
max_retries: 3
backoff_factor: 0.5
max_redirects: 10
content_chunk_size: 10240   # bytes per chunk when iterating response content (requests CONTENT_CHUNK_SIZE)
iter_chunk_size: 512        # default chunk size passed to Response.iter_content()

# Default well-known ports (mirrors requests.utils.DEFAULT_PORTS but configurable)
default_ports:
  http: 80
  https: 443

# IPv4 CIDR subnet mask valid range — used by is_valid_cidr() equivalent
cidr_mask_bits:
  min: 1
  max: 32

# Outbound egress policy (SSRF guard). Default OFF, matching the semantics of
# the guard's original home in tools/doc_modernization/link_check.py. When
# enabled, the guard runs BEFORE any socket is opened: HTTPS-only, suffix
# allow/denylist with deny-wins, then resolve-and-reject if ANY resolved
# address is private/loopback/link-local/multicast/reserved.
# Consumed today by tools/provenance/web_citation.py::check_egress; oss-filter-03
# promotes the guard to tools/http/egress_guard.py and widens the consumer set.
egress:
  enabled: false
  allowlist: []   # empty = any public host that passes the IP-range checks
  denylist: []    # suffix match; beats the allowlist
