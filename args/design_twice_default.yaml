# OPT-52 — Default constraint set for tools/planning/design_twice.py.
# Adapted from mattpocock/skills/design-an-interface (MIT).
#
# Each entry produces one variant of the designed module. Add or remove
# entries to tune how many parallel designs the runner produces.
constraints:
  - id: minimal_surface
    label: Minimal surface
    prompt: >-
      Minimize method/function count. Aim for 1-3 public entry points.
      Hide everything else behind composition. Optimize for 'the
      smallest API that still solves the problem'.

  - id: maximum_flexibility
    label: Maximum flexibility
    prompt: >-
      Maximize flexibility and extensibility. Assume the caller will
      want to plug in new behaviors, swap strategies, and observe
      internal events. Prefer composition, strategy patterns, and
      explicit extension points.

  - id: common_case_optimized
    label: Common case optimized
    prompt: >-
      Optimize hard for the most common case. Make the common path a
      single obvious call with sensible defaults. Rare cases can
      require more code as long as the 80% path is trivial.

  - id: inspired_by_stdlib
    label: Inspired by stdlib
    prompt: >-
      Take inspiration from well-designed standard libraries (Python
      stdlib, Go stdlib, Rust std). Favor orthogonality, familiar
      naming, and composition with existing types.
