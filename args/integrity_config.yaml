  - tools/network/seed_sops.py  # sipa-persistence-generic fired on line 2313: the match is "systemctl enable --now named" inside a static Python dict containing a SOP step's "command" string — a human-readable instruction for an operator, never executed by the platform. Authorized as a false-positive data-string match by REQ-NETWORK-SEED-SOPS-PERSISTENCE-FP-01 (assessment-115 review, 2026-06-27).
