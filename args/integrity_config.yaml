# ---------------------------------------------------------------------------
# Known-safe ICDEV modules that contain SIPA persistence-detector false
# positives — the matched text is a static SOP instruction string (data),
# not executable code that installs system persistence.
# Adding a module path here suppresses the 'persistence' category
# known_bad_signature finding in Mode A self-scans only.
# ---------------------------------------------------------------------------
known_safe_persistence_modules:
  # ── Added for the 2026-07-28 persistence triage (task-e74c6d806f) ──
  - tools/cli/provision_db.py  # sipa-persistence-generic fired on line 483: the match is "sudo systemctl enable --now postgresql" inside the list of strings returned by install_guidance(), whose docstring says "Deliberately printed rather than executed." Its only caller is line 640 — `for line in install_guidance(_p.system()): print(f"  {line}")` — so the text is operator guidance for installing PostgreSQL by hand, never executed by the platform. Same false-positive class as tools/network/seed_sops.py below. Authorized by REQ-PROVISION-DB-PERSISTENCE-FP-01.
