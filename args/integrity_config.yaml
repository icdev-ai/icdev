# Known-safe ICDEV modules that legitimately call importlib.import_module on a
# non-literal (variable) module name — explicitly authorized. The
# 'dynamic_import' known_bad_signature category is designed to catch imports of
# attacker-controlled module names (e.g., from user input). Adding a module path
# here suppresses the known_bad_signature 'dynamic_import' finding for that
# specific file in Mode A (provenance_aware) self-scans only; it has no effect
# on external-artifact assessments.
# ---------------------------------------------------------------------------
# ---------------------------------------------------------------------------
# Known-safe ICDEV modules that legitimately use the crypto capability
# (hashlib / hmac) for cryptographic protocol purposes — explicitly authorized.
# The SIPA 'crypto' detector flags hashlib.sha256/hmac calls; in these modules
# they serve as standard JWT signature verification primitives (RS256 / PKCS#1
# v1.5), not unauthorized token-signing or ransomware-style encryption. Adding
# a module path here suppresses the unauthorized_capability 'crypto' finding in
# Mode A (provenance_aware) self-scans only; it has no effect on
# external-artifact assessments.
# ---------------------------------------------------------------------------
known_safe_crypto_modules:
  - tools/gateway/adapters/botframework_base.py  # hashlib.sha256 in _validate_jwt_signature: RS256 PKCS#1 v1.5 JWT digest for stdlib-only Bot Framework token authentication. Authorized by Decision D133 (channel adapters ABC) + D142 (BotFramework shared base Teams+Skype).
  - gateway/adapters/botframework_base.py  # same file — relative path when scanning from tools/ root (Genesis self-scan)
  - tools/gateway/adapters/github.py  # hmac.new + hmac.compare_digest in verify_signature: HMAC-SHA256 of raw webhook body vs X-Hub-Signature-256 header per GitHub webhook security protocol. Not token-signing or ransomware-style encryption. Authorized by Decision D133 (channel adapters ABC) + Decision D143 (GitHub/GitLab !icdev comment prefix adapter).
  - gateway/adapters/github.py  # same file — relative path when scanning from tools/ root (Genesis self-scan)
  - tools/gateway/adapters/gitlab.py  # hmac.compare_digest in verify_signature: timing-safe comparison of X-Gitlab-Token shared secret per GitLab webhook security protocol (prevents timing side-channel attacks on token equality). Not token-signing or ransomware-style encryption. Authorized by Decision D133 (channel adapters ABC) + Decision D143 (GitHub/GitLab !icdev comment prefix adapter).
  - gateway/adapters/gitlab.py  # same file — relative path when scanning from tools/ root (Genesis self-scan)
  - tools/billing/stripe_handler.py  # hmac.new + hmac.compare_digest in verify_stripe_signature: HMAC-SHA256 of raw webhook body vs Stripe-Signature header per Stripe webhook security protocol (https://stripe.com/docs/webhooks/signatures). Same pattern as GitHub/GitLab adapters above. Not token-signing or ransomware-style encryption. Authorized by REQ-BILLING-WEBHOOK-HMAC-01 (Stripe webhook integrity verification for SaaS billing events).
  - billing/stripe_handler.py  # same file — relative path when scanning from tools/ root (Genesis self-scan)
  - tools/api/webhook_engine.py  # hmac.new + hmac.compare_digest in sign_payload/verify_signature: HMAC-SHA256 of outbound webhook body added as X-ICDEV-Signature header per standard webhook security protocol (same pattern as GitHub/GitLab/Stripe adapters). Implements NIST 800-53 SC-8 (transmission integrity). Not token-signing or ransomware-style encryption. Authorized by REQ-WEBHOOK-HMAC-01 (webhook delivery engine payload integrity).
  - api/webhook_engine.py  # same file — relative path when scanning from tools/ root (Genesis self-scan)
  - tools/auth/api_key.py  # hashlib.sha256 in _hash(): one-way SHA-256 hash of raw API keys before DB storage — plaintext keys are never persisted per NIST 800-53 IA-5(1). Authorized by REQ-21-003 (SaaS API Key Authentication: "validating against SHA-256 hashed keys stored in the api_keys table. Plaintext keys SHALL never be stored.").
  - auth/api_key.py  # same file — relative path when scanning from tools/ root (Genesis self-scan)

