# ---------------------------------------------------------------------------
# Platform-wide capability authorizations — capability types listed here are
# authorized for ALL ICDEV first-party tools/ modules in Mode A self-scans.
# Use ONLY for low-risk capabilities used pervasively for legitimate platform
# operations where per-module entries would be impractical and the capability
# has no meaningful attack surface on first-party code.
# The stronger dangerous_api co-presence rule (dynamic_code + obfuscation
# taint-linked exec) still fires regardless of this list.
# ---------------------------------------------------------------------------
platform_authorized_capabilities:
  # hashlib.sha256 / sha1 / md5 — used across 315+ modules exclusively for
  # non-keyed content fingerprinting, deduplication, cache keys, and data
  # integrity verification (not for symmetric/asymmetric encryption, HMAC
  # signing, or key derivation — those are authorized individually in
  # known_safe_crypto_modules above with explicit NIST 800-53 justifications).
  # Risk weight: 0.40 (low) — the lowest-risk capability type in SIPA.
  # Authorized by REQ-PLATFORM-CRYPTO-FINGERPRINT-01 (assessment-115 review,
  # 2026-06-27): "The ICDEV platform SHALL use cryptographic hash functions
  # (SHA-256, SHA-512, SHA-1, MD5) for non-keyed content fingerprinting,
  # deterministic ID generation, cache-key derivation, and data integrity
  # verification throughout the tools/ tree. These are non-secret, non-keyed
  # operations that produce deterministic digests of known inputs; they carry
  # no exfiltration, ransom, or covert-channel risk."
  - crypto
