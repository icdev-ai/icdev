# CUI // SP-CTI
# ---------------------------------------------------------------------------
# Capability liveness gate  (exa-live-02)
# ---------------------------------------------------------------------------
# Consumed by: tools/workflow/coherence_checker.py :: _load_liveness_gate
# Gate source: tools/workflow/coherence_checker.py :: check_capability_liveness
# Measurement:  tools/awareness/capability_consumption.py :: collect
#
# ICDEV's signature defect is not a capability that breaks. It is one that is
# registered, importable, catalogued, enabled — and never consumed, while
# nothing goes red. The reflex version of it shipped three times (xbm-wake-01,
# xbm-wake-02, hgx-obs-02) before it got a check of its own; the audit hash
# chain, MCPToolAuthorizer, the prompt registry and GEPA are the same defect
# wearing different clothes. This gate generalises the reflex-shaped check to
# every capability class capability_consumption.py can measure.
#
# WHAT FAILS THE GATE
#   A declared capability unit with ZERO consumption over the telemetry's whole
#   LIFETIME — never dispatched, never decided, never registered, never run.
#   Per class, the number of such units may not exceed the count below.
#
# WHAT DOES NOT FAIL THE GATE
#   A unit consumed at some point but idle inside the recent window. A reflex on
#   a quarterly schedule is not the same defect as a reflex that has never run,
#   and conflating the two makes the gate cry wolf until someone silences it.
#   Those units are reported as `idle_this_window` and counted separately.
#
#   A database with no operating history. Counts here are evidence only when the
#   platform has actually been running: on a fresh worktree, an ephemeral CI
#   database or an unreachable backend, every declared unit looks inert because
#   NOTHING has been recorded, not because nothing is wired. The check reports
#   `warn` in that case rather than a fabricated failure — the same rule
#   capability_consumption.py applies to an absent telemetry table ("unmeasurable
#   is never reported as zero"). `evidence_anchor` is what draws that line.
#
# THE COUNTS ARE A RATCHET
#   Lower a count when you wire a capability up. NEVER raise one to get a commit
#   through — raising it is how the backlog this gate exists to drain grows
#   instead. If a new capability genuinely cannot be consumed yet, that is a
#   reason to not declare it yet.
#
#   A capability class absent from `grandfathered` gets a budget of 0. That is
#   deliberate: a NEW class of declared-but-unconsumed capability is exactly the
#   thing this gate is for, and it should have to argue its way in.
#
# THE ONE SANCTIONED EXCEPTION (ctx-reach-02)
#   A module can have zero in-repo consumers ON PURPOSE: an SDK surface whose
#   callers live in other git repositories, where the only available in-repo
#   caller would be a loopback into the process already holding the callee.
#   tools/cortex/client.py is the case that forced the question.
#
#   That does NOT belong here as a raised budget. It is declared in
#   args/external_only_surfaces.yaml and enforced by a check of its own,
#   coherence_checker.py::check_external_only_surfaces, which makes the
#   exception carry obligations rather than an allowance: a decision doc the
#   module's own docstring names, ZERO production importers (checked in both
#   directions — an importer appearing means DELETE the declaration, because the
#   module is an ordinary capability now and belongs back under this gate), a
#   vendor_parity pin, and a test in args/ci_test_files/core.txt. There is no
#   number in that file to raise. If you are about to add a budget here for a
#   module nothing calls, check whether it is that shape first — and if it is
#   not, wire it up.
# ---------------------------------------------------------------------------

classification: CUI // SP-CTI

# Recent-activity window, in days. Only used to split never-consumed units from
# consumed-but-idle ones; the pass/fail decision reads the lifetime pass.
window_days: 30

# The "lifetime" lookback. Large enough to predate any row in this platform's
# telemetry — a unit inert across this window has genuinely never been consumed.
lifetime_days: 36500

# Proof that the database being measured has an operating history at all.
# Below `min_rows` the whole check degrades to `warn`, because a count of zero
# from an empty database says nothing about the tree.
evidence_anchor:
  table: audit_trail
  min_rows: 1000

# Allowed count of declared-but-never-consumed units, per capability class.
#
# Backlog re-measured 2026-08-12 (exa-live-03) against the live PostgreSQL
# platform database — audit_trail: 82,355 rows, well clear of the evidence
# anchor — with `python tools/awareness/capability_consumption.py --json`.
# 628 declared units across the seven measurable classes, 534 never consumed.
#
# Three classes were DRAINED and are therefore ABSENT rather than pinned at 0
# (an absent class already gets a budget of 0; keeping a 0 entry only invites a
# future session to edit it upward). They are recorded here so the next session
# reads "fixed" instead of rediscovering them:
#
#   reflex          74 declared, 74 consumed. Drained by the reflex-specific
#                   checks that predate this gate — check_reflex_registry and
#                   tests/test_reflex_dispatch_parity.py — after the same bug
#                   shipped three times (xbm-wake-01/02, hgx-obs-02).
#   audit_chain     1 declared, consumed. The migration-149 hash chain is now
#                   written by audit_logger.log_event (#1549) and swept by
#                   tools/audit/chain_sweep.py (exa-audit-04). Unit-level it is
#                   live; per-row CHAIN COVERAGE is a different question and is
#                   reported in the check's detail lines, not gated here.
#   prompt_template 14 templates under hardprompts/, 14 consumed — 17 rows in
#                   prompt_versions. Drained by exa-refine-01 (LLMRouter reads
#                   the registry as a supplemental prompt layer) and
#                   exa-refine-02 (--import-hardprompts / --seed-call-sites gave
#                   it rows). Note the class is still listed in
#                   args/capability_consumption.yaml::known_inert_cases on
#                   purpose: a wired read path against an UNSEEDED registry is
#                   still a no-op, so a fresh install must be able to see it.
#
# What remains below is the real backlog.
grandfathered:
  # 471 tools in TOOL_REGISTRY; 4 ever dispatched through the Studio MCP tool
  # gate (health_check, nist_lookup, studio_run_start, studio_run_status) across
  # 19 recorded dispatches. The bulk of the registry is reachable only from
  # surfaces that do not route through that gate, so the honest reading is "the
  # dispatch audit does not see most of the registry" as much as "the registry
  # is inert" — both are the same class of finding: a declared capability
  # nothing can prove is used. Draining this means routing the other MCP entry
  # points through the same audit, not dispatching 467 tools by hand.
  #
  # 466 -> 467 is a BASELINE CORRECTION, not an accommodation. TOOL_REGISTRY has
  # held 471 entries since before c83261305 (the exa-live-02 commit that wrote
  # 466) and `git diff c83261305..HEAD -- tools/mcp/` is empty, so the declared
  # set has not grown; the 470 in the previous comment was simply one short and
  # the gate has been red on main ever since. Verified 2026-08-12:
  # `python -c "from tools.mcp.tool_registry import TOOL_REGISTRY; print(len(TOOL_REGISTRY))"` -> 471.
  #
  # Consequence to know before you register a new MCP tool: this budget is
  # coupled to the registry SIZE, so a tool added without a gated dispatch trips
  # the check by +1. That is the gate working — a newly declared tool nothing
  # dispatches is precisely the defect. Wire it, or do not register it yet.
  mcp_dispatch_tool: 467

  # args/agent_approval_policy.yaml enumerates 62 tools across its tiers and
  # agent_approval_log holds not one decision for any of them — 0 rows, whole
  # table, whole lifetime. A gate whose decision log is empty has never gated
  # anything. The policy file is read; nothing writes the verdict.
  agent_approval_rule: 62

  # 5 RBAC roles in the D261 role_tool_matrix, 1 seen in an MCPToolAuthorizer
  # verdict. exa-policy-05 landed the enforcement seam MONITOR-ONLY by design,
  # so the other 4 roles cannot appear in a verdict until it flips to blocking
  # and real traffic arrives under those roles. Expect this to drain on its own
  # once enforcement is on; lower it then rather than waiting for a task.
  mcp_tool_authorization: 4

  # GEPA. 124 pending agent_improvement_artifacts, 0 applied, and 0 that satisfy
  # its own selection predicate — every queued artifact has
  # composite_score == baseline_score, so the >= 0.05 delta filter can never
  # select one. It is dispatched every 24h and cannot act, which is why it reads
  # as scheduled-and-healthy while doing nothing.
  skill_optimizer: 1
