# OPT-70 — Autonomous PR watcher configuration.
# Consumed by tools/ci/pr_watcher.py.

# Seconds between polls in --daemon mode
poll_interval_seconds: 30

# Hard cap on resume cycles per task — prevents infinite CI-failed loops
max_resume_cycles_per_task: 5

# Auto-merge squash on CI green + review approved
auto_merge_enabled: true
auto_merge_require_approval: false

# "CI is green" means the REQUIRED checks are green -- the forge's rule, read
# from branch protection (task-det-295a9bb95e).
#
# `Test (Windows)` is NON-REQUIRED ON PURPOSE: icdev-ci.yml says "a Windows-only
# flake cannot block a merge", and branch protection requires Lint / Test /
# Security Scan / Helm Lint alone. This watcher read EVERY check, so one red
# Windows run classified PR #1859 `ci_failed` with its required set fully
# green, spent all five resumes on a branch that had no defect in it, escalated
# to "manual intervention required" and filed a NEEDED-A-HUMAN card. #1841 was
# the same shape; 2 of the 11 `ci_failed` escalations since 2026-08-14 were
# this. The forge merged both -- because the forge only ever asked about the
# required set.
#
# The set is READ from the default branch's protection rule (the GitHub
# branches/<name>/protection endpoint) through
# merge_readiness.fetch_required_checks -- never a list here, which would
# drift the day `E2E (Playwright)` or `Test (Windows)` is promoted (the
# CLAUDE.md note on promoting E2E already names the three hard-coded copies
# that disagree with GitHub). A failing check OUTSIDE the set is named on the
# audit row ("ignored non-required failing check(s): ...") and in the
# merge-readiness reason, never dropped.
#
# UNRESOLVED IS NOT EMPTY. No protection rule, a token that may not read it,
# a rule with no required checks -- every one reads as None and the watcher
# counts every check, exactly as before; it says so in the log. An EMPTY
# required set is deliberately None too: merging on nothing is the direction
# with consequences. The answer is cached (including an unresolved one) for
# `required_checks_cache_seconds`, so it costs one call per window.
#
# `false` restores the old read -- a flag flip, not a revert.
required_checks_only: true
required_checks_cache_seconds: 300

# Take a GREEN PR out of draft so auto-merge can actually run.
#
# Without this the pipeline is autonomous right up to the last step and then
# stops: a dispatched session opens its PR as a draft, CI goes green, and
# `gh pr merge` is refused with "Pull Request is still a draft" on every cycle
# thereafter. Nothing in the loop could clear it, so finished work piled up
# waiting for a human to click a button — 5 of 10 open PRs on 2026-08-09.
#
# This is NOT a way around a human hold. Un-drafting is refused for a manual
# gate row, and for any task whose `depends_on_task_id` is unsatisfied — which
# is how a MANUAL-ONLY card (e.g. AGOV) expresses "a human decides when this
# ships". For those the draft IS the brake, and it stays on. Set false to
# require a human on every PR regardless.
#
# A HOLD LABEL ALSO STOPS THIS, not merely the merge (kpr-watch-04). Any of
# hold / do-not-merge / "do not merge" / wip / no-automerge / blocked on the PR
# suppresses BOTH the un-draft and the merge, on the task-linked path as well as
# the unlinked sweep. Un-drafting here is not a human clicking "Ready for
# review"; it is a step of the watcher's own merge sequence, and that sequence
# must not run for a PR somebody has explicitly marked not-finished. A person
# may still un-draft by hand at any time — the merge is refused afterwards, so
# the two controls stay independent where that matters. The label list lives in
# `NO_AUTOMERGE_LABELS` in tools/ci/merge_readiness.py, deliberately in code
# rather than here: it is the vocabulary the shared merge-readiness classifier
# reports as the `held_label` state, and a per-deployment list would let a label
# mean two different things again.
auto_ready_draft_prs: true

# Truncate CI log excerpts before injecting as resume context
ci_log_max_chars: 4000

# Auto-rebase a DIRTY PR before spending a resume (kax-conflict-01).
# A branch that has merely drifted behind main goes DIRTY, and today that is a
# resume class: the PR burns all max_resume_cycles_per_task LLM resumes on a
# conflict a plain `git rebase origin/main` would have cleared, then lands in a
# permanent human queue. When enabled, the watcher rebases the branch in an
# isolated scratch worktree and force-with-lease-pushes it — but ONLY when the
# rebase applies cleanly and ONLY for kanban/<task-id> (or its -rN retry
# sibling). A rebase with real conflicts aborts, pushes nothing, and escalates
# exactly as before. Rebase attempts are counted separately from resumes, so
# this never eats into the resume budget.
#
# THE CAP IS PER BASE ERA, NOT PER PR LIFETIME (kpr-watch-07).
# Two attempts is right for a verdict that goes stale once and wrong for a
# conflict that RECURS. GitHub does not apply `.gitattributes` merge drivers, so
# every PR that appends to a union-merged path — `args/ci_test_files/core.txt`
# above all, which CLAUDE.md requires of every PR adding a test file — is
# reported CONFLICTING again each time main appends to the same file. A rebase
# clears it every time, by writing the union resolution into the branch. With a
# lifetime cap the PR ran out after two and could never take the one action that
# works: measured 2026-08-17, nine of ten open PRs were DIRTY, hcx-evt-03 had
# spent its budget the previous afternoon and had 499 `escalate` rows, and a
# rebase run by hand flipped five of them to MERGEABLE in seconds.
# `_rebase_attempts` therefore discounts attempts spent against a DIFFERENT base
# sha. Attempts against the current base still count, so a genuinely stuck PR is
# still capped at this number and cannot rebase on every poll.
auto_rebase_on_conflict: true
max_rebase_attempts_per_task: 2

# Sibling-file-conflict guard (kph): before auto-merging a PR, fetch every open
# PR's changed files and flag when the candidate races another open PR on the same
# SOURCE file (union-merged coordination files are excluded). Warn + audit always;
# set hold_on_sibling_conflict to also serialize the merge (wait) instead of racing.
#
# MEASURED 2026-08-08, which is why hold is now ON. The `sbx` card had 12 sibling
# PRs open at once (#1351 #1352 #1354 #1355 #1357 #1359 #1361 #1362 #1364 #1365
# #1367 and the since-closed #1350), every one of them editing the same four
# files: tools/compliance/sbom_generator.py, the 2026 gap-analysis doc,
# docs/security/sandbox-coverage.md and docs/reference/commands.md. With hold
# OFF the watcher merged whichever won the race and left the other eleven DIRTY;
# each then burned its whole resume budget on the conflict, and a dry poll that
# day reported `merge_conflict` + "resume cap reached (5/5) - manual intervention
# required" for every one of them. That is the entire AWAITING MERGE backlog, and
# no auto_merge_enabled setting could have prevented it: a CONFLICTING branch is
# unmergeable by construction.
#
# Serializing costs one poll interval per queued sibling (30s). Racing costs a
# rebase, a CI cycle and up to five LLM resumes per loser. auto_rebase_on_conflict
# below is the repair path; this is the prevention, and prevention is cheaper.
sibling_conflict_check: true
hold_on_sibling_conflict: true

# Already-on-main guard (trust-disc-05, extended to the merge path).
# The board tracks task -> PR. Nothing checked task -> MAIN, and those are
# different questions: a PR whose work already merged under a different number
# stays green, stays MERGEABLE, and merging it re-applies a diff against a
# branch that has moved on. #1651 was -38/+26 on rest_v1.py — merging it would
# have DELETED 38 lines main currently has. Every gate on the board said green,
# because every gate on the board asks about the PR.
#
# `tools.kanban.landed_check` already answers this and is already consulted at
# SEED time (task_factory) and DISPATCH time (reflexes/kanban.py). This wires
# the third moment — one `git log --grep` for the whole batch, once per cycle,
# same shape as the sibling map above.
#
# POSTURE. Warn + audit always; the HOLD is opt-in via KANBAN_LANDED_CHECK=enforce,
# reusing landed_check's own switch rather than inventing a second one. Surveyed
# at THIS call site before wiring (the earlier survey measured the dispatch
# population and does not transfer): 2026-08-16, the 6 task-linked open PRs the
# merge path sees produced 0 fires, with 1 body-only reference, which never
# blocks. Against the 3 known true positives — rem-hyg-02 (#1738), ctx-perf-02
# (#1646), ctx-trust-02 (#1651) — it fires on 3 of 3 with `subject` evidence.
# Re-survey before defaulting the mode to enforce.
#
# Set false to skip the batch lookup entirely. It is FAIL-OPEN either way: an
# unavailable git reports checked:false, which is never read as a finding.
landed_check_on_poll: true

# Superseded-PR guard (mfx-mrg-02) — CLOSE the duplicate instead of holding
# the whole queue behind it.
#
# THE DEFECT, four times in two days. #2015's single commit merged in #2014
# FORTY-TWO SECONDS earlier; #1985's in #1983, eighty-two seconds earlier; #2056
# was the kpr-stale-06 branch re-opened after #2053 had already squashed it; and
# #2049 (kpr-stale-05) had both its commits absorbed into #2053. Each then sat
# CONFLICTING or "ahead" indefinitely, and — because it was still OPEN — each
# held `no_sibling_conflict` against every other PR touching the same files.
# #2015 blocked #2016 on compliance_server.py. Every one was diagnosed by a
# human running `gh pr view <sibling> --json commits` and closed by hand.
#
# NONE OF THE GUARDS ABOVE COULD SEE IT, and each asks a question that is nearly
# this one and is not: `landed_check_on_poll` greps commit SUBJECTS for the TASK
# ID, so kpr-stale-05's work landing inside a PR whose subject names
# kpr-stale-06 is invisible to it; `refuse_merge_when_behind` measures distance
# from main, and a duplicate at the SAME head sha as a merged PR is 0 behind;
# `sibling_conflict_check` lists which OPEN PRs share a file, which is the thing
# the duplicate was jamming rather than the thing that finds it. And
# `_supersede_stale_prs` in reflexes/kanban.py closes a task's OTHER OPEN PRs at
# PR-open time, same task only — three of these four cases are a MERGED sibling
# and one is a different task entirely.
#
# THE SIGNAL IS THE COMMIT LIST. GitHub keeps a merged PR's commit oids whatever
# merge method was used, so a SQUASH — which leaves nothing on main carrying the
# branch's shas — is still answerable. The rule: our head sha is in a merged
# family sibling's commit list AND every commit we can see is in that list.
# Requiring the HEAD closes the truncation hole (`gh` caps the commits
# connection, and a short list of OURS would make the subset test trivially
# true). "Family" is the same head branch, or our branch / PR number NAMED in
# the sibling's title or body — never a title resemblance.
#
# SURVEYED BEFORE ARMING, over the live board 2026-09-05
# (docs/audits/mfx-mrg-02-superseded-pr-survey.md). Of the 15 open PRs, EIGHT
# fire — and all eight are duplicates at an IDENTICAL head sha to an
# already-merged PR, verified one by one. That 53% is the MEASURED SIZE OF THE
# DEFECT on a board mid-incident, not a threshold and not routine work being
# refused: a legitimate PR always holds at least one commit no merged PR has,
# and the subset rule cannot fire on it. Recall on the recent closed-unmerged
# population is 2 of 2 — the two known incidents. Dropping the family
# requirement adds ZERO further fires, so it is kept: it costs nothing and it is
# what guarantees the close can cite a PR number.
#
# WHAT IT DOES AND DOES NOT DO. It comments the evidence and CLOSES. It never
# merges, never un-drafts, never force-pushes and never deletes a branch —
# closing removes nothing from main and the comment says how to reopen. If the
# task is not already terminal, `landed_check` is asked whether its work is on
# main and the task is completed ONLY on a checked, positive answer; a sibling
# containing our commits proves the PR is redundant and does NOT prove the
# task's own deliverable landed, so an unchecked or negative report completes
# nothing and says so on the audit row.
#
# FAIL-OPEN. No gh, a refused listing, a PR with no head sha or no commit list
# all report `checked: false`, which is never a finding — the PR takes exactly
# the path it took before. Audit rows: `close_superseded`, `superseded_warn`
# (report-only / dry run) and `superseded_close_failed`, all under the
# `superseded` classification.
#
# Set superseded_close false to audit without closing. Set superseded_check
# false to skip the merged listing entirely.
superseded_check: true
superseded_close: true

# How many recently-merged PRs to consider. `commits` is an expensive field:
# measured 2026-09-05, `--limit 60` is refused by GitHub's GraphQL node budget
# ("up to 600,000 possible nodes ... maximum limit of 500,000") and `--limit 40`
# succeeds. That budget scales with how many commits the page happens to carry,
# so a refusal HALVES the page and retries once rather than leaving the check
# permanently and silently unchecked. Raising this does not make the check
# stronger — it makes it likelier to be refused.
superseded_merged_limit: 40

# The second leg: `git cherry` says every commit on the branch is already
# upstream BY PATCH ID while the two-dot diff against the base is not empty —
# i.e. merging it would REMOVE what the base has. This is the cherry-picked or
# rebased duplicate, whose shas therefore differ.
#
# OFF, and the measurement is why. On the live board 2026-09-05 it fires on 3 of
# the 15 open PRs and all three are a STRICT SUBSET of the commit-containment
# leg's 8 — it found nothing that leg did not, because the four cases the card
# was written for were squash-merged siblings, and a squash's patch id matches
# none of the branch's individual commits. A leg that has never independently
# found anything must not be the thing that closes somebody's PR. It costs two
# local git calls per PR when on.
superseded_revert_leg: false

# Stale-branch guard (kpr-stale-02) — THE SAFETY HOLE this closes.
#
# Nothing in this watcher ever asked how far behind the default branch a PR
# was. The merge decision reads `mergeable`, and GitHub reports MERGEABLE for a
# branch arbitrarily far behind main so long as nothing collides TEXTUALLY. So
# the CONFLICTING interlock only ever caught the subset that happened to
# collide; the non-conflicting subset merged CLEANLY and re-applied its whole
# diff over a tree that had moved on — a revert wearing a feature's clothes.
# #1651 was -38/+26 on rest_v1.py and 36 commits behind main. It was closed by
# a human; nothing in the pipeline could see it. `auto_rebase_on_conflict`
# above is not the answer on its own: it repairs a branch that has ALREADY gone
# DIRTY, which is exactly the subset that never had this problem.
#
# THE FORGE'S OWN VERDICT IS NOT ENOUGH, and this is the trap to avoid.
# `mergeStateStatus == BEHIND` is authoritative when it appears, but it appears
# ONLY when the base branch has "require branches to be up to date"
# (`required_status_checks.strict`) turned on. Measured on this repo
# 2026-08-18: strict is FALSE. mergeStateStatus is CLEAN for a branch 217
# commits behind main, so a check keyed on it alone could never fire once. The
# measured count below is the real check; the forge verdict is the belt.
#
# WHERE THE NUMBER COMES FROM. Measured 2026-08-18 over the last 120 MERGED
# PRs, counting commits on main that each branch was missing at the moment it
# merged (`merge-base(main-at-merge, head)..main-at-merge`):
#
#     0 commits behind : 41 (34.2%)      p50 =  1
#     1-2              : 38 (31.7%)      p75 =  3
#     3-5              : 31 (25.8%)      p90 =  5
#     6-10             : 10 ( 8.3%)      p95 =  6
#     11+              :  0 ( 0.0%)      max =  8
#
# The routine population tops out at 8. The known true positive, #1651, was 36
# behind when it was closed (217 today). So 10 sits two commits above the
# highest routine merge ever observed and an order of magnitude below the case
# it exists to catch: it would have fired on 0 of those 120 merges and on
# #1651. It is NOT a number chosen to keep the check quiet — lower it and it
# starts refusing the p95 of ordinary work, which the repair path (a rebase per
# PR) can absorb but which CLAUDE.md is right to call refusing routine work.
# Re-measure before changing it; do not raise it to get a PR through.
#
# THE REPAIR DIFFERS BY DOOR, and only one of them pushes:
#   * a task-linked kanban/<id> branch is handed to the SAME `_maybe_rebase`
#     path `auto_rebase_on_conflict` uses — same ownership refusal, same
#     per-base-era budget, same audit. When it declines (not this task's
#     branch, budget spent, disabled) the PR is held and a HITL alert names a
#     human, because a hold nobody can see is how work goes quiet.
#   * an UNLINKED PR is reported and left alone. The unlinked sweep never
#     pushes — it has no task to carry the state and no claim on the branch.
#
# FAIL-OPEN, and never silently. When the count cannot be measured (no gh, a
# fork PR, a rate limit) the PR is NOT held, and the report prints "?" rather
# than 0 — an unmeasured branch and a branch level with main are different
# facts, and only one of them is evidence. Same posture landed_check takes for
# the same class of question. Set refuse_merge_when_behind false to disable the
# hold entirely; `python -m tools.ci.merge_readiness` still reports it.
refuse_merge_when_behind: true
max_behind_commits: 10

# Bounded self-heal of a stale done-gate block (kpr-rvfy-03).
# The enforced done-gate reads only the LATEST kanban_verifications row, and
# nothing writes one except a dispatch — so a green PR whose verification went
# stale waits forever, then ages into is_stale -> FAILED and gets re-dispatched,
# which opens a SECOND PR instead of merging the first.
# When the gate holds, re-verify ONCE from git state and re-check.
reverify_on_hold: true
reverify_max_attempts_per_task: 1

# Whether to also re-verify a task that has NO verification row at all.
# OFF by default and it should stay off: such a task has never been judged, so
# writing a passing verdict from git state would merge a PR that no conformance
# review ever saw — the exact thing the enforced gate exists to prevent.
# A conformance failure (review_passed=0) is NEVER refreshed, regardless.
reverify_when_missing: false

# CI that never fired: how long to wait before treating an EMPTY check rollup as
# a missed workflow rather than a queued one.
#
# A PR with no checks can never go green and can never be recovered — every other
# repair path here assumes there is a CI result to react to. #1462 sat that way
# with zero checks: not failing, not running, simply absent.
#
# Age is measured from the HEAD SHA, not from the PR's createdAt and never from
# updatedAt (which a comment or a label moves, so a chatty PR would never look
# old enough to have missed its run).
#
# ANCHORED TO THE PUSH, BECAUSE THAT IS WHAT THE SENTENCE ABOVE DESCRIBES
# (kpr-watch-12). Aged from `createdAt` this grace was spent forever after a
# PR's first 15 minutes and EVERY subsequent push got ZERO -- measured on #2088,
# 28.5 minutes old at its escalation with a head sha 1.2 minutes old. The anchor
# is the head commit's `committedDate` (a rebase rewrites it, so a force-push is
# dated by the rebase), falling back to `createdAt` when the head is not in the
# commits list. A commit date is at or BEFORE the push, so the age it yields
# OVERSTATES how long the sha has sat there -- biased toward escalating, which
# is the conservative direction for a predicate that closes a real PR.
#
# Do NOT raise this to quieten a premature escalation. A longer wait does not fix
# a predicate that cannot tell a queued run from an absent one, and the grace is
# also what the ONE close/reopen per PR is spent against -- spend it early and
# the second episode has nothing left. Narrow the predicate instead.
ci_missing_grace_minutes: 15

# Ask the forge whether a workflow run EXISTS for the head sha before calling it
# a workflow that never fired (kpr-watch-12).
#
# A run exists for 32-84 seconds before its first check run appears in
# `statusCheckRollup` -- measured on three consecutive runs of PR #2088 (>=84s,
# 65s, 32s) against a 30s poll interval -- so inside that gap a healthy queued
# run and an absent one are the SAME empty rollup. One `gh api
# .../actions/runs?head_sha=` separates them.
#
# Asked LAST and only for a PR whose rollup is empty AND whose head sha is
# already past the grace, so it costs nothing on a healthy board. FAIL-OPEN: a
# missing gh, a rate limit or an unparseable body all read as "no run", because
# "unmeasurable" is not "a run exists" and the alternative silently disables the
# rung on the deployment where the forge is unwell. Only a run YOUNGER than the
# grace counts -- one that has produced no check in 40 minutes is STUCK, and
# that PR is exactly what the rung hands to a human.
#
# Set false to take the grace anchor alone (it withholds the larger share of
# spurious firings by itself). Never a shell neutraliser.
ci_probe_workflow_runs: true

# Re-triggers are capped at ONE per PR. The fix is a close/reopen to re-fire
# pull_request workflows; if that does not bring CI back, the cause is
# infrastructure and a second attempt only delays telling a human.
#
# THE CAP IS SPENT ON THE FIRST EMPTY ROLLUP, LIFETIME. That is why the
# predicate above had to be narrowed rather than this number raised: #2088 spent
# its one re-trigger on a healthy 80-second-old run and the close/reopen's new
# run CANCELLED it (mfx-ci-02's cancel-in-progress) before it materialised a
# single check, leaving the budget empty for the real episode 10 minutes later.
# A second re-trigger would only cancel a second healthy run.
max_ci_retriggers_per_pr: 1

# Re-exec the daemon when its own code changes on disk.
#
# A daemon imports its modules once and runs for days, so every merged fix is
# inert until somebody restarts the process. On 2026-08-09 pr_watcher was
# restarted BY HAND four times, and twice the board looked broken when the only
# fault was a daemon serving hours-old code.
#
# Re-exec rather than exit: supervision here is uneven (dashboard, launcher, or a
# bare shell), and a daemon that exits under a launcher that is not watching is
# simply dead — strictly worse than running stale.
#
# The watch set is every already-imported module under the repo, so a change to
# error_classifier counts as much as one to pr_watcher itself. Checked only
# between polls, and never within MIN_UPTIME_SECONDS of starting.
restart_on_code_change: true
# Auto-merge PRs that no kanban task points at — the CLI/human half.
#
# Every other repair path starts from list_pr_tasks, which selects kanban_tasks,
# so a PR with no task row is invisible to all of it. On 2026-08-09 a dozen PRs
# opened from CLI sessions were each merged BY HAND for that reason while
# kanban's own PRs merged themselves. Auto-merge should not depend on which door
# the work came through.
#
# Narrow by design: it only MERGES an already-green, already-mergeable,
# non-draft PR onto the default branch. It never pushes, un-drafts, rebases or
# closes — those need a task to carry the state.
#
# Escape hatch: any of hold / do-not-merge / wip / no-automerge / blocked as a
# LABEL, or leave the PR as a draft. Requested changes are never merged over.
merge_unlinked_prs: true

# ── protected_paths (kpr-watch-05) ────────────────────────────────────────────
# THE STANDING HAZARD. This watcher auto-merges any CI-green kanban/* branch,
# including one that edits the watcher. A defect in the merge-eligibility ladder
# therefore merges ITSELF into main, and every cycle after that runs on the new,
# wrong rule with no human in the path. That is not episodic — it is true
# whenever any card touches these files, which is why two separate cards had to
# invent per-episode manual gates for it. A per-episode gate cannot fix a
# standing hazard.
#
# A PR whose changed files intersect this list is refused by BOTH merge paths
# (the task-linked auto-merge and the unlinked sweep) and reported as the
# `protected_path` state, so it is visible rather than silently skipped. Merge
# it by hand after reading the diff.
#
# THIS FILE IS ON THE LIST ON PURPOSE. A PR that weakens or empties
# `protected_paths` must not be able to auto-merge itself in.
# tools/kanban/gates.py already states the principle: "A gate that cannot
# protect itself is not a control."
#
# Matching is exact-or-directory-prefix: `tools/ci/pr_watcher.py` matches that
# file and NOT `tools/ci/pr_watcher_helpers.py`; a bare directory entry matches
# everything beneath it. If the changed-file set cannot be determined at all,
# the PR is treated as protected — a merge gate that opens when it cannot see is
# not a gate.
protected_paths:
  - tools/ci/pr_watcher.py
  - args/pr_watcher_config.yaml
  - .claude/hooks/pre_tool_use.py
  - tools/kanban/task_factory.py
  - tools/kanban/gates.py

# ── union_resolver (mfx-sib-03) ──────────────────────────────────────────────
# A REAL conflict on a sibling-append file has ONE correct resolution: the
# union. Between 2026-09-03 and 09-04 an operator applied it ten times by hand
# on exactly these files (a canvas blueprint gaining one route block per card,
# the `request.path in [...]` list in base.html gaining one token per card, a
# coverage table gaining one row per card, a Playwright spec gaining one test
# per card), and twice a WRONG rule shipped a broken file that only ruff or a
# later Playwright collect caught. So rules are chosen BY FILE from this table
# and never guessed from content. Each entry's `rules` are tried IN ORDER on
# every conflicting hunk; `other_side_when_empty` applies to every declared
# file before any of them. A conflicted file no entry matches REFUSES, and the
# rebase aborts with the branch untouched. Mirror copies (icdev/tools/...,
# icdev/data/args/...) match by their canonical path.
#
# After resolving, the rung VERIFIES before anything is staged for push:
# `ast.parse` + ruff on .py, typescript syntactic diagnostics (or a
# string/comment-aware delimiter balance when no typescript module is
# resolvable, and the verdict records which) on .ts, a Jinja parse on .html,
# a load on .yaml/.json, no conflict marker + `git diff --check` on all, and
# each entry's `tests` (pytest targets; `{parent}` / `{stem}` come from the
# conflicted file) ONCE on the completed rebase. Any failure refuses.
#
# It runs INSIDE the rebase attempt `max_rebase_attempts_per_task` already
# budgets per base era, after the doc-only additive resolver declines and
# before the abort, so a real conflict still costs exactly one attempt.
# pr_watcher writes `pr_watcher.union_resolved` / `pr_watcher.union_refused`
# audit rows naming the rules used. Rules:
#   keep_both_blocks   both inserted at one point: main's block, then the card's
#   table_rows         keep_both_blocks restricted to `| ... |` rows, deduped
#   quoted_list_line   one quoted-token line: main's tokens plus the card's new ones
#   adjacent_edits     edits of DIFFERENT base lines that merely abut merge line-by-line
#   python -m tools.kanban.union_resolver --list-rules
#   python -m tools.kanban.union_resolver --worktree <path> --dry-run --json
union_resolver:
  enabled: true
  verify:
    pytest_timeout_seconds: 900
  files:
    # Canvas blueprints: each migration card appends one route block, and its
    # page tests prove the canvas still renders after the union.
    - path: tools/boundary_canvas/blueprint.py
      rules: [keep_both_blocks, adjacent_edits]
      tests: ["tests/test_bdc_*_page.py"]
    - path: tools/security_canvas/blueprint.py
      rules: [keep_both_blocks, adjacent_edits]
      tests: ["tests/test_sdc_*_page.py"]
    - path: tools/*/blueprint.py
      rules: [keep_both_blocks, adjacent_edits]
      tests: ["tests/{parent}"]
    # app.py: each card turns one bare page route into a redirect, and two
    # cards' redirect docstrings sit a few lines apart.
    - path: tools/dashboard/app.py
      rules: [keep_both_blocks, adjacent_edits]
    # The Compliance dropdown's `request.path in [...]` list, one token per card.
    - path: tools/dashboard/templates/base.html
      rules: [quoted_list_line, adjacent_edits]
    - path: tools/dashboard/templates/**/*.html
      rules: [adjacent_edits, keep_both_blocks]
    # Playwright specs: one test per card appended at the same point; a nav
    # table where two cards migrated adjacent rows.
    - path: tests/e2e/*.spec.ts
      rules: [keep_both_blocks, adjacent_edits]
    - path: tests/e2e_ui_full_coverage.py
      rules: [adjacent_edits, keep_both_blocks]
    - path: tests/e2e_cloud_migration_security.py
      rules: [adjacent_edits, keep_both_blocks]
    # The `Pages:` line, a backtick-quoted token list.
    - path: .claude/commands/start.md
      rules: [quoted_list_line, adjacent_edits]
    # Feature docs carrying a per-card coverage table.
    - path: docs/features/*.md
      rules: [table_rows, keep_both_blocks, adjacent_edits]
