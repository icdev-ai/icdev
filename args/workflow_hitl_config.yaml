# CUI // SP-CTI
# HITL Workflow Management — per-canvas default templates and role mappings
# Migration 079; feature flag: ICDEV_HITL_ENABLED=true

defaults:
  kickback_limit: 3
  approval_policy: any_one   # any_one | all_must | majority | sequential

# Per-canvas role defaults (matches constants.CANVAS_ROLE_DEFAULTS)
canvas_roles:
  NDC: {build: engineer,          review: reviewer, approve: manager}
  PDC: {build: engineer,          review: reviewer, approve: manager}
  IDC: {build: engineer,          review: reviewer, approve: manager}
  SDC: {build: security_engineer, review: reviewer, approve: manager}
  BDC: {build: security_engineer, review: reviewer, approve: manager}
  DDC: {build: data_engineer,     review: reviewer, approve: manager}
  ODC: {build: engineer,          review: reviewer, approve: manager}

# Default stage pipeline per canvas (overridable by forking the system template)
default_stages:
  - name: build
    step_type: automated
    cot_required: false
  - name: review
    step_type: manual
    role: reviewer
    cot_required: false
    required_docs:
      - doc_template_id: sys-dt-peer-review-checklist
        required: true
  - name: approve
    step_type: manual
    role: manager
    cot_required: false
    required_docs:
      - doc_template_id: sys-dt-security-sign-off
        required: false

# Child app inheritance: child apps without an explicit template_id inherit
# the system default for their parent canvas_type. Override here or in .env.
childapp_inheritance:
  enabled: true
  env_override_key: ICDEV_HITL_TEMPLATE_ID   # per-childapp env var
