# CUI // SP-CTI
# Genesis v2.0 — Autonomous Research Lab Configuration
#
# Controls the always-on Genesis daemon and its 14 Reflexes.
# This is the ARGS layer (FORGE) — change behavior without editing goals/tools.
#
# Override any value via environment variable:
#   ICDEV_GENESIS_ENABLED=true
#   ICDEV_GENESIS_REFLEX_<NAME>_ENABLED=false
#
# Classification: CUI // SP-CTI

classification: "CUI // SP-CTI"

# ── Daemon Defaults ──────────────────────────────────────────────────────────
# Configurable fallback thresholds used when a per-reflex override is absent.
# Moving these out of Python constants lets the anomaly_detection convergence
# layer adapt them over time without code changes.

defaults:
  # Watchdog timeout for any reflex that doesn't set its own timeout_seconds.
  reflex_timeout_seconds: 300
  # Lines-of-code heuristics for stub detection in _classify_reflex_impl.
  stub_loc_min: 10
  stub_loc_full: 15

# ── Master Switch ────────────────────────────────────────────────────────────

enabled: true  # D-GEN-9: enabled for persistent daemon
env_override: ICDEV_GENESIS_ENABLED

# ── Trust Mode ────────────────────────────────────────────────────────────────
# Controls how much autonomy the daemon is granted.
# Valid values: observer | advisor | executor | full
# 'full' preserves existing behavior (all reflexes execute unrestricted).
trust_mode: full

# ── Active Hours ───────────────────────────────────────────────────────────
# Reflexes only run within this window. Outside it, is_due() returns false.
# Interval/continuous reflexes (research, ingest, heal) are also gated.
active_hours:
  enabled: false   # Quiet hours disabled — scheduler runs 24/7 with no time gate.
  start_hour: 9
  end_hour: 23
  timezone: "America/New_York"

# ── LLM Configuration ───────────────────────────────────────────────────────

llm:
  # D-GEN-2: scanner-tier only (zero Claude cost for autonomous ops)
  tier: scanner
  model: qwen3.5-local
  max_tokens: 4096
  timeout_seconds: 120
  # Evolve Reflex may need reasoning — allow phi4 fallback
  evolve_model: phi4-reasoning
  evolve_max_tokens: 8192

# ── Trust Kernel ─────────────────────────────────────────────────────────────

trust_kernel:
  # Risk tiers: GREEN (auto-approve), YELLOW (sandbox+rollback), ORANGE (human review)
  risk_tiers:
    green:
      description: "Non-destructive, read-only operations"
      approval: auto
      sandbox: false
      audit: true
    yellow:
      description: "Reversible writes — worktree sandbox with rollback"
      approval: auto
      sandbox: true
      rollback_window_hours: 72
      audit: true
    orange:
      description: "Code mutation — worktree + test gate + human review"
      approval: human
      sandbox: true
      require_tests_pass: true
      require_complexity_check: true
      audit: true

  # D-GEN-8: circuit breaker — 3 consecutive failures disables Reflex
  circuit_breaker:
    max_consecutive_failures: 3
    cooldown_minutes: 60
    auto_reenable: false  # human must re-enable after trip
    notify_on_trip: true

  # Kill switch
  kill_switch:
    enabled: true
    check_interval_seconds: 10

  # Allowed actions whitelist per risk tier
  allowed_actions:
    green:
      - read_file
      - query_database
      - fetch_rss
      - fetch_url
      - write_data_genesis
      - log_audit
    yellow:
      - read_file
      - query_database
      - fetch_rss
      - fetch_url
      - write_data_genesis
      - write_database
      - create_worktree
      - run_tests
      - commit_worktree
      - publish_draft
      - log_audit
    orange:
      - read_file
      - query_database
      - write_data_genesis
      - create_worktree
      - edit_source_file
      - run_tests
      - run_code_analyzer
      - commit_worktree
      - log_audit

# ── Git Configuration ────────────────────────────────────────────────────────

git:
  lab_branch: v2-genesis
  worktree_base: .tmp/genesis/worktrees
  branch_prefix: genesis/
  rebase_on_main_schedule: weekly  # Sun 00:00
  auto_cleanup_merged_worktrees: true

# ── Data Paths ───────────────────────────────────────────────────────────────

paths:
  exports: data/genesis/exports
  feedback: data/genesis/feedback
  reports: data/genesis/reports

# ── 14 Reflexes ──────────────────────────────────────────────────────────────

reflexes:

  # ── GREEN tier (read-only, auto-approve) ─────────────────────────────────

  research:
    timeout_seconds: 90   # network fetch — cut hangs fast so the loop proceeds
    enabled: true
    risk_tier: green
    schedule: "every 6h"
    description: "Scrape NIST/CISA/DoD feeds, SAM.gov, GitHub trending"
    success_metric:
      name: signals_ingested
      threshold: 0        # >= 0 (0 new = all duplicates = healthy)
      operator: gte
    sources:
      - type: rss
        name: NIST NVD
        url: "https://nvd.nist.gov/feeds/xml/cve/misc/nvd-rss-analyzed.xml"
      - type: rss
        name: CISA Advisories
        url: "https://www.cisa.gov/cybersecurity-advisories/all.xml"
      - type: rss
        name: CISA KEV
        url: "https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json"
      - type: github_trending
        languages: [python, rust, go]
        since: daily

  scout:
    timeout_seconds: 90   # network fetch — cut hangs fast so the loop proceeds
    enabled: true
    risk_tier: green
    schedule: "daily 10:30"
    description: "Monitor competitor/adjacent GitHub repos for intel"
    success_metric:
      name: briefs_generated
      threshold: 0
      operator: gte
    targets_file: context/genesis/competitors.yaml

  audit:
    enabled: true
    risk_tier: green
    schedule: "daily 09:15"
    description: "Self-audit: code quality, security, compliance, STIG, SbD"
    success_metric:
      name: audit_completed
      threshold: 0
      operator: gte  # Always succeeds (informational)
    checks:
      - code_quality
      - security_scan
      - compliance_check
      - stig_check
      - sbd_assessment

  comply:
    enabled: true
    risk_tier: green
    schedule: "daily 09:00"
    description: "Refresh cATO evidence, regenerate stale SSPs, run crosswalk"
    success_metric:
      name: evidence_freshness_pct
      threshold: 0
      operator: gte  # Informational — always succeeds; alert if < 90 in report

  cato_monitor:
    enabled: true
    risk_tier: green
    schedule: "every 6h"
    interval: 21600  # seconds (6 h)
    description: "Continuous ATO monitoring: run all compliance/* IQE seed queries every 6h; call poam_generator for new violations"
    project_id: sparkpilot
    success_metric:
      name: violations
      threshold: 0
      operator: gte  # Informational — 0 violations is healthy, >0 triggers POAM

  ingest:
    timeout_seconds: 90   # network fetch — cut hangs fast so the loop proceeds
    enabled: true
    risk_tier: green
    schedule: "every 4h"
    description: "Watch NIST NVD, CISA KEV, FedRAMP updates → knowledge graph"
    success_metric:
      name: nodes_added
      threshold: 0
      operator: gte
    feeds_file: context/genesis/feeds.yaml

  market:
    enabled: true
    risk_tier: green
    schedule: "daily 10:00"
    description: "Track marketplace module usage/feedback, suggest improvements"
    success_metric:
      name: suggestions_generated
      threshold: 0
      operator: gt

  report:
    enabled: true
    risk_tier: green
    schedule: "weekly Sun 20:00"
    description: "Generate weekly autonomous status report"
    success_metric:
      name: report_delivered
      threshold: 0
      operator: gte  # Boolean — always succeeds
    output_dir: data/genesis/reports
    include_sections:
      - reflex_activity_summary
      - evolve_change_log
      - promotions_and_rejections
      - knowledge_growth_metrics
      - circuit_breaker_status
      - recommendations
    # Recommendation thresholds — moved from hardcoded Python constants so the
    # anomaly_detection layer can adapt them from historical report data at runtime.
    high_failure_rate_threshold: 0.30    # failure_rate > this fraction → high failure recommendation
    nominal_success_rate_threshold: 90.0 # success_rate > this (with no other issues) → all nominal
    anomaly_detection:
      enabled: true
      min_samples: 5               # minimum historical genesis.report.generated events before adaptive mode
      sigma_multiplier: 1.0        # adaptive threshold = mean ± (sigma_multiplier * std)
      fallback_to_static: true     # use static thresholds when history is insufficient
      adaptive_bounds:
        failure_rate_floor: 0.10   # adaptive failure threshold never drops below this
        failure_rate_ceiling: 0.50 # adaptive failure threshold never exceeds this
        success_rate_floor: 70.0   # nominal success threshold never drops below this
        success_rate_ceiling: 99.0 # nominal success threshold never exceeds this

  govcon_scan:
    enabled: true
    risk_tier: green
    schedule: "daily 10:00"
    description: "SAM.gov incremental scan → demand detection → Pulse article bridge"
    success_metric:
      name: govcon_new_opportunities
      target: 0
    outputs:
      - sam_scan_results
      - demand_signals
      - pulse_articles

  socmint:
    enabled: true
    risk_tier: green
    interval_seconds: 21600
    description: "Telegram milblog SOCMINT harvester → sg_socmint_signals"
    success_metric:
      name: socmint_signals_inserted
      target: 0
    outputs:
      - sg_socmint_signals

  # ── YELLOW tier (reversible writes, sandbox + rollback) ──────────────────

  publish:
    enabled: true
    risk_tier: yellow
    schedule: "daily 11:00"
    description: "End-to-end Pulse: demand topic → draft → WriteGuard → staging"
    success_metric:
      name: writeguard_score
      threshold: 0
      operator: gte  # 0 = no topics to publish (ok), >80 = article staged
    target: staging  # D-GEN: staging/draft only, never production
    require_writeguard_pass: true
    require_cui_check: true
    max_articles_per_day: 2
    writeguard_min_score: 80        # absolute floor; anomaly detection may lower it
    anomaly_detection:
      enabled: true
      lookback_days: 30             # how many days of history to sample
      min_history: 5                # minimum posts required before adapting threshold
      z_score_floor: -1.5           # dynamic threshold = mean + z_score_floor * std
      absolute_floor: 60            # never accept articles below this score

  test:
    enabled: true
    risk_tier: yellow
    schedule: "daily 22:00"
    description: "Identify under-tested tools, generate tests, run, commit passing"
    success_metric:
      name: coverage_delta
      threshold: 0
      operator: gte     # "Zero new tests on a clean codebase" is healthy,
                        # not failure. Was `gt 0` — which demanded net new
                        # coverage every run. Relaxed 2026-04-14.
    min_coverage_target: 0.60
    max_tests_per_run: 10

  learn:
    enabled: true
    risk_tier: yellow
    schedule: "daily 22:30"
    description: "Generate training pairs from approved outputs, fine-tune Ollama"
    success_metric:
      name: validation_loss_delta
      threshold: 0
      operator: gte  # 0 = no pairs to generate (ok), > 0 = new pairs created
    pair_generation:
      source_tables:
        - research_signals
        - innovation_signals
        - pulse_posts
      pairs_per_table: 20            # max pair-generation attempts per source table
      min_pass_rate: 0.2
      max_pass_rate: 0.8
    fine_tune:
      base_model: qwen3.5
      method: lora  # LoRA for efficient local fine-tuning
      epochs: 3
      validation_split: 0.2
    # ── Anomaly Detection: adaptive fine-tune readiness threshold ─────────────
    # Threshold moved from hardcoded Python constant (100) so the anomaly_detection
    # layer can adapt it from historical pair accumulation rates without code changes.
    anomaly_detection:
      enabled: true                  # use adaptive threshold based on pair history
      min_samples: 5                 # minimum historical cycle rows before adaptive mode
      sigma_multiplier: 1.0          # threshold = mean + (sigma_multiplier * std)
      fallback_to_static: true       # use fallback_min_pairs when history is insufficient
      fallback_min_pairs: 100        # static fallback: minimum pairs before fine-tune attempt
      adaptive_bounds:
        min_pairs_floor: 20          # adaptive threshold never drops below this

  heal:
    enabled: true
    risk_tier: yellow
    schedule: "continuous"
    interval_seconds: 300
    description: "Pattern-based auto-remediation for known failure patterns"
    success_metric:
      name: mttr_reduction
      threshold: 0
      operator: gte  # 0 = no failures (healthy), > 0 = healed something
    confidence_threshold: 0.7
    max_auto_heals_per_hour: 5
    lookback_hours: 6
    max_failures_per_cycle: 20
    cooldown_minutes: 10

  log_triage:
    enabled: true
    risk_tier: green
    schedule: "every 30m"
    interval_seconds: 1800
    description: "Two ingestion paths: (1) build log .logs/build.ndjson -> task_type='bug' cards; (2) centralized_logs autofix bridge (eqo-log-05) -> reads ERROR/CRITICAL events across ALL components via query_logs and opens task_type='fix' cards with component + log excerpt + reproduce query. Shared LLM anomaly scorer (haiku) + (component, message_hash) dedup; each path keeps its own seen-signature store."
    success_metric:
      name: tasks_created
      threshold: 0
      operator: gte
    tail_lines: 500           # NDJSON lines to read per cycle
    build_log: .logs/build.ndjson
    # Anomaly detection — replaces hardcoded level/failed/returncode thresholds
    anomaly_threshold: 0.4    # [0,1] minimum LLM score to classify an event as a failure
    score_batch_size: 20      # events per LLM call (haiku stays cheap at this size)
    # centralized_logs autofix bridge (eqo-log-05)
    centralized_enabled: true # also triage ERROR/CRITICAL rows from centralized_logs
    centralized_limit: 500    # max centralized_logs rows pulled per level per cycle
    # centralized_since: "2026-06-06T00:00:00Z"  # optional ISO lower bound on ts

  failure_triage:
    enabled: true
    risk_tier: yellow
    schedule: "every 30m"
    interval_seconds: 1800
    description: "LLM-assisted review of kanban failures — diagnose via Claude, patch via Ollama, apply in isolated .tmp/autofix/ worktree. Auto-apply gated on ICDEV_AUTOFIX_ENABLED env; automerge gated on ICDEV_AUTOFIX_AUTOMERGE. Confidence ≥ 0.85, task-type whitelist, deny-list, rolling 5/hr rate cap all enforced. See tools/workflow/failure_triage.py"
    success_metric:
      name: failures_triaged
      threshold: 0
      operator: gte  # informational — 0 failures in window is the healthy state
    window_hours: 1          # look back 1h per cycle (dedup marker prevents repeats)
    apply: true              # ask for patch generation; actual apply still needs env flag
    cooldown_minutes: 10     # min gap between consecutive cycles
    max_applies_per_hour: 5  # matches CLAUDE.md self-healing cap
    # Bounded ReAct loop (WS2.3 / arc-dbg-02) — refine patch on each
    # failing verify round up to max_iterations; bail on no-progress
    # fingerprint or token-budget exhaustion. Overrides the in-code
    # defaults in tools/workflow/failure_triage.py.
    react_max_iterations: 3          # hypothesize→instrument→observe rounds
    react_token_budget: 8000         # per-failure prompt char/4 ceiling
    react_no_progress_window: 2      # last N identical fingerprints → no_progress
    # Self-consistency diagnosis (WS4.1 / arc-dec-01): sample N diagnoses
    # with a temperature spread, then use cross-sample agreement on
    # (root_cause_class, primary_suspect_file) as the real confidence
    # that feeds should_auto_apply. Disagreement → suggested-card path.
    # Both raw and SC confidence are recorded for arc-cal-* calibration.
    self_consistency:
      enabled: true                  # master switch; set false to bypass SC
      n_samples: 3                   # 3 = smallest size distinguishing 3/3 from 2/3 from 1/3
      temperature_spread: 0.6        # spread [0.1, 0.7] for N=3
      agreement_threshold: 0.5       # majority (>=0.5) of N must agree on (rc, suspect)
      token_budget_per_sample: 2000  # max_tokens cap on each LLM call in the SC batch

  e2e_runner:
    enabled: true
    risk_tier: green
    schedule: "daily 02:00"
    interval_seconds: 86400  # 24 hours
    description: "Create a nightly Playwright E2E Kanban task (task_type=test); Kanban scheduler picks it up and dispatches to Claude CLI"
    interval_hours: 24
    success_metric:
      name: tasks_created
      threshold: 0
      operator: gte

  cpmp_monitor:
    enabled: true
    risk_tier: yellow
    schedule: "every 3h"
    interval_seconds: 10800
    timeout_seconds: 600
    description: "CPMP proactive surveillance: PMO issue detection, CPARS trajectory alerts, subcontractor noncompliance sweep, 14-day CDRL auto-generation"
    success_metric:
      name: cards_created
      threshold: 0
      operator: gte

  pmo_option_tracker:
    enabled: true
    risk_tier: yellow
    schedule: "daily 06:30"
    interval_seconds: 86400
    timeout_seconds: 300
    description: "Check all pending option periods for approaching exercise deadlines (90/60/30-day windows); create kanban tasks and escalate critical windows"
    success_metric:
      name: alerts_created
      threshold: 0
      operator: gte

  pmo_weekly_report:
    enabled: true
    risk_tier: yellow
    schedule: "every Monday at 07:00"
    interval_seconds: 604800
    timeout_seconds: 300
    description: "AI-narrated weekly portfolio health report: EVM aggregates, overdue deliverables, option countdowns, top issues. Pushes to kanban and data/reports/"
    success_metric:
      name: total_contracts
      threshold: 0
      operator: gte

  slides:
    enabled: true
    risk_tier: green
    schedule: "0 17 * * 5"
    interval_seconds: 604800
    timeout_seconds: 300
    description: "Weekly auto-generated ICDEV™ status deck: pulls canvases, kanban, genesis, capabilities → produces .pptx via Midnight Executive theme"
    success_metric:
      name: slide_count
      threshold: 1
      operator: gte

  kanban:
    enabled: true
    risk_tier: green
    schedule: "continuous"
    interval_seconds: 60  # Check every minute for due tasks + Telegram commands
    description: "Poll kanban_tasks for scheduled tasks past due, move to in_progress, write prompt files"
    success_metric:
      name: tasks_activated
      threshold: 0
      operator: gte

  remediation_lens:
    enabled: true
    risk_tier: yellow
    schedule: "every 60m"
    interval_seconds: 3600
    description: "Canvas remediation full loop: scan → propose → verify → escalate → archive"
    success_metric:
      name: proposals_created
      threshold: 0
      operator: gte         # 0 = no low-score canvases (healthy), >0 = proposals generated
    # Score below which a canvas is flagged for remediation
    score_threshold: 85.0
    # Maximum new proposals this reflex may create per hour (self-healing guardrail)
    max_proposals_per_hour: 5
    # Maximum auto-executions per hour (applies to Genesis-initiated executions)
    max_auto_executions_per_hour: 3
    # Re-notify about pending proposals that have been waiting this long
    notify_after_minutes: 30

  # ── ORANGE tier (code mutation, human review required) ───────────────────

  evolve:
    enabled: true
    risk_tier: orange
    schedule: "daily 21:30"
    description: "Autoresearch-style: pick worst tool → improve → test → keep/discard"
    success_metric:
      name: test_pass_and_complexity
      # Both must pass: test_pass_rate >= baseline AND complexity_delta <= 0
      composite:
        - name: test_pass_rate_delta
          threshold: 0
          operator: gte
        - name: complexity_delta
          threshold: 0
          operator: lte
    selection_strategy: worst_code_quality  # Pick tool with highest complexity/smells
    max_files_per_cycle: 1  # Autoresearch lesson: ONE file per mutation
    allowed_directories:
      - tools/
      - goals/
      - args/
      - context/
    forbidden_files:
      - CLAUDE.md
      - .env
      - tools/db/storage.py  # Critical infrastructure, no auto-mutation
      - tools/genesis/daemon.py  # No self-modification of the daemon itself
    require_human_merge: true
    # ── Feature: Variant Archive (DGM-inspired) ──────────────────────────────
    # Store accepted AND rejected mutation variants for learning context
    archive:
      enabled: true
      path: data/genesis/evolve_archive
      max_variants_per_tool: 10
    # ── Feature: Meta-Evolve (self-modifying selection strategy) ─────────────
    # Rotates selection strategy when acceptance rate drops below threshold
    meta_evolve:
      enabled: false  # Off by default, opt-in
      evaluate_every_n_cycles: 10
      strategies:
        - worst_code_quality
        - most_failures
        - highest_churn
        - lowest_coverage
      min_acceptance_rate: 0.20
    # ── Feature: Peer-Review Gate (Hyperagents-inspired) ─────────────────────
    # Lightweight LLM diff review before running full test suite
    peer_review:
      enabled: false  # Off by default
      reviewer_function: wg_coherence_check  # Scanner tier in LLM router
    # ── Anomaly Detection: adaptive thresholds for code quality filtering ─────
    # Thresholds moved from hardcoded Python constants so the anomaly_detection
    # layer can adapt them at runtime without code changes.
    anomaly_detection:
      enabled: true                # use population-variance based adaptive thresholds
      min_samples: 10              # minimum code_quality_metrics rows before adaptive mode
      sigma_multiplier: 0.5        # threshold = mean ± (sigma_multiplier * std)
      fallback_to_static: true     # use static fallbacks when data is insufficient
      fallback_smell_threshold: 1.0             # static fallback: smell_count > this
      fallback_maintainability_threshold: 50.0  # static fallback: maintainability_score < this
      adaptive_bounds:
        smell_threshold_floor: 1.0   # adaptive smell threshold never drops below this
        maint_threshold_floor: 0.0   # adaptive maint threshold never drops below this
    # ── Confidence tier thresholds ────────────────────────────────────────────
    # GKP confidence values per quality-gate outcome. Tune without code changes.
    thresholds:
      min_confidence: 0.50        # reject variant if confidence falls below this
      expedited_review: 0.55      # confidence >= this → expedited_review status
      auto_promotable: 0.70       # confidence >= this → auto_promotable status
      confidence_tiers:
        tests_failed: 0.35
        low_risk_improved: 0.75
        low_risk: 0.65
        medium_risk_improved: 0.60
        medium_risk: 0.50
        high_risk: 0.45
        sandbox_penalty: 0.10     # subtracted when sandbox verification fails

  docs:
    enabled: true
    risk_tier: green
    schedule: "daily 09:30"
    description: "Documentation drift detection — stale refs, missing docs, manifest drift, route drift"
    success_metric:
      name: docs_drift_count
      threshold: 0
      operator: gte     # Finding drift = healthy detection, not failure.
                        # Was `lte 0` — which demanded zero drift, contradicting
                        # the reflex's purpose. Flipped 2026-04-14 after three
                        # consecutive trips.
    checks:
      stale_feature_docs: true
      missing_feature_docs: true
      manifest_drift: true
      claude_md_route_drift: true
      readme_staleness: true

  # ── Phase 67 — Bayesian Autoresearch (D-AR-9) ──────────────────────────────

  experiment:
    enabled: true
    risk_tier: orange
    schedule: "daily 15:00"
    description: "Bayesian Autoresearch — Karpathy-loop autonomous experiments"
    success_metric:
      name: experiments_accepted_pct
      threshold: 0
      operator: gte
    signal_score_threshold: 0.70  # static fallback when adaptive is disabled or has insufficient data
    adaptive_threshold:
      enabled: true
      z_factor: 0.5     # mean + 0.5*std selects top ~31% of a normal distribution
      min_samples: 10   # minimum scored signals required before using adaptive mode
    max_experiments_per_run: 3
    export_gkp: true
    domains:
      - compliance
      - code_quality
      - security

  # ── Phase 72 — Adaptive Skill Synthesizer (Hermes adaptation) ──────────────

  synthesize:
    enabled: true
    risk_tier: yellow
    schedule: "weekly Wed 12:00"
    description: "Detect recurring tool patterns, generate FORGE goal workflow drafts"
    success_metric:
      name: patterns_detected
      threshold: 0
      operator: gte  # 0 = no patterns (healthy), > 0 = new patterns found
    # Thresholds moved from hardcoded Python constants — anomaly_detection layer
    # adapts min_pattern_frequency at runtime without code changes.
    min_pattern_frequency: 3
    min_chain_length: 3
    lookback_days: 7
    max_gap_seconds: 300
    top_k: 20
    session_ids_cap: 10
    max_goals_per_run: 3
    # Confabulation risk threshold — moved from hardcoded 0.6 constant so the
    # anomaly_detection layer can adapt it from historical flag rates at runtime.
    confabulation_risk_threshold: 0.6   # static fallback: flag goal when risk_score >= this
    confabulation_anomaly_detection:
      enabled: true                     # use adaptive threshold based on historical flag history
      min_samples: 5                    # minimum canvas_ai_decisions rows before adaptive mode
      sigma_multiplier: 0.5             # threshold = mean + (sigma_multiplier * std) of past scores
      fallback_to_static: true          # use confabulation_risk_threshold when data is sparse
      adaptive_bounds:
        threshold_floor: 0.3            # adaptive threshold never drops below this
        threshold_ceiling: 0.9          # adaptive threshold never exceeds this
    # Adaptive IQR-based frequency threshold (anomaly_detection paradigm).
    # When enabled, min_pattern_frequency becomes a fallback used only when
    # there are fewer than min_samples distinct n-grams in the dataset.
    anomaly_detection:
      enabled: true          # replace static threshold with IQR-based detection
      min_samples: 4         # minimum distinct n-grams before adaptive mode activates
      sensitivity: 1.0       # IQR multiplier: 1.0 = Q3 (75th percentile), 2.0 = upper fence
      fallback_to_static: true  # use min_pattern_frequency when data is insufficient
      frequency_floor: 2     # adaptive threshold never drops below this

  # ── Goal Learner — Self-Improving Goals from Experience ─────────────────────

  goal_learner:
    enabled: true
    risk_tier: yellow
    schedule: "daily 20:00"
    description: "Detect novel problem-solving not covered by existing goals, auto-generate FORGE goal files"
    success_metric:
      name: goals_generated
      threshold: 0
      operator: gte  # 0 = no novel events (healthy), > 0 = new goals learned
    novelty_threshold: 0.6     # minimum novelty score (0–1) to qualify for goal generation
    min_evidence_count: 2      # minimum audit+kanban events a domain must have to qualify
    max_goals_per_run: 3       # cap on goals emitted per scan
    lookback_days: 7           # audit/kanban look-back window
    quality_weights:           # scoring dimension weights (must sum to 1.0)
      novelty_score: 0.40
      evidence_count: 0.25
      domain_clarity: 0.20
      tool_coverage: 0.15
    evidence_count_normalizer: 4.0  # (count-1)/N → 1.0 at 5+ events
    domain_clarity_divisor: 10.0   # avg keyword length ÷ N → 1.0 at 10-char avg
    tool_coverage_placeholder: 0.5  # static until tool-analysis is implemented
    max_audit_events: 500           # LIMIT for genesis_audit scan query
    max_kanban_completions: 200     # LIMIT for kanban_tasks completions query
    top_terms_count: 60             # top-N frequency terms used for domain clustering
    max_keywords_per_domain: 30     # keyword cap stored per domain
    write_files: true               # write suggested goal .md files to data/genesis/suggested_goals/
    # Adaptive threshold via anomaly detection — inherits convergence.anomaly_detection
    # when not set here; local keys override the global block.
    anomaly_detection:
      min_samples: 5    # min historical records before adaptive threshold activates
      z_score: 2.0      # std deviations above historical mean sets the threshold

  # ── Oracle Predictive Intelligence (tools/oracle/) ──────────────────────────

  oracle:
    enabled: true
    risk_tier: green
    schedule: "daily 08:00"
    description: "Multi-lens predictive intelligence — trends, risks, opportunities, horizon, compliance, knowledge gaps"
    success_metric:
      name: predictions_generated
      threshold: 0
      operator: gte  # 0 = no signals to analyze (healthy), > 0 = predictions produced
    lenses:
      - trend
      - risk
      - opportunity
      - horizon
      - compliance
      - knowledge
    min_confidence_for_gkp: 0.4   # Only emit GKP for medium/high confidence predictions
    max_predictions_per_lens: 5

  # ── Internal Awareness Engine (D-AWARE-1 through D-AWARE-5) ─────────────────

  awareness:
    timeout_seconds: 900   # heavy reflex — needs > default 300s
    enabled: true
    risk_tier: green
    schedule: "every 3h"
    interval_seconds: 10800  # 3 hours — user-approved cadence
    cooldown_minutes: 60     # Minimum gap between consecutive cycles
    description: "Internal Awareness Engine — index components, probe health, detect drift, scan gaps, promote suggested kanban cards"
    success_metric:
      name: awareness_cycle_complete
      threshold: 0
      operator: gte  # 0 = cycle ran (always succeeds — findings are informational)
    promotion_threshold: 0.7  # Oracle confidence threshold for kanban card creation
    config_path: args/awareness_config.yaml  # Full config — probes, gaps, oracle, narrative

  # ── Self-Monitor (project internal health into operator-facing /monitoring) ──

  self_monitor:
    enabled: true
    risk_tier: green
    schedule: "every 30m"
    interval_seconds: 1800   # 30 minutes — short cadence; only re-runs the cheap http probe
    cooldown_minutes: 20
    description: "Project Internal Awareness health snapshots into operator alerts + failure_log so /monitoring reflects real platform health"
    success_metric:
      name: alerts_firing
      threshold: 0
      operator: gte  # 0 firing = healthy; >0 surfaces real failures (always succeeds)
    refresh_probes: [http_head]   # cheap probes re-run live each cycle; others reused from awareness
    min_fail_to_alert: 1          # static fallback: per-category failing count before an alert fires
    max_failure_rows: 200         # cap failure_log inserts per cycle
    max_snapshot_age_hours: 168   # ignore failures whose latest probe is >7d old (stale/abandoned)
    # Adaptive min_fail_to_alert — threshold moved from hardcoded Python constant so the
    # anomaly_detection layer can raise the bar when a category has many historical
    # failures (normal noise) and keep it low when failures are rare (high signal).
    # Uses daily failure_log insert counts: adaptive = mean + sigma_multiplier * std,
    # bounded to [min_fail_floor, min_fail_ceiling]. Falls back to min_fail_to_alert
    # until min_samples days of history accumulate.
    anomaly_detection:
      enabled: true                # use adaptive threshold based on historical failure_log data
      min_samples: 10              # minimum days of history before adaptive mode activates
      sigma_multiplier: 1.0        # adaptive = mean + (sigma_multiplier * std)
      fallback_to_static: true     # use min_fail_to_alert when history is insufficient
      history_days: 30             # rolling look-back window for daily failure counts
      adaptive_bounds:
        min_fail_floor: 1          # adaptive threshold never drops below this
        min_fail_ceiling: 20       # adaptive threshold never exceeds this
      # Per-category guidance thresholds for the LLM anomaly classifier.
      # Moved from hardcoded strings in _ANOMALY_SYSTEM_PROMPT so operators can
      # adjust anomaly sensitivity per category without code changes.
      # Each entry: {guidance: <text>, noise_max: <int>, anomalous_min: <int>}
      category_thresholds:
        module_import:
          guidance: "any failure (>=1) is critical and anomalous"
          noise_max: 0
          anomalous_min: 1
        http_head:
          guidance: "1-3 route errors may be noise; 5+ is anomalous"
          noise_max: 3
          anomalous_min: 5
        coherence_status:
          guidance: "1-2 may be transient; 3+ is anomalous"
          noise_max: 2
          anomalous_min: 3
        twin_probe:
          guidance: "treat like coherence_status (1-2 transient; 3+ anomalous)"
          noise_max: 2
          anomalous_min: 3
        "gap::tool_not_in_manifest":
          guidance: "informational; <=4 is not anomalous"
          noise_max: 4
          anomalous_min: 5

  # ── Integrity Monitor (SIPA self-assessment of ICDEV's own tools/) ──────────

  integrity_monitor:
    timeout_seconds: 900     # heavy reflex — AST-scans the whole tools/ tree
    enabled: true
    risk_tier: green
    schedule: "every 6h"
    interval_seconds: 21600  # 6 hours — ICDEV's own code changes slowly
    cooldown_minutes: 120
    description: "SIPA self-assessment of ICDEV tools/ (Mode A) — open a Kanban card per NEW unauthorized/high-risk capability vs the last baseline; deduped so it never re-alerts"
    target: tools            # path to assess (repo-relative); blank => <repo>/tools
    mode: aware              # provenance-aware Mode A vs the platform RTM
    # SIPA-platform RTM is the canonical project_id under which the platform
    # self-assessment reconciles. intake_requirements rows tagged with this
    # project (env_secret / filesystem / process_exec / dynamic_code / crypto)
    # authorize the platform-wide capabilities — see
    # docs/security/sipa-self-assessment.md. Without this, every capability
    # in tools/ trips an `unauthorized_capability` finding by default
    # (semantic-backdoor case), flooding the kanban with new cards.
    project_id: sipa-platform-rtm-2026-06-08
    session_id: sipa-platform-rtm-2026-06-08
    success_metric:
      name: integrity_cards_opened
      threshold: 0
      operator: gte         # 0 new capabilities = clean; >0 surfaces real drift (always succeeds)

  # ── Done-Artifact Audit (verify 'done' tasks actually shipped) ──────────────

  done_artifact_audit:
    timeout_seconds: 300     # disk-existence sweep across projects-in-flight
    enabled: true
    risk_tier: green
    schedule: "every 6h"
    interval_seconds: 21600  # 6 hours
    cooldown_minutes: 60
    use_git: false           # disk-existence only; git ls-files per path is too slow under watchdog
    description: "Verify 'done' Kanban tasks across projects-in-flight actually have their claimed artifacts on the working tree (the ACE 42/42-done-but-unbuilt failure). Reports only — never mutates status."
    success_metric:
      name: done_tasks_missing_artifacts
      threshold: 0
      operator: gte          # >0 surfaces real divergence but the reflex always succeeds

  # ── PR Watcher (OPT-70 autonomous PR → resume/merge feedback loop) ──────────

  pr_watcher:
    timeout_seconds: 180     # bounded gh/network calls per poll
    enabled: true
    risk_tier: green         # merges require an approving review (see config)
    schedule: "every 5m"
    interval_seconds: 300    # poll open kanban PRs frequently for responsiveness
    cooldown_minutes: 0
    description: "OPT-70 PR watcher — poll open kanban PRs; inject resume context on CI-fail/changes-requested (autofix) or auto-merge green low-risk types (chore/test/fix) per args/pr_watcher_config.yaml"
    success_metric:
      name: pr_watcher_errors
      threshold: 0
      operator: eq

  review_loop:
    timeout_seconds: 300     # bounded — coherence(changed) + SIPA subprocesses
    enabled: true
    risk_tier: green         # REPORT-ONLY drift probe — never edits the checkout
    schedule: "every 6h"
    interval_seconds: 21600  # low cadence; the real greening is per-task (pre-PR/pre-commit)
    cooldown_minutes: 0
    description: "review_loop drift probe — report-only review-until-green over the working tree (ruff + changed-files coherence + SIPA); no autofix. Cheap no-op on a clean checkout. Per-task greening lives in git_ops pre-PR preflight + the pre-commit hook. Config: args/review_loop_config.yaml"
    success_metric:
      name: review_loop_errors
      threshold: 0
      operator: eq

  # ── Oracle Triage (auto-triage suggested kanban cards after each awareness cycle)

  oracle_triage:
    enabled: true
    risk_tier: green
    schedule: "every 3h"
    interval_seconds: 10800  # runs right after the awareness cycle produces new cards
    cooldown_minutes: 60     # at most once per hour even if awareness fires more often
    description: "Oracle Triage — deterministically promote/dismiss Oracle-suggested kanban tasks using file-exists, Flask-route, and migration checks"
    success_metric:
      name: oracle_triage_errors
      threshold: 0
      operator: eq
    api_base: "http://localhost:5050"

  # ── Canvas Indexer (per-canvas /ask GraphRAG freshness) ─────────────────────

  canvas_indexer:
    timeout_seconds: 600   # heavy reflex — needs > default 300s
    enabled: true
    risk_tier: green
    schedule: "every 6h"
    interval_seconds: 21600  # 6 hours — design content changes slowly
    cooldown_minutes: 120    # Minimum gap between consecutive cycles
    description: "Canvas KG indexer — re-index PDC/BDC/DDC/ODC/IDC designs into kg_nodes so /ask stays fresh"
    success_metric:
      name: canvas_indexer_errors
      threshold: 0
      operator: eq  # 0 canvas-level errors means clean cycle
    canvases: [pdc, bdc, ddc, odc, idc]  # NDC and SDC use other pipelines

  # ── AlphaDesk Trap Scenarios (Phase 7.10 integration-01) ─────────────────────

  alphadesk_trap_scenarios:
    enabled: true
    risk_tier: green
    schedule: "every 1h"
    interval_seconds: 3600  # 1 hour — match trap_scanner 15m cadence × 4
    cooldown_minutes: 30    # Minimum gap between consecutive cycles
    description: "Detect high-confidence trap events (>=0.8) since last run, spawn potential_reversal_cascade scenarios, write daily Pulse digest"
    success_metric:
      name: events_found
      threshold: 0
      operator: gte  # 0 = no new traps (healthy), >0 = scenarios spawned
    confidence_threshold: 0.8          # Minimum confidence to spawn a scenario
    scenario_key: potential_reversal_cascade  # Scenario template to execute per trap
    digest_status: draft               # Pulse post status for daily digest

  # ── FathomDesk Trap Sweep (Phase 7.12 ad712-trap-02) ──────────────────────────

  fathomdesk_trap_sweep:
    enabled: true
    risk_tier: green
    schedule: "every 4h"
    interval_seconds: 14400  # 4 hours — COOLDOWN_HOURS=4 per ad712-trap-02
    cooldown_minutes: 60     # Minimum gap between consecutive cycles
    description: "Detect bull/bear trap patterns from signal direction flips, persist to ad_trap_events via ad712-trap-01 insert path (ta_config.yaml thresholds)"
    success_metric:
      name: traps_inserted
      threshold: 0
      operator: gte  # 0 = no new traps detected (healthy), >0 = events written

  # ── FathomDesk P/C Ratio History (fdmm-pcr-04) ────────────────────────────

  fathomdesk_pc_ratio:
    enabled: true
    risk_tier: green
    schedule: "daily 06:00"
    interval_seconds: 86400  # 24 hours — CBOE data is end-of-day
    cooldown_minutes: 60     # Minimum gap between consecutive cycles
    description: "Fetch CBOE equity put/call ratio series and append snapshot to ad_pc_ratio_history; backing store for put_call_sentiment confluence pillar"
    success_metric:
      name: rows_written
      threshold: 0
      operator: gte  # 0 = no new data today (ok), 1 = snapshot stored

  # ── Cost Optimizer (Cluster C fd-cost-01/02) ──────────────────────────────

  cost_optimizer:
    enabled: true
    risk_tier: green
    schedule: "every 168h"
    interval_seconds: 604800  # 7 days (weekly)
    cooldown_minutes: 720      # 12h minimum gap — weekly reflex, no rapid re-fire
    description: "Weekly LLM token spend audit; detect Haiku-eligible tasks; flag bloated prompts. Hard rule: never flags Risk or Execution agents."
    success_metric:
      name: recommendations_generated
      threshold: 0
      operator: gte  # 0 = no savings found (healthy), >0 = optimization opportunities written
    excluded_agents:
      - risk
      - execution

  # ── NOCC SLA Watcher (4h cadence) ────────────────────────────────────────

  nocc_sla_watcher:
    enabled: true
    risk_tier: green
    schedule: "every 4h"
    description: "Watch NOCC SLA records, flag projected breaches and warn on anomalous measurements"
    success_metric:
      name: warnings_issued
      threshold: 0
      operator: gte  # 0 = all SLAs healthy, >0 = projections surfaced
    # Warn margin moved from hardcoded Python constant (_WARN_MARGIN_PCT = 0.5) so the
    # anomaly_detection layer can adapt it from historical measurement variance at runtime.
    warn_margin_pct: 0.5              # static fallback: warn when within this % of target
    anomaly_detection:
      enabled: true                   # use adaptive margin based on per-circuit measurement history
      min_samples: 10                 # minimum historical rows before adaptive mode activates
      sigma_multiplier: 1.5           # adaptive_margin = mean_deviation + sigma_multiplier * std
      fallback_to_static: true        # use warn_margin_pct when data is insufficient
      history_days: 30               # days of SLA measurement history to analyze per circuit+sla_type
      stable_std: 0.01               # std threshold below which a circuit is "stable" (use mean+fallback buffer)
      borderline_ratio: 0.8          # LLM contextual check only when gap >= this fraction of dynamic margin
      adaptive_bounds:
        margin_floor: 0.1             # adaptive margin never drops below this
        margin_ceiling: 5.0           # adaptive margin never exceeds this

  # ── Network Migration Canvas Health Monitor (NMCE — 2026-05-08) ──────────

  migration_canvas:
    enabled: true
    risk_tier: green
    schedule: "every 24h"
    interval_seconds: 86400   # Daily — sessions and EOL dates change slowly
    cooldown_minutes: 360     # 6h minimum gap — no rapid re-fire
    description: "Detect stale migration sessions (>7d no progress), EOL devices with no active migration (<90d to EOL), and protocol plans stuck in draft (>14d). Promotes findings to kanban at >= 0.70 confidence."
    promotion_threshold: 0.70
    success_metric:
      name: findings
      threshold: 0
      operator: gte  # 0 = all migrations healthy, >0 = issues surfaced

  aadc_compliance:
    enabled: true
    risk_tier: green
    schedule: "on_event"
    description: "AADC design compliance scoring — NIST AI RMF / OWASP LLM / MITRE ATLAS node-coverage"
    success_metric:
      name: overall_score
      threshold: 0
      operator: gte
    # Thresholds moved from hardcoded Python constants — anomaly_detection layer
    # adapts them at runtime using z-score over historical aadc_assessments data.
    critical_threshold: 40.0       # framework coverage below this triggers a Kanban suggestion
    memory_delta_threshold: 5.0    # min overall_score change (points) to write a memory insight
    anomaly_detection:
      enabled: true                # replace static thresholds with z-score adaptive ones
      min_samples: 5               # historical assessments needed before adaptive mode activates
      z_score: 2.0                 # std deviations below historical mean sets adaptive critical_threshold
      fallback_to_static: true     # use critical_threshold/memory_delta_threshold when data is sparse
      adaptive_bounds:
        critical_threshold_floor: 20.0    # adaptive threshold never drops below this
        critical_threshold_ceiling: 60.0  # adaptive threshold never exceeds this
        memory_delta_floor: 2.0           # adaptive delta never drops below this
        memory_delta_ceiling: 15.0        # adaptive delta never exceeds this

  peering_agreement_renewal:
    enabled: true
    risk_tier: green
    schedule: "daily 06:00"
    interval_seconds: 86400
    description: "Check nc_peering_agreements for contracts expiring; issue NOCC alarms for at-risk agreements"
    success_metric:
      name: at_risk_count
      threshold: 0
      operator: gte  # 0 = no expiring agreements (healthy), >0 = alarms issued
    # Thresholds moved from hardcoded Python constants — anomaly_detection layer
    # can adapt them at runtime without code changes.
    days_ahead: 90          # static fallback: look-ahead window for expiring agreements
    critical_days: 30       # static fallback: agreements <= this days remaining → critical severity
    anomaly_detection:
      enabled: true         # use AI to assess per-agreement severity (replaces days <= 30 rule)
      fallback_to_static: true  # use critical_days when LLM unavailable

  quality:
    enabled: true
    risk_tier: yellow
    schedule: "daily 03:00"
    description: "Self-Learning QA/QC: run all QDC gates, detect regressions, auto-remediate safe issues, propose improvements via GKP"
    success_metric:
      name: regressions_detected
      threshold: 0
      operator: gte  # 0 = stable quality, >0 = regressions found (always succeeds)
    # Thresholds moved from hardcoded Python constants — anomaly_detection layer
    # can adapt them at runtime from historical quality_snapshots data.
    uqs_regression_threshold: -5.0    # static fallback: UQS drop (points) that triggers a regression event
    uqs_critical_threshold: -15.0     # static fallback: UQS drop below which severity becomes "critical"
    findings_increase_threshold: 5    # static fallback: new findings count increase that triggers a regression event
    gate_score_threshold: 80          # static fallback: gate score below which a GKP improvement is proposed
    worst_gates_count: 3              # number of worst-performing gates to inspect for GKP generation
    anomaly_detection:
      enabled: true                   # use adaptive thresholds based on quality_snapshots history
      min_samples: 5                  # minimum historical snapshots before adaptive mode activates
      sigma_multiplier: 1.0           # adaptive_threshold = mean + sigma_multiplier * std
      critical_sigma_multiplier: 2.0  # critical threshold = mean - (critical_sigma_multiplier * sigma * std)
      critical_floor_multiplier: 2.0  # critical floor = uqs_regression_floor * critical_floor_multiplier
      fetch_buffer: 10                # extra rows fetched beyond min_samples for delta computation
      fallback_to_static: true        # use static thresholds when history is insufficient
      adaptive_bounds:
        uqs_regression_floor: -20.0   # adaptive UQS regression threshold never goes below this
        findings_increase_floor: 1    # adaptive findings threshold never drops below this
        gate_score_floor: 50          # adaptive gate score threshold never drops below this

  academy_reflex:
    enabled: true
    risk_tier: green
    schedule: "every 6h"
    interval_seconds: 21600   # 6h — curriculum doesn't change faster than this
    cooldown_minutes: 360     # 6h minimum gap — match COOLDOWN_HOURS in reflex
    description: "Phase 1: Convert proven_pattern GKPs (confidence >= 0.70) into fa_missions draft scaffolds for human review. Phase 2: Run LensStalenesssDetector and promote stale-content predictions (>= 0.70) to Kanban as 'suggested' tasks."
    promotion_threshold: 0.70
    max_drafts: 5             # Max new draft missions per run
    success_metric:
      name: actions_taken
      threshold: 0
      operator: gte  # 0 = nothing to do (healthy), > 0 = drafts or tasks created

# ── Promoter Configuration ───────────────────────────────────────────────────

promoter:
  # D-GEN-4: single gateway from v2.0 → v1.x
  export_dir: data/genesis/exports
  gkp_version: "1.0"

  # Auto-promote rules (no human needed)
  auto_promote:
    - artifact_type: research_signal
      min_confidence: 0.0  # Always promote (read-only data)
    - artifact_type: compliance_knowledge
      min_confidence: 0.0
    - artifact_type: quality_baseline
      min_confidence: 0.0
    - artifact_type: proven_pattern
      min_confidence: 0.85
    - artifact_type: capability_update
      min_confidence: 0.0  # Marketplace capability updates are safe
    - artifact_type: anticipation_report
      min_confidence: 0.80  # Only high-confidence regulatory anticipation auto-promotes
    # Reflex-based rules: any GKP from these reflexes auto-promotes
    - reflex: comply
      min_confidence: 0.0  # All compliance outputs are safe
    - reflex: audit
      min_confidence: 0.0  # Audit findings are read-only
    # Source-based rules: trusted external sources auto-promote
    - source_contains: CISA
      min_confidence: 0.0  # cisa.gov advisories and KEV
      hide_from_dashboard: true  # CVE/KEV auto-promoted, no review needed
    - source_contains: OWASP
      min_confidence: 0.0  # owasp.org feeds
      hide_from_dashboard: true  # Auto-promoted, no review needed
    - source_contains: nist
      min_confidence: 0.0  # NIST NVD and standards

  # Human-approve rules
  human_approve:
    - artifact_type: proven_pattern
      confidence_range: [0.7, 0.85]
    - artifact_type: code_patch
      min_confidence: 0.0  # Always human review
    - artifact_type: training_pair
      min_confidence: 0.0  # Always human review

  # Deduplication
  dedup:
    enabled: true
    similarity_threshold: 0.85
    method: jaccard_trigram

# ── Feedback Collector Configuration ─────────────────────────────────────────

feedback:
  # D-GEN-11: pull-based (v2.0 pulls from v1.x)
  collection_schedule: "daily 01:00"
  sources:
    - name: runtime_failures
      query: "SELECT * FROM audit_trail WHERE event_type LIKE 'error.%' AND created_at > ?"
      lookback_hours: 24
    - name: quality_trends
      query: "SELECT * FROM code_quality_metrics WHERE created_at > ?"
      lookback_hours: 168  # 7 days
    - name: coverage_gaps
      table: code_quality_metrics
      filter: "maintainability_score < 50"
    - name: heal_outcomes
      query: "SELECT * FROM self_healing_events WHERE created_at > ?"
      lookback_hours: 168
    - name: demand_signals
      table: pulse_demand_signals
      filter: "is_high_demand = 1"
  output_dir: data/genesis/feedback

# ── Audit Configuration ─────────────────────────────────────────────────────

audit:
  # D-GEN-6, D-GEN-10: append-only genesis_audit table
  table: genesis_audit
  retention_days: 365  # Keep 1 year of autonomous decision logs
  event_types:
    - genesis.daemon.started
    - genesis.daemon.stopped
    - genesis.reflex.started
    - genesis.reflex.completed
    - genesis.reflex.failed
    - genesis.reflex.skipped
    - genesis.circuit_breaker.tripped
    - genesis.circuit_breaker.reset
    - genesis.promoter.exported
    - genesis.promoter.auto_promoted
    - genesis.promoter.human_review_pending
    - genesis.promoter.promoted
    - genesis.promoter.rejected
    - genesis.promoter.dedup_skipped
    - genesis.evolve.mutation_proposed
    - genesis.evolve.mutation_accepted
    - genesis.evolve.mutation_rejected
    - genesis.feedback.collected
    - genesis.report.generated
    - genesis.kill_switch.activated
    - genesis.convergence.evaluated
    - genesis.convergence.retrospective_triggered
    - genesis.stagnation.detected
    - genesis.stagnation.plateau_broken

# ── Eval Harness Gates (AI-ify Phase 2 — anomaly_detection) ────────────────
# Thresholds moved from hardcoded Python constants to config so the
# anomaly_detection layer can adapt them without code changes.
harness:
  gates:
    precision_min: 0.80       # oracle_triage/heal: alert when precision < this
    ece_max: 0.15             # calibration: alert when ECE > this
    false_heal_max: 0.20      # heal: alert when false-heal rate > this
    heal_success_min: 0.60    # heal: alert when heal success rate < this
    min_decisions: 10         # skip gate check when fewer decisions than this
  anomaly_detection:
    enabled: true             # use adaptive z-score anomaly detection
    min_samples: 10           # minimum historical windows before adaptive mode activates
    window_days: 90           # rolling window in days for snapshot collection
    chunk_size: 20            # decision rows per sliding snapshot
    z_score: 2.0              # std deviations from mean to set adaptive threshold
    fallback_to_static: true  # fall back to gates.* thresholds when insufficient data
    # Hard safety bounds for adaptive thresholds — prevents z-score from producing
    # nonsensical values when history is noisy or sparse.
    adaptive_bounds:
      precision_min_floor: 0.50      # adaptive precision_min never goes below this
      ece_max_ceiling: 0.50          # adaptive ece_max never goes above this
      false_heal_max_ceiling: 0.60   # adaptive false_heal_max never goes above this
      heal_success_min_floor: 0.30   # adaptive heal_success_min never goes below this

# ── Convergence Gates (Phase 65 — Ouroboros-inspired) ──────────────────────

convergence:
  enabled: true
  weights:
    goal_drift: 0.5
    metric_drift: 0.3
    output_similarity: 0.2
  thresholds:
    max_acceptable_drift: 0.30
    convergence_similarity: 0.95
    max_ambiguity: 0.20
  ambiguity_weights:
    problem_clarity: 0.40
    solution_clarity: 0.30
    verification_clarity: 0.30
  retrospective:
    trigger_every_n_cycles: 5
    trigger_on_drift_above: 0.30
  window_size: 10
  # Anomaly detection: adaptive thresholds derived from per-reflex historical data.
  # When n_samples >= min_samples, thresholds become mean + z_score*std instead of
  # the static values above. Falls back to static thresholds until history builds up.
  anomaly_detection:
    min_samples: 5    # minimum records before adaptive thresholds activate
    z_score: 2.0      # std deviations above historical mean to set threshold
    slope_normalizer: 10.0  # maps linear metric slope → [0,1] drift; slope ≥ 1/slope_normalizer → zero drift
    clarity_keyword_divisor: 3  # keyword hits per dimension needed to score full clarity

# ── Stagnation Detector (Phase 65 — Ouroboros-inspired) ────────────────────

stagnation:
  enabled: true
  detection:
    oscillation_window: 4
    stagnation_threshold: 0.99
    stagnation_min_consecutive: 3
    diminishing_returns_slope_threshold: 0.01
    repetitive_output_overlap: 0.70
    repetitive_output_window: 3
  personas:
    hacker:
      description: "Find unconventional workarounds for this constraint"
      applicable_patterns:
        - oscillation
        - stagnation
    researcher:
      description: "What additional information would clarify this?"
      applicable_patterns:
        - stagnation
        - diminishing_returns
    simplifier:
      description: "How can we reduce complexity?"
      applicable_patterns:
        - diminishing_returns
        - repetitive_output
    architect:
      description: "How should we restructure this approach?"
      applicable_patterns:
        - oscillation
        - repetitive_output
    contrarian:
      description: "What assumption should we challenge?"
