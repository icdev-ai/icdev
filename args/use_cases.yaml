  - id: fedramp_auth_prep
    label: FedRAMP Authorization Prep
    category: compliance_ato
    icon: "☁"
    description: >
      Prepare a FedRAMP authorization package — SSP, SAP, SAR, POA&M, and ConMon
      plan — for cloud service providers pursuing JAB or Agency authorization.
    badge: FedRAMP
    agent_model: kimi-cloud
    ricoas: true
    fast_track: true
    boost_threshold: 70
    skip_requirement_types: []
    canvas_wiring:
      - compliance
      - supply_chain
      - knowledge
    quick_actions:
      - icon: "🔒"
        label: Compliance Canvas
        url: /compliance
        target: _blank
      - icon: "🔗"
        label: Supply Chain
        url: /network/ask
        target: _blank
      - icon: "📚"
        label: Knowledge Search
        url: /knowledge-search
        target: _blank
      - icon: "📋"
        label: Kanban Board
        url: /kanban
        target: _blank
    canvas_seeds:
      - canvas: security
        templates: [fedramp_ssp_template, conmon_plan_template]
        snippets: [fedramp_control_baseline_high, fedramp_inherited_controls]
      - canvas: boundary
        templates: [fedramp_boundary_diagram, data_flow_trust_zones]
        snippets: []
    workflow_steps:
      - step: 1
        label: Cloud System Inventory & Service Classification
        description: Classify service model (SaaS/PaaS/IaaS), select impact level (Low/Mod/High)
        canvas: compliance
        action: requirement_intake
      - step: 2
        label: Boundary Documentation & Inherited Controls
        description: Document system boundary, map CSP FedRAMP package inherited controls
        canvas: boundary
        action: review_requirements
      - step: 3
        label: Customer Responsibility Matrix
        description: Define customer-responsible controls and shared responsibility model
        canvas: compliance
        action: generate_artifacts
      - step: 4
        label: 3PAO Readiness Package Assembly
        description: Compile SSP, SAP, evidence, and schedule 3PAO assessment
        canvas: kanban
        action: submit_review
      - step: 5
        label: ConMon Plan & ATO/ATU Submission
        description: Finalize ConMon plan, submit for JAB P-ATO or Agency ATO
        action: export_bundle
    user_config:
      industries:
        defaults: [Federal Civilian, DoD, State/Local Government, Cloud Service Providers]
      equipment_types:
        defaults: []
      vendors:
        defaults: [AWS GovCloud, Azure Government, Google Cloud]
    system_prompt: |
      You are a FedRAMP authorization specialist with expertise in the FedRAMP Security
      Assessment Framework (SAF), NIST SP 800-53 Rev 5, FedRAMP High/Moderate/Low
      baselines, 3PAO assessment methodology, and JAB vs. Agency authorization paths.

      The FedRAMP Authorization Prep framework is pre-loaded with 15 validated requirements
      covering service model classification, impact level selection, 3PAO engagement,
      boundary documentation, inherited controls, customer responsibilities, ConMon,
      pen testing, IR SLAs, POAM remediation, FIPS cryptography, MFA, SIEM logging,
      and annual assessment scheduling.

      Refine requirements when the user provides: cloud service name, service model
      (SaaS/PaaS/IaaS), target impact level, underlying CSP platform (AWS/Azure/Google),
      or authorization path (JAB P-ATO vs. Agency ATO).

      Focus AI Boost on: FedRAMP control inheritance from CSP packages, customer
      responsibility matrix specificity, ConMon automation capability, and
      continuous authorization (cATO) readiness criteria.
    seed_message: |
      Your **FedRAMP Authorization Prep** framework is loaded and ready.

      15 pre-built requirements are already in place covering:
      • Service model (SaaS/PaaS/IaaS) classification and impact level selection
      • 3PAO engagement scope and assessment schedule
      • System boundary and data flow diagrams with trust zones
      • Inherited controls from CSP (AWS/Azure/GCP FedRAMP packages)
      • Customer Responsibility Matrix (CRM)
      • ConMon plan, pen testing, SIEM, and annual assessment schedule

      **AI Boost will run automatically and your PRD will be ready immediately.**

      Personalize with: service name, CSP platform, target impact level, authorization path.

      Skip customization → click **Send to Kanban** to start now.
    template_requirements:
      - type: compliance
        priority: high
        text: "System shall classify the cloud service as SaaS, PaaS, or IaaS and select a FedRAMP impact level (Low, Moderate, or High) based on data sensitivity and mission impact."
        criteria: "Acceptance: Service model and impact level documented in SSP; selection rationale aligned to FIPS 199/200; reviewed by agency AO."
      - type: functional
        priority: high
        text: "System shall engage a FedRAMP-authorized Third-Party Assessment Organization (3PAO) for the security assessment, with scope documented in a Security Assessment Plan (SAP)."
        criteria: "Acceptance: 3PAO selected from FedRAMP Marketplace; SAP reviewed and approved by CSP and agency; assessment schedule defined with start/end dates."
      - type: functional
        priority: high
        text: "System shall document the authorization boundary with architectural diagrams, data flow diagrams with trust zones, and an inventory of all system components within scope."
        criteria: "Acceptance: Boundary diagram distinguishes in-scope vs. out-of-scope components; trust zones labeled (Internet, DMZ, Internal, Restricted); data flows show ports/protocols."
      - type: functional
        priority: high
        text: "System shall map all FedRAMP controls inherited from the underlying CSP's FedRAMP authorization package, documenting the CSP ATO package reference for each inherited control."
        criteria: "Acceptance: Inherited control list cross-references CSP package name and authorization date; leveraged controls listed in SSP control implementation section."
      - type: functional
        priority: high
        text: "System shall produce a Customer Responsibility Matrix (CRM) clearly identifying controls that are CSP-managed, customer-managed, or shared, per the FedRAMP shared responsibility model."
        criteria: "Acceptance: CRM covers all baseline controls; customer-managed controls include specific implementation guidance; reviewed by agency before 3PAO assessment."
      - type: compliance
        priority: high
        text: "System shall implement a continuous monitoring (ConMon) strategy meeting FedRAMP ConMon requirements including monthly vulnerability scanning, annual penetration testing, and SIEM log retention."
        criteria: "Acceptance: ConMon plan approved by JAB or Agency; monthly scan results submitted to FedRAMP PMO within 30 days; SIEM retains logs ≥90 days hot, ≥1 year total."
      - type: compliance
        priority: high
        text: "System shall conduct annual penetration testing per the FedRAMP Penetration Testing Guidance, covering all network layers, web applications, and APIs."
        criteria: "Acceptance: Pen test completed annually by 3PAO or approved penetration testing firm; findings documented; critical/high findings remediated within 30 days."
      - type: compliance
        priority: high
        text: "System shall meet FedRAMP incident response SLAs: report security incidents within 1 hour for CAT 1/2 events and within 8 hours for CAT 3/4 to FedRAMP PMO and agency AO."
        criteria: "Acceptance: IR procedures document FedRAMP-specific reporting contacts and timelines; IR drill conducted semi-annually."
      - type: compliance
        priority: high
        text: "System shall remediate POAM findings within FedRAMP SLAs: critical within 30 days, high within 90 days, moderate within 180 days, and low within 365 days."
        criteria: "Acceptance: POAM aging report generated monthly; overdue remediations trigger escalation to AO; false positive/risk acceptance documented per finding."
      - type: compliance
        priority: high
        text: "System shall implement FIPS 140-2/140-3 validated encryption for all data at rest and in transit, with cryptographic module certificates documented in the SSP."
        criteria: "Acceptance: All storage and transit encryption uses FIPS-validated modules; TLS 1.2+ enforced; certificate numbers in SSP cryptography section."
      - type: compliance
        priority: high
        text: "System shall enforce multi-factor authentication (MFA) for all privileged users and all remote access, meeting NIST SP 800-63B AAL2 or higher requirements."
        criteria: "Acceptance: MFA configured for all admin and remote-access accounts; AAL level documented; passwordless or phishing-resistant MFA preferred for PIV-capable agencies."
      - type: compliance
        priority: high
        text: "System shall forward all audit logs to a SIEM or centralized log management system, retaining logs for a minimum of 90 days in hot storage and 1 year in total."
        criteria: "Acceptance: Log sources enumerated; SIEM receiving logs from all components; log completeness verified during 3PAO assessment."
      - type: functional
        priority: medium
        text: "System shall produce a FedRAMP-formatted SSP using the FedRAMP SSP template (MS Word or OSCAL format) with all required appendices (CRM, FIPS 199, user guide, rules of behavior)."
        criteria: "Acceptance: SSP validates against current FedRAMP template version; all appendices present and complete; OSCAL-formatted SSP available for automated ingestion."
      - type: compliance
        priority: medium
        text: "System shall schedule and complete an annual security assessment per FedRAMP ConMon requirements, producing an updated SAR submitted to FedRAMP PMO within 30 days of assessment completion."
        criteria: "Acceptance: Annual assessment scheduled and completed per ConMon plan; SAR submitted within 30 days; significant findings addressed in POAM update."
      - type: data
        priority: medium
        text: "System shall maintain an SBOM for all software components included in the cloud service, updated at each major/minor release, aligned to CISA SBOM guidance."
        criteria: "Acceptance: SBOM generated per release; NTIA minimum elements present; SBOM submitted to FedRAMP PMO as part of authorization package."

