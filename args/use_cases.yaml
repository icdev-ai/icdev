      requirements covering NTIA minimum elements, CycloneDX/SPDX format, component
      inventory, CVE cross-referencing, NDAA 889 attestation, software provenance,
      build reproducibility, update cadence, portal ingestion, and attestation letter.

      Refine requirements when the user provides: software product name, development
      language/framework, third-party component count, or specific agency submission
      requirements (e.g., CISA, DoD SCRM Task Force).

      Focus AI Boost on: SBOM completeness criteria, vulnerability remediation SLAs,
      dependency graph depth, transitive dependency coverage, and provenance chain-of-custody.
    seed_message: |
      Your **SBOM & Supply Chain Attestation** framework is loaded and ready.

      10 pre-built requirements are already in place covering:
      • NTIA minimum SBOM elements (supplier, component, version, hash, relationships)
      • CycloneDX 1.4+ or SPDX 2.3+ format selection and generation
      • Third-party component inventory with license classification
      • CVE cross-reference for all components against NVD and CISA KEV
      • NDAA Section 889 vendor attestation for all hardware components
      • Software provenance documentation and build reproducibility

      **AI Boost will run automatically and your PRD will be ready immediately.**

      Personalize with: product name, language/framework stack, agency submission target.

      Skip customization → click **Send to Kanban** to start now.
    template_requirements:
      - type: compliance
        priority: high
        text: "System shall generate an SBOM containing all NTIA minimum elements: supplier name, component name, version, unique identifier, dependency relationships, SBOM author, and timestamp."
        criteria: "Acceptance: SBOM validated against NTIA minimum elements checklist; all fields populated for 100% of direct dependencies."
      - type: functional
        priority: high
        text: "System shall produce the SBOM in CycloneDX 1.4+ or SPDX 2.3+ machine-readable format, with human-readable summary for review."
        criteria: "Acceptance: SBOM parseable by at least one CISA-recognized SBOM tooling platform; format selection documented with rationale."
      - type: data
        priority: high
        text: "System shall maintain a complete third-party component inventory including direct and transitive dependencies, with license type and version pinned per component."
        criteria: "Acceptance: Transitive dependency depth ≥3 levels captured; license classification (permissive/copyleft/proprietary) assigned per component."
      - type: compliance
        priority: high
        text: "System shall cross-reference all SBOM components against the NVD CVE database and CISA Known Exploited Vulnerabilities (KEV) catalog, with findings prioritized by CVSS score and KEV status."
        criteria: "Acceptance: CVE scan run at SBOM generation and on a defined schedule; KEV-listed vulnerabilities escalated to P1 remediation; scan results included in attestation package."
      - type: compliance
        priority: high
        text: "System shall produce an NDAA Section 889 compliance attestation for all hardware components, certifying no covered entities (Huawei, ZTE, Hytera, Hikvision, Dahua) are present."
        criteria: "Acceptance: 889 attestation signed by authorized official; covered entity screening documented; non-compliant components blocked from contract award."
      - type: data
        priority: high
        text: "System shall document software provenance for all custom-developed components, including source code repository URL, build environment, and build pipeline hash."
        criteria: "Acceptance: Provenance chain-of-custody documented per custom component; build pipeline is reproducible and hash-verified."
      - type: compliance
        priority: medium
        text: "System shall ensure build reproducibility for all delivered software artifacts, enabling byte-for-byte verification of delivered binaries against source code."
        criteria: "Acceptance: Build environment documented (compiler version, flags, dependencies); reproducibility test produces matching hash for at least one target platform."
      - type: functional
        priority: medium
        text: "System shall define an SBOM update cadence triggered by new releases, dependency updates, or newly published CVEs affecting in-scope components."
        criteria: "Acceptance: Update cadence documented; SBOM re-generated within 5 business days of a new CVE affecting an included component."
      - type: interface
        priority: medium
        text: "System shall ingest the generated SBOM into the ICDEV Supply Chain portal for continuous monitoring, vulnerability tracking, and ATO evidence collection."
        criteria: "Acceptance: SBOM ingested successfully into supply chain portal; components visible in portal within 24 hours of submission."
      - type: compliance
        priority: high
        text: "System shall produce a signed attestation letter certifying SBOM completeness, NDAA 889 compliance, and known vulnerability remediation status, suitable for submission to the contracting officer."
        criteria: "Acceptance: Attestation letter signed by authorized organization official; includes SBOM file reference, CVE summary, and 889 certification statement."

