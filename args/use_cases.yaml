        defaults: []
    system_prompt: |
      You are a Section 508 compliance specialist and accessibility expert with expertise
      in the Revised Section 508 Standards (36 CFR Part 1194), WCAG 2.1 AA, EN 301 549,
      and VPAT 2.5 (ACR format). You have conducted 508 audits for federal agencies and
      understand both automated testing (axe, WAVE, Lighthouse) and manual testing
      with assistive technologies (NVDA, JAWS, VoiceOver).

      The Section 508 Accessibility Audit framework is pre-loaded with 8 validated
      requirements covering WCAG 2.1 AA conformance, keyboard navigation, screen reader
      compatibility, color contrast, alt text, form labels, video captions, and VPAT.

      Refine requirements when the user provides: application type (web, mobile, desktop,
      document), user base (internal employees, general public, individuals with
      disabilities), or current accessibility testing maturity.

      Focus AI Boost on: critical barriers that prevent access to primary functions,
      color contrast failures, missing programmatic labels, keyboard traps, and
      time-based media without captions.
    seed_message: |
      Your **Section 508 Accessibility Audit** framework is loaded and ready.

      8 pre-built requirements are already in place covering:
      • WCAG 2.1 Level AA conformance across all 50 success criteria
      • Keyboard navigation without mouse dependency (no keyboard traps)
      • Screen reader compatibility (NVDA + JAWS + VoiceOver)
      • Color contrast ratio ≥4.5:1 for normal text, ≥3:1 for large text
      • Alt text for all non-decorative images and meaningful media
      • Video captions and audio descriptions for time-based media

      **AI Boost will run automatically and your PRD will be ready immediately.**

      Personalize with: application type, user base, current testing tools.

      Skip customization → click **Send to Kanban** to start now.
    template_requirements:
      - type: compliance
        priority: high
        text: "System shall conform to WCAG 2.1 Level AA for all web content and user interfaces, with conformance documented in a Voluntary Product Accessibility Template (VPAT 2.5 ACR format)."
        criteria: "Acceptance: VPAT covers all applicable 508 criteria; Level A and AA success criteria addressed; VPAT published on agency product page."
      - type: functional
        priority: high
        text: "System shall be fully operable via keyboard alone, with no keyboard traps, visible focus indicators on all interactive elements, and logical tab order throughout."
        criteria: "Acceptance: All interactive elements reachable via Tab/Shift-Tab; focus indicator visible (≥3:1 contrast ratio against adjacent colors); no keyboard traps confirmed via manual test."
      - type: functional
        priority: high
        text: "System shall be compatible with JAWS 2023+ and NVDA 2023+ screen readers on Windows and VoiceOver on macOS/iOS, with all content and functionality accessible."
        criteria: "Acceptance: Manual testing with JAWS and NVDA confirms all primary user flows accessible; no critical accessibility barriers reported; testing results documented."
      - type: compliance
        priority: high
        text: "System shall meet WCAG 2.1 SC 1.4.3 contrast requirements: color contrast ratio ≥4.5:1 for normal text, ≥3:1 for large text (18pt/14pt bold), and ≥3:1 for UI components."
        criteria: "Acceptance: Automated contrast audit (axe/WAVE) passes for all text; manual spot-check of 20% of UI components; zero failures on primary user flows."
      - type: compliance
        priority: high
        text: "System shall provide meaningful alternative text for all non-decorative images, icons, and graphics, and mark decorative images with null alt attribute."
        criteria: "Acceptance: All img elements have alt attribute; decorative images have alt=''; meaningful alt text conveys function/content without referencing 'image of'; automated check passes."
      - type: compliance
        priority: high
        text: "System shall ensure all form inputs have programmatic labels, error messages identify the field in error, and suggestions are provided for format errors where possible."
        criteria: "Acceptance: All form fields pass automated label check; error messages reference specific field name; format suggestions provided for date/phone/email fields."
      - type: compliance
        priority: high
        text: "System shall provide captions for all pre-recorded video content and audio descriptions for video where visual information is not conveyed in the audio track."
        criteria: "Acceptance: 100% of pre-recorded videos have accurate closed captions; audio descriptions available for all informational visual-only content; live captions provided for real-time video."
      - type: functional
        priority: medium
        text: "System shall produce a VPAT (Voluntary Product Accessibility Template) 2.5 in ACR format documenting conformance level for each applicable Section 508 standard and WCAG 2.1 AA criterion."
        criteria: "Acceptance: VPAT uses current VPAT 2.5 ACR template; all applicable criteria addressed with 'Supports', 'Partially Supports', or 'Does Not Support'; remarks explain any non-support."

