        defaults: []
    system_prompt: |
      You are a grant writing specialist and state/local government program manager
      with expertise in federal grant programs — BRIC (Building Resilient Infrastructure
      and Communities), SLIGP (State and Local Implementation Grant Program), BEAD
      (Broadband Equity Access and Deployment), ARPA-local programs, E-Rate, and
      CDBG-DR — as well as OMB Uniform Guidance (2 CFR Part 200), NEPA compliance,
      and state procurement code adherence.

      The Grant Tech Proposal framework is pre-loaded with 10 validated requirements
      covering eligibility determination, project narrative, cost-benefit analysis,
      matching funds, performance metrics, NEPA compliance, procurement plan, reporting
      cadence, closeout deliverables, and sustainability plan.

      Refine requirements when the user provides: grant program name, project type
      (infrastructure, planning, capacity building), award ceiling, and match percentage.

      Focus AI Boost on: outcome-based performance metrics, cost-effectiveness
      documentation, interoperability requirements, grant-specific compliance overlays,
      and post-award management structure.
    seed_message: |
      Your **Grant Tech Proposal** framework is loaded and ready.

      10 pre-built requirements are already in place covering:
      • Grant program eligibility determination and alignment checklist
      • Project narrative structure (problem statement, approach, outcomes)
      • Cost-benefit analysis with measurable citizen service outcomes
      • Matching funds documentation (cash match, in-kind contributions)
      • SMART performance metrics and quarterly reporting cadence
      • NEPA determination, procurement plan, and sustainability strategy

      **AI Boost will run automatically and your PRD will be ready immediately.**

      Personalize with: grant program, project type, award ceiling, match requirement.

      Skip customization → click **Send to Kanban** to start now.
    template_requirements:
      - type: compliance
        priority: high
        text: "System shall document applicant eligibility for the target grant program, including entity type (state/local/tribal), geographic eligibility, prior award restrictions, and SAM.gov registration status."
        criteria: "Acceptance: Eligibility checklist completed; SAM.gov registration active; DUNS/UEI number on file; debarment check clear."
      - type: functional
        priority: high
        text: "System shall produce a project narrative addressing the program's required elements: problem statement, project approach, expected outcomes, timeline, and alignment to program priorities."
        criteria: "Acceptance: Narrative addresses all solicitation-required sections; outcomes are measurable; narrative reviewed by authorized organizational representative before submission."
      - type: functional
        priority: high
        text: "System shall provide a cost-benefit analysis quantifying the anticipated public benefit, return on investment, and long-term sustainability of the funded project."
        criteria: "Acceptance: CBA includes cost per beneficiary, direct/indirect benefit categories, and NPV or BCR calculation; reviewed by agency finance officer."
      - type: compliance
        priority: high
        text: "System shall document all non-federal matching funds (cash and in-kind) meeting the grant program's match percentage requirement per 2 CFR Part 200.306."
        criteria: "Acceptance: Match sources identified with amounts, valuation methodology, and documentation (MOUs, letters); total match meets or exceeds required percentage."
      - type: data
        priority: high
        text: "System shall define SMART (Specific, Measurable, Achievable, Relevant, Time-bound) performance metrics tied to program objectives, with baseline values and targets for each reporting period."
        criteria: "Acceptance: At minimum 3 quantitative metrics defined; baseline values documented; data collection methodology specified; targets align to grant period milestones."
      - type: compliance
        priority: medium
        text: "System shall complete a NEPA environmental compliance determination (Categorical Exclusion, EA, or EIS) before project implementation begins."
        criteria: "Acceptance: NEPA determination documented by authorized environmental official; categorical exclusion checklist or EA/EIS initiated if required; determination on file pre-award."
      - type: compliance
        priority: medium
        text: "System shall produce a procurement plan complying with state procurement code and 2 CFR Part 200.317-326, addressing competitive bidding thresholds, sole source justifications, and DBE requirements."
        criteria: "Acceptance: Procurement plan covers all anticipated contracts; thresholds documented; DBE goal established if applicable; plan reviewed by state purchasing office."
      - type: functional
        priority: medium
        text: "System shall define a quarterly reporting cadence including required federal reporting (SF-425 financial report, performance progress reports) and submission procedures."
        criteria: "Acceptance: Reporting calendar aligned to award period; SF-425 format prepared; point-of-contact for federal program officer identified."
      - type: functional
        priority: medium
        text: "System shall produce closeout deliverables meeting 2 CFR Part 200.344 requirements including final financial report, performance report, and property disposition."
        criteria: "Acceptance: Closeout checklist prepared covering all required final reports; 90-day closeout window documented; property transfer or disposition plan included."
      - type: functional
        priority: high
        text: "System shall include a sustainability plan demonstrating how project outcomes will be maintained after the federal grant period ends, without ongoing federal funding."
        criteria: "Acceptance: Sustainability plan identifies funding mechanism (fee-for-service, state appropriation, local levy), staffing plan, and maintenance schedule for at least 3 years post-award."

  - id: cjis_compliance_prep
    label: CJIS Security Policy Compliance
    category: state_local
    icon: "🔐"
    description: >
      Prepare state and local law enforcement agencies for FBI CJIS Security Policy
      v5.9 compliance across all 13 policy areas including authentication, encryption,
      and personnel security.
    badge: CJIS v5.9
    agent_model: kimi-cloud
    ricoas: true
    fast_track: true
    boost_threshold: 70
    skip_requirement_types: []
    canvas_wiring:
      - compliance
      - supply_chain
      - knowledge
    quick_actions:
      - icon: "🔒"
        label: Compliance Canvas
        url: /compliance
        target: _blank
      - icon: "🔗"
        label: Supply Chain
        url: /network/ask
        target: _blank
      - icon: "📚"
        label: Knowledge Search
        url: /knowledge-search
        target: _blank
      - icon: "📋"
        label: Kanban Board
        url: /kanban
        target: _blank
    canvas_seeds:
      - canvas: security
        templates: [cjis_security_addendum_template, cjis_13_area_checklist]
        snippets: [cjis_aaa_requirements, cjis_encryption_matrix]
    workflow_steps:
      - step: 1
        label: CJIS Policy Area Baseline Assessment
        description: Map current controls against all 13 CJIS Security Policy areas
        canvas: compliance
        action: requirement_intake
      - step: 2
        label: Advanced Authentication & Encryption
        description: Implement AAL2+ authentication, AES-256 encryption for CJI at rest/transit
        canvas: compliance
        action: review_requirements
      - step: 3
        label: Personnel Security & Vendor Addendums
        description: Conduct fingerprint-based background checks; execute vendor CJIS Security Addendum
        canvas: kanban
        action: generate_artifacts
      - step: 4
        label: Audit Logging & Network Isolation
        description: Configure audit logging (1-year retention), isolate CJI network segments
        canvas: kanban
        action: submit_review
      - step: 5
        label: CJIS ISO Assessment & Remediation
        description: Schedule state CJIS ISO assessment, remediate findings
        action: export_bundle
    user_config:
      industries:
        defaults: [State Law Enforcement, Local Police, Sheriff Office, State Courts, Corrections]
      equipment_types:
        defaults: []
      vendors:
        defaults: []
    system_prompt: |
      You are a CJIS (Criminal Justice Information Services) compliance specialist with
      deep expertise in the FBI CJIS Security Policy v5.9, all 13 CJIS policy areas,
      Advanced Authentication requirements, CJIS audit processes, and the CJIS Systems
      Agency (CSA) / State CJIS ISO oversight structure.

      The CJIS Compliance Prep framework is pre-loaded with 12 validated requirements
      covering the 13 CJIS policy areas, Advanced Authentication, AES-256 encryption,
      personnel screening, audit log retention, mobile device management, vendor CJIS
      Addendum, FBI CJIS ISO reporting, network isolation, wireless security, physical
      protection, and biennial training.

      Refine requirements when the user provides: agency type (local PD, sheriff,
      state patrol, courts, corrections), CJI access methods (terminal, API, mobile),
      cloud hosting considerations, or current CJIS compliance gaps from prior audit.

      Focus AI Boost on: Advanced Authentication implementation options (PIV, OTP,
      biometric), encryption key management, cloud services compliance (CJIS Cloud
      Policy), and audit log completeness requirements.
    seed_message: |
      Your **CJIS Security Policy Compliance** framework is loaded and ready.

      12 pre-built requirements are already in place covering:
      • CJIS Security Policy v5.9 mapping across all 13 policy areas
      • Advanced Authentication (AAL2+) for all remote CJI access
      • AES-256 encryption for CJI at rest and in transit
      • Personnel security screening (CJIS Security Addendum fingerprint-based)
      • Audit log retention (minimum 1 year) and review procedures
      • Third-party vendor CJIS Security Addendum execution

      **AI Boost will run automatically and your PRD will be ready immediately.**

      Personalize with: agency type, CJI access methods, cloud hosting, prior audit gaps.

      Skip customization → click **Send to Kanban** to start now.
    template_requirements:
      - type: compliance
        priority: high
        text: "System shall implement controls addressing all 13 CJIS Security Policy v5.9 policy areas: Information Exchange Agreements, Security Awareness, Incident Response, Auditing and Accountability, Access Control, Identification and Authentication, Configuration Management, Media Protection, Physical Protection, Systems and Communications Protection, Formal Audits, Personnel Security, and Mobile Devices."
        criteria: "Acceptance: CJIS policy area mapping matrix completed; each area has a designated control owner; gaps identified with remediation timeline."
      - type: compliance
        priority: high
        text: "System shall implement Advanced Authentication (AA) meeting FBI CJIS requirements for all users accessing CJI remotely, compliant with AAL2 (NIST SP 800-63B) or higher."
        criteria: "Acceptance: AA implemented for 100% of remote CJI access; acceptable AA methods documented (PIV, OTP app, hardware token); AA bypass procedures locked."
      - type: compliance
        priority: high
        text: "System shall encrypt all Criminal Justice Information (CJI) at rest and in transit using AES 256-bit encryption or NIST-approved equivalent, with encryption key management procedures documented."
        criteria: "Acceptance: Encryption implemented for all CJI data stores and network transmissions; key management procedure documented; encryption verified by state CJIS ISO."
      - type: compliance
        priority: high
        text: "System shall ensure all personnel with unescorted physical or logical access to CJI undergo a fingerprint-based background check per CJIS Security Policy Section 5.12."
        criteria: "Acceptance: Background check completion tracked per employee and contractor; personnel without completed checks prohibited from CJI access; records on file for duration of employment."
      - type: compliance
        priority: high
        text: "System shall maintain audit logs for all CJI access events, including user ID, date/time, CJI record accessed, and action taken, with logs retained for a minimum of 1 year."
        criteria: "Acceptance: Audit logging enabled for all CJI terminal and application access; log retention ≥1 year; logs reviewed monthly by designated security officer."
      - type: compliance
        priority: high
        text: "System shall implement a Mobile Device Management (MDM) policy for all mobile devices accessing CJI, including encryption, remote wipe, and session lock per CJIS Section 5.13."
        criteria: "Acceptance: MDM solution deployed to all agency mobile devices accessing CJI; remote wipe capability tested annually; session timeout ≤30 minutes."
      - type: compliance
        priority: high
        text: "System shall execute a CJIS Security Addendum with all third-party vendors and contractors who have unescorted access to systems processing CJI, obtaining state CJIS ISO approval."
        criteria: "Acceptance: CJIS Security Addendum on file for all vendors; vendor personnel completed fingerprint-based background check; addendum renewed at each contract renewal."
      - type: compliance
        priority: medium
        text: "System shall report all confirmed CJI security incidents to the FBI CJIS ISO and state CJIS Systems Agency (CSA) within the CJIS-required reporting timeframe."
        criteria: "Acceptance: IR procedures include CJIS-specific reporting contacts (FBI CJIS ISO and state CSA); reporting timeline documented; test notification conducted annually."
      - type: compliance
        priority: high
        text: "System shall isolate all networks, systems, and applications processing CJI from non-CJI networks using firewalls, access control lists, or physical network separation."
        criteria: "Acceptance: Network isolation diagram reviewed by state CJIS ISO; CJI segments identified; unauthorized lateral movement from non-CJI networks prevented and tested."
      - type: compliance
        priority: medium
        text: "System shall implement a wireless network security policy for any wireless network transmitting CJI, meeting CJIS requirements for WPA3 or WPA2-Enterprise with AES encryption."
        criteria: "Acceptance: Wireless policy documented; WPA2-Enterprise (802.1X) or WPA3 enforced; rogue AP detection implemented; wireless policy reviewed annually."
      - type: compliance
        priority: medium
        text: "System shall implement physical access controls for all areas housing CJI systems, including visitor logs, badge access, and camera monitoring per CJIS Section 5.9."
        criteria: "Acceptance: Physical access controls verified; visitor log maintained for CJI areas; camera coverage documented; physical security reviewed by state CJIS ISO."
      - type: compliance
        priority: high
        text: "System shall ensure all personnel with access to CJI complete CJIS Security Policy awareness training within 6 months of hire and every 2 years thereafter."
        criteria: "Acceptance: Training completion tracked per user; biennial recertification enforced; non-completers lose CJI access after 30-day grace period; records on file."
