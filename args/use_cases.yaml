        defaults: [Federal Civilian, Defense, DHS, DOJ, HHS, VA, State/Local]
      equipment_types:
        defaults: []
      vendors:
        defaults: []
    system_prompt: |
      You are a Senior Agency Official for Privacy (SAOP) advisor with expertise in the
      Privacy Act of 1974, E-Government Act of 2002 (Section 208 PIA requirement),
      OMB Circular A-130 Appendix II, NIST SP 800-122 (PII Guide), and FISMA privacy
      requirements. You understand Fair Information Practice Principles (FIPPs).

      The Privacy Impact Assessment framework is pre-loaded with 10 validated requirements
      covering PII data element inventory, legal authority, purpose specification, data
      retention, access controls, breach notification, third-party sharing, SORN
      determination, FIPP alignment, and privacy training.

      Refine requirements when the user provides: system name, agency, data categories
      (financial, health, biometric, law enforcement), or user population (employees,
      general public, contractors, minors).

      Focus AI Boost on: PII minimization opportunities, de-identification feasibility,
      consent and notice requirements, cross-agency data sharing ISCA requirements,
      and privacy risk quantification using NIST privacy risk framework.
    seed_message: |
      Your **Privacy Impact Assessment** framework is loaded and ready.

      10 pre-built requirements are already in place covering:
      • PII data element inventory (fields, sensitivity level, volume)
      • Legal authority for collection (statute, regulation, executive order)
      • Purpose specification and use limitation
      • Retention schedule and disposal procedures
      • Access controls and need-to-know enforcement
      • Breach notification procedures (72-hour OMB requirement)

      **AI Boost will run automatically and your PRD will be ready immediately.**

      Personalize with: agency, system name, data categories, user population.

      Skip customization → click **Send to Kanban** to start now.
    template_requirements:
      - type: data
        priority: high
        text: "System shall maintain a PII data element inventory cataloging all personally identifiable information collected, processed, or stored, with sensitivity classification per NIST SP 800-122."
        criteria: "Acceptance: Inventory includes field name, data type, sensitivity (low/moderate/high), source, and associated business process; reviewed annually."
      - type: compliance
        priority: high
        text: "System shall document the legal authority for each PII data collection, citing the specific statute, regulation, or executive order authorizing the collection."
        criteria: "Acceptance: Legal authority citation present for every PII category; authorities reviewed by agency legal counsel; E.O. 12333 or Privacy Act applicability determined."
      - type: compliance
        priority: high
        text: "System shall define purpose specification and use limitation for all PII, ensuring data is used only for the stated collection purpose and compatible secondary uses."
        criteria: "Acceptance: Purpose statement in PIA for each data category; incompatible secondary use requires new authority or consent; purpose reviewed at annual PIA update."
      - type: compliance
        priority: high
        text: "System shall establish a PII retention and disposal schedule aligned to applicable NARA records schedule, with secure disposal procedures for all PII upon record expiration."
        criteria: "Acceptance: Retention schedule references NARA GRS or agency-specific schedule; secure disposal method (NIST 800-88 compliant) documented per media type."
      - type: compliance
        priority: high
        text: "System shall implement access controls enforcing need-to-know for all PII, with role-based access and annual review of all accounts with PII access."
        criteria: "Acceptance: Role-based access documented; annual access review completed and signed; accounts without business need removed within 5 business days of review."
      - type: compliance
        priority: high
        text: "System shall implement breach notification procedures meeting OMB M-17-12, including 72-hour notification to US-CERT and 30-day notification to affected individuals."
        criteria: "Acceptance: Breach notification procedures documented; designated breach response team identified; notification templates pre-drafted for US-CERT and public notice."
      - type: compliance
        priority: medium
        text: "System shall document all third-party data sharing agreements (ISAs, MOUs, data-sharing agreements) and ensure recipients are bound by equivalent privacy protections."
        criteria: "Acceptance: All third-party recipients identified; data sharing agreements on file; agreements reviewed annually; foreign data transfers identified for additional review."
      - type: compliance
        priority: high
        text: "System shall determine whether a Privacy Act System of Records Notice (SORN) is required, and if so, publish the SORN in the Federal Register before operating the system."
        criteria: "Acceptance: SORN determination documented by SAOP; if required, SORN published ≥30 days before system operation; SORN reference in PIA."
      - type: compliance
        priority: medium
        text: "System shall align PII handling practices to all seven Fair Information Practice Principles (FIPPs): Transparency, Individual Participation, Purpose Specification, Data Minimization, Use Limitation, Data Quality, and Security."
        criteria: "Acceptance: FIPP alignment documented in PIA; gaps identified and remediation plan included; SAOP certifies FIPP compliance."
      - type: functional
        priority: medium
        text: "System shall require annual privacy training for all personnel with access to PII, with completion records maintained and non-completion triggering access revocation."
        criteria: "Acceptance: Training content covers Privacy Act, agency privacy policy, and PII handling; completion tracked per user; non-completers lose PII access after 30-day grace period."

