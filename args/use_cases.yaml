  - id: ato_package_builder
    label: ATO Package Builder
    category: compliance_ato
    icon: "🛡"
    description: >
      Build a complete ATO package — SSP, POAM, STIG checklist, and ConMon plan —
      for DoD/IC RMF authorization at IL2 through IL5.
    badge: RMF
    agent_model: kimi-cloud
    ricoas: true
    fast_track: true
    boost_threshold: 70
    skip_requirement_types: []
    canvas_wiring:
      - compliance
      - supply_chain
      - kanban
      - knowledge
    quick_actions:
      - icon: "🔒"
        label: Compliance Canvas
        url: /compliance
        target: _blank
      - icon: "📋"
        label: Kanban Board
        url: /kanban
        target: _blank
      - icon: "🔗"
        label: Supply Chain
        url: /network/ask
        target: _blank
      - icon: "📚"
        label: Knowledge Search
        url: /knowledge-search
        target: _blank
    canvas_seeds:
      - canvas: security
        templates: [ssp_baseline_v1, poam_tracker]
        snippets: [nist_800_53_checklist]
      - canvas: boundary
        templates: [system_boundary_v1]
        snippets: []
    workflow_steps:
      - step: 1
        label: System Inventory & Categorization
        description: Define boundary, categorize per FIPS 199, inventory components
        canvas: compliance
        action: requirement_intake
      - step: 2
        label: Control Selection & Inheritance
        description: Select control baseline, map inherited controls from CSP/enterprise
        canvas: compliance
        action: review_requirements
      - step: 3
        label: POAM & Gap Analysis
        description: Document open findings, assign CAT ratings, set remediation milestones
        canvas: kanban
        action: generate_artifacts
      - step: 4
        label: Package Assembly & ISSO Review
        description: Assemble SSP, SAR, RAR; ISSO reviews and signs off
        canvas: kanban
        action: submit_review
      - step: 5
        label: ATO Submission & ConMon Activation
        description: Submit package to AO, activate continuous monitoring
        action: export_bundle
    user_config:
      industries:
        defaults: [Defense, Intelligence Community, Federal Civilian, DoD Components]
      equipment_types:
        defaults: []
      vendors:
        defaults: []
    system_prompt: |
      You are an Information System Security Officer (ISSO) with deep expertise in the
      Risk Management Framework (RMF) per NIST SP 800-37 Rev 2, NIST SP 800-53 Rev 5,
      CNSSI 1253, and DISA STIGs. You have guided systems through ATO at IL2, IL4, and IL5.

      The ATO Package Builder is pre-loaded with 15 validated requirements covering SSP
      structure, control inheritance, POAM management, STIG compliance, continuous
      monitoring, boundary documentation, and ISSO/AO submission workflow.

      Refine requirements when the user provides: system name, classification level,
      hosting environment (on-prem, AWS GovCloud, Azure Government, hybrid), or current
      RMF phase (Categorize/Select/Implement/Assess/Authorize/Monitor).

      Focus AI Boost on: FIPS 199 impact levels, control baseline selection, inherited
      vs. system-specific controls, POAM structure, ConMon strategy, and evidence
      collection. Reference NIST, DISA, CNSSI sources — avoid vague recommendations.
    seed_message: |
      Your **ATO Package Builder** framework is loaded and ready.

      15 pre-built requirements are already in place covering:
