# CUI // SP-CTI
# External tool index (xrv-route-01)
#
# ONE declared list of the external BINARIES ICDEV shells out to, so that a
# deployment can be asked "which of the things this platform invokes are
# actually on this PATH, and at what version" before something fails at the
# point of use with a swallowed FileNotFoundError.
#
# WHAT BELONGS HERE: a binary resolved from PATH by `shutil.which(...)` or
# handed to `subprocess` as argv[0]. Nothing else. Five shapes that look like
# they belong and DO NOT are recorded under `excluded:` below with their
# reasons -- an omission a reader cannot see is indistinguishable from an
# oversight, which is the defect this file exists to remove.
#
# `binary` may be a plain string, or a mapping keyed by platform:
#     binary: {default: foo, windows: foo-win, linux: foo, darwin: foo}
# Only a differing STEM needs an override. `shutil.which` already resolves
# PATHEXT on Windows (.exe/.cmd/.bat), so `oscal-cli` finds `oscal-cli.cmd`
# and `java` finds `java.exe` with no entry here. ZERO declared tools need an
# override today; `--refresh --json` reports `os_overrides_declared` so that
# zero is MEASURED and never assumed.
#
# `version_cmd` is REQUIRED for every entry. It is what separates `present`
# (the binary answered) from `unmeasurable` (the binary is on PATH and did not
# answer) -- and a `present` verdict that never ran the binary is a claim about
# a file name, not about a working tool. Both stdout AND stderr are searched:
# `java -version` writes its banner to stderr, and so do several others.
#
# `used_by` names the PRINCIPAL consumers and is deliberately NOT exhaustive
# for a ubiquitous binary (git has 81 invocation sites). Every path listed is
# validated to exist. Re-derive the full, current set from the tree with:
#     python -m tools.dx.tool_index --call-sites git
#
# `optional: false` means ICDEV cannot function without it, and health_check
# reports its absence as an ERROR. Everything else is a WARNING: an absent
# optional tool is a capability this deployment does not have, not a fault.

version: 1

defaults:
  # Matches "2.55.0", "v24.11.0", "1.5.0", "0.69.3", "2026.06.09".
  version_regex: '(\d+(?:\.\d+)+)'
  timeout_seconds: 20

tools:
  # -- source control / forge ----------------------------------------------
  - name: git
    binary: git
    version_cmd: [git, --version]
    min_version: "2.20"
    optional: false
    used_by:
      - tools/workflow/git_utils.py
      - tools/ci/pr_watcher.py
      - tools/kanban/cli.py
      - tools/dx/mirror_parity.py
      - tools/genesis/code_reload.py
      - tools/awareness/code_staleness.py

  - name: gh
    binary: gh
    version_cmd: [gh, --version]
    min_version: "2.0"
    optional: true
    used_by:
      - tools/ci/pr_watcher.py
      - tools/ci/merge_readiness.py
      - tools/kanban/dispatch_admission.py
      - tools/airgap/hook_compat.py
      - tools/workflow/core_api_manifest.py

  # -- containers / orchestration -------------------------------------------
  - name: docker
    binary: docker
    version_cmd: [docker, --version]
    optional: true
    used_by:
      - tools/cli/provision_db.py
      - tools/databridge/forge/sandbox_manager.py
      - tools/genesis/reflexes/ci_runner_health.py
      - tools/studio/executors/gns3_sim.py
      - tools/airgap/image_vendor.py

  - name: docker-compose
    binary: docker-compose
    version_cmd: [docker-compose, --version]
    optional: true
    used_by:
      - tools/cli/setup_wizard.py

  - name: kubectl
    binary: kubectl
    version_cmd: [kubectl, version, --client]
    optional: true
    used_by:
      - tools/infra/infra_status.py
      - tools/saas/infra/namespace_provisioner.py

  - name: helm
    binary: helm
    version_cmd: [helm, version, --short]
    optional: true
    used_by:
      - tools/pipeline/iac_validator.py

  - name: kind
    binary: kind
    version_cmd: [kind, --version]
    optional: true
    used_by:
      - tools/pipeline/iac_validator.py

  - name: terraform
    binary: terraform
    version_cmd: [terraform, version]
    optional: true
    used_by:
      - tools/pipeline/iac_validator.py
      - tools/infra_canvas/adapters/floci_adapter.py

  - name: localstack
    binary: localstack
    version_cmd: [localstack, --version]
    optional: true
    used_by:
      - tools/pipeline/iac_validator.py

  # -- security scanning -----------------------------------------------------
  - name: trivy
    binary: trivy
    version_cmd: [trivy, --version]
    optional: true
    used_by:
      - tools/security/container_scanner.py

  - name: osv-scanner
    binary: osv-scanner
    version_cmd: [osv-scanner, --version]
    optional: true
    used_by:
      - tools/security/osv_scanner.py
      - tools/testing/health_check.py

  - name: detect-secrets
    binary: detect-secrets
    version_cmd: [detect-secrets, --version]
    optional: true
    used_by:
      - tools/security/secret_detector.py

  - name: pip-audit
    binary: pip-audit
    version_cmd: [pip-audit, --version]
    optional: true
    used_by:
      - tools/security/dependency_auditor.py

  - name: semgrep
    binary: semgrep
    version_cmd: [semgrep, --version]
    optional: true
    used_by:
      - tools/aiify/pattern_classifier.py
      - tools/ai_augmentation/pattern_classifier.py

  - name: syft
    binary: syft
    version_cmd: [syft, version]
    optional: true
    used_by:
      - tools/network/airgap_bundle.py

  - name: skillspector
    binary: skillspector
    version_cmd: [skillspector, --version]
    optional: true
    used_by:
      - tools/integrity/adapters/skillspector_adapter.py
      - tools/workflow/coherence_checker.py

  - name: sigma
    binary: sigma
    version_cmd: [sigma, --version]
    optional: true
    used_by:
      - tools/observability_canvas/sigma_generator.py

  - name: tor
    binary: tor
    version_cmd: [tor, --version]
    optional: true
    used_by:
      - tools/strategos/darkweb_monitor.py

  - name: analyzeHeadless
    # NSA Ghidra's headless analyser. Declared here as of xrv-bin-02, which is
    # the consumer whose absence kept it under `excluded:` until now.
    #
    # IT REPORTS `unmeasurable` ON A HOST THAT HAS IT, BY CONSTRUCTION, and
    # that is the honest reading rather than a defect to be worked around.
    # The launcher has NO version flag: run with no arguments (or with any
    # bad argument) it prints a usage banner carrying no version and exits
    # NON-ZERO, so `probe` reports unmeasurable / version_cmd_exit_nonzero.
    # Declaring a `version_cmd` that cannot succeed is deliberate -- the field
    # is required precisely so `present` is never claimed from a filename
    # alone, and this binary genuinely cannot answer. The REAL version is read
    # from <ghidra_home>/Ghidra/application.properties by
    # tools/analyzers/ghidra_headless.py::ghidra_version, a file read that
    # costs no JVM start, and it is on every report that module produces.
    #
    # `absent` on a host WITHOUT Ghidra is still exact -- shutil.which answers
    # before the version command is ever run -- so the one signal an operator
    # needs from this entry (is it installed?) is not degraded.
    binary: analyzeHeadless
    version_cmd: [analyzeHeadless]
    optional: true
    used_by:
      - tools/analyzers/ghidra_headless.py

