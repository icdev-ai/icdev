# -- DECLARED ABSENCES -------------------------------------------------------
# Each of these was named as a seed candidate and each is NOT a PATH binary
# ICDEV resolves. Declaring one would put a fabricated `absent` finding on
# every deployment; leaving it out silently would read as an oversight.
excluded:
  - name: bandit
    reason: >-
      Invoked as a PYTHON MODULE, never from PATH --
      [sys.executable, "-m", "bandit", ...] in
      tools/databridge/forge/static_validator.py, and `python -m bandit` in
      every documented command. PATH is not consulted, so a PATH probe would
      report `absent` on a host where `python -m bandit` works.

  - name: cosign
    reason: >-
      ICDEV GENERATES pipeline configuration that calls cosign
      (tools/devsecops/attestation_manager.py, tools/pipeline/deploy_generator.py);
      no ICDEV process ever invokes it. The binary is a dependency of the
      generated pipeline's runner, not of this platform.

  - name: playwright
    reason: >-
      tools/testing/e2e_runner.py resolves it from the project's
      node_modules/.bin as playwright.cmd / playwright and carries an explicit
      comment REFUSING a bare shutil.which("playwright") fallback. The PATH
      binary this platform actually needs is `npx`, which IS declared.

  - name: grype
    reason: >-
      Named only in generated runbook text (tools/pipeline/runbooks.py) and in
      a requirements-intake keyword list. No invocation site in the tree.
