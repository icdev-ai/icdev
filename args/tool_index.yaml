  # -- browser drivers -------------------------------------------------------
  - name: chromedriver
    binary: chromedriver
    version_cmd: [chromedriver, --version]
    optional: true
    used_by:
      - tools/browser/driver_manager.py

  - name: msedgedriver
    binary: msedgedriver
    version_cmd: [msedgedriver, --version]
    optional: true
    used_by:
