  # -- LLM / agent CLIs ------------------------------------------------------
  - name: claude
    binary: claude
    version_cmd: [claude, --version]
    optional: true
    used_by:
      - tools/agents/adapters/claude_cli.py
      - tools/airgap/detector.py
      - tools/llm/cli_bridge_manager.py

  - name: ollama
    binary: ollama
    version_cmd: [ollama, --version]
    optional: true
    used_by:
