# CUI // SP-CTI — floci runtime base images, MEASURED (flx-airgap-02)
#
# WHAT THIS FILE IS
# -----------------
# floci's container-backed services (Lambda, RDS, ElastiCache, OpenSearch, MSK,
# ECS/EC2/EKS) do not ship their runtime inside the floci image. Each one starts
# a SEPARATE container from a base image floci pulls FROM THE PUBLIC INTERNET
# THE FIRST TIME THAT SERVICE IS USED. On a disconnected high side that pull
# fails at exactly the moment a demo runs.
#
# This file is the enumeration of that image set, so it can be pre-populated
# into the local daemon's cache before the host is disconnected.
#
# HOW EVERY ENTRY HERE WAS OBTAINED, AND IT WAS NOT READ OFF A README
# -------------------------------------------------------------------
# `docker events --filter type=image` was recorded while a live floci 2.0.1
# (`docker compose --profile floci up -d floci`) was driven through every
# container-backed service with boto3 against http://127.0.0.1:4566. Each `ref`
# below is a line the DAEMON logged as a `pull`; each `digest` is the
# `RepoDigests[0]` of the resulting cached image. Measured 2026-09-05 on Docker
# 28.5.1 / Windows 11, floci 2.0.1 (edition `community`, original_edition
# `floci-always-free`).
#
# Re-derive the whole table with:
#     python -m tools.cloud.runtime_images --measure-help
#
# THE IMAGE SET IS A FUNCTION OF DECLARED CONFIGURATION, NOT OF THE SERVICE
# -------------------------------------------------------------------------
# This is the finding that makes a bare per-service list wrong. MEASURED:
#   * a `python3.12` Lambda pulls public.ecr.aws/lambda/python:3.12, while a
#     `nodejs20.x` Lambda pulls public.ecr.aws/lambda/nodejs:20;
#   * an RDS instance with `Engine=postgres` pulls postgres:16.3-alpine, while
#     `Engine=mysql` pulls mysql:8.0.36;
#   * ElastiCache splits by API AND by engine — Redis goes through
#     CreateReplicationGroup and pulls valkey/valkey:8, memcached goes through
#     CreateCacheCluster and pulls memcached:1.6. floci REFUSES
#     `Engine=redis` on CreateCacheCluster ("For Redis/Valkey use
#     CreateReplicationGroup"), so these are genuinely two different paths.
# So `variant` is load-bearing. A deployment vendors the variants it declares —
# vendoring "all of them" is a 5 GB answer to a 400 MB question, and vendoring
# one and assuming it covers the service is how the demo fails.
#
# WHAT IS DELIBERATELY NOT IN THIS TABLE
# ---------------------------------------
# `alpine:3.19` was pulled during the same measured run and is ABSENT here on
# purpose: it was the image named by the probe's own ECS *task definition*. That
# is the WORKLOAD image, chosen by whoever writes the task definition, not a
# floci runtime base — floci would have pulled whatever that field said. A
# deployment running ECS/EKS must mirror its own workload images TOO, and no
# table in this repository can enumerate them for it. Stated in the runbook.
#
# ADDING AN ENTRY MEANS MEASURING IT. Do not add a plausible-looking row: a
# digest nobody observed is exactly the fabrication `vendor/images/README.md`
# was written against, and it would be believed.

enabled: true

emulator: floci
emulator_image: floci/floci:2.0.1
measured_on: "2026-09-05"
measured_against:
  docker_server_version: "28.5.1"
  host_platform: "Windows 11 / Docker Desktop"
  floci_version: "2.0.1"
  floci_edition: "community"
  method: "docker events --filter type=image, recorded while boto3 exercised each service"

# A pulled-at-run-time image is a run-time PULL, and a run-time pull cannot
# happen on the disconnected side. Every entry is therefore something an
# air-gapped deployment must hold in its local cache BEFORE it is disconnected.
images:
  - ref: "public.ecr.aws/lambda/python:3.12"
    digest: "sha256:5207fd64cca3808107491740d81875d86876eafb15b0cbfb15586c750dfc218d"
    service: lambda
    variant: "python3.12"
    mutable_tag: true
    note: >-
      MOVED 2026-09-18 (artifact-fresh-591100ea58): every Lambda runtime this
      repository's own IaC generators declare (tools/infra/dr_generator.py,
      tools/aadc/iac_generator.py, tools/data/iac_generator.py,
      tools/infra_canvas/iac_generator.py, tools/ohc/iac_generator.py,
      args/dr_config.yaml) is `python3.12`, not `python3.11` -- the prior pin
      was vendoring a runtime nothing here declares. RE-MEASURED against a live
      floci 2.0.1: a `create_function(Runtime="python3.12")` + `invoke` logged
      `ImageCacheService  Image already present locally, skipping pull:
      public.ecr.aws/lambda/python:3.12`, and the container reported Python
      3.12.14. Like `amazonlinux:2023`, the tag carries an ordering AND is
      rebuilt in place: the registry served a DIFFERENT digest than the
      locally-cached one for the same tag, so the digest above is a fresh
      `docker pull` + `docker image inspect`, not the cached copy. Flagged
      `mutable_tag` for the same reason. One image PER LAMBDA RUNTIME; vendor
      the runtimes the deployment declares. See
      docs/audits/artifact-fresh-591100ea58-lambda-python-pin.md.

  - ref: "public.ecr.aws/lambda/nodejs:20"
    digest: "sha256:a4440274d6f0fb4e6cb92cd5f2a97254efe6612f631d9974b197ecbd4a61fcab"
    service: lambda
    variant: "nodejs20.x"
    note: "Measured alongside python3.11 (since re-measured as python3.12, artifact-fresh-591100ea58) to prove the per-runtime split is real."

  - ref: "postgres:16.3-alpine"
    digest: "sha256:36ed71227ae36305d26382657c0b96cbaf298427b3f1eaeb10d77a6dea3eec41"
    service: rds
    variant: "postgres"
    note: >-
      The tag is floci's DEFAULT EngineVersion, not a version this tree chose.
      Re-measured 2026-09-12 (artifact-fresh-5b1750f240): a default
      CreateDBInstance(Engine=postgres) returns EngineVersion 16.3 and floci
      logs `ImageCacheService  Image already present locally, skipping pull:
      postgres:16.3-alpine`, while EngineVersion=16.99 makes it log `Pulling
      image: postgres:16.99-alpine` -- so the ref is
      `postgres:<EngineVersion>-alpine`. EngineVersion is therefore declared
      configuration in the sense this file's header means, one level finer than
      `variant`: a deployment declaring EngineVersion=18.6 must vendor
      postgres:18.6-alpine TOO, and vendoring it INSTEAD of this one breaks the
      default path. The same holds for mysql -- see the entry below, which has
      now been measured rather than inferred from this one.

  - ref: "mysql:8.0.36"
    digest: "sha256:a532724022429812ec797c285c1b540a644c15e248579c6bfdf12a8fbaab4964"
    service: rds
    variant: "mysql"
    note: >-
      Also floci's DEFAULT EngineVersion, MEASURED IN ITS OWN RIGHT on
      2026-09-12 (artifact-fresh-da63da118f) rather than assumed from the
      postgres row: a default CreateDBInstance(Engine=mysql) returns
      EngineVersion 8.0.36, floci logs `ImageCacheService  Image already
      present locally, skipping pull: mysql:8.0.36`, and the container it
      starts runs mysql:8.0.36 at the digest above. EngineVersion=8.0.99 makes
      it log `Pulling image: mysql:8.0.99` and 404 -- so the ref is
      `mysql:<EngineVersion>` with NO SUFFIX. The `-alpine` on the postgres row
      is per-engine, not a house style, and assuming it here would vendor a tag
      that does not exist. `Engine=mariadb` builds
      `mariadb:<EngineVersion>` (EngineVersion=99.99 measured the same way) --
      a DIFFERENT repository that this row does not cover; its default tag has
      not been measured, because doing so pulls an image, and no deployment
      here declares it.

  - ref: "valkey/valkey:8"
    digest: "sha256:640c5e62cea04b6d6f2084232651d0cc70362d31f4f805e7be94dbed6855e8f2"
    service: elasticache
    variant: "redis"
    note: >-
      Redis is served by VALKEY, via CreateReplicationGroup — not
      CreateCacheCluster. The tag is a CONSTANT floci holds, and unlike the RDS
      entries above there is no EngineVersion knob behind it: floci 2.0.1's
      native binary contains exactly ONE valkey image string, `valkey/valkey:8`,
      and four CreateReplicationGroup calls — default, EngineVersion=7.1,
      EngineVersion=99.99, and Engine=valkey/EngineVersion=9 — ALL started
      `valkey/valkey:8` (MEASURED 2026-09-12, artifact-fresh-ee3339893b).
      DescribeCacheEngineVersions answers UnsupportedOperation, so floci has to
      be driven. Upstream publishes valkey 9; floci cannot be made to request
      it, so this pin does NOT follow it. The DIGEST was re-measured the same
      day — the tag had moved off sha256:98c6217c..., with the container
      reporting Valkey 8.1.10 on BOTH digests, i.e. a base-image rebuild rather
      than an engine upgrade. RE-MEASURED 2026-09-23 (artifact-fresh-6ba5fc339e)
      by `docker pull` + `docker image inspect` of the live tag: it rebuilt again,
      off sha256:3fbd2e3e... to the digest above, Valkey 8.1.10 on both and the
      Debian base 13.6 -> 13.7; floci 2.0.1's binary still holds only
      `valkey/valkey:8`. Records:
      docs/audits/artifact-fresh-ee3339893b-elasticache-valkey-pin.md,
      docs/audits/artifact-fresh-6ba5fc339e-elasticache-valkey-pin.md.

  - ref: "memcached:1.6"
    digest: "sha256:75c93cc91e76853da7c029e74d6e8dbd44774dd3713c93be8cd1971ad26120a4"
    service: elasticache
    variant: "memcached"

  - ref: "opensearchproject/opensearch:2.19.5"
    digest: "sha256:4ee82ecb35d837a6186c81aaa64c8a5bce71aa956edbd87f1f684ab56af52c44"
    service: opensearch
    variant: null
    note: >-
      Largest of the set. Creating a domain took 115s on the measured host.
      The ref is floci's DEFAULT EngineVersion (`OpenSearch_2.19`), taken from a
      CLOSED table floci will enumerate via `list_versions()`; the table tops
      out at `OpenSearch_3.6` -> `opensearch:3.6.0` and `OpenSearch_3.8` is
      refused with a ValidationException (measured 2026-09-12,
      artifact-fresh-a7486018c7). A deployment declaring another supported
      version must vendor that tag too -- the `variant` rule below, one level
      finer, exactly as RDS states for EngineVersion.

  - ref: "redpandadata/redpanda:latest"
    digest: "sha256:9e83cfa99278f30d0133271c26bf670cd69c94ffa6ba0b42830dd0c3bd9dcfd9"
    service: kafka
    variant: null
    mutable_tag: true
    note: >-
      MSK is served by REDPANDA, and floci names it by the MUTABLE tag `:latest`.
      The digest recorded here is what `:latest` resolved to on the measured
      date; it can move under the same tag without notice, so a re-vendor must
      re-measure rather than assume. Re-measured 2026-09-18 (rpk v26.2.2 ->
      v26.2.3, a patch rebuild under the same tag); see
      docs/audits/artifact-fresh-5e94142e90-kafka-redpanda-pin.md.

  - ref: "public.ecr.aws/amazonlinux/amazonlinux:2023"
    digest: "sha256:06da5a3362eda00c5114227ac81abe56dd9b943395553b7c64a310457f4d9e2b"
    service: ec2
    variant: null
    mutable_tag: true
    note: >-
      The tag is floci's OWN default, and `2023` is a ROLLING tag. RE-MEASURED
      2026-09-12 (artifact-fresh-b5394142b3), which corrected both halves of the
      one-line note this row used to carry.
      (1) NOT "whatever ImageId is given": floci ships an AMI catalogue --
      DescribeImages serves 10 entries -- and each imageId names its own
      dockerImage (ami-ubuntu2204 -> ubuntu:22.04, ami-debian12 -> debian:12,
      ami-alpine -> alpine:latest, ami-amazonlinux2 -> amazonlinux:2). What is
      universal is the FALLBACK: an ImageId floci does not know is answered
      `AmiImageResolver  Unknown AMI ID ...; falling back to default image
      public.ecr.aws/amazonlinux/amazonlinux:2023`, and a default
      RunInstances(ami-0abcdef1234567891) logged `ImageCacheService  Image
      already present locally, skipping pull:
      public.ecr.aws/amazonlinux/amazonlinux:2023`. So THIS row covers the
      default and unknown-AMI paths; a deployment that declares another AMI in
      that catalogue must vendor that AMI's image too -- the declared
      configuration rule in the header, one level finer, exactly as for RDS
      EngineVersion.
      (2) The DIGEST MOVES UNDER THIS TAG. Upstream rebuilds the major-version
      tag: it served AL 2023.12.20260831 (sha256:fb70bd54...) when this table was
      first measured, AL 2023.12.20260909 on 2026-09-12, and AL 2023.12.20260914
      (the digest above) RE-MEASURED 2026-09-15 (artifact-fresh-f1edf3d78e) by
      `docker pull` + `docker image inspect` of the live tag, and AL
      2023.12.20260918 re-measured 2026-09-19 (artifact-fresh-66057392f8) the
      same way. Flagged
      `mutable_tag` for the same reason redpanda and k3s are -- a re-vendor must
      re-measure rather than assume -- even though, unlike those two, the tag
      does carry an ordering.

  - ref: "rancher/k3s:latest"
    digest: "sha256:5e0707cfd1239b358ef73f3254bc3eadc027dd30cd5ec6ca41e29e47652a1b8c"
    service: eks
    variant: null
    mutable_tag: true
    note: "EKS is served by k3s, also by a MUTABLE `:latest` tag. Same caveat as redpanda."

  - ref: "registry:2"
    digest: "sha256:a3d8aaa63ed8681a604f1dea0aa03f100d5895b6a58ace528858a7b332415373"
    service: ecr
    variant: null
    note: >-
      floci backs ECR with a real registry container (`floci-ecr-registry`). It
      was pulled during the ECS/EKS probes, not by an explicit ECR call, so it
      is attributed to `ecr` and required whenever ECS or EKS is used — see
      `implies` below.
      RE-MEASURED 2026-09-13 (artifact-fresh-54fe12d6ad) against a live floci
      2.0.1, this time by an EXPLICIT ECR call: `CreateRepository` logged
      `ImageCacheService  Image already present locally, skipping pull:
      registry:2`, then `EcrRegistryManager  Started ECR backing registry
      floci-ecr-registry on host port 5100`, and the container reported
      `service=registry version=2.8.3`. So the row is reachable through the ECR
      API in its own right, not only as a side effect of ECS/EKS.
      `registry:2` is floci's DEFAULT, and this is a THIRD shape of default,
      distinct from both siblings above. It is not an AWS API field like RDS
      EngineVersion — no boto3 call reaches it — and it is not a hard constant
      like `valkey/valkey:8` either: floci exposes the FULL REF as its own
      deployment property `floci.services.ecr.registry-image`
      (`FLOCI_SERVICES_ECR_REGISTRY_IMAGE`), and the value is used verbatim.
      MEASURED both ways: with the property set to `registry:99.99` floci logged
      `Pulling image: registry:99.99` and failed the call with a registry 404,
      and with it set to `registry:3` floci pulled and ran distribution 3.1.1
      successfully. So `registry:3` WORKS here — unlike opensearch 3.8, which
      floci refuses, and valkey 9, which it cannot be made to request. It is
      still not this row: nothing in this repository sets that property, so the
      default path pulls `registry:2`, and vendoring 3 INSTEAD of this line
      would leave the path every deployment here actually takes unvendored. A
      deployment that DOES set the property must vendor the tag it names, the
      same declared-configuration rule this file's header states for Lambda
      runtimes and RDS EngineVersion. See
      docs/audits/artifact-fresh-54fe12d6ad-ecr-registry-pin.md.

# ECS pulled NO runtime base of its own during the measured run: the only image
# it fetched was the one its task definition named. So `ecs` requires nothing
# from `images` directly, and requires `ecr` because the registry container came
# up alongside it. Declaring that here rather than hard-coding it in Python
# keeps "which services need what" reviewable.
implies:
  ecs: [ecr]
  eks: [ecr]

# How a service NAME is recognised in a design graph or an IaC plan. Matched
# against harvested strings, case-insensitively, on a word boundary.
service_tokens:
  lambda: ["lambda", "aws_lambda_function", "aws::lambda::function"]
  rds: ["rds", "aws_db_instance", "aws_rds_cluster", "aws::rds::dbinstance"]
  elasticache:
    ["elasticache", "aws_elasticache_cluster", "aws_elasticache_replication_group",
     "aws::elasticache::cachecluster"]
  opensearch:
    ["opensearch", "elasticsearch", "aws_opensearch_domain",
     "aws_elasticsearch_domain", "aws::opensearchservice::domain"]
  kafka: ["msk", "kafka", "aws_msk_cluster", "aws_msk_serverless_cluster",
          "aws::msk::cluster"]
  ecs: ["ecs", "aws_ecs_cluster", "aws_ecs_service", "aws_ecs_task_definition",
        "aws::ecs::cluster"]
  ec2: ["ec2", "aws_instance", "aws::ec2::instance"]
  eks: ["eks", "aws_eks_cluster", "aws::eks::cluster"]
  ecr: ["ecr", "aws_ecr_repository", "aws::ecr::repository"]

# How a VARIANT is recognised, per service. A service detected with no variant
# token is reported `variant_undetermined` — never silently resolved to a
# default, and never silently dropped. We cannot say which base image an
# unspecified Lambda runtime needs, and guessing produces either a fabricated
# blocker or a fabricated clean bill.
variant_tokens:
  lambda:
    python3.12: ["python3.12", "python3-12"]
    nodejs20.x: ["nodejs20.x", "nodejs20", "nodejs20x"]
  rds:
    postgres: ["postgres", "postgresql", "aurora-postgresql"]
    mysql: ["mysql", "aurora-mysql", "mariadb"]
  elasticache:
    redis: ["redis", "valkey"]
    memcached: ["memcached"]
