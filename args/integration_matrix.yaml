# CUI // SP-CTI
# Integration Matrix — Subsystem Dependency Graph (Phase 66, D-WF-8f)
#
# Declares which subsystems connect to which and through what mechanism.
# The impact analyzer walks this graph when changes are detected to flag
# potentially missing integrations.
#
# Each subsystem lists:
#   tables: DB tables it owns
#   connects_to: subsystems it should integrate with
#   integration_type: how the connection works
#   trigger: what kind of change triggers impact analysis

subsystems:
  workflow:
    tables:
      - workflow_loops
      - workflow_acceptance_criteria
      - workflow_reconciliations
      - workflow_handoffs
    connects_to:
      - chat          # workflow status advisory extension
      - intake        # intake→loop bridge
      - dashboard     # workflow status on project pages
    integration_type: extension_hook
    trigger: table_or_tool_change

  chat:
    tables:
      - chat_contexts
      - chat_messages
      - chat_tasks
    connects_to:
      - workflow      # handoff chat_context_id link
      - intake        # RICOAS routing
      - governance    # advisory injection
    integration_type: extension_hook
    trigger: table_or_tool_change

  intake:
    tables:
      - intake_sessions
      - intake_requirements
      - intake_conversation
      - readiness_scores
    connects_to:
      - workflow      # intake→loop bridge
      - decomposition # BDD generation
      - chat          # RICOAS sidebar
      - governance    # AI governance readiness dimension
    integration_type: bridge_function
    trigger: table_or_tool_change

  decomposition:
    tables:
      - safe_decomposition
    connects_to:
      - workflow      # BDD criteria → workflow AC
      - intake        # readiness testability score
    integration_type: bridge_function
    trigger: table_or_tool_change

  compliance:
    tables:
      - compliance_artifacts
      - nist_controls
      - fedramp_assessments
      - cmmc_assessments
    connects_to:
      - dashboard     # compliance pages
      - workflow      # process verification
      - chat          # governance advisory
    integration_type: db_query
    trigger: table_or_tool_change

  security:
    tables:
      - security_findings
      - prompt_injection_log
      - ai_telemetry
    connects_to:
      - dashboard     # security pages
      - workflow      # process verification
      - chat          # advisory injection
    integration_type: db_query
    trigger: table_or_tool_change

  governance:
    tables:
      - ai_oversight_plans
      - ai_caio_registry
      - ai_ethics_reviews
      - ai_use_case_inventory
    connects_to:
      - chat          # governance advisory extension
      - intake        # AI governance readiness dimension
      - dashboard     # transparency/accountability pages
    integration_type: extension_hook
    trigger: table_or_tool_change

  genesis:
    tables:
      - genesis_audit
      - genesis_knowledge_packets
    connects_to:
      - dashboard     # genesis dashboard
      - knowledge     # promoter bridge
    integration_type: bridge_function
    trigger: table_or_tool_change

  evolution:
    tables:
      - genome_versions
      - child_capabilities
      - staging_environments
      - propagation_log
    connects_to:
      - dashboard     # children page
      - knowledge     # absorption engine
    integration_type: db_query
    trigger: table_or_tool_change

  knowledge:
    tables:
      - knowledge_base
      - self_heal_patterns
    connects_to:
      - workflow      # process verification
      - genesis       # promoter
    integration_type: db_query
    trigger: table_or_tool_change

  innovation:
    tables:
      - innovation_signals
      - innovation_triage_log
    connects_to:
      - dashboard     # innovation pages
      - genesis       # ingest reflex
      - creative      # cross-registration
    integration_type: bridge_function
    trigger: table_or_tool_change

  rag:
    tables:
      - rag_chunks
      - rag_ingestion_log
      - rag_retrieval_log
    connects_to:
      - chat          # context injection
      - finetune      # pair generation
    integration_type: db_query
    trigger: table_or_tool_change

  finetune:
    tables:
      - ft_datasets
      - ft_dataset_examples
      - ft_training_jobs
      - ft_model_versions
    connects_to:
      - rag           # pair generation from chunks
      - dashboard     # finetune pages
    integration_type: db_query
    trigger: table_or_tool_change

  bayesian_teaching:
    tables:
      - bayesian_teaching_scores
    connects_to:
      - finetune      # pair ranking
      - compliance    # control ordering
      - rag           # reranker boost
    integration_type: function_call
    trigger: table_or_tool_change
