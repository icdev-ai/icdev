# [CUI // SP-CTI]
# ICDEV Network Canvas — Diagram Profile Configuration
# Controls canvas appearance, device styles, tooltips, rack infrastructure,
# naming conventions, site grouping, and enrichment workflow.
# Edit this file to customize diagram generation for all future topologies.

version: '1.0'
updated: '2026-04-09T03:33:37.898279+00:00'
canvas:
  background: '#ffffff'
  grid:
    type: dot
    color: rgba(0,0,0,0.08)
    size: 10
  print_friendly: true
node_display:
  label_position: top
  label_color: '#1a1a2e'
  label_font: Segoe UI, system-ui, sans-serif
  label_size: 9
  label_weight: 700
  ip_position: bottom
  ip_color: '#1565c0'
  ip_font: Cascadia Code, Consolas, monospace
  ip_size: 8
  site_label: hidden
  note: Site label hidden because site grouping boxes already show it
device_styles:
