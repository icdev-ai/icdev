    fill: '#0f2b3a'
    stroke: '#3498db'
    symbol: R
    stencil: cisco-router
  switch:
    fill: '#0f2b0f'
    stroke: '#27ae60'
    symbol: SW
    stencil: cisco-switch-l2
  firewall:
    fill: '#2b0f0f'
    stroke: '#e94560'
    symbol: FW
    stencil: cisco-firewall
  server:
    fill: '#0f2b2b'
    stroke: '#1abc9c'
    symbol: SV
    stencil: cisco-server
  load_balancer:
    fill: '#1a1a0f'
    stroke: '#f39c12'
    symbol: LB
    stencil: cisco-load-balancer
  vpn_gateway:
    fill: '#0f2b2b'
    stroke: '#00bcd4'
    symbol: VPN
    stencil: cisco-router
  wan_link:
    fill: '#0f0f2b'
    stroke: '#7f8c8d'
    symbol: WAN
    stencil: cisco-cloud
  access_point:
    fill: '#1a0f2b'
    stroke: '#9b59b6'
    symbol: AP
    stencil: cisco-wap
  cloud_service:
    fill: '#0f0f2b'
    stroke: '#29b6f6'
