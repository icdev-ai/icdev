# CUI // SP-CTI
# OHC Workflow — Operations/Health Canvas
# Full 12-step pipeline: ops scan → runbook check → IaC → ops gate → validate → apply → verify

description: "OHC: operations health scan, runbook coverage check, IaC generation, ops gate, Terraform/Ansible validate, migration report, apply approval, Terraform apply, AWS verification, post-deploy validation"
category: deploy
canvas: ohc

steps:
  # ── Canvas-specific steps (OHC only) ─────────────────────────────────────
  - id: step_1
    name: Ops Scan
    tool: tools/ohc/ops_scanner.py
    node_type: tool
    required: true
    timeout: 300
    depends_on: []
    description: Assess operational health — uptime, MTTR, change failure rate, incident trends.

  - id: step_2
    name: Runbook Check
    tool: tools/ohc/runbook_checker.py
    node_type: tool
    required: true
    timeout: 300
    depends_on: [step_1]
    description: Validate runbook coverage for all critical failure modes and operational procedures.

  - id: step_3
    name: Generate IaC
    tool: tools/ohc/iac_generator.py
    node_type: tool
    required: true
    timeout: 600
    depends_on: [step_2]
    description: >
      Generate Terraform (.tf), Ansible playbook (.yml), inventory (.ini),
      validation script (.py), and checklist (.md) for operational infrastructure.
      Output: data/studio_artifacts/ohc/ — consumed by all downstream steps.

  - id: step_4
    name: Ops Approval
    node_type: human
    required: true
    role: approver
    timeout: 86400
    tool: ""
    depends_on: [step_3]
    description: >
      Operations lead reviews health findings and IaC before provisioning begins.
      Telegram: /approve <step_run_id> or /reject <step_run_id> [reason].

  # ── Shared executor steps (canvas-agnostic) ───────────────────────────────
  - id: step_5
    name: Terraform Plan
    tool: tools/studio/executors/terraform_plan.py
    node_type: tool
    required: true
    timeout: 300
    depends_on: [step_4]

  - id: step_6
    name: Ansible Execute
    tool: tools/studio/executors/ansible_executor.py
    node_type: tool
    required: true
    timeout: 300
    depends_on: [step_4]

  - id: step_7
    name: Validation Run
    tool: tools/studio/executors/validation_runner.py
    node_type: tool
    required: true
    timeout: 120
    depends_on: [step_4]

  - id: step_8
    name: Migration Report
    tool: tools/studio/executors/migration_reporter.py
    node_type: tool
    required: true
    timeout: 60
    depends_on: [step_5, step_6, step_7]

  - id: step_9
    name: Apply Approval
    node_type: human
    required: true
    role: infrastructure_approver
    timeout: 86400
    tool: ""
    depends_on: [step_5, step_6, step_7]
    description: >
      Human gate before applying operational infrastructure to AWS.
      Telegram: /approve <step_run_id> or /reject <step_run_id> [reason].

  - id: step_10
    name: Terraform Apply
    tool: tools/studio/executors/terraform_apply.py
    node_type: tool
    required: true
    timeout: 900
    depends_on: [step_9]

  - id: step_11
    name: AWS Config Execute
    tool: tools/studio/executors/aws_config_executor.py
    node_type: tool
    required: false
    timeout: 600
    depends_on: [step_10]

  - id: step_12
    name: Post-deploy Validation
    tool: tools/studio/executors/validation_runner.py
    node_type: tool
    required: false
    timeout: 300
    depends_on: [step_10]
