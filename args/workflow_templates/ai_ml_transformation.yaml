# CUI // SP-CTI
# AI/ML Transformation Workflow — 5-phase defense contractor AI enablement
description: "5-phase defense contractor AI/ML transformation: assessment & sponsorship, foundation, workforce development, contract integration, scale & measure"
category: transformation

narrative_context:
  audience: leadership
  org_name: Company A
  program_name: AI Enablement Program
  timeframe_months: 18
  parameters:
    workforce_size: 120
    developers_targeted: 45
    avg_annual_salary_usd: 130000
    contract_value_usd: 12000000
    ai_productivity_gain_pct: 30
    training_cost_per_person_usd: 8500
    lab_standup_cost_usd: 250000
    free_resources_budget_usd: 0
    paid_courses_per_person_usd: 1200
    ilt_cost_per_person_usd: 3500

steps:
  # ── Phase 1: Assessment & Sponsorship ──────────────────────────────────────

  - id: skill_inventory
    name: "Skill Inventory"
    node_type: tool
    phase: 1
    description: "Catalog current AI/ML skills across the 120-person workforce; tag the 45 targeted developers, PMs, and leadership by role and current proficiency level"

  - id: gap_analysis
    name: "Gap Analysis"
    node_type: tool
    phase: 1
    depends_on: [skill_inventory]
    description: "Identify skill gaps against the AI-ready competency model; output a gap matrix by role and proficiency tier"

  - id: roi_model
    name: "ROI Model"
    node_type: tool
    phase: 1
    depends_on: [skill_inventory]
    description: "Project ROI: 30% productivity gain applied to $12M contract at $130K avg salary across 45 developers over 18 months; includes training cost payback timeline"

  # coa_development composite — expanded into three parallel COA steps
  - id: coa_a
    name: "COA-A: Organic Growth"
    node_type: tool
    phase: 1
    depends_on: [gap_analysis, roi_model]
    description: "Course of action A — organic workforce development using internal upskilling only; full timeline, cost estimate, and risk profile"

  - id: coa_b
    name: "COA-B: Hybrid Approach"
    node_type: tool
    phase: 1
    depends_on: [gap_analysis, roi_model]
    description: "Course of action B — blended internal upskilling plus external training and lab standup; balanced speed-vs-cost tradeoff analysis"

  - id: coa_c
    name: "COA-C: Sprint Acquisition"
    node_type: tool
    phase: 1
    depends_on: [gap_analysis, roi_model]
    description: "Course of action C — accelerated sprint leveraging external ILT, hackathons, and 10% dedicated AI exploration time; fastest time-to-capability, highest near-term cost"

  - id: leadership_brief
    name: "Leadership Brief"
    node_type: human
    phase: 1
    role: program_director
    depends_on: [coa_a, coa_b, coa_c]
    description: "Program director presents all three COAs to leadership with a recommended path; captures stakeholder feedback and records the selected COA decision"

  - id: funding_approval
    name: "Funding Approval"
    node_type: approval
    phase: 1
    role: executive_sponsor
    quorum: all
    depends_on: [leadership_brief]
    description: "Executive sponsor approves program funding and the selected COA; unanimous approval required before any Phase 2 activity begins"

  # ── Phase 2: Foundation (parallel tracks after funding_approval) ────────────

  # lab_standup composite — expanded: infra_provision + toolchain_select → sandbox_env
  - id: infra_provision
    name: "Infrastructure Provision"
    node_type: tool
    phase: 2
    depends_on: [funding_approval]
    description: "Provision AI/ML lab infrastructure: GPU compute instances, cloud tenancy, developer VDI environments, and network access controls per ATO boundary"

  - id: toolchain_select
    name: "Toolchain Selection"
    node_type: human
    phase: 2
    role: chief_architect
    depends_on: [funding_approval]
    description: "Chief architect selects the AI/ML toolchain: IDE AI integrations, model-serving platform, MLOps stack, and approved open-source library list"

  - id: sandbox_env
    name: "Sandbox Environment"
    node_type: tool
    phase: 2
    depends_on: [infra_provision, toolchain_select]
    description: "Stand up the sandboxed AI experimentation environment on provisioned infra with approved toolchain; validate access for all 45 developers with a smoke-test suite"

  - id: curriculum_design
    name: "Curriculum Design"
    node_type: human
    phase: 2
    role: learning_development_lead
    depends_on: [gap_analysis, funding_approval]
    description: "L&D lead designs the blended curriculum: awareness modules, online free/paid tracks, ILT schedule, and OJT integration milestones mapped to the gap matrix"

  # ── Phase 3: Workforce Development (depends on sandbox_env + curriculum_design) ──

  # workforce_dev composite — expanded into parallel tracks plus ojt_integration
  - id: track_awareness
    name: "Awareness Track"
    node_type: tool
    phase: 3
    depends_on: [sandbox_env, curriculum_design]
    description: "4-hour AI/ML awareness modules for executives and PMs; covers use-case identification, responsible AI principles, and program goals; 100% attendance target"

  - id: track_online_free
    name: "Online Free Track"
    node_type: tool
    phase: 3
    depends_on: [sandbox_env, curriculum_design]
    description: "Self-paced free resources: AWS SkillBuilder free tier, DeepLearning.ai free audit, fast.ai Practical Deep Learning, Hugging Face NLP Course, Google ML Crash Course"

  - id: track_online_paid
    name: "Online Paid Track"
    node_type: tool
    phase: 3
    depends_on: [sandbox_env, curriculum_design]
    description: "Paid online learning at $1,200/person: Coursera Deep Learning Specialization, AWS SkillBuilder ML Specialty path, Udemy LangChain for Developers, Pluralsight enterprise AI/ML paths"

  - id: track_instructor_led
    name: "Instructor-Led Training Track"
    node_type: human
    phase: 3
    role: learning_development_lead
    depends_on: [sandbox_env, curriculum_design]
    description: "ILT delivery at $3,500/person: AWS SageMaker 3-day ILT, Azure AI Engineer bootcamp, Internal ICDEV AI Enablement bootcamp (5-day), Anthropic prompt engineering (1-day)"

  - id: track_ojt_tinkering
    name: "OJT Tinkering Track"
    node_type: human
    phase: 3
    role: technical_lead
    human_required: true
    depends_on: [sandbox_env, curriculum_design]
    description: "Supervised tinkering supervised by technical lead: sprinkle AI into existing product features, 2-day internal hackathon, structured pair programming, 10% dedicated AI exploration time per developer per sprint"

  - id: ojt_integration
    name: "OJT Integration"
    node_type: human
    phase: 3
    role: technical_lead
    depends_on: [track_online_free, track_instructor_led]
    description: "Technical lead bridges online learnings with hands-on OJT: applied project assignments, AI-assisted code review sessions, and knowledge transfer for course graduates entering sandbox work"

  - id: competency_assessment
    name: "Competency Assessment"
    node_type: tool
    phase: 3
    depends_on: [track_awareness, track_online_free, track_online_paid, track_instructor_led, track_ojt_tinkering, ojt_integration]
    description: "Automated competency scoring across all training tracks; generate readiness report per developer; flag gaps for remediation before Phase 4 contract integration gate"

  # ── Phase 4: Contract Integration (depends on competency_assessment) ─────────

  - id: ai_feature_id
    name: "AI Feature Identification"
    node_type: tool
    phase: 4
    depends_on: [competency_assessment]
    description: "Scan active contract deliverables for AI/ML insertion points; rank candidates by business value, technical feasibility, and ATO boundary impact"

  # mvp_sprints composite — expanded into three parallel MVP sprint steps
  - id: mvp_reporting_ai
    name: "MVP: AI-Enhanced Reporting"
    node_type: tool
    phase: 4
    depends_on: [ai_feature_id]
    description: "Sprint to deliver AI-enhanced reporting on contract: auto-summarization of operational data, anomaly detection alerts, and executive dashboard generation"

  - id: mvp_intelligent_search
    name: "MVP: Intelligent Search"
    node_type: tool
    phase: 4
    depends_on: [ai_feature_id]
    description: "Sprint to deliver semantic/RAG-powered search across the contract knowledge base: vector indexing, relevance ranking, and cited-answer retrieval"

  - id: mvp_agentic_automation
    name: "MVP: Agentic Automation"
    node_type: tool
    phase: 4
    depends_on: [ai_feature_id]
    description: "Sprint to deliver agentic workflow automation on contract: multi-step task orchestration, tool-use integrations, and human-in-the-loop escalation routing"

  - id: contract_mod_approval
    name: "Contract Modification Approval"
    node_type: approval
    phase: 4
    role: contracting_officer
    quorum: all
    depends_on: [mvp_reporting_ai, mvp_intelligent_search, mvp_agentic_automation]
    description: "Contracting officer approves contract modification incorporating AI-enhanced deliverables; unanimous approval gates production deployment of all three MVPs"

  # ── Phase 5: Scale & Measure (depends on contract_mod_approval) ──────────────

  - id: roi_measurement
    name: "ROI Measurement"
    node_type: tool
    phase: 5
    depends_on: [contract_mod_approval]
    description: "Measure realized productivity gains vs. 30% target; compute training ROI, velocity delta, and defect-rate reduction across the 45-developer cohort over the 18-month program"

  - id: scale_plan
    name: "Scale Plan"
    node_type: human
    phase: 5
    role: program_director
    depends_on: [roi_measurement]
    description: "Program director produces the scaling roadmap: expand AI enablement to the remaining 75-person workforce, identify next AI investment priorities, and update the program business case"

  - id: ao_brief
    name: "AO Brief"
    node_type: approval
    phase: 5
    role: authorizing_official
    quorum: any_one
    depends_on: [scale_plan]
    description: "Authorizing official receives the AI program brief; any single AO approval authorizes continued scaled AI operations under the existing ATO boundary"
