# CUI // SP-CTI
# BDC Workflow — Boundary Design Canvas
#
# NOTE (bdr-sec-5): The former 12-step pipeline invoked the orphaned
# tools/bdc/ package (boundary_scanner.py / isa_checker.py / iac_generator.py),
# which read the canvas boundary_designs table through the wrong DB connection
# and silently fell back to fabricated data. That package was RETIRED.
# The Boundary Design Canvas engine (tools/boundary_canvas/boundary_engine.py)
# is a library with no CLI entry point, and there is no live BDC IaC generator,
# so the scan/IaC/downstream-executor chain was removed rather than repointed to
# stub commands. This template now references only real, invocable commands.

description: "BDC: Interconnection Security Agreement (ISA) expiry check with ISSO approval gate"
category: deploy
canvas: bdc

steps:
  - id: step_1
    name: ISA Expiry Check
    tool: tools/boundary_canvas/isa_expiry.py
    node_type: tool
    required: true
    timeout: 300
    depends_on: []
    description: >
      Check Interconnection Security Agreement expiry windows for the boundary
      canvas, publish canvas events for ISAs nearing expiry, and notify owners.

  - id: step_2
    name: Security Approval
    node_type: human
    required: true
    role: approver
    timeout: 86400
    tool: ""
    depends_on: [step_1]
    description: >
      ISSO reviews ISA expiry findings before any remediation is scheduled.
      Telegram: /approve <step_run_id> or /reject <step_run_id> [reason].
