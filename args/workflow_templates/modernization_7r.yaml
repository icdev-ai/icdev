# CUI // SP-CTI
# Application Modernization Workflow — Analyze → Extract → Assess → Plan → Migrate
description: "7Rs modernization: legacy analysis, architecture extraction, strategy assessment, migration"
category: modernization
steps:
  - id: analyze
    name: "Legacy Analysis"
    tool: "tools/modernization/legacy_analyzer.py"
    description: "Static analysis of legacy application"

  - id: extract
    name: "Architecture Extraction"
    tool: "tools/modernization/architecture_extractor.py"
    depends_on: [analyze]
    description: "Reverse-engineer architecture and call graph"

  - id: assess
    name: "7R Strategy Assessment"
    tool: "tools/modernization/seven_r_assessor.py"
    depends_on: [extract]
    description: "Score all 7 Rs with weighted decision matrix"

  - id: decompose
    name: "Monolith Decomposition"
    tool: "tools/modernization/monolith_decomposer.py"
    depends_on: [extract]
    required: false
    description: "Detect bounded contexts and service boundaries"

  - id: db_plan
    name: "DB Migration Plan"
    tool: "tools/modernization/db_migration_planner.py"
    depends_on: [analyze]
    required: false
    description: "Generate DDL scripts and data migration SQL"

  - id: compliance
    name: "Compliance Bridge"
    tool: "tools/modernization/compliance_bridge.py"
    depends_on: [assess]
    description: "ATO-aware control inheritance and gap analysis"

  - id: code_gen
    name: "Migration Code Generate"
    tool: "tools/modernization/migration_code_generator.py"
    depends_on: [assess, decompose]
    required: false
    description: "Generate adapters, facades, service scaffolds"

  - id: migration_report
    name: "Migration Readiness Report"
    tool: "tools/modernization/migration_report_generator.py"
    depends_on: [compliance, code_gen, db_plan]
    description: "Consolidated readiness report across all migration tracks"
