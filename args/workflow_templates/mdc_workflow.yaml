# CUI // SP-CTI
# MDC Workflow — Migration Design Canvas
# Full 12-step pipeline: inventory scan → readiness check → IaC → migration gate → validate → apply → verify

description: "MDC: asset inventory scan, migration readiness check, IaC generation, migration gate, Terraform/Ansible validate, migration report, apply approval, Terraform apply, AWS verification, post-deploy validation"
category: deploy
canvas: mdc

steps:
  # ── Canvas-specific steps (MDC only) ─────────────────────────────────────
  - id: step_1
    name: Inventory Scan
    tool: tools/mdc/inventory_scanner.py
    node_type: tool
    required: true
    timeout: 300
    depends_on: []
    description: Discover and catalog all assets targeted for migration (compute, data, apps).

  - id: step_2
    name: Readiness Check
    tool: tools/mdc/readiness_checker.py
    node_type: tool
    required: true
    timeout: 300
    depends_on: [step_1]
    description: Assess migration readiness — dependency mapping, risk scoring, 7Rs classification.

  - id: step_3
    name: Generate IaC
    tool: tools/mdc/iac_generator.py
    node_type: tool
    required: true
    timeout: 600
    depends_on: [step_2]
    description: >
      Generate Terraform (.tf), Ansible playbook (.yml), inventory (.ini),
      validation script (.py), and checklist (.md) for target cloud infrastructure.
      Output: data/studio_artifacts/mdc/ — consumed by all downstream steps.

  - id: step_4
    name: Migration Approval
    node_type: human
    required: true
    role: approver
    timeout: 86400
    tool: ""
    depends_on: [step_3]
    description: >
      Migration lead reviews readiness report and IaC before provisioning begins.
      Telegram: /approve <step_run_id> or /reject <step_run_id> [reason].

  # ── Shared executor steps (canvas-agnostic) ───────────────────────────────
  - id: step_5
    name: Terraform Plan
    tool: tools/studio/executors/terraform_plan.py
    node_type: tool
    required: true
    timeout: 300
    depends_on: [step_4]

  - id: step_6
    name: Ansible Execute
    tool: tools/studio/executors/ansible_executor.py
    node_type: tool
    required: true
    timeout: 300
    depends_on: [step_4]

  - id: step_7
    name: Validation Run
    tool: tools/studio/executors/validation_runner.py
    node_type: tool
    required: true
    timeout: 120
    depends_on: [step_4]

  - id: step_8
    name: Migration Report
    tool: tools/studio/executors/migration_reporter.py
    node_type: tool
    required: true
    timeout: 60
    depends_on: [step_5, step_6, step_7]

  - id: step_9
    name: Apply Approval
    node_type: human
    required: true
    role: infrastructure_approver
    timeout: 86400
    tool: ""
    depends_on: [step_5, step_6, step_7]
    description: >
      Human gate before applying migration infrastructure to AWS.
      Telegram: /approve <step_run_id> or /reject <step_run_id> [reason].

  - id: step_10
    name: Terraform Apply
    tool: tools/studio/executors/terraform_apply.py
    node_type: tool
    required: true
    timeout: 900
    depends_on: [step_9]

  - id: step_11
    name: AWS Config Execute
    tool: tools/studio/executors/aws_config_executor.py
    node_type: tool
    required: false
    timeout: 600
    depends_on: [step_10]

  - id: step_12
    name: Post-deploy Validation
    tool: tools/studio/executors/validation_runner.py
    node_type: tool
    required: false
    timeout: 300
    depends_on: [step_10]
