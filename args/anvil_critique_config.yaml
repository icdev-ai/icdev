# CUI // SP-CTI
# ANVIL Critique Phase Configuration (Phase 61 — Feature 3)
#
# Adversarial plan critique between Assemble and Stress-test.
# Multiple domain agents independently review the plan, then
# the architect revises.  Creates adversarial review pressure
# to catch issues before stress-testing.

anvil_critique:
  enabled: true
  max_rounds: 3

  # The one question no author asks themselves (D396/D397, trust-disc-06).
  #
  # Every check in this codebase is written by the same process that writes the
  # code, in the same session, in the environment where the author's mental model
  # holds.  Nothing asks the inverse question — which is exactly what a second,
  # differently-motivated reader supplies for free, and the critics ARE that
  # reader.  A check that cannot fail carries zero bits however thorough it reads.
  #
  # Appended to EVERY critic prompt by anvil_critique.py::_dispatch_critics.
  # Removing the key does not remove the question: the module falls back to
  # ADVERSARIAL_QUESTION.  Edit the wording here; do not delete the key expecting
  # the behaviour to stop.
  adversarial_question: >-
    Under what condition does this check PASS while the system is BROKEN?

  critics:
    - agent: security-agent
      role: security_reviewer
      focus:
        - security_vulnerability
        - data_handling_issue
        - deployment_risk
      prompt_context: |
        You are reviewing an implementation plan as a security expert.
        Focus on: attack surface, input validation, authentication/authorization,
        encryption, secrets handling, OWASP Top 10, and STIG compliance.

    - agent: compliance-agent
      role: compliance_reviewer
      focus:
        - compliance_gap
        - data_handling_issue
      prompt_context: |
        You are reviewing an implementation plan as a compliance expert.
        Focus on: NIST 800-53 control coverage, FedRAMP requirements,
        CUI marking requirements, audit trail completeness, and ATO impact.

    - agent: knowledge-agent
      role: patterns_reviewer
      focus:
        - architecture_flaw
        - performance_risk
        - maintainability_concern
        - testing_gap
      prompt_context: |
        You are reviewing an implementation plan as a patterns/quality expert.
        Focus on: design patterns, code maintainability, test coverage,
        performance bottlenecks, and lessons from past failures.

  consensus_rules:
    go:
      max_critical: 0
      max_high: 0
    conditional:
      max_critical: 0
      # any number of high allowed — must be addressed in revision
    nogo:
      # any critical finding triggers nogo

  revision_prompt: |
    The following findings were identified during adversarial critique.
    Revise the plan to address ALL critical and high findings.
    For each finding, explain how the revision addresses it.

    Findings:
    {findings}

    Original plan:
    {original_plan}
