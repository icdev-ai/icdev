# CUI // SP-CTI
# Domain Leak Gate (xit-leak-01)
#
# THE POLICY THIS ENCODES
# -----------------------
# This repository is PUBLIC. The ICDEV[domain] split moves the trading domain
# (FathomDesk: tools/trading, tools/market_intel, the trading/fathomdesk/options
# args, 137 live ad_* tables) to a PRIVATE sibling repository
# (docs/programmes/icdev-domain-split.md). Two things must never land here
# afterwards: the code coming back (a stale branch rebased after the removal, a
# `git checkout <old-ref> -- tools/trading`, a dump of an ad_* table) and a
# broker credential of any shape.
#
# TWO HALVES, ARMED AT DIFFERENT TIMES
#   patterns.mode: enforce  -- from day one. SURVEYED 2026-08-21 over every
#                              tracked file: 0 hits for every rule, so arming
#                              refuses nothing that exists. The rules live in
#                              tools/security/secret_detector.py (category
#                              broker_credential), one table for every scanner.
#   paths.mode: report      -- until the removal lands. The denied paths are
#                              legitimately present today; `enforce` would fail
#                              every commit. The flip is ONE line, in the
#                              removal PR (xit-rm-*), where it is reviewable.
#
# Gate:  python tools/ci/domain_leak_gate.py --check            (CI security job)
#        python tools/ci/domain_leak_gate.py --staged --check   (pre-commit)
# Stand down: ICDEV_DOMAIN_LEAK_GUARD=0 -- never a shell neutraliser.

domain_leak_gate:
  paths:
    mode: enforce           # ARMED by xit-rm-02: the denied trees are gone from this domain
    deny:
      - tools/trading/**
      - tools/market_intel/**
      - tools/fathomdesk/**
      - icdev/tools/trading/**
      - icdev/tools/market_intel/**
      - icdev/tools/fathomdesk/**
      - apps/fathomdesk/**
      - args/trading*.yaml
      - args/fathomdesk*.yaml
      - args/options_*.yaml
      - args/llm_config_trading.yaml

  # A DATA file (.sql/.dump/.csv/.tsv/.txt) carrying an ad_* table dump.
  # Source files mentioning `INSERT INTO ad_` are the domain's own writers and
  # are covered by the path rule, not this one.
  sql_markers:
    - "COPY ad_"
    - "INSERT INTO ad_"

  patterns:
    mode: enforce           # report | enforce
    # WHICH RULE CATEGORIES THIS GATE ENFORCES, from the ONE pattern table in
    # tools/security/secret_detector.py. Omitting the key keeps the historical
    # broker-only set, so an older copy of this file behaves identically.
    #
    # `personal_financial` arrives with ICDEV[RT] (icdev-ai/icdev_rt), the
    # retirement + insurance parent. Its database IS personal financial
    # records -- balances, tax records, account numbers -- and THIS repository
    # is public. RT lives in its own private repo, so the realistic leak is not
    # its code arriving here; it is an export, a statement or an aggregation
    # token pasted into a doc, a plan or a test fixture.
    #
    # SURVEYED BEFORE ARMING, 2026-08-30, over BOTH parents: ICDEV[IT] 20,788
    # tracked files and ICDEV[FT] 901. ZERO hits for all four rules in either.
    # FT was surveyed because the generic scanner compiles the whole table
    # regardless of category, so a rule added for RT fires in FT's CI too.
    categories:
      - broker_credential
      - personal_financial

  # DATA-FILE-ONLY rules (.sql/.dump/.csv/.tsv/.txt), the same scoping
  # `sql_markers` above uses and for the same reason.
  #
  # A bare SSN shape measures 45 hits across this tree -- 40 in .py, 5 in .md --
  # and every one is a fixture or documentation example of the REDACTION
  # SUBSYSTEM ITSELF using the canonical 123-45-6789. Arming it against source
  # would refuse the tests that prove redaction works, which is how a check
  # earns itself a bypass. In a DATA file the same shape is 0 hits, and a data
  # file is what a real leak actually looks like: an export, not source.
  data_patterns:
    - name: SSN shape in a data file
      pattern: '\b\d{3}-\d{2}-\d{4}\b'
      severity: critical

  # PATH-SCOPED rules -- pursuit-sensitive bid content in GovCon source.
  #
  # THE INCIDENT. tools/govcon/rfi_workbench.py carried a hardcoded
  # `_SECTION_PROMPTS` dict holding one live solicitation's full ROM cost
  # breakdown, an IR&D cost-share figure and its statutory authority, teaming
  # options, TRL positioning, commerciality split and risk register -- 11KB of
  # capture strategy, in a PUBLIC repository, from 2026-06-30. A competitor
  # reading it learns our price, our cost-share play and our teaming approach.
  #
  # WHY SCOPED BY PATH, and not added to secret_detector.py. The generic scanner
  # compiles that whole table regardless of category, and measured across this
  # tree the unscoped rules hit 11 TEST FIXTURES carrying synthetic figures
  # ($1.2M / $1.5M / $2M / $2.1M in test_dic_publish_gate.py and
  # test_rfi_grounding.py) -- fixtures of the publish and redaction gates that
  # exist to handle exactly this kind of content. Refusing those is refusing
  # routine work. The discriminator is not the pattern, it is the LOCATION: a
  # fake ROM in a test is correct; a ROM figure in a prompt TEMPLATE or a
  # response GENERATOR is the defect.
  #
  # SURVEYED BEFORE ARMING, 2026-09-01, over the 214 tracked files in scope:
  # 0 hits for all three rules after the fix, and 6 on the pre-fix tree (5 in
  # rfi_workbench.py, 1 in rfi_response_generator.py). The rule discriminates
  # the leak from the repair, which is what makes it armable.
  #
  # Real pursuit figures load from a PRIVATE overlay outside this repository:
  #   ICDEV_GOVCON_PROMPTS_PATH   (see tools/govcon/section_prompts.py)
  scoped_patterns:
    - name: ROM or cost-share figure in GovCon source
      pattern: '(?i)\b(?:ROM|cost[ _-]?share)\b[^\n]{0,80}\$\s?[\d.,]+\s?[KMB]\b'
      severity: critical
      paths: &govcon_source
        - tools/govcon/*
        - icdev/tools/govcon/*
        - args/govcon/*
        - args/govcon*.yaml
        - hardprompts/*
    - name: Labor basis of estimate in GovCon source
      pattern: '(?i)\blabor\b[^\n]{0,40}\$\s?[\d.,]+\s?[KMB]\b'
      severity: critical
      paths: *govcon_source
    # IR&D proposals under docs/irad/ carried REAL labor / non-labor / total
    # cost lines ($380K + 2.5 FTE, $290K + 2 FTE; found 2026-09-01, scrubbed
    # 2026-09-03). Our own cost data, a different sensitivity class from bid
    # strategy, in the same public tree. The market-sizing table in the same
    # documents ($50-200M/yr cost avoidance) is public-domain estimation and
    # is NOT matched: the rule keys on the three cost-line labels, not on a
    # dollar sign. Surveyed: 6 hits pre-scrub, 0 post-scrub, 0 elsewhere.
    - name: Cost line in an IR&D proposal document
      pattern: '(?i)\*\*(?:labor|non-labor|total cost):\*\*[^\n]{0,20}\$\s?[\d.,]+\s?[KMB]\b'
      severity: critical
      paths:
        - docs/irad/*
        - icdev/data/docs/irad/*
    - name: Annual O&M or licensing rate in GovCon source
      pattern: '(?i)\bannual\s+(?:O&M|licensing|maintenance)\b[^\n]{0,40}\$\s?[\d.,]+\s?[KMB]\b'
      severity: critical
      paths: *govcon_source

  # An ALLOW entry asserts a match is CORRECT here and needs a written reason.
  allow:
    - path: tests/ci/test_domain_leak_gate.py
      reason: >-
        the gate's own tests plant deliberately fake credential shapes -- broker
        keys AND, since the personal_financial category, a SimpleFIN URL, an
        account number, a routing number and a Boldin token -- as the negative
        control that proves each rule actually fires. A rule with no planted
        control cannot be told apart from one that matches nothing.
    - path: tools/security/secret_detector.py
      reason: >-
        the pattern table names the shapes it detects.
    - path: icdev/tools/security/secret_detector.py
      reason: >-
        packaged mirror of the pattern table.
