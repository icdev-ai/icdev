# CUI // SP-CTI
# Monitor-only. See args/agent_rules/README.md before changing `enforce`.
id: secrets.env_file_read
version: "1"
title: Agent read a secrets file (.env, private key, cloud credential)
severity: high
tags:
  - T1552.001
  - credential-access
enabled: true
enforce: false
deny_message: >-
  Reading credential material is blocked. Load secrets through the configured
  provider rather than opening the file.
expr:
  event_type:
    - file.read
  file_path_glob:
    - "**/.env"
    - "**/.env.*"
    - "**/*.pem"
    - "**/*.key"
    - "**/*.p12"
    - "**/*.pfx"
    - "**/*.jks"
    - "**/id_rsa"
    - "**/id_ed25519"
    - "**/credentials.json"
    - "**/service-account*.json"
  # .env.sample and .env.example are checked-in templates with no live values.
  # The zero_access tier in args/file_access_tiers.yaml carves them out the same
  # way; a rule that flags them trains reviewers to ignore this rule.
  not_file_path_glob:
    - "**/.env.sample"
    - "**/.env.example"
    - "**/.env.template"
