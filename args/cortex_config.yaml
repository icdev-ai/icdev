# CUI // SP-CTI
# ICDEV Cortex facade configuration.
#
# search: settings for the Cortex search strategy router
# (tools/cortex/search_service.py::search). Change behavior here, not in code.
search:
  router:
    # Minimum taxonomy confidence required to route a fact_single query to the
    # rag backend alone; below this the query is treated as ambiguous and
    # fans out to search.fan_out.backends.
    factual_confidence: 0.75

  # Per-backend fan-out timeouts in seconds. A backend that exceeds its
  # timeout is abandoned and the router returns partial results from the
  # backends that finished. "default" applies to any backend without an
  # explicit entry.
  timeouts:
    default: 10.0
    rag: 10.0
    graph: 8.0
    dic: 10.0
    kb: 5.0

  fan_out:
    # Backends queried in parallel when a query is ambiguous (2-3 recommended).
    backends: [rag, graph, dic]
    max_workers: 4

  # Cross-backend result fusion (ctx-search-03), applied whenever more than
  # one backend contributes results (tools/cortex/search_service.py::fuse_results).
  fusion:
    rrf_k: 60            # RRF denominator constant (RRF paper default)
    rerank_enabled: true # final rerank pass over the fused top-N
    rerank_top_n: 10     # fused results forwarded to tools/rag/reranker.py
    rerank: {}           # passthrough config for rerank_results (e.g. rerank_weight)

  # Domain scoping hook (ctx-canvas-04): when ctx.domain matches a key here,
  # the router intersects its backend selection with "backends" and records
  # "collections" as the advisory collection scope in result metadata.
  # Adapters do not yet consume the collection scope; ctx-canvas-04 wires it.
  domains:
    security:
      backends: [rag, graph, kb]
      collections: [security]
