# CUI // SP-CTI
# -----------------------------------------------------------------------
# ICDEV Cortex behavior configuration
# -----------------------------------------------------------------------
# Consumed via tools/cortex/config.py::load_cortex_config() (defaults +
# deep-merge + $ICDEV_CORTEX_CONFIG override) and by the search strategy
# router (tools/cortex/search_service.py::search). Change behavior here,
# not in code.
#
# Resolution order (tools/cortex/config.py::resolve_cortex_config_path):
#   1. $ICDEV_CORTEX_CONFIG — explicit override
#   2. cortex_config.yaml next to the resolved args/llm_config.yaml
#      (single-source rule from PR #139: resolve_llm_config_path())
#
# icdev/args/cortex_config.yaml is a generated mirror of this file —
# edit here and copy across, same as args/llm_config.yaml.

search:
  router:
    # Minimum taxonomy confidence required to route a fact_single query to the
    # rag backend alone; below this the query is treated as ambiguous and
    # fans out to search.fan_out.backends.
    factual_confidence: 0.75

  # Per-backend fusion weights for the unified search fan-out. Keys are the
  # normalized CORTEX_BACKENDS names (tools/cortex/schemas.py). Read by
  # config.resolve_strategy_weights() and applied in
  # search_service._rrf_fuse: an item scores sum(weight / (rrf_k + rank))
  # over the backends that returned it, so raising kb above rag genuinely
  # re-orders the fused list. A backend with no entry here weighs 1.0
  # (neutral); a negative or non-numeric entry is clamped to 0.0, which
  # demotes that backend rather than inverting the ordering.
  #
  # sme is 0.0 ON PURPOSE and is not a tuning knob. It is the advisory backend
  # (ADVISORY_BACKENDS in tools/cortex/schemas.py): it returns an ACE persona's
  # OPINION, authored by an LLM at query time, not a row that existed before the
  # query. Weight 0.0 means its RRF contribution is 0.0, so it always sorts
  # BELOW every evidentiary hit and can never carry a fused ranking. Raising it
  # would let an opinion outrank evidence, which base_pack TRUST rule 1 forbids.
  strategy_weights:
    rag: 1.0
    graph: 0.8
    dic: 0.9
    kb: 0.6
    sme: 0.0

  # Reciprocal Rank Fusion constant: fused = weight / (rrf_k + rank).
  rrf_k: 60

  # CRAG corrective-retrieval trigger: when the best normalized score across
  # backends falls below this, the search layer rewrites the query
  # (routing function cortex_search_rewrite) and retries.
  crag_threshold: 0.55

  # Per-backend fan-out timeouts in seconds. A backend that exceeds its
  # timeout is abandoned and the router returns partial results from the
  # backends that finished. "default" applies to any backend without an
  # explicit entry.
  # sme is far larger than the rest because it can pay for TWO LLM calls on a
  # cold domain — minting the persona, then asking it — where a retrieval
  # backend does one DB/vector round trip.
  timeouts:
    default: 10.0
    rag: 10.0
    graph: 8.0
    dic: 10.0
    kb: 5.0
    sme: 60.0

  fan_out:
    # Backends queried in parallel when a query is ambiguous (2-3 recommended).
    #
    # sme is absent and must stay absent: fan-out is the AUTOMATIC path, and an
    # advisory backend is reached only when a caller names it. Adding it here
    # would put an LLM opinion into the result set of every ambiguous query.
    backends: [rag, graph, dic]
    max_workers: 4

  # Domain lenses (ctx-canvas-04). When ctx.domain matches a key here the
  # Cortex layer applies that lens as a configuration profile over the
  # existing machinery — NO new machinery. Each lens is fully data-driven, so
  # a new lens (compliance, program-management, …) is a YAML addition here:
  #   backends    — the strategy router intersects its selection with these.
  #   sources     — row-level scope: hits whose source table/id start with one
  #                 of these prefixes are kept; the rest are dropped and the
  #                 count recorded in metadata.router.domain_scope.filtered_out.
  #   collections — advisory collection scope, echoed in result metadata.
  #   persona     — SOC-analyst-style LLM system prompt injected on summaries.
  #   intents     — labels a future intent router biases toward for this lens.
  #   triage      — whether the lens has an XSIAM-style triage formatter.
  # Code-side fallbacks live in tools/cortex/domains/<name>.py (used when this
  # block is stripped / air-gapped); YAML wins field-by-field.
  domains:
    security:
      display_name: "Security Intelligence"
      backends: [rag, graph, kb]
      collections: [pvm_predictions, dsoc_threats, incident_reports, cve_triage]
      sources: [pvm_, dsoc_, incident_, cve, threat, vuln, security]
      intents: [threat_hunt, vuln_triage, incident_response, blast_radius]
      triage: true
      persona: >
        You are a senior Security Operations Center (SOC) analyst driving an
        XSIAM-style security-intelligence console. Lead with severity: rank
        findings critical -> high -> medium -> low and state the
        highest-severity item first. Be terse and operational — no filler, no
        hedging. Cite the source table/id every finding came from. Structure
        any summary as: (1) Top risks (severity-ranked), (2) Blast radius /
        affected assets, (3) Recommended actions. Never speculate beyond the
        retrieved evidence; if the data does not support a conclusion, say so
        explicitly.

    # ── `sources:` is EMPTY on purpose for document / proposal / network /
    # compliance (ctx-reach-03) ────────────────────────────────────────────────
    # Row-level source scoping (search_service._route_and_run ->
    # domains.filter_by_sources) DROPS every hit whose source table/id does not
    # start with one of these prefixes. `security` populates it because its four
    # backing table families are known exactly (pvm_/dsoc_/incident_/cve...).
    # For the other four lenses the corpora are federated (RAG collections, KG
    # nodes, DIC documents, KB entries) and their source ids are not a closed
    # prefix set, so a guessed list would silently delete legitimate evidence —
    # a retrieval lens that quietly returns less is strictly worse than one that
    # does not row-scope at all. `filter_by_sources` is a documented no-op on an
    # empty list, so these lenses deliver via backends + collections + persona +
    # intents and scope at the BACKEND level instead. This is a deliberate
    # standing decision, not a TODO: populate a lens's `sources` only once its
    # table prefixes are enumerated from the live schema, and confirm the
    # `filtered_out` count in the search metadata stays 0 for known-good queries.

    # Document-intelligence lens (DIC chat / docgen / tech-writer).
    document:
      display_name: "Documents"
      backends: [rag, dic, graph]
      collections: [dic_documents, dic_collections]
      sources: []
      intents: [summarize, extract_requirements, compliance_check, cite_sources]
      triage: true
      persona: >
        You are a senior records and compliance analyst working over a
        controlled document repository. Ground every statement in the retrieved
        documents and cite the source document/section for each claim — never
        assert anything the documents do not support. Flag unresolved
        placeholders, missing required sections, and classification/marking
        gaps. Prefer precise, quotable language over paraphrase. Structure any
        summary as: (1) What the documents say, (2) Gaps / unresolved items,
        (3) Required actions.

    # Proposal / capture lens (RFI workbench, proposal drafting).
    proposal:
      display_name: "Proposal / Capture"
      backends: [rag, graph, kb]
      collections: [opportunities, requirements, past_performance]
      sources: []
      intents: [win_theme, requirement_coverage, compliance_gap, ghost_strategy]
      triage: true
      persona: >
        You are an experienced government-contracting capture manager. Frame
        everything around winning: tie every response to the solicitation's
        requirements, surface win themes and discriminators, and map claims to
        evidence from past performance. Call out compliance-matrix gaps
        (unaddressed requirements) explicitly. Be concrete and customer-focused
        — no boilerplate. Structure any summary as: (1) Requirement coverage,
        (2) Win themes / discriminators, (3) Gaps and ghosting opportunities.
        Never invent past performance or capabilities not present in the
        retrieved evidence.

    # Network / infrastructure lens (Network + Migration canvases).
    network:
      display_name: "Network / Infra"
      backends: [rag, graph, kb]
      collections: [nc_topologies, nc_hardware_profiles]
      sources: []
      intents: [blast_radius, migration_risk, config_drift, topology_map]
      triage: false
      persona: >
        You are a senior network architect reasoning over topology and
        hardware-profile data. Lead with impact: identify blast radius and the
        affected nodes/segments first. Be precise about interfaces, addressing,
        and dependencies, and cite the topology/hardware source for each
        finding. Flag migration risks, single points of failure, and
        configuration drift. Structure any summary as: (1) Impact / blast
        radius, (2) Risks (migration, availability, drift), (3) Recommended
        actions. Never speculate beyond the retrieved topology.

    # Compliance lens (ctx-reach-03). The lens was DECLARED in
    # tools/cortex/constants.py::CORTEX_DOMAIN_LENSES from the start — the
    # canvas offered "📋 Compliance — NIST 800-53, FedRAMP, CMMC, STIG controls
    # and crosswalks" in the picker — but there was no `search.domains.compliance`
    # block, so load_domain_profile("compliance") returned None and selecting it
    # changed NOTHING: no backend narrowing, no persona, no intents. It only
    # tagged ctx.domain in the audit row. That is the platform's signature
    # declared-but-unconsumed defect, and the picker entry made it worse than
    # inert — it advertised scoping that did not happen. This block is the
    # consumer. triage:false — no bespoke formatter (only `security` has one),
    # and summarize() returns None safely for a triage lens without one.
    compliance:
      display_name: "Compliance"
      backends: [rag, graph, kb]
      collections: [nist_controls, control_mappings, crosswalk_entries, stig_findings]
      sources: []
      intents: [control_lookup, crosswalk, gap_analysis, evidence_trace]
      triage: false
      persona: >
        You are a senior compliance analyst working across NIST SP 800-53,
        FedRAMP, CMMC, and DISA STIG. Answer in control terms: name the control
        identifier (e.g. AC-2, SC-13, V-xxxxx) for every claim and cite the
        catalog, baseline, or crosswalk row it came from. Distinguish what is
        IMPLEMENTED from what is merely DOCUMENTED — a control with a policy
        reference and no evidence is a gap, and you must say so. Never assert a
        control is satisfied, never map one framework onto another, and never
        state an impact level or baseline that the retrieved evidence does not
        support. Structure any summary as: (1) Controls in scope, (2) Evidence
        found per control, (3) Gaps and required actions.

governance:
  # Platform-wide fail-closed default for Cortex calls that DON'T set an explicit
  # CortexContext.fail_closed (i.e. ctx.fail_closed is None). Resolved by
  # config.resolve_fail_closed(); an explicit True/False from a caller always
  # wins over this. When effective-True: a gate ERROR (redaction/provenance
  # unavailable) or a grounding "fail" on a RETRIEVAL answer blocks instead of
  # degrading. Injection always blocks regardless. A plain generative complete()
  # (retrieval=False) is NEVER blocked merely for being ungrounded — it skips the
  # grounding gates entirely (see skip_grounding_for_plain_complete below).
  #
  # Shipped as false to preserve the platform's actual behavior to date: this key
  # was previously DEAD (never read), so the runtime has always been fail-open.
  # Flip to true to enforce platform-wide fail-closed — a deliberate policy
  # change with blast radius across every Cortex adopter, so enable knowingly.
  fail_closed: false

  # complete() is free-form drafting with no evidence set — skip the grounding
  # pass for plain (retrieval=False) completions instead of failing it closed.
  #
  # Set to FALSE and the two grounding gates run on plain completions too:
  #   citation_grounding  validates against an EMPTY allowed set, so any
  #                       [source: N] tag a plain completion emits is
  #                       fabricated by construction -> outcome "fail"
  #                       (and a block under fail_closed).
  #   content_grounding   there is nothing to ground against, so the gate is
  #                       the placeholder scan: unresolved [PLACEHOLDER]/TBD
  #                       tokens in drafting output -> outcome "warn".
  # Either way `grounded` stays False for a non-retrieval call — a completion
  # with no evidence set is never certified, only checked.
  skip_grounding_for_plain_complete: true

  # -- Governance profiles (hgx-gov-01) ---------------------------------------
  # A profile names the SUBSET of the gate chain a caller runs. Studio agent
  # nodes name one with `governance_profile:`; Cortex callers pass
  # GovernancePipeline(profile=...) or wrap(..., profile=...).
  #
  # Gate vocabulary (tools/cortex/governance.py::GATE_ORDER, in chain order):
  #   pre_check           injection / PII / rate / cost screen on the prompt
  #   input_redaction     PII masked out of the prompt before any provider
  #   operation           the wrapped call itself
  #   citation_grounding  [source: N] tags validated against injected sources
  #   content_grounding   semantic claim-vs-context grounding of the output
  #   kg_grounding        claims validated against GRAPH FACTS       (OPT-IN)
  #   output_redaction    PII/secrets masked out of the response  (MANDATORY)
  #   provenance          registry row + append-only cortex_audit row (MANDATORY)
  #
  # NON-NEGOTIABLE: every profile must list operation, output_redaction AND
  # provenance. output_redaction is the egress guarantee; provenance is the
  # NIST-AU audit row. A profile that dropped either would turn a latency
  # optimisation into a compliance hole, so omitting one raises
  # GovernanceProfileError when the profile is resolved — at load, loudly, once.
  #
  # OPT-IN (governance.OPT_IN_GATES): every gate above except kg_grounding is
  # opt-OUT — `default` runs it and a profile narrows. kg_grounding is the other
  # way round: it is in the vocabulary but NOT in `default`, so a profile must
  # name it to get it. It needs a live knowledge-graph connection and builds a
  # lexicon of that graph's node labels once per call, and — because kg_ontology
  # ships EMPTY — the schema it validates against is OBSERVED, which may warn but
  # can never refuse. Putting a DB round-trip on every Cortex caller's
  # interactive path for a check that cannot currently refuse is not a governance
  # improvement, so callers ask for it by name.
  #
  # `default` is NOT declared here: it is built into code as the full chain minus
  # the opt-in gates, and is what every caller that names no profile gets, so a
  # missing or unreadable config can never silently narrow governance.
  # Redefining it here is an error.
  profiles:
    # Internal diligence: a node reasoning over first-party data already inside
    # the tenant boundary, whose output feeds another node rather than a person.
    # Drops the injection screen (the input is not untrusted user text) and both
    # grounding gates (there is no evidence set to attest against). Egress
    # masking and the audit row still run.
    internal_diligence:
      gates: [input_redaction, operation, output_redaction, provenance]

    # Free-form generation from UNTRUSTED input: keeps the full input screen
    # (injection / rate / cost) and drops only the two grounding gates, which
    # have nothing to attest against when no evidence set is injected. This is
    # the profile for a node taking user text and drafting from it.
    screened_generation:
      gates: [pre_check, input_redaction, operation, output_redaction, provenance]

    # Trusted first-party ingestion (docgen reading a document already inside the
    # boundary). Mirrors what ctx.trusted_content already does per call, as a
    # named profile a workflow node can declare.
    trusted_ingest:
      gates: [operation, citation_grounding, content_grounding, output_redaction, provenance]

    # The only shipped profile that declares kg_grounding (trust-kg-03): the
    # full default chain PLUS graph attestation, for a caller emitting an
    # artifact whose factual claims are about entities the graph indexes
    # (compliance narratives, agent output about the platform itself — the
    # surfaces args/trust_gate.yaml gives kg_guard to). Everything else keeps
    # the default chain and is byte-for-byte unaffected by this card.
    kg_attested:
      gates: [pre_check, input_redaction, operation, citation_grounding,
              content_grounding, kg_grounding, output_redaction, provenance]

  # KG-grounding gate (gate 6) knobs — trust-kg-03. Consumed by
  # governance._kg_grounding_cfg; the gate itself is
  # tools/quality/kg_grounding.kg_ground_claims + kg_gate, the SAME pair
  # trust_gate.py's kg_guard runs, so the "which verdict is worth a finding"
  # policy has one home and cannot drift between the two callers.
  #
  # FAIL-OPEN, STATED EXPLICITLY (the card required this said out loud): this
  # gate lands behind the same `governance.fail_closed: false` above as every
  # other non-mandatory gate. A KG finding therefore WARNS and does not refuse
  # unless a caller sets CortexContext.fail_closed or that key is flipped. That
  # default is what let citation_type='cortex' raise for the provenance gate's
  # entire lifetime with 0 of 285 registry rows written and nothing go red, so
  # the one silence it must not reproduce is closed by construction instead: a
  # profile that DECLARES kg_grounding and then cannot measure — no graph
  # connection, or a graph with no nodes — records `fail` and logs at ERROR,
  # never `warn` and never `pass`. Declared-and-inert is the loudest outcome
  # this gate has, even though it still does not block.
  kg_grounding:
    # Scope validation to one graph. null = every graph in kg_nodes/kg_edges.
    graph_id: null
    # Opt into the `unknown_entity` finding — a proper noun in the output that
    # the graph does not know. OFF by default for the reason kg_gate documents:
    # the graph indexes a fraction of the world, so an unrecognised name is far
    # more often out-of-scope than fabricated, and a gate that flags every one
    # of them gets switched off wholesale.
    flag_unknown_entities: false

  # Content-grounding gate (gate 5) knobs. The gate runs semantic
  # claim-vs-context grounding (tools/quality/content_grounding.ground_content)
  # when a retrieval call injects snippet text, and falls back to the
  # placeholder scan otherwise.
  content_grounding:
    # Pass/warn floor for the grounding score. LEAVE NULL to inherit the SHARED
    # confidence band citation_grounding.CONF_ABSTAIN (0.4) — the single source
    # of truth that keeps the two TRUST gates from drifting apart. Set a float
    # in [0,1] only to override deliberately.
    min_score: null
    # Optional LLM-assisted grounding judge. OFF by default: the LLM-free
    # heuristic is the floor. When true, the gate routes an extra check through
    # the LLMRouter chain named by routing_function (a routing FUNCTION, never a
    # model id); any failure degrades back to the heuristic.
    llm_assisted: false
    routing_function: cortex_complete

analyst:
  # Whether ask(mode="auto") may DEGRADE from the IQE path into the LLM
  # NL->SQL path when IQE cannot resolve/translate/authorize the question.
  #
  # Set to false as a policy control — "no LLM-generated SQL runs against this
  # database by accident". The IQE error is then re-raised to the caller with
  # a `nlq_fallback_policy: skip` gate on the governance report, so the refusal
  # is auditable. Scope is exactly the fallback: an explicit ask(mode="nlq") is
  # a caller opting in by name and is NOT governed by this key.
  nlq_fallback_enabled: true

cache:
  # In-process LRU + TTL response cache over the governed facades.
  #
  # Security model: the cache key folds tenant_id + classification + domain +
  # air_gap, so a cached result can NEVER be served across any of those
  # boundaries; only the FINAL governed (post-redaction) result is stored, so a
  # hit never bypasses egress governance. Every hit still writes a cortex_audit
  # row (cache_hit=true, zero incremental cost) so the NIST-AU trail and
  # /cortex/metrics stay complete.
  #
  # Entries are copied in and out (deepcopy), so a caller mutating a served
  # result cannot rewrite the answer every later hit gets — see the ctx-perf-06
  # note in tools/cortex/cache.py.
  enabled: true
  # Read ONCE, when the cache singleton is built on first use. Changing it in a
  # running process does nothing until cache.reset() — i.e. restart the service.
  max_entries: 512
  # Which governed operations may be cached. complete = free-form drafting (best
  # hit rate at temperature 0). search = retrieval fan-out (corpus drifts -> keep
  # TTL short; the RAG ingestion path calls cache.invalidate() so an in-process
  # corpus change purges immediately rather than waiting out the TTL).
  #
  # cortex.ask is deliberately NOT in this list. It is live NL->SQL over the
  # operational DB, so its invalidation trigger is "any write to any table the
  # generated SQL touched" — authored by every subsystem, and mostly by OTHER
  # processes (kanban runner, reflex daemons, ingestion workers, an operator at
  # psql). An in-process cache cannot observe those, so hooking it would promise
  # a freshness guarantee it cannot keep; a partial invalidation hook is worse
  # than none. Its 30s ttl_seconds entry is kept below so an operator who adds it
  # back knowingly gets the short bound instead of inheriting default: 300.
  #
  # classify + extract are the most deterministic and highest-repeat operations:
  # both are pure functions of (text, labels|schema, function) with no DB or
  # corpus state behind them, and callers drive them in batch loops over the same
  # inputs (tools/bom/taxonomy.py::classify_lines re-issues an identical
  # extract(prompt, ASSIGN_SCHEMA, ctx) for every batch of a re-uploaded
  # workbook). Their non-boundary args are folded into the key by the facade
  # decorator — a different label list or a different JSON schema is a different
  # entry, never a shared one.
  operations: [cortex.complete, cortex.search, cortex.classify, cortex.extract]
  ttl_seconds:
    default: 300
    cortex.complete: 900
    cortex.search: 120
    # Not in `operations` — see the note above. Kept so re-adding it is bounded.
    cortex.ask: 30
    # classify DEGRADES rather than raising: when the router is unavailable it
    # returns a query_classifier heuristic label (provider="deterministic"), and
    # that result is not blocked, so it IS cacheable. The shorter TTL bounds how
    # long a transient outage can pin a degraded label.
    cortex.classify: 600
    # extract lets router errors propagate, so only genuine model output is ever
    # stored — same class as complete.
    cortex.extract: 900
