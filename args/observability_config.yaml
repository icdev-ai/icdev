# [TEMPLATE: CUI // SP-CTI]
# ICDEV™ Observability Configuration — Hook events, agent execution, SIEM forwarding

hooks:
  enabled: true
  event_signing: true
  hmac_secret_ref: "aws:secretsmanager:icdev/hook-hmac-key"
  siem_forwarding:
    enabled: false
    endpoint: ""  # Splunk/ELK HEC URL
    backlog_enabled: true
    backlog_max_events: 10000
  retention_days: 90
  truncate_output_chars: 2000

agent_executor:
  default_model: "sonnet"
  max_retries: 3
  retry_delays: [1, 3, 5]
  timeout_seconds: 300
  max_turns: 10
  output_dir: "agents/"
  safe_env_allowlist:
    - PATH
    - HOME
    - USER
    - LANG
    - TERM
    - ANTHROPIC_API_KEY
    - AWS_DEFAULT_REGION
    - AWS_REGION
    - ICDEV_DB_PATH
    - ICDEV_PROJECT_ROOT
    - CLAUDE_SESSION_ID

dashboard:
  sse_enabled: true
  sse_heartbeat_seconds: 15
  # Runtime: port from ICDEV_DASHBOARD_PORT env var (default: 5000)
  event_ingest_endpoint: "http://127.0.0.1:{ICDEV_DASHBOARD_PORT}/api/events/ingest"

# ---------------------------------------------------------------------------
# Trace / provenance / XAI retention (obx-trc-05)
# ---------------------------------------------------------------------------
# With tracing activated (PR #467) the high-volume trace tables accumulate
# without bound. list_traces (GROUP BY trace_id) and trace_stats degrade as
# otel_spans grows, and the provenance/SHAP tables grow with every agent run.
# The observability_retention Genesis reflex archives-then-prunes rows older
# than the window below so the hot tables stay small and fast.
#
# APPEND-ONLY DECISION: all five source tables are declared append-only in
# .claude/hooks/pre_tool_use.py APPEND_ONLY_TABLES. otel_spans is append-only
# BY DESIGN (D6); prov_entities/prov_activities/prov_relations and
# shap_attributions are NIST AU immutable evidence. Retention therefore never
# raw-DELETEs: expired rows are copied into a cold "<table>_archive" twin
# (created idempotently) BEFORE deletion from the hot table. No trace or
# provenance record is destroyed — only relocated out of the hot path.
trace_retention:
  # Days to keep OTel spans in the hot otel_spans table before archiving.
  spans_days: 30
  # Days to keep W3C PROV records (prov_entities, prov_activities, prov_relations).
  provenance_days: 180
  # Days to keep SHAP attributions (shap_attributions).
  shap_days: 90
  # Rows archived + pruned per iteration. Bounded so a huge backlog cannot wedge
  # the daemon in a single unbroken transaction.
  batch_size: 5000
  # Max iterations per table per run. Ceiling per table per run is
  # batch_size * max_iterations; leftover rows are handled on the next cadence.
  max_iterations: 20
