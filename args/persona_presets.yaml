# ─────────────────────────────────────────────────────────────────────────
# Voice presets — Reading-engine tone configurations.
# Read by tools/trading/analytics/reading_voice.py (Phase 1 build).
# ─────────────────────────────────────────────────────────────────────────

voice_presets:
  pm:
    description: "PM-style — current Reading tone. Concise, technical-but-narrative, assumes Sharpe/beta literacy."
    omit_metrics: []
    rephrase: {}                       # use observation text as-is
    add_glossary: false
    show_considerations: true
    profile_format: full

  rookie:
    description: "Plain-English. Strips ratio jargon, replaces with comparative phrasing. Adds glossary popovers."
    omit_metrics: [sharpe, sortino, calmar, alpha_annual_pct, beta, vol_annual_pct]
    rephrase:
      "Sharpe": "risk-adjusted return"
      "Sortino": "downside-adjusted return"
      "Alpha": "extra return vs the market"
      "Beta": "how much your book moves with the market"
      "drawdown": "biggest loss from a recent peak"
      "composite score": "signal strength"
      "outperformance": "doing better than SPY"
    add_glossary: true                 # tooltips appear automatically
    show_considerations: true
    profile_format: simplified         # short profile line

  technical:
    description: "Quant/expert. Raw numbers, minimal prose, omits PM-style narrative profile."
    omit_metrics: []
    rephrase: {}
    add_glossary: false
    show_considerations: false         # quants want signals not opinions
    profile_format: compact            # one-line "score=X dir=Y conf=Z" format

  standard:
    description: "Same as 'pm' currently. Reserved for future divergence (e.g., advisor-tone variant)."
    omit_metrics: []
    rephrase: {}
    add_glossary: false
    show_considerations: true
    profile_format: full
