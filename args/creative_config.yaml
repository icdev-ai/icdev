# =========================================================================
# Source Adapters
# =========================================================================
sources:
  review_sites:
    enabled: true
    scan_interval_hours: 24
    sites:
      - name: g2
        enabled: true
        base_url: https://www.g2.com
        max_reviews_per_competitor: 50
        sort: recent
      - name: capterra
        enabled: true
        base_url: https://www.capterra.com
        max_reviews_per_competitor: 50
        sort: recent
      - name: trustradius
        enabled: true
        base_url: https://www.trustradius.com
        max_reviews_per_competitor: 50
        sort: recent
    rate_limit:
      requests_per_hour: 30
      burst: 5
      delay_between_requests_seconds: 3

  community_forums:
    enabled: true
    scan_interval_hours: 12
    platforms:
      - name: reddit
        subreddits:
          - selfhosted
          - DataHoarder
          - syncthing
