# CUI // SP-CTI
# Standalone Agent Runtime (SAG) — declarative configuration  [hgx-cfg-01]
#
# Consumed by:
#   - tools/agent_runtime/config.py (loader — AgentRuntimeConfig)
#   - tools/agent_runtime/runtime.py (read at AgentRuntime construction)
#   - the per-subsystem modules listed against each block below
#
# PRECEDENCE — this file is a LAYER, not a replacement:
#
#     explicit call argument
#       >  environment variable
#       >  this file
#       >  args/permission_postures.yaml (the selected posture)
#       >  built-in default
#
# Every environment variable that worked before this file existed still works,
# and still wins. The value here is only consulted when the env var is unset (or
# unparseable). That ordering is deliberate: an operator who exports a flag in a
# shell, a systemd unit or a CI job must not have it silently overridden by a
# file they did not know to look at.
#
# Every key below names the env var that overrides it. There are no keys whose
# only effect is to exist: each one is read by the module named beside it. If you
# add a key here, wire it in that module too — an inert config key reads as a
# supported setting and is worse than no key at all.
#
# A handful of keys are POSTURE-GOVERNED and ship COMMENTED OUT below: the
# sandbox mode, the two approval modes and the mutation gate. They are named
# together by args/permission_postures.yaml so one selector moves the whole set.
# A value written here sits above the posture and pins that knob whichever
# posture is selected — which is why they are commented rather than removed.
#
# Inspect the resolved values (config, posture, and the env overrides actually
# in force):
#     python -m tools.agent_runtime.config --json
#
# Override the file location with ICDEV_AGENT_RUNTIME_CONFIG=/path/to/file.yaml.

version: 1

# Master switch for the standalone agent runtime.  env: ICDEV_SAG_ENABLED
# Mirrors the `sag` component in args/component_registry.yaml, so
# `icdev enable sag` / `icdev disable sag` flips the same flag. When false,
# `icdev chat` refuses to start rather than starting a crippled agent.
enabled: true

# ---------------------------------------------------------------------------
# Turn executor — tools/agent_runtime/runtime.py::AgentRuntime
# ---------------------------------------------------------------------------
# LLM-agnostic by construction: `llm_function` is a ROUTING FUNCTION resolved
# through LLMRouter against args/llm_config.yaml. There is deliberately no
# `model:` key here — a model id in configuration pins one vendor just as hard
# as a model id in Python.
runtime:
  llm_function: code_generation      # env: ICDEV_SAG_LLM_FUNCTION
  max_iterations: 12                 # env: ICDEV_SAG_MAX_ITERATIONS
  max_total_tokens: null             # env: ICDEV_SAG_MAX_TOTAL_TOKENS (null = uncapped)
  max_cost_usd: null                 # env: ICDEV_SAG_MAX_COST_USD  (null = uncapped)

# ---------------------------------------------------------------------------
# Per-subsystem toggles
# ---------------------------------------------------------------------------
subsystems:

  # tools/agent_runtime/project_context.py — CLAUDE.md / AGENTS.md / MEMORY.md
  # plus the session_context_builder project-state summary, injected at session
  # start and budgeted against the model's window.
  project_context:
    enabled: true                    # env: ICDEV_SAG_PROJECT_CONTEXT
    include_project_state: true      # env: ICDEV_SAG_PROJECT_STATE

  # tools/agent_runtime/goal_context.py — durable operator objectives (/goal).
  standing_goals:
    enabled: true                    # env: ICDEV_SAG_GOALS
    limit: 5                         # env: ICDEV_SAG_GOAL_LIMIT (clamped to 25)

  # tools/agent_runtime/profile_memory.py — durable facts/preferences plus the
  # top hybrid-memory hits for the first prompt of a session.
  profile_memory:
    enabled: true                    # env: ICDEV_SAG_PROFILE_MEMORY

  # tools/agent_runtime/skills_lifecycle.py — post-session NOVA skill proposal.
  # Default OFF: it queues a proposal on every session close.
  skill_proposals:
    enabled: false                   # env: ICDEV_SAG_SKILL_PROPOSALS

  # tools/agent_runtime/safety.py (mode/risk_function) and
  # tools/agent_runtime/approval_gate.py (command_mode) — the sag-safe-01
  # approval flow in front of every mutating tool call.
  #
  # `mode` and `command_mode` are POSTURE-GOVERNED (hcx-post-01): they come from
  # the posture named in args/permission_postures.yaml, so that one selector
  # moves them together with the sandbox and the mutation gate. A key written
  # here would sit ABOVE the posture and pin the knob regardless of which
  # posture is selected — which is a legitimate thing to want, and exactly why
  # they are left commented rather than deleted. Uncomment to pin.
  #
  # `command_mode` IS pinned, deliberately (rem-cap-04). Both built-in postures
  # would otherwise supply `enforce` (workspace-write) or `off`
  # (danger-full-access), and `enforce` is not survivable yet:
  #
  #   * The gate's policy is fail-closed, so an unenumerated tool halts. Of the
  #     tools the SAG toolsets actually register, 81% classify `unknown` —
  #     `args/agent_approval_policy.yaml` enumerates 62 tools and misses these,
  #     with the `compliance` (13), `security` (9), `canvas` (7), `govcon` (5)
  #     and `kanban` (5) bundles entirely unenumerated.
  #   * The default approver is `console_approver`, which denies on EOF. That is
  #     correct fail-closed behaviour and fatal in an unattended run.
  #
  #   `enforce` today would therefore refuse roughly four tool calls in five, on
  #   every SAG surface, with no human on the other end — the `|| true`
  #   PreToolUse mistake at 17x the rate (that one was refusing 4.86%).
  #
  # `dry_run` calls the gate's `_finish()`, so it WRITES the `agent_approval_log`
  # row and then allows. That makes the control consumed and measurable at zero
  # liveness risk, and the log becomes the corpus for deciding what to enumerate
  # — i.e. this IS the fire-rate survey CLAUDE.md requires before arming a
  # security check. Promote to `enforce` per bundle, once those tools are
  # enumerated or explicitly accepted; do not flip this line to do it globally.
  # Finding: docs/security/approval-gate-reachability.md
  approval:
    # mode: manual                   # env: ICDEV_SAG_APPROVAL_MODE  (manual|smart|off)
    risk_function: summarization     # env: ICDEV_SAG_RISK_FUNCTION  (routing function, not a model)
    command_mode: dry_run            # env: ICDEV_AGENT_APPROVAL_MODE (enforce|dry_run|off)

  # tools/agents/adapters/codex_cli.py — confinement passed to an agent CLI that
  # supports one (`--sandbox <mode>`). The mode names belong to the vendor CLI,
  # so this is not validated against a list here. POSTURE-GOVERNED; the
  # adapter-specific ICDEV_CODEX_SANDBOX wins over the generic env var below.
  sandbox:
    # mode: workspace-write          # env: ICDEV_SAG_SANDBOX_MODE

  # tools/agent_runtime/dispatch.py — the fail-closed default gate used when no
  # safety gate is supplied. POSTURE-GOVERNED, and every shipped posture that is
  # not `danger-full-access` sets it false; `false` is what makes it fail-closed.
  # With no posture file at all the built-in default is still false.
  mutation:
    # allow: false                   # env: ICDEV_SAG_ALLOW_MUTATION

  # tools/agent_runtime/delegation.py — whether a CHILD agent (depth > 0) may
  # itself delegate. The top-level agent always may; the absolute depth cap
  # (MAX_ORCHESTRATOR_DEPTH) is code, not config.
  delegation:
    child_can_delegate: false        # env: ICDEV_SAG_CAN_DELEGATE

  # tools/agent_runtime/toolsets.py — bundle definitions consumed by
  # `AgentRuntime.use_toolset`. Empty string = args/agent_toolsets.yaml.
  toolsets:
    bundle_path: ''                  # env: ICDEV_AGENT_TOOLSETS

  # tools/agent_runtime/wake_tools.py — the ceiling on a sleep an AGENT schedules
  # for itself (sleep_for / sleep_until). A longer sleep, or a time already in
  # the past, is refused before any row is written, so a confused agent cannot
  # park a session where nobody will notice. This bounds only the two timer
  # tools: wake_on / wake_on_event wait on a condition somebody else fires, and
  # inventing a deadline for them would silently turn "wake me when PR #1342 is
  # green" into "wake me in 24 hours".
  #
  # A non-positive or unparseable value resolves to the 86400 default, not to
  # "unbounded" — a cap a typo can switch off is not a cap.
  wake:
    max_sleep_seconds: 86400         # env: ICDEV_SAG_MAX_SLEEP_SECONDS (24 hours)
