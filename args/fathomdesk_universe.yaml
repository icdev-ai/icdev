# FathomDesk — Ticker Universe
#
# Canonical source for all tickers tracked by the FathomDesk KG and scanner.
# Add new tickers here; the KG coverage report reads this file to compute coverage.
#
# Schema per entry:
#   symbol    — ticker as used by the data provider (e.g. yfinance, OpenBB)
#   name      — human-readable company name
#   exchange  — exchange code (TSX, TSE, HKEX, NYSE, NASDAQ, etc.)
#   currency  — ISO 4217 trading currency
#   timezone  — IANA timezone for market hours
#   sector    — GICS sector label (optional, aids sector-rotation KG edges)

