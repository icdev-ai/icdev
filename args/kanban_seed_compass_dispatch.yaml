# CUI // SP-CTI
# Dispatch-proof seed — the one real compass task behind ked-vfy-01
# ("Prove it: dispatch one real compass task end to end").
#
# This file is the TASK DEFINITION. The ROUTING that actually sends it to
# compass lives in args/kanban_external_repos.yaml, which maps the id prefix
# `prem-vfy` -> compass. Both must agree: repo_registry.resolve_task_repo()
# falls back to the ICDev default for any prefix missing from that registry, so
# a seed task whose prefix is unregistered would be built inside ICDev's own
# tree — the exact churn this stream exists to eliminate. The test asserts the
# two files agree, so they cannot drift apart silently.
#
# The work itself is deliberately trivial and low-blast-radius: the point is to
# observe dispatch -> branch -> CI -> PR -> merge in compass (ked-vfy-01 d2-d5),
# not to land meaningful product change through an unproven pipeline.

task:
  id: prem-vfy-01
  title: Add CI status badge to compass README
  task_type: build
  target_repo: icdev-ai/compass
  complexity: low
  priority: medium
  status: backlog
  description: |
    Add a CI status badge to the top of the compass repository's README.md,
    directly under the project title, pointing at the repo's GitHub Actions
    workflow on the default branch (main).

    Scope is intentionally one line of markdown — this task exists to prove the
    repo-aware kanban dispatch path works end to end against a real external
    repo. Do not bundle other README edits, formatting passes, or fixes.

    Definition of done:
      - README.md on a `kanban/prem-vfy-01` branch in icdev-ai/compass carries
        the badge and renders correctly.
      - compass CI is green on that branch.
      - A PR is open against compass `main` and merges cleanly.

    If the badge already exists, fix its target/branch if wrong; otherwise close
    this task as a no-op rather than inventing adjacent work.
