# CUI // SP-CTI
# The PINNED public surface of the shared core package (xcore-api-01, xcore-cut-02) --
# consumed by tools/workflow/core_api_manifest.py and
# tools/workflow/coherence_checker.py::check_core_api.
#
# READ FROM THE INSTALLED DISTRIBUTION, NOT FROM A SOURCE TREE. Until xcore-cut-02 this
# parent shipped its own `icdev/core/`, so the manifest was generated from those files --
# which described a copy this parent happened to carry rather than the core it actually
# resolves. It no longer ships them: `icdev.core.*` comes from the `icdev-core`
# distribution, located with importlib. That is a stronger claim, and it is the one that
# matters, because a wrong answer here is an ImportError at the start of the dashboard, the
# genesis daemon, migrate.py and kanban/cli.py.
#
# `exports` is still the AUTHORITY rather than a directory listing: a declared module with no
# resolvable source fails, and a module found in the installed package that is declared
# nowhere fails. Adding a module to the distribution means editing this file; forgetting to is
# a red gate, not a silent omission.

package: icdev-core
repo: icdev-ai/icdev-core

# The version this parent is pinned to, and it must match the pin in requirements.txt.
# `main` is NOT a legal value: a floating branch dependency means this manifest describes
# whatever the core happened to look like at install time, and two installs of the same commit
# can then disagree.
pinned_version: "0.2.0"

# `installed` -- resolve each export through importlib against the installed distribution.
# The only other historical value was a source-tree path, which this parent no longer has.
resolution: installed

exports:
  - icdev.core
  - icdev.core.context
  - icdev.core.domain
  - icdev.core.paths
  - icdev.core.sensitivity

# Modules under `icdev.core` that this parent provides itself. EMPTY since xcore-cut-02:
# `icdev/core/shim.py` moved to `icdev/_shim.py`. It had to move -- once this parent stopped
# shipping the rest of `icdev/core/`, `icdev.core` resolves to the installed distribution and
# its `__path__` does not include this parent's leftover directory, so `icdev.core.shim` would
# have been unimportable. It still lives in the parent, which is what xcore-cut-02 requires;
# only its address changed.
parent_local: {}

# Non-Python payload the DISTRIBUTION ships, relative to the `icdev.core` package. Hashed by
# CONTENT -- it carries no callable surface, so a manifest that omitted it would report a
# changed table manifest as no change at all.
#
# NOT the same file as this parent's `icdev/core/schema/tables.yaml`, which is generated by
# `tools/db/schema_ownership.py --regenerate` and read by `sensitivity._manifest_exempt` from
# the REPO ROOT by path. The two are separate files with separate lifecycles and this manifest
# describes only the packaged one.
data_files:
  - schema/tables.yaml
