# CUI // SP-CTI
# The PINNED public surface of the shared core package (xcore-api-01) —
# consumed by tools/workflow/core_api_manifest.py and
# tools/workflow/coherence_checker.py::check_core_api.
#
# WHY A DECLARATION AND NOT A DIRECTORY LISTING. `icdev/core/` in THIS parent is
# not the same set as the `icdev-core` distribution. `shim.py` sits in the
# directory and is deliberately NOT in the package: it exists solely to make
# `tools.X` and `icdev.tools.X` resolve to one module object in ICDEV[IT]'s dual
# tree, and ICDEV[FT] has no `tools/` directory at all. A manifest generated by
# globbing the directory would publish `icdev.core.shim` as part of the shared
# API and tell FT a module is available that its wheel will never contain —
# fabricating a claim, which is the failure this whole card exists to prevent.
#
# So `exports` is the authority, and it is checked BOTH ways: a module listed
# here with no source file fails, and a source file under `source_root` that is
# in neither `exports` nor `parent_local` fails. Adding a module to the package
# means editing this file; forgetting to is a red gate, not a silent omission.

package: icdev-core
repo: icdev-ai/icdev-core

# The version this parent is pinned to. `main` is NOT a legal value: a floating
# branch dependency means the parent's gate describes whatever the core happened
# to look like at install time, and two installs of the same commit can then
# disagree. Bump this in the same PR that bumps the dependency pin.
pinned_version: "0.1.0"

source_root: icdev/core

# Modules the `icdev-core` distribution ships. Verified against the published
# tree 2026-08-26: icdev/core/{__init__,context,domain,paths,sensitivity}.py
# plus icdev/core/schema/tables.yaml.
exports:
  - icdev.core
  - icdev.core.context
  - icdev.core.domain
  - icdev.core.paths
  - icdev.core.sensitivity

# Under `source_root` in THIS parent, and deliberately absent from the package.
# Each needs a written reason. An import of one of these resolves today because
# the file is in this checkout — and will NOT resolve from the installed wheel
# alone, which is why they are reported rather than silently allowed.
parent_local:
  icdev.core.shim: >-
    One parent's layout knowledge: it aliases `tools.X` onto `icdev.tools.X` so
    IT's dual tree is one module object (xit-decl-02). ICDEV[FT] has no `tools/`
    directory, so shipping this in the shared package would put IT's layout
    inside the wheel both parents install.

# Non-Python payload the package ships. Hashed by CONTENT — it carries no
# callable surface, so `_public_api` has nothing to say about it, and a
# manifest that simply omitted it would report a changed table manifest as no
# change at all.
data_files:
  - icdev/core/schema/tables.yaml
