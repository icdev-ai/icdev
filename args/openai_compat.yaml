# CUI // SP-CTI
#
# Governed OpenAI-compatible endpoint (owui-api-01, D-OWUI-1).
#
# tools/saas/openai_compat.py serves /v1/models and /v1/chat/completions on the
# SaaS API gateway so OpenAI-compatible clients (Open WebUI first) reach a model
# ONLY through LLMRouter -- redaction, routing policy, budgets and ai_telemetry.
#
# The ids below are ICDEV CAPABILITIES, not vendor models. A client never picks
# a provider; it picks a capability, and the router's chain for `llm_function`
# (declared in args/llm_config.yaml -- an undeclared function silently falls
# back to routing.default, so declare it) decides who serves it.
#
# Do NOT add an id that maps to a raw vendor model: that would hand the client
# the routing decision the router exists to make.

# Used when the request carries no X-ICDEV-Classification header. Fail toward
# the more restrictive marking: this is the router's own default as well.
default_classification: CUI

# Header a client may send to declare the request's classification. A value
# not in allowed_classifications is refused (400), never silently downgraded.
classification_header: X-ICDEV-Classification
allowed_classifications: [UNCLASSIFIED, CUI, SECRET]

# Every /v1 exchange writes one append-only audit_trail row (owui-flow-02). When
# true, a non-streamed answer whose row cannot be written is withheld (503)
# rather than handed out unrecorded (NIST AU-2/AU-12). A stream already in
# flight cannot be withdrawn; its failed write is logged instead.
audit_required: true

# owui-rag-01: [source: <id>] citations in an answer become OpenAI url_citation
# annotations, which Open WebUI renders as source chips. The link is a LOOKUP into
# ICDEV ({dashboard} = ICDEV_DASHBOARD_URL, default http://localhost:5050) --
# retrieval and the evidence itself stay in ICDEV.
citation_url_template: "{dashboard}/knowledge-search?q={id}"

# Upper bound applied to a client's max_tokens.
max_tokens_cap: 8192

models:
  - id: icdev/general
    llm_function: openai_compat_general
    description: General assistant over the ICDEV router (cloud-eligible after redaction).
  - id: icdev/code
    llm_function: openai_compat_code
    description: Code generation and review.
  - id: icdev/compliance
    llm_function: openai_compat_compliance
    description: NIST 800-53 / FedRAMP / CMMC questions and artifact drafting.
  - id: icdev/local-only
    llm_function: openai_compat_local
    description: Never leaves this host -- force_local routing.

  # Governed WORKFLOWS (owui-flow-01): not language models -- each runs an
  # existing ICDEV tool and answers with what it did plus a dashboard deep link
  # for anything a human must approve (tools/saas/openai_workflows.py).
  # required_roles is mandatory: refused (403) for any other role.
  - id: icdev/intake
    kind: workflow
    workflow: intake
    required_roles: [tenant_admin, developer, compliance_officer]
    description: Capture requirements -> SAFe decomposition -> staged for human review (never auto-seeds kanban).
  - id: icdev/kanban
    kind: workflow
    workflow: kanban
    required_roles: [tenant_admin]
    description: Read-only kanban board status, optionally for one project prefix.
