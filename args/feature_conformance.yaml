# CUI // SP-CTI
# Feature conformance — the five rules, per feature (icx-cnf-01).
#
# Judged by: python tools/conformance/feature_audit.py
# Doc:       docs/audits/conformance-cortex-coworker.md (generated tables)
# Census:    args/feature_conformance_census.txt (every open gap, BY NAME)
#
# THE FIVE RULES (owner, 2026-11-14). Every feature has:
#   gui           a console page: its routes render a template reachable from the
#                 nav, and every mutating route is called by a page;
#   workflow      a declared workflow for every decision a person takes: each
#                 decision endpoint maps to a template under
#                 args/workflow_hitl_templates/ (or, for an MCP tool, a tier in
#                 args/agent_approval_policy.yaml that halts). Stops stay immediate,
#                 with a stated reason;
#   twin          a registered tools/twin_core adapter that observes it, whose
#                 violations carry thread ids and whose observation replays;
#   architecture  ICDEV's own platform model (args/platform_model/*.yaml, the
#                 source the MBSE digital thread is seeded from) traces each
#                 requirement to an element, its code and an existing test;
#   ai_native     a declared read-only MCP tool; any mutating tool halts at the
#                 approval gate.
#
# WHAT THIS FILE MAY SAY. Which features are in scope and which surfaces each one
# owns. It may NOT make a rule pass. The audit derives every verdict from the
# repository. A rule that genuinely does not apply takes a stated reason under
# `reasons:`; that reason excuses ONLY its own rule, and a reason the evidence no
# longer needs is STALE and fails `--check`. The same holds for `stops:` and
# `not_decisions:`: each names one surface and goes stale when that surface is no
# longer read as a decision.
#
# `served_by` names a page another feature owns that serves this one in the
# console (GUI evidence only, never ownership). Like a declared decision it
# quotes the text that proves it, and a quotation that is not in the named file
# fails `--check`.
#
# Adding a feature: list it below with the endpoints (Flask endpoint names, as the
# url_map prints them) and MCP tools it owns, then run
#   python tools/conformance/feature_audit.py --markdown --census
# and review the census diff. Every endpoint of a blueprint named under
# `components:` must be owned by exactly one feature, and every MCP tool whose name
# starts with a listed prefix likewise, or `--check` fails: nothing is skipped
# silently.

version: 1

# warn: the coherence check `feature_conformance` warns while gaps remain.
# fail: any open gap fails it. Flipped by icx-cnf-07, which closed the last two
# gaps (17/17 conform): from here a new gap, or a stale record, fails the check.
# Never flip it back to get a change through; close the gap or state its reason.
enforcement: fail

# The ceiling on args/feature_conformance_census.txt. It may only go DOWN; at 0,
# no gap may be registered at all.
census_max: 0

doc: docs/audits/conformance-cortex-coworker.md
snapshot: docs/audits/conformance-cortex-coworker.json
census: args/feature_conformance_census.txt
workflow_templates_dir: args/workflow_hitl_templates
platform_model_dir: args/platform_model
approval_policy: args/agent_approval_policy.yaml
twin_adapters_dir: tools/twin_core/adapters

# Blueprints and MCP prefixes each component owns in full.
components:
  cortex:
    blueprints: [cortex]
    mcp_prefixes: [cortex_]
  ace:
    blueprints: [ace, ace_api]
    mcp_prefixes: [ace_]
  cwk:
    blueprints: [coworkers]
    mcp_prefixes: []

features:
  # ── ICDEV Cortex (tools/cortex) ───────────────────────────────────────────
  - key: cortex.search_ask
    component: cortex
    label: "Cortex: search and ask"
    endpoints:
      - cortex.index
      - cortex.api_chat
      - cortex.api_session
      - cortex.api_iqe_query
      - cortex.api_v1_search
      - cortex.api_v1_ask
    mcp_tools: [cortex_search, cortex_ask]
    machine_endpoints:
      - endpoint: cortex.api_v1_search
        reason: >-
          The versioned REST surface for external consumers. The /cortex page
          reaches the same governed facade through /cortex/api/chat, whose intent
          router sends a question to search or ask.
      - endpoint: cortex.api_v1_ask
        reason: >-
          The versioned REST surface for external consumers. The /cortex page
          reaches the same governed facade through /cortex/api/chat.
    not_decisions:
      - surface: cortex.api_chat
        reason: >-
          Its confirm branch is the agent-launch decision, judged under
          cortex.agent_launch. A search or ask through chat decides nothing.

  - key: cortex.governed_verbs
    component: cortex
    label: "Cortex: resolve, complete, reason, classify, extract"
    endpoints:
      - cortex.api_v1_resolve
      - cortex.api_v1_complete
      - cortex.api_v1_reason
      - cortex.api_v1_classify
      - cortex.api_v1_extract
      - cortex.verbs_page
    mcp_tools: [cortex_resolve, cortex_complete, cortex_reason, cortex_classify, cortex_extract]

  - key: cortex.govern
    component: cortex
    label: "Cortex: govern (TRUST chain)"
    endpoints:
      - cortex.api_v1_govern
      - cortex.govern_page
      - cortex.api_trust_chain
    # cortex_govern RUNS the chain, which writes the cortex_audit, cortex_sessions
    # and provenance rows, so it stays declared mutating. cortex_trust_chain is
    # its read (icx-cnf-05).
    mcp_tools: [cortex_govern, cortex_trust_chain]

  - key: cortex.agent_launch
    component: cortex
    label: "Cortex: agent launch"
    endpoints: [cortex.api_v1_agent, cortex.api_agent_launches]
    mcp_tools: [cortex_agent_launch, cortex_agent_launches]
    machine_endpoints:
      - endpoint: cortex.api_v1_agent
        reason: >-
          The versioned REST surface for external callers. The console launches
          through the /cortex confirm card (served_by below), which reaches the
          same governed agent facade.
    served_by:
      - endpoint: cortex.index
        evidence:
          file: tools/cortex/blueprint.py
          text: "confirm to proceed"
      - endpoint: cortex.api_chat
        evidence:
          file: tools/cortex/blueprint.py
          text: "The confirmed branch: actually launch, through the governed facade."
    declared_decisions:
      - id: cortex.agent_launch.rest
        endpoint: cortex.api_v1_agent
        evidence:
          file: tools/cortex/rest_v1.py
          text: "it is the one endpoint here that"
      - id: cortex.agent_launch.chat_confirm
        endpoint: cortex.api_chat
        evidence:
          file: tools/cortex/blueprint.py
          text: "confirm to proceed"

  - key: cortex.findings
    component: cortex
    label: "Cortex: resolution findings"
    endpoints:
      - dic.explorer
      - dic.api_explorer_cortex_findings
      - dic.api_explorer_cortex_finding_adjudicate
    mcp_tools: [cortex_findings_list]
    declared_decisions:
      - id: cortex.findings.adjudicate
        endpoint: dic.api_explorer_cortex_finding_adjudicate
        evidence:
          file: tools/cortex/finding_store.py
          text: "A conflict is a finding a HUMAN adjudicates"

  - key: cortex.pmo
    component: cortex
    label: "Cortex: PMO verbs (slides, win themes, staffing, cost, dashboard, award, BOM)"
    endpoints:
      - cortex.api_v1_slides
      - cortex.api_v1_win_themes
      - cortex.api_v1_staffing_matrix
      - cortex.api_v1_cost_volume
      - cortex.api_v1_dashboard
      - cortex.api_v1_award
      - cortex.api_v1_bom
      - cortex.pmo_page
      - cortex.api_pmo_status
    mcp_tools: [cortex_pmo_status]
    declared_decisions:
      - id: cortex.pmo.bom_designation
        endpoint: cortex.api_v1_bom
        evidence:
          file: tools/cortex/rest_v1.py
          text: "Only a human's designation binds"

  - key: cortex.intake
    component: cortex
    label: "Cortex: intake bridge"
    endpoints:
      - cortex.api_v1_intake_session_create
      - cortex.api_v1_intake_turn
      - cortex.api_v1_intake_session_get
      - cortex.intake_page
      - cortex.api_intake_sessions
    mcp_tools: [cortex_intake_sessions]

  - key: cortex.service_keys
    component: cortex
    label: "Cortex: service keys"
    endpoints: [cortex.service_keys_page, cortex.api_service_keys]
    mcp_tools: [cortex_service_keys]

  - key: cortex.metrics
    component: cortex
    label: "Cortex: metrics"
    endpoints:
      - cortex.metrics_page
      - cortex.api_metrics
      - cortex.api_metrics_tile
    mcp_tools: [cortex_metrics]

  - key: cortex.airgap_guard
    component: cortex
    label: "Cortex: air-gap guard and health"
    endpoints: [cortex.api_v1_health, cortex.airgap_page, cortex.api_airgap]
    mcp_tools: [cortex_airgap_posture]

  # ── ACE Co-Worker Engine (tools/ace) ──────────────────────────────────────
  - key: ace.runs
    component: ace
    label: "ACE: launch, run, rerun"
    endpoints:
      - ace.index
      - ace.instance_detail
      - ace.live_monitor
      - ace.instance_resume
      - ace_api.api_launch
      - ace_api.api_instances
      - ace_api.api_status
      - ace_api.api_messages
      - ace_api.api_artifacts
      - ace_api.api_audit
      - ace_api.api_stream
      - ace_api.api_session_rerun
      - ace_api.api_ace_chat
      - ace.chat_page
    mcp_tools: [ace_launch, ace_status]

  - key: ace.hitl
    component: ace
    label: "ACE: mid-run HITL checkpoint, suggested-team confirm"
    endpoints:
      - ace_api.api_hitl_pending
      - ace_api.api_hitl_resolve
      - ace_api.api_suggestion_get
      - ace_api.api_suggestion_confirm
      - ace_api.api_suggestion_decline
    mcp_tools: [ace_checkpoints]
    served_by:
      - endpoint: ace.instance_detail
        evidence:
          file: tools/dashboard/templates/coworker/instance.html
          text: '{% include "coworker/hitl.html" %}'

  - key: ace.abort
    component: ace
    label: "ACE: abort"
    endpoints: [ace_api.api_abort]
    mcp_tools: [ace_abort]
    reasons:
      ai_native: >-
        A stop has nothing of its own to read. An agent reads the run it would
        stop through ace_status, a read-only tool judged under ace.runs, and
        ace_abort itself halts at the approval gate (default tier unknown).
    served_by:
      - endpoint: ace.instance_detail
        evidence:
          file: tools/dashboard/templates/coworker/instance.html
          text: '<div class="abort-zone">'
    stops:
      - surface: ace_api.api_abort
        reason: >-
          A stop. Abort cancels a running team at once and never waits for a
          signature; putting it behind a workflow would leave a runaway team
          running while the approval queues.
      - surface: mcp:ace_abort
        reason: >-
          A stop, the same as the route: an agent may halt a team it launched
          without asking first.

  - key: ace.profiles
    component: ace
    label: "ACE: role profiles"
    endpoints:
      - ace.roles
      - ace.profiles_new
      - ace_api.api_presets_list
      - ace_api.api_profiles_list
      - ace_api.api_profiles_suggest_name
      - ace_api.api_profiles_preview
      - ace_api.api_profiles_generate
      - ace_api.api_profiles_delete
    mcp_tools: [ace_ensure_sme, ace_persona_query]

  - key: ace.trust_sessions
    component: ace
    label: "ACE: trust (NOVA), sessions, evaluations, trends, event feed and auto-dispatch"
    endpoints:
      - ace.trust_leaderboard
      - ace.sessions_list
      - ace.session_detail
      - ace.evals_page
      - ace.evals_trends_page
      - ace_api.api_sessions_list
      - ace_api.api_session_detail
      - ace_api.api_session_eval_get
      - ace_api.api_session_eval_post
      - ace_api.api_session_eval_suggestions
      - ace_api.api_session_eval_compare
      - ace_api.api_evals_trends
      - ace_api.api_evals_list
      - ace_api.api_monitor_summary
      - ace_api.api_coworker_stats
      - ace_api.api_nova_state
      - ace_api.api_ace_events
      - ace_api.api_ace_event_topics
      - ace_api.api_auto_dispatch
      - ace_api.api_auto_dispatch_grant
      - ace_api.api_auto_dispatch_revoke
      - ace_api.api_auto_dispatch_stop_all
      - ace_api.api_auto_dispatch_resume_all
      - ace_api.api_iqe_query
    mcp_tools:
      - nova_get_trust_score
      - nova_record_trust_event
      - nova_get_dispatch_config
      - nova_trust_summary
      - ace_events
      - ace_auto_dispatch_grants
    # icx-ace-01: turning auto-dispatch on and lifting stop-all are a person's
    # decisions (decl-wft-ace-auto-dispatch); turning a grant off and stop-all are
    # a person's decisions too, and they are stops.
    declared_decisions:
      - id: ace.auto_dispatch.grant
        endpoint: ace_api.api_auto_dispatch_grant
        evidence:
          file: tools/ace/blueprint.py
          text: "A person turns auto-dispatch on for one role/topic"
      - id: ace.auto_dispatch.resume
        endpoint: ace_api.api_auto_dispatch_resume_all
        evidence:
          file: tools/ace/blueprint.py
          text: "Lift stop-all. The holder's declared step"
      - id: ace.auto_dispatch.revoke
        endpoint: ace_api.api_auto_dispatch_revoke
        evidence:
          file: tools/ace/blueprint.py
          text: "Turn one grant off now. A stop"
      - id: ace.auto_dispatch.stop_all
        endpoint: ace_api.api_auto_dispatch_stop_all
        evidence:
          file: tools/ace/blueprint.py
          text: "Stop every auto-dispatch at once. A stop"
    stops:
      - surface: ace_api.api_auto_dispatch_revoke
        reason: >-
          A stop. Turning a grant off takes effect at once, with a stated reason:
          waiting for an approval would leave a role launching on its own while
          the request queues. Every later event is a recommendation again.
      - surface: ace_api.api_auto_dispatch_stop_all
        reason: >-
          A stop, for every grant at once, like ACE abort for a run. Lifting it
          is the declared step (resume, decl-wft-ace-auto-dispatch).

  # ── Co-Workers canvas (tools/coworkers) ───────────────────────────────────
  - key: cwk.canvas
    component: cwk
    label: "Co-Workers canvas"
    endpoints:
      - coworkers.index
      - coworkers.open_chat
      - coworkers.status
    mcp_tools: [coworkers_roster]

  # ── Application modernisation (icx-mdz-01) ────────────────────────────────
  # The 7R assessment, AI-Ify, Process-Ify, app waves and CAM refactor jobs,
  # cloud-native targets, and the ICDEV[OS] exporter and decision import. No
  # blueprint is listed under `components:`: the migration API, the migration
  # canvas and the workflow canvas serve other features too, so each feature
  # names the routes it owns. Owned here and not elsewhere: AI-Ify's Innovation
  # trigger (aiify.api_run_innovation) is the Innovation engine's, and Process-
  # Ify's chain, regeneration and role routes are the workflow canvas's.
  - key: mdz.seven_r
    component: mdc
    label: "Modernisation: 7R assessment and the strategy ICDEV proposes"
    endpoints:
      - migration_page
      - migration_api_legacy.migration_stats
      - migration_api_legacy.list_assessments
      - migration_api_legacy.list_plans
      - migration_api_legacy.trigger_assessment
      - migration_api_legacy.record_strategy
    mcp_tools: [modernisation_seven_r, assess_seven_r]
    # A person records the strategy ICDEV proposes (decl-wft-mdz-7r-strategy).
    # The signed decision is ICDEV[OS]'s; icos_decisions.py may-plan reads it.
    declared_decisions:
      - id: mdz.seven_r.record
        endpoint: migration_api_legacy.record_strategy
        evidence:
          file: tools/dashboard/api/migration.py
          text: "A person records the 7R strategy ICDEV proposes for an assessed application"

  - key: mdz.aiify
    component: aiify
    label: "Modernisation: AI-Ify opportunities, PRDs and their promotion"
    endpoints:
      - aiify.index
      - aiify.api_scan
      - aiify.api_get_scan
      - aiify.api_intelligence_feed
      - aiify.api_hitl_decision
      - aiify.api_generate_prd
      - aiify.api_prd_dry_run
      - aiify.api_send_to_kanban
      - aiify.api_delete_scan
      - aiify.api_delete_all_scans
      - aiify.api_iqe_query
      - aiify.posture_page
      - aiify.api_posture_summary
      - aiify.api_posture_snapshot
    mcp_tools: [aiify_promotions]

  - key: mdz.processify
    component: wfc
    label: "Modernisation: Process-Ify (document or observed process to workflow)"
    endpoints:
      - workflow_canvas.processify
      - workflow_canvas.api_processify_workflow
      - workflow_canvas.api_save_processify_workflow
      - workflow_canvas.api_cleanup_processify_tasks
      - workflow_canvas.api_observed_drafts
      - workflow_canvas.api_observed_review
    mcp_tools: [processify_observed_drafts]
    declared_decisions:
      - id: mdz.processify.observed_review
        endpoint: workflow_canvas.api_observed_review
        evidence:
          file: tools/workflow_canvas/blueprint.py
          text: "HITL decision on an observed draft"

  - key: mdz.waves_cam
    component: mdc
    label: "Modernisation: an application's waves and CAM refactor jobs"
    endpoints:
      - migration_canvas.modernisation_page
      - migration_canvas.api_modernisation_apps
      - migration_canvas.api_modernisation_waves
      - migration_canvas.api_modernisation_refactor_jobs
      - migration_canvas.api_refactor_job_approve
      - migration_canvas.api_modernisation_capacity_review
    mcp_tools: [modernisation_waves_jobs, modernisation_wave_schedule]
    # icx-mdz-05: the waves are dated only from a team capacity a person approved
    # at its digest (decl-wft-mdz-capacity-review); the planner reads the review.
    declared_decisions:
      - id: mdz.waves_cam.capacity_review
        endpoint: migration_canvas.api_modernisation_capacity_review
        evidence:
          file: tools/migration_canvas/modernisation.py
          text: "A person approves or rejects the team capacity declared for one application"

  - key: mdz.cloud_native
    component: mdc
    label: "Modernisation: cloud-native targets (container, config, twelve factors, events)"
    endpoints: [migration_canvas.api_modernisation_cloud_native]
    mcp_tools: [modernisation_cloud_native]
    served_by:
      - endpoint: migration_canvas.modernisation_page
        evidence:
          file: tools/dashboard/templates/migration_canvas/modernisation.html
          text: '<div class="mdz-card" id="mdz-cloud">'

  - key: mdz.exporter
    component: mdc
    label: "Modernisation: the ICDEV[OS] apptwin exporter and decision import"
    endpoints:
      - migration_canvas.api_modernisation_bundle
      - migration_canvas.api_modernisation_icos_check
      - migration_canvas.api_modernisation_features
      - migration_canvas.api_modernisation_process_review
      - migration_canvas.api_modernisation_survivor_ivv
      - migration_canvas.api_modernisation_ivv_signoff
    mcp_tools: [modernisation_bundle, modernisation_features, modernisation_survivor_ivv]
    # icx-mdz-03: a person confirms or rejects an extracted process at its step-
    # signature digest (decl-wft-mdz-process-review); the exporter reads it.
    # icx-mdz-06: an independent person signs off or refuses a survivor IV&V
    # result at its digest (decl-wft-mdz-survivor-ivv-signoff, separate from
    # whoever built or approved the plan); the exporter carries only a signed one.
    declared_decisions:
      - id: mdz.exporter.process_review
        endpoint: migration_canvas.api_modernisation_process_review
        evidence:
          file: tools/migration_canvas/modernisation.py
          text: "A person confirms or rejects one extracted process"
      - id: mdz.exporter.survivor_ivv_signoff
        endpoint: migration_canvas.api_modernisation_ivv_signoff
        evidence:
          file: tools/migration_canvas/modernisation.py
          text: "An independent person signs off or refuses the application's survivor IV&V result"
    served_by:
      - endpoint: migration_canvas.modernisation_page
        evidence:
          file: tools/dashboard/templates/migration_canvas/modernisation.html
          text: '<div class="mdz-card" id="mdz-bundle">'

  # ── Engineering CoE: the standards register (icx-coe-01) ──────────────────
  # One entry per standard (args/engineering_standards.yaml seeds; status is the
  # replay of coe_standard_events). Propose is a draft by anyone or an agent; a
  # steward who is not the author reviews, signs into force and deprecates, each
  # a declared step (decl-wft-coe-standard-review / -adopt / -deprecate). The idp
  # blueprint's other routes are the portal's own and are not listed here.
  - key: coe.standards
    component: idp
    label: "Engineering CoE: standards register with a lifecycle"
    endpoints:
      - idp.idp_standards_page
      - idp.idp_api_standards
      - idp.idp_api_standard
      - idp.idp_api_standard_propose
      - idp.idp_api_standard_review
      - idp.idp_api_standard_adopt
      - idp.idp_api_standard_deprecate
      - idp.idp_api_standards_twin
    mcp_tools: [coe_standards, coe_standard_propose]
    declared_decisions:
      - id: coe.standards.review
        endpoint: idp.idp_api_standard_review
        evidence:
          file: tools/idp/blueprint.py
          text: "A steward, never the author, endorses a proposed standard or returns it."
      - id: coe.standards.adopt
        endpoint: idp.idp_api_standard_adopt
        evidence:
          file: tools/idp/blueprint.py
          text: "A steward, never the author, signs a reviewed standard into force, or refuses it."
      - id: coe.standards.deprecate
        endpoint: idp.idp_api_standard_deprecate
        evidence:
          file: tools/idp/blueprint.py
          text: "A steward, never the author, retires the standard in force, with a reason."

  # ── Engineering CoE: exemptions that expire (icx-coe-02) ──────────────────
  # Every exemption has a scope and an expiry; one past its expiry FAILS the
  # scorecard and the CI check. Requesting and asking for a renewal decide
  # nothing; granting and renewing are a person's declared steps
  # (decl-wft-coe-exemption-grant / -renew), never the requester's. Revoking is a
  # stop: immediate, with a stated reason; the audit does not read it as a
  # decision, so it needs no entry here.
  - key: coe.exemptions
    component: idp
    label: "Engineering CoE: scorecard exemptions that expire"
    endpoints:
      - idp.idp_exemptions_page
      - idp.idp_api_exemptions
      - idp.idp_api_exemption
      - idp.idp_api_exemption_request
      - idp.idp_api_exemption_decide
      - idp.idp_api_exemption_renewal
      - idp.idp_api_exemption_renew
      - idp.idp_api_exemption_revoke
    mcp_tools: [coe_exemptions, coe_exemption_request]
    declared_decisions:
      - id: coe.exemptions.grant
        endpoint: idp.idp_api_exemption_decide
        evidence:
          file: tools/idp/blueprint.py
          text: "A person, never the requester, grants an exemption request or denies it."
      - id: coe.exemptions.renew
        endpoint: idp.idp_api_exemption_renew
        evidence:
          file: tools/idp/blueprint.py
          text: "A person, never the requester or the asker, renews an exemption or refuses."

  # ── Engineering CoE: ADRs as records (icx-coe-02) ─────────────────────────
  # One record per ADR (docs/reference/adrs/); docs/reference/adrs.md is generated
  # from them. Proposing is a draft by anyone or an agent; accepting and
  # superseding are a person's declared steps (decl-wft-coe-adr-accept /
  # -supersede), never the author's.
  - key: coe.adrs
    component: idp
    label: "Engineering CoE: architecture decision records as signed, versioned records"
    endpoints:
      - idp.idp_adrs_page
      - idp.idp_api_adrs
      - idp.idp_api_adr
      - idp.idp_api_adr_propose
      - idp.idp_api_adr_accept
      - idp.idp_api_adr_supersede
    mcp_tools: [coe_adrs, coe_adr_propose]
    declared_decisions:
      - id: coe.adrs.accept
        endpoint: idp.idp_api_adr_accept
        evidence:
          file: tools/idp/blueprint.py
          text: "A person, never the author, accepts a proposed ADR or returns it."
      - id: coe.adrs.supersede
        endpoint: idp.idp_api_adr_supersede
        evidence:
          file: tools/idp/blueprint.py
          text: "A person who wrote neither ADR supersedes an accepted ADR by its successor, or deprecates it."

  # ── Engineering CoE: scorecards against standards, conformance bundles (icx-coe-03) ─
  # Per repo (ICDEV[IT], ICDEV[OS], ICDEV[FT]): adopted standards scored by machine or
  # shown as needing evidence, exemptions applied (an expired one fails), delivery
  # evidence (DORA four keys and AI rework; no data is unverified), and one
  # icos-conformance/v1 bundle. Preparing a bundle decides nothing; publishing it to
  # ICDEV[OS] is a person's declared step (decl-wft-coe-conformance-publish), never
  # the preparer's.
  - key: coe.conformance
    component: idp
    label: "Engineering CoE: scorecards against standards, delivery evidence, conformance bundles"
    endpoints:
      - idp.idp_conformance_page
      - idp.idp_api_conformance
      - idp.idp_api_conformance_repo
      - idp.idp_api_conformance_prepare
      - idp.idp_api_conformance_publish
      - idp.idp_api_conformance_bundle
    mcp_tools: [coe_conformance, coe_conformance_prepare]
    declared_decisions:
      - id: coe.conformance.publish
        endpoint: idp.idp_api_conformance_publish
        evidence:
          file: tools/idp/blueprint.py
          text: "A person, never the preparer, publishes a repo's prepared bundle to ICDEV[OS], or refuses it."

  # ── Engineering CoE: golden paths (icx-coe-04) ──────────────────────────
  # A new service conformant by construction: `icdev scaffold service --path <id>`, each
  # path declaring the standards it satisfies by id and version (args/golden_paths.yaml),
  # behind when a standard in force that applies is missing (CI fails), and a drift check
  # that scores the scaffold with the IDP scorecard and feature_audit. Proposing a version
  # and running its drift check decide nothing; publishing or retiring one is a person's
  # declared step, never its author's.
  - key: coe.golden_paths
    component: idp
    label: "Engineering CoE: golden paths, a new service conformant by construction"
    endpoints:
      - idp.idp_golden_paths_page
      - idp.idp_api_golden_paths
      - idp.idp_api_golden_path
      - idp.idp_api_golden_path_propose
      - idp.idp_api_golden_path_drift
      - idp.idp_api_golden_path_publish
      - idp.idp_api_golden_path_retire
    mcp_tools: [coe_golden_paths, coe_golden_path_propose]
    declared_decisions:
      - id: coe.golden_paths.publish
        endpoint: idp.idp_api_golden_path_publish
        evidence:
          file: tools/idp/blueprint.py
          text: "A person, never the version's author, publishes a proposed golden path version, or refuses it."
      - id: coe.golden_paths.retire
        endpoint: idp.idp_api_golden_path_retire
        evidence:
          file: tools/idp/blueprint.py
          text: "A person, never the version's author, retires a published golden path version, or keeps it."

  # ── AI-assisted vulnerability discovery, proven or dropped (icx-ent-01) ──
  # Targets registered and authorised by a person (scope-locked), discovery from SAST,
  # SCA, an agentic review (proposes only) and fuzz harnesses, a finding only with a
  # proof of vulnerability replayed in the sandbox, patches a person reviews (never
  # applied), FP/FN measured on planted labels, and one icos-findings/v1 bundle per
  # target, prepared by one person and published by another.
  - key: vulnresearch.discovery
    component: vulnresearch
    label: "Vulnerability discovery: authorised targets, PoV-proven findings, reviewed patches, findings bundles"
    endpoints:
      - vulnresearch.vr_page
      - vulnresearch.vr_api_targets
      - vulnresearch.vr_api_target_register
      - vulnresearch.vr_api_target
      - vulnresearch.vr_api_target_authorise
      - vulnresearch.vr_api_target_revoke
      - vulnresearch.vr_api_run
      - vulnresearch.vr_api_measure
      - vulnresearch.vr_api_patch_propose
      - vulnresearch.vr_api_patch_review
      - vulnresearch.vr_api_bundle_prepare
      - vulnresearch.vr_api_bundle_publish
      - vulnresearch.vr_api_bundle
      - vulnresearch.vr_api_twin
    mcp_tools: [vulnresearch_status, vulnresearch_prepare]
    declared_decisions:
      - id: vulnresearch.target.authorise
        endpoint: vulnresearch.vr_api_target_authorise
        evidence:
          file: tools/vulnresearch/blueprint.py
          text: "A person, never the registrant, authorises a registered target for testing, or refuses it."
      - id: vulnresearch.patch.review
        endpoint: vulnresearch.vr_api_patch_review
        evidence:
          file: tools/vulnresearch/blueprint.py
          text: "A person, never the proposer, accepts or rejects a proposed patch. Nothing is applied."
      - id: vulnresearch.bundle.publish
        endpoint: vulnresearch.vr_api_bundle_publish
        evidence:
          file: tools/vulnresearch/blueprint.py
          text: "A person, never the preparer, publishes a target's prepared findings bundle to ICDEV[OS], or refuses it."

  # ── The audit itself (it follows the five rules too) ──────────────────────
  - key: conformance.audit
    component: twin_observatory
    label: "Feature conformance audit (this tool)"
    endpoints:
      - twin_observatory.conformance_page
      - twin_observatory.api_conformance
    mcp_tools: [feature_conformance]
