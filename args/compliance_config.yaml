# CUI // SP-CTI
# ICDEV™ Compliance Configuration
# Defines active compliance frameworks, gates, and scaffolding for the platform.
# Classification: CUI // SP-CTI  |  Impact Level: IL4/IL5
#
# 3 required frameworks for CUI // SP-CTI projects (auto-detected by compliance_detector.py):
#   1. nist_800_171  — NIST SP 800-171 Rev 2 (CUI Protection)
#   2. fedramp_moderate — FedRAMP Moderate Baseline (NIST 800-53 rev5)
#   3. cmmc_l2      — CMMC Level 2 (CUI handling, 110 practices)

_schema_version: 1

# ============================================================
# Platform-level compliance identity
# ============================================================
platform:
  project_id: icdev-platform
  classification: cui_sp_cti
  impact_level: IL4
  cloud_environment: aws_govcloud
  accrediting_authority: DISA

# ============================================================
# Active compliance frameworks (3 required for CUI // SP-CTI)
# ============================================================
frameworks:
  nist_800_171:
    enabled: true
    version: "rev2"
    description: "NIST SP 800-171 Rev 2 — Protecting CUI in Nonfederal Systems"
    control_families:
      - AC   # Access Control
      - AT   # Awareness and Training
      - AU   # Audit and Accountability
      - CM   # Configuration Management
      - IA   # Identification and Authentication
      - IR   # Incident Response
      - MA   # Maintenance
      - MP   # Media Protection
      - PE   # Physical Protection
      - PS   # Personnel Security
      - RA   # Risk Assessment
      - CA   # Security Assessment
      - SC   # System and Communications Protection
      - SI   # System and Information Integrity
    assessor: tools/compliance/fedramp_assessor.py
    gate:
      block_on_open_cat1: true
      warn_on_open_cat2: true

  fedramp_moderate:
    enabled: true
    baseline: moderate
    description: "FedRAMP Moderate — NIST 800-53 rev5 (325 controls)"
    annual_assessment_required: true
    continuous_monitoring:
      enabled: true
      frequency_days: 30
    assessor: tools/compliance/fedramp_assessor.py
    report_generator: tools/compliance/fedramp_report_generator.py
    gate:
      block_on_critical: true
      warn_on_high: true

  cmmc_l2:
    enabled: true
    level: 2
    description: "CMMC Level 2 — 110 practices aligned with NIST 800-171"
    practices_required: 110
    assessment_type: third_party  # C3PAO required for DoD contracts
    domains:
      - AC   # Access Control        (22 practices)
      - AT   # Awareness & Training  (3 practices)
      - AU   # Audit & Accountability (9 practices)
      - CM   # Configuration Mgmt   (11 practices)
      - IA   # Identification & Auth (11 practices)
      - IR   # Incident Response     (3 practices)
      - MA   # Maintenance           (6 practices)
      - MP   # Media Protection      (9 practices)
      - PE   # Physical Protection   (6 practices)
      - PS   # Personnel Security    (2 practices)
      - RA   # Risk Assessment       (5 practices)
      - CA   # Security Assessment   (4 practices)
      - SC   # System & Comms Prot  (16 practices)
      - SI   # System & Info Integ  (7 practices)
    assessor: tools/compliance/cmmc_assessor.py
    gate:
      block_on_open_level2: true

# ============================================================
# Compliance scaffolding — artifacts generated per framework
# ============================================================
scaffolding:
  ssp:
    enabled: true
    generator: tools/compliance/ssp_generator.py
    output: data/compliance/ssp.json
    regenerate_on: [framework_update, control_change, annual]

  poam:
    enabled: true
    generator: tools/compliance/poam_generator.py
    output: data/compliance/poam.json
    auto_generate_on_finding: true

  sbom:
    enabled: true
    generator: tools/compliance/sbom_generator.py
    format: cyclonedx
    spec_version: "1.4"
    output: data/compliance/sbom.json
    regenerate_on: [build, dependency_update]

  stig:
    enabled: true
    checker: tools/compliance/stig_checker.py
    stig_id: webapp
    output: data/compliance/stig-checklist.json
    schedule_days: 30

  evidence_chain:
    enabled: true
    collector: tools/compliance/evidence_collector.py
    output_dir: data/compliance/evidence/

# ============================================================
# CI/CD gate configuration (aligns with .gitlab-ci.yml stages)
# ============================================================
cicd_gates:
  stages:
    - name: compliance:detect
      allow_failure: true
      description: "Auto-detect applicable frameworks from project data"
    - name: compliance:sbom
      allow_failure: false
      blocks_merge: false
      blocks_deploy: true
      description: "CycloneDX SBOM — required before deploy (security_gates.yaml: sbom_not_generated)"
    - name: compliance:stig
      allow_failure: false
      blocks_merge: true
      description: "STIG CAT1 findings block merge; CAT2 warnings only"
    - name: compliance:fedramp
      allow_failure: true
      description: "FedRAMP Moderate assessment — informational on MR, blocking on release"
    - name: compliance:cmmc
      allow_failure: true
      description: "CMMC L2 assessment — informational on MR, blocking on release"

# ============================================================
# Security hardening baseline (NIST 800-171 §3.1–§3.14)
# ============================================================
security_hardening:
  tls:
    minimum_version: "1.2"
    preferred_version: "1.3"
    enforce_hsts: true
  authentication:
    mfa_required: true
    session_timeout_minutes: 30
    failed_login_lockout: 5
  secrets_management:
    no_hardcoded_secrets: true
    scan_tool: bandit
    rotation_days: 90
  container_hardening:
    non_root: true
    read_only_rootfs: true
    no_privileged: true
    drop_capabilities: ["ALL"]
  network:
    ingress_whitelist_required: true
    egress_default_deny: true
    mutual_tls_agent_comms: true
  logging:
    audit_trail_append_only: true
    retention_days: 365
    siem_integration: required
  encryption:
    data_at_rest: AES-256
    data_in_transit: TLS-1.3
    fips_140_2_validated: required
    field_level: Fernet-AES-128-CBC
    enforce_for_cui: true
    auto_tls_for_cui: true
    mtls_required_for_il4_plus: true

# ============================================================
# Continuous monitoring cadence
# ============================================================
continuous_monitoring:
  sbom_freshness_days: 30
  stig_scan_days: 30
  vuln_scan_days: 7
  poam_review_days: 30
  ssp_review_days: 365
  alert_channels:
    - telegram
    - dashboard
