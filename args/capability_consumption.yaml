# CUI // SP-CTI
#
# Capability consumption measurement (#exa-live-01).
#
# ICDEV's signature defect is a *registered* capability with *zero*
# consumption: the audit chain columns (schema, verifier, bundle format and
# dashboard all shipped, writer never wired), MCPToolAuthorizer (counted as
# compliance evidence on file existence alone), prompt_registry (0 rows, 0
# importers), GEPA (dispatched every 24h, selection predicate can never match),
# and three separate reflex incidents (xbm-wake-01, xbm-wake-02, hgx-obs-02)
# where `enabled: true` + a working module + a catalogue entry produced zero
# executions. In every case nothing went red, because nothing counted.
#
# This file configures the counting half. Each class names a DECLARATION source
# (what the platform says it can do) and a CONSUMPTION source (an EXISTING
# telemetry table that records it actually happening). No new telemetry tables
# are introduced here — if a capability's use is not already recorded somewhere,
# that is itself the finding, and the class reports
# `telemetry_available: false` rather than a misleading zero.

classification: CUI // SP-CTI

# Default lookback for --json runs. Override per-invocation with --window-days.
window_days: 30

# A declared capability unit counts as INERT when its consumption event count
# over the window is <= this value. 0 means "never consumed at all".
inert_threshold: 0

# Cap on how many inert unit names are enumerated per class in the JSON payload.
# The count is always exact; only the name list is truncated.
max_listed_units: 40

classes:
  reflex:
    enabled: true
    description: >-
      Genesis reflexes that are both listed in tools.genesis.daemon.REFLEX_NAMES
      (the only list the dispatcher iterates) and enabled in
      args/genesis_config.yaml. Consumption is a recorded run.
  mcp_dispatch_tool:
    enabled: true
    description: >-
      MCP tools in tools.mcp.tool_registry.TOOL_REGISTRY. Consumption is a
      gated dispatch attempt recorded by the Studio MCP tool gate.
  agent_approval_rule:
    enabled: true
    description: >-
      Tools enumerated in args/agent_approval_policy.yaml under a tier listed in
      require_approval_tiers. Consumption is an approval-gate decision (approve
      OR deny) on that tool, identified by the row's `tier`. Tools in the other
      tiers are auto-allowed without a row by design and are reported under
      extra.not_measurable_by_design rather than counted inert (rem-cap-05).
  mcp_tool_authorization:
    enabled: true
    description: >-
      D261 per-tool RBAC roles declared in tools/mcp/tool_registry.py (ROLES).
      Consumption is an MCPToolAuthorizer verdict recorded by the MCP HTTP
      surface. The declaration moved out of args/owasp_agentic_config.yaml in
      exa-policy-07; reading the retired matrix would now report zero declared
      roles and therefore a falsely clean board.
  prompt_template:
    enabled: true
    description: >-
      Hard-prompt templates on disk under hardprompts/. Consumption is a
      registered, non-draft prompt_versions row for that template.
  audit_chain:
    enabled: true
    description: >-
      The migration-149 hash chain on audit_trail (hash, previous_hash,
      signature). Consumption is an audit row actually written with a chain
      hash.
  skill_optimizer:
    enabled: true
    description: >-
      Skills queued for GEPA optimization as agent_improvement_artifacts.
      Consumption is a GEPA DECISION recorded against an artifact — applied or
      declined (rem-cap-01). Counting applies alone made "GEPA ran and correctly
      declined everything" indistinguishable from "GEPA never ran"; the two
      neighbouring classes already count the same way, mcp_tool_authorization
      counting a verdict rather than a denial and audit_chain a chained row
      rather than a tamper finding. applied vs declined stay separate in
      `extra`.
  extension_hook_point:
    enabled: true
    description: >-
      Extension hook points present in both the ExtensionPoint enum and an
      enabled args/extension_config.yaml hook_points block. Consumption is a
      recorded ExtensionManager.dispatch on the 'extension' surface of
      runtime_invocations. Ten declared; before hcx-live-02 nothing counted a
      dispatch at all, so a point with no call site read exactly like a point on
      the chat hot path.

# ---------------------------------------------------------------------------
# Substrate probing (#trust-disc-04)
# ---------------------------------------------------------------------------
# A capability is something the platform says it can DO. A substrate is what a
# capability is designed AGAINST: a table, a column, a config block. An approved
# plan described kg_ontology as a working SHACL-lite supplying declared
# (subject_type, predicate, object_type) legality; on the live board kg_nodes
# held 8,869 rows, kg_edges 16,493, and kg_ontology, ontology_subclass_closure
# and kg_nodes.ontology_id held nothing at all. The validator built on the empty
# half would have answered "unknown" forever while looking like it worked. One
# SELECT COUNT(*) would have caught it and nothing asked for one.
substrate_probe:
  # Proof the database being probed has actually been RUN. ANY satisfied witness
  # is enough. Below every threshold the probe reports table substrates as
  # UNMEASURABLE instead of empty — 1,320 of 1,775 tables on the live board hold
  # zero rows, so a probe that cannot tell "this platform has never run" from
  # "this writer was never wired" invents findings by the thousand, and the
  # first place it would do that is a fresh worktree or an ephemeral CI database.
  history_witnesses:
    - table: audit_trail
      min_rows: 1000
    - table: kg_nodes
      min_rows: 100
    - table: kanban_tasks
      min_rows: 100

  # Table names never read as a substrate reference in prose. A bare word is
  # already required to carry an underscore (which is what keeps `tasks`,
  # `users`, `documents`, `groups`, `agents` and `order` — all real tables here —
  # out of every English sentence), so this list is for the underscore-carrying
  # names that still read as ordinary words in a design document.
  ignore_names: []

# Substrates the platform DECLARES as load-bearing: something shipped is
# designed against each of these, so a zero here is a shipped feature answering
# from an empty half. Probed by `--substrates`. This list is CURATED, not a
# schema dump — the value of the probe is that every entry is a claim somebody
# made, and a claim can be wrong in a way a table count cannot.
substrates:
  - ref: kg_ontology
    note: >-
      Declared (subject_type, predicate, object_type) legality — the SHACL-lite
      half of the KG. tools/quality/kg_grounding.py degrades to OBSERVED
      signatures while this is empty, and upgrades to DECLARED the moment it
      gains rows.
  - ref: ontology_subclass_closure
    note: >-
      The transitive subclass closure that ontology/federation.py writes and
      knowledge_graph/ingester.py::_populate_kg_ontology reads to build
      kg_ontology. Empty upstream is why kg_ontology is empty downstream.
  - ref: kg_nodes.ontology_id
    note: >-
      The per-node link into the ontology. 8,869 nodes, none of them linked —
      the column exists, the migration ran, nothing populates it.
  - ref: prompt_versions
    note: >-
      The prompt registry's only table. LLMRouter reads it as a supplemental
      prompt layer, so an unseeded registry is a silently inert read path.
  - ref: agent_approval_log
    note: >-
      Every approval-gate decision. A gate whose decision log is empty has never
      gated anything — see grandfathered.agent_approval_rule in
      args/liveness_gate.yaml.
  - ref: hook_events
    note: >-
      PreToolUse hook telemetry. Populated, but it stores tool-input KEY NAMES
      and never the operand, which is why a fire-rate survey has to be driven
      from the Claude Code transcripts instead. Listed so that "it has rows"
      never gets read as "it can answer the question".
  - ref: agent_session_events
    note: >-
      The append-only agent event log (hcx-evt-01, migration
      20260816122036). It exists because agent_loop_sessions.messages_json is
      UPSERT-overwritten every turn, so fork and replay have no data to read.
      Declared here BEFORE a writer is wired, deliberately: hcx-evt-02..05 add
      the append() call sites, and until one of them lands this table is the
      textbook shape this probe exists to name — a substrate something is
      designed against that holds nothing. tools/agent_runtime/event_log.py
      already READS it via read_session()/next_seq(), so a change to that module
      is exactly the commit substrate_liveness should warn on.
  - ref: entity_currency
    note: >-
      The domain-agnostic entity-currency store (cef-fnd-04, migration
      20260817010533). Load-bearing on a READ path — the network-hardware docmod
      pack consults resolve() when the curated catalog and the hardware EOL feed
      both come back empty — so an empty table here is a pack that silently
      reports 'unknown' rather than a table nobody touches. It is backfilled from
      docmod_eol_products, mc_net_eol_data and docmod_catalog_entries on the
      nightly docmod sweep and by
      `python -m tools.currency.entity_currency --backfill`; 230 rows on the live
      board at declaration time. Listed because the failure mode is silent: every
      caller degrades to "no answer", which is indistinguishable from "nothing to
      report".
  - ref: docmod_defacto_standards
    note: >-
      Learned de-facto standards. THE case cef-fnd-04 was opened for: 0 rows, and
      not because the writer never ran — defacto_learner.recompute() runs on the
      nightly sweep and read ni_devices, which itself holds 0 rows. `empty`
      pointing at an EMPTY UPSTREAM is a different fix from `absent`, and merging
      the two is what made this look like a missing migration for months. Fixed
      by making the learner's input a declaration
      (args/docmod/inventory_feeds.yaml) instead of one hardcoded table; it now
      holds 32 rows derived from the topology feed. If it returns to 0, check
      whether every declared feed is empty before suspecting the writer.

# The five incidents this measurement was built for. Each is asserted to be
# measurable — `--gate` fails when a case's class cannot be measured at all,
# because an unmeasurable capability is exactly the state that let these ship.
# A NON-zero count here is not a failure: it means the wiring landed.
#
# `metric` picks what answers the case:
#   events      — "this capability was never used at all"; still_inert when the
#                 class recorded no consumption events in the window.
#   inert_units — "some declared units in this class were never used"; a busy
#                 class hides those behind a healthy total, so still_inert when
#                 ANY declared unit sat at zero.
known_inert_cases:
  - id: audit_chain_writer
    capability_class: audit_chain
    metric: events
    note: >-
      Chain columns, verifier, bundle format and dashboard all shipped; the
      audit writer never populated hash/previous_hash.
  - id: mcp_tool_authorizer
    capability_class: mcp_tool_authorization
    metric: events
    note: >-
      Zero call sites for most of its life, while fedramp_ksi_generator counted
      the file's existence as satisfied evidence. Wired onto the MCP HTTP
      surface by exa-policy-05 in monitor mode.
  - id: prompt_registry
    capability_class: prompt_template
    metric: events
    note: >-
      0 rows in prompt_versions and 0 importers of tools/llm/prompt_registry.py.
      Wired into LLMRouter by exa-refine-01 as the SUPPLEMENTAL prompt-layer read
      path (`_apply_prompt_layers`, reserved `layer/` namespace, base prompt
      immutable), then given rows by exa-refine-02: `--import-hardprompts` seeds
      hardprompts/, `--seed-call-sites` seeds the `call_site/` bodies, and three
      call sites (gepa_optimizer, reflexion_agent, nova/skill_generator) read
      their prompt through `render_prompt` instead of an f-string literal. Stays
      listed rather than declared done, because the thing worth counting is
      whether rows and reads exist on a given INSTALL — a wired read path with an
      unseeded registry is still a no-op, and that is exactly the state this
      entry is here to make visible.
  - id: gepa_optimizer
    capability_class: skill_optimizer
    metric: events
    note: >-
      Dispatched every 24h and running — genesis_reflex_state showed 7 runs, 7
      successes, last_metric_value 0.0 every time — while recording nothing.
      The original note here blamed the >= 0.05 delta filter against artifacts
      with composite_score == baseline_score; exa-refine-03 fixed the WRITERS
      (reflexion_agent now scores the candidate independently of the baseline
      and resolves skill_used from the traces) but could not fix the 132 rows
      already in the queue, whose scores are immutable because nothing rescores
      an artifact after insert. rem-cap-01 found the reason that backlog was
      permanent: GEPA could only ever write status='applied', so an artifact it
      declined stayed 'pending' forever. GEPA now records a decision — applied
      or declined, terminal or retryable — against every artifact it evaluates,
      which both drains the immortal queue and makes a correct decline
      measurable. Stays listed rather than declared done because the thing
      worth counting is whether a given INSTALL's GEPA is deciding anything: a
      wired optimizer with no artifacts to judge is still a no-op, and that is
      exactly the state this entry makes visible.
  - id: inert_reflexes
    capability_class: reflex
    metric: inert_units
    note: >-
      xbm-wake-01 (latched circuit breaker), xbm-wake-02 (eight enabled
      reflexes absent from REFLEX_NAMES) and hgx-obs-02 — enabled, importable,
      catalogued, never executed. Counted per-reflex: a class total stays
      healthy while individual reflexes sit at zero.
