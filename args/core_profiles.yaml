# CUI // SP-CTI
# Enterprise Core Profiles — configuration presets for common ICDEV™ deployments.
#
# Consumed by:
#   - tools/config/core_profile.py (loader)
#   - tools/dashboard/config.py (apply defaults)
#   - tools/db/storage.py (backend selection)
#   - tools/llm/router.py (provider defaults)
#
# Each profile declares:
#   - name / description
#   - storage backend (sqlite | postgresql)
#   - LLM provider defaults
#   - enabled canvases/features (subset of args/component_registry.yaml)
#   - security / air-gap flags
#
# Env vars always override profile values (e.g., ICDEV_STORAGE_BACKEND).

profiles:
  community:
    description: Free-tier community deployment. SQLite backend, community-supported canvases only.
    storage_backend: sqlite
    license_tier: community
    llm:
      provider: ollama
      default_model: llama3.1:8b
    airgap: false
    default_enabled_components:
      - ndc
      - ohc
      - logs

  local-dev:
    description: Local development on a single workstation. SQLite backend, cloud LLMs allowed, all canvases opt-in.
    storage_backend: sqlite
    license_tier: professional
    llm:
      provider: anthropic
      default_model: claude-sonnet-4-6
    airgap: false
    default_enabled_components:
      - ndc
      - sdc
      - aimc
      - mission_canvas
      - ohc
      - integrity
      - logs

  air-gap:
    description: Disconnected environment. SQLite or local PostgreSQL, Ollama-only LLM routing, cloud features disabled.
    storage_backend: postgresql
    license_tier: enterprise
    llm:
      provider: ollama
      default_model: llama3.1:8b
    airgap: true
    disable_cloud_features: true
    default_enabled_components:
      - ndc
      - sdc
      - aimc
      - mission_canvas
      - ohc
      - integrity
      - logs

  saas-il4:
    description: Multi-tenant SaaS at IL4/CUI. PostgreSQL backend, tenant isolation, cloud LLMs with BYOK.
    storage_backend: postgresql
    license_tier: enterprise
    llm:
      provider: anthropic
      default_model: claude-sonnet-4-6
    airgap: false
    enable_byok: true
    enable_cui_banner: true
    default_enabled_components:
      - ndc
      - sdc
      - aimc
      - mission_canvas
      - ohc
      - integrity
      - logs
      - dic
      - aiify
      - foundry
      - pdc          # pdx-ops-01: Pipeline Design Canvas (min_il IL4) — CI/CD enablement path

  il6-secret:
    description: SIPR-only IL6/SECRET deployment. Air-gapped, NSA Type 1 encryption, no cloud dependencies.
    storage_backend: postgresql
    license_tier: enterprise
    llm:
      provider: ollama
      default_model: llama3.1:8b
    airgap: true
    disable_cloud_features: true
    enable_cui_banner: true
    classification: SECRET
    default_enabled_components:
      - sdc
      - mission_canvas
      - integrity

  commercial:
    description: Commercial enterprise deployment. No DoD markings, no classification banner, operator-branded.
    storage_backend: postgresql
    license_tier: professional
    llm:
      provider: anthropic
      default_model: claude-sonnet-4-6
    airgap: false
    banner_mode: none
    brand_path: args/brands/commercial.yaml
    default_enabled_components:
      - ndc
      - aimc
      - ohc
      - dic
      - aiify
      - foundry
      - admin_console

  government:
    description: DoD/IC government deployment. CUI banner, ICDEV™ branding, cloud LLMs with BYOK.
    storage_backend: postgresql
    license_tier: enterprise
    llm:
      provider: anthropic
      default_model: claude-sonnet-4-6
    airgap: false
    enable_byok: true
    enable_cui_banner: true
    banner_mode: cui
    brand_path: args/brands/government.yaml
    default_enabled_components:
      - ndc
      - sdc
      - aimc
      - mission_canvas
      - ohc
      - integrity
      - logs
      - dic
      - aiify
      - foundry
      - pdc          # pdx-ops-01: Pipeline Design Canvas (min_il IL4) — CI/CD enablement path

# ── Zero-Config Starter Recipes (agentcn adaptation) ──────────────────────
# Inspired by github.com/shadcn-labs/agentcn: single-command setup bundles.
# Each recipe declares the 3 commands a new user needs to go from zero to running.
# Used by: icdev init --recipe <name>  (prints the 3-command sequence)
#          /quick-start dashboard page (shows setup card per recipe)
recipes:
  analyst:
    display_name: "AI Analyst"
    description: "Research + document intelligence + knowledge graph. Best for analysts who need AI-assisted research, summarization, and citation-grounded answers."
    profile: local-dev
    setup_commands:
      - "icdev init"
      - "icdev enable dic knowledge_graph research"
      - "icdev profile apply local-dev"
    default_components:
      - dic
      - knowledge_graph
      - research
    recommended_llm: claude-sonnet-4-6
    min_il: IL2

  developer:
    display_name: "AI Developer"
    description: "Innovation engine + ACE co-worker + kanban. Best for software engineers who want AI pair-programming with autonomous task tracking."
    profile: local-dev
    setup_commands:
      - "icdev init"
      - "icdev enable ace innovation kanban"
      - "icdev profile apply local-dev"
    default_components:
      - ace
      - innovation
      - kanban
    recommended_llm: claude-sonnet-4-6
    min_il: IL2

  compliance:
    display_name: "Compliance Officer"
    description: "FedRAMP + CMMC + NIST crosswalk + STIG automation. Best for compliance teams managing cATOs and control mappings."
    profile: government
    setup_commands:
      - "icdev init"
      - "icdev enable integrity sdc aimc fedramp"
      - "icdev profile apply government"
    default_components:
      - integrity
      - sdc
      - aimc
    recommended_llm: claude-sonnet-4-6
    min_il: IL4

  airgap:
    display_name: "Air-Gapped Deployment"
    description: "Full offline operation with local Ollama LLM. For IL5/IL6 environments with no internet access."
    profile: air-gap
    setup_commands:
      - "icdev init"
      - "icdev enable ndc ohc integrity"
      - "icdev profile apply air-gap"
    default_components:
      - ndc
      - ohc
      - integrity
    recommended_llm: llama3.1:8b
    min_il: IL5
