# CUI // SP-CTI
# Autoresearch Experiment Program — Code Quality Domain
#
# Optimizes maintainability score across the ICDEV™ codebase.
# Modifies tool implementations to reduce complexity, smells, and coupling.

domain: code_quality

objective:
  metric_name: maintainability_score
  direction: maximize
  measurement_command: "python tools/analysis/code_analyzer.py --project-dir tools/ --json"
  metric_path: "summary.maintainability_score"

modifiable_paths:
  - tools/

forbidden_paths:
  - tools/db/storage.py
  - tools/db/init_icdev_db.py
  - tools/genesis/daemon.py
  - tools/autoresearch/
  - .env
  - .claude/

time_budget_seconds: 300
keep_threshold: 0.005  # 0.5% improvement minimum

category_order:
  - architecture
  - function_decomposition
  - smell_removal
  - dead_code

categories:
  architecture:
    description: "Improve module-level structure and coupling"
    risk: medium
    example_hypotheses:
      - "Extract helper functions to reduce cyclomatic complexity"
      - "Reduce import coupling between modules"
  function_decomposition:
    description: "Break long functions into smaller focused units"
    risk: medium
    example_hypotheses:
      - "Split functions exceeding 50 lines into sub-functions"
      - "Extract repeated patterns into shared helpers"
  smell_removal:
    description: "Remove detected code smells"
    risk: low
    example_hypotheses:
      - "Remove god-class patterns by splitting responsibilities"
      - "Reduce parameter counts via config objects"
  dead_code:
    description: "Remove unreachable or unused code"
    risk: low
    example_hypotheses:
      - "Remove functions with zero callers"
      - "Clean up unused imports"
