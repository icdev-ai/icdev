# CUI // SP-CTI — Twin target-environment presets (twx-fed-02)
# Sequoia Patterns 1+5: a twin simulation can be run "against a target
# environment". Each preset bundles a service catalog (CSP + region + region
# scope + classification), a compliance framework, and network constraints
# (air-gap engages the twx-fed-01 rules). The twin then flags any referenced
# service that is NOT available in the target, plus air-gap deployment blockers.
#
# PUBLIC-DATA-ONLY: this file + context/cloud/csp_service_registry.json carry
# only public CSP service-availability facts. Sensitive / classified-region
# catalogs are NOT committed to this PUBLIC repo — set ICDEV_CSP_CATALOG_PATH to
# a customer-side catalog to override at runtime (see target_presets.py).
#
# Staleness (docs risk #1): each preset carries reviewed_at; the twin warns when
# a preset OR the service catalog is older than staleness_warn_days.

staleness_warn_days: 180

# Path to the service capability catalog (public baseline). Overridable at
# runtime via the ICDEV_CSP_CATALOG_PATH env var for customer-side catalogs.
service_catalog: context/cloud/csp_service_registry.json

presets:
  aws_govcloud_west:
    display_name: "AWS GovCloud (US-West)"
    csp: aws
    region: us-gov-west-1
    region_scope: government        # matches csp_service_registry regions.government
    classification: CUI
    compliance_framework: fedramp_high
    network_constraints:
      airgap: false
    reviewed_at: "2026-07-01"

  aws_govcloud_east:
    display_name: "AWS GovCloud (US-East)"
    csp: aws
    region: us-gov-east-1
    region_scope: government
    classification: CUI
    compliance_framework: fedramp_high
    network_constraints:
      airgap: false
    reviewed_at: "2026-07-01"

  aws_govcloud_il5:
    display_name: "AWS GovCloud IL5"
    csp: aws
    region: us-gov-west-1
    region_scope: government
    classification: SECRET
    compliance_framework: fedramp_high
    network_constraints:
      airgap: false
    reviewed_at: "2026-07-01"

  aws_high_side_airgap:
    display_name: "AWS High-Side (air-gapped)"
    csp: aws
    region: us-gov-west-1
    region_scope: government
    classification: SECRET
    compliance_framework: fedramp_high
    network_constraints:
      airgap: true                  # engages twx-fed-01 air-gap rules
    reviewed_at: "2026-07-01"

  azure_gov:
    display_name: "Azure Government"
    csp: azure
    region: usgovvirginia
    region_scope: government
    classification: CUI
    compliance_framework: fedramp_high
    network_constraints:
      airgap: false
    reviewed_at: "2026-07-01"

  azure_gov_il5:
    display_name: "Azure Government IL5"
    csp: azure
    region: usgovvirginia
    region_scope: government
    classification: SECRET
    compliance_framework: fedramp_high
    network_constraints:
      airgap: false
    reviewed_at: "2026-07-01"

  # GCP Assured Workloads (flx-gcp-01). NOTE `region_scope: assured_workloads`,
  # which is NOT a cosmetic label: every GCP entry in
  # context/cloud/csp_service_registry.json carries `govcloud_available: false`
  # and `assured_workloads: true`, so a `government` scope would mark all 8
  # unavailable and a `commercial` one would drop the government question. The
  # scope is read by target_presets._available_in_target.
  #
  # us-central1 matches the floci-gcp emulator's default region, so a delta
  # rehearsed locally is scored against the same region name it was rehearsed
  # under. It is a COMMERCIAL region that Assured Workloads can cover — GCP has
  # no separate GovCloud-style partition, which is the structural difference
  # from the AWS and Azure presets above.
  gcp_assured_workloads:
    display_name: "GCP Assured Workloads (FedRAMP High)"
    csp: gcp
    region: us-central1
    region_scope: assured_workloads
    classification: CUI
    compliance_framework: fedramp_high
    network_constraints:
      airgap: false
    reviewed_at: "2026-09-05"

  # OCI US Government Cloud (flx-oci-01). NOTE what is NOT here: no new
  # `region_scope`. Unlike the GCP preset above, which needed
  # `assured_workloads` because every GCP catalog entry carries
  # `govcloud_available: false`, OCI has REAL dedicated government regions and
  # the catalog already says so — 6 of the 7 OCI entries in
  # context/cloud/csp_service_registry.json carry `govcloud_available: true`
  # with explicit `regions.government` lists. So the existing `government`
  # scope reads correctly and target_presets.py needed no change at all.
  #
  # The one entry that is NOT govcloud-available is `oci_genai` — which is
  # exactly the service ICDEV's only two endpoint-honouring OCI call sites
  # target (tools/llm/oci_genai_provider.py, tools/llm/embedding_provider.py).
  # A delta scored against this preset will mark it unavailable, correctly.
  #
  # THE REGION DELIBERATELY DOES NOT MATCH THE EMULATOR. floci-oci defaults to
  # us-ashburn-1, a COMMERCIAL region, and this preset scores against
  # us-langley-1. That is the point of a target preset rather than a bug: you
  # rehearse a delta locally and score it against where it would actually
  # deploy. The GCP preset could use its emulator's own region only because
  # GCP's government story is an overlay on commercial regions; OCI's is a
  # separate partition, so the two names cannot be the same.
  oci_gov_il5:
    display_name: "OCI US Government Cloud (IL5)"
    csp: oci
    region: us-langley-1
    region_scope: government
    classification: CUI
    compliance_framework: fedramp_high
    network_constraints:
      airgap: false
    reviewed_at: "2026-09-05"
