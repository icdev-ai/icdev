# CUI // SP-CTI
# Red-First Proof Gate (trust-disc-01)
#
# THE POLICY THIS ENCODES
# -----------------------
# ANVIL mandates RED -> GREEN and nothing anywhere records the RED. A process
# instruction whose evidence is never captured is the `|| true` failure of D394
# in a second form: the rule is stated, the artifact proving it fired is absent,
# and no reader can distinguish a check that ran from one that did not.
#
# So the gate re-derives the RED instead of trusting that it happened. For every
# test file this PR adds or modifies it checks out the merge base, applies ONLY
# that test file on top, and runs it. The test must FAIL there and PASS here.
#
#   fails before + passes after  -> discriminating. The RED is recorded.
#   passes before                -> it asserts CURRENT behaviour, not required
#                                   behaviour. It could never have gone red.
#   fails after too              -> it is broken, not red-first.
#
# The decision table is shared with tools/security/reproduction_validator.py
# (decide_discrimination) — the same question in a different domain, answered by
# one primitive so two gates cannot drift apart on it.
#
# Consumed by: tools/ci/red_first_gate.py :: load_config
# Gate source: python tools/ci/red_first_gate.py --gate   (the `test` job)
# Feature doc: docs/features/phase-trust-disc-01-red-first-proof.md
version: 1

# enforce | advisory.
#
# `advisory` runs everything, prints everything and always exits 0. It exists so
# the gate can be MEASURED on a tree before it is armed — the pre_tool_use
# lesson (D394): a check that is nominally enforcing behind something that
# discards its verdict is unmeasured, not proven, and a check armed without a
# fire-rate measurement refuses routine work. Do NOT reach for `advisory` to get
# one commit through; add an exemption with a reason instead.
mode: enforce

# --------------------------------------------------------------------------- #
# SCOPE — which changed files the gate considers a "test file"
# --------------------------------------------------------------------------- #
# Deliberately identical to args/test_gating_gate.yaml -> scope, which is itself
# identical to what pytest collects (pyproject.toml testpaths + python_files).
# Three different answers to "what is a test file" is two too many.
scope:
  roots:
    - tests/
  patterns:
    - "test_*.py"
    - "*_test.py"

# --------------------------------------------------------------------------- #
# APPLICABILITY — a change with no new assertion has no RED to record
# --------------------------------------------------------------------------- #
# Without this the gate fails a docstring fix, an import reorder, or a rename
# inside a test file: those legitimately behave identically before and after, so
# they land in `never_established` and read as "you wrote a worthless test". An
# applicability check with no gate is 100% false positives, and a gate that
# cries wolf gets a `|| true` bolted onto it.
#
# The rule is deliberately crude and readable: the diff for this file must ADD at
# least one line that looks like test logic. It is a floor, not a classifier —
# it decides whether to ASK the question, never what the answer is.
applicability:
  require_added_test_logic: true
  # Substrings; a diff line counts if it is an addition (+) containing any one.
  #
  # Matched against CODE ONLY. The file is tokenised and every COMMENT and
  # STRING (docstrings and f-string literal text included) is blanked out before
  # a marker is compared, so prose never makes a file applicable. Without that,
  # a fixture docstring reading "the tests below assert the identity's tenant"
  # counted as an added assertion — the file was asked a red-first question it
  # had not claimed to answer, passed against the merge base because it added no
  # test logic at all, and was reported as a worthless test. That is the false
  # positive this whole applicability section exists to prevent, reappearing
  # inside it. Real code is untouched: `pytest.raises`, `self.assertEqual`,
  # `@pytest.mark.parametrize` and `def test_` all still match.
  markers:
    - "assert"
    - "pytest.raises"
    - "def test_"
    - "@pytest.mark"
    - "self.assert"
    - "self.fail"

# --------------------------------------------------------------------------- #
# RUN — how each proof is executed
# --------------------------------------------------------------------------- #
run:
  # Per pytest invocation. Two invocations per file (before + after). A test
  # module that cannot finish in this budget is reported `timeout` -> INDECISIVE,
  # which is neither a pass nor a block: we learned nothing, and saying so is the
  # whole point of this task.
  timeout_seconds: 600
  pytest_args:
    - "-q"
    - "--no-header"
    # The merge-base worktree is disposable; a .pytest_cache in it is litter and
    # a cache carried between the two runs would make them not independent.
    - "-p"
    - "no:cacheprovider"
  # A PR touching more than this many test files is proven up to the cap and the
  # remainder is named in the report and printed as a ::warning::. It is NEVER
  # silently truncated — a cap you cannot see reads as "covered everything".
  max_files: 25
  # Lines of pytest output retained per run in the JSON proof. This IS the
  # recorded RED, so it must be enough to read; it is bounded because ICDEV is a
  # public repo and an unbounded dump is exposure, not evidence.
  captured_lines: 40

# --------------------------------------------------------------------------- #
# EXEMPTIONS — a written reason next to the pattern, never a bare count
# --------------------------------------------------------------------------- #
# An exemption says "a red-first proof is not the right question for this file".
# It does NOT say "this file is allowed to be a bad test". Every entry carries
# its reason inline, and `--gate` reports an exemption matching nothing in the
# tree as STALE — a pattern that has quietly stopped matching is how a gate
# shrinks without anyone deciding to shrink it.
#
# There is deliberately no numeric budget here. A count can be held constant
# while the set churns, which is exactly how a gap regrows behind a green gate
# (see args/ci_test_backlog.txt, which is enumerated for the same reason).
exemptions:
  - pattern: "tests/test_proposals_ptw_blackhat_api.py"
    reason: >-
      PURE TEST REPAIR — NO PRODUCTION BEHAVIOUR CHANGED, so nothing here can go
      red. Ten of this file's twenty tests have returned 401 UNAUTHORIZED since
      the day they were written: 90d7b0ecf added
      `@require_role("admin","capture_mgr","pm")` to the proposals write
      endpoints at 19:53, and 146cbb77d added this file at 20:56 the same
      evening on a PARALLEL branch, against a tree that did not yet carry it.
      `git merge-base --is-ancestor` confirms neither is an ancestor of the
      other. Each was green alone; they were jointly broken on merge, and the
      file sits in args/ci_test_backlog.txt so CI has never run it.
      THE RED IS RECORDED, and it is the strongest kind — the file itself,
      unmodified, against main: `pytest tests/test_proposals_ptw_blackhat_api.py`
      on a clean checkout of d4aba1d85 gives "10 failed, 10 passed". The gate
      cannot re-derive that because the FIX is the `g.current_user` fixture,
      which lives IN this test file: applying the file to the merge base applies
      the fix along with it, so it passes there and is reported
      `not_discriminating`.
      The 401s were a REAL GUARD DOING ITS JOB, so the repair authenticates
      rather than relaxing the routes — and seven NEW tests in this file pin the
      guard itself (anonymous -> 401, role=viewer -> 403, GET stays open) so
      that a future "fix" by deleting the decorator turns them red instead of
      green. Those seven assert behaviour main already has, which is the other
      reason this file cannot discriminate.
      Scoped to this ONE file. "A test-only repair" also describes a test
      quietly weakened to match code that broke, and the two are not
      mechanically distinguishable — so this must not become the pattern for the
      next 401 somebody meets in this suite. The file is GATED by the same
      change, so its next regression fails CI within the hour rather than in six
      weeks.
  - pattern: "tests/test_extension_dispatch_governance.py"
    reason: >-
      FORCED FIXTURE RENAME, and the proof lives in a different file rather
      than being absent. hcx-live-gate-01 removed four members from the public
      ExtensionPoint enum. Every use of those four IN THIS FILE was an
      ARBITRARY fixture — the max_handlers bound, the permissive default for an
      undeclared point, the empty-dispatch inventory row, and enabled/disabled
      drop-in loading. None of them is about memory or compliance semantics, so
      each moves to a live point (AGENT_START / AGENT_END) and asserts exactly
      what it asserted before.
      The file therefore CANNOT go red: the swapped version passes against the
      merge base too, because the live points it now names existed there as
      well. It also cannot be left alone — it references removed members, so
      without the rename it fails at collection. A mechanical adaptation that
      is required for the file to run and that changes no claim has no new RED
      to record, which is the same situation the gate already reports as
      `not_applicable` for a docstring-only diff; this diff edits assertion
      ARGUMENTS rather than assertions, so it lands in `not_discriminating`
      instead.
      THE REMOVAL ITSELF IS PROVED, just not here. The RED for this change is
      recorded by tests/test_extension_point_removal_is_contained.py — 8 failed
      / 1 passed against the merge base — which asserts the property that made
      the removal safe: a site-local drop-in naming a removed point is SKIPPED
      with a log line rather than killing the platform at import.
      Scoped to this ONE file, deliberately. "A test-only rename" also
      describes a test quietly weakened to match code that broke, and the two
      are not mechanically distinguishable, so this must not become a pattern
      for the enum's next change.
  - pattern: "tests/test_cpmp_overdue_deliverable_state.py"
    reason: >-
      DETERMINISM FIX, and the proof is structurally impossible rather than
      merely absent. This file took _TODAY as a snapshot at module import while
      production recomputes the date per call, so it went red whenever a run
      straddled midnight UTC — it failed PR #1712 at 00:01:47Z on a change that
      touched nothing in CPMP. The fix freezes the clock, and it lives ENTIRELY
      inside this test file. The gate applies only the changed test file on top
      of the merge base, so applying it also applies the fix: both runs are
      identical by construction, 20 passed either side. No production code
      changed, so there is no pre-change tree in which a correct version of this
      test could fail.
      This exemption does NOT license a vacuous test here. That distinction is
      why it is scoped to this ONE file rather than to test-only changes in
      general: "a test-only PR" also describes a new test that merely asserts
      current behaviour, which is precisely what this gate exists to catch, and
      the two are not mechanically distinguishable. The determinism claim is
      instead proved by a test IN the file — advance the frozen clock one day
      and days_overdue must move 44 -> 45, so a freeze production never reads
      cannot pass.

  - pattern: "tests/e2e_selenium/**"
    reason: >-
      Requires a live dashboard and a Selenium driver, and the module's autouse
      fixture SKIPS the whole file when the port does not answer. Both runs
      would therefore measure the absence of a server rather than the absence
      of a fix, and a skipped module exits 0 — which would read as "passes
      against the merge base", i.e. a fabricated finding. Already excluded from
      the CI gating census for the same reason (args/test_gating_gate.yaml).

  - pattern: "tests/genesis_auto/**"
    reason: >-
      Generated, not hand-written. The file set is controlled by the generator,
      so "did the author write a red-first test" is not a question about this
      PR's author. The right gate for generated tests is a gate on the
      generator, per the same exclusion in args/test_gating_gate.yaml.

  - pattern: "tests/*test_*_smoke.py"
    reason: >-
      A smoke test asserts that something still imports and still answers. That
      is CURRENT behaviour ON PURPOSE, so passing against the merge base is the
      correct outcome for a smoke test, not a defect in it. (`*` crosses `/` in
      this matcher, as in args/test_gating_gate.yaml, so this covers
      tests/test_x_smoke.py and tests/security/test_x_smoke.py alike.)

  - pattern: "tests/cortex/test_search_router.py"
    reason: >-
      DETERMINISM FIX (tsg-iso-02), same shape as the CPMP entry above and
      scoped per-file for the same reason. The fan-out timeout test asserted
      `elapsed < 1.5` after a backend that slept 2.0s: a wall-clock budget that
      tests the RUNNER, not the router. It failed PR #1773 twice on shared CI
      (1.6727s, 1.7075s) while passing three of three locally, and blocked an
      unrelated PR for hours. The fix replaces the clock with a state check —
      the slow backend blocks on a threading.Event the router can never satisfy
      and the test asserts the worker was still inside the adapter when
      search() returned — and it lives ENTIRELY inside this test file. The gate
      applies only the changed test file on top of the merge base, so applying
      it also applies the fix: both runs are identical by construction. No
      production code changed, so there is no pre-change tree in which a
      correct version of this test could fail.
      This does NOT license a vacuous test here, and the file proves that
      itself: test_abandonment_probe_is_not_vacuous drives the SAME
      instrumented backend under a budget it finishes inside, where the router
      awaits it and `finished` IS set at return — so the timeout test's
      `assert not finished_at_return` is discriminating rather than trivially
      true. Measured directly too: patching _run_backends to await the future
      and then drop the late result fails both timeout tests, while the real
      router passes them. Remove this exemption the moment this file is edited
      for anything but that determinism fix.

  - pattern: "tests/cortex/test_search_golden.py"
    reason: >-
      The same determinism fix (tsg-iso-02) applied to the golden suite's copy
      of the fan-out timeout branch — identical `elapsed < 1.5` assertion,
      identical replacement by an abandoned-worker state check, identical
      absence of any production change for a pre-change tree to fail against.
      Non-vacuity is proved by test_abandonment_probe_is_not_vacuous in
      tests/cortex/test_search_router.py, which exercises the same probe
      against a backend the router awaits to completion. Remove this exemption
      the moment this file is edited for anything but that determinism fix.
