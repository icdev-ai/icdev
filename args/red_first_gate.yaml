# CUI // SP-CTI
# Red-First Proof Gate (trust-disc-01)
#
# THE POLICY THIS ENCODES
# -----------------------
# ANVIL mandates RED -> GREEN and nothing anywhere records the RED. A process
# instruction whose evidence is never captured is the `|| true` failure of D394
# in a second form: the rule is stated, the artifact proving it fired is absent,
# and no reader can distinguish a check that ran from one that did not.
#
# So the gate re-derives the RED instead of trusting that it happened. For every
# test file this PR adds or modifies it checks out the merge base, applies ONLY
# that test file on top, and runs it. The test must FAIL there and PASS here.
#
#   fails before + passes after  -> discriminating. The RED is recorded.
#   passes before                -> it asserts CURRENT behaviour, not required
#                                   behaviour. It could never have gone red.
#   fails after too              -> it is broken, not red-first.
#
# The decision table is shared with tools/security/reproduction_validator.py
# (decide_discrimination) — the same question in a different domain, answered by
# one primitive so two gates cannot drift apart on it.
#
# Consumed by: tools/ci/red_first_gate.py :: load_config
# Gate source: python tools/ci/red_first_gate.py --gate   (the `test` job)
# Feature doc: docs/features/phase-trust-disc-01-red-first-proof.md
version: 1

# enforce | advisory.
#
# `advisory` runs everything, prints everything and always exits 0. It exists so
# the gate can be MEASURED on a tree before it is armed — the pre_tool_use
# lesson (D394): a check that is nominally enforcing behind something that
# discards its verdict is unmeasured, not proven, and a check armed without a
# fire-rate measurement refuses routine work. Do NOT reach for `advisory` to get
# one commit through; add an exemption with a reason instead.
mode: enforce

# --------------------------------------------------------------------------- #
# SCOPE — which changed files the gate considers a "test file"
# --------------------------------------------------------------------------- #
# Deliberately identical to args/test_gating_gate.yaml -> scope, which is itself
# identical to what pytest collects (pyproject.toml testpaths + python_files).
# Three different answers to "what is a test file" is two too many.
scope:
  roots:
    - tests/
  patterns:
    - "test_*.py"
    - "*_test.py"

# --------------------------------------------------------------------------- #
# APPLICABILITY — a change with no new assertion has no RED to record
# --------------------------------------------------------------------------- #
# Without this the gate fails a docstring fix, an import reorder, or a rename
# inside a test file: those legitimately behave identically before and after, so
# they land in `never_established` and read as "you wrote a worthless test". An
# applicability check with no gate is 100% false positives, and a gate that
# cries wolf gets a `|| true` bolted onto it.
#
# The rule is deliberately crude and readable: the diff for this file must ADD at
# least one line that looks like test logic. It is a floor, not a classifier —
# it decides whether to ASK the question, never what the answer is.
applicability:
  require_added_test_logic: true
  # Substrings; a diff line counts if it is an addition (+) containing any one.
  #
  # Matched against CODE ONLY. The file is tokenised and every COMMENT and
  # STRING (docstrings and f-string literal text included) is blanked out before
  # a marker is compared, so prose never makes a file applicable. Without that,
  # a fixture docstring reading "the tests below assert the identity's tenant"
  # counted as an added assertion — the file was asked a red-first question it
  # had not claimed to answer, passed against the merge base because it added no
  # test logic at all, and was reported as a worthless test. That is the false
  # positive this whole applicability section exists to prevent, reappearing
  # inside it. Real code is untouched: `pytest.raises`, `self.assertEqual`,
  # `@pytest.mark.parametrize` and `def test_` all still match.
  markers:
    - "assert"
    - "pytest.raises"
    - "def test_"
    - "@pytest.mark"
    - "self.assert"
    - "self.fail"

# --------------------------------------------------------------------------- #
# RUN — how each proof is executed
# --------------------------------------------------------------------------- #
run:
  # Per pytest invocation. Two invocations per file (before + after). A test
  # module that cannot finish in this budget is reported `timeout` -> INDECISIVE,
  # which is neither a pass nor a block: we learned nothing, and saying so is the
  # whole point of this task.
  timeout_seconds: 600
  pytest_args:
    - "-q"
    - "--no-header"
    # The merge-base worktree is disposable; a .pytest_cache in it is litter and
    # a cache carried between the two runs would make them not independent.
    - "-p"
    - "no:cacheprovider"
  # A PR touching more than this many test files is proven up to the cap and the
  # remainder is named in the report and printed as a ::warning::. It is NEVER
  # silently truncated — a cap you cannot see reads as "covered everything".
  max_files: 25
  # Lines of pytest output retained per run in the JSON proof. This IS the
  # recorded RED, so it must be enough to read; it is bounded because ICDEV is a
  # public repo and an unbounded dump is exposure, not evidence.
  captured_lines: 40

# --------------------------------------------------------------------------- #
# EXEMPTIONS — a written reason next to the pattern, never a bare count
# --------------------------------------------------------------------------- #
# An exemption says "a red-first proof is not the right question for this file".
# It does NOT say "this file is allowed to be a bad test". Every entry carries
# its reason inline, and `--gate` reports an exemption matching nothing in the
# tree as STALE — a pattern that has quietly stopped matching is how a gate
# shrinks without anyone deciding to shrink it.
#
# There is deliberately no numeric budget here. A count can be held constant
# while the set churns, which is exactly how a gap regrows behind a green gate
# (see args/ci_test_backlog.txt, which is enumerated for the same reason).
exemptions:
  - pattern: "tests/test_cost_budget_downgrade.py"
    reason: >-
      THE TEST WAS THE DEFECT AND THE CODE IT GUARDS WAS ALWAYS CORRECT, so
      there is no production change for a red-first proof to discriminate
      against. `test_period_start_survives_both_timestamp_spellings` compared
      the LITERALS '2026-08-01 10:00:00' and '2026-07-31 23:59:59' against
      `cost_budget.period_start("monthly")`, which is THIS month's start. The
      assertion held for the whole of August and inverted at midnight on
      2026-09-01 -- `assert '2026-08-01 10:00:00' >= '2026-09-01'` -- taking
      Test, Test (Windows), Test (PostgreSQL) and Test Shard 3 of 4 red on
      every open PR in the repository, none of which touched the file.
      `period_start` itself never changed and is not changed here.
      THE RED IS RECORDED, and by something stronger than a synthetic
      merge-base run: it is failing on `main` RIGHT NOW. `python -m pytest
      tests/test_cost_budget_downgrade.py -k period_start` reproduces it on any
      checkout, on any day that is not in August 2026, and the four red jobs on
      unrelated PRs are its live history.
      Narrowing the assertion's input -- the usual repair when a test fails to
      discriminate -- is exactly what the fix DOES: both samples are now derived
      from the boundary rather than pinned to a month, so the property under
      test (a space-separated timestamp and a full-ISO one both sort correctly
      against a 10-character date prefix, because ' ' sorts below 'T') is
      asserted without also asserting which month it is. A repaired test that
      asserts the same always-correct behaviour necessarily passes against the
      merge base, which is precisely what the gate reports.
  - pattern: "tests/test_aca_xp_ledger.py"
    reason: >-
      THE TEST WAS THE DEFECT, AND THE CODE IT GUARDS WAS ALWAYS CORRECT
      (kpr-extrepo-03), so there is no production change for a red-first proof to
      discriminate against. `test_the_ledger_is_registered_append_only` did
      `block = hook[hook.index("APPEND_ONLY_TABLES"):]` and then
      `assert '"fa_xp_ledger"' in block[:8000]`. `hook.index` returns the FIRST
      TEXTUAL occurrence of the name, which is the module docstring's "See
      APPEND_ONLY_TABLES list in is_append_only_table_modification()" at char
      446; `"fa_xp_ledger"` sits at char 11,656. The gap is 11,210 against an
      8,000-character window, so the assertion measured the distance between a
      sentence and a list and would have failed for any table far enough down it
      WHETHER OR NOT that table was registered. `fa_xp_ledger` is registered, at
      .claude/hooks/pre_tool_use.py:223, and always was -- so the repaired test
      necessarily passes against the merge-base tree too, which is exactly what
      the gate reports.
      THE RED IS RECORDED, just not by this gate: born_red_survey (rem-hyg-14)
      reported the file 21 times from 2026-08-22, its baseline row carries
      first_status=fail / ever_passed=0, and the failure reproduces by hand on
      the main checkout as "1 failed, 14 passed" -> "16 passed", matching the
      detector's own recorded last_detail exactly. That is a stronger artifact
      than a synthetic merge-base run, because it is the defect's real history.
      Narrowing the assertion's input is not available here (the usual repair
      when a test fails to discriminate): the fix removes a WINDOW rather than
      changing what is asserted, and the assertion's subject -- is this table
      registered -- has one true answer on both trees. A second test added
      alongside pins the property the window destroyed: it fails if every entry
      ever fits within 8,000 characters, so the guard cannot silently become
      vacuous. Scoped to this ONE file.
  - pattern: "tests/ci/test_self_root_census.py"
    reason: >-
      A TEST THAT FAILED BECAUSE THE WORK SUCCEEDED, repaired so it cannot do so
      again (xcore-cut-02). `test_known_shapes_in_the_tree` asserted that
      `tools/config/core_profile.py::<module>::BASE_DIR` was PRESENT in the
      census -- a positive control that the scanner detects that shape. This PR
      migrates that exact site onto repo_root(__file__), which is the census's
      entire PURPOSE, so the test failed on success. Every name in the census is
      somebody's future fix; pinning one guarantees a failure each time the
      census drains. The control is now the SHAPE (some entry ends
      `::<module>::BASE_DIR`, some entry contains `::inline-`), which is true on
      BOTH trees by construction and therefore passes at the merge base -- it
      asserts a property of the SCANNER, not a snapshot of the tree. The NEGATIVE
      control is deliberately left exact and unexempted in spirit: storage.py's
      `parents[2]` is the sys.path bootstrap idiom and must never be counted,
      which is a claim about one named file. There is no RED to record because no
      defect was repaired -- six self-root sites were migrated, and the evidence
      for that is the census itself going 1329 -> 1323 with its ceiling lowered
      to match. Scoped to this ONE file.
