      cutover could not carry the shared knowledge graph into ICDEV[FT]. This PR
      deletes tools/fathomdesk and tools/trading, so no FathomDesk source is left
      to co-declare kg_nodes/kg_edges/kg_graphs/trading_daemon_audit and the set
      is empty STRUCTURALLY rather than by measurement. Asserting the four old
      names would assert that the removal never happened. The replacement asserts
      the invariant those exclusions existed to SERVE — nothing outside the ad_
      namespace can reach the export set — which is true both before and after,
      and therefore passes at the merge base BY CONSTRUCTION. The production
