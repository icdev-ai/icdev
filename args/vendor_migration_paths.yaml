# CUI // SP-CTI
# Vendor-to-vendor network device migration paths.
# Add new paths here without touching Python code.
# Fields: id, source_vendor, source_family, target_vendor, target_family,
#         migration_type, complexity (low/medium/high/very_high),
#         estimated_hours, phases[], protocol_notes[], gotchas[]

paths:

  # ── Firewall / NGFW ──────────────────────────────────────────────────────────

  - id: cisco_asa_to_fortinet
    source_vendor: cisco
    source_family: ASA
    target_vendor: fortinet
    target_family: FortiGate
    migration_type: firewall
    complexity: high
    estimated_hours: 40
    phases:
      - name: "Audit & Export"
        description: "Export Cisco ASA running config; document all object-groups, NAT rules, crypto maps."
        order: 1
      - name: "Policy Conversion"
        description: "Convert ASA access-lists to FortiGate firewall policies; map ASA object-groups to FortiGate address objects and service groups."
        order: 2
      - name: "NAT Translation"
        description: "Translate Cisco ASA NAT rules (object NAT and twice NAT) to FortiGate VIP and IP Pool configuration."
        order: 3
      - name: "VPN Migration"
        description: "Migrate site-to-site crypto maps to FortiGate IPSec VPN phase1/phase2 settings; migrate RA VPN to SSL-VPN or IPSec dialup."
        order: 4
      - name: "Parallel Testing"
        description: "Deploy FortiGate in parallel (shadow mode) — shadow traffic using TAP or SPAN; compare log outputs."
        order: 5
      - name: "Cutover"
        description: "Cutover during maintenance window; update upstream routing to point to FortiGate; validate in 15-minute window."
        order: 6
    protocol_notes:
      - "ASA 'inspect' rules have no direct FortiGate equivalent — use FortiGate UTM profiles (IPS/App Control/AV)."
      - "ASA MPF (Modular Policy Framework) maps to FortiGate traffic shaping policies."
      - "ASA identity NAT maps to FortiGate 'set nat disable' on individual policies."
    gotchas:
      - "ASA ACL permit/deny logic is implicit-deny; FortiGate policies must explicitly end with a deny-all."
      - "Cisco ASA uses interface security levels (0-100); FortiGate does not — replace with explicit zone policies."
      - "ASA crypto map sequence numbers must be preserved as separate FortiGate VPN phase1 instances."

  - id: cisco_asa_to_paloalto
    source_vendor: cisco
    source_family: ASA
    target_vendor: paloalto
    target_family: NGFW
    migration_type: firewall
    complexity: high
    estimated_hours: 48
    phases:
      - name: "Config Export & Analysis"
        description: "Export ASA config; run Palo Alto Expedition migration tool to auto-convert access-lists and NAT rules."
        order: 1
      - name: "Zone Design"
        description: "Design Palo Alto security zones to replace ASA interface security levels."
        order: 2
      - name: "Policy Migration"
        description: "Review and clean up Expedition output; resolve any unresolved objects."
        order: 3
      - name: "VPN & NAT"
        description: "Configure GlobalProtect (RA VPN) and IKE/IPSec site-to-site tunnels; configure DNAT/SNAT."
        order: 4
      - name: "Cutover & Validate"
        description: "Cutover and validate using Security Policy Monitor."
        order: 5
    protocol_notes:
      - "Use Palo Alto Expedition (free tool) for automated ASA→PAN-OS conversion."
      - "ASA 'same-security-traffic permit intra-interface' requires Palo Alto intra-zone policies."
    gotchas:
      - "Expedition output requires manual review — address objects and service groups often need cleanup."
      - "ASA identity certificates (PKI) must be re-enrolled on Palo Alto."

  - id: juniper_srx_to_paloalto
    source_vendor: juniper
    source_family: SRX
    target_vendor: paloalto
    target_family: NGFW
    migration_type: firewall
    complexity: medium
    estimated_hours: 32
    phases:
      - name: "Export JunOS Config"
        description: "Export SRX security policy in text format; document zones, address-books, and VPNs."
        order: 1
      - name: "Zone Mapping"
        description: "Map Juniper security zones (trust/untrust/dmz) to Palo Alto security zones."
        order: 2
      - name: "Policy Migration"
        description: "Translate JunOS security policies (from/to zone, match, then) to PAN-OS security rules."
        order: 3
      - name: "VPN Migration"
        description: "Migrate JunOS IKE/IPSec config to PAN-OS IKE Crypto Profiles and Tunnel Interfaces."
        order: 4
      - name: "Cutover"
        description: "Migrate during maintenance window; re-establish BGP sessions if SRX was doing routing."
        order: 5
    protocol_notes:
      - "JunOS address-book entries map 1:1 to PAN-OS address objects."
      - "JunOS application objects have partial equivalents in PAN-OS App-ID signatures."
    gotchas:
      - "JunOS 'reject' action (ICMP unreachable) maps to PAN-OS 'deny' — behavior differs for UDP."
      - "SRX flow-based processing vs PAN-OS session-based — stateful inspection behavior differs slightly."

  - id: checkpoint_to_paloalto
    source_vendor: checkpoint
    source_family: NGFW
    target_vendor: paloalto
    target_family: NGFW
    migration_type: firewall
    complexity: medium
    estimated_hours: 36
    phases:
      - name: "SmartCenter Export"
        description: "Export Check Point policy from SmartCenter as R80+ JSON or use Palo Alto Expedition CP importer."
        order: 1
      - name: "Object Review"
        description: "Review network objects, host objects, and service objects after import."
        order: 2
      - name: "Policy Validation"
        description: "Validate rule order — Check Point top-down evaluation matches PAN-OS first-match."
        order: 3
      - name: "Cutover"
        description: "Perform cutover; update routing; validate with test traffic."
        order: 4
    protocol_notes:
      - "Check Point identity awareness maps to PAN-OS User-ID."
      - "Check Point Content Awareness maps to PAN-OS File Blocking and Data Filtering profiles."
    gotchas:
      - "Check Point rule cleanup mode differs — PAN-OS does not have an equivalent 'cleanup rule' implicit behavior."

  # ── Switching / Routing ──────────────────────────────────────────────────────

  - id: cisco_catalyst_to_arista
    source_vendor: cisco
    source_family: Catalyst
    target_vendor: arista
    target_family: EOS
    migration_type: switch
    complexity: medium
    estimated_hours: 24
    phases:
      - name: "Config Audit"
        description: "Export Cisco Catalyst running-config; document VLANs, STP, LACP, and routing."
        order: 1
      - name: "VLAN & STP"
        description: "Pre-configure VLANs and STP parameters (MSTP) on Arista before cabling."
        order: 2
      - name: "Interface Migration"
        description: "Translate IOS interface syntax (access/trunk/channel-group) to Arista EOS equivalents."
        order: 3
      - name: "Routing Migration"
        description: "Migrate static routes, OSPF, or BGP from IOS to EOS."
        order: 4
      - name: "Cutover"
        description: "Move cables; validate LACP bundles and STP topology; confirm routing table."
        order: 5
    protocol_notes:
      - "Arista EOS CLI is Cisco IOS-like — most commands have direct equivalents."
      - "Arista uses 'ip routing' (same as IOS) to enable L3 routing."
      - "MLAG (Multi-Chassis LAG) replaces Cisco vPC for dual-homing."
    gotchas:
      - "Cisco PVST+ STP maps to Arista Rapid-PVST — validate root bridge election."
      - "Cisco 'switchport nonegotiate' maps to Arista 'no switchport trunk allowed vlan' — double-check trunk handling."

  - id: cisco_nexus_to_arista
    source_vendor: cisco
    source_family: Nexus
    target_vendor: arista
    target_family: EOS
    migration_type: switch
    complexity: high
    estimated_hours: 40
    phases:
      - name: "vPC / MLAG Design"
        description: "Map Cisco vPC domain to Arista MLAG domain; document vPC peer-link and keepalive."
        order: 1
      - name: "VXLAN / BGP-EVPN"
        description: "If Nexus uses VXLAN/BGP-EVPN, map NX-OS EVPN config to Arista EVPN."
        order: 2
      - name: "Interface & Policy"
        description: "Migrate NX-OS interface config, port-channels, and QoS policies."
        order: 3
      - name: "Cutover"
        description: "Migrate per-pod during maintenance windows; validate MLAG and routing convergence."
        order: 4
    protocol_notes:
      - "NX-OS 'feature' commands (enable vlan, enable ospf) are always-on in Arista EOS."
      - "Arista MLAG keepalive uses a dedicated heartbeat link (not a separate VRF like NX-OS)."
    gotchas:
      - "NX-OS VDC (Virtual Device Context) has no Arista equivalent — plan topology changes."
      - "NX-OS TCAM carving may have different defaults in Arista — validate ACL capacity."

  - id: cisco_iosxr_to_juniper_mx
    source_vendor: cisco
    source_family: IOS-XR
    target_vendor: juniper
    target_family: MX
    migration_type: router
    complexity: very_high
    estimated_hours: 80
    phases:
      - name: "Protocol Audit"
        description: "Document all BGP peers, OSPF/IS-IS areas, MPLS LSPs, L3VPN VRFs, and QoS policies on IOS-XR."
        order: 1
      - name: "JunOS Design"
        description: "Design equivalent Juniper MX configuration using hierarchical JunOS syntax."
        order: 2
      - name: "BGP Migration"
        description: "Migrate BGP peers and route-policies; translate IOS-XR RPL to Juniper routing-policies."
        order: 3
      - name: "MPLS / L3VPN"
        description: "Migrate MPLS LDP/RSVP-TE tunnels and L3VPN VRFs (RD/RT) to Juniper routing-instances."
        order: 4
      - name: "QoS"
        description: "Translate IOS-XR QoS policies (class-maps, policy-maps) to Juniper CoS (classifiers, schedulers)."
        order: 5
      - name: "Cutover"
        description: "Parallel run BGP; drain traffic from IOS-XR; cut over during maintenance window."
        order: 6
    protocol_notes:
      - "IOS-XR RPL route-policy translates to Juniper policy-statement."
      - "IOS-XR community-set maps to Juniper community { members []; }."
      - "IOS-XR MPLS TE tunnel attributes map to Juniper LSP rsvp configuration."
    gotchas:
      - "IOS-XR has per-feature commit model; JunOS is single atomic commit — plan rollback strategy."
      - "IOS-XR ISIS NET address format is identical to JunOS NET — can be copied directly."
      - "IOS-XR GRE tunnel syntax differs significantly from JunOS gr- interfaces."

  - id: legacy_cisco_to_sdwan
    source_vendor: cisco
    source_family: ISR
    target_vendor: cisco
    target_family: SD-WAN
    migration_type: sdwan
    complexity: high
    estimated_hours: 60
    phases:
      - name: "vManage Setup"
        description: "Deploy vManage, vBond, and vSmart controllers (cloud or on-prem)."
        order: 1
      - name: "Template Design"
        description: "Build vManage device templates to replace per-device ISR configs."
        order: 2
      - name: "vEdge/ISR4K Onboarding"
        description: "Onboard vEdge or IOS-XE SD-WAN devices via ZTP or manual bootstrap."
        order: 3
      - name: "Policy Migration"
        description: "Migrate QoS, ACL, and routing policies to vManage centralized policies."
        order: 4
      - name: "OMP Convergence"
        description: "Verify OMP route exchange; validate application-aware routing policies."
        order: 5
      - name: "Cutover"
        description: "Cut over circuits per site; verify data-plane connectivity and failover."
        order: 6
    protocol_notes:
      - "OMP (Overlay Management Protocol) replaces traditional BGP/OSPF for WAN overlay routing."
      - "SD-WAN data-plane uses IPSec over DTLS — configure firewall rules for UDP 12346."
    gotchas:
      - "ISR 4K firmware must be updated to IOS-XE 16.12+ for SD-WAN mode."
      - "Existing MPLS circuits can be retained as a transport — SD-WAN integrates MPLS + Internet."

  - id: juniper_ex_to_arista
    source_vendor: juniper
    source_family: EX
    target_vendor: arista
    target_family: EOS
    migration_type: switch
    complexity: medium
    estimated_hours: 28
    phases:
      - name: "VLAN & STP Audit"
        description: "Document all VLAN configurations, STP (RSTP/VSTP) settings, and LAG configurations from JunOS."
        order: 1
      - name: "EOS Pre-staging"
        description: "Pre-configure Arista EOS with VLANs, MLAG (if needed), and IP routing."
        order: 2
      - name: "Interface Migration"
        description: "Translate JunOS interface config (unit 0, family ethernet-switching) to EOS interface config."
        order: 3
      - name: "Cutover"
        description: "Move patch cables; validate STP topology; confirm LACP bundles."
        order: 4
    protocol_notes:
      - "JunOS EX uses 'set vlans' syntax; Arista uses 'vlan <id>' in VLAN database mode."
      - "JunOS 'interface-mode trunk' maps to Arista 'switchport mode trunk'."
    gotchas:
      - "JunOS EX family ethernet-switching stanza must be converted to Arista switchport commands."
      - "JunOS IRB (Integrated Routing and Bridging) maps to Arista 'interface Vlan<id>'."

  - id: brocade_to_cisco_catalyst
    source_vendor: brocade
    source_family: ICX
    target_vendor: cisco
    target_family: Catalyst
    migration_type: switch
    complexity: medium
    estimated_hours: 20
    phases:
      - name: "IronWare Config Export"
        description: "Export Brocade ICX running-config; document VLANs, STP, and port config."
        order: 1
      - name: "Cisco Pre-staging"
        description: "Pre-configure Cisco Catalyst with VLANs and STP before cabling."
        order: 2
      - name: "Interface Translation"
        description: "Translate Brocade IronWare interface syntax to Cisco IOS."
        order: 3
      - name: "Cutover"
        description: "Move cables; validate STP and LACP convergence."
        order: 4
    protocol_notes:
      - "Brocade 'vlan <id> by port' maps to Cisco 'switchport access vlan <id>'."
      - "Brocade LAG (trunk) maps to Cisco port-channel with LACP."
    gotchas:
      - "Brocade ICX uses different spanning-tree terminology — 'rstp' vs Cisco 'spanning-tree mode rapid-pvst'."

  # ── Load Balancers ───────────────────────────────────────────────────────────

  - id: f5_bigiip_to_aws_alb
    source_vendor: f5
    source_family: BIG-IP
    target_vendor: aws
    target_family: ALB/NLB
    migration_type: load_balancer
    complexity: high
    estimated_hours: 48
    phases:
      - name: "VIP & Pool Audit"
        description: "Document all F5 VIPs, pools, health monitors, iRules, and SSL profiles."
        order: 1
      - name: "Target Group Design"
        description: "Design AWS Target Groups and Listener Rules to replace F5 pools and VIPs."
        order: 2
      - name: "iRule Replacement"
        description: "Replace F5 iRules with ALB Listener Rules (path/host routing) and Lambda functions for complex logic."
        order: 3
      - name: "SSL Offload"
        description: "Migrate F5 SSL certificates to AWS ACM; configure ALB HTTPS listeners."
        order: 4
      - name: "Cutover"
        description: "Update DNS to point to ALB FQDN; validate health checks and traffic distribution."
        order: 5
    protocol_notes:
      - "F5 iRules with complex logic (persistence, content rewrite) may require AWS Lambda@Edge."
      - "F5 SNAT pools map to ALB with source IP preservation via proxy protocol v2."
    gotchas:
      - "AWS ALB does not support TCP raw mode — use NLB for non-HTTP workloads."
      - "F5 connection mirroring (HA) is replaced by AWS ALB's built-in redundancy — no migration needed."

  - id: citrix_netscaler_to_f5
    source_vendor: citrix
    source_family: NetScaler
    target_vendor: f5
    target_family: BIG-IP
    migration_type: load_balancer
    complexity: high
    estimated_hours: 56
    phases:
      - name: "nsconfig Export"
        description: "Export NetScaler ns.conf; document vServers, services, service groups, and policies."
        order: 1
      - name: "Virtual Server Mapping"
        description: "Map NetScaler vServers to F5 Virtual Servers; map service groups to pools."
        order: 2
      - name: "Content Switching"
        description: "Translate NetScaler Content Switching policies to F5 iRules or LTM policies."
        order: 3
      - name: "SSL & AppFW"
        description: "Migrate SSL certificates and NetScaler WAF policies to F5 ASM."
        order: 4
      - name: "Cutover"
        description: "Update DNS/routing to F5 VIPs; validate in pre-production then production."
        order: 5
    protocol_notes:
      - "NetScaler GSLB maps to F5 GTM (Global Traffic Manager)."
      - "NetScaler rewrite policies map to F5 iRules using HTTP::header commands."
    gotchas:
      - "NetScaler authentication vServers (LDAP/SAML) require F5 APM licensing."

  # ── Wireless ─────────────────────────────────────────────────────────────────

  - id: cisco_wlc_to_catalyst9800
    source_vendor: cisco
    source_family: WLC
    target_vendor: cisco
    target_family: Catalyst 9800
    migration_type: wireless
    complexity: medium
    estimated_hours: 32
    phases:
      - name: "WLC Config Export"
        description: "Export WLC configuration; document WLANs, RF profiles, flex connect groups, and AAA config."
        order: 1
      - name: "9800 Pre-staging"
        description: "Deploy Catalyst 9800 (physical or virtual); configure basic management and licensing."
        order: 2
      - name: "WLAN Migration"
        description: "Migrate WLANs to 9800 policy profiles and policy tags."
        order: 3
      - name: "AP Migration"
        description: "Re-join APs to 9800 controller (rolling migration — one RF group at a time)."
        order: 4
      - name: "Validate"
        description: "Verify all APs join, clients associate, RADIUS authentication works."
        order: 5
    protocol_notes:
      - "WLC 'WLAN' maps to 9800 'Policy Profile' + 'WLAN Profile' + 'Policy Tag'."
      - "Cisco 9800 uses IOS-XE — familiar CLI for router/switch engineers."
    gotchas:
      - "WLC FlexConnect config maps to 9800 Flex Profile — site tags replace FlexConnect groups."
      - "9800 requires Cisco Smart Licensing — ensure license server connectivity or CSSM setup."

  # ── AAA / Identity ───────────────────────────────────────────────────────────

  - id: cisco_acs_to_ise
    source_vendor: cisco
    source_family: ACS
    target_vendor: cisco
    target_family: ISE
    migration_type: identity
    complexity: high
    estimated_hours: 80
    phases:
      - name: "ACS Policy Export"
        description: "Export ACS network device groups, user groups, RADIUS/TACACS+ policy sets."
        order: 1
      - name: "ISE Node Deployment"
        description: "Deploy ISE primary and secondary nodes; establish replication."
        order: 2
      - name: "Network Device Migration"
        description: "Import network devices (NADs) from ACS to ISE network device repository."
        order: 3
      - name: "Policy Migration"
        description: "Recreate ACS policy elements (condition rules, authorization profiles) in ISE policy sets."
        order: 4
      - name: "Certificate Migration"
        description: "Migrate ACS CA-signed certificates to ISE; update supplicant trust anchors."
        order: 5
      - name: "Parallel Testing"
        description: "Run ISE in shadow mode; compare authentication decisions against ACS."
        order: 6
      - name: "Cutover"
        description: "Update network devices to point to ISE RADIUS/TACACS+ servers; decommission ACS."
        order: 7
    protocol_notes:
      - "ACS RADIUS AVPairs map to ISE RADIUS attribute definitions."
      - "ACS shell profiles (TACACS+) map to ISE TACACS+ command sets and profiles."
    gotchas:
      - "ACS 5.x does not have a direct migration tool to ISE — manual policy recreation is required."
      - "ISE guest portal replaces ACS guest flows — requires Sponsor portal redesign."

  # ── WAN / MPLS → SD-WAN ─────────────────────────────────────────────────────

  - id: legacy_mpls_to_sdwan
    source_vendor: generic
    source_family: MPLS
    target_vendor: generic
    target_family: SD-WAN
    migration_type: wan
    complexity: very_high
    estimated_hours: 120
    phases:
      - name: "WAN Inventory"
        description: "Document all MPLS circuits (bandwidth, latency SLAs, provider, cost); map to sites."
        order: 1
      - name: "SD-WAN Platform Selection"
        description: "Select SD-WAN platform (Cisco Viptela, VMware VeloCloud, Palo Alto Prisma, etc.)."
        order: 2
      - name: "Proof of Concept"
        description: "Deploy SD-WAN at 2-3 pilot sites with DIA (Direct Internet Access) + MPLS dual-transport."
        order: 3
      - name: "Policy Design"
        description: "Design application-aware routing policies; define SLA classes for voice, video, data."
        order: 4
      - name: "Site-by-Site Migration"
        description: "Migrate sites in waves; retain MPLS as backup until SD-WAN is proven at each site."
        order: 5
      - name: "MPLS Decommission"
        description: "Cancel MPLS circuits after 30-90 day SD-WAN validation period per site."
        order: 6
    protocol_notes:
      - "MPLS private routing is replaced by SD-WAN IPSec overlay — all WAN traffic is encrypted."
      - "QoS DSCP markings must be preserved end-to-end — SD-WAN provider must honor DSCP from MPLS."
    gotchas:
      - "MPLS convergence time (<1s) may not be met by SD-WAN failover — test for latency-sensitive apps."
      - "Multicast over MPLS requires SD-WAN multicast support — verify platform capability."
      - "Contract exit clauses for MPLS must be planned 6-12 months in advance."
