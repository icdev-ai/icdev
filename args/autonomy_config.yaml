# CUI // SP-CTI
# Autonomy Engine — Bayesian Trust-Graduated Self-Evolution (Phase 68)
# ICDEV™ earns autonomy through demonstrated safety, not configuration.

classification: "CUI // SP-CTI"
enabled: false
env_override: ICDEV_AUTONOMY_ENABLED

# ---------------------------------------------------------------------------
# Kill Switch (defense in depth — env var + lockfile)
# ---------------------------------------------------------------------------
kill_switch:
  env_var: ICDEV_AUTONOMY_KILL
  lockfile: .tmp/autonomy/kill.lock
  check_interval_seconds: 5

# ---------------------------------------------------------------------------
# Safety Invariants — NEVER autonomous, regardless of trust score
# Checked before every action. Violations logged and blocked unconditionally.
# ---------------------------------------------------------------------------
never_autonomous:
  - delete_production_data        # DROP TABLE, TRUNCATE, DELETE FROM
  - push_to_external_repos        # git push to remote
  - disable_security_gates        # Modify security_gates.yaml to weaken
  - modify_kill_switch            # Alter kill switch mechanism
  - remove_hitl_gates             # Remove human-in-the-loop approval gates
  - bypass_cui_markings           # Skip or remove CUI/classification markings
  - exceed_token_budget           # Exceed configured LLM token limits
  - delete_vcs_repos              # Delete GitHub/GitLab repositories
  - delete_backups                # Delete backup files or backup directories

# ---------------------------------------------------------------------------
# Trust Tiers — unlocked by Bayesian posterior mean
# ---------------------------------------------------------------------------
tiers:
  observer:
    threshold: 0.0
    label: "Observer"
    actions:
      - read_file
      - query_database
      - run_analysis
      - log_finding
      - suggest_action
  contributor:
    threshold: 0.3
    label: "Contributor"
    actions:
      - auto_fix_known_pattern
      - generate_test_stub
      - run_backup
      - run_vacuum
      - commit_safe_fix
  builder:
    threshold: 0.5
    label: "Builder"
    actions:
      - create_tool_module
      - modify_yaml_config
      - commit_to_main
  architect:
    threshold: 0.7
    label: "Architect"
    actions:
      - modify_claude_md
      - modify_goals
      - modify_hardprompts
      - cross_engine_feed
  creator:
    threshold: 0.85
    label: "Creator"
    actions:
      - spawn_child_app
      - self_modify_instruction_set

# ---------------------------------------------------------------------------
# Bayesian Priors — Beta(α, β) per action category
# Lower α/higher β = more cautious start
# ---------------------------------------------------------------------------
priors:
  auto_fix:
    alpha: 5.0
    beta: 5.0
    ceiling: 1.0
    description: "Auto-remediation of known findings"
  create_tool:
    alpha: 2.0
    beta: 8.0
    ceiling: 0.90
    description: "Create new Python tool modules"
  modify_config:
    alpha: 2.0
    beta: 8.0
    ceiling: 0.85
    description: "Modify YAML/JSON configuration files"
  modify_goals:
    alpha: 1.0
    beta: 9.0
    ceiling: 0.80
    description: "Modify goal workflow documents"
  modify_claude_md:
    alpha: 1.0
    beta: 9.0
    ceiling: 0.80
    description: "Modify CLAUDE.md instruction set"
  spawn_child:
    alpha: 1.0
    beta: 14.0
    ceiling: 0.90
    description: "Spawn child applications from demand signals"
  commit_to_main:
    alpha: 3.0
    beta: 7.0
    ceiling: 0.95
    description: "Commit changes directly to main branch"
  cross_engine_feed:
    alpha: 2.0
    beta: 8.0
    ceiling: 1.0
    description: "Auto-route between Innovation/Creative/Research engines"

# ---------------------------------------------------------------------------
# Thompson Sampling — exploration parameters
# ---------------------------------------------------------------------------
thompson_sampling:
  enabled: true
  # Exploration bonus: occasionally try actions above current mean
  # Higher = more exploration, lower = more conservative
  exploration_bonus: 0.0   # Pure Thompson (no bonus needed — sampling does it)
  # Minimum observations before allowing exploration
  min_observations: 3

# ---------------------------------------------------------------------------
# Behavior Learner — calibrate from user responses
# ---------------------------------------------------------------------------
behavior_learner:
  enabled: true
  signals:
    finding_dismissed:
      beta_increment: 0.5     # Partial penalty
      description: "User dismissed a finding"
    finding_acted_on:
      alpha_increment: 1.0    # Full reward
      description: "User acted on finding quickly (<24h)"
    pr_merged:
      alpha_increment: 1.5    # Strong reward
      description: "Autonomy-generated PR merged"
    pr_rejected:
      beta_increment: 2.0     # Strong penalty
      description: "Autonomy-generated PR rejected"
    finding_ignored:
      alpha_increment: 0.0    # Neutral
      beta_increment: 0.0
      description: "Finding ignored >7 days — no signal"
  observation_window_days: 30

# ---------------------------------------------------------------------------
# Engine Federation — auto-routing thresholds
# ---------------------------------------------------------------------------
federation:
  innovation_to_creative:
    min_signal_score: 0.70
    auto_route: true
  creative_to_research:
    min_gap_score: 0.65
    auto_route: true
  research_to_fitness:
    dossier_status: "reviewed"
    auto_route: true
  any_to_build:
    min_spec_score: 0.75
    requires_trust_gate: true   # Must pass Bayesian gate

# ---------------------------------------------------------------------------
# LLM — scanner-tier only (Ollama, zero Claude cost)
# ---------------------------------------------------------------------------
llm:
  tier: scanner
  model: qwen3.5-local
  max_tokens: 4096

# ---------------------------------------------------------------------------
# Scheduling
# ---------------------------------------------------------------------------
scheduling:
  trust_update_interval_seconds: 300  # Re-evaluate trust every 5 min
  federation_check_interval_seconds: 600  # Check cross-engine feeds every 10 min
  behavior_scan_interval_seconds: 3600  # Scan user behavior hourly
