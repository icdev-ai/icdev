# CUI // SP-CTI
# DAT (Diplomatic Analysis & Telemetry) Ingestion Pipeline configuration
# Operator-managed: configure source paths for each data feed.

# ---------------------------------------------------------------------------
# Classification
# ---------------------------------------------------------------------------
classification: CUI
app_name: dat-ingestion-pipeline
version: "1.0.0"

# ---------------------------------------------------------------------------
# State Department cable traffic — CSV files
# ---------------------------------------------------------------------------
state_dept_cables:
  # Directory or single file path. Accepts glob patterns within a directory.
  source_path: "data/dat/state_dept_cables"
  # File extension filter (applied when source_path is a directory)
  file_glob: "*.csv"
  # Expected CSV dialect: 'excel' | 'unix' | 'excel-tab'
  csv_dialect: excel
  # Optional: skip N header rows beyond the first (0 = standard single header)
  extra_header_rows: 0
  # Enabled flag — set false to skip this source without removing config
  enabled: true

# ---------------------------------------------------------------------------
# UNSC meeting schedule — JSON feeds
# ---------------------------------------------------------------------------
unsc_schedule:
  # Directory or single .json file path
  source_path: "data/dat/unsc_schedule"
  file_glob: "*.json"
  # JSONPath-style key for the records array inside each feed file.
  # Use "" (empty) if the top-level value IS the records array.
  records_key: "meetings"
  enabled: true

# ---------------------------------------------------------------------------
# Back-channel communication metadata logs
# ---------------------------------------------------------------------------
backchannel_logs:
  # Directory containing log files (supports nested subdirs)
  source_path: "data/dat/backchannel_logs"
  file_glob: "*.log"
  # Each non-empty, non-comment line counts as one metadata record.
  comment_prefix: "#"
  enabled: true

# ---------------------------------------------------------------------------
# Output
# ---------------------------------------------------------------------------
output:
  # Path for the unified JSON manifest (relative to repo root)
  manifest_path: "data/dat/ingestion_manifest.json"
  # Write manifest to stdout as well (useful for piping)
  also_print: true

# ---------------------------------------------------------------------------
# Audit / persistence
# ---------------------------------------------------------------------------
database:
  # DB file relative to repo root (SQLite default; overridden by ICDEV_STORAGE_BACKEND)
  path: "data/dat.db"
  # Audit log table name
  audit_table: dat_ingestion_log
