# CUI // SP-CTI
# Bayesian Autoresearch Configuration (Phase 67)
#
# Adapts Karpathy's Autoresearch loop (autonomous experiment cycle:
# hypothesize → execute → evaluate → keep/discard) with ICDEV™'s Bayesian
# Teaching Intelligence (information-gain scoring, Thompson Sampling,
# teaching dimension) for self-improving experiments.
#
# ADRs: D-AR-1 through D-AR-10
# Classification: CUI // SP-CTI

classification: "CUI // SP-CTI"

# ── Master Switch ────────────────────────────────────────────────────────────

enabled: false  # Opt-in activation
env_override: ICDEV_AUTORESEARCH_ENABLED

# ── LLM Configuration ───────────────────────────────────────────────────────

llm:
  # D-AR-1: scanner-tier only (zero Claude tokens for hypothesis gen)
  tier: scanner
  model: qwen3.5-local
  max_tokens: 4096
  timeout_seconds: 120
  # Template fallback when LLM unavailable (air-gap safe)
  template_fallback: true

# ── Bayesian Scoring Weights ────────────────────────────────────────────────

scoring:
  # Extends D-BT-2 weights for experiment candidate selection
  weights:
    posterior_shift: 0.30      # How much does this experiment update beliefs?
    discriminability: 0.25     # How well does it distinguish promising regions?
    diversity: 0.25            # How different from recent experiments?
    complexity_match: 0.20     # Is the difficulty appropriate?
  thresholds:
    auto_run: 0.75             # Score >= 0.75: auto-execute
    suggest: 0.50              # Score 0.50-0.75: suggest to human
    exclude: 0.30              # Score < 0.30: skip entirely

# ── Thompson Sampling ────────────────────────────────────────────────────────

thompson_sampling:
  # D-AR-6: explore/exploit via Beta posteriors per experiment category
  enabled: true
  # Minimum observations before relying on posterior (use uniform prior below)
  min_observations: 3
  # Bonus added to exploration score (0.0 = pure Thompson)
  exploration_bonus: 0.0

# ── Deduplication ────────────────────────────────────────────────────────────

dedup:
  # D-AR-5: pgvector cosine > 0.85 rejection, Python cosine fallback
  cosine_threshold: 0.85
  # Also check tsvector full-text overlap
  tsvector_overlap: true
  # SHA-256 content hash for exact-match dedup
  content_hash: true

# ── Experiment Defaults ──────────────────────────────────────────────────────

defaults:
  # D-AR-2: strict time budget per experiment (Karpathy 5-min pattern)
  time_budget_seconds: 300
  # Maximum experiments per single run_loop() invocation
  max_experiments_per_run: 5
  # D-AR-2: minimum improvement to keep (0.5% = 0.005)
  keep_threshold: 0.005
  # Overnight mode: up to 20 experiments
  overnight_max_experiments: 20
  # Require tests to pass before keeping (D-AR-9)
  require_test_pass: true
  # Require coherence check before keeping (D-WF-8)
  require_coherence_check: true

# ── Git Configuration ────────────────────────────────────────────────────────

git:
  # D-AR-3: branch per experiment series, commit/reset pattern
  branch_prefix: autoresearch/
  worktree_base: .tmp/autoresearch/worktrees
  auto_cleanup: true
  # Date-based branch naming (Karpathy pattern)
  branch_naming: "{prefix}{domain}/{date}"

# ── Circuit Breaker ──────────────────────────────────────────────────────────

circuit_breaker:
  # D-AR-10: 3 consecutive failures disables the loop
  max_consecutive_failures: 3
  cooldown_minutes: 60
  auto_reenable: false  # Human must re-enable after trip

# ── Domain Programs ──────────────────────────────────────────────────────────

programs_dir: args/experiment_programs

# Domains available for experimentation
domains:
  - compliance
  - code_quality
  - security
  - rag_quality
  - pulse_quality
  - skill_quality
  - marketplace_asset_quality

# ── Genesis Integration ──────────────────────────────────────────────────────

genesis:
  # D-AR-9: 14th reflex at ORANGE tier
  reflex_name: experiment
  risk_tier: orange
  schedule: "nightly 01:00"
  # Minimum Innovation/Creative/Research signal score to consider
  signal_score_threshold: 0.70
  # Max experiments per reflex invocation
  max_experiments_per_reflex: 3
  # Export results as GKP for promotion
  export_gkp: true

# ── Fitness Evaluator ────────────────────────────────────────────────────────

fitness:
  # D-AR-7: wraps existing tools via subprocess
  subprocess_timeout_seconds: 120
  # Default project_id for compliance/security evaluations
  default_project_id: sparkpilot
  # Default project_dir for code quality evaluations
  default_project_dir: tools/

# ── Experiment Category Dependencies ─────────────────────────────────────────

# Mirrors the optimal_compliance_order() pattern from Bayesian Teaching.
# Architecture changes have 94% explanatory power (arxiv:2603.15916),
# so they should be explored first.
category_dependencies:
  architecture:
    children: [configuration, parameters]
    family: structural
  configuration:
    children: [parameters, thresholds]
    family: behavioral
  parameters:
    children: []
    family: tuning
  thresholds:
    children: []
    family: tuning
  catalog_data:
    children: [crosswalk_coverage]
    family: data
  crosswalk_coverage:
    children: []
    family: data
