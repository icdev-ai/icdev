# CUI // SP-CTI
# OHC — Ops Hub Canvas Configuration
# Feature flag: ICDEV_OPS_HUB_ENABLED=true
# DB: data/ohc_canvas.db (SQLite) or env OHC_STORAGE_BACKEND=postgresql

canvas:
  key: ohc
  name: "Ops Hub Canvas (OHC)"
  route: /ops
  classification: "CUI // SP-CTI"
  feature_flag: ICDEV_OPS_HUB_ENABLED

health:
  probe_interval_seconds: 300    # how often adapter_registry probes all adapters
  persist_health_log: true       # write to ohc_adapter_health_log
  health_log_retention_days: 30  # entries older than N days purged on each probe

# ── Open Source Adapters ──────────────────────────────────────────────────────
oss_adapters:
  mlflow:
    enabled: true
    tracking_uri: ""             # defaults to env MLFLOW_TRACKING_URI or sqlite:///data/mlflow.db
    experiment_name: "icdev-default"

  evidently:
    enabled: true
    report_dir: "data/evidently_reports"
    column_mapping: {}           # column_mapping overrides: {"target": "label", "prediction": "pred"}

  langfuse:
    enabled: false               # requires LANGFUSE_PUBLIC_KEY + LANGFUSE_SECRET_KEY
    host: ""                     # defaults to env LANGFUSE_HOST or https://cloud.langfuse.com
    fetch_limit: 50

  prometheus:
    enabled: false               # set true if Prometheus is available
    base_url: ""                 # defaults to env PROMETHEUS_URL or http://localhost:9090
    pushgateway_url: ""          # defaults to env PROMETHEUS_PUSHGATEWAY_URL or http://localhost:9091
    prom_file_dir: "data/prom"   # air-gap: directory to scan for .prom metric files
    timeout_seconds: 5

  onnx:
    enabled: true
    model_dir: ""                # defaults to env OHC_ONNX_MODEL_DIR or data/onnx_models
    benchmark_runs: 5

  dvc:
    enabled: true                # graceful fallback if dvc not installed
    repo_dir: "."                # DVC repo root

# ── CSP Adapters ─────────────────────────────────────────────────────────────
csp_adapters:
  sagemaker:
    enabled: false               # requires boto3 + AWS credentials
    region: ""                   # defaults to env AWS_DEFAULT_REGION or OHC_AWS_REGION or us-gov-west-1
    profile: ""                  # defaults to env AWS_PROFILE

  azureml:
    enabled: false               # requires azure-ai-ml + Azure credentials
    subscription_id: ""          # defaults to env AZURE_SUBSCRIPTION_ID
    resource_group: ""           # defaults to env AZURE_RESOURCE_GROUP
    workspace_name: ""           # defaults to env AZURE_ML_WORKSPACE

  vertexai:
    enabled: false               # requires google-cloud-aiplatform + GCP credentials
    project: ""                  # defaults to env GOOGLE_CLOUD_PROJECT or OHC_GCP_PROJECT
    location: "us-central1"      # defaults to env VERTEX_AI_LOCATION or OHC_GCP_LOCATION

  bedrock_guardrails:
    enabled: false               # requires boto3 + AWS credentials
    region: ""                   # defaults to env AWS_DEFAULT_REGION or OHC_AWS_REGION or us-gov-west-1

  cloudwatch:
    enabled: false               # requires boto3 + AWS credentials
    region: ""                   # defaults to env AWS_DEFAULT_REGION or OHC_AWS_REGION or us-gov-west-1
    ai_namespaces:
      - AWS/SageMaker
      - AWS/Bedrock
      - AWS/Lambda
      - /aws/sagemaker/TrainingJobs
      - /aws/bedrock/modelInvocations

# ── LLMOps Settings ───────────────────────────────────────────────────────────
llmops:
  drift_threshold: 0.3           # drift_score above this = has_drift flag
  cost_anomaly_multiplier: 2.0   # daily spend > N × rolling avg = anomaly
  gateway_lookback_hours: 24

# ── MLOps Settings ────────────────────────────────────────────────────────────
mlops:
  model_stages:
    - none
    - staging
    - production
    - archived
  experiment_states:
    - active
    - deleted

# ── AIOps Settings ────────────────────────────────────────────────────────────
aiops:
  slo_burn_rate_alert: 2.0       # burn rate above this = at-risk
  spof_min_dependents: 2         # node needs ≥ N dependents to be classified SPOF
  incident_escalation_hours: 4   # open incident > N hours → escalate
