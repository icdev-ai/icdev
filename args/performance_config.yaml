# CUI // SP-CTI
# ICDEV™ GovLift Performance Configuration
# SLA targets, benchmark thresholds, and monitoring parameters
# Drives: tools/govlift/performance_benchmark.py, CI/CD performance gate
# Requirement: workload discovery scanner must scan 1000 servers within 2 hours

govlift:
  scanner:
    # Core SLA (from intake requirement)
    sla_servers: 1000              # target fleet size
    sla_window_hours: 2            # must complete within this window
    sla_derived_rate_per_min: 8.4  # = 1000 / (2 * 60) rounded up

    # Concurrency and batching
    concurrent_workers: 20         # parallel scan threads
    batch_size: 50                 # workloads per batch
    batch_timeout_seconds: 30      # max time per single-server probe

    # Per-operation latency targets (p95)
    latency_p95_ms:
      single_scan: 500             # single workload discovery
      batch_scan: 5000             # 50-workload batch
      summary_query: 200           # get_scanner_summary()
      status_update: 100           # update_workload_status()

    # Load test parameters
    load_test:
      small_fleet: 10              # smoke test
      medium_fleet: 100            # integration gate
      large_fleet: 1000            # full SLA validation (CI optional, nightly)
      ramp_up_seconds: 60

  compliance:
    # NIST 800-53 SA-9 / SI-12 / AU-2 hooks
    audit_performance_events: true
    audit_table: govlift_perf_audit
    retention_days: 90
    classification: "CUI // SP-CTI"
    impact_level: "IL4"

  monitoring:
    # Prometheus / OTEL metrics exported by benchmark tool
    metrics_prefix: "govlift_scanner"
    emit_metrics: true
    alert_thresholds:
      scan_rate_warn_pct: 80       # warn if rate drops below 80% of SLA target
      scan_rate_block_pct: 60      # block pipeline if rate below 60%
      p95_latency_warn_mult: 1.5   # warn if p95 > 1.5x target
      p95_latency_block_mult: 3.0  # block if p95 > 3x target

  security_hardening:
    # NIST 800-53 SC-7 (Boundary Protection), CM-7 (Least Functionality)
    run_as_non_root: true
    read_only_rootfs: true
    resource_limits:
      cpu_max: 4
      memory_max_mb: 2048
      pids_max: 100
    network_policy: "deny-egress-except-dns"
    secrets_in_env: false          # API keys must be injected via secrets manager

  ci_gate:
    # Controls behavior of the CI/CD performance stage
    run_large_fleet_in_ci: false   # large (1000) runs nightly, not on every PR
    fail_on_sla_breach: true
    fail_on_latency_breach: true
    benchmark_timeout_seconds: 300 # CI smoke benchmark must finish in 5 min
    report_path: ".tmp/perf_report.json"
