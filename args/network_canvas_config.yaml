# Network Design Canvas — App Configuration
app:
  name: "Network Design Canvas"
  version: "1.0.0"
  port: 7070
  debug: false
  secret_key: "nc-dev-secret-change-in-prod"
  classification: ""  # Set to e.g. "CUI // SP-CTI" to show a classification banner

database:
  path: "network_canvas.db"
  wal_mode: true
  foreign_keys: true

canvas:
  autosave_delay_ms: 3000
  grid_size: 10
  default_width: 110
  default_height: 60
  max_undo_steps: 50

simulation:
  max_hops: 30
  default_latency_per_hop_ms: 2.3
  load_baseline_pct: 20

export:
  formats:
    - drawio
    - svg
  default_node_width: 120
  default_node_height: 60

templates:
  count: 12
  auto_seed: true

logging:
  level: INFO
  audit_enabled: true

# ── Ingestion pipeline ────────────────────────────────────────────────────
ingestion:
  watch_folder: "data/ndc_inbox"           # Folder watcher directory
  poll_interval_seconds: 30                # How often to scan watch folder
  max_file_size_mb: 50                     # Reject files larger than this
  supported_extensions:
    - .drawio
    - .vdx
    - .svg
    - .pdf
    - .docx
    - .txt
    - .md
    - .csv
    - .xlsx
    - .jpg
    - .jpeg
    - .png
    - .conf
    - .cfg
    - .log
  config_vendor_detection: true            # Auto-detect Cisco/Juniper/generic

# ── NMS adapter connections ───────────────────────────────────────────────
nms:
  default_adapter: netbox
  adapters:
    netbox:
      url: ""                              # Set via .env or here
      token: ""
      poll_interval_minutes: 60
    librenms:
      url: ""
      token: ""
    solarwinds:
      url: ""
      username: ""
      password: ""
