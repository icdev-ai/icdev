# CUI // SP-CTI
# CI Test Gating Gate (tsg-policy-01)
#
# THE POLICY THIS ENCODES
# -----------------------
# A test file that CI never runs has never gated a merge. It can be wrong from
# its first commit and nothing goes red — which is how tsg-dead-01 sat undetected
# for six weeks while `remediation_simulator._run_nqe_layer` was dead, and how 87
# files accumulated 531 failure lines that no pipeline ever saw.
#
# Measured 2026-08-12: 2,150 collectible test modules under tests/, 192 in the CI
# allowlists, 132 excluded by the rules below, 1,826 ungated.
#
# The policy is a RATCHET, not a sweep:
#
#   1. A test file is gated by ADDING it to args/ci_test_files/core.txt in the
#      SAME PR that makes it pass. That is the only sanctioned way to widen the
#      allowlist (what #1526 and #1533 did).
#   2. The 1,826 pre-existing ungated files are grandfathered by NAME in
#      args/ci_test_backlog.txt. They are debt, enumerated so it is countable.
#   3. A test file that is NEW — in neither allowlist, no exclusion below, and not
#      in the backlog census — FAILS the Test job. The gap cannot silently regrow.
#
# Bulk-widening the allowlist is explicitly NOT the policy. Those 1,826 files are
# ungated AND an unknown number are red; adding them wholesale turns main red, the
# gate gets disabled, and that is a worse outcome than the debt.
#
# Full rationale: docs/ci/test-gating-policy.md
#
# Consumed by: tools/ci/gated_test_list.py :: census
# Gate source:  tools/ci/gated_test_list.py --check-coverage  (the `test` job)

# --------------------------------------------------------------------------- #
# SCOPE — which files the census considers a "test file"
# --------------------------------------------------------------------------- #
# Deliberately identical to what pytest itself collects under `testpaths`
# (pyproject.toml -> [tool.pytest.ini_options] testpaths = ["tests"], default
# python_files = test_*.py *_test.py). A census that scoped differently from the
# runner would report coverage over a set nobody runs.
scope:
  roots:
    - tests/
  patterns:
    - "test_*.py"
    - "*_test.py"

# --------------------------------------------------------------------------- #
# EXCLUSIONS — structurally not gateable, and saying so out loud
# --------------------------------------------------------------------------- #
# An exclusion is NOT a backlog entry. The backlog says "should be gated, is not
# yet". An exclusion says "gating this file would not buy a signal". Every entry
# carries the reason, and `--check-coverage` reports an exclusion that matches
# nothing in the tree as STALE — a pattern that has quietly stopped matching is
# how a gate shrinks without anyone deciding to shrink it.
#
# An exclusion is a DEFAULT, not a veto: naming a file in an allowlist gates it
# whatever glob covers it. tsg-gen-01 did exactly that for the two
# tests/genesis_auto/ files whose failures turned out to be real behaviour.
exclusions:
  - pattern: "tests/e2e_selenium/**"
    reason: >-
      Requires a live dashboard at ICDEV_DASHBOARD_URL and a Selenium driver.
      tests/e2e_selenium/conftest.py has a session-scoped autouse fixture that
      SKIPS the whole module unless GET /health reports a checkout_id equal to
      this checkout's (rem-e2e-01 — a port answering is not evidence it serves
      the tree under test), so on a CI runner every one of these reports green
      by skipping. Adding them would grow the
      allowlist by 28 entries and buy exactly zero signal — file existence
      counted as evidence, which is the failure mode this project exists to
      close. They are run deliberately by tools/testing/e2e_runner.py against a
      started server, not by the merge gate.

  - pattern: "tests/genesis_auto/**"
    reason: >-
      Generated, not hand-written: the file SET is controlled by the generator,
      not by a human opening a PR, so a per-file human allowlist is the wrong
      instrument. The right gate for generated tests is a gate on the GENERATOR
      — one that fails when it emits a test asserting a private constant that
      has drifted, instead of emitting 106 files whose ImportError guard catches
      ImportError but not AttributeError.
    review: tsg-gen-02

# --------------------------------------------------------------------------- #
# BACKLOG — the grandfathered census
# --------------------------------------------------------------------------- #
# The file is enumerated rather than counted on purpose. A bare count can be held
# constant while the set churns: fix one file, add one ungated file, count
# unchanged, gate green, gap silently regrown. That is precisely the regression
# this task exists to prevent, so identity is what gets tracked.
backlog_file: args/ci_test_backlog.txt

# Ceiling on the EFFECTIVE backlog (census entries still ungated). It equals the
# count at adoption — no headroom, deliberately, because headroom is room for the
# gap to regrow unobserved.
#
# THIS NUMBER MAY ONLY GO DOWN. Lower it when you gate files; never raise it to
# get a commit through. Raising it is the visible, reviewable act of deciding to
# take on more untested-in-CI surface, and it should be argued for in the PR.
backlog_max: 1741

# --------------------------------------------------------------------------- #
# SKIP CENSUS — a gated test that skips is UNMEASURED, not passing (trust-disc-03)
# --------------------------------------------------------------------------- #
# The block above answers "does CI run this file?". It cannot answer "did the
# file assert anything?", and a skip makes those two different questions. A
# gated, green, every-PR test can be covering nothing:
#
#   SKIPPED [1] tests/test_app.py:46: SQLite test DB lacks platform schema for
#   overview: no such table: agents
#
# That one is live in the tree today. What it was covering is /api/charts/overview
# against the platform schema, and the reason it could not run is that
# MINIMAL_ICDEV_SCHEMA lacked the `classification` column the RLS predicate in
# get_connection() filters on — which turned every read of kanban_tasks into a
# raise. The skip presented that as coverage for an unknown length of time.
#
# Same census discipline as the backlog above, for the same reason: sites are
# ENUMERATED BY NAME in args/ci_skip_census.txt, each with a written reason, and
# the ceiling only ever goes DOWN. A bare count can be held constant while the
# set churns.
#
# Consumed by: tools/ci/skip_census.py :: census
# Gate source:  tools/ci/skip_census.py --check   (the `test` job + .githooks/pre-commit)
skip_census:
  census_file: args/ci_skip_census.txt

  # Ceiling on registered skip sites inside gated test files. Equals the count at
  # adoption — no headroom, deliberately, because headroom is room for unmeasured
  # surface to grow unobserved.
  #
  # THIS NUMBER MAY ONLY GO DOWN. Lower it when you delete a skip and prune its
  # line; never raise it to get a commit through.
  skip_max: 81

  # A reason shorter than this is not a reason. Paired with a placeholder list in
  # tools/ci/skip_census.py (PLACEHOLDER_REASONS) that refuses "flaky", "TBD" and
  # friends — they record that a skip happened, not why it is acceptable.
  min_reason_chars: 12
