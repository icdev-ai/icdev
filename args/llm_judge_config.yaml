# CUI // SP-CTI
# LLM-as-a-Judge Configuration — FORGE Args Layer
# Rubric-based semantic evaluation via Prometheus-2 (local) or Claude (cloud).
# Complements WriteGuard deterministic checks with coherence, persuasiveness,
# specificity, completeness, and audience fit dimensions.

# Judge model (Ollama local — Prometheus-2 purpose-trained evaluator)
# Note: fp16 is 14GB, slow on 8GB VRAM (~50s per eval). Increase timeout accordingly.
model:
  name: "prometheus2-q4"
  provider: ollama
  max_tokens: 1024
  temperature: 0.0          # Deterministic judging
  timeout_seconds: 60       # Q4_K_M is ~3x faster than fp16

# Color rating mapping (FAR 15.305 government source selection)
color_ratings:
  blue:
    label: "Outstanding"
    min_score: 4.5
    description: "Exceeds requirements, innovative, very low risk"
    css_class: "badge-blue-rating"
  purple:
    label: "Good"
    min_score: 3.5
    description: "Meets requirements, beneficial strengths, low risk"
    css_class: "badge-purple-rating"
  green:
    label: "Acceptable"
    min_score: 2.5
    description: "Meets requirements, no significant weakness"
    css_class: "badge-green-rating"
  yellow:
    label: "Marginal"
    min_score: 1.5
    description: "Does not clearly meet requirements, significant weakness"
    css_class: "badge-yellow-rating"
  red:
    label: "Unacceptable"
    min_score: 0.0
    description: "Fails to meet requirements, material deficiency"
    css_class: "badge-red-rating"

# Combined scoring weights
scoring:
  deterministic_weight: 0.50     # WriteGuard (grammar, readability, tone, plagiarism, AI detection)
  llm_judge_weight: 0.50         # LLM judge (coherence, persuasiveness, specificity, etc.)

# Per-content-type settings
content_types:
  blog:
    rubric: "context/writeguard/rubrics/blog.yaml"
    min_writeguard_score: 0.40   # Configurable: skip judge below this (0.0 = always judge)
    auto_rewrite: true
    judge_tier: scanner           # Use local Prometheus-2 only (zero cost)

  proposal_technical:
    rubric: "context/writeguard/rubrics/proposal_technical.yaml"
    min_writeguard_score: 0.50   # Configurable: skip judge below this
    auto_rewrite: true
    judge_tier: scanner
    compliance_downgrade: true    # Configurable: allow judge to downgrade L→M

  proposal_management:
    rubric: "context/writeguard/rubrics/proposal_management.yaml"
    min_writeguard_score: 0.50
    auto_rewrite: true
    judge_tier: scanner
    compliance_downgrade: true

  compliance_narrative:
    rubric: "context/writeguard/rubrics/compliance_narrative.yaml"
    min_writeguard_score: 0.60
    auto_rewrite: false           # Compliance docs need human review
    judge_tier: scanner
    compliance_downgrade: false

# Bias mitigation
bias_mitigation:
  chain_of_thought: true          # Force judge to list positives then negatives before scoring
  few_shot_anchoring: true        # Include 2-3 example evaluations in prompt
  anti_verbosity: true            # Explicitly instruct judge to not favor longer content
  calibration_set_size: 20        # Min examples per rubric for calibration runs

# Audit
audit:
  table: "llm_judge_evaluations"
  append_only: true               # NIST AU-2 compliance
