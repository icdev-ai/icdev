# FathomDesk — MICRO-LIVE preset (Phase 3 rollout)
#
# Tightest possible auto-trading configuration. Use ONLY after a successful
# 30-day paper run (Phase 0). Live trading is gated behind ALPACA_BASE_URL
# pointing at the live endpoint AND ICDEV_TRADING_MODE=micro_live.
#
# Caps:
#   - $5,000 portfolio max
#   - 0.5% per-position cap (~$25 risk per trade)
#   - BUY-only (NO short, NO sell-to-close auto-execution — sells require human approval)
#   - Single trade per ticker per day
#   - Drawdown halt at -1.0% (tighter than default -2.0%)
#
# Operator pre-flight:
#   1. python tools/trading/risk/kill_switch.py --status --json   # must show killed: false
#   2. python tools/trading/brokers/alpaca_adapter.py --account --json  # equity ≥ $5k
#   3. python tools/trading/risk/pdt_tracker.py --json            # allowed: true
#   4. tail -F data/genesis/reports/audit-*.md                    # watch for anomalies

fathomdesk:
  version: "3.0.0-micro-live"
  mode: "live"
  rollout_phase: "micro_live"

  watchlist:
    equities: ["AAPL", "MSFT", "GOOGL", "NVDA", "META"]   # 5 large, deep liquidity only
    crypto: []                                             # disabled in micro-live

  risk:
    max_portfolio_usd: 5000.0
    max_position_pct: 0.005          # 0.5% — single trade ≈ $25
    max_positions: 5
    max_orders_per_day: 5
    max_orders_per_ticker_per_day: 1
    daily_loss_limit_pct: -0.01      # -1% halt (tighter)
    drawdown_warn_pct: -0.005        # -0.5% warn
    drawdown_halt_pct: -0.010        # -1.0% halt
    max_portfolio_var: 0.02

  analysis:
    debate_rounds: 3                  # extra debate round in live mode
    min_confidence: 0.75              # raise from 0.50
    auto_execute: true                # gated by kill_switch + drawdown + PDT
    auto_approve_buy_min_confidence: 0.85   # raise from 0.67
    require_human_approval_for_sell: true   # SELL never auto-executes

  signal_weights:
    fundamental: 0.25
    technical: 0.20
    sentiment: 0.10
    news: 0.10
    macro: 0.25
    perspective: 0.10

  shorting:
    enabled: false                    # disabled in micro-live

  broker:
    provider: "alpaca"
    base_url_env: "ALPACA_BASE_URL"
    require_paper_for_smoke: true
    cancel_open_orders_on_kill: true

  audit:
    persist_every_event: true
    retain_days: 365
