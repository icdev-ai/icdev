# CUI // SP-CTI
# Documented Command Path Gate (oss-fix-02)
#
# A documented command that does not exist is worse than an undocumented one:
# an agent reading the docs will confidently run it and burn a cycle deciding
# whether the tree is broken or the doc is.
#
# Consumed by: tools/workflow/coherence_checker.py :: _load_doc_command_config
# Gate source: tools/workflow/coherence_checker.py :: check_doc_command_paths
#
# Rules:
#   - Any `python tools/...py` or `python -m tools...` invocation in the `docs`
#     files below MUST resolve to a real file, or the gate FAILS.
#   - `grandfathered` entries are DOWNGRADED to a warning so the pre-existing
#     backlog stays visible without blocking unrelated commits.
#   - Do NOT use grandfathering as an escape hatch for new docs. The correct fix
#     for a new broken reference is to build the tool or delete the doc line.
#   - Entries whose target now exists, or that are no longer cited, are reported
#     as stale and should be deleted from this file.
#   - Paths are repo-relative, forward-slash.

#   - Entries may be literal paths or glob patterns. Prefer a pattern for a
#     whole doc surface so a file added later is covered by default.

docs:
  - CLAUDE.md
  - docs/reference/commands.md
  # Capability catalogue (ahx-doc-01). These files were outside the gate, and
  # context/capabilities/harness.yaml consequently advertised three tools —
  # maturity_assessor.py, trace_analyzer.py, exit_criteria_evaluator.py — that
  # existed nowhere in the tree. tools/pulse/engine/capability_scanner.py reads
  # this directory and feeds `article_hooks` into generated content, so an
  # unbacked claim here is publishable. Adding the pattern surfaced no NEW
  # unresolved paths: every one already appears in the grandfather list below.
  - context/capabilities/*.yaml

