# CUI // SP-CTI
# Pulse Article Templates — FORGE Args Layer
# Defines article types, structures, SEO patterns, and CTA blocks.
# Referenced by tools/pulse/engine/drafter.py for template-aware drafting.

templates:
  challenge_solution:
    name: "Challenge-Solution"
    description: >
      Research challenges that ICDEV™ can address, write about those challenges,
      then show the audience how ICDEV™ handles or resolves them.
    word_count_min: 5000
    word_count_max: 6000
    tone: "educational-professional"
    youtube_videos: 2
    sections:
      - id: tldr
        heading: "TL;DR / Executive Summary"
        word_target: 200
        instructions: >
          Dense summary of key takeaways. What challenges exist, why they
          matter, and how ICDEV™ addresses them. No fluff.
          Do NOT include [HERO_IMAGE] — WordPress theme renders the featured image automatically.
        required: true

      - id: introduction
        heading: "Introduction"
        word_target: 400
        instructions: >
          Hook the reader with the core pain point. Use a concrete scenario
          or real-world incident. No filler phrases.
        required: true

      - id: challenges
        heading: "The Challenge"
        word_target: 1500
        instructions: >
          One subsection per pain point from research. Each subsection
          600-800 words with concrete examples, statistics, and real-world
          impact. Use subheadings (### Pain Point Name).
        required: true
        repeatable: true

      - id: solutions
        heading: "How ICDEV™ Addresses These Challenges"
        word_target: 1500
        instructions: >
          For each challenge above, explain how modern teams solve it and
          how ICDEV™'s open-source toolchain provides a concrete solution.
          Reference specific ICDEV™ capabilities (compliance automation,
          agentic AI, DevSecOps, zero trust, SBOM, cATO). Keep it natural
          — educate, don't pitch. Include [VIDEO_EMBED:topic] where a
          walkthrough would add value.
        required: true

      - id: actionable_takeaways
        heading: "Practical Steps You Can Take This Week"
        word_target: 500
        instructions: >
          Numbered, specific actions. Each step should be achievable
          within a week. Include tool recommendations and quick wins.
        required: true

      - id: conclusion
        heading: "Conclusion"
        word_target: 300
        instructions: >
          Forward-looking perspective on where the field is heading.
          Reinforce why addressing these challenges now matters.
        required: true

      - id: cta
        heading: "Get Started"
        word_target: 150
        instructions: >
          Call to action. Link to ICDEV™ GitHub repository.
          Invite readers to explore and contribute.
        required: true

    seo:
      title_format: "{primary_keyword}: {pain_point} — How to Solve It"
      meta_description_format: >
        Learn how to overcome {pain_point} with practical solutions.
        Discover how ICDEV™'s open-source platform automates {capability}.
      keyword_strategy: "pain-point + solution + ICDEV™ capability"
      schema_type: "Article"
      og_type: "article"
      focus_keyphrase: true
      meta_title_max_chars: 60
      meta_description_max_chars: 160
      internal_links_min: 2
      external_links_min: 3
      image_alt_text: true
      structured_data: true

    categories:
      primary_rules: >
        Assign ONE primary category based on article focus:
        - "Compliance & ATO" for authorization, FedRAMP, NIST, cATO topics
        - "DevSecOps" for pipeline security, CI/CD, policy-as-code topics
        - "Security & Zero Trust" for ZTA, threat modeling, SAST topics
        - "AI & Automation" for agentic AI, LLM security, automation topics
        - "Federal IT" for government IT modernization, acquisition topics
        - "Agentic Engineering" for agentic coding, autonomous development, systems that build systems, FORGE, ANVIL topics
      secondary_rules: >
        Assign 1-2 secondary categories if the article spans multiple domains.
        Never assign more than 3 categories total.
      available:
        - slug: compliance-ato
          name: "Compliance & ATO"
          keywords: ["compliance", "authorization", "FedRAMP", "NIST", "cATO", "POAM", "SSP", "STIG", "CMMC"]
        - slug: devsecops
          name: "DevSecOps"
          keywords: ["pipeline", "CI/CD", "DevSecOps", "policy-as-code", "Kyverno", "OPA", "container"]
        - slug: security-zero-trust
          name: "Security & Zero Trust"
          keywords: ["zero trust", "ZTA", "threat", "SAST", "vulnerability", "SBOM", "mTLS"]
        - slug: ai-automation
          name: "AI & Automation"
          keywords: ["AI", "agentic", "LLM", "automation", "machine learning", "ATLAS", "OWASP LLM"]
        - slug: federal-it
          name: "Federal IT"
          keywords: ["federal", "government", "DoD", "acquisition", "IL4", "GovCloud", "modernization"]
        - slug: agentic-engineering
          name: "Agentic Engineering"
          keywords: ["agentic coding", "autonomous development", "systems that build systems", "FORGE", "ANVIL", "AI engineering", "self-assembling software", "code generation", "TDD", "architecture"]
        - slug: market-intelligence
          name: "Market Intelligence"
          keywords: ["trading", "crypto", "equities", "market analysis", "algorithmic trading", "portfolio", "signals", "alpha", "bull", "bear", "stocks", "forex", "sentiment"]

  feature_spotlight:
    name: "Feature Spotlight"
    description: >
      Write about ICDEV™ features, functionalities, and capabilities in an
      educational yet professional format.
    word_count_min: 5000
    word_count_max: 6000
    tone: "educational-professional"
    youtube_videos: 0
    sections:
      - id: tldr
        heading: "TL;DR / Executive Summary"
        word_target: 200
        instructions: >
          What this feature does, why it matters, and who benefits.
          Dense and direct.
          Do NOT include [HERO_IMAGE] — WordPress theme renders the featured image automatically.
        required: true

      - id: introduction
        heading: "Introduction"
        word_target: 400
        instructions: >
          Set the stage: what problem does this feature solve? Why
          should the reader care? Use a concrete scenario.
        required: true

      - id: problem_space
        heading: "Understanding the Problem"
        word_target: 800
        instructions: >
          Educate the reader on the problem domain. Explain concepts,
          standards, or regulations involved. Use analogies and examples
          to make complex topics accessible. Reference industry standards
          (NIST, FedRAMP, CMMC, OWASP) where relevant.
        required: true

      - id: feature_deep_dive
        heading: "How It Works"
        word_target: 1500
        instructions: >
          Detailed walkthrough of the ICDEV™ feature. Include architecture
          overview, key capabilities, configuration options, and
          integration points. Use code snippets, CLI examples, or
          configuration excerpts where they add clarity.
        required: true

      - id: use_cases
        heading: "Real-World Use Cases"
        word_target: 800
        instructions: >
          2-3 concrete scenarios showing the feature in action. Different
          personas (developer, compliance officer, security engineer,
          program manager). Show before/after or time savings.
        required: true

      - id: getting_started
        heading: "Getting Started"
        word_target: 500
        instructions: >
          Step-by-step quickstart guide. Prerequisites, installation,
          first command, expected output. Keep it copy-paste friendly.
        required: true

      - id: best_practices
        heading: "Best Practices and Tips"
        word_target: 400
        instructions: >
          Numbered tips for getting the most out of this feature.
          Common pitfalls to avoid. Integration recommendations.
        required: true

      - id: conclusion
        heading: "Conclusion"
        word_target: 250
        instructions: >
          Recap value proposition. Forward-looking: what's coming next
          for this feature area.
        required: true

      - id: cta
        heading: "Try It Today"
        word_target: 150
        instructions: >
          Call to action. Link to ICDEV™ GitHub repository.
          Invite readers to explore and contribute.
        required: true

    seo:
      title_format: "{feature_name}: {value_proposition}"
      meta_description_format: >
        Discover how ICDEV™'s {feature_name} helps teams {benefit}.
        Learn setup, best practices, and real-world use cases.
      keyword_strategy: "feature name + capability + compliance framework"
      schema_type: "TechArticle"
      og_type: "article"
      focus_keyphrase: true
      meta_title_max_chars: 60
      meta_description_max_chars: 160
      internal_links_min: 2
      external_links_min: 3
      image_alt_text: true
      structured_data: true

    categories:
      primary_rules: >
        Assign ONE primary category based on the feature's domain:
        - "Compliance & ATO" for authorization, FedRAMP, NIST, cATO features
        - "DevSecOps" for pipeline security, CI/CD, policy-as-code features
        - "Security & Zero Trust" for ZTA, threat modeling, SAST features
        - "AI & Automation" for agentic AI, LLM security, automation features
        - "Federal IT" for government IT modernization, acquisition features
        - "Agentic Engineering" for agentic coding, autonomous development, systems that build systems features
      secondary_rules: >
        Assign 1-2 secondary categories if the feature spans multiple domains.
        Never assign more than 3 categories total.
      available:
        - slug: compliance-ato
          name: "Compliance & ATO"
          keywords: ["compliance", "authorization", "FedRAMP", "NIST", "cATO", "POAM", "SSP", "STIG", "CMMC"]
        - slug: devsecops
          name: "DevSecOps"
          keywords: ["pipeline", "CI/CD", "DevSecOps", "policy-as-code", "Kyverno", "OPA", "container"]
        - slug: security-zero-trust
          name: "Security & Zero Trust"
          keywords: ["zero trust", "ZTA", "threat", "SAST", "vulnerability", "SBOM", "mTLS"]
        - slug: ai-automation
          name: "AI & Automation"
          keywords: ["AI", "agentic", "LLM", "automation", "machine learning", "ATLAS", "OWASP LLM"]
        - slug: federal-it
          name: "Federal IT"
          keywords: ["federal", "government", "DoD", "acquisition", "IL4", "GovCloud", "modernization"]
        - slug: engineering
          name: "Engineering"
          keywords: ["architecture", "code quality", "testing", "TDD", "MBSE", "digital thread"]
        - slug: market-intelligence
          name: "Market Intelligence"
          keywords: ["trading", "crypto", "equities", "market analysis", "algorithmic trading", "portfolio", "signals", "alpha", "bull", "bear", "stocks", "forex", "sentiment"]

  market_analysis:
    name: "Market Analysis Report"
    description: >
      AI-generated trading analysis combining fundamental, technical,
      sentiment, and news analysis with multi-agent bull/bear debate synthesis.
      Published by FathomDesk trading intelligence platform.
    word_count_min: 2000
    word_count_max: 3000
    tone: "analytical-professional"
    youtube_videos: 0
    sections:
      - id: executive_summary
        heading: "Executive Summary"
        word_target: 200
        instructions: >
          Dense summary: ticker, direction, conviction level, key catalysts.
        required: true
      - id: market_context
        heading: "Market Context"
        word_target: 300
        instructions: >
          Current market conditions, sector performance, macro backdrop.
        required: true
      - id: analysis_findings
        heading: "Analysis Findings"
        word_target: 600
        instructions: >
          Fundamental, technical, sentiment, and news analysis results.
          Include key metrics (P/E, RSI, sentiment score).
        required: true
        repeatable: true
      - id: bull_bear_debate
        heading: "Bull vs Bear Debate"
        word_target: 400
        instructions: >
          Summarize the multi-agent debate: bull thesis, bear thesis,
          key counterarguments, and consensus outcome.
        required: true
      - id: trade_recommendation
        heading: "Trade Recommendation"
        word_target: 200
        instructions: >
          Signal direction, entry price, stop loss, target, position sizing.
        required: true
      - id: risk_factors
        heading: "Risk Factors"
        word_target: 200
        instructions: >
          Key risks: earnings, macro events, sector rotation, liquidity.
        required: true
      - id: disclaimer
        heading: "Disclaimer"
        word_target: 100
        instructions: >
          Standard financial disclaimer: not investment advice, paper trading only,
          past performance does not guarantee future results.
        required: true
    seo:
      title_format: "{ticker} Analysis: {direction} Signal — FathomDesk"
      meta_description_format: >
        Multi-agent AI analysis of {ticker}: fundamental, technical, sentiment
        analysis with bull/bear debate. Signal: {direction}.
      keyword_strategy: "ticker + analysis type + signal direction"
      schema_type: "Article"
      og_type: "article"
    categories:
      primary_rules: >
        Always assign "Market Intelligence" as primary category.
      secondary_rules: >
        Optionally assign "AI & Automation" as secondary.
      available:
        - slug: market-intelligence
          name: "Market Intelligence"
          keywords: ["trading", "crypto", "equities", "market analysis", "algorithmic trading", "portfolio", "signals"]

# Shared configuration
defaults:
  github_url: "https://github.com/icdev-ai"
  site_url: "https://icdev.ai"
  site_domain: "icdev.ai"
  author: "ICDEV™ Team"
  cta_links:
    github: "https://github.com/icdev-ai"

# YouTube search configuration
youtube:
  videos_per_article: 2
  search_suffixes:
    - "tutorial"
    - "explained"
    - "guide"
  preferred_channels: []
  max_age_days: 365

# Video generation configuration (LTX-Video 2B on RTX 4060)
video_generation:
  enabled: true
  model: "Lightricks/LTX-Video"            # HuggingFace model ID
  variant: "ltxv-2b-0.9.8-distilled"       # 2B param distilled model
  width: 704                                # Divisible by 32
  height: 480                               # Divisible by 32
  fps: 24
  num_frames: 97                            # Divisible by 8 + 1, ~4s at 24fps
  steps: 20                                 # Inference steps (distilled: 20)
  guidance_scale: 7.5                       # CFG scale
  min_vram_gb: 6.0                          # Minimum VRAM requirement
  fallback: "animated_svg"                  # SVG fallback when no GPU

# Cross-linking configuration (internal Pulse article links)
cross_linking:
  enabled: true
  min_keyword_overlap: 1                    # Minimum word overlap to consider relevant
  max_links_per_article: 1                  # Number of cross-links to inject
  position: "before_conclusion"             # Where to inject: before_conclusion | end

# SAM.gov → Pulse Article Bridge
# Extracts pain points from federal solicitations, generates evergreen articles.
sam_bridge:
  enabled: true
  schedule: "weekly"                 # daily | weekly | on_scan
  min_description_length: 200       # Skip opportunities with short descriptions
  max_articles_per_run: 5           # Cap to avoid flooding
  auto_rewrite: true                # Auto-fix WriteGuard issues via Claude Sonnet
  template_type: "challenge_solution"

  # Pain point extraction (deterministic regex, zero LLM)
  extraction:
    shall_patterns:
      - "shall\\b"
      - "must\\b"
      - "required to\\b"
      - "contractor will\\b"
      - "vendor shall\\b"
      - "will provide\\b"
      - "will deliver\\b"
      - "will maintain\\b"
      - "is responsible for\\b"
    challenge_keywords:
      # Security & compliance
      - "cybersecurity"
      - "compliance"
      - "authorization"
      - "zero trust"
      - "FedRAMP"
      - "CMMC"
      - "ATO"
      - "accreditation"
      - "vulnerability"
      - "incident response"
      - "STIG"
      - "encryption"
      - "FIPS"
      - "PKI"
      - "CAC"
      - "penetration testing"
      - "continuous monitoring"
      - "supply chain"
      - "SBOM"
      - "post quantum"
      - "cryptography"
      # DevSecOps & engineering
      - "DevSecOps"
      - "DevOps"
      - "CI/CD"
      - "pipeline"
      - "container"
      - "kubernetes"
      - "microservice"
      - "agile"
      - "software development"
      - "software engineering"
      - "code review"
      - "testing"
      # AI & data
      - "artificial intelligence"
      - "machine learning"
      - "AI"
      - "data analytics"
      - "data integration"
      - "data lake"
      - "data warehouse"
      - "ETL"
      - "NLP"
      - "deep learning"
      # Cloud & infrastructure
      - "cloud migration"
      - "cloud"
      - "AWS"
      - "Azure"
      - "GovCloud"
      - "SaaS"
      - "IaaS"
      - "PaaS"
      - "serverless"
      - "infrastructure"
      # Modernization & management
      - "modernization"
      - "automation"
      - "legacy system"
      - "digital transformation"
      - "enterprise"
      - "IT services"
      - "information technology"
      - "network"
      - "system integration"
      - "EHR"
      - "health IT"
      - "logistics"
      - "surveillance"
      - "intelligence"
      - "command and control"
      - "C2"
      - "mission critical"
      - "wayfinding"
      - "geospatial"
      - "spectrum"
      - "airspace"

  # Domain classification → evergreen article angle
  domain_angles:
    devsecops: "DevSecOps Pipeline Challenges in Federal IT"
    ai_ml: "AI and ML Governance in Federal Systems"
    ato_rmf: "Authorization and Compliance Gaps in Government Software"
    cloud: "Cloud Migration and Security for Federal Agencies"
    security: "Cybersecurity and Zero Trust in Government"
    compliance: "Multi-Framework Compliance Challenges"
    data: "Data Integration and Modernization in the Public Sector"
    management: "Program Management in Digital Transformation"

  # Deduplication thresholds
  dedup:
    similarity_threshold: 0.6       # >60% keyword overlap = duplicate
    lookback_days: 90               # Check articles from last N days

  # Filters (empty = use govcon_config.yaml defaults)
  filters:
    naics_codes: []
    keywords: []
    agencies: []
    notice_types: "o,p,r,s,k"

# Capability Catalog — injects ICDEV™ capability context into articles
# D-PULSE-CAP-1: YAML files in context/capabilities/ (FORGE context layer)
# D-PULSE-CAP-4: Deterministic keyword matching (zero LLM)
capability_catalog:
  enabled: true
  context_dir: "context/capabilities"
  max_per_article: 5
  scoring:
    exact_keyword: 3
    partial_keyword: 1
    framework_match: 2
