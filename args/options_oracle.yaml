# Options Oracle — auto-trade configuration
# All thresholds apply to BOTH paper and live modes.
# Set mode: live only after validating paper results for >= 2 weeks.

mode: paper          # paper | live

entry_rules:
  min_edge: 0.65           # combo_analyzer edge_score floor (IV-aware weighted)
  min_pnl_ratio: 0.20      # slippage-adjusted expected_pnl / max_loss floor (20%)
  min_pop: 55.0            # probability of profit floor (%)
  max_positions: 10        # max concurrent open oracle positions
  max_qty_per_ticker: 2    # contracts per leg per ticker
  max_notional_exposure: 0 # 0 = disabled; set e.g. 50000 to cap total abs(entry_net_debit) across all open positions
  block_on_earnings: true  # skip tickers with earnings within 3d or before expiry
  block_regimes:           # regimes where new entries are blocked
    - DANGER
    - CRISIS
  slippage_pct: 1.0        # haircut on expected_pnl to model real fill costs (%)

exit_rules:
  regime_exit: true              # close positions when regime turns against signal
  regime_exit_triggers:          # regimes that trigger directional conflict exits
    - DANGER
    - CRISIS
  full_exit_regimes:             # regimes that close ALL positions (not just directional conflicts)
    - CRISIS
  take_profit_pct: 50.0              # close when unrealized P&L >= 50% of TP anchor
  take_profit_use_expected_pnl: true # anchor on expected_pnl at entry (better for spreads); false = use max_profit
  take_profit_dte: 21               # also close profitable positions when DTE <= 21 (theta lock-in); 0 = disabled
  stop_loss_pct: 100.0              # close when loss >= 100% of theoretical max_loss (defined-risk)
  naked_stop_loss_multiplier: 2.0   # undefined-risk (naked): stop at 2× net_debit collected
  dte_exit: 2                       # close when days-to-expiry <= 2 (gamma risk zone)

scanner:
  top_n: 25                    # candidates to score per genesis run
  min_pnl_ratio: 0.08          # pre-filter before oracle rules (wider net)
  max_workers: 4               # reduced from 6 — fewer concurrent yfinance requests
  worker_delay_sec: 0.5        # stagger delay between worker fetches to avoid 429
  fetch_timeout_sec: 30        # per-ticker yfinance timeout (prevents hangs)

genesis:
  scan_and_enter_interval_min: 30   # run scanner + entry logic every 30 min
  regime_exit_interval_min: 5       # check regime exits every 5 min
  position_monitor_interval_min: 15 # monitor P&L / stops every 15 min
  market_hours_only: true           # scan_and_enter + position_monitor skip off-hours
