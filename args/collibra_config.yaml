# CUI // SP-CTI
# Collibra Data Intelligence Cloud — DDC lineage import configuration
# Used by: tools/data_canvas/sync/collibra_import.py
#
# Override any value with the corresponding ICDEV_COLLIBRA_* environment variable.
# Environment variables always win over this file.

collibra:
  # Base URL for your Collibra instance (no trailing slash)
  # Example: https://your-tenant.collibra.com
  # Env: ICDEV_COLLIBRA_URL
  url: ""

  # Service account credentials (basic auth)
  # Env: ICDEV_COLLIBRA_USERNAME / ICDEV_COLLIBRA_PASSWORD
  username: ""
  password: ""

  # Bearer token (token auth — takes precedence over basic auth if set)
  # Env: ICDEV_COLLIBRA_TOKEN
  token: ""

  # HTTP request timeout in seconds
  # Env: ICDEV_COLLIBRA_TIMEOUT
  timeout: 15

  # Optional: scope asset search to a specific Collibra community UUID.
  # Leave empty to search all communities.
  # Env: ICDEV_COLLIBRA_COMMUNITY_ID
  community_id: ""

  # Default CUI/IL classification applied to every imported lineage edge.
  # Collibra asset attributes override this per-edge when classification
  # metadata is present on the source asset.
  # Valid values: PUBLIC | FOUO | CUI | SECRET | TS/SCI
  # Env: ICDEV_COLLIBRA_CLASSIFICATION
  default_classification: "CUI"
