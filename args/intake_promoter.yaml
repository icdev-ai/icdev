# CUI // SP-CTI
# Config for tools/requirements/intake_kanban_promoter.py
# Controls how SAFe decomposition items are promoted to kanban_tasks.

default_task_type: build
classification: "CUI // SP-CTI"
max_per_run: 100

# WSJF score thresholds for priority assignment
priority_thresholds:
  high: 75
  medium: 50
  # below medium -> low

# Map SAFe decomposition level -> kanban task_type
level_type_map:
  epic: research
  capability: research
  feature: build
  story: build
  enabler: chore

# Promoted items get status='suggested' and scheduled_at=now so the
# scheduler picks them up immediately for user review on the Kanban board.
promoted_status: suggested
