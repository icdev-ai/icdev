# CUI // SP-CTI
# Boundary Design Canvas — Configuration
app:
  name: "Boundary Design Canvas"
  version: "1.0.0"
  classification: "CUI // SP-CTI"

database:
  path: "bdc_canvas.db"
  wal_mode: true
  foreign_keys: true

canvas:
  autosave_delay_ms: 3000
  grid_size: 10
  default_width: 110
  default_height: 60
  accent_color: "#9c27b0"

uqs:
  weights:
    boundary_integrity: 0.30
    security_posture: 0.25
    compliance_readiness: 0.25
    isa_health: 0.10
    documentation: 0.10
  thresholds:
    merge: 70
    deploy: 80
    release: 85
  grade_scale:
    A: 90
    B: 80
    C: 70
    D: 60

assessment:
  auto_assess_on_save: true
  default_rules:
    - BDC-BND-001  # ATO boundary defined
    - BDC-BND-002  # All systems inside boundary
    - BDC-BND-003  # Zero-trust segmentation gateway configured
    - BDC-ISA-001  # ISA agreements present
    - BDC-ISA-002  # ISA not expired
    - BDC-ISA-003  # Cross-domain solution for cross-boundary flows
    - BDC-CTL-001  # Firewall at boundary
    - BDC-CTL-002  # IDS/IPS at boundary
    - BDC-CTL-003  # SIEM at boundary
    - BDC-SC-001   # SBOM present (NIST 800-161)
    - BDC-SC-002   # Section 889 vendor check complete
    - BDC-SC-003   # Dependency CVE blast-radius analyzed
    - BDC-DOC-001  # SSP documentation exists
    - BDC-DOC-002  # ATO documentation complete
    - BDC-PPS-001  # PPS matrix generated
    - BDC-PPS-002  # Data flow diagram across boundary
    - BDC-ZTA-001  # Policy enforcement point (PEP) defined
    - BDC-ZTA-002  # Policy decision point (PDP) defined
  thresholds:
    min_score: 70
    cat1_max: 0
    cat2_max: 5

gates:
  bdc_sast:
    tool: "tools/security/sast_runner.py"
    blocking: true
    dimension: security_posture
  bdc_sbom:
    tool: "tools/compliance/sbom_generator.py"
    blocking: true
    dimension: boundary_integrity
  bdc_compliance:
    tool: "tools/compliance/multi_regime_assessor.py"
    blocking: false
    dimension: compliance_readiness
  bdc_stig:
    tool: "tools/compliance/stig_checker.py"
    blocking: true
    dimension: compliance_readiness
  bdc_diagram:
    tool: "tools/compliance/diagram_validator.py"
    blocking: false
    dimension: documentation
  bdc_health:
    tool: "tools/monitor/health_checker.py"
    blocking: false
    dimension: security_posture

isa:
  expiry_warning_days: 60
  expiry_critical_days: 30
  auto_pps_generation: true

supply_chain:
  enabled: true
  sbom_format: "cyclonedx"
  vex_enabled: true
  section_889_check: true

evidence:
  format: "oscal_json"
  retention_days: 365
  auto_emit: true

runbooks:
  auto_execute_confidence: 0.7
  max_auto_per_hour: 5
  cooldown_seconds: 600

templates:
  count: 6
  auto_seed: true

agent:
  auto_trigger_on_canvas_save: true
  auto_trigger_sdc_on_save: true
  auto_trigger_qdc_on_save: true
  cross_canvas_sync: true

logging:
  level: INFO
  audit_enabled: true

# cATO Digital Twin (tools/boundary_canvas/twin.py) — bdr-sec-4
twin:
  # Real LLM Chain-of-Debate for what-if simulation. OFF by default: the default
  # simulate path is a deterministic heuristic (labelled method="heuristic").
  # When enabled, simulate_delta(use_cod=True) calls the LLM router; on any LLM
  # failure it falls back to the heuristic path.
  chain_of_debate:
    enabled: false
    llm_function: reasoning
  # Readiness rating-band thresholds (fraction of controls satisfied). Kept here
  # so twin.py carries no magic compliance constants.
  rating_bands:
    green: 0.8
    amber: 0.5
