# FathomDesk — SCALE-100K preset (Phase 4 tier 3)
#
# Full deployment tier. Enables SHORTs (gated by locate availability).
# Promotes from scale_25k after ≥1 month clean execution + favorable Sharpe.

fathomdesk:
  version: "4.0.0-scale-100k"
  mode: "live"
  rollout_phase: "scale_100k"

  watchlist:
    equities: ["AAPL", "MSFT", "GOOGL", "NVDA", "META", "AMZN", "TSLA", "AVGO", "AMD", "NFLX",
               "JPM", "BAC", "V", "MA", "UNH", "JNJ", "XOM", "CVX", "WMT", "COST"]
    crypto: ["BTC/USD", "ETH/USD"]

  risk:
    max_portfolio_usd: 100000.0
    max_position_pct: 0.030          # 3.0%
    max_positions: 25
    max_orders_per_day: 30
    max_orders_per_ticker_per_day: 3
    daily_loss_limit_pct: -0.020
    drawdown_warn_pct: -0.010
    drawdown_halt_pct: -0.020
    max_portfolio_var: 0.040

  analysis:
    debate_rounds: 2
    min_confidence: 0.60
    auto_execute: true
    auto_approve_buy_min_confidence: 0.70
    require_human_approval_for_sell: false

  signal_weights:
    fundamental: 0.20
    technical: 0.25
    sentiment: 0.15
    news: 0.10
    macro: 0.20
    perspective: 0.10

  shorting:
    enabled: true                     # ENABLED at this tier
    require_locate: true              # broker must confirm borrow availability
    composite_threshold: 30
    min_confidence: 0.75
    max_short_position_pct: 0.015     # 1.5% per short
    max_total_short_exposure: 0.20    # 20% of portfolio
    margin_multiplier: 1.5

  broker:
    provider: "alpaca"
    base_url_env: "ALPACA_BASE_URL"
    cancel_open_orders_on_kill: true

  audit:
    persist_every_event: true
    retain_days: 2555    # 7 years (compliance retention)
