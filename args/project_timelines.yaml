# CUI // SP-CTI
# Default 18-month project PI timeline template.
#
# Contract award → 18 months total, 9 Program Increments (PIs),
# 2 months per PI.
#
# Phase groups:
#   discovery_planning       — PI 1-3  (months 1-6)
#   execution                — PI 4-6  (months 7-12)
#   dashboard_integrations   — PI 7-9  (months 13-18)

name: "18-Month Contract Timeline"
description: "Standard 18-month delivery timeline from contract award through PI 9"
total_months: 18
pis_per_group: 3
months_per_pi: 2

phase_groups:
  discovery_planning:
    label: "Discovery & Planning"
    color: "#58a6ff"
    description: "Requirements gathering, architecture design, and compliance baseline"
    month_range: [1, 6]

  execution:
    label: "Execution"
    color: "#3fb950"
    description: "Core development, testing, and iterative delivery"
    month_range: [7, 12]

  dashboard_integrations:
    label: "Dashboard & Integrations"
    color: "#a371f7"
    description: "Dashboard build-out, system integration, and operational handoff"
    month_range: [13, 18]

timeline:
  - pi_number: "PI-1"
    pi_name: "Requirements & Architecture"
    pi_theme: "Discovery"
    phase_group: "discovery_planning"
    month_start: 1
    month_end: 2
    milestones:
      - "Contract award & kickoff"
      - "Stakeholder alignment"
      - "High-level architecture"

  - pi_number: "PI-2"
    pi_name: "Compliance Baseline"
    pi_theme: "Planning"
    phase_group: "discovery_planning"
    month_start: 3
    month_end: 4
    milestones:
      - "NIST 800-53 control selection"
      - "Initial SSP draft"
      - "Risk assessment"

  - pi_number: "PI-3"
    pi_name: "Design & Prototyping"
    pi_theme: "Planning"
    phase_group: "discovery_planning"
    month_start: 5
    month_end: 6
    milestones:
      - "Detailed design reviews"
      - "Prototype validation"
      - "PI planning for execution phase"

  - pi_number: "PI-4"
    pi_name: "Core Development Sprint 1"
    pi_theme: "Execution"
    phase_group: "execution"
    month_start: 7
    month_end: 8
    milestones:
      - "Feature development begins"
      - "CI/CD pipeline operational"
      - "Sprint 1-3 delivery"

  - pi_number: "PI-5"
    pi_name: "Core Development Sprint 2"
    pi_theme: "Execution"
    phase_group: "execution"
    month_start: 9
    month_end: 10
    milestones:
      - "Sprint 4-6 delivery"
      - "Security scanning integration"
      - "STIG baseline assessment"

  - pi_number: "PI-6"
    pi_name: "Testing & Hardening"
    pi_theme: "Execution"
    phase_group: "execution"
    month_start: 11
    month_end: 12
    milestones:
      - "Integration testing complete"
      - "IV&V engagement"
      - "Pre-production readiness"

  - pi_number: "PI-7"
    pi_name: "Dashboard Development"
    pi_theme: "Dashboard"
    phase_group: "dashboard_integrations"
    month_start: 13
    month_end: 14
    milestones:
      - "Dashboard wireframes approved"
      - "Visualization components built"
      - "User acceptance testing begins"

  - pi_number: "PI-8"
    pi_name: "System Integration"
    pi_theme: "Integrations"
    phase_group: "dashboard_integrations"
    month_start: 15
    month_end: 16
    milestones:
      - "External API integrations"
      - "Data pipeline connectors"
      - "End-to-end workflow validation"

  - pi_number: "PI-9"
    pi_name: "Operational Handoff"
    pi_theme: "Integrations"
    phase_group: "dashboard_integrations"
    month_start: 17
    month_end: 18
    milestones:
      - "Production deployment"
      - "Operator training"
      - "Final ATO package submission"
      - "Project closeout"
