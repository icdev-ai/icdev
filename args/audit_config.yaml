# CUI // SP-CTI
# ICDEV™ Audit Configuration — Cross-Agency Data Transfer Logging
# Classification: CUI // SP-CTI  |  Impact Level: IL4/IL5
#
# Satisfies NIST 800-53 Rev 5:
#   AU-2  Audit Events — defines auditable events and audit policy
#   AU-9  Protection of Audit Information — append-only, immutable, access-controlled
#   AU-11 Audit Record Retention — retention rules per classification
#   AU-12 Audit Generation — event generation coverage

_schema_version: 1

# ============================================================
# Cross-Agency Transfer Audit Policy
# ============================================================
cross_agency_transfer:
  enabled: true
  description: "Append-only audit trail for all cross-agency data transfer events"
  nist_controls:
    - AU-2
    - AU-9
    - AU-11
    - AU-12

  # Events that MUST generate an audit record
  required_events:
    - initiated
    - completed
    - failed
    - rejected

  # Dual-write: mirror summary events to main audit_trail for AU-2 completeness
  dual_write_to_audit_trail: true

  # Data elements required per AU-2 (who, what, when, where, why)
  required_fields:
    - transfer_id
    - event_type
    - source_agency
    - target_agency
    - actor
    - occurred_at
    - data_classification

  # Optional enrichment fields
  optional_fields:
    - data_type
    - project_id
    - bytes_transferred
    - checksum
    - duration_ms
    - rejection_reason
    - error_code
    - details

  # Classification handling per transfer
  classifications:
    default: CUI
    supported:
      - CUI
      - SECRET
      - TOP_SECRET
    require_explicit_marking: true

  # Retention per NIST AU-11 (days)
  retention:
    CUI: 365
    SECRET: 2555   # 7 years
    TOP_SECRET: 3650  # 10 years

  # Integrity & access controls (AU-9)
  integrity:
    append_only: true
    allow_update: false
    allow_delete: false
    checksum_verification: optional  # SHA-256 on bytes_transferred when provided

  # Alerting thresholds
  alerting:
    failed_transfer_rate_threshold: 0.05  # 5% failure rate triggers alert
    rejected_transfer_alert: true
    unknown_agency_alert: true

# ============================================================
# General Audit Trail Policy
# ============================================================
audit_trail:
  enabled: true
  append_only: true
  event_types_source: tools/audit/audit_logger.py  # VALID_EVENT_TYPES tuple
  required_fields:
    - event_type
    - actor
    - action
    - timestamp
  optional_fields:
    - project_id
    - details
    - affected_files
    - classification
    - ip_address
    - session_id
  retention_days: 365

# ============================================================
# SIEM / Export Integration
# ============================================================
export:
  siem_format: json
  siem_batch_size: 1000
  scheduled_export: daily
  export_path: data/exports/audit/
