# CUI // SP-CTI
# Phase 64 — Universal RAG Subsystem Configuration
# All RAG settings in one place. Follows D26 declarative config pattern.

rag:
  enabled: true

  vector_store:
    backend: auto                    # auto, sqlite, chromadb, faiss
    sqlite:
      db_path: data/rag/rag_vectors.db
    chromadb:
      persist_dir: data/rag/chromadb/
    faiss:
      index_dir: data/rag/faiss/
      index_type: IVF256_HNSW32

  embedding:
    batch_size: 20
    dimensions: 768                  # nomic-embed-text via Ollama
    cache_ttl_seconds: 300

  chunking:
    short_threshold_tokens: 500      # < 500 tok: store whole
    chunk_size_tokens: 2000          # > 2000 tok: sliding window
    overlap_pct: 0.10                # 10% overlap at sentence boundaries

  retrieval:
    vector_top_k: 50                 # Initial vector retrieval count
    final_top_k: 5                   # After re-ranking
    fusion_method: rrf               # rrf or weighted_sum (D-RAG-19)
    rrf_k: 60                        # RRF constant (higher = more weight to top ranks)
    bm25_boost_weight: 0.3           # BM25 keyword boost weight (used by weighted_sum)
    time_decay_enabled: true
    min_score_threshold: 0.1         # Minimum score to include in results

  rerank:
    enabled: true
    method: bge                      # bge, llm, or hybrid (bge→llm fallback) (D-RAG-20)
    bge_model: bge-reranker-v2-m3   # Ollama cross-encoder model
    rerank_weight: 0.6               # Weight of rerank score in final blend
    llm_model: qwen3-local           # Fallback LLM reranker (scanner_function)
    max_chunk_preview_chars: 400     # Truncate chunk content for re-rank prompt

  injection:
    enabled: true
    injection_top_k: 5              # How many chunks to inject into LLM context
    max_injection_chars: 4000       # Max total chars of injected RAG context
    injection_position: system      # Inject into system prompt
    citation_enabled: true           # Enable [SOURCE-N] tagging (D-RAG-21)
    citation_instruction: true       # Append citation instruction to system prompt
    citation_validation: true        # Post-generation validation logging
    function_denylist:
      - attachment_analysis          # Vision tasks don't benefit from text RAG

  ingestion:
    realtime_sources:
      - innovation_signals
      - innovation_solutions
      - creative_pain_points
      - creative_feature_gaps
      - creative_specs
      - research_dossiers
      - research_challenges
      - research_forecasts
      - compliance_artifacts
      - memory_entries
      - anvil_critique_sessions      # ANVIL-CR critique findings
    batch_sources:
      - audit_trail
      - ai_telemetry
      - mbse_model_elements
      - supply_chain_dependencies
      - agent_memory
      - code_quality_metrics
      - innovation_trends
      - creative_trends
    batch_schedule_minutes: 60
    dedup_enabled: true              # SHA-256 content hash dedup (D-RAG-5)

  retention:
    hot_days: 30                     # Full float32 embeddings, <50ms
    warm_days: 365                   # float16 compressed, ~200ms
    warm_compression: float16
    # cold: 365+ days, metadata only, re-embed on demand

  provenance:
    enabled: true
    record_query_content: false      # D282 content tracing policy
    # Set ICDEV_CONTENT_TRACING_ENABLED=true for plaintext query logging

  child_app:
    copy_to_children: true           # Include tools/rag/ in child app generation
    parent_cache_ttl_seconds: 3600   # Child cache TTL for parent RAG queries
    critique_history_federation: true # Child apps can query parent critique findings

  critique_integration:
    enabled: true                    # RAG-augmented ANVIL-CR critiques
    source_types:                    # Source types to search for critique context
      - anvil_critique_sessions
      - compliance_artifacts
      - innovation_signals
    max_critique_context_chars: 3000 # Max RAG context for critique phase

  # --- D-RAG-15: PDF Multi-Provider Ingestion ---
  pdf:
    enabled: true
    provider_chain:                  # Fallback order (D-RAG-15)
      - anthropic
      - google
      - vision_llava
      - pypdf_text
    max_pages: 200
    max_file_size_mb: 50
    extract_images: false            # Extract embedded images (future)
    anthropic:
      api_key: "env:ANTHROPIC_API_KEY"
      model: claude-sonnet-4-20250514
    google:
      api_key: "env:GOOGLE_API_KEY"
      model: gemini-2.0-flash
    vision_llava:
      model: llava:latest

  # --- D-RAG-16: Intelligence Mode Auto-Indexing ---
  auto_indexer:
    enabled: false                   # Opt-in (user must explicitly enable)
    watch_extensions:
      - .md
      - .txt
      - .py
      - .yaml
      - .yml
      - .json
      - .pdf
    excluded_dirs:
      - .git
      - node_modules
      - __pycache__
      - .venv
      - .tmp
    max_file_size_mb: 10
    cui_boundary_enforcement: true   # Block files above project classification
    scan_interval_seconds: 300       # 5 minutes between scans

  # --- D-RAG-22: RAGAS Evaluation ---
  evaluation:
    enabled: true
    test_set_path: data/rag/evaluation_set.json
    metrics:
      - ndcg_at_k
      - mrr
      - context_precision
      - faithfulness
      - answer_relevancy
    llm_judge_model: qwen3-local     # scanner_function for LLM metrics

    # --- D-RAG-23: CRAG Benchmark Integration ---
    crag:
      enabled: true
      scoring_mode: both             # ragas, crag, or both
      penalize_hallucination: true
      abstention_reward: true        # "I don't know" = 0 not -1 for non-false-premise
      popularity_tiers:
        head_min_frequency: 100
        torso_min_frequency: 10

  # --- D-RAG-24: Know Your RAG Per-Label Adaptive Weights ---
  label_weights:
    fact_single:
      bm25_weight: 0.2              # Facts need more semantic, less keyword
      rrf_k: 60
    summary:
      bm25_weight: 0.3              # Summaries benefit from balanced
      rrf_k: 60
    reasoning:
      bm25_weight: 0.15             # Reasoning needs semantic understanding
      rrf_k: 40
    unanswerable:
      bm25_weight: 0.5              # Keywords help confirm non-existence
      rrf_k: 80
