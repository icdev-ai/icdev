# OPT-71 — Agent adapter configuration.
# Controls tools/agents/registry.pick_default() behavior.
default_adapter: auto  # 'auto', 'claude_cli', 'local_llm_router', ...

enabled_adapters:
  - claude_cli
  - local_llm_router
  # hgx-exec-02 — the OWNED build path: the rubric-gated agent loop with the
  # worktree toolset, graded by the real delivery gates. Unlike
  # local_llm_router it edits files. Enabled but deliberately absent from
  # fallback_order below, so selection stays byte-unchanged for existing
  # consumers until one opts in via ICDEV_AGENT_ADAPTER=local_agent or a
  # per_task_type_preference entry.
  - local_agent
  # exa-bench-01 — the OpenAI Codex CLI shellout, implemented against the same
  # Protocol as claude_cli. Enabled so it is reachable via
  # ICDEV_AGENT_ADAPTER=codex_cli, but deliberately absent from fallback_order
  # and per_task_type_preference below: the exa-bench-03 capability probe has
  # not measured it yet, so nothing routes to it by default.
  - codex_cli
  # - copilot_cli   # stub — uncomment when wired

# Prefer claude_cli for anything that actually needs to edit files; use
# local_llm_router for research/plan tasks that only need a written
# output. local_agent is the air-gap alternative to claude_cli for
# file-editing work (it degrades to prose when the provider can't do
# native tool use).
per_task_type_preference:
  build: claude_cli
  fix: claude_cli
  deploy: claude_cli
  test: claude_cli
  research: local_llm_router
  chore: local_llm_router
  run: claude_cli

# Fallback walked in order when no task-type match is found.
fallback_order:
  - claude_cli
  - local_llm_router
