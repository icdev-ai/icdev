# CUI // SP-CTI
# Threshold configuration for tools/oracle/lenses/lens_workflow_patterns.py
# All values are code-level defaults — override here to tune without changing source.
# LLM-calibrated overrides (via oracle_anomaly_detection) take precedence at run-time
# when sufficient data exists; this file serves as the static fallback layer.

# --- Pattern Mining ---
# Minimum number of times a sequence must appear to be reported
min_pattern_freq: 3
# Window sizes for N-gram mining (3, 4, 5-step sequences)
window_sizes: [3, 4, 5]
# Days of audit history to consider
lookback_days: 30
# Top-N caps for reported items (noise reduction)
max_ngrams_reported: 50
max_pairs_reported: 100
max_task_types_reported: 10
# Max completed kanban tasks to scan
max_kanban_done: 500

# --- Co-occurrence ---
# Fraction of shared sessions required to flag a pair as a composition candidate
cooccurrence_threshold: 0.80

# --- Self-Healing ---
# Minimum number of failures before an actor+action pair surfaces as a candidate
min_self_heal_fails: 2.0
# Minimum heal rate to recommend Genesis Heal reflex registration
heal_reflex_min_rate: 0.7

# --- Adaptive Threshold Z Multipliers ---
# Each scoring path derives: threshold = mean + z * sigma
# Higher z = stricter filter (fewer, higher-signal predictions)
adaptive_z_ngram: 1.0
adaptive_z_cooccurrence: 1.0
adaptive_z_kanban: 1.0
adaptive_z_heal: 0.0

# --- Anomaly Population Minimums ---
# Minimum samples required before switching from fixed-denominator to percentile/adaptive scoring
min_population_percentile: 5
min_population_adaptive: 5
min_population_zscore: 3

# --- Z-Score Severity Boundaries ---
# Z-scores above these thresholds set prediction severity (relative to population mean)
z_critical: 3.0
z_warning: 2.0

# --- Sparse-Population Fallback Denominators ---
# Used in _score_pattern when no observed distribution exists
fallback_freq_denominator: 20.0
fallback_session_denominator: 10.0

# --- Automation Potential ---
# Fraction of automated event types in a pattern to classify automation potential as "high"
automation_high_ratio: 0.5

# --- Confidence Formula Weights ---
# N-gram pattern confidence: freq_weight * freq_score + consistency_weight * consistency
pattern_conf_freq_weight: 0.6
pattern_conf_consistency_weight: 0.4
# Co-occurrence confidence: base + percentile_rank * scale  (capped at cap)
cooccurrence_conf_cap: 0.95
cooccurrence_conf_base: 0.50
cooccurrence_conf_scale: 0.45
# Kanban task-type confidence: base + percentile_rank * scale  (capped at cap)
task_conf_cap: 0.90
task_conf_base: 0.40
task_conf_scale: 0.60
# Self-healing confidence: base + percentile_rank * scale  (capped at cap)
heal_conf_cap: 0.90
heal_conf_base: 0.40
heal_conf_scale: 0.50
