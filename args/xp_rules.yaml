# CUI // SP-CTI
# AlphaDesk XP rules — Phase 6.1.
#
# Each key = event reason. Each entry:
#   - amount: XP awarded
#   - cooldown_seconds: optional minimum gap between awards for the same
#                       (user_id, reason). Prevents spam (e.g. spamming
#                       signal-approve to farm XP).
#   - max_per_day: optional daily cap per user. 0/null = unlimited.
#   - description: shown on /progression page.
#
# Hot-reloaded via file-mtime cache (tools/trading/progression/engine.py).
# New rules just need an entry here — engine has no hardcoded reasons.

_schema_version: 1

rules:
  signal_approved:
    amount: 15
    max_per_day: 20
    description: "Approved a trading signal"
  signal_rejected:
    amount: 3
    max_per_day: 20
    description: "Rejected a signal — discernment earns credit too"
  order_filled:
    amount: 10
    max_per_day: 50
    description: "Paper-trade order filled"
  order_profitable_close:
    amount: 25
    max_per_day: null
    description: "Closed a position profitably"
  regime_aware_decision:
    amount: 25
    max_per_day: 10
    description: "Acted on a signal aligned with the current macro regime"
  first_profitable_week:
    amount: 100
    max_per_day: 1
    description: "Portfolio ended the week green for the first time"
  survived_drawdown:
    amount: 50
    max_per_day: 1
    description: "Held through a -15% drawdown and recovered"
  diversified_portfolio:
    amount: 30
    max_per_day: 1
    description: "Held positions in 5+ sectors simultaneously"
  lesson_completed:
    amount: 20
    max_per_day: null
    description: "Completed a lesson"
  scenario_run:
    amount: 5
    max_per_day: 10
    description: "Ran a what-if scenario"
  alert_acknowledged:
    amount: 2
    max_per_day: 20
    description: "Acknowledged an alert"
