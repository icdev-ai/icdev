# CUI // SP-CTI
# ICDEV platform model: FOCUS cost bundles from FinOps, for ICDEV[OS]'s Cloud CoP (osx-cop-05), on the IDP.
#
# A provider's FOCUS 1.4 Cost and Usage export, every row validated against ICDEV[OS]'s pinned
# icos-focus-cost/v1 schema (one failing row refuses the export), becomes one bundle: the rows, each
# declared workload's total and what no workload names, built exactly as ICDEV[OS] checks it. Anyone
# prepares a bundle; a person who did not prepare it publishes it, bound to its digest.
#
# requirement -> element -> code -> test (-> NIST control). Rules: see the
# header of args/platform_model/cortex.yaml.

component: idp
project_id: icdev-platform

elements:
  - id: finops.focus.read
    type: sysml_element
    kind: block
    name: FOCUS export reader, validated row by row against the pinned schema
    features: [finops.focus]
    code:
      - args/finops_focus.yaml
      - context/icos/focus-cost.schema.json
      - tools/finops/focus_bundle.py::config_errors
      - tools/finops/focus_bundle.py::load_config
      - tools/finops/focus_bundle.py::schema
      - tools/finops/focus_bundle.py::schema_digest
      - tools/finops/focus_bundle.py::parse_csv
      - tools/finops/focus_bundle.py::parse_json
      - tools/finops/focus_bundle.py::row_errors
      - tools/finops/focus_bundle.py::read_export

  - id: finops.focus.bundle
    type: sysml_element
    kind: block
    name: The icos-focus-cost/v1 bundle (per-workload totals, unattributed, pin, content digest)
    features: [finops.focus]
    code:
      - tools/finops/focus_bundle.py::totals
      - tools/finops/focus_bundle.py::amount
      - tools/finops/focus_bundle.py::content_digest
      - tools/finops/focus_bundle.py::build
      - tools/finops/focus_bundle.py::verify
      - tools/finops/focus_bundle.py::main

  - id: finops.focus.publish
    type: sysml_element
    kind: block
    name: Prepare, then a person publishes; append-only hash-chained FOCUS ledger per billing month
    features: [finops.focus]
    code:
      - tools/finops/focus_bundle.py::prepare
      - tools/finops/focus_bundle.py::publish
      - tools/finops/focus_bundle.py::builders
      - tools/finops/focus_bundle.py::published_bundle
      - tools/finops/focus_bundle.py::chain
      - tools/finops/focus_bundle.py::replay
      - tools/db/migrations/20261118143737_finops_focus_events/up.py
      - args/workflow_hitl_templates/finops-focus-publish.yaml

  - id: finops.focus.twin
    type: sysml_element
    kind: block
    name: The idp governance twin observing finops.focus
    features: [finops.focus]
    code:
      - tools/finops/focus_bundle.py::twin_evidence
      - tools/finops/focus_bundle.py::twin_judge
      - tools/twin_core/adapters/coe_standards.py::EngineeringStandardsTwin
      - tools/twin_core/governance.py::resolve_thread

interfaces:
  - id: if.finops.focus.console
    type: sysml_element
    kind: interface_block
    name: Console /idp/finops/focus and its routes
    features: [finops.focus]
    code:
      - tools/dashboard/templates/idp/finops_focus.html
      - tools/idp/blueprint.py::idp_finops_focus_page
      - tools/idp/blueprint.py::idp_api_finops_focus
      - tools/idp/blueprint.py::idp_api_finops_focus_preview
      - tools/idp/blueprint.py::idp_api_finops_focus_prepare
      - tools/idp/blueprint.py::idp_api_finops_focus_publish
      - tools/idp/blueprint.py::idp_api_finops_focus_bundle

  - id: if.finops.focus.mcp
    type: sysml_element
    kind: interface_block
    name: MCP read and draft-only prepare for the FOCUS cost bundles
    features: [finops.focus]
    code:
      - tools/mcp/gap_handlers.py::handle_finops_focus
      - tools/mcp/gap_handlers.py::handle_finops_focus_prepare

requirements:
  - id: PM-FIN-01
    title: ICDEV[OS]'s schema is vendored verbatim and pinned by its file and by its schema digest
    text: >-
      context/icos/focus-cost.schema.json is ICDEV[OS]'s published icos-focus-cost/v1 schema, a DRAFT
      until ICDEV[OS] merges contract 1.195.0. It is pinned by the file's SHA-256 (a changed file is
      refused, never used) and by its schema digest (the schema without x-icos-contract, canonical
      JSON), which every bundle carries as its pin. The config (FOCUS 1.4, the tag key, ICDEV[OS]'s
      four declared workloads, the currency, the exports directory) is reviewed; one that breaks a
      rule is refused.
    type: functional
    priority: high
    features: [finops.focus]
    elements: [finops.focus.read]
    controls: [CM-2, SI-7]
    tests:
      - tests/test_osx_cop_05_finops.py::test_the_schema_is_pinned_by_file_and_by_schema_digest
      - tests/test_osx_cop_05_finops.py::test_the_config_is_declared_and_one_that_breaks_a_rule_is_refused

  - id: PM-FIN-02
    title: One row that fails the pinned schema refuses the whole export
    text: >-
      A FOCUS export (CSV, a JSON array or JSON lines) is read with decimals as numbers, JSON
      columns as JSON and an empty cell as null. Every row is validated against the pinned
      $defs/FocusRow and its date-times as RFC 3339; one row that fails, an unknown column, a
      second billing period or another currency refuses the export with each failing row named.
      Nothing is half read.
    type: functional
    priority: high
    features: [finops.focus]
    elements: [finops.focus.read]
    controls: [SI-10]
    tests:
      - tests/test_osx_cop_05_finops.py::test_the_synthetic_export_reads_csv_json_and_json_lines_alike
      - tests/test_osx_cop_05_finops.py::test_a_row_that_fails_the_pinned_schema_refuses_the_whole_export

  - id: PM-FIN-03
    title: The bundle is built exactly as ICDEV[OS] checks it, and deterministically
    text: >-
      Every declared workload is listed with its rows, effective and billed cost (Decimal sums,
      six places, half-even, as strings; a workload with no rows reports zero), rows whose Tags name
      no declared workload are unattributed, and content_digest is SHA-256 over the canonical bundle
      without content_digest, publication and produced_at. ICDEV[OS]'s algorithm recomputes both; a
      tampered, re-pinned or incomplete bundle does not verify. The same export, config and time
      give the same bytes.
    type: functional
    priority: high
    features: [finops.focus]
    elements: [finops.focus.bundle]
    controls: [SI-7, AU-10]
    tests:
      - tests/test_osx_cop_05_finops.py::test_the_bundle_totals_and_digest_recompute_by_icos_algorithm
      - tests/test_osx_cop_05_finops.py::test_a_tampered_or_off_contract_bundle_does_not_verify
      - tests/test_osx_cop_05_finops.py::test_a_draft_has_no_publication

  - id: PM-FIN-04
    title: A bundle is published by a person who did not prepare it, bound to its digest
    text: >-
      Preparing (anyone, or an agent's draft) records the bundle at its digest in the append-only,
      hash-chained finops_focus_events and decides nothing. Publishing or refusing is a person's
      declared step (decl-wft-finops-focus-publish), with a reason, bound to the digest read,
      refused to the preparer, to a service key and to a role that does not hold it; an off-contract
      or superseded prepared bundle is never published. Only a published bundle carries its
      publication and leaves for ICDEV[OS]; a self-publication never counts.
    type: functional
    priority: high
    features: [finops.focus]
    elements: [finops.focus.publish]
    controls: [AC-5, AU-9, AU-10]
    tests:
      - tests/test_osx_cop_05_finops.py::test_publishing_binds_the_digest_and_is_never_the_preparers
      - tests/test_osx_cop_05_finops.py::test_a_self_publication_is_refused_and_never_counts
      - tests/test_osx_cop_05_finops.py::test_an_off_contract_prepared_bundle_is_never_published
      - tests/test_osx_cop_05_finops.py::test_the_ledger_is_append_only_and_hash_chained
      - tests/test_osx_cop_05_finops.py::test_the_template_is_declared
      - tests/test_osx_cop_05_ambient.py::test_a_focus_bundle_prepared_and_published_on_the_platform_database

  - id: PM-FIN-05
    title: The FOCUS page, the twin with threads, and MCP read and draft
    text: >-
      /idp/finops/focus, linked from the portal and the nav, shows each declared workload's total,
      the unattributed rows, the prepared, published and refused events, and the publish step, by
      endpoint id. The idp twin observes finops.focus: with nothing published every workload is
      unverified, a self-published or off-contract bundle is a finding and counts for nothing, each
      finding is threaded to its ledger row, and an observation replays. MCP finops_focus reads;
      finops_focus_prepare only drafts and halts at the gate. No cloud-vendor training or
      certification content.
    type: functional
    priority: medium
    features: [finops.focus]
    elements: [if.finops.focus.console, finops.focus.twin, if.finops.focus.mcp]
    controls: [AU-6, SI-4]
    tests:
      - tests/test_osx_cop_05_finops.py::test_the_routes_and_the_page
      - tests/test_osx_cop_05_finops.py::test_the_twin_observes_bundles_with_threads_and_replays
      - tests/test_osx_cop_05_finops.py::test_a_self_published_or_off_contract_bundle_is_a_finding_and_counts_for_nothing
      - tests/test_osx_cop_05_finops.py::test_the_twin_says_unverified_when_the_ledger_cannot_be_read
      - tests/test_osx_cop_05_finops.py::test_the_mcp_tools_read_and_only_draft
      - tests/test_osx_cop_05_finops.py::test_no_cloud_vendor_training_or_certification_content
