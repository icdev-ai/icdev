      - tests/test_icx_mdz_06_survivor_ivv.py::test_the_bundle_carries_only_a_signed_current_result_and_always_validates
      - tests/test_icx_mdz_06_survivor_ivv.py::test_a_newer_result_after_the_signoff_leaves_it_stale_and_uncarried
      - tests/test_icx_mdz_06_survivor_ivv.py::test_the_page_shows_the_result_per_area_and_offers_sign_and_refuse
      - tests/test_icx_mdz_06_survivor_ivv.py::test_the_twin_flags_unsigned_refused_and_unpassed_areas_with_a_thread
      - tests/test_icx_mdz_06_survivor_ivv.py::test_the_twin_observes_an_unsigned_result_with_a_thread_and_replays
      - tests/test_icx_mdz_06_survivor_ivv.py::test_the_mcp_survivor_ivv_tool_is_read_only_and_says_why
