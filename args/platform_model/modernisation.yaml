# CUI // SP-CTI
# ICDEV platform model: application modernisation (icx-mdz-01; icx-mdz-02: 7R on
# evidence, one 7R engine, may-plan enforced; icx-mdz-03: features and processes
# without a model, every bundle part present or missing; icx-mdz-04: the bundle
# carries what ICDEV[OS] contract 1.189.0 accepts, inline; icx-mdz-05: each wave's
# estimate and, only from a declared team capacity a person reviewed, its dates; icx-mdz-06: IV&V for survivor
# assurance, signed off by a person independent of the plan) -- the 7R assessment,
# AI-Ify, Process-Ify, an application's waves and CAM refactor jobs, cloud-native
# targets, and the ICDEV[OS] apptwin exporter and decision import.
#
# requirement -> element -> code -> test (-> NIST control). Rules: see the
# header of args/platform_model/cortex.yaml.

component: mdc
project_id: icdev-platform

elements:
  - id: mdz.seven_r
    type: sysml_element
    kind: block
    name: 7R assessment and the strategy a person records (a proposal to ICDEV[OS])
    features: [mdz.seven_r]
    code:
      - tools/modernization/seven_r_assessor.py::run_seven_r_assessment
      - tools/modernization/seven_r_assessor.py::_strategy_evidence
      - tools/modernization/seven_r_assessor.py::_rank_strategies
      - tools/modernization/seven_r_assessor.py::strategy_for_app
      - context/modernization/seven_rs_catalog.json
      - tools/dashboard/api/migration.py::trigger_assessment
      - tools/dashboard/api/migration.py::record_strategy
      - tools/modernization/decisions.py::strategy_record
      - args/workflow_hitl_templates/mdz-7r-strategy.yaml

  - id: mdz.aiify
    type: sysml_element
    kind: block
    name: AI-Ify promotion and scan deletion through declared steps, Send to Kanban fail-closed
    features: [mdz.aiify]
    code:
      - tools/aiify/blueprint.py::api_hitl_decision
      - tools/aiify/blueprint.py::api_send_to_kanban
      - tools/aiify/blueprint.py::api_delete_scan
      - tools/aiify/blueprint.py::api_delete_all_scans
      - args/workflow_hitl_templates/mdz-aiify-promote.yaml
      - args/workflow_hitl_templates/mdz-aiify-scan-delete.yaml

  - id: mdz.processify
    type: sysml_element
    kind: block
    name: Process-Ify observed drafts and their review
    features: [mdz.processify]
    code:
      - tools/workflow_canvas/observed_processify.py::list_drafts
      - tools/workflow_canvas/observed_processify.py::review_draft
      - tools/workflow_canvas/blueprint.py::create_wfc_blueprint
      - args/workflow_hitl_templates/mdz-processify-observed-approve.yaml

  - id: mdz.waves_cam
    type: sysml_element
    kind: block
    name: An application's waves and its CAM refactor jobs, reviewed by a person
    features: [mdz.waves_cam]
    code:
      - tools/modernization/app_wave_planner.py::report
      - tools/modernization/refactor_jobs.py::report
      - tools/migration_canvas/modernisation.py::refactor_jobs
      - tools/migration_canvas/modernisation.py::register_modernisation_routes
      - args/workflow_hitl_templates/mdz-cam-refactor-approve.yaml

  - id: mdz.cloud_native
    type: sysml_element
    kind: block
    name: Cloud-native jobs and the cloud_native section the exporter carries
    features: [mdz.cloud_native]
    code:
      - tools/modernization/cloud_native_jobs.py::report
      - tools/modernization/apptwin_export.py::cloud_native_from_jobs
      - tools/migration_canvas/modernisation.py::cloud_native

  - id: mdz.exporter
    type: sysml_element
    kind: block
    name: The icos-apptwin/v1 exporter and the signed ICDEV[OS] decisions import
    features: [mdz.exporter]
    code:
      - tools/modernization/apptwin_export.py::build
      - tools/modernization/icos_decisions.py::verify
      - tools/modernization/icos_decisions.py::may_plan
      - tools/migration_canvas/modernisation.py::bundle_preview
      - tools/migration_canvas/modernisation.py::icos_check

  - id: mdz.bundle_features
    type: sysml_element
    kind: block
    name: Features and processes without a model, step signatures by a reviewed rule set, reviewed by a person
    features: [mdz.exporter]
    code:
      - tools/modernization/bundle_features.py::report
      - tools/modernization/bundle_features.py::features
      - tools/modernization/bundle_features.py::processes
      - tools/modernization/bundle_features.py::normalise
      - tools/modernization/bundle_features.py::signature
      - tools/modernization/bundle_features.py::review_states
      - tools/modernization/apptwin_export.py::features_from_extract
      - tools/modernization/apptwin_export.py::processes_from_extract
      - tools/modernization/apptwin_export.py::section_states
      - tools/modernization/sample_pipeline.py::pipeline
      - tools/workflow_canvas/processify.py::from_source
      - tools/migration_canvas/modernisation.py::features
      - tools/migration_canvas/modernisation.py::register_modernisation_routes
      - args/modernisation_signatures.yaml
      - args/workflow_hitl_templates/mdz-process-review.yaml

  - id: mdz.bundle_contract
    type: sysml_element
    kind: block
    name: The bundle against ICDEV[OS] contract 1.189.0, inline; retire on ICDEV[OS]'s signed redundancy; a declared environment
    features: [mdz.exporter, mdz.seven_r]
    code:
      - tools/modernization/apptwin_export.py::validate
      - tools/modernization/apptwin_export.py::agreement
      - tools/modernization/apptwin_export.py::derived_waves
      - tools/modernization/apptwin_export.py::wave_estimates
      - tools/modernization/apptwin_export.py::seven_r_from_assessment
      - tools/modernization/apptwin_export.py::declared_environments
      - tools/modernization/apptwin_export.py::environment
      - tools/modernization/icos_decisions.py::redundancy
      - tools/modernization/plan_gate.py::redundancy
      - tools/modernization/seven_r_assessor.py::icos_redundancy
      - tools/modernization/seven_r_assessor.py::_check_retire_fitness
      - context/icos/apptwin.schema.json
      - args/modernisation_environments.yaml

  - id: mdz.seven_r_consumers
    type: sysml_element
    kind: block
    name: The other 7R generators consume the assessor's result instead of scoring again
    features: [mdz.seven_r]
    code:
      - tools/migration_intelligence/strategy_generator.py::seven_r_for_opportunity
      - tools/migration_intelligence/strategy_generator.py::generate_strategies_for_opportunity
      - tools/migration_canvas/coa_engine.py::get_coas
      - tools/migration_canvas/coa_engine.py::get_coas_for_app

  - id: mdz.plan_gate
    type: sysml_element
    kind: block
    name: A migration is planned only on ICDEV[OS]'s signed may-plan, fail closed
    features: [mdz.seven_r, mdz.waves_cam, mdz.exporter]
    code:
      - tools/modernization/plan_gate.py::require
      - tools/modernization/plan_gate.py::refusals
      - tools/modernization/monolith_decomposer.py::create_migration_plan
      - tools/modernization/refactor_jobs.py::run
      - tools/modernization/sample_pipeline.py::resume

  - id: mdz.wave_schedule
    type: sysml_element
    kind: block
    name: Wave estimates from the plan's tasks, and dates only from a declared team capacity a person reviewed
    features: [mdz.waves_cam, mdz.exporter]
    code:
      - tools/modernization/wave_schedule.py::schedule
      - tools/modernization/wave_schedule.py::declared
      - tools/modernization/wave_schedule.py::review_state
      - tools/modernization/wave_schedule.py::plan_estimates
      - tools/modernization/wave_schedule.py::apply
      - tools/modernization/app_wave_planner.py::report
      - tools/modernization/apptwin_export.py::schedule_reason
      - tools/modernization/apptwin_export.py::section_states
      - tools/migration_canvas/modernisation.py::register_modernisation_routes
      - args/modernisation_capacity.yaml
      - args/workflow_hitl_templates/mdz-capacity-review.yaml

  - id: mdz.survivor_ivv
    type: sysml_element
    kind: block
    name: ICDEV's own IV&V over a consolidation survivor's modernisation outputs, signed off by an independent person
    features: [mdz.exporter]
    code:
      - tools/modernization/survivor_ivv.py::assess
      - tools/modernization/survivor_ivv.py::run
      - tools/modernization/survivor_ivv.py::latest
      - tools/modernization/survivor_ivv.py::builders
      - tools/modernization/survivor_ivv.py::signoff
      - tools/modernization/survivor_ivv.py::for_bundle
      - tools/compliance/ivv_assessor.py::evaluate
      - tools/workflow_hitl/declared.py::take_step
      - tools/modernization/apptwin_export.py::build
      - tools/migration_canvas/modernisation.py::register_modernisation_routes
      - args/workflow_hitl_templates/mdz-survivor-ivv-signoff.yaml

  - id: mdz.twin
    type: sysml_element
    kind: block
    name: Modernisation governance twin (canvas mdc)
    features: [mdz.seven_r, mdz.aiify, mdz.processify, mdz.waves_cam, mdz.cloud_native, mdz.exporter]
    code:
      - tools/twin_core/adapters/modernisation.py::ModernisationGovernanceTwin
      - tools/twin_core/adapters/modernisation.py::_bundles
      - tools/twin_core/governance.py::resolve_thread

interfaces:
  - id: if.mdz.console
    type: sysml_element
    kind: interface_block
    name: Console /migration, /ai-ify, /workflow-canvas/processify and /migration-canvas/modernisation
    features: [mdz.seven_r, mdz.aiify, mdz.processify, mdz.waves_cam, mdz.cloud_native, mdz.exporter]
    code:
      - tools/dashboard/templates/migration.html
      - tools/dashboard/templates/aiify/page.html
      - tools/dashboard/templates/workflow_canvas/processify.html
      - tools/dashboard/templates/migration_canvas/modernisation.html

  - id: if.mdz.mcp
    type: sysml_element
    kind: interface_block
    name: MCP read tools for modernisation
    features: [mdz.seven_r, mdz.aiify, mdz.processify, mdz.waves_cam, mdz.cloud_native, mdz.exporter]
    code:
      - tools/mcp/gap_handlers.py::handle_modernisation_seven_r
      - tools/mcp/gap_handlers.py::handle_aiify_promotions
      - tools/mcp/gap_handlers.py::handle_processify_observed_drafts
      - tools/mcp/gap_handlers.py::handle_modernisation_waves_jobs
      - tools/mcp/gap_handlers.py::handle_modernisation_cloud_native
      - tools/mcp/gap_handlers.py::handle_modernisation_bundle
      - tools/mcp/gap_handlers.py::handle_modernisation_features
      - tools/mcp/gap_handlers.py::handle_modernisation_wave_schedule
      - tools/mcp/gap_handlers.py::handle_modernisation_survivor_ivv

requirements:
  - id: PM-MDZ-01
    title: The 7R strategy a person records is a declared step and only a proposal
    text: >-
      The assessor recommends and decides nothing. A person holding the step
      records the strategy ICDEV proposes, or declines to, with a reason
      (decl-wft-mdz-7r-strategy); the decided step is the record, marked not
      binding: ICDEV[OS] accepts a strategy, and may-plan is its answer.
    type: functional
    priority: high
    features: [mdz.seven_r]
    elements: [mdz.seven_r, if.mdz.console]
    controls: [AC-5, AU-10]
    tests:
      - tests/test_icx_mdz_01_modernisation.py::test_the_assess_route_runs_the_assessor_for_one_application
      - tests/test_icx_mdz_01_modernisation.py::test_recording_a_7r_strategy_is_a_persons_step_and_only_a_proposal

  - id: PM-MDZ-02
    title: AI-Ify promotion and deletion are a person's steps, and the gate stays fail-closed
    text: >-
      Accepting or rejecting a PRD phase or a signal, and deleting scans, run
      through declared templates before anything is written; a step that
      cannot be recorded changes nothing; Send to Kanban refuses when the
      decisions cannot be read.
    type: functional
    priority: high
    features: [mdz.aiify]
    elements: [mdz.aiify, if.mdz.console]
    controls: [AC-5, SI-10]
    tests:
      - tests/test_icx_mdz_01_modernisation.py::test_an_aiify_promotion_is_the_persons_step_before_anything_is_written
      - tests/test_icx_mdz_01_modernisation.py::test_an_aiify_promotion_that_cannot_be_recorded_changes_nothing
      - tests/test_icx_mdz_01_modernisation.py::test_send_to_kanban_still_fails_closed_when_decisions_cannot_be_read
      - tests/test_icx_mdz_01_modernisation.py::test_deleting_aiify_scans_is_a_persons_step

  - id: PM-MDZ-03
    title: An observed draft is reviewed once, by the person who took the step
    text: >-
      The Process-Ify page lists observed drafts; approving or rejecting one is
      the person's step (decl-wft-mdz-processify-observed-approve), and the
      reviewer recorded on the draft is that person.
    type: functional
    priority: high
    features: [mdz.processify]
    elements: [mdz.processify, if.mdz.console]
    controls: [AC-5, AU-10]
    tests:
      - tests/test_icx_mdz_01_modernisation.py::test_reviewing_an_observed_draft_is_a_persons_step_and_names_them
      - tests/test_observed_processify.py::test_route_drafts_then_chain_link_waits_for_review

  - id: PM-MDZ-04
    title: Waves are derived and read; a CAM job's output is approved once, bound to its files
    text: >-
      The Modernisation page reads an application's waves and CAM jobs. A
      person approves or rejects a completed job's generated output with a
      reason (decl-wft-mdz-cam-refactor-approve), bound to each file's SHA-256,
      once. Nothing is applied.
    type: functional
    priority: high
    features: [mdz.waves_cam]
    elements: [mdz.waves_cam, if.mdz.console]
    controls: [CM-3, SA-11]
    tests:
      - tests/test_icx_mdz_01_modernisation.py::test_the_modernisation_page_reads_apps_waves_and_the_bundle
      - tests/test_icx_mdz_01_modernisation.py::test_approving_a_cam_jobs_output_binds_its_files_and_is_taken_once

  - id: PM-MDZ-05
    title: Cloud-native output is read from its jobs, never re-run
    text: >-
      The cloud-native jobs and the twelve factors are read back from what the
      jobs wrote; an unmeasured factor is unverified, never a pass, and a read
      runs no job.
    type: functional
    priority: medium
    features: [mdz.cloud_native]
    elements: [mdz.cloud_native, if.mdz.console]
    controls: [CM-2]
    tests:
      - tests/test_icx_mdz_01_modernisation.py::test_cloud_native_reads_the_jobs_and_the_section_without_running_any

  - id: PM-MDZ-06
    title: The bundle is previewed, and a decisions export is trusted only against the pinned JWKS
    text: >-
      The exporter's bundle is assembled and validated without being written.
      A signed ICDEV[OS] decisions export is verified against the JWKS the
      operator pinned, never a key that came with it; may-plan and may-retire
      are answered only for a trusted export.
    type: interface
    priority: high
    features: [mdz.exporter]
    elements: [mdz.exporter, if.mdz.console]
    controls: [SC-12, SI-7]
    tests:
      - tests/test_icx_mdz_01_modernisation.py::test_the_modernisation_page_reads_apps_waves_and_the_bundle
      - tests/test_icx_mdz_01_modernisation.py::test_a_decisions_export_is_trusted_only_against_the_pinned_jwks

  - id: PM-MDZ-07
    title: The twin observes modernisation with threads, and agents only read it
    text: >-
      The modernisation twin finds unrecorded strategies, plans that diverge
      from them, decisions outside the declared workflow, waiting drafts and
      unreviewed or missing generated files, each with a thread, and replays;
      an unreadable source is unverified. Its MCP tools are read-only.
    type: non_functional
    priority: high
    features: [mdz.seven_r, mdz.aiify, mdz.processify, mdz.waves_cam, mdz.cloud_native, mdz.exporter]
    elements: [mdz.twin, if.mdz.mcp]
    controls: [CA-7, AU-6]
    tests:
      - tests/test_icx_mdz_01_modernisation.py::test_the_twin_finds_each_gap_with_its_thread
      - tests/test_icx_mdz_01_modernisation.py::test_an_unreadable_source_is_unverified_never_a_pass
      - tests/test_icx_mdz_01_modernisation.py::test_the_twin_observes_records_and_replays
      - tests/test_icx_mdz_01_modernisation.py::test_the_modernisation_mcp_tools_are_registered_read_only
      - tests/test_icx_mdz_01_modernisation.py::test_the_pages_call_their_routes_by_endpoint_id

  - id: PM-MDZ-08
    title: Every 7R criterion is the catalogue's, by name; a mismatch is refused
    text: >-
      Each fitness check returns exactly its strategy's catalogue criteria, by
      name. A check or catalogue criterion renamed on one side, or a custom
      weight naming a criterion the catalogue does not declare, is refused
      (CriteriaMismatch) and no assessment is written. Nothing is paired by
      list position.
    type: functional
    priority: high
    features: [mdz.seven_r]
    elements: [mdz.seven_r]
    controls: [SA-11, SI-10]
    tests:
      - tests/test_icx_mdz_02_seven_r_evidence.py::test_every_check_returns_exactly_its_catalogue_criteria_by_name
      - tests/test_icx_mdz_02_seven_r_evidence.py::test_a_renamed_criterion_is_refused_never_paired_by_position
      - tests/test_icx_mdz_02_seven_r_evidence.py::test_custom_weights_must_name_the_catalogues_criteria

  - id: PM-MDZ-09
    title: An unmeasured criterion lowers confidence and never scores 0.5
    text: >-
      A criterion the assessor cannot measure is None: it is left out of the
      score and lowers the strategy's confidence (the share of its criterion
      weight measured). A strategy with nothing measured is not assessable
      and has no score. Only a strategy whose confidence reaches the
      catalogue's min_confidence_to_recommend is recommended; when none does,
      nothing is, and the assessment says why.
    type: functional
    priority: high
    features: [mdz.seven_r]
    elements: [mdz.seven_r]
    controls: [SA-11, CA-2]
    tests:
      - tests/test_icx_mdz_02_seven_r_evidence.py::test_an_unmeasured_input_lowers_confidence_and_never_counts_half
      - tests/test_icx_mdz_02_seven_r_evidence.py::test_a_strategy_with_nothing_measured_is_not_assessable
      - tests/test_icx_mdz_02_seven_r_evidence.py::test_only_a_strategy_at_the_minimum_confidence_is_recommended
      - tests/test_icx_mdz_02_seven_r_evidence.py::test_the_bundle_ranks_only_assessable_strategies
      - tests/test_icx_retire_fitness.py::test_unmeasured_is_left_out_never_half

  - id: PM-MDZ-10
    title: One 7R engine; the other generators consume its result
    text: >-
      The migration-intelligence strategy generator and the COA engine never
      score 7R. Their recommended option is the assessor's latest
      recommendation for the application, with its confidence; with no
      assessment, or one that recommends nothing, they recommend nothing.
      The same application gets the same strategy from all three.
    type: functional
    priority: high
    features: [mdz.seven_r]
    elements: [mdz.seven_r, mdz.seven_r_consumers]
    controls: [SA-8]
    tests:
      - tests/test_icx_mdz_02_seven_r_evidence.py::test_the_three_generators_give_the_same_strategy_for_the_same_app
      - tests/test_icx_mdz_02_seven_r_evidence.py::test_no_assessment_or_no_evidence_means_no_generator_recommends
      - tests/test_icx_mdz_02_seven_r_evidence.py::test_the_coa_chat_says_a_technology_alone_recommends_nothing

  - id: PM-MDZ-11
    title: No plan without ICDEV[OS]'s signed may-plan, and the refusal is audited and shown
    text: >-
      monolith_decomposer --create-plan and refactor_jobs verify ICDEV[OS]'s
      signed decisions export against the pinned JWKS and ask may-plan for
      the application and strategy before anything is written. Missing,
      untrusted or refused writes no plan, task, CAM project or job, exits
      3 with the reason, and is recorded in the append-only audit trail;
      /migration lists the refusals, and the MCP plan tool says refused.
    type: functional
    priority: high
    features: [mdz.seven_r, mdz.waves_cam, mdz.exporter]
    elements: [mdz.plan_gate, if.mdz.console]
    controls: [AC-3, CM-3, AU-2]
    tests:
      - tests/test_icx_mdz_02_seven_r_evidence.py::test_may_plan_refused_or_missing_writes_no_plan
      - tests/test_icx_mdz_02_seven_r_evidence.py::test_the_planner_cli_and_the_mcp_tool_say_refused
      - tests/test_icx_mdz_02_seven_r_evidence.py::test_refactor_jobs_write_nothing_without_may_plan
      - tests/test_icx_mdz_02_seven_r_evidence.py::test_the_7r_page_shows_confidence_unmeasured_and_the_refusal
      - tests/test_icx_modsamples_pipeline.py::test_the_first_run_plans_nothing_without_icdev_os_may_plan

  - id: PM-MDZ-12
    title: The twin finds thin 7R evidence and plans attempted without may-plan, with threads
    text: >-
      The modernisation twin finds a latest assessment that recommends
      nothing or rests on confidence below seven_r_confidence_warn (or
      predates criteria keyed by name), and a plan refused for want of
      may-plan until the application is planned after it. Each finding has a
      thread (mdz_assessment, audit_trail) that resolves, the observation
      replays, and the MCP read tool carries confidence and unmeasured
      criteria.
    type: non_functional
    priority: high
    features: [mdz.seven_r]
    elements: [mdz.twin, if.mdz.mcp]
    controls: [CA-7, AU-6]
    tests:
      - tests/test_icx_mdz_02_seven_r_evidence.py::test_the_twin_finds_thin_evidence_and_plans_attempted_without_may_plan
      - tests/test_icx_mdz_02_seven_r_evidence.py::test_the_twin_observes_a_refusal_resolves_its_thread_and_replays
      - tests/test_icx_mdz_02_seven_r_evidence.py::test_the_mcp_read_tool_carries_confidence_unmeasured_and_refusals

  - id: PM-MDZ-13
    title: Features come from source and REA without a model, with file:line or route evidence
    text: >-
      bundle_features groups the analyser's entry points into features and
      locates each handler's declaration line; a route an REA observed
      inventory names makes a feature both or observed, never one read from
      source alone. Capability hints come from the reviewed rule set
      (args/modernisation_signatures.yaml) with the words matched and where,
      and are hints, never mappings. The same source gives the same extract.
    type: functional
    priority: high
    features: [mdz.exporter]
    elements: [mdz.bundle_features]
    controls: [SA-11, SI-10]
    tests:
      - tests/test_icx_mdz_03_bundle_features.py::test_features_carry_file_line_evidence_and_capability_hints
      - tests/test_icx_mdz_03_bundle_features.py::test_an_observed_route_makes_a_feature_both_or_observed
      - tests/test_icx_mdz_03_bundle_features.py::test_the_same_source_gives_the_same_extract

  - id: PM-MDZ-14
    title: Processes come without a model, each with a step signature under a reviewed rule set
    text: >-
      A static process is the actions one controller offers, in source
      order (its handlers, or a dispatcher's branches), said to be no
      observed sequence; an observed one is an REA capture. Each step is
      normalised to verb:object by the reviewed rules; the step signature is
      that list, its SHA-256 and the rules' digest. A rule YAML would read as
      a boolean is refused. Process-Ify's --from-source asks no model.
    type: functional
    priority: high
    features: [mdz.exporter]
    elements: [mdz.bundle_features]
    controls: [SA-11, CM-2]
    tests:
      - tests/test_icx_mdz_03_bundle_features.py::test_a_step_is_normalised_by_the_reviewed_rules_and_digested
      - tests/test_icx_mdz_03_bundle_features.py::test_a_rule_yaml_reads_as_a_boolean_is_refused
      - tests/test_icx_mdz_03_bundle_features.py::test_a_static_process_is_one_controllers_actions_in_source_order
      - tests/test_icx_mdz_03_bundle_features.py::test_an_observed_capture_is_a_process_with_its_signature
