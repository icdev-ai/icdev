  - id: PM-MDZ-17
    title: The bundle carries what ICDEV[OS] 1.189.0 accepts, inline, and is held to that contract
    text: >-
      The vendored icos-apptwin/v1 schema is ICDEV[OS]'s 1.189.0, pinned by
      SHA-256. A feature read from source and seen running is provenance
      both (basis source), with its capability hints; a process carries its
      source, feature, order, derivation, step signature and review, and
      each step its verb, object, signature, evidence and APIs; sections is
      the bundle's own map. Every bundle the exporter writes is validated
      against the pinned schema and the importer's agreement rules (sections
      agreeing with what is carried, provenance against basis, signatures
      digesting their steps, reviews at their digest), and refused when it
      fails. The features.json side file is retired.
    type: interface
    priority: high
    features: [mdz.exporter]
    elements: [mdz.bundle_contract, mdz.exporter, mdz.bundle_features]
    controls: [SI-7, SI-10, CM-8]
    tests:
      - tests/test_icx_mdz_04_bundle_fields.py::test_the_vendored_contract_is_icos_1_189_0_pinned_by_digest
      - tests/test_icx_mdz_04_bundle_fields.py::test_a_feature_seen_both_ways_is_both_with_its_hints_inline
      - tests/test_icx_mdz_04_bundle_fields.py::test_processes_carry_source_signature_review_and_step_fields
      - tests/test_icx_mdz_04_bundle_fields.py::test_a_reviewed_process_is_exported_reviewed_at_its_digest
      - tests/test_icx_mdz_04_bundle_fields.py::test_the_sections_map_is_inline_and_agrees_with_what_is_carried
      - tests/test_icx_mdz_04_bundle_fields.py::test_icos_agreement_rules_refuse_what_the_importer_would
      - tests/test_icx_mdz_04_bundle_fields.py::test_the_real_bundles_meet_the_pinned_contract_inline_with_no_side_file

  - id: PM-MDZ-18
    title: 7R and waves carry what they rest on; retire reads only ICDEV[OS]'s signed, measured redundancy
    text: >-
      Each ranked strategy carries its confidence, unmeasured criteria and
      whether it is assessable, and the recommendation its confidence.
      Retire's functional_redundancy is ICDEV[OS]'s measured redundancy,
      read only from its signed decisions export verified against the pinned
      JWKS; a missing, untrusted, unmeasured or unreported one leaves the
      criterion unmeasured, never a score, and no unsigned file is read.
      Waves derived before any plan are derived_waves, never approved; a
      planned wave carries the sum of its tasks' estimates, absent (never 0)
      where unknown, and no date is made up.
    type: functional
    priority: high
    features: [mdz.seven_r, mdz.exporter]
    elements: [mdz.bundle_contract, mdz.seven_r, mdz.plan_gate]
    controls: [SA-11, CA-2]
    tests:
      - tests/test_icx_mdz_04_bundle_fields.py::test_the_7r_carries_confidence_unmeasured_and_assessable_as_fields
      - tests/test_icx_mdz_04_bundle_fields.py::test_waves_before_a_plan_are_derived_and_carry_no_estimate
      - tests/test_icx_mdz_04_bundle_fields.py::test_a_planned_wave_carries_the_sum_of_its_tasks_estimates_and_none_is_never_zero
      - tests/test_icx_retire_fitness.py::test_retire_reads_icos_measured_redundancy_only_from_the_signed_export
      - tests/test_icx_retire_fitness.py::test_the_assessment_reads_the_configured_export_and_records_what_it_read
