      - tests/test_icx_mdz_06_ambient.py::test_the_result_and_its_signoff_are_read_back_and_the_bundle_carries_it

  - id: PM-MDZ-23
    title: Independence is a person separate from the plan, signing at the result's digest; only a signed result is carried
    text: >-
      An independent person signs off or refuses the result, with a reason, on
      the Modernisation page (decl-wft-mdz-survivor-ivv-signoff, separate_from
      builders): refused to anyone who recorded the application's 7R strategy,
      reviewed a CAM job, its capacity or a process, or whom ICDEV[OS] named
      accepting, endorsing or approving its plan; a step whose caller names no
      builders is refused. Bound to the result's digest and taken once; a newer
      result leaves it stale. The bundle carries the IV&V in ICDEV[OS]
      1.189.0's own ivv section (kind independent, the signer as assessor, only
      measured areas scored) only while it is signed at the current digest, and
      otherwise says why; it validates either way. The twin flags an unsigned,
      stale or refused result and areas not passed, threaded to the result's
      audit row, and replays; the MCP tool is read-only.
    type: non_functional
    priority: high
    features: [mdz.exporter]
    elements: [mdz.survivor_ivv, mdz.twin, if.mdz.console, if.mdz.mcp]
    controls: [AC-5, CA-7, AU-10]
    tests:
      - tests/test_icx_mdz_06_survivor_ivv.py::test_signoff_by_the_plans_own_approver_is_refused
      - tests/test_icx_mdz_06_survivor_ivv.py::test_the_7r_record_cam_review_and_process_review_make_a_builder
      - tests/test_icx_mdz_06_survivor_ivv.py::test_the_signoff_is_a_declared_step_bound_to_the_digest_and_taken_once
