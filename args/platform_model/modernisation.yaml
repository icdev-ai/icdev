  - id: PM-MDZ-22
    title: A survivor's IV&V is ICDEV's own, per area, and unverified is never pass
    text: >-
      survivor_ivv runs ivv_assessor's requirements, checks and scores (IEEE
      1012) over the application's modernisation outputs (its CAM jobs' output,
      or a directory named) and records the result append-only: each process
      area pass only when every requirement there passed an automated check,
      fail when one failed, and otherwise unverified (not assessed, manual,
      semi-automated, or no outputs at all); its findings, each requirement's
      evidence digest, the outputs' manifest digest, the tool and its version,
      the date and the bundle's inventory digest, bound by one digest. CERTIFY
      only when every area passed, DENY on a critical finding. A record that
      does not match its own digest is refused.
    type: functional
    priority: high
    features: [mdz.exporter]
    elements: [mdz.survivor_ivv, mdz.bundle_contract]
    controls: [SA-11, CA-2, AU-10]
    tests:
      - tests/test_icx_mdz_06_survivor_ivv.py::test_an_unverified_area_never_passes
      - tests/test_icx_mdz_06_survivor_ivv.py::test_the_run_is_ivv_assessor_over_the_outputs_and_names_everything
      - tests/test_icx_mdz_06_survivor_ivv.py::test_a_tampered_record_is_refused
      - tests/test_icx_mdz_06_survivor_ivv.py::test_with_no_outputs_every_area_is_unverified_and_nothing_is_certified
