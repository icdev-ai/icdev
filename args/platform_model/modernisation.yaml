    text: >-
      The Modernisation page shows features with their evidence and hints,
      and processes with their steps and step signature. Confirming or
      rejecting one is the person's step (decl-wft-mdz-process-review),
      bound to the digest they saw, taken once; a changed signature makes it
      stale. The twin finds a bundle with no features, unreviewed processes
