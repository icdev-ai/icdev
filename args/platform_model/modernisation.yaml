  - id: PM-MDZ-20
    title: A wave carries its tasks' estimate, and dates only from a team capacity a person declared and reviewed
    text: >-
      Each wave's estimated_hours is the sum of its migration tasks' own
      estimates (none, never 0, where a task has none or none is on it). Its
      starts and ends are computed deterministically from a team capacity
      declared in args/modernisation_capacity.yaml (hours a week, a start, a
      source; shipped empty) and approved by a person at its digest: one wave at
      a time, in dependency order, over working days. No capacity, an unreviewed,
      rejected or changed one, no estimate, or an earlier undated wave: no date,
      and the planner and the bundle say why (unmeasured). Each date carries the
      capacity digest; the bundle carries them in the contract's own fields and
      still validates.
