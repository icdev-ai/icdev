      - tests/test_icx_modsamples_pipeline.py::test_the_bundle_carries_the_1_189_fields_and_the_resumed_7r_reads_the_signed_redundancy
      - tests/test_icx_mdz_04_ambient.py::test_a_planned_waves_estimate_is_read_from_its_tasks

  - id: PM-MDZ-19
    title: An application's security domain is declared with its source, never guessed; the twin and page say when it is not
    text: >-
      application.environment comes only from the declared environments
      file (args/modernisation_environments.yaml), each entry naming the
      deployment record it rests on; an entry without a source, with a field
      the contract has not, or an impact level off the ladder is refused. An
      undeclared application carries none and the run's report says why. The
      Modernisation page shows the 7R's confidence and unmeasured criteria,
      the security domain or why none, and the derived waves; the twin flags
      a bundle that fails the pinned contract or reports no security
      domain, threaded to the application, and replays; the MCP bundle tool
      carries the new fields.
