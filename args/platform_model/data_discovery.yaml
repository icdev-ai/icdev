# CUI // SP-CTI
# ICDEV platform model: the data discovery export to ICDEV[OS] (osx-cap-02). The Data Design
# Canvas's profiler, PII scanner, rule-based anomaly checks, quality rules and data-mesh
# catalogue are reused to build one icos-discovery/v1 bundle per declared source (metadata
# only, never a datum), against ICDEV[OS]'s published schema vendored and pinned here; a
# person who did not prepare it publishes it.
#
# requirement -> element -> code -> test (-> NIST control). Rules: see the
# header of args/platform_model/cortex.yaml.

component: data_discovery
project_id: icdev-platform

elements:
  - id: ddx.bundle
    type: sysml_element
    kind: block
    name: The icos-discovery/v1 bundle built from a stored profile (metadata only, pinned contract)
    features: [data.discovery_export]
    code:
      - tools/data_canvas/discovery_bundle.py::build
      - tools/data_canvas/discovery_bundle.py::schema
      - tools/data_canvas/discovery_bundle.py::validate
      - tools/data_canvas/discovery_bundle.py::content_digest
      - tools/data_canvas/discovery_bundle.py::load_config
      - tools/data_canvas/discovery_export.py::export
      - context/icos/discovery.schema.json
      - args/data_discovery_export.yaml

  - id: ddx.reuse
    type: sysml_element
    kind: block
    name: The canvas machinery reused (profiler, PII scanner, rule-based anomalies, quality rules, catalogue)
    features: [data.discovery_export]
    code:
      - tools/data_canvas/data_profiler.py::profile_database
      - tools/data_canvas/pii_scanner.py::scan_profile
      - tools/data_canvas/anomaly_detector.py::_rule_based_findings
      - tools/data_canvas/quality_engine.py::run_all_rules
      - tools/data_canvas/discovery_bundle.py::_anomalies
      - tools/data_canvas/discovery_bundle.py::_catalog

  - id: ddx.publish
    type: sysml_element
    kind: block
    name: Prepare, then a person publishes through a declared step, in an append-only hash-chained ledger
    features: [data.discovery_export]
    code:
      - tools/data_canvas/discovery_bundle.py::prepare
      - tools/data_canvas/discovery_bundle.py::publish
      - tools/data_canvas/discovery_bundle.py::published_bundle
      - tools/data_canvas/discovery_bundle.py::chain
      - tools/data_canvas/discovery_bundle.py::replay
      - tools/workflow_hitl/declared.py::take_step
      - tools/db/migrations/20261118113000_data_discovery_export_events/up.py
      - args/workflow_hitl_templates/data-discovery-publish.yaml

  - id: if.ddx.console
    type: sysml_element
    kind: interface_block
    name: The /data-discovery/ page and its routes, called by endpoint id
    features: [data.discovery_export]
    code:
      - tools/dashboard/templates/data_canvas/discovery_export.html
      - tools/data_canvas/discovery_blueprint.py::dd_export_page
      - tools/data_canvas/discovery_blueprint.py::dd_api_source
      - tools/data_canvas/discovery_blueprint.py::dd_api_prepare
      - tools/data_canvas/discovery_blueprint.py::dd_api_publish
      - tools/data_canvas/discovery_blueprint.py::dd_api_bundle
      - tools/data_canvas/discovery_blueprint.py::dd_api_twin

  - id: ddx.twin
    type: sysml_element
    kind: block
    name: The data discovery governance twin (threads to ledger rows, unverified when nothing is published)
    features: [data.discovery_export]
    code:
      - tools/twin_core/adapters/data_discovery.py
      - tools/data_canvas/discovery_bundle.py::twin_evidence
      - tools/data_canvas/discovery_bundle.py::twin_judge

  - id: if.ddx.mcp
    type: sysml_element
    kind: interface_block
    name: MCP data_discovery_export (read) and data_discovery_prepare (draft only)
    features: [data.discovery_export]
    code:
      - tools/mcp/gap_handlers.py::handle_data_discovery_export
      - tools/mcp/gap_handlers.py::handle_data_discovery_prepare

requirements:
  - id: PM-DDX-01
    title: A source's bundle is built against ICDEV[OS]'s published schema, vendored and pinned
    text: >-
      One icos-discovery/v1 bundle per source declared in args/data_discovery_export.yaml is
      built from its newest (or a named) stored Explore profile and validated against
      context/icos/discovery.schema.json, ICDEV[OS]'s published schema copied verbatim and
      pinned by its file SHA-256 and its body SHA-256 (the canonical JSON without
      x-icos-contract, which the bundle's schema_pin carries); a changed file is refused. Its
      content_digest is recomputable as ICDEV[OS] recomputes it, and the export is
      deterministic given its inputs. No source of this deployment is exported until one is
      declared; a test configuration is honoured only under tests/.
    type: interface
    priority: high
    features: [data.discovery_export]
    elements: [ddx.bundle]
    controls: [CM-2, SI-7]
    tests:
      - tests/test_osx_cap_02_discovery_export.py::test_the_schema_is_icos_published_copy_pinned_by_file_and_body
      - tests/test_osx_cap_02_discovery_export.py::test_the_sources_are_declared_and_another_config_must_live_under_tests
      - tests/test_osx_cap_02_discovery_export.py::test_the_export_is_deterministic_given_its_inputs

  - id: PM-DDX-02
    title: The bundle carries metadata only, from the canvas's own machinery, never a datum
    text: >-
      Each table's row count and each column's type, null and distinct counts; the PII columns
      the scanner flags, by pattern name; the anomalies the rule-based checks find, each with a
      fixed description (a model's findings are never exported, and the detector's outlier text,
      which embeds the range, is not carried); the design's quality rules with their latest
      results, a rule that never ran being null, never a pass; and the data-mesh products whose
      input port names the source. No top value, minimum, maximum or any datum leaves.
    type: functional
    priority: high
    features: [data.discovery_export]
    elements: [ddx.reuse, ddx.bundle]
    controls: [AC-4, SI-12]
    tests:
      - tests/test_osx_cap_02_discovery_export.py::test_the_bundle_carries_metadata_only_and_meets_the_contract
      - tests/test_osx_cap_02_discovery_export.py::test_the_outlier_text_and_a_model_never_reach_the_bundle

  - id: PM-DDX-03
    title: Publishing is a person's declared step, never the preparer's, in an append-only ledger
    text: >-
      Anyone, or an agent recorded as one, prepares a bundle, which records it at its digest in
      data_discovery_export_events (append-only by triggers, hash-chained per source) and
      decides nothing. A person who did not prepare it publishes it or refuses, with a reason,
      bound to the digest read (decl-wft-data-discovery-publish); only a published bundle carries
      its publication and leaves.
    type: functional
    priority: high
    features: [data.discovery_export]
    elements: [ddx.publish]
    controls: [AC-5, AU-9, AU-10]
    tests:
      - tests/test_osx_cap_02_discovery_export.py::test_publishing_is_a_persons_step_never_the_preparers
      - tests/test_osx_cap_02_discovery_export.py::test_the_ledger_is_append_only_and_hash_chained
      - tests/test_osx_cap_02_ambient.py::test_a_discovery_bundle_prepared_and_published_on_the_platform_database

  - id: PM-DDX-04
    title: The page, the twin and the agents' tools
    text: >-
      /data-discovery/ (in the nav, linked from Explore) shows a source's profiles, the bundle it
      would prepare, the ledger, prepare and the publish step, and the published bundle for
      download, every route named by endpoint id. The data_discovery twin observes
      data.discovery_export: a source never published, or no source declared, is unverified; a
      failing or never-run quality rule in a published bundle is a finding threaded to its ledger
      row, and an observation replays. MCP data_discovery_export reads; data_discovery_prepare
      only drafts and halts at the gate.
    type: functional
    priority: medium
    features: [data.discovery_export]
    elements: [if.ddx.console, ddx.twin, if.ddx.mcp]
    controls: [AU-6, SI-4]
    tests:
      - tests/test_osx_cap_02_discovery_export.py::test_the_routes_and_the_page
      - tests/test_osx_cap_02_discovery_export.py::test_the_twin_observes_with_threads_and_replays
      - tests/test_osx_cap_02_discovery_export.py::test_the_twin_says_unverified_when_nothing_is_declared_or_readable
      - tests/test_osx_cap_02_discovery_export.py::test_the_mcp_tools_read_and_only_prepare
