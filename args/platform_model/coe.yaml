# CUI // SP-CTI
# ICDEV platform model: the engineering standards register, on the IDP (icx-coe-01) --
# the first card of the Engineering CoE programme. One entry per standard, a
# declared lifecycle (propose -> review -> adopt -> deprecate), a standard without
# a check refused at adoption, seeds by reference.
#
# icx-coe-02 adds exemptions that expire (scope, mandatory expiry, a person's
# grant and renewal, an expired exemption FAILS) and ADRs as signed, versioned
# records with the flat ADR log generated from them.
#
# icx-coe-03 adds scorecards per repo against the ADOPTED standards (machine-scored, or
# needs evidence; an expired exemption fails), delivery evidence (DORA four keys plus
# AI-assisted rework from declared sources; no data is unverified) and one
# icos-conformance/v1 bundle per repo for ICDEV[OS], published by a person.
#
# requirement -> element -> code -> test (-> NIST control). Rules: see the
# header of args/platform_model/cortex.yaml.

component: idp
project_id: icdev-platform

elements:
  - id: coe.register
    type: sysml_element
    kind: block
    name: Engineering standards register (one entry per standard, seeds by reference)
    features: [coe.standards]
    code:
      - args/engineering_standards.yaml
      - tools/idp/standards.py::load_register
      - tools/idp/standards.py::normalise
      - tools/idp/standards.py::validate_entry
      - tools/idp/standards.py::validate_register
      - tools/idp/standards.py::pin_sources
      - tools/idp/standards.py::catalog_keys
      - tools/idp/standards.py::seed

  - id: coe.check
    type: sysml_element
    kind: block
    name: Check-as-code resolution (an IDP scorecard rule or a named manual evidence step)
    features: [coe.standards]
    code:
      - tools/idp/standards.py::resolve_check
      - tools/idp/scorecard.py::load_scorecards
      - args/scorecards/component-readiness.yaml

  - id: coe.lifecycle
    type: sysml_element
    kind: block
    name: Lifecycle through declared steps, author never the signer, append-only hash-chained ledger
    features: [coe.standards]
    code:
      - tools/idp/standards.py::propose
      - tools/idp/standards.py::review
      - tools/idp/standards.py::adopt
      - tools/idp/standards.py::deprecate
      - tools/idp/standards.py::builders
      - tools/idp/standards.py::chain
      - tools/idp/standards.py::replay
      - tools/workflow_hitl/declared.py::take_step
      - tools/db/migrations/20261117231010_coe_standard_events/up.py
      - args/workflow_hitl_templates/coe-standard-review.yaml
      - args/workflow_hitl_templates/coe-standard-adopt.yaml
      - args/workflow_hitl_templates/coe-standard-deprecate.yaml

  - id: coe.twin
    type: sysml_element
    kind: block
    name: Engineering standards governance twin (canvas idp)
    features: [coe.standards]
    code:
      - tools/twin_core/adapters/coe_standards.py::EngineeringStandardsTwin
      - tools/twin_core/governance.py::resolve_thread

  - id: coe.exemptions
    type: sysml_element
    kind: block
    name: Scorecard exemptions that expire (scope, mandatory expiry, standards waived, append-only hash-chained log)
    features: [coe.exemptions]
    code:
      - args/coe_records.yaml
      - tools/idp/exemptions.py::request_exemption
      - tools/idp/exemptions.py::resolve_scope
      - tools/idp/exemptions.py::validate_expiry
      - tools/idp/exemptions.py::decide_exemption
      - tools/idp/exemptions.py::request_renewal
      - tools/idp/exemptions.py::renew_exemption
      - tools/idp/exemptions.py::revoke_by_key
      - tools/idp/exemptions.py::migrate_legacy
      - tools/idp/exemptions.py::verify_chain
      - tools/idp/exemptions.py::check
      - tools/idp/scorecard.py::evaluate
      - tools/db/migrations/20261118010237_coe_exemptions_adrs/up.py
      - args/workflow_hitl_templates/coe-exemption-grant.yaml
      - args/workflow_hitl_templates/coe-exemption-renew.yaml

  - id: coe.adrs
    type: sysml_element
    kind: block
    name: ADRs as signed, versioned records; the flat ADR log generated from them
    features: [coe.adrs]
    code:
      - docs/reference/adrs/_layout.md
      - tools/idp/adrs.py::parse_flat
      - tools/idp/adrs.py::render
      - tools/idp/adrs.py::check_doc
      - tools/idp/adrs.py::validate_records
      - tools/idp/adrs.py::propose
      - tools/idp/adrs.py::accept
      - tools/idp/adrs.py::supersede
      - tools/idp/adrs.py::seed
      - tools/idp/adrs.py::export
      - tools/idp/adrs.py::chain
      - tools/idp/adrs.py::replay
      - args/workflow_hitl_templates/coe-adr-accept.yaml
      - args/workflow_hitl_templates/coe-adr-supersede.yaml

  - id: coe.conformance
    type: sysml_element
    kind: block
    name: Scorecards per repo against the adopted standards, and the icos-conformance/v1 bundle
    features: [coe.conformance]
    code:
      - args/coe_conformance.yaml
      - tools/idp/conformance.py::standard_results
      - tools/idp/conformance.py::exemption_rows
      - tools/idp/conformance.py::adr_summary
      - tools/idp/conformance.py::build
      - tools/idp/conformance.py::content_digest
      - tools/idp/conformance.py::validate
      - tools/idp/conformance_export.py::export
      - context/icos/conformance.schema.json

  - id: coe.delivery
    type: sysml_element
    kind: block
    name: Delivery evidence (DORA four keys and AI-assisted rework) from declared sources
    features: [coe.conformance]
    code:
      - tools/idp/dora.py::read_git
      - tools/idp/dora.py::normalise_ci
      - tools/idp/dora.py::normalise_board
      - tools/idp/dora.py::compute
      - tools/idp/conformance.py::read_sources

  - id: coe.publish
    type: sysml_element
    kind: block
    name: Prepare, then a person publishes; append-only hash-chained conformance ledger
    features: [coe.conformance]
    code:
      - tools/idp/conformance.py::prepare
      - tools/idp/conformance.py::publish
      - tools/idp/conformance.py::builders
      - tools/idp/conformance.py::published_bundle
      - tools/idp/conformance.py::chain
      - tools/idp/conformance.py::replay
      - tools/idp/conformance.py::twin_judge
      - tools/db/migrations/20261118024513_coe_conformance_events/up.py
      - args/workflow_hitl_templates/coe-conformance-publish.yaml

interfaces:
  - id: if.coe.console
    type: sysml_element
    kind: interface_block
    name: Console /idp/standards and its routes
    features: [coe.standards]
    code:
      - tools/dashboard/templates/idp/standards.html
      - tools/idp/blueprint.py::idp_standards_page
      - tools/idp/blueprint.py::idp_api_standard_propose
      - tools/idp/blueprint.py::idp_api_standard_adopt

  - id: if.coe.mcp
    type: sysml_element
    kind: interface_block
    name: MCP read and draft-only propose for the register
    features: [coe.standards]
    code:
      - tools/mcp/gap_handlers.py::handle_coe_standards
      - tools/mcp/gap_handlers.py::handle_coe_standard_propose

  - id: if.coe.records.console
    type: sysml_element
    kind: interface_block
    name: Console /idp/exemptions and /idp/adrs and their routes
    features: [coe.exemptions, coe.adrs]
    code:
      - tools/dashboard/templates/idp/exemptions.html
      - tools/dashboard/templates/idp/adrs.html
      - tools/idp/blueprint.py::idp_exemptions_page
      - tools/idp/blueprint.py::idp_api_exemption_decide
      - tools/idp/blueprint.py::idp_api_exemption_renew
      - tools/idp/blueprint.py::idp_adrs_page
      - tools/idp/blueprint.py::idp_api_adr_accept
      - tools/idp/blueprint.py::idp_api_adr_supersede

  - id: if.coe.records.mcp
    type: sysml_element
    kind: interface_block
    name: MCP reads and draft-only proposals for exemptions and ADRs
    features: [coe.exemptions, coe.adrs]
    code:
      - tools/mcp/gap_handlers.py::handle_coe_exemptions
      - tools/mcp/gap_handlers.py::handle_coe_exemption_request
      - tools/mcp/gap_handlers.py::handle_coe_adrs
      - tools/mcp/gap_handlers.py::handle_coe_adr_propose

  - id: if.coe.conformance.console
    type: sysml_element
    kind: interface_block
    name: Console /idp/conformance and its routes
    features: [coe.conformance]
    code:
      - tools/dashboard/templates/idp/conformance.html
      - tools/idp/blueprint.py::idp_conformance_page
      - tools/idp/blueprint.py::idp_api_conformance_repo
      - tools/idp/blueprint.py::idp_api_conformance_prepare
      - tools/idp/blueprint.py::idp_api_conformance_publish
      - tools/idp/blueprint.py::idp_api_conformance_bundle

  - id: if.coe.conformance.mcp
    type: sysml_element
    kind: interface_block
    name: MCP read and draft-only prepare for the conformance bundles
    features: [coe.conformance]
    code:
      - tools/mcp/gap_handlers.py::handle_coe_conformance
      - tools/mcp/gap_handlers.py::handle_coe_conformance_prepare

requirements:
  - id: PM-COE-01
    title: One entry per standard, sources by reference, the citation catalog untouched
    text: >-
      Each engineering standard has an id, version, owner (a dashboard role),
      sources, scope and a check-as-code. A source is a repo path (its sha256
      recorded with each event), a key of the WG 22 citation catalog, an https
      URL, or a file in another repo pinned at a commit with its digest; nothing
      is copied. args/standards_registry.yaml and its reader are unchanged.
      ICDEV[OS]'s interfaces and controls registers are referenced, pinned, and
      enter as proposals.
    type: functional
    priority: high
    features: [coe.standards]
    elements: [coe.register]
    controls: [CM-2, SA-8]
    tests:
      - tests/test_icx_coe_01_standards.py::test_the_register_validates_and_seeds_by_reference
      - tests/test_icx_coe_01_standards.py::test_every_owner_role_is_a_dashboard_role
      - tests/test_icx_coe_01_standards.py::test_the_citation_catalog_is_untouched_and_its_reader_still_validates
      - tests/test_icx_coe_01_standards.py::test_a_malformed_draft_is_refused

  - id: PM-COE-02
    title: A standard without a check is a wish, and adoption refuses it
    text: >-
      A check resolves only when its IDP scorecard rule exists under
      args/scorecards/, or its manual evidence step is named, says what a person
      does, and any file it names exists. Adoption refuses an entry whose check
      does not resolve before any step is taken, and a seed enters adopted only
      when its check resolves.
    type: functional
    priority: high
    features: [coe.standards]
    elements: [coe.check, coe.lifecycle]
    controls: [CA-2, SA-11]
    tests:
      - tests/test_icx_coe_01_standards.py::test_a_check_resolves_only_when_it_exists
      - tests/test_icx_coe_01_standards.py::test_adoption_refuses_a_standard_without_a_check
      - tests/test_icx_coe_01_standards.py::test_a_seed_without_a_check_cannot_enter_adopted

  - id: PM-COE-03
    title: The lifecycle is declared steps, the author never signs, nothing advances by itself
    text: >-
      Propose is a draft by anyone or an agent. Review, adoption and deprecation
      are a steward's declared steps (decl-wft-coe-standard-review, -adopt,
      -deprecate), each with a reason, bound to the entry digest read and
      refused to the version's author (separate_from builders). Each needs the
      state before it. An agent takes no step. A newer adopted version
      supersedes the one in force.
    type: functional
    priority: high
    features: [coe.standards]
    elements: [coe.lifecycle]
    controls: [AC-5, AU-10]
    tests:
      - tests/test_icx_coe_01_standards.py::test_propose_review_adopt_deprecate_with_history
      - tests/test_icx_coe_01_standards.py::test_the_author_is_never_the_reviewer_or_the_signer
      - tests/test_icx_coe_01_standards.py::test_a_steward_role_is_needed_and_a_reason
      - tests/test_icx_coe_01_standards.py::test_nothing_advances_out_of_order_and_a_step_is_bound_to_the_digest
      - tests/test_icx_coe_01_standards.py::test_an_agent_only_drafts
      - tests/test_icx_coe_01_standards.py::test_a_new_version_supersedes_the_one_in_force
      - tests/test_icx_coe_01_ambient.py::test_the_lifecycle_on_the_platform_database

  - id: PM-COE-04
    title: Status is the replay of an append-only, hash-chained ledger; seeds are labelled
    text: >-
      coe_standard_events is append-only (triggers on SQLite and PostgreSQL);
      each row carries the hash of its standard's previous row and
      UNIQUE(standard_id, prev_hash) stops a fork. A row that does not verify is
      named and the register refuses to change that standard. Seeds are written
      by the labelled bootstrap identity, never a person, idempotently.
    type: functional
    priority: high
    features: [coe.standards]
    elements: [coe.lifecycle, coe.register]
    controls: [AU-9, AU-10]
    tests:
      - tests/test_icx_coe_01_standards.py::test_the_ledger_is_append_only_and_a_forged_row_breaks_the_chain
      - tests/test_icx_coe_01_standards.py::test_two_events_cannot_follow_the_same_one
      - tests/test_icx_coe_01_standards.py::test_seeds_are_recorded_by_the_bootstrap_identity_never_a_person
      - tests/test_icx_coe_01_ambient.py::test_the_lifecycle_on_the_platform_database

  - id: PM-COE-05
    title: The console, the twin with threads, and an MCP read and draft-only propose
    text: >-
      /idp/standards (linked from the Developer Portal and the Canvases nav)
      lists the register, shows a standard's versions and history, offers the
      step it waits for and the propose form, calling its routes by endpoint id.
      The idp governance twin judges the ledger (broken chain, a check no longer
      resolving, a source drifted since adoption, bootstrap-only adoption, a
      waiting draft, an unrecorded seed); every finding's thread resolves to its
      ledger row, an unreadable source is unverified, and an observation
      replays. MCP coe_standards reads; coe_standard_propose only drafts and
      halts at the approval gate.
    type: functional
    priority: medium
    features: [coe.standards]
    elements: [if.coe.console, coe.twin, if.coe.mcp]
    controls: [AU-6, SI-4]
    tests:
      - tests/test_icx_coe_01_standards.py::test_the_routes_take_the_lifecycle_and_refuse_what_they_must
      - tests/test_icx_coe_01_standards.py::test_the_page_renders_the_register_and_its_controls
      - tests/test_icx_coe_01_standards.py::test_the_twin_observes_with_threads_that_resolve_and_replays
      - tests/test_icx_coe_01_standards.py::test_the_twin_says_unverified_when_the_ledger_cannot_be_read
      - tests/test_icx_coe_01_standards.py::test_the_mcp_tools_read_and_only_draft
      - tests/test_icx_coe_01_standards.py::test_the_cli_validates_and_lists

  - id: PM-COE-06
    title: Every exemption expires, has one declared scope and links to the standards it waives
    text: >-
      An exemption names a scorecard and one scope (rule, service, standard or repo)
      and links to the engineering standards it waives, each checked against the
      register. A request with no expiry, one not after today, or one beyond
      max_expiry_days is refused. An exemption past its expiry no longer exempts:
      it FAILS the scorecard (exemptions.gate fail, the rule failing with the lapse
      named) and the CI check, until a person renews or revokes it. A grant written
      into scorecard YAML, or an autoApprove switch, fails the check.
    type: functional
    priority: high
    features: [coe.exemptions]
    elements: [coe.exemptions]
    controls: [CA-7, CM-6]
    tests:
      - tests/test_icx_coe_02_exemptions.py::test_a_request_without_an_expiry_is_refused
      - tests/test_icx_coe_02_exemptions.py::test_an_expiry_must_be_after_today_and_within_the_horizon
      - tests/test_icx_coe_02_exemptions.py::test_scopes_resolve_and_link_the_standards_they_waive
      - tests/test_icx_coe_02_exemptions.py::test_an_expired_exemption_fails_the_scorecard_and_the_ci_check
      - tests/test_icx_coe_02_exemptions.py::test_a_config_grant_or_auto_approve_fails_the_check

  - id: PM-COE-07
    title: Granting and renewing are a person's declared step; nothing renews by itself; the log is append-only
    text: >-
      Granting (decl-wft-coe-exemption-grant) and renewing (decl-wft-coe-exemption-renew)
      are a person's declared steps, with a reason, bound to the exemption digest
      read, and refused to the requester and to whoever asked for the renewal. No
      automatic renewal, no timer that decides. Revoking is a stop with a reason.
      idp_rule_exemptions is append-only (triggers) and hash-chained; approved
      exemptions with no expiry are migrated by a labelled bootstrap identity with
      an expiry, never granted again.
    type: functional
    priority: high
    features: [coe.exemptions]
    elements: [coe.exemptions]
    controls: [AC-5, AU-9, AU-10]
    tests:
      - tests/test_icx_coe_02_exemptions.py::test_the_requester_is_never_the_approver_and_a_step_is_bound_to_the_digest
      - tests/test_icx_coe_02_exemptions.py::test_renewal_is_a_persons_step_and_nothing_renews_by_itself
      - tests/test_icx_coe_02_exemptions.py::test_revoking_is_a_stop_with_a_reason
      - tests/test_icx_coe_02_exemptions.py::test_the_log_is_append_only_and_hash_chained
      - tests/test_icx_coe_02_exemptions.py::test_legacy_exemptions_are_migrated_by_the_bootstrap_identity_never_granted
      - tests/test_icx_coe_02_exemptions.py::test_rows_carry_the_writers_label_and_a_person_reads_back_their_request
      - tests/test_icx_coe_02_ambient.py::test_an_exemption_lifecycle_on_the_platform_database

  - id: PM-COE-08
    title: ADRs are records; the flat ADR log is generated from them and drift fails
    text: >-
      Each ADR is a record (id, title, version, status, section, supersedes,
      superseded_by, links to platform-model requirements and engineering
      standards, context, decision, consequences, who recorded it). The flat doc
      is generated from the records and the layout; a drift fails the check. The
      migration from the flat doc is lossless, proved by regenerating it byte for
      byte. Every link names a real requirement or standard.
    type: functional
    priority: high
    features: [coe.adrs]
    elements: [coe.adrs]
    controls: [CM-2, CM-3]
    tests:
      - tests/test_icx_coe_02_adrs.py::test_the_migration_is_lossless
      - tests/test_icx_coe_02_adrs.py::test_the_flat_doc_is_generated_and_drift_fails_the_check
      - tests/test_icx_coe_02_adrs.py::test_every_record_validates_and_links_to_real_requirements_and_standards
      - tests/test_icx_coe_02_adrs.py::test_export_writes_the_record_and_the_doc_follows

  - id: PM-COE-09
    title: Accepting and superseding an ADR are declared steps; the author never signs
    text: >-
      ADR status is the replay of the append-only, hash-chained coe_adr_events.
      Propose is a draft by anyone or an agent. Accept or return
      (decl-wft-coe-adr-accept) and supersede or deprecate
      (decl-wft-coe-adr-supersede) are a person's steps, with a reason, bound to the
      record digest read, refused to the author (and, to supersede, to the
      successor's author); a successor must be accepted. Records are seeded by a
      labelled bootstrap identity, never a person.
    type: functional
    priority: high
    features: [coe.adrs]
    elements: [coe.adrs]
    controls: [AC-5, AU-10]
    tests:
      - tests/test_icx_coe_02_adrs.py::test_propose_accept_supersede_with_history
      - tests/test_icx_coe_02_adrs.py::test_the_author_is_never_the_signer
      - tests/test_icx_coe_02_adrs.py::test_supersede_needs_an_accepted_successor_and_neither_author
      - tests/test_icx_coe_02_adrs.py::test_records_are_seeded_by_the_bootstrap_identity_never_a_person
      - tests/test_icx_coe_02_adrs.py::test_the_ledger_is_append_only_and_hash_chained
      - tests/test_icx_coe_02_ambient.py::test_an_adr_lifecycle_on_the_platform_database

  - id: PM-COE-10
    title: The exemption and ADR pages, the twin with threads, and MCP reads and drafts
    text: >-
      /idp/exemptions (with each exemption's expiry state) and /idp/adrs, linked
      from /idp/standards, offer the step each item waits for and call their routes
      by endpoint id; the portal scorecard shows the exemption gate. The idp twin
      judges the exemption log and the ADR records and ledger: an expired
      exemption is a finding threaded to its row, a migrated one waits for the
      owner, an ADR record not in the ledger is unverified, never passed, and an
      observation replays. MCP coe_exemptions and coe_adrs read;
      coe_exemption_request and coe_adr_propose only draft and halt at the
      approval gate.
    type: functional
    priority: medium
    features: [coe.exemptions, coe.adrs]
    elements: [if.coe.records.console, coe.twin, if.coe.records.mcp]
    controls: [AU-6, SI-4]
    tests:
      - tests/test_icx_coe_02_exemptions.py::test_the_routes_take_the_steps_and_refuse_what_they_must
      - tests/test_icx_coe_02_exemptions.py::test_the_pages_render_and_link_from_the_standards_page
      - tests/test_icx_coe_02_exemptions.py::test_the_twin_reports_expired_and_migrated_exemptions_with_threads
      - tests/test_icx_coe_02_exemptions.py::test_the_mcp_tools_read_and_only_draft
      - tests/test_icx_coe_02_adrs.py::test_the_adr_routes_and_page
      - tests/test_icx_coe_02_adrs.py::test_the_twin_says_unverified_for_records_not_in_the_ledger

  - id: PM-COE-11
    title: Each repo is scored only against the adopted standards that apply to it
    text: >-
      Every standard in the register is listed for every repo declared in
      args/coe_conformance.yaml. A standard in force that the repo's declaration names is
      scored: a scorecard rule by machine across every service it applies to, with the
      live exemptions applied, and an EXPIRED exemption fails it, named; a manual evidence
      step is needs_evidence, never pass. A standard not in force is not_scored, one not
      declared for the repo is not_applicable, and a check that measured nothing (no
      service in scope, a scorecard that will not grade) is unverified.
    type: functional
    priority: high
    features: [coe.conformance]
    elements: [coe.conformance]
    controls: [CA-2, CA-7]
    tests:
      - tests/test_icx_coe_03_conformance.py::test_an_adopted_scorecard_standard_is_scored_by_machine
      - tests/test_icx_coe_03_conformance.py::test_a_manual_evidence_standard_needs_evidence_and_never_passes
      - tests/test_icx_coe_03_conformance.py::test_an_expired_exemption_fails_the_standard
      - tests/test_icx_coe_03_conformance.py::test_a_standard_not_adopted_is_listed_not_scored
      - tests/test_icx_coe_03_conformance.py::test_unverified_when_nothing_is_measured

  - id: PM-COE-12
    title: Delivery evidence is computed from declared sources, and no data is unverified
    text: >-
      Deployment frequency, lead time for changes, change failure rate, time to restore and
      the rework rate of AI-assisted deployments are computed deterministically from the git
      history of main, a CI-run snapshot passed in and a board export, by the definitions in
      args/coe_conformance.yaml. Each metric carries its window, sample size and source
      digests. A metric with no data (a missing source, no deployment, no observed outcome,
      no failure to restore from, no AI-assisted deployment old enough) is unverified, with
      why: never zero, never passed. No commit text leaves a repo.
    type: functional
    priority: high
    features: [coe.conformance]
    elements: [coe.delivery]
    controls: [CA-7, SI-4]
    tests:
      - tests/test_icx_coe_03_conformance.py::test_dora_definitions_on_a_planted_history
      - tests/test_icx_coe_03_conformance.py::test_a_metric_with_no_data_is_unverified_never_zero
      - tests/test_icx_coe_03_conformance.py::test_compute_is_deterministic_and_digests_its_sources
      - tests/test_icx_coe_03_conformance.py::test_read_git_from_a_real_checkout
      - tests/test_icx_coe_03_conformance.py::test_ci_and_board_snapshots_normalise_and_refuse_garbage

  - id: PM-COE-13
    title: One icos-conformance/v1 bundle per repo, against a pinned draft schema, deterministic
    text: >-
      Each repo's bundle carries its standards and their status, the scorecard results
      with evidence, the exemptions with expiry, the delivery metrics, the linked ADRs and
      the producer, version and time, and validates against
      context/icos/conformance.schema.json (a DRAFT for osx-coe-01, pinned by SHA-256).
      content_digest is the digest of its canonical content without produced_at and the
      publication, so the export is byte for byte the same given its inputs. ICDEV[IT],
      ICDEV[OS] and ICDEV[FT] are declared.
    type: interface
    priority: high
    features: [coe.conformance]
    elements: [coe.conformance]
    controls: [CM-2, SA-8]
    tests:
      - tests/test_icx_coe_03_conformance.py::test_the_bundle_validates_against_the_draft_schema_and_its_digest
      - tests/test_icx_coe_03_conformance.py::test_the_schema_is_pinned
      - tests/test_icx_coe_03_conformance.py::test_the_export_is_deterministic_given_its_inputs
      - tests/test_icx_coe_03_conformance.py::test_the_repos_and_definitions_are_declared

  - id: PM-COE-14
    title: A bundle is published by a person who did not prepare it, bound to its digest
    text: >-
      Preparing (anyone, or an agent's draft) records the bundle at its digest in the
      append-only, hash-chained coe_conformance_events and decides nothing. Publishing or
      refusing is a person's declared step (decl-wft-coe-conformance-publish), with a
      reason, bound to the digest read, refused to the preparer, to a service key and to a
      role that does not hold it. Only a published bundle carries its publication and
      leaves for ICDEV[OS].
    type: functional
    priority: high
    features: [coe.conformance]
    elements: [coe.publish]
    controls: [AC-5, AU-9, AU-10]
    tests:
      - tests/test_icx_coe_03_conformance.py::test_publishing_is_a_persons_step_never_the_preparers
      - tests/test_icx_coe_03_conformance.py::test_the_ledger_is_append_only_and_hash_chained
      - tests/test_icx_coe_03_ambient.py::test_a_bundle_prepared_and_published_on_the_platform_database

  - id: PM-COE-15
    title: The standards scorecards page, the twin with threads, and MCP read and draft
    text: >-
      /idp/conformance, linked from /idp/standards, /idp/exemptions, /idp/adrs, the portal
      and the nav, shows each repo's standards, exemptions, delivery evidence (sample
      sizes, unverified marked) and ADR links, and offers prepare and the publish step by
      endpoint id. The idp twin observes coe.conformance: a repo with no published bundle
      is unverified, a published failing standard, expired exemption or unverified metric
      is a finding threaded to its ledger row, and an observation replays. MCP
      coe_conformance reads; coe_conformance_prepare only drafts and halts at the gate.
    type: functional
    priority: medium
    features: [coe.conformance]
    elements: [if.coe.conformance.console, coe.twin, if.coe.conformance.mcp]
    controls: [AU-6, SI-4]
    tests:
      - tests/test_icx_coe_03_conformance.py::test_the_routes_and_the_page
      - tests/test_icx_coe_03_conformance.py::test_the_twin_observes_bundles_with_threads
      - tests/test_icx_coe_03_conformance.py::test_the_twin_says_unverified_when_the_ledger_cannot_be_read
      - tests/test_icx_coe_03_conformance.py::test_the_mcp_tools_read_and_only_prepare
