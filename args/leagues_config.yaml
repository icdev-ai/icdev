# CUI // SP-CTI
# FathomDesk leagues config — Phase 6.4.
#
# Tenant-scoped multi-team competitions + leaderboards. Hot-reloaded via
# file-mtime cache (tools/trading/leagues/engine.py).
#
# Compliance note: bragging-rights only. Prize money touches SEC/FINRA
# territory (investment-contest regulations) and requires per-tenant
# legal sign-off. Operators who want cash prizes must layer that in
# themselves — the league engine does not expose a prize field.

_schema_version: 1

# Ranking windows shown in the UI. Each value is the number of days to
# look back for XP + challenge aggregation. Add/remove entries to suit.
ranking_windows:
  weekly: 7
  monthly: 30
  all_time: null   # null = since league creation

# Weighting for the composite rank score (per member, per window):
#   score = xp_sum * xp_weight + challenges_completed * challenge_bonus
scoring:
  xp_weight: 1.0
  challenge_bonus: 50   # flat bonus per completed challenge within the window

# Hard limits.
limits:
  max_league_size: 100          # members per league
  max_leagues_per_user: 20      # leagues a single user can join
  max_leagues_per_tenant: 50    # leagues per tenant
  slug_max_len: 40
  name_max_len: 80
  description_max_len: 500
  join_code_length: 8

# Default ranking window shown on the leaderboard tab.
default_window: weekly
