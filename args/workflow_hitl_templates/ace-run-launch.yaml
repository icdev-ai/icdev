# CUI // SP-CTI
id: decl-wft-ace-run-launch
name: "ACE: launch or rerun a team"
description: >-
  A person launches a co-worker team from the console, or reruns one from a
  past session. The launch is the person's step. The ACE event dispatcher
  (ace_event_dispatcher, tools/ace/event_dispatcher.py) proposes a launch for
  each role that listens to an ACE event: a recommendation a holder decides at
  /decisions, which the dispatcher then spends once for exactly that launch. It
  launches without a person only under a live grant (decl-wft-ace-auto-dispatch).
decides: [ace_api.api_launch, ace_api.api_session_rerun]
effect: ACEController.launch, unchanged.
approval_policy: any_one
kickback_limit: 1
stages:
  - name: propose
    step_type: automated
    description: The console assembled the problem and the team.
  - name: launch
    step_type: manual
    role: run_approver
    holders: [admin, pm, developer, isso, co, cor, reviewer]
    decisions: {launch: affirm, rerun: affirm, decline: deny}
    # decline: a holder turns down an event's recommendation at /decisions (icx-ace-01).
    reason_required: [decline]
