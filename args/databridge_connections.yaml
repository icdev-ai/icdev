# CUI // SP-CTI
# Connection RECORDS for the connectors granted in databridge_agent_access.yaml.
#
# Seeded into db_connections by:
#     python -m tools.databridge.seed_connections --seed --json
#
# ---------------------------------------------------------------------------
# Two files, on purpose. databridge_agent_access.yaml answers "MAY this agent
# read this connector and table"; this file answers "WHERE does that connector
# read from, and how does it authenticate". They are separate because they have
# different reviewers and different change cadences: a grant is a security
# decision, an endpoint is an operations one, and merging them would mean every
# endpoint edit reopened the authorization review.
#
# The link between them is `id` here == `connection_id` in the grant. A grant
# pointing at an id with no row is a configuration error; the seeder's
# --verify reports it.
#
# ---------------------------------------------------------------------------
# NO SECRET VALUE MAY APPEAR IN THIS FILE.
#
# `auth_secret_ref` holds a REFERENCE resolved at use time by
# tools/databridge/connection_manager.py::resolve_secret, and the seeder REFUSES
# any value that is not one:
#
#     env:VAR_NAME          environment variable
#     vault:path#field      HashiCorp Vault KV
#     aws:name[#key]        AWS Secrets Manager (GovCloud)
#     file:secret_id        controlled path, air-gap fallback
#
# The refusal is not advisory. A literal here would be committed to a public
# repository, would survive every later rotation, and would be indistinguishable
# from a reference to anything reading the column. `auth_method: none` must
# carry no ref at all.

version: databridge-connections-1.0

connections:
  # -------------------------------------------------------------------------
  # Federal Register — NIST documents. No credential exists for this source: the
  # feed is world-readable, so auth_method is `none` and there is no secret to
  # resolve — the strongest possible form of "no secret literal in YAML".
  #
  # classification is the LABEL `UNCLASSIFIED`, never the banner
  # 'CUI // SP-CTI' the column defaults to. get_connection() injects
  # `classification IN (<labels the caller's clearance dominates>)` into every
  # SELECT, and that set is drawn from the label vocabulary — a row labelled
  # with a banner string matches no member of it at any clearance and would be
  # written, retained and invisible.
  - id: federal-register-nist
    name: Federal Register - NIST Documents
    connector_name: rss
    connector_type: saas_api
    auth_method: none
    sync_direction: read
    status: configured
    classification: UNCLASSIFIED
    impact_level: IL2
    config:
      feed_url: https://www.federalregister.gov/api/v1/documents.rss?conditions%5Bagencies%5D%5B%5D=national-institute-of-standards-and-technology
      feed_id: federal_register_nist
      # Passed to tools/http/egress_guard.py by the connector, which the broker
      # now reaches by loading this row and calling connect() with it — before
      # that, this key would have been declared and never enforced. It is a
      # second, independent restriction on top of the grant's exact-URL
      # allowlist: the grant says which URL an agent may name, this says which
      # host a socket may open to. Note what it does NOT cover — feedparser
      # follows redirects itself, so only the first hop is checked.
      egress_allowlist:
        - www.federalregister.gov
      egress_denylist: []

  # -------------------------------------------------------------------------
  # floci AWS service emulator (flx-bridge-02) — the LOCAL emulated estate.
  #
  # auth_method IS `none`, AND THAT IS THE MEASURED ANSWER, not a convenience.
  # tools/cloud/emulator.py::credentials() is hard-wired to return the dummy
  # pair ("test", "test") and DELIBERATELY does not read the ambient AWS
  # environment — its docstring says why: those values are handed to
  # `docker run -e` and into a Terraform provider block, so honouring a real
  # AWS_ACCESS_KEY_ID would give live GovCloud keys to a container talking to
  # localhost. There is therefore no credential to reference, and declaring
  # `auth_secret_ref: env:FLOCI_ACCESS_KEY_ID` would be three separate defects
  # at once: the seeder refuses a ref under auth_method `none`; under any other
  # auth_method the broker resolves it and injects it under `api_key`, a key
  # this connector never reads (declared and never consumed); and
  # resolve_secret() raises on an unset variable, so a shipped grant would
  # refuse EVERY call on any deployment that had not exported it.
  #
  # That also keeps tests/test_databridge_first_grant.py's standing rule intact
  # without weakening it: no shipped grant reaches a credentialed system.
  #
  # `endpoint` is deliberately NOT pinned here. flx-seam-01 made
  # tools/cloud/emulator.py the ONE emulator switch, and a second copy in this
  # row would be a second switch. The seam decides WHERE; this row decides the
  # CEILING on where — which is exactly what egress_allowlist below is.
  - id: floci-emulator-local
    name: floci AWS Emulator (local)
    connector_name: floci
    connector_type: saas_api
    auth_method: none
    sync_direction: read
    status: configured
    classification: UNCLASSIFIED
    impact_level: IL2
    config:
      # THE ENDPOINT HOST, AND NOTHING ELSE. Enforced by
      # FlociConnector._assert_endpoint_allowed at the point the destination is
      # decided, so it covers the boto3 tables too — five of the seven never
      # pass through urllib, so a per-URL guard would have covered two.
      #
      # NOT enforced by saas_base._guard_egress, and the reason is measured
      # (2026-09-05): egress_guard is an INTERNET SSRF gate and refuses this
      # connector's own default endpoint twice over —
      # `http://localhost:4566/_localstack/health` -> scheme_not_https, and the
      # https spelling -> denied_ip_range. A loopback emulator reached over
      # plain http is precisely the destination that guard exists to refuse. The
      # applicable half of its rule (which HOST) is applied from its own
      # `host_allowed`; the inapplicable half (https-only, resolve-then-range-
      # check) is named rather than quietly dropped. This is a HOST allowlist,
      # not an SSRF gate, and it performs no DNS resolution.
      #
      # Three entries because they are three spellings of ONE destination —
      # this machine's emulator. A deployment running floci on another host must
      # add that host here, which is the review this list exists to force.
      # Matching is egress_guard's suffix rule, so `localhost` also covers
      # `*.localhost`; every such name resolves to loopback anyway.
      egress_allowlist:
        - localhost
        - 127.0.0.1
        - "::1"
      egress_denylist: []

  # floci-az Azure service emulator (flx-az-01) — the LOCAL emulated estate.
  #
  # A SECOND CONNECTION, not a second config on the floci row. The two are
  # different emulators on different ports with different health paths, and a
  # deployment may legitimately run one, both or neither.
  #
  # `endpoint` is deliberately NOT pinned here, for the same reason as the floci
  # row above: tools/cloud/emulator_az.py is the ONE Azure emulator switch and a
  # second copy in this row would be a second switch. The seam decides WHERE;
  # this row decides the CEILING on where.
  #
  # READ ONLY, and the connector enforces it rather than relying on this line:
  # FlociAzConnector.capabilities.supports_write is False and write() returns an
  # `unsupported` refusal naming the absent Azure IaC executor. sync_direction
  # below records the same fact where an operator reads it.
  - id: floci-az-emulator-local
    name: floci-az Azure Emulator (local)
    connector_name: floci_az
    connector_type: saas_api
    auth_method: none
    sync_direction: read
    status: configured
    classification: UNCLASSIFIED
    impact_level: IL2
    config:
      # THE ENDPOINT HOST, AND NOTHING ELSE. Enforced by
      # FlociAzConnector._assert_endpoint_allowed at the point the destination
      # is decided, so it covers every ARM fan-out call rather than only the
      # ones routed through one helper.
      #
      # NOT enforced by saas_base._guard_egress, and the reason is the same one
      # measured for the AWS emulator on 2026-09-05: egress_guard is an INTERNET
      # SSRF gate and refuses this connector's own default endpoint twice over —
      # `http://localhost:4577` is scheme_not_https, and the https spelling is
      # denied_ip_range. A loopback emulator over plain http is precisely the
      # destination that guard exists to refuse. The applicable half of its rule
      # (which HOST) is applied from its own `host_allowed`; the inapplicable
      # half is named rather than quietly dropped. This is a HOST allowlist, not
      # an SSRF gate, and it performs no DNS resolution.
      #
      # IT MATTERS MORE HERE THAN FOR THE AWS EMULATOR. floci-az serves an IMDS
      # token endpoint of its own at /metadata/identity/oauth2/token — measured
      # 2026-09-05, it issues a real signed JWT. A seam mis-set toward the real
      # link-local 169.254.169.254 must be refused, not dialled.
      #
      # Three entries because they are three spellings of ONE destination: this
      # machine's emulator. A deployment running floci-az on another host must
      # add that host here, which is the review this list exists to force.
      egress_allowlist:
        - localhost
        - 127.0.0.1
        - "::1"
      egress_denylist: []
