# CUI // SP-CTI
# FathomDesk Phase 7.6 — coach rule thresholds.
#
# Consumed by tools/trading/options/coach_engine.py. All values are
# operator-tunable. Hot-reloadable via mtime.

_schema_version: 1

# Profit-target trigger — emit when unrealized P&L crosses this fraction
# of the original max-profit estimate.
profit_target_fraction: 0.50      # 50% of max_profit → 'profit_target'

# Loss threshold — emit when loss exceeds N× the credit received (for
# short-premium plays) or N× the debit paid (long-premium).
loss_threshold_mult: 2.0

# DTE warnings.
dte_warning_days: 7               # "expires in ≤ 7 days"
dte_roll_window_days: 21          # "consider rolling" (still > warning)

# IV crush — emit when IV has fallen by ≥ this many percentage points
# since the position was opened.
iv_crush_pct: 20

# Dedupe window — don't re-emit the same event type for the same
# position inside this many hours (escalation still allowed).
dedupe_hours: 24

# ── Portfolio-level Greek exposure alert thresholds ──────────────────────────
# Consumed by tools/trading/options/coach.py:check_greek_exposure().

# Cooldown: don't re-fire the same alert_type for the same user within N hours.
greek_alert_cooldown_hours: 4

# |net_delta| > N share-equivalents → 'delta_high'
greek_delta_shares: 500

# net_theta < -N USD/day → 'theta_burn'
greek_theta_day_usd: 50

# |net_vega| > N USD per 1% IV move → 'vega_exposure'
greek_vega_per_iv_usd: 200

# |net_gamma| > N → 'gamma_elevated'
greek_gamma_abs: 50
