# Technical Analysis configuration — hot-reloadable (edit without restart)
swing_threshold_pct: 1.5    # % retracement required to confirm a swing high/low
vp_bucket_count: 40         # number of price buckets for volume profile
sr_proximity_pct: 0.5       # % proximity to cluster S/R levels
wedge_swing_n: 10           # number of swing points used in wedge pattern detection
sr_tolerance_pct: 0.5       # % tolerance for S/R level clustering

traps:
  breakout_volume_ratio: 0.7  # breakout vol < this * 20-bar avg → weak-volume breakout
  vol_lookback: 20            # bars to average for volume baseline
  max_reentry_bars: 3         # bars after breakout to look for re-entry close
  confirmation_lookback: 5    # bars after re-entry to look for lower-high/higher-low
