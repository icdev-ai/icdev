# CUI // SP-CTI
# INSERT / Live Schema Parity Gate (swp-gate-01)
#
# Consumed by: tools/workflow/coherence_checker.py :: _load_insert_schema_gate
# Gate source: tools/workflow/coherence_checker.py :: check_insert_schema_parity
#
# Every column named in a static INSERT under tools/ must exist in the LIVE
# database schema (information_schema.columns on PostgreSQL, PRAGMA table_info
# on SQLite). A column that does not exist raises at runtime, and because these
# writes are almost always wrapped in "except Exception: pass" the feature
# reports success while persisting nothing. That is how module_budget_usage
# came to hold 0 rows and how tools/govcon never wrote a single audit_trail row.
#
# Rules:
#   - A NEW mismatch FAILS the gate. Fix the column list, or add a migration
#     that adds the column. Do not add new entries here to get a commit through.
#   - `grandfathered` entries are DOWNGRADED to a warning so the pre-existing
#     backlog stays visible without blocking unrelated work. They are the
#     swp-scan-01 work list; delete each one as it is fixed.
#   - Keys are `<repo-relative path>:<table>:<column>` — deliberately without a
#     line number, so an edit above the statement does not invalidate the entry.
#   - Entries that no longer reproduce are reported as stale and should be
#     deleted from this file.
#
# ignore_tables suppresses a table whose name collides with an unrelated table
# in this database. Modules that import their connection from outside the
# tools/ package (e.g. apps.geosigint.models) are skipped automatically and do
# not need an entry.

ignore_tables: []

# Baseline captured 2026-08-01 against the canonical PostgreSQL schema
# (1731 tables): 159 findings across 47 files, 146 distinct file/table/column
# entries (some statements repeat at more than one line). Tracked by swp-scan-01.
grandfathered:
  # tools/finetune/doc_extractor.py
  "tools/finetune/doc_extractor.py:rag_ingestion_log:chunk_count": "swp-scan-01 backlog — baselined 2026-08-01"
  # tools/playground/seed_data.py
  "tools/playground/seed_data.py:poam_items:due_date": "swp-scan-01 backlog — baselined 2026-08-01"
  "tools/playground/seed_data.py:poam_items:finding": "swp-scan-01 backlog — baselined 2026-08-01"
  "tools/playground/seed_data.py:poam_items:milestone": "swp-scan-01 backlog — baselined 2026-08-01"
  "tools/playground/seed_data.py:projects:compliance_score": "swp-scan-01 backlog — baselined 2026-08-01"
  # tools/saas/tenant_manager.py
  "tools/saas/tenant_manager.py:tenants:compartments": "swp-scan-01 backlog — baselined 2026-08-01"
  "tools/saas/tenant_manager.py:users:compartments": "swp-scan-01 backlog — baselined 2026-08-01"
