# CUI // SP-CTI
# Observability Design Canvas — Configuration
app:
  name: "Observability Design Canvas"
  version: "1.0.0"
  classification: "CUI // SP-CTI"

database:
  path: "odc_canvas.db"
  wal_mode: true
  foreign_keys: true

canvas:
  autosave_delay_ms: 3000
  grid_size: 10
  default_width: 110
  default_height: 60
  accent_color: "#4caf50"

uqs:
  weights:
    log_coverage: 0.25
    detection_capability: 0.25
    compliance_readiness: 0.20
    retention_health: 0.15
    integration_depth: 0.15
  thresholds:
    merge: 70
    deploy: 80
    release: 85
  grade_scale:
    A: 90
    B: 80
    C: 70
    D: 60

assessment:
  auto_assess_on_save: true
  default_rules:
    - ODC-LOG-001  # Log aggregation present
    - ODC-LOG-002  # All sources connected to collector
    - ODC-LOG-003  # Retention policy defined
    - ODC-LOG-004  # Encrypted log transport
    - ODC-LOG-005  # Centralized log platform
    - ODC-MET-001  # Metrics pipeline present
    - ODC-MET-002  # SLI / SLO defined
    - ODC-MET-003  # Dashboards configured
    - ODC-TRC-001  # Distributed tracing enabled
    - ODC-DET-001  # SIEM present
    - ODC-DET-002  # Alert rules defined
    - ODC-DET-003  # IDS/IPS integration
    - ODC-DET-004  # Anomaly detection enabled
    - ODC-RET-001  # Retention meets compliance (NIST AU-11)
    - ODC-SEC-001  # Audit trail (NIST AU-2)
    - ODC-SEC-002  # Vulnerability scanner present (NIST RA-5)
    - ODC-SEC-003  # Intrusion detection (NIST SI-4)
    - ODC-INT-001  # Integration with SDC monitoring controls
    - ODC-INT-002  # Integration with IDC health endpoints
    - ODC-COV-001  # MITRE ATT&CK coverage >= 60%
  thresholds:
    min_score: 70
    cat1_max: 0
    cat2_max: 5

gates:
  odc_sast:
    tool: "tools/security/sast_runner.py"
    blocking: false
    dimension: detection_capability
  odc_compliance:
    tool: "tools/compliance/multi_regime_assessor.py"
    blocking: false
    dimension: compliance_readiness
  odc_stig:
    tool: "tools/compliance/stig_checker.py"
    blocking: true
    dimension: compliance_readiness
  odc_health:
    tool: "tools/monitor/health_checker.py"
    blocking: true
    dimension: log_coverage
  odc_integrity:
    tool: "tools/security/blueprint_verifier.py"
    blocking: false
    dimension: retention_health
  odc_coherence:
    tool: "tools/workflow/coherence_checker.py"
    blocking: false
    dimension: integration_depth

mitre_detection:
  enabled: true
  min_coverage_pct: 60
  frameworks:
    - "ATT&CK Enterprise"
    - "ATT&CK ICS"

evidence:
  format: "oscal_json"
  retention_days: 365
  auto_emit: true

runbooks:
  auto_execute_confidence: 0.7
  max_auto_per_hour: 5
  cooldown_seconds: 600

templates:
  count: 6
  auto_seed: true

agent:
  auto_trigger_on_canvas_save: true
  auto_trigger_sdc_on_save: true
  auto_trigger_qdc_on_save: true
  cross_canvas_sync: true

logging:
  level: INFO
  audit_enabled: true
