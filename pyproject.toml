[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "icdev"
version = "1.2.42"
description = "ICDEV™ — Intelligent Certified Development Platform. AI-powered SDLC with NIST 800-53 RMF compliance, multi-agent orchestration, FORGE framework, and ANVIL build workflow."
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
authors = [
    {name = "Sovanna Chuon"},
]
keywords = ["devops", "compliance", "nist", "fedramp", "govcloud", "llm", "agentic", "sdlc", "forge", "anvil"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "flask>=3.0",
    "requests>=2.31",
    "python-dotenv>=1.0",
]

[project.urls]
Homepage = "https://icdev.ai/"
Documentation = "https://github.com/icdev-ai/icdev/tree/main/docs"
Repository = "https://github.com/icdev-ai/icdev"
Issues = "https://github.com/icdev-ai/icdev/issues"
Changelog = "https://github.com/icdev-ai/icdev/blob/main/CHANGELOG.md"

[project.optional-dependencies]
# Core LLM providers — air-gap safe (no Google/cloud auth required)
llm = [
    "openai>=1.0",
    "anthropic>=0.30",
    "ollama>=0.2",
]
# AWS Bedrock (requires AWS credentials, not Google auth)
llm-bedrock = [
    "boto3>=1.34",
]
# Google Gemini (pulls google-auth — NOT air-gap compatible)
llm-gemini = [
    "google-generativeai>=0.5",
]
# Azure OpenAI (uses openai SDK with Azure endpoint)
llm-azure = [
    "openai>=1.0",
]
# Google Vertex AI (pulls google-auth — NOT air-gap compatible)
llm-vertex = [
    "google-cloud-aiplatform>=1.40",
]
# Oracle Cloud GenAI
llm-oci = [
    "oci>=2.100",
]
# IBM watsonx.ai
llm-ibm = [
    "ibm-watsonx-ai>=1.0",
]
# All LLM providers (includes Google — use llm-airgap for restricted envs)
llm-all = [
    "icdev[llm,llm-bedrock,llm-gemini,llm-azure,llm-vertex,llm-oci,llm-ibm]",
]
# Local LLM only — zero cloud deps, zero auth, fully air-gapped
# Works with: vLLM, llama.cpp server, TGI, LocalAI, LM Studio, Ollama, etc.
# Any server exposing OpenAI-compatible /v1/chat/completions endpoint
# Config: set type: openai_compatible + base_url in args/llm_config.yaml
llm-local = [
    "openai>=1.0",       # OpenAI SDK used as client for any compatible server
    "ollama>=0.2",       # Native Ollama client (optional, openai_compatible also works)
]
# Air-gap safe: all non-Google providers (no google-auth, no tensorboard)
llm-airgap = [
    "icdev[llm-local,llm-bedrock,llm-azure]",
    "anthropic>=0.30",   # Direct Anthropic API (if on-prem proxy available)
]
# Semantic/keyword search
search = [
    "numpy>=1.26",
    "rank_bm25>=0.2",
]
# Test suite
testing = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "behave>=1.2",
    "ruff>=0.12",
    "pydantic>=2.0",
]
# Browser automation — the agent browser (tools/browser/) and tests/e2e_selenium/.
# Air-gap safe: the selenium PYTHON package is pure Python and installable offline;
# only the driver BINARY is the air-gap concern (see tools/browser/driver_manager.py
# + tools/airgap/driver_vendor.py). cdp-00 defect D3.
browser = [
    "selenium>=4.15.0",
]
# SaaS multi-tenancy (PostgreSQL, Redis, production WSGI — NOT needed for air-gap)
saas = [
    "psycopg2-binary>=2.9",
    "PyJWT>=2.12",
    "cryptography>=42.0",
    "gunicorn>=22.0",
    "redis>=5.0",
]
# Security scanning
security = [
    "bandit>=1.7",
    "pip-audit>=2.6",
    "detect-secrets>=1.4",
    "cyclonedx-bom>=4.0",
]
# Development
dev = [
    "icdev[testing,security]",
    "build>=1.0",
    "twine>=5.0",
]
# Image generation (Pulse hero images via SDXL Turbo on local GPU)
# Note: torch may pull tensorboard as transitive dep — use --no-deps torch
# then install torch deps manually if in air-gapped environment
image-gen = [
    "torch>=2.1",
    "diffusers>=0.27",
    "transformers>=4.36",
    "accelerate>=0.25",
]
# Network Design Canvas — topology design, circuit tracking, compliance audit
# Air-gap safe (all JS vendored locally, no CDN). Zero extra Python deps.
network = [
    "defusedxml>=0.7",   # Safe XML parsing for STIG import
    "networkx>=3.2",     # Graph analysis for NL topology queries
    "vsdx>=0.5",         # Visio VSDX import (masters, multi-page, Connect wiring)
    "lxml>=4.9",         # Required by vsdx for fast XML parsing
    "pdfplumber>=0.10",  # PDF vector extraction (rects/lines/text)
    "pypdfium2>=4.25",   # PDF rasterization (air-gap safe, bundles PDFium)
    "ciscoconfparse2>=0.7",  # Cisco IOS / NX-OS / ASA config parsing
]
# PostgreSQL backend (adds psycopg2 + production WSGI to any profile)
postgresql = [
    "psycopg2-binary>=2.9",
    "gunicorn>=22.0",
]
# ── Mission-oriented install profiles ────────────────────────────────
# Pick ONE profile at install time. All are air-gap safe except 'full'.
#
#   pip install icdev                          # base only (SQLite, no LLM)
#   pip install 'icdev[developer]'             # local LLM + testing + search
#   pip install 'icdev[govcloud]'              # IL4/IL5 GovCloud stack
#   pip install 'icdev[govcloud,postgresql]'   # govcloud + PostgreSQL
#   pip install 'icdev[dod-il6]'               # IL6 SECRET air-gap
#   pip install 'icdev[full-airgap]'           # everything air-gap safe
#   pip install 'icdev[full]'                  # everything (NOT air-gap)
#
# Developer — local LLM, testing, search, security scanning
developer = [
    "icdev[llm-local,search,testing,security]",
]
# GovCloud (IL4/IL5) — Bedrock + Anthropic, search, security, network canvas
govcloud = [
    "icdev[llm-airgap,search,security,network]",
]
# DoD IL6 SECRET — fully air-gapped, local LLM only, no cloud deps
dod-il6 = [
    "icdev[llm-local,search,security,network]",
]
# Everything (includes Google — NOT air-gap safe)
full = [
    "icdev[llm-all,search,testing,security,network,saas]",
]
# Air-gap safe full install (no Google auth, no tensorboard)
full-airgap = [
    "icdev[llm-airgap,search,testing,security,network]",
]
# Minimal air-gap: local LLM only + search (smallest footprint)
minimal-airgap = [
    "icdev[llm-local,search]",
]

[project.scripts]
icdev = "icdev.tools.cli.__main__:main"
icdev-init = "icdev.tools.cli.init:main"
icdev-enable = "icdev.tools.cli.enable:main"
icdev-init-db = "icdev.tools.db.init_icdev_db:main"
icdev-dashboard = "icdev.tools.dashboard.app:main"
icdev-mcp = "icdev.tools.mcp.unified_server:main"
icdev-mcp-core = "icdev.tools.mcp.standalone.core:main"
icdev-mcp-compliance = "icdev.tools.mcp.standalone.compliance:main"
icdev-mcp-builder = "icdev.tools.mcp.standalone.builder:main"
icdev-mcp-knowledge = "icdev.tools.mcp.standalone.knowledge:main"
icdev-mcp-maintenance = "icdev.tools.mcp.standalone.maintenance:main"
# `icdev init` (above) replaces the old `icdev-setup` scaffolder.

[tool.setuptools.packages.find]
include = ["icdev*"]
# Keep this list in sync with PARENT_ONLY_DIRS in
# tools/installer/sync_package_tree.py. These are owner-operated child apps
# and parent-platform services — NOT shipped in the public wheel.
# Framework/core subsystems (WriteGuard, canvases, genesis, oracle, etc.)
# ARE shipped.
exclude = [
    # Owner-operated child apps
    "icdev.tools.pulse*",
    "icdev.tools.proposal_genesis*",
    "icdev.tools.govcon*",
    "icdev.tools.rfx*",
    "icdev.tools.autoresearch*",
    "icdev.tools.scout*",
    "icdev.tools.creative*",
    "icdev.tools.trading*",
    "icdev.tools.market_intel*",
    # Parent-platform services
    "icdev.tools.saas*",
    "icdev.tools.marketplace*",
    "icdev.tools.gateway*",
    "icdev.tools.playground*",
    # Tests
    "tests*",
]

[tool.setuptools.package-data]
"icdev" = ["py.typed"]
"icdev.data" = [
    "args/**/*.yaml", "args/**/*.yml", "args/**/*.json",
    "context/**/*.json", "context/**/*.yaml", "context/**/*.md",
    "context/**/*.j2", "context/**/*.txt",
    # IQE seed queries. 295 .iqe files existed in the repo and NONE shipped, so
    # an installed ICDEV had the IQE engine and no queries to seed any canvas
    # with — `tools/api/v1/blueprint.py` serves this directory at runtime, and
    # CLAUDE.md's canvas completeness gate requires >=3 seed queries per canvas.
    "context/**/*.iqe", "context/**/*.jsonl", "context/**/*.conf",
    # RDF ontologies backing ontology_query / ontology_build.
    "args/**/*.ttl",
    "goals/**/*.md",
    "hardprompts/**/*.md",
    "features/**/*.feature", "features/**/*.py",
    "docs/**/*.md",
    # Claude bootstrap (CLAUDE.md, .claude/commands/, .claude/hooks/, .mcp.json)
    # Populated by tools/installer/prebuild_bootstrap.py before `python -m build`.
    "claude_bootstrap/**/*.md",
    "claude_bootstrap/**/*.json",
    "claude_bootstrap/**/*.py",
    "claude_bootstrap/**/*.yaml",
    "claude_bootstrap/**/*.yml",
    "claude_bootstrap/**/*",
]
"icdev.tools.dashboard" = [
    "templates/**/*.html",
    "static/**/*.css", "static/**/*.js",
    "static/vendor/**/*.js", "static/vendor/**/*.css",
]
"icdev.tools.db" = ["migrations/**/*.sql", "migrations/**/*.py", "migrations/**/*.json"]

[tool.setuptools.exclude-package-data]
"*" = ["__pycache__/*", "*.pyc", "*.pyo"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
timeout = 30
markers = [
    "selenium: marks tests that require a running Selenium/ChromeDriver (skip if unavailable)",
    "integration: marks tests that exercise live backends/corpora (opt-in; skipped by default)",
    "allow_open_transaction: test intentionally leaves a SQLite write transaction open (tsh-leak-01 guard opt-out)",
]


[tool.bandit]
skips = ["B608", "B310"]
