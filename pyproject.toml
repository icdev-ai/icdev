[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "icdev"
version = "1.2.6"
description = "ICDEV™ — Intelligent Certified Development Platform. AI-powered SDLC with NIST 800-53 RMF compliance, multi-agent orchestration, FORGE framework, and ANVIL build workflow."
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
authors = [
    {name = "Sovanna Chuon"},
]
keywords = ["devops", "compliance", "nist", "fedramp", "govcloud", "llm", "agentic", "sdlc", "forge", "anvil"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "flask>=3.0",
    "requests>=2.31",
    "python-dotenv>=1.0",
]

[project.urls]
Homepage = "https://icdev.ai/"
Documentation = "https://github.com/icdev-ai/icdev/tree/main/docs"
Repository = "https://github.com/icdev-ai/icdev"
Issues = "https://github.com/icdev-ai/icdev/issues"
Changelog = "https://github.com/icdev-ai/icdev/blob/main/CHANGELOG.md"

[project.optional-dependencies]
# Core LLM providers — air-gap safe (no Google/cloud auth required)
llm = [
    "openai>=1.0",
    "anthropic>=0.30",
    "ollama>=0.2",
]
# AWS Bedrock (requires AWS credentials, not Google auth)
llm-bedrock = [
    "boto3>=1.34",
]
# Google Gemini (pulls google-auth — NOT air-gap compatible)
llm-gemini = [
    "google-generativeai>=0.5",
]
# Azure OpenAI (uses openai SDK with Azure endpoint)
llm-azure = [
    "openai>=1.0",
]
# Google Vertex AI (pulls google-auth — NOT air-gap compatible)
llm-vertex = [
    "google-cloud-aiplatform>=1.40",
]
# Oracle Cloud GenAI
llm-oci = [
    "oci>=2.100",
]
# IBM watsonx.ai
llm-ibm = [
    "ibm-watsonx-ai>=1.0",
]
# All LLM providers (includes Google — use llm-airgap for restricted envs)
llm-all = [
    "icdev[llm,llm-bedrock,llm-gemini,llm-azure,llm-vertex,llm-oci,llm-ibm]",
]
# Local LLM only — zero cloud deps, zero auth, fully air-gapped
# Works with: vLLM, llama.cpp server, TGI, LocalAI, LM Studio, Ollama, etc.
# Any server exposing OpenAI-compatible /v1/chat/completions endpoint
# Config: set type: openai_compatible + base_url in args/llm_config.yaml
llm-local = [
    "openai>=1.0",       # OpenAI SDK used as client for any compatible server
    "ollama>=0.2",       # Native Ollama client (optional, openai_compatible also works)
]
# Air-gap safe: all non-Google providers (no google-auth, no tensorboard)
llm-airgap = [
    "icdev[llm-local,llm-bedrock,llm-azure]",
    "anthropic>=0.30",   # Direct Anthropic API (if on-prem proxy available)
]
# Semantic/keyword search
search = [
    "numpy>=1.26",
    "rank_bm25>=0.2",
]
# Test suite
testing = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "behave>=1.2",
    "ruff>=0.12",
    "pydantic>=2.0",
]
# SaaS multi-tenancy (PostgreSQL, Redis, production WSGI — NOT needed for air-gap)
saas = [
    "psycopg2-binary>=2.9",
    "PyJWT>=2.12",
    "cryptography>=42.0",
    "gunicorn>=22.0",
    "redis>=5.0",
]
# Security scanning
security = [
    "bandit>=1.7",
    "pip-audit>=2.6",
    "detect-secrets>=1.4",
    "cyclonedx-bom>=4.0",
]
# Development
dev = [
    "icdev[testing,security]",
    "build>=1.0",
    "twine>=5.0",
]
# Image generation (Pulse hero images via SDXL Turbo on local GPU)
# Note: torch may pull tensorboard as transitive dep — use --no-deps torch
# then install torch deps manually if in air-gapped environment
image-gen = [
    "torch>=2.1",
    "diffusers>=0.27",
    "transformers>=4.36",
    "accelerate>=0.25",
]
# Network Design Canvas — topology design, circuit tracking, compliance audit
# Air-gap safe (all JS vendored locally, no CDN). Zero extra Python deps.
network = []  # No extra deps — Flask/Jinja2/SQLite already in core
# Everything (includes Google — NOT air-gap safe)
full = [
    "icdev[llm-all,search,testing,security,network]",
]
# Air-gap safe full install (no Google auth, no tensorboard)
full-airgap = [
    "icdev[llm-airgap,search,testing,security,network]",
]
# Minimal air-gap: local LLM only + search (smallest footprint)
minimal-airgap = [
    "icdev[llm-local,search]",
]

[project.scripts]
icdev-init-db = "icdev.tools.db.init_icdev_db:main"
icdev-dashboard = "icdev.tools.dashboard.app:main"
icdev-mcp = "icdev.tools.mcp.unified_server:main"
icdev-mcp-core = "icdev.tools.mcp.standalone.core:main"
icdev-mcp-compliance = "icdev.tools.mcp.standalone.compliance:main"
icdev-mcp-builder = "icdev.tools.mcp.standalone.builder:main"
icdev-mcp-knowledge = "icdev.tools.mcp.standalone.knowledge:main"
icdev-mcp-maintenance = "icdev.tools.mcp.standalone.maintenance:main"

[tool.setuptools.packages.find]
include = ["icdev*"]
exclude = [
    "icdev.tools.saas*",
    "icdev.tools.govcon*",
    "icdev.tools.rfx*",
    "icdev.tools.marketplace*",
    "icdev.tools.creative*",
    "icdev.tools.gateway*",
    "icdev.tools.playground*",
    "tests*",
]

[tool.setuptools.package-data]
"icdev" = ["py.typed"]
"icdev.data" = [
    "args/**/*.yaml", "args/**/*.yml", "args/**/*.json",
    "context/**/*.json", "context/**/*.yaml", "context/**/*.md",
    "context/**/*.j2", "context/**/*.txt",
    "goals/**/*.md",
    "hardprompts/**/*.md",
    "features/**/*.feature", "features/**/*.py",
    "docs/**/*.md",
]
"icdev.tools.dashboard" = [
    "templates/**/*.html",
    "static/**/*.css", "static/**/*.js",
    "static/vendor/**/*.js", "static/vendor/**/*.css",
]
"icdev.tools.db" = ["migrations/**/*.sql", "migrations/**/*.py"]

[tool.setuptools.exclude-package-data]
"*" = ["__pycache__/*", "*.pyc", "*.pyo"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
timeout = 30
