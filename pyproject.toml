[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "icdev"
version = "1.0.1"
description = "Intelligent Certified Development Environment — AI-powered SDLC platform with NIST 800-53 RMF compliance, multi-agent orchestration, and the GOTCHA framework."
readme = "README.md"
requires-python = ">=3.9"
license = "AGPL-3.0-or-later"
authors = [
    {name = "Sovanna Chuon"},
]
keywords = ["devops", "compliance", "nist", "fedramp", "govcloud", "llm", "agentic", "sdlc", "gotcha"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "flask>=3.0",
    "requests>=2.31",
    "python-dotenv>=1.0",
]

[project.urls]
Homepage = "https://github.com/icdev-ai/icdev"
Documentation = "https://github.com/icdev-ai/icdev/tree/main/docs"
Repository = "https://github.com/icdev-ai/icdev"
Issues = "https://github.com/icdev-ai/icdev/issues"
Changelog = "https://github.com/icdev-ai/icdev/blob/main/CHANGELOG.md"

[project.optional-dependencies]
# Core LLM providers (OpenAI, Anthropic/Bedrock, Gemini, Ollama)
llm = [
    "openai>=1.0",
    "anthropic>=0.30",
    "boto3>=1.34",
    "google-generativeai>=0.5",
    "ollama>=0.2",
]
# Azure OpenAI (uses openai SDK with Azure endpoint)
llm-azure = [
    "openai>=1.0",
]
# Google Vertex AI
llm-vertex = [
    "google-cloud-aiplatform>=1.40",
]
# Oracle Cloud GenAI
llm-oci = [
    "oci>=2.100",
]
# IBM watsonx.ai
llm-ibm = [
    "ibm-watsonx-ai>=1.0",
]
# All LLM providers
llm-all = [
    "icdev[llm,llm-azure,llm-vertex,llm-oci,llm-ibm]",
]
# Semantic/keyword search
search = [
    "numpy>=1.26",
    "rank_bm25>=0.2",
]
# Test suite
testing = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "behave>=1.2",
    "ruff>=0.12",
    "pydantic>=2.0",
]
# Security scanning
security = [
    "bandit>=1.7",
    "pip-audit>=2.6",
    "detect-secrets>=1.4",
    "cyclonedx-bom>=4.0",
]
# Development
dev = [
    "icdev[testing,security]",
    "build>=1.0",
    "twine>=5.0",
]
# Image generation (Pulse hero images via SDXL Turbo on local GPU)
image-gen = [
    "torch>=2.1",
    "diffusers>=0.27",
    "transformers>=4.36",
    "accelerate>=0.25",
]
# Everything
full = [
    "icdev[llm-all,search,testing,security]",
]

[project.scripts]
icdev-init-db = "icdev.tools.db.init_icdev_db:main"
icdev-dashboard = "icdev.tools.dashboard.app:main"
icdev-mcp = "icdev.tools.mcp.unified_server:main"
icdev-mcp-core = "icdev.tools.mcp.standalone.core:main"
icdev-mcp-compliance = "icdev.tools.mcp.standalone.compliance:main"
icdev-mcp-builder = "icdev.tools.mcp.standalone.builder:main"
icdev-mcp-knowledge = "icdev.tools.mcp.standalone.knowledge:main"
icdev-mcp-maintenance = "icdev.tools.mcp.standalone.maintenance:main"

[tool.setuptools.packages.find]
include = ["icdev*"]
exclude = [
    "icdev.tools.saas*",
    "icdev.tools.govcon*",
    "icdev.tools.rfx*",
    "icdev.tools.marketplace*",
    "icdev.tools.creative*",
    "icdev.tools.gateway*",
    "icdev.tools.playground*",
    "tests*",
]

[tool.setuptools.package-data]
"icdev" = ["py.typed"]
"icdev.data" = [
    "args/**/*.yaml", "args/**/*.yml", "args/**/*.json",
    "context/**/*.json", "context/**/*.yaml", "context/**/*.md",
    "context/**/*.j2", "context/**/*.txt",
    "goals/**/*.md",
    "hardprompts/**/*.md",
    "features/**/*.feature", "features/**/*.py",
    "docs/**/*.md",
]
"icdev.tools.dashboard" = [
    "templates/**/*.html",
    "static/**/*.css", "static/**/*.js",
]
"icdev.tools.db" = ["migrations/**/*.sql", "migrations/**/*.py"]

[tool.setuptools.exclude-package-data]
"*" = ["__pycache__/*", "*.pyc", "*.pyo"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
