# [TEMPLATE: CUI // SP-CTI]
# ICDEV™ Docker Compose — GovCloud Full Profile (all services enabled)
#
# Usage:
#   docker compose up -d                    # Start all services
#   docker compose up -d icdev-dashboard    # Start only the dashboard
#   docker compose logs -f icdev-dashboard  # Follow dashboard logs
#   docker compose down                     # Stop all services
#
# Customization:
#   - Comment out or remove services you don't need
#   - Create .env file with your secrets (see .env.template)
#   - Generate a custom docker-compose for your profile:
#       python tools/installer/platform_setup.py --generate docker --profile isv_startup
#
# Volumes:
#   icdev-data — Shared persistent volume mounted at /app/data in all containers.
#   Contains icdev.db, platform.db, memory.db, activity.db, and tenant databases.
#
# Networks:
#   icdev-net — Isolated bridge network for inter-agent A2A communication.

x-common-env: &common-env
  ICDEV_DB_PATH: /app/data/icdev.db
  ICDEV_PROJECT_ROOT: /app

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

x-healthcheck-defaults: &healthcheck-defaults
  interval: 30s
  timeout: 10s
  start_period: 10s
  retries: 3

services:

  # ====================================================================
  # PostgreSQL Database
  # ====================================================================
  icdev-postgres:
    image: pgvector/pgvector:pg16
    container_name: icdev-postgres
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: ${ICDEV_PG_USER:-icdev}
      POSTGRES_PASSWORD: ${ICDEV_PG_PASSWORD:?ICDEV_PG_PASSWORD must be set in .env}
      POSTGRES_DB: ${ICDEV_PG_DB:-icdev}
    volumes:
      - ./data/pgdata:/var/lib/postgresql/data
    networks:
      - icdev-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${ICDEV_PG_USER:-icdev} -d ${ICDEV_PG_DB:-icdev}"]
      <<: *healthcheck-defaults
    logging: *default-logging
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M

  # ====================================================================
  # Database Initialization (one-time — runs init_icdev_db.py and exits)
  # ====================================================================
  icdev-init:
    build:
      context: .
      dockerfile: docker/Dockerfile.agent-base
    image: icdev/agent-base:latest
    container_name: icdev-init
    environment:
      <<: *common-env
    env_file:
      - .env
    volumes:
      - icdev-data:/app/data
    networks:
      - icdev-net
    logging: *default-logging
    restart: "no"
    command: ["tools/db/init_icdev_db.py"]

  # ====================================================================
  # Core Tier
  # ====================================================================

  # Orchestrator Agent — task routing, workflow management
  icdev-orchestrator:
    build:
      context: .
      dockerfile: docker/Dockerfile.orchestrator
    image: icdev/orchestrator:latest
    container_name: icdev-orchestrator
    depends_on:
      icdev-init:
        condition: service_completed_successfully
    ports:
      - "8443:8443"
    environment:
      <<: *common-env
      PORT: "8443"
    env_file:
      - .env
    volumes:
      - icdev-data:/app/data
    networks:
      - icdev-net
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8443/health"]
      <<: *healthcheck-defaults
    logging: *default-logging
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    command: ["tools/a2a/agent_entrypoint.py", "--agent-id", "orchestrator-agent", "--port", "8443", "--no-tls"]

  # Architect Agent — ANVIL/M-ANVIL A/T phases, system design
  icdev-architect:
