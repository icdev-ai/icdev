    networks:
      - icdev-net
    working_dir: /workspace
    restart: "no"

  # ====================================================================
  # GNS3 — Network Simulation
  # ====================================================================

  # GNS3 Server — REST API + simulation engine (http://localhost:3080)
  #
  # Vendor images (proprietary — must be obtained separately):
  #   Cisco ASR 1000v (CSR1000v): software.cisco.com → IOS XE → CSR1000v .qcow2
  #     Requires Cisco SmartNet / CCO account.
  #   Juniper vMX:       support.juniper.net → Junos → vMX .qcow2 pair (vmx + vPFE)
  #     Requires Juniper account + vMX license.
  #
  # Drop image files into ./data/gns3-vendor-images/ — they are auto-mounted
  # into /gns3/images where GNS3 server resolves them during appliance import.
  gns3-server:
    image: gns3/gns3-server:latest
    container_name: gns3-server
    ports:
      - "3080:3080"   # HTTP API / WebSocket notifications
      - "3081:3081"   # console proxy
    volumes:
      - ./data/gns3-vendor-images:/root/GNS3/images/QEMU
      - ./data/gns3-config/gns3_server.conf:/root/.config/GNS3/2.2/gns3_server.conf:ro
      - gns3-projects:/gns3/projects
      - gns3-appliances:/gns3/appliances
    environment:
      GNS3_CONTROLLER_ADDRESSES: "0.0.0.0"
    cap_add:
      - NET_ADMIN
      - NET_RAW
      - SYS_PTRACE
    networks:
      - icdev-net
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:3080/v2/version')"]
      <<: *healthcheck-defaults
    logging: *default-logging
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G
        reservations:
          cpus: '0.5'
          memory: 512M

  # GNS3 Registry Sync — pulls latest appliance definitions at startup then exits
  gns3-registry:
    image: alpine/git:latest
    container_name: gns3-registry
    volumes:
      - gns3-appliances:/appliances
    entrypoint: >
      sh -c "
        if [ -d /appliances/.git ]; then
          git -C /appliances pull --ff-only;
        else
          git clone --depth 1 https://github.com/GNS3/gns3-registry.git /appliances;
        fi
      "
    networks:
      - icdev-net
    restart: "no"

  # MCP-A2A Bridge — exposes all 265+ MCP tools over HTTP for A2A agents
  icdev-mcp-bridge:
    build:
      context: .
      dockerfile: docker/Dockerfile.agent-base
    image: icdev/mcp-bridge:latest
    container_name: icdev-mcp-bridge
    depends_on:
      icdev-init:
        condition: service_completed_successfully
    ports:
      - "9000:9000"
    environment:
      <<: *common-env
      PORT: "9000"
    env_file:
      - .env
    volumes:
      - icdev-data:/app/data
    networks:
      - icdev-net
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9000/health"]
      <<: *healthcheck-defaults
    logging: *default-logging
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M
    command: ["tools/mcp/a2a_bridge_server.py", "--port", "9000"]

  # SaaS API Gateway — REST + MCP Streamable HTTP entry point
  # Note: Host port 9443 maps to container port 8443 (Dockerfile default)
  icdev-api-gateway:
    build:
      context: .
      dockerfile: docker/Dockerfile.api-gateway
    image: icdev/api-gateway:latest
    container_name: icdev-api-gateway
    depends_on:
      icdev-init:
        condition: service_completed_successfully
      icdev-orchestrator:
        condition: service_healthy
    ports:
      - "9443:8443"
    environment:
      <<: *common-env
      PORT: "8443"
    env_file:
      - .env
    volumes:
      - icdev-data:/app/data
    networks:
      - icdev-net
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8443/health"]
      <<: *healthcheck-defaults
    logging: *default-logging
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

  # ====================================================================
  # LLM Proxy (LiteLLM) — OPT-IN, OFF BY DEFAULT (lpx-proxy-02)
  # ====================================================================
  # Virtual-key / budget / spend proxy for cloud-egress cohort use cases
  # (forge_academy, ai_gameday). Selected per ADR
  # docs/features/lpx-proxy-01-adr-llm-proxy-selection.md.
  #
  # Behind the `llm-proxy` compose profile, so it does NOT start with a plain
  # `docker compose up`. Enable explicitly:
  #     docker compose --profile llm-proxy up -d litellm-proxy
  # The client side stays gated by ICDEV_LLM_PROXY_ENABLED (default false),
  # wired in lpx-proxy-03. CUI/air-gap baselines never enable this profile.
  #
  # SUPPLY CHAIN: pin `image:` by digest (@sha256:...) and record it in the SBOM
  # before enabling in any real deployment (ADR consequence). Never ships in the
  # air-gapped/CUI baseline.
  litellm-proxy:
    profiles: ["llm-proxy"]
    image: ghcr.io/berriai/litellm-non_root:main-stable
    container_name: icdev-litellm-proxy
    depends_on:
      icdev-postgres:
        condition: service_healthy
    ports:
      # Bind to loopback only — not exposed off-host by default.
      - "127.0.0.1:4000:4000"
    environment:
      # Real provider keys — supplied from .env, NEVER committed.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # Admin/master key for the proxy management API.
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?LITELLM_MASTER_KEY must be set when enabling the llm-proxy profile}
      # Reuse ICDEV PostgreSQL for proxy metadata (no new datastore).
      LITELLM_DATABASE_URL: postgresql://${ICDEV_PG_USER:-icdev}:${ICDEV_PG_PASSWORD}@icdev-postgres:5432/${ICDEV_PG_DB:-icdev}
    volumes:
      - ./config/llm_proxy_config.yaml:/app/config.yaml:ro
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    networks:
      - icdev-net
    healthcheck:
      # LiteLLM is Python-based; probe liveliness without assuming curl exists.
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness')\" || exit 1"]
      <<: *healthcheck-defaults
    logging: *default-logging
    restart: unless-stopped
    user: "1000:1000"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M

  # ====================================================================
  # floci — AWS API Emulator (OPT-IN, OFF BY DEFAULT) (flx-compose-01)
  # ====================================================================
  # floci is MIT-licensed, Java/Quarkus, listens on 4566, and is a documented
  # LocalStack drop-in: it keeps the `/_localstack/health` path and translates
  # LOCALSTACK_* env vars by default. `tools/cloud/emulator.py` (flx-seam-01) is
  # the ONE switch every ICDEV caller reads; this service is the thing that
  # switch points at. Do not add a second emulator service.
  #
  # Behind the `floci` compose profile, so it does NOT start with a plain
  # `docker compose up` and `/start` does not launch it. Starting it is a
  # DELIBERATE act:
  #     echo FLOCI_ENABLED=true >> .env         # the ICDEV-side switch
  #     docker compose --profile floci up -d    # the emulator itself
  #
  # `icdev enable floci` will be the first line once flx-compose-02 registers
  # the toggle in args/component_registry.yaml. It is NOT a command today --
  # verified 2026-09-04, `floci` is absent from tools/cli/enable.py::TOGGLES --
  # and documenting one that does not exist costs a reader a whole cycle
  # deciding whether the tree or the doc is broken.
  #
  # NEVER source a performance, cost or capacity claim from emulator timings.
  # An emulator reproduces the AWS *API contract*, not its performance
  # characteristics — the standing guard from
  # docs/spikes/twx-spk-01-localstack-go-no-go.md, which this project supersedes
  # on the air-gap question ONLY (floci carries no auth-token image).
  #
  # SUPPLY CHAIN: the tag is PINNED to 2.0.1 and must never be `:latest` in the
  # committed file — an air-gapped bundle has to be reproducible. Pin by digest
  # (@sha256:...) and record it in the SBOM before any real deployment.
  #
  # ── THE DOCKER SOCKET IS A SECURITY DECISION ────────────────────────────
  # A container holding the host Docker socket is ROOT-EQUIVALENT ON THE HOST.
  # It is mounted here because container-backed services (Lambda, RDS,
  # ElastiCache, OpenSearch, MSK, ECS/EC2/EKS) cannot work without it. The
  # decision, its mitigations and its revisit conditions are recorded as Gap 65
  # in docs/security/sandbox-coverage.md — a coherence-checked file.
  #
  # THE MOUNT SOURCE IS AN ENV VAR, AND ITS NAME IS DELIBERATELY *NOT*
  # `FLOCI_DOCKER_SOCKET`. That name is read by
  # `tools/cloud/emulator.py::docker_basis()` to answer a DIFFERENT question —
  # how the ICDEV *Python process on the host* would reach the daemon. MEASURED
  # on this Windows host 2026-09-04: setting FLOCI_DOCKER_SOCKET to the mount
  # spelling below makes `docker_backed()` return False and
  # `service_supported("lambda")` return False — a FABRICATED refusal for a
  # Lambda that works, because the socket is mounted into the container even
  # though that path does not exist on the Windows filesystem.
  #
  # `//var/run/docker.sock` (LEADING DOUBLE SLASH) is one spelling that serves
  # both hosts, which is why this file is not OS-specific:
  #   * Windows / Docker Desktop — the engine is exposed to Linux containers at
  #     this path, and the double slash survives MSYS/Git Bash path conversion.
  #     A single `/var/run/...` is rewritten and the mount silently binds the
  #     wrong thing. (The host-side endpoint is the named pipe
  #     npipe:////./pipe/docker_engine — that is NOT a bind-mount source.)
  #   * Linux — `//x` and `/x` name the same file, so it resolves unchanged.
  #
  # FLOCI_DOCKER_DOCKER_HOST is the THIRD name and a third distinct thing: the
  # daemon floci ITSELF starts service containers on. It becomes DOCKER_HOST
  # inside the container (flx-airgap-03). It is still UNSET BY DEFAULT — the
  # operator decision of 2026-09-05 (locally hosted Docker) is the default
  # `unix:///var/run/docker.sock`, which is exactly where the volume below
  # mounts the host socket, so an unset variable reproduces the previous
  # behaviour rather than clearing DOCKER_HOST to an empty string and breaking
  # the daemon lookup. A registry-mandating site that centralises its container
  # runtime sets it to `tcp://…:2376`.
  #
  # Which registry serves the images that daemon pulls, and the per-registry
  # credentials for it, are declared in args/floci_registry.yaml (shipped
  # DISABLED). Read the posture with
  # `python -m tools.cloud.floci_registry --show`. Keep the default in step
  # with floci_registry.DEFAULT_CONTAINER_DOCKER_HOST — a test pins them equal.
  floci:
    profiles: ["floci"]
    image: floci/floci:2.0.1
    container_name: icdev-floci
    ports:
      # Loopback-only: an emulator holding the host docker socket must not be
      # reachable off-host. Services on icdev-net still reach it by name.
      - "127.0.0.1:4566:4566"            # AWS API edge port
      - "127.0.0.1:6379-6399:6379-6399"  # ElastiCache / Redis proxy range
      - "127.0.0.1:7001-7099:7001-7099"  # OpenSearch / MSK proxy range
    environment:
      # State survives a restart; ./data/floci is gitignored (flx-compose-01).
      FLOCI_STORAGE_MODE: persistent
      # ICDEV's target partition. Kept in step with emulator.DEFAULT_REGION.
      FLOCI_DEFAULT_REGION: ${FLOCI_REGION:-us-gov-west-1}
      # floci isolates state per account id; 12 digits or the seam warns.
      FLOCI_DEFAULT_ACCOUNT_ID: ${FLOCI_ACCOUNT_ID:-000000000000}
      # The daemon floci starts service containers on (flx-airgap-03). See the
      # three-names note above; the default IS the socket mounted below.
      DOCKER_HOST: ${FLOCI_DOCKER_DOCKER_HOST:-unix:///var/run/docker.sock}
    volumes:
      - ./data/floci:/var/lib/floci
      - ${FLOCI_DOCKER_SOCKET_MOUNT:-//var/run/docker.sock}:/var/run/docker.sock
    networks:
      - icdev-net
    healthcheck:
      # floci keeps LocalStack's health path — that is what "drop-in" means.
      # Mirrors tools/cloud/emulator.py::HEALTH_PATH; keep the two in step.
      test: ["CMD", "curl", "-sf", "http://localhost:4566/_localstack/health"]
      <<: *healthcheck-defaults
      # A JVM emulator bringing up many service backends needs far longer than
      # the shared 10s to become healthy. An explicit key beats the merge key.
      start_period: 60s
    logging: *default-logging
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 4G
        reservations:
          cpus: '0.5'
          memory: 1G


  # ====================================================================
  # floci-az — Azure API Emulator (OPT-IN, OFF BY DEFAULT) (flx-az-01)
  # ====================================================================
  # The Azure sibling of the `floci` service above. MIT, Java/Quarkus, and it
  # listens on 4577 — a DIFFERENT emulator, not a second profile over the same
  # one, so the two can run side by side without colliding.
  #
  # It is NOT a LocalStack drop-in and inherits no compat contract from its AWS
  # sibling: measured 2026-09-05, `/_localstack/health` returns **501** here and
  # the health path is `/_floci/health`. See docs/spikes/flx-az-parity.md.
  #
  #     docker compose --profile floci-az up -d
  #
  # `icdev enable floci-az` flips the ICDEV-side switch (FLOCI_AZ_ENABLED); the
  # container is the other half and is started by the line above.
  #
  # READ AND INVENTORY ONLY. ICDEV has tools/cloud/aws_config_executor.py and
  # NO Azure analogue, so nothing here executes Azure IaC — the seam says so
  # (emulator_az.IAC_EXECUTION_SUPPORTED is False) and a test asserts it.
  floci-az:
    profiles: ["floci-az"]
    # PINNED, never `:latest`. Kept in step with emulator_az.IMAGE by hand —
    # YAML cannot import a Python constant — and a test pins them equal.
    # Digest measured 2026-09-05:
    #   sha256:0c673d49bb75b502ea0750f1c1347777483ffc33945539e1d9254438cb441a03
    image: floci/floci-az:0.12.0
    container_name: icdev-floci-az
    ports:
      # Loopback-only: an emulator holding the host docker socket must not be
      # reachable off-host. Services on icdev-net still reach it by name.
      - "127.0.0.1:4577:4577"            # Azure API edge port
      # The container-backed proxy ranges are DECLARED in
      # emulator_az.PROXY_PORT_RANGES and deliberately NOT published here:
      # 5000-5099 (ACR), 5672/5673 (Event Hubs / Service Bus AMQP),
      # 6379-6399 (Cache), 6443-7443 (AKS) is ~1,100 host ports, and publishing
      # them collides with the `floci` profile's own 6379-6399 Redis range on
      # any host running both. Publish a range only where something consumes it.
    environment:
      # MEASURED 2026-09-05: `persistent` is accepted, the banner reports
      # "Storage mode: persistent", and a blob written before a `docker restart`
      # was readable after it. The path is the image's own
      # FLOCI_AZ_STORAGE_PERSISTENT_PATH=/app/data — NOT /var/lib/floci, which
      # is where the AWS sibling keeps state.
      FLOCI_AZ_STORAGE_MODE: persistent
      # Azure Government's region name. NOT `us-gov-west-1` — that is AWS's
      # spelling and matches no Azure region. Kept in step with
      # emulator_az.DEFAULT_REGION and the `azure_gov` twin preset.
      FLOCI_AZ_DEFAULT_REGION: ${FLOCI_AZ_REGION:-usgovvirginia}
      # The daemon floci-az starts service containers on. Per the operator
      # decision of 2026-09-05 this is the LOCAL daemon; a remote
      # FLOCI_AZ_DOCKER_DOCKER_HOST and an internal registry mirror are named
      # follow-ons, not dropped.
      DOCKER_HOST: ${FLOCI_AZ_DOCKER_DOCKER_HOST:-unix:///var/run/docker.sock}
    volumes:
      # ./data/floci-az is gitignored (flx-az-01). NOTE the anchor: the existing
      # `data/floci/` rule ends in a slash and does NOT cover this directory, so
      # it needed its own entry — without it, per-machine emulator state lands
      # in this PUBLIC repo.
      - ./data/floci-az:/app/data
      # Azure Functions spawns runtime containers and needs the socket. The
      # leading double slash is required on Windows: a single `/var/run/...` is
      # rewritten by MSYS/Git Bash path conversion and the mount silently binds
      # the wrong thing.
      - ${FLOCI_AZ_DOCKER_SOCKET_MOUNT:-//var/run/docker.sock}:/var/run/docker.sock
    networks:
      - icdev-net
    healthcheck:
      # floci-az's OWN health path. `/_localstack/health` answers 501 here.
      # Mirrors emulator_az.HEALTH_PATH; keep the two in step.
      test: ["CMD", "curl", "-sf", "http://localhost:4577/_floci/health"]
      <<: *healthcheck-defaults
      # Measured cold start on this host was ~13s to `healthy`, but a JVM
      # emulator bringing up 24 service backends needs headroom over the shared
      # 10s. An explicit key beats the merge key.
      start_period: 60s
    logging: *default-logging
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 4G
        reservations:
          cpus: '0.5'
          memory: 1G

  # floci-gcp — GCP API Emulator (OPT-IN, OFF BY DEFAULT) (flx-gcp-01)
  # ====================================================================
  # The GCP sibling of `floci` and `floci-az` above. MIT, Java/Quarkus, and it
  # listens on 4588 — a THIRD emulator, so all three can run side by side.
  #
  # It inherits no compat contract from either sibling. Measured 2026-09-05:
  # `/_localstack/health` AND `/_floci/health` both return **404** here, and the
  # health path is plain `/health`. See docs/spikes/flx-gcp-parity.md.
  #
  #     docker compose --profile floci-gcp up -d
  #
  # `icdev enable floci-gcp` flips the ICDEV-side switch (FLOCI_GCP_ENABLED);
  # the container is the other half and is started by the line above.
  #
  # THE CLIENT CONTRACT IS DIFFERENT, and it is why this card exists: GCP
  # client libraries take no endpoint-override parameter and read standard
  # *_EMULATOR_HOST variables instead. Nothing is set here for that — the seam
  # (emulator_gcp.emulator_host_env) hands a caller the mapping to export, so
  # the decision about WHICH processes talk to the emulator stays with the
  # caller rather than being made for the whole host by a compose file.
  #
  # READ AND INVENTORY ONLY. ICDEV has tools/cloud/aws_config_executor.py and
  # NO GCP analogue, so nothing here executes GCP IaC — the seam says so
  # (emulator_gcp.IAC_EXECUTION_SUPPORTED is False) and a test asserts it.
  floci-gcp:
    profiles: ["floci-gcp"]
    # PINNED, never `:latest`. Kept in step with emulator_gcp.IMAGE by hand —
    # YAML cannot import a Python constant — and a test pins them equal.
    # Digest measured 2026-09-05:
    #   sha256:5037d304aded5ab4ccf4697239131521fe66b8952f411f6c1781c9166d2ab01b
    image: floci/floci-gcp:0.8.0
    container_name: icdev-floci-gcp
    ports:
      # Loopback-only: an emulator holding the host docker socket must not be
      # reachable off-host. Services on icdev-net still reach it by name.
      #
      # ONE PORT, and there is nothing else to publish. Measured 2026-09-05:
      # 4588/tcp is the only listening socket in the container (the gRPC server
      # is MULTIPLEXED onto it rather than taking a second port), and spawned
      # service containers are addressed by Docker BRIDGE IP with their ports
      # EXPOSED AND UNPUBLISHED — a Cloud SQL instance came back as
      # 172.17.0.3:5432. So unlike the floci-az profile above there are no
      # proxy port ranges to declare or withhold.
      - "127.0.0.1:4588:4588"            # GCP API edge port (REST *and* gRPC)
    environment:
      # MEASURED 2026-09-05: `persistent` is accepted and the startup banner
      # reports "Storage:   persistent" where the default reports "memory".
      # The path is the image's own FLOCI_GCP_STORAGE_PERSISTENT_PATH=/app/data
      # — NOT /var/lib/floci, which is where the AWS sibling keeps state.
      FLOCI_GCP_STORAGE_MODE: persistent
      # A GCP region name. NOT `us-gov-west-1` (AWS's) and NOT `usgovvirginia`
      # (Azure's) — a third vocabulary. Kept in step with
      # emulator_gcp.DEFAULT_REGION.
      FLOCI_GCP_DEFAULT_REGION: ${FLOCI_GCP_REGION:-us-central1}
      # The daemon floci-gcp starts service containers on. Per the operator
      # decision of 2026-09-05 this is the LOCAL daemon; a remote
      # FLOCI_GCP_DOCKER_DOCKER_HOST and an internal registry mirror are named
      # follow-ons, not dropped.
      DOCKER_HOST: ${FLOCI_GCP_DOCKER_SOCKET_MOUNT_TARGET:-unix:///var/run/docker.sock}
    volumes:
      # ./data/floci-gcp is gitignored (flx-gcp-01). NOTE the anchor: the
      # existing `data/floci/` rule ends in a slash and matches the directory
      # `floci` only, so neither it nor `data/floci-az/` covers this one.
      # Without its own entry, per-machine emulator state lands in this PUBLIC
      # repo.
      - ./data/floci-gcp:/app/data
      # Cloud SQL, Managed Kafka, GKE and Cloud Run spawn runtime containers
      # and need the socket — measured, by what they actually started
      # (postgres:15.18-alpine, redpandadata/redpanda:latest,
      # rancher/k3s:latest, and the user's own image respectively).
      # The leading double slash is required on Windows: a single
      # `/var/run/...` is rewritten by MSYS/Git Bash path conversion and the
      # mount silently binds the wrong thing.
      - ${FLOCI_GCP_DOCKER_SOCKET_MOUNT:-//var/run/docker.sock}:/var/run/docker.sock
    networks:
      - icdev-net
    healthcheck:
      # floci-gcp's OWN health path — plain `/health`. BOTH siblings' paths
      # (`/_localstack/health`, `/_floci/health`) answer 404 here.
      # Mirrors emulator_gcp.HEALTH_PATH; keep the two in step.
      test: ["CMD", "curl", "-sf", "http://localhost:4588/health"]
      <<: *healthcheck-defaults
      # Measured cold start on this host was well under 10s — it is a NATIVE
      # binary, not a JVM, and logs "started in 0.019s". The headroom is kept
      # anyway: `start_period` bounds how long a slow host may take before the
      # container flaps unhealthy, and sizing it to the fastest observed start
      # makes a loaded CI runner look broken.
      start_period: 60s
    logging: *default-logging
    restart: unless-stopped
    deploy:
      resources:
        limits:
          # Half the floci-az allowance: a 92 MB native image, not a 305 MB
          # JVM. The spawned service containers carry their own limits and are
          # not covered by these.
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.25'
          memory: 512M

  floci-oci:
    profiles: ["floci-oci"]
    # PINNED, never `:latest`. Kept in step with emulator_oci.IMAGE by hand —
    # YAML cannot import a Python constant — and a test pins them equal.
    # Digest measured 2026-09-05:
    #   sha256:584fd7f977077ab040063d7c2efaaaa1beabacccd903f5297eaa7bbe8f744a8b
    image: floci/floci-oci:0.4.0
    container_name: icdev-floci-oci
    ports:
      # Loopback-only: an emulator holding the host docker socket must not be
      # reachable off-host. Services on icdev-net still reach it by name.
      #
      # ONE PORT. Measured 2026-09-05: 4599/tcp is the only listening socket in
      # the container. As on the GCP profile there are no proxy port ranges to
      # declare — and note that the emulator advertises `http://localhost:4599`
      # (the CONTAINER's port) inside resource bodies whatever the host mapping
      # is, so a client must compose URLs from the seam rather than follow one
      # out of a response.
      - "127.0.0.1:4599:4599"            # OCI API edge port
    environment:
      # MEASURED 2026-09-05: `persistent` is accepted and the startup banner
      # reports "Storage:   persistent" where the default reports "memory".
      #
      # THE VARIABLE NAME IS LOAD-BEARING. Three plausible spellings —
      # FLOCI_OCI_PERSISTENCE, FLOCI_PERSISTENCE, FLOCI_OCI_PERSISTENCE_MODE —
      # are SILENTLY IGNORED and leave the banner reading "memory". An operator
      # who uses one of those believes they enabled persistence and did not.
      FLOCI_OCI_STORAGE_MODE: persistent
      # An OCI region name. A FOURTH vocabulary: not `us-gov-west-1` (AWS), not
      # `usgovvirginia` (Azure), not `us-central1` (GCP). Honoured — measured,
      # it changes both the banner and the region code embedded in every OCID
      # the emulator mints. Kept in step with emulator_oci.DEFAULT_REGION.
      FLOCI_OCI_DEFAULT_REGION: ${FLOCI_OCI_REGION:-us-ashburn-1}
      # The daemon floci-oci starts service containers on. Per the operator
      # decision of 2026-09-05 this is the LOCAL daemon; a remote
      # FLOCI_OCI_DOCKER_DOCKER_HOST and an internal registry mirror are named
      # follow-ons, not dropped.
      DOCKER_HOST: ${FLOCI_OCI_DOCKER_SOCKET_MOUNT_TARGET:-unix:///var/run/docker.sock}
    volumes:
      # ./data/floci-oci is gitignored (flx-oci-01). NOTE the anchor: the
      # existing `data/floci/` rule ends in a slash and matches the directory
      # `floci` only, so none of it, `data/floci-az/` or `data/floci-gcp/`
      # covers this one. Without its own entry, per-machine emulator state
      # lands in this PUBLIC repo.
      - ./data/floci-oci:/app/data
      # ONE service spawns a runtime container — OKE, measured, by what it
      # actually started: rancher/k3s:v1.30.1-k3s1 (version-pinned, unlike the
      # GCP sibling's two `:latest` tags).
      #
      # THE SOCKET IS MOUNTED KNOWING OKE IS BROKEN IN 0.4.0: the emulator
      # starts k3s without a `--token`, the container exits immediately, and
      # the API still reports lifecycleState ACTIVE. Mounting it keeps this
      # profile identical in shape to its three siblings and lets a later
      # release work with no compose change; nothing in ICDEV depends on OKE.
      # Without the socket, OKE fails honestly with a 500 — which is the more
      # informative failure, so a deployment that wants neither may drop this
      # line safely.
      #
      # The leading double slash is required on Windows: a single
      # `/var/run/...` is rewritten by MSYS/Git Bash path conversion and the
      # mount silently binds the wrong thing.
      - ${FLOCI_OCI_DOCKER_SOCKET_MOUNT:-//var/run/docker.sock}:/var/run/docker.sock
    networks:
      - icdev-net
    healthcheck:
      # floci-oci's OWN health path — plain `/health`, the same spelling as
      # floci-gcp but NOT a shared contract: `/_localstack/health` and
      # `/_floci/health` both answer 404 here, so this is not a LocalStack
      # drop-in. Mirrors emulator_oci.HEALTH_PATH; keep the two in step.
      test: ["CMD", "curl", "-sf", "http://localhost:4599/health"]
      <<: *healthcheck-defaults
      # Measured cold start on this host was 0.015s — a NATIVE binary, not a
      # JVM. The headroom is kept anyway: `start_period` bounds how long a slow
      # host may take before the container flaps unhealthy, and sizing it to
      # the fastest observed start makes a loaded CI runner look broken.
      start_period: 60s
    logging: *default-logging
    restart: unless-stopped
    deploy:
      resources:
        limits:
          # Matches the GCP allowance: a 76 MB native image, not a JVM. The one
          # spawned container (k3s) carries its own limits and is not covered
          # by these.
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.25'
          memory: 512M
# ======================================================================
# Networks
# ======================================================================
networks:
  icdev-net:
    driver: bridge

# ======================================================================
# Volumes
# ======================================================================
volumes:
  icdev-data:
    driver: local
  # icdev-pgdata uses bind mount ./data/pgdata (not a Docker volume)
  gns3-projects:
    driver: local
  gns3-appliances:
    driver: local
