    networks:
      - icdev-net
    working_dir: /workspace
    restart: "no"

  # ====================================================================
  # GNS3 — Network Simulation
  # ====================================================================

  # GNS3 Server — REST API + simulation engine (http://localhost:3080)
  #
  # Vendor images (proprietary — must be obtained separately):
  #   Cisco ASR 1000v (CSR1000v): software.cisco.com → IOS XE → CSR1000v .qcow2
  #     Requires Cisco SmartNet / CCO account.
  #   Juniper vMX:       support.juniper.net → Junos → vMX .qcow2 pair (vmx + vPFE)
  #     Requires Juniper account + vMX license.
  #
  # Drop image files into ./data/gns3-vendor-images/ — they are auto-mounted
  # into /gns3/images where GNS3 server resolves them during appliance import.
  gns3-server:
    image: gns3/gns3-server:latest
    container_name: gns3-server
    ports:
      - "3080:3080"   # HTTP API / WebSocket notifications
      - "3081:3081"   # console proxy
    volumes:
      - ./data/gns3-vendor-images:/root/GNS3/images/QEMU
      - ./data/gns3-config/gns3_server.conf:/root/.config/GNS3/2.2/gns3_server.conf:ro
      - gns3-projects:/gns3/projects
      - gns3-appliances:/gns3/appliances
    environment:
      GNS3_CONTROLLER_ADDRESSES: "0.0.0.0"
    cap_add:
      - NET_ADMIN
      - NET_RAW
      - SYS_PTRACE
    networks:
      - icdev-net
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:3080/v2/version')"]
      <<: *healthcheck-defaults
    logging: *default-logging
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G
        reservations:
          cpus: '0.5'
          memory: 512M

  # GNS3 Registry Sync — pulls latest appliance definitions at startup then exits
  gns3-registry:
    image: alpine/git:latest
    container_name: gns3-registry
    volumes:
      - gns3-appliances:/appliances
    entrypoint: >
      sh -c "
        if [ -d /appliances/.git ]; then
          git -C /appliances pull --ff-only;
        else
          git clone --depth 1 https://github.com/GNS3/gns3-registry.git /appliances;
        fi
      "
    networks:
      - icdev-net
    restart: "no"

  # MCP-A2A Bridge — exposes all 265+ MCP tools over HTTP for A2A agents
  icdev-mcp-bridge:
    build:
      context: .
      dockerfile: docker/Dockerfile.agent-base
    image: icdev/mcp-bridge:latest
    container_name: icdev-mcp-bridge
    depends_on:
      icdev-init:
        condition: service_completed_successfully
    ports:
      - "9000:9000"
    environment:
      <<: *common-env
      PORT: "9000"
    env_file:
      - .env
    volumes:
      - icdev-data:/app/data
    networks:
      - icdev-net
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9000/health"]
      <<: *healthcheck-defaults
    logging: *default-logging
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M
    command: ["tools/mcp/a2a_bridge_server.py", "--port", "9000"]

  # SaaS API Gateway — REST + MCP Streamable HTTP entry point
  # Note: Host port 9443 maps to container port 8443 (Dockerfile default)
  icdev-api-gateway:
    build:
      context: .
      dockerfile: docker/Dockerfile.api-gateway
    image: icdev/api-gateway:latest
    container_name: icdev-api-gateway
    depends_on:
      icdev-init:
        condition: service_completed_successfully
      icdev-orchestrator:
        condition: service_healthy
    ports:
      - "9443:8443"
    environment:
      <<: *common-env
      PORT: "8443"
    env_file:
      - .env
    volumes:
      - icdev-data:/app/data
    networks:
      - icdev-net
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8443/health"]
      <<: *healthcheck-defaults
    logging: *default-logging
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

  # ====================================================================
  # LLM Proxy (LiteLLM) — OPT-IN, OFF BY DEFAULT (lpx-proxy-02)
  # ====================================================================
  # Virtual-key / budget / spend proxy for cloud-egress cohort use cases
  # (forge_academy, ai_gameday). Selected per ADR
  # docs/features/lpx-proxy-01-adr-llm-proxy-selection.md.
  #
  # Behind the `llm-proxy` compose profile, so it does NOT start with a plain
  # `docker compose up`. Enable explicitly:
  #     docker compose --profile llm-proxy up -d litellm-proxy
  # The client side stays gated by ICDEV_LLM_PROXY_ENABLED (default false),
  # wired in lpx-proxy-03. CUI/air-gap baselines never enable this profile.
  #
  # SUPPLY CHAIN: pin `image:` by digest (@sha256:...) and record it in the SBOM
  # before enabling in any real deployment (ADR consequence). Never ships in the
  # air-gapped/CUI baseline.
  litellm-proxy:
    profiles: ["llm-proxy"]
    image: ghcr.io/berriai/litellm-non_root:main-stable
    container_name: icdev-litellm-proxy
    depends_on:
      icdev-postgres:
        condition: service_healthy
    ports:
      # Bind to loopback only — not exposed off-host by default.
      - "127.0.0.1:4000:4000"
    environment:
      # Real provider keys — supplied from .env, NEVER committed.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # Admin/master key for the proxy management API.
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?LITELLM_MASTER_KEY must be set when enabling the llm-proxy profile}
      # Reuse ICDEV PostgreSQL for proxy metadata (no new datastore).
      LITELLM_DATABASE_URL: postgresql://${ICDEV_PG_USER:-icdev}:${ICDEV_PG_PASSWORD}@icdev-postgres:5432/${ICDEV_PG_DB:-icdev}
    volumes:
      - ./config/llm_proxy_config.yaml:/app/config.yaml:ro
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    networks:
      - icdev-net
    healthcheck:
      # LiteLLM is Python-based; probe liveliness without assuming curl exists.
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness')\" || exit 1"]
      <<: *healthcheck-defaults
    logging: *default-logging
    restart: unless-stopped
    user: "1000:1000"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M

# ======================================================================
# Networks
# ======================================================================
networks:
  icdev-net:
    driver: bridge

# ======================================================================
# Volumes
# ======================================================================
volumes:
  icdev-data:
    driver: local
  # icdev-pgdata uses bind mount ./data/pgdata (not a Docker volume)
  gns3-projects:
    driver: local
  gns3-appliances:
    driver: local
