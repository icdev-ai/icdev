<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login — Network Design Canvas</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/network-canvas.css') }}"/>
  <style>
    body { display: flex; align-items: center; justify-content: center; min-height: 100vh; background: var(--bg); }
    .login-card {
      background: var(--bg2); border: 1px solid var(--border); border-radius: 12px;
      padding: 2.5rem; width: 380px; max-width: 95vw;
    }
    .login-card h1 { font-size: 1.3rem; margin-bottom: 0.5rem; color: var(--text); }
    .login-card p { font-size: 0.85rem; color: var(--text-dim); margin-bottom: 1.5rem; }
    .login-card label { display: block; font-size: 0.8rem; color: var(--text-dim); margin-bottom: 0.3rem; }
    .login-card input {
      width: 100%; padding: 10px 12px; background: var(--bg3); border: 1px solid var(--border);
      border-radius: 6px; color: var(--text); font-size: 0.95rem; margin-bottom: 1rem;
    }
    .login-card input:focus { border-color: var(--red); outline: none; }
    .login-card button {
      width: 100%; padding: 10px; background: var(--red); color: #fff; border: none;
      border-radius: 6px; font-size: 0.95rem; font-weight: 600; cursor: pointer;
    }
    .login-card button:hover { opacity: 0.9; }
    .login-error { background: rgba(233,69,96,0.15); border: 1px solid var(--red); border-radius: 6px;
      padding: 8px 12px; margin-bottom: 1rem; font-size: 0.85rem; color: var(--red); }
    .login-brand { display: flex; align-items: center; gap: 8px; margin-bottom: 1.5rem; }
    .login-brand span.icon { font-size: 1.5rem; }
    .login-brand span.badge { font-size: 0.65rem; background: var(--red); color: #fff;
      padding: 2px 6px; border-radius: 4px; }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="login-brand">
      <span class="icon">⬡</span>
      <h1>Network Design Canvas</h1>
      <span class="badge">ICDEV™</span>
    </div>
    <p>Sign in to access the network design environment</p>

    {% if error %}
    <div class="login-error">{{ error }}</div>
    {% endif %}

    <form method="POST" action="/network/login">
      <label for="username">Username</label>
      <input type="text" id="username" name="username" required autofocus autocomplete="username"/>

      <label for="password">Password</label>
      <input type="password" id="password" name="password" required autocomplete="current-password"/>

      <button type="submit">Sign In</button>
    </form>

    {% if classification_banner %}
    <p style="margin-top:1.5rem;font-size:0.75rem;color:var(--text-dim);text-align:center;">
      {{ classification_banner }}
    </p>
    {% endif %}
  </div>
</body>
</html>
