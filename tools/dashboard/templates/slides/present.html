<!DOCTYPE html>
<!-- CUI // SP-CTI -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ deck.title }} — Present — ICDEV™</title>
<style>
  :root {
    --bg: {{ colors.bg }};
    --accent: {{ colors.accent }};
    --text: {{ colors.text }};
    --subtext: {{ colors.subtext }};
    --dark: {{ colors.dark }};
    /* charts.js reads these CSS vars for its palette — map to the deck theme */
    --bg-card: {{ colors.dark }};
    --border-color: {{ colors.dark }};
    --text-muted: {{ colors.subtext }};
    --text-secondary: {{ colors.subtext }};
    --accent-blue: {{ colors.accent }};
    --accent-blue-light: {{ colors.accent }};
    --status-green: {{ colors.series[2] if colors.series else '#2ECC71' }};
    --status-red: {{ colors.series[6] if colors.series else '#E74C3C' }};
    --status-yellow: {{ colors.accent }};
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font-family: "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; overflow: hidden; }
  .cui { position: fixed; top: 0; left: 0; right: 0; text-align: center; font-size: 11px;
    font-weight: 700; letter-spacing: .08em; background: #c8960c; color: #000; padding: 2px 0; z-index: 60; }

  /* Story rail */
  #viz-rail { position: fixed; top: 22px; left: 0; bottom: 0; width: 248px; background: rgba(0,0,0,.30);
    border-right: 1px solid var(--dark); overflow-y: auto; padding: 12px 0; z-index: 30; transition: transform .2s; }
  .rail-item { display: flex; gap: 10px; align-items: center; width: 100%; text-align: left; background: none;
    border: 0; color: var(--subtext); padding: 9px 16px; cursor: pointer; font-size: 13px; border-left: 3px solid transparent; }
  .rail-item:hover { background: rgba(255,255,255,.04); color: var(--text); }
  .rail-item.active { color: var(--accent); border-left-color: var(--accent); background: rgba(255,255,255,.05); }
  .rail-n { color: var(--accent); font-weight: 700; min-width: 18px; }
  .rail-t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  #viz-stage { position: absolute; top: 22px; left: 248px; right: 0; bottom: 0; padding: 4vh 4vw; overflow: hidden; }
  .viz-slide { height: 100%; display: flex; flex-direction: column; animation: vfade .3s ease; }
  @keyframes vfade { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; } }
  .hero { margin: auto; text-align: center; }
  .hero h1 { color: var(--accent); font-size: clamp(34px, 5vw, 68px); margin: 0 0 12px; }
  .hero .sub { color: var(--subtext); font-size: clamp(15px, 1.7vw, 22px); }
  .s-title { color: var(--accent); font-size: clamp(24px, 3.2vw, 40px); margin: 0 0 2vh; font-weight: 800; }
  .s-body { flex: 1; min-height: 0; display: flex; flex-direction: column; align-items: center;
    justify-content: center; }
  .chart-host { width: 100%; max-width: 1000px; }
  .cell-title { color: var(--accent); font-weight: 700; font-size: 15px; margin-bottom: 6px; }
  .quote { margin: auto; font-size: clamp(24px,3.4vw,46px); font-style: italic; font-weight: 700;
    text-align: center; max-width: 80%; }
  ul.bullets { list-style: none; padding: 0; margin: auto 0; }
  ul.bullets li { font-size: clamp(16px,2vw,28px); margin: 0 0 1.6vh; padding-left: 1.5em; position: relative; }
  ul.bullets li::before { content: "▸"; color: var(--accent); position: absolute; left: 0; }
  .slide-img { max-height: 74vh; max-width: 92%; border-radius: 6px; margin: auto; }
  .diagram { width: 100%; max-width: 1000px; margin: auto; }
  .diagram svg { width: 100%; height: auto; }

  /* KPI cards */
  .viz-kpis { display: flex; gap: 18px; flex-wrap: wrap; width: 100%; justify-content: center; }
  .viz-kpi { flex: 1; min-width: 160px; max-width: 280px; background: var(--dark); border-radius: 12px;
    padding: 22px 24px; border-left: 4px solid var(--accent); }
  .viz-kpi .k-label { color: var(--subtext); font-size: 13px; text-transform: uppercase; letter-spacing: .04em; }
  .viz-kpi .k-value { color: var(--accent); font-size: 40px; font-weight: 800; line-height: 1.1; margin-top: 6px; }
  .viz-kpi .k-unit { font-size: 16px; }
  .viz-kpi .k-delta { color: var(--subtext); font-size: 14px; margin-top: 4px; }

  /* Tables */
  .viz-table-wrap { width: 100%; max-width: 1000px; overflow: auto; }
  table.viz-table { width: 100%; border-collapse: collapse; font-size: 15px; color: var(--text); }
  table.viz-table th { background: var(--accent); color: var(--bg); padding: 9px 13px; text-align: left; }
  table.viz-table td { padding: 8px 13px; border-bottom: 1px solid var(--dark); }
  table.viz-table tr:nth-child(even) td { background: rgba(255,255,255,.03); }

  /* Dashboard grid + filters */
  .viz-filterbar { display: flex; gap: 16px; flex-wrap: wrap; margin: 0 0 14px; width: 100%; }
  .viz-filterbar label { display: flex; flex-direction: column; font-size: 11px; color: var(--subtext);
    text-transform: uppercase; letter-spacing: .04em; gap: 4px; }
  .viz-filterbar select { background: var(--dark); color: var(--text); border: 1px solid var(--accent);
    border-radius: 6px; padding: 6px 10px; font-size: 14px; }
  .viz-grid { display: grid; grid-template-columns: repeat(12, 1fr); gap: 18px; width: 100%; align-content: start;
    overflow: auto; }
  .viz-cell { background: rgba(255,255,255,.03); border: 1px solid var(--dark); border-radius: 10px; padding: 14px 16px; }

  /* Insight annotation (Story Point) */
  #viz-insight { position: fixed; left: 264px; bottom: 18px; max-width: 46vw; background: rgba(0,0,0,.78);
    border-left: 4px solid var(--accent); border-radius: 8px; padding: 12px 16px; color: var(--text);
    font-size: 16px; line-height: 1.5; z-index: 40; box-shadow: 0 6px 24px rgba(0,0,0,.4); }
  #viz-insight .i-dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%;
    background: var(--accent); margin-right: 8px; }

  #viz-progress { position: fixed; bottom: 0; left: 0; height: 4px; background: var(--accent); transition: width .3s; z-index: 50; }
  .hud { position: fixed; bottom: 10px; right: 16px; color: var(--subtext); font-size: 12px; z-index: 50; }
  .hud .ctl { margin-right: 12px; }
  .hud a { color: var(--subtext); border: 1px solid var(--dark); border-radius: 5px; padding: 3px 9px; text-decoration: none; }
  #viz-notes { position: fixed; left: 248px; right: 0; bottom: 0; max-height: 38vh; overflow: auto;
    background: rgba(0,0,0,.86); border-top: 2px solid var(--accent); padding: 16px 4vw 26px; color: var(--subtext);
    font-size: 16px; line-height: 1.6; display: none; z-index: 55; }
  #viz-notes.show { display: block; }
  #viz-notes h4 { color: var(--accent); margin: 0 0 6px; font-size: 13px; letter-spacing: .06em; }
</style>
</head>
<body>
<div class="cui">CUI // SP-CTI</div>
<nav id="viz-rail" aria-label="Story steps"></nav>
<main id="viz-stage"></main>
<div id="viz-insight" style="display:none;"></div>
<div id="viz-progress"></div>
<div class="hud">
  <span class="ctl">← →  ·  S notes  ·  R rail  ·  F full  ·  Esc back</span>
  <a href="/slides/{{ deck.deck_id }}">Exit</a>
  <span id="viz-counter">1 / {{ deck.slide_count or 0 }}</span>
</div>
<div id="viz-notes"><h4>SPEAKER NOTES</h4><div id="viz-notes-body"></div></div>

<script>window.__DECK = {{ deck_json | safe }};</script>
<script src="/static/js/charts.js"></script>
<script src="/static/js/viz_story.js"></script>
</body>
</html>
