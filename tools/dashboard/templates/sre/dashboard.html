<!-- CUI // SP-CTI — SRE Operations Dashboard -->
{% extends "base.html" %}
{% block title %}SRE Operations — ICDEV™{% endblock %}
{% block content %}
<style>
  .sre-hero { padding: 20px 30px; }
  .sre-hero h1 { font-size: 22px; margin: 0 0 4px; }
  .sre-hero p { color: #7a8cb0; font-size: 13px; margin: 0; }
  .sre-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 16px; padding: 0 30px 30px; }
  .sre-card { background: #16213e; border: 1px solid #1e3a6e; border-radius: 8px; padding: 16px; }
  .sre-card h3 { font-size: 14px; margin: 0 0 8px; color: #00bcd4; }
  .sre-section { padding: 12px 30px 8px; font-size: 15px; font-weight: 600; color: #eaeaea; border-bottom: 1px solid #1e3a6e; margin-bottom: 12px; }
  .sre-metric { display: flex; justify-content: space-between; padding: 4px 0; border-bottom: 1px solid rgba(255,255,255,0.04); font-size: 12px; }
  .sre-metric .val { font-weight: 700; font-family: 'Cascadia Code', monospace; }
  .sre-metric .lbl { color: #7a8cb0; }
  .sre-pill { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 10px; font-weight: 600; margin: 1px 2px; }
  .pill-elite { background: #27ae60; color: #fff; }
  .pill-high { background: #2ecc71; color: #fff; }
  .pill-medium { background: #f39c12; color: #fff; }
  .pill-low { background: #e74c3c; color: #fff; }
  .pill-healthy { background: #27ae60; color: #fff; }
  .pill-warning { background: #f39c12; color: #fff; }
  .pill-critical { background: #e74c3c; color: #fff; }
  .pill-exhausted { background: #c0392b; color: #fff; }
  /* Unassessed is neutral on purpose — it must not read as a good or bad score. */
  .pill-not-assessed { background: #33415c; color: #b9c6de; }
  .sre-bar { background: #0f2040; border-radius: 4px; height: 8px; margin: 4px 0 8px; overflow: hidden; }
  .sre-bar-fill { height: 100%; border-radius: 4px; }
  .sre-incident { padding: 8px; background: #0f2040; border-radius: 6px; margin: 4px 0; border-left: 3px solid #e74c3c; }
  .sre-incident .title { font-weight: 600; font-size: 12px; }
  .sre-incident .meta { font-size: 10px; color: #7a8cb0; }
  .sre-btn { display: inline-block; padding: 6px 16px; background: #00bcd4; color: #fff; border: none; border-radius: 4px; font-size: 12px; cursor: pointer; text-decoration: none; margin: 4px 2px; }
  .sre-btn:hover { background: #0097a7; }
  .sre-btn-danger { background: #e74c3c; }
  .sre-btn-danger:hover { background: #c0392b; }
  .sre-stats { display: flex; gap: 20px; margin-top: 12px; }
  .sre-stat { text-align: center; }
  .sre-stat .val { font-size: 28px; font-weight: 700; color: #00bcd4; }
  .sre-stat .lbl { font-size: 11px; color: #7a8cb0; }
  #sre-data { min-height: 200px; }
</style>

<div class="sre-hero">
  <h1>SRE Operations Dashboard</h1>
  <p>Service Level Objectives, Incident Management, Runbooks, DORA Metrics</p>
  <div style="margin-top:8px;">
    <a href="/devops/" class="sre-btn">DevOps Canvas</a>
    <a href="/monitoring" class="sre-btn">Monitoring</a>
    <button class="sre-btn" onclick="loadSreDashboard()">Refresh</button>
  </div>
  <div class="sre-stats" id="sre-stats"></div>
</div>

<div id="sre-data">
  <div style="padding:30px;color:#7a8cb0;text-align:center;">Loading SRE data...</div>
</div>

<script>
function loadSreDashboard() {
  // Fetch all SRE data in parallel
  Promise.all([
    fetch('/api/sre/dashboard').then(r => r.json()),
    fetch('/api/sre/dora').then(r => r.json()),
    fetch('/api/sre/invocations?limit=15').then(r => r.json()),
  ]).then(([dashboard, dora, invocations]) => {
    renderSreDashboard(dashboard, dora, invocations);
  }).catch(err => {
    document.getElementById('sre-data').innerHTML = '<div style="padding:30px;color:#e74c3c;">Error loading SRE data: ' + err + '</div>';
  });
}

// A duration of null means "nothing has completed yet", which is a different
// fact from "it completed in 0ms". Render it as a dash, never as a number.
function invMs(v) {
  if (v === null || v === undefined) return '-';
  return v >= 10000 ? (v / 1000).toFixed(1) + 's' : v.toFixed(1);
}

function invErrColor(rate) {
  if (rate >= 0.10) return '#e74c3c';
  if (rate > 0) return '#f39c12';
  return '#27ae60';
}

function renderInvocations(inv) {
  const surfaces = (inv && inv.surfaces) || [];
  // Say the window out loud. These are NOT lifetime totals (the endpoint
  // defaults to 30 days), and a windowed count presented as a total is a lie.
  const win = (inv && inv.window_days) ? ` (${inv.window_days}-day window)` : '';
  let html = '<div class="sre-section">Runtime Invocations — MCP tools, agents, personas, roles'
    + win + '</div>';

  if (inv && inv.error) {
    return html + '<div class="sre-grid"><div class="sre-card"><p style="color:#f39c12">'
      + 'Invocation telemetry unavailable: ' + inv.error + '</p></div></div>';
  }
  if (!surfaces.length) {
    // Distinguish "nothing ran" from "the table is not there yet" — an operator
    // seeing an empty panel otherwise cannot tell which.
    return html + '<div class="sre-grid"><div class="sre-card"><p style="color:#7a8cb0">'
      + 'No invocations recorded. Migration 341 may not have run, or '
      + 'ICDEV_OBS_INVOCATIONS is set to 0.</p></div></div>';
  }

  html += '<div class="sre-grid">';
  surfaces.forEach(s => {
    html += `<div class="sre-card">
      <h3>${s.surface}</h3>
      <div class="sre-metric"><span class="lbl">Calls</span><span class="val">${s.calls}</span></div>
      <div class="sre-metric"><span class="lbl">Names</span><span class="val">${s.names}</span></div>
      <div class="sre-metric"><span class="lbl">Errors</span><span class="val" style="color:${invErrColor(s.error_rate)}">${s.errors} (${(s.error_rate * 100).toFixed(1)}%)</span></div>
      <div class="sre-metric"><span class="lbl">Avg</span><span class="val">${invMs(s.avg_ms)} ms</span></div>
      <div class="sre-metric"><span class="lbl">Max</span><span class="val">${invMs(s.max_ms)} ms</span></div>
    </div>`;
  });
  html += '</div>';

  const names = (inv.names || []);
  if (names.length) {
    html += `<div class="sre-section" style="font-size:13px;">Busiest ${names.length} of ${inv.total_names}</div>`;
    html += '<div style="padding:0 30px 30px;"><table style="width:100%;border-collapse:collapse;font-size:12px;">';
    html += '<tr style="color:#7a8cb0;text-align:left;">'
      + '<th style="padding:4px;">Surface</th><th style="padding:4px;">Name</th>'
      + '<th style="padding:4px;text-align:right;">Calls</th>'
      + '<th style="padding:4px;text-align:right;">Errors</th>'
      + '<th style="padding:4px;text-align:right;">Avg ms</th>'
      + '<th style="padding:4px;text-align:right;">Max ms</th></tr>';
    names.forEach(r => {
      html += `<tr style="border-top:1px solid rgba(255,255,255,0.05);">
        <td style="padding:4px;color:#7a8cb0;">${r.surface}</td>
        <td style="padding:4px;font-family:'Cascadia Code',monospace;">${r.name}</td>
        <td style="padding:4px;text-align:right;">${r.calls}</td>
        <td style="padding:4px;text-align:right;color:${invErrColor(r.error_rate)}">${r.errors}</td>
        <td style="padding:4px;text-align:right;">${invMs(r.avg_ms)}</td>
        <td style="padding:4px;text-align:right;">${invMs(r.max_ms)}</td>
      </tr>`;
    });
    html += '</table></div>';
  }
  return html;
}

function renderSreDashboard(d, dora, inv) {
  // Stats bar
  const statsEl = document.getElementById('sre-stats');
  const activeSev1 = (d.active_incidents || []).filter(i => i.severity === 'sev1').length;
  statsEl.innerHTML = `
    <div class="sre-stat"><div class="val">${(d.slos || []).length}</div><div class="lbl">SLOs</div></div>
    <div class="sre-stat"><div class="val" style="color:${activeSev1 > 0 ? '#e74c3c' : '#27ae60'}">${(d.active_incidents || []).length}</div><div class="lbl">Active Incidents</div></div>
    <div class="sre-stat"><div class="val">${(d.runbooks || []).length}</div><div class="lbl">Runbooks</div></div>
    <div class="sre-stat"><div class="val" style="color:${doraColor(dora.overall_rating)}">${dora.overall_rating || 'N/A'}</div><div class="lbl">DORA Rating</div></div>
  `;

  let html = '';

  // DORA Metrics
  html += '<div class="sre-section">DORA Metrics (' + (dora.window_days || 30) + '-day window)</div>';
  html += '<div class="sre-grid">';
  const metrics = [
    {label: 'Deploy Frequency', data: dora.deploy_frequency, fmt: v => v.value + ' ' + v.unit},
    {label: 'Lead Time', data: dora.lead_time, fmt: v => v.value + ' ' + v.unit},
    {label: 'Change Failure Rate', data: dora.change_failure_rate, fmt: v => v.value + v.unit},
    {label: 'MTTR', data: dora.mttr, fmt: v => v.value < 3600 ? Math.round(v.value/60) + ' min' : Math.round(v.value/3600) + ' hours'},
  ];
  metrics.forEach(m => {
    if (!m.data) return;
    // A null value means the metric could not be assessed — the endpoint's
    // NOT_ASSESSED path. Never hand it to fmt(): `Math.round(null/60)` renders
    // MTTR as "0 min", which reads as a perfect score, and the others render
    // the literal "null". Show the absence instead.
    const value = m.data.value == null
      ? `<span style="color:#7a8cb0">Not measured</span>`
      : m.fmt(m.data);
    const rating = m.data.rating || 'Not Assessed';
    // "Not Assessed" would otherwise become the two-class `pill-not assessed`.
    const pillClass = rating.toLowerCase().replace(/\s+/g, '-');
    html += `<div class="sre-card">
      <h3>${m.label}</h3>
      <div style="font-size:24px;font-weight:800;color:${doraColor(rating)}">${value}</div>
      <span class="sre-pill pill-${pillClass}" title="${m.data.note || ''}">${rating}</span>
    </div>`;
  });
  html += '</div>';

  // SLOs
  html += '<div class="sre-section">Service Level Objectives</div>';
  html += '<div class="sre-grid">';
  (d.slos || []).forEach(slo => {
    const budget = slo.budget_remaining != null ? (slo.budget_remaining * 100).toFixed(1) : '?';
    const statusColor = slo.status === 'healthy' ? '#27ae60' : slo.status === 'warning' ? '#f39c12' : '#e74c3c';
    html += `<div class="sre-card">
      <h3>${slo.service_name} — ${slo.slo_name}</h3>
      <div class="sre-metric"><span class="lbl">Type</span><span class="val">${slo.slo_type}</span></div>
      <div class="sre-metric"><span class="lbl">Target</span><span class="val">${slo.target_value}</span></div>
      <div class="sre-metric"><span class="lbl">Current</span><span class="val">${slo.current_value || 'N/A'}</span></div>
      <div class="sre-metric"><span class="lbl">Budget</span><span class="val">${budget}%</span></div>
      <div class="sre-bar"><div class="sre-bar-fill" style="width:${Math.max(0,Math.min(100,budget))}%;background:${statusColor}"></div></div>
      <span class="sre-pill pill-${slo.status}">${slo.status}</span>
    </div>`;
  });
  if (!(d.slos || []).length) html += '<div class="sre-card"><p style="color:#7a8cb0">No SLOs defined. Create one via API or DevOps Canvas.</p></div>';
  html += '</div>';

  // Active Incidents
  html += '<div class="sre-section">Active Incidents</div>';
  html += '<div class="sre-grid">';
  (d.active_incidents || []).forEach(inc => {
    const sevColor = inc.severity === 'sev1' ? '#e74c3c' : inc.severity === 'sev2' ? '#f39c12' : '#7a8cb0';
    html += `<div class="sre-card">
      <div class="sre-incident" style="border-color:${sevColor}">
        <div class="title">${inc.title || 'Untitled'}</div>
        <div class="meta">${inc.severity.toUpperCase()} · ${inc.service_name} · ${inc.status}</div>
        <div class="meta">${inc.created_at ? inc.created_at.substring(0,16) : ''}</div>
      </div>
    </div>`;
  });
  if (!(d.active_incidents || []).length) html += '<div class="sre-card"><p style="color:#27ae60">No active incidents.</p></div>';
  html += '</div>';

  // MTTR Stats
  if (d.mttr_stats) {
    html += '<div class="sre-section">MTTR by Severity</div>';
    html += '<div class="sre-grid">';
    const targets = d.mttr_stats.targets || {};
    const actuals = d.mttr_stats.actuals || {};
    ['sev1', 'sev2', 'sev3', 'sev4'].forEach(sev => {
      const target = targets[sev] || 0;
      const actual = actuals[sev]?.avg_seconds || 0;
      const count = actuals[sev]?.count || 0;
      const meeting = actual <= target || actual === 0;
      html += `<div class="sre-card">
        <h3>${sev.toUpperCase()}</h3>
        <div class="sre-metric"><span class="lbl">Target</span><span class="val">${Math.round(target/60)} min</span></div>
        <div class="sre-metric"><span class="lbl">Actual Avg</span><span class="val" style="color:${meeting ? '#27ae60' : '#e74c3c'}">${actual > 0 ? Math.round(actual/60) + ' min' : 'N/A'}</span></div>
        <div class="sre-metric"><span class="lbl">Incidents</span><span class="val">${count}</span></div>
      </div>`;
    });
    html += '</div>';
  }

  // Runbooks
  html += '<div class="sre-section">Runbooks</div>';
  html += '<div class="sre-grid">';
  (d.runbooks || []).forEach(rb => {
    html += `<div class="sre-card">
      <h3>${rb.name || 'Unnamed'}</h3>
      <div class="sre-metric"><span class="lbl">Risk</span><span class="val">${rb.risk_level}</span></div>
      <div class="sre-metric"><span class="lbl">Pattern</span><span class="val" style="font-size:10px">${rb.trigger_pattern || ''}</span></div>
      <div class="sre-metric"><span class="lbl">Auto-Execute</span><span class="val">${rb.auto_execute ? 'Yes' : 'No'}</span></div>
    </div>`;
  });
  if (!(d.runbooks || []).length) html += '<div class="sre-card"><p style="color:#7a8cb0">No runbooks defined.</p></div>';
  html += '</div>';

  // Runtime invocations (obs-cov-02) — slow or failing MCP tools without a SQL client.
  html += renderInvocations(inv);

  document.getElementById('sre-data').innerHTML = html;
}

function doraColor(rating) {
  return {Elite: '#27ae60', High: '#2ecc71', Medium: '#f39c12', Low: '#e74c3c'}[rating] || '#7a8cb0';
}

document.addEventListener('DOMContentLoaded', loadSreDashboard);
</script>
{% endblock %}
