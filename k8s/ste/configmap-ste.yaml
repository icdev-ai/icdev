# CUI // SP-CTI — STE ConfigMap: overrides all cloud-pointing env vars for air-gap deployment
apiVersion: v1
kind: ConfigMap
metadata:
  name: icdev-ste-config
  namespace: icdev-ste
  labels:
    classification: SECRET
    environment: ste
data:
  ICDEV_DEPLOY_MODE: "STE"
  ICDEV_LLM_PROVIDER: "ollama"
  OLLAMA_BASE_URL: "http://localhost:11434"
  ICDEV_STORAGE_BACKEND: "sqlite"
  ICDEV_CANVAS_ACCESS_ENFORCE: "true"
  ICDEV_MFA_REQUIRED: "true"
  ICDEV_PKI_STRICT_REVOCATION: "true"
  ICDEV_FIPS_MODE: "true"
  ICDEV_DEVICE_TRUST_REQUIRED: "true"
  ICDEV_DEVICE_TRUST_PROVIDER: "stub"
  ICDEV_CONTINUOUS_AUTH_ENABLED: "true"
  ICDEV_SESSION_MAX_AGE_MINUTES: "240"
  CLASSIFICATION: "SECRET"
