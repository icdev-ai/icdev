# CUI // SP-CTI — SIPR-only NetworkPolicy for IL6 STE deployment
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: icdev-sipr-deny-egress
  namespace: icdev-ste
  labels:
    classification: SECRET
    environment: ste
spec:
  podSelector: {}
  policyTypes:
    - Egress
    - Ingress
  egress:
    # Allow only intra-namespace traffic
    - to:
        - namespaceSelector:
            matchLabels:
              name: icdev-ste
    # Allow DNS within cluster
    - to:
        - namespaceSelector:
            matchLabels:
              name: kube-system
      ports:
        - protocol: UDP
          port: 53
    # Allow Ollama (local LLM) on loopback
    - to:
        - ipBlock:
            cidr: 127.0.0.1/32
      ports:
        - port: 11434
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              name: icdev-ste
