# [TEMPLATE: CUI // SP-CTI]
apiVersion: apps/v1
kind: Deployment
metadata:
  name: icdev-monitor
  namespace: icdev
  labels:
    app.kubernetes.io/name: monitor
    app.kubernetes.io/component: agent
    app.kubernetes.io/part-of: icdev
    classification: CUI
  annotations:
    icdev.io/alert-sla: "5s"
    icdev.io/compliance: "NIST-AU-6,NIST-SI-4"
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: monitor
  template:
    metadata:
      labels:
        app.kubernetes.io/name: monitor
        app.kubernetes.io/component: agent
        app.kubernetes.io/part-of: icdev
        classification: CUI
    spec:
      serviceAccountName: icdev-agent
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: monitor
          image: ${ECR_REGISTRY}/icdev-monitor:latest
          args: ["tools/a2a/agent_server.py", "--agent-id", "monitor-agent", "--port", "8450"]
          ports:
            - containerPort: 8450
              protocol: TCP
          env:
            - name: SIEM_SLA_SECONDS
              value: "5"
            - name: ALERT_CORRELATOR_WINDOW_SECONDS
              value: "30"
            - name: MONITOR_HEARTBEAT_INTERVAL
              value: "60"
            - name: SIEM_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: icdev-siem-secrets
                  key: siem_endpoint
                  optional: true
            - name: SIEM_TOKEN
              valueFrom:
                secretKeyRef:
                  name: icdev-siem-secrets
                  key: siem_token
                  optional: true
          envFrom:
            - configMapRef:
                name: icdev-config
            - secretRef:
                name: icdev-secrets
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          livenessProbe:
            httpGet:
              path: /health
              port: 8450
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8450
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: monitor
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: monitor
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: icdev-data
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: icdev-monitor
  namespace: icdev
  labels:
    classification: CUI
spec:
  selector:
    app.kubernetes.io/name: monitor
  ports:
    - port: 8450
      targetPort: 8450
      protocol: TCP
  type: ClusterIP
