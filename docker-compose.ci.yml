# [TEMPLATE: CUI // SP-CTI]
# ICDEV™ CI Integration Stack
#
# Consumed only by .github/workflows/infrastructure-ci.yml (provision-ci-stack).
# That job referenced this file from the day it was written, but the file was
# never added — see #911. The reference stayed invisible because build-images
# always failed first, so the job was permanently `skipped`.
#
# Deliberately minimal. This stack exists to answer one question: does a
# freshly built dashboard image boot, initialize its database, and serve
# traffic? It is NOT a miniature of docker-compose.yml and should not grow into
# one — the 16-agent A2A mesh adds many minutes of build time and nothing the
# provision job actually asserts.
#
# No PostgreSQL service: the job writes ICDEV_STORAGE_BACKEND=sqlite into .env
# and sets it in the job env, so a Postgres container would start, be paid for
# in wall-clock, and never receive a query. Add one only alongside a job step
# that actually exercises it.

services:

  # Web dashboard — the single service the provision job probes.
  icdev-dashboard:
    build:
      context: .
      dockerfile: docker/Dockerfile.dashboard
      # No `target:` — unlike docker-compose.yml, which requests a
      # `debian-runtime` stage that Dockerfile.dashboard does not define.
      # Its stages are `builder` and an unnamed final stage; naming a
      # nonexistent target fails the build outright.
    image: icdev/dashboard:ci
    # Always build; never resolve this tag from a registry. Without it compose
    # tries to pull icdev/dashboard:ci from Docker Hub first (logging a
    # "pull access denied" warning that reads like the real error), and on any
    # host that already has the tag it will happily run a STALE image — which
    # silently tests the wrong code.
    pull_policy: build
    container_name: icdev-dashboard-ci
    ports:
      # The workflow curls host :5050. app.py's own default is 5050; the
      # Dockerfile CMD overrides it to 5000, and `command:` below puts it back
      # so host and container ports agree and the mapping stays obvious.
      - "5050:5050"
    environment:
      ICDEV_DB_PATH: /app/data/icdev.db
      ICDEV_PROJECT_ROOT: /app
      PORT: "5050"
      ICDEV_STORAGE_BACKEND: sqlite
      # NOTE: ICDEV_AUTH_BYPASS is deliberately NOT set. tools/dashboard/auth.py
      # does not implement that variable — it is honoured on other surfaces — so
      # setting it here bought nothing and implied a security posture that was
      # not real. /api/health is reachable because it is now in that module's
      # PUBLIC_ENDPOINTS, which is where a load-balancer probe belongs.
      # Defaults keep `docker compose config` valid in validate-compose, which
      # only does `touch .env` and exports nothing.
      ICDEV_DASHBOARD_SECRET: ${ICDEV_DASHBOARD_SECRET:-ci-test-secret-32chars-minimum!!}
      ICDEV_CLASSIFICATION: ${ICDEV_CLASSIFICATION:-CUI}
      IMPACT_LEVEL: ${IMPACT_LEVEL:-IL4}
      ICDEV_CUI_BANNER_ENABLED: "true"
    volumes:
      - icdev-ci-data:/app/data
    tmpfs:
      # Dockerfile creates /app/.tmp, but /app is chmod 750 and the process runs
      # as the non-root `icdev` user; mirror docker-compose.yml's overlay.
      - /app/.tmp:size=256m,mode=1777
    healthcheck:
      # Overrides the image HEALTHCHECK.
      #
      # This is a LIVENESS probe, not a readiness one. /api/health returns 200
      # whether its internal DB check passes or fails — the result only changes
      # the body ({"status": "ok"|"degraded", "db": bool}) — so a pass proves
      # the app booted, imported, and is serving, NOT that the database is
      # reachable. Do not read a healthy container as a healthy database.
      #
      # KNOWN: this currently answers {"db": false, "status": "degraded"} in the
      # container even though the DB is fine — `get_connection().execute
      # ("SELECT 1")` succeeds from a shell in that same container, on a worker
      # thread, and inside a test_request_context. Pre-existing and previously
      # invisible (the endpoint 401'd before it was made public); not diagnosed
      # here. Making the probe assert "ok" would be the fix once it is.
      test: ["CMD", "curl", "-sf", "http://localhost:5050/api/health"]
      interval: 10s
      timeout: 5s
      # First boot runs migrations against an empty SQLite file; a short
      # start_period would mark the container unhealthy mid-init and fail
      # `up --wait`.
      start_period: 90s
      retries: 12
    # Schema init and serve in one service. A separate one-shot init container
    # would be closer to docker-compose.yml, but `up --wait` treats a service
    # that exits as a failure to become healthy, so the one-shot has to be
    # folded in here. `exec` keeps the server as PID 1 so compose stop signals
    # reach it instead of the shell.
    command:
      - sh
      - -c
      - "python tools/db/init_icdev_db.py && exec python tools/dashboard/app.py --port 5050"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    restart: "no"

volumes:
  icdev-ci-data:
    driver: local
