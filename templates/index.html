<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geospatial Dashboard — ICDEV™</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <style>
        :root {
            --bg: #0b1120;
            --bg-card: #111827;
            --border: #1e293b;
            --text: #e2e8f0;
            --text-dim: #94a3b8;
            --accent: #4a90d9;
            --accent-hover: #357abd;
        }
        * { box-sizing: border-box; }
        html, body { margin: 0; padding: 0; height: 100%; background: var(--bg); color: var(--text); font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif; }

        /* CUI banners */
        .cui-banner {
            background: #1e3a6e;
            color: #e2e8f0;
            text-align: center;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.5px;
            padding: 4px 12px;
            border-bottom: 1px solid #2a4a7e;
        }
        .cui-banner.bottom { border-bottom: none; border-top: 1px solid #2a4a7e; }

        .app-shell { display: flex; flex-direction: column; height: 100vh; }
        .app-header {
            display: flex; align-items: center; justify-content: space-between;
            padding: 10px 16px; background: var(--bg-card); border-bottom: 1px solid var(--border);
        }
        .app-header h1 { margin: 0; font-size: 16px; }
        .app-header .status { font-size: 12px; color: var(--text-dim); display: flex; align-items: center; gap: 8px; }
        .app-header .status-dot { width: 8px; height: 8px; border-radius: 50%; background: #ef4444; }
        .app-header .status-dot.online { background: #22c55e; }

        .toolbar {
            display: flex; align-items: center; gap: 8px;
            padding: 8px 16px; background: var(--bg-card); border-bottom: 1px solid var(--border);
        }
        .btn {
            display: inline-flex; align-items: center; gap: 6px;
            padding: 6px 12px; border-radius: 6px; border: 1px solid var(--border);
            background: var(--bg-card); color: var(--text); font-size: 13px; cursor: pointer;
        }
        .btn:hover { background: #1e293b; }
        .btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; }
        .btn-primary:hover { background: var(--accent-hover); }

        #map { flex: 1; background: #0f1e35; }

        .leaflet-popup-content-wrapper { background: var(--bg-card); color: var(--text); border: 1px solid var(--border); }
        .leaflet-popup-tip { background: var(--bg-card); }
        .leaflet-container a { color: var(--accent); }
    </style>
</head>
<body>
    <div class="cui-banner">CUI // SP-CTI — DISTRIBUTION STATEMENT D</div>
    <div class="app-shell">
        <div class="app-header">
            <h1>Geospatial Dashboard</h1>
            <div class="status">
                <span id="ws-status-dot" class="status-dot"></span>
                <span id="ws-status-text">WebSocket disconnected</span>
                <span id="marker-count" style="margin-left:8px; color:var(--text-dim);">0 markers</span>
            </div>
        </div>
        <div class="toolbar">
            <button class="btn btn-primary" id="btn-refresh" onclick="triggerAggregate()">&#x21bb; Refresh</button>
            <button class="btn" id="btn-demo" onclick="loadDemoData()">Load Demo</button>
            <span style="font-size:12px; color:var(--text-dim); margin-left:auto;">Eastern Mediterranean / Persian Gulf</span>
        </div>
        <div id="map"></div>
    </div>
    <div class="cui-banner bottom">CUI // SP-CTI — DISTRIBUTION STATEMENT D</div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js" integrity="sha384-2huaZvOR9iDzH2slqA0yK8n2QY2P2rtN8x2icC8n3R5/N0qqH1x5c5z5z5z5z5z5z" crossorigin="anonymous"></script>
    <script src="/geospatial/static/js/dash.js"></script>
</body>
</html>
