# [TEMPLATE: CUI // SP-CTI]
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: signalforge-default-deny
  namespace: signalforge
  labels:
    classification: CUI
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress: []
  egress: []
---
# Allow inter-agent communication within namespace
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: signalforge-allow-internal
  namespace: signalforge
  labels:
    classification: CUI
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/part-of: signalforge
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: signalforge
      ports:
        - protocol: TCP
          port: 9443
        - protocol: TCP
          port: 9444
        - protocol: TCP
          port: 9445
        - protocol: TCP
          port: 9446
        - protocol: TCP
          port: 9447
        - protocol: TCP
          port: 8448
        - protocol: TCP
          port: 9449
        - protocol: TCP
          port: 9450
        - protocol: TCP
          port: 5000
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: signalforge
    - to: []
      ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 9200
        - protocol: TCP
          port: 8089
        - protocol: TCP
          port: 9090
---
# Allow dashboard ingress from outside
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: signalforge-allow-dashboard-ingress
  namespace: signalforge
  labels:
    classification: CUI
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: dashboard
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - protocol: TCP
          port: 5000
