# [TEMPLATE: CUI // SP-CTI]
apiVersion: apps/v1
kind: Deployment
metadata:
  name: signalforge-modernization-agent
  namespace: signalforge
  labels:
    app: signalforge-modernization-agent
    tier: domain
    app.kubernetes.io/name: modernization-agent
    app.kubernetes.io/component: agent
    app.kubernetes.io/part-of: signalforge
    classification: CUI
spec:
  replicas: 2
  selector:
    matchLabels:
      app: signalforge-modernization-agent
  template:
    metadata:
      labels:
        app: signalforge-modernization-agent
        tier: domain
        app.kubernetes.io/name: modernization-agent
        app.kubernetes.io/component: agent
        app.kubernetes.io/part-of: signalforge
        classification: CUI
    spec:
      serviceAccountName: signalforge-agent
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: modernization-agent
          image: ${ECR_REGISTRY}/signalforge-modernization-agent:latest
          ports:
            - containerPort: 8452
              protocol: TCP
          envFrom:
            - configMapRef:
                name: signalforge-config
            - secretRef:
                name: signalforge-secrets
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
            runAsUser: 1000
          livenessProbe:
            httpGet:
              path: /health
              port: 8452
            initialDelaySeconds: 15
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8452
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /app/data
            - name: tmp
              mountPath: /app/.tmp
            - name: certs
              mountPath: /etc/signalforge/certs
              readOnly: true
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: modernization-agent
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: modernization-agent
      volumes:
        - name: data
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        - name: certs
          secret:
            secretName: modernization-agent-tls
---
apiVersion: v1
kind: Service
metadata:
  name: signalforge-modernization-agent
  namespace: signalforge
  labels:
    app: signalforge-modernization-agent
    tier: domain
    classification: CUI
spec:
  selector:
    app: signalforge-modernization-agent
  ports:
    - port: 8452
      targetPort: 8452
      protocol: TCP
  type: ClusterIP
