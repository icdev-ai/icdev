# SignalForge Trading Configuration
# CUI // SP-CTI

instrument: ES
timeframes: [1]  # 1-minute bars only
session: RTH     # 09:30-16:00 ET
direction: both  # LONG and SHORT
target_trades_per_day: [3, 10]

features:
  count: 25
  sma_periods: [20, 50, 200]
  rsi_period: 14
  macd: [12, 26, 9]
  bb_period: 20
  bb_std: 2
  atr_period: 14
  adx_period: 14
  stoch: [14, 3, 3]
  volume_sma_period: 20
  support_resistance_lookback: 50

model:
  type: xgboost          # xgboost or lightgbm
  lookahead_bars: 20     # bars ahead for label generation
  min_move_threshold: 0.001  # 0.1% min move for labeling
  flat_zone_pct: 0.0005  # moves < this are FLAT
  max_depth: 6
  n_estimators: 500
  learning_rate: 0.01
  min_child_weight: 5
  subsample: 0.8
  colsample_bytree: 0.8
  eval_metric: mlogloss
  early_stopping_rounds: 50
  cv_folds: 5

risk:
  take_profit_pct: 0.015   # 1.5%
  stop_loss_pct: 0.010     # 1.0%
  max_daily_loss_pct: 0.03 # 3% circuit breaker
  max_positions: 1
  position_size_method: atr
  risk_per_trade_pct: 0.01 # 1% of account per trade
  trailing_stop:
    enabled: true
    atr_multiplier: 2.0
    activate_pct: 0.005    # activate at 0.5% profit
  end_of_day_flatten: true # close all positions at 15:55 ET

backtest:
  walk_forward_train_months: 6
  walk_forward_test_months: 1
  walk_forward_step_months: 1
  monte_carlo_iterations: 1000
  min_trades_for_validity: 50
  commission_per_side: 2.50  # USD per contract per side
  slippage_ticks: 1          # 1 tick slippage per entry/exit

bridge:
  host: localhost
  port: 50051
  heartbeat_interval_sec: 5
  reconnect_delay_sec: 5
  max_reconnect_attempts: 10

journal:
  db_path: data/signalforge.db
  table_name: trades
  hash_chain: true  # SHA-256 tamper detection
