<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{{ app_name }}{% endblock %}</title>
    <style>
        :root {
            --bg: #0f172a; --surface: #1e293b; --surface2: #334155;
            --text: #e2e8f0; --text-dim: #94a3b8; --accent: #3b82f6;
            --accent2: #8b5cf6; --success: #22c55e; --warning: #f59e0b;
            --danger: #ef4444; --border: #475569;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
               background: var(--bg); color: var(--text); line-height: 1.6; }
        nav { background: var(--surface); border-bottom: 1px solid var(--border);
              padding: 0 24px; display: flex; align-items: center; gap: 4px; }
        nav .brand { font-size: 20px; font-weight: 700; color: var(--accent);
                     padding: 12px 16px 12px 0; border-right: 1px solid var(--border);
                     margin-right: 8px; text-decoration: none; }
        nav .brand span { color: var(--accent2); }
        nav a { color: var(--text-dim); text-decoration: none; padding: 14px 12px;
                font-size: 14px; border-bottom: 2px solid transparent; transition: all .2s; }
        nav a:hover { color: var(--text); }
        nav a.active { color: var(--accent); border-bottom-color: var(--accent); }
        .container { max-width: 1200px; margin: 0 auto; padding: 24px; }
        h1 { font-size: 24px; margin-bottom: 20px; }
        h2 { font-size: 18px; margin-bottom: 12px; color: var(--text-dim); }
        .stat-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
                     gap: 16px; margin-bottom: 24px; }
        .stat-card { background: var(--surface); border: 1px solid var(--border);
                     border-radius: 8px; padding: 20px; }
        .stat-card .label { font-size: 12px; color: var(--text-dim); text-transform: uppercase;
                            letter-spacing: 1px; margin-bottom: 4px; }
        .stat-card .value { font-size: 32px; font-weight: 700; }
        .stat-card .value.green { color: var(--success); }
        .stat-card .value.blue { color: var(--accent); }
        .stat-card .value.purple { color: var(--accent2); }
        .stat-card .value.orange { color: var(--warning); }
        .stat-card .value.red { color: var(--danger); }
        table { width: 100%; border-collapse: collapse; background: var(--surface);
                border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
        th { background: var(--surface2); color: var(--text-dim); font-size: 12px;
             text-transform: uppercase; letter-spacing: 1px; padding: 12px 16px; text-align: left; }
        td { padding: 12px 16px; border-top: 1px solid var(--border); font-size: 14px; }
        tr:hover td { background: rgba(59, 130, 246, 0.05); }
        .badge { display: inline-block; padding: 2px 10px; border-radius: 12px;
                 font-size: 12px; font-weight: 600; }
        .badge-green { background: rgba(34,197,94,.15); color: var(--success); }
        .badge-blue { background: rgba(59,130,246,.15); color: var(--accent); }
        .badge-orange { background: rgba(245,158,11,.15); color: var(--warning); }
        .badge-red { background: rgba(239,68,68,.15); color: var(--danger); }
        .badge-purple { background: rgba(139,92,246,.15); color: var(--accent2); }
        .badge-gray { background: rgba(148,163,184,.15); color: var(--text-dim); }
        .card { background: var(--surface); border: 1px solid var(--border);
                border-radius: 8px; padding: 20px; margin-bottom: 16px; }
        .card-header { display: flex; justify-content: space-between; align-items: center;
                       margin-bottom: 12px; }
        .btn { display: inline-block; padding: 8px 16px; border-radius: 6px;
               font-size: 14px; font-weight: 600; border: none; cursor: pointer; text-decoration: none; }
        .btn-primary { background: var(--accent); color: white; }
        .btn-primary:hover { background: #2563eb; }
        .btn-success { background: var(--success); color: white; }
        .btn-sm { padding: 4px 12px; font-size: 12px; }
        .mission-card { position: relative; overflow: hidden; }
        .mission-card .difficulty { position: absolute; top: 12px; right: 12px; }
        .mission-card .xp { color: var(--warning); font-weight: 700; }
        .mission-card .objectives { list-style: none; padding: 0; }
        .mission-card .objectives li { padding: 4px 0; padding-left: 20px; position: relative; }
        .mission-card .objectives li::before { content: '○'; position: absolute; left: 0; color: var(--text-dim); }
        .mission-card.completed .objectives li::before { content: '●'; color: var(--success); }
        .empty { text-align: center; padding: 40px; color: var(--text-dim); }
        .nl-input { width: 100%; padding: 12px 16px; background: var(--surface2); border: 1px solid var(--border);
                    border-radius: 8px; color: var(--text); font-size: 16px; }
        .nl-input:focus { outline: none; border-color: var(--accent); }
        .code-block { background: #0d1117; border: 1px solid var(--border); border-radius: 8px;
                      padding: 16px; font-family: 'Fira Code', monospace; font-size: 13px;
                      white-space: pre-wrap; overflow-x: auto; color: #c9d1d9; margin-top: 12px; }
        /* Mission workspace */
        .mission-workspace { background: var(--surface); border: 2px solid var(--accent);
                             border-radius: 12px; padding: 24px; margin-top: 24px;
                             animation: slideDown .3s ease; }
        @keyframes slideDown { from { opacity: 0; transform: translateY(-12px); } to { opacity: 1; transform: translateY(0); } }
        .workspace-header { display: flex; justify-content: space-between; align-items: flex-start;
                            margin-bottom: 20px; padding-bottom: 16px; border-bottom: 1px solid var(--border); }
        .workspace-header h2 { margin: 0 0 4px 0; color: var(--text); font-size: 20px; }
        .workspace-meta { display: flex; gap: 12px; font-size: 13px; align-items: center; flex-wrap: wrap; }
        .btn-close { background: var(--surface2); color: var(--text-dim); border: 1px solid var(--border);
                     border-radius: 6px; padding: 6px 14px; font-size: 13px; cursor: pointer; }
        .btn-close:hover { color: var(--text); border-color: var(--text-dim); }
        .workspace-body { display: grid; grid-template-columns: 1fr 260px; gap: 20px; }
        .objectives-list { list-style: none; padding: 0; margin: 0 0 16px 0; }
        .objectives-list li { padding: 6px 0 6px 28px; position: relative; font-size: 14px; }
        .objectives-list li::before { content: '○'; position: absolute; left: 4px; color: var(--text-dim); font-size: 16px; }
        .objectives-list li.done::before { content: '●'; color: var(--success); }
        .code-editor { width: 100%; min-height: 200px; background: #0d1117; border: 1px solid var(--border);
                       border-radius: 8px; padding: 16px; font-family: 'Fira Code', 'Cascadia Code', monospace;
                       font-size: 13px; color: #c9d1d9; resize: vertical; line-height: 1.5; tab-size: 4; }
        .code-editor:focus { outline: none; border-color: var(--accent); }
        .workspace-actions { display: flex; gap: 10px; margin-top: 16px; flex-wrap: wrap; }
        .btn-hint { background: rgba(245,158,11,.15); color: var(--warning); border: 1px solid rgba(245,158,11,.3); }
        .btn-hint:hover { background: rgba(245,158,11,.25); }
        .btn-run { background: rgba(59,130,246,.15); color: var(--accent); border: 1px solid rgba(59,130,246,.3); }
        .btn-run:hover { background: rgba(59,130,246,.25); }
        .btn-submit { background: var(--success); color: white; }
        .btn-submit:hover { background: #16a34a; }
        .hint-box { background: rgba(245,158,11,.08); border: 1px solid rgba(245,158,11,.25);
                    border-radius: 8px; padding: 12px 16px; margin-top: 12px; font-size: 14px;
                    color: var(--warning); animation: slideDown .2s ease; }
        .hint-box strong { color: var(--text); }
        .completion-banner { background: rgba(34,197,94,.1); border: 2px solid var(--success);
                             border-radius: 12px; padding: 24px; text-align: center; margin-top: 16px;
                             animation: slideDown .3s ease; }
        .completion-banner h3 { color: var(--success); font-size: 22px; margin-bottom: 8px; }
        .xp-earned { font-size: 36px; font-weight: 700; color: var(--warning); }
        .section-label { font-size: 12px; color: var(--text-dim); text-transform: uppercase;
                         letter-spacing: 1px; margin-bottom: 8px; }
        /* Beginner-friendly intro panels */
        .intro-panel { background: linear-gradient(135deg, rgba(59,130,246,.08), rgba(139,92,246,.08));
                       border: 1px solid rgba(59,130,246,.2); border-radius: 12px;
                       padding: 20px 24px; margin-bottom: 24px; }
        .intro-panel h2 { color: var(--text); font-size: 18px; margin: 0 0 8px 0; }
        .intro-panel p { color: var(--text-dim); font-size: 14px; margin: 0; line-height: 1.6; }
        .intro-panel .intro-icon { font-size: 28px; margin-bottom: 8px; }
        .intro-steps { display: flex; gap: 16px; margin-top: 16px; flex-wrap: wrap; }
        .intro-step { background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
                      padding: 12px 16px; flex: 1; min-width: 140px; text-align: center; }
        .intro-step .step-num { display: inline-block; width: 24px; height: 24px; border-radius: 50%;
                                background: var(--accent); color: white; font-size: 12px; font-weight: 700;
                                line-height: 24px; margin-bottom: 6px; }
        .intro-step .step-text { font-size: 12px; color: var(--text-dim); }
        /* Agent cards */
        .agent-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
        .agent-card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
                      padding: 16px; position: relative; }
        .agent-card .agent-name { font-size: 16px; font-weight: 600; margin-bottom: 4px; }
        .agent-card .agent-role { font-size: 13px; color: var(--text-dim); margin-bottom: 8px; }
        .agent-card .agent-meta { display: flex; gap: 8px; font-size: 11px; }
        .agent-status { position: absolute; top: 16px; right: 16px; width: 10px; height: 10px;
                        border-radius: 50%; }
        .agent-status.active { background: var(--success); box-shadow: 0 0 6px rgba(34,197,94,.5); }
        .agent-status.standby { background: var(--warning); box-shadow: 0 0 6px rgba(245,158,11,.5); }
        /* Pulse animation for active agents */
        @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .5; } }
        .agent-status.active { animation: pulse 2s ease-in-out infinite; }
        /* Info callout */
        .info-callout { background: rgba(59,130,246,.06); border: 1px solid rgba(59,130,246,.2);
                        border-radius: 8px; padding: 12px 16px; margin-bottom: 16px; font-size: 13px;
                        color: var(--text-dim); }
        .info-callout strong { color: var(--accent); }
        @media (max-width: 768px) {
            .stat-grid { grid-template-columns: repeat(2, 1fr); }
            nav { flex-wrap: wrap; }
            .container { padding: 16px; }
            .workspace-body { grid-template-columns: 1fr; }
        }
        @media (max-width: 480px) {
            .stat-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <nav>
        <a href="/" class="brand">Spark<span>Pilot</span></a>
        <a href="/" class="{% if request.path == '/' %}active{% endif %}">Home</a>
        <a href="/missions" class="{% if request.path == '/missions' %}active{% endif %}">Missions</a>
        <a href="/simulator" class="{% if request.path == '/simulator' %}active{% endif %}">Simulator</a>
        <a href="/devices" class="{% if request.path == '/devices' %}active{% endif %}">Fleet</a>
        <a href="/firmware" class="{% if request.path == '/firmware' %}active{% endif %}">Firmware</a>
        <a href="/edge-ai" class="{% if request.path == '/edge-ai' %}active{% endif %}">Edge AI</a>
        <a href="/crashes" class="{% if request.path == '/crashes' %}active{% endif %}">Self-Heal</a>
        <a href="/agents" class="{% if request.path == '/agents' %}active{% endif %}">AI Agents</a>
    </nav>
    <div class="container">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
