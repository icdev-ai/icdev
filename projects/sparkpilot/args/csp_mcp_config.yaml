# CSP MCP Configuration for sparkpilot
provider: aws
region: us-gov-west-1
govcloud: false
mcp_servers:
  - name: "@aws/core-mcp-server"
    category: "core"
    transport: stdio
  - name: "@aws/aws-api-mcp-server"
    category: "core"
    transport: stdio
  - name: "@aws/cdk-mcp-server"
    category: "iac"
    transport: stdio
  - name: "@aws/terraform-mcp-server"
    category: "iac"
    transport: stdio
  - name: "@aws/cloudformation-mcp-server"
    category: "iac"
    transport: stdio
  - name: "@aws/iam-mcp-server"
    category: "security"
    transport: stdio
  - name: "@aws/well-architected-security-mcp-server"
    category: "security"
    transport: stdio
  - name: "@aws/cloudwatch-mcp-server"
    category: "monitoring"
    transport: stdio
  - name: "@aws/cloudtrail-mcp-server"
    category: "monitoring"
    transport: stdio
  - name: "@aws/cost-explorer-mcp-server"
    category: "monitoring"
    transport: stdio
  - name: "@aws/aws-documentation-mcp-server"
    category: "docs"
    transport: stdio
  - name: "@aws/aws-knowledge-mcp-server"
    category: "docs"
    transport: stdio
