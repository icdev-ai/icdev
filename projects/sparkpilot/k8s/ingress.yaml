# [TEMPLATE: CUI // SP-CTI]
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sparkpilot-dashboard
  namespace: sparkpilot
  labels:
    app.kubernetes.io/part-of: sparkpilot
    classification: CUI
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
spec:
  tls:
    - hosts:
        - sparkpilot.internal
      secretName: sparkpilot-tls
  rules:
    - host: sparkpilot.internal
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: sparkpilot-dashboard
                port:
                  number: 5000
