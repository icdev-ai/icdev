# NINJAFLOW_AI Kubernetes RBAC — Least-Privilege Service Accounts
# Namespace: ninjaflow_ai
#
# Architecture:
#   - ninjaflow_ai-agent-role          — Baseline read-only for domain/support agents
#   - ninjaflow_ai-orchestrator-role   — Elevated: pod/job management for agent lifecycle
#   - ninjaflow_ai-infrastructure-role — Elevated: deployment/networking for IaC operations
#   - Per-agent ServiceAccounts with appropriate RoleBindings
#
# Usage:
#   kubectl apply -f k8s/rbac.yaml
#
# Generate a custom RBAC for your module set:
#   python tools/installer/platform_setup.py --generate k8s-rbac --modules core,builder

# ======================================================================
# Roles
# ======================================================================

# Baseline agent role — read-only pods/services/configmaps, get secrets, create events
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ninjaflow_ai-agent-role
  namespace: ninjaflow_ai
  labels:
    app.kubernetes.io/part-of: ninjaflow_ai
rules:
  - apiGroups: [""]
    resources: [pods, services, endpoints]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get]
  - apiGroups: [""]
    resources: [events]
    verbs: [create, patch]

---
# Orchestrator role — needs pod/job management for agent lifecycle and workflow execution
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ninjaflow_ai-orchestrator-role
  namespace: ninjaflow_ai
  labels:
    app.kubernetes.io/part-of: ninjaflow_ai
rules:
  - apiGroups: [""]
    resources: [pods, services, endpoints, configmaps]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, list]
  - apiGroups: [""]
    resources: [events]
    verbs: [create, patch]
  - apiGroups: [apps]
    resources: [deployments, replicasets]
    verbs: [get, list, watch, update, patch]
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [get, list, watch, create, delete]

---
# Infrastructure agent role — needs broader access for Terraform/Ansible/K8s IaC operations
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ninjaflow_ai-infrastructure-role
  namespace: ninjaflow_ai
  labels:
    app.kubernetes.io/part-of: ninjaflow_ai
rules:
  - apiGroups: [""]
    resources: [pods, services, endpoints, configmaps, persistentvolumeclaims]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, list]
  - apiGroups: [""]
    resources: [events]
    verbs: [create, patch]
  - apiGroups: [apps]
    resources: [deployments, statefulsets, replicasets]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [networking.k8s.io]
    resources: [networkpolicies, ingresses]
    verbs: [get, list, watch, create, update, patch]

