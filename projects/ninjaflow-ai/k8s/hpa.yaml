# [TEMPLATE: CUI // SP-CTI]
# NINJAFLOW_AI Horizontal Pod Autoscaler Manifests
# D141: CPU/memory baseline; custom metrics Phase 2
# Driven by args/scaling_config.yaml profiles
# Cloud-agnostic — requires Metrics Server on any K8s distribution

# ======================================================================
# Core Tier — Orchestrator (min=2, max=6, CPU 60%, Mem 70%)
# ======================================================================
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ninjaflow_ai-orchestrator-hpa
  namespace: ninjaflow_ai
  labels:
    app.kubernetes.io/name: orchestrator
    app.kubernetes.io/part-of: ninjaflow_ai
    classification: CUI
    ninjaflow_ai.io/scaling-tier: core
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ninjaflow_ai-orchestrator
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Percent
          value: 100
          periodSeconds: 60
        - type: Pods
          value: 4
          periodSeconds: 60
      selectPolicy: Max
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 25
          periodSeconds: 60
---
