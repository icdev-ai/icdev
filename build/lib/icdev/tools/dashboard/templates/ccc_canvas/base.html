{% extends "base.html" %}
{% block extra_head %}
<style>
/* ── CCC shared styles ───────────────────────────────────────────────── */
.ccc-stat { background:#1e293b; border:1px solid #334155; border-radius:8px; padding:16px; text-align:center; }
.ccc-stat .val { font-size:2rem; font-weight:700; color:#f8fafc; line-height:1.1; }
.ccc-stat .lbl { font-size:.72rem; color:#64748b; margin-top:4px; text-transform:uppercase; letter-spacing:.04em; }

.ccc-header { background:linear-gradient(135deg,#0f172a 0%,#162032 40%,#0c1a1a 100%);
              padding:24px 28px 20px; border-radius:12px; margin-bottom:24px;
              border-left:4px solid #38bdf8; }
.ccc-header h1 { margin:0; font-size:1.5rem; font-weight:700; color:#bae6fd; }
.ccc-header .sub { margin:5px 0 0; color:#7dd3fc; font-size:.85rem; }

.ccc-subnav { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:22px; }
.ccc-subnav a { padding:6px 14px; border-radius:8px; font-size:.8rem; font-weight:600;
                text-decoration:none; background:#0f172a; border:1px solid #334155; color:#94a3b8; }
.ccc-subnav a:hover, .ccc-subnav a.active { border-color:#38bdf8; color:#38bdf8; }

/* Status badges */
.badge-active        { background:#dcfce7; color:#166534; }
.badge-pending       { background:#fef9c3; color:#854d0e; }
.badge-maintenance   { background:#dbeafe; color:#1d4ed8; }
.badge-decommissioned{ background:#f3f4f6; color:#374151; }
.badge-test          { background:#e0f2fe; color:#075985; }
.badge-pending_loa   { background:#fef9c3; color:#854d0e; }
.badge-installing    { background:#dbeafe; color:#1d4ed8; }
.badge-suspended     { background:#fee2e2; color:#991b1b; }
.badge-draft         { background:#fef9c3; color:#854d0e; }
.badge-submitted     { background:#dbeafe; color:#1d4ed8; }
.badge-approved      { background:#dcfce7; color:#166534; }
.badge-expired       { background:#fee2e2; color:#991b1b; }
.badge-completed     { background:#f3f4f6; color:#374151; }
.badge-rejected      { background:#fee2e2; color:#991b1b; }
.badge-operational   { background:#dcfce7; color:#166534; }
.badge-degraded      { background:#fee2e2; color:#991b1b; }
.badge-dark          { background:#1e293b; color:#94a3b8; border:1px solid #334155; }

/* Utilization bars */
.util-bar { height:6px; border-radius:3px; background:#1e293b; }
.util-bar-fill { height:100%; border-radius:3px; }
.util-ok   { background:#22c55e; }
.util-warn { background:#f59e0b; }
.util-crit { background:#ef4444; }

/* CCC table */
.ccc-table { width:100%; font-size:.83rem; }
.ccc-table th { color:#64748b; font-weight:600; text-transform:uppercase; font-size:.72rem;
                letter-spacing:.04em; padding:8px 12px; border-bottom:1px solid #334155; }
.ccc-table td { padding:10px 12px; border-bottom:1px solid #1e293b; vertical-align:middle; }
.ccc-table tr:last-child td { border-bottom:none; }
.ccc-table tr:hover td { background:#1e293b44; }

.iqe-host { margin-top:32px; }
</style>
{% endblock %}
{% block content %}{% endblock %}
