{% extends "base.html" %}
{% block title %}Peers — PMC{% endblock %}
{% block extra_head %}
<style>
.pmc-badge { display:inline-block; padding:2px 8px; border-radius:4px; font-size:11px; font-weight:600; }
.badge-active { background:#dcfce7; color:#166534; }
.badge-evaluation { background:#e0f2fe; color:#075985; }
.badge-requested { background:#fef9c3; color:#854d0e; }
.badge-suspended { background:#fee2e2; color:#991b1b; }
.badge-closed { background:#f3f4f6; color:#374151; }
.badge-open { background:#dcfce7; color:#166534; }
.badge-selective { background:#fef9c3; color:#854d0e; }
.badge-no { background:#fee2e2; color:#991b1b; }
</style>
{% endblock %}
{% block content %}
<div class="container-fluid px-4 py-3">
  <div class="d-flex align-items-center justify-content-between mb-3">
    <h4 class="mb-0" style="color:#38bdf8;"><i class="bi bi-people-fill me-2"></i>BGP Peers</h4>
    <div class="d-flex gap-2">
      <button class="btn btn-sm btn-outline-success" onclick="openAddPeerModal()">+ Add Peer</button>
      <button class="btn btn-sm btn-outline-info" onclick="openSyncModal()">⟳ Sync PeeringDB</button>
    </div>
  </div>

  <!-- Filters -->
  <div class="d-flex gap-2 mb-3 flex-wrap">
    <select class="form-select form-select-sm bg-dark text-white border-secondary" id="filter-status" style="width:auto;" onchange="applyFilters()">
      <option value="">All Statuses</option>
      <option value="active">Active</option>
      <option value="evaluation">Evaluation</option>
      <option value="requested">Requested</option>
      <option value="suspended">Suspended</option>
    </select>
    <select class="form-select form-select-sm bg-dark text-white border-secondary" id="filter-type" style="width:auto;" onchange="applyFilters()">
      <option value="">All Types</option>
      <option value="public">Public</option>
      <option value="private">Private</option>
      <option value="transit">Transit</option>
      <option value="customer">Customer</option>
    </select>
    <input type="text" class="form-control form-control-sm bg-dark text-white border-secondary" id="filter-search" placeholder="Search org/ASN..." style="width:200px;" oninput="applyFilters()">
  </div>

  <div class="table-responsive">
    <table class="table table-dark table-hover table-sm" id="peers-table">
      <thead><tr>
        <th>ASN</th><th>Organization</th><th>Type</th><th>Policy</th>
        <th>Status</th><th>v4 Pfx</th><th>v6 Pfx</th><th>RIR</th><th>Actions</th>
      </tr></thead>
      <tbody id="peers-tbody"></tbody>
    </table>
  </div>

  <!-- Add Peer Modal -->
  <div class="modal fade" id="addPeerModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
      <div class="modal-content bg-dark border-secondary">
        <div class="modal-header border-secondary">
          <h5 class="modal-title">Add BGP Peer</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div class="row g-3">
            <div class="col-md-6">
              <label class="form-label">ASN *</label>
              <div class="input-group">
                <input type="number" class="form-control bg-dark text-white border-secondary" id="peer-asn" placeholder="64512">
                <button class="btn btn-outline-info" onclick="lookupPeeringDB()">Lookup</button>
              </div>
            </div>
            <div class="col-md-6">
              <label class="form-label">Organization</label>
              <input type="text" class="form-control bg-dark text-white border-secondary" id="peer-org">
            </div>
            <div class="col-md-4">
              <label class="form-label">Type</label>
              <select class="form-select bg-dark text-white border-secondary" id="peer-type">
                <option value="public">Public</option>
                <option value="private">Private</option>
                <option value="transit">Transit</option>
                <option value="customer">Customer</option>
              </select>
            </div>
            <div class="col-md-4">
              <label class="form-label">Policy</label>
              <select class="form-select bg-dark text-white border-secondary" id="peer-policy">
                <option value="selective">Selective</option>
                <option value="open">Open</option>
                <option value="no">No Peering</option>
              </select>
            </div>
            <div class="col-md-4">
              <label class="form-label">RIR</label>
              <select class="form-select bg-dark text-white border-secondary" id="peer-rir">
                <option>ARIN</option><option>RIPE</option><option>APNIC</option>
                <option>LACNIC</option><option>AFRINIC</option>
              </select>
            </div>
            <div class="col-md-6">
              <label class="form-label">NOC Email</label>
              <input type="email" class="form-control bg-dark text-white border-secondary" id="peer-noc-email">
            </div>
            <div class="col-md-6">
              <label class="form-label">IRR AS-SET</label>
              <input type="text" class="form-control bg-dark text-white border-secondary" id="peer-irr-as-set" placeholder="AS64512:AS-CUSTOMERS">
            </div>
          </div>
        </div>
        <div class="modal-footer border-secondary">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="button" class="btn btn-success" onclick="submitAddPeer()">Add Peer</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Sync Modal -->
  <div class="modal fade" id="syncModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content bg-dark border-secondary">
        <div class="modal-header border-secondary">
          <h5 class="modal-title">Sync from PeeringDB</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <label class="form-label">ASN to sync</label>
          <input type="number" class="form-control bg-dark text-white border-secondary" id="sync-asn" placeholder="64512">
          <div id="sync-result" class="mt-2"></div>
        </div>
        <div class="modal-footer border-secondary">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
          <button type="button" class="btn btn-info" onclick="syncASN()">Sync</button>
        </div>
      </div>
    </div>
  </div>

  {% include 'includes/iqe_query_widget.html' %}
</div>

<script>
const IQE_CANVAS = 'pmc';
const IQE_COLLECTION = 'pmc.peers';
let allPeers = [];
let partnerAsnMap = {};  // asn → partner_id

fetch('/api/partners').then(r=>r.json()).then(partners=>{
  if (!Array.isArray(partners)) return;
  partners.forEach(p => { if (p.asn) partnerAsnMap[p.asn] = p.id; });
}).catch(()=>{});

const STATUS_COLORS = {active:'badge-active',evaluation:'badge-evaluation',requested:'badge-requested',
  suspended:'badge-suspended',closed:'badge-closed'};
const POLICY_COLORS = {open:'badge-open',selective:'badge-selective',no:'badge-no'};

function badge(val, map) {
  const cls = map[val] || 'badge-unknown';
  return `<span class="pmc-badge ${cls}">${val}</span>`;
}

function loadPeers() {
  fetch('/api/pmc/peers').then(r=>r.json()).then(d=>{
    allPeers = Array.isArray(d) ? d : (d.peers || []);
    renderPeers(allPeers);
  }).catch(()=>{});
}

function renderPeers(peers) {
  const tbody = document.getElementById('peers-tbody');
  tbody.innerHTML = '';
  peers.forEach(p => {
    const tr = document.createElement('tr');
    tr.style.cursor = 'pointer';
    tr.onclick = () => window.location = `/pmc/peers/${p.id}`;
    tr.innerHTML = `
      <td><strong>AS${p.asn}</strong></td>
      <td>${p.org_name||'–'}</td>
      <td>${p.peer_type||'–'}</td>
      <td>${badge(p.policy||'selective', POLICY_COLORS)}</td>
      <td>${badge(p.status||'evaluation', STATUS_COLORS)}</td>
      <td>${p.ipv4_prefix_count||0}</td>
      <td>${p.ipv6_prefix_count||0}</td>
      <td>${p.rir||'–'}</td>
      <td>
        <button class="btn btn-xs btn-outline-info btn-sm py-0 px-1" onclick="event.stopPropagation();evaluatePeer('${p.id}','${p.asn}')">Evaluate</button>
        <button class="btn btn-xs btn-outline-warning btn-sm py-0 px-1" onclick="event.stopPropagation();syncPeer('${p.id}','${p.asn}')">Sync</button>
        ${partnerAsnMap[p.asn] ? `<a class="btn btn-xs btn-outline-success btn-sm py-0 px-1" href="/network/partners" onclick="event.stopPropagation()" title="View in Partner Registry">Partner</a>` : ''}
      </td>`;
    tbody.appendChild(tr);
  });
}

function applyFilters() {
  const status = document.getElementById('filter-status').value;
  const type = document.getElementById('filter-type').value;
  const search = document.getElementById('filter-search').value.toLowerCase();
  renderPeers(allPeers.filter(p =>
    (!status || p.status === status) &&
    (!type || p.peer_type === type) &&
    (!search || String(p.asn).includes(search) || (p.org_name||'').toLowerCase().includes(search))
  ));
}

function openAddPeerModal() { new bootstrap.Modal(document.getElementById('addPeerModal')).show(); }
function openSyncModal() { new bootstrap.Modal(document.getElementById('syncModal')).show(); }

function lookupPeeringDB() {
  const asn = document.getElementById('peer-asn').value;
  if (!asn) return;
  fetch(`/api/pmc/peers/lookup?asn=${asn}`).then(r=>r.json()).then(d=>{
    if (d.org_name) document.getElementById('peer-org').value = d.org_name;
    if (d.noc_email) document.getElementById('peer-noc-email').value = d.noc_email;
    if (d.irr_as_set) document.getElementById('peer-irr-as-set').value = d.irr_as_set;
    if (d.rir) document.getElementById('peer-rir').value = d.rir;
  }).catch(()=>{});
}

function submitAddPeer() {
  const body = {
    asn: parseInt(document.getElementById('peer-asn').value),
    org_name: document.getElementById('peer-org').value,
    peer_type: document.getElementById('peer-type').value,
    policy: document.getElementById('peer-policy').value,
    rir: document.getElementById('peer-rir').value,
    noc_email: document.getElementById('peer-noc-email').value,
    irr_as_set: document.getElementById('peer-irr-as-set').value,
  };
  fetch('/api/pmc/peers', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)})
    .then(r=>r.json()).then(()=>{ bootstrap.Modal.getInstance(document.getElementById('addPeerModal')).hide(); loadPeers(); })
    .catch(()=>{});
}

function syncPeer(id, asn) {
  fetch(`/api/pmc/peers/${id}/sync`, {method:'POST'}).then(()=>loadPeers()).catch(()=>{});
}

function evaluatePeer(id, asn) {
  fetch(`/api/pmc/peers/${id}/evaluate`, {method:'POST'})
    .then(r=>r.json())
    .then(d=>alert(`AS${asn} Recommendation: ${d.recommendation?.toUpperCase()} (Score: ${(d.score*100).toFixed(0)}%)\n${d.reasons?.join('\n') || ''}`))
    .catch(()=>{});
}

function syncASN() {
  const asn = document.getElementById('sync-asn').value;
  if (!asn) return;
  document.getElementById('sync-result').innerHTML = '<span class="text-info">Syncing…</span>';
  fetch(`/api/pmc/peers/sync-asn`, {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({asn:parseInt(asn)})})
    .then(r=>r.json())
    .then(d=>{ document.getElementById('sync-result').innerHTML = `<span class="text-success">Synced AS${d.asn}: ${d.org_name}</span>`; loadPeers(); })
    .catch(e=>{ document.getElementById('sync-result').innerHTML = '<span class="text-danger">Sync failed</span>'; });
}

loadPeers();
</script>
{% endblock %}
