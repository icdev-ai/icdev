# context/migration/projects/analytics-k8s-aws.yaml
# Demo migration project definition — read by cam_seed_demo.py
# Do NOT hardcode project data in Python; add future projects as new YAML files here.

id: proj-analytics-k8s-aws
name: "Analytics Platform — K8s to AWS Cloud Native"
customer: "Demo Customer"
owner: "cloud-ops"
status: active
classification: CUI
impact_level: IL4
description: >
  Migrate a 3-tier analytics application from on-premises Kubernetes to AWS cloud-native.
  Backend: Oracle 19c + Redis 7 + Elasticsearch 8 + Apache NiFi. Frontend: React 18.
  Target: Aurora PostgreSQL + ElastiCache + OpenSearch + Glue/MSK + Amplify.
  AI modernization: pgvector, Bedrock KB, semantic caching, Bedrock Data Automation, Bedrock Agents.

source_stack:
  - tech: oracle
    version: "19c"
    platform: kubernetes
  - tech: redis
    version: "7.2"
    platform: kubernetes
  - tech: elasticsearch
    version: "8.11"
    platform: kubernetes
  - tech: nifi
    version: "1.25"
    platform: kubernetes
  - tech: react
    version: "18.3"
    platform: kubernetes
  - tech: kubernetes
    version: "1.28"
    platform: on-premises

phases:
  - phase_num: 1
    title: "Assessment & Discovery"
    description: >
      Inventory all K8s workloads (kubectl get all -A), PVCs, ConfigMaps, and Secrets.
      Run AWS Application Discovery Service agent on K8s nodes.
      Execute Oracle SCT Pre-Assessment. Catalog all NiFi flows.
      Classify each component with 7R strategy. Document as-is architecture.
    duration_days: 7
    wave_num: 0
    maintenance_window: "Business hours"
    rollback_criteria: "N/A — read-only phase"
    sop_keywords:
      - ["oracle aurora sct", "sct pre-assessment"]
      - ["k8s secrets", "secrets manager migration"]

  - phase_num: 2
    title: "Foundation & AWS Landing Zone"
    description: >
      AWS Control Tower landing zone setup. VPC with public/private subnets across 3 AZs.
      AWS Direct Connect or Site-to-Site VPN to K8s cluster for hybrid connectivity.
      IAM baseline: permission boundaries, SCPs, IAM roles.
      Migrate K8s Secrets to AWS Secrets Manager using CSI driver.
    duration_days: 10
    wave_num: 1
    maintenance_window: "Business hours"
    rollback_criteria: "Remove all AWS resources provisioned in this phase if foundation fails validation"
    sop_keywords:
      - ["k8s secrets", "secrets manager migration"]

  - phase_num: 3
    title: "Data Tier Migration"
    description: >
      Oracle → Aurora PostgreSQL: SCT schema conversion + DMS full-load + CDC.
      Redis → ElastiCache: DUMP/RESTORE migration with connection string update.
      Aurora pgvector extension setup for AI semantic search foundation.
      Run parallel validation: compare row counts and spot queries between source and target.
    duration_days: 21
    wave_num: 1
    maintenance_window: "0200-0600 EST (DMS cutover)"
    rollback_criteria: "Revert connection strings to K8s Oracle/Redis if validation fails; DMS CDC allows rollback within 2h"
    sop_keywords:
      - ["oracle aurora sct pre-assessment", "sct"]
      - ["aws dms full-load cdc", "dms replication"]
      - ["aurora postgresql cluster provisioning", "aurora"]
      - ["dump/restore", "redis elasticache"]
      - ["aurora pgvector semantic search", "pgvector"]

  - phase_num: 4
    title: "Integration Tier Migration"
    description: >
      Elasticsearch → OpenSearch: S3 snapshot/restore + index template + alias migration.
      NiFi batch flows → AWS Glue ETL jobs. NiFi real-time flows → Amazon MSK + Glue Streaming.
      EventBridge Scheduler replaces NiFi cron processors.
      Bedrock Knowledge Base setup on OpenSearch for semantic search.
    duration_days: 14
    wave_num: 2
    maintenance_window: "0200-0600 EST (OpenSearch cutover)"
    rollback_criteria: "Repoint application endpoint to K8s ES/NiFi if OpenSearch/Glue validation fails"
    sop_keywords:
      - ["snapshot/restore", "opensearch snapshot"]
      - ["index template", "opensearch alias migration"]
      - ["nifi flow inventory", "glue job conversion"]
      - ["msk kafka", "msk setup"]
      - ["glue streaming", "streaming nifi"]
      - ["bedrock knowledge base", "bedrock kb opensearch"]

  - phase_num: 5
    title: "Application Tier Migration"
    description: >
      React → AWS Amplify: build pipeline migration + CloudFront distribution + custom domain.
      Remaining K8s workloads (APIs, batch jobs) → EKS Fargate.
      K8s RBAC → EKS IRSA (IAM Roles for Service Accounts).
      ElastiCache semantic cache with Bedrock embeddings deployed.
    duration_days: 10
    wave_num: 2
    maintenance_window: "Business hours (rolling deploy)"
    rollback_criteria: "Revert DNS to K8s ingress if Amplify/EKS validation fails; 15-minute rollback window"
    sop_keywords:
      - ["amplify build pipeline", "react amplify"]
      - ["eks fargate", "k8s eks"]
      - ["kubernetes namespace", "k8s namespace iam"]
      - ["semantic cache", "elasticache semantic"]

  - phase_num: 6
    title: "AI Modernization"
    description: >
      pgvector semantic search layer in Aurora: embed existing rows + HNSW index.
      Bedrock Inline Agents integrated into React frontend for AI-powered UX.
      Bedrock Data Automation for intelligent NiFi-to-Glue pipeline enrichment.
      Amazon Q Developer activated for codebase modernization recommendations.
    duration_days: 14
    wave_num: 3
    maintenance_window: "Business hours"
    rollback_criteria: "Disable AI features via feature flag; revert to keyword search / direct API calls"
    sop_keywords:
      - ["aurora pgvector semantic search", "pgvector"]
      - ["bedrock knowledge base opensearch", "bedrock kb"]
      - ["elasticache semantic cache bedrock", "semantic cache"]

  - phase_num: 7
    title: "Validation & Cutover"
    description: >
      Performance benchmark: compare p50/p99 latency before/after across all tiers.
      Security posture: AWS Security Hub, GuardDuty, Macie enabled and baseline established.
      Observability: CloudWatch dashboards, X-Ray tracing, OpenSearch Dashboards migrated.
      DNS cutover: Route53 weighted routing 10% → 50% → 100% with 30-minute stability windows.
      K8s decommission ticket filed after 48h stability confirmation.
    duration_days: 7
    wave_num: 3
    maintenance_window: "0200-0600 EST (DNS cutover)"
    rollback_criteria: "Route53 weight 0% to AWS target if error rate > 0.1% during canary; DMS CDC remains active for 48h post-cutover"
    sop_keywords:
      - ["dns swap", "blue/green validation"]

ai_opportunities:
  - component: oracle
    opportunity_title: "Natural Language Queries with Bedrock text-to-SQL"
    aws_ai_service: bedrock-claude
    benefit_category: nlq
    effort_days: 15
    notes: "Use Claude on Bedrock to convert plain-English queries to Aurora PostgreSQL SQL"

  - component: elasticsearch
    opportunity_title: "Semantic RAG Search via Bedrock Knowledge Bases"
    aws_ai_service: bedrock-kb
    benefit_category: search
    effort_days: 14
    notes: "Replace keyword search with Bedrock RetrieveAndGenerate using OpenSearch as vector store"

  - component: redis
    opportunity_title: "Semantic Caching — Reduce LLM Costs"
    aws_ai_service: semantic-cache
    benefit_category: caching
    effort_days: 8
    notes: "Cache semantically similar LLM queries in ElastiCache to reduce Bedrock API spend by 30-40%"

  - component: nifi
    opportunity_title: "AI-Driven Pipeline Enrichment with Bedrock Data Automation"
    aws_ai_service: bedrock-data-automation
    benefit_category: pipeline
    effort_days: 20
    notes: "Use Bedrock Data Automation to extract structured data from unstructured pipeline payloads (PDFs, images)"

  - component: react
    opportunity_title: "Bedrock Inline Agents for AI-Powered UX"
    aws_ai_service: bedrock-agents
    benefit_category: ux
    effort_days: 21
    notes: "Add natural language search, smart form completion, and AI assistant to React frontend via Bedrock Agents"

cross_canvas:
  ddc:
    design_name: "Oracle → Aurora Aurora Migration Schema"
    description: "Data lineage design: Oracle source tables → DMS replication → Aurora PostgreSQL target"
  idc:
    design_name: "K8s → EKS Fargate Migration Infrastructure"
    description: "Infrastructure design: on-prem K8s cluster → EKS Fargate + ALB + EFS + Secrets Manager"
  ndc:
    topology_name: "AWS Landing Zone — Analytics VPC"
    description: "AWS VPC: 3 AZs, public/private subnets, IGW, NAT, Transit Gateway, Direct Connect"
