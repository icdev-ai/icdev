# CUI // SP-CTI
# LLM Judge Rubric: Blog Articles (Pulse)
# Prometheus-2 evaluates these 5 dimensions using anchored 1-5 scoring.

name: "Blog Article"
content_type: blog
description: "Evaluates Pulse blog posts for engagement, accuracy, specificity, completeness, and originality."

dimensions:
  engagement:
    weight: 0.25
    description: "Does the article hook the reader and maintain interest throughout?"
    anchors:
      1: "Generic, boring opening. No narrative arc. Reader would stop after first paragraph."
      2: "Weak hook. Some interesting points but mostly flat prose. Loses reader mid-article."
      3: "Adequate hook. Maintains moderate interest. Standard blog structure without surprises."
      4: "Strong opening with concrete scenario. Good flow. Reader motivated to finish."
      5: "Compelling hook, vivid examples, narrative tension. Reader eager to share this article."

  accuracy:
    weight: 0.25
    description: "Are technical claims, statistics, and tool references factually correct?"
    anchors:
      1: "Multiple factual errors. Misuses technical terms. Makes unsupported claims."
      2: "Some inaccuracies. Vague references. Statistics without sources."
      3: "Generally accurate. Minor imprecisions. Most claims supported."
      4: "Accurate technical content. Specific tool references. Claims well-supported."
      5: "Deeply accurate. Expert-level precision. All claims sourced or self-evident."

  specificity:
    weight: 0.20
    description: "Does the article provide concrete examples, CLI commands, and actionable details?"
    anchors:
      1: "All abstract. No examples, no commands, no concrete details."
      2: "Mostly abstract with occasional vague examples."
      3: "Mix of abstract and concrete. Some examples but could be more specific."
      4: "Predominantly specific. CLI examples, configuration snippets, real scenarios."
      5: "Highly specific throughout. Copy-paste commands, step-by-step guidance, metrics."

  completeness:
    weight: 0.15
    description: "Does the article fully cover the topic without obvious gaps?"
    anchors:
      1: "Major sections missing. Topic barely touched."
      2: "Significant gaps. Key aspects of the topic unaddressed."
      3: "Core topic covered. Some supporting areas missing."
      4: "Thorough coverage. Minor areas could be expanded."
      5: "Comprehensive. All aspects covered with depth. No obvious gaps."

  originality:
    weight: 0.15
    description: "Does the article offer fresh perspective or just rehash common knowledge?"
    anchors:
      1: "Pure rehash. Nothing a Google search wouldn't find."
      2: "Mostly common knowledge with minimal new perspective."
      3: "Some original insights mixed with standard content."
      4: "Fresh angle. Novel examples or framing. Adds to the discourse."
      5: "Genuinely original perspective. Unique data, surprising insights, expert voice."

few_shot_examples:
  - score: 2
    excerpt: "In today's fast-paced world, compliance is important. Organizations need to be compliant."
    reasoning: "Generic filler phrase, no concrete details, no examples, no actionable advice."
  - score: 4
    excerpt: "When a federal agency deployed ICDEV™'s crosswalk engine, implementing AC-2 automatically populated FedRAMP, CMMC, and 800-171 — cutting their multi-framework assessment from 6 months to 3 weeks."
    reasoning: "Specific example, named tool, concrete metric (6mo→3wk), addresses real pain point."
