ingestion:
  upload_dir: tools/voc/uploads/
  supported_types: [txt, md, pdf, docx]

extraction:
  job_statement_keywords:
    - "when I"
    - "I want"
    - "so that"
    - "need to"
    - "frustrated by"
    - "unable to"
    - "wish it could"
    - "pain point"
    - "issue"
    - "bug"

scoring:
  frequency_weight: 0.40
  severity_weight: 0.35
  strategic_fit_weight: 0.25
  auto_signal_threshold: 0.65

scheduling:
  quiet_hours:
    enabled: true
    start: "22:00"
    end: "06:00"
