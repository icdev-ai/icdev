# CUI // SP-CTI
# FORGE IGNITE — Innovation Feasibility Scoring Configuration
# Weights, phase thresholds, and pipeline stage definitions.
# Edit here to tune scoring — no code changes required.

scoring:
  dimensions:
    business_value:
      weight: 0.25
      label: "Business Value"
      description: "Revenue impact, cost savings, time saved per user per week"
    strategic_alignment:
      weight: 0.20
      label: "Strategic Alignment"
      description: "Maps to org AI-first goals and modernization phases"
    technical_feasibility:
      weight: 0.20
      label: "Technical Feasibility"
      description: "Team skill readiness (pulls from Academy cohort data), infrastructure readiness"
    data_readiness:
      weight: 0.15
      label: "Data Readiness"
      description: "Data exists, is accessible, and is clean enough to use"
    time_to_value:
      weight: 0.15
      label: "Time to Value"
      description: "Realistic pilot in ≤4 weeks? Results measurable in ≤8 weeks?"
    risk:
      weight: 0.05
      label: "Risk"
      description: "Security, compliance, operational, reversibility (inverted)"
      inverted: true

  # Composite: (weighted_sum) × (1 - risk × 0.05)
  risk_penalty_factor: 0.05

phase_thresholds:
  phase1_quick_win:
    label: "Phase 1 — Quick Win"
    emoji: "🟢"
    min_score: 70
    min_time_to_value: 8
    max_risk: 3
    description: "Can deliver measurable value within 2-4 weeks without rearchitecting"
  phase2_augmentation:
    label: "Phase 2 — Augmentation"
    emoji: "🟡"
    min_score: 50
    description: "AI as a copilot; human stays in the loop; moderate complexity"
  phase3_transformation:
    label: "Phase 3 — Transformation"
    emoji: "🔴"
    min_score: 0
    description: "AI-native workflows; some rearchitecture required; foundation work first"
  deferred:
    label: "Deferred"
    emoji: "⚪"
    description: "Data not ready or team skills gap blocks pilot"
    triggers:
      - data_readiness_below: 3
      - technical_feasibility_below: 3

pipeline_stages:
  - id: spark
    label: "Spark"
    color: "#FFB800"
    description: "Idea submitted and intake questions answered"
    next: assess
  - id: assess
    label: "Assess"
    color: "#4A90E2"
    description: "Feasibility study generated and under human review"
    next: score
  - id: score
    label: "Scored"
    color: "#00D4FF"
    description: "Scoring complete; idea ranked in prioritization queue"
    next: pilot
  - id: pilot
    label: "Pilot"
    color: "#00FF88"
    description: "Approved; Kanban task group created; experiment running"
    next: measure
  - id: measure
    label: "Measure"
    color: "#9b59b6"
    description: "Pilot complete; results being measured vs hypothesis"
    next: scale
  - id: scale
    label: "Scaled"
    color: "#FF6B35"
    description: "Results validated; initiative registered in roadmap"
    terminal: true
  - id: archive
    label: "Archived"
    color: "#555555"
    description: "Lessons learned captured; idea closed"
    terminal: true

intake:
  rounds:
    - id: basic
      label: "Your Idea"
      questions:
        - id: title
          label: "Give your idea a short title"
          type: text
          required: true
        - id: department
          label: "Your department or team"
          type: text
          required: false
        - id: submitter_role
          label: "Your role"
          type: select
          options: ["Developer", "Architect", "DevOps / SRE", "SecOps", "Data / ML Engineer",
                    "Network Engineer", "ISSO / ISSM", "CISO", "Program Manager", "Analyst",
                    "Leadership / Executive", "Other"]
    - id: problem
      label: "Problem Definition"
      description: "Help us understand what's broken, slow, or manual."
      questions:
        - id: q1_bottleneck
          label: "What specific decision, task, or workflow is currently slow, error-prone, or manual?"
          type: textarea
          required: true
        - id: q2_frequency
          label: "How often does this happen?"
          type: select
          options: ["Multiple times per hour", "Daily", "Weekly", "Monthly", "Ad hoc"]
        - id: q3_impact
          label: "Who is affected and what does it cost them in time or quality?"
          type: textarea
    - id: scope
      label: "Scope Check"
      description: "Let's understand the ceiling and floor of what's possible."
      questions:
        - id: q4_improvement
          label: "What would a 2x improvement look like? What would a 10x improvement look like?"
          type: textarea
        - id: q5_pattern
          label: "Does this problem repeat in a predictable pattern, or is it unique each time?"
          type: select
          options: ["Highly predictable / repeating pattern", "Mostly predictable", "Mixed", "Unique each time"]
        - id: q6_data
          label: "What data exists today that describes or drives this workflow?"
          type: textarea
    - id: ai_fit
      label: "AI Fit Test"
      description: "Not every problem needs AI. Let's check."
      questions:
        - id: q7_simple_solution
          label: "Could a non-AI solution (better process, automation, simple rules) solve 80% of this?"
          type: select
          options: ["Yes — simpler solution probably works", "Partially — simpler handles basics but misses edge cases", "No — judgment / reasoning is essential", "Unsure"]
        - id: q8_judgment
          label: "What judgment or reasoning makes this hard to automate without AI?"
          type: textarea
        - id: q9_failure_cost
          label: "What does a wrong answer cost? Can errors be caught and corrected?"
          type: textarea
    - id: feasibility
      label: "Feasibility Quick-Check"
      description: "Help us estimate what it would take to prove this works."
      questions:
        - id: q10_data_available
          label: "Do we have training examples or labeled data for this?"
          type: select
          options: ["Yes — clean, labeled data exists", "Partial — some data exists but needs work",
                    "No — would need to collect data first", "Unsure"]
        - id: q11_mvp
          label: "What's the minimum viable version that would prove this works?"
          type: textarea
        - id: q12_integration
          label: "What would you need to change in the existing system to plug AI in?"
          type: textarea

llm:
  brief_model_function: "idea_brief_generation"
  feasibility_model_function: "feasibility_study"
  max_brief_tokens: 1500
  max_study_tokens: 2500
  fallback_to_template: true  # if LLM unavailable, use template-based brief
