# CUI // SP-CTI
# Data Design Canvas — Configuration
app:
  name: "Data Design Canvas"
  version: "1.0.0"
  classification: "CUI // SP-CTI"

database:
  path: "ddc_canvas.db"
  wal_mode: true
  foreign_keys: true

canvas:
  autosave_delay_ms: 3000
  grid_size: 10
  default_width: 110
  default_height: 60
  accent_color: "#ff9800"

uqs:
  weights:
    data_protection: 0.30
    access_control: 0.20
    compliance_readiness: 0.20
    lineage_integrity: 0.15
    audit_coverage: 0.15
  thresholds:
    merge: 70
    deploy: 80
    release: 85
  grade_scale:
    A: 90
    B: 80
    C: 70
    D: 60

assessment:
  auto_assess_on_save: true
  default_rules:
    - DDC-ENC-001  # Data at rest encryption
    - DDC-ENC-002  # Data in transit encryption
    - DDC-ENC-003  # Key management present
    - DDC-ENC-004  # FIPS 140-2/3 validated crypto
    - DDC-ACC-001  # Access controls defined
    - DDC-ACC-002  # Least privilege enforced
    - DDC-ACC-003  # Attribute-based access control (ABAC) for CUI
    - DDC-AUD-001  # Audit logging on sensitive data
    - DDC-AUD-002  # Data access audit trail
    - DDC-AUD-003  # Immutable audit store
    - DDC-RET-001  # Retention policy defined
    - DDC-BAK-001  # Backup strategy defined
    - DDC-BAK-002  # Backup encryption verified
    - DDC-CLS-001  # Classification zones applied
    - DDC-CLS-002  # PII auto-detection enabled
    - DDC-CLS-003  # PHI controls present
    - DDC-SOV-001  # Data sovereignty enforced
    - DDC-SOV-002  # GovCloud / on-prem residency for IL5+
    - DDC-DLP-001  # DLP controls present
    - DDC-DLP-002  # Exfiltration detection enabled
    - DDC-LIN-001  # Data lineage tracked
    - DDC-LIN-002  # Schema registry registered
  thresholds:
    min_score: 70
    cat1_max: 0
    cat2_max: 5

gates:
  ddc_sast:
    tool: "tools/security/sast_runner.py"
    blocking: true
    dimension: data_protection
  ddc_compliance:
    tool: "tools/compliance/multi_regime_assessor.py"
    blocking: false
    dimension: compliance_readiness
  ddc_stig:
    tool: "tools/compliance/stig_checker.py"
    blocking: true
    dimension: compliance_readiness
  ddc_health:
    tool: "tools/monitor/health_checker.py"
    blocking: false
    dimension: audit_coverage
  ddc_integrity:
    tool: "tools/security/blueprint_verifier.py"
    blocking: false
    dimension: lineage_integrity
  ddc_surface:
    tool: "tools/testing/api_surface_extractor.py"
    blocking: false
    dimension: access_control

classification:
  zones:
    - cui
    - pii
    - phi
    - secret
    - audit
  auto_detect_pii: true
  fips_mode: true

lineage:
  enabled: true
  track_data_flows: true
  schema_registry: true

evidence:
  format: "oscal_json"
  retention_days: 365
  auto_emit: true

runbooks:
  auto_execute_confidence: 0.7
  max_auto_per_hour: 5
  cooldown_seconds: 600

templates:
  count: 6
  auto_seed: true

agent:
  auto_trigger_on_canvas_save: true
  auto_trigger_sdc_on_save: true
  auto_trigger_qdc_on_save: true
  cross_canvas_sync: true

logging:
  level: INFO
  audit_enabled: true
