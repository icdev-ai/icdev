# CUI // SP-CTI
# FathomDesk Phase 7.6 — Options intent schema.
#
# Structured representation of a trader's natural-language thesis. The
# intent parser (tools/trading/options/intent_parser.py) produces a dict
# matching this schema; the strategy selector consumes it deterministically.
#
# Keep enums tight — the parser prompt constrains the LLM to these values,
# and the rule-fallback matcher keys off the hints below. Adding a new
# enum value requires updating both paths + at least one test intent.
#
# Hot-reloadable: parser reloads on mtime change (persona_presets.py pattern).

_schema_version: 1

intent_schema:
  # Directional bias on the underlying
  direction:
    - bullish       # expect up
    - bearish       # expect down
    - neutral       # expect range-bound
    - volatile      # expect big move, direction unclear

  # Timeframe the thesis plays out over
  horizon:
    - intraday      # same day (0DTE / 0-3 DTE)
    - short         # 1-3 weeks (7-21 DTE)
    - earnings      # next earnings release (event-driven)
    - medium        # 1-2 months (30-60 DTE)
    - long          # 2-4 months (60-120 DTE)

  # View on implied volatility regime
  iv_view:
    - high          # IV rich — favor selling premium
    - low           # IV cheap — favor buying premium
    - neutral       # no strong view

  # Risk appetite — drives defined-risk vs unlimited-loss strategy selection
  risk_cap:
    - defined       # max loss must be bounded (spreads, condors, flies)
    - undefined     # naked longs or shorts acceptable (requires L3 tier)


# DTE (days-to-expiry) buckets per horizon — consumed by pick_expiry().
# [min_dte, max_dte] inclusive. Picker selects nearest chain expiry inside.
horizon_dte_buckets:
  intraday: [0, 3]
  short:    [7, 21]
  earnings: [0, 45]     # earnings is event-driven, not DTE-driven; picker
                        #   prefers expiry straddling the next earnings date
  medium:   [30, 60]
  long:     [60, 120]


# Keyword hints for the rule-fallback parser path. Matched case-insensitive
# against the user's text; first match per field wins. Keep phrases short
# and distinctive so we don't false-match sibling enum values.
keyword_hints:
