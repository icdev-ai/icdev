# CUI // SP-CTI
# Evolution Daemon Configuration (D-EVO-1)
# Controls Phase 36 Evolutionary Intelligence lifecycle
# Master switch: ICDEV_EVOLUTION_ENABLED env var
# Per-reflex: ICDEV_EVOLUTION_REFLEX_{NAME}_ENABLED

classification: "CUI // SP-CTI"

# Master enable (default: disabled, opt-in per D-GEN-9 pattern)
enabled: false
env_override: ICDEV_EVOLUTION_ENABLED

# LLM — scanner-tier only (qwen3.5-local, zero Claude cost)
llm:
  tier: scanner
  model: qwen3.5-local
  max_tokens: 4096

# ---------------------------------------------------------------------------
# Trust Kernel (D-EVO-1)
# ---------------------------------------------------------------------------
trust_kernel:
  risk_tiers:
    green:
      approval: auto
      sandbox: false
    yellow:
      approval: auto
      sandbox: true
      require_tests_pass: true
      rollback_window_hours: 72
    orange:
      approval: human
      sandbox: true
      require_tests_pass: true

  circuit_breaker:
    max_consecutive_failures: 3
    cooldown_minutes: 60
    auto_reenable: false

  kill_switch:
    check_interval_seconds: 10

  # Allowed actions per risk tier
  allowed_actions:
    green:  [read_database, query_telemetry, evaluate_capability, log_audit]
    yellow: [read_database, query_telemetry, evaluate_capability, create_staging, run_tests, log_audit]
    orange: [read_database, query_telemetry, evaluate_capability, create_staging, run_tests, prepare_propagation, absorb_capability, log_audit]

# ---------------------------------------------------------------------------
# Capability Evaluation (REQ-36-020, D-EVO-5)
# ---------------------------------------------------------------------------
evaluation:
  # 8-dimension weights (must sum to 1.0) — D-NC-4 adds sandbox_security
  weights:
    universality: 0.20
    compliance_safety: 0.20
    risk: 0.15
    evidence: 0.10
    novelty: 0.08
    cost: 0.05
    security_assessment: 0.10
    sandbox_security: 0.12

  # Outcome thresholds (REQ-36-021)
  thresholds:
    auto_queue: 0.85
    recommend: 0.65
    log: 0.40
    # Below log threshold -> archive

  # Prompt injection scan (Phase 37 integration)
  injection_scan:
    block_confidence: 0.7
    demote_confidence: 0.5

# ---------------------------------------------------------------------------
# Staging (D211, D212, D-EVO-4)
# ---------------------------------------------------------------------------
staging:
  expiry_hours: 72
  staging_dir: "trees/staging"

  # Test pipeline — steps run in order (D-EVO-4)
  # blocking: true = failure stops pipeline
  test_pipeline:
    - name: py_compile
      command: "python -m py_compile"
      blocking: true
      timeout_seconds: 60
    - name: ruff
      command: "python -m ruff check"
      blocking: true
      timeout_seconds: 120
    - name: pytest
      command: "python -m pytest tests/ -v --tb=short -q"
      blocking: true
      timeout_seconds: 300
    - name: behave
      command: "python -m behave features/"
      blocking: false
      timeout_seconds: 300
    - name: bandit
      command: "python -m bandit -r tools/ -f json -q --severity-level high"
      blocking: true
      timeout_seconds: 120
    - name: secret_detection
      command: "python tools/security/secret_detector.py --project-dir ."
      blocking: true
      timeout_seconds: 120
    - name: cui_check
      blocking: false
      timeout_seconds: 60

# ---------------------------------------------------------------------------
# Propagation (D214, D-EVO-2)
# ---------------------------------------------------------------------------
propagation:
  budget_cap_per_pi: 10
  canary_percentage: 10
  canary_verify_minutes: 30

  # Delivery method: filesystem (local children) or a2a (remote children)
  delivery:
    local_method: filesystem
    remote_method: a2a
    a2a_endpoint: "/capabilities/deploy"
    timeout_seconds: 120

# ---------------------------------------------------------------------------
# Absorption (D212, D-EVO-3)
# ---------------------------------------------------------------------------
absorption:
  stability_window_hours: 72
  error_rate_trend_tolerance: 0.01
  compliance_degradation_tolerance: 0.02
  min_telemetry_points: 6

# ---------------------------------------------------------------------------
# Self-Healing Enhancements (D-EVO-7, D-EVO-8)
# ---------------------------------------------------------------------------
self_healing:
  confidence_decay:
    enabled: true
    half_life_days: 90
    min_floor: 0.01

  per_project_learning:
    enabled: true
    alpha: 0.6

# ---------------------------------------------------------------------------
# Outcome Verification (D-EVO-6)
# ---------------------------------------------------------------------------
outcome_verification:
  pr_poll_interval_minutes: 30
  pr_max_poll_days: 7
  recurrence_window_days: 7
  confidence_delta_success: 0.1
  confidence_delta_failure: -0.2

# ---------------------------------------------------------------------------
# 7 Reflexes (mapped to lifecycle steps)
# ---------------------------------------------------------------------------
reflexes:
  discover:
    enabled: true
    risk_tier: green
    schedule: "every 6h"
    description: "Discover unevaluated child-learned behaviors"
    success_metric:
      name: behaviors_discovered
      threshold: 0
      operator: gte

  evaluate:
    enabled: true
    risk_tier: green
    schedule: "on_demand"
    description: "Run 7-dimension capability evaluation on new behaviors"
    success_metric:
      name: evaluations_completed
      threshold: 0
      operator: gte

  stage:
    enabled: true
    risk_tier: yellow
    schedule: "every 1h"
    description: "Create staging environments for auto_queue capabilities"
    success_metric:
      name: stages_created
      threshold: 0
      operator: gte

  test:
    enabled: true
    risk_tier: yellow
    schedule: "continuous"
    interval_seconds: 1800
    description: "Run full test pipeline on active staging environments"
    success_metric:
      name: stages_tested
      threshold: 0
      operator: gte

  approve:
    enabled: true
    risk_tier: orange
    schedule: "on_demand"
    description: "Prepare propagation records for HITL approval"
    success_metric:
      name: propagations_prepared
      threshold: 0
      operator: gte

  verify:
    enabled: true
    risk_tier: green
    schedule: "continuous"
    interval_seconds: 1800
    description: "Check 72h stability window on propagated capabilities"
    success_metric:
      name: verifications_completed
      threshold: 0
      operator: gte

  absorb:
    enabled: true
    risk_tier: orange
    schedule: "every 6h"
    description: "HITL-gated genome merge for stable capabilities"
    success_metric:
      name: absorptions_completed
      threshold: 0
      operator: gte
