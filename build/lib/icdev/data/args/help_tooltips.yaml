# FathomDesk help tooltips — single source of truth for all dashboard (?) tooltips.
#
# Each entry: key -> { title, body (markdown-ish plain text), see (optional list) }
# Add `data-help="<key>"` to any dashboard element to auto-decorate it with a (?)
# icon that opens this content on hover/click.
#
# Keep `body` concise (2-5 short paragraphs) and action-oriented: what is it,
# how is it computed, what does it tell the user.

# ───────────────────────────────────────────────────────────────────
# Global / cross-page
# ───────────────────────────────────────────────────────────────────

regime_banner:
  title: Regime Banner
  body: |
    Page-wide macro regime indicator, refreshed every 60 seconds from /api/regime.
    Colour bar + label show the current Systemic Risk & Opportunity Radar (SROR)
    state — NEUTRAL, OPPORTUNITY, CAUTION, DANGER, CRISIS — plus composite danger
    vs opportunity scores, active news regime clusters, cross-market divergences,
    and alert count.

    Click the banner to open the full Radar page with indicator breakdown.
    If "[SAMPLE DATA]" appears, live FRED/yfinance feeds are unavailable and the
    numbers are synthetic — trading decisions should pause until live data returns.

# ───────────────────────────────────────────────────────────────────
# /market — Market Intelligence page
# ───────────────────────────────────────────────────────────────────

market.universe:
  title: Universe
  body: |
    Total number of tickers FathomDesk tracks — NASDAQ-100, S&P 500 ex-NASDAQ,
    international ADRs, sector & asset-class ETFs, index funds, forex, crypto.
    Defined in `tools/trading/market_intel/universe.py`. Re-seeded by the
    `kg_enricher` daemon reflex every 6 hours.

market.analyzed:
  title: Analyzed
  body: |
    How many universe tickers have a current signal from the `market_scanner`
    reflex. Gap between Universe and Analyzed = tickers the scanner hasn't
    touched this cycle (usually because the reflex errored or the ticker is new).

market.bullish:
  title: Bullish
  body: |
    Count of analyzed tickers with direction = BUY. Derived from the composite
    signal (technical + fundamental + macro + sentiment + KG propagation).
    A signal becomes BUY when composite_score ≥ 60 AND confidence ≥ 0.60.

market.bearish:
  title: Bearish
  body: |
    Count of tickers with direction = SELL or SHORT. SHORT specifically means
    the system sees an asymmetric downside — elevated short interest signal
    plus negative technicals plus macro headwind in the ticker's sector.

market.avg_score:
  title: Avg Score
  body: |
    Mean composite_score across all analyzed tickers. 50 is neutral, above 60
    is broadly bullish breadth, below 40 is broadly bearish. Useful as a
    market-wide sentiment read that pairs with the Regime label.

market.regime:
  title: Regime
  body: |
    The current macro regime. Two layers:

    • If the trained HMM is available, returns GREEN / YELLOW / RED.
    • Otherwise, the Van Metre monetary framework + composite risks return a
      richer label: EXPANSION, INFLATION, STAGFLATION, DEFLATION, LIQUIDITY_TRAP.

    Regime drives signal weighting, position sizing (via vix_sizing +
    confluence_scorer), and which sectors/ETFs are favored on the Oracle page.

market.stagflation:
  title: Stagflation Composite (0–4 flags)
  body: |
    A 4-flag score for stagflation risk — stagnant growth with persistent
    inflation — sourced from FRED:

    • GDP growth < 1.5% quarterly annualized (A191RL1Q225SBEA)
    • CPI YoY > 3.0% (CPIAUCSL)
    • Unemployment rising 3+ consecutive months (UNRATE)
    • Energy prices +5% month-over-month (CUSR0000SEHF01)

    Each active flag adds 25 points. 3+ flags flips the regime to STAGFLATION;
    the Regime Trajectory lens then issues a critical prediction recommending
    energy, commodities, and TIPS overweight.

market.deflation:
  title: Deflation Composite (0–4 flags)
  body: |
    A 4-flag score for deflation / balance-sheet recession risk — symmetric
    to the stagflation composite:

    • Credit contraction — loan growth YoY < 0% (TOTLL)
    • M2 money supply shrinking — M2 YoY < 0% (M2SL)
    • Velocity collapse — velocity of money < 1.1 (M2V)
    • Breakeven compression — 5y5y forward breakeven < 2.0% (T5YIFR)

    Each active flag adds 25 points. 2+ flags flips the regime to DEFLATION;
    the Regime Trajectory lens recommends long-duration Treasuries (TLT),
    cash (SHY), consumer staples (XLP), and dividend aristocrats.

market.breakeven_5y5y:
  title: 5y5y Forward Breakeven
  body: |
    The market's five-year, five-year-forward inflation expectation — the
    annualized CPI the bond market is pricing in for the period starting 5
    years from now through year 10. Source: FRED series **T5YIFR**.

    This is the Fed's preferred long-horizon gauge for whether inflation
    expectations are "anchored" near the 2% target. It strips out near-term
    noise (energy shocks, tariff surprises) and focuses on structural views.

    Colour bands on this card:
    • **Red < 1.5%** — deflation expectations (emergency tier)
    • **Amber 1.5–2.0%** — below target (disinflation pressure)
    • **Green 2.0–2.5%** — anchored near target (healthy)
    • **Amber 2.5–3.0%** — elevated (reflation narrative)
    • **Red > 3.0%** — expectations un-anchoring (fire-drill inflation tier)

    Also used as the fourth flag in the Deflation Composite.

market.kg_nodes:
  title: KG Nodes
  body: |
    Total entities in the Fathomdesk knowledge graph — tickers, sectors, ETFs,
    macro indicators, commodities, cascade triggers. Re-seeded by the
    `kg_enricher` reflex every 6 hours via `kg_seeder.py`.

market.kg_edges:
  title: KG Edges
  body: |
    Total relationships in the KG — SUPPLIES_TO, COMPETES_WITH,
    MEMBER_OF_SECTOR, EXPOSED_TO_COMMODITY, MACRO_SENSITIVE_TO, ENABLES,
    REQUIRES_RESOURCE, CONSTRAINED_BY, DISPLACES.
    Used by the cascade engine and supply-chain propagation.

market.composite_detail:
  title: Macro Regime Detail
  body: |
    Appears when either composite (Stagflation or Deflation) has at least one
    active flag. Shows each flag's threshold, current value, and whether it
    is active (● red) or quiet (○ gray) — so you can see *which* specific
    condition is driving the regime call.

market.daemon:
  title: Trading Daemon
  body: |
    The always-on trading reflex scheduler. 22 reflexes run on independent
    cadences: market_scanner (1h), macro_watcher (30m), alert_detector (10m),
    kg_enricher (6h), expert_advisor (2h), exit_executor (2m), news_poller,
    news_aggregator, systemic_radar, gap_detector, scenario_analyzer, and more.

    The daemon auto-starts on Windows login via Task Scheduler. Each reflex
    has an independent circuit breaker: 3 consecutive failures opens the
    breaker and quarantines that reflex until manual reset.

market.breadth:
  title: Market Breadth
  body: |
    Visual band showing the bullish/neutral/bearish split of analyzed tickers.
    Classic breadth indicator — when the S&P is rising but breadth narrows
    (fewer bullish names), that's a divergence the system flags.

market.sector_strength:
  title: Sector Strength
  body: |
    Bar chart of per-sector average composite_score. Reveals sector rotation
    — capital flowing from cyclicals to defensives signals risk-off regime
    change. Computed by `batch_scanner.compute_sector_summary`.

market.alerts:
  title: Alerts
  body: |
    Real-time events from the `alert_engine` reflex: direction flips
    (BUY→SELL within 24h), KG-propagated shocks (one ticker's news rippling
    through supply chains), macro regime changes, and stagflation/deflation
    flag transitions.

market.heatmap:
  title: Signal Heatmap
  body: |
    Universe-wide grid coloured by composite_score — green = bullish,
    red = bearish, gray = unanalyzed. Filter by direction, sector, KG
    centrality, or minimum confidence. Hover a cell for ticker detail;
    click to jump to /analysis for that ticker.

    The small corner numbers are 1-day, 5-day, 30-day price performance
    (top-left/top-right/bottom-left) plus 1-year (bottom-right).

market.reading:
  title: 📖 Market Reading
  body: |
    PM-style narrative of today's tape: breadth + regime + sector rotation
    + stagflation/deflation composites + 5y5y breakeven + daemon health.
    Same deterministic rule engine as the Portfolio Reading — every
    observation links to a specific metric.

    **Triggers a bearish observation** when breadth narrows (< 35% bullish),
    when defensive sectors are leading cyclicals (risk-off rotation), when
    composite danger is high, when breakevens are un-anchoring, or when
    circuit breakers are open on critical reflexes.

    **Triggers a bullish observation** for strong breadth (≥ 65% bullish)
    + cyclical leadership + supportive regime + anchored inflation.

signals.reading:
  title: 📖 Signals Queue Reading
  body: |
    Reads the signal-generation pipeline: queue mix (pending / approved /
    rejected), direction skew (BUY vs SELL+SHORT), average confidence,
    and advisor-agreement rate. Flags mismatches like "bullish queue in a
    risk-off regime" or "advisor pipeline lagging signal pipeline".

    Biggest use: catching when the advisor reflex has fallen behind the
    signal reflex — auto-trader can only route orders when both agree.

news.reading:
  title: 📖 News Reading
  body: |
    Reads the current news narrative: regime-tier clusters, emerging
    clusters, dominant category (macro / geopolitical / earnings /
    regulatory / sector), geopolitical danger score (0–100), and the
    tickers getting the strongest KG-propagated impact over the last 24h.

    Tells you *what the narrative is trying to make you believe* and
    which tickers are most in the crosshairs — before you act on any
    single headline.

radar.reading:
  title: 📖 Radar Reading
  body: |
    Reads the Systemic Risk & Opportunity Radar snapshot: current regime
    (CRISIS / DANGER / CAUTION / NEUTRAL / OPPORTUNITY / STRONG_OPP),
    composite danger vs opportunity, horizon trajectory (is acute risk
    immediate, near-term, or medium-term?), and recession-precursor count
    (5+ has preceded every US recession since 1970).

    Also flags when SROR is running on sample data — pause trading until
    live feeds return.

oracle.reading:
  title: 📖 Oracle Reading
  body: |
    PM-style summary of the multi-lens prediction tape: pending count,
    severity distribution (critical / high / medium), direction skew
    (long-leaning vs short-leaning by prediction_type vocab), average
    lens confidence, and convergence detection (≥2 lenses agreeing on
    the same subject + direction).

    Flags lens concentration (one lens dominating ≥60% of output —
    other lenses likely circuit-broken) and surfaces top consensus
    subjects for prioritization.

evolution.reading:
  title: 📖 Evolution Reading
  body: |
    Per-ticker trajectory reading: latest signal, score trend (current
    vs prior-5 average), confidence trend, direction-flip count across
    the run history (3+ flips = indecisive thesis), and advisor-vs-
    signal agreement.

    Useful before sizing: a stable BUY conviction with rising score and
    rising confidence is the high-quality entry; frequent flips warn
    against acting on the latest bar alone.

advisor.reading:
  title: 📖 Advisor Reading
  body: |
    Reads the CIS expert pipeline: BUY/SELL/HOLD recommendation skew,
    average conviction, expert_advisor reflex health (circuit-breaker
    state + last-run age), the active risk profile, and regime-vs-
    profile alignment (e.g. AGGRESSIVE during DEFLATION = risk
    asymmetry).

    Surfaces mismatches between recommendation skew and macro regime
    (bullish recs in CRISIS, bearish recs in EXPANSION) and guides
    profile shifts when the regime drifts.

strategist.reading:
  title: 📖 Strategist Reading
  body: |
    Reads the latest strategy run: total holdings, tier distribution
    (Core / Tactical / Opportunistic / Hedge), hedge-sleeve weight (and
    whether it's adequate for the regime), Core conviction average,
    sector overweights/underweights, and run freshness.

    Flags regime drift (run built under one regime, current regime
    differs) and stale runs (>24h old vs macro cadence) so you can
    re-run before deploying capital.

market.supply_chain:
  title: Supply Chain Propagation
  body: |
    KG-powered "what if" analysis. Pick a subject and an event — the
    system walks the knowledge graph outward and scores every connected
    ticker by role-adjusted impact.

    **Two subject modes:**

    • **Ticker** — a company or ETF. Events: earnings beat/miss,
    guidance raise, supply disruption. Walks SUPPLIES_TO and CUSTOMER_OF
    edges to upstream suppliers and downstream customers.

    • **Commodity** — a raw material or input (gold, copper, oil, wheat,
    coffee, lithium, uranium, cocoa, rare earth…). Events: price up,
    price down, supply disruption, demand spike. Walks the
    EXPOSED_TO_COMMODITY edges inward to every ticker with exposure.

    **Role-based polarity** for commodity events: each exposure carries
    a role (miner / producer / direct / consumer / both). Price up is
    positive for miners/producers/direct holders and negative for
    consumers; supply disruption hurts consumers most.

    Impact score = edge weight × role polarity. Results are sorted by
    absolute impact; colour indicates direction (green positive, red
    negative, amber mixed).

# ───────────────────────────────────────────────────────────────────
# Overview page — /
# ───────────────────────────────────────────────────────────────────

overview.portfolio:
  title: Portfolio
  body: |
    Current paper portfolio: cash balance, position count, unrealized P&L,
    and day-over-day change. Refreshed from `ad_portfolios` + `ad_positions`
    tables. See the /portfolio page for position-level detail.

overview.market:
  title: Market Snapshot
  body: |
    At-a-glance breadth, regime, and top movers from the materialized
    `ad_market_snapshot` table (refreshed by the snapshot_refresher reflex).

overview.news:
  title: News Intelligence
  body: |
    Summary of active news clusters (regime-level + emerging), detected
    divergences between news and market action, and the dominant news
    category (macro / geopolitical / earnings / regulatory / sector).

overview.oracle:
  title: Oracle Predictions
  body: |
    Latest high-confidence predictions from the 4-lens Trading Oracle:
    Regime Trajectory, News Intelligence, Portfolio Stress, Signal
    Convergence. Each prediction includes a horizon, confidence, direction,
    and recommended action. The full list lives at /oracle.

overview.expert:
  title: Expert Consensus
  body: |
    Latest recommendations from the 6-agent expert pipeline (Fundamental,
    Technical, Sentiment, Macro, Quant, Risk) synthesized by the CIS
    (Committee of Investment Specialists). Each row shows final direction
    and conviction 1–10.

# ───────────────────────────────────────────────────────────────────
# /news
# ───────────────────────────────────────────────────────────────────

news.regime_watch:
  title: Regime Watch
  body: |
    News clusters promoted to regime tier — cumulative_score above the
    `regime` threshold (default 10). These represent durable news flow
    that's shaping the broader macro narrative. One cluster per
    (category, scenario_key) after the upsert fix (2026-04-17).

news.emerging_watch:
  title: Emerging Clusters
  body: |
    News clusters at the `emerging` or `cluster` tier — strong but not yet
    regime-grade. Watch these for promotion into regime watch within 24–48
    hours; they're the leading edge of narrative shifts.

news.counts:
  title: News Counts by Category
  body: |
    Category buckets from the news classifier (`tools/trading/news/classifier.py`):
    macro, geopolitical, earnings, regulatory, sector. Click a stat card
    to filter the feed below.

news.trace_impact:
  title: 🔗 Trace Impact
  body: |
    Walks the Knowledge Graph to cascade this news item into every affected
    ticker across the FathomDesk universe.

    **Pipeline:**
    1. **Extract entities** — countries, commodities, tickers, event hints
       (war, sanctions, supply disruption, price up, etc.)
    2. **Propagate each subject** — country → producing commodities → exposed
       tickers; commodity → direct exposures; ticker → supply-chain neighbours
    3. **Aggregate per ticker** — sum signed impact scores across all
       subjects and events
    4. **Persist to `ad_news_impact_traces`** — consumed by the Oracle
       news_impact lens, expert agents, SROR danger, and /market alerts

    Example: "US-Iran war" → detects {US, Iran, oil, war} → US war boosts
    defense primes (LMT, RTX, NOC); Iran war cascades into oil supply
    disruption hurting producers and consumers while lifting direct oil
    holders (USO). You'll see winners, losers, and per-subject breakdown.

    The same pipeline runs automatically every 30 minutes via the
    `news_impact_tracer` daemon reflex, so the system's entire ecosystem
    — signals, expert opinions, Oracle predictions, Radar danger — stays
    aligned with the news flow without manual clicks.

# ───────────────────────────────────────────────────────────────────
# /evolution
# ───────────────────────────────────────────────────────────────────

evolution.signals:
  title: Signal Evolution
  body: |
    Time-series chart of composite_score, direction, and confidence per
    ticker — shows how the AI changed its mind over time. Useful for
    post-mortems and calibration analysis.

evolution.analysts:
  title: Analyst Contribution
  body: |
    Per-analyst component scores (fundamental, technical, sentiment, macro,
    quant, risk) over time. Lets you see which analyst is driving a thesis
    and whether their view has been stable.

evolution.macro:
  title: Macro Regime History
  body: |
    Regime label + macro score over time. When the regime changes from
    EXPANSION → INFLATION → DEFLATION, positions should rotate accordingly.

# ───────────────────────────────────────────────────────────────────
# /signals
# ───────────────────────────────────────────────────────────────────

signals.queue:
  title: Signal Queue
  body: |
    All generated signals, sortable by ticker, direction, composite_score,
    confidence, created_at. Status = pending / approved / rejected / executed.
    Signals need both signal direction = BUY AND advisor confirmation = BUY
    before the auto-trader routes them as orders (via the expert_advisor
    reflex every 2 hours).

signals.auto_approve:
  title: Auto-Approval Threshold
  body: |
    Signals with composite_score ≥ 67% and direction = BUY auto-approve
    (status flips from `pending` to `approved`). Below that, human review
    is required. Rejection criteria: earnings blackout, retired strategy,
    confluence tier D, predicted slippage > alpha budget.

# ───────────────────────────────────────────────────────────────────
# /scenarios
# ───────────────────────────────────────────────────────────────────

scenarios.economic:
  title: Economic Calendar
  body: |
    Upcoming economic data releases (CPI, PPI, NFP, GDP, FOMC, retail sales,
    etc.) with historical average market move in basis points and the
    one-click "what if" scenario the release would trigger on a surprise.

scenarios.whatif:
  title: What-If Templates
  body: |
    Hypothetical shocks — rate hike/cut +25/50 bps, war/terrorism/natural
    disaster, pandemic, trade war, CBDC launch. Each runs a 10-level-deep
    cascade through the KG and shows per-sector 1m/1q/1y impacts.

scenarios.historical:
  title: Historical Replays
  body: |
    Nine canonical crises (2008 GFC, COVID, dot-com, Ukraine, Black Monday,
    Nixon shock, Gulf War, Iraq, Fed hike cycle) — replay the impact matrix
    against your current portfolio.

# ───────────────────────────────────────────────────────────────────
# /oracle  (Trading Oracle)
# ───────────────────────────────────────────────────────────────────

oracle.predictions:
  title: Lens Predictions
  body: |
    Four specialized lenses scan for actionable patterns:

    • **Regime Trajectory** — forecasts regime shifts from indicator drift
    • **News Intelligence** — finds clusters/divergences the market missed
    • **Portfolio Stress** — simulates your positions against scenarios
    • **Signal Convergence** — detects multi-lens agreement across tickers

    Each prediction has horizon (days), confidence (0–1), direction
    (bullish/bearish/neutral), severity (info → critical), and a concrete
    recommended action.

# ───────────────────────────────────────────────────────────────────
# /portfolio
# ───────────────────────────────────────────────────────────────────

portfolio.positions:
  title: Positions
  body: |
    All open paper positions from `ad_positions`: ticker, quantity, average
    cost, current market value, unrealized P&L, asset class (equity/crypto).
    Exit orders are managed by the `exit_executor` reflex (runs every 2
    minutes) via per-tier stop and target adjustments.

portfolio.pnl:
  title: P&L
  body: |
    Unrealized + realized P&L. Realized rolls up closed trades from
    `ad_orders`; unrealized marks live positions at the latest Alpaca
    paper quote (or sim fallback when broker is unavailable).

# ───────────────────────────────────────────────────────────────────
# /risk
# ───────────────────────────────────────────────────────────────────

risk.drawdown:
  title: Drawdown Monitor
  body: |
    Tracks daily P&L vs peak. When drawdown exceeds the `halt_drawdown_pct`
    threshold in trading_config.yaml, the kill-switch auto-trips and the
    auto-trader stops placing new orders until manual reset.

risk.kill_switch:
  title: Kill Switch
  body: |
    Three-way guard: environment variable, lock file, or database flag can
    trip it. Checked on every auto-trader run. When active, no new orders
    are placed — existing positions and exit logic still run.

risk.pdt:
  title: PDT Tracker
  body: |
    Pattern Day Trader rule compliance. Blocks new day-trades if the account
    has <$25k equity and already used 3 day-trades in a rolling 5-day window.
    Sourced from Alpaca broker state when creds are present.

risk.vix_sizing:
  title: VIX Position Sizing
  body: |
    Position size scaling factor based on current VIX. Linear: VIX 15→1.0x,
    VIX 25→0.6x, VIX 35→0.3x. Reduces exposure as volatility rises.

# ───────────────────────────────────────────────────────────────────
# /graph
# ───────────────────────────────────────────────────────────────────

graph.viz:
  title: Knowledge Graph Visualization
  body: |
    D3 force-directed rendering of the FathomDesk KG. Node colour = entity
    type (ticker / sector / ETF / macro indicator / commodity). Node size =
    betweenness centrality. Edge thickness = relationship weight.

graph.gaps:
  title: Structural Gaps (InfraNodus-inspired)
  body: |
    Pairs of KG communities that are NOT directly connected but SHOULD be
    given their topic overlap. Each gap is turned into a research question
    by the `gap_detector` reflex — surfaces "what are we not thinking about
    yet" opportunities.

# ───────────────────────────────────────────────────────────────────
# /analysis
# ───────────────────────────────────────────────────────────────────

analysis.macro_context:
  title: Macro Context (per ticker)
  body: |
    Full macro overlay for the selected ticker: sector sensitivity to
    rates/oil/DXY, supply chain risk, geopolitical risk, stagflation +
    deflation composites, and the ticker's KG neighbors with propagated
    score adjustments.

analysis.analyst_breakdown:
  title: Analyst Breakdown
  body: |
    Per-analyst findings for the current run: fundamental, technical,
    sentiment, macro, quant, risk. Each shows score (0-100), direction,
    key evidence. The CIS then weights and synthesizes them into the
    final BUY/SELL/HOLD + conviction 1-10.

analysis.debate:
  title: Socratic Debate
  body: |
    LLM-generated debate between bull and bear analysts on the current
    thesis. Surfaces the strongest counter-argument — a forcing function
    against confirmation bias.

analysis.chart:
  title: Per-Ticker Chart
  body: |
    Candlestick chart with SMA20 (blue), SMA50 (orange), SMA200 (purple)
    overlays, volume histogram, RSI(14) panel, and MACD(12,26,9) panel.

    **Period selector** — 1M / 3M / 6M / 1Y / 2Y / 5Y. Server caches each
    period's OHLCV + indicators for 10 minutes.

    **Crosshair** — hover the price panel to see the full OHLC + volume +
    RSI + MACD for that bar in the header.

    Auto-loads when you type a ticker and submit, or land on the page via
    `/analysis?ticker=NVDA` (command palette does this automatically).

analysis.run_new:
  title: Run New Analysis
  body: |
    Kick off a fresh 6-analyst + Socratic debate + CIS synthesis run on a
    ticker. Takes 20–60 seconds depending on LLM latency. Output lands in
    `ad_analysis_runs` and all downstream tables (reports, debates, CIS).

analysis.run_history:
  title: Run History
  body: |
    Past analysis runs with final signal, confidence, and timestamp.
    Click any row to open the full detail modal with per-analyst breakdowns,
    macro context, sector impact, Socratic debate transcript, and a
    generated Pulse article draft.

analysis.final_signal:
  title: Final Signal
  body: |
    The CIS-synthesized direction — BUY / SELL / SHORT / HOLD. This is the
    output the auto-trader consumes (subject to advisor confirmation +
    confluence tier + earnings blackout + PDT + VIX scaling).

analysis.confidence:
  title: Confidence
  body: |
    0–100% confidence the CIS places on the final signal. Derived from
    analyst agreement (higher when 5+ of 6 analysts align) minus Socratic
    debate penalty (bear arguments weaken confidence). Confidence < 60%
    means auto-trader will not execute even if signal = BUY.

analysis.intaas_debate:
  title: INTaaS Debate Result
  body: |
    The verdict from the Intelligence-as-a-Service multiperspectivity
    module. Weighs 4+ perspectives (bull, bear, contrarian, base case)
    against each other and returns a signal strength label.

analysis.approved:
  title: Approved for Auto-Trade
  body: |
    YES means all per-ticker gates passed: advisor agreement, no earnings
    blackout, strategy not retired, confluence tier ≠ D, slippage ≤ alpha
    budget. Auto-trader will route an order on the next pass.

analysis.macro_indicators:
  title: Macro Indicators
  body: |
    The 18-indicator macro panel scored for this run: VIX, yield spread,
    fed funds, DXY, oil, gold, S&P trend, NASDAQ trend, Van Metre monetary
    6, stagflation composite, deflation composite, 5y5y + 10y breakevens.

analysis.sector_impact:
  title: Sector Impact
  body: |
    Per-sector headwind/tailwind scoring — how this ticker's sector is
    positioned given the current macro. Shows rate sensitivity, oil
    sensitivity, DXY sensitivity, and combined impact.

analysis.intaas_multiperspectivity:
  title: INTaaS Multiperspectivity
  body: |
    Full multi-perspective analysis: bull thesis, bear thesis, contrarian
    view, consensus, and the strongest omissions. Based on the ICDEV
    INTaaS v2 framework.

analysis.signal_breakdown:
  title: Signal Confidence Breakdown
  body: |
    Per-component contribution to the final confidence: fundamental
    quality, technical strength, sentiment polarity, macro tailwind,
    quant score, risk adjustments. Useful for calibration debugging.

analysis.pulse_article:
  title: Generated Pulse Article
  body: |
    Draft AI-generated blog post for this ticker thesis — suitable for
    publication to Pulse. Uses WriteGuard quality gating (non-technical
    tone, no backend-path leaks). Can be edited or force-published
    manually via the Pulse engine.

# ───────────────────────────────────────────────────────────────────
# /signals
# ───────────────────────────────────────────────────────────────────

signals.stats:
  title: Signal Stats
  body: |
    Row of quick counters: pending, approved, rejected, executed signal
    counts. Pending = awaiting auto-approval; approved = cleared for
    execution but not yet routed; rejected = failed a gate; executed =
    routed to broker (Alpaca paper or sim).

signals.col.ticker:
  title: Ticker
  body: |
    Symbol this signal is for. Click to open the /analysis page for the
    full per-analyst breakdown behind the signal.

signals.col.direction:
  title: Direction
  body: |
    **BUY** — system recommends long exposure.
    **SELL** — close existing long.
    **SHORT** — open short position (enabled only if risk profile allows).
    **HOLD** — no action; signal still logged for post-mortem calibration.

signals.col.score:
  title: Composite Score
  body: |
    0–100 score synthesized from 6 analysts (fundamental, technical,
    sentiment, macro, quant, risk) + KG propagation adjustment.
    ≥ 60 is the auto-approve threshold for BUY signals.

signals.col.confidence:
  title: Confidence
  body: |
    CIS-assigned 0–100% confidence. High when 5+ of 6 analysts align AND
    the Socratic debate couldn't find a strong counter-argument.
    Auto-trader requires ≥ 60% to execute.

signals.col.advisor:
  title: Advisor Agreement
  body: |
    Latest Committee of Investment Specialists (CIS) recommendation for
    this ticker. Shows direction + conviction 1–10. Signal + advisor must
    BOTH be BUY for auto-trader to route an order.

signals.col.status:
  title: Status
  body: |
    **pending** — just generated, waiting for auto-approval gate
    **approved** — cleared auto-approval, waiting for advisor + execution
    **rejected** — failed a gate (earnings blackout, retired strategy,
    slippage too high, confluence tier D, etc.)
    **executed** — auto-trader routed to broker

signals.col.added_price:
  title: Added Price
  body: |
    Ticker's last price at the moment this signal was generated (for
    attribution). Lets you compare signal-entry vs current price and
    compute after-the-fact hit rate.

signals.col.current_price:
  title: Current Price
  body: |
    Live quote (or most recent close). Pulled from Alpaca paper feed when
    available, yfinance otherwise.

signals.col.perf:
  title: Performance %
  body: |
    Price change since the signal was generated. For BUY signals, positive
    = thesis correct so far. Computed per (current − added) / added.

signals.col.generated:
  title: Generated At
  body: |
    Timestamp when the signal was created by the `market_scanner` reflex
    or a manual /analysis run.

# ───────────────────────────────────────────────────────────────────
# /scenarios
# ───────────────────────────────────────────────────────────────────

scenarios.catalog:
  title: Scenarios Available
  body: |
    Count of scenario templates currently loaded — 29 total: 9 economic
    events, 9 historical replays, 7 what-if templates, 4 monetary policy.

scenarios.runs_logged:
  title: Runs Logged
  body: |
    How many scenario runs are stored in `ad_scenario_runs`. Each run
    captures the scenario key, sector impacts, narrative summary, and
    portfolio P&L delta at 1m/1q/1y horizons.

scenarios.last_run:
  title: Last Run
  body: |
    Timestamp of the most recent scenario evaluation. The
    `scenario_analyzer` daemon reflex re-runs active scenarios every 4
    hours so output stays fresh as macro drifts.

scenarios.election:
  title: US Election Cycle Phase
  body: |
    Current phase of the 4-year presidential cycle (pre-primary / primary /
    convention / general / post-election / mid-term). Historical average
    market return by phase informs the `election_cycle` scenario family.

scenarios.run_ui:
  title: Run Scenario
  body: |
    Pick a scenario template, optionally override parameters, and fire.
    The engine walks the KG cascade (up to 10 levels deep), applies sector
    impact weights, and produces a narrative + portfolio impact report.

scenarios.narrative:
  title: Narrative Summary
  body: |
    Plain-English prose description of the scenario — what happened, what
    the mechanism is, why certain sectors win/lose. Generated from the
    scenario template plus live macro context (so wording reflects today's
    regime, not a generic case).

scenarios.portfolio_impact:
  title: Portfolio Impact
  body: |
    Dollar P&L impact on your current paper portfolio under this scenario
    at 1-month, 1-quarter, and 1-year horizons. Multiplies each position's
    sector by the scenario's sector impact weight.

scenarios.adjustments:
  title: Signal Confidence Adjustments
  body: |
    Live signals that would have their confidence bumped up or down by
    this scenario. Used to stress-test the current BUY book against a
    hypothetical shock.

scenarios.impacted_tickers:
  title: Most Impacted Tickers
  body: |
    Ranked list of universe tickers with the largest upside/downside under
    this scenario, by sector impact × ticker-specific weight.

scenarios.cascade_results:
  title: Cascade Results
  body: |
    Summary of the BFS walk through the KG — levels deep, nodes touched,
    split into positive-impact (BUY watchlist) and negative-impact (AVOID)
    buckets.

scenarios.cascade_flow:
  title: Cascade Flow Diagram
  body: |
    Mermaid diagram visualizing the cascade tree — trigger at the root,
    each subsequent level showing propagation through SUPPLIES_TO,
    COMPETES_WITH, EXPOSED_TO_COMMODITY, and MACRO_SENSITIVE_TO edges.

scenarios.cascade_buy:
  title: BUY Watchlist (Positive Impact)
  body: |
    Tickers that benefit under this scenario — candidates for long
    exposure if the scenario plays out. Ranked by cumulative positive
    weight across all cascade paths to the ticker.

scenarios.cascade_avoid:
  title: AVOID List (Negative Impact)
  body: |
    Tickers that get hurt under this scenario — candidates to trim or
    short. Ranked by cumulative negative weight from the trigger.

scenarios.cascade_chain:
  title: Full Cascade Chain
  body: |
    Table of every (source → target, relationship, weight, level,
    cumulative impact) tuple in the BFS walk. For audit / explainability
    of why a ticker made the BUY or AVOID list.

scenarios.history:
  title: Scenario Run History
  body: |
    All past scenario runs with run_id, scenario key, executed_at, and
    quick impact summary. Click a row to re-open the full result set.

# ───────────────────────────────────────────────────────────────────
# /oracle
# ───────────────────────────────────────────────────────────────────

oracle.convergence:
  title: Convergence Events
  body: |
    When 2+ lenses agree on a direction for the same subject
    (ticker / sector / macro), the Oracle flags a convergence event —
    high-conviction signal since multiple independent reasoning paths
    landed on the same call.

oracle.total_preds:
  title: Total Active Predictions
  body: |
    Count of predictions currently in the `ad_lens_predictions` table that
    haven't expired. Expiry = `horizon_days` past the prediction's
    created_at.

oracle.critical:
  title: Critical Predictions
  body: |
    Predictions with `severity = critical`. Usually regime-level calls:
    CRISIS imminent, stagflation escalation, deflation escalation, 5+
    recession precursors. These drive dashboard regime-banner state.

oracle.high:
  title: High-Severity Predictions
  body: |
    `severity = high` — strong but not regime-defining. Examples: deep
    yield inversion, elevated VIX, sector divergence, 3-flag stagflation.

oracle.convergences_count:
  title: Active Convergences
  body: |
    Live convergence count — how many subjects have 2+ lenses agreeing
    right now. The higher this is, the more conviction is clustering.

oracle.lenses:
  title: Lenses
  body: |
    FathomDesk Oracle has 4 specialized lenses, each analyzing a different
    angle: Regime Trajectory (macro drift), News Intelligence (cluster
    signals), Portfolio Stress (scenario impact on holdings), Signal
    Convergence (multi-lens agreement).

oracle.active:
  title: Active Predictions
  body: |
    Full list of current predictions with lens origin, subject, title,
    description, confidence 0–1, severity, horizon in days, direction,
    evidence blob, and recommended action. Sortable by confidence,
    severity, or horizon.

# ───────────────────────────────────────────────────────────────────
# /portfolio
# ───────────────────────────────────────────────────────────────────

portfolio.cash:
  title: Cash Balance
  body: |
    Available paper cash from `ad_portfolios.cash_balance`. Starts at
    $100,000 per default portfolio. Decreases on BUY fills, increases on
    SELL proceeds + dividends.

portfolio.total_value:
  title: Total Portfolio Value
  body: |
    Cash + sum of all position market values. Benchmark: your all-time
    high is the watermark for the drawdown monitor.

portfolio.positions_count:
  title: Open Positions
  body: |
    Number of distinct tickers held (from `ad_positions`). Concentration
    risk rises as this approaches the portfolio size cap in
    trading_config.yaml (typically 20 open positions max).

portfolio.unrealized_pnl:
  title: Unrealized P&L
  body: |
    Mark-to-market profit or loss on open positions — (current price −
    avg cost) × quantity, summed. Live-quoted from Alpaca paper when
    available, fallback to sample pricing otherwise.

portfolio.holdings:
  title: Holdings
  body: |
    Per-ticker detail: quantity, avg cost, **current last price** (marked
    live via yfinance), market value, weight in book, unrealized P&L and
    P&L %. Re-marked every 60 seconds.

portfolio.reading:
  title: 📖 Portfolio Reading
  body: |
    Plain-English narrative of what the risk & return numbers are saying —
    generated deterministically from a rule engine (no LLM, auditable,
    repeatable) combining the portfolio's metrics, holdings, cash posture,
    and the current macro regime.

    **Three sections:**

    • **Profile** — one-line characterization, e.g. "Defensive low-beta
      book missing the rally" or "Growth-tilted book riding the rally"

    • **Observations** — bulleted claims tagged bullish / bearish / caution /
      neutral, each with the actual metric value that triggered it.
      Pulled from: Sharpe, Sortino, alpha, beta, outperformance vs SPY,
      max drawdown, single-name concentration, cash posture.

    • **Considerations** — what a disciplined PM would actually do about it.
      Triggers: poor risk-adjusted performance → review holdings; regime
      mismatch → adjust beta; concentration > 30% → trim; negative alpha →
      review losers; heavy cash in risk-on → deploy; zero cash in risk-off →
      build dry powder.

    • **Regime alignment** — does the book's posture (defensive / growth /
      high-beta) match today's macro regime? Mismatch is flagged in red.

    Changes with the selected period — 1M reading differs from 1Y reading
    because the underlying metrics do.

portfolio.brief_pdf:
  title: 📄 PDF Brief
  body: |
    Downloads today's Portfolio Brief as a single-flowing-page PDF — the
    same data the dashboard shows: profile, mood, full reading
    (observations + considerations), risk metrics, holdings table, and
    macro regime context.

    Honors the currently-selected period. Same inputs always produce the
    same PDF — auditable + repeatable. Useful for distribution (email a
    daily brief) or for compliance / record-keeping (file by date).

portfolio.risk_metrics:
  title: Risk & Performance Metrics
  body: |
    Computed from a backward-looking simulation: your **current** holdings
    walked over `period` of historical closes (1M–2Y selectable). Accurate
    for understanding the risk profile of the book as it stands today;
    a true time-series of realized P&L will land once the daily
    portfolio-snapshot reflex has been running for a week or more.

    **Metrics shown:**

    • **Total Return / SPY / Outperformance** — period performance vs the
      S&P 500 benchmark (`SPY`)
    • **Annualized** — period return extrapolated to CAGR
    • **Sharpe ratio** — (μ − rf) / σ × √252, rf = 4% assumed. > 1 is
      considered solid, > 2 exceptional, < 0 you're underperforming cash
    • **Sortino ratio** — Sharpe but denominator is downside-only deviation
      (punishes only losing volatility). Typically higher than Sharpe
    • **Calmar ratio** — annualized return ÷ |max drawdown|. > 0.5 decent,
      > 1 excellent
    • **Max Drawdown** — worst peak-to-trough fall over the window, %
    • **Volatility** — annualized standard deviation of daily returns
    • **Beta vs SPY** — sensitivity to SPY moves. > 1 = amplifies, < 1 =
      dampens, negative = inverse correlation
    • **Alpha (annual)** — excess return over CAPM prediction based on
      beta. Positive = you're beating the risk-adjusted benchmark

# ───────────────────────────────────────────────────────────────────
# /risk
# ───────────────────────────────────────────────────────────────────

risk.var:
  title: Portfolio VaR (1D)
  body: |
    Value-at-Risk — the estimated 1-day loss at 95% confidence. Derived
    from the portfolio's volatility and beta exposure. A $5,000 VaR means
    there's a 5% chance the portfolio loses $5k or more tomorrow.

risk.max_drawdown:
  title: Max Drawdown
  body: |
    Peak-to-trough decline since inception (or since last reset).
    The drawdown monitor auto-trips the kill-switch when this exceeds
    `halt_drawdown_pct` in trading_config.yaml (default 10%).

risk.concentration:
  title: Concentration Risk
  body: |
    Low / Medium / High based on the largest single position as % of
    total portfolio value. > 20% = High; 10–20% = Medium; < 10% = Low.
    High concentration is flagged by the auto-trader before adding more.

risk.open_positions:
  title: Open Risk
  body: |
    Number of positions that have no exit rule set (no stop, no target).
    Ideally zero — every position should have a stop and target from
    `exit_manager.register()` on entry.

risk.limits:
  title: Risk Limits
  body: |
    The active risk profile (conservative / moderate / aggressive) with
    its per-trade max, daily budget, max concurrent positions, and max
    drawdown halt. Sourced from `trading_config.yaml` risk_tier config.

# ───────────────────────────────────────────────────────────────────
# /graph
# ───────────────────────────────────────────────────────────────────

graph.nodes:
  title: KG Nodes
  body: |
    Total entities in the knowledge graph — same as market.kg_nodes.
    Distribution: ~325 tickers + 28 sectors + 19 macro indicators + a few
    commodities + cascade triggers = ~499 typical.

graph.edges:
  title: KG Edges
  body: |
    Total relationships — SUPPLIES_TO, COMPETES_WITH, MEMBER_OF_SECTOR,
    EXPOSED_TO_COMMODITY, MACRO_SENSITIVE_TO, ENABLES, REQUIRES_RESOURCE,
    CONSTRAINED_BY, DISPLACES, TRACKS_INDEX.

graph.communities:
  title: Communities
  body: |
    Louvain-detected clusters — groups of tightly interconnected nodes.
    Each community represents a cohesive narrative (semiconductor supply
    chain, oil ecosystem, AI demand cascade). Used for gap detection.

graph.gaps_count:
  title: Structural Gaps
  body: |
    Pairs of communities that share topic vocabulary but lack direct
    connection. Each gap becomes a "what are we missing?" research
    question — InfraNodus-inspired pattern.

graph.network_viz:
  title: Network Visualization
  body: |
    D3 force-directed graph. Drag nodes, zoom with scroll, click for
    details. Node colour = entity type; size = betweenness centrality
    (how often the node lies on shortest paths between others).

graph.node_details:
  title: Node Details
  body: |
    Click any node to see its metadata, direct neighbors, centrality
    score, community membership, and any macro-sensitivity weights
    attached as properties.

graph.legend:
  title: Legend
  body: |
    Colour/shape key for the graph — ticker / sector / ETF / macro
    indicator / commodity / future / scenario trigger. Edge styles
    distinguish relationship types.

graph.research_questions:
  title: Research Questions
  body: |
    Auto-generated questions produced by the `gap_detector` reflex from
    structural gaps. Each question highlights a missing link the KG
    doesn't yet capture — useful for prioritizing research or new node
    additions.

# ───────────────────────────────────────────────────────────────────
# /orders
# ───────────────────────────────────────────────────────────────────

orders.auto_trading:
  title: Auto-Trading Control
  body: |
    Kill-switch + risk-profile controls. Hit "Halt" to stop the
    auto-trader without killing the daemon; "Resume" to re-enable. The
    broken-expert_advisor incident this morning tripped the circuit
    breaker here — check the reflex status panel before re-enabling.

orders.ml_model_health:
  title: ML Model Health
  body: |
    Training status for the 3 ML models: confluence pillar weights
    (weekly retrain), fill quality predictor (nightly), regime HMM
    (weekly). "Stale" means the model hasn't retrained inside its
    scheduled window.

orders.confluence_scoring:
  title: Confluence Scoring
  body: |
    Live confluence evaluation — 6 pillars (multi-timeframe, price
    levels, TA stack, events, VIX structure, earnings LLM) scored per
    signal and bucketed into tiers A/B/C/D. Tier A gets 1.0× position
    sizing, D is refused.

orders.execution_quality:
  title: Execution Quality
  body: |
    Slippage tracking — predicted vs realized fill price, VWAP benchmark,
    fill time distribution. Feeds back into the fill_quality model so
    trades that predict > alpha-budget bps slippage are skipped.

orders.history:
  title: Order History
  body: |
    Full `ad_orders` table — ticker, side, qty, order type, status, fill
    price, signal_id, created_at, filled_at. Broker is source of truth;
    local row is mirror for dashboard/PnL.

orders.col.order_id:
  title: Order ID
  body: |
    Internal order identifier (format `ord-<uuid12>`). Mirrors the broker
    `client_order_id`. Used to reconcile local state with Alpaca fills
    via the trade-audit poller.

orders.col.side:
  title: Side
  body: |
    **buy** — entering a long position.
    **sell** — closing a long (or closing a short to cover).
    **sell_short** — opening a short.

orders.col.qty:
  title: Quantity
  body: |
    Shares/contracts. Sized by: base = 20% of daily budget ÷ price,
    scaled by confidence × VIX scaling × confluence tier factor.
    Clamped to minimum 1.

orders.col.order_type:
  title: Order Type
  body: |
    **market** — immediate execution at best available price (default).
    **limit** — execute only at specified price or better.
    **stop** — triggers when price crosses the stop level.

orders.col.fill_price:
  title: Fill Price
  body: |
    Price the order actually executed at (from broker response). Compare
    to `estimated_price` at signal time to compute slippage in bps —
    feeds the fill_quality_model retraining.

analysis.col.run_id:
  title: Run ID
  body: |
    Unique identifier for this analysis run (format `run-<uuid12>`).
    Ties together: analyst reports, Socratic debate, CIS synthesis,
    macro snapshot, optional Pulse article.

analysis.col.signal:
  title: Signal (from Run)
  body: |
    The final BUY / SELL / SHORT / HOLD verdict from this run. Stored in
    `ad_analysis_runs.result_json.final_signal`.

analysis.col.duration:
  title: Duration (ms)
  body: |
    How long the run took — typically 20–90 seconds depending on LLM
    latency + number of analysts + macro fetch time. Long durations
    usually signal a slow LLM tier or FRED timeout.

# ───────────────────────────────────────────────────────────────────
# /radar  (Systemic Risk & Opportunity Radar — SROR)
# ───────────────────────────────────────────────────────────────────

radar.regime:
  title: SROR Regime
  body: |
    NEUTRAL / OPPORTUNITY / CAUTION / DANGER / CRISIS. Distinct from the
    market-data regime (GREEN/YELLOW/RED/INFLATION/STAGFLATION/DEFLATION)
    — the SROR regime is about *systemic* risk from composite danger vs
    opportunity scores, not point-indicator macro.

radar.composite_danger:
  title: Composite Danger
  body: |
    0–100 score aggregating immediate (0–2 weeks), near-term (2–12 weeks),
    and medium-term (3–12 months) danger signals across 8 indicator
    families. > 65 warns; > 75 = CRISIS regime.

radar.composite_opportunity:
  title: Composite Opportunity
  body: |
    0–100 score for constructive setups — washout-bounce patterns,
    contrarian sentiment extremes, valuation mean-reversion, positive
    breadth divergences. > 65 = OPPORTUNITY regime if danger is low.

radar.recession_precursors:
  title: Recession Precursors
  body: |
    Count of the 7 recession precursor conditions currently active
    (yield inversion, LEI declining, Sahm Rule triggered, payrolls
    contracting, etc.). 5+ has preceded every US recession since 1970.

radar.divergences:
  title: Active Divergences
  body: |
    Cross-market patterns where two normally-correlated series diverge —
    bonds rallying while stocks rally, oil falling while energy stocks
    rise, VIX up while SPX up. Each divergence is a "silence IS the
    signal" moment.

radar.alerts:
  title: Active Alerts
  body: |
    Count of active SROR-triggered alerts. These flow to the regime
    banner at the top of every page.

radar.data_source:
  title: Data Source
  body: |
    "live" = FRED + yfinance responding; "sample" = deterministic fallback
    data. Always verify LIVE before acting on any signal.

radar.updated:
  title: Last Updated
  body: |
    Timestamp of the most recent SROR snapshot write to
    `ad_systemic_radar_snapshots`. Refreshed by the `systemic_radar`
    reflex — default cadence 10 minutes.

radar.immediate:
  title: Immediate (0–2 weeks)
  body: |
    Danger score for the next 2 weeks — weighted sum of fast-moving
    indicators: credit spreads, VIX term structure, fail-to-deliver,
    liquidity flags, earnings calendar density.

radar.near_term:
  title: Near-term (2–12 weeks)
  body: |
    Danger score for the 2–12 week horizon — slower-moving signals:
    macro momentum, sector rotation, earnings revision trend, DXY trend.

radar.medium_term:
  title: Medium-term (3–12 months)
  body: |
    Danger score for the 3–12 month horizon — structural measures:
    recession precursors, yield curve depth, Sahm Rule, LEI trajectory,
    stagflation + deflation composites, business cycle phase.

radar.family_breakdown:
  title: Family Breakdown
  body: |
    8 indicator families: Credit, Liquidity, Volatility, Yield Curve,
    Macro Momentum, Sentiment, Breadth, Leading Indicators. Each shows a
    score and the top 2–3 driving indicators.

radar.historical_trend:
  title: Historical Trend (30d)
  body: |
    Time series of composite_danger + composite_opportunity over the last
    30 days. Rising trajectory of danger → CRISIS regime imminent.

radar.divergences_omissions:
  title: Divergences & Omissions
  body: |
    Specific cross-signal patterns the system has flagged — with
    explanation of what's unusual and why it matters.

# ───────────────────────────────────────────────────────────────────
# /advisor (Expert Agents)
# ───────────────────────────────────────────────────────────────────

advisor.agents_count:
  title: Expert Agents
  body: |
    6 specialized LLM agents: Fundamental, Technical, Sentiment, Macro,
    Quant, Risk. Each runs an independent analysis pass on a ticker. The
    CIS (Committee of Investment Specialists) then synthesizes a final
    recommendation.

advisor.recommendations_count:
  title: Recommendations
  body: |
    Count of CIS recommendations in `ad_cis_recommendations`. Each is the
    post-synthesis output: final direction, final conviction 1–10,
    strategy id. This is what the auto-trader requires for agreement gate.

advisor.risk_profile:
  title: Active Risk Profile
  body: |
    conservative / moderate / aggressive — controls daily budget, max
    position size, stop/target width, confluence tier gating. Swap via
    trading_config.yaml.

advisor.last_brief:
  title: Last Daily Brief
  body: |
    Timestamp of the most recent daily brief generation. The
    `daily_brief` reflex produces a morning market summary at 01:00 UTC
    (≈ 9 PM ET prior day) with overnight macro moves, top signals, and
    scenario outlook.

advisor.get_opinions:
  title: Get Expert Opinions
  body: |
    Trigger a fresh 6-agent expert analysis pass on a ticker. Output =
    per-agent finding + Socratic review + final CIS verdict. Takes 30–90
    seconds.

advisor.market_context:
  title: Market Context (Judge's View)
  body: |
    High-level macro + regime summary the CIS uses as prior context
    before weighing individual agent findings. Sets the tone: "expect
    rate cuts" vs "inflation re-accelerating".

advisor.expert_opinions:
  title: Expert Opinions (Socratic-reviewed)
  body: |
    Each of the 6 agents' findings after the Socratic critique step —
    weaker opinions get flagged "confidence adjusted" with the reason.

advisor.forecast:
  title: Price Forecast (Auto-ARIMA)
  body: |
    Statistical price forecast from Auto-ARIMA — 1-day, 5-day, 30-day
    expected prices with confidence bands. Serves as a sanity check
    against LLM-driven opinions.

advisor.cis_recommendation:
  title: CIS Recommendation
  body: |
    Final synthesized verdict: direction, conviction 1–10, strategy_id,
    rationale. This is the row that lands in `ad_cis_recommendations`
    and powers the auto-trader's advisor-agreement gate.

advisor.recent:
  title: Recent Recommendations
  body: |
    Last N CIS recommendations across all tickers — useful for
    cross-ticker trend spotting. Shows direction + conviction at a
    glance.

advisor.roster:
  title: Expert Agent Roster
  body: |
    The 6 agents with their prompt templates, LLM model assignment
    (Tier-1 / Tier-2), and recent performance (hit rate, avg
    conviction-to-outcome correlation).

# ───────────────────────────────────────────────────────────────────
# /strategist
# ───────────────────────────────────────────────────────────────────

strategist.regime:
  title: Strategy Regime
  body: |
    The strategist's view of the current regime (may differ from the
    market regime when leading indicators suggest change). Drives tier
    allocation and sector tilt bias.

strategist.tickers_scored:
  title: Tickers Scored
  body: |
    Universe tickers evaluated in the latest strategy run. Each gets a
    composite strategist score and is placed in Core / Tactical /
    Opportunistic / Hedge buckets.

strategist.core:
  title: Core Holdings
  body: |
    Long-duration, high-quality positions — typically 40–60% of target
    portfolio weight. Lowest turnover. Chosen for stable fundamentals +
    durable competitive advantage.

strategist.tactical:
  title: Tactical Tilts
  body: |
    Medium-duration positions sized to current regime — 20–30% weight.
    Rotate with the quarterly strategy re-run.

strategist.opportunistic:
  title: Opportunistic Picks
  body: |
    Short-duration high-conviction calls — 5–15% weight each, < 20%
    total. Event-driven or deep-value plays. Higher turnover.

strategist.hedge:
  title: Hedges
  body: |
    Defensive positions — gold, TLT, VXX, short-SPY — sized to offset
    the gross long exposure of the rest of the book. Scales up with
    composite_danger.

strategist.last_run:
  title: Last Strategy Run
  body: |
    Timestamp of the most recent full strategist pass. The
    `portfolio_strategist` reflex runs every 6 hours; manual re-run
    supported via the strategist page.

strategist.narrative:
  title: Strategy Narrative
  body: |
    Prose summary of the current strategic stance — what regime we're
    in, which tilts are active, what would trigger a shift. Auto-generated
    from the strategist's structured output.

strategist.tier_allocation:
  title: Tier Allocation
  body: |
    Pie chart: what % of the target portfolio goes to Core / Tactical /
    Opportunistic / Hedges. Varies with regime — hedges expand in
    DANGER/CRISIS regimes.

strategist.sector_allocation:
  title: Sector Allocation
  body: |
    Target weight per sector — overweight, underweight, or market-weight
    vs benchmark. Reflects the strategist's view on sector rotation.

strategist.value_opportunities:
  title: Value Investing Opportunities
  body: |
    Tickers flagged as trading below estimated fair value with asymmetric
    upside. Tom Nash-inspired heuristic: quality × discount × catalyst.

strategist.core_holdings:
  title: Core Holdings List
  body: |
    Detailed Core bucket: ticker, target weight, rationale, exit
    triggers, conviction score.

strategist.tactical_tilts:
  title: Tactical Tilts List
  body: |
    Detailed Tactical bucket with entry/exit logic and regime
    dependencies.

strategist.opportunistic_picks:
  title: Opportunistic Picks List
  body: |
    Short-duration plays with entry window and catalyst.

strategist.hedges_list:
  title: Hedges List
  body: |
    Active hedge positions with sizing rationale and trigger conditions
    for expansion/contraction.

strategist.sector_tilts:
  title: Sector Tilt Recommendations
  body: |
    Specific overweight/underweight calls per sector with reasoning and
    expected duration.

strategist.signals:
  title: Strategy Signals
  body: |
    Cross-asset strategy signals — bond/stock ratio, gold/copper ratio,
    dollar trend, breadth — that drive tilt adjustments.

strategist.history:
  title: Strategy Run History
  body: |
    All past strategist runs with executed_at, regime at the time,
    and tier-bucket contents. Useful for auditing how the book has
    shifted over time.

# ───────────────────────────────────────────────────────────────────
# /settings
# ───────────────────────────────────────────────────────────────────

watchlist.reading:
  title: 📖 Watchlist Reading
  body: |
    Rollup analysis of your starred tickers: direction skew (bullish vs
    bearish), average composite score, notable news-driven movers (last 24h
    Σ impact), and regime alignment. Flags when the watchlist is
    mis-aligned with the current macro regime (e.g. bullish watchlist in a
    risk-off regime).

watchlist.table:
  title: Starred Tickers Table
  body: |
    Live enrichment of every starred ticker: last price via yfinance, 1-day
    %, current signal direction from `ad_market_snapshot`, composite score,
    confidence, and news impact Σ over the last 24h. Sorted by absolute
    news impact so stories driving your book surface first.

    Click ★ to un-star. Click the ticker to jump into /analysis with the
    full chart / fundamentals / run history modal.

settings.alpaca:
  title: Alpaca Connection
  body: |
    Paper broker connection status. `ALPACA_API_KEY`, `ALPACA_SECRET_KEY`,
    `ALPACA_BASE_URL` in `.env`. When unreachable, the auto-trader falls
    back to a simulated fill path and flags orders accordingly.

settings.llm:
  title: LLM Configuration
  body: |
    Two-tier LLM routing: Tier-1 (reasoning-heavy — analyst, debate,
    CIS) and Tier-2 (fast — classification, summarization). Uses
    `args/llm_config.yaml` and the router in `tools/llm/router.py`. Set
    provider via `ICDEV_LLM_PROVIDER` in `.env`.

settings.watchlist:
  title: Watchlist
  body: |
    Per-user favorite tickers for quick access. Separate from the
    universe — these don't trade automatically unless also in the
    universe and meeting signal thresholds.

settings.byok_llm:
  title: Your LLM API Keys
  body: |
    BYOK (Bring Your Own Key) for LLM providers. Paste your own
    Anthropic / OpenAI / Ollama keys; the codebase uses yours when set,
    falls back to operator env vars when not.

    Plaintext keys never leave the server — frontend sees only the
    masked preview. Encrypted at rest via AES-GCM with a key in the
    operator's `.env` (`ICDEV_KEYSTORE_KEY`). Step-up MFA enforced on
    save when MFA is enabled on your account.

    **Threat model (default mode):** protects against DB dumps; does
    NOT protect against the operator (anyone with .env access can
    decrypt). User-passphrase-protected mode is on the roadmap as
    opt-in.

settings.byok_broker:
  title: Your Broker Connection
  body: |
    BYOK for your broker (Alpaca). Paste your own Alpaca API key +
    secret + base URL — the codebase uses yours instead of the
    operator's defaults.

    Paper URL: `https://paper-api.alpaca.markets/v2`
    Live URL: `https://api.alpaca.markets/v2`

    "Test connection" hits Alpaca's `/account` endpoint — no orders
    placed, no positions changed, just verifies auth works.

lessons.progress:
  title: Your progress
  body: |
    Tracks completion across the 3 curriculum levels: **Beginner**
    (foundational investing concepts), **Intermediate** (how FathomDesk
    specifically works), **Advanced** (reserved for Phase 6.5). Each
    lesson you finish marks your progress bar.

    Featured for the casual + student personas. No quizzes yet — marking
    a lesson "complete" is your own honor-system attestation.

api_keys.create:
  title: Generate a token
  body: |
    Create a personal API token for programmatic access. Pass it as
    `Authorization: Bearer ad_live_...`. Optional TTL ensures tokens
    auto-expire (recommended for CI/notebooks; leave blank for long-lived
    integrations).

    Step-up MFA required when MFA is enabled on your account.

api_keys.list:
  title: Your tokens
  body: |
    Every token you've created — showing the last-4 mask (full token is
    visible ONCE at creation, never again). Status indicates active /
    revoked / expired. Click Revoke to invalidate a token immediately;
    subsequent API calls with that token return 401.

api_keys.curl_examples:
  title: Example curl commands
  body: |
    Ready-to-use curl recipes for the most common endpoints. Replace
    `$TOKEN` with your generated token + `YOUR_HOST` with your
    deployment URL. Includes a pandas example showing how to pipe a
    CSV export directly into a DataFrame.

clients.total_count:
  title: Clients
  body: |
    Count of members in the current workspace (tenant). For advisors,
    this maps to your client book; for family offices, your relatives;
    for classrooms, your students.

clients.total_orders:
  title: Total orders
  body: |
    Aggregate paper-trading orders placed across all clients in this
    workspace. Useful to gauge overall engagement.

clients.total_analyses:
  title: Total analyses
  body: |
    Aggregate /analysis runs across all clients. A good proxy for how
    much clients are learning/researching.

clients.active_alert_rules:
  title: Active alert rules
  body: |
    Count of enabled alert rules across all clients' configurations.

clients.roster:
  title: Client roster
  body: |
    Per-client activity summary: display name, email, role, paper-order
    count, analysis-run count, active alert-rule count, last-login date,
    join date. CSV export included.

clients.share_audit:
  title: Share links — audit
  body: |
    Every share-link token issued for this workspace. Each row shows:
    kind (today: `portfolio_brief` only — more kinds later), token hash
    prefix, creation + expiry dates, use count, and status (active /
    expired / revoked).

    Click "Revoke" to invalidate an active link immediately — the URL
    stops working on the next request.

rebalance.total_value:
  title: Total value
  body: |
    Current portfolio value = cash + positions marked at their stored
    market value. For a mark-to-market (live prices), use /portfolio.

rebalance.cash:
  title: Cash
  body: |
    Your unallocated cash balance. Phase 4 rebalance treats anything
    not in the target table as "target cash" — so if your target adds
    to 90%, the remaining 10% is cash held on purpose.

rebalance.drift:
  title: Total drift
  body: |
    Sum of |current% − target%| across all positions, measured in
    percentage points. A 60/40 target with a 70/30 actual has
    10 + 10 = 20pp drift.

rebalance.flagged:
  title: Flagged trades
  body: |
    Positions where the drift from target is ≥ 5 percentage points —
    the rule-of-thumb "worth rebalancing" threshold. Lower drift is
    usually rounding noise; 5pp is when real action helps.

rebalance.targets:
  title: Target allocation
  body: |
    Set your desired mix — one row per ticker, percentage weight.
    Use a template (60/40, Three-Fund, Permanent Portfolio, 100% Equity)
    as a starting point or type your own. Anything you don't allocate
    becomes target cash automatically.

    Sum ≤ 100% is valid (the rest is cash). Sum > 100% is rejected.

rebalance.plan:
  title: Rebalance plan
  body: |
    Given your target + current holdings, the specific buy/sell trades
    needed to reach target. Positive $ = buy, negative $ = sell.
    Drift is computed as (current% − target%) in percentage points;
    positive drift means overweight vs target.

    Rows are sorted by absolute drift (biggest issues first). Rows with
    |drift| ≥ 5pp are flagged ⚠ — these are the ones most worth acting on.
    Lower drift is usually within rebalance-noise tolerance.

rebalance.tax_loss:
  title: Tax-loss harvest candidates
  body: |
    Positions with unrealized losses of ≥ 8% AND ≥ $500. Realizing
    these losses lets you offset capital gains elsewhere (up to
    $3k/year of ordinary income if capital losses exceed gains).

    **This is not tax advice.** Watch the 30-day wash-sale rule
    (selling at a loss and buying "substantially identical" within 30
    days disallows the loss). Consult your tax pro for actual strategy.

today.overview:
  title: ☕ Today
  body: |
    Plain-English morning digest — what FathomDesk thinks you should
    consider today. Scans 10 rules across your portfolio, positions,
    watchlist, news flow, alerts, and macro regime; surfaces up to 5
    prioritized actions.

    Rules cover: single-name concentration risk, regime mismatch
    (cash-heavy in risk-on / fully-invested in risk-off), SROR danger
    snapshots, high-conviction BUY signals on your watchlist, severe
    news impact on holdings, stale daily snapshots, cash deployment,
    unread alert backlog, big winners worth profit-taking, big losers
    worth a stop-loss review.

    Every action lists the specific evidence that triggered it, so you
    can trace the reasoning. Featured for casual + student personas.
    Quants hide it (they want raw data, not narrative).

today.how_it_works:
  title: How this works
  body: |
    Deterministic rule engine — same inputs always produce the same
    digest. No LLM, no black box, no "AI magic." Rule definitions live
    in `tools/trading/analytics/today_digest.py` so you can audit the
    thresholds + logic.

    Refreshes every 5 minutes automatically. An empty digest means the
    system genuinely doesn't see anything urgent — that's the goal, not
    a bug.

settings.tenant:
  title: Workspace
  body: |
    A **workspace** is a shared environment where you and your team
    operate together. You can belong to multiple workspaces (your
    firm + your family + a classroom) and switch between them via
    the 🏢 menu in the sidebar.

    **Roles:** owner (full control), admin (workspace settings + invites),
    member (use), viewer (read-only).

    **Invite a teammate:** owners + admins can email an invitation; the
    recipient signs up (or signs in) at the link and joins automatically.
    Step-up MFA is required to send.

    **Branding & white-label** (Phase 3.3): set a logo URL + accent color
    + flip the white-label toggle. The sidebar header, page title, and
    PDF brief now use your workspace name/logo instead of "FathomDesk" —
    perfect for advisors sharing reports with clients.

settings.account:
  title: Account
  body: |
    The signed-in account that owns the data on this dashboard. Phase 2A.1
    landed: real email/password auth, server-side sessions, password change
    flow, and per-session revoke.

    Phase 2A.2 (next) adds social login (Google/Microsoft/GitHub) +
    forgot-password. Phase 2A.3 adds TOTP/passkey MFA. Phase 3 adds
    multi-tenant team membership; until then everyone shares the
    `default` tenant.

settings.profile:
  title: Profile
  body: |
    Pick a persona preset (Casual Investor / Active Trader / Quant /
    Advisor / Student / etc.) and FathomDesk reshapes itself: which
    sidebar pages appear, which cards on each page, the Reading tone
    (plain English vs PM-style vs technical), and a few other defaults.

    Personas are defined in `args/persona_presets.yaml` and hot-reload
    on file change. Applying a preset is destructive of your manual
    layout settings; any field you tweak afterward sticks until you
    re-apply.

    Phase 1 (single-user mode): one profile shared by anyone using this
    dashboard. Phase 2 will add per-user profiles tied to login.

# ── /alerts ─────────────────────────────────────────────────────────────
alerts.rule_count:
  title: Rules
  body: |
    Total alert rules you've created (enabled + disabled). Disabled rules
    aren't evaluated by the daemon — toggle the checkbox in the table to
    re-enable.

alerts.enabled_count:
  title: Enabled
  body: |
    Rules that the `alert_evaluator` reflex will evaluate on its 1-minute
    cadence. Each rule's own `cooldown_minutes` prevents the same rule
    from firing repeatedly on the same condition.

alerts.unack_count:
  title: Unacked Alerts
  body: |
    Fired alerts you haven't dismissed. Mirrors the count shown on the
    🔔 bell badge in the sidebar. Click "Ack all" or per-row "Ack" to
    clear.

alerts.create:
  title: Create rule
  body: |
    Build a triggering rule from 6 types:

    • **Price % change** — ticker price moved more than X% over lookback
    • **Composite score** — latest signal score crosses a threshold
    • **Confidence** — latest signal confidence crosses a threshold
    • **Signal direction flip** — latest direction differs from prior
    • **News impact (Σ)** — aggregated news impact over lookback
    • **Macro regime change** — fires whenever the macro regime label
      changes; first eval records baseline (no fire)

    `cooldown_minutes` enforces the minimum time between fires of the
    same rule, regardless of the underlying condition.

alerts.rules:
  title: Active rules
  body: |
    All your rules with their last evaluation timestamp + last computed
    value. Toggle the **Enabled** checkbox to skip a rule without
    deleting it. The **✕** button removes the rule permanently (alert
    log entries from that rule remain for audit).

alerts.suggested:
  title: 💡 Suggested for your persona
  body: |
    Pre-configured alert rules tailored to your active persona (set in
    Settings → Profile). Pick the ones you want and click "+ Add selected"
    to copy them into your active rules.

    Some rules use placeholder subjects (`WATCHLIST_ANY`, `PORTFOLIO_DRAWDOWN`,
    etc.) the alert evaluator can't resolve yet — Phase 4 work. Those rows
    are flagged with a ⚠ marker; if you add them they're inert until
    that lands. Default checkbox state reflects current evaluator support.

alerts.recent:
  title: Recent alerts
  body: |
    Append-only log of fired alerts (`ad_alerts_log`). Color-coded by
    severity (info / warning / critical). Acknowledged entries are
    grayed out. The bell badge in the sidebar tracks unacked count
    across all sessions.

alerts.export_csv:
  title: ⬇ Rules CSV
  body: |
    Server-side CSV of every alert rule with full metadata (rule_type,
    subject, comparison, threshold, lookback, cooldown, severity,
    enabled, last triggered/evaluated, last value, created_at). Useful
    for backing up rules, sharing across environments, or bulk auditing.

alerts.log_csv:
  title: ⬇ Log CSV
  body: |
    Server-side CSV of the append-only fired-alert log
    (`ad_alerts_log`). Includes raw evidence_json so the trigger
    conditions can be replayed/audited later. Honors `?unack=1` and
    `?limit=N` query args.

market.heatmap_csv:
  title: ⬇ Heatmap CSV
  body: |
    Server-side CSV snapshot of the entire heatmap (200+ tickers) joined
    with multi-timeframe returns (1Y/5Y/10Y/20Y) + 24h aggregated news
    impact + KG centrality/supply-chain/competitor counts. Includes
    every ticker, not just the filtered subset shown on screen — use
    this for bulk analysis in Excel/Pandas.

news.export_csv:
  title: ⬇ News CSV
  body: |
    Server-side CSV of recent news items with classification (category,
    impact_level, net_direction), cluster join (cluster_id, scenario_key,
    status), and aggregate impact metrics (total Σ, trace count,
    impacted-ticker count). Honors `?category=...` and `?limit=N`
    query args.

# ───────────────────────────────────────────────────────────────────
# /options — Paper Options Trading page
# ───────────────────────────────────────────────────────────────────

options.target:
  title: Active Sandbox
  body: |
    Selects which paper portfolio your trades are booked into.

    The Free Paper Account ($100K) is always available — no challenge
    required. Positions, cash, and P&L persist across sessions until
    you click Reset.

    Challenge sandboxes appear here when you have an active challenge
    attempt. Each challenge has its own isolated portfolio and rules.

    Use Reset to wipe all positions and restore $100K to the paper
    account at any time.

options.tabs:
  title: Options Trading Tabs
  body: |
    Three ways to build and place option trades:

    Chain — Browse live bid/ask/IV/delta for every strike and expiry.
    Click Trade on any contract to open a single-leg order.

    Strategy Builder — Select a named strategy (covered call, iron
    condor, calendar spread, etc.), enter strikes and expiry, then
    submit the full multi-leg order atomically to your sandbox.

    AI Assist — Describe your thesis in plain English ("bullish AAPL,
    short-term, low risk") and the AI picks the strategy, strikes, and
    expiry for you. Review the proposal, then execute with one click.

options.chain:
  title: Option Chain
  body: |
    Live options chain fetched from Alpaca (real market data) with a
    yfinance fallback when markets are closed.

    Columns shown: Bid, Ask, IV (implied volatility, annualized), and
    Delta for both calls and puts at each strike. The chain refreshes
    on demand — click Refresh to force a new fetch.

    Click Trade on any row to pre-fill a single-leg order in your
    active sandbox. IV is color-coded: high IV (>60%) is flagged in
    amber — elevated premiums favor selling strategies.

options.strategy:
  title: Strategy Builder
  body: |
    Build a named multi-leg strategy and submit it as a single atomic
    order to your sandbox. All legs fill simultaneously — no partial
    fills that leave you with unintended exposure.

    Select a strategy from the dropdown (20 strategies across novice,
    intermediate, and advanced complexity). Enter the underlying ticker,
    current price, expiry date, and strikes for each leg.

    Click Compute Payoff to preview the P&L curve before committing.
    The chart shows max profit, max loss, and breakeven prices at expiry.

    Calendar and diagonal strategies require two expiry dates — a
    near-term and far-term leg. The form updates automatically when
    you select a multi-expiry strategy.

options.ai_assist:
  title: AI Assist
  body: |
    Describe your market thesis in plain English and the AI builds a
    complete options proposal for you.

    Examples: "neutral TSLA, sell premium", "bullish SPY into earnings",
    "hedge my portfolio against a 10% drop".

    The AI parses your intent, selects the best-fit strategy from the
    library, picks delta-targeted strikes from the live chain, runs a
    preflight check (margin, buying power, risk limits), and explains
    the trade in plain language.

    Review the proposed legs and payoff chart, then click Execute to
    book the trade into your active sandbox.

options.positions:
  title: My Option Positions
  body: |
    Open option positions in your active sandbox, marked to live mid
    prices. P&L updates each time you refresh or place a new order.

    Greeks shown (Delta, Gamma, Theta, Vega) are per-position, computed
    from Black-Scholes at current IV. Net portfolio Greeks appear in
    the summary row.

    Positions are settled at expiry: ITM options receive intrinsic
    value in cash; OTM options expire worthless. Use the sandbox Reset
    button to clear all positions and start fresh.

options.combo:
  title: AI Combo Analyzer
  body: |
    Tests all 20 strategies individually against live chain data, then
    evaluates every possible two-strategy combination to find synergistic
    edges.

    Each strategy is scored on three factors:
    - Probability of Profit (Monte Carlo, 8,000 paths, lognormal GBM)
    - Expected P&L relative to max risk
    - Theta efficiency (time decay per dollar at risk)

    Combos are ranked by a weighted composite edge score and graded
    S/A/B/C. Industry names are shown where they exist (e.g. Calendar
    Risk Reversal, Double Diagonal, Wheel Strategy).

    The ticker dropdown is pre-loaded with FathomDesk's top-ranked
    signals — sorted by composite score so the best opportunities
    appear first. You can also type any ticker freely.

    Click Build This Trade to pre-fill the Strategy Builder above, or
    Execute in Paper Account to book the combined legs directly.
