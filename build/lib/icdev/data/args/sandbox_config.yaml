# CUI // SP-CTI
# Phase 71/72 — Sandbox Executor Configuration (D-SEC-10, D-SEC-11)
# Container-isolated code execution for marketplace validation,
# agent output verification, capability evaluation, CodeLens testing,
# CI/CD contributor verification, and Genesis mutation safety.

sandbox:
  enabled: true
  runtime: docker           # docker | kubernetes | podman

  # Resource limits
  default_timeout_seconds: 30
  max_timeout_seconds: 300
  default_max_memory_mb: 512
  max_memory_mb: 2048
  default_cpu_count: 1

  # Network isolation (default: no network access)
  network_enabled: false

  # Container images per language
  images:
    python: "python:3.12-slim"
    javascript: "node:20-slim"
    java: "eclipse-temurin:21-jre-jammy"
    go: "golang:1.22-bookworm"

  # Lifecycle
  cleanup_containers: true
  max_concurrent_sessions: 4

  # Audit
  audit_all_executions: true

  # OPT-63: Auto-recreate sandbox on container failure
  # On ContainerNotFoundError / ConnectionRefusedError / docker RuntimeError:
  #   rebuild the container and retry.
  # Backoff: immediate on 1st rebuild, backoff_seconds before 2nd, then fail.
  auto_recreate:
    enabled: true
    max_retries: 2          # Maximum number of container rebuilds per execute() call
    backoff_seconds: 10     # Seconds to wait before the 2nd rebuild attempt

  # --- Integration-specific overrides (Phase 72, D-SEC-11) ---

  # CodeLens / test_orchestrator: sandbox isolation step 2.5
  codelens:
    max_files: 15             # Cap files per run to keep total time < 120s
    timeout_per_file: 15      # Seconds per file sandbox execution
    skip_on_unavailable: true # Graceful degradation — don't block pipeline

  # CI/CD: contributor PR verification
  ci_cd:
    timeout_per_file: 30      # More time in CI (Docker-in-Docker overhead)
    fail_on_error: true       # Block merge if sandbox fails

  # Marketplace / OpenClaw: asset installation verification
  marketplace:
    max_files: 20             # Cap files per asset
    timeout_per_file: 15
    block_on_failure: true    # Reject install if sandbox fails

  # Genesis Evolve: mutation code verification
  genesis:
    timeout_per_file: 30
    confidence_penalty: 0.10  # Reduce confidence by this amount on sandbox failure
