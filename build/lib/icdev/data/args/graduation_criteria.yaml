# CUI // SP-CTI
# FathomDesk live-trading graduation criteria — Phase 6.6.
#
# ⚠ COMPLIANCE-SENSITIVE
# ----------------------
# This file defines the gate between paper trading (always allowed) and
# live broker orders (blocked until the criteria below are ALL met).
#
# The gate enforces at the broker-adapter level (tools/trading/brokers/
# alpaca_adapter.py). Bypassing it requires operator intent — setting
# `ICDEV_GRADUATION_ENFORCED=false` in the environment disables the gate
# entirely. That env is intended for dev / CI only. Production operators
# should leave the gate ON and, if needed, adjust these thresholds.
#
# Risk disclosure copy in `risk_disclosure.text` is a reasonable default,
# but operators deploying to real end-users SHOULD replace it with legal-
# counsel-reviewed language before production. The UI reveals this text
# verbatim.
#
# Hot-reloaded via file-mtime cache (tools/trading/progression/graduation.py).

_schema_version: 1

# Master switch. Setting to false here turns the gate off for everyone
# even when ICDEV_GRADUATION_ENFORCED is unset. Keep on by default.
enabled: true

criteria:
  # ─── Min paper-trading tenure ─────────────────────────────────────
  # Days since the user's first XP event (proxy for "first time they
  # actually used the system"). Gives them time to observe regime cycles.
  paper_days:
    label: "Paper-trading tenure"
    description: "You've been using FathomDesk for at least this many days."
    min_days: 30

  # ─── Min completed analyses ────────────────────────────────────────
  # Counted from ad_analysis_runs for this user. Demonstrates engagement
  # beyond passive watching.
  analyses_completed:
    label: "Analyses run"
    description: "Ran enough analyses to understand the signal workflow."
    min_count: 25

  # ─── Min achievements earned ──────────────────────────────────────
  # Counted from ad_user_achievements. Cross-checks that the user has
  # worked through varied skills — not just one badge farmed repeatedly.
  achievements_earned:
    label: "Achievements earned"
    description: "Earned enough badges across different skills."
    min_count: 5

  # ─── Paper-account Sharpe floor ───────────────────────────────────
  # Computed from ad_pf_daily_snapshots daily returns, annualized
  # Sharpe = mean(returns) / std(returns) * sqrt(252). Requires at least
  # `min_snapshots` days of history — thinner than that auto-fails.
  sharpe_floor:
    label: "Paper Sharpe ratio (90-day)"
    description: "Your paper portfolio has produced a respectable risk-adjusted return."
    min_sharpe: 0.5
    window_days: 90
    min_snapshots: 30   # need at least 30 daily points for a meaningful stat

  # ─── Risk disclosure acknowledgement ──────────────────────────────
  # User must click through the modal below. Timestamp persisted on
  # ad_user_progression.risk_disclosure_acknowledged_at.
  risk_disclosure:
    label: "Risk disclosure"
    description: "You've acknowledged the risks of live trading."
    required: true

# ─── Phase 7.5 follow-up C — options-specific gate criteria ──────────
# These additional criteria gate LIVE option orders (paper options are
# unrestricted). The equity gate above still applies; this is additive.
# Evaluated only when a live option order is attempted.
options_criteria:
  # User must have placed at least this many paper option orders in the
  # sandbox before being allowed to submit live option orders.
  paper_option_trades:
    label: "Paper option trades completed"
    description: "Practiced enough option trades in the sandbox to understand the mechanics."
    min_count: 10

  # User's Alpaca account must be approved at (or above) this options
  # trading level. Alpaca levels:
  #   1 = covered calls / cash-secured puts
  #   2 = Level 1 + long calls / long puts
  #   3 = Levels 1-2 + spreads (multi-leg strategies)
  # Live single-leg requires Level 2; multi-leg requires Level 3. The
  # gate queries /v2/account/configurations at runtime.
  alpaca_approval_level:
    label: "Alpaca options approval tier"
    description: "Your broker account is approved for options trading at the appropriate level."
    min_level_single_leg: 2
    min_level_multi_leg: 3

# Options risk-disclosure addendum — appended to the main disclosure
# when the user first attempts a live option order. Operators should
# replace with legal-counsel-reviewed language before production.
options_risk_disclosure:
  heading: "Additional risks of options trading"
  text: |
    Options trading carries significantly greater risk than stock trading.

    An option is a contract that may expire worthless — you can lose
    100% of the premium paid on a single trade in days or hours.

    SHORT options (selling to open) can carry UNCAPPED LOSSES. A naked
    short call has theoretically unlimited downside if the stock rises;
    a short put can cost up to strike × 100 × contracts if the stock
    goes to zero.

    Each standard equity option contract represents 100 shares. A
    single-contract move can produce outsized P&L swings vs the
    underlying stock.

    Assignment risk is real: a short option holder may be forced to
    buy or sell 100 shares at the strike at any time (American-style
    options). You may not have the cash or shares to deliver.

    Implied volatility crush after earnings can erase long option
    value even when your directional view is correct.

    Spreads and multi-leg strategies can appear to have defined risk
    but still carry pin risk, early-assignment risk, and liquidity risk.

    By acknowledging this disclosure, you confirm that you have read
    and understood the above, and you accept sole responsibility for
    every live option order you submit.

# Copy shown in the risk-disclosure modal. Replace with legal-reviewed
# language before production (see top-of-file note). Plain text; newlines
# render as paragraph breaks in the modal.
risk_disclosure:
  heading: "Before you trade real money — read this carefully"
  text: |
    FathomDesk is a decision-support tool, not investment advice.

    Paper trading results do not guarantee future live-trading results.
    Live markets introduce slippage, fees, order rejections, overnight
    gaps, and psychological pressure that the paper environment does
    not fully reproduce.

    You can lose money quickly. Do not invest money you cannot afford
    to lose. Past returns — yours or anyone else's — are not indicative
    of future returns.

    FathomDesk's signals, analyses, scenarios, and educational content
    are generated by deterministic rules and statistical models. They
    can be wrong. Large losses are possible. You alone are responsible
    for every order you submit.

    By acknowledging this disclosure, you confirm that you have read
    and understood the above, and that you are submitting live orders
    at your own risk.
