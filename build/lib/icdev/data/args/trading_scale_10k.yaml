# FathomDesk — SCALE-10K preset (Phase 4 tier 1)
#
# Promotes from micro_live ($5k, 0.5%) after ≥1 week clean execution.
# Doubles capital, raises position cap to 1%, still BUY-only, still tight halts.

fathomdesk:
  version: "4.0.0-scale-10k"
  mode: "live"
  rollout_phase: "scale_10k"

  watchlist:
    equities: ["AAPL", "MSFT", "GOOGL", "NVDA", "META", "AMZN", "TSLA"]
    crypto: []

  risk:
    max_portfolio_usd: 10000.0
    max_position_pct: 0.010          # 1.0%
    max_positions: 8
    max_orders_per_day: 8
    max_orders_per_ticker_per_day: 1
    daily_loss_limit_pct: -0.015     # -1.5% halt
    drawdown_warn_pct: -0.0075
    drawdown_halt_pct: -0.015
    max_portfolio_var: 0.025

  analysis:
    debate_rounds: 3
    min_confidence: 0.70
    auto_execute: true
    auto_approve_buy_min_confidence: 0.80
    require_human_approval_for_sell: true

  signal_weights:
    fundamental: 0.25
    technical: 0.20
    sentiment: 0.10
    news: 0.10
    macro: 0.25
    perspective: 0.10

  shorting:
    enabled: false                    # still off

  broker:
    provider: "alpaca"
    base_url_env: "ALPACA_BASE_URL"
    cancel_open_orders_on_kill: true

  audit:
    persist_every_event: true
    retain_days: 365
