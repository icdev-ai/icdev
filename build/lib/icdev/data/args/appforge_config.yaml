# AppForge Daemon Configuration
# Autonomous vertical discovery + app builder + Pulse writer

enabled: true

llm:
  tier: scanner
  model: qwen3.5-local
  timeout_seconds: 120

trust_kernel:
  circuit_breaker:
    max_consecutive_failures: 3
    cooldown_minutes: 60
  kill_switch:
    max_auto_actions_per_hour: 5
  allowed_actions:
    green:
      - fetch_url
      - query_database
      - write_data
      - log_audit
      - write_file
      - create_directory

paths:
  apps_dir: "apps/"
  data_dir: "data/appforge/"

reflexes:
  discover:
    enabled: true
    risk_tier: green
    schedule: "daily 06:00"
    description: "Scan innovation/creative/research engines for high-value challenges"
    success_metric:
      name: challenges_discovered
      threshold: 0
      operator: gte

  evaluate:
    enabled: true
    risk_tier: green
    schedule: "daily 07:00"
    description: "Score and select the top challenge to build"
    success_metric:
      name: challenge_score
      threshold: 0
      operator: gte

  architect:
    enabled: true
    risk_tier: green
    schedule: "daily 08:00"
    description: "Generate app blueprint from selected challenge"
    success_metric:
      name: entity_count
      threshold: 0
      operator: gte

  build:
    enabled: true
    risk_tier: green
    schedule: "daily 09:00"
    description: "Create standalone child app from blueprint"
    success_metric:
      name: app_built
      threshold: 0
      operator: gte

  publish:
    enabled: true
    risk_tier: green
    schedule: "daily 10:00"
    description: "Write and publish Pulse article about built app"
    success_metric:
      name: quality_score
      threshold: 0
      operator: gte

# Verticals to scan (all industries)
verticals:
  - "Defense & Intelligence"
  - "Healthcare & Life Sciences"
  - "Financial Services & Banking"
  - "Energy & Utilities"
  - "Transportation & Logistics"
  - "Manufacturing & Industrial"
  - "Cybersecurity & InfoSec"
  - "Government & Civic Tech"
  - "Education & Research"
  - "Agriculture & Environment"
  - "Telecommunications"
  - "Telecommunications / ISP Transit"
  - "Telecommunications / ISP Peering & Interconnect"
  - "Telecommunications / Enterprise WAN & SD-WAN"
  - "Telecommunications / Carrier Ethernet & MEF 3.0"
  - "Telecommunications / Wholesale & Access Networks"
  - "Space & Aerospace"
