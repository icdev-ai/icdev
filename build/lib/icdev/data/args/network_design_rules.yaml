# ── Network Design Rulebook ─────────────────────────────────────────────────
# Deterministic rules for proactive network design guidance.
# No LLM required — works fully air-gapped.
#
# Structure:
#   on_node_add:   Fires when a node type is dropped onto canvas
#   on_edge_add:   Fires when a link is created between two node types
#   best_practices: Category-grouped design best practices
#   checklists:    Per-node-type required/recommended config fields

on_node_add:
  router:
    suggestions:
      - "Connect to at least 2 upstream devices for redundancy (NIST CP-8)"
      - "Configure a loopback interface (/32) for stable OSPF/BGP router-id"
      - "Enable OOB management interface on dedicated VLAN"
      - "Add VRRP/HSRP peer if this router serves as a default gateway"
    checklist:
      routing_protocol:
        required: true
        options: [OSPF, BGP, EIGRP, ISIS, Static]
        hint: "OSPF for internal, BGP for external/WAN peering"
      loopback_ip:
        required: true
        hint: "Use /32 from infrastructure block (e.g., 10.255.0.x/32)"
      management_ip:
        required: true
        hint: "OOB management VLAN (e.g., VLAN 999)"
      hostname:
        required: true
        hint: "Follow naming convention: {site}-{role}-{number} (e.g., hq-core-01)"
      asn:
        required: false
        hint: "Required for BGP — use private ASN 64512-65534 for internal"
    auto_suggest_connections:
      - match_type: switch-l3
        max_distance: 300
        message: "Connect to distribution switch via 10GbE trunk (LACP recommended)"
      - match_type: firewall
        max_distance: 400
        message: "Route through firewall for external/DMZ access"
      - match_type: router
        max_distance: 500
        message: "Consider iBGP/OSPF adjacency for path redundancy"
    warnings:
      - condition: single_uplink
        severity: high
        message: "Single point of failure — add a second uplink path"

  switch-l3:
    suggestions:
      - "Configure STP root priority if this is the distribution layer (4096 for primary)"
      - "Enable LACP (802.3ad) on all uplink bundles"
      - "Segment VLANs by function: data, voice, management, guest"
      - "Enable DHCP snooping and dynamic ARP inspection on access VLANs"
    checklist:
      stp_priority:
        required: false
        hint: "4096 for root bridge, 8192 for secondary root"
      vlan_trunking:
        required: true
        hint: "Configure 802.1Q trunks on uplinks"
      management_vlan:
        required: true
        hint: "Isolate management traffic (VLAN 999)"
      spanning_tree_mode:
        required: true
        options: [RSTP, MSTP, PVST+]
        hint: "RSTP for fast convergence, MSTP for large environments"
    auto_suggest_connections:
      - match_type: switch-l2
        max_distance: 250
        message: "Downlink to access switch — configure as trunk with allowed VLANs"
      - match_type: router
        max_distance: 300
        message: "Uplink to core router — use LACP port-channel"
      - match_type: wap
        max_distance: 200
        message: "Connect WAP via access port (data VLAN + voice VLAN)"

  switch-l2:
    suggestions:
      - "Configure as access layer — connect endpoints and uplink to distribution"
      - "Enable port security to limit MAC addresses per port"
      - "Configure storm control on all access ports"
    checklist:
      access_vlan:
        required: true
        hint: "Assign access VLAN for connected endpoints"
      voice_vlan:
        required: false
        hint: "Separate voice VLAN for IP phones"
      port_security:
        required: false
        hint: "Limit to 2-3 MAC addresses per access port"
    auto_suggest_connections:
      - match_type: switch-l3
        max_distance: 400
        message: "Uplink to distribution switch — dual uplinks recommended"
      - match_type: endpoint-pc
        max_distance: 150
        message: "Access port connection for workstation"

  firewall:
    suggestions:
      - "Place between trust zones (internal/DMZ/WAN)"
      - "Configure HA pair — active/standby minimum for production"
      - "Default deny policy — only permit explicitly required traffic"
      - "Enable logging for all deny rules (NIST AU-3)"
    checklist:
      ha_mode:
        required: true
        options: [standalone, active-standby, active-active]
        hint: "Active/standby for most deployments"
      default_policy:
        required: true
        options: [deny-all, permit-all]
        hint: "Always default deny (NIST AC-4)"
      zone_config:
        required: true
        hint: "Define zones: inside, outside, DMZ, management"
      failover_link:
        required: false
        hint: "Dedicated link between HA peers (not through switch)"
    auto_suggest_connections:
      - match_type: router
        max_distance: 400
        message: "Connect to core/edge router — outside interface"
      - match_type: switch-l3
        max_distance: 300
        message: "Connect to distribution switch — inside interface"
    warnings:
      - condition: no_ha_peer
        severity: high
        message: "Single firewall is a critical SPOF — add HA peer"
      - condition: no_router_connection
        severity: medium
        message: "Firewall not connected to any routing device"

  load-balancer:
    suggestions:
      - "Deploy in HA pair for service continuity"
      - "Place behind firewall, in front of server farm"
      - "Configure health checks for all backend pools"
    checklist:
      vip_address:
        required: true
        hint: "Virtual IP for client-facing services"
      ha_mode:
        required: true
        options: [standalone, active-standby, active-active]
      health_check:
        required: true
        options: [TCP, HTTP, HTTPS, ICMP]
    auto_suggest_connections:
      - match_type: server
        max_distance: 250
        message: "Backend server pool connection"
      - match_type: firewall
        max_distance: 300
        message: "Frontend connection through firewall"

  wap:
    suggestions:
      - "Connect to distribution or access switch via PoE port"
      - "Assign to WLC for centralized management"
      - "Configure separate SSIDs for corporate and guest"
    checklist:
      ssid_corporate:
        required: true
        hint: "WPA3-Enterprise with 802.1X"
      ssid_guest:
        required: false
        hint: "Isolated guest VLAN with captive portal"
      channel:
        required: false
        hint: "Use non-overlapping channels (1, 6, 11 for 2.4GHz)"
    auto_suggest_connections:
      - match_type: wlc
        max_distance: 500
        message: "Register with Wireless LAN Controller"
      - match_type: switch-l2
        max_distance: 200
        message: "Uplink via PoE access port"

  server:
    suggestions:
      - "Dual-home to two access/distribution switches for NIC redundancy"
      - "Place in appropriate security zone (app tier, DB tier)"
      - "Configure NIC teaming/bonding for link aggregation"
    checklist:
      nic_teaming:
        required: false
        hint: "LACP or active-backup bonding"
      security_zone:
        required: true
        options: [app-tier, db-tier, web-tier, management]
    auto_suggest_connections:
      - match_type: switch-l3
        max_distance: 300
        message: "Dual-home to distribution switches"
      - match_type: load-balancer
        max_distance: 250
        message: "Backend pool member connection"

  # ── Encryption devices ──────────────────────────────────────────────────
  type1-encryptor:
    suggestions:
      - "Required for SECRET and above — NSA Type 1 (CNSS Policy 15)"
      - "Place between WAN router and carrier handoff"
      - "Verify speed rating matches circuit bandwidth"
    checklist:
      nsa_cert:
        required: true
        hint: "KG-175D (≤10G), KG-250 (≤100G), KG-340 (≤400G)"
      key_management:
        required: true
        options: [EKMS, KMI, manual]

  # ── Cloud ───────────────────────────────────────────────────────────────
  aws-vpc:
    suggestions:
      - "Use /16 CIDR for VPC (e.g., 10.x.0.0/16)"
      - "Create public and private subnets across 2+ AZs"
      - "Attach Internet Gateway only if public-facing required"
      - "Enable VPC Flow Logs to S3/CloudWatch for NIST AU-3 compliance"
      - "Add PrivateLink endpoints for S3, DynamoDB, and other AWS service access"
    checklist:
      cidr_block:
        required: true
        hint: "Non-overlapping with on-prem (RFC 1918)"
      enable_dns:
        required: true
      flow_logs:
        required: true
        hint: "Enable VPC Flow Logs to S3/CloudWatch (NIST AU-3)"
      availability_zones:
        required: true
        hint: "Deploy across 2+ AZs for high availability"
    auto_suggest_connections:
      - match_type: aws-tgw
        max_distance: 500
        message: "Attach VPC to Transit Gateway for centralized routing"
      - match_type: aws-nfw
        max_distance: 400
        message: "Route traffic through Network Firewall for inspection"

  az-vnet:
    suggestions:
      - "Use address space that doesn't overlap with on-prem or other VNets"
      - "Create NSG per subnet — default deny inbound"
      - "Enable Azure Bastion for secure management access"
      - "Enable VNet Flow Logs for traffic visibility (NIST AU-3)"
    checklist:
      address_space:
        required: true
        hint: "Non-overlapping CIDR (e.g., 10.y.0.0/16)"
      nsg_default:
        required: true
        hint: "Default deny inbound on all subnets"
      flow_logs:
        required: true
        hint: "Enable VNet Flow Logs with traffic analytics"
    auto_suggest_connections:
      - match_type: az-vwan
        max_distance: 500
        message: "Connect VNet to Virtual WAN hub for centralized routing"
      - match_type: az-fw
        max_distance: 400
        message: "Route traffic through Azure Firewall"

  gcp-vpc:
    suggestions:
      - "GCP VPCs are global — subnets span regions, no cross-region peering needed"
      - "Use /20 per subnet (regional), plan for expansion"
      - "Enable VPC Flow Logs with sampling rate tuned for cost vs visibility"
      - "Enable Private Google Access on all subnets for private service access"
    checklist:
      subnet_cidr:
        required: true
        hint: "Regional subnets — plan /20 per region"
      flow_logs:
        required: true
        hint: "Enable with configurable sampling (0.5 default, 1.0 for compliance)"
    auto_suggest_connections:
      - match_type: gcp-router
        max_distance: 400
        message: "Attach Cloud Router for BGP dynamic routing"

  oci-vcn:
    suggestions:
      - "Use /16 CIDR for VCN, /24 per subnet"
      - "Leverage OCI Fault Domains (3 per AD) for three-tier isolation"
      - "Enable VCN Flow Logs for audit compliance"
      - "OCI egress is ~10x cheaper than AWS/Azure/GCP — factor into cost optimization"
    checklist:
      cidr_block:
        required: true
        hint: "Non-overlapping CIDR (e.g., 10.z.0.0/16)"
      flow_logs:
        required: true
    auto_suggest_connections:
      - match_type: oci-drg
        max_distance: 500
        message: "Attach VCN to DRG for inter-VCN and hybrid connectivity"

  ibm-vpc:
    suggestions:
      - "IBM VPCs are regional — deploy across 3 zones per MZR"
      - "Enable Flow Logs for VPC for traffic capture"
      - "Use IBM Cloud Satellite for extending services to on-prem"
    checklist:
      address_prefix:
        required: true
      flow_logs:
        required: true
    auto_suggest_connections:
      - match_type: ibm-tg
        max_distance: 500
        message: "Connect VPC to Transit Gateway for multi-VPC connectivity"

  # ── Dedicated Interconnect (AWS Well-Architected Hybrid Networking Lens) ──
  aws-dx:
    suggestions:
      - "Deploy at 2+ diverse colocation facilities for 99.99% SLA (Maximum Resiliency)"
      - "ALWAYS enable BFD for sub-second failover (<1s vs 90s BGP default)"
      - "Configure Site-to-Site VPN as automatic backup for DX failure"
      - "Use Transit VIF for multi-VPC access; Private VIF only for high-bandwidth single VPC"
      - "DO NOT use LAG for HA — LAG terminates on single AWS device (SPOF)"
    checklist:
      bfd_enabled:
        required: true
        hint: "BFD every 300ms, 3x multiplier = <1s detection (vs 90s BGP)"
      location:
        required: true
        hint: "Colocation facility name (needed for diverse-path validation)"
      bandwidth:
        required: true
        options: [1G, 10G, 100G, 400G]
      vif_type:
        required: true
        options: [private, public, transit]
        hint: "Transit VIF for multi-VPC, Private VIF for single high-bandwidth VPC"
      vpn_backup:
        required: true
        hint: "IPSec VPN backup path configured"
    auto_suggest_connections:
      - match_type: aws-tgw
        max_distance: 500
        message: "Connect via Transit VIF for multi-VPC access"
      - match_type: aws-vpn
        max_distance: 600
        message: "Add VPN as automatic failover backup"
    warnings:
      - condition: single_connection
        severity: high
        message: "Single DX is a critical SPOF — no SLA guarantee without redundancy"
      - condition: no_bfd
        severity: high
        message: "Without BFD, failover takes ~90 seconds (3x BGP hold timer)"

  aws-dx-gw:
    suggestions:
      - "DX Gateway is a global config overlay — NOT a separate device, NOT a SPOF"
      - "DO NOT add a backup DX Gateway — it does NOT improve resilience (ARC322)"
      - "Associate up to 20 VGWs or 6 TGWs across Regions"
      - "Use DX Gateway to reach multiple Regions from a single DX location"
    checklist:
      associated_gateways:
        required: true
        hint: "List VGWs or TGWs to associate (max 20 VGWs or 6 TGWs)"

  az-er:
    suggestions:
      - "Deploy zone-redundant ExpressRoute for maximum availability"
      - "Enable BFD for sub-second failover detection"
      - "Configure VPN Gateway as backup for ExpressRoute"
      - "Use ExpressRoute Global Reach to connect on-prem sites via Microsoft backbone"
      - "ExpressRoute supports MACsec on ExpressRoute Direct (10/100 Gbps)"
    checklist:
      bfd_enabled:
        required: true
        hint: "BFD for fast failover detection"
      bandwidth:
        required: true
        options: [1G, 2G, 5G, 10G, 50G, 100G]
      peering_type:
        required: true
        options: [private, microsoft]
        hint: "Private peering for VNet access, Microsoft peering for M365/Azure PaaS"
      vpn_backup:
        required: true
        hint: "VPN Gateway as automatic backup"
    auto_suggest_connections:
      - match_type: az-vwan
        max_distance: 500
        message: "Connect ExpressRoute to Virtual WAN hub"
      - match_type: az-vpn-gw
        max_distance: 600
        message: "Add VPN Gateway as automatic failover backup"

  gcp-ic:
    suggestions:
      - "Deploy redundant VLAN attachments across 2+ metro areas for 99.99% SLA"
      - "Enable BFD on Cloud Router for sub-second failover"
      - "Configure HA VPN as backup for Interconnect"
      - "GCP supports MACsec on 100 Gbps Dedicated Interconnect"
      - "Use Partner Interconnect (50 Mbps–50 Gbps) if not near a colocation facility"
    checklist:
      bfd_enabled:
        required: true
      bandwidth:
        required: true
        options: [10G, 100G]
      interconnect_type:
        required: true
        options: [dedicated, partner]
    auto_suggest_connections:
      - match_type: gcp-router
        max_distance: 400
        message: "Attach to Cloud Router for BGP peering"
      - match_type: gcp-vpn
        max_distance: 600
        message: "Add HA VPN as automatic failover backup"

  oci-fc:
    suggestions:
      - "OCI FastConnect egress is FREE — no data transfer charges"
      - "Deploy redundant virtual circuits across diverse paths"
      - "Enable BFD on DRG for fast failover"
      - "OCI port costs are ~75% cheaper than AWS/Azure/GCP"
      - "VPN over FastConnect available for encrypted dedicated connectivity"
    checklist:
      bfd_enabled:
        required: true
      bandwidth:
        required: true
        options: [1G, 10G, 100G]
      redundant_circuit:
        required: true
        hint: "Second circuit on diverse path for resiliency"
    auto_suggest_connections:
      - match_type: oci-drg
        max_distance: 500
        message: "Connect FastConnect to DRG for multi-VCN routing"

  ibm-dl:
    suggestions:
      - "Deploy with diverse-path redundancy for high availability"
      - "IBM Direct Link does not support BGP on VPN — plan for static routing limitations"
      - "Use IBM Cloud Satellite to extend services beyond direct link reach"
    checklist:
      bandwidth:
        required: true
        options: [1G, 2G, 5G, 10G]
      diverse_path:
        required: true
        hint: "Deploy second Direct Link on diverse path"

  # ── Transit Hubs ──────────────────────────────────────────────────────────
  aws-tgw:
    suggestions:
      - "TGW uses Hyperplane distributed nodes — 99.99% SLA built-in"
      - "DO NOT add backup TGW for data plane resilience — already HA via Hyperplane"
      - "Consider Dev TGW for management plane safety (test config changes via CI/CD)"
      - "Use separate route tables for traffic isolation (e.g., per-VPC or per-tenant)"
      - "Transit VIF + GRE tunnels for hard noisy-neighbor isolation on DX"
    checklist:
      route_tables:
        required: true
        hint: "Separate tables for production, dev, shared services"
      default_route_table_association:
        required: false
        hint: "Disable for explicit routing control"
    warnings:
      - condition: backup_tgw
        severity: medium
        message: "TGW uses Hyperplane (99.99% SLA) — backup TGW adds NO data-plane resilience (ARC322 AP-003)"

  az-vwan:
    suggestions:
      - "Azure Virtual WAN is natively global — no need for cross-region peering"
      - "Supports integrated SD-WAN partner NVAs (Cisco, Palo Alto, etc.)"
      - "Use Routing Intent for simplified hub security policy"
      - "vWAN hub mesh provides automatic any-to-any routing"
    checklist:
      hub_regions:
        required: true
        hint: "Deploy hub in each region with workloads"
      routing_intent:
        required: false
        hint: "Enable for centralized security via Azure Firewall"

  oci-drg:
    suggestions:
      - "OCI DRG v2 supports transitive routing natively — unique among CSPs"
      - "DRG is FREE — no additional charges for transit routing"
      - "Use separate route tables per attachment type (VCN, IPSec, FastConnect)"
    checklist:
      route_tables:
        required: true
        hint: "Per-attachment-type tables for policy control"

  # ── Carrier/SP ──────────────────────────────────────────────────────────
  mpls-pe:
    suggestions:
      - "Configure VRF per customer/service for traffic isolation"
      - "Enable MPLS LDP or SR-MPLS for label distribution"
      - "Connect to route reflector for iBGP scale"
    checklist:
      vrf_name:
        required: true
        hint: "One VRF per customer or service"
      label_protocol:
        required: true
        options: [LDP, SR-MPLS, RSVP-TE]

  sdwan-edge:
    suggestions:
      - "Deploy with at least 2 WAN transports for path diversity"
      - "Configure application-aware routing policies"
      - "Enable IPSec tunnels to overlay controller"
    checklist:
      wan_transports:
        required: true
        hint: "Minimum 2: MPLS + DIA, or dual DIA"
      overlay_controller:
        required: true
        hint: "vManage/vSmart for Cisco, Orchestrator for others"

# ── IPv6 / Dual-Stack ─────────────────────────────────────────────────────
# These rules apply across all device types when IPv6 is enabled

ipv6_rules:
  readiness_checklist:
    - "Verify all equipment supports IPv6 (check ipv6_capable property)"
    - "Plan IPv6 addressing: /48 per site, /64 per VLAN/subnet"
    - "Enable dual-stack on all infrastructure devices before endpoints"
    - "Configure OSPFv3 or MP-BGP for IPv6 routing (not separate process)"
    - "Enable RA Guard on all access ports to prevent rogue RAs"
    - "Enable DHCPv6 snooping alongside DHCP snooping"
    - "Configure IPv6 ACLs — do NOT rely on IPv4 ACLs to cover IPv6"
    - "Enable NDP (Neighbor Discovery Protocol) inspection"
    - "Plan DNS: AAAA records + reverse PTR for all infrastructure"
    - "Test IPv6 failover independently — VRRP/HSRPv3 for IPv6 gateways"

  migration_phases:
    phase1_assessment:
      name: "Assessment & Inventory"
      tasks:
        - "Audit all devices for IPv6 capability (HW + SW version)"
        - "Identify devices requiring upgrade or replacement"
        - "Document current IPv4 addressing plan"
        - "Design IPv6 addressing plan (/48 per site, /64 per subnet)"
        - "Identify applications that need IPv6 support"
        - "Assess DNS infrastructure (split-horizon, AAAA records)"

    phase2_infrastructure:
      name: "Core Infrastructure (Dual-Stack)"
      tasks:
        - "Enable ipv6 unicast-routing on all routers"
        - "Configure OSPFv3 / MP-BGP address-family ipv6"
        - "Assign IPv6 addresses to loopbacks and infrastructure links"
        - "Configure dual-stack on core and distribution routers first"
        - "Enable HSRPv3/VRRPv3 with IPv6 virtual addresses"
        - "Update ACLs and firewall rules for IPv6 traffic"

    phase3_services:
      name: "Network Services"
      tasks:
        - "Configure DHCPv6 server/relay"
        - "Enable SLAAC or DHCPv6 per VLAN policy"
        - "Update DNS with AAAA records for all services"
        - "Configure NAT64/DNS64 for IPv4-only endpoints (if needed)"
        - "Enable IPv6 on load balancers (dual-stack VIPs)"
        - "Update monitoring (SNMP over IPv6, flow export)"

    phase4_access:
      name: "Access Layer & Endpoints"
      tasks:
        - "Enable dual-stack on access switches"
        - "Configure RA Guard and DHCPv6 snooping on all access ports"
        - "Enable NDP inspection"
        - "Roll out IPv6 to endpoint VLANs (SLAAC or DHCPv6)"
        - "Test endpoint connectivity and application access"
        - "Monitor dual-stack coexistence for issues"

    phase5_optimization:
      name: "Optimization & IPv4 Sunset Planning"
      tasks:
        - "Measure IPv6 vs IPv4 traffic ratios"
        - "Identify remaining IPv4-only dependencies"
        - "Plan IPv4 sunset timeline (if applicable)"
        - "Document lessons learned and update runbooks"
        - "Configure IPv6-preferred policies where ready"

  transition_mechanisms:
    dual_stack:
      description: "Run IPv4 and IPv6 simultaneously on all interfaces"
      use_when: "Default approach — recommended for most enterprise networks"
      pros: ["No translation overhead", "Gradual migration", "Full feature parity"]
      cons: ["Double the address management", "Double the routing tables", "Double the ACLs"]

    nat64_dns64:
      description: "Translate between IPv6-only clients and IPv4-only servers"
      use_when: "IPv6-only segments need to reach legacy IPv4 services"
      pros: ["Enables IPv6-only endpoints", "Reduces IPv4 dependency"]
      cons: ["Translation overhead", "Some applications break", "Stateful NAT complexity"]

    6to4_tunnels:
      description: "Encapsulate IPv6 in IPv4 tunnels across IPv4-only segments"
      use_when: "IPv6 islands separated by IPv4-only backbone (AVOID if possible)"
      pros: ["Quick connectivity"]
      cons: ["Deprecated (RFC 7526)", "Security risks", "Unreliable"]

    map_t:
      description: "MAP-T (Mapping of Address and Port using Translation)"
      use_when: "Service provider IPv6 transition with stateless translation"
      pros: ["Stateless", "Scalable"]
      cons: ["Complex", "Limited vendor support"]

  security:
    - "RA Guard: Prevent rogue Router Advertisement attacks on all access ports"
    - "DHCPv6 snooping: Prevent rogue DHCPv6 servers"
    - "NDP inspection: Prevent NDP spoofing (IPv6 equivalent of ARP spoofing)"
    - "IPv6 ACLs: MUST be configured independently — IPv4 ACLs do NOT filter IPv6"
    - "Disable IPv6 on interfaces where not needed (prevents shadow IPv6 attacks)"
    - "Enable IPv6 First Hop Security (FHS) suite on all L2 switches"
    - "ICMPv6: Do NOT block — required for PMTUD, NDP, SLAAC"
    - "Firewall: Must inspect IPv6 traffic separately — dual-stack = dual rules"

# ── Best Practices (category-grouped) ─────────────────────────────────────
best_practices:
  routing:
    - "Use OSPF for IGP (fast convergence, simple), BGP for WAN/external"
    - "Never redistribute between IGP and BGP without route-maps/filters"
    - "Use BFD (Bidirectional Forwarding Detection) for sub-second failover"
    - "Summarize routes at area boundaries to reduce table size"
    - "Use separate OSPF areas for distinct network segments (area 0 = backbone)"
    - "Configure passive-interface default, then activate only needed interfaces"

  redundancy:
    - "Every critical path must have 2+ diverse physical links"
    - "Use LACP (802.3ad) for link aggregation — never static EtherChannel"
    - "VRRP/HSRP for gateway redundancy (priority 110 primary, 100 secondary)"
    - "Dual power supplies with A/B feed from different UPS/PDU"
    - "Geographic diversity for WAN circuits — different cable entries"

  security:
    - "Encrypt all WAN links (IPSec minimum, Type 1 for classified)"
    - "Default deny on all firewall policies — permit by exception only"
    - "Segment management plane via OOB network or VRF"
    - "Enable 802.1X port-based access control on all access ports"
    - "Disable unused ports and place in quarantine VLAN"
    - "Enable DHCP snooping, DAI, IP source guard on access VLANs"

  capacity:
    - "Target 50% link utilization at peak — 80% triggers upgrade planning"
    - "Use NetFlow/sFlow for traffic visibility before capacity decisions"
    - "Plan for 20% annual growth minimum in bandwidth sizing"
    - "QoS marking at network edge (trust DSCP from known sources only)"

  fault_tolerance:
    - "Test failover scenarios quarterly — document results"
    - "Configure syslog to centralized SIEM (NIST AU-6)"
    - "SNMP polling interval ≤ 60 seconds for critical devices"
    - "NTP sync all devices to authoritative source (NIST AU-8)"

  traffic_engineering:
    - "Use ECMP for load distribution across equal-cost paths"
    - "Implement policy-based routing only as last resort"
    - "Configure traffic shaping at WAN edge for QoS enforcement"
    - "Segment Routing (SR-MPLS) preferred over RSVP-TE for modern MPLS"

  power_and_physical:
    - "Dual power supplies with A/B feed from separate circuits"
    - "UPS runtime minimum 15 minutes for graceful shutdown"
    - "Cable management: structured cabling with clear labeling"
    - "Environmental monitoring: temperature, humidity in all closets"

  cloud_hybrid:
    - "ALWAYS enable BFD on DX/ER/IC/FC VIFs — 90s BGP failover is unacceptable for production"
    - "Deploy dedicated circuits at 2+ diverse colocations for 99.99% SLA"
    - "Configure VPN as automatic backup for every dedicated interconnect"
    - "Use transit hubs (TGW/vWAN/NCC/DRG) for multi-VPC — avoid full-mesh peering"
    - "DO NOT use LAG for DX HA — LAG terminates on single AWS device (SPOF)"
    - "DX Gateway and TGW are NOT SPOFs — backup instances add no resilience (ARC322)"
    - "Enable Flow Logs on all VPCs/VNets/VCNs for NIST AU-3 audit compliance"
    - "Use private endpoints (PrivateLink/PSC) — avoid public internet for service access"
    - "Enable DDoS protection on all internet-facing endpoints (NIST SC-5)"
    - "For traffic isolation on shared DX, use Transit VIF + GRE tunnels (not customer policing)"
    - "Disable cross-zone LB on NLB for clean AZ failure isolation (ARC322 counter-intuitive)"
    - "Use Private IP VPN over Transit VIF for encrypted multi-VPC access without public IPs"
    - "MACsec provides point-to-point L2 encryption only — use IPSec for end-to-end"
    - "Test failover scenarios regularly — DX Resiliency Toolkit includes failover test"
    - "Deploy bidirectional probes (EC2 ↔ on-prem) with CloudWatch for end-to-end DX monitoring"

  cloud_cost:
    - "OCI egress is ~10x cheaper ($0.0085/GB vs $0.09/GB) — factor into multi-cloud design"
    - "OCI FastConnect and cross-region transfers are FREE"
    - "GCP offers Premium vs Standard network tier — Standard uses public internet at lower cost"
    - "Azure cross-AZ transfer is FREE (unlike AWS $0.01/GB each direction)"
    - "Use Private VIF for high-volume single-VPC to avoid TGW data processing charges"
    - "Use Transit VIF for multi-VPC to avoid multiple private VIF port costs"
    - "Plan DX port costs: ~$1,638/mo (10G AWS) vs ~$438/mo (10G OCI)"

  cloud_security:
    - "OCI includes enterprise DDoS protection at NO COST — unique among CSPs"
    - "Azure Private Link has deepest PaaS integration — nearly every Azure service supported"
    - "GCP Firewall Rules use hierarchical policy inheritance (Org > Folder > VPC)"
    - "Use Network Access Analyzer / Reachability Analyzer to validate security group rules"
    - "GCP Distributed Cloud provides air-gapped sovereign deployment for IL6/SECRET"

  ipv6:
    - "Design IPv6-first for new greenfield deployments"
    - "Use /48 per site, /64 per VLAN — never subnet smaller than /64"
    - "Enable dual-stack on infrastructure before endpoints"
    - "OSPFv3 for IPv6 IGP, MP-BGP for multi-protocol (preferred over separate processes)"
    - "HSRPv3/VRRPv3 supports both IPv4 and IPv6 in a single group"
    - "RA Guard + DHCPv6 snooping + NDP inspection on ALL access ports"
    - "IPv6 ACLs are independent of IPv4 — configure BOTH or traffic leaks"
    - "Do NOT block ICMPv6 — it breaks PMTUD, NDP, and SLAAC"
    - "Plan NAT64/DNS64 only for legacy IPv4-only services, not as primary strategy"
    - "Monitor IPv6 traffic ratios to track migration progress"
    - "Document IPv6 capability per device (ipv6_capable field in device properties)"

# ── On Edge Add Rules (Cloud Hybrid Networking) ──────────────────────────────
# Fires when a link is created between two node types.
# Source and target are unordered — rules fire for either direction.

on_edge_add:
  # ── Cloud Interconnect to Transit Hub ─────────────────────────────────
  aws-dx__aws-tgw:
    suggestions:
      - "Use Transit VIF for multi-VPC access via TGW"
      - "Enable BFD (300ms interval, 3x multiplier) for sub-second failover"
      - "Configure VPN as automatic backup for this DX circuit"
      - "Set BGP AS 7224 on AWS side, your private ASN on customer side"

  aws-dx__aws-dx-gw:
    suggestions:
      - "DX Gateway is a global config overlay — associate up to 6 TGWs or 20 VGWs"
      - "DO NOT add a backup DX Gateway — it adds NO resilience (ARC322 AP-002)"
      - "Enable BFD on the Transit/Private VIF"

  aws-vpc__aws-tgw:
    suggestions:
      - "Create TGW attachment in the VPC's subnets"
      - "Use a separate TGW route table for this VPC's traffic isolation"
      - "Enable Flow Logs on the VPC for NIST AU-3 compliance"

  az-er__az-vwan:
    suggestions:
      - "Connect ExpressRoute to Virtual WAN hub — zone-redundant by default"
      - "Enable BFD for fast failover detection"
      - "Add VPN Gateway as automatic backup for ExpressRoute"
      - "Consider Global Reach to connect on-prem sites via Microsoft backbone"

  az-vnet__az-vwan:
    suggestions:
      - "Connect VNet to Virtual WAN hub as spoke"
      - "Enable Routing Intent for centralized security via Azure Firewall"
      - "Enable VNet Flow Logs for traffic visibility"

  gcp-ic__gcp-router:
    suggestions:
      - "Attach VLAN attachment to Cloud Router"
      - "Enable BFD on Cloud Router for sub-second failover"
      - "Configure HA VPN as automatic backup for Interconnect"

  gcp-vpc__gcp-ncc:
    suggestions:
      - "Add VPC as spoke to Network Connectivity Center"
      - "GCP VPCs are global — subnets span regions automatically"

  oci-fc__oci-drg:
    suggestions:
      - "Connect FastConnect to DRG v2 — FREE egress over FastConnect"
      - "Enable BFD on the BGP session"
      - "Use per-attachment route tables for policy control"

  oci-vcn__oci-drg:
    suggestions:
      - "Attach VCN to DRG v2 (free transitive routing)"
      - "Use separate route tables per attachment type"
      - "Enable VCN Flow Logs for audit compliance"

  ibm-dl__ibm-tg:
    suggestions:
      - "Connect Direct Link to Transit Gateway"
      - "IBM VPN does not support BGP — plan for static routing"

  ibm-vpc__ibm-tg:
    suggestions:
      - "Attach VPC to Transit Gateway for multi-VPC routing"

  # ── On-Prem to Cloud Interconnect ────────────────────────────────────
  router__aws-dx:
    suggestions:
      - "Configure eBGP peering (AWS AS 7224 or 64512 for private VIF)"
      - "ALWAYS enable BFD — default BGP hold timer is 90s, BFD detects in <1s"
      - "Plan VPN backup path for automatic DX failover"
      - "Set BGP timers: 10s keepalive, 30s hold (DX recommended)"

  router__az-er:
    suggestions:
      - "Configure eBGP private peering with Microsoft ASN 12076"
      - "Enable BFD for sub-second failover detection"
      - "Add VPN Gateway backup for ExpressRoute"

  router__gcp-ic:
    suggestions:
      - "Configure eBGP with Cloud Router (Google ASN 16550)"
      - "Enable BFD on the Cloud Router session"

  router__oci-fc:
    suggestions:
      - "Configure eBGP with OCI DRG"
      - "Enable BFD for fast failover"
      - "OCI FastConnect egress is FREE — optimize data flow direction"

  # ── Firewall Placement ───────────────────────────────────────────────
  router__firewall:
    suggestions:
      - "Configure outside interface toward router, inside toward campus"
      - "Set default deny policy — permit by exception only"
      - "Enable logging for all deny rules (NIST AU-3)"

  firewall__switch-l3:
    suggestions:
      - "Configure inside interface — route to distribution layer"
      - "Enable OSPF/BGP between firewall and L3 switch"
      - "Configure LACP trunk if multiple links"

  switch-l3__switch-l2:
    suggestions:
      - "Configure as trunk with allowed VLANs"
      - "Enable LACP (802.3ad) for link aggregation"
      - "Consider dual uplinks for redundancy"
