# CUI // SP-CTI
# Pacific Digital Twin Warfare — Pattern Set
# Theater: Indo-Pacific / Western Pacific
# Governs exercise detection thresholds, flashpoint node weights,
# and I&W signal pattern matching for Pacific AOR.
# -------------------------------------------------------------------
# Used by: tools/strategos/exercise_classifier.py, iw_engine.py
# Updated: 2026-04-27

theater:
  name: Western Pacific / Indo-Pacific
  aor: INDOPACOM
  coordinate_bbox:
    lat_min: -10.0
    lat_max:  45.0
    lon_min:  100.0
    lon_max:  180.0

# -------------------------------------------------------------------
# Flashpoint nodes — key geographic/domain pressure points
# weight: 0.0–1.0 relative criticality for WRI contribution
# -------------------------------------------------------------------
flashpoints:
  taiwan_strait:
    name: Taiwan Strait
    weight: 1.0
    lat: 24.0
    lon: 119.5
    actors: [PRC, Taiwan, USA]
    warning_indicators:
      - pla_mobilization_near_fujian
      - plarf_tel_movement
      - plan_carrier_deployment_westpac
      - plaaf_adiz_violations_spike
      - prc_diplomatic_recall

  south_china_sea:
    name: South China Sea
    weight: 0.85
    lat: 12.0
    lon: 114.0
    actors: [PRC, Philippines, Vietnam, Malaysia, USA]
    warning_indicators:
      - pafmm_fleet_concentration
      - ccg_vessel_spike
      - artificial_island_activity
      - prc_coast_guard_incursion

  east_china_sea:
    name: East China Sea / Senkaku
    weight: 0.75
    lat: 25.8
    lon: 123.5
    actors: [PRC, Japan, USA]
    warning_indicators:
      - plaaf_adiz_violations_spike
      - plan_surface_patrol_ecs
      - prc_diplomatic_recall
      - rare_earth_export_halt

  korean_peninsula:
    name: Korean Peninsula
    weight: 0.70
    lat: 37.5
    lon: 127.5
    actors: [DPRK, ROK, USA, PRC]
    warning_indicators:
      - dprk_missile_prep
      - kpa_border_concentration
      - prc_troop_movement_northeast

  space_leo:
    name: Low Earth Orbit (LEO)
    weight: 0.65
    lat: null
    lon: null
    actors: [PRC, USA, Russia]
    warning_indicators:
      - asat_launch_prep
      - co_orbital_rendezvous
      - gps_jamming_pacific
      - ew_satellite_uplink_disruption

# -------------------------------------------------------------------
# PLA exercise signature patterns
# Each pattern maps to an exercise_type from exercise_classifier.py
# confidence_threshold: minimum score to trigger I&W watch condition
# -------------------------------------------------------------------
exercise_signatures:

  DONGFENG:
    description: DF-series PLARF/Second Artillery ballistic missile exercise
    systems: [DF-5, DF-11, DF-15, DF-17, DF-21D, DF-26, DF-31AG, DF-41]
    precursor_indicators:
      - plarf_unit_activation           # Second Artillery / Rocket Force unit on exercise orders
      - tel_convoy_movement             # TEL road movement on satellite/ISR
      - missile_storage_facility_open   # Depo doors open — IMINT indicator
      - range_closure_notice            # NOTAM/NAVAREA closure near likely splash zones
    typical_duration_days: [3, 14]
    escalation_rung_floor: 3           # Heightened Readiness minimum when DONGFENG active
    warning_lead_days: 7

  JOINT_SWORD:
    description: Multi-domain Taiwan encirclement exercises (post-2022 pattern)
    named_instances: [Joint Sword 2023-A, Joint Sword 2024-B]
    trigger_condition: high_level_taiwan_us_contact
    domains: [land, sea, air, space, cyber, information]
    precursor_indicators:
      - pla_theater_command_activation  # Eastern Theater Command
      - prc_diplomatic_recall_taipei    # Recall of semi-official envoys
      - prc_state_media_escalation      # Xinhua/CCTV rhetoric spike
      - plan_carrier_deployment         # Carrier strike group positioning
      - plarf_tel_activation            # PLARF read-alert
      - plaaf_surge_sorties             # PLAAF 24h+ operations tempo
    typical_duration_days: [3, 7]
    escalation_rung_floor: 4           # Crisis Response
    warning_lead_days: 3

  ISLAND_ATTACK:
    description: Amphibious island seizure exercise
    systems: [Type 075 LHD, Type 071 LPD, Type 726 LCAC, PLAN Marine Corps]
    precursor_indicators:
      - plan_amphibious_fleet_sortie    # LST/LPD/LHD unusual concentration
      - plan_marine_deployment          # PLAN Marines embark indicator
      - pla_helicopter_surge            # Z-8/Z-20 helicopter concentration at coast
      - civilian_ro_ro_requisition      # PRC govt requisition of civilian ro-ro vessels
    typical_duration_days: [5, 21]
    escalation_rung_floor: 3
    warning_lead_days: 14

  COMBAT_PATROL:
    description: PLAAF combat air patrol / ADIZ violation campaign
    systems: [H-6K, H-6J, J-10C, J-11B, J-16, J-20, Su-30MKK, KJ-500, Y-9EW]
    precursor_indicators:
      - plaaf_surge_sorties             # >5 aircraft entering ADIZ same window
      - h6_bomber_patrol_route_change   # H-6 deviating from routine path
      - airbase_activity_surge          # Longtian / Huian / Zhangzhou airbase activity
    typical_duration_days: [1, 3]
    escalation_rung_floor: 2           # Elevated Watch
    warning_lead_days: 1

  MARITIME_INTERDICTION:
    description: PLAN blockade / sea lane denial exercise
    systems: [Type 055 DDG, Type 052D DDG, 094A SSBN, 093B SSN, Type 022 FFL]
    precursor_indicators:
      - plan_carrier_deployment         # CSG positioning near strait
      - plan_submarine_surge            # Multiple submarine departures from Yulin
      - plan_mine_warfare_exercise      # Mine-laying unit activation
      - plan_anti_shipping_drill        # YJ-18/YJ-12 anti-ship missile exercise
      - scs_shipping_lane_closure       # Unofficial or NOTAM closure of SCS lanes
    typical_duration_days: [7, 21]
    escalation_rung_floor: 3
    warning_lead_days: 5

# -------------------------------------------------------------------
# Historical I&W baselines — Pacific cases
# References tools/sg/data/baselines.json case_ids
# -------------------------------------------------------------------
pacific_baselines:
  - case_id: ex_pla_taiwan_1995
    exercise_type: DONGFENG
    theater: taiwan_strait
    lesson: "First operational DF-15 coercive use; 21-day lead time; US carrier response deterred escalation"

  - case_id: co_taiwan_strait_1996
    exercise_type: DONGFENG
    theater: taiwan_strait
    lesson: "Phase 2 of 1995 crisis; dual carrier battle group response established red line"

  - case_id: co_scarborough_2012
    exercise_type: null
    theater: south_china_sea
    lesson: "Gray-zone coercion prototype; PAFMM fishing militia as vanguard; diplomatic agreement not honored"

  - case_id: co_senkaku_2012
    exercise_type: COMBAT_PATROL
    theater: east_china_sea
    lesson: "Dual-track coercion: gray-zone maritime + economic lever (rare earth); 730-day sustained campaign"

  - case_id: co_china_asat_2007
    exercise_type: null
    theater: space_leo
    lesson: "Strategic counter-space signaling; debris field persists; demonstrates ISR/GPS kill chain threat"

# -------------------------------------------------------------------
# WRI contribution overrides for Pacific theater
# Adjusts iw_engine.py dimension weights when Pacific AOR is active
# -------------------------------------------------------------------
wri_overrides:
  active_when: theater == "western_pacific"
  dimension_multipliers:
    military: 1.15          # PLA force buildup has outsized Pacific relevance
    information: 1.10       # PLA information warfare / cognitive domain emphasis
    infrastructure: 1.05    # SCS artificial islands + space-based ISR
    physical_environment: 1.20  # Maritime/island geography is decisive

# -------------------------------------------------------------------
# Alert thresholds
# -------------------------------------------------------------------
alert_thresholds:
  dongfeng_active:
    condition: exercise_type == DONGFENG AND confidence >= 0.70
    escalation_rung_minimum: 3
    notify: true

  joint_sword_active:
    condition: exercise_type == JOINT_SWORD AND confidence >= 0.65
    escalation_rung_minimum: 4
    notify: true

  multi_domain_concurrent:
    condition: distinct_exercise_types_active >= 3
    escalation_rung_minimum: 4
    notify: true
    note: "Concurrent DONGFENG + JOINT_SWORD + MARITIME_INTERDICTION = pre-invasion checklist"
