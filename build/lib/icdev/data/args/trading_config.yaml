# FathomDesk Trading Configuration
fathomdesk:
  version: "1.0.0"
  mode: "paper"  # paper | live (requires FATHOMDESK_LIVE_TRADING=true)

  # Default watchlist
  watchlist:
    equities: ["AAPL", "MSFT", "GOOGL", "AMZN", "NVDA", "TSLA", "META"]
    crypto: ["BTC/USD", "ETH/USD", "SOL/USD"]

  # Risk limits
  risk:
    max_position_pct: 0.20       # Max single position as % of portfolio
    max_positions: 20            # Max concurrent positions
    daily_loss_limit_pct: -0.02  # Max daily loss as %
    max_portfolio_var: 0.05      # Max portfolio VaR (1-day, 95%)
    max_daily_orders: 10         # Max orders per day (prevents runaway trading)

  # Analysis configuration
  analysis:
    debate_rounds: 2             # Bull/bear debate rounds
    min_confidence: 0.50         # Min confidence to generate signal
    auto_execute: false          # Never auto-execute without explicit opt-in
    auto_approve_buy_min_confidence: 0.67  # Auto-approve BUY signals at >= 67% confidence

  # Signal weights (with macro 20%, redistributed)
  signal_weights:
    fundamental: 0.20
    technical: 0.25
    sentiment: 0.15
    news: 0.10
    macro: 0.20
    perspective: 0.10

  # Macro Market Overlay (Layer 0)
  macro:
    enabled: true
    regime_thresholds:
      green: 60
      yellow: 30
    indicators:
      vix: { weight: 0.20, green_max: 15, red_min: 25 }
      yield_spread: { weight: 0.20, green_min: 1.0, red_max: 0 }
      oil_change_30d: { weight: 0.15, threshold: 0.10 }
      dxy: { weight: 0.10, strong: 105, weak: 95 }
      sp500_trend: { weight: 0.15 }
      fed_funds: { weight: 0.05 }
      nasdaq_trend: { weight: 0.05 }
      gold_change_30d: { weight: 0.10 }
    sector_sensitivity: true
    supply_chain_keywords:
      - "war"
      - "sanctions"
      - "blockade"
      - "embargo"
      - "oil shock"
      - "shipping disruption"
      - "supply chain"

  # Shorting configuration
  shorting:
    enabled: true                    # Enable SHORT signals (distinct from SELL)
    composite_threshold: 30          # Composite must be below this for SHORT
    min_confidence: 0.67             # Min 67% analyst agreement for SHORT
    max_short_position_pct: 0.15     # Single short < 15% of portfolio
    max_total_short_exposure: 0.30   # Total short exposure < 30% of portfolio
    margin_multiplier: 1.5           # Require 150% collateral for short orders

  # Dashboard
  dashboard:
    port: 5100
    host: "0.0.0.0"

  # Pulse integration
  pulse:
    enabled: true
    min_conviction: 70           # Min conviction score to trigger article
    category: "market-intelligence"
    template: "market_analysis"
