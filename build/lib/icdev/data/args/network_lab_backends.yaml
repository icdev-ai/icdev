# CUI // SP-CTI
# Network Lab Backend Registry — lab orchestrators available to NDC

version: 1

backends:
  - name: gns3_primary
    type: gns3
    url: "http://gns3-server.mgmt.internal:3080"
    auth_type: basic
    mgmt_vlan: 999
    air_gap_safe: true
    capabilities:
      - qemu
      - docker
      - vpcs
      - dynamips
      - iou
    max_concurrent_labs: 5
    health_check_interval_seconds: 30
    enabled: false  # requires GNS3_USERNAME/GNS3_PASSWORD env vars

  - name: containerlab
    type: containerlab
    url: "localhost"
    auth_type: none
    air_gap_safe: true
    capabilities:
      - docker
      - frr
      - srl
      - ceos
    max_concurrent_labs: 10
    enabled: false

  - name: eve_ng
    type: eve_ng
    url: "https://eve-ng.mgmt.internal"
    auth_type: api_key
    air_gap_safe: true
    capabilities:
      - qemu
      - dynamips
      - docker
    max_concurrent_labs: 3
    enabled: false

# Air-gap enforcement: backends listed here are reachable ONLY via internal mgmt VLAN
airgap_policy:
  enforce_mgmt_vlan: true
  blocked_internet_hosts:
    - gns3.com
    - github.com
    - dockerhub.io
  approved_registries:
    - internal-registry.sipr.mil
    - ironbank.dso.mil
