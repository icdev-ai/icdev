# CUI // SP-CTI
# Infrastructure Design Canvas — Configuration
app:
  name: "Infrastructure Design Canvas"
  version: "1.0.0"
  classification: "CUI // SP-CTI"

database:
  path: "infra_canvas.db"
  wal_mode: true
  foreign_keys: true

canvas:
  autosave_delay_ms: 3000
  grid_size: 10
  default_width: 110
  default_height: 60
  accent_color: "#00bcd4"

assessment:
  auto_assess_on_save: true
  default_rules:
    - storage_encrypted
    - db_encrypted
    - kms_present
    - compute_behind_lb
    - autoscaling_configured
    - dedicated_for_compliance
    - registry_private
    - k8s_rbac
    - iam_present
    - secrets_managed
    - backup_configured
    - cspm_present
    - iac_present
  thresholds:
    min_score: 70
    cat1_max: 0
    cat2_max: 5

csp_mapping:
  enabled: true
  providers:
    - aws
    - azure
    - gcp
    - oci
    - ibm
    - on_prem

templates:
  count: 8
  auto_seed: true

agent:
  auto_trigger_sdc_on_save: true
  auto_trigger_qdc_on_save: true

logging:
  level: INFO
  audit_enabled: true
