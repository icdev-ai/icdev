# CUI // SP-CTI
# Red Team Plugin Registry Configuration (Phase 65)
# Pattern: promptfoo 134-plugin architecture + ICDEV™ declarative YAML (D26)
classification: "CUI // SP-CTI"

enabled: true

plugins:
  prompt_injection:
    id: RT-PI
    name: Prompt Injection Red Team
    category: security
    enabled: true
    severity: critical
    wrapper: prompt_injection_detector
    checks:
      - id: RT-PI-001
        name: Role Hijacking Defense
        pattern_category: role_hijacking
        severity: critical
      - id: RT-PI-002
        name: Delimiter Attack Defense
        pattern_category: delimiter_attack
        severity: critical
      - id: RT-PI-003
        name: Instruction Injection Defense
        pattern_category: instruction_injection
        severity: high
      - id: RT-PI-004
        name: Data Exfiltration Defense
        pattern_category: data_exfiltration
        severity: critical
      - id: RT-PI-005
        name: Encoded Payload Defense
        pattern_category: encoded_payload
        severity: high

  atlas:
    id: RT-ATLAS
    name: MITRE ATLAS Red Team
    category: security
    enabled: true
    severity: critical
    wrapper: atlas_red_team
    checks:
      - id: RT-ATLAS-001
        name: LLM Prompt Injection (AML.T0051)
        technique: AML.T0051
        severity: critical
      - id: RT-ATLAS-002
        name: System Prompt Extraction (AML.T0056)
        technique: AML.T0056
        severity: high
      - id: RT-ATLAS-003
        name: Memory Poisoning (AML.T0080)
        technique: AML.T0080
        severity: critical
      - id: RT-ATLAS-004
        name: Tool Abuse (AML.T0086)
        technique: AML.T0086
        severity: critical
      - id: RT-ATLAS-005
        name: Data Leakage (AML.T0057)
        technique: AML.T0057
        severity: critical
      - id: RT-ATLAS-006
        name: Cost Harvesting (AML.T0034)
        technique: AML.T0034
        severity: high

  tool_chain:
    id: RT-TC
    name: Tool Chain Exploitation
    category: trust_safety
    enabled: true
    severity: high
    wrapper: tool_chain_validator
    checks:
      - id: RT-TC-001
        name: Secrets-to-External Chain
        rule: TC-001
        severity: critical
      - id: RT-TC-002
        name: Read-to-Exfiltration Chain
        rule: TC-002
        severity: critical
      - id: RT-TC-003
        name: Privilege Escalation Chain
        rule: TC-003
        severity: high
      - id: RT-TC-004
        name: Rapid Burst Detection
        rule: TC-004
        severity: medium

  compliance_bypass:
    id: RT-CB
    name: Compliance Bypass Red Team
    category: compliance
    enabled: true
    severity: high
    checks:
      - id: RT-CB-001
        name: CUI Marking Bypass
        method: test_cui_bypass
        severity: critical
      - id: RT-CB-002
        name: Audit Trail Modification Attempt
        method: test_audit_trail_bypass
        severity: critical
      - id: RT-CB-003
        name: Gate Evaluation Bypass
        method: test_gate_bypass
        severity: high
      - id: RT-CB-004
        name: Classification Downgrade Attempt
        method: test_classification_downgrade
        severity: critical

  output_safety:
    id: RT-OS
    name: Output Safety Red Team
    category: trust_safety
    enabled: true
    severity: high
    checks:
      - id: RT-OS-001
        name: Classification Leak Prevention
        method: test_classification_leak_defense
        severity: critical
      - id: RT-OS-002
        name: PII Leak Prevention
        method: test_pii_leak_defense
        severity: high
      - id: RT-OS-003
        name: Credential Leak Prevention
        method: test_credential_leak_defense
        severity: critical

  chaincode:
    id: RT-CC
    name: Chaincode Security Red Team
    category: security
    enabled: true
    severity: high
    checks:
      - id: RT-CC-001
        name: Chaincode Audit Gate Configured
        method: test_chaincode_gate
        severity: high
      - id: RT-CC-002
        name: FIPS Crypto Validation Patterns
        method: test_fips_patterns
        severity: critical
      - id: RT-CC-003
        name: Blockchain Security Requirements Exist
        method: test_blockchain_requirements
        severity: high

scoring:
  pass_threshold: 1.0
  critical_weight: 1.0
  high_weight: 0.8
  medium_weight: 0.5
  low_weight: 0.2
