# CUI // SP-CTI
# Credential Broker Configuration (D-NC-1)
# Agents request credentials by function, never by provider or key name.
# Broker resolves function → provider → credential, returns scoped tokens.

classification: "CUI // SP-CTI"

# Master enable (default: disabled — backward compatible with direct env reads)
enabled: false
env_override: ICDEV_CREDENTIAL_BROKER_ENABLED

# Token settings
tokens:
  default_ttl_seconds: 3600          # 1 hour
  max_ttl_seconds: 86400             # 24 hours
  hash_algorithm: sha256             # Token hash stored, never plaintext
  auto_revoke_on_trust_drop: true    # Revoke all tokens if agent drops below threshold
  trust_revoke_threshold: 0.50       # Trust level that triggers revocation

# Function-to-provider mapping
# Each function declares which provider and scope it needs.
# The broker resolves the actual credential from secrets backend.
function_map:
  code_generation:
    provider: ollama
    scope: "model:invoke"
    max_ttl_seconds: 7200            # Long running — allow 2h
  compliance_export:
    provider: ollama
    scope: "model:invoke"
  narrative_generation:
    provider: ollama
    scope: "model:invoke"
  intake_persona_response:
    provider: anthropic
    scope: "model:invoke"
  screenshot_validation:
    provider: ollama
    scope: "model:invoke"
  document_vision:
    provider: ollama
    scope: "model:invoke"
  embedding:
    provider: ollama
    scope: "embedding:invoke"
  bedrock_invoke:
    provider: bedrock
    scope: "model:invoke"
  secrets_read:
    provider: aws_secrets
    scope: "secretsmanager:GetSecretValue"
  secrets_write:
    provider: aws_secrets
    scope: "secretsmanager:PutSecretValue"
  storage_read:
    provider: aws_s3
    scope: "s3:GetObject"
  storage_write:
    provider: aws_s3
    scope: "s3:PutObject"

# Audit settings
audit:
  log_grants: true
  log_revocations: true
  log_denials: true
  # Never log the actual credential — only token hash
  redact_credentials: true

# Fallback behavior when broker is unavailable
fallback:
  # If true, fall back to direct env var reads (backward compat)
  allow_direct_env: true
  # Log a warning when fallback is used
  log_fallback_warning: true
