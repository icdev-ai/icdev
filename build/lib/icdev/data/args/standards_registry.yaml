    version: "2022"
    clauses:
      "5.1": "Leadership and commitment"
      "5.2": "Policy"
      "5.3": "Organizational roles"
  PCI_DSS:
    version: "4.0"
    requirements:
      "1": "Install and Maintain Network Security Controls"
