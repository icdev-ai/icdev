# CUI // SP-CTI
# Product Intelligence Engine Configuration
# Orchestrates 8 sub-engines for competitive/market signal aggregation.

classification: "CUI // SP-CTI"

# ── Engine Registry ───────────────────────────────────────────────────────────

engines:
  - name: innovation
    module: tools.innovation.engine
    cli_flags: ["--scan", "--json"]
    enabled: true
    timeout_seconds: 120
    order: 1

  - name: regulatory_foresight
    module: tools.regfore.foresight_engine
    cli_flags: ["--scan", "--json"]
    enabled: true
    timeout_seconds: 180
    order: 2

  - name: creative
    module: tools.creative.engine
    cli_flags: ["--scan", "--json"]
    enabled: true
    timeout_seconds: 120
    order: 3

  - name: usage
    module: tools.usage.engine
    cli_flags: ["--scan", "--json"]
    enabled: true
    timeout_seconds: 90
    order: 4

  - name: win_loss
    module: tools.win_loss.engine
    cli_flags: ["--scan", "--json"]
    enabled: true
    timeout_seconds: 120
    order: 5

  - name: voc
    module: tools.voc.engine
    cli_flags: ["--scan", "--json"]
    enabled: true
    timeout_seconds: 120
    order: 6

  - name: tech_radar
    module: tools.tech_radar.engine
    cli_flags: ["--scan", "--json"]
    enabled: true
    timeout_seconds: 150
    order: 7

  - name: research
    module: tools.research.engine
    cli_flags: ["--scan", "--json"]
    enabled: true
    timeout_seconds: 300
    order: 8

# ── Federation ────────────────────────────────────────────────────────────────

federation:
  run_after_engines: true
  min_signal_score: 0.70

# ── Scheduling ────────────────────────────────────────────────────────────────

scheduling:
  run_interval_hours: 24
  quiet_hours:
    enabled: true
    start: "22:00"
    end: "06:00"
    timezone: "UTC"

# ── Output ────────────────────────────────────────────────────────────────────

output:
  store_run_record: true
  notify_on_signals: true
