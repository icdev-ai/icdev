# ICDEV™ Context Pressure & Stuck Detection Configuration (GSD-adapted)
# Monitors agent context window consumption and detects stuck patterns.
#
# D-GSD-4: Context pressure thresholds (percentage of window remaining)
# D-GSD-5: Stuck detection is advisory — logs signal, never kills agent

# Context pressure thresholds
warning_threshold_pct: 35        # WARNING at 35% remaining
critical_threshold_pct: 25       # CRITICAL at 25% remaining
context_window_tokens: 200000    # Default context window (200k tokens)

# Stuck detection
max_consecutive_reads: 5         # Analysis paralysis after N reads without writes
max_duplicate_calls: 3           # Loop detection after N identical calls
duplicate_window_minutes: 5      # Time window for duplicate detection

# Token estimation
chars_per_token: 4               # Average characters per token (conservative)

# Actions
auto_checkpoint: false           # Auto-trigger durable checkpoint on critical
log_to_db: true                  # Store pressure/stuck events in DB

# Integration
# Context pressure can be checked:
#   1. On-demand: python tools/agent/context_pressure.py --check health --json
#   2. In orchestrator: import tools.agent.context_pressure and call health_check()
#   3. Via heartbeat daemon: add "context_pressure" to heartbeat_checks
