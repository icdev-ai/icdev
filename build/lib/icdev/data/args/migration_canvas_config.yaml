# CUI // SP-CTI
# Migration Design Canvas — Configuration
app:
  name: "Migration Design Canvas"
  version: "1.0.0"
  classification: "CUI // SP-CTI"

database:
  path: "migration_canvas.db"
  wal_mode: true
  foreign_keys: true

canvas:
  autosave_delay_ms: 3000
  grid_size: 10
  default_width: 130
  default_height: 50
  accent_color: "#795548"

assessment:
  auto_assess_on_save: true
  default_rules:
    - MC-001  # Source systems identified
    - MC-002  # Target environment defined
    - MC-003  # Migration pattern selected
    - MC-004  # Compliance bridge present
    - MC-005  # Rollback plan defined
    - MC-006  # ATO gate for GovCloud targets
    - MC-007  # Security scan in migration path
    - MC-008  # Test gate before cutover
    - MC-009  # Data migration strategy
    - MC-010  # Wave plan defined
  thresholds:
    min_score: 70
    cat1_max: 0
    cat2_max: 5

readiness:
  weights:
    completeness: 0.35
    compliance: 0.25
    risk_mitigation: 0.20
    planning: 0.20
  thresholds:
    ready: 80
    conditional: 60
    not_ready: 0

migration_patterns:
  - rehost
  - refactor
  - rearchitect
  - retain
  - retire
  - relocate
  - repurchase

wave_planning:
  enabled: true
  max_wave_size: 10
  dependency_analysis: true

oracle:
  enabled: true
  lens: "tools/oracle/lenses/lens_migration.py"

templates:
  count: 6
  auto_seed: true

agent:
  auto_trigger_sdc_on_save: true
  auto_trigger_qdc_on_save: true

logging:
  level: INFO
  audit_enabled: true
