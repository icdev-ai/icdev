# CUI // SP-CTI
# FathomDesk options strategy library — Phase 7.5 follow-up B.
#
# Each strategy is a leg template. At build-time the user picks an
# underlying + one or more strikes + expiries, and the builder expands
# the template into concrete OCC contract symbols.
#
# Hot-reloaded via file-mtime cache (tools/trading/options/strategies.py).
# Operators can add strategies without touching code.
#
# Shape:
#   id:                          # unique slug
#     name:                      # display name
#     description:               # short description
#     complexity:                # novice | intermediate | advanced
#     max_legs:                  # 1 | 2 | 3 | 4 (matching Alpaca MLeg cap)
#     outlook:                   # bullish | bearish | neutral | volatile
#     legs:                      # list of templates (1-4 entries)
#       - role: "short_put"      # human-readable role label
#         action: buy_to_open    # OPTION_ACTION for this leg at strategy open
#         option_type: call|put
#         strike_slot: atm       # atm | otm_near | otm_far | itm_near | itm_far |
#                                 # pct:+5 | pct:-10 (% above/below underlying)
#         qty_ratio: 1           # relative qty (1 = one per "size"; some strategies
#                                 # use 2:1 ratios)
#     # Risk summary — displayed in the UI; not used for actual order math.
#     risk:
#       max_loss: "premium_paid"   | "strike - premium" | "unlimited" | "spread_width - premium"
#       max_profit: "unlimited" | "premium_received" | "spread_width - premium"
#       breakevens: ["strike + premium"]

_schema_version: 1

strategies:
  long_call:
    name: "Long Call"
    description: "Buy a call option — bullish directional bet with defined risk."
    complexity: novice
    max_legs: 1
    outlook: bullish
    legs:
      - role: long_call
        action: buy_to_open
        option_type: call
        strike_slot: atm
        qty_ratio: 1
    risk:
      max_loss: "premium_paid"
      max_profit: "unlimited"
      breakevens: ["strike + premium"]
    greek_profile:
      delta_bias: bullish
      theta_sign: negative
      vega_sign: positive
      gamma_sign: positive
      iv_environment: low

  long_put:
    name: "Long Put"
    description: "Buy a put option — bearish directional bet with defined risk."
    complexity: novice
    max_legs: 1
    outlook: bearish
    legs:
      - role: long_put
        action: buy_to_open
        option_type: put
        strike_slot: atm
        qty_ratio: 1
    risk:
      max_loss: "premium_paid"
      max_profit: "strike - premium (stock to $0)"
      breakevens: ["strike - premium"]
    greek_profile:
      delta_bias: bearish
      theta_sign: negative
      vega_sign: positive
      gamma_sign: positive
      iv_environment: low

  covered_call:
    name: "Covered Call"
    description: "Sell a call against stock you own — income with upside cap."
    complexity: novice
    max_legs: 1
    outlook: neutral
    legs:
      - role: short_call
        action: sell_to_open
        option_type: call
        strike_slot: otm_near
        qty_ratio: 1
    risk:
      max_loss: "stock cost basis (stock to $0)"
      max_profit: "premium_received + (strike - entry_price) × 100"
      breakevens: ["entry_price - premium"]
    greek_profile:
      delta_bias: bullish
      theta_sign: positive
      vega_sign: negative
      gamma_sign: negative
      iv_environment: high

  cash_secured_put:
    name: "Cash-Secured Put"
    description: "Sell a put, set aside cash to buy if assigned — income or entry."
    complexity: novice
    max_legs: 1
    outlook: neutral
    legs:
      - role: short_put
        action: sell_to_open
        option_type: put
        strike_slot: otm_near
        qty_ratio: 1
    risk:
      max_loss: "(strike - premium) × 100"
      max_profit: "premium_received"
      breakevens: ["strike - premium"]
    greek_profile:
      delta_bias: bullish
      theta_sign: positive
      vega_sign: negative
      gamma_sign: negative
      iv_environment: high

  bull_call_spread:
    name: "Bull Call Spread"
    description: "Buy ATM call, sell OTM call — bullish with capped upside + loss."
    complexity: intermediate
    max_legs: 2
    outlook: bullish
    legs:
      - role: long_call_lower
        action: buy_to_open
        option_type: call
        strike_slot: atm
        qty_ratio: 1
      - role: short_call_upper
        action: sell_to_open
        option_type: call
        strike_slot: otm_near
        qty_ratio: 1
    risk:
      max_loss: "net_premium_paid"
      max_profit: "(upper_strike - lower_strike) - net_premium_paid"
      breakevens: ["lower_strike + net_premium"]
    greek_profile:
      delta_bias: bullish
      theta_sign: negative
      vega_sign: positive
      gamma_sign: positive
      iv_environment: low

  bear_put_spread:
    name: "Bear Put Spread"
    description: "Buy ATM put, sell OTM put — bearish with capped upside + loss."
    complexity: intermediate
    max_legs: 2
    outlook: bearish
    legs:
      - role: long_put_upper
        action: buy_to_open
        option_type: put
        strike_slot: atm
        qty_ratio: 1
      - role: short_put_lower
        action: sell_to_open
        option_type: put
        strike_slot: otm_near
        qty_ratio: 1
    risk:
      max_loss: "net_premium_paid"
      max_profit: "(upper_strike - lower_strike) - net_premium_paid"
      breakevens: ["upper_strike - net_premium"]
    greek_profile:
      delta_bias: bearish
      theta_sign: negative
      vega_sign: positive
      gamma_sign: positive
      iv_environment: low

  iron_condor:
    name: "Iron Condor"
    description: "Short OTM put + long further-OTM put + short OTM call + long further-OTM call. Income when stock stays in the middle."
    complexity: advanced
    max_legs: 4
    outlook: neutral
    legs:
      - role: long_put_far
        action: buy_to_open
        option_type: put
        strike_slot: otm_far
        qty_ratio: 1
      - role: short_put_near
        action: sell_to_open
        option_type: put
        strike_slot: otm_near
        qty_ratio: 1
      - role: short_call_near
        action: sell_to_open
        option_type: call
        strike_slot: otm_near
        qty_ratio: 1
      - role: long_call_far
        action: buy_to_open
        option_type: call
        strike_slot: otm_far
        qty_ratio: 1
    risk:
      max_loss: "wing_width - net_credit (per side)"
      max_profit: "net_credit"
      breakevens: ["short_put_strike - net_credit", "short_call_strike + net_credit"]
    greek_profile:
      delta_bias: neutral
      theta_sign: positive
      vega_sign: negative
      gamma_sign: negative
      iv_environment: high

  long_straddle:
    name: "Long Straddle"
    description: "Buy ATM call + ATM put — profits on big moves either direction."
    complexity: intermediate
    max_legs: 2
    outlook: volatile
    legs:
      - role: long_call
        action: buy_to_open
        option_type: call
        strike_slot: atm
        qty_ratio: 1
      - role: long_put
        action: buy_to_open
        option_type: put
        strike_slot: atm
        qty_ratio: 1
    risk:
      max_loss: "total_premium_paid"
      max_profit: "unlimited (upside) / strike - premium (downside)"
      breakevens: ["strike + total_premium", "strike - total_premium"]
    greek_profile:
      delta_bias: neutral
      theta_sign: negative
      vega_sign: positive
      gamma_sign: positive
      iv_environment: low

  # ─── Phase 7+ complex strategies (multi-expiry + 3-4-leg butterflies)
  #
  # Expiry slots: near (user-picked near-term expiry) + far (user-picked
  # far-term expiry). When a strategy uses only one expiry, all legs
  # default to expiry_slot=near.
  long_call_butterfly:
    name: "Long Call Butterfly"
    description: "Buy 1 ITM call + sell 2 ATM calls + buy 1 OTM call — peak profit at middle strike. Triangular payoff."
    complexity: advanced
    max_legs: 3
    outlook: neutral
    legs:
      - role: long_call_low
        action: buy_to_open
        option_type: call
        strike_slot: itm_near
        expiry_slot: near
        qty_ratio: 1
      - role: short_call_mid
        action: sell_to_open
        option_type: call
        strike_slot: atm
        expiry_slot: near
        qty_ratio: 2
      - role: long_call_high
        action: buy_to_open
        option_type: call
        strike_slot: otm_near
        expiry_slot: near
        qty_ratio: 1
    risk:
      max_loss: "net_premium_paid"
      max_profit: "(mid_strike - low_strike) - net_premium_paid"
      breakevens: ["low + net_premium", "high - net_premium"]
    greek_profile:
      delta_bias: neutral
      theta_sign: positive
      vega_sign: negative
      gamma_sign: negative
      iv_environment: low

  iron_butterfly:
    name: "Iron Butterfly"
    description: "Short ATM call + short ATM put + long OTM call + long OTM put — triangular payoff, defined risk."
    complexity: advanced
    max_legs: 4
    outlook: neutral
    legs:
      - role: long_put_wing
        action: buy_to_open
        option_type: put
        strike_slot: otm_near
        expiry_slot: near
        qty_ratio: 1
      - role: short_put_body
        action: sell_to_open
        option_type: put
        strike_slot: atm
        expiry_slot: near
        qty_ratio: 1
      - role: short_call_body
        action: sell_to_open
        option_type: call
        strike_slot: atm
        expiry_slot: near
        qty_ratio: 1
      - role: long_call_wing
        action: buy_to_open
        option_type: call
        strike_slot: otm_near
        expiry_slot: near
        qty_ratio: 1
    risk:
      max_loss: "wing_width - net_credit"
      max_profit: "net_credit"
      breakevens: ["atm - net_credit", "atm + net_credit"]
    greek_profile:
      delta_bias: neutral
      theta_sign: positive
      vega_sign: negative
      gamma_sign: negative
      iv_environment: high

  calendar_spread:
    name: "Calendar Spread"
    description: "Short near-expiry + long far-expiry at same strike — profits from time decay differential."
    complexity: advanced
    max_legs: 2
    outlook: neutral
    legs:
      - role: short_near
        action: sell_to_open
        option_type: call
        strike_slot: atm
        expiry_slot: near
        qty_ratio: 1
      - role: long_far
        action: buy_to_open
        option_type: call
        strike_slot: atm
        expiry_slot: far
        qty_ratio: 1
    risk:
      max_loss: "net_premium_paid (far leg > near leg)"
      max_profit: "depends on IV + time to far expiry (est. at near expiry, ATM)"
      breakevens: ["approximate — depends on remaining far-leg value at near expiry"]
    greek_profile:
      delta_bias: neutral
      theta_sign: positive
      vega_sign: positive
      gamma_sign: negative
      iv_environment: low

  diagonal_spread:
    name: "Diagonal Spread"
    description: "Short near-expiry at one strike + long far-expiry at different strike — time + direction combined."
    complexity: advanced
    max_legs: 2
    outlook: neutral
    legs:
      - role: short_near_otm
        action: sell_to_open
        option_type: call
        strike_slot: otm_near
        expiry_slot: near
        qty_ratio: 1
      - role: long_far_atm
        action: buy_to_open
        option_type: call
        strike_slot: atm
        expiry_slot: far
        qty_ratio: 1
    risk:
      max_loss: "net_premium_paid"
      max_profit: "complex — depends on remaining time value of far leg at near expiry"
      breakevens: ["approximate, depends on remaining far-leg value"]
    greek_profile:
      delta_bias: neutral
      theta_sign: positive
      vega_sign: positive
      gamma_sign: negative
      iv_environment: low

  # "Calendar and triangle combined" — a double calendar butterfly: wings
  # in the FAR expiry, body in the NEAR expiry. Classic volatility
  # + time-decay play around an anchor strike.
  calendar_butterfly:
    name: "Calendar Butterfly"
    description: "Short 2 ATM near-expiry + long 1 OTM + long 1 ITM far-expiry — calendar time decay + butterfly triangular profit zone combined."
    complexity: expert
    max_legs: 4
    outlook: neutral
    legs:
      - role: long_far_low
        action: buy_to_open
        option_type: call
        strike_slot: itm_near
        expiry_slot: far
        qty_ratio: 1
      - role: short_near_mid
        action: sell_to_open
        option_type: call
        strike_slot: atm
        expiry_slot: near
        qty_ratio: 2
      - role: long_far_high
        action: buy_to_open
        option_type: call
        strike_slot: otm_near
        expiry_slot: far
        qty_ratio: 1
    risk:
      max_loss: "net_premium_paid (far legs + extra time value)"
      max_profit: "substantial at middle strike when near legs expire worthless — depends on remaining far-leg value"
      breakevens: ["complex — multi-expiry payoff; analyze with simulator"]
    greek_profile:
      delta_bias: neutral
      theta_sign: positive
      vega_sign: positive
      gamma_sign: negative
      iv_environment: low

  # ── Risk Reversals (Triangle) ──────────────────────────────────────────
  # Colloquially called "triangle" in options desks: the payoff diagram
  # has a triangular kink at the short-put strike where the downside
  # protection kicks in. Zero or near-zero cost, unlimited risk both ways.

  risk_reversal_bull:
    name: "Bull Risk Reversal"
    description: "Buy OTM call + sell OTM put — synthetic long, near-zero cost. Bullish with unlimited upside and significant downside below put strike."
    complexity: advanced
    max_legs: 2
    outlook: bullish
    legs:
      - role: long_call_otm
        action: buy_to_open
        option_type: call
        strike_slot: otm_near
        qty_ratio: 1
      - role: short_put_otm
        action: sell_to_open
        option_type: put
        strike_slot: otm_near
        qty_ratio: 1
    risk:
      max_loss: "put_strike - net_credit (significant downside)"
      max_profit: "unlimited above call strike"
      breakevens: ["call_strike + net_debit  OR  put_strike - net_credit"]
    greek_profile:
      delta_bias: bullish
      theta_sign: neutral
      vega_sign: neutral
      gamma_sign: neutral
      iv_environment: any

  risk_reversal_bear:
    name: "Bear Risk Reversal"
    description: "Buy OTM put + sell OTM call — synthetic short, near-zero cost. Bearish with large downside profit and upside risk above call strike."
    complexity: advanced
    max_legs: 2
    outlook: bearish
    legs:
      - role: long_put_otm
        action: buy_to_open
        option_type: put
        strike_slot: otm_near
        qty_ratio: 1
      - role: short_call_otm
        action: sell_to_open
        option_type: call
        strike_slot: otm_near
        qty_ratio: 1
    risk:
      max_loss: "unlimited above call strike"
      max_profit: "put_strike - net_debit (stock to $0)"
      breakevens: ["put_strike - net_credit  OR  call_strike + net_debit"]
    greek_profile:
      delta_bias: bearish
      theta_sign: neutral
      vega_sign: neutral
      gamma_sign: neutral
      iv_environment: any

  # ── Broken Wing Butterfly ──────────────────────────────────────────────
  # Asymmetric butterfly: wider upside wing to collect net credit or
  # reduce cost. Profits most near body strike; limited loss on one side,
  # larger (but defined) loss on the skipped side.

  broken_wing_butterfly_call:
    name: "Broken Wing Butterfly (Call)"
    description: "Buy 1 call at lower strike, sell 2 calls at mid strike, buy 1 call at far-OTM strike — asymmetric wings, often structured for a small credit."
    complexity: expert
    max_legs: 3
    outlook: neutral
    legs:
      - role: long_call_low
        action: buy_to_open
        option_type: call
        strike_slot: atm
        qty_ratio: 1
      - role: short_call_body
        action: sell_to_open
        option_type: call
        strike_slot: otm_near
        qty_ratio: 2
      - role: long_call_far_wing
        action: buy_to_open
        option_type: call
        strike_slot: otm_far
        qty_ratio: 1
    risk:
      max_loss: "lower_wing_width - net_credit (defined)"
      max_profit: "net_credit + lower_wing_width (at body strike)"
      breakevens: ["low_strike + lower_wing - net_credit"]
    greek_profile:
      delta_bias: neutral
      theta_sign: positive
      vega_sign: negative
      gamma_sign: negative
      iv_environment: high

  broken_wing_butterfly_put:
    name: "Broken Wing Butterfly (Put)"
    description: "Buy 1 put at higher strike, sell 2 puts at mid strike, buy 1 put at far-OTM lower strike — asymmetric wings, typically a small net credit."
    complexity: expert
    max_legs: 3
    outlook: neutral
    legs:
      - role: long_put_high
        action: buy_to_open
        option_type: put
        strike_slot: atm
        qty_ratio: 1
      - role: short_put_body
        action: sell_to_open
        option_type: put
        strike_slot: otm_near
        qty_ratio: 2
      - role: long_put_far_wing
        action: buy_to_open
        option_type: put
        strike_slot: otm_far
        qty_ratio: 1
    risk:
      max_loss: "upper_wing_width - net_credit (defined)"
      max_profit: "net_credit + upper_wing_width (at body strike)"
      breakevens: ["high_strike - upper_wing + net_credit"]
    greek_profile:
      delta_bias: neutral
      theta_sign: positive
      vega_sign: negative
      gamma_sign: negative
      iv_environment: high

  # ── Jade Lizard ────────────────────────────────────────────────────────
  # Short put + short call spread (OTM). No upside risk if call spread
  # credit ≥ call spread width. Profits in a range; defined downside.

  jade_lizard:
    name: "Jade Lizard"
    description: "Sell OTM put + sell OTM call spread — net credit with no upside risk if sized correctly. Profits if stock stays in range or rises moderately."
    complexity: expert
    max_legs: 3
    outlook: neutral
    legs:
      - role: short_put_otm
        action: sell_to_open
        option_type: put
        strike_slot: otm_near
        qty_ratio: 1
      - role: short_call_otm
        action: sell_to_open
        option_type: call
        strike_slot: otm_near
        qty_ratio: 1
      - role: long_call_far_otm
        action: buy_to_open
        option_type: call
        strike_slot: otm_far
        qty_ratio: 1
    risk:
      max_loss: "put_strike - total_credit (downside); zero upside risk if call_credit >= call_spread_width"
      max_profit: "total_net_credit"
      breakevens: ["put_strike - total_credit  (upside: none if structured correctly)"]
    greek_profile:
      delta_bias: bullish
      theta_sign: positive
      vega_sign: negative
      gamma_sign: negative
      iv_environment: high

  # ── Call Backspread ────────────────────────────────────────────────────
  # Sell 1 ATM call, buy 2 OTM calls. Net debit or small credit.
  # Unlimited upside if the stock surges; small loss in the middle zone.

  call_backspread:
    name: "Call Backspread (1×2)"
    description: "Sell 1 ATM call + buy 2 OTM calls — unlimited upside on a big rally, small loss if stock stays near ATM. Volatility + directional bet."
    complexity: expert
    max_legs: 2
    outlook: bullish
    legs:
      - role: short_call_atm
        action: sell_to_open
        option_type: call
        strike_slot: atm
        qty_ratio: 1
      - role: long_call_otm_x2
        action: buy_to_open
        option_type: call
        strike_slot: otm_near
        qty_ratio: 2
    risk:
      max_loss: "spread_width - net_credit (at short strike at expiry)"
      max_profit: "unlimited above upper breakeven"
      breakevens: ["lower: atm + spread - net_credit", "upper: otm + net_debit / qty_ratio"]
    greek_profile:
      delta_bias: bullish
      theta_sign: negative
      vega_sign: positive
      gamma_sign: positive
      iv_environment: low

  put_backspread:
    name: "Put Backspread (1×2)"
    description: "Sell 1 ATM put + buy 2 OTM puts — large profit on a crash, small loss if stock stays near ATM. Bearish volatility + directional bet."
    complexity: expert
    max_legs: 2
    outlook: bearish
    legs:
      - role: short_put_atm
        action: sell_to_open
        option_type: put
        strike_slot: atm
        qty_ratio: 1
      - role: long_put_otm_x2
        action: buy_to_open
        option_type: put
        strike_slot: otm_near
        qty_ratio: 2
    risk:
      max_loss: "spread_width - net_credit (at short strike at expiry)"
      max_profit: "substantial below lower breakeven (stock to $0)"
      breakevens: ["upper: atm - spread + net_credit", "lower: otm - net_debit / qty_ratio"]
    greek_profile:
      delta_bias: bearish
      theta_sign: negative
      vega_sign: positive
      gamma_sign: positive
      iv_environment: low
