# CUI // SP-CTI
# ICDEV™ Cloud Vendor Policy — default CSP selection for auto-remediation
#
# This file encodes the organization's standing decisions about which cloud
# provider (or network vendor) to use for each workload type and security
# control. Read by tools/canvas/auto_remediator.py when applying IDC (infra)
# handlers so the remediator doesn't have to guess vendors.
#
# Policy authority: Sovanna Chuon (ICDEV™ owner)
# Adopted: 2026-04-10
# Last updated: 2026-04-10
#
# To change a default: update this file, then re-run:
#   python tools/canvas/auto_remediator.py --canvas infra --all-pending
#
# --- Rules ------------------------------------------------------------------
#
# 1. AWS is the primary Cloud Service Provider.
#    - Use Azure for Windows and AVD (Azure Virtual Desktop) workloads.
#    - Use Oracle Cloud Infrastructure (OCI) for Human Capital Management (HCM).
#    - Use Google Cloud Platform (GCP) for AI and Machine Learning workloads.
#      Other CSPs can also do AI.
#
# 2. AWS and Microsoft Azure can handle DoD IL4/IL5 by default.
#    (GovCloud and Azure Government regions respectively.)
#
# 3. Edge routers — use Cisco or Juniper for all edge connectivity:
#    Internet ingress/egress, BCAP (Boundary Cloud Access Point), AWS DX
#    (Direct Connect), Azure ExpressRoute (ER), GCP Interconnect, etc.
#
# --- How this maps to auto_remediator IDC handlers --------------------------

# Primary CSP — used as the default for every vendor-neutral infra check
# unless a workload-specific override applies.
primary_csp: aws

# Workload → CSP overrides. The remediator picks the override when the design
# contains context hinting at the workload (label contains "Windows", "AVD",
# "HCM", "AI", "ML", etc.) — otherwise falls back to primary_csp.
workload_overrides:
  windows: azure
  avd: azure           # Azure Virtual Desktop
  hcm: oci             # Human Capital Management
  ai: gcp              # Primary; others acceptable
  ml: gcp

# Impact level coverage — which CSPs can self-serve each IL without extra
# steps. Used to filter eligible CSPs in air-gap/high-IL scenarios.
impact_level_coverage:
  il2: [aws, azure, gcp, oci, ibm]
  il4: [aws, azure]    # "by default" per rule 2
  il5: [aws, azure]    # "by default" per rule 2
  il6: []              # SIPR only — no commercial CSP can serve this unaided

# --- Vendor-specific defaults per IDC rule ---------------------------------
#
# When auto_remediator sees an IDC finding, it looks up the rule_id below and
# picks the default node type to add. Each entry maps to a valid node type
# that tools/infra_canvas/infra_engine.py checks against.

idc_defaults:
  IDC-IAM-001:         # IAM/IdP service present
    primary: aws-iam
    workload_map:
      windows: az-entra
      avd: az-entra
    label: "AWS IAM (primary IdP per cloud_vendor_policy.yaml)"
    rationale: "AWS primary CSP; Azure Entra for Windows/AVD workloads."
    nist: [IA-2, "IA-2(1)", "IA-2(2)", IA-5, AC-2, AC-3]

  IDC-ENC-003:         # KMS present
    primary: aws-kms
    workload_map:
      windows: az-keyvault
      avd: az-keyvault
    label: "AWS KMS (FIPS 140-2 validated; CloudHSM for IL5+)"
    rationale: "AWS primary CSP. AWS KMS is FIPS 140-2 validated and GovCloud-ready."
    nist: [SC-12, SC-13, SC-28, "SC-28(1)"]

  IDC-IAM-002:         # Centralized secrets manager
    primary: aws-secrets
    workload_map:
      windows: az-keyvault
      avd: az-keyvault
    label: "AWS Secrets Manager (primary per cloud_vendor_policy.yaml)"
    rationale: "AWS primary CSP. Secrets Manager handles IL4/5 by default."
    nist: [IA-5, "IA-5(1)", SC-12, CM-6]

  IDC-SEC-001:         # CSPM / Security posture
    primary: aws-securityhub
    workload_map:
      windows: az-defender
      avd: az-defender
    label: "AWS Security Hub + Config (CSPM for primary CSP)"
    rationale: "AWS primary CSP. Security Hub aggregates findings from Config, GuardDuty, Inspector, Macie."
    nist: [CA-7, CM-2, CM-6, RA-5, SI-4]

  IDC-IAC-001:         # Infrastructure as Code tool
    primary: iac-terraform
    workload_map: {}   # Terraform works across all CSPs; no override needed
    label: "Terraform (GovCloud de facto standard; multi-cloud ready)"
    rationale: >
      Terraform is the de facto IaC standard for AWS GovCloud, Azure Gov,
      and multi-cloud deployments. Not specified explicitly in the policy,
      but chosen as the default because it's the only IaC tool that serves
      all three policy-sanctioned CSPs (AWS, Azure, OCI) without
      re-implementation.
    nist: [CM-2, CM-3, CM-6, CM-8, SA-10]

# --- Network edge equipment defaults (rule 3) -----------------------------
#
# For any future infra rule that checks for edge routers (BCAP, DX, ER,
# internet ingress), use Cisco as primary + Juniper as secondary. Labels
# should indicate role (e.g., "BCAP edge router"). No IDC rule currently
# checks for these, but the defaults are documented here for completeness
# and for the network_canvas / boundary_canvas handlers that will need them.
#
# ⚠ SOURCE OF TRUTH: the real vendor/model catalog lives in the Network
# Design Canvas DB — data/network_canvas.db — which already has 27 hardware
# profiles and 7 device profiles. Any handler that needs a specific model
# should query the catalog at runtime, not duplicate it here.

edge_router_defaults:
  primary_vendor: cisco
  secondary_vendor: juniper
  supported_roles:
    - internet_ingress
    - internet_egress
    - bcap                # Boundary Cloud Access Point
    - aws_dx              # Direct Connect
    - azure_er            # ExpressRoute
    - gcp_interconnect

  # Reference into the canonical catalog. Read via:
  #   sqlite3 data/network_canvas.db \
  #     "SELECT vendor, model, device_type FROM nc_hardware_profiles
  #      WHERE vendor IN ('Cisco','Juniper') AND device_type = 'router'"
  catalog_source:
    db: data/network_canvas.db
    hardware_table: nc_hardware_profiles
    device_profile_table: nc_device_profiles

  # Snapshot of catalog models as of 2026-04-10 — kept here as a hint for
  # the auto_remediator UI; authoritative list is the DB query above.
  catalog_snapshot:
    cisco_routers:
      - ASR-1001-X          # 10-20 Gbps edge router, small-med branch
      - ASR-1002-HX         # 100 Gbps edge, large branch / DC edge
      - ASR-9901            # 1.2 Tbps provider edge
      - 8101-32H            # 400G silicon one
      - 8102-64H            # 400G silicon one, denser
      - 8201                # 32x100G/400G modular
      - 8202                # 32x400G modular
    juniper_routers:
      - MX204               # 400 Gbps compact edge
      - MX240               # 2 Tbps provider edge
      - MX304               # 4.8 Tbps service provider
      - MX480               # 9.6 Tbps provider edge
      - MX960               # 19.2 Tbps core/edge
      - MX10003             # 1.2 Tbps cloud router
      - MX10008             # 9.6 Tbps cloud router
      - MX150               # 20 Gbps compact branch

  # Device profile IDs for running-config collection / parsing — also
  # sourced from nc_device_profiles.
  device_profiles:
    cisco_ios_xe: prof-cisco-ios
    cisco_nxos: prof-cisco-nxos
    juniper_junos: prof-juniper-junos
    arista_eos: prof-arista-eos        # secondary, not primary per policy
    palo_alto_panos: prof-palo-alto-panos
    fortinet_fortios: prof-fortinet-fortios

# --- Architecture templates (reference into NDC) --------------------------
#
# The NDC already ships 81 architecture templates including SCCA / Landing
# Zone, Well-Architected Security Baselines for every CSP, and VDI/DaaS
# references. When auto_remediator needs to scaffold a NEW design from
# scratch, it should load one of these templates instead of emitting bare
# placeholder nodes.

architecture_templates:
  source:
    db: data/network_canvas.db
    table: nc_templates

  # Default scaffold for any new AWS GovCloud design
  aws_primary_scaffold: tpl-scca-aws-gov       # "SCCA Network Architecture (AWS GovCloud)"

  # Windows / AVD workloads (policy rule 1)
  azure_avd_scaffold: tpl-scca-azure-h         # "Azure SCCA Hub-Spoke"

  # IL4/IL5 coverage (policy rule 2)
  il4_il5_scaffolds:
    aws: tpl-scca-aws                          # "AWS SCCA Multi-Account (GovCloud)"
    azure: tpl-scca-azure                      # "Azure SACA Hub-Spoke"

  # Security baselines (NIST SP 800-53 starting points) — one per CSP
  security_baselines:
    aws: tpl-wa-security-                      # "AWS Well-Architected Security Baseline"
    azure: tpl-az-security-                    # "Azure Security Baseline — Hub-Spoke"
    gcp: tpl-gcp-security                      # "GCP Security Foundations Baseline"
    ibm: tpl-ibm-security                      # "IBM Cloud Security Baseline"
    oci: tpl-oci-security                      # "OCI Security Posture Baseline"

  # Zero-trust + micro-segmentation references (for SEC-ZT-001 / SEC-SEG-001)
  zero_trust_reference: tpl-zero-trust         # "Zero Trust Architecture (NIST 800-207)"
  micro_segmentation: tpl-microseg             # "Micro-Segmentation (Distributed Firewall)"

  # VDI / DaaS (policy rule 1: "Azure for Windows and AVD workloads")
  vdi_avd_template_category: "VDI / DaaS"      # 5 templates available in NDC

# --- Canvas-wide artifact catalog ------------------------------------------
#
# Every canvas ships its own templates + snippets (+ sometimes runbooks + SOPs).
# Total: 349 artifacts across 9 canvases as of 2026-04-10. auto_remediator
# handlers should PREFER instantiating from these artifacts over emitting bare
# placeholder nodes. The catalog is inventoried here so handlers know which
# table to query for each canvas.
#
# Inventory (2026-04-10):
#   SDC (security)   15 templates, 13 snippets,  4 SOPs         = 32
#   IDC (infra)      18 templates, 22 snippets                   = 40
#   ODC (obs)         5 templates,  8 snippets,  4 SOPs         = 17
#   BDC (boundary)    8 templates, 10 snippets, 4 runbooks, 4 SOPs = 26
#   DDC (data)        6 templates,  8 snippets                   = 14
#   NDC (network)    81 templates + 18 template docs, 22 snippets = 121
#   PDC (pipeline)   17 templates, 16 snippets,  4 SOPs         = 37
#   QDC (quality)     5 templates,  8 snippets, 6 runbooks, 4 SOPs = 23
#   MDC (migration)  10 templates, 15 snippets, 8 runbooks, 6 SOPs = 39

canvas_artifact_catalog:
  security:
    db: data/security_canvas.db
    templates_table: sc_templates
    snippets_table: sc_snippets
    sops_table: sdc_sops
  infra:
    db: data/infra_canvas.db
    templates_table: idc_templates
    snippets_table: idc_snippets
  observability:
    db: data/observability_canvas.db
    templates_table: od_templates
    snippets_table: od_snippets
    sops_table: odc_sops
  boundary:
    db: data/boundary_canvas.db
    templates_table: bd_templates
    snippets_table: bd_snippets
    runbooks_table: bdc_runbooks
    sops_table: bdc_sops
  data:
    db: data/data_canvas.db
    templates_table: dd_templates
    snippets_table: dd_snippets
  network:
    db: data/network_canvas.db
    templates_table: nc_templates           # 81 design templates
    template_docs_table: nc_template_docs   # 18 reference docs
    snippets_table: nc_enclave_snippets     # 22 enclave snippets
    hardware_profiles_table: nc_hardware_profiles
    device_profiles_table: nc_device_profiles
  pipeline:
    db: data/pipeline_canvas.db
    templates_table: pc_templates
    snippets_table: pc_snippets
    sops_table: pdc_sops
  quality:
    db: data/qdc_canvas.db
    templates_table: qdc_templates
    snippets_table: qdc_snippets
    runbooks_table: qdc_runbooks
    sops_table: qdc_sops
  migration:
    db: data/migration_canvas.db
    templates_table: mc_templates
    snippets_table: mc_snippets
    runbooks_table: mc_runbooks
    sops_table: mc_sops

# --- IDC reference architecture (preferred over placeholder nodes) --------
#
# When the auto_remediator IDC handlers fire, they should MERGE nodes from
# this template into the target design rather than adding bare placeholder
# nodes. The template already contains a coherent vendor-consistent set of
# nodes (aws-iam, aws-kms, aws-secrets, aws-securityhub, iac-terraform,
# plus aws-aurora, aws-backup, aws-config, aws-ec2-dedicated, aws-ecr,
# aws-eks, aws-s3) — matching policy rule 2 (AWS handles IL4/5 by default).

idc_reference_template:
  canvas: infra
  lookup_by_name: "DoD IL4 Reference (AWS GovCloud)"
  # alt by-id lookup in case the name changes — look up with:
  #   sqlite3 data/infra_canvas.db "SELECT id FROM idc_templates WHERE name LIKE 'DoD IL4%'"
  covers_idc_rules:
    - IDC-IAM-001    # aws-iam
    - IDC-ENC-003    # aws-kms
    - IDC-IAM-002    # aws-secrets
    - IDC-SEC-001    # aws-securityhub + aws-config
    - IDC-IAC-001    # iac-terraform
  merge_strategy: "add_missing_node_types_only"  # don't duplicate types already in target

# Azure variant for Windows/AVD workloads (policy rule 1)
idc_reference_template_azure:
  canvas: infra
  lookup_by_name: "Azure CAF Landing Zone (Hub-Spoke)"
  covers_idc_rules: [IDC-IAM-001, IDC-ENC-003, IDC-IAM-002, IDC-SEC-001]
  merge_strategy: "add_missing_node_types_only"
