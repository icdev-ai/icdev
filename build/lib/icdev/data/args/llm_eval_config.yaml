# OPT-64 — LLM eval runner defaults.
# Consumed by tools/llm/eval_runner.py.
default_timeout_seconds: 60
default_temperature: 0.3
default_max_tokens: 512
report_dir: ./reports/llm_evals
html_report_enabled: true

# Semantic similarity assertion (not yet wired) would use this embedder.
# Kept for forward compatibility with the OPT-64 spec.
embedder: nomic-embed-text
