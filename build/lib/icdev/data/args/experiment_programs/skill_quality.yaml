# CUI // SP-CTI
# Autoresearch Experiment Program — Skill Quality Domain
#
# Optimizes Claude Code skill assertion pass rates.
# Modifies hardprompts, goals, and skill definitions.

domain: skill_quality

objective:
  metric_name: assertion_pass_rate
  direction: maximize
  measurement_command: "python tools/autoresearch/fitness_evaluator.py --evaluate skill_quality --json"
  metric_path: "metric_value"

modifiable_paths:
  - hardprompts/
  - goals/
  - .claude/commands/

forbidden_paths:
  - tools/db/storage.py
  - tools/db/init_icdev_db.py
  - .env
  - .claude/hooks/

time_budget_seconds: 300
keep_threshold: 0.01

category_order:
  - hardprompt_refinement
  - goal_clarity
  - tool_chain_optimization

categories:
  hardprompt_refinement:
    description: "Improve hardprompt templates for clearer LLM instructions"
    risk: low
    example_hypotheses:
      - "Add explicit output format constraints to reduce parsing failures"
      - "Add few-shot examples to hardprompts with low pass rates"
  goal_clarity:
    description: "Improve goal workflow definitions for unambiguous execution"
    risk: low
    example_hypotheses:
      - "Add explicit error handling guidance for common failure modes"
      - "Clarify step ordering and dependencies in multi-step goals"
  tool_chain_optimization:
    description: "Optimize tool invocation sequences in skill definitions"
    risk: medium
    example_hypotheses:
      - "Reorder tool calls to fail-fast on validation before expensive operations"
      - "Add pre-checks to avoid unnecessary tool invocations"
