# CUI // SP-CTI
# Autoresearch Experiment Program — Marketplace Asset Quality Domain
#
# Optimizes marketplace asset quality scoring, scanning gates,
# search ranking, and approval workflows.

domain: marketplace_asset_quality

objective:
  metric_name: marketplace_quality_score
  direction: maximize
  measurement_command: "python tools/autoresearch/fitness_evaluator.py --evaluate marketplace_asset_quality --json"
  metric_path: "metric_value"

modifiable_paths:
  - tools/marketplace/
  - args/marketplace_config.yaml

forbidden_paths:
  - tools/db/storage.py
  - tools/db/init_icdev_db.py
  - .env

time_budget_seconds: 300
keep_threshold: 0.01

category_order:
  - scan_gate_tuning
  - search_ranking
  - approval_workflow
  - quality_scoring

categories:
  scan_gate_tuning:
    description: "Optimize scanning gate thresholds to balance security vs. false positives"
    risk: medium
    example_hypotheses:
      - "Adjust SAST severity threshold to reduce false positive rate on args assets"
      - "Increase dependency audit freshness window from 90 to 60 days"
      - "Add data-category detection to CUI marking validation"
  search_ranking:
    description: "Improve marketplace search result relevance"
    risk: low
    example_hypotheses:
      - "Increase semantic_weight from 0.4 to 0.5 for better concept matching"
      - "Add recency boost for recently-updated assets"
      - "Penalize assets with low installation count in ranking"
  approval_workflow:
    description: "Optimize review queue efficiency and turnaround time"
    risk: low
    example_hypotheses:
      - "Auto-approve tenant_local assets with scan pass rate >= 95%"
      - "Reduce review wait threshold from 24h to 12h for low-risk asset types"
  quality_scoring:
    description: "Improve composite asset quality score accuracy"
    risk: low
    example_hypotheses:
      - "Increase rating weight from 0.25 to 0.35 for more user-driven scoring"
      - "Add maintenance freshness signal (last update age) to quality composite"
      - "Weight download velocity higher than total downloads for trending detection"
