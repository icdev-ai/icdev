# FathomDesk LLM Routing — Ollama primary, Claude secondary
two_tier:
  enabled: true
  tier1_model: qwen3.5-local
  tier2_model: claude-sonnet-api

  # Scanner: Ollama only (free, local)
  scanner_functions:
    - analyze_fundamentals
    - analyze_sentiment
    - analyze_news
    - analyze_technicals
    - risk_assessment
    - market_data_parse
    - news_classify           # FathomDesk news classifier fallback (plan adn-)
    - news_scenario_match     # FathomDesk news scenario matcher fallback (plan adn-)
    - news_reasoning          # INTaaS multiperspective news analysis (tier-1 only)

  # Worker: Ollama draft -> Claude review
  worker_functions:
    - bull_bear_debate
    - trade_decision
    - signal_generation

  # Planner: Claude direct
  planner_functions:
    - portfolio_approval
    - pulse_market_article
