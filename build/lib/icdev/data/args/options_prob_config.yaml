# CUI // SP-CTI
# FathomDesk Phase 7.7 — Monte Carlo probability config.
#
# Consumed by tools/trading/options/probability.py. Hot-reloadable.

_schema_version: 1

# Number of Monte Carlo paths. 10k gives stable POP within ~0.5% on a
# typical single-leg call. Lower for faster dashboards, higher for
# research-grade numbers.
n_samples: 10000

# Deterministic seed — keyed off (underlying, expiry, sorted strikes)
# so repeat renders of the same proposal produce the same numbers.
# Useful for "did the picture just change because I reloaded?" UX.
deterministic_seed: true

# Percentile bands for the price-cone overlay. The chart shades
# between (p5, p95) lightly and (p25, p75) more densely, with p50 as
# a dashed median line.
cone_bands: [5, 25, 50, 75, 95]

# Fallback IV (annualized, percent) when the chain doesn't expose it.
# Conservative default — high enough to keep POP from being wildly
# overconfident when we're guessing.
default_iv_fallback_pct: 40

# Below this DTE, skip MC entirely (returns null). Intraday payoffs
# need a different model (realized vol, order-book imbalance) that
# we're not building here.
min_dte_for_monte_carlo: 1

# Drift assumption. Default 0 (risk-neutral / martingale) — common
# convention for option modeling. Operators can override with a
# small positive value for long-horizon equities if desired.
annual_drift_pct: 0.0
