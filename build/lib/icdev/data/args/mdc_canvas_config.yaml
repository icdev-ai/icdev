# CUI // SP-CTI
# Migration Design Canvas — Configuration
app:
  name: "Migration Design Canvas"
  version: "1.0.0"
  classification: "CUI // SP-CTI"

database:
  path: "mdc_canvas.db"
  wal_mode: true
  foreign_keys: true

canvas:
  autosave_delay_ms: 3000
  grid_size: 10
  default_width: 130
  default_height: 50
  accent_color: "#795548"

uqs:
  weights:
    migration_readiness: 0.30
    compliance_readiness: 0.25
    risk_mitigation: 0.20
    planning_completeness: 0.15
    security_posture: 0.10
  thresholds:
    merge: 70
    deploy: 80
    release: 85
  grade_scale:
    A: 90
    B: 80
    C: 70
    D: 60

assessment:
  auto_assess_on_save: true
  default_rules:
    - MDC-SRC-001  # Source systems identified
    - MDC-SRC-002  # Source system inventory complete
    - MDC-SRC-003  # Dependency graph generated
    - MDC-TGT-001  # Target environment defined
    - MDC-TGT-002  # Target CSP / region confirmed
    - MDC-TGT-003  # Target impact level validated (IL4/IL5)
    - MDC-PAT-001  # Migration pattern selected (7Rs)
    - MDC-PAT-002  # Pattern rationale documented
    - MDC-CPL-001  # Compliance bridge present
    - MDC-CPL-002  # ATO gate for GovCloud targets
    - MDC-CPL-003  # cATO continuous authorization plan
    - MDC-RBK-001  # Rollback plan defined
    - MDC-RBK-002  # Rollback tested in lower environment
    - MDC-SEC-001  # Security scan in migration path
    - MDC-SEC-002  # Data encryption during transit
    - MDC-SEC-003  # Secrets rotated post-migration
    - MDC-TST-001  # Test gate before cutover
    - MDC-TST-002  # Smoke test suite defined
    - MDC-DAT-001  # Data migration strategy documented
    - MDC-DAT-002  # Data integrity validation plan
    - MDC-WAV-001  # Wave plan defined
    - MDC-WAV-002  # Dependencies respected across waves
  thresholds:
    min_score: 70
    cat1_max: 0
    cat2_max: 5

gates:
  mdc_sast:
    tool: "tools/security/sast_runner.py"
    blocking: false
    dimension: security_posture
  mdc_compliance:
    tool: "tools/compliance/multi_regime_assessor.py"
    blocking: true
    dimension: compliance_readiness
  mdc_stig:
    tool: "tools/compliance/stig_checker.py"
    blocking: true
    dimension: compliance_readiness
  mdc_health:
    tool: "tools/monitor/health_checker.py"
    blocking: false
    dimension: migration_readiness
  mdc_integrity:
    tool: "tools/security/blueprint_verifier.py"
    blocking: false
    dimension: security_posture
  mdc_coverage:
    tool: "tools/testing/test_orchestrator.py"
    blocking: true
    dimension: risk_mitigation
    min_coverage: 70

readiness:
  weights:
    completeness: 0.35
    compliance: 0.25
    risk_mitigation: 0.20
    planning: 0.20
  thresholds:
    ready: 80
    conditional: 60
    not_ready: 0

migration_patterns:
  - rehost
  - refactor
  - rearchitect
  - retain
  - retire
  - relocate
  - repurchase

wave_planning:
  enabled: true
  max_wave_size: 10
  dependency_analysis: true

oracle:
  enabled: true
  lens: "tools/oracle/lenses/lens_migration.py"

evidence:
  format: "oscal_json"
  retention_days: 365
  auto_emit: true

runbooks:
  auto_execute_confidence: 0.7
  max_auto_per_hour: 5
  cooldown_seconds: 600

templates:
  count: 6
  auto_seed: true

agent:
  auto_trigger_on_canvas_save: true
  auto_trigger_sdc_on_save: true
  auto_trigger_qdc_on_save: true
  cross_canvas_sync: true

logging:
  level: INFO
  audit_enabled: true
