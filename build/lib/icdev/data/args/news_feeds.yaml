# CUI // SP-CTI
# ICDEV™ — FathomDeskADN News Feed Configuration
#
# RSS/Atom feed registry for the Autonomous Data Network (ADN) ingest layer.
# All URLs verified HTTP 200 as of 2026-04-14. No API keys required.
#
# Groups: macro | financial | geopolitical | sector | corporate
# Each entry: {name, url}
#
# Override poll cadence via environment:
#   ICDEV_FEEDS_POLL_INTERVAL=15
#
# Classification: CUI // SP-CTI

classification: "CUI // SP-CTI"

# ── Polling & Retention ────────────────────────────────────────────────────────

poll_interval_minutes: 15        # How often the ingest worker fetches each feed
max_items_per_feed: 30           # Max items retained per fetch cycle
retention_days: 90               # Days to keep raw feed items before purge

# ── Signal Promotion Thresholds ───────────────────────────────────────────────
# Number of independent feed hits required to promote a signal to the next tier.

promotion_thresholds:
  emerging: 3    # ≥3 hits → Emerging signal
  cluster:  6    # ≥6 hits → Cluster (multi-source corroboration)
  regime:   10   # ≥10 hits → Regime-level signal (systemic shift)

# ── Feed Groups ───────────────────────────────────────────────────────────────

feeds:

  # ── Macro-Economic ─────────────────────────────────────────────────────────
  # Primary source for monetary policy, employment data, GDP, and fiscal signals.

  macro:
    - name: "Federal Reserve — Press Releases"
      url: "https://www.federalreserve.gov/feeds/press_all.xml"

    - name: "FRED Blog — St. Louis Fed"
      url: "https://fredblog.stlouisfed.org/feed/"

    - name: "BEA — Bureau of Economic Analysis News"
      url: "https://www.bea.gov/news/rss"

    - name: "BEA — Data Release RSS"
      url: "https://apps.bea.gov/rss/rss.xml"

    - name: "Congressional Budget Office — Publications"
      url: "https://www.cbo.gov/publications/all/rss.xml"

    - name: "U.S. Treasury — News & Press"
      url: "https://home.treasury.gov/rss.xml"

  # ── Financial Markets ──────────────────────────────────────────────────────
  # Market-moving headlines, analyst commentary, and equities news.

  financial:
    - name: "CNBC — Top News"
      url: "https://search.cnbc.com/rs/search/combinedcms/view.xml?partnerId=wrss01&id=100003114"

    - name: "Seeking Alpha — Market Currents"
      url: "https://seekingalpha.com/market-news/rss"

    - name: "MarketWatch — Top Stories"
      url: "https://feeds.marketwatch.com/marketwatch/topstories/"

    - name: "Nasdaq — Markets News"
      url: "https://www.nasdaq.com/feed/rssoutbound?category=Markets"

    - name: "Yahoo Finance — News Index"
      url: "https://finance.yahoo.com/news/rssindex"

    - name: "Bloomberg — Technology News"
      url: "https://feeds.bloomberg.com/technology/news.rss"

  # ── Geopolitical ───────────────────────────────────────────────────────────
  # Global political risk, international affairs, and conflict signals.

  geopolitical:
    - name: "BBC News — World"
      url: "http://feeds.bbci.co.uk/news/world/rss.xml"

    - name: "Al Jazeera — All News"
      url: "https://www.aljazeera.com/xml/rss/all.xml"

    - name: "AP News — World News"
      url: "https://apnews.com/hub/world-news?format=rss"

    - name: "AP News — Business"
      url: "https://apnews.com/hub/business?format=rss"

    - name: "NPR — World News"
      url: "https://feeds.npr.org/1004/rss.xml"

    - name: "Yahoo News — World"
      url: "https://news.yahoo.com/rss/world"

  # ── Sector-Specific ────────────────────────────────────────────────────────
  # Defense, energy, semiconductors, and biotech verticals.

  sector:
    # Defense & Aerospace
    - name: "Defense News"
      url: "https://www.defensenews.com/arc/outboundfeeds/rss/"

    - name: "C4ISRNET — Defense Technology"
      url: "https://www.c4isrnet.com/arc/outboundfeeds/rss/"

    - name: "Breaking Defense"
      url: "https://breakingdefense.com/feed/"

    # Energy & Oil
    - name: "Oil & Gas Journal"
      url: "https://www.ogj.com/rss"

    - name: "Rigzone — Latest News"
      url: "https://www.rigzone.com/news/rss/rigzone_latest.aspx"

    - name: "Offshore Technology"
      url: "https://www.offshore-technology.com/feed/"

    # Semiconductors
    - name: "Semiconductor Engineering"
      url: "https://semiengineering.com/feed/"

    # Biotech & Life Sciences
    - name: "Endpoints News — Biopharma"
      url: "https://endpts.com/feed/"

  # ── Corporate Filings & Procurement ───────────────────────────────────────
  # SEC disclosures and federal spend signals.

  corporate:
    - name: "SEC EDGAR — 8-K Current Filings"
      url: "https://efts.sec.gov/LATEST/search-index?q=%228-K%22&forms=8-K"

    - name: "USASpending — News & Updates"
      url: "https://www.usaspending.gov/about/news/rss.xml"
