# CUI // SP-CTI
# QDC Workflow — Quality Design Canvas
# Full 12-step pipeline: quality scan → gate check → IaC → QA gate → validate → apply → verify

description: "QDC: quality metric scan, gate check, IaC generation, QA gate, Terraform/Ansible validate, migration report, apply approval, Terraform apply, AWS verification, post-deploy validation"
category: deploy
canvas: qdc

steps:
  # ── Canvas-specific steps (QDC only) ─────────────────────────────────────
  - id: step_1
    name: Quality Scan
    tool: tools/qdc/quality_scanner.py
    node_type: tool
    required: true
    timeout: 300
    depends_on: []
    description: Collect code quality metrics — coverage, complexity, tech debt, defect density.

  - id: step_2
    name: Gate Check
    tool: tools/qdc/gate_checker.py
    node_type: tool
    required: true
    timeout: 300
    depends_on: [step_1]
    description: Evaluate metrics against defined quality gates and DoD software quality thresholds.

  - id: step_3
    name: Generate IaC
    tool: tools/qdc/iac_generator.py
    node_type: tool
    required: true
    timeout: 600
    depends_on: [step_2]
    description: >
      Generate Terraform (.tf), Ansible playbook (.yml), inventory (.ini),
      validation script (.py), and checklist (.md) for quality toolchain infrastructure.
      Output: data/studio_artifacts/qdc/ — consumed by all downstream steps.

  - id: step_4
    name: QA Approval
    node_type: human
    required: true
    role: approver
    timeout: 86400
    tool: ""
    depends_on: [step_3]
    description: >
      QA lead reviews quality gate results and IaC before provisioning begins.
      Telegram: /approve <step_run_id> or /reject <step_run_id> [reason].

  # ── Shared executor steps (canvas-agnostic) ───────────────────────────────
  - id: step_5
    name: Terraform Plan
    tool: tools/studio/executors/terraform_plan.py
    node_type: tool
    required: true
    timeout: 300
    depends_on: [step_4]

  - id: step_6
    name: Ansible Execute
    tool: tools/studio/executors/ansible_executor.py
    node_type: tool
    required: true
    timeout: 300
    depends_on: [step_4]

  - id: step_7
    name: Validation Run
    tool: tools/studio/executors/validation_runner.py
    node_type: tool
    required: true
    timeout: 120
    depends_on: [step_4]

  - id: step_8
    name: Migration Report
    tool: tools/studio/executors/migration_reporter.py
    node_type: tool
    required: true
    timeout: 60
    depends_on: [step_5, step_6, step_7]

  - id: step_9
    name: Apply Approval
    node_type: human
    required: true
    role: infrastructure_approver
    timeout: 86400
    tool: ""
    depends_on: [step_5, step_6, step_7]
    description: >
      Human gate before applying quality toolchain infrastructure to AWS.
      Telegram: /approve <step_run_id> or /reject <step_run_id> [reason].

  - id: step_10
    name: Terraform Apply
    tool: tools/studio/executors/terraform_apply.py
    node_type: tool
    required: true
    timeout: 900
    depends_on: [step_9]

  - id: step_11
    name: AWS Config Execute
    tool: tools/studio/executors/aws_config_executor.py
    node_type: tool
    required: false
    timeout: 600
    depends_on: [step_10]

  - id: step_12
    name: Post-deploy Validation
    tool: tools/studio/executors/validation_runner.py
    node_type: tool
    required: false
    timeout: 300
    depends_on: [step_10]
