# CUI // SP-CTI
# NDC GNS3 Zero Touch Provisioning Workflow
#
# Discovers a live GNS3 topology, generates per-device configs,
# gates on human review, then pushes via Ansible with post-push validation.
#
# Prerequisites:
#   - GNS3 server running (GNS3_SERVER in .env)
#   - Lab topology built: python tools/ndc/gns3_topology_builder.py
#   - ansible-galaxy collection install community.routeros ansible.netcommon
#
# Step mapping:
#   1. GNS3 Topology Probe     — discover live nodes/links, seed ndc_topologies
#   2. ZTP Config Generator    — generate .rsc configs + Ansible playbook
#   3. Network Config Review   — HITL: engineer reviews before push
#   4. Ansible ZTP Push        — push configs to all routers via SSH
#   5. Connectivity Validation — syntax-check playbook, report generation
#   6. ZTP Complete Report     — final summary artifact

description: "NDC GNS3 ZTP: topology probe, config generation, human gate, Ansible push to MikroTik routers, post-push validation"
category: deploy
canvas: ndc

steps:
  - id: step_1
    name: GNS3 Topology Probe
    tool: tools/ndc/gns3_topology_probe.py
    node_type: tool
    required: true
    timeout: 60
    depends_on: []
    description: >
      Queries GNS3 REST API, discovers all nodes and links in the lab project,
      maps them to ICDEV NDC topology format, seeds ndc_topologies DB table,
      and generates Ansible inventory.

  - id: step_2
    name: ZTP Config Generator
    tool: tools/ndc/ztp_config_generator.py
    node_type: tool
    required: true
    timeout: 120
    depends_on: [step_1]
    description: >
      Reads topology from ndc_topologies DB, generates MikroTik RouterOS .rsc
      ZTP scripts per device, VPCS startup configs, and Ansible ZTP playbook.

  - id: step_3
    name: Network Config Review
    node_type: human
    required: true
    role: network_approver
    timeout: 86400
    tool: ""
    depends_on: [step_2]
    description: >
      Network engineer reviews generated .rsc configs and Ansible playbook
      before any config is pushed to devices.
      Telegram: /approve <step_run_id> or /reject <step_run_id> [reason].

  - id: step_4
    name: ZTP Console Push
    tool: tools/ndc/ztp_console_push.py
    node_type: tool
    required: true
    timeout: 600
    depends_on: [step_3]
    description: >
      Pushes generated .rsc configs to each MikroTik router via GNS3 telnet
      console ports (localhost:PORT). No SSH or routable IP required — works
      before the device has any IP configured. Discovers console ports from
      GNS3 API and sends commands line-by-line.

  - id: step_5
    name: Post-ZTP Validation
    tool: tools/studio/executors/validation_runner.py
    node_type: tool
    required: true
    timeout: 120
    depends_on: [step_4]
    description: >
      Validates generated artifacts syntax and reports check catalog.

  - id: step_6
    name: ZTP Complete Report
    tool: tools/studio/executors/migration_reporter.py
    node_type: tool
    required: false
    timeout: 60
    depends_on: [step_4, step_5]
    description: Generates final ZTP completion report with applied changes summary.
