# CUI // SP-CTI
# SDC Workflow — Security Design Canvas
# Full 12-step pipeline: threat scan → STIG check → IaC → ISSO gate → validate → apply → verify

description: "SDC: threat model scan, STIG compliance check, IaC generation, ISSO gate, Terraform/Ansible validate, migration report, apply approval, Terraform apply, AWS verification, post-deploy validation"
category: deploy
canvas: sdc

steps:
  # ── Canvas-specific steps (SDC only) ─────────────────────────────────────
  - id: step_1
    name: Threat Scan
    tool: tools/sdc/threat_scanner.py
    node_type: tool
    required: true
    timeout: 300
    depends_on: []
    description: Build threat model, identify attack vectors and adversary TTPs.

  - id: step_2
    name: STIG Check
    tool: tools/sdc/stig_checker.py
    node_type: tool
    required: true
    timeout: 300
    depends_on: [step_1]
    description: Evaluate DISA STIG findings against system components (CAT1/CAT2/CAT3).

  - id: step_3
    name: Generate IaC
    tool: tools/sdc/iac_generator.py
    node_type: tool
    required: true
    timeout: 600
    depends_on: [step_2]
    description: >
      Generate Terraform (.tf), Ansible playbook (.yml), inventory (.ini),
      validation script (.py), and checklist (.md) for security infrastructure.
      Output: data/studio_artifacts/sdc/ — consumed by all downstream steps.

  - id: step_4
    name: ISSO Approval
    node_type: human
    required: true
    role: approver
    timeout: 86400
    tool: ""
    depends_on: [step_3]
    description: >
      ISSO reviews security IaC and STIG findings before provisioning begins.
      Telegram: /approve <step_run_id> or /reject <step_run_id> [reason].

  # ── Shared executor steps (canvas-agnostic) ───────────────────────────────
  - id: step_5
    name: Terraform Plan
    tool: tools/studio/executors/terraform_plan.py
    node_type: tool
    required: true
    timeout: 300
    depends_on: [step_4]

  - id: step_6
    name: Ansible Execute
    tool: tools/studio/executors/ansible_executor.py
    node_type: tool
    required: true
    timeout: 300
    depends_on: [step_4]

  - id: step_7
    name: Validation Run
    tool: tools/studio/executors/validation_runner.py
    node_type: tool
    required: true
    timeout: 120
    depends_on: [step_4]

  - id: step_8
    name: Migration Report
    tool: tools/studio/executors/migration_reporter.py
    node_type: tool
    required: true
    timeout: 60
    depends_on: [step_5, step_6, step_7]

  - id: step_9
    name: Apply Approval
    node_type: human
    required: true
    role: infrastructure_approver
    timeout: 86400
    tool: ""
    depends_on: [step_5, step_6, step_7]
    description: >
      Human gate before applying security infrastructure to AWS.
      Telegram: /approve <step_run_id> or /reject <step_run_id> [reason].

  - id: step_10
    name: Terraform Apply
    tool: tools/studio/executors/terraform_apply.py
    node_type: tool
    required: true
    timeout: 900
    depends_on: [step_9]

  - id: step_11
    name: AWS Config Execute
    tool: tools/studio/executors/aws_config_executor.py
    node_type: tool
    required: false
    timeout: 600
    depends_on: [step_10]

  - id: step_12
    name: Post-deploy Validation
    tool: tools/studio/executors/validation_runner.py
    node_type: tool
    required: false
    timeout: 300
    depends_on: [step_10]
