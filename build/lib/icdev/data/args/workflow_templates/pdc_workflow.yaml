# CUI // SP-CTI
# PDC Workflow — Pipeline Design Canvas
# Full 12-step pipeline: pipeline scan → anti-pattern check → IaC → DevOps gate → validate → apply → verify

description: "PDC: CI/CD pipeline scan, anti-pattern check, IaC generation, DevOps gate, Terraform/Ansible validate, migration report, apply approval, Terraform apply, AWS verification, post-deploy validation"
category: deploy
canvas: pdc

steps:
  # ── Canvas-specific steps (PDC only) ─────────────────────────────────────
  - id: step_1
    name: Pipeline Scan
    tool: tools/pdc/pipeline_scanner.py
    node_type: tool
    required: true
    timeout: 300
    depends_on: []
    description: Discover CI/CD pipelines, stages, dependencies, and integration points.

  - id: step_2
    name: Anti-pattern Check
    tool: tools/pdc/antipattern_checker.py
    node_type: tool
    required: true
    timeout: 300
    depends_on: [step_1]
    description: Identify CI/CD anti-patterns — long build times, missing gates, secret sprawl.

  - id: step_3
    name: Generate IaC
    tool: tools/pdc/iac_generator.py
    node_type: tool
    required: true
    timeout: 600
    depends_on: [step_2]
    description: >
      Generate Terraform (.tf), Ansible playbook (.yml), inventory (.ini),
      validation script (.py), and checklist (.md) for pipeline infrastructure.
      Output: data/studio_artifacts/pdc/ — consumed by all downstream steps.

  - id: step_4
    name: DevOps Approval
    node_type: human
    required: true
    role: approver
    timeout: 86400
    tool: ""
    depends_on: [step_3]
    description: >
      DevOps lead reviews pipeline IaC before provisioning begins.
      Telegram: /approve <step_run_id> or /reject <step_run_id> [reason].

  # ── Shared executor steps (canvas-agnostic) ───────────────────────────────
  - id: step_5
    name: Terraform Plan
    tool: tools/studio/executors/terraform_plan.py
    node_type: tool
    required: true
    timeout: 300
    depends_on: [step_4]

  - id: step_6
    name: Ansible Execute
    tool: tools/studio/executors/ansible_executor.py
    node_type: tool
    required: true
    timeout: 300
    depends_on: [step_4]

  - id: step_7
    name: Validation Run
    tool: tools/studio/executors/validation_runner.py
    node_type: tool
    required: true
    timeout: 120
    depends_on: [step_4]

  - id: step_8
    name: Migration Report
    tool: tools/studio/executors/migration_reporter.py
    node_type: tool
    required: true
    timeout: 60
    depends_on: [step_5, step_6, step_7]

  - id: step_9
    name: Apply Approval
    node_type: human
    required: true
    role: infrastructure_approver
    timeout: 86400
    tool: ""
    depends_on: [step_5, step_6, step_7]
    description: >
      Human gate before applying pipeline infrastructure to AWS.
      Telegram: /approve <step_run_id> or /reject <step_run_id> [reason].

  - id: step_10
    name: Terraform Apply
    tool: tools/studio/executors/terraform_apply.py
    node_type: tool
    required: true
    timeout: 900
    depends_on: [step_9]

  - id: step_11
    name: AWS Config Execute
    tool: tools/studio/executors/aws_config_executor.py
    node_type: tool
    required: false
    timeout: 600
    depends_on: [step_10]

  - id: step_12
    name: Post-deploy Validation
    tool: tools/studio/executors/validation_runner.py
    node_type: tool
    required: false
    timeout: 300
    depends_on: [step_10]
