# CUI // SP-CTI
# IDC Workflow — Infrastructure Design Canvas
# Full 12-step pipeline: infra scan → hardening check → IaC → approval → validate → apply → verify
#
# Canvas-specific steps (1–4): tools/idc/
# Shared executor steps (5–12): tools/studio/executors/  (see shared_iac_executors.yaml)

description: "IDC: infrastructure inventory scan, hardening check, IaC generation, infra gate, Terraform/Ansible validate, migration report, apply approval, Terraform apply, AWS verification, post-deploy validation"
category: deploy
canvas: idc

steps:
  # ── Canvas-specific steps (IDC only) ─────────────────────────────────────
  - id: step_1
    name: Infra Scan
    tool: tools/idc/infra_scanner.py
    node_type: tool
    required: true
    timeout: 300
    depends_on: []
    description: Inventory compute, storage, and network infrastructure for this project.

  - id: step_2
    name: Hardening Check
    tool: tools/idc/hardening_checker.py
    node_type: tool
    required: true
    timeout: 300
    depends_on: [step_1]
    description: Validate CIS/STIG hardening baselines against discovered infrastructure.

  - id: step_3
    name: Generate IaC
    tool: tools/idc/iac_generator.py
    node_type: tool
    required: true
    timeout: 600
    depends_on: [step_2]
    description: >
      Generate Terraform (.tf), Ansible playbook (.yml), inventory (.ini),
      validation script (.py), and checklist (.md) for this infrastructure deployment.
      Output: data/studio_artifacts/idc/ — consumed by all downstream steps.

  - id: step_4
    name: Infra Approval
    node_type: human
    required: true
    role: approver
    timeout: 86400
    tool: ""
    depends_on: [step_3]
    description: >
      Infrastructure engineer reviews generated IaC before provisioning begins.
      Telegram: /approve <step_run_id> or /reject <step_run_id> [reason].

  # ── Shared executor steps (canvas-agnostic) ───────────────────────────────
  - id: step_5
    name: Terraform Plan
    tool: tools/studio/executors/terraform_plan.py
    node_type: tool
    required: true
    timeout: 300
    depends_on: [step_4]

  - id: step_6
    name: Ansible Execute
    tool: tools/studio/executors/ansible_executor.py
    node_type: tool
    required: true
    timeout: 300
    depends_on: [step_4]

  - id: step_7
    name: Validation Run
    tool: tools/studio/executors/validation_runner.py
    node_type: tool
    required: true
    timeout: 120
    depends_on: [step_4]

  - id: step_8
    name: Migration Report
    tool: tools/studio/executors/migration_reporter.py
    node_type: tool
    required: true
    timeout: 60
    depends_on: [step_5, step_6, step_7]

  - id: step_9
    name: Apply Approval
    node_type: human
    required: true
    role: infrastructure_approver
    timeout: 86400
    tool: ""
    depends_on: [step_5, step_6, step_7]
    description: >
      Human gate before applying infrastructure to AWS.
      Telegram: /approve <step_run_id> or /reject <step_run_id> [reason].

  - id: step_10
    name: Terraform Apply
    tool: tools/studio/executors/terraform_apply.py
    node_type: tool
    required: true
    timeout: 900
    depends_on: [step_9]

  - id: step_11
    name: AWS Config Execute
    tool: tools/studio/executors/aws_config_executor.py
    node_type: tool
    required: false
    timeout: 600
    depends_on: [step_10]

  - id: step_12
    name: Post-deploy Validation
    tool: tools/studio/executors/validation_runner.py
    node_type: tool
    required: false
    timeout: 300
    depends_on: [step_10]
