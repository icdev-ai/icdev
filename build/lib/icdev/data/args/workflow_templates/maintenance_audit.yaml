# CUI // SP-CTI
# Maintenance Audit Workflow — Scan → Check → Score → Remediate → Verify
description: "Maintenance audit: dependency scan, CVE check, SLA scoring, auto-remediation"
category: maintenance
steps:
  - id: scan
    name: "Dependency Scan"
    tool: "tools/maintenance/dependency_scanner.py"
    description: "Inventory dependencies across 6 languages"

  - id: check
    name: "Vulnerability Check"
    tool: "tools/maintenance/vulnerability_checker.py"
    depends_on: [scan]
    description: "Check dependencies against advisory databases"

  - id: graph
    name: "Dependency Graph"
    tool: "tools/supply_chain/dependency_graph.py"
    depends_on: [scan]
    description: "Build supply chain graph with impact propagation"

  - id: scrm
    name: "SCRM Assessment"
    tool: "tools/supply_chain/scrm_assessor.py"
    depends_on: [scan]
    description: "NIST 800-161 supply chain risk assessment"

  - id: triage
    name: "CVE Triage"
    tool: "tools/supply_chain/cve_triager.py"
    depends_on: [check]
    description: "CVE triage with blast radius and SLA tracking"

  - id: audit
    name: "Full Audit"
    tool: "tools/maintenance/maintenance_auditor.py"
    depends_on: [check]
    description: "Full audit lifecycle: scan + check + score + SLA"

  - id: remediate
    name: "Auto-Remediate"
    tool: "tools/maintenance/remediation_engine.py"
    depends_on: [audit]
    required: false
    description: "Auto-implement dependency version fixes"

  - id: health_report
    name: "Health Report"
    tool: "tools/maintenance/health_reporter.py"
    depends_on: [graph, scrm, triage, remediate]
    description: "Consolidated dependency health and supply chain risk report"
