# CUI // SP-CTI
# Full SDLC Workflow — Requirements → Build → Test → Security → Compliance → Deploy
description: "Full SDLC: requirements, code generation, testing, security scanning, compliance, deployment"
category: build
steps:
  - id: intake
    name: "Requirements Intake"
    tool: "tools/requirements/intake_engine.py"
    description: "Capture and validate requirements"

  - id: decompose
    name: "SAFe Decomposition"
    tool: "tools/requirements/decomposition_engine.py"
    depends_on: [intake]
    description: "Decompose into SAFe hierarchy"

  - id: scaffold
    name: "Project Scaffold"
    tool: "tools/builder/scaffolder.py"
    depends_on: [decompose]
    description: "Scaffold project structure"

  - id: generate
    name: "Code Generation"
    tool: "tools/builder/code_generator.py"
    depends_on: [scaffold]
    description: "AI-assisted code generation"

  - id: test
    name: "Run Tests"
    tool: "tools/testing/test_orchestrator.py"
    depends_on: [generate]
    description: "Full test suite (unit + BDD + E2E)"

  - id: sast
    name: "SAST Scan"
    tool: "tools/security/sast_runner.py"
    depends_on: [generate]
    description: "Static application security testing"

  - id: secrets
    name: "Secret Detection"
    tool: "tools/security/secret_detector.py"
    depends_on: [generate]
    description: "Detect hardcoded secrets"

  - id: sbom
    name: "Generate SBOM"
    tool: "tools/compliance/sbom_generator.py"
    depends_on: [generate]
    description: "Software Bill of Materials"

  - id: compliance
    name: "Compliance Assessment"
    tool: "tools/compliance/multi_regime_assessor.py"
    depends_on: [sast, test]
    description: "Multi-framework compliance assessment"

  - id: terraform
    name: "Generate IaC"
    tool: "tools/infra/terraform_generator.py"
    depends_on: [compliance]
    required: false
    description: "Generate Terraform infrastructure"

  - id: pipeline
    name: "CI/CD Pipeline"
    tool: "tools/ci/pipeline_config_generator.py"
    depends_on: [compliance]
    required: false
    description: "Generate CI/CD pipeline config"

  - id: production
    name: "Production Audit"
    tool: "tools/testing/production_audit.py"
    depends_on: [compliance]
    description: "30-check production readiness audit"
