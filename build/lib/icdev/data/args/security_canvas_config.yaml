# Security Design Canvas — App Configuration
app:
  name: "Security Design Canvas"
  version: "1.0.0"
  classification: "CUI // SP-CTI"

database:
  path: "security_canvas.db"
  wal_mode: true
  foreign_keys: true

canvas:
  autosave_delay_ms: 3000
  grid_size: 10
  default_width: 110
  default_height: 60

assessment:
  auto_assess_on_save: true
  default_rules: ["stride", "nist_800_53"]
  risk_matrix: "5x5"

templates:
  count: 8
  auto_seed: true

agent:
  auto_trigger_on_ndc_save: true
  auto_trigger_on_iac_generate: true
  auto_trigger_on_pipeline_save: true

logging:
  level: INFO
  audit_enabled: true
