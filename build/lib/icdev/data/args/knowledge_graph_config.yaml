# CUI // SP-CTI
# Knowledge Graph & GraphRAG Configuration (D-KARL-1 through D-KARL-4)

extraction:
  method: regex  # air-gap safe, no LLM needed
  entity_types:
    - organization
    - system
    - control
    - requirement
    - component
    - person
    - document
    - standard
    # Financial entity types (FathomDesk)
    - ticker
    - sector
    - executive
    - supplier
    - commodity
    - etf
    - macro_indicator

graph_rag:
  # D-KARL-1 / D-ONTO-1: Per-query-type scoring profiles
  profiles:
    compliance:
      edge_weight: 0.4
      centrality: 0.3
      recency: 0.3
      ontology_weight: 0.2
      keywords: ["compliance", "audit", "NIST", "control", "FedRAMP", "CMMC", "assessment", "ATO"]
    exploratory:
      edge_weight: 0.2
      centrality: 0.5
      recency: 0.3
      ontology_weight: 0.1
      keywords: ["explore", "discover", "gap", "what", "how", "overview", "landscape"]
    provenance:
      edge_weight: 0.5
      centrality: 0.2
      recency: 0.3
      ontology_weight: 0.0
      keywords: ["provenance", "origin", "source", "chain", "trace", "lineage", "supply"]
    security:
      edge_weight: 0.3
      centrality: 0.4
      recency: 0.3
      ontology_weight: 0.2
      keywords: ["security", "vulnerability", "threat", "attack", "CVE", "SAST", "injection"]
    network_infrastructure:
      edge_weight: 0.4
      centrality: 0.4
      recency: 0.2
      ontology_weight: 0.2
      keywords: ["network", "router", "switch", "firewall", "redundancy", "failover", "load balancer", "topology"]
    ontology:
      edge_weight: 0.2
      centrality: 0.2
      recency: 0.2
      ontology_weight: 0.4
      keywords: ["ontology", "class", "subclass", "hierarchy", "type", "family", "taxonomy", "load balancer"]

    # Financial profiles (FathomDesk KG extension)
    supply_chain:
      edge_weight: 0.5
      centrality: 0.2
      recency: 0.3
      ontology_weight: 0.0
      keywords: ["supplier", "customer", "supply chain", "sourcing", "vendor", "component", "tier-1", "dependency"]
    sector_rotation:
      edge_weight: 0.3
      centrality: 0.4
      recency: 0.3
      ontology_weight: 0.0
      keywords: ["sector", "rotation", "relative strength", "momentum", "flow", "leadership", "cyclical", "defensive"]
    contagion_risk:
      edge_weight: 0.5
      centrality: 0.3
      recency: 0.2
      ontology_weight: 0.0
      keywords: ["risk", "contagion", "default", "exposure", "cascade", "dependency", "concentration", "systemic"]
    opportunity:
      edge_weight: 0.2
      centrality: 0.3
      recency: 0.5
      ontology_weight: 0.0
      keywords: ["buy", "upgrade", "catalyst", "breakout", "undervalued", "momentum", "earnings", "growth"]

  # D-KARL-2: Context compression via scanner-tier LLM
  compression:
    enabled: true
    model: qwen3.5-local
    max_context_chars: 4000

  # D-KARL-3: Parallel multi-strategy retrieval
  parallel_retrieval:
    enabled: true
    max_workers: 3

  # Retrieval defaults
  defaults:
    top_k: 10
    recency_half_life_days: 30
    min_score: 0.01
    ontology_path_distance_decay: 1.0

ingestion:
  chunk_size: 2000
  chunk_overlap: 200
  supported_extensions:
    - .md
    - .txt
    - .json
    - .yaml
    - .yml

# D-KARL-7: Entity enrichment (centrality + embeddings)
enrichment:
  centrality:
    degree_weight: 0.6
    betweenness_weight: 0.4
    max_exact_nodes: 500
  embeddings:
    enabled: true
    batch_size: 20
