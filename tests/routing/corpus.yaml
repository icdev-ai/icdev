# [TEMPLATE: CUI // SP-CTI]
# Routing regression corpus (xrv-route-02) -- ONE declared set of cases for the
# four deterministic routers ICDEV keeps deliberately separate.
#
# Replay it:   python -m tools.routing.corpus_survey --json
# Validate it: python -m tools.routing.corpus_survey --validate
# Gate it:     pytest tests/routing -q
#
# A case is {query, router, expected, note} plus three optional keys:
#
#   context              rag_shape only -- the retrieved passage the query is
#                        judged answerable against
#   expected_agent_mode  cortex_facade only -- pins the agent_mode HINT as well
#                        as the intent, because "graph" is the one value
#                        cortex.agent's own "auto" can never select
#   known_disagreement   WHY the router is WRONG here today. `expected` stays
#                        what the router SHOULD say; the test marks the case
#                        xfail(strict) and the survey counts it apart from a
#                        fresh regression. A known case that starts AGREEING
#                        fails the suite and reports `resolved` -- the
#                        declaration is then stale and must be removed.
#
# HOW TO CHANGE A CASE. If a router change moves a case, the question is which
# of the two is wrong. If the ROUTER is now right, change `expected` and say so
# in `note`. If the router is now wrong, that is the regression this file
# exists to catch -- fix the router. Never delete a case to get a commit
# through, and never add `known_disagreement` to quieten one: that field is for
# a defect a reader can act on, with the mechanism named.
#
# `note` is REQUIRED on every case (enforced by --validate): a case whose
# intent nobody can read cannot be re-judged when a rule changes, and a corpus
# of 150 unreadable assertions is a wall people learn to edit rather than read.
---

cases:

  # =====================================================================
  # chat_canvas -- tools/chat_router/intent_classifier.py::classify
  # WHICH CANVAS. intake (the default) or one of nine design canvases.
  # =====================================================================

  # --- intake: the strong-signal family, which PRE-EMPTS every canvas rule ---
  - id: chat-intake-build-app
    router: chat_canvas
    query: "I need to build a new timekeeping app"
    expected: intake
    note: "_INTAKE_STRONG `i (need|want) to build` -- a greenfield ask is intake."
  - id: chat-intake-build-me-a
    router: chat_canvas
    query: "build me a tool for tracking contract deliverables"
    expected: intake
    note: "`build me a` is the canonical greenfield phrasing."
  - id: chat-intake-create-app
    router: chat_canvas
    query: "create an inventory application for the warehouse"
    expected: intake
    note: "`create a <word> (app|application|system|tool)` -- the noun must follow."
  - id: chat-intake-new-project
    router: chat_canvas
    query: "starting a new project for the logistics office"
    expected: intake
    note: "`new (project|app|application|system)`."
  - id: chat-intake-requirements
    router: chat_canvas
    query: "here are the requirements for the partner portal"
    expected: intake
    note: "`requirement` -- requirements text is intake whatever it describes."
  - id: chat-intake-acceptance-criteria
    router: chat_canvas
    query: "write the acceptance criteria for the login story"
    expected: intake
    note: "`acceptance criteria` -- and note cortex_facade reads the same message
      as `complete`. Different questions, different answers, same text."
  - id: chat-intake-user-story
    router: chat_canvas
    query: "draft user stories for the claims reviewer role"
    expected: intake
    note: "`user stor` matches both singular and plural."
  - id: chat-intake-ricoas
