  # --- maintenance ---
  - id: skill-maint-cve
    router: skill_category
    query: "check for a cve in the lockfile"
    expected: maintenance
    note: "`cve` singular. See skill-maint-plural-cves for the plural."
  - id: skill-maint-modernize
    router: skill_category
    query: "modernize the legacy service and remediate the vulnerability"
    expected: maintenance
    note: "modernize + legacy + remediate + vulnerability -- four hits, 0.90.
      chat_canvas reads the same sentence as `cam`."
  - id: skill-maint-supply-chain
    router: skill_category
    query: "check the supply chain for vendor risk"
    expected: maintenance
