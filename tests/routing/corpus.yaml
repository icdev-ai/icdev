    note: "THREE families -- sequence, parallel, gate. agent_mode=graph is the
      load-bearing half: cortex.agent's `auto` can NEVER select graph on its
      own, so without the hint a described DAG is silently handed a single
      agent loop."
  - id: cx-graph-stages
    router: cortex_facade
    query: "stage one ingests, stage two validates in parallel, and a human
      approval gate before publish"
    expected: agent
    expected_agent_mode: graph
    note: "sequence (`stage one`), parallel, gate (`human approval`)."
  - id: cx-graph-template-gate
    router: cortex_facade
    query: "run the nightly.yaml workflow with an approval gate before the
      deploy step"
    expected: agent
    expected_agent_mode: graph
    note: "template plus gate -- a NAMED workflow is the one thing `auto` cannot
      infer."
  - id: cx-graph-on-success
    router: cortex_facade
    query: "on success generate the SBOM and on failure rollback, in parallel
      with the notification branch"
    expected: agent
    expected_agent_mode: graph
    note: "sequence (`on success`/`on failure`) plus parallel."
  - id: cx-graph-one-family-sequence
    router: cortex_facade
    query: "if the tests pass then deploy, otherwise notify the team"
    expected: agent
    expected_agent_mode: auto
    note: "ONE family only (sequence), so `is_graph` is False and the mode stays
      `auto` -- _GRAPH_MIN_FAMILIES is 2. The intent is still agent, from the
      `then ... deploy` chain rule. This is the case that proves the threshold
      is doing something."
  - id: cx-graph-gate-mention-only
    router: cortex_facade
    query: "explain the approval gate for FedRAMP"
    expected: complete
    note: "NEGATIVE. The gate family fires on `approval gate`, and this is a
      QUESTION ABOUT a gate, not a request to build one. One family is not a
      DAG -- `explain` wins and the facade is complete. Exactly the example
      _GRAPH_MIN_FAMILIES=2 was chosen for."
  - id: cx-graph-template-mention-only
    router: cortex_facade
    query: "run the report pipeline"
    expected: ask
    note: "NEGATIVE, and a DOUBLE default: the template family fires alone (not
      a DAG) and no facade rule fires at all, so this falls through to the
      DEFAULT_INTENT `ask` at confidence 0.40. A one-step run is not an agent
      launch."

  # --- cortex_facade: defaults and negatives ---
  - id: cx-default-greeting
    router: cortex_facade
    query: "hello"
    expected: ask
    note: "DEFAULT. `ask` is the documented safe default -- the grounded analyst
      path, which cites rather than generates."
  - id: cx-default-vague
    router: cortex_facade
    query: "the thing is broken"
    expected: ask
    note: "DEFAULT. No rule fires in any of the four families."
  - id: cx-default-empty
    router: cortex_facade
    query: " "
    expected: ask
    note: "DEFAULT on an empty message, at confidence 1.0 -- the one case where
      the router is certain BECAUSE there is nothing to classify."
  - id: cx-status-of-migration
    router: cortex_facade
    query: "what is the status of the migration"
    expected: ask
    known_disagreement: "Returns `agent`. The base classifier reads `migration`
      as the cam design canvas and adds +2 to agent, beating the single
      `status of` ask hit -- so a plain STATUS QUESTION is routed to the facade
      that proposes launching an agent loop (requires_confirm=True). The +2 is
      documented as `enough to win against a single incidental keyword from
      another family`; here the incidental keyword is the real intent and the
      design-mode signal is the incidental one. Report-only: narrowing the
      design-mode boost is a routing change owing its own fire-rate survey."
    note: "A question about a migration's status is a data question, not a
      request to perform a migration."

  # =====================================================================
  # rag_shape -- tools/rag/query_classifier.py::classify_query
  # WHAT SHAPE of answer. fact_single | summary | reasoning | unanswerable.
  # =====================================================================

  # --- fact_single: one concise answer from one passage ---
  - id: rag-fact-what-is
    router: rag_shape
    query: "What is AC-2?"
    expected: fact_single
    note: "`what is` anchored at the START of the query -- this family is the
      only one of the three that is anchored."
  - id: rag-fact-who-is
    router: rag_shape
    query: "Who is the ISSO for the platform?"
    expected: fact_single
    note: "`who is`."
  - id: rag-fact-when-was
    router: rag_shape
    query: "When was NIST 800-53 Rev 5 published?"
    expected: fact_single
    note: "`when was`."
  - id: rag-fact-which
    router: rag_shape
    query: "Which FIPS level applies to IL5?"
    expected: fact_single
    note: "`which`."
  - id: rag-fact-how-many
    router: rag_shape
    query: "How many controls are in the moderate baseline?"
    expected: fact_single
    note: "`how many` is fact_single HERE and `ask` in cortex_facade -- the same
      words, two different questions, two correct answers."
  - id: rag-fact-define
    router: rag_shape
    query: "Define continuous monitoring."
    expected: fact_single
    note: "`define ` with its trailing space -- `defined` does not match."
  - id: rag-fact-stand-for
    router: rag_shape
    query: "What does ATO stand for?"
    expected: fact_single
    note: "`what does X stand for`."
  - id: rag-fact-version
    router: rag_shape
    query: "What version of OSCAL do we emit?"
    expected: fact_single
    note: "`what version`."
  - id: rag-fact-where
    router: rag_shape
    query: "Where is the SSP template stored?"
    expected: fact_single
    note: "`where is`."
  - id: rag-fact-with-context
    router: rag_shape
    query: "How many POAM items are overdue?"
    context: "The POAM register lists 14 overdue items as of March, of which 3
      are past their scheduled completion date."
    expected: fact_single
    note: "Context that OVERLAPS the query never triggers the unanswerable
      check, so the pattern families decide as usual."

  # --- summary: synthesis across passages ---
  - id: rag-summary-summarize
    router: rag_shape
    query: "Summarize the FedRAMP authorization process."
    expected: summary
    note: "`summarize`."
  - id: rag-summary-overview
    router: rag_shape
    query: "Give an overview of CMMC Level 2."
    expected: summary
    note: "`give an overview`."
  - id: rag-summary-describe
    router: rag_shape
    query: "Describe the key controls for IL5."
    expected: summary
    note: "`describe` plus `what are the key`-adjacent wording."
  - id: rag-summary-outline
    router: rag_shape
    query: "Outline the cATO evidence requirements."
    expected: summary
    note: "`outline`."
  - id: rag-summary-list
    router: rag_shape
    query: "List the STIG severity categories."
    expected: summary
    note: "`list` is SUMMARY here. cortex_facade reads `list all` as `ask`. Two
      taxonomies that disagree about one verb, on purpose."
  - id: rag-summary-main-phases
    router: rag_shape
    query: "What are the main phases of the RMF?"
    expected: summary
    note: "`what are the (main|key|primary|core)` -- this is the ONE `what are`
      shape that beats the fact_single anchor, because summary is tested first."
  - id: rag-summary-enumerate
    router: rag_shape
    query: "Enumerate the seven Rs of migration."
    expected: summary
    note: "`enumerate`."
  - id: rag-summary-covers
    router: rag_shape
    query: "What does the SSP cover for inherited controls?"
    expected: summary
    note: "`what (does|do) X cover`."
  - id: rag-summary-short-query-guard
    router: rag_shape
    query: "Summarize the incident"
    context: "Unrelated note about weather patterns over the Pacific."
    expected: summary
    note: "The unanswerable check needs at least 3 distinct 4+ letter query
      words (_MIN_QUERY_WORDS); `summarize` and `incident` are two, so it is
      SKIPPED even with irrelevant context and the summary family decides. A
      two-word query cannot be judged by keyword overlap."

  # --- reasoning: explanation, inference, causation ---
  - id: rag-reason-why
    router: rag_shape
    query: "Why does FedRAMP require continuous monitoring?"
    expected: reasoning
    note: "`why`."
  - id: rag-reason-how-does
    router: rag_shape
    query: "How does zero trust prevent lateral movement?"
    expected: reasoning
    note: "`how does`."
  - id: rag-reason-what-would-happen
    router: rag_shape
    query: "What would happen if MFA were disabled?"
    expected: reasoning
    note: "`what would happen`."
  - id: rag-reason-rationale
    router: rag_shape
    query: "Explain the rationale behind NIST 800-171."
    expected: reasoning
    note: "`explain` plus `what is the rationale`-adjacent wording."
  - id: rag-reason-compare
    router: rag_shape
    query: "Compare CMMC Level 2 with FedRAMP Moderate."
    expected: reasoning
    note: "`compare`."
  - id: rag-reason-impact-singular
    router: rag_shape
    query: "What is the impact of a failed STIG check?"
    expected: reasoning
    note: "`what is the impact` -- SINGULAR. The control for
      rag-reason-plural-advantages below: the same sentence in the plural
      classifies differently, which is how that defect was found."
  - id: rag-reason-risk-singular
    router: rag_shape
    query: "What is the risk of running without an ATO?"
    expected: reasoning
    note: "`what is the risk` -- singular, and the second half of the plural
      control pair."
  - id: rag-reason-justify
    router: rag_shape
    query: "How should we justify an inherited control?"
    expected: reasoning
    note: "`how should` plus `justify`."
  - id: rag-reason-evaluate
    router: rag_shape
    query: "Evaluate the trade-off between speed and assurance."
    expected: reasoning
    note: "`evaluate`."
  - id: rag-reason-caused
    router: rag_shape
    query: "What caused the authorization to lapse?"
    expected: reasoning
    note: "`what (causes|caused)`."
  - id: rag-reason-discuss
    router: rag_shape
    query: "Discuss the tradeoffs of the shared responsibility model."
    expected: reasoning
    note: "`discuss`."
  - id: rag-reason-explain-with-context
    router: rag_shape
    query: "Explain the encryption requirements for CUI at rest"
    context: "Encryption of CUI at rest requires FIPS 140-3 validated modules
      per NIST SP 800-171 requirement 3.13.11."
    expected: reasoning
    note: "Relevant context, so the unanswerable check does not fire and
      `explain` decides. Pair with rag-unanswerable-encryption, which is the
      SAME query against irrelevant context."
  - id: rag-reason-plural-advantages
    router: rag_shape
    query: "What are the advantages of OSCAL over spreadsheets?"
    expected: reasoning
    known_disagreement: "Returns `fact_single`. _REASONING_PATTERNS spells the
      noun list `(reason|rationale|purpose|benefit|advantage|disadvantage|risk|
      impact)` with a trailing `\\b` and NO `s?`, so every PLURAL form misses;
      the query then matches the `what are` fact_single anchor instead. One
      missing `s?` turns three of the eight reasoning nouns into fact questions.
      Compare rag-reason-impact-singular, which agrees."
    note: "A question about advantages is an inference question whatever the
      grammatical number of the noun."
  - id: rag-reason-plural-risks
    router: rag_shape
    query: "What are the risks of an expired ATO?"
    expected: reasoning
    known_disagreement: "Returns `fact_single`, same missing `s?` in
      _REASONING_PATTERNS as rag-reason-plural-advantages. `What is the risk`
      (rag-reason-risk-singular) agrees, so the pair isolates the mechanism to
      the plural alone."
    note: "Plural of a reasoning noun is still a reasoning question."
  - id: rag-reason-plural-benefits
    router: rag_shape
    query: "What are the benefits of continuous authorization?"
    expected: reasoning
    known_disagreement: "Returns `fact_single` -- the third plural form of the
      same one-character defect. Listed separately rather than folded in,
      because a fix that repairs only `risks` must still leave two red."
    note: "Plural of a reasoning noun is still a reasoning question."

  # --- unanswerable, and the DEFAULT ---
  - id: rag-unanswerable-procurement
    router: rag_shape
    query: "Tell me about the procurement timeline for the award"
    context: "The kitchen renovation budget was approved last spring and the
      contractor starts in June."
    expected: unanswerable
    note: "Keyword overlap below 10% with 3+ distinct query words -- a
      RETRIEVAL failure, not a property of the question."
  - id: rag-unanswerable-encryption
    router: rag_shape
    query: "Explain the encryption requirements for CUI at rest"
    context: "Recipe: combine flour, sugar and butter, then bake for forty
      minutes."
    expected: unanswerable
    note: "PRECEDENCE. The identical query is `reasoning` against relevant
      context (rag-reason-explain-with-context) -- the answerability check runs
      BEFORE the three pattern families, so context can override an otherwise
      certain label."
  - id: rag-default-bare-control
    router: rag_shape
    query: "AC-2 account management"
    expected: fact_single
    note: "DEFAULT. No family fires, confidence 0.50 -- and note the default is
      a real label, so a caller cannot tell `matched fact_single` from `nothing
      matched` without reading `confidence`."
  - id: rag-default-statement
    router: rag_shape
    query: "the SSP needs updating before the next review"
    expected: fact_single
    note: "DEFAULT. A statement is not a question, and the taxonomy has no label
      for that."
  - id: rag-default-single-token
    router: rag_shape
    query: "POAM"
    expected: fact_single
    note: "DEFAULT on one bare token."
  - id: rag-empty-query
    router: rag_shape
    query: " "
    expected: unanswerable
    note: "An EMPTY query is unanswerable at confidence 1.0 by an explicit early
      return -- the one place in this taxonomy where `unanswerable` describes
      the question rather than the corpus."

  # =====================================================================
  # skill_category -- tools/agent/skill_selector.py::select_skills
  # WHICH CATEGORIES get injected. The whole matched SET is pinned, joined
  # with '+'; `fallback_all` is the default (nothing matched, so EVERY
  # category is injected and the selection says nothing about the query).
  # =====================================================================

  # --- build ---
  - id: skill-build-python
    router: skill_category
    query: "implement the new endpoint in python"
    expected: build
    note: "Two build keywords (implement, python). Token-exact matching, so
      `python` hits and `pythonic` would not."
  - id: skill-build-scaffold
    router: skill_category
    query: "scaffold a typescript client"
    expected: build
    note: "scaffold + typescript."
  - id: skill-build-lint
    router: skill_category
    query: "lint and format the module"
    expected: build
    note: "lint + format."
  - id: skill-build-unit-test
    router: skill_category
    query: "write a unit test for the parser"
    expected: build
    note: "SINGULAR `test` matches. The control for skill-build-plural-tests."
  - id: skill-build-translate
    router: skill_category
    query: "translate the cobol to java"
    expected: build
    note: "`java` is a build keyword; the translation canvas is not a category."
  - id: skill-build-refactor-flask
    router: skill_category
    query: "refactor the flask blueprint"
    expected: build+dashboard
    note: "TWO categories, and correctly: `refactor` is build and `flask` is in
      BOTH build and dashboard. The whole set is pinned because what gets
      injected into an agent's context is the union, not the winner."

  # --- compliance ---
  - id: skill-compliance-ssp-poam
    router: skill_category
    query: "generate the SSP and POAM for the ATO package"
    expected: build+compliance
    note: "`generate` is a build keyword and ssp/poam/ato are compliance ones --
      so a compliance artifact request also injects the build skills. Pinned as
      the SET, since dropping `generate` from build would silently change what
      an ATO task sees."
  - id: skill-compliance-crosswalk
    router: skill_category
    query: "map NIST 800-53 controls to CMMC"
    expected: compliance
    note: "nist + control + cmmc."
  - id: skill-compliance-stig-sbom
    router: skill_category
    query: "run a STIG check and produce the SBOM"
    expected: compliance
    note: "stig + sbom."
  - id: skill-compliance-fips199
    router: skill_category
    query: "categorize the system under FIPS 199"
    expected: compliance
    note: "`fips` alone -- one keyword is enough (min_keyword_matches is 1, and
      one match scores exactly the 0.30 threshold)."
  - id: skill-compliance-cui
    router: skill_category
    query: "mark the artifacts CUI and record the crosswalk"
    expected: compliance
    note: "cui + crosswalk."

  # --- infrastructure ---
  - id: skill-infra-terraform
    router: skill_category
    query: "deploy to staging with terraform"
    expected: infrastructure
    note: "deploy + terraform."
  - id: skill-infra-k8s-helm
    router: skill_category
    query: "write the kubernetes manifests and helm chart"
    expected: infrastructure
    note: "kubernetes + helm."
  - id: skill-infra-zero-trust
    router: skill_category
    query: "set up the CICD pipeline with zero trust controls"
    expected: infrastructure
    note: "`zero trust` is a MULTI-WORD keyword, matched as a phrase against the
      raw query and weighted DOUBLE -- which is why this scores 0.90 where a
      single-token hit scores 0.30."
  - id: skill-infra-container
    router: skill_category
    query: "harden the container image"
    expected: infrastructure
    note: "`container`. `harden` is not a keyword in any category."

  # --- requirements ---
  - id: skill-req-safe
    router: skill_category
    query: "decompose the requirements into SAFe epics"
    expected: requirements
    note: "requirements + safe + epic."
  - id: skill-req-monte-carlo
    router: skill_category
    query: "run a monte carlo simulation for the COA"
    expected: requirements
    note: "`monte carlo` is a multi-word phrase (double weight) plus simulation
      and coa."
  - id: skill-req-readiness
    router: skill_category
    query: "score readiness for the intake session"
    expected: requirements
    note: "readiness + intake."
  - id: skill-req-bdd
    router: skill_category
    query: "generate gherkin bdd scenarios"
    expected: build+requirements
