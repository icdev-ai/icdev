  - id: skill-maint-upgrade
    router: skill_category
    query: "upgrade the dependency to a patched release"
    expected: maintenance
    note: "upgrade + dependency, both singular."

  # --- dashboard ---
  - id: skill-dash-kanban
    router: skill_category
    query: "add a kanban panel to the dashboard"
    expected: dashboard
    note: "kanban + dashboard."
  - id: skill-dash-jinja
    router: skill_category
    query: "fix the jinja template on the monitoring page"
    expected: dashboard
    note: "jinja + template + monitoring."
  - id: skill-dash-heartbeat
    router: skill_category
    query: "investigate the agent heartbeat"
    expected: dashboard
    note: "`agent` and `heartbeat` are dashboard keywords -- agent MONITORING,
      not agent building."

  # --- mbse / marketplace: the two categories only the YAML config declares ---
  - id: skill-mbse-sysml
    router: skill_category
    query: "import the sysml model from the repository"
    expected: mbse
    note: "`sysml`. This category exists only in
      args/skill_injection_config.yaml, not in the module's DEFAULT_CONFIG --
      so the case also proves the config is what is being read."
  - id: skill-marketplace-publish
    router: skill_category
    query: "publish a skill to the marketplace"
    expected: marketplace
    note: "`marketplace`, likewise config-only."

  # --- multi-category and the DEFAULT ---
  - id: skill-multi-three
    router: skill_category
    query: "deploy the compliance dashboard with terraform after the tests pass"
    expected: compliance+dashboard+infrastructure
    note: "THREE categories from one sentence. `tests` contributes nothing (see
      skill-build-plural-tests) -- build is absent from this set, which is the
      stemming defect visible from the other side."
  - id: skill-default-standup
    router: skill_category
    query: "reschedule the standup"
    expected: fallback_all
    note: "DEFAULT. Nothing matches, so the selector's safety fallback injects
      EVERY category -- which is the opposite of a confident nine-category
      match and must never be rendered as one."
  - id: skill-default-weather
    router: skill_category
    query: "what is the weather in Norfolk"
    expected: fallback_all
    note: "DEFAULT. Negative case."
  - id: skill-default-nonsense
    router: skill_category
    query: "the quick brown fox jumps over the lazy dog"
    expected: fallback_all
    note: "DEFAULT over text with no technical vocabulary at all."
  - id: skill-default-review-pr
    router: skill_category
    query: "review the pull request"
    expected: fallback_all
    note: "DEFAULT, and a deliberate trap: `review`, `commit` and
      `pull_request` are COMMANDS in the build category, not KEYWORDS, so they
      match nothing. They arrive anyway through `always_include.commands` --
      which is why this is the right verdict rather than a defect."
  - id: skill-build-plural-tests
    router: skill_category
    query: "fix the login tests"
    expected: build
    known_disagreement: "Returns `fallback_all`. This is the selector's OWN
      documented example (`--query \"fix the login tests\"` in its module
      docstring), and it matches nothing: match_keywords tokenises the query
      and tests membership of each keyword in that token SET, with no stemming,
      so the keyword `test` does not match the token `tests`. Nothing matches,
      so the safety fallback injects all nine categories -- the most
      expensive possible answer for the most ordinary possible task. Compare
      skill-build-unit-test (singular), which agrees. Report-only: adding
      stemming widens every category's reach and owes its own survey."
    note: "A task about tests is a build task."
  - id: skill-maint-plural-cves
    router: skill_category
    query: "audit dependencies for CVEs"
    expected: maintenance
    note: "Agrees, and shows the stemming defect is about which WORD is plural,
      not about plurals as such: `dependencies` and `CVEs` both miss, but
      `audit` is a maintenance keyword in the YAML config and carries the
      match on its own."
