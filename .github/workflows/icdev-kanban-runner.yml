# CUI // SP-CTI
name: ICDEV Kanban Runner

on:
  workflow_dispatch:
    inputs:
      task_id:
        description: "Kanban task ID"
        required: true
        type: string
      task_desc:
        description: "Task description / prompt"
        required: true
        type: string
      task_type:
        description: "Task type (feature, bug, chore, test, review, commit, status, monitor, maintain, secure, deploy, build, fix, research)"
        required: true
        type: string
      llm_provider:
        description: "LLM provider: ollama (air-gap local) | anthropic | openai | gemini | bedrock"
        required: false
        default: "ollama"
        type: string

env:
  PYTHONPATH: "."
  ICDEV_STORAGE_BACKEND: sqlite
  LLM_PROVIDER: ${{ github.event.inputs.llm_provider || 'ollama' }}
  # Ollama (local/air-gap)
  OLLAMA_BASE_URL: "http://localhost:11434"
  OLLAMA_MODEL: ${{ secrets.OLLAMA_MODEL || 'qwen2.5:7b' }}
  # Cloud providers — injected from GitHub Actions secrets; empty string when unused
  ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY || '' }}
  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY || '' }}
  GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY || '' }}
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID || '' }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY || '' }}
  AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION || 'us-gov-west-1' }}

jobs:
  run:
    name: Execute Kanban Task (${{ github.event.inputs.llm_provider || 'ollama' }})
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt 2>/dev/null || true
          pip install flask pyyaml requests

      # ── Ollama (local / air-gap) ──────────────────────────────────────────
      # Skipped automatically when:
      #   • llm_provider != 'ollama'
      #   • RUNNER_LABEL=self-hosted (runner has Ollama pre-installed)
      - name: Install Ollama + pull model
        if: >
          (github.event.inputs.llm_provider == 'ollama' || github.event.inputs.llm_provider == '') &&
          (vars.RUNNER_LABEL == '' || vars.RUNNER_LABEL == 'ubuntu-latest')
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          ollama serve &
          # Wait for daemon to be ready
          for i in $(seq 1 12); do
            curl -sf http://localhost:11434/ && break || sleep 5
          done
          ollama pull "$OLLAMA_MODEL"

      # ── Cloud provider validation ─────────────────────────────────────────
      - name: Validate cloud provider credentials
        if: github.event.inputs.llm_provider != 'ollama' && github.event.inputs.llm_provider != ''
        run: |
          PROVIDER="${{ github.event.inputs.llm_provider }}"
          case "$PROVIDER" in
            anthropic)
              [ -n "$ANTHROPIC_API_KEY" ] || { echo "ERROR: ANTHROPIC_API_KEY secret not set"; exit 1; }
              echo "Anthropic key present."
              ;;
            openai)
              [ -n "$OPENAI_API_KEY" ] || { echo "ERROR: OPENAI_API_KEY secret not set"; exit 1; }
              echo "OpenAI key present."
              ;;
            gemini)
              [ -n "$GOOGLE_API_KEY" ] || { echo "ERROR: GOOGLE_API_KEY secret not set"; exit 1; }
              echo "Google API key present."
              ;;
            bedrock)
              [ -n "$AWS_ACCESS_KEY_ID" ] || { echo "ERROR: AWS_ACCESS_KEY_ID secret not set"; exit 1; }
              echo "AWS credentials present."
              ;;
            *)
              echo "WARNING: Unknown provider '$PROVIDER' — continuing without validation."
              ;;
          esac

      # ── ANVIL execution ───────────────────────────────────────────────────
      - name: ANVIL — Execute Task
        run: |
          TASK_TYPE="${{ github.event.inputs.task_type }}"
          TASK_DESC="${{ github.event.inputs.task_desc }}"
          if [ -f "tools/anvil/${TASK_TYPE}.py" ]; then
            echo "Running ANVIL wrapper: tools/anvil/${TASK_TYPE}.py"
            python "tools/anvil/${TASK_TYPE}.py" --json -- "$TASK_DESC"
          else
            echo "No ANVIL wrapper for '${TASK_TYPE}'. Running generic health + lint."
            python tools/testing/health_check.py --json
            python -m ruff check tools/ tests/ --select E,F,W --ignore E402,E501,E731,E741
          fi

      - name: Summary
        if: always()
        run: |
          echo "Task ${{ github.event.inputs.task_id }} (${{ github.event.inputs.task_type }}) | provider=${{ github.event.inputs.llm_provider || 'ollama' }} | completed."
