# CUI // SP-CTI
name: ICDEV Kanban Runner
run-name: "[${{ github.event.inputs.task_type }}] ${{ github.event.inputs.task_id }} — ${{ github.event.inputs.task_desc }}"

on:
  workflow_dispatch:
    inputs:
      task_id:
        description: "Kanban task ID"
        required: true
        type: string
      task_desc:
        description: "Task description / prompt"
        required: true
        type: string
      task_type:
        description: "Task type (feature, bug, chore, test, review, commit, status, monitor, maintain, secure, deploy, build, fix, research)"
        required: true
        type: string
      llm_provider:
        description: "LLM provider: ollama_cloud | ollama | anthropic | openai | gemini | bedrock"
        required: false
        default: "ollama_cloud"
        type: string

permissions:
  contents: write   # required for ci-fix commit + push to main

env:
  PYTHONPATH: "."
  ICDEV_STORAGE_BACKEND: sqlite
  LLM_PROVIDER: ${{ github.event.inputs.llm_provider || 'ollama_cloud' }}
  # Ollama Cloud (air-gap via API key — no local install required)
  OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
  OLLAMA_CLOUD_BASE_URL: ${{ secrets.OLLAMA_CLOUD_BASE_URL || 'https://ollama.com' }}
  # Local Ollama fallback (used only when OLLAMA_API_KEY is absent)
  OLLAMA_BASE_URL: "http://localhost:11434"
  OLLAMA_MODEL: ${{ secrets.OLLAMA_MODEL || 'qwen2.5:7b' }}
  # Cloud provider API keys — injected from secrets; empty when unused
  ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY || '' }}
  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY || '' }}
  GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY || '' }}
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID || '' }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY || '' }}
  AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION || 'us-gov-west-1' }}
  # Tell Playwright the dashboard is managed by this workflow — don't spawn a second instance.
  ICDEV_NO_SERVER: "1"

jobs:
  run:
    name: Execute Kanban Task (${{ github.event.inputs.llm_provider || 'ollama_cloud' }})
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt 2>/dev/null || true
          pip install flask pyyaml requests

      - name: Install Node dependencies + Playwright browsers
        run: |
          npm ci 2>/dev/null || npm install 2>/dev/null || true
          npx playwright install chromium --with-deps 2>/dev/null || true

      # ── Local Ollama install ───────────────────────────────────────────────
      # Only runs when llm_provider=ollama (local daemon mode).
      # ollama_cloud uses OLLAMA_API_KEY — no daemon needed.
      # RUNNER_LABEL=self-hosted runners have Ollama pre-installed — skip install.
      - name: Install local Ollama + pull model
        if: >
          github.event.inputs.llm_provider == 'ollama' &&
          (vars.RUNNER_LABEL == '' || vars.RUNNER_LABEL == 'ubuntu-latest')
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          ollama serve &
          for i in $(seq 1 12); do
            curl -sf http://localhost:11434/ && break || sleep 5
          done
          ollama pull "$OLLAMA_MODEL"

      # ── Cloud provider credential validation ──────────────────────────────
      # Warns on missing keys but does not block — lets ANVIL attempt execution
      # and surface the real error (missing key → LLM router fallback or fail).
      - name: Validate provider credentials
        run: |
          PROVIDER="${{ github.event.inputs.llm_provider || 'ollama_cloud' }}"
          MISSING=0
          case "$PROVIDER" in
            ollama_cloud)
              if [ -z "$OLLAMA_API_KEY" ]; then
                echo "WARNING: OLLAMA_API_KEY secret not set — add it at Settings > Secrets > Actions > New repository secret (name: OLLAMA_API_KEY)"
                MISSING=1
              else
                echo "OK: Ollama Cloud key present (length=${#OLLAMA_API_KEY})."
              fi
              ;;
            ollama)
              echo "OK: Local Ollama — no API key required."
              ;;
            anthropic)
              if [ -z "$ANTHROPIC_API_KEY" ]; then
                echo "WARNING: ANTHROPIC_API_KEY secret not set"; MISSING=1
              else
                echo "OK: Anthropic key present."
              fi
              ;;
            openai)
              if [ -z "$OPENAI_API_KEY" ]; then
                echo "WARNING: OPENAI_API_KEY secret not set"; MISSING=1
              else
                echo "OK: OpenAI key present."
              fi
              ;;
            gemini)
              if [ -z "$GOOGLE_API_KEY" ]; then
                echo "WARNING: GOOGLE_API_KEY secret not set"; MISSING=1
              else
                echo "OK: Google API key present."
              fi
              ;;
            bedrock)
              if [ -z "$AWS_ACCESS_KEY_ID" ]; then
                echo "WARNING: AWS_ACCESS_KEY_ID secret not set"; MISSING=1
              else
                echo "OK: AWS credentials present."
              fi
              ;;
            *)
              echo "WARNING: Unknown provider '$PROVIDER' — continuing."
              ;;
          esac
          if [ "$MISSING" -eq 1 ]; then
            echo "Credential missing — ANVIL will attempt with available providers."
          fi

      # ── Dashboard server (required for E2E steps inside ANVIL) ───────────
      - name: Initialize database
        run: python tools/db/init_icdev_db.py

      - name: Start dashboard server
        run: |
          python tools/dashboard/app.py &
          echo $! > /tmp/dashboard.pid
          for i in $(seq 1 30); do
            curl -sf http://localhost:5050/ && echo "Dashboard ready." && break || sleep 2
          done

      # ── Agentic execution (LLM-backed) ───────────────────────────────────
      # When OLLAMA_API_KEY or ANTHROPIC_API_KEY is present, run the agentic
      # runner (LLMRouter → Ollama/Anthropic) so the GA executor has the same
      # reasoning capability as the local Claude CLI executor.
      # Falls back to static ANVIL wrappers if no LLM key is available.
      - name: Agentic — Execute Task
        run: |
          _abort() {
            echo "CI: abort signal received during agentic execution — terminating children"
            children=$(ps -o pid= --ppid $$ 2>/dev/null || true)
            for child in $children; do kill "$child" 2>/dev/null || true; done
            kill -- -$$ 2>/dev/null || true
          }
          trap _abort SIGTERM SIGINT
          TASK_ID="${{ github.event.inputs.task_id }}"
          TASK_TYPE="${{ github.event.inputs.task_type }}"
          TASK_DESC="${{ github.event.inputs.task_desc }}"
          if [ -n "$OLLAMA_API_KEY" ] || [ -n "$ANTHROPIC_API_KEY" ]; then
            echo "LLM key detected — running agentic runner (provider=$LLM_PROVIDER)"
            python tools/anvil/agentic_runner.py \
              --task-id  "$TASK_ID" \
              --task-desc "$TASK_DESC" \
              --task-type "$TASK_TYPE" \
              --max-turns 6
          elif [ -f "tools/anvil/${TASK_TYPE}.py" ]; then
            echo "No LLM key — falling back to static ANVIL wrapper: tools/anvil/${TASK_TYPE}.py"
            set +e
            python "tools/anvil/${TASK_TYPE}.py" --json --keep-going -- "$TASK_DESC" \
              | tee /tmp/anvil_result.json
            ANVIL_RC=$?
            set -e
            if [ "$ANVIL_RC" -ne 0 ]; then
              CRITICAL=$(python3 -c "import json,sys; d=json.load(open('/tmp/anvil_result.json')); bad=[s for s in d.get('steps',[]) if not s.get('skipped') and s.get('returncode',0)!=0 and 'e2e_runner' not in s.get('command','')]; print(len(bad))" 2>/dev/null || echo 1)
              if [ "$CRITICAL" -gt 0 ]; then
                echo "ANVIL: $CRITICAL critical step(s) failed (non-e2e)."
                exit 1
              else
                echo "ANVIL: completed — only non-critical (e2e) failures."
              fi
            fi
          else
            echo "No LLM key and no ANVIL wrapper for '${TASK_TYPE}'. Running generic health + lint."
            python tools/testing/health_check.py --json
            python -m ruff check tools/ tests/ --select E,F,W --ignore E402,E501,E731,E741
          fi

      - name: Stop dashboard server
        if: always()
        run: |
          if [ -f /tmp/dashboard.pid ]; then
            PID=$(cat /tmp/dashboard.pid)
            kill "$PID" 2>/dev/null || true
            sleep 1
            kill -0 "$PID" 2>/dev/null && kill -9 "$PID" 2>/dev/null || true
          fi
          # Best-effort idle-in-transaction backend sweep
          python -c "
          import sys
          sys.path.insert(0, '.')
          try:
              from tools.db.storage import get_connection
              conn = get_connection()
              cur = conn.cursor()
              cur.execute(\"\"\"
                  SELECT pg_terminate_backend(pid)
                  FROM pg_stat_activity
                  WHERE datname = current_database()
                    AND state = 'idle in transaction'
                    AND backend_start < NOW() - INTERVAL '2 minutes'
              \"\"\")
              conn.commit()
              cur.close()
              conn.close()
              print('PG idle-in-transaction cleanup: done')
          except Exception as e:
              print(f'PG cleanup skipped: {e}')
          " 2>/dev/null || true

      # ── Branch + PR for EVERY task (branch→V&V→MR discipline) ─────────────
      # Runs only when the agent step succeeded (a failed run falls through to
      # the scheduler's resilience path: failure_count → needs_decomposition →
      # auto-decompose). Commits the agent's changes to a per-task branch, pushes,
      # and opens a PR against main. The PR's OWN CI (icdev-ci.yml on
      # pull_request) is the V&V gate; pr_watcher (OPT-70) reads it to auto-merge
      # low-risk types (chore/test/fix) or route feature/bug to human review.
      # ci-fix-* tasks keep their dedicated ci-autofix/* branch + label.
      # Guard: only opens a PR when git finds staged changes — avoids empty PRs.
      - name: Commit and open PR
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TASK_ID="${{ github.event.inputs.task_id }}"
          TASK_TYPE="${{ github.event.inputs.task_type }}"
          TASK_DESC="${{ github.event.inputs.task_desc }}"
          case "$TASK_ID" in
            ci-fix-*) BRANCH="ci-autofix/${TASK_ID}"; LABEL="ci-autofix" ;;
            *)        BRANCH="kanban/${TASK_ID}";     LABEL="kanban-task" ;;
          esac
          git config user.email "kanban-runner@github.com"
          git config user.name "ICDEV Kanban Runner [bot]"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit — agent applied no changes; nothing to PR."
            exit 0
          fi
          git checkout -b "$BRANCH"
          git commit -m "${TASK_TYPE}(${TASK_ID}): ${TASK_DESC}"
          git push origin "$BRANCH"
          # Draft PR for feature/bug (human review); ready PR for chore/test/fix.
          DRAFT=""
          case "$TASK_TYPE" in
            feature|bug) DRAFT="--draft" ;;
          esac
          gh pr create $DRAFT \
            --title "${TASK_TYPE}: ${TASK_ID} — ${TASK_DESC}" \
            --body "Automated PR from kanban task ${TASK_ID} (type=${TASK_TYPE}). V&V runs as this PR's CI; pr_watcher (OPT-70) governs merge." \
            --base main \
            --head "$BRANCH" \
            --label "$LABEL" 2>/dev/null || echo "gh pr create skipped/failed (PR may already exist)."
          echo "Opened PR from $BRANCH → main."

      - name: Summary
        if: always()
        run: |
          echo "Task ${{ github.event.inputs.task_id }} (${{ github.event.inputs.task_type }}) | provider=${{ github.event.inputs.llm_provider || 'ollama_cloud' }} | completed."
