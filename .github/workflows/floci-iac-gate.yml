# CUI // SP-CTI
name: floci IaC Gate (opt-in)

# WHAT THIS PROVES, and nothing else in the pipeline asks it:
# does `tools/infra_canvas/preapply_gate.py`'s verdict on a Terraform plan
# match what a REAL AWS API surface accepts? The gate has only ever been
# checked against fixtures written beside it; floci is an independent
# derivation that has never read our IQE queries.
#
# twx-spk-01 rated this pattern GO (conditional, cloud-CI only) and the single
# thing blocking it was LocalStack's paid subscription. floci removes that --
# MIT, no auth token, no feature gates. This SUPERSEDES that spike on the
# air-gap question only; every other finding in it still stands, including the
# standing guard repeated at the bottom of this file.
#
# ── THIS IS NEVER ONE OF THE FOUR REQUIRED CHECKS ─────────────────────────
# The required set is Lint, Test, Security Scan, Helm Lint. Do not add this
# job to it. GitHub-hosted runners on this account are near-serial -- roughly
# one run at a time -- so a job that stood up an emulator on every PR would put
# itself in front of every merge on the board, and that is how a gate earns
# itself a bypass. It runs when a human ASKS: a dispatch, a `floci-gate` label,
# or the weekly sweep.
#
# WHICH GATE. There is now exactly ONE:
#   tools/infra_canvas/preapply_gate.py   has a CLI, runs the
#                                         context/iqe/queries/infra/*.iqe checks
#                                         over the plan delta.  <-- THIS ONE
# When flx-ci-01 wrote this job there were TWO, and it had to NAME the one it
# used rather than choose -- a job that silently picks one of a duplicate pair
# blesses the pair. flx-ci-02 measured the pair and deleted the other: it had
# zero runtime callers and returned the same verdict for the compliant and the
# violating fixture, because its rules asked estate-completeness questions of a
# plan delta. See docs/audits/flx-ci-02-two-preapply-gates.md.

on:
  workflow_dispatch:
    inputs:
      image:
        description: "Override the pinned floci image (blank = args/floci_iac_gate.yaml)"
        required: false
        default: ""
      fixture:
        description: "Run one fixture canvas only (blank = all)"
        required: false
        default: ""
  schedule:
    # Weekly, Tuesday 06:00 UTC -- deliberately clear of gate-promoter (Mon 04:00)
    # and shard-timings, because those runners are the same near-serial pool.
    - cron: "0 6 * * 2"
  pull_request:
    # `labeled` ONLY, not `synchronize`. A labelled PR that pushes ten times
    # would otherwise queue ten emulator runs ahead of every other merge. To
    # re-check after a push, remove and re-add the label, or dispatch.
    types: [labeled]

# One run per ref; a newer request cancels a superseded one (mfx-ci-02).
concurrency:
  group: floci-iac-gate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  floci-iac-gate:
    name: preapply_gate vs a real AWS API surface
    runs-on: ubuntu-latest
    # The label gate. A PR without `floci-gate` never starts this job at all --
    # not "starts and skips", which would still occupy the queue.
    if: >-
      github.repository == 'icdev-ai/icdev' &&
      (github.event_name != 'pull_request' ||
       contains(github.event.pull_request.labels.*.name, 'floci-gate'))
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run the gate against floci
        id: gate
        env:
          PYTHONPATH: ${{ github.workspace }}
          ICDEV_STORAGE_BACKEND: sqlite
          # THE SWITCH, and it is asserted rather than assumed: the driver
          # calls detect_mode() and REFUSES to plan or apply unless it answers
          # an emulated mode. A runner with AWS credentials and no switch would
          # otherwise get `aws`, and this job would apply to a real account.
          FLOCI_ENABLED: "true"
          FLOCI_ENDPOINT: "http://localhost:4566"
          FLOCI_CI_IMAGE: ${{ github.event.inputs.image || '' }}
        # NO `|| true` and NO `continue-on-error`. Exit 2 is COULD NOT RUN and
        # it stays RED -- a gate that could not run is not a gate that found
        # nothing. Exit 1 is a finding. Exit 0 covers `clean` and
        # `not_configured`, and the driver states which in words.
        run: |
          python tools/ci/floci_iac_gate.py \
            --json \
            --out floci-iac-gate.json \
            --artifacts floci-iac-gate-artifacts \
            ${{ github.event.inputs.fixture && format('--fixture {0}', github.event.inputs.fixture) || '' }}

      - name: Upload the plan JSON, the gate output and the apply report
        # `if: always()` -- the evidence is most wanted on the run that FAILED.
        # A gate whose evidence is not captured is the red-first defect in
        # another costume: the verdict is asserted and the artifact proving it
        # fired is absent.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: floci-iac-gate-evidence
          path: |
            floci-iac-gate.json
            floci-iac-gate-artifacts/
          if-no-files-found: warn

      - name: Emulator container logs
        if: failure()
        run: docker logs icdev-floci-iac-gate --tail 200 || echo "no container to read"

  # ── The DOCKER-ONLY test half (flx-test-01) ─────────────────────────────
  # tests/cloud/test_floci_container_docker.py is EXCLUDED from the merge gate
  # (args/test_gating_gate.yaml) because it needs a Docker daemon, so this is
  # the ONLY place it runs. Excluded is not "unrun": a file that is neither
  # gated nor executed anywhere is exactly the dead-suite defect the test-gating
  # policy exists to close, and an exclusion whose reason cites this job is a
  # promise this job has to keep.
  #
  # A SEPARATE JOB, not a step on the gate above. The two ask different
  # questions -- that one replays preapply_gate against a real AWS API surface,
  # this one proves the seam's own constants are right -- and a failure in
  # either must be attributable on its own. They also run in parallel rather
  # than serially behind a 30-minute gate.
  floci-docker-suite:
    name: docker-only floci suite
    runs-on: ubuntu-latest
    # Same admission rule as the gate job, deliberately duplicated rather than
    # inherited: a `needs:` would make this wait for a 30-minute job it shares
    # no evidence with, and would SKIP it whenever that job fails -- which is
    # precisely when the seam's constants are worth re-deriving.
    if: >-
      github.repository == 'icdev-ai/icdev' &&
      (github.event_name != 'pull_request' ||
       contains(github.event.pull_request.labels.*.name, 'floci-gate'))
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        # testcontainers-floci is declared in requirements.txt, so no second
        # install line here -- a job that pip-installed its own dependency would
        # let the declaration rot without anything going red. boto3 is NOT
        # declared (five of the seven floci tables need it, and the twin adapter
        # scores its absence `warn`/`sdk_unavailable` on purpose), so this job
        # installs it explicitly to exercise the measured path rather than the
        # degraded one.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install "boto3>=1.34"

      - name: Pre-pull the pinned emulator image
        # Pulled HERE, by name, rather than implicitly by the container start.
        # The suite asserts it runs `emulator.IMAGE` and never the library's
        # `latest` default; pulling the pin explicitly means a tag that has gone
        # missing fails on a line that says so instead of inside a fixture.
        run: |
          IMAGE="$(python -c 'from tools.cloud import emulator; print(emulator.IMAGE)')"
          echo "pinned image: $IMAGE"
          docker pull "$IMAGE"
        env:
          PYTHONPATH: ${{ github.workspace }}

      - name: Run the docker-only floci suite
        # NO `|| true` and NO `continue-on-error`.
        #
        # `-p no:randomly` is not used and no marker selection happens here: the
        # file is named explicitly, which is the same discipline the gated run
        # uses. `--no-header -ra` surfaces any SKIP in the log, because a suite
        # that skipped itself on a runner WITH Docker is unmeasured, not green,
        # and the next step is what refuses it.
        run: |
          python -m pytest tests/cloud/test_floci_container_docker.py \
            -v --no-header -ra --tb=short \
            --junitxml=floci-docker-suite.xml
        env:
          PYTHONPATH: ${{ github.workspace }}
          ICDEV_STORAGE_BACKEND: sqlite

      - name: Refuse a suite that skipped itself
        # THE POINT OF THIS STEP. `pytest.importorskip` makes the file harmless
        # on a laptop with no Docker; on THIS runner a skip means the one job
        # that ever runs these assertions ran none of them, and would report
        # green. A gated file gets this from skip_census; an excluded file has
        # to bring its own, and this is it.
        if: always()
        run: |
          python - <<'PY'
          import sys, xml.etree.ElementTree as ET
          try:
              root = ET.parse("floci-docker-suite.xml").getroot()
          except Exception as exc:
              sys.exit("no JUnit report to read (%r) -- the suite did not run" % (exc,))
          suites = root.iter("testsuite")
          tests = skipped = 0
          for s in suites:
              tests += int(s.get("tests", 0))
              skipped += int(s.get("skipped", 0))
          print("tests=%d skipped=%d" % (tests, skipped))
          if tests == 0:
              sys.exit("the docker-only suite collected NOTHING")
          if skipped:
              sys.exit("%d/%d skipped on a runner that has Docker -- unmeasured, "
                       "not green" % (skipped, tests))
          PY

      - name: Upload the suite report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: floci-docker-suite-evidence
          path: floci-docker-suite.xml
          if-no-files-found: warn

# NEVER SOURCE A PERFORMANCE, COST OR CAPACITY CLAIM FROM THIS JOB. An emulator
# reproduces the AWS API CONTRACT, not its performance characteristics. That is
# the standing guard from docs/spikes/twx-spk-01-localstack-go-no-go.md and it
# survives the switch from LocalStack to floci unchanged.
