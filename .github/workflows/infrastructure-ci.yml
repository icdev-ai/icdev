# [TEMPLATE: CUI // SP-CTI]
name: Infrastructure CI/CD

on:
  push:
    branches: [master, main, "infra-*", "feature-*"]
    paths:
      - "docker/**"
      - "docker-compose*.yml"
      - "deploy/**"
      - ".github/workflows/infrastructure-ci.yml"
  pull_request:
    branches: [master, main]
    paths:
      - "docker/**"
      - "docker-compose*.yml"
      - "deploy/**"
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment (ci / staging / production)"
        required: true
        default: "ci"
        type: choice
        options: [ci, staging, production]

env:
  REGISTRY: ghcr.io
  # Fully qualified, including the registry host. Previously this was just
  # "<owner>/icdev", so the build tags resolved to `icdev-ai/icdev/<image>`
  # with NO registry — Docker defaults that to Docker Hub, and every push on
  # main died with "push access denied" even though the Log in to GHCR step
  # had authenticated to ghcr.io correctly. The tag simply never pointed there.
  # The host is written literally because a workflow-level `env:` entry cannot
  # reference another `env:` entry (${{ env.REGISTRY }} is not resolvable here).
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/icdev

# Least privilege by default; the two jobs that publish images to GHCR opt into
# packages:write individually. Without this the default GITHUB_TOKEN is
# read-only, which is the second half of the "push access denied" failure.
permissions:
  contents: read

jobs:
  # ── Validate: YAML syntax + compose config ─────────────────────────────
  validate-compose:
    name: Validate Compose Files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No install step: ubuntu-latest ships Docker Compose v2 already.
      # `apt-get install docker-compose-plugin` failed with "no installation
      # candidate" because that package comes from Docker's own apt repo, which
      # is not configured on the runner — so this job had been red on every run
      # that triggered it. It only fires on docker/**, docker-compose*.yml or
      # deploy/** changes, which is why it stayed unnoticed.
      - name: Show Docker Compose version
        run: docker compose version

      # docker-compose.yml declares `env_file: .env`, and .env is gitignored —
      # so a fresh checkout has none and `config` fails before it validates
      # anything. Created empty: the required values come from the step env
      # below, and an empty file satisfies the env_file reference without
      # inventing configuration that would mask a real missing default.
      - name: Create placeholder .env for validation
        run: touch .env

      - name: Validate docker-compose.yml syntax
        # `docker compose config` interpolates EVERY service, including ones
        # behind an inactive profile — so the llm-proxy profile's required
        # LITELLM_MASTER_KEY has to resolve even though the proxy is off.
        #
        # Supplied here rather than given a default in docker-compose.yml on
        # purpose: the "must be set" requirement is a real safety property
        # (it stops the proxy starting with no auth), and weakening the compose
        # file to make CI pass would trade a runtime guarantee for a green tick.
        env:
          # Every `${VAR:?...}` in docker-compose.yml, enumerated rather than
          # discovered one failed CI run at a time.
          LITELLM_MASTER_KEY: ci-validation-placeholder
          ICDEV_PG_PASSWORD: ci-validation-placeholder
        run: docker compose -f docker-compose.yml config --quiet

      # Guarded: docker-compose.ci.yml does not exist in this repo, so an
      # unconditional validate failed the job even once the install step was
      # fixed. Mirrors the `if [ -d deploy/helm ]` guard the Helm step below
      # already uses.
      - name: Validate docker-compose.ci.yml syntax (if present)
        run: |
          if [ -f docker-compose.ci.yml ]; then
            docker compose -f docker-compose.ci.yml config --quiet
          else
            echo "docker-compose.ci.yml not present — skipping"
          fi

      - name: Validate Helm chart (if present)
        uses: azure/setup-helm@v4
        continue-on-error: true
      - run: |
          if [ -d deploy/helm ]; then
            helm lint deploy/helm/
            helm template icdev deploy/helm/ > /dev/null
          else
            echo "No Helm chart found — skipping"
          fi
        continue-on-error: true

  # ── Build: core infrastructure images ──────────────────────────────────
  build-images:
    name: Build Infrastructure Images
    runs-on: ubuntu-latest
    needs: validate-compose
    permissions:
      contents: read
      packages: write   # required to push images to ghcr.io on main
    strategy:
      fail-fast: false
      matrix:
        image:
          - { name: agent-base,    file: docker/Dockerfile.agent-base }
          - { name: dashboard,     file: docker/Dockerfile.dashboard }
          - { name: orchestrator,  file: docker/Dockerfile.orchestrator }
          - { name: architect,     file: docker/Dockerfile.architect }
          - { name: builder,       file: docker/Dockerfile.builder }
          - { name: compliance,    file: docker/Dockerfile.compliance }
          - { name: security,      file: docker/Dockerfile.security }
          - { name: infrastructure,file: docker/Dockerfile.infrastructure }
          - { name: api-gateway,   file: docker/Dockerfile.api-gateway }
          - { name: iac,           file: docker/Dockerfile.iac }

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build ${{ matrix.image.name }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.image.file }}
          tags: |
            ${{ env.IMAGE_PREFIX }}/${{ matrix.image.name }}:${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}/${{ matrix.image.name }}:latest
          cache-from: type=gha,scope=${{ matrix.image.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image.name }}
          # Push to GHCR only on main branch push
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          # Always load for local smoke test
          load: ${{ github.event_name != 'push' || github.ref != 'refs/heads/main' }}

      - name: Smoke-test image (non-root, read-only rootfs)
        # --entrypoint is load-bearing. 9 of the 10 images declare an ENTRYPOINT
        # (python, gunicorn, /bin/bash), so a bare trailing command is APPENDED
        # to it rather than replacing it. The previous probe ran
        #   python python --version      then     python echo "image OK"
        # which failed as `python: can't open file '/app/echo'` — after the image
        # had built successfully. All 10 matrix jobs went red on that, which is
        # what issue #911 recorded as "all 10 Docker builds fail". They build.
        #
        # `sh -c` rather than `python --version`: iac is terraform-based and
        # api-gateway runs gunicorn, so a Python interpreter is not a safe
        # assumption across the matrix. Every image here is debian/alpine-based
        # and has a shell.
        #
        # stderr is deliberately NOT sent to /dev/null. That redirect is why this
        # took a full log dig to diagnose — it discarded the only message that
        # named the cause and left the confusing /app/echo error behind.
        run: |
          docker run --rm \
            --user 65534:65534 \
            --read-only \
            --tmpfs /tmp \
            --entrypoint sh \
            ${{ env.IMAGE_PREFIX }}/${{ matrix.image.name }}:${{ github.sha }} \
            -c 'echo "image OK: $(uname -s) $(id -u)"'

  # ── Deploy: spin up CI stack and run health checks ──────────────────────
  provision-ci-stack:
    name: Provision CI Infrastructure Stack
    runs-on: ubuntu-latest
    needs: build-images
    env:
      ICDEV_PG_PASSWORD: ci-test-password
      ICDEV_DASHBOARD_SECRET: ci-test-secret-32chars-minimum!!
      ICDEV_CLASSIFICATION: CUI
      IMPACT_LEVEL: IL4
      ICDEV_STORAGE_BACKEND: sqlite

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt
          pip install -e . 2>/dev/null || true

      - name: Write CI .env
        run: |
          cat > .env <<'EOF'
          ICDEV_PG_USER=icdev
          ICDEV_PG_PASSWORD=ci-test-password
          ICDEV_PG_DB=icdev
          ICDEV_DASHBOARD_SECRET=ci-test-secret-32chars-minimum!!
          ICDEV_STORAGE_BACKEND=sqlite
          ICDEV_CLASSIFICATION=CUI
          IMPACT_LEVEL=IL4
          ICDEV_CUI_BANNER_ENABLED=true
          EOF

      # docker-compose.ci.yml has never existed in this repo. This job could not
      # reveal that until now: build-images always failed first (see #911), so
      # provision-ci-stack was permanently `skipped` and its reference to a
      # missing file went unnoticed. validate-compose already guards the same
      # filename; this mirrors that guard for the steps that actually run it.
      #
      # The notice is deliberate. Skipping silently would make this job report
      # green while exercising no integration stack at all — a job that claims
      # to provision infrastructure and quietly provisions nothing is worse than
      # a red one. Write the compose file to turn the real stack on; nothing
      # else needs to change.
      - name: Start CI infrastructure stack
        id: stack
        run: |
          if [ ! -f docker-compose.ci.yml ]; then
            echo "::notice title=CI stack not exercised::docker-compose.ci.yml is not present in this repo — the dashboard/Postgres integration stack was NOT started. Steps depending on a live stack are skipped; local health, schema and unit-test steps still run."
            echo "present=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "present=true" >> "$GITHUB_OUTPUT"
          docker compose -f docker-compose.ci.yml up -d --wait --timeout 180
        # Raised from 5: this step now also BUILDS the dashboard image. The
        # images from build-images are not reachable here — that job runs on a
        # different runner and only `load`s them locally (it pushes to GHCR on
        # main alone), so compose builds its own.
        timeout-minutes: 20

      # /health does not exist on the dashboard — the app serves /api/health
      # (app.py, the load-balancer probe that also runs a SELECT 1). The old
      # path returned 404 on every attempt, so this step would have failed even
      # against a perfectly healthy stack. It had never run to find out.
      - name: Wait for dashboard health endpoint
        if: steps.stack.outputs.present == 'true'
        run: |
          for i in $(seq 1 24); do
            if curl -sf http://localhost:5050/api/health > /dev/null 2>&1; then
              echo "Dashboard is healthy"
              break
            fi
            echo "Attempt $i/24 — waiting 5s..."
            sleep 5
          done
          # Unpiped and unguarded on purpose: if the endpoint is still not
          # answering after the loop, this is what fails the step.
          curl -sf http://localhost:5050/api/health | python -m json.tool

      - name: Run Python health check
        run: python tools/testing/health_check.py --json

      - name: Verify DB schema
        run: python tools/db/init_icdev_db.py

      - name: Run core unit tests against live stack
        run: |
          pytest tests/test_init_icdev_db.py \
                 tests/test_schemas.py \
                 -v --tb=short

      - name: Run BDD scenarios (infrastructure)
        run: |
          behave features/ --tags=infrastructure --no-capture \
            --format progress 2>/dev/null || \
          echo "No infrastructure-tagged BDD scenarios found — skipping"
        continue-on-error: true

      - name: Collect docker logs on failure
        if: failure() && steps.stack.outputs.present == 'true'
        run: docker compose -f docker-compose.ci.yml logs --tail=100

      - name: Tear down CI stack
        if: always() && steps.stack.outputs.present == 'true'
        run: docker compose -f docker-compose.ci.yml down -v --remove-orphans

  # ── Deploy: push IaC artifacts (main branch only) ──────────────────────
  deploy-infrastructure:
    name: Deploy Infrastructure Artifacts
    runs-on: ubuntu-latest
    needs: provision-ci-stack
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production
    permissions:
      contents: read
      packages: write   # re-tags and pushes the SHORT_SHA image to ghcr.io
    env:
      ICDEV_CLASSIFICATION: CUI
      IMPACT_LEVEL: IL4

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag and push release images
        run: |
          SHORT_SHA="${GITHUB_SHA::8}"
          for img in agent-base dashboard orchestrator architect builder \
                     compliance security infrastructure api-gateway iac; do
            docker pull ${{ env.IMAGE_PREFIX }}/${img}:${{ github.sha }} 2>/dev/null || true
            docker tag  ${{ env.IMAGE_PREFIX }}/${img}:${{ github.sha }} \
                        ${{ env.IMAGE_PREFIX }}/${img}:${SHORT_SHA} || true
            docker push ${{ env.IMAGE_PREFIX }}/${img}:${SHORT_SHA} || true
          done

      - name: Update Helm values with new image tag
        run: |
          SHORT_SHA="${GITHUB_SHA::8}"
          if [ -f deploy/helm/values.yaml ]; then
            sed -i "s/tag: .*/tag: ${SHORT_SHA}/" deploy/helm/values.yaml
            echo "Updated Helm values to tag=${SHORT_SHA}"
          fi

      - name: Generate deployment manifest
        run: |
          mkdir -p artifacts
          cat > artifacts/deployment-manifest.json <<EOF
          {
            "sha": "${{ github.sha }}",
            "short_sha": "${GITHUB_SHA::8}",
            "branch": "${{ github.ref_name }}",
            "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "classification": "CUI",
            "impact_level": "IL4",
            "images": [
              "agent-base", "dashboard", "orchestrator", "architect",
              "builder", "compliance", "security", "infrastructure",
              "api-gateway", "iac"
            ],
            "registry": "${{ env.IMAGE_PREFIX }}"
          }
          EOF
          cat artifacts/deployment-manifest.json

      - name: Upload deployment manifest
        uses: actions/upload-artifact@v4
        with:
          name: deployment-manifest-${{ github.sha }}
          path: artifacts/deployment-manifest.json
          retention-days: 90
