name: ICDEV CI

on:
  push:
    branches: [master, main, "feature-*"]
  pull_request:
    branches: [master, main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff
      - run: ruff check tools/ tests/ --select E,F,W

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      matrix:
        python-version: ["3.9", "3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -r requirements.txt
      - run: pytest tests/ -v --tb=short --ignore=tests/e2e -x
        env:
          ICDEV_CUI_BANNER_ENABLED: "true"

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install bandit pip-audit
      - run: bandit -r tools/ -ll -q
      - run: pip install -r requirements.txt && pip-audit --skip-editable -q
        continue-on-error: true

  sandbox:
    name: LLM Sandbox Isolation (D-SEC-10)
    runs-on: ubuntu-latest
    needs: [test]
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install sandbox dependencies
        run: pip install llm-sandbox docker pyyaml
      - name: Sandbox health check
        run: python tools/security/sandbox_executor.py --health --json
        continue-on-error: true
      - name: Sandbox-execute changed Python files
        run: |
          CHANGED=$(git diff --name-only origin/main...HEAD -- '*.py' 2>/dev/null || echo "")
          if [ -z "$CHANGED" ]; then
            echo "No changed Python files — sandbox check passed"
            exit 0
          fi
          FAILED=0
          for FILE in $CHANGED; do
            if [ -f "$FILE" ]; then
              echo "  Sandbox: $FILE"
              RESULT=$(python tools/security/sandbox_executor.py \
                --execute-file --path "$FILE" --language python \
                --actor ci-pipeline --project-id "$GITHUB_REPOSITORY" \
                --json 2>&1) || true
              STATUS=$(echo "$RESULT" | python -c "import json,sys; r=json.load(sys.stdin); print(r.get('status','failed'))" 2>/dev/null || echo "unavailable")
              if [ "$STATUS" = "unavailable" ] || [ "$STATUS" = "disabled" ]; then
                echo "    SKIP: $FILE (sandbox $STATUS)"
              elif [ "$STATUS" != "completed" ]; then
                echo "    FAIL: $FILE (status=$STATUS)"
                echo "$RESULT"
                FAILED=$((FAILED + 1))
              fi
            fi
          done
          if [ $FAILED -gt 0 ]; then
            echo "Sandbox isolation FAILED: $FAILED file(s) failed"
            exit 1
          fi
          echo "Sandbox isolation PASSED"

  docker-build:
    name: Docker Build Validation
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - name: Build agent-base
        run: docker build -f docker/Dockerfile.agent-base -t icdev/agent-base:test .
      - name: Build dashboard
        run: docker build -f docker/Dockerfile.dashboard -t icdev/dashboard:test .
      - name: Build orchestrator
        run: docker build -f docker/Dockerfile.orchestrator -t icdev/orchestrator:test .
      - name: Build architect
        run: docker build -f docker/Dockerfile.architect -t icdev/architect:test .
      - name: Build builder
        run: docker build -f docker/Dockerfile.builder -t icdev/builder:test .
      - name: Build compliance
        run: docker build -f docker/Dockerfile.compliance -t icdev/compliance:test .
      - name: Build security
        run: docker build -f docker/Dockerfile.security -t icdev/security:test .
      - name: Build infrastructure
        run: docker build -f docker/Dockerfile.infrastructure -t icdev/infrastructure:test .

  helm-lint:
    name: Helm Chart Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Helm
        uses: azure/setup-helm@v4
      - name: Lint chart
        run: helm lint deploy/helm/
      - name: Template validation
        run: helm template icdev deploy/helm/ > /dev/null
