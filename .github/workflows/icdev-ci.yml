# [TEMPLATE: CUI // SP-CTI]
name: ICDEV CI

on:
  push:
    branches: [master, main, "feature-*"]
  pull_request:
    branches: [master, main]

env:
  # Absolute checkout root keeps Python imports stable even if a step changes
  # cwd. The relative "." broke coherence/RLS checks on runners where the
  # working directory drifted, causing main/cwd validation failures.
  PYTHONPATH: "${{ github.workspace }}"
  ICDEV_CUI_BANNER_ENABLED: "true"

jobs:
  # ── Tier 0: Lint (full codebase — ruff.toml enforces line-length=120) ────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff
      # NO --fix. An auto-fix step here rewrites the files IN THE RUNNER, so the
      # lint below then passes against a tree nobody committed: the gate goes
      # green while the debt stays in the repo forever. That is how 10 dead
      # imports survived indefinitely. Lint the tree as it actually is; if this
      # fails, run `ruff check tools/ tests/ --select E,F,W --ignore E402,E501,
      # E701,E702,E721,E722,E731,E741,F404 --fix` locally and COMMIT the result.
      - name: Ruff lint
        working-directory: ${{ github.workspace }}
        run: python -m ruff check tools/ tests/ --select E,F,W --ignore E402,E501,E701,E702,E721,E722,E731,E741,F404

  # ── Tier 1: Unit Tests (pure Python — no LLM) ───────────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -e . 2>/dev/null || true
      # Runs AFTER lint (this job `needs: lint`) and BEFORE the pytest step, so a
      # swallowed write fails in ~1 min instead of at the end of the suite. It
      # lives in this job rather than in `lint` because the detector is reached
      # through `tools/__init__.py`, which imports LLMRouter -> yaml/db at import
      # time; the lint job installs only ruff, so the same command there would
      # exit 2 (detector unimportable) and fail for the wrong reason.
      #
      # Exit codes are load-bearing: 0 clean, 1 violations, 2 the detector could
      # not be imported. All three are honoured by not swallowing the status --
      # do NOT add `|| true` here. A `2` must stay red, because a check that
      # reports clean after its detector vanished is the exact silent failure
      # this gate exists to close.
      - name: Swallowed-INSERT gate
        working-directory: ${{ github.workspace }}
        run: python tools/dev/check_swallowed_inserts.py
      # idp-score-01-d4. A SMOKE gate, not a quality bar: it proves the sweep
      # walks all ~68 components in args/component_registry.yaml and produces a
      # verdict for each without raising. --dry-run writes nothing, so this
      # needs no migrated database and leaves no rows behind.
      #
      # It does NOT assert that anything was assessed, and must not. A CI
      # checkout has no probe history, no compliance assessment and no coherence
      # report, so every component correctly comes back NOT_ASSESSED -- that is
      # the honest answer about ICDEV's measurement coverage on a cold tree, not
      # a failure of the runner. Reddening here over an unassessed component
      # would train everyone to add a `|| true`, and the real signal (a
      # component that RAISES, exit 1) would go with it. Exit codes: 0 swept
      # clean, 1 a component raised, 2 the registry would not load.
      - name: Component scoring sweep (dry run)
        working-directory: ${{ github.workspace }}
        run: python -m tools.quality.run_component_scoring --dry-run
      # The gated test list lives in args/ci_test_files/core.txt, NOT here
      # (kax-conflict-07). It used to be a line-continuation chain in this file,
      # which made every task that added a test edit this hand-written workflow at
      # the same offset: five PRs collided on it in one night on 2026-08-09, and
      # because pr_watcher's sibling-conflict guard correctly refuses to co-merge
      # PRs sharing a non-additive file, each of the five became a sibling of
      # every other and none could merge. The list is the only ADDITIVE part of
      # this file, so only the list moved out; the job definitions here keep
      # their serialized protection.
      #
      # This is a separate step from the pytest run on purpose. It is the "the
      # gate cannot silently shrink" guard the explicit list existed for in the
      # first place: an empty list, a list below its floor, a listed path that
      # does not exist, or a duplicate is a RED step naming the cause, ~1s in,
      # rather than a green suite that quietly ran nothing. Do NOT add `|| true`.
      - name: Resolve gated test list
        working-directory: ${{ github.workspace }}
        run: python tools/ci/gated_test_list.py --check --list core
      # tsg-policy-01. The step above proves the list did not SHRINK. This one
      # proves the gap did not silently REGROW, which is the bigger hole: the
      # allowlist holds 192 of the 2,150 test modules pytest collects, and a test
      # file CI never runs has never gated a merge — it can be wrong from its
      # first commit and nothing goes red. That is how remediation_simulator's
      # NQE layer stayed dead for six weeks and how 87 files accumulated 531
      # failure lines nobody saw.
      #
      # A ratchet, NOT a sweep. The 1,826 pre-existing ungated files are
      # grandfathered by name in args/ci_test_backlog.txt; bulk-adding them here
      # would turn main red (an unknown number of them fail), the gate would get
      # disabled, and that is strictly worse than the debt. What fails is a test
      # file that is NEW — in no allowlist, no documented exclusion, and not in
      # the census. Policy: docs/ci/test-gating-policy.md.
      #
      # Do NOT add `|| true`. The failure names the offending file and the file
      # to append it to; it is a 1s fix, not a 30-minute investigation.
      - name: Test gating census
        working-directory: ${{ github.workspace }}
        run: python tools/ci/gated_test_list.py --check-coverage
      # trust-disc-03. The step above answers "does CI run this file?" and
      # nothing else. A gated file can be run on every PR, report green, and
      # assert NOTHING — because it skipped. tests/test_app.py's overview test
      # has been doing exactly that ("SQLite test DB lacks platform schema ... no
      # such column: classification" — the column the RLS predicate in
      # get_connection() filters on, so every read of kanban_tasks raised), and
      # the skip presented it as coverage for an unknown length of time.
      #
      # Static half, so it runs BEFORE pytest and costs ~1s: every skip site in a
      # gated test file must be enumerated by name in args/ci_skip_census.txt
      # with a written reason, and `skip_census.skip_max` may only go DOWN. The
      # runtime half runs after the suite, below.
      #
      # Do NOT add `|| true`. The failure names the site and the line to append.
      - name: Skip census (static)
        working-directory: ${{ github.workspace }}
        run: python tools/ci/skip_census.py --check
      - name: Run core unit tests
        working-directory: ${{ github.workspace }}
        run: |
          _abort() {
            echo "CI: abort signal received — terminating pytest children"
            # Kill direct children of this shell (pytest, coverage, etc.)
            children=$(ps -o pid= --ppid $$ 2>/dev/null || true)
            for child in $children; do
              kill "$child" 2>/dev/null || true
            done
            kill -- -$$ 2>/dev/null || true
          }
          trap _abort SIGTERM SIGINT
          # No temp file: a `/tmp` path means one thing to bash and another to
          # Python on the Windows runner, and RUNNER_TEMP is a backslash path.
          # Read the resolver's stdout straight into an array instead.
          CI_TESTS=()
          while IFS= read -r line; do
            if [ -n "$line" ]; then CI_TESTS+=("$line"); fi
          # `| tr -d` is belt-and-braces: the resolver forces LF on every platform,
          # but a stray CR is invisible in a log and makes pytest report
          # "file or directory not found" for a file that plainly exists.
          done < <(python tools/ci/gated_test_list.py --print --list core | tr -d '\015')
          # Belt-and-braces after the --check step: process substitution hides
          # python's exit status, and an empty array would make the line below
          # `pytest -v --tb=short -x`, i.e. collect the WHOLE suite — the opposite
          # of a shrunk gate, but just as wrong, and it would run for over an hour
          # before anyone noticed.
          if [ "${#CI_TESTS[@]}" -eq 0 ]; then
            echo "::error::resolved CI test list is empty — refusing to run pytest"
            exit 1
          fi
          echo "Running ${#CI_TESTS[@]} gated test targets from args/ci_test_files/core.txt"
          # --junitxml feeds the runtime half of the skip census in the next step
          # (trust-disc-03). Workspace-relative on purpose: a $RUNNER_TEMP path is
          # a backslash path on the Windows runner and a /tmp path means one thing
          # to bash and another to Python, and this file is handed between both.
          mkdir -p .tmp
          pytest "${CI_TESTS[@]}" -v --tb=short -x --junitxml=.tmp/ci-junit.xml
      # trust-disc-03, runtime half. The static census above reads source text and
      # therefore cannot see a skip raised from a conftest fixture, a plugin, or a
      # rebound alias — all three silence a gated file without its own source
      # saying so. This reads what the run ACTUALLY skipped out of the JUnit XML
      # and prints it per file, so the gated suite's skip count is a number in the
      # log of every build rather than a thing nobody has ever looked at.
      #
      # `if: always()` because a suite that failed still skipped, and the skip
      # count is often how you find out WHY it failed.
      - name: Skip census (runtime)
        if: always()
        working-directory: ${{ github.workspace }}
        run: python tools/ci/skip_census.py --from-report .tmp/ci-junit.xml --check
      - name: Verify /knowledge-search route (retry on slow endpoint)
        # The /knowledge-search page can be slow because it issues 60+ PG queries
        # via the RAG ingestion status probe. Run it in isolation with a tight
        # per-attempt timeout and a small retry loop so a transient slow-start
        # does not fail the whole unit-test tier.
        run: |
          for attempt in 1 2 3; do
            echo "Attempt $attempt/3 for /knowledge-search route test"
            timeout 60 pytest tests/test_knowledge_search_route.py -v --tb=short && exit 0
            echo "::warning::/knowledge-search route test failed attempt $attempt/3; retrying..."
            sleep 5
          done
          echo "::error::/knowledge-search route test failed after 3 attempts"
          exit 1

  # ── Tier 1: Windows portability tier ─────────────────────────────────────
  # Every other job in this file is ubuntu-latest. ICDEV is DEVELOPED on Windows
  # and was TESTED only on Linux, so an OS-portability defect was structurally
  # invisible to the pipeline: it cannot fail on the only OS the pipeline runs.
  # That is exactly how the rubric_build_tools newline bug survived review
  # (hgx-exec-01) — on Windows the owned build agent rewrote every file it
  # touched to CRLF, turning a one-line edit into a whole-file diff, and every
  # Linux assertion stayed green throughout.
  #
  # Scope is the portability-SENSITIVE subset, not the suite. These are the
  # modules that touch the filesystem, spawn processes or thread wall-clock
  # timing — the three places where Windows and POSIX actually diverge. Adding
  # the whole suite here would buy noise, not signal, and would double CI time.
  #
  # NON-REQUIRED ON PURPOSE, for now. "Test (Windows)" is deliberately absent
  # from the branch-protection required checks (Lint, Test, Security Scan, Helm
  # Lint), so a Windows-only flake cannot block a merge while this job's own
  # stability is being characterised. It still reports red in the checks list —
  # `continue-on-error` is NOT used, because a job that cannot go red is not a
  # gate, it is decoration. Promote it by adding the check to branch protection
  # once it has a clean run history; nothing in this file needs to change.
  test-windows:
    name: Test (Windows)
    runs-on: windows-latest
    needs: lint
    timeout-minutes: 30
    defaults:
      run:
        # bash, not the windows-latest default pwsh: the same shell as every
        # other job here, so a step body means one thing across the file.
        shell: bash
        # Same path isolation the rest of the workflow has — steps resolve
        # against the canonical checkout root rather than wherever the runner
        # happened to start, which is what keeps coherence/RLS-style
        # repo-root-relative logic honest.
        working-directory: ${{ github.workspace }}
    env:
      PYTHONPATH: ${{ github.workspace }}
      # conftest forces sqlite anyway; stated here so the job's backend does not
      # depend on a file it does not own.
      ICDEV_STORAGE_BACKEND: sqlite
      PYTHONIOENCODING: utf-8
    steps:
      # BEFORE checkout, deliberately. The hosted Windows image ships
      # core.autocrlf=true, which would rewrite every LF in the tree to CRLF on
      # the way to disk — so this job would be reading different BYTES than the
      # Linux jobs and any difference in outcome would be unattributable. The
      # line-ending behaviour under test is what the build TOOLSET writes into
      # its own temp files, not what git checked out, so pinning the checkout
      # to LF costs no coverage and removes a whole class of false signal.
      - name: Check out with Linux-identical line endings
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -e . || true
      # Same treatment as the Linux job (kax-conflict-07): the list lives in
      # args/ci_test_files/windows.txt, which is union-merged, so a task adding a
      # portability test never touches this workflow. It is still an EXPLICIT
      # list rather than a glob — a glob that matches nothing silently shrinks
      # the gate, which is the failure mode this whole job was created to stop
      # happening — and --check re-earns that property outside the YAML.
      - name: Resolve portability test list
        run: python tools/ci/gated_test_list.py --check --list windows
      - name: Run portability-sensitive suite
        # No `-x`. The Linux `test` job stops at the first failure because it is
        # a merge gate and the first failure is the answer; this job exists to
        # CHARACTERISE Windows behaviour, so it must report every failure in one
        # run rather than one per push.
        run: |
          WIN_TESTS=()
          while IFS= read -r line; do
            if [ -n "$line" ]; then WIN_TESTS+=("$line"); fi
          # `| tr -d` is belt-and-braces: the resolver forces LF on every platform,
          # but a stray CR is invisible in a log and makes pytest report
          # "file or directory not found" for a file that plainly exists.
          done < <(python tools/ci/gated_test_list.py --print --list windows | tr -d '\015')
          if [ "${#WIN_TESTS[@]}" -eq 0 ]; then
            echo "::error::resolved Windows test list is empty — refusing to run pytest"
            exit 1
          fi
          echo "Running ${#WIN_TESTS[@]} targets from args/ci_test_files/windows.txt"
          pytest "${WIN_TESTS[@]}" -v --tb=short --durations=15

  # ── PostgreSQL pytest tier — %s / PG-portability regression guard ─────────
  # The ordinary `test` job runs on SQLite (conftest forces it), where
  # translate_sql silently rewrites %s -> ? and masks PG-native bugs. This tier
  # runs a curated allowlist + the cortex verify scripts against a LIVE PG so
  # those bugs fail loudly. Fail-closed: conftest sets ICDEV_PG_NO_FALLBACK so an
  # unreachable PG errors instead of silently passing on SQLite.
  test-pg:
    name: Test (PostgreSQL)
    runs-on: ubuntu-latest
    needs: lint
    env:
      ICDEV_STORAGE_BACKEND: postgresql
      ICDEV_PYTEST_PG: "1"
      ICDEV_PG_NO_FALLBACK: "1"
      ICDEV_PG_HOST: localhost
      ICDEV_PG_PORT: "5432"
      ICDEV_PG_USER: icdev
      ICDEV_PG_PASSWORD: icdev_ci
      ICDEV_PG_DATABASE: icdev
      ICDEV_NO_SERVER: "1"
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -e . 2>/dev/null || true
      - name: Start PostgreSQL container
        run: |
          set -e
          for attempt in $(seq 1 5); do
            if docker pull pgvector/pgvector:pg16; then
              echo "Docker pull succeeded on attempt $attempt"
              break
            fi
            echo "::warning::docker pull pgvector/pgvector:pg16 failed (attempt $attempt/5); retrying in $((attempt * 10))s"
            sleep $((attempt * 10))
          done
          # --shm-size=1g: pgvector index builds and the single-statement
          # consolidated-schema load exhaust the default 64MB /dev/shm and crash
          # the backend ("server terminated abnormally"). Give it real shared mem.
          # --health-*: let Docker track readiness in parallel with the poll below.
          docker run -d --name pg-test \
            -e POSTGRES_USER=icdev \
            -e POSTGRES_PASSWORD=icdev_ci \
            -e POSTGRES_DB=icdev \
            -p 5432:5432 \
            --shm-size=1g \
            --health-cmd="pg_isready -U icdev -d icdev" \
            --health-interval=2s \
            --health-timeout=5s \
            --health-retries=20 \
            pgvector/pgvector:pg16
          # pg_isready can report "ready" before the backend actually accepts
          # queries, so gate on a real SELECT 1 too and hard-fail (with logs) if
          # the server never stabilizes — a silent fall-through hides real crashes.
          ready=""
          for i in $(seq 1 45); do
            if docker exec pg-test pg_isready -U icdev -d icdev >/dev/null 2>&1 \
               && docker exec pg-test psql -U icdev -d icdev -c 'SELECT 1' >/dev/null 2>&1; then
              echo "PostgreSQL is ready (attempt $i)"
              ready=1
              break
            fi
            sleep 1
          done
          if [ -z "$ready" ]; then
            echo "::error::PostgreSQL did not become ready after 45s"
            docker logs pg-test || true
            exit 1
          fi
      - name: Initialize database (consolidated PG schema snapshot)
        run: python tools/db/bootstrap_pg.py
      - name: Run PostgreSQL pytest tier
        # Allowlist tests + cortex verify_pg + verify_tenant_isolation on live PG.
        run: python tools/testing/pg_pytest_tier.py --json

  # ── Tier 1: Security Scan (pure Python — no LLM) ────────────────────────
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install bandit pip-audit
      - name: SAST (bandit) — 0 high+high findings
        run: bandit -r tools/ -q --severity-level high --confidence-level high
      - name: Dependency audit
        run: pip install -r requirements.txt && pip-audit --skip-editable -q
        continue-on-error: true

  # ── Tier 2: Two-Tier LLM Build (Ollama + Claude review) ─────────────────
  two-tier-build:
    name: Two-Tier LLM Build
    runs-on: ubuntu-latest
    needs: [test, security]
    if: github.event_name == 'pull_request'
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OLLAMA_BASE_URL: "http://localhost:11434"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          ollama serve &
          sleep 5

      # Must match args/llm_config.yaml models.qwen3-dual.model_id (the scanner tier).
      # qwen3:1.7b is no longer published — the pull failed and took the job with it.
      - name: Pull qwen3:0.6b (scanner-tier)
        run: ollama pull qwen3:0.6b

      - name: Verify two-tier LLM routing
        run: |
          _abort() {
            echo "CI: abort signal received — terminating LLM test children"
            children=$(ps -o pid= --ppid $$ 2>/dev/null || true)
            for child in $children; do kill "$child" 2>/dev/null || true; done
            kill -- -$$ 2>/dev/null || true
          }
          trap _abort SIGTERM SIGINT
          python -c "
          from tools.llm.router import LLMRouter, LLMRequest
          r = LLMRouter()
          tt = r._config.get('two_tier', {})
          print('Two-tier enabled:', tt.get('enabled', False))
          print('Tier 1 (scanner):', tt.get('tier1_model', 'not set'))
          print('Tier 2 (planner):', tt.get('tier2_model', 'not set'))
          try:
              resp = r.invoke('compliance_export', LLMRequest(
                  messages=[{'role': 'user', 'content': 'Summarize NIST SA-11 in one sentence.'}],
                  max_tokens=100,
              ))
              print('Scanner response:', resp.content[:80] if resp.content else 'empty')
              print('Model:', resp.model)
              print('SCANNER-TIER: PASS')
          except Exception as e:
              print(f'Scanner-tier: SKIP ({e})')
          "
        continue-on-error: true

      - name: QDC engine self-test
        run: |
          trap 'children=$(ps -o pid= --ppid $$ 2>/dev/null || true); for child in $children; do kill "$child" 2>/dev/null || true; done; kill -- -$$ 2>/dev/null || true' SIGTERM SIGINT
          python tools/qdc_canvas/qdc_engine.py
        continue-on-error: true

  # ── Tier 2: E2E Playwright Tests ─────────────────────────────────────────
  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    needs: [test]
    timeout-minutes: 30
    env:
      ICDEV_STORAGE_BACKEND: postgresql
      ICDEV_PG_HOST: localhost
      ICDEV_PG_PORT: "5432"
      ICDEV_PG_USER: icdev
      ICDEV_PG_PASSWORD: icdev_ci
      ICDEV_PG_DATABASE: icdev
      ICDEV_NO_SERVER: "1"
      ICDEV_AAC_ENABLED: "true"
      ICDEV_AIIFY_ENABLED: "true"
      ICDEV_INNOVATION_ENABLED: "true"
      ICDEV_GOVCON_ENABLED: "true"
      ICDEV_MIGRATION_CANVAS_ENABLED: "true"
      ICDEV_AUTH_BYPASS: "true"
      # nav-sec-01: E2E previously authenticated via the unconditional env-key
      # auto-login (the P0 bypass this wave removed). The CI test server now
      # opts into dev auto-login explicitly — the documented use of this flag.
      ICDEV_DASHBOARD_DEV_AUTOLOGIN: "true"
      ICDEV_MISSION_CANVAS_ENABLED: "true"
      ICDEV_OPS_HUB_ENABLED: "true"
      # NOC Operations Canvas — required by tests/e2e/noc_canvas.spec.ts (cnr-ops-02).
      # Registry default_enabled is false, so without this flag the noc_canvas
      # blueprint never registers and every /noc route 404s / redirects.
      ICDEV_NOCC_ENABLED: "true"
      ICDEV_AIML_CANVAS_ENABLED: "true"
      ICDEV_AISG_ENABLED: "true"
      ICDEV_ACE_ENABLED: "true"
      ICDEV_SLIDES_ENABLED: "true"
      # Network canvas disabled in E2E until PGP migration resolves shared-DB
      # table collisions (simulation_results/topologies schema mismatch).
      ICDEV_NDC_ENABLED: "false"
      ICDEV_NETWORK_ENABLED: "false"
      # Force canvas-specific DBs to SQLite — their tables (security_designs,
      # migration_designs, aiml_designs) are not in the consolidated PG schema
      # yet; using SQLite lets init_db() create them fresh so routes return 200.
      SC_STORAGE_BACKEND: sqlite
      MC_STORAGE_BACKEND: sqlite
      AIMC_STORAGE_BACKEND: sqlite
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Python dependencies
        run: pip install -r requirements.txt
      - name: Install Node dependencies
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps
      - name: Start PostgreSQL container
        run: |
          set -e
          for attempt in $(seq 1 5); do
            if docker pull pgvector/pgvector:pg16; then
              echo "Docker pull succeeded on attempt $attempt"
              break
            fi
            echo "::warning::docker pull pgvector/pgvector:pg16 failed (attempt $attempt/5); retrying in $((attempt * 10))s"
            sleep $((attempt * 10))
          done
          # --shm-size=1g: pgvector index builds and the single-statement
          # consolidated-schema load exhaust the default 64MB /dev/shm and crash
          # the backend ("server terminated abnormally"). Give it real shared mem.
          # --health-*: let Docker track readiness in parallel with the poll below.
          docker run -d --name pg-e2e \
            -e POSTGRES_USER=icdev \
            -e POSTGRES_PASSWORD=icdev_ci \
            -e POSTGRES_DB=icdev \
            -p 5432:5432 \
            --shm-size=1g \
            --health-cmd="pg_isready -U icdev -d icdev" \
            --health-interval=2s \
            --health-timeout=5s \
            --health-retries=20 \
            pgvector/pgvector:pg16
          # pg_isready can report "ready" before the backend actually accepts
          # queries, so gate on a real SELECT 1 too and hard-fail (with logs) if
          # the server never stabilizes — a silent fall-through hides real crashes.
          ready=""
          for i in $(seq 1 45); do
            if docker exec pg-e2e pg_isready -U icdev -d icdev >/dev/null 2>&1 \
               && docker exec pg-e2e psql -U icdev -d icdev -c 'SELECT 1' >/dev/null 2>&1; then
              echo "PostgreSQL is ready (attempt $i)"
              ready=1
              break
            fi
            sleep 1
          done
          if [ -z "$ready" ]; then
            echo "::error::PostgreSQL did not become ready after 45s"
            docker logs pg-e2e || true
            exit 1
          fi
      - name: Initialize database (consolidated PG schema snapshot)
        # The 212-migration chain is not cleanly replayable on a fresh PG DB;
        # load the authoritative consolidated schema and mark migrations applied.
        # Regenerate the snapshot with: docker exec ... pg_dump --schema-only ...
        run: python tools/db/bootstrap_pg.py
      - name: Ensure genesis_phase_log unique constraint (design_id, phase)
        # Idempotent guard: pg_consolidated.sql already creates the inline UNIQUE
        # constraint; this step makes the intent explicit and protects against
        # partial schema loads or future snapshot gaps.
        env:
          PGPASSWORD: icdev_ci
        run: |
          psql -h localhost -U icdev -d icdev -c "
            DO \$\$
            BEGIN
              IF NOT EXISTS (
                SELECT 1 FROM pg_constraint
                WHERE conname = 'genesis_phase_log_design_id_phase_key'
              ) THEN
                ALTER TABLE genesis_phase_log
                  ADD CONSTRAINT genesis_phase_log_design_id_phase_key
                  UNIQUE (design_id, phase);
                RAISE NOTICE 'genesis_phase_log unique constraint created';
              ELSE
                RAISE NOTICE 'genesis_phase_log unique constraint already present';
              END IF;
            END \$\$;
          "
      - name: Ensure fedramp_ato_packages PRIMARY KEY (unique) constraint
        # Idempotent guard: pg_consolidated.sql adds the PK via ALTER TABLE after
        # CREATE TABLE; this step protects against partial schema loads or future
        # snapshot gaps that would cause fedramp_controls FK validation to fail.
        env:
          PGPASSWORD: icdev_ci
        run: |
          psql -h localhost -U icdev -d icdev -c "
            DO \$\$
            BEGIN
              IF NOT EXISTS (
                SELECT 1 FROM pg_constraint
                WHERE conname = 'fedramp_ato_packages_pkey'
                  AND conrelid = 'fedramp_ato_packages'::regclass
              ) THEN
                ALTER TABLE fedramp_ato_packages
                  ADD CONSTRAINT fedramp_ato_packages_pkey PRIMARY KEY (id);
                RAISE NOTICE 'fedramp_ato_packages unique constraint created';
              ELSE
                RAISE NOTICE 'fedramp_ato_packages unique constraint already present';
              END IF;
            END \$\$;
          "
      - name: Start dashboard server
        run: |
          python tools/dashboard/app.py &
          echo $! > /tmp/dashboard.pid
          for i in $(seq 1 30); do
            curl -sf http://localhost:5050/ && break || sleep 1
          done
      - name: Verify ai-wizard and ai-patterns routes (non-blocking)
        # These AISG-canvas routes must not stop the pipeline if they fail;
        # emit a warning annotation but always exit 0 so subsequent steps run.
        run: |
          for route in /ai-wizard /ai-patterns; do
            status=$(curl -s -o /dev/null -w "%{http_code}" "http://localhost:5050${route}")
            if [ "$status" -lt 400 ]; then
              echo "::notice::${route} OK (HTTP ${status})"
            else
              echo "::warning::${route} returned HTTP ${status} — check ICDEV_AISG_ENABLED"
            fi
          done
        continue-on-error: true
      - name: Run Playwright E2E tests
        run: |
          _abort() {
            echo "CI: abort signal received during E2E — terminating Playwright children"
            children=$(ps -o pid= --ppid $$ 2>/dev/null || true)
            for child in $children; do kill "$child" 2>/dev/null || true; done
            kill -- -$$ 2>/dev/null || true
          }
          trap _abort SIGTERM SIGINT
          npx playwright test
      - name: Run DWO V&V specs (dwo-vv-03-d5)
        # The three DWO V&V specs live in tests/e2e/ and are collected by the
        # sweep above, but each self-skips unless its own env var is set. They are
        # held out of that sweep deliberately: dwo_restart_durability spawns a
        # dashboard on a free port, kills it, and starts it again, which does not
        # belong in an invocation that ~800 other tests share. Giving them their
        # own `npx playwright test` call is the wiring dwo-vv-03-d5 asks for — CI
        # exercises all three, and the shared sweep is untouched.
        #
        # This runs BEFORE "Stop dashboard server" on purpose: dwo_mcp_step_execution
        # and dwo_trigger_linkage drive the job's dashboard through baseURL.
        # ICDEV_NO_SERVER=1 is inherited from the job env, so Playwright starts no
        # second server of its own.
        #
        # ICDEV_PW_RUN_TAG gives this invocation its own report + artifact paths.
        # Without it Playwright would clear outputDir and overwrite the
        # results.json the sweep just wrote, and the uploaded artifact would
        # describe only this handful of specs.
        #
        # Expected today: dwo_mcp_step_execution and dwo_restart_durability PASS;
        # dwo_trigger_linkage SKIPS at its probe until dwo-evt-04 registers
        # /api/studio/event-sources and /api/studio/triggers. A skip is a pass to
        # `playwright test`, so this step goes green now and starts exercising the
        # trigger path for real the moment that surface merges — no edit here.
        env:
          ICDEV_E2E_DWO_RESTART: "1"
          ICDEV_E2E_DWO_TRIGGER: "1"
          ICDEV_E2E_DWO_MCP: "1"
          ICDEV_PW_RUN_TAG: dwo
        run: |
          _abort() {
            echo "CI: abort signal received during DWO E2E — terminating Playwright children"
            children=$(ps -o pid= --ppid $$ 2>/dev/null || true)
            for child in $children; do kill "$child" 2>/dev/null || true; done
            kill -- -$$ 2>/dev/null || true
          }
          trap _abort SIGTERM SIGINT
          npx playwright test \
            tests/e2e/dwo_restart_durability.spec.ts \
            tests/e2e/dwo_mcp_step_execution.spec.ts \
            tests/e2e/dwo_trigger_linkage.spec.ts
      - name: Stop dashboard server
        if: always()
        run: |
          if [ -f /tmp/dashboard.pid ]; then
            PID=$(cat /tmp/dashboard.pid)
            kill "$PID" 2>/dev/null || true
            sleep 1
            kill -0 "$PID" 2>/dev/null && kill -9 "$PID" 2>/dev/null || true
          fi
          # Best-effort PG backend cleanup for any idle-in-transaction leaks
          # spawned by the dashboard or test runners
          python -c "
          import os, sys
          sys.path.insert(0, '.')
          try:
              from tools.db.storage import get_connection
              conn = get_connection()
              cur = conn.cursor()
              cur.execute(\"\"\"
                  SELECT pg_terminate_backend(pid)
                  FROM pg_stat_activity
                  WHERE datname = current_database()
                    AND state = 'idle in transaction'
                    AND backend_start < NOW() - INTERVAL '2 minutes'
              \"\"\")
              conn.commit()
              cur.close()
              conn.close()
              print('PG idle-in-transaction cleanup: done')
          except Exception as e:
              print(f'PG cleanup skipped: {e}')
          " 2>/dev/null || true
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            .tmp/test_runs/playwright-report/
            .tmp/test_runs/playwright-report-dwo/
          retention-days: 30
      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            .tmp/test_runs/playwright-results.json
            .tmp/test_runs/playwright-artifacts/
            .tmp/test_runs/playwright-results-dwo.json
            .tmp/test_runs/playwright-artifacts-dwo/
            .tmp/test_runs/e2e-env-diagnostics*.json
          retention-days: 30
      # The DWO specs write their evidence to playwright/screenshots/ rather than
      # to outputDir, precisely because Playwright clears outputDir on each run.
      # Upload them so a CI failure has the same screenshots a local run produces.
      - name: Upload DWO V&V screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dwo-vv-screenshots
          path: playwright/screenshots/dwo-*.png
          retention-days: 30
          if-no-files-found: warn

  # ── Tier 3: Docker Build (main branch only) ─────────────────────────────
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f docker/Dockerfile.agent-base -t icdev/agent-base:test .
      - run: docker build -f docker/Dockerfile.dashboard -t icdev/dashboard:test .

  # ── Tier 1: Documentation Coherence Gate ─────────────────────────────────
  # Validates that docs/reference/commands.md contains the required parameter
  # strings for loop_type and adversarial_enabled (Loop Engineering section).
  doc-coherence:
    name: Doc Coherence Gate
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - name: Assert loop_type present in commands.md
        run: |
          grep -q 'loop_type' docs/reference/commands.md || \
            (echo "::error::docs/reference/commands.md is missing 'loop_type'" && exit 1)
      - name: Assert adversarial_enabled present in commands.md
        run: |
          grep -q 'adversarial_enabled' docs/reference/commands.md || \
            (echo "::error::docs/reference/commands.md is missing 'adversarial_enabled'" && exit 1)

  # ── Tier 3: Helm Chart Validation ────────────────────────────────────────
  helm-lint:
    name: Helm Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - run: helm lint deploy/helm/
      - run: helm template icdev deploy/helm/ > /dev/null
