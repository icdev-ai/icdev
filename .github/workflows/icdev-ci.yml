# [TEMPLATE: CUI // SP-CTI]
name: ICDEV CI

on:
  push:
    branches: [master, main, "feature-*"]
  pull_request:
    branches: [master, main]

env:
  # Absolute checkout root keeps Python imports stable even if a step changes
  # cwd. The relative "." broke coherence/RLS checks on runners where the
  # working directory drifted, causing main/cwd validation failures.
  PYTHONPATH: "${{ github.workspace }}"
  ICDEV_CUI_BANNER_ENABLED: "true"

jobs:
  # ── Tier 0: Lint (full codebase — ruff.toml enforces line-length=120) ────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff
      - name: Ruff auto-fix
        working-directory: ${{ github.workspace }}
        run: python -m ruff check tools/ tests/ --select E,F,W --ignore E402,E501,E701,E702,E721,E722,E731,E741,F404 --fix
      - name: Ruff lint
        working-directory: ${{ github.workspace }}
        run: python -m ruff check tools/ tests/ --select E,F,W --ignore E402,E501,E701,E702,E721,E722,E731,E741,F404

  # ── Tier 1: Unit Tests (pure Python — no LLM) ───────────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -e . 2>/dev/null || true
      - name: Run core unit tests
        run: |
          _abort() {
            echo "CI: abort signal received — terminating pytest children"
            # Kill direct children of this shell (pytest, coverage, etc.)
            children=$(ps -o pid= --ppid $$ 2>/dev/null || true)
            for child in $children; do
              kill "$child" 2>/dev/null || true
            done
            kill -- -$$ 2>/dev/null || true
          }
          trap _abort SIGTERM SIGINT
          pytest tests/test_circuit_breaker.py \
            tests/test_retry.py \
            tests/test_correlation.py \
            tests/test_errors.py \
            tests/test_init_icdev_db.py \
            tests/test_schemas.py \
            tests/test_prompt_injection_detector.py \
            tests/test_dev_profile_manager.py \
            tests/test_manifest_loader.py \
            tests/test_session_context_builder.py \
            tests/test_code_analyzer.py \
            -v --tb=short -x
      - name: Verify /knowledge-search route (retry on slow endpoint)
        # The /knowledge-search page can be slow because it issues 60+ PG queries
        # via the RAG ingestion status probe. Run it in isolation with a tight
        # per-attempt timeout and a small retry loop so a transient slow-start
        # does not fail the whole unit-test tier.
        run: |
          for attempt in 1 2 3; do
            echo "Attempt $attempt/3 for /knowledge-search route test"
            timeout 60 pytest tests/test_knowledge_search_route.py -v --tb=short && exit 0
            echo "::warning::/knowledge-search route test failed attempt $attempt/3; retrying..."
            sleep 5
          done
          echo "::error::/knowledge-search route test failed after 3 attempts"
          exit 1

  # ── Tier 1: Security Scan (pure Python — no LLM) ────────────────────────
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install bandit pip-audit
      - name: SAST (bandit) — 0 high+high findings
        run: bandit -r tools/ -q --severity-level high --confidence-level high
      - name: Dependency audit
        run: pip install -r requirements.txt && pip-audit --skip-editable -q
        continue-on-error: true

  # ── Tier 2: Two-Tier LLM Build (Ollama + Claude review) ─────────────────
  two-tier-build:
    name: Two-Tier LLM Build
    runs-on: ubuntu-latest
    needs: [test, security]
    if: github.event_name == 'pull_request'
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OLLAMA_BASE_URL: "http://localhost:11434"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          ollama serve &
          sleep 5

      - name: Pull qwen3:1.7b (scanner-tier)
        run: ollama pull qwen3:1.7b

      - name: Verify two-tier LLM routing
        run: |
          _abort() {
            echo "CI: abort signal received — terminating LLM test children"
            children=$(ps -o pid= --ppid $$ 2>/dev/null || true)
            for child in $children; do kill "$child" 2>/dev/null || true; done
            kill -- -$$ 2>/dev/null || true
          }
          trap _abort SIGTERM SIGINT
          python -c "
          from tools.llm.router import LLMRouter, LLMRequest
          r = LLMRouter()
          tt = r._config.get('two_tier', {})
          print('Two-tier enabled:', tt.get('enabled', False))
          print('Tier 1 (scanner):', tt.get('tier1_model', 'not set'))
          print('Tier 2 (planner):', tt.get('tier2_model', 'not set'))
          try:
              resp = r.invoke('compliance_export', LLMRequest(
                  messages=[{'role': 'user', 'content': 'Summarize NIST SA-11 in one sentence.'}],
                  max_tokens=100,
              ))
              print('Scanner response:', resp.content[:80] if resp.content else 'empty')
              print('Model:', resp.model)
              print('SCANNER-TIER: PASS')
          except Exception as e:
              print(f'Scanner-tier: SKIP ({e})')
          "
        continue-on-error: true

      - name: QDC engine self-test
        run: |
          trap 'children=$(ps -o pid= --ppid $$ 2>/dev/null || true); for child in $children; do kill "$child" 2>/dev/null || true; done; kill -- -$$ 2>/dev/null || true' SIGTERM SIGINT
          python tools/qdc_canvas/qdc_engine.py
        continue-on-error: true

  # ── Tier 2: E2E Playwright Tests ─────────────────────────────────────────
  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    needs: [test]
    timeout-minutes: 30
    env:
      ICDEV_STORAGE_BACKEND: postgresql
      ICDEV_PG_HOST: localhost
      ICDEV_PG_PORT: "5432"
      ICDEV_PG_USER: icdev
      ICDEV_PG_PASSWORD: icdev_ci
      ICDEV_PG_DATABASE: icdev
      ICDEV_NO_SERVER: "1"
      ICDEV_AAC_ENABLED: "true"
      ICDEV_AIIFY_ENABLED: "true"
      ICDEV_INNOVATION_ENABLED: "true"
      ICDEV_GOVCON_ENABLED: "true"
      ICDEV_MIGRATION_CANVAS_ENABLED: "true"
      ICDEV_AUTH_BYPASS: "true"
      ICDEV_MISSION_CANVAS_ENABLED: "true"
      ICDEV_OPS_HUB_ENABLED: "true"
      ICDEV_AIML_CANVAS_ENABLED: "true"
      ICDEV_AISG_ENABLED: "true"
      ICDEV_ACE_ENABLED: "true"
      # Network canvas disabled in E2E until PGP migration resolves shared-DB
      # table collisions (simulation_results/topologies schema mismatch).
      ICDEV_NDC_ENABLED: "false"
      ICDEV_NETWORK_ENABLED: "false"
      # Force canvas-specific DBs to SQLite — their tables (security_designs,
      # migration_designs, aiml_designs) are not in the consolidated PG schema
      # yet; using SQLite lets init_db() create them fresh so routes return 200.
      SC_STORAGE_BACKEND: sqlite
      MC_STORAGE_BACKEND: sqlite
      AIMC_STORAGE_BACKEND: sqlite
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Python dependencies
        run: pip install -r requirements.txt
      - name: Install Node dependencies
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps
      - name: Start PostgreSQL container
        run: |
          set -e
          for attempt in $(seq 1 5); do
            if docker pull pgvector/pgvector:pg16; then
              echo "Docker pull succeeded on attempt $attempt"
              break
            fi
            echo "::warning::docker pull pgvector/pgvector:pg16 failed (attempt $attempt/5); retrying in $((attempt * 10))s"
            sleep $((attempt * 10))
          done
          docker run -d --name pg-e2e \
            -e POSTGRES_USER=icdev \
            -e POSTGRES_PASSWORD=icdev_ci \
            -e POSTGRES_DB=icdev \
            -p 5432:5432 \
            pgvector/pgvector:pg16
          for i in $(seq 1 30); do
            if docker exec pg-e2e pg_isready -U icdev; then
              echo "PostgreSQL is ready"
              break
            fi
            sleep 1
          done
      - name: Initialize database (consolidated PG schema snapshot)
        # The 212-migration chain is not cleanly replayable on a fresh PG DB;
        # load the authoritative consolidated schema and mark migrations applied.
        # Regenerate the snapshot with: docker exec ... pg_dump --schema-only ...
        run: python tools/db/bootstrap_pg.py
      - name: Ensure genesis_phase_log unique constraint (design_id, phase)
        # Idempotent guard: pg_consolidated.sql already creates the inline UNIQUE
        # constraint; this step makes the intent explicit and protects against
        # partial schema loads or future snapshot gaps.
        env:
          PGPASSWORD: icdev_ci
        run: |
          psql -h localhost -U icdev -d icdev -c "
            DO \$\$
            BEGIN
              IF NOT EXISTS (
                SELECT 1 FROM pg_constraint
                WHERE conname = 'genesis_phase_log_design_id_phase_key'
              ) THEN
                ALTER TABLE genesis_phase_log
                  ADD CONSTRAINT genesis_phase_log_design_id_phase_key
                  UNIQUE (design_id, phase);
                RAISE NOTICE 'genesis_phase_log unique constraint created';
              ELSE
                RAISE NOTICE 'genesis_phase_log unique constraint already present';
              END IF;
            END \$\$;
          "
      - name: Ensure fedramp_ato_packages PRIMARY KEY (unique) constraint
        # Idempotent guard: pg_consolidated.sql adds the PK via ALTER TABLE after
        # CREATE TABLE; this step protects against partial schema loads or future
        # snapshot gaps that would cause fedramp_controls FK validation to fail.
        env:
          PGPASSWORD: icdev_ci
        run: |
          psql -h localhost -U icdev -d icdev -c "
            DO \$\$
            BEGIN
              IF NOT EXISTS (
                SELECT 1 FROM pg_constraint
                WHERE conname = 'fedramp_ato_packages_pkey'
                  AND conrelid = 'fedramp_ato_packages'::regclass
              ) THEN
                ALTER TABLE fedramp_ato_packages
                  ADD CONSTRAINT fedramp_ato_packages_pkey PRIMARY KEY (id);
                RAISE NOTICE 'fedramp_ato_packages unique constraint created';
              ELSE
                RAISE NOTICE 'fedramp_ato_packages unique constraint already present';
              END IF;
            END \$\$;
          "
      - name: Start dashboard server
        run: |
          python tools/dashboard/app.py &
          echo $! > /tmp/dashboard.pid
          for i in $(seq 1 30); do
            curl -sf http://localhost:5050/ && break || sleep 1
          done
      - name: Verify ai-wizard and ai-patterns routes (non-blocking)
        # These AISG-canvas routes must not stop the pipeline if they fail;
        # emit a warning annotation but always exit 0 so subsequent steps run.
        run: |
          for route in /ai-wizard /ai-patterns; do
            status=$(curl -s -o /dev/null -w "%{http_code}" "http://localhost:5050${route}")
            if [ "$status" -lt 400 ]; then
              echo "::notice::${route} OK (HTTP ${status})"
            else
              echo "::warning::${route} returned HTTP ${status} — check ICDEV_AISG_ENABLED"
            fi
          done
        continue-on-error: true
      - name: Run Playwright E2E tests
        run: |
          _abort() {
            echo "CI: abort signal received during E2E — terminating Playwright children"
            children=$(ps -o pid= --ppid $$ 2>/dev/null || true)
            for child in $children; do kill "$child" 2>/dev/null || true; done
            kill -- -$$ 2>/dev/null || true
          }
          trap _abort SIGTERM SIGINT
          npx playwright test
      - name: Stop dashboard server
        if: always()
        run: |
          if [ -f /tmp/dashboard.pid ]; then
            PID=$(cat /tmp/dashboard.pid)
            kill "$PID" 2>/dev/null || true
            sleep 1
            kill -0 "$PID" 2>/dev/null && kill -9 "$PID" 2>/dev/null || true
          fi
          # Best-effort PG backend cleanup for any idle-in-transaction leaks
          # spawned by the dashboard or test runners
          python -c "
          import os, sys
          sys.path.insert(0, '.')
          try:
              from tools.db.storage import get_connection
              conn = get_connection()
              cur = conn.cursor()
              cur.execute(\"\"\"
                  SELECT pg_terminate_backend(pid)
                  FROM pg_stat_activity
                  WHERE datname = current_database()
                    AND state = 'idle in transaction'
                    AND backend_start < NOW() - INTERVAL '2 minutes'
              \"\"\")
              conn.commit()
              cur.close()
              conn.close()
              print('PG idle-in-transaction cleanup: done')
          except Exception as e:
              print(f'PG cleanup skipped: {e}')
          " 2>/dev/null || true
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: .tmp/test_runs/playwright-report/
          retention-days: 30
      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            .tmp/test_runs/playwright-results.json
            .tmp/test_runs/playwright-artifacts/
          retention-days: 30

  # ── Tier 3: Docker Build (main branch only) ─────────────────────────────
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f docker/Dockerfile.agent-base -t icdev/agent-base:test .
      - run: docker build -f docker/Dockerfile.dashboard -t icdev/dashboard:test .

  # ── Tier 1: Documentation Coherence Gate ─────────────────────────────────
  # Validates that docs/reference/commands.md contains the required parameter
  # strings for loop_type and adversarial_enabled (Loop Engineering section).
  doc-coherence:
    name: Doc Coherence Gate
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - name: Assert loop_type present in commands.md
        run: |
          grep -q 'loop_type' docs/reference/commands.md || \
            (echo "::error::docs/reference/commands.md is missing 'loop_type'" && exit 1)
      - name: Assert adversarial_enabled present in commands.md
        run: |
          grep -q 'adversarial_enabled' docs/reference/commands.md || \
            (echo "::error::docs/reference/commands.md is missing 'adversarial_enabled'" && exit 1)

  # ── Tier 3: Helm Chart Validation ────────────────────────────────────────
  helm-lint:
    name: Helm Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - run: helm lint deploy/helm/
      - run: helm template icdev deploy/helm/ > /dev/null
