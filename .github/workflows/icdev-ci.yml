# [TEMPLATE: CUI // SP-CTI]
name: ICDEV CI

on:
  push:
    branches: [master, main, "feature-*"]
  pull_request:
    branches: [master, main]

env:
  PYTHONPATH: "."
  ICDEV_CUI_BANNER_ENABLED: "true"

jobs:
  # ── Tier 0: Lint (changed files only — avoids pre-existing debt) ─────────
  lint:
    name: Lint (changed files)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff
      - name: Lint changed Python files only
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="HEAD~1"
          fi
          CHANGED=$(git diff --name-only "$BASE"...HEAD -- '*.py' 2>/dev/null || echo "")
          if [ -z "$CHANGED" ]; then
            echo "No changed Python files — lint passed"
            exit 0
          fi
          echo "Linting $(echo "$CHANGED" | wc -l) changed files..."
          echo "$CHANGED" | xargs ruff check --select E,F,W

  # ── Tier 1: Unit Tests (pure Python — no LLM) ───────────────────────────
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      matrix:
        python-version: ["3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run unit tests
        run: |
          pytest tests/ -v --tb=short \
            --ignore=tests/e2e \
            --ignore=tests/genesis_auto \
            --ignore=tests/test_marketplace_publish.py \
            --ignore=tests/test_marketplace_search.py \
            --ignore=tests/test_swagger_ui.py \
            --ignore=tests/test_openapi_spec.py \
            --ignore=tests/test_platform_db.py \
            --ignore=tests/test_metrics.py \
            -x

  # ── Tier 1: Security Scan (pure Python — no LLM) ────────────────────────
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install bandit pip-audit
      - name: SAST (bandit) — 0 high/critical required
        run: bandit -r tools/ -q --severity-level high
      - name: Dependency audit
        run: pip install -r requirements.txt && pip-audit --skip-editable -q
        continue-on-error: true

  # ── Tier 2: Two-Tier LLM Build (Ollama qwen3.5 + Claude review) ─────────
  two-tier-build:
    name: Two-Tier LLM Build
    runs-on: ubuntu-latest
    needs: [test, security]
    if: github.event_name == 'pull_request'
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OLLAMA_BASE_URL: "http://localhost:11434"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt

      # ── Install Ollama + pull qwen3.5 (scanner-tier model) ──
      - name: Install Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          ollama serve &
          sleep 5
          echo "Ollama server started"

      - name: Pull qwen3.5 (scanner-tier model)
        run: |
          ollama pull qwen3:1.7b
          echo "qwen3:1.7b ready (scanner-tier)"

      # ── Verify two-tier routing ──
      - name: Verify LLM router two-tier config
        run: |
          python -c "
          from tools.llm.router import LLMRouter
          r = LLMRouter()
          print('Two-tier enabled:', r._config.get('two_tier', {}).get('enabled', False))
          print('Tier 1 model:', r._config.get('two_tier', {}).get('tier1_model', 'not set'))
          print('Tier 2 model:', r._config.get('two_tier', {}).get('tier2_model', 'not set'))

          # Test scanner-tier invocation (qwen3 only, zero Claude tokens)
          from tools.llm.router import LLMRequest
          try:
              resp = r.invoke('compliance_export', LLMRequest(
                  messages=[{'role': 'user', 'content': 'Summarize SA-11 in one sentence.'}],
                  max_tokens=100,
              ))
              print('Scanner-tier response:', resp.content[:80] if resp.content else 'empty')
              print('Provider used:', resp.model)
              print('TWO-TIER TEST: PASS')
          except Exception as e:
              print(f'Scanner-tier test failed (expected if no Ollama model): {e}')
              print('TWO-TIER TEST: SKIP (Ollama model not available)')
          "

      # ── Run coherence checker (scanner-tier, zero Claude tokens) ──
      - name: Coherence check (scanner-tier)
        run: |
          python tools/workflow/coherence_checker.py --all --json 2>/dev/null || echo '{"status": "skipped"}'
        continue-on-error: true

      # ── Run QDC engine self-test (pure Python) ──
      - name: QDC engine self-test
        run: python tools/qdc_canvas/qdc_engine.py
        continue-on-error: true

  # ── Tier 3: Docker Build Validation ──────────────────────────────────────
  docker-build:
    name: Docker Build Validation
    runs-on: ubuntu-latest
    needs: [test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Build agent-base
        run: docker build -f docker/Dockerfile.agent-base -t icdev/agent-base:test .
      - name: Build dashboard
        run: docker build -f docker/Dockerfile.dashboard -t icdev/dashboard:test .

  # ── Tier 3: Helm Chart Validation ────────────────────────────────────────
  helm-lint:
    name: Helm Chart Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Helm
        uses: azure/setup-helm@v4
      - name: Lint chart
        run: helm lint deploy/helm/
      - name: Template validation
        run: helm template icdev deploy/helm/ > /dev/null
