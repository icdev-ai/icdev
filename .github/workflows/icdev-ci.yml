# [TEMPLATE: CUI // SP-CTI]
name: ICDEV CI

on:
  push:
    branches: [master, main, "feature-*"]
  pull_request:
    branches: [master, main]

env:
  PYTHONPATH: "."
  ICDEV_CUI_BANNER_ENABLED: "true"

jobs:
  # ── Tier 0: Lint (full codebase — ruff.toml enforces line-length=120) ────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff
      - name: Ruff lint
        run: ruff check tools/ tests/ --select E,F,W --ignore E402,E501,E701,E702,E721,E722,E731,E741,F404

  # ── Tier 1: Unit Tests (pure Python — no LLM) ───────────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -e . 2>/dev/null || true
      - name: Run core unit tests
        run: |
          pytest tests/test_circuit_breaker.py \
            tests/test_retry.py \
            tests/test_correlation.py \
            tests/test_errors.py \
            tests/test_init_icdev_db.py \
            tests/test_schemas.py \
            tests/test_prompt_injection_detector.py \
            tests/test_dev_profile_manager.py \
            tests/test_manifest_loader.py \
            tests/test_session_context_builder.py \
            tests/test_code_analyzer.py \
            tests/test_pgp_tx02_json_portability.py \
            -v --tb=short -x

  # ── Tier 1: Security Scan (pure Python — no LLM) ────────────────────────
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install bandit pip-audit
      - name: SAST (bandit) — 0 high+high findings
        run: bandit -r tools/ -q --severity-level high --confidence-level high
      - name: Dependency audit
        run: pip install -r requirements.txt && pip-audit --skip-editable -q
        continue-on-error: true

  # ── Tier 1: Coherence Gate (blocking — new page completeness + structural) ─
  coherence:
    name: Coherence Gate
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -e . 2>/dev/null || true
      - name: New-page completeness gate
        run: |
          python tools/workflow/coherence_checker.py --check new_page_completeness --gate --json
      - name: Full coherence gate
        run: |
          python tools/workflow/coherence_checker.py --all --gate --json || true

  # ── Tier 1: SIPA Integrity Gate (PR-only, blocking) ─────────────────────
  # Assesses ONLY the *.py files changed on the PR branch (git diff vs the base)
  # for unauthorized / malicious code. Static-only — the changed code is never
  # executed. Honors ICDEV_INTEGRITY_ENABLED (set true here so the gate is
  # active); exits non-zero on a QUARANTINE verdict and blocks the merge.
  sipa-gate:
    name: SIPA Integrity Gate
    runs-on: ubuntu-latest
    needs: lint
    if: github.event_name == 'pull_request'
    env:
      ICDEV_STORAGE_BACKEND: sqlite
      ICDEV_INTEGRITY_ENABLED: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the merge-base with the base branch resolves for the
          # `git diff <base>...HEAD` the gate runs.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -e . 2>/dev/null || true
      - name: Initialize database (SIPA assessment tables)
        run: python tools/db/init_icdev_db.py
      - name: SIPA PR diff gate
        # ${{ github.base_ref }} is the PR's target branch (e.g. main); diff the
        # branch against its remote tracking ref. Blocking — exit 1 quarantines.
        run: |
          python tools/integrity/pr_gates.py \
            --base "origin/${{ github.base_ref }}" \
            --gate --json

  # ── Tier 2: Two-Tier LLM Build (Ollama + Claude review) ─────────────────
  two-tier-build:
    name: Two-Tier LLM Build
    runs-on: ubuntu-latest
    needs: [test, security]
    if: github.event_name == 'pull_request'
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OLLAMA_BASE_URL: "http://localhost:11434"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          ollama serve &
          sleep 5

      - name: Pull qwen3:1.7b (scanner-tier)
        run: ollama pull qwen3:1.7b

      - name: Verify two-tier LLM routing
        run: |
          python -c "
          from tools.llm.router import LLMRouter, LLMRequest
          r = LLMRouter()
          tt = r._config.get('two_tier', {})
          print('Two-tier enabled:', tt.get('enabled', False))
          print('Tier 1 (scanner):', tt.get('tier1_model', 'not set'))
          print('Tier 2 (planner):', tt.get('tier2_model', 'not set'))
          try:
              resp = r.invoke('compliance_export', LLMRequest(
                  messages=[{'role': 'user', 'content': 'Summarize NIST SA-11 in one sentence.'}],
                  max_tokens=100,
              ))
              print('Scanner response:', resp.content[:80] if resp.content else 'empty')
              print('Model:', resp.model)
              print('SCANNER-TIER: PASS')
          except Exception as e:
              print(f'Scanner-tier: SKIP ({e})')
          "
        continue-on-error: true

      - name: QDC engine self-test
        run: python tools/qdc_canvas/qdc_engine.py
        continue-on-error: true

  # ── Tier 2: E2E Playwright Tests ─────────────────────────────────────────
  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    needs: [test]
    timeout-minutes: 30
    services:
      postgres:
        # pgvector image matches production; the consolidated schema needs the
        # `vector` extension (CREATE EXTENSION vector in pg_consolidated.sql).
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: icdev
          POSTGRES_PASSWORD: icdev_ci
          POSTGRES_DB: icdev
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      ICDEV_STORAGE_BACKEND: postgresql
      ICDEV_PG_HOST: localhost
      ICDEV_PG_PORT: "5432"
      ICDEV_PG_USER: icdev
      ICDEV_PG_PASSWORD: icdev_ci
      ICDEV_PG_DATABASE: icdev
      ICDEV_NO_SERVER: "1"
      ICDEV_AAC_ENABLED: "true"
      ICDEV_AIIFY_ENABLED: "true"
      ICDEV_INNOVATION_ENABLED: "true"
      ICDEV_GOVCON_ENABLED: "true"
      ICDEV_MIGRATION_CANVAS_ENABLED: "true"
      ICDEV_AUTH_BYPASS: "true"
      ICDEV_MISSION_CANVAS_ENABLED: "true"
      ICDEV_OPS_HUB_ENABLED: "true"
      ICDEV_AIML_CANVAS_ENABLED: "true"
      ICDEV_NDC_ENABLED: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Python dependencies
        run: pip install -r requirements.txt
      - name: Install Node dependencies
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps
      - name: Initialize database (consolidated PG schema snapshot)
        # The 212-migration chain is not cleanly replayable on a fresh PG DB;
        # load the authoritative consolidated schema and mark migrations applied.
        # Regenerate the snapshot with: docker exec ... pg_dump --schema-only ...
        run: python tools/db/bootstrap_pg.py
      - name: Start dashboard server
        run: |
          python tools/dashboard/app.py &
          echo $! > /tmp/dashboard.pid
          for i in $(seq 1 30); do
            curl -sf http://localhost:5050/ && break || sleep 1
          done
      - name: Run Playwright E2E tests
        run: npx playwright test
      - name: Stop dashboard server
        if: always()
        run: kill $(cat /tmp/dashboard.pid) 2>/dev/null || true
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: .tmp/test_runs/playwright-report/
          retention-days: 30
      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            .tmp/test_runs/playwright-results.json
            .tmp/test_runs/playwright-artifacts/
          retention-days: 30

  # ── Tier 3: Docker Build (main branch only) ─────────────────────────────
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      # Pre-pull the shared base image with retries. Docker Hub `Head` requests to
      # registry-1.docker.io intermittently i/o-timeout on GitHub runners; pulling
      # once up-front (with backoff) warms the local cache so both builds below hit
      # it instead of the registry, and a transient blip retries cheaply.
      - name: Pre-pull base image (retry on registry timeout)
        run: |
          for attempt in 1 2 3 4 5; do
            docker pull python:3.12-slim && exit 0
            echo "::warning::docker pull python:3.12-slim failed (attempt $attempt/5); retrying in $((attempt * 10))s"
            sleep $((attempt * 10))
          done
          echo "::error::docker pull python:3.12-slim failed after 5 attempts"
          exit 1
      - name: Build agent-base image (retry on registry timeout)
        run: |
          for attempt in 1 2 3; do
            docker build -f docker/Dockerfile.agent-base -t icdev/agent-base:test . && exit 0
            echo "::warning::agent-base build failed (attempt $attempt/3); retrying in $((attempt * 15))s"
            sleep $((attempt * 15))
          done
          exit 1
      - name: Build dashboard image (retry on registry timeout)
        run: |
          for attempt in 1 2 3; do
            docker build -f docker/Dockerfile.dashboard -t icdev/dashboard:test . && exit 0
            echo "::warning::dashboard build failed (attempt $attempt/3); retrying in $((attempt * 15))s"
            sleep $((attempt * 15))
          done
          exit 1

  # ── Tier 3: Helm Chart Validation ────────────────────────────────────────
  helm-lint:
    name: Helm Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - run: helm lint deploy/helm/
      - run: helm template icdev deploy/helm/ > /dev/null
