<!DOCTYPE html>
<!-- CUI // SP-CTI -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Edit · {{ deck.title }} — ICDEV™</title>
<style>
  :root {
    --bg: {{ colors.bg }}; --accent: {{ colors.accent }}; --text: {{ colors.text }};
    --subtext: {{ colors.subtext }}; --dark: {{ colors.dark }};
    --bg-card: {{ colors.dark }}; --border-color: {{ colors.dark }};
    --text-muted: {{ colors.subtext }}; --text-secondary: {{ colors.subtext }};
    --accent-blue: {{ colors.accent }}; --accent-blue-light: {{ colors.accent }};
    --status-green: {{ colors.series[2] if colors.series else '#2ECC71' }};
    --status-red: {{ colors.series[6] if colors.series else '#E74C3C' }};
    --status-yellow: {{ colors.accent }};
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #0d1320; color: var(--text);
    font-family: "Segoe UI", Roboto, Arial, sans-serif; overflow: hidden; }
  .cui { position: fixed; top: 0; left: 0; right: 0; text-align: center; font-size: 11px;
    font-weight: 700; background: #c8960c; color: #000; padding: 2px 0; z-index: 100; }
  /* toolbar */
  #toolbar { position: fixed; top: 22px; left: 0; right: 0; height: 46px; display: flex; align-items: center;
    gap: 6px; padding: 0 12px; background: #11192a; border-bottom: 1px solid var(--dark); z-index: 90; }
  #toolbar .grp { display: flex; gap: 4px; align-items: center; padding-right: 8px; margin-right: 4px;
    border-right: 1px solid var(--dark); }
  #toolbar button, #toolbar a { background: #1b2740; color: var(--text); border: 1px solid #2a3a5c;
    border-radius: 6px; padding: 6px 11px; font-size: 13px; cursor: pointer; text-decoration: none; }
  #toolbar button:hover { background: #25365a; }
  #toolbar .title { color: var(--accent); font-weight: 700; margin-right: auto; font-size: 14px; }
  #toolbar .save { background: var(--accent); color: #0d1320; border-color: var(--accent); font-weight: 700; }
  #toolbar .dirty { color: #ffce54; font-size: 12px; margin-left: 6px; }
  /* layout */
  #strip { position: fixed; top: 68px; left: 0; bottom: 0; width: 150px; background: #0f1626;
    border-right: 1px solid var(--dark); overflow-y: auto; padding: 10px 8px; z-index: 20; }
  .thumb { position: relative; border: 2px solid transparent; border-radius: 6px; padding: 8px 8px; margin-bottom: 8px;
    cursor: pointer; background: #141d30; font-size: 12px; color: var(--subtext); display: flex; align-items: center; gap: 6px; }
  .thumb.active { border-color: var(--accent); color: var(--text); }
  .thumb.drop { border-color: #6db3f8; }
  .thumb .tn { color: var(--accent); font-weight: 700; min-width: 16px; }
  .thumb .tl { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
  .thumb-actions { display: none; gap: 2px; }
  .thumb:hover .thumb-actions, .thumb.active .thumb-actions { display: flex; }
  .thumb-actions button { background: #25365a; color: var(--subtext); border: 0; border-radius: 4px;
    width: 20px; height: 20px; cursor: pointer; font-size: 11px; line-height: 1; padding: 0; }
  .thumb-actions button:hover { background: var(--accent); color: #0d1320; }
  .strip-add { width: 100%; background: #1b2740; color: var(--text); border: 1px dashed #2a3a5c;
    border-radius: 6px; padding: 8px; cursor: pointer; font-size: 12px; margin-top: 4px; }
  .strip-add:hover { background: #25365a; }
  #props textarea { background: #141d30; color: var(--text); border: 1px solid #2a3a5c; border-radius: 5px;
    padding: 6px 8px; font-size: 13px; font-family: inherit; resize: vertical; }
  #stagewrap { position: fixed; top: 68px; left: 150px; right: 300px; bottom: 0; display: flex;
    align-items: center; justify-content: center; overflow: auto; background: #0a0f1a; }
  #surface { position: relative; background: var(--bg); box-shadow: 0 8px 40px rgba(0,0,0,.5);
    overflow: hidden; }
  .el { position: absolute; cursor: move; outline: 1px dashed transparent; }
  .el:hover { outline-color: rgba(200,169,81,.4); }
  .el.sel { outline: 1.5px solid var(--accent); }
  .el .handle { position: absolute; width: 12px; height: 12px; background: var(--accent); border-radius: 50%;
    border: 2px solid #0d1320; display: none; z-index: 5; }
  .el.sel .handle { display: block; }
  .h-nw { left: -6px; top: -6px; cursor: nwse-resize; } .h-ne { right: -6px; top: -6px; cursor: nesw-resize; }
  .h-sw { left: -6px; bottom: -6px; cursor: nesw-resize; } .h-se { right: -6px; bottom: -6px; cursor: nwse-resize; }
  .el .body { width: 100%; height: 100%; overflow: hidden; }
  .el .body table { width: 100%; border-collapse: collapse; font-size: 13px; color: var(--text); }
  .el .body th { background: var(--accent); color: var(--bg); padding: 4px 8px; }
  .el .body td { padding: 4px 8px; border-bottom: 1px solid var(--dark); }
  .el .body svg { width: 100%; height: 100%; }
  .el .body img { width: 100%; height: 100%; object-fit: contain; }
  .txt[contenteditable] { outline: none; white-space: pre-wrap; word-break: break-word; }
  /* properties */
  #props { position: fixed; top: 68px; right: 0; bottom: 0; width: 300px; background: #0f1626;
    border-left: 1px solid var(--dark); overflow-y: auto; padding: 14px; z-index: 20; font-size: 13px; }
  #props h4 { color: var(--accent); margin: 0 0 10px; font-size: 13px; letter-spacing: .04em; }
  #props .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 9px; }
  #props label { color: var(--subtext); }
  #props input[type=number], #props select, #props input[type=text] { background: #141d30; color: var(--text);
    border: 1px solid #2a3a5c; border-radius: 5px; padding: 5px 7px; width: 130px; }
  #props input[type=color] { width: 40px; height: 28px; padding: 0; border: 1px solid #2a3a5c; border-radius: 5px; background: none; }
  #props .seg button { background: #1b2740; color: var(--text); border: 1px solid #2a3a5c; padding: 5px 9px; cursor: pointer; }
  #props .seg button.on { background: var(--accent); color: #0d1320; }
  #props .empty { color: var(--subtext); }
  .hint { color: var(--subtext); font-size: 11px; margin-top: 10px; }
  input[type=file] { display: none; }
</style>
</head>
<body>
<div class="cui">CUI // SP-CTI</div>
<div id="toolbar">
  <span class="title" id="deck-title">{{ deck.title }}</span>
  <div class="grp">
    <button id="add-text">+ Text</button>
    <button id="add-image">+ Image</button>
    <button id="add-canvas" title="Add a design/chart from a canvas">+ From Canvas</button>
  </div>
  <div class="grp">
    <button id="layer-up" title="Bring forward">⤒</button>
    <button id="layer-down" title="Send back">⤓</button>
    <button id="delete-el" title="Delete">🗑</button>
  </div>
  <button class="save" id="save">Save</button>
  <a href="/slides/{{ deck.deck_id }}/present" target="_blank">▶ Present</a>
  <a href="/slides/{{ deck.deck_id }}">Exit</a>
  <span class="dirty" id="dirty"></span>
  <input type="file" id="file-input" accept="image/png,image/jpeg,image/gif,image/webp">
</div>
<div id="strip"></div>
<div id="stagewrap"><div id="surface"></div></div>
<div id="props"><div class="empty">Select an element to edit its properties, or use the toolbar to add one.</div></div>

<script>window.__DECK = {{ deck_json | safe }}; window.__DECK_ID = {{ deck.deck_id }};</script>
<script src="/static/js/charts.js"></script>
<script src="/static/js/viz_editor.js"></script>
</body>
</html>
