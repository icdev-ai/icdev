<aside id="ai-brief-container" class="mb-3" style="display:none;">
  <div id="ai-brief-inner"></div>
</aside>
<script>
(function () {
  // cvx-nav-01: consume the same registry-derived map injected by base.html
  // (window.__ICDEV_PATH_CANVAS__ = [[regex_source, canvas_key], ...]) instead
  // of a second divergent hardcoded copy. First match wins, order-authoritative.
  var PATH_CANVAS = window.__ICDEV_PATH_CANVAS__ || [];
  var path = window.location.pathname;
  var canvas = null;
  for (var i = 0; i < PATH_CANVAS.length; i++) {
    try {
      if (new RegExp(PATH_CANVAS[i][0]).test(path)) {
        canvas = PATH_CANVAS[i][1];
        break;
      }
    } catch (e) { /* skip malformed pattern */ }
  }
  if (!canvas) return;
  fetch('/api/ai-brief/' + canvas)
    .then(function(r){ return r.ok ? r.json() : null; })
    .then(function(data){
      if (!data || !data.html) return;
      var el = document.getElementById('ai-brief-inner');
      var wrap = document.getElementById('ai-brief-container');
      if (el) el.innerHTML = data.html;
      if (wrap) wrap.style.display = '';
    })
    .catch(function(){});
})();
</script>
