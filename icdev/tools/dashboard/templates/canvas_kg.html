<!-- CUI // SP-CTI — Canvas Knowledge Graph -->
{% extends "base.html" %}
{% block title %}Canvas Knowledge Graph — ICDEV™{% endblock %}
{% block content %}
<style>
  .ckg-hero { padding: 24px 30px 8px; }
  .ckg-hero h1 { font-size: 22px; margin: 0 0 4px; color: #eaeaea; }
  .ckg-hero p  { color: #7a8cb0; font-size: 13px; margin: 0 0 20px; }

  .ckg-panel {
    margin: 0 30px 24px;
    background: #16213e;
    border: 1px solid #1e3a6e;
    border-radius: 8px;
    padding: 20px;
  }
  .ckg-panel h2 { font-size: 15px; color: #eaeaea; margin: 0 0 12px; }

  .ckg-query-row { display: flex; gap: 10px; margin-bottom: 16px; }
  .ckg-query-row input {
    flex: 1;
    padding: 8px 12px;
    background: #0d1b36;
    border: 1px solid #2a4a8a;
    border-radius: 6px;
    color: #eaeaea;
    font-size: 13px;
  }
  .ckg-query-row button {
    padding: 8px 18px;
    background: #2563eb;
    border: none;
    border-radius: 6px;
    color: #fff;
    font-size: 13px;
    cursor: pointer;
  }
  .ckg-query-row button:hover { background: #1d4ed8; }

  #ckg-result {
    font-size: 12px;
    font-family: monospace;
    color: #9db0cc;
    white-space: pre-wrap;
    max-height: 400px;
    overflow-y: auto;
    background: #0d1b36;
    border: 1px solid #1e3a6e;
    border-radius: 6px;
    padding: 12px;
    display: none;
  }
  .ckg-status { font-size: 12px; color: #7a8cb0; margin-top: 8px; }
</style>

<div class="ckg-hero">
  <h1>Canvas Knowledge Graph</h1>
  <p>Cross-canvas entity relationships — query nodes and edges across all design canvases.</p>
</div>

<div class="ckg-panel">
  <h2>Query</h2>
  <div class="ckg-query-row">
    <input id="ckg-input" type="text" placeholder='e.g. {"entity_type": "component", "limit": 20}' value="{}">
    <button onclick="ckgQuery()">Run Query</button>
  </div>
  <pre id="ckg-result"></pre>
  <div class="ckg-status" id="ckg-status"></div>
</div>

<script>
function ckgQuery() {
  const raw = document.getElementById('ckg-input').value.trim() || '{}';
  let payload;
  try { payload = JSON.parse(raw); } catch (e) {
    document.getElementById('ckg-status').textContent = 'Invalid JSON: ' + e.message;
    return;
  }
  document.getElementById('ckg-status').textContent = 'Running…';
  fetch('/api/canvas-kg/query', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(payload)
  })
  .then(r => r.json())
  .then(data => {
    const el = document.getElementById('ckg-result');
    el.textContent = JSON.stringify(data, null, 2);
    el.style.display = 'block';
    const n = (data.nodes || []).length;
    const e = (data.edges || []).length;
    document.getElementById('ckg-status').textContent = n + ' nodes, ' + e + ' edges returned.';
  })
  .catch(err => {
    document.getElementById('ckg-status').textContent = 'Error: ' + err;
  });
}
</script>
{% endblock %}
