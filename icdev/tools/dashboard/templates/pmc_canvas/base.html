{% extends "base.html" %}
{% block extra_head %}
<style>
.pmc-badge { display:inline-block; padding:2px 8px; border-radius:4px; font-size:11px; font-weight:600; }
.badge-open { background:#dcfce7; color:#166534; }
.badge-selective { background:#fef9c3; color:#854d0e; }
.badge-no { background:#fee2e2; color:#991b1b; }
.badge-active { background:#dcfce7; color:#166534; }
.badge-evaluation { background:#e0f2fe; color:#075985; }
.badge-requested { background:#fef9c3; color:#854d0e; }
.badge-suspended { background:#fee2e2; color:#991b1b; }
.badge-closed { background:#f3f4f6; color:#374151; }
.badge-valid { background:#dcfce7; color:#166534; }
.badge-invalid { background:#fee2e2; color:#991b1b; }
.badge-not-found { background:#fef9c3; color:#854d0e; }
.badge-unknown { background:#f3f4f6; color:#6b7280; }
.pmc-stat-card { background:#1e293b; border:1px solid #334155; border-radius:8px; padding:16px; }
.pmc-stat-value { font-size:2rem; font-weight:700; color:#f8fafc; }
.pmc-stat-label { font-size:0.75rem; color:#94a3b8; text-transform:uppercase; letter-spacing:.05em; }
</style>
{% endblock %}
{% block content %}{% endblock %}
