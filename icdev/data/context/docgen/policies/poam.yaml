# OKB Policy Constraints — Plan of Action and Milestones
constraints:
  - id: cls-marking
    description: "POAM must carry a classification marking"
    pattern: "\\b(CUI|SECRET|UNCLASSIFIED|FOUO)\\b"
    required: true

  - id: has-weakness-description
    description: "POAM must describe the weakness"
    pattern: "(?i)weakness"
    required: true

  - id: has-scheduled-completion
    description: "POAM must include scheduled completion date"
    pattern: "(?i)scheduled\\s+completion|completion\\s+date"
    required: true

  - id: has-responsible-party
    description: "POAM must identify responsible party"
    pattern: "(?i)responsible\\s+party|point\\s+of\\s+contact"
    required: false

  - id: no-placeholder
    description: "No unresolved placeholders"
    pattern: "\\[TBD\\]|\\[TODO\\]|\\[PLACEHOLDER\\]|\\[INSERT"
    required: true
    negate: true
