# CUI // SP-CTI
# context/migration/service_mappings.yaml
# Canonical source-technology → cloud-service mappings.
# Read by cam_engine.py and cam_constants.py — do NOT hardcode in Python.
# Add new source technologies here; no code changes needed.

mappings:
  oracle:
    label: Oracle Database
    category: database
    aws_service: Amazon RDS Aurora PostgreSQL
    aws_service_id: aurora-postgresql
    azure_service: Azure Database for PostgreSQL
    gcp_service: Cloud SQL for PostgreSQL
    strategy_7r: rearchitect
    migration_tools:
      - aws-sct
      - aws-dms
      - pgloader
    ai_opportunities:
      - id: pgvector
        title: "Semantic search with pgvector"
        aws_ai_service: pgvector
        benefit_category: search
        effort_days: 10
      - id: bedrock-nlq
        title: "Natural language queries via Bedrock + text-to-SQL"
        aws_ai_service: bedrock-claude
        benefit_category: nlq
        effort_days: 15

