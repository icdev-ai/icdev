# CUI // SP-CTI
# Fixture events for the `secrets/` rule family (agov-det-07).
#
# A case declares the events and the rules it expects. Only rules named in
# `expect_rules` or `expect_not_rules` are judged, so adding a new rule to the
# pack never breaks an existing case for a reason its author cannot see.
#
# These are SYNTHETIC events. A green `--test` proves the matcher behaves as
# declared; it proves nothing about real sessions and nothing about whether an
# action executed.
cases:
  - name: reading a .env file fires the credential-read rule
    expect_rules:
      - secrets.env_file_read
    events:
      - event_type: file.read
        tool_name: Read
        file_path: /repo/.env

  - name: a checked-in .env template is carved out, as file_access_tiers does
    expect_rules: []
    expect_not_rules:
      - secrets.env_file_read
    events:
      - event_type: file.read
        tool_name: Read
        file_path: /repo/.env.example

  - name: a private key is credential material even without a .env name
    expect_rules:
      - secrets.env_file_read
    events:
      - event_type: file.read
        tool_name: Read
        file_path: /home/agent/.ssh/deploy_key.pem

  - name: an ambient tool credential store is its own rule, not env_file_read
    expect_rules:
      - secrets.credential_store_read
    expect_not_rules:
      - secrets.env_file_read
    events:
      - event_type: file.read
        tool_name: Read
        file_path: /home/agent/.aws/credentials

  - name: copying a .env elsewhere fires on the parsed argv, not a flat string
    expect_rules:
      - secrets.credential_file_copy
    events:
      - event_type: command.exec
        tool_name: Bash
        command: cp .env /tmp/stash

  # The regression this whole epic exists for: a word sitting inside an
  # unrelated argument must NOT satisfy a rule that names a command. The
  # flattened-string form of this is the documented fail-open at
  # args/agent_approval_policy.yaml:107-126.
  - name: the word .env inside an argument of another command does not fire
    expect_rules: []
    expect_not_rules:
      - secrets.credential_file_copy
    events:
      - event_type: command.exec
        tool_name: Bash
        command: git commit -m "document cp .env handling"
