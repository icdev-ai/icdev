domain: harness
description: "Continuous evaluation of autonomous reflex decision quality — calibration, precision/recall, and adaptive gate thresholds"
capabilities:
  - slug: continuous-eval-harness
    name: "Genesis Continuous Evaluation Harness"
    description: "Records every gated reflex decision with its confidence score, pairs it with the outcome that actually occurred, and computes precision, recall, Expected Calibration Error and false-heal rate over the result. Reports whether a stated confidence predicts correctness, per rule rather than per confidence band."
    cli_examples:
      - "python -m tools.genesis.harness.calibration_report --json"
    related_controls: ["SA-11", "SI-4", "AU-6"]
    article_hooks:
      - "A reflex that says it is 95% confident should be right about 95% of the time — the calibration report is what checks, and it reports per rule, because a band's number is one rule's number with a rounding error attached"
      - "Reporting only: the harness never moves a threshold on its own. A gate that retunes itself from a small, biased sample can silently widen"
      - "Unmeasured is reported as unmeasured — a point estimate off three samples is noise wearing a decimal point, so the report withholds it rather than manufacturing certainty"
    frameworks: []
    keywords: ["harness", "calibration", "ECE", "precision", "recall", "reflex quality", "agent quality", "confidence"]
    source_catalog_id: "cap-harness"
