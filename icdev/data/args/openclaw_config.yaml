# CUI // SP-CTI
# OpenClaw Skill Bridge Configuration (Phase 69)
# Zero-trust import/export with 10-gate scanning
# Feature flag: ICDEV_OPENCLAW_ENABLED (disabled by default, air-gap safe)

openclaw:
  enabled: false  # Override with ICDEV_OPENCLAW_ENABLED env var
  quarantine_dir: ".tmp/openclaw_quarantine"
  skillhub_base_url: "https://skillhub.ai"
  # SkillHub API endpoint (Convex backend) — update if deployment changes
  skillhub_api_base: "https://wry-manatee-359.convex.site/api/v1"

  import:
    # No registration or renewal required — free community assets
    require_registration: false
    require_renewal: false
    auto_promote_no_scripts: false
    require_review_for_scripts: true
    # If AST safety analysis passes all checks, allow auto-promote without human review
    # Only applies when all scripts have zero blocked imports/calls/extensions
    require_review_for_safe_scripts: false
    initial_trust_score: 0.30
    trust_decay_on_violation: 0.15
    trust_recovery_per_clean_day: 0.01
    quarantine_max_age_days: 30
    blocked_authors: []
    allowed_authors: []  # If non-empty, whitelist mode
    max_skill_size_mb: 10
    scan_gates:
      - sast_scan
      - secret_detection
      - dependency_audit
      - cui_marking_validation
      - sbom_generation
      - supply_chain_provenance
      - digital_signature
      - prompt_injection_scan
      - behavioral_sandbox
      - code_pattern_scan

  export:
    require_human_approval: true
    strip_cui_markings: true
    strip_internal_metadata: true
    strip_keys:
      - tenant_id
      - impact_level
      - classification
      - compliance_controls
      - _body
      - _main_file
    add_origin_metadata: true

  # CVE-2026-25253 mitigations
  cve_mitigations:
    sanitize_yaml_frontmatter: true
    max_frontmatter_keys: 50
    max_frontmatter_value_length: 10000
    block_yaml_anchors: true
    block_yaml_tags: true

  # Genesis auto-sync reflex — periodically scan SkillHub for new skills
  auto_sync:
    enabled: false  # Enable via genesis_config.yaml reflex
    interval_hours: 24
    search_queries:
      - "code review"
      - "system architecture"
      - "security scanning"
      - "compliance"
      - "testing automation"
      - "deployment"
    max_auto_imports_per_run: 5
    min_stars: 10  # Only import skills with >= N stars
    auto_promote_if_clean: false  # Auto-promote content-only skills that pass all gates
