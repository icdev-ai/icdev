# CUI // SP-CTI
# ICDEV™ analyzer/responder contract (anz-con-01).
#
# WHAT THIS IS
# ------------
# The contract that ICDEV's ~79 analyzer-shaped modules (tools/strategos/,
# tools/security/, tools/supply_chain/, tools/dsoc_canvas/) never had: each
# analyzer declares the observable types it accepts, the taxonomy it emits, its
# rate limit and its sandbox posture — as DATA. Adapted from TheHive Project's
# Cortex (github.com/TheHive-Project/Cortex), whose value is the contract, not
# the 39 analyzers that implement it.
#
# WHAT THIS IS NOT
# ----------------
# Deliberately NOT a base class analyzers must inherit. 79 modules will not all
# be refactored, and a contract that requires rewriting to adopt does not get
# adopted. Declaring an analyzer here changes no analyzer code. The precedent is
# args/component_registry.yaml and args/mirror_parity.yaml: adding an entry
# needs no code change.
#
# HOW TO ADD AN ANALYZER
# ----------------------
#   1. append an entry under `analyzers:` below
#   2. every value in `accepts:` must already exist under `observable_types:`
#   3. run `python tools/analyzers/contract.py --validate`
# There is no step 4. No blueprint edit, no dispatch table, no base class.
#
# WHY THE VOCABULARY IS CLOSED
# ----------------------------
# This repo has already been bitten twice by an open-looking vocabulary that was
# actually closed: `register_citation` raised on an unknown `citation_type`,
# every caller swallowed the raise, and two subsystems (Cortex governance,
# GovChain asset tokenization) wrote ZERO provenance rows for their entire
# existence while the gate reported "warn". See tools/provenance/citation_types.py.
#
# So: an unknown observable type is rejected when this file is LOADED — loudly,
# with the offending analyzer key and the legal values — not silently at
# dispatch time. tools/analyzers/contract.py::load_contract raises
# UnknownObservableType; nothing catches it. The same constant renders the
# CHECK clause for any column that stores an observable type
# (`check_constraint_sql()` / `sqlite_check_clause()`), so the DB and the
# declaration cannot disagree.

version: 1

# ---------------------------------------------------------------------------
# Closed vocabulary: observable types
# ---------------------------------------------------------------------------
# CLOSED SET. An `accepts:` value not listed here fails at load.
# Every entry names the ICDEV module that handles that type today — a type with
# no consumer is dead vocabulary and does not belong here.
observable_types:
  ip:
    description: IPv4 or IPv6 address.
    consumers: [tools/dsoc_canvas/rtbh_manager.py, tools/security_canvas/threat_intel_engine.py]
  cidr:
    description: Network prefix in CIDR notation.
    consumers: [tools/dsoc_canvas/rtbh_manager.py, tools/dsoc_canvas/flowspec_engine.py]
  asn:
    description: Autonomous system number.
    consumers: [tools/dsoc_canvas/bgp_hijack_detector.py]
  bgp_prefix:
    description: BGP-announced prefix with its origin AS.
    consumers: [tools/dsoc_canvas/bgp_hijack_detector.py]
  domain:
    description: DNS domain or fully-qualified hostname used as an indicator.
    consumers: [tools/security_canvas/threat_intel_engine.py]
  url:
    description: Absolute URL.
    consumers: [tools/chat_router/url_analyzer.py, tools/security_canvas/threat_intel_engine.py]
  email:
    description: Email address.
    consumers: [tools/security_canvas/threat_intel_engine.py]
  file_hash:
    description: MD5, SHA-1 or SHA-256 digest of a file.
    consumers: [tools/security_canvas/threat_intel_engine.py]
  file_path:
    description: Path to a file or directory in a checkout.
    consumers: [tools/security/secret_detector.py, tools/security/sast_runner.py]
  repository:
    description: Source repository (URL or local path).
    consumers: [tools/security/secret_detector.py, tools/strategos/gitlab_osint_collector.py]
  container_image:
    description: OCI image reference.
    consumers: [tools/security/container_scanner.py]
  package:
    description: Dependency identified by ecosystem plus name plus version.
    consumers: [tools/security/osv_scanner.py, tools/security/dependency_auditor.py]
  purl:
    description: Package URL (purl) identifier.
    consumers: [tools/compliance/sbom_generator.py]
  cpe:
    description: Common Platform Enumeration identifier.
    consumers: [tools/security/vuln_scanner.py]
  cve:
    description: CVE identifier.
    consumers: [tools/supply_chain/cve_triager.py, tools/supply_chain/cve_passive_watcher.py, tools/strategos/cisa_kev_importer.py]
  advisory:
    # anz-mig-01: the PVM family does not accept a CVE string. It accepts an
    # nc_advisories row id — the platform's own record of a vulnerability, which
    # already carries the CVSS, publication date and asset linkage the scorers
    # read. Declaring `cve` here instead would have been a lie that typechecks.
    description: Identifier (nc_advisories.id) of a vulnerability advisory record held by the platform.
    consumers: [tools/network/vuln_predictor.py, tools/network/vuln_triage_engine.py]
  network:
    description: Identifier of a network under analysis, used to scope NQE device-inventory queries.
    consumers: [tools/network/attack_surface_mapper.py]
  sbom:
    description: An SBOM document (CycloneDX or SPDX).
    consumers: [tools/compliance/sbom_generator.py]
  vendor:
    description: Supplier or company name.
    consumers: [tools/supply_chain/ndaa_889_screener.py, tools/supply_chain/scrm_assessor.py]
  hostname:
    description: Host or endpoint identity inside an assessed boundary.
    consumers: [tools/security/endpoint_security_scanner.py]
  mmsi:
    description: AIS Maritime Mobile Service Identity of a vessel.
    consumers: [tools/strategos/ais_importer.py]
  icao24:
    description: ADS-B 24-bit ICAO aircraft address.
    consumers: [tools/strategos/adsb_importer.py]
  callsign:
    description: Aircraft or unit callsign.
    consumers: [tools/strategos/adsb_importer.py]
  geo_point:
    description: Latitude/longitude point.
    consumers: [tools/strategos/acled_importer.py, tools/strategos/osm_importer.py]
  stix_bundle:
    description: STIX 2.x bundle.
    consumers: [tools/strategos/stix_importer.py]
  text:
    description: Free-text blob to be analyzed (OSINT snippet, chat turn, report body).
    consumers: [tools/strategos/osint_analyzer.py]
  document:
    description: A document artifact (PDF, DOCX, MD) to be analyzed as a whole.
    consumers: [tools/doc_modernization/scanner.py]

# ---------------------------------------------------------------------------
# Closed vocabulary: output taxonomy
# ---------------------------------------------------------------------------
# A report is tagged {namespace, predicate, level, value} — the Cortex shape.
# `level` and `namespace` are closed; `predicates` are the analyzer's own
# vocabulary, declared per analyzer so they stay machine-readable.
taxonomy:
  levels:
    info: Neutral observation. Carries no verdict.
    safe: Observable assessed as benign.
    suspicious: Observable warrants review but is not confirmed malicious.
    malicious: Observable assessed as hostile.
  namespaces:
    ICDEV: Platform-wide analyzers with no narrower home.
    SECURITY: tools/security/ — SAST, secrets, dependency and container scanning.
    SUPPLYCHAIN: tools/supply_chain/ — SCRM, CVE triage, Section 889 screening.
    DSOC: tools/dsoc_canvas/ — DDoS, BGP and network-defence analyzers.
    STRATEGOS: tools/strategos/ — intelligence feeds, importers and OSINT.
    NETWORK: tools/network/ — NDC predictive vulnerability management and attack-surface correlation.

# ---------------------------------------------------------------------------
# Closed vocabulary: sandbox posture
# ---------------------------------------------------------------------------
# Same four decisions as docs/security/sandbox-coverage.md (OPT-58, D-SEC-11),
# so a declaration here and the sandbox-coverage doc use one vocabulary.
# Enforcement lands in anz-rate-01 and reuses the existing sandbox_execute MCP
# tool (Docker, resource limits, network isolation, D-SEC-10) rather than
# inventing a second isolation path.
sandbox_postures:
  sandboxed: Must run inside sandbox_execute. Ingests untrusted content.
  sandboxed_on_demand: Runs in-process by default; sandboxed when input is untrusted.
  trusted_first_party: Reads only first-party data. No sandbox required.
  bypass_documented: Deliberately unsandboxed; rationale recorded in docs/security/sandbox-coverage.md.

# ---------------------------------------------------------------------------
# Defaults applied to any analyzer that does not override them
# ---------------------------------------------------------------------------
# Fail-safe by construction: an analyzer that declares nothing gets the
# strictest posture (sandboxed) and a conservative rate limit.
defaults:
  rate_limit:
    max_calls: 60
    per_seconds: 3600
  sandbox: sandboxed
  timeout_seconds: 120
  enabled: true

# ---------------------------------------------------------------------------
# Declarations
# ---------------------------------------------------------------------------
# `module`/`entrypoint` name the callable that already implements the analysis.
# The contract does not change that callable's signature.
#
# INPUT_BINDING (anz-mig-01)
# --------------------------
# A declaration without `input_binding` says what an analyzer accepts but not
# how to hand it anything — it is described, not wired. `input_binding` closes
# that gap AS DATA, because the alternative is one adapter function per analyzer
# and that is precisely the bespoke wiring this card exists to delete.
#
#   input_binding:
#     observable_param: observed_prefix   # the parameter the observable lands in
#     observable_form: scalar             # scalar (default) | list — `list` wraps
#                                         #   it for batch-shaped callables
#     connection:                         # optional; for callables taking a DB handle
#       param: conn
#       factory: tools.dsoc_canvas.db.init_db:get_connection
#       commit: true                      # only when the analyzer writes
#     context_params: [our_prefix, our_asn]         # caller MUST supply these
#     optional_context_params: [detection_source]   # passed through if supplied
#
# Nothing here changes an analyzer. tools/analyzers/binding.py assembles the
# keyword arguments and returns the callable's result UNTOUCHED — no report
# envelope, no dict coercion, no swallowed exception. That output transparency
# is what makes porting an analyzer a null behavioural change, and
# tools/analyzers/parity.py proves it per call rather than asserting it here.
#
# `python tools/analyzers/binding.py --verify` checks every binding against the
# real signature of its callable: entrypoint resolves, every declared parameter
# exists, every required parameter is bound. A binding that names a parameter
# the callable does not have is caught there, not at dispatch.
#
# NOT EVERY ANALYZER FITS, AND THAT IS THE POINT. A contract everything fits
# after enough special-casing is not a contract. The families surveyed for
# anz-mig-01 and rejected — feed importers, canvas aggregators, daemon watchers
# — are listed with reasons in
# docs/features/anz-mig-01-analyzer-contract-migration.md.
analyzers:
  - key: cve_triage
    kind: analyzer
    display_name: CVE Triage
    description: Scores a CVE against the project dependency graph and computes blast radius.
    module: tools.supply_chain.cve_triager
    entrypoint: triage_cve
    accepts: [cve]
    taxonomy:
      namespace: SUPPLYCHAIN
      predicates: [cve-severity, blast-radius]
      levels: [info, suspicious, malicious]
    sandbox: trusted_first_party
    rate_limit:
      max_calls: 240
      per_seconds: 3600

  - key: section_889_screen
    kind: analyzer
    display_name: NDAA Section 889 Screen
    description: Screens a vendor against Section 889 Part A/B covered-entity lists.
    module: tools.supply_chain.ndaa_889_screener
    entrypoint: screen_item
    accepts: [vendor]
    taxonomy:
      namespace: SUPPLYCHAIN
      predicates: [section-889]
      levels: [safe, suspicious, malicious]
    sandbox: trusted_first_party

  - key: threat_intel_match
    kind: analyzer
    display_name: Threat Intel Match
    description: Matches an observable against ingested threat-intel indicators.
    module: tools.security_canvas.threat_intel_engine
    entrypoint: match_observable
    accepts: [ip, domain, url, email, file_hash]
    taxonomy:
      namespace: SECURITY
      predicates: [ioc-match, feed-confidence]
      levels: [info, safe, suspicious, malicious]
    sandbox: trusted_first_party

  - key: secret_scan
    kind: analyzer
    display_name: Secret Detection
    description: Scans a checkout for committed credentials.
    module: tools.security.secret_detector
    entrypoint: scan
    accepts: [file_path, repository]
    taxonomy:
      namespace: SECURITY
      predicates: [secret-found]
      levels: [safe, suspicious, malicious]
    sandbox: sandboxed_on_demand

  - key: stix_ingest
    kind: analyzer
    display_name: STIX Bundle Ingest
    description: Parses a STIX 2.x bundle into indicators, techniques and relationships.
    module: tools.strategos.stix_importer
    entrypoint: parse_bundle
    accepts: [stix_bundle]
    taxonomy:
      namespace: STRATEGOS
      predicates: [stix-object-count]
      levels: [info]
    sandbox: sandboxed

  - key: rtbh_blackhole
    kind: responder
    display_name: RTBH Blackhole
    description: Triggers remotely-triggered black-hole routing for a hostile source.
    module: tools.dsoc_canvas.rtbh_manager
    entrypoint: trigger_rtbh
    accepts: [ip, cidr]
    taxonomy:
      namespace: DSOC
      predicates: [rtbh-triggered]
      levels: [info]
    sandbox: trusted_first_party
    rate_limit:
      max_calls: 10
      per_seconds: 3600
    # anz-mig-01. trigger_rtbh(conn, prefix, reason, triggered_by='system',
    # auto_withdraw_minutes=60) — the observable is `prefix`, the DB handle comes
    # from the canvas factory, and `reason` is required by the callable so it is
    # a required context value rather than a default invented here.
    input_binding:
      observable_param: prefix
      connection:
        param: conn
        factory: tools.dsoc_canvas.db.init_db:get_connection
        commit: true
      context_params: [reason]
      optional_context_params: [triggered_by, auto_withdraw_minutes]

  # ── anz-mig-01: DSOC family ────────────────────────────────────────────────
  # get_dsoc_overview and get_active_hijacks are NOT here. Both take only a
  # connection and answer "what is happening across the canvas" — they accept no
  # observable, so there is nothing for the contract to bind. See the migration
  # doc; forcing them in would have meant inventing a null observable type.

  - key: bgp_prefix_hijack
    kind: analyzer
    display_name: BGP Prefix Hijack Detection
    description: Compares an observed BGP announcement against an owned prefix and records a hijack event when the origin AS does not match.
    module: tools.dsoc_canvas.bgp_hijack_detector
    entrypoint: detect_prefix_hijack
    accepts: [bgp_prefix]
    taxonomy:
      namespace: DSOC
      predicates: [prefix-hijack, hijack-confidence]
      levels: [info, suspicious, malicious]
    sandbox: trusted_first_party
    rate_limit:
      max_calls: 600
      per_seconds: 3600
    # The observable is the OBSERVED announcement; the prefix we own is context,
    # not a second observable. Getting that backwards would invert the verdict.
    input_binding:
      observable_param: observed_prefix
      connection:
        param: conn
        factory: tools.dsoc_canvas.db.init_db:get_connection
        commit: true
      context_params: [our_prefix, our_asn, observed_origin_asn]
      optional_context_params: [peer_asn, detection_source]

  - key: bgp_route_leak
    kind: analyzer
    display_name: BGP Route Leak Detection
    description: Records a route-leak event for a prefix announced through a peer that should not be propagating it.
    module: tools.dsoc_canvas.bgp_hijack_detector
    entrypoint: detect_route_leak
    accepts: [bgp_prefix]
    taxonomy:
      namespace: DSOC
      predicates: [route-leak, leak-confidence]
      levels: [info, suspicious]
    sandbox: trusted_first_party
    rate_limit:
      max_calls: 600
      per_seconds: 3600
    input_binding:
      observable_param: prefix
      connection:
        param: conn
        factory: tools.dsoc_canvas.db.init_db:get_connection
        commit: true
      context_params: [announcing_asn, peer_asn]
      optional_context_params: [leak_type, confidence_pct, detection_source]

  # ── anz-mig-01: PVM family (NDC predictive vulnerability management) ───────
  # These three were reached through tools/mcp/gap_handlers.py, whose handlers do
  # nothing but unpack `args`, import the module and forward. Declaring the
  # binding here makes that hand-written middle layer redundant rather than
  # duplicated — the handler is not modified by this card, but a caller that
  # goes through the contract no longer needs one.

  - key: pvm_risk_prediction
    kind: analyzer
    display_name: PVM Composite Risk Prediction
    description: Scores one advisory with the 4-weight composite formula (cvss, exploit, patch lag, impacted trend) and appends to nc_vuln_predictions.
    module: tools.network.vuln_predictor
    entrypoint: predict_advisory_risk
    accepts: [advisory]
    taxonomy:
      namespace: NETWORK
      predicates: [composite-risk, exploit-likelihood, patch-lag]
      levels: [info, suspicious, malicious]
    sandbox: trusted_first_party
    rate_limit:
      max_calls: 600
      per_seconds: 3600
    # predict_advisory_risk opens its own connection internally, so no
    # `connection:` block — declaring one would open a second handle the callable
    # never uses.
    input_binding:
      observable_param: advisory_id

  - key: pvm_triage_scoring
    kind: analyzer
    display_name: PVM Bayesian Triage Scoring
    description: 4-factor triage score (KEV, asset criticality, network exposure, urgency) with auto-approve and HITL thresholds.
    module: tools.network.vuln_triage_engine
    entrypoint: score_advisories
    accepts: [advisory]
    taxonomy:
      namespace: NETWORK
      predicates: [triage-priority, hitl-required]
      levels: [info, suspicious, malicious]
    sandbox: trusted_first_party
    rate_limit:
      max_calls: 240
      per_seconds: 3600
    # score_advisories(advisory_ids: list[int] | None) is batch-shaped: one call,
    # N observables, one aggregate result. `observable_form: list` hands it a
    # one-element list so a single-observable dispatch produces the identical
    # call the existing MCP handler makes for a single id. Its whole-corpus
    # sweep (advisory_ids=None) has no observable and stays outside the
    # contract — see the migration doc.
    input_binding:
      observable_param: advisory_ids
      observable_form: list

  - key: pvm_attack_surface
    kind: analyzer
    display_name: PVM Attack Surface Mapping
    description: Correlates NQE device inventory with CVE advisories and Nessus findings, upserting nc_attack_surface scores.
    module: tools.network.attack_surface_mapper
    entrypoint: map_attack_surface
    accepts: [network]
    taxonomy:
      namespace: NETWORK
      predicates: [surface-score, exposure-type]
      levels: [info, suspicious, malicious]
    sandbox: trusted_first_party
    rate_limit:
      max_calls: 60
      per_seconds: 3600
    input_binding:
      observable_param: network_id
