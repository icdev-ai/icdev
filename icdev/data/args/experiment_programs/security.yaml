# CUI // SP-CTI
# Autoresearch Experiment Program — Security Domain
#
# Minimizes vulnerability density across the ICDEV™ codebase.
# Modifies code to fix SAST findings, harden dependency usage, remove secrets.

domain: security

objective:
  metric_name: inverse_vulnerability_density
  direction: maximize
  measurement_command: "python tools/security/sast_runner.py --project-dir tools/ --json"
  metric_path: "inverse_density"

modifiable_paths:
  - tools/
  - docker/

forbidden_paths:
  - tools/db/storage.py
  - tools/db/init_icdev_db.py
  - tools/genesis/daemon.py
  - .env
  - .claude/

time_budget_seconds: 300
keep_threshold: 0.005

category_order:
  - sast_findings
  - dependency_hardening
  - secret_remediation
  - container_hardening

categories:
  sast_findings:
    description: "Fix bandit/semgrep SAST findings"
    risk: medium
    example_hypotheses:
      - "Replace subprocess shell=True with shell=False and list args"
      - "Add input validation to prevent SQL injection in dynamic queries"
  dependency_hardening:
    description: "Update or replace vulnerable dependencies"
    risk: medium
    example_hypotheses:
      - "Pin dependency versions to fix known CVEs"
      - "Replace deprecated packages with maintained alternatives"
  secret_remediation:
    description: "Remove hardcoded secrets and credential patterns"
    risk: low
    example_hypotheses:
      - "Move hardcoded API keys to environment variables"
      - "Replace default passwords with secure generation"
  container_hardening:
    description: "Improve Dockerfile security posture"
    risk: low
    example_hypotheses:
      - "Add USER directive for non-root execution"
      - "Remove unnecessary packages from container images"
