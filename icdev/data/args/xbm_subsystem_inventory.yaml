# CUI // SP-CTI
# XBM — what ICDEV itself holds, per subsystem tag (xbm-cmp-01)
#
# A scout finding arrives tagged with a `subsystem` (see the vocabulary block in
# context/genesis/competitors.yaml). Reporting that finding in isolation is what
# the CMP epic exists to stop: "SigNoz shipped X" is only actionable next to what
# ICDEV's own observability subsystem contains. This file is the ICDEV half of
# that comparison — for each subsystem tag, where its code lives and which tables
# hold its data.
#
# Read by tools/innovation/icdev_evidence.py. Adding a subsystem or re-pointing
# one is a change here, not in Python.
#
# ── Schema ───────────────────────────────────────────────────────────
#   title    Human label. Matches the benchmark map's section heading.
#   section  Section number in docs/research/external-benchmark-map.md, or
#            null for the five subsystems that predate the map.
#   modules  Glob patterns, repo-root relative, counted as files. The map's
#            "ICDEV today" paragraphs quote these counts, so `tools/rag/*.py`
#            reproducing 38 is the check that this file still points at what
#            the map measured. __init__.py IS counted — that is the map's
#            convention, not an oversight.
#   tables   Glob patterns matched against live table names (fnmatch, case
#            sensitive). Matched against the DB catalog once, so a pattern that
#            matches nothing costs nothing and reports as unmatched rather than
#            as an error.
#   note     Why the mapping is what it is, where that is not obvious.
#
# ── Schema: the `benchmark` block ────────────────────────────────────
# Read by tools/innovation/benchmark_compare.py (xbm-cmp-01-d3), which turns
# the measurements above into a verdict. Every key is optional; a subsystem
# with no block is measured against the defaults and reports "not benchmarked"
# unless the watchlist carries an open adaptation for it.
#
#   module_floor  Below this many modules the subsystem reads `thin`; zero
#                 reads `absent`. Default 5. This is a smoke floor — evidence
#                 that something is there — not a quality bar. A subsystem
#                 being above it proves nothing except that it exists.
#   row_floor     Below this many rows the subsystem reads `unfed` — built but
#                 with nothing running through it. Default 1.
#   data_expected false => its tables fill per engagement, so an empty table on
#                 a dev instance says nothing. Default true.
#   owned         false => ICDEV does not hold this subsystem in this tree, so
#                 `absent` is correct rather than a deficit. Default true.
#   finding       What the benchmark map measured LOCALLY, in its own words.
#                 The external half is not restated here — it lives in
#                 args/innovation_promoter.yaml `benchmarked_against`.
#   closes_when   The measurable condition that retires `finding`. Only
#                 `tables: {name: min_rows}` is supported, because every
#                 retirable finding in the map is "this table is empty".
#                 OMIT IT when the finding is architectural or a judgment about
#                 proportion — the comparator then says so in
#                 measurement_limits instead of inventing a threshold. Omitting
#                 it is the honest default, not an oversight.
#   outstanding   The map's "Adapt." items, one string each. An explicit `[]`
#                 means a pass looked and found nothing to take — that is what
#                 licenses the `no_adaptation_needed` verdict. An ABSENT key
#                 means nobody has looked, which is a different statement and
#                 must not be written as `[]` to make a subsystem look clean.
#                 Open `adaptation` blocks in the watchlist are merged in on
#                 top of this list at runtime.
#
# ── This is not a partition ──────────────────────────────────────────
# Subsystems overlap on purpose. `llm_judge_evaluations` counts under both
# `llm_infrastructure` (by prefix) and `evaluation` (by name), because it is
# genuinely evidence for both questions. Do not sum across subsystems and expect
# the repo total; that number is meaningless here.
#
# ── Empty is a finding, not a bug ────────────────────────────────────
# `embedded` declares no modules and no tables. That is correct: the ESP-IDF and
# FreeRTOS targets benchmark SparkPilot, which is not in this tree. The evidence
# function reports it `absent`, and `absent` is exactly the answer a comparison
# needs — it distinguishes "we have nothing here" from "we have not looked".

subsystems:

  # ── §1–§10 map 1:1 onto docs/research/external-benchmark-map.md ────

  developer_portal:
    title: Developer portal / catalog
    section: 1
    modules:
      - tools/idp/*.py
      - tools/skillhub/*.py
      - tools/marketplace/*.py
      - tools/registry/*.py
      - tools/system_graph/*.py
    tables:
      - idp_*
      - marketplace_*
      - component_*
      # developer_scorecards is named individually because §1's finding is
      # about that one table being empty. A finding cited against a table the
      # evidence never counts cannot be retired by measurement.
      - developer_scorecards
    benchmark:
      finding: >-
        developer_scorecards ships A-F grading across five dimensions and holds
        0 rows, with zero writers and zero readers.
      closes_when:
        tables:
          developer_scorecards: 1
      outstanding:
        - >-
          Cortex.io's scorecard-as-code — a ladder of ranked levels, weighted
          rules, per-rule exemptions with approval, and evaluation windows, with
          IQE as the rule language rather than a new DSL.

  observability:
    title: Observability / LLM telemetry
    section: 2
    modules:
      - tools/observability/*.py
      - tools/observability_canvas/*.py
      - tools/odc/*.py
    tables:
      - otel_*
      - observability_*
      - odc_*
      - sre_slo*
    benchmark:
      finding: >-
        Already OTel-GenAI-native. tools/observability/ carries a dedicated
        genai_attributes.py and otel_tracer.py, and tools/llm/router.py — the
        path effectively all routed calls take — emits gen_ai.* spans.
      # The map's §2 verdict is "No adaptation needed" verbatim. The one
      # opportunity it names — exporting the existing spans to a third-party
      # OTel backend — it classifies as config and packaging rather than
      # something to adapt from Langfuse, so it is not listed here.
      outstanding: []

  agent_runtime:
    title: Agent runtime & orchestration
    section: 3
    modules:
      - tools/agent/*.py
      - tools/agent_runtime/*.py
      - tools/agents/*.py
      - tools/a2a/*.py
      - tools/orchestration/*.py
      - tools/workflow_hitl/*.py
      - tools/ace/*.py
      - tools/coworkers/*.py
    tables:
      - agent_*
      - a2a_*
      - hitl_*
      - workflow_*
    benchmark:
      finding: >-
        Both layers of the 2026 two-layer pattern are already present — the
        agent_loop.py inner loop and the completed DWO card for durable outer
        execution — with budgets more mature than expected.
      # Measured by grep over agent_loop.py, not by a table, so no closes_when.
      outstanding:
        - >-
          Semantic loop detection — stall_threshold catches no progress, not
          steady progress through equivalent actions (0 hits).
        - Approval workflow in the agent loop (0 hits).
        - >-
          Session wall-clock ceiling — per-call timeouts exist, total duration
          does not (0 hits).
        - Path/tool scoping in skill frontmatter, taken from xichan96/cortex.

  security_ops:
    title: Security ops / threat analysis
    section: 4
    modules:
      - tools/strategos/*.py
      - tools/security/*.py
      - tools/supply_chain/*.py
      - tools/threat_analysis/*.py
      - tools/dsoc_canvas/*.py
      - tools/analyzers/*.py
    note: >-
      The map's §4 finding is that these ~79 analyzer-shaped modules share no
      base class. The module count is therefore the evidence for that finding,
      not just a size measurement.
    tables:
      - threat_*
      - security_*
      - dsoc_*
      - sbom_*
    benchmark:
      finding: >-
        ~79 analyzer-shaped modules across tools/strategos/, tools/security/ and
        tools/supply_chain/ with no shared base class among them; every feed,
        importer, scorer and triage path is hand-wired and the outputs share no
        vocabulary.
      # No closes_when: "these modules share no contract" is architectural. A
      # module count cannot retire it and neither can a row count, so the
      # comparator reports it as not re-measurable rather than guessing. The
      # anz card tracks the fix; when it lands, a human re-reads §4.
      outstanding:
        - >-
          TheHive Cortex's analyzer contract — declared observable types, a
          per-analyzer rate limit and a taxonomy-tagged report — expressed as
          data rather than as a base class, since 79 modules will not be
          rewritten to adopt one.

  rag_knowledge_graph:
    title: RAG & knowledge graph
    section: 5
    modules:
      - tools/rag/*.py
      - tools/knowledge_graph/*.py
      - tools/ontology/*.py
    tables:
      - rag_*
      - kg_*
      - knowledge_*
      - ontology_*
    benchmark:
      finding: >-
        Retrieval is mature; the gap is the graph. kg_edges was 0 for the
        self-awareness graph and derive_edges() implemented one heuristic —
        nodes without the relationships GraphRAG's premise rests on.
      closes_when:
        tables:
          kg_edges: 1
      outstanding:
        - >-
          Microsoft GraphRAG's community detection and hierarchical summaries,
          sequenced behind the edges existing.

  compliance_ato:
    title: Compliance & ATO
    section: 6
    modules:
      - tools/compliance/*.py
      - tools/ato_compliance/*.py
      - tools/canvas_compliance/*.py
    tables:
      - compliance_*
      - nist_*
      - oscal_*
      - ssp_*
      - poam*
      - control_*
    benchmark:
      # An SSP exists because someone authorised a system, not because the
      # platform is running. Zero rows on a dev instance is not a finding here,
      # and scoring it as one would manufacture a gap out of an idle instance.
      data_expected: false
      finding: >-
        OSCAL generate/validate/convert/profile-resolve, FedRAMP 20x KSI, CMMC,
        eMASS and Xacta sync, STIG checking, SSP/POAM/SBOM generation, a
        multi-framework crosswalk, cATO monitoring, IL4-IL6 classification and
        append-only NIST AU audit.
      # The map's §6 conclusion in full: the benchmark found no external project
      # worth adapting FROM. That is the strongest form of "no adaptation
      # needed" — not an unexamined blank.
      outstanding: []

  delivery_pipeline:
    title: Delivery pipeline
    section: 7
    modules:
      - tools/pipeline/*.py
      - tools/ci/*.py
      - tools/devops/*.py
      - tools/devsecops/*.py
      - tools/kanban/*.py
    note: >-
      tools/kanban/ is included because the Governed Delivery Pipeline is ICDEV's
      delivery pipeline — args/innovation_promoter.yaml points this subsystem's
      icdev_surface at it for the same reason.
    tables:
      - pipeline*
      - ci_pipeline_*
      - devsecops_*
    benchmark:
      finding: >-
        kanban -> worktree -> build -> PR -> CI -> merge-verified done, with a
        real dated build ledger behind it. None of the external tools close the
        loop from detected gap to merged fix.
      # The map's §7 "Adapt." line is "Nothing external." Its one open item —
      # worktree reclamation — is a local hygiene fix tracked as ars-wt-01, not
      # something to take from Temporal or Argo, so it is not listed here.
      outstanding: []

  data_lineage:
    title: Data quality & lineage
    section: 8
    modules:
      - tools/data_canvas/*.py
    tables:
      - dd_*
      - data_nodes
      - data_edges
      - data_designs
      # dm_* is the data-mesh half — domains, products, contracts and ports.
      # §8's finding is cited against dm_domains and dm_data_products, so the
      # evidence has to count them for the finding to be checkable at all.
      - dm_*
    benchmark:
      finding: >-
        The engines are there — profiler, quality engine, anomaly detector,
        freshness guardian, PII scanner, plus a data-mesh model. The gap is
        data, not code: dm_domains held 4 rows and dm_data_products 8, and the
        cf_applications and mc_app_inventory inventories were empty.
      # No closes_when: §8 is a judgment about PROPORTION — sophisticated
      # machinery with nothing running through it — not a threshold. Picking a
      # row count that "closes" it would be numerology, and picking one low
      # enough for 4 and 8 to clear would retire the finding while it is still
      # true. The comparator reports the live counts and says a human must
      # re-read it.
      outstanding:
        - >-
          OpenLineage's event spec, so lineage is emitted in a standard format
          and the existing engines become interoperable.

  evaluation:
    title: LLM evaluation & red teaming
    section: 9
    note: >-
      The map's sharpest gap: 2 modules against 38 in tools/rag/. Table patterns
      are named individually because evaluation rows live under the prefix of
      whatever wrote them, not under an `eval_` prefix — the scatter is itself
      the finding.
    modules:
      - tools/evaluation/*.py
      - tools/harness/*.py
      - tools/genesis/harness/*.py
    tables:
      - agent_eval*
      - agent_benchmark_results
      - capability_evaluations
      - llm_judge_evaluations
      - gd_ai_judge_evals
      - goveval_results
      - harness_eval
      - ft_evaluations
      - finetune_eval_results
      - red_team*
    benchmark:
      finding: >-
        tools/evaluation/ holds 2 modules against 38 in tools/rag/ — the
        thinnest major subsystem measured. ATLAS red-teaming and an
        OWASP-agentic assessor mean SECURITY evaluation exists; systematic
        QUALITY evaluation does not.
      # No closes_when: the finding is a ratio against a peer subsystem plus a
      # kind of evaluation that is missing, neither of which a row count
      # retires. The module floor below is the smoke check, not the bar §9 set.
      outstanding:
        - >-
          promptfoo's eval-as-config model with CI gating — it fits the
          args-over-code convention, and context/iqe/queries/ already
          establishes config-declared test corpora.

  iac:
    title: IaC & infrastructure
    section: 10
    modules:
      - tools/infra/*.py
      - tools/infra_canvas/*.py
      - tools/cloud/*.py
    tables:
      - infra_*
    benchmark:
      finding: >-
        IDC canvas with Terraform/Pulumi emitters, tf_state / pulumi_state / AWS
        Resource Groups Tagging importers, Ansible, K8s deploy, Helm, Iron Bank,
        SLSA and SBOM — comparable coverage with better compliance integration.
      # §10's "Adapt." line is "Nothing urgent", and it defers Checkov's
      # policy-pack model behind IaC policy scanning becoming a priority. A
      # deferred item is not an outstanding one; when it is picked up it goes on
      # the watchlist as an adaptation candidate and shows up here that way.
      outstanding: []

  # ── ICDEV subsystems the benchmark map did not cover ──────────────

  autonomous_research:
    title: Genesis / autoresearch loops
    section: null
    modules:
      - tools/genesis/*.py
      - tools/autoresearch/*.py
      - tools/research/*.py
      - tools/oracle/*.py
      - tools/awareness/*.py
    note: >-
      tools/autoresearch/ writes into the genesis_* and research_* tables rather
      than a prefix of its own, so there is no autoresearch_* pattern to declare.
    tables:
      - genesis_*
      - research_*

  design_quality:
    title: Generated-UI and presentation quality
    section: null
    modules:
      - tools/viz/*.py
      - tools/slides/*.py
      - tools/presentations/*.py
      - tools/sdc/*.py
      - tools/quality/*.py
    tables:
      - sdc_*
      - slide*

  llm_infrastructure:
    title: Local model serving
    section: null
    modules:
      - tools/llm/*.py
      - tools/cortex/*.py
    tables:
      - llm_*
      - cortex_*

  mlops:
    title: Model lifecycle
    section: null
    modules:
      - tools/ohc/*.py
      - tools/finetune/*.py
    tables:
      - ohc_*
      - model_*
      - ft_*
      - finetune_*

  embedded:
    title: SparkPilot / RTOS
    section: null
    note: >-
      Deliberately empty. The esp-idf, FreeRTOS and RuView targets benchmark
      SparkPilot, which is a separate tree. `absent` is the honest verdict and
      the one a comparison should surface — do not invent a mapping to make this
      subsystem look covered.
    modules: []
    tables: []
    benchmark:
      # The only `owned: false` in the file. It is what stops the comparator
      # scoring an intentional absence as a deficit: `absent` here is the
      # correct reading, so no verdict is emitted at all.
      owned: false
