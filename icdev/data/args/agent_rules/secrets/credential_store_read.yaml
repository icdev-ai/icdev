# CUI // SP-CTI
# Monitor-only. See args/agent_rules/README.md before changing `enforce`.
id: secrets.credential_store_read
version: "1"
title: Agent read a tool's ambient credential store
severity: high
tags:
  - T1552.001
  - T1555
  - credential-access
enabled: true
enforce: false
deny_message: >-
  Reading a tool credential store is blocked. These files hold live tokens for
  git, cloud and package registries.
expr:
  event_type:
    - file.read
  # Ambient credential stores: files a tool wrote for its own use, which an
  # agent has no legitimate reason to open directly. Distinct from
  # secrets.env_file_read because the remediation differs — these are not
  # project config and cannot be moved behind a provider.
  file_path_glob:
    - "**/.git-credentials"
    - "**/.netrc"
    - "**/_netrc"
    - "**/.aws/credentials"
    - "**/.aws/config"
    - "**/.config/gcloud/**"
    - "**/.azure/**"
    - "**/.docker/config.json"
    - "**/.npmrc"
    - "**/.pypirc"
    - "**/.kube/config"
    - "**/.ssh/*"
    - "**/.gnupg/*"
