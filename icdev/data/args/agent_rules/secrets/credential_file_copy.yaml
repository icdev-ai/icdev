# CUI // SP-CTI
# Monitor-only. See args/agent_rules/README.md before changing `enforce`.
id: secrets.credential_file_copy
version: "1"
title: Shell command copied or moved credential material
severity: high
tags:
  - T1552.001
  - collection
enabled: true
enforce: false
deny_message: >-
  Copying credential material to another path is blocked. Staging secrets
  outside their protected location defeats the file access tiers.
expr:
  event_type:
    - command.exec
  command_name:
    - cp
    - copy
    - mv
    - move
    - scp
    - rsync
    - tar
    - zip
    - 7z
  # Literal argv tokens, matched against the parsed shell view (agov-det-02) and
  # NOT against a flattened command string. That distinction is the whole point
  # of the parsed view: agent_approval_policy.yaml:107-126 records a real
  # fail-open where a pattern matched a word sitting in an unrelated JSON
  # argument. A command that does not parse does not fire this rule at all.
  argv_contains:
    - ".env"
    - "id_rsa"
    - "id_ed25519"
    - ".pem"
    - ".p12"
    - "credentials.json"
    - ".git-credentials"
    - ".netrc"
