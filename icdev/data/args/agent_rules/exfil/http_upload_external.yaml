# CUI // SP-CTI
# Monitor-only. See args/agent_rules/README.md before changing `enforce`.
id: exfil.http_upload_external
version: "1"
title: HTTP client invoked with a request body or file upload
severity: medium
tags:
  - T1041
  - exfiltration
enabled: true
enforce: false
deny_message: >-
  Uploading a request body to an external host is blocked. Route outbound calls
  through the configured gateway so egress policy and redaction apply.
expr:
  event_type:
    - command.exec
  command_name:
    - curl
    - wget
    - httpie
    - http
  # Flags that carry data OUT. A bare GET is not this rule's business — the
  # platform fetches documentation constantly and flagging that would bury the
  # signal.
  argv_contains:
    - "-d"
    - "--data"
    - "--data-binary"
    - "--data-raw"
    - "--form"
    - "-F"
    - "-T"
    - "--upload-file"
    - "--post-file"
    - "--post-data"
  # Loopback and link-local targets are the platform talking to itself — the
  # dashboard on :5050, Ollama on :11434, the kanban API. Severity here is
  # medium precisely because this rule cannot see the destination when the URL
  # is built at runtime, in which case the negation cannot help.
  not_url_matches:
    - "^https?://(localhost|127\\.0\\.0\\.1|\\[::1\\])(:|/|$)"
    - "^https?://169\\.254\\."
