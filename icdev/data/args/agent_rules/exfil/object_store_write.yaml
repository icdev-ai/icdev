# CUI // SP-CTI
# Monitor-only. See args/agent_rules/README.md before changing `enforce`.
id: exfil.object_store_write
version: "1"
title: Cloud CLI used to push data to an object store
severity: medium
tags:
  - T1537
  - exfiltration
enabled: true
enforce: false
deny_message: >-
  Pushing data to cloud object storage from an agent session is blocked. Use the
  deployment pipeline, where the destination bucket is declared and reviewed.
expr:
  event_type:
    - command.exec
  command_name:
    - aws
    - gsutil
    - gcloud
    - az
    - s3cmd
    - s5cmd
    - rclone
    - mc
  # Upload verbs only. `aws sts get-caller-identity` and `az account show` are
  # routine and must not fire this.
  argv_contains:
    - "cp"
    - "sync"
    - "mv"
    - "put-object"
    - "upload"
    - "copyto"
