# CUI // SP-CTI
# Monitor-only. See args/agent_rules/README.md before changing `enforce`.
id: persistence.scheduled_task_created
version: "1"
title: Agent registered work that runs after the session ends
severity: medium
tags:
  - T1053
  - persistence
enabled: true
enforce: false
deny_message: >-
  Registering a scheduled task is blocked. ICDEV schedules recurring work
  through Genesis reflexes and agent_cron_jobs, which are reviewable.
expr:
  event_type:
    - command.exec
  command_name:
    - crontab
    - schtasks
    - at
    - launchctl
    - systemd-run
  # `systemctl` is deliberately absent: reading unit status is routine and the
  # enabling verbs are not distinguishable from it without argv inspection that
  # would misfire on any command that did not parse.
