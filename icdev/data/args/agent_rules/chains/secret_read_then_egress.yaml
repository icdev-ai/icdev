# CUI // SP-CTI
# Monitor-only. See args/agent_rules/README.md before changing `enforce`.
id: chains.secret_read_then_egress
version: "1"
title: Read credential material, then sent data to an external host
severity: critical
tags:
  - T1552.001
  - T1041
  - exfiltration
enabled: true
enforce: false
# THE reason this card exists. Every check ICDEV shipped before AGOV is
# single-action, so each half of this is individually unremarkable — agents read
# config and agents call APIs — and the composition, which is the actual
# concern, was invisible.
deny_message: >-
  Credential material was read and then data left this host in the same session.
  Blocked pending review.
sequence:
  within: 30m
  within_events: 200
  max_matches: 1
  steps:
    - event_type:
        - file.read
      file_path_glob:
        - "**/.env"
        - "**/.env.*"
        - "**/*.pem"
        - "**/*.key"
        - "**/id_rsa"
        - "**/id_ed25519"
        - "**/credentials.json"
        - "**/.git-credentials"
        - "**/.netrc"
        - "**/.aws/credentials"
      not_file_path_glob:
        - "**/.env.sample"
        - "**/.env.example"
        - "**/.env.template"
    # No event_type key here: keys AND, and only a command.exec carries a
    # command_name, so naming the type as well would be redundant — and pairing
    # it with `network.indicator` would create a branch that can never match,
    # because a network indicator has no command to name.
    - command_name:
        - curl
        - wget
        - httpie
        - http
        - nc
        - ncat
        - socat
        - ssh
        - scp
      not_url_matches:
        - "^https?://(localhost|127\\.0\\.0\\.1|\\[::1\\])(:|/|$)"
