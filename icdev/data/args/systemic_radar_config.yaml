# Systemic Risk & Opportunity Radar (SROR) Configuration
# FathomDesk Market Intelligence — early warning system
# 8 indicator families × 3 time horizons

enabled: true
version: "1.0.0"

# --- Family weights (must sum to 1.0) ---
family_weights:
  market_stress:       0.20
  macro_leading:       0.18
  monetary_liquidity:  0.15
  news_sentiment:      0.12
  supply_chain_geo:    0.10
  cross_asset_diverge: 0.10
  institutional_flow:  0.07
  historical_pattern:  0.08

# --- Family enable/disable ---
families:
  market_stress:
    enabled: true
    description: "VIX, credit spreads (IG OAS, BBB OAS, HY OAS, SOFR-FF), put/call, skew, breadth, copper/gold"
    # Per-indicator weights within the credit spreads group (must sum to 1.0)
    credit_spreads_weights:
      ig_oas:  0.30   # ICE BofA IG OAS — broad investment-grade stress
      bbb_oas: 0.25   # ICE BofA BBB OAS — fallen-angel risk
      hy_oas:  0.25   # ICE BofA HY OAS — high-yield / risk-on barometer
      sofr_ff: 0.20   # SOFR minus Fed Funds spread — short-term funding stress
  macro_leading:
    enabled: true
    description: "LEI, ISM PMI, building permits, claims, Sahm Rule, consumer confidence"
  monetary_liquidity:
    enabled: true
    description: "Van Metre + Fed balance sheet, TGA, net liquidity, M2, bank reserves"
  news_sentiment:
    enabled: true
    description: "News cluster sentiment, divergence count, omission density"
  supply_chain_geo:
    enabled: true
    description: "Geopolitical risk, supply chain risk, KG stress propagation"
  cross_asset_diverge:
    enabled: true
    description: "Stocks vs bonds, gold+dollar, oil vs equities, VIX correlation"
  institutional_flow:
    enabled: true
    description: "Insider buy/sell ratio, analyst upgrades/downgrades"
  historical_pattern:
    enabled: true
    description: "Recession precursors, crisis fingerprint similarity, HMM transitions"

# --- Regime thresholds ---
regime:
  strong_opportunity: { danger_max: 25, opportunity_min: 60 }
  opportunity:        { danger_max: 40, opportunity_min: 50 }
  neutral:            { danger_max: 60, opportunity_min: 40 }
  caution:            { danger_min: 60, opportunity_max: 40 }
  danger:             { danger_min: 75, opportunity_max: 30 }
  crisis:             { danger_min: 85, opportunity_max: 20 }

# --- Alert thresholds ---
alerts:
  danger_escalation_threshold: 75
  opportunity_emerging_threshold: 65
  divergence_penalty: 10
  convergence_bonus: 5
  min_families_red_for_critical: 3

# --- Scoring ---
scoring:
  # Divergence bonus: added to danger when cross-asset divergences active
  divergence_danger_bonus: 10
  # Narrative convergence bonus: added to opportunity when news aligns with macro
  convergence_opportunity_bonus: 5

# --- Crisis fingerprints (historical pattern matching) ---
crisis_fingerprints:
  recession_precursor_threshold: 4  # out of 7 classic signals
  crisis_similarity_threshold: 0.70
  hmm_transition_threshold: 0.40
  fingerprints:
    gfc_2008:
      yield_curve_inverted: true
      credit_spreads_wide: true
      housing_declining: true
      unemployment_rising: true
      lei_declining: true
      bank_stress: true
    covid_2020:
      vix_spike: true
      breadth_collapse: true
      oil_crash: true
      claims_spike: true
    rate_shock_2022:
      yield_curve_inverted: true
      fed_tightening: true
      growth_to_value_rotation: true
      housing_declining: true
