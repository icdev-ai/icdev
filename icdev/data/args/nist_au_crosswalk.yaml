# CUI // SP-CTI
# NIST 800-53 AU (Audit + Accountability) control crosswalk — Phase 7+.
#
# Maps each of FathomDesk's append-only audit tables to the NIST 800-53
# rev5 Audit & Accountability controls it contributes toward.
#
# Used by `tools/trading/compliance/audit_aggregator.py` for:
#   1. Driving the unified audit viewer on /compliance — defines which
#      tables to query + how to normalize their rows into the common
#      {source, timestamp, user_id, action, detail, severity} shape.
#   2. Rendering the NIST crosswalk view — operators can see which
#      controls their deployment's audit trail satisfies at a glance.
#
# Control references:
#   AU-2  Event Logging
#   AU-3  Content of Audit Records
#   AU-4  Audit Log Storage Capacity
#   AU-6  Audit Review, Analysis, and Reporting
#   AU-9  Protection of Audit Information
#   AU-11 Audit Record Retention
#   AU-12 Audit Generation
#
# Note: this is a DOCUMENTATION + DISCOVERY aid. It does not implement
# the controls — the controls are implemented by the tables themselves
# being append-only (enforced by `.claude/hooks/pre_tool_use.py`).

_schema_version: 1

# Enumerated event categories used to normalize heterogeneous row
# schemas into a single viewer. Keep this list synced with the
# aggregator code.
categories:
  authentication: {label: "Authentication", severity_default: "info"}
  authorization:  {label: "Authorization",  severity_default: "info"}
  credential:     {label: "Credentials",    severity_default: "info"}
  billing:        {label: "Billing",        severity_default: "info"}
  trading:        {label: "Trading",        severity_default: "info"}
  admin:          {label: "Admin",          severity_default: "warning"}
  gamification:   {label: "Gamification",   severity_default: "info"}
  governance:     {label: "Governance",     severity_default: "warning"}
  transfer:       {label: "Data Transfer",  severity_default: "warning"}

# Table registry — order matters (defines default presentation order).
tables:

  audit_trail:
    label: "Core audit trail"
    category: governance
    description: >-
      Catch-all audit trail for administrative actions + security events
      not captured by a domain-specific table.
    columns:
      timestamp: created_at
      user_id: user_id
      action: action
      detail: payload
    nist_controls: [AU-2, AU-3, AU-6, AU-12]

  ad_credential_audit:
    label: "BYOK credential audit"
    category: credential
    description: >-
      Every set/delete/test/used/decrypt_error on a user's stored API
      credentials (Anthropic, OpenAI, Alpaca, Ollama). Supports BYOK
      Path A (operator KEK) and Path B (user-vault) both.
    columns:
      timestamp: created_at
      user_id: user_id
      action: action
      detail: detail
      severity_hint: success
    nist_controls: [AU-2, AU-3, AU-12, SI-4]

  ad_stripe_events:
    label: "Stripe webhook events"
    category: billing
    description: >-
      Every Stripe webhook we've processed — subscription lifecycle,
      invoice events, payment failures. Idempotency ledger.
    columns:
      timestamp: processed_at
      user_id: tenant_id           # Stripe events are tenant-scoped
      action: event_type
      detail: result
    nist_controls: [AU-2, AU-3, AU-12]

  ad_mfa_attempts:
    label: "MFA verification attempts"
    category: authentication
    description: >-
      Every TOTP / backup-code verification attempt. Used for lockout
      tracking + forensics. Rate-limited 5 attempts / 15 minutes.
    columns:
      timestamp: attempted_at
      user_id: user_id
      action: attempt_type
      detail: succeeded
      severity_hint: succeeded
    nist_controls: [AU-2, AU-6, IA-2, AC-7]

  ad_password_reset_tokens:
    label: "Password reset tokens"
    category: authentication
    description: >-
      30-minute single-use password reset links. Created on
      forgot-password, used when the user clicks the link. No-enumeration
      response discipline.
    columns:
      timestamp: created_at
      user_id: user_id
      action: action_type
      detail: used_at
    nist_controls: [AU-2, IA-5]

  ad_tenant_invitations:
    label: "Tenant invitations"
    category: authorization
    description: >-
      Invitation tokens generated for tenant membership. Single-use,
      7-day TTL, sha256-hashed. Tracks accept + revoke events via
      status-flip timestamps.
    columns:
      timestamp: created_at
      user_id: invited_by
      action: action_type
      detail: email
    nist_controls: [AU-2, AC-2, AC-5]

  ad_trade_audit:
    label: "Auto-trading audit"
    category: trading
    description: >-
      Every auto-trading decision — signal approved, order submitted,
      order rejected, kill-switch tripped. Immutable for post-incident
      review.
    columns:
      timestamp: created_at
      user_id: actor
      action: action
      detail: payload
    nist_controls: [AU-2, AU-3, AU-12]

  ad_xp_events:
    label: "Gamification XP events"
    category: gamification
    description: >-
      Every XP grant / achievement bonus event. Keeps gamification
      anti-fraud-auditable (replay via dedup_key, daily caps, etc.).
    columns:
      timestamp: created_at
      user_id: user_id
      action: reason
      detail: amount
    nist_controls: [AU-2, AU-12]

  ad_user_achievements:
    label: "Badges earned"
    category: gamification
    description: >-
      Immutable ledger of earned achievements. UNIQUE (user_id, achievement_id)
      prevents double-earns.
    columns:
      timestamp: earned_at
      user_id: user_id
      action: achievement_id
      detail: xp_bonus
    nist_controls: [AU-2, AU-12]

  ad_sandbox_orders:
    label: "Sandbox paper fills"
    category: trading
    description: >-
      Every paper-sim order fill in a challenge sandbox. Append-only —
      rewrites would corrupt P&L math + short-sell margin audit.
      Phase 7.5: asset_class column distinguishes equity vs option fills,
      multileg_group_id links legs of a multi-leg strategy.
    columns:
      timestamp: filled_at
      user_id: user_id
      action: side
      detail: ticker
    nist_controls: [AU-2, AU-12]

  ad_sandbox_daily_snapshots:
    label: "Sandbox daily snapshots"
    category: trading
    description: >-
      One point-in-time snapshot per (attempt, day). Feeds continuously-
      held predicates + Sharpe-future. Idempotent per day.
    columns:
      timestamp: snapshot_date
      user_id: user_id
      action: "daily_snapshot"
      detail: total_value
    nist_controls: [AU-2, AU-4]

  hook_events:
    label: "Agent hook events"
    category: governance
    description: >-
      FathomDesk daemon-level hook invocations (pre-tool, post-tool,
      notifications). HMAC-signed per Phase 39 observability.
    columns:
      timestamp: created_at
      user_id: user_id
      action: hook_name
      detail: summary
    nist_controls: [AU-2, AU-9, AU-12]

  cross_agency_transfers:
    label: "Cross-agency data transfers"
    category: transfer
    description: >-
      Append-only audit trail for all cross-agency data transfer events —
      initiated, completed, failed, and rejected. Dual-written to audit_trail
      for AU-2 completeness. Classification markings (CUI/SECRET/TOP_SECRET)
      recorded per transfer with configurable retention (AU-11).
    columns:
      timestamp: occurred_at
      user_id: actor
      action: event_type
      detail: details
    nist_controls: [AU-2, AU-3, AU-9, AU-11, AU-12]
