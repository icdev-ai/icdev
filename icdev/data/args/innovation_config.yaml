# [TEMPLATE: CUI // SP-CTI]
# ICDEV™ Innovation Engine Configuration — autonomous self-improvement pipeline
# Phase 35: Continuous Innovation Engine

# =========================================================================
# Web Intelligence Sources
# =========================================================================
sources:
  github:
    enabled: true
    scan_interval_hours: 6
    targets:
      - type: trending_repos
        languages: [python, go, rust, java, typescript, csharp]
        since: daily
        max_results: 50
      - type: issues
        repos:
          - kubernetes/kubernetes
          - hashicorp/terraform
          - open-policy-agent/opa
          - istio/istio
          - anchore/grype
          - aquasecurity/trivy
          - bridgecrewio/checkov
          - prowler-cloud/prowler
          - ethereum/go-ethereum
          - solana-labs/solana
          - hyperledger/fabric
          - OpenZeppelin/openzeppelin-contracts
          - paradigmxyz/reth
          - foundry-rs/foundry
          - crytic/slither
          - chainalysis/blockchain-compliance
          - paperclipai/paperclip
        labels: [bug, enhancement, security, compliance]
        max_results: 100
      - type: discussions
        topics: [devsecops, compliance-as-code, sbom, zero-trust, govcloud, blockchain, smart-contracts, web3-security, defi-compliance]
        max_results: 50
    rate_limit:
      requests_per_hour: 60
      burst: 10

  stackoverflow:
    enabled: true
    scan_interval_hours: 12
    tags:
      - devsecops
      - compliance
      - cicd-pipeline
      - kubernetes-security
      - nist
      - fedramp
      - sast
      - sbom
      - zero-trust
      - infrastructure-as-code
      - blockchain
      - ethereum
      - solidity
      - smart-contracts
      - web3
      - hyperledger
      - defi
    min_score: 5
    max_results: 50
    sort: votes

  cve_databases:
    enabled: true
    scan_interval_hours: 4
    sources:
      - name: nvd
        api_url: https://services.nvd.nist.gov/rest/json/cves/2.0
        severity_filter: [CRITICAL, HIGH]
      - name: github_advisories
        api_url: https://api.github.com/advisories
        severity_filter: [critical, high]
      - name: cisa_kev
        api_url: https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json
        description: "CISA Known Exploited Vulnerabilities Catalog — BOD 22-01 mandate"
        severity_filter: [CRITICAL, HIGH, MEDIUM]
        network_device_focus: true
        scan_interval_hours: 6
      - name: msrc
        api_url: https://api.msrc.microsoft.com/cvrf/v2.0/updates
        description: "Microsoft Security Response Center — monthly patch Tuesday feed"
        severity_filter: [Critical, Important]
        scan_interval_hours: 24
    ecosystems: [pip, npm, go, maven, nuget, cargo]
    network_device_vendors: [cisco, juniper, palo_alto, fortinet, arista, f5, checkpoint]
    blockchain_keywords:
      - smart contract
      - solidity
      - reentrancy
      - flash loan
      - oracle manipulation
      - bridge exploit
      - private key
      - wallet
    max_results: 100

  nist_advisories:
    enabled: true
    scan_interval_hours: 24
    feeds:
      - name: csrc_publications
        url: https://csrc.nist.gov/publications
        types: [SP, IR, FIPS]
      - name: cisa_advisories
        url: https://www.cisa.gov/news-events/cybersecurity-advisories
      - name: cisa_directives
        url: https://www.cisa.gov/news-events/directives

  cloud_changelogs:
    enabled: true
    scan_interval_hours: 12
    providers:
      - name: aws_govcloud
        url: https://aws.amazon.com/about-aws/whats-new
        filter: govcloud
      - name: aws_security
        url: https://aws.amazon.com/security/security-bulletins
    max_results: 30

  # CSP Service Monitor (Phase 38 — D239, D240)
  # Delegates to tools/cloud/csp_monitor.py for multi-CSP scanning.
  # Config: args/csp_monitor_config.yaml | Registry: context/cloud/csp_service_registry.json
  csp_monitor:
    enabled: true
    scan_interval_hours: 12
    delegate_to: tools/cloud/csp_monitor.py
    csps: [aws, azure, gcp, oci, ibm]
    signal_source: csp_monitor
    categories: [infrastructure, modernization, compliance_gap, security_vulnerability, developer_experience]
    notes: "Autonomous tracking of CSP service additions, deprecations, compliance scope changes, and breaking API changes across all five CSPs"

  developer_surveys:
    enabled: true
    scan_interval_hours: 168  # weekly
    sources:
      - name: dora_report
        url: https://dora.dev
      - name: state_of_devops
        url: https://puppet.com/resources/state-of-devops-report
      - name: stack_overflow_survey
        url: https://survey.stackoverflow.co

  community_forums:
    enabled: true
    scan_interval_hours: 8
    platforms:
      - name: reddit
        subreddits: [devops, netsec, sysadmin, kubernetes, golang, rust, blockchain, ethereum, defi, web3, solana, cybersecurity, AskNetsec, blueteamsec, networking]
        sort: hot
        max_results: 30
        min_upvotes: 50
      - name: hackernews
        url: https://hacker-news.firebaseio.com/v0
        min_score: 100
        max_results: 20

  package_registries:
    enabled: true
    scan_interval_hours: 24
    registries:
      - name: pypi
        trending_url: https://hugovk.github.io/top-pypi-packages/top-pypi-packages-30-days.json
        categories: [security, compliance, devops, testing]
      - name: npm
        trending_url: https://api.npmjs.org/downloads/point/last-week
        categories: [security, linting, testing]

  compliance_updates:
    enabled: true
    scan_interval_hours: 24
    sources:
      - name: fedramp_marketplace
        url: https://marketplace.fedramp.gov
      - name: cmmc_ab
        url: https://cyberab.org
      - name: federal_register
        url: https://www.federalregister.gov/api/v1/documents
        agency_filter: [DOD, DHS, NIST, CISA]
      - name: dod_cio
        url: https://dodcio.defense.gov

# =========================================================================
# Signal Classification
# =========================================================================
signal_categories:
  security_vulnerability:
    keywords: [CVE, vulnerability, exploit, injection, XSS, CSRF, SSRF, RCE, privilege escalation]
    priority_boost: 1.5
    auto_triage: true
  compliance_gap:
    keywords: [NIST, FedRAMP, CMMC, STIG, ATO, compliance gap, control failure, audit finding]
    priority_boost: 1.3
    auto_triage: true
  developer_experience:
    keywords: [slow, frustrating, boilerplate, tedious, manual, workaround, pain point, UX, DX]
    priority_boost: 1.0
    auto_triage: false
  performance:
    keywords: [slow, timeout, memory leak, bottleneck, latency, throughput, scalability]
    priority_boost: 1.1
    auto_triage: false
  modernization:
    keywords: [legacy, migration, deprecated, end of life, upgrade, breaking change]
    priority_boost: 1.2
    auto_triage: true
  supply_chain:
    keywords: [dependency, SBOM, supply chain, unmaintained, abandoned, license]
    priority_boost: 1.3
    auto_triage: true
  infrastructure:
    keywords: [kubernetes, terraform, docker, container, helm, deployment, infrastructure]
    priority_boost: 1.0
    auto_triage: false
  testing:
    keywords: [test coverage, flaky test, integration test, E2E, BDD, TDD, mutation testing]
    priority_boost: 1.0
    auto_triage: false
  ai_tooling:
    keywords: [copilot, cursor, codex, claude, AI coding, agent, MCP, LLM integration]
    priority_boost: 1.2
    auto_triage: false
  external_framework_analysis:
    keywords: [agent-zero, insforge, framework adaptation, pattern transfer, architecture innovation]
    priority_boost: 1.3
    auto_triage: true
  blockchain:
    keywords: [blockchain, smart contract, DeFi, web3, distributed ledger, tokenization, consensus, on-chain, bridge exploit, reentrancy, flash loan, oracle manipulation, MEV, zero-knowledge proof, ZKP, rollup]
    priority_boost: 1.3
    auto_triage: true
  cli_harmonization:
    keywords: [--json flag, --project-id, --project naming, db_utils, hardcoded path, CLI drift, argparse, output format]
    priority_boost: 1.1
    auto_triage: true
    notes: "Detected by introspective analyzer every 12 hours. Auto-fixable via tools/compat/cli_harmonizer.py"
  digital_twin:
    keywords: [digital twin, digital-twin, Eclipse Ditto, Azure Digital Twins, AWS IoT TwinMaker, what-if simulation, Monte Carlo, pre-apply gate, compliance snapshot, continuous ATO, cATO, model-based, network verification, intent-based networking, path verification]
    priority_boost: 1.3
    auto_triage: true
    notes: "Feeds ICDEV's 7-canvas digital-twin suite (NDC/SDC/PDC/BDC/DDC/ODC/IDC)"
  breach_attack_simulation:
    keywords: [attack path, attack graph, breach and attack simulation, BAS, Caldera, AttackIQ, Cymulate, XM Cyber, SafeBreach, Mandiant Security Validation, Stratus Red Team, Atomic Red Team, adversary emulation, purple team, red team automation, lateral movement path]
    priority_boost: 1.3
    auto_triage: true
    notes: "Feeds SDC (Security Design Canvas) attack-path twin"
  data_lineage:
    keywords: [data lineage, column lineage, OpenLineage, Marquez, DataHub, Atlan, Collibra, Alation, Apache Atlas, Amundsen, Unity Catalog, OpenMetadata, data contract, active metadata, data catalog, schema registry, lineage graph, provenance]
    priority_boost: 1.3
    auto_triage: true
    notes: "Feeds DDC (Data Design Canvas) lineage engine"
  iac_drift:
    keywords: [terraform drift, terraform plan, pre-apply gate, OpenTofu, Pulumi, Spacelift, env0, Firefly, Terrateam, Atlantis, Scalr, tfautomv, tfmigrate, cloud drift, config drift, CSP drift, CloudFormation drift, infrastructure drift]
    priority_boost: 1.2
    auto_triage: true
    notes: "Feeds IDC (Infrastructure Design Canvas) pre-apply + drift engines"
  detection_engineering:
    keywords: [Sigma rule, SigmaHQ, detection engineering, detection-as-code, SIEM rule, Splunk SPL, Elastic KQL, Sentinel KQL, MITRE coverage, attack-navigator, D3FEND, Tidal Cyber, SOC Prime, Panther, Anvilogic, hayabusa, chainsaw, threat hunting, OpenTelemetry detection]
    priority_boost: 1.3
    auto_triage: true
    notes: "Feeds ODC (Observability Design Canvas) MITRE coverage + Sigma generator"
  sbom_supply_chain:
    keywords: [SBOM, CycloneDX, SPDX, SLSA, in-toto, Sigstore, bomber, bomfather, sbom-tool, Syft, Grype, Trivy image, provenance attestation, supply chain attack, package poisoning, build provenance]
    priority_boost: 1.3
    auto_triage: true
    notes: "Feeds BDC (Boundary Canvas) supply-chain + SBOM graph"

# =========================================================================
# Innovation Scoring (D21-style weighted average)
# =========================================================================
scoring:
  weights:
    community_demand: 0.25    # GitHub stars, SO votes, upvotes, issue frequency
    impact_breadth: 0.20      # Number of ICDEV™ tenants/projects potentially affected
    feasibility: 0.15         # Can ICDEV™ build this with existing tools?
    compliance_alignment: 0.15 # Does it strengthen (not weaken) compliance posture?
    novelty: 0.10             # Not already addressed by existing ICDEV™ capabilities
    technical_depth: 0.15     # Phase 71: How concretely does it map to ICDEV™ modules?
  thresholds:
    auto_queue: 0.80          # Score >= 0.80: auto-queue for solution generation
    suggest: 0.35             # Score 0.35-0.79: suggest to human, require approval (lowered from 0.50 — was filtering too aggressively)
    log_only: 0.00            # Score < 0.35: log for trend analysis, no action
  max_auto_solutions_per_pi: 10   # Budget: max auto-generated solutions per PI
  max_signals_per_scan: 500       # Cap signals per scan cycle to prevent overload

# =========================================================================
# Triage Pipeline
# =========================================================================
triage:
  # FORGE fit assessment
  gotcha_fit:
    required_layer: true         # Signal must map to at least one FORGE layer
    layer_mapping:
      goal: [workflow, process, procedure, methodology, best practice]
      tool: [script, utility, generator, scanner, checker, validator, analyzer]
      arg: [configuration, setting, threshold, parameter, tuning]
      context: [reference, template, sample, example, guideline, standard]
      hardprompt: [prompt template, instruction, LLM directive, system prompt]

  # Boundary impact assessment (reuse existing boundary_analyzer.py)
  boundary_check:
    enabled: true
    block_on_red: true           # RED boundary impact blocks auto-generation
    require_coa_for_orange: false # ORANGE no longer blocks — route to suggest tier (was too aggressive, 99 signals blocked)

  # Compliance pre-check
  compliance_check:
    enabled: true
    frameworks_to_validate:
      - nist_800_53
      - fedramp
      - cmmc
    block_on_weakening: true     # Block if innovation weakens compliance posture

  # Duplicate detection
  dedup:
    enabled: true
    similarity_threshold: 0.92   # Cosine similarity for semantic dedup (raised from 0.85 — was deduping distinct signals)
    time_window_days: 60         # Ignore signals similar to recent ones (lowered from 90 days)

  # IP/License check
  license_check:
    enabled: true
    allowed_licenses:
      - MIT
      - Apache-2.0
      - BSD-2-Clause
      - BSD-3-Clause
      - ISC
      - MPL-2.0
      - LGPL-2.1
      - LGPL-3.0
    blocked_licenses:
      - GPL-3.0          # Copyleft risk for Gov/DoD
      - AGPL-3.0
      - SSPL-1.0
      - BSL-1.1

# =========================================================================
# Solution Generation Pipeline
# =========================================================================
solution_generation:
  # Spec generation from signals
  spec:
    use_spec_quality_checker: true  # Run spec_quality_checker.py on generated specs
    use_constitution: true           # Validate against project constitution
    max_spec_length_lines: 500

  # Build pipeline integration
  build:
    use_atlas_workflow: true         # Follow ANVIL/M-ANVIL for builds
    tdd_required: true               # RED -> GREEN -> REFACTOR
    min_test_coverage: 80            # Minimum coverage for generated solution

  # Security scanning
  security:
    sast_required: true
    dependency_audit_required: true
    secret_detection_required: true
    sbom_required: true

  # Marketplace publishing
  marketplace:
    auto_publish_to_local: true      # Auto-publish to tenant-local catalog
    cross_tenant_requires_review: true  # Cross-tenant requires ISSO review
    asset_types_publishable:
      - skill
      - goal
      - tool
      - context
      - hardprompt
      - compliance_extension
      - arg

# =========================================================================
# Divergence step (dvg-wire-02) -- OPT-IN alternatives-before-blueprint
# =========================================================================
# When enabled, generate_solution_spec runs an isolated divergent fan-out for
# the signal BEFORE _build_implementation_blueprint, scores the candidate
# approaches with the separate critic pass, and either picks the highest-scoring
# non-trap approach or surfaces the top clusters for a human. Chosen + REJECTED
# approaches are recorded in the audit trail (rejected are the review value).
# OFF BY DEFAULT: when disabled, generate_solution_spec behaves exactly as
# before. This is a SECOND gate on top of chain_orchestration.divergence.enabled
# in llm_config; both must be on for the step to fan out, and it degrades to the
# single-blueprint path if the chain is disabled or the LLM is unavailable.
divergence:
  enabled: false            # opt-in only; never a default path
  function: innovation_ideation   # routing function the step invokes divergence under

# =========================================================================
# Introspective Analysis (Internal Telemetry)
# =========================================================================
introspection:
  enabled: true
  scan_interval_hours: 12
  signals:
    failed_self_heals:
      enabled: true
      min_confidence: 0.0           # Monitor all failures
      max_confidence: 0.3           # Especially low-confidence ones
    gate_failures:
      enabled: true
      min_frequency: 3              # Only flag gates that fail >= 3 times
      time_window_days: 30
    unused_tools:
      enabled: true
      usage_threshold: 0            # Tools with 0 invocations in period
      time_window_days: 90
    slow_pipelines:
      enabled: true
      latency_threshold_seconds: 300  # Flag stages taking > 5 min
    nlq_gaps:
      enabled: true                 # Questions that return no results
      min_occurrences: 2
    knowledge_gaps:
      enabled: true                 # Self-heal patterns with no resolution
    cli_harmonization:
      enabled: true                 # CLI pattern drift (--json, --project-id, db_utils)
      auto_fix_tool: tools/compat/cli_harmonizer.py
      checks: [cli_json_flag, cli_project_naming, db_path_centralization]

