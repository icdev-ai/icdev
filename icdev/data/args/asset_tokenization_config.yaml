# CUI // SP-CTI
# GovChain — Asset Tokenization Configuration (D-GC-6)

asset_types:
  government_property:
    nsn_required: true  # National Stock Number
    lifecycle_states:
      - procured
      - received
      - in_service
      - maintenance
      - surplus
      - disposed
    fips_required: false
    tracking_fields:
      - serial_number
      - nsn
      - acquisition_date
      - acquisition_cost
      - custodian
      - location

  it_equipment:
    nsn_required: false
    lifecycle_states:
      - procured
      - provisioned
      - deployed
      - operational
      - decommissioned
      - disposed
    fips_required: true  # IT equipment in gov must meet FIPS
    tracking_fields:
      - serial_number
      - make_model
      - ip_address
      - stig_status
      - patch_level

  vehicle:
    nsn_required: true
    lifecycle_states:
      - procured
      - received
      - operational
      - maintenance
      - surplus
      - disposed
    fips_required: false
    tracking_fields:
      - vin
      - registration
      - mileage
      - fuel_type

  communications_equipment:
    nsn_required: true
    lifecycle_states:
      - procured
      - received
      - tested
      - deployed
      - operational
      - decommissioned
    fips_required: true
    tracking_fields:
      - serial_number
      - frequency_band
      - encryption_type
      - certification_date

# State machine — valid transitions
state_transitions:
  procured: [received]
  received: [in_service, provisioned, tested, operational]
  provisioned: [deployed]
  deployed: [operational]
  tested: [deployed, operational]
  in_service: [maintenance, surplus, operational]
  operational: [maintenance, decommissioned, surplus]
  maintenance: [operational, surplus, decommissioned, disposed]
  surplus: [disposed]
  decommissioned: [disposed]
  disposed: []  # terminal state

# Token hash configuration (D-GC-6)
token_hash:
  algorithm: SHA-256
  include_fields:
    - asset_id
    - asset_type
    - serial_number
    - state
    - custodian
    - timestamp
  anchor_to_chain: true  # commit hash to blockchain ledger
