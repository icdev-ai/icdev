# CUI // SP-CTI
# Reading engine thresholds + vocab — drives all 11 FathomDesk PM-style
# narrative readings (Portfolio, Market, Signals, News, Radar, Watchlist,
# Oracle, Evolution, Advisor, Strategist).
#
# Hot-reloaded on file-mtime change — no dashboard restart required.
# Missing keys fall back to safe defaults defined in
# tools/trading/analytics/reading_config.py:_DEFAULTS.

# Shared regime/posture vocab — used across multiple readings.
regime_sets:
  risk_on:        [GREEN, EXPANSION, OPPORTUNITY, STRONG_OPPORTUNITY]
  risk_off:       [CRISIS, DANGER, RED, DEFLATION, STAGFLATION, LIQUIDITY_TRAP]
  inflationary:   [INFLATION, STAGFLATION]
  deflationary:   [DEFLATION, LIQUIDITY_TRAP]
  yellow:         [YELLOW]
  defensive_book: [defensive, low_beta, inverse]
  aggressive_book: [growth_leaning, high_beta]

# Mood scoring (net = bullish - bearish - 0.5 * caution)
mood:
  constructive_min: 2
  cautious_min:     0

# ── /portfolio Reading (portfolio_reading.py) ──────────────────────────────
portfolio:
  beta:
    inverse_max:         0
    defensive_max:       0.5
    low_beta_max:        0.9
    market_tracking_max: 1.1
    growth_leaning_max:  1.5
  sharpe:
    worse_than_cash_max: 0
    weak_max:            0.5
    modest_max:          1
    solid_max:           2
  outperformance:
    trouncing_min: 10
    beating_min:   3
    tracking_min: -3
    trailing_min: -10
  drawdown:
    minimal_max:  3
    contained_max: 8
    normal_max:   15
    sizeable_max: 25
  alpha:
    strong_positive: 5
    modestly_negative: -5
  cash:
    heavy:            40
    comfortable:      20
    fully_invested:   5
  concentration:
    severe:      40
    high:        25
    moderate:    15
    trim_action: 30
  positions:
    concentrated_max: 3

# ── /market Reading (page_readings.generate_market_reading) ────────────────
market:
  breadth:
    strong_min:   65
    moderate_min: 50
    soft_min:     35
  avg_score:
    strong_min: 60
    weak_max:   40
  sector:
    min_tickers_per_sector: 2
    wide_dispersion:        20
    defensive: [Utilities, Consumer Staples, Healthcare, Big Pharma]
    cyclical:  [Technology, Semiconductors, Consumer Discretionary, Financials, Industrials]
  breakeven_5y5y:
    deflation_max:    1.5
    disinflation_max: 2.0
    anchored_max:     2.5
    drifting_max:     3.0
  composites:
    flag_threshold: 2

# ── /signals Reading ──────────────────────────────────────────────────────
signals:
  bull_pct:
    crowded_long:    75
    bearish_max:     30
    balanced_max:    55
    bullish_min:     55
    bearish_skew:    35
  rejected_alert:    5
  confidence:
    high_min: 0.70
    low_max:  0.50
  advisor_agreement:
    weak_max:   20
    strong_min: 70
  regime_mismatch_min_bull_pct: 60

# ── /news Reading ─────────────────────────────────────────────────────────
news:
  geo_danger:
    high:     60
    moderate: 30
  category_dominance_min:  2
  high_impact_threshold:   1.0
  severe_impact_threshold: 3

# ── /radar Reading ────────────────────────────────────────────────────────
radar:
  precursors:
    high:         5
    accumulating: 3
  horizon_diff_threshold: 10
  opp_danger_gap:
    constructive: 20
    defensive:    20

# ── /oracle Reading ───────────────────────────────────────────────────────
oracle:
  query:
    predictions_limit: 200
    convergence_limit: 20
  severity:
    high_alert_min: 3
  direction:
    bullish_min: 70
    bearish_max: 30
  confidence:
    high_min: 0.70
    low_max:  0.50
  lens:
    concentration_max_share: 0.6
    min_lens_count: 2
  vocab:
    long_terms:  [tailwind, bull, long, buy, expansion, opportunity]
    short_terms: [headwind, bear, short, sell, deflation, stagflation, crisis, drawdown, danger]
  min_directional_for_skew: 3

# ── /evolution Reading ────────────────────────────────────────────────────
evolution:
  query:
    signals_limit: 30
  prior_window: 5
  score:
    buy_strong_min:      65
    score_50_neutral:    50  # below this in a BUY/SELL is treated as neutral tone
    bull_strength_min:   60
    significant_change:  5
  confidence:
    significant_change: 0.10
  flips:
    indecisive_min:  3
    stable_min_runs: 3
  strong_coverage_min_runs: 10

# ── /advisor Reading ──────────────────────────────────────────────────────
advisor:
  bull_pct:
    bullish_min: 65
    bearish_max: 30
  conviction:
    high_min:              0.70
    soft_max:              0.50
    bullish_conviction_min: 0.65
  reflex_age_warning_min: 360  # minutes (6 hours)
  regime_mismatch_min_bull_pct: 60

# ── /strategist Reading ───────────────────────────────────────────────────
strategist:
  hedge_pct:
    well_hedged_min:  15
    under_hedged_max: 3
  core_conviction:
    high_min: 70
    soft_max: 50
  freshness:
    stale_age_h: 24
    fresh_age_h: 1

# ── /watchlist Reading (inline in app.py) ─────────────────────────────────
watchlist:
  bull_pct:
    bullish_min: 65
    bearish_max: 30
  avg_score:
    strong_min: 60
    weak_max:   40
  news_impact:
    significant: 1.0
    severe:      3
