# CUI // SP-CTI
# STRATEGOS Oracle — SIO Engine configuration
# ─────────────────────────────────────────────
# Governs the zero-LLM SIO lens runner in intelligence/oracle/sio_engine.py.
#
# lens_weights: per-lens confidence multiplier keyed on BaseSIOLens.name.
#   Default 1.0 (no adjustment). > 1.0 boosts; < 1.0 discounts.
#   Final value is clamped to [0, 1].
#
# min_confidence_threshold: assessments below this value are dropped.
#   Range 0.0–1.0. STANAG 2511 D/4 boundary sits near 0.35; 0.4 catches
#   marginally-doubtful signals while discarding noise.

sio:
  # Confidence multipliers applied per-lens (default 1.0 = no adjustment).
  # Values > 1.0 boost a lens; values < 1.0 discount it.
  # Final confidence is clamped to [0, 1] after multiplication.
  lens_weights:
    baseline_match: 1.0       # Historical case similarity (sg_war_readiness_events)
    indicator_density: 0.9    # Raw indicator saturation across mobilisation axes
    temporal_pattern: 0.8     # Velocity / acceleration of indicator change
  min_confidence_threshold: 0.40

osint:
  # Maximum files processed per FILE_INBOX run (prevents inbox flood).
  file_inbox_max: 500

  # Maximum signals inserted per harvester run (all tiers combined).
  max_signals_per_run: 200

  # Per-source fetch limits.
  acled_fetch_limit: 100        # rows returned by ACLED REST API per call
  telegram_message_limit: 50    # messages fetched per Telegram channel
  fetch_timeout_sec: 30         # HTTP request timeout (seconds)

  # LLM-driven anomaly detection — flags unusual signal spikes or suspicious content.
  anomaly_detection:
    enabled: true
    model: "claude-haiku-4-5-20251001"
    # Primary: Z-score gate for LLM-unavailable fallback (standard deviations above mean).
    # Adapts to actual historical variance — replace fixed ratio with statistical threshold.
    zscore_threshold: 2.5
    # Fallback ratio multiplier when historical std_dev == 0 (all past runs identical).
    spike_threshold: 3.0
    # Minimum signal count before anomaly scoring is attempted.
    min_signals_for_detection: 10
    # Number of recent audit rows used to compute rolling mean and std_dev.
    baseline_window: 10
    # Max signal titles fetched from DB for the LLM prompt (DB query limit).
    sample_size: 30
    # Max titles included in the LLM prompt text (subset of sample_size).
    prompt_titles: 20
    # Max characters per title in the LLM prompt.
    title_truncate_len: 120

  # Internet-tier OSINT sources.
  # internet_required: true  → only fetched in TIER_INTERNET mode
  # internet_required: false → also attempted in TIER_GITLAB / TIER_FILE_INBOX (rare)
  sources:
    - name: "Reuters World News"
      url: "https://feeds.reuters.com/reuters/worldNews"
      type: rss
      internet_required: true

    - name: "BBC World News"
      url: "https://feeds.bbci.co.uk/news/world/rss.xml"
      type: rss
      internet_required: true

    - name: "Al Jazeera"
      url: "https://www.aljazeera.com/xml/rss/all.xml"
      type: rss
      internet_required: true

    - name: "Defense One"
      url: "https://www.defenseone.com/rss/all/"
      type: rss
      internet_required: true

    - name: "CISA Alerts"
      url: "https://www.cisa.gov/uscert/ncas/alerts.xml"
      type: rss
      internet_required: true

    - name: "Bellingcat"
      url: "https://www.bellingcat.com/feed/"
      type: rss
      internet_required: true

    - name: "Kyiv Independent"
      url: "https://kyivindependent.com/feed/"
      type: rss
      internet_required: true

    - name: "RFE/RL (Radio Free Europe)"
      url: "https://www.rferl.org/api/ztqmqvbkmue"
      type: rss
      internet_required: true

    - name: "ISW (Institute for the Study of War)"
      url: "https://www.understandingwar.org/feeds/rss.xml"
      type: rss
      internet_required: true

    - name: "UN OCHA ReliefWeb"
      url: "https://reliefweb.int/updates/rss.xml"
      type: rss
      internet_required: true

    # Jane's Defence — subscription feed. Set url to your licensed endpoint;
    # leave empty to skip.
    - name: "Jane's Defence"
      url: ""
      type: rss
      internet_required: true

    # ACLED — REST API, not RSS. Harvested via _harvest_acled() when
    # ACLED_API_KEY and ACLED_EMAIL env vars are set.
    - name: "ACLED"
      url: ""
      type: acled_api
      internet_required: true

  # GitLab artifact download settings (TIER_GITLAB).
  gitlab:
    # Env: GITLAB_URL, GITLAB_TOKEN, GITLAB_OSINT_PROJECT_ID, GITLAB_OSINT_REF
    job_name: "osint_collect"
    signals_file: "osint_signals.json"
    kg_delta_file: "kg_delta.json"

opencti:
  enabled: false          # set true + configure .env to activate
  url: ''                 # OPENCTI_URL env var override
  api_key: ''             # OPENCTI_API_KEY env var override
  sync_interval_h: 6
  min_confidence: 70
  indicator_limit: 200

red_cell:
  # Vulnerability score [0–10] at or above which a COA finding is surfaced
  # to Oracle (sg_sio_assessments).  STANAG 2511 "HIGH" boundary sits near 7.
  vuln_threshold: 7.0

  # Severity band boundaries [0–10] used in counter-COA narrative labels.
  severity:
    critical: 8.5
    high: 7.0
    moderate: 4.0

  # Allocation weight below which a domain is flagged as a critical gap
  # inside _vulnerability_score() — contributes up to +3.0 pts via bonus.
  thin_domain_threshold: 0.10

  # Allocation weight below which a domain is listed in the counter-COA
  # gap narrative (purely presentational).
  gap_display_threshold: 0.15

  # Weights applied inside _vulnerability_score() raw-score formula.
  entropy_gap_weight: 5.0
  max_gap_weight: 4.0
  critical_bonus_per_gap: 1.5
  critical_bonus_max: 3.0

  # Adaptive anomaly detection — recalibrates vuln_threshold each run from
  # historical assessment data using z-score statistics + optional LLM narration.
  anomaly_detection:
    enabled: true
    model: "claude-haiku-4-5-20251001"
    # Dynamic threshold = mean + (zscore_threshold × std_dev) of recent scores.
    # Adapts automatically as the historical score distribution shifts.
    zscore_threshold: 1.5
    # Number of recent sg_red_cell_assessments rows used for baseline statistics.
    baseline_window: 20
    # Minimum history rows before adaptive calibration activates.
    min_history: 5
    # When true, the calibrated threshold replaces vuln_threshold for this run.
    adapt_vuln_threshold: true
    # ── _compute_anomaly_threshold() parameters (cleaner API) ──
    # Alias for min_history — minimum records before dynamic threshold activates.
    min_records: 5
    # k multiplier: threshold = mean + zscore_k × std_dev.
    zscore_k: 1.5
    # Dynamic threshold is clamped to [min_floor, max_cap].
    min_floor: 5.0
    max_cap: 9.5

signal_scout:
  # Number of top-scored signals inserted into sg_prioritized_signals per run.
  top_n: 20
  # Look-back window for computing prior PMESII-PT distribution (days).
  prior_window_days: 7
  # Minimum composite score required for insertion; signals below are discarded.
  min_composite_score: 0.0
  # Composite score dimension weights (must sum to 1.0).
  weights:
    posterior_shift: 0.35         # KL-proxy for PMESII-PT rarity
    source_discriminability: 0.25 # STANAG A-F source reliability
    temporal_recency: 0.20        # exp(-hours_old / temporal_decay_hours)
    domain_coverage: 0.20         # PIR/CCIR/EEI topic match
  # _posterior_shift_score(): raw KL-divergence cap before normalising to [0, 1].
  # Max theoretical ≈ log(8) ≈ 2.08; 2.5 provides headroom.
  posterior_shift_norm_cap: 2.5
  # _temporal_recency_score(): exp half-life in hours (exp(-hours / decay_hours)).
  temporal_decay_hours: 24.0
  # _domain_coverage_score(): minimum word length for PIR topic keyword matching.
  pir_min_word_len: 4
  # Characters to include per PIR topic match label in rationale.
  pir_topic_truncate: 40
  # LLM-driven anomaly detection — identifies signals with unusual composite scores
  # relative to recent history and optionally narrates the anomaly.
  anomaly_detection:
    enabled: true
    model: "claude-haiku-4-5-20251001"
    # Number of recent sg_prioritized_signals rows used to build baseline statistics.
    baseline_window: 50
    # Minimum history rows before adaptive detection activates.
    min_history: 10
    # Signal is flagged if Z-score exceeds this value (std deviations above mean).
    zscore_k: 2.0
    # Additive boost applied to composite score for LLM-confirmed anomalous signals.
    anomaly_weight: 0.10
    # LLM anomaly_score must meet this floor before the boost applies.
    anomaly_min_score: 0.60
    # Max signals sent to LLM per run (subset of statistical candidates).
    batch_size: 10
    max_tokens: 300
    temperature: 0.1

executor:
  # Ordered list of execution backends tried in sequence.
  # Supported values:
  #   'claude_cli'      Claude Code CLI  (AgentAdapter — tools/agents/adapters/claude_cli.py)
  #   'local_agent'     ICDEV's own rubric-gated agent loop
  #                     (AgentAdapter — tools/agents/adapters/local_agent.py).
  #                     Serves a task when the CLI is absent, e.g. air-gapped.
  #   'gitlab'          GitLab CI pipeline
  #   'github_actions'  GitHub Actions workflow_dispatch
  #   'ollama_local'    local Ollama, single-shot
  #
  # The two AgentAdapter tiers are resolved through
  # tools/agents/registry.pick_default(), so ICDEV_AGENT_ADAPTER overrides this
  # chain for a single run without editing config.
  #
  # DEFAULT ORDER IS DELIBERATE: claude_cli stays primary. 'local_agent' is a
  # legal chain entry but is NOT in the default chain — it moves ahead of
  # gitlab only once hgx-exec-04's parity numbers say it should.
  fallback_chain:
    - claude_cli
    - gitlab
    - github_actions
    - ollama_local

  # GitLab project used when the 'gitlab' executor is active.
  # Set via env var to avoid hardcoding sensitive project IDs.
  gitlab_runner_project_id: "${GITLAB_RUNNER_PROJECT_ID}"

  # GitHub repository used when the 'github_actions' executor is active.
  # Format: owner/repo (e.g. icdev-ai/icdev)
  github_runner_repo: "${GITHUB_RUNNER_REPO}"

  # Maximum simultaneous inference requests to the local Ollama instance.
  ollama_max_concurrent: 1

  # Action when all executors in fallback_chain are unavailable.
  # 'suggest' → surface a recommendation to the user without executing.
  no_executor_action: "suggest"
