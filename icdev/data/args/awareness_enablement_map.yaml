# Awareness Enablement Mapping — Phase 1c
#
# Declarative rules that gate which components are considered
# "enabled" by the Internal Awareness Engine. Each rule matches a
# kg_nodes entry by (entity_type, file_path glob) and lists the
# `.env` flags that must ALL be true for the component to be
# monitored.
#
# Consumed by: tools/awareness/enablement.py :: is_component_enabled
# Source of truth for flag values: .env (ICDEV root)
#
# Behavior:
#   - A component matching ANY rule requires EVERY flag across the
#     matching rules (union) to be true.
#   - A component matching NO rule is considered always-enabled.
#   - Add rules to explicitly gate new subsystems. Removing a rule
#     reverts to default-on.
#
# Whenever .env changes, the cached flag set is invalidated via
# mtime check on next load; downstream consumers can also compare
# enabled_flags_signature() to detect config drift.

mappings:

  # ── Design Canvases ──────────────────────────────────────────
  - entity_type: canvas_module
    path_glob: "tools/boundary_canvas/**"
    requires: [ICDEV_BOUNDARY_ENABLED, ICDEV_BDC_ENABLED]

  - entity_type: canvas_module
    path_glob: "tools/data_canvas/**"
    requires: [ICDEV_DATA_CANVAS_ENABLED, ICDEV_DDC_ENABLED]

  - entity_type: canvas_module
    path_glob: "tools/infra_canvas/**"
    requires: [ICDEV_INFRA_ENABLED, ICDEV_IDC_ENABLED]

  - entity_type: canvas_module
    path_glob: "tools/network_canvas/**"
    requires: [ICDEV_NETWORK_ENABLED, ICDEV_NDC_ENABLED]

  - entity_type: canvas_module
    path_glob: "tools/network/**"
    requires: [ICDEV_NETWORK_ENABLED, ICDEV_NDC_ENABLED]

  - entity_type: canvas_module
    path_glob: "tools/observability_canvas/**"
    requires: [ICDEV_OBSERVABILITY_ENABLED, ICDEV_ODC_ENABLED]

  - entity_type: canvas_module
    path_glob: "tools/pipeline_canvas/**"
    requires: [ICDEV_PIPELINE_ENABLED, ICDEV_PDC_ENABLED]

  - entity_type: canvas_module
    path_glob: "tools/security_canvas/**"
    requires: [ICDEV_SECURITY_ENABLED, ICDEV_SDC_ENABLED]

  - entity_type: canvas_module
    path_glob: "tools/qdc_canvas/**"
    requires: [ICDEV_QDC_ENABLED]

  - entity_type: canvas_module
    path_glob: "tools/migration_canvas/**"
    requires: [ICDEV_MIGRATION_CANVAS_ENABLED]

  - entity_type: canvas_module
    path_glob: "tools/canvas/**"
    requires: [ICDEV_CANVAS_KG_ENABLED]

  # ── Tools scoped to subsystems ───────────────────────────────
  - entity_type: tool
    path_glob: "tools/rag/**"
    requires: [RAG_ENABLED]

  - entity_type: tool
    path_glob: "tools/govcon/**"
    requires: [ICDEV_GOVCON_ENABLED]

  - entity_type: tool
    path_glob: "tools/finetuning/**"
    requires: [FINETUNE_ENABLED]

  - entity_type: tool
    path_glob: "tools/filesync/**"
    requires: [ICDEV_FILESYNC_ENABLED]

  # ── Dashboard routes for canvas pages ────────────────────────
  # path_glob here matches against properties.file_path (the URL
  # rule, not a filesystem path — normalized to forward slashes).
  - entity_type: dashboard_route
    path_glob: "/network*"
    requires: [ICDEV_NDC_ENABLED]

  - entity_type: dashboard_route
    path_glob: "/security*"
    requires: [ICDEV_SDC_ENABLED]

  - entity_type: dashboard_route
    path_glob: "/govcon*"
    requires: [ICDEV_GOVCON_ENABLED]

  - entity_type: dashboard_route
    path_glob: "/cpmp*"
    requires: [ICDEV_GOVCON_ENABLED]

  - entity_type: dashboard_route
    path_glob: "/proposals*"
    requires: [ICDEV_GOVCON_ENABLED]

  - entity_type: dashboard_route
    path_glob: "/filesync*"
    requires: [ICDEV_FILESYNC_ENABLED]

  - entity_type: dashboard_route
    path_glob: "/finetune*"
    requires: [FINETUNE_ENABLED]

  # ── Reflexes tied to subsystems ──────────────────────────────
  - entity_type: reflex
    path_glob: "tools/genesis/reflexes/ingest.py"
    requires: [RAG_ENABLED]

  # Components not matched above (skills, goals, generic tools,
  # MCP servers, a2a agents, db tables, etc.) default to
  # always-enabled. Add explicit rules above as needed.
