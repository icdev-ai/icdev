# CUI // SP-CTI
# SOP Workflows rulebook — the deterministic evidence for this domain.
# Generated by: icdev scaffold docmod-pack sop_workflows --flavor rulebook
#
# WHAT BELONGS HERE: tool, command and platform drift in standard operating
# procedures — an SOP that tells the reader to run a retired CLI, invoke a
# removed subcommand, or drive a build through a decommissioned platform.
#
# WHAT DOES NOT: org-structure or role drift. "This SOP names a team that no
# longer exists" needs an organizational catalog that does not exist in this
# repo. Adding role rules here would mean inventing that catalog inline. File a
# separate pack for it.
#
# Each rule says: "when a document says X, that is out of date, and here is why."
# The verdict comes from the rule, never from an LLM (TRUST rule 1) — the LLM's
# only later role is wording the redline prose around a verdict decided here.
# Findings cite the rule as evidence `rule:<id>`.
#
# Editing this file re-scans every document: the pack hashes these rules as its
# evidence snapshot, so a new rule is picked up on the next sweep.
#
# The rules below are INDUSTRY-WIDE retirements — true regardless of which org
# reads them, each with a dated authority in its rationale. Org-specific drift
# (your own retired deploy script, your own migrated VCS) cannot ship enabled by
# default; see the tunable examples at the bottom of this file.
#
# Defaults if a rule omits them (from args/docmod/packs/sop_workflows.yaml):
#   verdict: deprecated · finding_type: deprecated_tech · severity: medium

rules:

  # ---- CI / CD platforms -------------------------------------------------
  - id: sop-travis-ci
    pattern: '(?i)\bTravis[\s-]?CI\b|\btravis-ci\.org\b'
    verdict: retired
    finding_type: stale_reference
    severity: high
    rationale: >-
      travis-ci.org was shut down 2021-06-15; open-source builds were migrated
      to travis-ci.com and most orgs have since moved to another CI platform.
      An SOP that routes builds through Travis cannot be executed as written.
    replacement: the org's current CI platform (e.g. GitHub Actions, GitLab CI)

  # ---- Container / orchestration tooling ---------------------------------
  - id: sop-docker-compose-v1
    # Matches the v1 binary name but NOT the still-valid docker-compose.yml
    # filename, which Compose V2 continues to read.
    pattern: '(?i)\bdocker-compose\b(?!\.ya?ml)'
    verdict: deprecated
    severity: medium
    rationale: >-
      Docker Compose V1 (the hyphenated `docker-compose` binary) stopped
      receiving updates in June 2023 and is no longer shipped with Docker
      Desktop. Compose V2 is the `docker compose` subcommand.
    replacement: docker compose

  - id: sop-docker-machine
    pattern: '(?i)\bdocker-machine\b'
    verdict: retired
    severity: medium
    rationale: >-
      Docker Machine was deprecated and its repository archived by Docker in
      September 2021. It receives no fixes, including security fixes.
    replacement: Docker Desktop, or a provisioning tool such as Terraform

  - id: sop-helm-init-tiller
    pattern: '(?i)\bhelm\s+init\b'
    verdict: retired
    severity: high
    rationale: >-
      `helm init` installed Tiller, the Helm 2 in-cluster component. Helm 2
      reached end of life 2020-11-13 and Helm 3 removed both Tiller and this
      command — the step fails outright on any current Helm.
    replacement: no equivalent step — Helm 3 requires no initialization

  - id: sop-kubectl-generator-flag
    pattern: '(?i)\bkubectl\b[^\n]{0,80}--generator\b'
    verdict: retired
    severity: high
    rationale: >-
      The `--generator` flag was deprecated in Kubernetes 1.16 and removed in
      1.18; `kubectl run` now only creates pods.
    replacement: kubectl create <resource>, or an applied manifest

  - id: sop-kubectl-export-flag
    pattern: '(?i)\bkubectl\b[^\n]{0,80}--export\b'
    verdict: retired
    severity: medium
    rationale: >-
      `kubectl --export` was deprecated in Kubernetes 1.14 and removed in 1.18.
    replacement: kubectl get -o yaml

  - id: sop-podsecuritypolicy
    pattern: '(?i)\bPodSecurityPolic(?:y|ies)\b'
    verdict: retired
    severity: high
    rationale: >-
      PodSecurityPolicy was deprecated in Kubernetes 1.21 and removed in 1.25.
      A procedure that instructs the reader to author or apply one has no
      corresponding API on a supported cluster.
    replacement: Pod Security Admission, or a policy engine (Kyverno, OPA Gatekeeper)

  - id: sop-gcr-io-registry
    pattern: '(?i)\bgcr\.io\b'
    verdict: retired
    finding_type: stale_reference
    severity: medium
    rationale: >-
      Google Container Registry is deprecated and was shut down in March 2025;
      Artifact Registry is its successor.
    replacement: <region>-docker.pkg.dev (Artifact Registry)

  # ---- Build / packaging commands ----------------------------------------
  - id: sop-python2-invocation
    pattern: '(?i)\bpython\s?2(?:\.\d+)?\b|\bpip2\b'
    verdict: retired
    severity: high
    rationale: >-
      Python 2 reached end of life 2020-01-01 and receives no security fixes.
      Supported distributions no longer ship a `python2` or `pip2` interpreter.
    replacement: python3 / pip3

  - id: sop-easy-install
    pattern: '(?i)\beasy_install\b'
    verdict: retired
    severity: medium
    rationale: >-
      `easy_install` was removed from setuptools in v58.3.0 (2021); the command
      is absent from any current Python environment.
    replacement: pip install

  - id: sop-nosetests
    pattern: '(?i)\bnosetests\b'
    verdict: retired
    severity: medium
    rationale: >-
      The `nose` test runner is unmaintained and does not import on Python 3.10
      or later, so a documented `nosetests` step cannot run.
    replacement: pytest

  - id: sop-apt-key
    pattern: '(?i)\bapt-key\b'
    verdict: deprecated
    severity: medium
    rationale: >-
      `apt-key` is deprecated and is no longer shipped in Debian 12 or Ubuntu
      24.04. Trusting a repository key through it also grants that key
      archive-wide trust, which is why it was withdrawn.
    replacement: a keyring under /etc/apt/keyrings referenced by signed-by=

  # ---- OS / host administration commands ---------------------------------
  - id: sop-net-tools-ifconfig
    pattern: '(?i)\bifconfig\b'
    verdict: deprecated
    severity: low
    rationale: >-
      `ifconfig` ships in the deprecated net-tools package and is absent from
      the default install of most current Linux distributions; iproute2 is the
      maintained replacement.
    replacement: ip addr / ip link

  - id: sop-net-tools-netstat
    pattern: '(?i)\bnetstat\b'
    verdict: deprecated
    severity: low
    rationale: >-
      `netstat` ships in the deprecated net-tools package and is absent from
      the default install of most current Linux distributions; iproute2 is the
      maintained replacement.
    replacement: ss

  - id: sop-wmic
    pattern: '(?i)\bwmic\b'
    verdict: deprecated
    severity: medium
    rationale: >-
      The WMIC command-line utility is deprecated by Microsoft and is disabled
      by default on Windows 11 24H2 and Windows Server 2025.
    replacement: PowerShell CIM cmdlets (Get-CimInstance)

  # ---- Collaboration / hosting platforms ---------------------------------
  - id: sop-hipchat
    pattern: '(?i)\bHipChat\b'
    verdict: retired
    finding_type: stale_reference
    severity: high
    rationale: >-
      Atlassian shut down HipChat on 2019-02-15. A notification or escalation
      step that posts to HipChat has no working destination.
    replacement: the org's current chat platform (e.g. Slack, Microsoft Teams)

  - id: sop-skype-for-business
    pattern: '(?i)\bSkype\s+for\s+Business\b'
    verdict: retired
    finding_type: stale_reference
    severity: medium
    rationale: >-
      Skype for Business Online was retired 2021-07-31 and replaced by
      Microsoft Teams.
    replacement: Microsoft Teams

  - id: sop-bitbucket-server
    pattern: '(?i)\bBitbucket\s+Server\b'
    verdict: retired
    finding_type: stale_reference
    severity: medium
    rationale: >-
      Atlassian ended support for its Server products, including Bitbucket
      Server, on 2024-02-15.
    replacement: Bitbucket Data Center or Bitbucket Cloud

# ---------------------------------------------------------------------------
# ORG-SPECIFIC RULES — uncomment and tune, do not ship as-is
# ---------------------------------------------------------------------------
# The rules above are true for everyone. The drift that actually bites is
# usually local: a deploy script the org retired, a VCS it migrated off. Those
# cannot ship enabled by default because both the pattern and the successor are
# only knowable per deployment. Copy a block, fill in your own names, and
# validate it against a forced scan before enabling the pack.
#
#   # Canonical case: the SOP still routes deploys through a retired Jenkins
#   # job. Narrow the pattern to YOUR script/job names — a bare '\bJenkins\b'
#   # also flags every historical mention and drowns the findings list.
#   - id: sop-org-jenkins-deploy-sh
#     pattern: '(?i)\b(?:run|execute|invoke)\s+deploy\.sh\b|\bJenkins\s+job\s+deploy\b'
#     verdict: retired
#     finding_type: stale_reference
#     severity: high
#     rationale: Deploys moved from the Jenkins deploy.sh job to GitHub Actions on <DATE>, per <CHANGE RECORD>.
#     replacement: the release workflow under .github/workflows/
#
#   # Retired VCS. 'svn' is anchored to its subcommands so it does not match
#   # prose or unrelated tokens.
#   - id: sop-org-subversion
#     pattern: '(?i)\bsvn\s+(?:checkout|co|commit|update|up|merge)\b'
#     verdict: retired
#     finding_type: stale_reference
#     severity: medium
#     rationale: The Subversion server was decommissioned on <DATE>; repositories were migrated to Git per <CHANGE RECORD>.
#     replacement: the equivalent git command
