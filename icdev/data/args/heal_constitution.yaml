# Heal Constitution — MAC-style precondition rules for automated heal actions.
# Loaded by heal.py at startup via _check_constitution().
# All applicable rules must pass before an action executes.
#
# on_violation:
#   block — skip this heal entirely for this cycle
#   hold  — defer to next cycle (recorded as rate_limited)
#
# blocked_types — resolution_type values that are unconditionally prohibited.
# These are hard blockers regardless of confidence or metrics.

version: 1

# Rate limits for the knowledge-layer self-healer (tools/knowledge/self_heal_analyzer.py
# and the MCP self_heal fallback in tools/mcp/knowledge_server.py). Added by ahx-heal-01.
#
# These two limits were previously hardcoded in two modules with no shared
# definition — 3/hour in the analyzer, 5/hour in the MCP fallback — which read as
# a contradiction. It is not one: the scopes differ. The analyzer's limit is
# per-pattern, the MCP fallback's is global across all patterns. Both are real and
# they compose. They are recorded here so the two numbers have one home and the
# difference in scope is stated rather than inferred.
#
# VALUES UNCHANGED from the hardcoded originals — this is a consolidation, not a
# loosening or tightening of the safety posture. Changing either number changes
# how often the system may modify itself unattended; do that deliberately.
rate_limits:
  # Auto-heal only at or above this confidence; always escalate below the floor.
  confidence_threshold: 0.7
  escalation_threshold: 0.3
  # Max auto-heal attempts per hour FOR A SINGLE PATTERN.
  max_heal_attempts_per_pattern_per_hour: 3
  # Max auto-heal attempts per hour ACROSS ALL PATTERNS.
  max_heal_attempts_global_per_hour: 5

blocked_types:
  - deploy
  - build
  - scaffold
  - delete_file
  - push_code

rules:
  - name: min_confidence_floor
    description: "Never apply a healing pattern below the global confidence floor"
    applies_to: all
    min_confidence: 0.70
    on_violation: block

  - name: false_heal_ceiling
    description: "Suspend all auto-healing when false-heal rate is critically high"
    applies_to: all
    # Checked against harness metrics when available; falls through if harness has no data
    max_false_heal_rate: 0.30
    on_violation: block

  - name: regenerate_artifact_confidence
    description: "Artifact regeneration requires higher confidence — external side effect"
    applies_to_types:
      - regenerate_artifact
    min_confidence: 0.80
    on_violation: block

  - name: reinit_db_confidence
    description: "DB reinit has wide blast radius — require highest confidence"
    applies_to_types:
      - reinit_db_table
    min_confidence: 0.88
    on_violation: block

  - name: circuit_breaker_daily_cap
    description: "Cap circuit breaker resets per day to avoid masking real failures"
    applies_to_types:
      - reset_circuit_breaker
    max_per_day: 3
    on_violation: hold

  - name: fix_canvas_rls_bypass_confidence
    description: "Canvas RLS bypass fix edits source files — require high confidence before applying"
    applies_to_types:
      - fix_canvas_rls_bypass
    min_confidence: 0.88
    on_violation: block

# Anomaly-detection parameters for adaptive confidence threshold (heal.py).
# All values formerly hardcoded in _compute_adaptive_confidence_threshold.
anomaly_detection:
  # Fallback threshold when DB has fewer than min_samples patterns
  fallback_threshold: 0.70
  # Minimum number of patterns required to compute a statistical threshold
  min_samples: 10
  # threshold = mean - z_score_factor * std_dev
  z_score_factor: 0.5
  # Clamp bounds for the computed threshold
  threshold_floor: 0.50
  threshold_ceiling: 0.95
