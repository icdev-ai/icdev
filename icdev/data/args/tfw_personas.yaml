# CUI // SP-CTI
# Traffic Flow Walkthrough — Persona Definitions
# Each persona receives a tailored step-by-step walkthrough focused on their role.
# Used by tools/network/narrative_generator.py and the TFW UI persona selector.

personas:

  - id: seceng
    name: "Security Engineer"
    short: "SecEng"
    icon: "shield"
    color: "#e74c3c"
    badge_color: "#c0392b"
    focus: "firewall ACLs, TLS inspection, certificate chains, STIG findings, zero-trust enforcement"
    detail_fields:
      - allowed_ports
      - denied_ports
      - inspection_type
      - acl_rule_applied
      - tls_version
      - cipher_suites
      - certificate_chain
      - mfa_method
      - pki_required
      - cdm_sensor
      - idps_signatures
      - stig_controls
      - zero_trust_gate
    system_prompt: |
      You are responding to a Security Engineer reviewing traffic flow for a security review board.
      At each hop, explain:
      - What ports and protocols are allowed/denied (be specific: TCP/443, UDP/500, ESP)
      - What security inspection occurs (TLS break-and-inspect, IDPS, CDM posture check, WAF, DLP)
      - What STIG or DISA policy applies (cite control IDs where known)
      - What certificates and PKI chain are required (DoD PKI, intermediate CA, CAC/PIV)
      - What zero-trust enforcement happens (identity verification, device trust, micro-segmentation)
      - What would BLOCK this traffic (deny ACL, failed cert, CDM non-compliance)
      Be precise. Use port numbers, algorithm names (AES-256-GCM, SHA-384), and NIST control IDs.
      Format: 2-3 sentences narrative, then bullet list of key security parameters.

  - id: neteng
    name: "Network Engineer"
    short: "NetEng"
    icon: "network"
    color: "#2980b9"
    badge_color: "#1a6fa8"
    focus: "routing tables, BGP, IPSec VPN tunnels, failover, load balancing, ECMP"
    detail_fields:
      - next_hop
      - route_source
      - bgp_as_path
      - bgp_community
      - advertised_prefix
      - vpn_tunnel_id
      - ike_version
      - encryption_algo
      - pfs_group
      - dpd_timeout
      - failover_group
      - failover_rto
      - load_balance_algo
      - ecmp_hash_fields
      - interface
      - mtu
    system_prompt: |
      You are responding to a Network Engineer who needs to understand routing and VPN configuration.
      At each hop, explain:
      - The routing decision: which route was selected, source (BGP, static, OSPF), next-hop IP
      - BGP details if applicable: AS path, BGP community tags, advertised prefixes, neighbor IP
      - IPSec VPN parameters if traversing a tunnel: IKE version, encryption (AES-256-GCM),
        auth (SHA-384), DH group (Group 20 = ECDH P-384), PFS, SA lifetime, DPD keepalive
      - Load balancing: algorithm (ECMP, round-robin, least-conn), session affinity, hash fields
      - Failover: primary/secondary paths, BFD/BGP hold-down timer, expected RTO (convergence time)
      - MTU and fragmentation concerns for IPSec encapsulation overhead
      Be precise. Include interface names, IP addresses where inferrable, and timer values.

  - id: cloudarch
    name: "Cloud Architect"
    short: "CloudArch"
    icon: "cloud"
    color: "#16a085"
    badge_color: "#0d7a65"
    focus: "CSP services, landing zones, inter-cloud peering, CSP-specific controls, costs"
    detail_fields:
      - csp_provider
      - csp_region
      - csp_service
      - landing_zone_tier
      - network_construct
      - inter_csp_mechanism
      - managed_identity
      - csp_firewall_service
      - csp_load_balancer
      - csp_dns_service
      - private_endpoint
      - peering_type
      - egress_cost_estimate
    system_prompt: |
      You are responding to a Cloud Architect designing multi-cloud connectivity.
      At each hop, explain:
      - Which CSP and region handles this hop (AWS GovCloud us-gov-east-1, Azure Gov USGov Virginia, etc.)
      - The specific CSP network construct: AWS Transit Gateway, Azure Virtual WAN Hub, GCP Cloud Interconnect
      - Landing zone tier: IL4 (FedRAMP-High shared), IL5 (dedicated), IL6 (secret)
      - How inter-CSP connectivity works: ExpressRoute + Direct Connect via BCAP, Azure Peering Service,
        AWS Cloud WAN, or direct MPLS from DISA DISN
      - CSP-native security services at this hop: AWS Network Firewall, Azure Firewall Premium,
        GCP Cloud Armor, OCI WAF
      - Identity federation: Azure Entra ID + AWS IAM Identity Center SAML federation,
        OIDC trust relationships between clouds
      - Managed endpoints: AWS PrivateLink, Azure Private Endpoint, GCP Private Service Connect
      - Estimated egress cost implications for this cross-cloud hop
      Use CSP-specific service names and ARNs/resource ID patterns.

  - id: compofficer
    name: "Compliance Officer / ISSO"
    short: "CompOfficer"
    icon: "checklist"
    color: "#f39c12"
    badge_color: "#d68910"
    focus: "NIST 800-53, FedRAMP controls, CMMC, STIG, POA&M, ATO evidence"
    detail_fields:
      - nist_controls
      - fedramp_controls
      - cmmc_practices
      - stig_ids
      - poam_items
      - ato_boundary
      - data_classification
      - audit_log_required
      - continuous_monitoring
      - fips_compliance
      - inherited_controls
      - customer_responsible
    system_prompt: |
      You are responding to a Compliance Officer or ISSO preparing for an ATO or security review.
      At each hop, explain:
      - Which NIST SP 800-53 Rev 5 controls are satisfied here (e.g., SC-8 Transmission Confidentiality,
        SC-28 Protection at Rest, IA-2 Identification and Authentication, AC-17 Remote Access)
      - FedRAMP High baseline control applicability and inherited vs customer-responsible split
      - CMMC Level 2/3 practices covered at this hop
      - DISA STIG IDs applicable (e.g., Network Device STIG, Cloud Computing SRG)
      - What ATO evidence would be generated: system boundary diagram position, SSP section reference,
        continuous monitoring artifact (CDM, SIEM log, vulnerability scan)
      - Open POA&M risk if any control is partially satisfied
      - Data classification and handling requirements (CUI category, IL level)
      - Audit logging requirements (AU-2, AU-3, AU-9) and where logs go (SIEM, DISA ACAS)
      Be specific about control IDs (SC-8(1), IA-2(1), etc.) and FedRAMP impact levels.

  - id: appdev
    name: "Application Developer"
    short: "AppDev"
    icon: "code"
    color: "#9b59b6"
    badge_color: "#7d3c98"
    focus: "service endpoints, latency, auth headers, token flows, DNS, SDK calls, error codes"
    detail_fields:
      - endpoint_url
      - dns_name
      - expected_latency_ms
      - auth_header
      - token_type
      - token_endpoint
      - scopes_required
      - http_method
      - response_code
      - retry_policy
      - timeout_ms
      - sdk_call
      - error_codes
      - tracing_header
    system_prompt: |
      You are responding to an Application Developer who needs to integrate with this infrastructure.
      At each hop, explain:
      - What the application actually calls: endpoint URL, HTTP method, expected response code
      - DNS name resolution path: which resolver, FQDN, TTL, private vs public zone
      - Authentication flow: OAuth 2.0 token endpoint URL, required scopes, token type (JWT/SAML),
        Authorization header format (Bearer <token>), token expiry and refresh strategy
      - Expected latency at this hop and cumulative end-to-end SLA
      - What the app must handle: retry logic (exponential backoff), timeout values,
        specific error codes (401=re-auth, 503=retry with backoff, 403=insufficient scope)
      - SDK or library call: e.g., boto3 STS assume_role(), MSAL acquire_token_silent(),
        google-auth credentials.get_access_token()
      - Distributed tracing: X-Trace-ID / W3C traceparent header propagation
      - Health check endpoint and circuit breaker pattern
      Use code-friendly names and concrete examples developers can put in their config files.

  - id: missionowner
    name: "Mission Owner"
    short: "Mission"
    icon: "flag"
    color: "#27ae60"
    badge_color: "#1e8449"
    focus: "capability impact, risk, team contacts, timeline, mission justification"
    detail_fields:
      - capability_affected
      - risk_level
      - mission_impact_if_down
      - team_responsible
      - escalation_contact
      - expected_availability
      - rto_rpo
      - approval_required
      - classification_handling
      - user_count_affected
    system_prompt: |
      You are responding to a Mission Owner who needs to understand what this traffic flow means
      for their mission capability without deep technical detail.
      At each hop, explain in plain language:
      - What capability is being enabled at this step (e.g., "Users are authenticated before
        accessing the logistics system")
      - Who owns this piece of infrastructure and who to call if it breaks (team name, not individual)
      - Risk level if this hop fails: mission-critical / high / medium / low, and how long until
        users notice (RTO from this hop)
      - Whether mission owner approval is needed for changes to this hop (e.g., BCAP changes
        require DISA coordination, CSP changes require cloud PMO approval)
      - What data classification is flowing and whether the mission is authorized at that level
      - How many users / systems would be impacted if this hop fails
      Keep language non-technical. If a technical term must be used, define it in parentheses.

  - id: ciso
    name: "CISO / Executive"
    short: "CISO"
    icon: "star"
    color: "#d35400"
    badge_color: "#a04000"
    focus: "risk posture, compliance status, open findings, executive summary, recommendations"
    detail_fields:
      - risk_rating
      - compliance_status
      - open_findings_count
      - critical_controls_satisfied
      - recommended_action
      - investment_required
      - timeline_to_remediate
      - mission_risk_if_delayed
    system_prompt: |
      You are responding to a CISO or senior executive who needs a concise risk-focused summary.
      At each hop, provide:
      - Risk rating: CRITICAL / HIGH / MEDIUM / LOW with one-sentence justification
      - Compliance posture: Is this hop covered by an ATO? Any open POA&M items? FedRAMP status?
      - Number and severity of open findings or gaps at this hop
      - Are the critical security controls satisfied? (yes/partial/no — specify which are partial/no)
      - Recommended action if there is a gap: what needs to happen, by whom, by when
      - Estimated investment to remediate any gap (rough order of magnitude)
      - Mission risk if remediation is delayed beyond 30/90/180 days
      Keep it to 4-6 sentences maximum. Executives need signal, not detail.
      Use standard risk language (likelihood/impact) and reference regulatory obligations.

# Cross-cloud context injected into all personas when CSP hops are detected
cross_cloud_contexts:
  aws_govcloud:
    name: "AWS GovCloud (US)"
    regions: ["us-gov-east-1", "us-gov-west-1"]
    il_levels: ["IL2", "IL4", "IL5"]
    fedramp_status: "FedRAMP-High Authorized"
    network_constructs: ["TGW", "VPC", "Direct Connect", "PrivateLink", "AWS Network Firewall"]
    identity: "IAM Identity Center with SAML 2.0 federation"
    connectivity_to_bcap: "Direct Connect via DISA DISN aggregation point"

  azure_gov:
    name: "Azure Government"
    regions: ["USGovVirginia", "USGovArizona", "USGovTexas", "USGovIowa"]
    il_levels: ["IL2", "IL4", "IL5"]
    fedramp_status: "FedRAMP-High Authorized"
    network_constructs: ["Virtual WAN", "VNet", "ExpressRoute", "Private Endpoint", "Azure Firewall Premium"]
    identity: "Entra ID (formerly Azure AD) with SAML 2.0 and OIDC"
    connectivity_to_bcap: "ExpressRoute via DISA DISN"

  gcp_gov:
    name: "Google Cloud (Assured Workloads)"
    regions: ["us-central1", "us-east1"]
    il_levels: ["IL2", "IL4"]
    fedramp_status: "FedRAMP-High Authorized (Assured Workloads)"
    network_constructs: ["Cloud Interconnect", "VPC", "Private Service Connect", "Cloud Armor"]
    identity: "Cloud Identity + Workforce Identity Federation (OIDC/SAML)"
    connectivity_to_bcap: "Cloud Interconnect via DISA DISN"

  oci_gov:
    name: "OCI Government (FedRAMP)"
    regions: ["us-langley-1", "us-luke-1"]
    il_levels: ["IL4", "IL5"]
    fedramp_status: "FedRAMP-High Authorized (DoD regions)"
    network_constructs: ["DRG", "VCN", "FastConnect", "Private Endpoint"]
    identity: "IAM with SAML 2.0 federation"
    connectivity_to_bcap: "FastConnect via DISA DISN"

# Classification-level policy overlays
classification_levels:
  NIPR:
    label: "NIPRNet (Unclassified / CUI)"
    max_il: "IL5"
    encryption: "FIPS 140-2 Level 1+ (TLS 1.2/1.3, AES-256)"
    key_mgmt: "DoD PKI / DISA ACAS"
    mfa: "CAC/PIV or FIDO2"
    network: "DISA NIPRNet, BCAP connection"
    audit_retention: "3 years"

  IL4:
    label: "Impact Level 4 (CUI / FedRAMP-High)"
    max_il: "IL4"
    encryption: "FIPS 140-2 Level 1 (TLS 1.2+, AES-256-GCM)"
    key_mgmt: "DoD PKI"
    mfa: "CAC/PIV mandatory"
    network: "DISA BCAP mandatory, FedRAMP-High CSP only"
    audit_retention: "3 years"

  IL5:
    label: "Impact Level 5 (National Security / Dedicated)"
    max_il: "IL5"
    encryption: "FIPS 140-2 Level 2+ (AES-256-GCM, NSA Suite B)"
    key_mgmt: "DoD PKI + HSM required"
    mfa: "CAC/PIV mandatory + hardware token"
    network: "DISA BCAP mandatory, dedicated CSP tenancy"
    audit_retention: "5 years"

  IL6:
    label: "Impact Level 6 (SECRET)"
    max_il: "IL6"
    encryption: "NSA Type 1 (CSfC or classified cryptography)"
    key_mgmt: "NSA-approved KMS, COMSEC material"
    mfa: "CAC/PIV + biometric"
    network: "SIPRNet, classified BCAP, no commercial internet"
    audit_retention: "10 years"

  SIPR:
    label: "SIPRNet (SECRET)"
    max_il: "IL6"
    encryption: "NSA Type 1 encryption required"
    key_mgmt: "COMSEC material, NSA-approved"
    mfa: "CAC/PIV classified PKI"
    network: "SIPRNet only, air-gapped from NIPRNet"
    audit_retention: "10 years"
