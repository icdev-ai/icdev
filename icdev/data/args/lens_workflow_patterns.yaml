# CUI // SP-CTI
# Oracle Workflow Pattern Lens — Anomaly Detection Thresholds
# External configuration for lens_workflow_patterns.py.
# Edit here to tune thresholds without touching Python source.
# LLM calibration (oracle_anomaly_detection / claude-haiku) overrides these
# at score-time when sufficient data is available; values here are the
# static fallback that also seed the LLM's prior.

# ── Pattern Mining ────────────────────────────────────────────────────────────
# Minimum occurrence count for an N-gram to be reported
min_pattern_freq: 3

# Window sizes (N) for sequential event N-gram mining
window_sizes: [3, 4, 5]

# How many days of audit_trail history to consider
lookback_days: 30

# ── Co-occurrence Detection ───────────────────────────────────────────────────
# Minimum co-occurrence rate (0–1) to flag a tool pair as a composition candidate
cooccurrence_threshold: 0.80

# ── Sparse-Population Fallback Denominators ───────────────────────────────────
# Used when no population distribution is available to normalise against.
# Increase these to make the lens less sensitive when data is thin.
fallback_freq_denominator: 20.0
fallback_session_denominator: 10.0

# ── Self-Healing Detection ────────────────────────────────────────────────────
# Minimum fail-count for an actor/action pair to surface as a self-heal candidate
min_self_heal_fails: 2.0

# Z-score threshold for self-heal adaptive filter (0 = mean, 1 = mean+σ, etc.)
self_heal_z_score: 0.0

# Minimum heal-rate (0–1) above which the Genesis Heal reflex is recommended
heal_reflex_min_rate: 0.70

# ── Reporting Caps (top-N) ────────────────────────────────────────────────────
max_ngrams_reported: 50
max_pairs_reported: 100
max_task_types_reported: 10

# ── Kanban Query Cap ──────────────────────────────────────────────────────────
max_kanban_done: 500

# ── Automation Potential ──────────────────────────────────────────────────────
# Fraction of automated events in a pattern required to classify potential as "high"
automation_high_ratio: 0.5

# ── LLM Threshold Calibration ────────────────────────────────────────────────
# Max tokens for the oracle_anomaly_detection (claude-haiku) calibration call.
# Increase slightly if the LLM returns truncated JSON.
llm_max_tokens: 384

# ── Population Minimums for Anomaly Detection ─────────────────────────────────
# Percentile-rank path: requires at least this many samples
min_population_percentile: 5
# Adaptive-threshold path: requires at least this many samples
min_population_adaptive: 5
# Z-score severity path: requires at least this many samples
min_population_zscore: 3

# ── Adaptive Z Multipliers ────────────────────────────────────────────────────
# Each controls mean + z*σ filter for its scoring path.
# 0.0 = use mean as threshold (more inclusive), higher = stricter.
adaptive_z_ngram: 1.0
adaptive_z_cooccurrence: 1.0
adaptive_z_kanban: 1.0
adaptive_z_heal: 0.0

# ── Z-score Severity Boundaries ───────────────────────────────────────────────
# Events above z_critical standard deviations → severity "critical"
# Events between z_warning and z_critical → severity "warning"
z_critical: 3.0
z_warning: 2.0

# ── Confidence Formula Weights ────────────────────────────────────────────────
# N-gram pattern confidence: weighted sum of frequency score + session consistency
pattern_conf_freq_weight: 0.6
pattern_conf_consistency_weight: 0.4

# Co-occurrence confidence: base + percentile_rank * scale, capped at cap
cooccurrence_conf_cap: 0.95
cooccurrence_conf_base: 0.50
cooccurrence_conf_scale: 0.45

# Kanban task-type confidence
task_conf_cap: 0.90
task_conf_base: 0.40
task_conf_scale: 0.60

# Self-healing candidate confidence
heal_conf_cap: 0.90
heal_conf_base: 0.40
heal_conf_scale: 0.50
