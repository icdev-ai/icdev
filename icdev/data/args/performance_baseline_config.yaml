# CUI // SP-CTI
# ICDEV™ System Performance Baseline Configuration
# Latency thresholds, throughput limits, monitoring endpoints, and resource baselines
# Drives: health checks, CI performance gates, dashboard alerts

system:
  name: "ICDEV Performance Baseline"
  version: "1.0.0"
  classification: "CUI // SP-CTI"
  impact_level: "IL4"

# ---------------------------------------------------------------------------
# 1. Latency Thresholds (milliseconds)
# ---------------------------------------------------------------------------
latency:
  p50_max_ms: 100
  p95_max_ms: 250
  p99_max_ms: 500
  api_response_ms:
    health_check: 50
    memory_write: 150
    memory_read: 100
    hybrid_search: 300
    kanban_status: 80
    dashboard_render: 200
  db_query_ms:
    simple_select: 50
    join_query: 150
    full_text_search: 300
    aggregation: 200

# ---------------------------------------------------------------------------
# 2. Throughput Limits (requests / operations per unit)
# ---------------------------------------------------------------------------
throughput:
  api_rps:
    health_check: 1000
    memory_operations: 200
    kanban_operations: 100
    dashboard_operations: 50
  db_tps:
    read: 500
    write: 100
    mixed_workload: 200
  scan_rate:
    workload_discovery_per_min: 8.4
    component_index_per_min: 50
    coherence_check_per_min: 10

# ---------------------------------------------------------------------------
# 3. Monitoring Endpoints & Metrics
# ---------------------------------------------------------------------------
monitoring:
  health_probe_endpoint: "/api/health"
  metrics_endpoint: "/api/metrics"
  prometheus_port: 9090
  otel_collector_endpoint: "http://localhost:4317"
  dashboards:
    system: "http://localhost:5050/dashboard/performance"
    api_latency: "http://localhost:5050/dashboard/latency"
    throughput: "http://localhost:5050/dashboard/throughput"
  metric_names:
    api_latency_histogram: "icdev_api_latency_seconds"
    db_query_histogram: "icdev_db_query_seconds"
    request_counter: "icdev_requests_total"
    error_counter: "icdev_errors_total"
    active_connections: "icdev_active_connections"
    memory_usage_gauge: "icdev_memory_bytes"
    cpu_usage_gauge: "icdev_cpu_percent"

# ---------------------------------------------------------------------------
# 4. Resource Baselines & Alert Thresholds
# ---------------------------------------------------------------------------
resources:
  cpu:
    baseline_percent: 30
    warn_percent: 70
    critical_percent: 90
  memory:
    baseline_mb: 512
    warn_mb: 1536
    critical_mb: 2048
  disk:
    baseline_gb: 5
    warn_gb: 20
    critical_gb: 40
  network:
    baseline_mbps: 10
    warn_mbps: 100
    critical_mbps: 500

alerting:
  enabled: true
  channels:
    - log
    - dashboard
    - telegram
  cooldown_seconds: 300
  escalation_after_cycles: 3

# ---------------------------------------------------------------------------
# CI Performance Gate
# ---------------------------------------------------------------------------
ci_gate:
  run_baseline_check: true
  fail_on_p95_breach: true
  fail_on_throughput_breach: true
  benchmark_timeout_seconds: 300
  report_path: ".tmp/perf_baseline_report.json"
