# CUI // SP-CTI
# Shared IaC Executor Steps — Canvas-Agnostic (steps 5–12)
#
# These steps are reusable across all ICDEV Studio canvases.
# Canvas is auto-detected from the Generate IaC artifact paths in the run.
# Override per-run with --canvas <slug> if needed.
#
# Include in a canvas workflow after its canvas-specific steps 1–4:
#   step_5: Terraform Plan
#   step_6: Ansible Execute   (syntax/YAML check; Docker or fallback)
#   step_7: Validation Run    (AST parse + dry-run of generated Python script)
#   step_8: Migration Report  (aggregates all step results)
#   step_9: Apply Approval    (HITL gate before deployment)
#   step_10: Terraform Apply  (Docker — mode from executor_modes below)
#   step_11: AWS Config Execute (boto3 post-provisioning verification)
#   step_12: Post-deploy Validation

description: "Shared IaC executor step definitions for all ICDEV Studio canvases"
category: shared
executor_root: tools/studio/executors/

# The executor mode vocabulary — DATA, deliberately not a comment.
# tools/studio/executors/_base.py::detect_mode() is the ONE thing that decides
# which of these a run gets, and tests/cloud/test_workflow_template_modes.py
# asserts these keys ARE its return set and that each one is REACHABLE from the
# environment described beside it. A comment nothing reads is how this block
# went on naming the RETIRED emulator after the seam was renamed to `floci`
# (flx-seam-01 / flx-studio-01): a declaration and the code describing two
# different systems, with nothing going red.
executor_modes:
  aws:     "real AWS account — AWS_ACCESS_KEY_ID set and no emulator endpoint declared"
  floci:   "the local AWS emulator — FLOCI_ENABLED=true"
  sam:     "SAM local — AWS_SAM_LOCAL=true"
  dry_run: "terraform plan only, nothing applied — no credentials, or an endpoint declared while the switch is off"

steps:
  - id: terraform_plan
    name: Terraform Plan
    tool: tools/studio/executors/terraform_plan.py
    node_type: tool
    required: true
    timeout: 300
    description: >
      Runs terraform fmt -check, init -backend=false, validate inside Docker
      (hashicorp/terraform:1.9). Falls back to brace-count heuristic if Docker
      is unavailable. Canvas auto-detected from Generate IaC artifacts.

  - id: ansible_execute
    name: Ansible Execute
    tool: tools/studio/executors/ansible_executor.py
    node_type: tool
    required: true
    timeout: 300
    description: >
      Runs ansible-playbook --syntax-check inside Docker (cytopia/ansible:latest).
      Falls back to PyYAML parse if Docker is unavailable.

  - id: validation_run
    name: Validation Run
    tool: tools/studio/executors/validation_runner.py
    node_type: tool
    required: true
    timeout: 120
    description: >
      AST-parses the generated Python validation script and runs it with
      --dry-run. Reports check catalog and syntax validity.

  - id: migration_report
    name: Migration Report
    tool: tools/studio/executors/migration_reporter.py
    node_type: tool
    required: true
    timeout: 60
    description: >
      Aggregates all step results and artifacts from the run into a final
      Markdown report. Gate: PASS if all required steps passed.

  - id: apply_approval
    name: Apply Approval
    node_type: human
    required: true
    role: infrastructure_approver
    timeout: 86400
    tool: ""
    description: >
      Human gate before applying infrastructure changes to AWS.
      Review the Terraform Plan Report before approving.
      Telegram: reply with /approve <step_run_id> or /reject <step_run_id> [reason].

  - id: terraform_apply
    name: Terraform Apply
    tool: tools/studio/executors/terraform_apply.py
    node_type: tool
    required: true
    timeout: 900
    description: >
      Applies Terraform IaC inside Docker. The mode is chosen by
      _base.py::detect_mode() from the environment — see executor_modes at the
      top of this file for the vocabulary and what selects each one.
      State saved to data/studio_artifacts/<canvas>/tfstate/state_<uid>.tfstate.

  - id: aws_config_execute
    name: AWS Config Execute
    tool: tools/studio/executors/aws_config_executor.py
    node_type: tool
    required: false
    timeout: 600
    description: >
      boto3 post-provisioning: verifies RDS/Neptune/ElastiCache health,
      checks S3 bucket accessibility, stores resource IDs in SSM Parameter Store.
      Canvas-namespaced SSM paths: /icdev/<canvas>/<service>/<key>.

  - id: post_deploy_validation
    name: Post-deploy Validation
    tool: tools/studio/executors/validation_runner.py
    node_type: tool
    required: false
    timeout: 300
    description: >
      Re-runs the validation script against the live infrastructure after apply.

# Teardown executor (used in canvas teardown workflows)
teardown_steps:
  - id: teardown_approval
    name: Teardown Approval
    node_type: human
    required: true
    role: infrastructure_approver
    timeout: 3600
    tool: ""
    description: >
      Confirm destruction of ALL infrastructure in this run.
      IRREVERSIBLE in aws mode. Dry-run mode shows plan only.

  - id: terraform_destroy
    name: Terraform Destroy
    tool: tools/studio/executors/terraform_destroy.py
    node_type: tool
    required: true
    timeout: 900
    description: >
      Finds state file from prior apply run and runs terraform destroy
      -auto-approve in Docker. Deletes state file after successful destroy.
      Falls back to dry-run plan if no credentials are present.
