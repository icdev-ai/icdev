# CUI // SP-CTI
# DDC Workflow — Data Design Canvas
# Full 12-step pipeline: lineage → schema → IaC → DBA gate → validate → apply → verify
#
# Canvas-specific steps (1–4): tools/data/
# Shared executor steps (5–12): tools/studio/executors/  (see shared_iac_executors.yaml)
#
# Modes are auto-detected from the environment by
# tools/studio/executors/_base.py::detect_mode() — the vocabulary is in
# executor_modes below.

description: "DDC: data lineage audit, schema migration, IaC generation, DBA gate, Terraform/Ansible validate, migration report, apply approval, Terraform apply, AWS verification, post-deploy validation"
category: deploy
canvas: ddc

# The executor mode vocabulary — DATA, deliberately not a comment.
# tools/studio/executors/_base.py::detect_mode() is the ONE thing that decides
# which of these a run gets, and tests/cloud/test_workflow_template_modes.py
# asserts these keys ARE its return set and that each one is REACHABLE from the
# environment described beside it. A comment nothing reads is how this block
# went on naming the RETIRED emulator after the seam was renamed to `floci`
# (flx-seam-01 / flx-studio-01): a declaration and the code describing two
# different systems, with nothing going red.
executor_modes:
  aws:     "real AWS account — AWS_ACCESS_KEY_ID set and no emulator endpoint declared"
  floci:   "the local AWS emulator — FLOCI_ENABLED=true"
  sam:     "SAM local — AWS_SAM_LOCAL=true"
  dry_run: "terraform plan only, nothing applied — no credentials, or an endpoint declared while the switch is off"

steps:
  # ── Canvas-specific steps (DDC only) ─────────────────────────────────────
  - id: step_1
    name: Lineage Scan
    tool: tools/data/lineage_scanner.py
    node_type: tool
    required: true
    timeout: 300
    depends_on: []
    description: Audit data lineage graph for all sources in this migration.

  - id: step_2
    name: Schema Check
    tool: tools/data/schema_checker.py
    node_type: tool
    required: true
    timeout: 300
    depends_on: [step_1]
    description: Validate source/target schema compatibility and migration plan.

  - id: step_3
    name: Generate IaC
    tool: tools/data/iac_generator.py
    node_type: tool
    required: true
    timeout: 600
    depends_on: [step_2]
    description: >
      Generate Terraform (.tf), Ansible playbook (.yml), inventory (.ini),
      validation script (.py), and checklist (.md) for this migration.
      Output: data/studio_artifacts/ddc/ — consumed by all downstream steps.

  - id: step_4
    name: DBA Approval
    node_type: human
    required: true
    role: approver
    timeout: 86400
    tool: ""
    depends_on: [step_3]
    description: >
      DBA reviews generated IaC before infrastructure provisioning begins.
      Telegram: /approve <step_run_id> or /reject <step_run_id> [reason].

  # ── Shared executor steps (canvas-agnostic) ───────────────────────────────
  - id: step_5
    name: Terraform Plan
    tool: tools/studio/executors/terraform_plan.py
    node_type: tool
    required: true
    timeout: 300
    depends_on: [step_4]

  - id: step_6
    name: Ansible Execute
    tool: tools/studio/executors/ansible_executor.py
    node_type: tool
    required: true
    timeout: 300
    depends_on: [step_4]

  - id: step_7
    name: Validation Run
    tool: tools/studio/executors/validation_runner.py
    node_type: tool
    required: true
    timeout: 120
    depends_on: [step_4]

  - id: step_8
    name: Migration Report
    tool: tools/studio/executors/migration_reporter.py
    node_type: tool
    required: true
    timeout: 60
    depends_on: [step_5, step_6, step_7]

  - id: step_9
    name: Apply Approval
    node_type: human
    required: true
    role: infrastructure_approver
    timeout: 86400
    tool: ""
    depends_on: [step_5, step_6, step_7]
    description: >
      Human gate before applying infrastructure to AWS.
      Review the Terraform Plan Report before approving.
      Telegram: /approve <step_run_id> or /reject <step_run_id> [reason].

  - id: step_10
    name: Terraform Apply
    tool: tools/studio/executors/terraform_apply.py
    node_type: tool
    required: true
    timeout: 900
    depends_on: [step_9]

  - id: step_11
    name: AWS Config Execute
    tool: tools/studio/executors/aws_config_executor.py
    node_type: tool
    required: false
    timeout: 600
    depends_on: [step_10]

  - id: step_12
    name: Post-deploy Validation
    tool: tools/studio/executors/validation_runner.py
    node_type: tool
    required: false
    timeout: 300
    depends_on: [step_10]
