# CUI // SP-CTI
# FathomDesk — per-strategy Sharpe/drawdown floors.
#
# Consumed by tools/trading/options/preflight.py.  Every proposal is checked
# against these floors before the Execute button is enabled in the AI Assist UI.
#
# Hot-reloadable via mtime check (same pattern as options_risk_gates.yaml).
#
# Strategy names must match STRATEGY_TYPES in tools/fathomdesk/constants.py.

_schema_version: 1

defaults:
  sharpe_min: 1.5
  max_drawdown_pct: 15.0
  paper_default: true
  live_requires_explicit_board_approval: true

# Per-strategy overrides — only set values that differ from defaults.
# Strategies not listed here inherit all defaults.
overrides:
  long_call: {}
  long_put: {}
  covered_call: {}
  cash_secured_put: {}
  bull_call_spread: {}
  bear_put_spread: {}
  iron_condor: {}
  long_straddle: {}
  long_call_butterfly: {}
  iron_butterfly: {}
  calendar_spread: {}
  diagonal_spread: {}
  calendar_butterfly:
    sharpe_min: 1.8
    max_drawdown_pct: 12.0
  risk_reversal_bull: {}
  risk_reversal_bear: {}
  broken_wing_butterfly_call: {}
  broken_wing_butterfly_put: {}
  jade_lizard: {}
  call_backspread: {}
  put_backspread: {}
  naked_put:
    sharpe_min: 2.0
    max_drawdown_pct: 10.0
