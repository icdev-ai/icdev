# CUI // SP-CTI
# Infrastructure Design Canvas — Configuration
app:
  name: "Infrastructure Design Canvas"
  version: "1.0.0"
  classification: "CUI // SP-CTI"

database:
  path: "idc_canvas.db"
  wal_mode: true
  foreign_keys: true

canvas:
  autosave_delay_ms: 3000
  grid_size: 10
  default_width: 110
  default_height: 60
  accent_color: "#00bcd4"

uqs:
  weights:
    infrastructure_hardening: 0.25
    security_posture: 0.25
    compliance_readiness: 0.20
    resilience: 0.15
    runtime_health: 0.15
  thresholds:
    merge: 70
    deploy: 80
    release: 85
  grade_scale:
    A: 90
    B: 80
    C: 70
    D: 60

assessment:
  auto_assess_on_save: true
  default_rules:
    - IDC-ENC-001  # Storage encrypted at rest
    - IDC-ENC-002  # Database encrypted at rest
    - IDC-ENC-003  # KMS / key management present
    - IDC-NET-001  # Compute behind load balancer
    - IDC-NET-002  # Private subnets for data tier
    - IDC-NET-003  # VPC / network segmentation defined
    - IDC-SCL-001  # Autoscaling configured
    - IDC-SCL-002  # Multi-AZ / multi-region for IL5+
    - IDC-REG-001  # Dedicated tenancy for compliance (IL5)
    - IDC-CTR-001  # Container registry is private
    - IDC-CTR-002  # K8s RBAC enforced
    - IDC-CTR-003  # Non-root container user
    - IDC-IAM-001  # IAM roles / service accounts present
    - IDC-IAM-002  # Least-privilege enforced
    - IDC-SEC-001  # Secrets managed (Vault / AWS SM)
    - IDC-BAK-001  # Backup strategy defined
    - IDC-BAK-002  # Recovery time objective (RTO) documented
    - IDC-MON-001  # CSPM tooling present
    - IDC-MON-002  # IaC drift detection enabled
    - IDC-IAC-001  # IaC templates present (Terraform / Ansible)
    - IDC-IAC-002  # IaC scan in CI pipeline
  thresholds:
    min_score: 70
    cat1_max: 0
    cat2_max: 5

gates:
  idc_enc_check:
    tool: "tools/security/sast_runner.py"
    blocking: true
    dimension: security_posture
  idc_iac_scan:
    tool: "tools/security/blueprint_verifier.py"
    blocking: true
    dimension: infrastructure_hardening
  idc_compliance:
    tool: "tools/compliance/multi_regime_assessor.py"
    blocking: false
    dimension: compliance_readiness
  idc_stig:
    tool: "tools/compliance/stig_checker.py"
    blocking: true
    dimension: compliance_readiness
  idc_health:
    tool: "tools/monitor/health_checker.py"
    blocking: false
    dimension: runtime_health
  idc_coverage:
    tool: "tools/testing/test_orchestrator.py"
    blocking: false
    dimension: resilience
    min_coverage: 70

csp_mapping:
  enabled: true
  providers:
    - aws
    - azure
    - gcp
    - oci
    - ibm
    - on_prem

evidence:
  format: "oscal_json"
  retention_days: 365
  auto_emit: true

runbooks:
  auto_execute_confidence: 0.7
  max_auto_per_hour: 5
  cooldown_seconds: 600

templates:
  count: 8
  auto_seed: true

agent:
  auto_trigger_on_canvas_save: true
  auto_trigger_sdc_on_save: true
  auto_trigger_qdc_on_save: true
  cross_canvas_sync: true

logging:
  level: INFO
  audit_enabled: true
