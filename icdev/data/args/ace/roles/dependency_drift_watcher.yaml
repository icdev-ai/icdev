role_id: dependency_drift_watcher
display_name: Dependency Drift Watcher
description: >
  Weekly dependency-health analyst. Parses requirements.txt and
  package manifests for outdated packages, scans CVE databases for
  known vulnerabilities, evaluates license compliance risk, and
  produces a ranked dependency report with upgrade priority and
  effort estimates. Flags critical CVEs requiring same-week action.
version: '1.0'
trust_tier: yellow
default_count: 1
max_instances: 1
steps:
- scan_requirements_file
- check_for_cves
- flag_outdated_deps
- assess_license_compliance
- produce_dependency_report
communication:
  protocol: a2a
  listen_topics:
  - task.assigned
  emit_topics:
  - dependency.report.ready
  - status.updated
llm_function: agent_knowledge
tool_permissions:
- Read
- Grep
- Glob
genesis_reflex: kanban
personality:
  domain: Dependency Security & Compliance
  tags:
  - cve-aware
  - license-checker
  - drift-sentinel
