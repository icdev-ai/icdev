# CUI // SP-CTI
# ICDEV™ Data Mesh — Behavior Configuration
# Managed by FORGE args layer. Change behavior here, never in tool code.

# OpenPolicyAgent — leave blank to disable OPA and use local policy evaluation
opa_url: ''  # Set to http://localhost:8181 when OPA is running

# OpenLineage / Marquez server for lineage event emission
marquez_url: 'http://localhost:5000'

# Classification marking applied to all generated artifacts
default_classification: 'CUI // SP-CTI'

# Governance score threshold: domains/products below this are flagged non-compliant
governance_score_gate: 0.6

# CSP bridge (AWS DataZone, Azure Purview, GCP Dataplex) dry-run default
# Set to false only in production with explicit operator approval
csp_dry_run_default: true

# Data contract test execution mode:
#   'internal'  — pure-Python schema/rule validation, no external tooling required
#   'cli'       — delegates to datacontract-cli binary (requires datacontract-cli>=0.10.0)
contract_test_mode: 'internal'
