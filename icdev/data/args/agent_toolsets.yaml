# CUI // SP-CTI
# Agent toolset bundles for the standalone agent runtime (SAG sag-reg-02).
#
# Each bundle names a bounded set of tools the agent runtime can load, so a small
# local model is never handed the full 440+ tool surface. Tool names resolve
# against the unified discovery registry (tools/agent_runtime/discovery.py), which
# derives schemas FROM the MCP TOOL_REGISTRY plus built-in and @tool-decorated
# tools. Names not present in the registry are dropped with a warning (a registry
# rename never crashes the runtime).
#
# `mutating: true` marks a bundle whose tools change state (file writes, terminal
# execution). Those handlers are routed through the safety gate at dispatch time
# (tools/agent_runtime/dispatch.py); until sag-safe-01 wires the approval UX, the
# default gate fails closed unless ICDEV_SAG_ALLOW_MUTATION=1.
#
# A Studio `node_type: agent` step (hgx-agent-01) names bundles here too, in its
# `agent_tools:` key. It resolves them with the same `resolve_bundles()`, but
# offers the WORKTREE toolset (tools/genesis/rubric_build_tools.py) rather than
# the discovery registry — so the `worktree_*` bundles below are the ones an
# agent node can actually be handed. Naming a registry bundle in an agent step
# is not an error; those tools are reported as unavailable.
#
# A bundle is not an authorization. What a step DECLARES here is intersected with
# what the caller MAY USE, which is decided by the `agent_workflow_tools` section
# of args/security_gates.yaml (gate AGENT-WF-001, hgx-agent-02): default-deny,
# per-tool `min_il` / `required_roles`, and an approved human gate in the same run
# before anything mutating. So adding a tool to a bundle here grants the
# CAPABILITY, never the ACCESS — `run_command` is in the `terminal` bundle below
# and is still refused to an IL4 caller.
#
# This is DATA, not code — add or retune a bundle here without touching Python.

version: 1

bundles:
  file:
    description: >-
      Repo-scoped file access: read and search (read-only) plus a safety-gated
      write. Confined to the repository root.
    tools:
      - read_file
      - search_files
      - write_file        # mutating — safety-gated
    mutating: true

  terminal:
    description: >-
      Allowlisted command execution (python tools/ | python -m tools | python -c),
      reusing the tools/skills/invoke.py allowlist. Safety-gated.
    tools:
      - run_command       # mutating — safety-gated
    mutating: true

  skills:
    description: >-
      Progressive disclosure of the .agents/skills library: list every skill's
      name and description (cheap — bodies are never read, so the cost tracks the
      skill COUNT, not their length), then load one skill's full instructions on
      demand. Both read-only. Cheap enough to add to any role: without them the
      whole propose -> HITL approve -> SKILL.md -> curate lifecycle produces
      artifacts no model ever sees. A load also records a use, which is what
      feeds the curator's idle-archive sweep.
    tools:
      - list_skills
      - load_skill
    mutating: false

  wake:
    description: >-
      Self-suspension (agov-wake-02): stop and be resumed after a duration, at a
      UTC time, when a job completes, or when an event key fires. None of them
      blocks — each records one `agent_wakes` row and returns, so the session can
      end instead of holding itself open to poll. Sleeps are bounded by
      subsystems.wake.max_sleep_seconds; a past time and an over-long sleep are
      both refused, so a confused agent cannot park a session indefinitely.
    tools:
      - sleep_for
      - sleep_until
      - wake_on
      - wake_on_event
    # mutating: each writes a row, so the schemas declare is_read_only: false and
    # the dispatch gate sees them. That flag is a factual claim about state; the
    # separate claim that they cannot ACT is the `reversible` tier in
    # args/agent_approval_policy.yaml, which is what exempts a `note` naming
    # `git push` from being escalated into an approval prompt.
    mutating: true

  worktree_read:
    description: >-
      Read-only inspection of a build worktree: read a file, list a directory,
      grep, glob, and `git diff`, plus the `done` sentinel that ends the loop.
      Every path is resolved and traversal-guarded inside the step's work_dir by
      tools/genesis/rubric_build_tools.py, so this cannot read the wider disk.
    tools:
      - read_file
      - list_files
      - grep_files
      - search_files
      - git_diff
      - done
    mutating: false

  worktree_build:
    description: >-
      worktree_read plus the two edits an agent needs to BUILD in a worktree:
      whole-file write and single-occurrence patch. Both are recoverable (git
      restores them) and both pass the reversibility gate. Pair with `terminal`
      when the agent also needs to run the allowlisted test command.
    tools:
      - read_file
      - list_files
      - grep_files
      - search_files
      - git_diff
      - done
      - write_file        # mutating — safety-gated
      - patch_file        # mutating — safety-gated
    mutating: true

  compliance:
    description: >-
      NIST / FedRAMP / CMMC / STIG compliance artifact generation and lookups.
    tools:
      - nist_lookup
      - control_map
      - crosswalk_query
      - classification_check
      - cui_mark
      - stig_check
      - ssp_generate
      - poam_generate
      - sbom_generate
      - rtm_generate
      - fedramp_assess
      - cmmc_assess
      - oscal_generate
    mutating: false

  browser:
    description: >-
      Drive an audited, scope-limited browser: navigate, read the page as
      indexed interactive elements, click, type, screenshot (oss-browse-03).
      Every navigation is checked against the default-deny allowlist in
      args/browser_scope.yaml (loopback only out of the box), every action is
      charged to a per-run budget, and every action writes an audit_trail row.
    tools:
      - browser_navigate
      - browser_read_state
      - browser_click
      - browser_type
      - browser_screenshot
    # mutating: clicking and typing change state on the far side of the network.
    # default_safety_gate in tools/agent_runtime/dispatch.py denies these unless
    # ICDEV_SAG_ALLOW_MUTATION is set, so the standalone agent cannot reach them
    # by default.
    mutating: true

  security:
    description: >-
      Security scanning, sandboxed execution, ZTA posture, and AI-agent guards.
    tools:
      - scan_code_patterns
      - sandbox_execute
      - confabulation_check
      - validate_agent_output
      - check_mcp_authorization
      - guard_result
      - generate_ai_bom
      - zta_assess
      - zta_posture_check
    mutating: false

  canvas:
    description: >-
      Design-canvas project lifecycle, compliance rollups, and readiness scoring.
    tools:
      - canvas_create_project
      - canvas_list_projects
      - canvas_link_design
      - canvas_unlink_design
      - canvas_compliance_summary
      - canvas_compute_readiness
      - canvas_compliance_gate
    mutating: false

  govcon:
    description: >-
      Government-contracting capture: RFI demand scanning and requirements
      decomposition/readiness.
    tools:
      - rfi_demand_scan
      - decompose_requirements
      - detect_gaps
      - score_readiness
      - generate_bdd
    mutating: false

  kanban:
    description: >-
      Kanban task-board operations (list/get/create/update/move + board summary).
    tools:
      - kanban_list_tasks
      - kanban_get_task
      - kanban_board_summary
      - kanban_create_task
      - kanban_update_task
      - kanban_move_task
      - kanban_queue_plan
    mutating: false

  external_data:
    description: >-
      Read-only access to a customer's own external systems (Splunk, ServiceNow,
      GitHub, ...) through the DataBridge agent broker. Deny-all by default:
      nothing is reachable until a connector and table are granted in
      args/databridge_agent_access.yaml, so adding this bundle to a role grants
      the CAPABILITY, not the DATA. Every call is authorized per-agent, refused
      in air-gap mode, has free-text filters redacted fail-closed before egress,
      and writes an audit row whether allowed or denied.
    tools:
      - databridge_sources
      - databridge_fetch
    mutating: false

# ---------------------------------------------------------------------------
# TOOLS ON THIRD-PARTY MCP SERVERS
#
# Tools discovered from an external MCP server appear in the same registry under
# `ext__<server>__<tool>` and are listed in a bundle by that name, like any other
# tool. No bundle is shipped: the servers list in args/external_mcp_servers.yaml
# is empty and `enabled: false`, so a bundle here would name tools that do not
# exist.
#
# Enabling one is deliberately TWO steps, because they answer different
# questions. args/external_mcp_servers.yaml decides which remote tools ICDEV may
# reach at all (per-server allowlist, classification ceiling, transport). A
# bundle here decides which ROLES get handed them. Enabling a server should not
# hand its tools to every agent that loads a toolset.
#
# `mutating: true` on the bundle, always. ICDEV cannot know whether somebody
# else's tool changes state, and the server's own claim about that is not
# evidence — external tools are never marked read-only, so they always go
# through the dispatch safety gate.
#
#   ticketing:
#     description: >-
#       Read-only ticket lookup via the `ticketing` external MCP server. The
#       server's own allowlist in args/external_mcp_servers.yaml bounds what is
#       reachable; this bundle bounds who may reach it.
#     tools:
#       - ext__ticketing__search_tickets
#       - ext__ticketing__get_ticket
#     mutating: true
