# CUI // SP-CTI
# Endpoint Security Scanner Configuration (D-EPSEC-2)
# Detects API routes missing security safeguards (auth, validation, IDOR).
# Declarative YAML — add new patterns without code changes (D26).
---

# Route detection patterns (per language)
route_patterns:
  python:
    - '@\w+\.(route|get|post|put|delete|patch)\s*\('
    - '@app\.route\s*\('
    - '@bp\.route\s*\('
    - '@blueprint\.route\s*\('
  java:
    - '@(Get|Post|Put|Delete|Patch)Mapping'
    - '@RequestMapping'
  go:
    - 'http\.HandleFunc\s*\('
    - '\.(GET|POST|PUT|DELETE|PATCH)\s*\('
    - 'router\.(Handle|HandleFunc|Get|Post|Put|Delete)\s*\('
  typescript:
    - 'router\.(get|post|put|delete|patch)\s*\('
    - 'app\.(get|post|put|delete|patch)\s*\('
  rust:
    - '#\[actix_web::(get|post|put|delete)\('
    - '\.route\s*\('
  csharp:
    - '\[Http(Get|Post|Put|Delete|Patch)\]'
    - '\[Route\('

# Auth patterns — presence in ±context_window lines means endpoint is secured
auth_patterns:
  python:
    - '@require_role'
    - '@require_auth'
    - '@login_required'
    - '@jwt_required'
    - '@auth_required'
    - 'g\.current_user'
    - 'g\.tenant_id'
    - 'g\.user_id'
    - 'g\.user_role'
    - '@token_required'
    - 'verify_hmac'
    - 'verify_signature'
  java:
    - '@PreAuthorize'
    - '@Secured'
    - '@RolesAllowed'
    - 'SecurityContext'
  go:
    - 'authMiddleware'
    - 'requireAuth'
    - 'AuthRequired'
  typescript:
    - 'authMiddleware'
    - 'requireAuth'
    - 'passport\.authenticate'
    - 'isAuthenticated'
  rust:
    - '#\[authorize\]'
    - 'AuthGuard'
  csharp:
    - '\[Authorize\]'
    - '\[AllowAnonymous\]'

# File-level auth patterns — if found ANYWHERE in the file, all routes
# in that file are considered authenticated.  Handles middleware-based auth
# (Flask before_request, Express app.use, etc.) that lives outside the
# ±context_window around individual route definitions.
file_level_auth_patterns:
  python:
    - 'before_request'
    - 'register_dashboard_auth'
    - 'session\[.user_id.\]'
    - 'session\.get\(.user_id.\)'
    - 'authenticate_request'
    - 'verify_hmac_signature'
    - 'import hmac'
    - '_verify_\w+_signature'
    - '_verify_\w+_token'
    - 'verify_challenge'
    - 'verify_binding'
    - 'from tools\.saas\.auth'
  typescript:
    - 'app\.use\(.*auth'
    - 'app\.use\(.*passport'
  java:
    - 'WebSecurityConfigurerAdapter'
    - 'SecurityFilterChain'
  go:
    - 'Use\(.*authMiddleware'
  csharp:
    - 'AddAuthentication'
    - 'UseAuthorization'

# Input validation patterns — presence means input is validated
validation_patterns:
  python:
    - 'isinstance\s*\('
    - 'validate\s*\('
    - 'schema\.\w+\s*\('
    - '_validate_fields\s*\('
    - 'if\s+not\s+data'
    - 'if\s+["\x27]\w+["\x27]\s+not\s+in\s+data'
    - 'pydantic'
    - 'abort\s*\(\s*4[0-9]{2}'
  java:
    - '@Valid'
    - '@NotNull'
    - '@NotBlank'
    - 'Validator'
  go:
    - 'validate\.Struct'
    - 'binding:"required"'
  typescript:
    - 'Joi\.'
    - 'zod\.'
    - 'class-validator'
  rust:
    - '#\[validate\]'
    - 'serde::Deserialize'
  csharp:
    - '\[Required\]'
    - 'ModelState\.IsValid'

# HTTP methods that require input validation
write_methods:
  - POST
  - PUT
  - PATCH

# Directories where all routes inherit auth from a parent app
# (e.g., Flask blueprints registered on an app with before_request auth,
# or SaaS API gateway middleware setting g.tenant_id/g.user_id).
# Files in these dirs skip the missing-auth check; validation checks still apply.
auth_inherited_dirs:
  - tools/dashboard/api
  - tools/dashboard/templates
  - tools/saas/portal
  - tools/saas/rest_api
  - tools/saas/mcp_http
  - tools/saas/mcp_sse
  - tools/saas/swagger_ui

# Files that generate route code as strings (code generators, not servers).
# Exclude entirely — these are not real endpoints.
exclude_file_patterns_extra:
  - 'child_app_generator.py'
  - 'code_generator.py'
  - 'scaffolder.py'
  - 'claude_md_generator.py'
  - 'db_init_generator.py'
  - 'migration_code_generator.py'
  - 'legacy_analyzer.py'
  - 'claude_dir_validator.py'
  - 'playground/app.py'

# Endpoints exempt from auth checks (health/metrics/public)
exempt_patterns:
  - '/health'
  - '/ready'
  - '/metrics'
  - '/ping'
  - '/favicon'
  - '/static'
  - '/login'
  - '/logout'
  - '/register'
  - '/api_events'

# Severity assignment
# missing_auth is critical (direct exploit path — unauthorized access)
# missing_validation_on_write is high (direct injection / SQLi / XSS vector)
severity:
  missing_auth: critical
  missing_validation_on_write: high
  missing_idor_check: medium

# Scan settings
scan:
  skip_dirs:
    - node_modules
    - .git
    - __pycache__
    - .tox
    - .venv
    - venv
    - .tmp
    - vendor
    - build
    - dist
  exclude_file_patterns:
    - 'test_*.py'
    - '*_test.py'
    - 'conftest.py'
    - '*_test.go'
    - '*Test.java'
    - '*.spec.ts'
    - '*.test.ts'
  # Lines above/below route to search for auth/validation
  context_window_lines: 20
  max_file_size_kb: 500
