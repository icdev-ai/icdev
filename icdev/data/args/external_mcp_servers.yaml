#     command: ["npx", "-y", "@example/mcp-ticketing"]
#     env:
#       EXAMPLE_API_KEY: "env:TICKETING_API_KEY"   # resolved, never inlined
#     tools: [search_tickets, get_ticket]           # allowlist, not a hint
#     classification_ceiling: UNCLASSIFIED
#     enabled: true
#
