# CUI // SP-CTI
# Genesis v2.0 — Autonomous Research Lab Configuration
#
# Controls the always-on Genesis daemon and its 14 Reflexes.
# This is the ARGS layer (FORGE) — change behavior without editing goals/tools.
#
# Override any value via environment variable:
#   ICDEV_GENESIS_ENABLED=true
#   ICDEV_GENESIS_REFLEX_<NAME>_ENABLED=false
#
# Classification: CUI // SP-CTI

classification: "CUI // SP-CTI"

# ── Daemon Defaults ──────────────────────────────────────────────────────────
# Configurable fallback thresholds used when a per-reflex override is absent.
# Moving these out of Python constants lets the anomaly_detection convergence
# layer adapt them over time without code changes.

defaults:
  # Watchdog timeout for any reflex that doesn't set its own cap.
  # Per-reflex override (crx-gen-03): set `reflexes.<name>.max_execution_seconds`
  # (preferred) or the legacy alias `timeout_seconds`. The watchdog in
  # daemon.run_reflex_impl hard-enforces it (thread join-with-timeout); a breach
  # is recorded as a genesis_audit failure row and counts toward the circuit breaker.
  reflex_timeout_seconds: 300
  # Lines-of-code heuristics for stub detection in _classify_reflex_impl.
  stub_loc_min: 10
  stub_loc_full: 15

# ── Intra-cycle reflex ordering (crx-gen-03) ─────────────────────────────────
# A reflex may declare `depends_on: [other_reflex, ...]` under its `reflexes.<name>`
# entry so it runs AFTER those reflexes within the same scheduler cycle (when they
# are also due). This is best-effort intra-cycle ordering — a dependency that is
# not due this cycle is ignored — NOT a cross-cycle blocking DAG. Example:
#   reflexes:
#     doc_modernization_sweep:
#       depends_on: [dep_health_reflex]   # run after the dependency, if both due
#       max_execution_seconds: 900        # hard per-reflex execution cap

# ── A2A Fan-Out ──────────────────────────────────────────────────────────────
# When enabled, reflexes tagged `a2a_eligible: true` are dispatched to an
# A2A agent endpoint instead of running inline.  This enables horizontal
# scaling across multiple daemon processes.
#
# Override gateway URL via env: ICDEV_A2A_GATEWAY_URL

a2a:
  enabled: false          # flip to true once A2A agent network is operational
  gateway_url: "https://localhost:8443"   # Core Orchestrator agent

# ── Master Switch ────────────────────────────────────────────────────────────

enabled: true  # D-GEN-9: enabled for persistent daemon
env_override: ICDEV_GENESIS_ENABLED

# ── Trust Mode ────────────────────────────────────────────────────────────────
# Controls how much autonomy the daemon is granted.
# Valid values: observer | advisor | executor | full
# 'full' preserves existing behavior (all reflexes execute unrestricted).
trust_mode: full

# ── Active Hours ───────────────────────────────────────────────────────────
# Reflexes only run within this window. Outside it, is_due() returns false.
# Interval/continuous reflexes (research, ingest, heal) are also gated.
active_hours:
  enabled: false   # Quiet hours disabled — scheduler runs 24/7 with no time gate.
  start_hour: 9
  end_hour: 23
  timezone: "America/New_York"

# ── LLM Configuration ───────────────────────────────────────────────────────

llm:
  # D-GEN-2: scanner-tier only (zero Claude cost for autonomous ops)
  tier: scanner
  model: qwen3.5-local
  max_tokens: 4096
  timeout_seconds: 120
  # Evolve Reflex may need reasoning — allow phi4 fallback
  evolve_model: phi4-reasoning
  evolve_max_tokens: 8192

# ── Trust Kernel ─────────────────────────────────────────────────────────────

trust_kernel:
  # Risk tiers: GREEN (auto-approve), YELLOW (sandbox+rollback), ORANGE (human review)
  risk_tiers:
    green:
      description: "Non-destructive, read-only operations"
      approval: auto
      sandbox: false
      audit: true
    yellow:
      description: "Reversible writes — worktree sandbox with rollback"
      approval: auto
      sandbox: true
      rollback_window_hours: 72
      audit: true
    orange:
      description: "Code mutation — worktree + test gate + human review"
      approval: human
      sandbox: true
      require_tests_pass: true
      require_complexity_check: true
      audit: true

  # D-GEN-8: circuit breaker — 3 consecutive failures disables Reflex
  #
  # xbm-wake-01: cooldown_minutes was declared here from the start but read by
  # no code, and auto_reenable:false made the breaker a permanent latch.  Three
  # transient GitHub-API outages in June 2026 therefore killed the `scout`
  # reflex outright — it sat dormant for five weeks with nothing logged, and
  # `research` likewise since 2026-06-13.  The cooldown is now implemented as a
  # half-open probe (ReflexStateBase.is_circuit_open): after the window the
  # next scheduled run is allowed through, a success closes the breaker, and a
  # failure re-trips it and restarts the window.  A permanently broken reflex
  # thus retries once an hour instead of never, and says so in the audit log.
  circuit_breaker:
    max_consecutive_failures: 3
    cooldown_minutes: 60
    auto_reenable: true   # half-open retry after cooldown_minutes
    notify_on_trip: true

  # Kill switch
  kill_switch:
    enabled: true
    check_interval_seconds: 10

  # Allowed actions whitelist per risk tier
  allowed_actions:
    green:
      - read_file
      - query_database
      - fetch_rss
      - fetch_url
      - write_data_genesis
      - log_audit
    yellow:
      - read_file
      - query_database
      - fetch_rss
      - fetch_url
      - write_data_genesis
      - write_database
      - create_worktree
      - run_tests
      - commit_worktree
      - publish_draft
      - log_audit
    orange:
      - read_file
      - query_database
      - write_data_genesis
      - create_worktree
      - edit_source_file
      - run_tests
      - run_code_analyzer
      - commit_worktree
      - log_audit

# ── Git Configuration ────────────────────────────────────────────────────────

git:
  lab_branch: v2-genesis
  worktree_base: .tmp/genesis/worktrees
  branch_prefix: genesis/
  rebase_on_main_schedule: weekly  # Sun 00:00
  auto_cleanup_merged_worktrees: true

# ── Data Paths ───────────────────────────────────────────────────────────────

paths:
  exports: data/genesis/exports
  feedback: data/genesis/feedback
  reports: data/genesis/reports

# ── 14 Reflexes ──────────────────────────────────────────────────────────────

reflexes:

  # ── GREEN tier (read-only, auto-approve) ─────────────────────────────────

  research:
    timeout_seconds: 90   # network fetch — cut hangs fast so the loop proceeds
    enabled: true
    risk_tier: green
    a2a_eligible: true    # stateless network fetch — safe to distribute
    schedule: "every 6h"
    description: "Scrape NIST/CISA/DoD feeds, SAM.gov, GitHub trending"
    success_metric:
      name: signals_ingested
      threshold: 0        # >= 0 (0 new = all duplicates = healthy)
      operator: gte
    sources:
      - type: rss
        name: NIST NVD
        url: "https://nvd.nist.gov/feeds/xml/cve/misc/nvd-rss-analyzed.xml"
      - type: rss
        name: CISA Advisories
        url: "https://www.cisa.gov/cybersecurity-advisories/all.xml"
      - type: rss
        name: CISA KEV
        url: "https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json"
      - type: github_trending
        languages: [python, rust, go]
        since: daily

  scout:
    timeout_seconds: 90   # network fetch — cut hangs fast so the loop proceeds
    enabled: true
    risk_tier: green
    a2a_eligible: true    # stateless competitor scan — safe to distribute
    schedule: "daily 10:30"
    description: "Monitor competitor/adjacent GitHub repos for intel"
    success_metric:
      name: briefs_generated
      threshold: 0
      operator: gte
    targets_file: context/genesis/competitors.yaml

  audit:
    enabled: true
    risk_tier: green
    a2a_eligible: true    # read-only self-audit — safe to distribute
    schedule: "daily 09:15"
    description: "Self-audit: code quality, security, compliance, STIG, SbD"
    success_metric:
      name: audit_completed
      threshold: 0
      operator: gte  # Always succeeds (informational)
    checks:
      - code_quality
      - security_scan
      - compliance_check
      - stig_check
      - sbd_assessment

  comply:
    enabled: true
    risk_tier: green
    schedule: "daily 09:00"
    description: "Refresh cATO evidence, regenerate stale SSPs, run crosswalk"
    success_metric:
      name: evidence_freshness_pct
      threshold: 0
      operator: gte  # Informational — always succeeds; alert if < 90 in report

  cato_monitor:
    enabled: true
    risk_tier: green
    schedule: "every 6h"
    interval: 21600  # seconds (6 h)
    description: "Continuous ATO monitoring: run all compliance/* IQE seed queries every 6h; call poam_generator for new violations"
    project_id: sparkpilot
    success_metric:
      name: violations
      threshold: 0
      operator: gte  # Informational — 0 violations is healthy, >0 triggers POAM

  sdc_control_expiry:
    enabled: true
    risk_tier: green
    schedule: "every 4h"
    interval: 14400  # seconds (4 h)
    description: "SDC security control-expiry sweep: flag sc_controls whose review_date is inside an IQR-derived anomaly window (or past); optional Claude Haiku severity triage"
    success_metric:
      name: expiring_controls
      threshold: 0
      operator: gte  # Informational — 0 expiring is healthy, >0 publishes sdc.control.expiring events

  observability_retention:
    enabled: true
    risk_tier: green
    schedule: "every 24h"
    interval: 86400  # seconds (24 h)
    description: "Observability retention: archive-then-prune otel_spans/prov_*/shap_attributions older than the configured window into cold *_archive twins (append-only preserved) so list_traces/trace_stats stay fast. Windows/batch in args/observability_config.yaml trace_retention."
    success_metric:
      name: total_archived
      threshold: 0
      operator: gte  # Informational — 0 archived means nothing was old enough yet

  retention_sweep:
    enabled: true
    risk_tier: green
    schedule: "every 24h"
    interval: 86400  # seconds (24 h)
    description: "Config-driven retention/archival (crx-db-03): applies args/retention_policies.yaml per-table policies. Non-append-only operational tables (agent_execution_traces, kanban_verifications, a2a_task_history) are pruned past keep_days under a per-run cap; append-only/audit tables are archive-to-cold ONLY (never pruned); RAG/observability/PDC self-managed retention excluded. dry_run defaults TRUE (flip in args/retention_policies.yaml after review); every action logged to append-only retention_action_log."
    success_metric:
      name: total_affected
      threshold: 0
      operator: gte  # Informational — 0 affected means nothing was old enough (or dry_run)

  agent_cron_reflex:
    enabled: true
    risk_tier: green
    schedule: "every 1m"
    interval: 60  # seconds (1 min) — near-minute cron resolution
    description: "User-facing cron (sag-cron-01): drains every due job in the durable agent_cron_jobs store. Two exec modes — agent (single-shot SAG runtime turn) and script (allowlisted python tools/... command). Retry with exponential backoff; delivery via log / email (SMTP or on-file outbox) / gateway best-effort. Every run recorded to the append-only agent_cron_runs log."
    success_metric:
      name: ran
      threshold: 0
      operator: gte  # Informational — 0 means nothing was due this tick

  sag_skill_curator:
    enabled: true
    risk_tier: green
    schedule: "every 24h"
    interval: 86400  # seconds (24 h)
    dry_run: true  # report-only until reviewed; flip after confirming what it would archive
    description: "SAG auto-skill curator (sag-skl-01): archives (never deletes) idle, unpinned .agents/skills/icdev-auto-* skills after N idle days; pinned skills retained indefinitely. Tracks use_count/last_activity in sag_skill_registry. Skill PROMOTION stays strictly HITL — this reflex only curates already-promoted skills. dry_run defaults TRUE."
    success_metric:
      name: archived
      threshold: 0
      operator: gte  # Informational — 0 means nothing was idle enough (or dry_run)

  bgp_hijack_monitor:
    enabled: true
    risk_tier: green
    schedule: "every 1h"
    interval: 3600  # seconds (1 h)
    description: "DSOC BGP hijack monitor: withdraw expired RTBH entries (rtbh_manager.auto_expire_rtbh) every 1h; best-effort BGP hijack/route-leak sweep when a pmacct feed with BGP ASN data is reachable (skips gracefully otherwise)."
    success_metric:
      name: actions
      threshold: 0
      operator: gte  # Informational — 0 means nothing expired and no hijack detected
  odc_coverage_refresh:
    enabled: true
    risk_tier: green
    schedule: "every 6h"
    interval: 21600  # seconds (6 h)
    description: "ODC coverage refresh (obx-cov-02): scheduled MITRE ATT&CK coverage recompute per observability design (mitre_coverage_twin.compute_gap_score). Flags designs whose coverage dropped more than the configured threshold (default 15 pts) as od_audit drift events + status=suggested kanban cards. Threshold/cap in args/observability_config.yaml coverage_drift."
    success_metric:
      name: drifted_designs
      threshold: 0
      operator: gte  # Informational — 0 drifted designs is healthy

  ingest:
    timeout_seconds: 90   # network fetch — cut hangs fast so the loop proceeds
    enabled: true
    risk_tier: green
    schedule: "every 4h"
    description: "Watch NIST NVD, CISA KEV, FedRAMP updates → knowledge graph"
    success_metric:
      name: nodes_added
      threshold: 0
      operator: gte
    feeds_file: context/genesis/feeds.yaml

  market:
    enabled: true
    risk_tier: green
    schedule: "daily 10:00"
    description: "Track marketplace module usage/feedback, suggest improvements"
    success_metric:
      name: suggestions_generated
      threshold: 0
      operator: gt

  report:
    enabled: true
    risk_tier: green
    schedule: "weekly Sun 20:00"
    description: "Generate weekly autonomous status report"
    success_metric:
      name: report_delivered
      threshold: 0
      operator: gte  # Boolean — always succeeds
    output_dir: data/genesis/reports
    include_sections:
      - reflex_activity_summary
      - evolve_change_log
      - promotions_and_rejections
      - knowledge_growth_metrics
      - circuit_breaker_status
      - recommendations
    # Recommendation thresholds — moved from hardcoded Python constants so the
    # anomaly_detection layer can adapt them from historical report data at runtime.
    high_failure_rate_threshold: 0.30    # failure_rate > this fraction → high failure recommendation
    nominal_success_rate_threshold: 90.0 # success_rate > this (with no other issues) → all nominal
    anomaly_detection:
      enabled: true
      min_samples: 5               # minimum historical genesis.report.generated events before adaptive mode
      sigma_multiplier: 1.0        # adaptive threshold = mean ± (sigma_multiplier * std)
      fallback_to_static: true     # use static thresholds when history is insufficient
      adaptive_bounds:
        failure_rate_floor: 0.10   # adaptive failure threshold never drops below this
        failure_rate_ceiling: 0.50 # adaptive failure threshold never exceeds this
        success_rate_floor: 70.0   # nominal success threshold never drops below this
        success_rate_ceiling: 99.0 # nominal success threshold never exceeds this

  govcon_scan:
    enabled: true
    risk_tier: green
    schedule: "daily 10:00"
    description: "SAM.gov incremental scan → demand detection → Pulse article bridge"
    success_metric:
      name: govcon_new_opportunities
      target: 0
    outputs:
      - sam_scan_results
      - demand_signals
      - pulse_articles

  socmint:
    enabled: true
    risk_tier: green
    interval_seconds: 21600
    description: "Telegram milblog SOCMINT harvester → sg_socmint_signals"
    success_metric:
      name: socmint_signals_inserted
      target: 0
    outputs:
      - sg_socmint_signals

  # ── YELLOW tier (reversible writes, sandbox + rollback) ──────────────────

  publish:
    enabled: true
    risk_tier: yellow
    schedule: "daily 11:00"
    description: "End-to-end Pulse: demand topic → draft → WriteGuard → staging"
    success_metric:
      name: writeguard_score
      threshold: 0
      operator: gte  # 0 = no topics to publish (ok), >80 = article staged
    target: staging  # D-GEN: staging/draft only, never production
    require_writeguard_pass: true
    require_cui_check: true
    max_articles_per_day: 2
    writeguard_min_score: 80        # absolute floor; anomaly detection may lower it
    anomaly_detection:
      enabled: true
      lookback_days: 30             # how many days of history to sample
      min_history: 5                # minimum posts required before adapting threshold
      z_score_floor: -1.5           # dynamic threshold = mean + z_score_floor * std
      absolute_floor: 60            # never accept articles below this score

  test:
    enabled: true
    risk_tier: yellow
    schedule: "daily 22:00"
    description: "Identify under-tested tools, generate tests, run, commit passing"
    success_metric:
      name: coverage_delta
      threshold: 0
      operator: gte     # "Zero new tests on a clean codebase" is healthy,
                        # not failure. Was `gt 0` — which demanded net new
                        # coverage every run. Relaxed 2026-04-14.
    min_coverage_target: 0.60
    max_tests_per_run: 10

  learn:
    enabled: true
    risk_tier: yellow
    schedule: "daily 22:30"
    description: "Generate training pairs from approved outputs, fine-tune Ollama"
    success_metric:
      name: validation_loss_delta
      threshold: 0
      operator: gte  # 0 = no pairs to generate (ok), > 0 = new pairs created
    pair_generation:
      source_tables:
        - research_signals
        - innovation_signals
        - pulse_posts
      pairs_per_table: 20            # max pair-generation attempts per source table
      min_pass_rate: 0.2
      max_pass_rate: 0.8
    fine_tune:
      base_model: qwen3.5
      method: lora  # LoRA for efficient local fine-tuning
      epochs: 3
      validation_split: 0.2
    # ── Anomaly Detection: adaptive fine-tune readiness threshold ─────────────
    # Threshold moved from hardcoded Python constant (100) so the anomaly_detection
    # layer can adapt it from historical pair accumulation rates without code changes.
    anomaly_detection:
      enabled: true                  # use adaptive threshold based on pair history
      min_samples: 5                 # minimum historical cycle rows before adaptive mode
      sigma_multiplier: 1.0          # threshold = mean + (sigma_multiplier * std)
      fallback_to_static: true       # use fallback_min_pairs when history is insufficient
      fallback_min_pairs: 100        # static fallback: minimum pairs before fine-tune attempt
      adaptive_bounds:
        min_pairs_floor: 20          # adaptive threshold never drops below this

  heal:
    enabled: true
    risk_tier: yellow
    schedule: "continuous"
    interval_seconds: 300
    description: "Pattern-based auto-remediation for known failure patterns"
    success_metric:
      name: mttr_reduction
      threshold: 0
      operator: gte  # 0 = no failures (healthy), > 0 = healed something
    confidence_threshold: 0.7
    max_auto_heals_per_hour: 5
    lookback_hours: 6
    max_failures_per_cycle: 20
    cooldown_minutes: 10

  log_triage:
    enabled: true
    risk_tier: green
    schedule: "every 30m"
    interval_seconds: 1800
    description: "Read .logs/build.ndjson tail, score events with LLM anomaly detection (haiku), deduplicate signatures, create Kanban tasks for unseen anomalies."
    success_metric:
      name: tasks_created
      threshold: 0
      operator: gte
    tail_lines: 500           # NDJSON lines to read per cycle
    build_log: .logs/build.ndjson
    # Anomaly detection — replaces hardcoded level/failed/returncode thresholds
    anomaly_threshold: 0.4    # [0,1] minimum LLM score to classify an event as a failure
    score_batch_size: 20      # events per LLM call (haiku stays cheap at this size)

  failure_triage:
    enabled: true
    risk_tier: yellow
    schedule: "every 30m"
    interval_seconds: 1800
    description: "LLM-assisted review of kanban failures — diagnose via Claude, patch via Ollama, apply in isolated .tmp/autofix/ worktree. Auto-apply gated on ICDEV_AUTOFIX_ENABLED env; automerge gated on ICDEV_AUTOFIX_AUTOMERGE. Confidence ≥ 0.85, task-type whitelist, deny-list, rolling 5/hr rate cap all enforced. See tools/workflow/failure_triage.py"
    success_metric:
      name: failures_triaged
      threshold: 0
      operator: gte  # informational — 0 failures in window is the healthy state
    window_hours: 1          # look back 1h per cycle (dedup marker prevents repeats)
    apply: true              # ask for patch generation; actual apply still needs env flag
    cooldown_minutes: 10     # min gap between consecutive cycles
    max_applies_per_hour: 5  # matches CLAUDE.md self-healing cap

  e2e_runner:
    enabled: true
    risk_tier: green
    schedule: "daily 02:00"
    interval_seconds: 86400  # 24 hours
    description: "Create a nightly Playwright E2E Kanban task (task_type=test); Kanban scheduler picks it up and dispatches to Claude CLI"
    interval_hours: 24
    success_metric:
      name: tasks_created

  qa_agent_reflex:
    enabled: true
    risk_tier: green
    schedule: "every 6h"
    interval_seconds: 21600  # 6 hours
    description: "QA Agent sweep — detect E2E coverage gaps per canvas and schedule targeted Playwright runs via kanban tasks"
    interval_hours: 6
    max_gap_tasks_per_run: 5  # cap gap tasks per cycle to avoid kanban flood
    success_metric:
      name: gap_tasks_created
      threshold: 0
      operator: gte  # 0 = no gaps (healthy); > 0 = gap tasks filed

  coherence_to_kanban_reflex:
    enabled: true
    risk_tier: green
    schedule: "every 6h"
    interval_seconds: 21600
    description: "Diff coherence check results against baseline; file [COHERENCE] kanban bug tasks for new violations only"
    success_metric:
      name: tasks_created
      threshold: 0
      operator: gte

  flaky_tracker_reflex:
    enabled: true
    risk_tier: green
    schedule: "every 12h"
    interval_seconds: 43200
    threshold: 0.15
    min_runs: 5
    description: "Ingest pytest JUnit XML results; file [FLAKY] kanban bug tasks for tests with fail_rate >= 15%"
    success_metric:
      name: total_flaky
      threshold: 0
      operator: gte

  dep_health_reflex:
    enabled: true
    risk_tier: green
    schedule: "every 24h"
    interval_seconds: 86400
    description: "pip check + pip-audit (if available) + outdated scan; file [DEP-HEALTH] kanban tasks for critical/high findings"
    success_metric:
      name: filed_tasks
      threshold: 0
      operator: gte

  dead_code_reflex:
    enabled: true
    risk_tier: green
    schedule: "every 24h"
    interval_seconds: 86400
    description: "Dead code sweep — orphan files, dead functions, import cycles → [DEAD-CODE] kanban tasks"
    success_metric:
      name: dead_items_found
      threshold: 0
      operator: gte

  kanban_stranded_reflex:
    enabled: true
    risk_tier: green
    schedule: "every 24h"
    interval_seconds: 86400
    description: "Reconcile done/validating kanban tasks vs origin/main; file [STRANDED] suggested cards for branches with unmerged commits (built-but-never-merged)"
    success_metric:
      name: stranded_tasks_found
      threshold: 0
      operator: gte

  critical_task_watchdog_reflex:
    enabled: true
    risk_tier: green
    schedule: "every 5m"
    interval_seconds: 300
    description: "Poll for newly-filed critical kanban tasks; emit watchdog_alerts + file-based sidecar notifications in data/alerts/"
    success_metric:
      name: new_critical_tasks
      threshold: 0
      operator: gte

  api_contract_reflex:
    enabled: true
    risk_tier: green
    schedule: "every 6h"
    interval_seconds: 21600
    description: "Hit live API endpoints and validate responses against OpenAPI spec; file [API-CONTRACT] bug tasks for schema drift"
    success_metric:
      name: failed
      threshold: 0
      operator: lte

  route_perf_reflex:
    enabled: true
    risk_tier: green
    schedule: "every 6h"
    interval_seconds: 21600
    threshold_multiplier: 2.5
    min_runs: 5
    description: "Full NAV_ROUTES smoke (auto-persists elapsed_ms to route_perf.db) + p50 latency regression detection; files [PERF] kanban tasks for routes exceeding threshold"
    success_metric:
      name: regressions_found
      threshold: 0
      operator: gte

  cpmp_monitor:
    enabled: true
    risk_tier: yellow
    schedule: "every 3h"
    interval_seconds: 10800
    timeout_seconds: 600
    description: "CPMP proactive surveillance: PMO issue detection, CPARS trajectory alerts, subcontractor noncompliance sweep, 14-day CDRL auto-generation"
    success_metric:
      name: cards_created
      threshold: 0
      operator: gte

  pmo_option_tracker:
    enabled: true
    risk_tier: yellow
    schedule: "daily 06:30"
    interval_seconds: 86400
    timeout_seconds: 300
    description: "Check all pending option periods for approaching exercise deadlines (90/60/30-day windows); create kanban tasks and escalate critical windows"
    success_metric:
      name: alerts_created
      threshold: 0
      operator: gte

  pmo_weekly_report:
    enabled: true
    risk_tier: yellow
    schedule: "every Monday at 07:00"
    interval_seconds: 604800
    timeout_seconds: 300
    description: "AI-narrated weekly portfolio health report: EVM aggregates, overdue deliverables, option countdowns, top issues. Pushes to kanban and data/reports/"
    success_metric:
      name: total_contracts
      threshold: 0
      operator: gte

  slides:
    enabled: true
    risk_tier: green
    schedule: "0 17 * * 5"
    interval_seconds: 604800
    timeout_seconds: 300
    description: "Weekly auto-generated ICDEV™ status deck: pulls canvases, kanban, genesis, capabilities → produces .pptx via Midnight Executive theme"
    success_metric:
      name: slide_count
      threshold: 1
      operator: gte

  kanban:
    enabled: true
    risk_tier: green
    schedule: "continuous"
    interval_seconds: 60  # Check every minute for due tasks + Telegram commands
    description: "Poll kanban_tasks for scheduled tasks past due, move to in_progress, write prompt files"
    success_metric:
      name: tasks_activated
      threshold: 0
      operator: gte

  remediation_lens:
    enabled: true
    risk_tier: yellow
    schedule: "every 60m"
    interval_seconds: 3600
    description: "Canvas remediation full loop: scan → propose → verify → escalate → archive"
    success_metric:
      name: proposals_created
      threshold: 0
      operator: gte         # 0 = no low-score canvases (healthy), >0 = proposals generated
    # Score below which a canvas is flagged for remediation
    score_threshold: 85.0
    # Maximum new proposals this reflex may create per hour (self-healing guardrail)
    max_proposals_per_hour: 5
    # Maximum auto-executions per hour (applies to Genesis-initiated executions)
    max_auto_executions_per_hour: 3
    # Re-notify about pending proposals that have been waiting this long
    notify_after_minutes: 30

  # ── ORANGE tier (code mutation, human review required) ───────────────────

  evolve:
    enabled: true
    risk_tier: orange
    schedule: "daily 21:30"
    description: "Autoresearch-style: pick worst tool → improve → test → keep/discard"
    success_metric:
      name: test_pass_and_complexity
      # Both must pass: test_pass_rate >= baseline AND complexity_delta <= 0
      composite:
        - name: test_pass_rate_delta
          threshold: 0
          operator: gte
        - name: complexity_delta
          threshold: 0
          operator: lte
    selection_strategy: worst_code_quality  # Pick tool with highest complexity/smells
    max_files_per_cycle: 1  # Autoresearch lesson: ONE file per mutation
    allowed_directories:
      - tools/
      - goals/
      - args/
      - context/
    forbidden_files:
      - CLAUDE.md
      - .env
      - tools/db/storage.py  # Critical infrastructure, no auto-mutation
      - tools/genesis/daemon.py  # No self-modification of the daemon itself
    require_human_merge: true
    # ── Feature: Variant Archive (DGM-inspired) ──────────────────────────────
    # Store accepted AND rejected mutation variants for learning context
    archive:
      enabled: true
      path: data/genesis/evolve_archive
      max_variants_per_tool: 10
    # ── Feature: Meta-Evolve (self-modifying selection strategy) ─────────────
    # Rotates selection strategy when acceptance rate drops below threshold
    meta_evolve:
      enabled: false  # Off by default, opt-in
      evaluate_every_n_cycles: 10
      strategies:
        - worst_code_quality
        - most_failures
        - highest_churn
        - lowest_coverage
      min_acceptance_rate: 0.20
    # ── Feature: Peer-Review Gate (Hyperagents-inspired) ─────────────────────
    # Lightweight LLM diff review before running full test suite
    peer_review:
      enabled: false  # Off by default
      reviewer_function: wg_coherence_check  # Scanner tier in LLM router
    # ── Anomaly Detection: adaptive thresholds for code quality filtering ─────
    # Thresholds moved from hardcoded Python constants so the anomaly_detection
    # layer can adapt them at runtime without code changes.
    anomaly_detection:
      enabled: true                # use population-variance based adaptive thresholds
      min_samples: 10              # minimum code_quality_metrics rows before adaptive mode
      sigma_multiplier: 0.5        # threshold = mean ± (sigma_multiplier * std)
      fallback_to_static: true     # use static fallbacks when data is insufficient
      fallback_smell_threshold: 1.0             # static fallback: smell_count > this
      fallback_maintainability_threshold: 50.0  # static fallback: maintainability_score < this
      adaptive_bounds:
        smell_threshold_floor: 1.0   # adaptive smell threshold never drops below this
        maint_threshold_floor: 0.0   # adaptive maint threshold never drops below this
    # ── Confidence tier thresholds ────────────────────────────────────────────
    # GKP confidence values per quality-gate outcome. Tune without code changes.
    thresholds:
      min_confidence: 0.50        # reject variant if confidence falls below this
      expedited_review: 0.55      # confidence >= this → expedited_review status
      auto_promotable: 0.70       # confidence >= this → auto_promotable status
      confidence_tiers:
        tests_failed: 0.35
        low_risk_improved: 0.75
        low_risk: 0.65
        medium_risk_improved: 0.60
        medium_risk: 0.50
        high_risk: 0.45
        sandbox_penalty: 0.10     # subtracted when sandbox verification fails

  docs:
    enabled: true
    risk_tier: green
    schedule: "daily 09:30"
    description: "Documentation drift detection — stale refs, missing docs, manifest drift, route drift"
    success_metric:
      name: docs_drift_count
      threshold: 0
      operator: gte     # Finding drift = healthy detection, not failure.
                        # Was `lte 0` — which demanded zero drift, contradicting
                        # the reflex's purpose. Flipped 2026-04-14 after three
                        # consecutive trips.
    checks:
      stale_feature_docs: true
      missing_feature_docs: true
      manifest_drift: true
      claude_md_route_drift: true
      readme_staleness: true

  # ── Phase 67 — Bayesian Autoresearch (D-AR-9) ──────────────────────────────

  experiment:
    enabled: true
    risk_tier: orange
    schedule: "daily 15:00"
    description: "Bayesian Autoresearch — Karpathy-loop autonomous experiments"
    success_metric:
      name: experiments_accepted_pct
      threshold: 0
      operator: gte
    signal_score_threshold: 0.70  # static fallback when adaptive is disabled or has insufficient data
    adaptive_threshold:
      enabled: true
      z_factor: 0.5     # mean + 0.5*std selects top ~31% of a normal distribution
      min_samples: 10   # minimum scored signals required before using adaptive mode
    max_experiments_per_run: 3
    export_gkp: true
    domains:
      - compliance
      - code_quality
      - security

  # ── Phase 72 — Adaptive Skill Synthesizer (Hermes adaptation) ──────────────

  synthesize:
    enabled: true
    risk_tier: yellow
    schedule: "weekly Wed 12:00"
    description: "Detect recurring tool patterns, generate FORGE goal workflow drafts"
    success_metric:
      name: patterns_detected
      threshold: 0
      operator: gte  # 0 = no patterns (healthy), > 0 = new patterns found
    # Thresholds moved from hardcoded Python constants — anomaly_detection layer
    # adapts min_pattern_frequency at runtime without code changes.
    min_pattern_frequency: 3
    min_chain_length: 3
    lookback_days: 7
    max_gap_seconds: 300
    top_k: 20
    session_ids_cap: 10
    max_goals_per_run: 3
    # Confabulation risk threshold — moved from hardcoded 0.6 constant so the
    # anomaly_detection layer can adapt it from historical flag rates at runtime.
    confabulation_risk_threshold: 0.6   # static fallback: flag goal when risk_score >= this
    confabulation_anomaly_detection:
      enabled: true                     # use adaptive threshold based on historical flag history
      min_samples: 5                    # minimum canvas_ai_decisions rows before adaptive mode
      sigma_multiplier: 0.5             # threshold = mean + (sigma_multiplier * std) of past scores
      fallback_to_static: true          # use confabulation_risk_threshold when data is sparse
      adaptive_bounds:
        threshold_floor: 0.3            # adaptive threshold never drops below this
        threshold_ceiling: 0.9          # adaptive threshold never exceeds this
    # Adaptive IQR-based frequency threshold (anomaly_detection paradigm).
    # When enabled, min_pattern_frequency becomes a fallback used only when
    # there are fewer than min_samples distinct n-grams in the dataset.
    anomaly_detection:
      enabled: true          # replace static threshold with IQR-based detection
      min_samples: 4         # minimum distinct n-grams before adaptive mode activates
      sensitivity: 1.0       # IQR multiplier: 1.0 = Q3 (75th percentile), 2.0 = upper fence
      fallback_to_static: true  # use min_pattern_frequency when data is insufficient
      frequency_floor: 2     # adaptive threshold never drops below this

  # ── Goal Learner — Self-Improving Goals from Experience ─────────────────────

  goal_learner:
    enabled: true
    risk_tier: yellow
    schedule: "daily 20:00"
    description: "Detect novel problem-solving not covered by existing goals, auto-generate FORGE goal files"
    success_metric:
      name: goals_generated
      threshold: 0
      operator: gte  # 0 = no novel events (healthy), > 0 = new goals learned
    novelty_threshold: 0.6     # minimum novelty score (0–1) to qualify for goal generation
    min_evidence_count: 2      # minimum audit+kanban events a domain must have to qualify
    max_goals_per_run: 3       # cap on goals emitted per scan
    lookback_days: 7           # audit/kanban look-back window
    quality_weights:           # scoring dimension weights (must sum to 1.0)
      novelty_score: 0.40
      evidence_count: 0.25
      domain_clarity: 0.20
      tool_coverage: 0.15
    evidence_count_normalizer: 4.0  # (count-1)/N → 1.0 at 5+ events
    domain_clarity_divisor: 10.0   # avg keyword length ÷ N → 1.0 at 10-char avg
    tool_coverage_placeholder: 0.5  # static until tool-analysis is implemented
    max_audit_events: 500           # LIMIT for genesis_audit scan query
    max_kanban_completions: 200     # LIMIT for kanban_tasks completions query
    top_terms_count: 60             # top-N frequency terms used for domain clustering
    max_keywords_per_domain: 30     # keyword cap stored per domain
    write_files: true               # write suggested goal .md files to data/genesis/suggested_goals/
    # Adaptive threshold via anomaly detection — inherits convergence.anomaly_detection
    # when not set here; local keys override the global block.
    anomaly_detection:
      min_samples: 5    # min historical records before adaptive threshold activates
      z_score: 2.0      # std deviations above historical mean sets the threshold

  # ── Oracle Predictive Intelligence (tools/oracle/) ──────────────────────────

  oracle:
    enabled: true
    risk_tier: green
    a2a_eligible: true    # multi-lens analytics — safe to distribute
    schedule: "daily 08:00"
    description: "Multi-lens predictive intelligence — trends, risks, opportunities, horizon, compliance, knowledge gaps"
    success_metric:
      name: predictions_generated
      threshold: 0
      operator: gte  # 0 = no signals to analyze (healthy), > 0 = predictions produced
    lenses:
      - trend
      - risk
      - opportunity
      - horizon
      - compliance
      - knowledge
    min_confidence_for_gkp: 0.4   # Only emit GKP for medium/high confidence predictions
    max_predictions_per_lens: 5

  # ── Internal Awareness Engine (D-AWARE-1 through D-AWARE-5) ─────────────────

  awareness:
    timeout_seconds: 900   # heavy reflex — needs > default 300s
    enabled: true
    risk_tier: green
    a2a_eligible: true    # component indexing is read-heavy — safe to distribute
    schedule: "every 3h"
    interval_seconds: 10800  # 3 hours — user-approved cadence
    cooldown_minutes: 60     # Minimum gap between consecutive cycles
    description: "Internal Awareness Engine — index components, probe health, detect drift, scan gaps, promote suggested kanban cards"
    success_metric:
      name: awareness_cycle_complete
      threshold: 0
      operator: gte  # 0 = cycle ran (always succeeds — findings are informational)
    promotion_threshold: 0.7  # Oracle confidence threshold for kanban card creation
    config_path: args/awareness_config.yaml  # Full config — probes, gaps, oracle, narrative

  # ── IDP Score Recorder (per-component scorecard history — idp-score-03) ─────
  # Deliberately on the awareness beat: awareness is what refreshes
  # awareness_component_health, the source of the `probes-healthy` rule's facts,
  # so a point recorded on the same cadence is scored against fresh probe data.
  # Whether a point is actually DUE is decided by the scorecard's own
  # `evaluation.window` (args/scorecards/<key>.yaml) — with the shipped 24h
  # window this writes once a day and skips the other seven cycles. Shortening
  # that window is a YAML edit; no code change and no config change here.

  idp_score_recorder:
    enabled: true
    risk_tier: green
    a2a_eligible: true    # read-heavy IQE evaluation — safe to distribute
    schedule: "every 3h"
    interval_seconds: 10800  # 3 hours — matches the awareness cycle
    cooldown_minutes: 60
    timeout_seconds: 300
    depends_on: [awareness]  # score against the probe data this cycle refreshed
    description: "Persist a scorecard evaluation per component per evaluation window so score and ladder-level trend are answerable"
    success_metric:
      name: rows_written
      threshold: 0
      operator: gte  # 0 = the window was already recorded; skipping is healthy
    if_due: true      # false = write a point every cycle (backfill/demo only)

  # ── IDP Delivery Events (keep the DORA window from emptying again) ──────────
  # /api/sre/dora reads a rolling 30-day window, so a one-off backfill decays:
  # every event it emitted ages out and the endpoint returns to
  # metrics_assessed: 0 with nobody having changed a line. This is the writer
  # that keeps the four keys measurable. The sync is incremental and idempotent,
  # so a cycle with no new merges writes nothing and still succeeds.

  idp_delivery_events:
    enabled: true
    risk_tier: green
    a2a_eligible: true    # reads the kanban ledger, appends events — no LLM
    schedule: "every 6h"
    interval_seconds: 21600  # 6 hours — matches CADENCE_HOURS in the reflex module
    cooldown_minutes: 120
    timeout_seconds: 300
    description: "Emit DORA delivery events (deployment_initiated / deployment_failed / ci_pipeline_runs) for changes that landed since the last cycle"
    days: 7           # steady-state look-back; a cold install backfills via the CLI --days 90
    dry_run: false
    success_metric:
      name: deploy_events
      threshold: 0
      operator: gte  # 0 = no new merges this cycle; a quiet platform is healthy

  # ── Self-Monitor (project internal health into operator-facing /monitoring) ──

  self_monitor:
    enabled: true
    risk_tier: green
    schedule: "every 30m"
    interval_seconds: 1800   # 30 minutes — short cadence; only re-runs the cheap http probe
    cooldown_minutes: 20
    description: "Project Internal Awareness health snapshots into operator alerts + failure_log so /monitoring reflects real platform health"
    success_metric:
      name: alerts_firing
      threshold: 0
      operator: gte  # 0 firing = healthy; >0 surfaces real failures (always succeeds)
    refresh_probes: [http_head]   # cheap probes re-run live each cycle; others reused from awareness
    min_fail_to_alert: 1          # static fallback: per-category failing count before an alert fires
    # Persist this cycle's numbers to metric_snapshots. The table's other two
    # writers (metric_collector, log_analyzer) are CLI-only and need a metrics
    # backend that is not deployed, so this reflex is its live producer.
    record_metrics: true
    metrics_project_id: icdev-tools-rtm
    max_failure_rows: 200         # cap failure_log inserts per cycle
    max_snapshot_age_hours: 168   # ignore failures whose latest probe is >7d old (stale/abandoned)
    # Adaptive min_fail_to_alert — threshold moved from hardcoded Python constant so the
    # anomaly_detection layer can raise the bar when a category has many historical
    # failures (normal noise) and keep it low when failures are rare (high signal).
    # Uses daily failure_log insert counts: adaptive = mean + sigma_multiplier * std,
    # bounded to [min_fail_floor, min_fail_ceiling]. Falls back to min_fail_to_alert
    # until min_samples days of history accumulate.
    anomaly_detection:
      enabled: true                # use adaptive threshold based on historical failure_log data
      min_samples: 10              # minimum days of history before adaptive mode activates
      sigma_multiplier: 1.0        # adaptive = mean + (sigma_multiplier * std)
      fallback_to_static: true     # use min_fail_to_alert when history is insufficient
      history_days: 30             # rolling look-back window for daily failure counts
      adaptive_bounds:
        min_fail_floor: 1          # adaptive threshold never drops below this
        min_fail_ceiling: 20       # adaptive threshold never exceeds this
      # Per-category guidance thresholds for the LLM anomaly classifier.
      # Moved from hardcoded strings in _ANOMALY_SYSTEM_PROMPT so operators can
      # adjust anomaly sensitivity per category without code changes.
      # Each entry: {guidance: <text>, noise_max: <int>, anomalous_min: <int>}
      category_thresholds:
        module_import:
          guidance: "any failure (>=1) is critical and anomalous"
          noise_max: 0
          anomalous_min: 1
        http_head:
          guidance: "1-3 route errors may be noise; 5+ is anomalous"
          noise_max: 3
          anomalous_min: 5
        coherence_status:
          guidance: "1-2 may be transient; 3+ is anomalous"
          noise_max: 2
          anomalous_min: 3
        twin_probe:
          guidance: "treat like coherence_status (1-2 transient; 3+ anomalous)"
          noise_max: 2
          anomalous_min: 3
        "gap::tool_not_in_manifest":
          guidance: "informational; <=4 is not anomalous"
          noise_max: 4
          anomalous_min: 5

  # ── Integrity Monitor (SIPA self-assessment of ICDEV's own tools/) ──────────

  integrity_monitor:
    timeout_seconds: 900     # heavy reflex — AST-scans the whole tools/ tree
    enabled: true
    risk_tier: green
    schedule: "every 6h"
    interval_seconds: 21600  # 6 hours — ICDEV's own code changes slowly
    cooldown_minutes: 120
    description: "SIPA self-assessment of ICDEV tools/ (Mode A) — open a Kanban card per NEW unauthorized/high-risk capability vs the last baseline; deduped so it never re-alerts"
    target: tools            # path to assess (repo-relative); blank => <repo>/tools
    mode: aware              # provenance-aware Mode A vs the platform RTM
    success_metric:
      name: integrity_cards_opened
      threshold: 0
      operator: gte         # 0 new capabilities = clean; >0 surfaces real drift (always succeeds)

  # ── Harness (eval-harness metrics/degradation sweep + co-learning) ──────────

  harness:
    timeout_seconds: 300     # check_gates + 30d metric windows + optional LLM co-learning/meta passes
    enabled: true
    risk_tier: green
    schedule: "every 6h"
    interval_seconds: 21600  # 6 hours — evaluation gates change slowly
    cooldown_minutes: 120
    description: "Eval-harness metrics/degradation sweep — check_gates() over 30-day windows opens a Kanban degradation card per metric below threshold (deduped); when ICDEV_HARNESS_COLEARN is enabled, runs NOVA ECHO batch reflexion + heuristic co-learning + daily meta-harness review to propose amendments"
    dry_run: false           # when true, computes gates without creating cards / proposals
    success_metric:
      name: harness_degradation_cards
      threshold: 0
      operator: gte          # 0 new cards = all gates healthy; >0 surfaces real degradation (always succeeds)

  # ── Skill Security Monitor (SkillSpector scan of ICDEV skills) ────────────────

  skill_security_monitor:
    timeout_seconds: 300
    enabled: true
    risk_tier: green
    schedule: "every 6h"
    interval_seconds: 21600  # 6 hours — SKILL.md files change slowly
    cooldown_minutes: 120
    description: "SkillSpector scan of .agents/skills/icdev-* — open a Kanban card per skill with blocking or high/critical findings; deduped by skill name + dispatch_source"
    success_metric:
      name: cards_created
      threshold: 0
      operator: gte         # 0 = all skills pass; >0 surfaces real security drift (always succeeds)

  # ── Foundry Cycle (ACF — Autonomous Capability Foundry, 0→1 product factory) ──

  foundry_cycle:
    timeout_seconds: 600     # heavy reflex — harvest→synth→novelty-gate→score→CoD→SIPA→seed
    enabled: true
    risk_tier: green
    schedule: "every 12h"
    interval_seconds: 43200  # 12 hours — a full ACF cycle is expensive (LLM synth + scoring)
    cooldown_minutes: 120
    description: "ACF: run one Autonomous Capability Foundry cycle on cadence; clean no-op when ICDEV_FOUNDRY_ENABLED is off. Delegates to tools.foundry.engine.run_cycle (novelty gate + CoD go/no-go + SIPA self-vet + kanban seed)"
    dry_run: false           # when true, compute a cycle without persisting / seeding
    max_concepts: 5          # per-cycle rate limit on concepts proposed (passed to the engine)
    success_metric:
      name: foundry_tasks_emitted
      threshold: 0
      operator: gte          # 0 emitted = nothing novel passed the gates (healthy); >0 = net-new capability seeded

  # ── NDC Topology Drift → ACOIC (producer for the DIC compliance path) ───────

  ndc_topology_drift:
    timeout_seconds: 180     # config generation + diff across all topologies
    enabled: true
    risk_tier: green         # read-only against NDC; writes only ACOIC drift rows
    schedule: "every 4h"
    interval_seconds: 14400  # matches CADENCE_HOURS = 4 in the reflex module
    cooldown_minutes: 60
    description: "NDC topology config drift -> ACOIC: diff each topology's generated device configs against its saved nc_versions baseline, record dic_drift_events, enqueue impacted DIC documents for HITL regeneration, and publish ndc.topology.drift_detected (target_canvas=dic) for the editorial suggestion path."
    dry_run: false           # when true, detects and reports drift without writing
    success_metric:
      name: drift_events_recorded
      threshold: 0
      operator: gte          # 0 = no drift or no baselines saved (healthy); >0 = real drift recorded

  # ── BDC ISA Expiry Alerting (bdr-ops-1 — was registered-but-undispatched) ────

  bdc_isa_expiry:
    timeout_seconds: 120     # single BDC table scan + canvas event publish + Telegram fire-and-forget
    enabled: true
    risk_tier: green         # read-only against bd_isa_tracker; writes only append-only canvas events
    schedule: "every 24h"
    interval_seconds: 86400  # 24 hours — daily ISA-expiry sweep
    cooldown_minutes: 240
    description: "BDC ISA expiry alerting: query bd_isa_tracker for ISAs expiring within 90 days, publish bdc/isa_expiring_soon canvas events, and send Telegram notifications for ISAs expiring within 30 days. Delegates to tools.boundary_canvas.isa_expiry.check_isa_expiry."
    dry_run: false           # when true, checks and reports without publishing events / notifications
    success_metric:
      name: isas_checked
      threshold: 0
      operator: gte          # Informational — 0 ISAs tracked is healthy; >0 checked is normal operation

  # ── Full-tier coherence sweep (gate/sweep split) ─────────────────────────────

  coherence_sweep:
    timeout_seconds: 1800    # full 49-check tier on a cold tree measured 328s; head-room for a loaded host
    enabled: true
    risk_tier: green         # read-only: no --fix, writes only the gitignored .tmp/ baseline cache
    schedule: "every 6h"
    interval_seconds: 21600  # 6 hours — matches CADENCE_HOURS = 6 in the reflex module
    cooldown_minutes: 120
    description: "Full-tier coherence sweep on the main checkout. Runs the whole-app checks (blueprint_imports, openapi_parity, llm_router_api) that the per-task fast-tier gate defers, and refreshes the cached baseline that gate diffs new failures against. Delegates to tools.workflow.validated_commit helpers."
    dry_run: false           # when true, reports failing checks without refreshing the baseline cache
    success_metric:
      name: failed_count
      threshold: 0
      operator: lte          # 0 failing checks on main is healthy; >0 means main has regressed

  # ── cATO Twin Continuous Monitoring (bdr-ops-1 — enabled after query soak) ───

  cato_twin:
    timeout_seconds: 300     # per-project compliance snapshot + IQE seed queries + POA&M auto-gen across frameworks
    enabled: true            # bdr-vv-2: enabled after operational smoke — dispatch contract + PG transaction hardening verified end-to-end
    risk_tier: green         # writes compliance twin snapshots + POA&M items; append-only audit_trail
    schedule: "every 6h"
    interval_seconds: 21600  # 6 hours — matches CADENCE_HOURS = 6 in the reflex module
    cooldown_minutes: 60
    description: "cATO Twin continuous monitoring (NIST SP 800-137): for each active project, write a compliance twin snapshot, run seed IQE queries to detect violations, auto-generate POA&M items for new violations, run AI anomaly detection, and log a per-project summary to audit_trail. Delegates to tools.boundary_canvas.cato_twin.*."
    dry_run: false           # when true, counts prospective snapshots without persisting them
    success_metric:
      name: snapshots_written
      threshold: 0
      operator: gte          # Informational — 0 when no active projects; >0 is normal operation

  # ── PDC Pipeline Staleness Alert (pdx-ops-01 — was implemented-but-undispatched) ─

  pdc_pipeline_stale:
    timeout_seconds: 120     # pipelines table scan + IQR stats + optional LLM anomaly pass + canvas event publish
    enabled: true
    risk_tier: green         # read-only against pipelines; writes only append-only canvas events + pc_compliance_findings
    schedule: "every 6h"
    interval_seconds: 21600  # 6 hours — matches CADENCE_HOURS = 6 in the reflex module
    cooldown_minutes: 60
    description: "PDC pipeline staleness alerting: scan Pipeline Design Canvas pipelines, compute an IQR-based dynamic staleness threshold (Tukey's fence, STALE_DAYS_FLOOR=14 floor), optionally validate candidates with claude-haiku anomaly detection (air-gap safe), and publish pdc.pipeline.stale canvas events consumed by tools.pipeline.bus_subscriber. Delegates to tools.genesis.reflexes.pdc_pipeline_stale.run."
    dry_run: false           # when true, detects and reports stale pipelines without publishing events
    success_metric:
      name: pipelines_checked
      threshold: 0
      operator: gte          # Informational — 0 pipelines is healthy; >0 checked is normal operation

  # ── Cross-Canvas Twin Freshness Sweep (twx-cov-02) ───────────────────────────

  twin_freshness_sweep:
    timeout_seconds: 120     # observer runs a cheap count/MAX(created_at) per canvas twin table
    enabled: true
    risk_tier: green         # read-only: observes twin snapshot tables; writes only append-only canvas events
    schedule: "every 6h"
    interval_seconds: 21600  # 6 hours — matches CADENCE_HOURS = 6 in the reflex module
    cooldown_minutes: 60
    description: "Cross-canvas twin freshness: run the twin_core observer and publish twin.snapshot.stale for any registered twin whose newest snapshot is stale/absent (fills the AADC/Mission/residual refresh gap generically — future twins covered automatically). Delegates to tools.genesis.reflexes.twin_freshness_sweep.run."
    dry_run: false           # when true, detects stale twins without publishing events
    success_metric:
      name: twins_checked
      threshold: 0
      operator: gte          # Informational — number of registered twins observed

  # ── DIC Integration (Canvas Synergy — dsyn-reflex-02) ────────────────────────

  dic_integration:
    timeout_seconds: 90      # 60s reflex budget + 30s buffer for DB + LLM draft
    enabled: true
    risk_tier: green
    schedule: "every 15m"
    interval_seconds: 900    # 15 minutes — near-real-time doc update suggestions
    cooldown_minutes: 5
    description: "DIC Canvas Synergy: poll canvas_events targeted at DIC and queue AI-drafted document update suggestions for HITL review. Covers NDC, Network, ZIG, Compliance, SIPA, DevSecOps, CloudForge, and AI-ify canvases."
    dry_run: false           # when true, reports events found without creating suggestions
    max_events_per_run: 50   # safety cap on backlog processing per cycle
    success_metric:
      name: dic_suggestions_created
      threshold: 0
      operator: gte          # 0 = no events or all already processed (healthy); >0 = suggestions queued

  # ── DIC Review Cadence (nightly overdue check — dsyn-suggest-02) ───────────

  dic_review_cadence:
    timeout_seconds: 120
    enabled: true
    risk_tier: green
    schedule: "daily 02:30"
    interval_seconds: 86400    # nightly — 1440-min cadence
    cooldown_minutes: 720      # minimum 12h between runs
    description: "DIC Review Cadence: check each collection with review_interval_days set; emit dic.review_overdue canvas_events and notify editors/reviewers when last HITL approval exceeds the configured interval."
    dry_run: false

  doc_modernization_sweep:
    timeout_seconds: 300
    enabled: true
    risk_tier: green
    schedule: "daily 03:30"
    interval_seconds: 86400    # nightly
    cooldown_minutes: 720      # minimum 12h between runs
    description: "Document Modernization Sweep: refresh EOL caches + de facto deployment standards, incrementally scan DIC documents for stale/EOL/deprecated content, draft capped TRUST-gated redlines, emit suggested kanban rollups."
    dry_run: false
    success_metric:
      name: dic_overdue_events_emitted
      threshold: 0
      operator: gte

  # ── Confidence Sampler (audit what the system was already sure about) ───────
  # TRUST gates on confidence, and confidence is a self-report. Items above the
  # gate flow through automatically and nobody re-reads them, so errors in the
  # trusted band are not rare — they are structurally unobservable. This draws an
  # unbiased sample so a human is forced to look at what nothing else surfaces.
  #
  # Writes measurement rows only (harness_eval, outcome NULL until judged). It
  # never promotes, resolves or modifies the item it samples: an audit that
  # changes its subject is not an audit.
  confidence_sampler:
    timeout_seconds: 120
    enabled: true
    risk_tier: green         # read-only against the sampled surface
    schedule: "daily 04:00"
    interval_seconds: 86400
    cooldown_minutes: 720
    description: "Confidence sampler: stratified random audit sample of scored decisions, recorded as pending harness_eval rows for human verdict. Measures whether confidence predicts correctness."
    dry_run: false
    surface: "oracle_triage"
    # Bands include values BELOW the 0.7 promotion gate on purpose. Every live
    # oracle_prediction is >=0.7 because the gate filters before the row is
    # written — measuring only what passed can confirm the gate but never test
    # it. A threshold is a claim about both sides of itself.
    bands: [0.5, 0.6, 0.7, 0.8, 0.9, 1.0]
    band_width: 0.1
    # Per band, not total: a flat draw returns mostly 1.0 rows (173 of 420 live)
    # and starves the bands that need estimating. Small by default — reviewer
    # time is the scarce resource, not database rows.
    per_band: 3
    success_metric:
      name: confidence_samples_drawn
      threshold: 0
      operator: gte

  # ── DIC GraphRAG Community Refresh ──────────────────────────────────────────
  # The community engine clusters the DIC knowledge graph and summarises each
  # theme (dic_community_summaries), which chat consults for global/thematic
  # questions ("what are the main themes across these documents"). As documents
  # are ingested the graph changes and the summaries drift stale; this rebuilds
  # them on a cadence. build_communities is idempotent (content-stable ids,
  # prefix-delete before rewrite), so a refresh replaces rather than accumulates.
  community_refresh:
    timeout_seconds: 600     # LLM-summarises each community across all DIC graphs
    enabled: true
    risk_tier: green         # rewrites derived summaries only; idempotent
    schedule: "daily 03:45"
    interval_seconds: 86400
    cooldown_minutes: 720
    description: "DIC GraphRAG community refresh: re-cluster the DIC knowledge graph and re-summarise each theme into dic_community_summaries, so global/thematic chat answers stay current as documents change."
    dry_run: false
    success_metric:
      name: dic_communities_refreshed
      threshold: 0
      operator: gte

  # ── DIC Inbox Sweep (the drop folder finally gets someone watching it) ───────
  # tools/document_intelligence/inbox.py was built for teams who pull documents
  # out of SharePoint with a browser session and had nowhere to put them. It
  # works and is tested, but had no caller anywhere in the repo — no reflex, no
  # daemon, no route. This is its launcher.
  #
  # Minutes, not hours: a drop folder, not a nightly sweep. A CR approved this
  # morning should not wait until 03:30 to become evidence.
  #
  # These keys reach the reflex as its `context` — the daemon passes this config
  # dict straight to module.run().
  dic_inbox_sweep:
    timeout_seconds: 600     # a drop can be many files; each is a full ingest
    enabled: true
    risk_tier: green         # ingests operator-provided files into one collection
    schedule: "every 5m"
    interval_seconds: 300
    cooldown_minutes: 0      # a drop folder should not sit waiting on a cooldown
    description: "DIC Inbox Sweep: ingest anything new in the DIC drop folder (data/dic_inbox) into its collection with RAG chunks + KG bridge. Content-hash dedup, so a re-downloaded file is skipped but a revised one re-ingests. Acquisition-agnostic — it does not scrape or authenticate; files arrive by whatever means the operator already uses."
    dry_run: false           # when true, reports what would ingest and writes nothing
    watch_dir: ""            # empty -> inbox default (data/dic_inbox)
    collection_id: "change-records"
    recursive: false
    move_processed: false    # true -> move ingested files to <watch_dir>/processed
    success_metric:
      name: dic_inbox_files_ingested
      threshold: 0
      operator: gte

  review_loop:
    timeout_seconds: 300     # bounded — coherence(changed) + SIPA subprocesses
    enabled: true
    risk_tier: green         # REPORT-ONLY drift probe — never edits the checkout
    schedule: "every 6h"
    interval_seconds: 21600  # low cadence; the real greening is per-task (pre-PR/pre-commit)
    cooldown_minutes: 0
    description: "review_loop drift probe — report-only review-until-green over the working tree (ruff + changed-files coherence + SIPA); no autofix. Cheap no-op on a clean checkout. Per-task greening lives in git_ops pre-PR preflight + the pre-commit hook. Config: args/review_loop_config.yaml"
    success_metric:
      name: review_loop_errors
      threshold: 0
      operator: eq

  # ── Oracle Triage (auto-triage suggested kanban cards after each awareness cycle)

  oracle_triage:
    enabled: true
    risk_tier: green
    schedule: "every 3h"
    interval_seconds: 10800  # runs right after the awareness cycle produces new cards
    cooldown_minutes: 60     # at most once per hour even if awareness fires more often
    description: "Oracle Triage — deterministically promote/dismiss Oracle-suggested kanban tasks using file-exists, Flask-route, and migration checks"
    success_metric:
      name: oracle_triage_errors
      threshold: 0
      operator: eq
    api_base: "http://localhost:5050"

  # ── Canvas Indexer (per-canvas /ask GraphRAG freshness) ─────────────────────

  canvas_indexer:
    timeout_seconds: 600   # heavy reflex — needs > default 300s
    enabled: true
    risk_tier: green
    schedule: "every 6h"
    interval_seconds: 21600  # 6 hours — design content changes slowly
    cooldown_minutes: 120    # Minimum gap between consecutive cycles
    description: "Canvas KG indexer — re-index PDC/BDC/DDC/ODC/IDC designs into kg_nodes so /ask stays fresh"
    success_metric:
      name: canvas_indexer_errors
      threshold: 0
      operator: eq  # 0 canvas-level errors means clean cycle
    canvases: [pdc, bdc, ddc, odc, idc]  # NDC and SDC use other pipelines

  # ── FathomDesk Trap Scenarios (Phase 7.10 integration-01) ─────────────────────

  fathomdesk_trap_scenarios:
    enabled: true
    risk_tier: green
    schedule: "every 1h"
    interval_seconds: 3600  # 1 hour — match trap_scanner 15m cadence × 4
    cooldown_minutes: 30    # Minimum gap between consecutive cycles
    description: "Detect high-confidence trap events (>=0.8) since last run, spawn potential_reversal_cascade scenarios, write daily Pulse digest"
    success_metric:
      name: events_found
      threshold: 0
      operator: gte  # 0 = no new traps (healthy), >0 = scenarios spawned
    confidence_threshold: 0.8          # Minimum confidence to spawn a scenario
    scenario_key: potential_reversal_cascade  # Scenario template to execute per trap
    digest_status: draft               # Pulse post status for daily digest

  # ── FathomDesk Trap Sweep (Phase 7.12 ad712-trap-02) ──────────────────────────

  fathomdesk_trap_sweep:
    enabled: true
    risk_tier: green
    schedule: "every 4h"
    interval_seconds: 14400  # 4 hours — COOLDOWN_HOURS=4 per ad712-trap-02
    cooldown_minutes: 60     # Minimum gap between consecutive cycles
    description: "Detect bull/bear trap patterns from signal direction flips, persist to ad_trap_events via ad712-trap-01 insert path (ta_config.yaml thresholds)"
    success_metric:
      name: traps_inserted
      threshold: 0
      operator: gte  # 0 = no new traps detected (healthy), >0 = events written

  # ── FathomDesk P/C Ratio History (fdmm-pcr-04) ────────────────────────────

  fathomdesk_pc_ratio:
    enabled: true
    risk_tier: green
    schedule: "daily 06:00"
    interval_seconds: 86400  # 24 hours — CBOE data is end-of-day
    cooldown_minutes: 60     # Minimum gap between consecutive cycles
    description: "Fetch CBOE equity put/call ratio series and append snapshot to ad_pc_ratio_history; backing store for put_call_sentiment confluence pillar"
    success_metric:
      name: rows_written
      threshold: 0
      operator: gte  # 0 = no new data today (ok), 1 = snapshot stored

  # ── Cost Optimizer (Cluster C fd-cost-01/02) ──────────────────────────────

  cost_optimizer:
    enabled: true
    risk_tier: green
    schedule: "every 168h"
    interval_seconds: 604800  # 7 days (weekly)
    cooldown_minutes: 720      # 12h minimum gap — weekly reflex, no rapid re-fire
    description: "Weekly LLM token spend audit; detect Haiku-eligible tasks; flag bloated prompts. Hard rule: never flags Risk or Execution agents."
    success_metric:
      name: recommendations_generated
      threshold: 0
      operator: gte  # 0 = no savings found (healthy), >0 = optimization opportunities written
    excluded_agents:
      - risk
      - execution

  # ── NOCC SLA Watcher (4h cadence) ────────────────────────────────────────

  nocc_sla_watcher:
    enabled: true
    risk_tier: green
    schedule: "every 4h"
    description: "Watch NOCC SLA records, flag projected breaches and warn on anomalous measurements"
    success_metric:
      name: warnings_issued
      threshold: 0
      operator: gte  # 0 = all SLAs healthy, >0 = projections surfaced
    # Warn margin moved from hardcoded Python constant (_WARN_MARGIN_PCT = 0.5) so the
    # anomaly_detection layer can adapt it from historical measurement variance at runtime.
    warn_margin_pct: 0.5              # static fallback: warn when within this % of target
    anomaly_detection:
      enabled: true                   # use adaptive margin based on per-circuit measurement history
      min_samples: 10                 # minimum historical rows before adaptive mode activates
      sigma_multiplier: 1.5           # adaptive_margin = mean_deviation + sigma_multiplier * std
      fallback_to_static: true        # use warn_margin_pct when data is insufficient
      history_days: 30               # days of SLA measurement history to analyze per circuit+sla_type
      stable_std: 0.01               # std threshold below which a circuit is "stable" (use mean+fallback buffer)
      borderline_ratio: 0.8          # LLM contextual check only when gap >= this fraction of dynamic margin
      adaptive_bounds:
        margin_floor: 0.1             # adaptive margin never drops below this
        margin_ceiling: 5.0           # adaptive margin never exceeds this

  # ── Network Migration Canvas Health Monitor (NMCE — 2026-05-08) ──────────

  migration_canvas:
    enabled: true
    risk_tier: green
    schedule: "every 24h"
    interval_seconds: 86400   # Daily — sessions and EOL dates change slowly
    cooldown_minutes: 360     # 6h minimum gap — no rapid re-fire
    description: "Detect stale migration sessions (>7d no progress), EOL devices with no active migration (<90d to EOL), and protocol plans stuck in draft (>14d). Promotes findings to kanban at >= 0.70 confidence."
    promotion_threshold: 0.70
    success_metric:
      name: findings
      threshold: 0
      operator: gte  # 0 = all migrations healthy, >0 = issues surfaced

  aadc_compliance:
    enabled: true
    risk_tier: green
    schedule: "on_event"
    description: "AADC design compliance scoring — NIST AI RMF / OWASP LLM / MITRE ATLAS node-coverage"
    success_metric:
      name: overall_score
      threshold: 0
      operator: gte
    # Thresholds moved from hardcoded Python constants — anomaly_detection layer
    # adapts them at runtime using z-score over historical aadc_assessments data.
    critical_threshold: 40.0       # framework coverage below this triggers a Kanban suggestion
    memory_delta_threshold: 5.0    # min overall_score change (points) to write a memory insight
    anomaly_detection:
      enabled: true                # replace static thresholds with z-score adaptive ones
      min_samples: 5               # historical assessments needed before adaptive mode activates
      z_score: 2.0                 # std deviations below historical mean sets adaptive critical_threshold
      fallback_to_static: true     # use critical_threshold/memory_delta_threshold when data is sparse
      adaptive_bounds:
        critical_threshold_floor: 20.0    # adaptive threshold never drops below this
        critical_threshold_ceiling: 60.0  # adaptive threshold never exceeds this
        memory_delta_floor: 2.0           # adaptive delta never drops below this
        memory_delta_ceiling: 15.0        # adaptive delta never exceeds this

  peering_agreement_renewal:
    enabled: true
    risk_tier: green
    schedule: "daily 06:00"
    interval_seconds: 86400
    description: "Check nc_peering_agreements for contracts expiring; issue NOCC alarms for at-risk agreements"
    success_metric:
      name: at_risk_count
      threshold: 0
      operator: gte  # 0 = no expiring agreements (healthy), >0 = alarms issued
    # Thresholds moved from hardcoded Python constants — anomaly_detection layer
    # can adapt them at runtime without code changes.
    days_ahead: 90          # static fallback: look-ahead window for expiring agreements
    critical_days: 30       # static fallback: agreements <= this days remaining → critical severity
    anomaly_detection:
      enabled: true         # use AI to assess per-agreement severity (replaces days <= 30 rule)
      fallback_to_static: true  # use critical_days when LLM unavailable

  quality:
    enabled: true
    risk_tier: yellow
    schedule: "daily 03:00"
    description: "Self-Learning QA/QC: run all QDC gates, detect regressions, auto-remediate safe issues, propose improvements via GKP"
    success_metric:
      name: regressions_detected
      threshold: 0
      operator: gte  # 0 = stable quality, >0 = regressions found (always succeeds)
    # Thresholds moved from hardcoded Python constants — anomaly_detection layer
    # can adapt them at runtime from historical quality_snapshots data.
    uqs_regression_threshold: -5.0    # static fallback: UQS drop (points) that triggers a regression event
    uqs_critical_threshold: -15.0     # static fallback: UQS drop below which severity becomes "critical"
    findings_increase_threshold: 5    # static fallback: new findings count increase that triggers a regression event
    gate_score_threshold: 80          # static fallback: gate score below which a GKP improvement is proposed
    worst_gates_count: 3              # number of worst-performing gates to inspect for GKP generation
    anomaly_detection:
      enabled: true                   # use adaptive thresholds based on quality_snapshots history
      min_samples: 5                  # minimum historical snapshots before adaptive mode activates
      sigma_multiplier: 1.0           # adaptive_threshold = mean + sigma_multiplier * std
      critical_sigma_multiplier: 2.0  # critical threshold = mean - (critical_sigma_multiplier * sigma * std)
      critical_floor_multiplier: 2.0  # critical floor = uqs_regression_floor * critical_floor_multiplier
      fetch_buffer: 10                # extra rows fetched beyond min_samples for delta computation
      fallback_to_static: true        # use static thresholds when history is insufficient
      adaptive_bounds:
        uqs_regression_floor: -20.0   # adaptive UQS regression threshold never goes below this
        findings_increase_floor: 1    # adaptive findings threshold never drops below this
        gate_score_floor: 50          # adaptive gate score threshold never drops below this

  academy_reflex:
    enabled: true
    risk_tier: green
    schedule: "every 6h"
    interval_seconds: 21600   # 6h — curriculum doesn't change faster than this
    cooldown_minutes: 360     # 6h minimum gap — match COOLDOWN_HOURS in reflex
    description: "Phase 1: Convert proven_pattern GKPs (confidence >= 0.70) into fa_missions draft scaffolds for human review. Phase 2: Run LensStalenesssDetector and promote stale-content predictions (>= 0.70) to Kanban as 'suggested' tasks."
    promotion_threshold: 0.70
    max_drafts: 5             # Max new draft missions per run
    success_metric:
      name: actions_taken
      threshold: 0
      operator: gte  # 0 = nothing to do (healthy), > 0 = drafts or tasks created

  academy_oracle_reflex:
    enabled: true
    risk_tier: green
    schedule: "every 6h"
    interval_seconds: 21600   # 6h — Academy telemetry doesn't shift faster than this
    cooldown_minutes: 360     # 6h minimum gap — match COOLDOWN_HOURS in the reflex
    description: "Run the in-app 7-lens AcademyOracleRunner (learner-risk, content-quality, skill-gap, AADC-readiness, staleness, ACE-skill-gap, agent-readiness) and persist predictions + convergence to fa_oracle_predictions / fa_oracle_convergence_events. Replaces the dead forge_academy_oracle reflex, which queried the wrong (global) table and was never dispatched."
    success_metric:
      name: persisted
      threshold: 0
      operator: gte  # 0 = nothing new to persist (healthy), > 0 = fresh predictions

  wiki_lint:
    enabled: true
    risk_tier: green
    schedule: "daily 04:00"
    description: "Karpathy LLM Wiki health checks: orphan files, broken [[slug]] links, stale current-state claims, MEMORY.md overflow"
    success_metric:
      name: total_findings
      threshold: 0
      operator: gte
    staleness_days: 90            # Files older than this (in days) with current-state language are flagged
    overflow_warn_lines: 160      # MEMORY.md line count that triggers overflow warning (Claude Code truncates at 200)
    # auto_memory_path:           # Override path for Claude Code auto-memory dir (derived by convention if omitted)

  usage_rollup:
    enabled: true
    risk_tier: green
    schedule: "daily 00:05"
    description: "Aggregate yesterday's usage_events into usage_daily_rollup (billing rollup)"
    success_metric:
      name: rows_upserted
      threshold: 0
      operator: gte  # 0 = no usage yesterday (healthy), > 0 = rows rolled up

  episodic_distiller:
    enabled: true
    risk_tier: yellow
    schedule: "every 6h"
    description: "Distill accumulated episodic memory events into durable semantic facts (Phase A harness memory)"
    trigger_count: 20          # min undistilled episodic entries before running
    batch_size: 50             # max entries to process per run
    cluster_threshold: 0.35   # cosine similarity threshold for grouping events
    max_facts_per_cluster: 3  # max semantic facts produced per cluster
    model_function: "summarization"  # LLM router function (cheap model preferred)
    use_llm: true             # set false to use heuristic fallback (zero tokens)
    success_metric:
      name: semantic_facts_written
      threshold: 0
      operator: gte

# ── Reflex Health & Alerting (crx-gen-02) ────────────────────────────────────
# Turns critical-reflex failures into operator alerts on the /monitoring page
# (via the shared `alerts` table) and backs the reflex health-trend queries in
# tools/genesis/reflex_health.py. Wires the previously-inert
# circuit_breaker.notify_on_trip intent.
reflex_health:
  enabled: true
  default_severity: critical          # alerts severity for bare critical_reflexes entries
  cooldown_minutes: 60                 # min window; a flapping reflex alerts once per window
  failure_threshold: 3                 # failures within the window before an alert fires
  # Reflexes worth paging on. Bare name → default_severity; {name: severity} to override.
  # Per-reflex `reflexes.<name>.alert_severity` also promotes a reflex to critical.
  critical_reflexes:
    - heal                             # self-healing loop — silent failure is high-impact
    - comply                           # compliance drift must not go unnoticed
    - integrity_monitor
    - cato_monitor
    - kanban                           # delivery pipeline dispatch
    - redaction_scan_reflex: warning   # PII sweep — warn rather than page

# ── Promoter Configuration ───────────────────────────────────────────────────

promoter:
  # D-GEN-4: single gateway from v2.0 → v1.x
  export_dir: data/genesis/exports
  gkp_version: "1.0"

  # Auto-promote rules (no human needed)
  auto_promote:
    - artifact_type: research_signal
      min_confidence: 0.0  # Always promote (read-only data)
    - artifact_type: compliance_knowledge
      min_confidence: 0.0
    - artifact_type: quality_baseline
      min_confidence: 0.0
    - artifact_type: proven_pattern
      min_confidence: 0.85
    - artifact_type: capability_update
      min_confidence: 0.0  # Marketplace capability updates are safe
    - artifact_type: anticipation_report
      min_confidence: 0.80  # Only high-confidence regulatory anticipation auto-promotes
    # Reflex-based rules: any GKP from these reflexes auto-promotes
    - reflex: comply
      min_confidence: 0.0  # All compliance outputs are safe
    - reflex: audit
      min_confidence: 0.0  # Audit findings are read-only
    # Source-based rules: trusted external sources auto-promote
    - source_contains: CISA
      min_confidence: 0.0  # cisa.gov advisories and KEV
      hide_from_dashboard: true  # CVE/KEV auto-promoted, no review needed
    - source_contains: OWASP
      min_confidence: 0.0  # owasp.org feeds
      hide_from_dashboard: true  # Auto-promoted, no review needed
    - source_contains: nist
      min_confidence: 0.0  # NIST NVD and standards

  # Human-approve rules
  human_approve:
    - artifact_type: proven_pattern
      confidence_range: [0.7, 0.85]
    - artifact_type: code_patch
      min_confidence: 0.0  # Always human review
    - artifact_type: training_pair
      min_confidence: 0.0  # Always human review

  # Deduplication
  dedup:
    enabled: true
    similarity_threshold: 0.85
    method: jaccard_trigram

# ── Feedback Collector Configuration ─────────────────────────────────────────

feedback:
  # D-GEN-11: pull-based (v2.0 pulls from v1.x)
  collection_schedule: "daily 01:00"
  sources:
    - name: runtime_failures
      query: "SELECT * FROM audit_trail WHERE event_type LIKE 'error.%' AND created_at > ?"
      lookback_hours: 24
    - name: quality_trends
      query: "SELECT * FROM code_quality_metrics WHERE created_at > ?"
      lookback_hours: 168  # 7 days
    - name: coverage_gaps
      table: code_quality_metrics
      filter: "maintainability_score < 50"
    - name: heal_outcomes
      query: "SELECT * FROM self_healing_events WHERE created_at > ?"
      lookback_hours: 168
    - name: demand_signals
      table: pulse_demand_signals
      filter: "is_high_demand = 1"
  output_dir: data/genesis/feedback

# ── Audit Configuration ─────────────────────────────────────────────────────

audit:
  # D-GEN-6, D-GEN-10: append-only genesis_audit table
  table: genesis_audit
  retention_days: 365  # Keep 1 year of autonomous decision logs
  event_types:
    - genesis.daemon.started
    - genesis.daemon.stopped
    - genesis.reflex.started
    - genesis.reflex.completed
    - genesis.reflex.failed
    - genesis.reflex.skipped
    - genesis.circuit_breaker.tripped
    - genesis.circuit_breaker.reset
    - genesis.promoter.exported
    - genesis.promoter.auto_promoted
    - genesis.promoter.human_review_pending
    - genesis.promoter.promoted
    - genesis.promoter.rejected
    - genesis.promoter.dedup_skipped
    - genesis.evolve.mutation_proposed
    - genesis.evolve.mutation_accepted
    - genesis.evolve.mutation_rejected
    - genesis.feedback.collected
    - genesis.report.generated
    - genesis.kill_switch.activated
    - genesis.convergence.evaluated
    - genesis.convergence.retrospective_triggered
    - genesis.stagnation.detected
    - genesis.stagnation.plateau_broken

# ── Eval Harness Gates (AI-ify Phase 2 — anomaly_detection) ────────────────
# Thresholds moved from hardcoded Python constants to config so the
# anomaly_detection layer can adapt them without code changes.
harness:
  # Which reflexes check_gates() evaluates. This was a literal
  # `for reflex in ("oracle_triage", "heal")` in eval_harness.py, so everything
  # else that gates on confidence — citation grounding, docmod findings, the AADC
  # proceed/escalate gate, the awareness promotion priors — went unmeasured, not
  # by decision but because a tuple in one loop never named it.
  #
  # A surface only produces metrics once it writes to harness_eval, so listing
  # one costs nothing until it has data. An empty list falls back to the default
  # pair rather than silently gating nothing.
  gated_reflexes:
    - oracle_triage
    - heal
  gates:
    precision_min: 0.80       # oracle_triage/heal: alert when precision < this
    # Calibration: alert when ECE > this. NOTE this number has never been
    # validated against outcomes — like every 0.7/0.15 threshold in the repo it
    # traces to a sign-off, not a measurement. It is a starting point, not a fact.
    ece_max: 0.15             # calibration: alert when ECE > this
    false_heal_max: 0.20      # heal: alert when false-heal rate > this
    heal_success_min: 0.60    # heal: alert when heal success rate < this
    min_decisions: 10         # skip gate check when fewer decisions than this
  anomaly_detection:
    enabled: true             # use adaptive z-score anomaly detection
    min_samples: 10           # minimum historical windows before adaptive mode activates
    window_days: 90           # rolling window in days for snapshot collection
    chunk_size: 20            # decision rows per sliding snapshot
    z_score: 2.0              # std deviations from mean to set adaptive threshold
    fallback_to_static: true  # fall back to gates.* thresholds when insufficient data
    # Hard safety bounds for adaptive thresholds — prevents z-score from producing
    # nonsensical values when history is noisy or sparse.
    adaptive_bounds:
      precision_min_floor: 0.50      # adaptive precision_min never goes below this
      ece_max_ceiling: 0.50          # adaptive ece_max never goes above this
      false_heal_max_ceiling: 0.60   # adaptive false_heal_max never goes above this
      heal_success_min_floor: 0.30   # adaptive heal_success_min never goes below this

# ── Convergence Gates (Phase 65 — Ouroboros-inspired) ──────────────────────

convergence:
  enabled: true
  weights:
    goal_drift: 0.5
    metric_drift: 0.3
    output_similarity: 0.2
  thresholds:
    max_acceptable_drift: 0.30
    convergence_similarity: 0.95
    max_ambiguity: 0.20
  ambiguity_weights:
    problem_clarity: 0.40
    solution_clarity: 0.30
    verification_clarity: 0.30
  retrospective:
    trigger_every_n_cycles: 5
    trigger_on_drift_above: 0.30
  window_size: 10
  # Anomaly detection: adaptive thresholds derived from per-reflex historical data.
  # When n_samples >= min_samples, thresholds become mean + z_score*std instead of
  # the static values above. Falls back to static thresholds until history builds up.
  anomaly_detection:
    min_samples: 5    # minimum records before adaptive thresholds activate
    z_score: 2.0      # std deviations above historical mean to set threshold
    slope_normalizer: 10.0  # maps linear metric slope → [0,1] drift; slope ≥ 1/slope_normalizer → zero drift
    clarity_keyword_divisor: 3  # keyword hits per dimension needed to score full clarity

# ── Stagnation Detector (Phase 65 — Ouroboros-inspired) ────────────────────

stagnation:
  enabled: true
  detection:
    oscillation_window: 4
    stagnation_threshold: 0.99
    stagnation_min_consecutive: 3
    diminishing_returns_slope_threshold: 0.01
    repetitive_output_overlap: 0.70
    repetitive_output_window: 3
  personas:
    hacker:
      description: "Find unconventional workarounds for this constraint"
      applicable_patterns:
        - oscillation
        - stagnation
    researcher:
      description: "What additional information would clarify this?"
      applicable_patterns:
        - stagnation
        - diminishing_returns
    simplifier:
      description: "How can we reduce complexity?"
      applicable_patterns:
        - diminishing_returns
        - repetitive_output
    architect:
      description: "How should we restructure this approach?"
      applicable_patterns:
        - oscillation
        - repetitive_output
    contrarian:
      description: "What assumption should we challenge?"
      applicable_patterns:
        - stagnation
        - diminishing_returns
        - oscillation
  scoring:
    feasibility_weight: 0.6
    novelty_weight: 0.4
  max_alternatives_per_persona: 3
