# [TEMPLATE: CUI // SP-CTI]
# Active Extension Hook Configuration (Phase 44 — D261-D264)
# Independent ICDEV implementation of pluggable extension hooks.
# Category-level concept similar to Agent Zero's extension system (MIT)
# but architectures differ — see OPT-73 audit for the full comparison.
---

extensions:
  enabled: true

  # Directories scanned for extension files
  scan_directories:
    - extensions/                    # Project root extensions
    - tools/extensions/builtins/     # Built-in extensions

  # Per-hook-point configuration.
  #
  # Read by ExtensionManager.point_config() and enforced by dispatch(). Until
  # hcx-live-02 this whole block was inert: dispatch() read `extensions.enabled`
  # and two `safety` keys and nothing else, so an operator standing ONE point
  # down edited a key with no effect and the only working switch was the global
  # one — which also stops the nine chat handlers that are in use.
  #
  # Four keys, and dispatch consumes every one of them. Adding a fifth means
  # wiring it too; tests/test_extension_dispatch_governance.py fails on a key
  # nothing reads, because a declared-but-unconsumed key is the defect this
  # block was an instance of.
  #
  #   enabled             the per-point kill switch. False = the point does
  #                       nothing at all, including writing telemetry.
  #   allow_modification  a CEILING on what a handler may declare, not a copy of
  #                       the per-handler flag. False here discards a modified
  #                       context even from a handler registered with
  #                       allow_modification=True (logged, and counted in
  #                       ExtensionManager.stats). It only ever lowers: it
  #                       cannot grant modification to an observational handler.
  #   max_handlers        how many handlers ONE dispatch runs, in priority
  #                       order. Falls back to safety.max_handlers_per_point.
  #   timeout_ms          the point's wall-clock budget, combined with
  #                       safety.max_total_handler_time_ms by min() — a point
  #                       may tighten the global ceiling, never raise it.
  hook_points:
    tool_execute_before:
      enabled: true
      allow_modification: true       # Pre-hooks can modify tool input
      max_handlers: 20
      timeout_ms: 5000
    tool_execute_after:
      enabled: true
      allow_modification: false      # Post-hooks observe only by default
      max_handlers: 20
      timeout_ms: 5000
    # DISABLED, and this is the honest outcome rather than an accommodation
    # (autonomy-wire-01). Measured 2026-08-21: `ExtensionPoint.CHAT_MESSAGE_BEFORE`
    # and `CHAT_MESSAGE_AFTER` have ZERO call sites in the whole tree — not a
    # dispatch, and not even a registered handler. Declaring a hook point nothing
    # can ever reach makes the platform look more extensible than it is, and it
    # pinned `extension_hook_point` at 2 permanently inert units that no amount
    # of traffic could drain.
    #
    # Re-enable in the SAME change that adds the dispatch to the chat path, not
    # before: a point is declared when something calls it. Wiring the chat hot
    # path is a behavioural decision with its own latency and ordering
    # questions, and was deliberately not made here.
    chat_message_before:
      enabled: false
      allow_modification: true
      max_handlers: 20
      timeout_ms: 5000
    chat_message_after:
      enabled: false
      allow_modification: true       # Can add CUI markings to responses
      max_handlers: 20
      timeout_ms: 5000
    agent_start:
      enabled: true
      allow_modification: false
      max_handlers: 10
      timeout_ms: 3000
    agent_end:
      enabled: true
      allow_modification: false
      max_handlers: 10
      timeout_ms: 3000

  # Layered override resolution (D184 cascade pattern)
  layered_override:
    resolution_order:
      - default     # Built-in extensions
      - tenant      # Tenant-level overrides
      - project     # Project-level overrides

  # Safety limits
  safety:
    max_total_handler_time_ms: 30000   # Ceiling for one dispatch; per-point timeout_ms may tighten it
    # Never let an extension crash the caller. Kept true on purpose: this seam
    # sits on the chat path and the tool path. What changed in hcx-live-02 is
    # that a swallowed exception is no longer INVISIBLE — the dispatch is
    # recorded as an `error` row on the `extension` surface of
    # runtime_invocations, naming the handler and its exception, and counted in
    # ExtensionManager.stats(). Fail-soft, not fail-silent.
    catch_handler_exceptions: true
    log_handler_errors: true           # Log errors to stderr
    max_handlers_per_point: 20         # Default bound for a point declaring no max_handlers
