# CUI // SP-CTI
# Proposal Genesis — Autonomous Proposal Intelligence Daemon
#
# Controls the Proposal Genesis daemon and its 25 Reflexes across
# 4 phases: CAPTURE, PROPOSE, DELIVER, LEARN.
#
# Override any value via environment variable:
#   ICDEV_PROPOSAL_GENESIS_ENABLED=true
#   ICDEV_PG_REFLEX_<NAME>_ENABLED=false
#
# Classification: CUI // SP-CTI

classification: "CUI // SP-CTI"

# ── Master Switch ────────────────────────────────────────────────────────────

enabled: false  # D-PG-3: all automated with master toggle
env_override: ICDEV_PROPOSAL_GENESIS_ENABLED

# ── LLM Configuration ───────────────────────────────────────────────────────

llm:
  # D-PG-7: scanner-tier for most reflexes (zero Claude cost)
  tier: scanner
  model: qwen3.5-local
  max_tokens: 4096
  timeout_seconds: 120
  # R7 Draft uses two-tier (qwen3.5 drafts → Claude reviews)
  draft_model: qwen3.5-local
  review_model: claude-sonnet
  draft_max_tokens: 8192

# ── Trust Kernel ─────────────────────────────────────────────────────────────

trust_kernel:
  # Risk tiers: GREEN (auto-approve), YELLOW (sandbox+rollback)
  # D-PG-8: human review at end, not middle — no ORANGE tier
  risk_tiers:
    green:
      description: "Non-destructive, read-only operations"
      approval: auto
      sandbox: false
      audit: true
    yellow:
      description: "Reversible writes — drafts, extractions, mappings"
      approval: auto
      sandbox: false
      audit: true

  # Circuit breaker — 3 consecutive failures disables Reflex
  circuit_breaker:
    max_consecutive_failures: 3
    cooldown_minutes: 60
    auto_reenable: false

  # Kill switch
  kill_switch:
    enabled: true
    check_interval_seconds: 10

# ── Data Paths ───────────────────────────────────────────────────────────────

paths:
  exports: data/proposal_genesis/exports
  reports: data/proposal_genesis/reports

# ── 14 Reflexes (Phase A implements R1, R5, R6, R7, R8) ─────────────────────

reflexes:

  # ── PHASE 1: CAPTURE (Market Intelligence) ──────────────────────────────

  discover:
    enabled: true
    risk_tier: green
    schedule: "every 6h"
    description: "SAM.gov polling + pre-solicitation monitoring + amendment detection"
    phase: capture
    success_metric:
      name: opportunities_found
      threshold: 0
      operator: gte

  scout:
    enabled: true  # Phase B — implemented
    risk_tier: green
    schedule: "daily 07:00"
    description: "Competitor award tracking + intel briefs"
    phase: capture
    success_metric:
      name: briefs_generated
      threshold: 0
      operator: gte

  shape:
    enabled: true  # Phase B — implemented
    risk_tier: yellow
    schedule: "daily 08:00"
    description: "Capture planning + teaming assessment"
    phase: capture
    success_metric:
      name: plans_updated
      threshold: 0
      operator: gte

  engage:
    enabled: true  # Phase C — implemented
    risk_tier: green
    schedule: "every 4h"
    description: "CRM account/contact tracking + engagement scoring"
    phase: capture
    success_metric:
      name: accounts_scored
      threshold: 0
      operator: gte

  # ── PHASE 2: PROPOSE (Bid Lifecycle) ────────────────────────────────────

  extract:
    enabled: true
    risk_tier: green
    schedule: "on_demand"
    description: "Shall statement mining + amendment re-extraction"
    phase: propose
    trigger: "after_discover"
    success_metric:
      name: statements_extracted
      threshold: 0
      operator: gte

  map:
    enabled: true
    risk_tier: green
    schedule: "on_demand"
    description: "Expanded capability matching (ICDEV™ + consulting + partners)"
    phase: propose
    trigger: "after_extract"
    success_metric:
      name: coverage_score
      threshold: 0
      operator: gte

  draft:
    enabled: true
    risk_tier: yellow
    schedule: "on_demand"
    description: "Two-tier LLM drafting + Pulse content reuse + KB enrichment"
    phase: propose
    trigger: "after_map"
    success_metric:
      name: sections_drafted
      threshold: 0
      operator: gte
    max_drafts_per_run: 10
    pulse_integration: true
    kb_enrichment: true

  polish:
    enabled: true
    risk_tier: yellow
    schedule: "on_demand"
    description: "WriteGuard quality gate — grammar, readability, tone, plagiarism, AI detection"
    phase: propose
    trigger: "after_draft"
    success_metric:
      name: avg_quality_score
      threshold: 70
      operator: gte
    writeguard:
      min_score: 70
      checks:
        - grammar
        - readability
        - tone
        - plagiarism
        - ai_detection

  decide:
    enabled: true  # Phase F — implemented
    risk_tier: green
    schedule: "on_demand"
    description: "Bid/no-bid scoring + win probability estimation"
    phase: propose
    success_metric:
      name: decisions_scored
      threshold: 0
      operator: gte

  # ── PHASE 3: DELIVER (Post-Award) ──────────────────────────────────────

  monitor:
    enabled: true  # Phase E — implemented
    risk_tier: green
    schedule: "every 4h"
    description: "CPARS prediction + EVM early warnings"
    phase: deliver
    success_metric:
      name: alerts_generated
      threshold: 0
      operator: gte

  fulfill:
    enabled: true  # Phase E — implemented
    risk_tier: yellow
    schedule: "daily 09:00"
    description: "CDRL auto-generation + compliance refresh"
    phase: deliver
    days_ahead: 14
    max_generations_per_run: 10
    stale_threshold_days: 90
    goveval_gate_threshold: 0.5
    success_metric:
      name: cdrls_generated
      threshold: 0
      operator: gte

  publish:
    enabled: true  # Phase D — implemented
    risk_tier: yellow
    schedule: "on_demand"
    description: "Approved proposal drafts → Pulse case study articles"
    phase: deliver
    trigger: "after_fulfill"
    max_articles_per_run: 5
    success_metric:
      name: articles_staged
      threshold: 0
      operator: gte

  # ── PHASE 4: LEARN (Feedback Loop) ─────────────────────────────────────

  analyze:
    enabled: true  # Phase F — implemented
    risk_tier: green
    schedule: "weekly Sun 20:00"
    description: "Win/loss analysis + lessons learned"
    phase: learn
    success_metric:
      name: analyses_completed
      threshold: 0
      operator: gte

  train:
    enabled: true  # Phase F — implemented
    risk_tier: yellow
    schedule: "weekly Sun 22:00"
    description: "Approved drafts → fine-tuning pairs → Ollama"
    phase: learn
    success_metric:
      name: pairs_generated
      threshold: 0
      operator: gte

  # ─── 3-Engine Research Enhancement Reflexes (§3.11-§3.21) ─────────────────

  # R15: AI Color Team Review Simulator (§3.12)
  review:
    enabled: true
    risk_tier: yellow
    schedule: on_demand
    trigger: after_polish
    description: "Simulate Shipley color team reviews (Pink/Red/Gold) against Section M"
    phase: propose
    review_types:
      - pink     # After storyboard/outline
      - red      # After first draft (simulates government evaluator)
      - green    # After pricing (cost compliance)
      - gold     # Final executive review
    consensus_rules:
      go: "0 critical AND 0 major"
      conditional: "0 critical"
      nogo: "any critical"
    success_metric:
      name: findings_count
      threshold: 0
      operator: gte

  # R16: FAR/DFARS/GSA Change Monitor (§3.15 triggers)
  regulate:
    enabled: true
    risk_tier: green
    schedule: "weekly Mon 06:00"
    description: "Scan Federal Register for FAR/DFARS/GSA clause changes"
    phase: capture
    sources:
      - federal_register
      - gsa_bulletins
      - omb_memos
    success_metric:
      name: changes_detected
      threshold: 0
      operator: gte

  # R17: Cost Volume Automation (§3.13)
  price:
    enabled: true
    risk_tier: yellow
    schedule: on_demand
    trigger: after_map
    description: "LCAT mapping, FTE allocation, wrap rates, PTW analysis"
    phase: propose
    calc_plus_integration: true
    fpds_benchmarking: true
    success_metric:
      name: volumes_generated
      threshold: 0
      operator: gte

  # R18: CMMC Supply Chain Validator (§3.14)
  comply_cmmc:
    enabled: true
    risk_tier: green
    schedule: on_demand
    trigger: before_decide
    description: "Verify CMMC/SPRS status for all proposed team members"
    phase: propose
    sprs_check: true
    flow_down_generation: true
    dfars_clause: "252.204-7021"
    success_metric:
      name: non_compliant_count
      threshold: 0
      operator: eq     # 0 non-compliant = pass

  # R19: Contract Vehicle Monitor
  vehicle:
    enabled: true
    risk_tier: green
    schedule: "daily 07:30"
    description: "Track OASIS+, Polaris, CIO-SP4 domain openings and on-ramps"
    phase: capture
    vehicles:
      - oasis_plus
      - polaris
      - cio_sp4
      - gsa_mas
    success_metric:
      name: vehicles_checked
      threshold: 0
      operator: gte

  # R20: Talent Intelligence (§3.16)
  talent:
    enabled: true
    risk_tier: green
    schedule: "daily 08:00"
    description: "Monitor competitor job postings for competitive signals"
    phase: capture
    competitors:
      # Configure tracked competitors here
      - "Lockheed Martin"
      - "SAIC"
      - "Leidos"
      - "Booz Allen Hamilton"
      - "Northrop Grumman"
      - "General Dynamics"
      - "CACI"
      - "GovDash"
      - "GovSignals"
    velocity_threshold_zscore: 2.0    # Alert on hiring spikes > 2 std devs
    public_sources_only: true          # ADR-PG-3ENG-3: never scrape behind login walls
    success_metric:
      name: signals_detected
      threshold: 0
      operator: gte
    anomaly_detection:
      # Replaces the hardcoded ">= 5 postings = surge" cut-off with an adaptive
      # upper control limit: mean + velocity_threshold_zscore*std over the
      # competitor posting distribution in the window. See _compute_surge_threshold.
      enabled: true
      # Minimum distinct competitors with postings before the adaptive limit is
      # computed. Below this, the static fallback_surge_count is used — i.e.
      # behavior is unchanged with no/low history.
      min_samples: 3
      # Floor for the adaptive threshold so a flat, low-volume field never
      # manufactures spurious surges.
      min_absolute_surge: 5
      # Static fallback when fewer than min_samples competitors exist.
      fallback_surge_count: 5

  # R21: Lightweight Shipley Process Adaptation (§3.20)
  adapt:
    enabled: true
    risk_tier: green
    schedule: on_demand
    description: "Analyze team size and recommend Shipley process level"
    phase: learn
    team_size_thresholds:
      micro: 3       # 1-3: minimal ceremony
      small: 10      # 4-10: standard Shipley
      mid: 25        # 11-25: full Shipley
      enterprise: 999 # 25+: enterprise Shipley
    success_metric:
      name: adaptation_score
      threshold: 0
      operator: gte

  # R22: Compliance Traceability (§3.11)
  trace:
    enabled: true
    risk_tier: green
    schedule: "every 4h"
    trigger: after_extract
    description: "L/M/C traceability, coverage tracking, amendment change detection"
    phase: propose
    min_coverage_pct: 80            # Warn below 80% requirement coverage
    amendment_auto_reparse: true    # Auto-reparse on amendment detection
    success_metric:
      name: coverage_pct
      threshold: 80
      operator: gte

  # R23: Teaming Coordination Hub (§3.18)
  team:
    enabled: true
    risk_tier: yellow
    schedule: on_demand
    trigger: after_extract
    description: "Partner scoring, workshare tracking, TA lifecycle, OCI screening"
    phase: capture
    auto_oci_screening: true
    socioeconomic_verification: true
    ta_expiry_alert_days: 30        # Alert 30 days before TA expires
    success_metric:
      name: issues_found
      threshold: 0
      operator: gte

  # R24: Proposal-to-Program Bridge (§3.19)
  bridge:
    enabled: true
    risk_tier: yellow
    schedule: on_demand
    trigger: after_decide
    description: "Auto-generate structured handoff when bid is won"
    phase: deliver
    include_sections:
      - customer_context
      - win_themes
      - key_personnel
      - teaming_workshare
      - pricing_assumptions
      - compliance_commitments
      - risk_register
      - cdrl_requirements
    success_metric:
      name: bridges_generated
      threshold: 0
      operator: gte

# ── Audit Configuration ─────────────────────────────────────────────────────

audit:
  table: pg_proposal_genesis_audit
  retention_days: 365
  event_types:
    - pg.daemon.started
    - pg.daemon.stopped
    - pg.reflex.started
    - pg.reflex.completed
    - pg.reflex.failed
    - pg.reflex.skipped
    - pg.reflex.triggered
    - pg.circuit_breaker.tripped
    - pg.circuit_breaker.reset
    - pg.pipeline.discover_to_polish
    - pg.kill_switch.activated

# ── Security: NemoClaw Agent Sandboxing (D-NC-1, Enhancement §3.5) ─────────

security:
  # Per-reflex credential isolation
  credential_broker:
    enabled: false  # Enable when credential_broker.py is configured
    function_mapping:
      discover: sam_gov_read
      scout: competitor_intelligence_read
      shape: capture_plan_write
      engage: crm_write
      extract: requirement_extraction
      map: capability_mapping
      draft: draft_generation
      polish: quality_analysis
      decide: bid_scoring
      monitor: contract_monitoring
      fulfill: compliance_generation
      publish: pulse_write
      analyze: analytics_read
      train: training_pair_generation
      review: quality_analysis
      regulate: regulatory_monitoring
      price: pricing_analysis
      comply_cmmc: compliance_verification
      vehicle: opportunity_monitoring
      talent: competitive_intelligence_read
      adapt: process_analysis
      trace: compliance_verification
      team: teaming_management
      bridge: handoff_generation

  # Egress policies (deny-by-default per reflex)
  egress_policies:
    draft:
      allow:
        - "api.anthropic.com:443"     # Claude API for two-tier drafting
        - "localhost:11434"           # Ollama local
      deny_all_others: true
    discover:
      allow:
        - "api.sam.gov:443"           # SAM.gov API
        - "localhost:11434"
      deny_all_others: true
    scout:
      allow:
        - "api.sam.gov:443"           # SAM.gov contract awards
        - "localhost:11434"
      deny_all_others: true
    default:
      allow:
        - "localhost:11434"           # Ollama only
      deny_all_others: true

  # Blueprint verification on generated CDRLs
  blueprint_verification:
    enabled: true
    verify_cdrl_output: true         # Verify CDRL output dir digest after generation
    entity_type: cdrl                # Entity type for blueprint_digests table

# ── Enhancement Integration Settings ────────────────────────────────────────

enhancements:
  # §3.1 Bayesian bid scoring (D-BT-1)
  bayesian_scoring:
    enabled: true
    min_historical_decisions: 8      # Minimum bid decisions before Bayesian kicks in
    early_termination: true          # Short-circuit on clear no-bids
    early_termination_threshold: 0.245  # NO_BID_THRESHOLD * 0.7

  # §3.4 GraphRAG capability mapping (D-KARL-1)
  graphrag_mapping:
    enabled: true
    profile: compliance              # Default GraphRAG profile for capability mapping
    parallel_retrieval: true         # Use ThreadPoolExecutor for multi-strategy RAG
    max_workers: 3

  # §3.6 Stub detection pre-gate
  stub_detection:
    enabled: true
    min_substantive_score: 0.5       # Below this = draft rejected regardless of quality
    proposal_stub_patterns:
      - "TBD"
      - "TODO"
      - "insert here"
      - "[COMPANY NAME]"
      - "Lorem ipsum"
      - "refer to attachment"

  # §3.7 GovEval CDRL quality gate
  goveval_gate:
    enabled: true
    min_score: 0.5                   # Below this = needs_review
    compliance_cdrl_types:
      - ssp
      - sbom
      - poam
      - stig_checklist

  # §3.8 DocHub portfolio integration
  dochub_portfolio:
    enabled: true
    register_contracts: true         # Auto-register contracts as DocHub modules
    health_scoring: true             # Compute health scores after CDRL generation

  # §3.3 Workflow loops per opportunity
  workflow_loops:
    enabled: true
    auto_create_on_discover: true    # Create workflow loop when new opportunity found
    acceptance_criteria: true         # Add Gherkin acceptance criteria

  # §3.11 Compliance Matrix Builder (3-Engine Research)
  compliance_matrix:
    enabled: true
    auto_parse_on_extract: true      # Auto-build matrix after R5 Extract
    section_l_patterns: true         # Parse Section L (instructions)
    section_m_patterns: true         # Parse Section M (evaluation criteria)
    section_c_patterns: true         # Parse Section C (SOW/PWS)
    amendment_auto_update: true      # Auto-update matrix on amendment detection
    min_coverage_pct: 80             # Warn below 80% Section M coverage

  # §3.12 AI Color Team Review Simulator (3-Engine Research)
  color_review:
    enabled: true
    auto_trigger_pink: true          # Auto-trigger Pink after storyboard
    auto_trigger_red: true           # Auto-trigger Red after first draft
    auto_trigger_gold: true          # Auto-trigger Gold after quality gate
    vague_pattern_detection: true    # Flag "various", "as needed", etc.
    theme_density_min: 1.0           # Min theme references per 1000 words
    readability_target_grade: 12     # Flesch-Kincaid target (10-12 for gov proposals)

  # §3.13 Cost Volume Automation (3-Engine Research)
  cost_volume:
    enabled: true
    calc_plus_integration: true      # GSA CALC+ rate benchmarking
    fpds_analysis: true              # FPDS award data for PTW
    lcat_auto_map: true              # Auto-map PWS tasks to LCATs
    contract_types:
      - ffp
      - t_and_m
      - cpff
      - cpaf
      - idiq

  # §3.14 CMMC Supply Chain Validator (3-Engine Research)
  cmmc_validation:
    enabled: true
    auto_validate_before_bid: true   # Auto-run before R9 Decide
    flow_down_auto_generate: true    # Auto-generate DFARS 252.204-7021 clauses
    expiry_alert_days: 90            # Alert 90 days before CMMC cert expires

  # §3.15 GSA "American AI" Clause Compliance (3-Engine Research)
  ai_clause:
    enabled: true
    auto_detect_in_rfp: true         # Detect GSAR 552.239-7001, OMB M-26-04 in RFP text
    auto_generate_artifacts: true    # Auto-generate model cards, bias evals, etc.
    clause_patterns:
      - "GSAR 552.239-7001"
      - "American AI"
      - "OMB M-26-04"
      - "OMB M-25-21"

  # §3.16 Talent Intelligence (3-Engine Research)
  talent_intelligence:
    enabled: true
    velocity_zscore_threshold: 2.0   # Alert on hiring spikes > 2σ
    role_cluster_min: 5              # Alert when 5+ similar roles in one region
    salary_feed_to_ptw: true         # Feed salary data into R17 PTW analysis
    public_sources_only: true        # ADR-PG-3ENG-3

  # §3.17 Win Theme Registry (3-Engine Research)
  win_themes:
    enabled: true
    auto_inject_in_drafts: true      # Inject themes as writing guidance in R7
    density_check_in_polish: true    # Check theme density in R8
    min_themes_per_section: 1        # At least 1 theme per major section

  # §3.18 Teaming Coordination (3-Engine Research)
  teaming:
    enabled: true
    auto_oci_screening: true
    workshare_tracking: true
    ta_lifecycle_management: true
    socioeconomic_verification: true

  # §3.19 Proposal-to-Program Bridge (3-Engine Research)
  program_bridge:
    enabled: true
    auto_generate_on_award: true     # Auto-generate when bid is won
    include_crm_context: true
    include_pricing: true
    include_risk_register: true

  # §3.20 Lightweight Shipley Mode (3-Engine Research)
  lightweight_shipley:
    enabled: true
    auto_detect_team_size: true      # Detect team size from project config
    adapt_ceremony_level: true       # Scale process to team size

  # §3.21 CaptureAI Child App Interop (3-Engine Research)
  capture_interop:
    enabled: false                   # Enable when CaptureAI child app is deployed
    handoff_protocol: a2a_json_rpc   # A2A JSON-RPC at RFP-release handoff
    handoff_endpoint: null           # Set to CaptureAI A2A endpoint when available
