# -----------------------------------------------------------------------
# Constrained-network mode (OFF by default; zero overhead when disabled)
# -----------------------------------------------------------------------
# For environments with strict LLM rate limits and/or a constantly-changing
# egress proxy. Applies to BOTH text and vision calls — every provider call
# funnels through one choke point in tools/llm/router.py. Env vars override
# these values so a deployment can toggle without editing this file.
rate_limit:
  enabled: false            # master toggle.            Env: ICDEV_LLM_RATE_LIMIT=true|false
  max_parallel: 1           # max concurrent in-flight LLM calls when enabled. Env: ICDEV_LLM_MAX_PARALLEL
  pause_min_seconds: 3.0    # randomized inter-call pause lower bound.         Env: ICDEV_LLM_PAUSE_MIN
  pause_max_seconds: 5.0    # randomized inter-call pause upper bound.         Env: ICDEV_LLM_PAUSE_MAX
  # Scope of the cap:
  #   process (default) = per-process only.
  #   global (a.k.a. host) = ALSO hold a host-wide OS file-lock lease so the cap
  #     holds across processes on one host (dashboard + kanban_scheduler +
  #     genesis daemon). Same host + OS user.
  #   cluster (a.k.a. multi-host) = ALSO hold a PostgreSQL advisory-lock lease so
  #     the cap holds across EVERY host sharing this database. No extra infra —
  #     reuses the shared PG; the lock auto-releases if a host/connection dies.
  # Either lease fails open (in-process cap only) if the lock subsystem/DB is down.
  scope: process            # process | global | cluster. Env: ICDEV_LLM_RATE_LIMIT_SCOPE
  lease_name: llm           # shared lease key; callers sharing an API key must match. Env: ICDEV_LLM_LEASE_NAME
  lease_timeout_seconds:    # blank = wait indefinitely (locks free on crash).    Env: ICDEV_LLM_LEASE_TIMEOUT
proxy:
  # Leave all blank to use the OS HTTPS_PROXY/HTTP_PROXY env unchanged. For a
  # rotating proxy, prefer `command` (resolved fresh per call, TTL-cached) or
  # write the current URL to the ICDEV_LLM_PROXY env; cached SDK clients rebuild
  # automatically when the value changes. Priority: command > env > url.
  url: ""                   # fixed proxy URL.                        Env: ICDEV_LLM_PROXY
  command: ""               # command whose stdout is the current URL. Env: ICDEV_LLM_PROXY_CMD
  command_ttl_seconds: 2.0  # cache the command result this long.      Env: ICDEV_LLM_PROXY_CMD_TTL

# -----------------------------------------------------------------------
# Global Settings
# -----------------------------------------------------------------------
settings:
  max_retries: 5
  base_retry_delay_seconds: 1.0
  max_retry_delay_seconds: 30.0
  availability_cache_ttl_seconds: 1800
  prefer_local: false    # Two-tier handles local/cloud split — do not set true (blocks Claude tier2)
  # Ollama auto-discovery: on startup, probes /api/tags and registers new models in-memory
  # so they are immediately usable. Does NOT write to this file. Curate capabilities by hand.
  ollama_discovery:
    enabled: true
    probe_providers: [ollama, ollama_cloud]
    default_capabilities: [summarization, writing]
    refresh_interval_seconds: 3600

# -----------------------------------------------------------------------
# Two-Tier Routing (qwen3 worker → Claude planner/reviewer)
# -----------------------------------------------------------------------
# Claude is the brain. qwen3 handles drafting, research, and scanning.
#
# planner_functions : Claude directly — no qwen3 pre-step (architecture,
#                     orchestration, high-stakes planning)
# worker_functions  : qwen3 drafts a COMPACT structured response, then
#                     Claude verifies/corrects and returns the final answer.
#                     qwen3 output is intentionally short (reduces Claude's
#                     input tokens vs. Claude doing the full task alone).
# scanner_functions : qwen3 only — log analysis, health checks, simple
#                     pattern matching where review adds no value.
#
# Set enabled: false to fall back to normal chain-based routing.
# ── PII Redaction (D-RDT-1 through D-RDT-4, Phase 72 Hermes adaptation) ────
# Pre-LLM redaction + post-LLM de-anonymization for CUI/PII protection.
# ---------------------------------------------------------------------------
# Routing policy (prem-p0-01) — the CONTENT decides whether a call may leave.
#
# Enforced at the provider call itself (router._enforce_routing_policy), NOT at
# chain selection: two_tier routing runs before the chain is resolved, RL
# re-ranking rewrites it after, and the CLI bridge can prepend a cloud model to
# it. Chain filtering is defence in depth; this is the guarantee.
#
# Rungs, in strict precedence (tools/llm/routing_policy.py):
#   1. airgap                  — air-gapped install routes local, always
#   2. force_local             — function declared force_local: true (above)
#   3. declared_classification — LLMRequest.classification at/above threshold
#   4. derived_classification  — content COMPILES to a classification via the SCG
#                                aggregation rules (mosaic effect). The subtle one:
#                                no single field is classified, their co-occurrence is.
#   5. default                 — cloud permitted; content is masked at egress, and
#                                redaction.fail_closed REFUSES the call if the
#                                sanitizer cannot run.
#
# Why local_threshold is SECRET and not CUI: LLMRequest.classification DEFAULTS to
# "CUI" (tools/llm/provider.py), so a CUI threshold would force every call in the
# platform to local. That default is a marking convention, not an assertion about
# the content. CUI is protected by rung 2 (raw, unmaskable content never leaves)
# and by mandatory masking + fail_closed on everything else.
routing_policy:
  enabled: true
  local_threshold: SECRET
  aggregation_guard: true

redaction:
  enabled: true                    # Master toggle for pre-invoke PII redaction
  enforce_at_il4_plus: true        # Auto-enable at IL4+ even if global toggle is off
  skip_for_local_only: true        # Skip redaction when routing is Ollama-only
  deanonymize_response: true       # Restore originals in LLM response
  audit_enabled: true              # Log redaction events to redaction_audit table
  # Functions excluded from redaction — Pulse articles are public evergreen
  # blog posts, not CUI. Redacting org names produces [ORGANIZATION] tokens
  # that leak into published content.
  excluded_functions:
    - pulse_draft
    - pulse_rewrite
    - wg_rewrite
    - narrative_generation
    - ndc_config_review  # config text is the analyzed artifact; redaction breaks JSON schema keys like "remediation"

two_tier:
  enabled: true
  tier1_model: kimi-cloud       # Worker — kimi-k2.6 cloud first; qwen3-local (no-think) fallback
  tier2_model: claude-sonnet  # Planner/Reviewer — CLI bridge (no ANTHROPIC_API_KEY in this environment)

  # Dual-model mode: swap tier1 + overrides for simultaneous VRAM residency
  # Toggle via: env ICDEV_DUAL_MODEL=true, or dashboard toggle, or API
  # When enabled: tier1 → qwen3-dual (1.7B text-only), overrides swap to dual variants
  # When disabled: tier1 → qwen3-local (9B multimodal), original overrides
  dual_model:
    enabled: ${ICDEV_DUAL_MODEL:-false}
    tier1_override: qwen3-dual           # replaces tier1_model when active
    function_overrides:                   # replaces function_model_overrides entries
      pulse_rewrite: qwen3-dual          # 1.7B text-only instead of 9B
      # pulse_draft stays gemma3-local (already dual-resident)
      # wg_rewrite stays claude-sonnet-api (cloud, no VRAM impact)

  planner_functions:
    - agent_architect
    - agent_orchestrator
    - agent_mbse
    - agent_modernization
    - agent_requirements_analyst
    - task_decomposition
    - child_app
    - saas_proxy

  # Worker tier: qwen3 drafts → Claude reviews/corrects (two-step build pattern).
  # Restored 2026-04-30: thinking-mode timeouts resolved (think=False in provider;
  # GPU now active on RTX 4060 Ti with qwen3.5:9b — ~53s latency acceptable).
  worker_functions:
    - code_generation        # qwen3 drafts code → Claude reviews for correctness
    - bdd_preview            # qwen3 drafts BDD specs → Claude tightens acceptance criteria
    - narrative_generation   # qwen3 drafts narrative → Claude refines voice/structure

  scanner_functions:
    - agent_monitor
    - attachment_analysis
    - rag_rerank
    - rag_evaluate
    - ft_pair_generation
    - pulse_draft          # Drafting uses gemma3 (no thinking mode issues)
    - pulse_rewrite        # Rewriting uses qwen3.5 (think:false via provider)
    - codebase_query       # Phase 69: codebase assistant widget (D-CA-5)
    - wg_rewrite           # Claude override via function_model_overrides below

  # Per-function model overrides (scanner tier)
  # Override tier1_model for specific functions
  function_model_overrides:
    pulse_draft: gemma3-local        # gemma3 for article writing (no thinking mode)
    wg_rewrite: claude-sonnet    # Claude for WriteGuard rewriting (scanner path, CLI bridge)
    pulse_rewrite: qwen3-local      # qwen3.5 for Pulse rewriting (think:false via provider)

# -----------------------------------------------------------------------
# RAG Integration (D-RAG-2, Phase 64)
# -----------------------------------------------------------------------
# Controls RAG context injection into two-tier LLM pipeline.
# Full RAG config in args/rag_config.yaml — this section enables/disables
# the injection hook in the LLM router.
rag:
