  # Every model_id below MUST be present in `ollama list`. The aliases are kept
  # (llama-local alone is referenced 52 times in routing preferred[] chains), but
  # they now point at installed models. Previously they named llama3.3:70b,
  # codestral:22b, deepseek-r1:70b, qwen3:8b and qwen3:1.7b — none installed — so
  # every fallback that reached them failed at request time rather than at config load.
  #
  # Installed (2026-07-10): qwen3.5:latest (6.6GB), qwen3:4b (2.5GB),
  # qwen3:0.6b (522MB), gemma4:e4b (9.6GB, vision), nomic-embed-text, kimi-k2.6:cloud.
  #
