    proposal-genesis-daemon:
      monthly_usd: 5.00

# -----------------------------------------------------------------------
# Module Budget Enforcement (generative_intelligence + predictive_analysis)
# -----------------------------------------------------------------------
# Limits aggregate computational resources per high-cost module.
# Enforced in addition to per-agent token_budgets above.
module_budgets:
  enabled: true
  default_monthly_usd: 200.00
  default_monthly_tokens: 500000
  default_monthly_operations: 1000
  warning_threshold: 0.8
  hard_stop: true

  per_module:
    generative_intelligence:
      monthly_usd: 150.00         # LLM calls, embeddings, chain orchestration
      monthly_tokens: 400000
      monthly_operations: 0       # not used for generative
    predictive_analysis:
      monthly_usd: 50.00          # simulation runs, Monte Carlo, COA generation
      monthly_tokens: 100000       # LLM use inside simulations
      monthly_operations: 500      # simulation scenario runs

# -----------------------------------------------------------------------
# Chain Orchestration (CoT / CoD)
# -----------------------------------------------------------------------
chain_orchestration:
  enabled: true
  default_mode: single
  cost_cap_usd: 0.50
  token_cap: 32000
  timeout_seconds: 120
  cot:
    enabled: true
    max_rounds: 3
    self_consistency_runs: 1
    # Role routing keys — each role uses a distinct preferred model family for true multi-LLM CoT.
    # Takes precedence over *_model keys below. Set to null in per_function to use *_model fallback.
    reasoner_role: cot_reasoner       # deepseek-local → qwen3-local → cloud (thinking-focused)
    critic_role: cot_critic           # claude-sonnet → qwen3-local → cloud (review-focused)
    synthesizer_role: cot_synthesizer # claude-sonnet → qwen3-local → cloud (synthesis-focused)
    # Legacy direct model names — used as fallback when *_role resolves to nothing
    reasoner_model: qwen3-local
    critic_model: claude-sonnet
    synthesizer_model: claude-sonnet
    excluded_functions:
      - pulse_generation
      - news_oracle
      - market_scan
    per_function:
      code_generation:
        max_rounds: 5
        self_consistency_runs: 3
      # INTaaS cluster-level reasoning: local-only CoT to preserve scanner-tier cost model
      news_reasoning:
        max_rounds: 2
        self_consistency_runs: 1
        # Override to local-only by nulling roles and setting direct model names
        reasoner_role: null
        critic_role: null
        synthesizer_role: null
        reasoner_model: qwen3-local
        critic_model: qwen3-local
        synthesizer_model: qwen3-local
      capability_deliberation:
        max_rounds: 2
        self_consistency_runs: 1
        reasoner_role: capability_deliberation
        critic_role: acf_deliberation_judge
        synthesizer_role: acf_deliberation_judge
  cod:
    enabled: true
    num_debaters: 3
    debate_rounds: 2
    # Role routing keys for true multi-LLM debate.
    judge_role: cod_judge             # claude-sonnet → qwen3-local → cloud (best judgment)
    debater_pool_role: cod_debater_pool  # get_diverse_models() picks N distinct models
    # Legacy direct model names — used as fallback when pool returns nothing
    judge_model: claude-sonnet
    debater_models:
      - qwen3-local
      - claude-sonnet
      - gpt-4o
    excluded_functions:
      - pulse_generation
    per_function:
      architecture_review:
        num_debaters: 5
      # INTaaS perspective scoring: bull/bear/neutral debate with local debaters + Claude judge
      intaas_multiperspectivity:
        num_debaters: 3
        debate_rounds: 2
        judge_role: cod_judge
        judge_model: claude-sonnet
        # Override to local-only debaters by nulling pool role and using legacy list
        debater_pool_role: null
        debater_models:
          - qwen3-local
          - qwen3-local
          - qwen3-local
        positions:
          - Bull case (strong buy / buy)
          - Bear case (sell / strong sell)
          - Neutral case (hold / wait)
      capability_deliberation:
        num_debaters: 5
        debate_rounds: 2
        debater_pool_role: acf_deliberation_debaters
        judge_role: acf_deliberation_judge
        judge_model: glm5-cloud
        debater_models:
          - glm5-cloud
          - qwen3next-cloud
          - deepseek-cloud
          - kimi-cloud
          - minimax-m3
  council:
    enabled: true
    num_advisors: 5
    # Role routing keys for true multi-LLM council (see routing: section above)
    chairman_role: council_chairman
    advisor_pool_role: council_advisor_pool
    # Legacy direct model names — used as fallback when pool/role resolves to nothing
    chairman_model: claude-sonnet
    advisor_models:
      - qwen3-local
      - claude-sonnet
      - gpt-4o
    excluded_functions: []
    per_function:
      # idea_lab's cross-repo council_query MCP tool -- pressure-testing a
      # high-stakes idea/decision, not a code/architecture review, so the
      # default 5-advisor panel + medium cost cap is appropriate as-is.
      idealab_council_query:
        num_advisors: 5
  # -----------------------------------------------------------------------
  # Divergence: a single isolated generative fan-out that yields a raw idea pool
  # (tools.llm.chain_orchestrator.invoke_divergence). OPT-IN ONLY.
  #
  # Cost is the headline risk: upstream reports ~10 agent calls and 5-10x the
  # spend of a direct answer, and its guidance is to reserve the method for
  # decision points where being wrong has real consequences. Therefore:
  #   * enabled DEFAULT FALSE at the mode level -- divergence never runs unless a
  #     caller opts a function in via per_function.<fn>.enabled: true.
  #   * cost_cap_usd / timeout_seconds are declared HERE at the mode level rather
  #     than inherited: this mode is an N-way parallel fan-out, so the outer
  #     single-call backstop (0.50 / 120s) would under-reserve the module budget
  #     by ~num_branches and let a run start that cannot afford to finish. The
  #     cap is the PRE-FLIGHT ESTIMATE handed to _check_module_budget, which
  #     trips BEFORE any branch model call.
  #   * excluded_functions is honored by _is_excluded -- a hard block that wins
  #     even over a per_function enable.
  #
  # CUI: a divergence run over CUI-bearing input inherits the function's existing
  # LOCAL-ONLY routing and redaction obligations unchanged. The generative frame
  # prompts add no content that could defeat routing, and LOCAL-ONLY functions
  # stay on local models across every branch (each branch flows through the same
  # router pipeline as any other call). Divergence opens no new egress path.
  # -----------------------------------------------------------------------
  divergence:
    enabled: false            # OPT-IN: never a default generation path
    num_branches: 6           # capped by the frame-set size at runtime
    frame_set: generative     # resolves via args/ideation_frames.yaml (dvg-frames-01)
    deepen_top_k: 3           # dvg-critic-03: only the top-K clusters are deepened (expensive)
    branch_pool_role: divergence_branch_pool  # get_diverse_models() picks N distinct models
    critic_role: divergence_critic            # reserved for the SEPARATE dvg-critic-* pass
    # Fan-out-aware backstops (mode rung; see the cost note above). Sized off
    # num_branches, NOT off a single call: 6 branches x the 0.50 outer per-call
    # cap. Raising num_branches without raising cost_cap_usd re-introduces the
    # under-reservation this exists to prevent (pinned by the config tests).
    cost_cap_usd: 3.00        # >= num_branches * chain_orchestration.cost_cap_usd
    timeout_seconds: 180      # branches run in parallel; slowest branch + pool contention
    # Legacy direct model names — fallback when the pool role resolves to nothing
    branch_models:
      - qwen3-local
      - claude-sonnet
      - gpt-4o
    excluded_functions: []
    per_function: {}          # callers opt a function in here with `enabled: true`

# -----------------------------------------------------------------------
# AGX architecture selection (agx-core-03)
# Config-driven choice of reasoning architecture from the agx-core-01 registry
# (tools/llm/architectures/), so a canvas or router function can change
# reasoning strategy by config rather than code. Kept in THIS file (not a
# sibling args/architectures.yaml) to respect the single-source rule of
# resolve_llm_config_path() — one file every component already reads.
#
# Resolution precedence (tools/llm/architectures/selection.py):
#   explicit call arg > functions.<fn> > roles.<role> > default
# A value of null (the shipped default everywhere) means "no architecture
# indirection" — the caller keeps its current behavior unchanged. Enabling a
# named architecture is therefore always an explicit opt-in; omitting the key
# changes nothing. Names must be registered (registry.list_architectures()):
# chain_of_thought, chain_of_debate, council, react (+ agx-verify/rag/search).
# -----------------------------------------------------------------------
architectures:
  default: null            # null = current behavior; do not set globally without bench evidence (agx-bench-02)
  functions: {}            # e.g. {code_review: chain_of_debate}
  roles: {}                # e.g. {cot_reasoner: chain_of_thought}
  log_selections: true     # structured logging of which architecture served each request (agx-bench-01 consumes)

# -----------------------------------------------------------------------
# Response Cache + Context Caching (D-CACHE-1 through D-CACHE-10)
# Two-level: response_cache = deterministic KV store for full responses
# (PostgreSQL-native with SQLite fallback); context_cache = provider-level
# KV prefix reuse (cache_control: ephemeral on system prompt + last user msg).
# -----------------------------------------------------------------------
response_cache:
  enabled: true
  backend: postgresql
  ttl_seconds: 3600
  max_entries: 100000
  match_strategy: exact
