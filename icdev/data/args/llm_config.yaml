    supports_vision: true
    pricing: { input_per_1k: 0.0, output_per_1k: 0.0 }

  # Claude Sonnet via CLI bridge — used when ANTHROPIC_API_KEY is absent.
  # Identical capabilities to claude-sonnet; routes through local claude CLI.
  claude-sonnet-cli:
    provider: claude-cli
