# -----------------------------------------------------------------------
# Task Category Capability Matrix
# -----------------------------------------------------------------------
# Maps task categories to preferred models in priority order.
# Used by LLMRouter.get_models_for_category() and CoT/CoD role selection.
# Add new Ollama models to the appropriate categories when you pull them.

  # ── Merged from the packaged config (icdev/args) 2026-07-10 ──────────────
  # Additive cloud models plus the CLI-bridge model. `claude-cli` is what makes
  # the bridge selectable: without it registered, cli_bridge prepended a model
  # name the router could not resolve, so the bridge was a silent no-op.
  # ── Merged from the packaged config (icdev/args) 2026-07-10 ──────────────
  # Additive cloud models + the CLI-bridge model. Root keeps its own claude-*
  # entries, which route via the `claude-cli` provider because this environment
  # has no ANTHROPIC_API_KEY.
  # -- Claude Code CLI bridge — uses locally authenticated `claude` CLI binary --
  # This is the primary provider when ANTHROPIC_API_KEY is not set.
  # The cli_bridge auto-prepends this to every routing chain when enabled.
  claude-cli:
    provider: cli
    model_id: claude-cli
    context_window: 200000
    max_output_tokens: 32768
    supports_thinking: true
    supports_tools: false
    supports_structured_output: false
    pricing: { input_per_1k: 0.0, output_per_1k: 0.0 }

  cogito-cloud:
    provider: ollama_cloud
    model_id: "cogito-2.1:671b"
    context_window: 32768
    max_output_tokens: 32768
    supports_thinking: true
    supports_tools: true
    supports_structured_output: true
    pricing: { input_per_1k: 0.0, output_per_1k: 0.0 }

  gemini3-cloud:
    provider: ollama_cloud
    model_id: "gemini-3-flash-preview"
    context_window: 1000000
    max_output_tokens: 32768
    supports_thinking: true
    supports_tools: true
    supports_structured_output: true
