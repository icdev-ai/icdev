  # Plain router.invoke() fallback for the deliberation function (non-chain path) — cloud-only
  capability_deliberation:
    chain: [glm5-cloud, kimi-cloud, deepseek-cloud, minimax-m3]
    effort: medium

  convergence_nlp_extract:
    chain: [claude-haiku, qwen3-local, gpt-4o-mini, llama-local]
    effort: low

  dic_anomaly_severity:
    chain: [claude-haiku, qwen3-local, gpt-4o-mini, llama-local]
    effort: low

  # KG entity + relationship extraction from chunk text (rag_to_kg_ingester).
  # Extracts entities and infers edges among them; structured JSON output. Chain
  # leads with kimi-cloud (the configured primary) so it actually runs.
  kg_relationship_extraction:
    chain: [kimi-cloud, qwen3-local, claude-sonnet, gpt-4o, llama-local]
    effort: low

  # GraphRAG community summarisation (community_engine). Writes a theme summary
  # for one KG community from its entities + relationships.
  kg_community_summary:
