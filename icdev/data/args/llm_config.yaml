  #   Analogical Transfer, ...) and told to produce candidates, not critique.
  # divergence_critic: reserved for the SEPARATE dvg-critic-* scoring pass
  #   (categorical scorer), never used inside the generative fan-out itself --
  #   the generator/critic split is deliberately mechanical.
  # NOTE: a LOCAL-ONLY function inherits its own routing constraints unchanged;
  #   divergence opens no new egress path. When a function is pinned local, its
  #   per-function routing keeps every branch on local models.
  # -----------------------------------------------------------------------
  divergence_branch_pool:
    chain: [qwen3-local, llama-local, deepseek-local, claude-haiku, claude-sonnet, gpt-4o, gpt-4o-mini, gemini-2.5-flash, kimi-cloud]
