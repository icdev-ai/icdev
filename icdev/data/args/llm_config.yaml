    effort: high

  # -----------------------------------------------------------------------
  # Divergence role chains (single isolated generative fan-out that produces a
  # raw idea pool -- see tools.llm.chain_orchestrator.invoke_divergence).
  # divergence_branch_pool: same diverse-model-pool idea as council_advisor_pool,
