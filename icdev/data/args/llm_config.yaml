  oracle_triage_nlp_extract:
    chain: [claude-haiku, qwen3-local, gpt-4o-mini, llama-local]
    effort: low

  # Proposal Genesis NLP keyword/entity extraction (aiify-opp-5401).
  # Semantic keyword extraction over opportunity title/description for Pulse
