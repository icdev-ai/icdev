# Per-Agent Effort Defaults (Enhancement #4 — used by agent_executor)
# -----------------------------------------------------------------------

  # ── Merged from the packaged config (icdev/args) 2026-07-10 ──────────────
  # These chains existed only in icdev/args, so anything importing tools.llm.*
  # (rather than icdev.tools.llm.*) fell through to the `default` chain.
  # ── Merged from the packaged config (icdev/args) 2026-07-10 ──────────────
  # These chains existed only in icdev/args, so anything importing tools.llm.*
  # (rather than icdev.tools.llm.*) fell through to the `default` chain.
  # ── ACF (Autonomous Capability Foundry) deliberation — ALL Ollama-cloud ──
  # CLOUD-ONLY (no local models). All entries are provider 'ollama_cloud' with distinct
  # model families; get_diverse_models() returns N distinct cloud models per debate.
  # If cloud is unavailable (no key / air-gap), the deliberator's deterministic score-gate
