# ---------------------------------------------------------------------------
# Speculative Decoding (Ollama path only — auto-detected)
# ---------------------------------------------------------------------------
speculative_decoding:
  enabled: auto           # auto | true | false
                          # auto: probes Ollama /api/tags at startup; activates if a
                          #   dspark/eagle3/dflash draft model is already loaded.
                          #   Zero cost for non-Ollama providers (no network call).
  draft_model: ""         # leave blank to auto-discover; or pin e.g. deepseek-ai/dspark_qwen3_4b_block7
  draft_tokens: 5
  verification_ratio: 0.7
  fallback_on_failure: true
  target_endpoint: "${OLLAMA_BASE_URL:-http://localhost:11434}"

# ---------------------------------------------------------------------------
# Agent Loop Defaults (D-ALG-3)
# Consumed by icdev/tools/llm/agent_loop._load_budget_defaults().
# Per-role overrides can be set in role YAML as agent_max_total_tokens,
# agent_max_cost_usd, agent_context_window_tokens, agent_compression_budget_tokens
# (read via getattr(role, ...) in tools/ace/coworker_thread.py).
# ---------------------------------------------------------------------------
agent_loop:
  budgets:
    max_total_tokens: 128000          # hard cap on cumulative input+output tokens
    max_cost_usd: 5.0                 # hard cap on cumulative USD cost per run
    context_window_tokens: 64000      # soft threshold; triggers history compression
    compression_budget_tokens: 48000  # target budget after compression
    tool_timeout_seconds: 30.0        # per-tool execution timeout
    tool_result_max_chars: 32768      # truncate large tool results to this many chars
    llm_call_timeout_seconds: 120.0   # wrap each router.invoke() in this timeout
    stall_threshold: 3                # abort after N turns with no novel tool call
    # Ceiling on TOTAL session duration (ars-wall-01). tool_timeout_seconds and
    # llm_call_timeout_seconds are PER-CALL ceilings: a session can stay under
    # every one of them, under max_total_tokens and under max_cost_usd, and
    # still run for hours — which is exactly what a slow external dependency or
    # a patient loop produces. Exceeding this ends the run with
    # result_subtype=error_max_wall_clock / truncation_reason=max_wall_clock_seconds,
    # deliberately distinct from the token/cost reasons so "ran too long" never
    # reads as "task too big".
    # 1800s matches the kanban runner's default per-task kill timer
    # (KANBAN_MAX_EXECUTION_SECONDS) so the loop-level and task-level ceilings
    # agree out of the box; the dispatcher narrows it further per task from
    # kanban_tasks.max_runtime_seconds.
    max_wall_clock_seconds: 1800.0    # hard cap on total elapsed session time
  # Semantic loop detection (ars-loop-01) — consumed by
  # icdev/tools/llm/loop_detector.load_detector_config().
  # stall_threshold catches an agent making NO progress. This catches one making
  # steady progress through semantically equivalent actions: re-reading the same
  # file with a different path spelling, re-running a failing command with
  # cosmetic variation. Without it the run burns to the token ceiling and reports
  # error_max_budget_tokens, which reads as "task too big" rather than "stuck".
  # Thresholds were tuned by replaying real transcripts through
  # tools/llm/loop_detector_tune.py — lower similarity_threshold at your own risk,
  # a false positive kills legitimate iterative work.
  loop_detection:
    enabled: true
    window: 8                     # most recent tool calls considered
    similarity_threshold: 0.85    # argument AND result similarity both required
    min_cluster_size: 3           # equivalent calls needed before flagging
    min_distinct_turns: 3         # spread over N turns (one parallel fan-out is not a loop)
    min_distinct_variants: 2      # byte-identical repeats are the duplicate guard's job
    coverage_ratio: 0.6           # cluster must be this fraction of the window
    result_sample_chars: 400      # head+tail sample compared per tool result
  memory:
    enabled: true
    top_k: 5                  # agent-loop recall depth
    # Recall depth for the chat pre-response lookup specifically. Read by
    # tools/dashboard/chat_manager.py, which fell back to a hardcoded 3 while
    # this key was absent — the setting was live but undiscoverable, so tuning
    # chat recall looked impossible from config. Kept separate from top_k
    # because a chat turn is latency-sensitive in a way an agent loop is not.
    chat_top_k: 3
    tier: "episodic|semantic"
  rubric:
    max_grading_iterations: 3   # grade-then-revise rounds before giving up
    grader_max_tokens: 1024     # max output tokens for the grader's JSON verdict


# -----------------------------------------------------------------------
# Context Compression (adapt-hd-01)
# Headroom-inspired reversible token-budget-aware compression middleware.
# Applied in router.py::invoke() before the fallback chain.
# -----------------------------------------------------------------------
compression:
  enabled: false                        # Set true to activate; default off
  threshold_tokens: 6000                # Only compress when estimated tokens exceed this
  strategy: truncate_middle             # "truncate_middle" — keep first 40% + last 40%
  max_compression_ratio: 0.6            # Never compress below 60% of original length
  log_savings: true                     # Emit compression_saved_tokens to audit trail
  exempt_functions:                     # These functions bypass compression (always send full context)
    - compliance_generation
    - ssp_generation
    - evidence_collection
    - security_audit
    - fine_tuning_generation

# -----------------------------------------------------------------------
# Reasoned Codegen (tools/llm/reasoned_codegen.py)
# Opt-in Generate -> Critique -> Verify -> Repair loop that composes the
# chain_orchestration engine (CoT/CoD) + anvil_critique + an injected verifier.
# When a function resolves to mode:off and critique:false the wrapper is a
# byte-identical passthrough to router.invoke (zero added cost).
#
# Cost scaling (why expensive paths default OFF):
#   CoT      ~= chain_orchestration.cot.max_rounds sequential calls
#   CoD      ~= num_debaters * debate_rounds + 1 judge
#   critique  += len(anvil_critique.critics) parallel calls PER round
#   outer loop multiplies the above by max_repair_rounds
#   Worst case (code_generation CoD 3x2 + critique 3 + repair 2) ~= 20 calls.
# Hard backstops remain chain_orchestration.cost_cap_usd / token_cap and
# module_budgets; cost_cap_usd below aborts the OUTER repair loop.
# -----------------------------------------------------------------------
reasoned_codegen:
  enabled: true
  default_mode: off          # off | cot | cod  (global default OFF)
  default_critique: false
  max_repair_rounds: 2
  cost_cap_usd: 1.00         # outer-loop cap; >= chain_orchestration.cost_cap_usd
  token_cap: 64000
  per_function:
    # PHASE 1 — default ON. Translation already has verify+repair (pass@k + Phase 5).
    code_translation:
      enabled: true
      mode: cot
      critique: false
      max_repair_rounds: 3
    # PHASE 2 — wired but default OFF until validated on translation.
    code_generation:
      enabled: false
      mode: cot
      critique: true
      max_repair_rounds: 2
    # PHASE 3 — wired but default OFF.
    child_app:
      enabled: false
      mode: cot
      critique: true