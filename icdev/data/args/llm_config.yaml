# [TEMPLATE: CUI // SP-CTI]
# ICDEV™ LLM Provider Configuration
# Controls which models are used for each function across the platform.
# Single source of truth — replaces scattered hardcoded model IDs.

# -----------------------------------------------------------------------
# Provider Definitions
# -----------------------------------------------------------------------
providers:
  bedrock:
    type: bedrock
    region: ${AWS_DEFAULT_REGION:-us-gov-west-1}
    # Uses boto3 credentials (IAM role, env vars, or ~/.aws/credentials)

  anthropic:
    type: anthropic
    api_key_env: ANTHROPIC_API_KEY
    base_url: https://api.anthropic.com

  openai:
    type: openai_compatible
    api_key_env: OPENAI_API_KEY
    base_url: https://api.openai.com/v1

  # Corporate LLM gateway / egress proxy.
  #
  # Many enterprises front all model traffic with their own gateway, which
  # authenticates UPSTREAM — the client presents no API key at all. Set
  # ICDEV_LLM_GATEWAY_URL and leave the key unset; the OpenAI-compatible
  # provider sends the placeholder "not-needed" and the gateway supplies real
  # credentials on the way out.
  #
  # Distinct from the LPX proxy (proxy_gateway.py): that is OUR LiteLLM proxy
  # with virtual keys. This is THEIR infrastructure, and ICDEV is just a client.
  gateway:
    type: openai_compatible
    # No default on purpose. A corporate gateway URL is site-specific, and any
    # value invented here would be wrong everywhere — :4000 in particular is
    # ICDEV's OWN LiteLLM proxy, a different service entirely. Unset means
    # unconfigured, which the setup probe reports plainly.
    base_url: ${ICDEV_LLM_GATEWAY_URL:-}
    # Optional. Most gateways need nothing; some want a team/tenant token.
    api_key_env: ICDEV_LLM_GATEWAY_KEY

  ollama:
    type: ollama
    base_url: ${OLLAMA_BASE_URL:-http://localhost:11434}

  gemini:
    type: gemini
    api_key_env: GOOGLE_API_KEY

  vllm:
    type: openai_compatible
    base_url: ${VLLM_BASE_URL:-http://localhost:8000/v1}
    api_key_env: VLLM_API_KEY

  # LocalAI — OpenAI-compatible local inference AND embeddings, air-gap friendly
  # (Go binary, no Python deps). Upstream default port is 8080; set LOCALAI_BASE_URL
  # to override. Named provider added by oss2-fix-01 (D1) so a LocalAI deployment is
  # selectable, not just probe-detectable.
  localai:
    type: openai_compatible
    base_url: ${LOCALAI_BASE_URL:-http://localhost:8080/v1}
    api_key_env: LOCALAI_API_KEY

  ibm_watsonx:
    type: ibm_watsonx
    api_key_env: IBM_CLOUD_API_KEY
    project_id: ${IBM_WATSONX_PROJECT_ID:-}
    url: ${IBM_WATSONX_URL:-https://us-south.ml.cloud.ibm.com}

  # Mistral AI — OpenAI-compatible API (LeanStral, Mistral Small 4)
  # Cloud: api.mistral.ai (requires MISTRAL_API_KEY)
  # Air-gapped: self-host via vLLM (see mistral_vllm provider below)
  mistral:
    type: openai_compatible
    api_key_env: MISTRAL_API_KEY
    base_url: ${MISTRAL_BASE_URL:-https://api.mistral.ai/v1}

  # Self-hosted Mistral/LeanStral via vLLM (air-gapped deployment)
  # docker pull mistralllm/vllm-ms4:latest
  # vllm serve mistralai/Leanstral-2603 --tensor-parallel-size 4 \
  #   --attention-backend FLASH_ATTN_MLA --tool-call-parser mistral
  mistral_vllm:
    type: openai_compatible
    base_url: ${MISTRAL_VLLM_BASE_URL:-http://localhost:8100/v1}
    api_key_env: MISTRAL_VLLM_API_KEY

  # Ollama cloud endpoint — authenticated, falls back to local ollama
  ollama_cloud:
    type: ollama
    base_url: ${OLLAMA_CLOUD_BASE_URL:-https://ollama.com}
    api_key_env: OLLAMA_API_KEY

  # Claude CLI bridge — routes through the locally authenticated Claude Code
  # session. Used when ANTHROPIC_API_KEY is absent (this environment).
  claude-cli:
    type: cli
    cli_binary: claude
    backend: auto
    soft_wait_seconds: 360

# -----------------------------------------------------------------------
# Model Registry
# -----------------------------------------------------------------------

  # Claude Code CLI provider — routes through the authenticated local `claude` CLI
  # binary. Auto-enabled when no cloud API keys are present (air-gap / no ANTHROPIC_API_KEY).
  # Requires `claude` on PATH (installed via Claude Code).
  cli:
    type: cli
    cli_binary: ${CLAUDE_CLI_BINARY:-claude}
models:
  # -- Anthropic Claude --
  #
  # These declare the Anthropic API provider. That is deliberate and portable: the
  # router SKIPS any model whose provider's api_key_env is unset and falls through
  # to the next entry in the chain. So an environment with ANTHROPIC_API_KEY serves
  # these directly, and one without it gets the CLI bridge — auto-enabled when no
  # cloud key is present — which prepends `claude-cli` to every chain and serves the
  # same requests through the local `claude` binary.
  #
  # Do NOT hardcode provider: claude-cli here; that pins every environment to the
  # CLI even where an API key exists.
  claude-opus:
    provider: anthropic
    model_id: claude-opus-4-8
    context_window: 200000
    max_output_tokens: 128000
    supports_thinking: true
    supports_tools: true
    supports_structured_output: true
    supports_vision: true
    pricing: { input_per_1k: 0.0, output_per_1k: 0.0 }

  claude-sonnet:
