  # the "Claude thinks, Ollama builds" convention.
  # Test-execution tier (chain_groups.test_execution): CI/test failure
  # triage during PR/merge runs on Kimi.
  failure_triage_diagnose:
    chain: *test_execution_chain
    effort: high

  failure_triage_patch:
