  # chairman synthesis -- see tools.llm.chain_orchestrator.invoke_council)
  # council_advisor_pool: same diverse-model-pool idea as cod_debater_pool,
  #   but each slot is paired with a FIXED cognitive lens (Contrarian, First
  #   Principles Thinker, ...) rather than a generated stance.
  # council_chairman: best available model for the final structured verdict.
  # -----------------------------------------------------------------------
  council_advisor_pool:
    chain: [qwen3-local, llama-local, deepseek-local, claude-haiku, claude-sonnet, gpt-4o, gpt-4o-mini, gemini-2.5-flash, kimi-cloud]
    effort: medium

  council_chairman:
