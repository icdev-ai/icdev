  acf_deliberation_debaters:
    chain: [glm5-cloud, qwen3next-cloud, deepseek-cloud, kimi-cloud, minimax-m3, mistral-large-cloud, nemotron-cloud, gemini3-cloud, gpt-oss-cloud, cogito-cloud]
    effort: medium

  acf_deliberation_judge:
    chain: [glm5-cloud, kimi-cloud, deepseek-cloud, minimax-m3]
    effort: high

  agent_product_manager:
    chain: [kimi-cloud, qwen3-local, claude-sonnet, gemini-2.5-pro, gpt-4o, llama-local]
    effort: high

  agent_software_craftsperson:
    chain: [kimi-cloud, qwen3-local, claude-opus, gemini-2.5-pro, gpt-4o, llama-local]
