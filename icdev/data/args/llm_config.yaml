  # Governed Delivery Pipeline — Conformance Review gate (Phase 2). Judges
  # whether a task's implementation conforms to its acceptance criteria.
  # Test-execution tier (chain_groups.test_execution): Kimi judges during
  # PR/merge; qwen3-local remains the air-gap fallback.
  conformance_review:
    chain: *test_execution_chain
    effort: low

  # GovCon Proposal Functions — LOCAL ONLY (Phase 70: Redaction & Data Protection)
  # Proposal content contains CUI program names, past performance, pricing.
  # WriteGuard rewrite (wg_rewrite) stays on Claude (rewrites style, not content).
  #
  # prem-p0-02. These used to be protected by the `chain:` list ALONE, under a
  # comment that said "never send raw proposal content to cloud LLMs". A chain is
  # a hand-maintained list of model names, and it protected nothing:
  #
  #   1. Nothing enforced it. Add a cloud model to the list, or rename a local one,
  #      and CUI egresses in silence.
  #   2. The chain was not the last word. `two_tier` routing is applied BEFORE the
  #      chain is resolved, RL re-ranking rewrites it afterwards, and the CLI-bridge
  #      invoke-time override PREPENDS `claude-cli` — a cloud path — to whatever
  #      chain it is handed. A chain that reads local-only here could still be
  #      fronted by a cloud model at request time.
  #   3. It only covered what someone remembered to pin. See requirement_extraction
  #      below, which sat in this very block routing to kimi-cloud FIRST.
  #
  # `force_local: true` is a DECLARED INTENT that the router ENFORCES at the
  # provider call itself (tools/llm/routing_policy.py + router._enforce_routing_policy):
  # if the model about to be invoked is not on a local-only provider, the call is
  # REFUSED. The chain stays local-first so that even an enforcement bug cannot
  # leak — defence in depth, not a single flag.
  proposal_drafting:
    chain: [qwen3-local, llama-local]
    effort: medium
    force_local: true

  # NOT force_local — and this needs justifying, because it sits in the "never send
  # proposal content to cloud" block and routes to kimi-cloud FIRST. That is exactly
  # the hole a pin list cannot close, and it is why the policy is content-based.
  #
  # Requirement extraction reads the SOLICITATION (RFP/RFI), which is a published
  # government document, not our proposal prose. So cloud is legitimate here. But we
  # no longer take that on trust: the content itself is now checked at egress — if
  # it carries a declared classification, or COMPILES to one via the aggregation
  # guard (mosaic effect), it routes local anyway; otherwise it is masked by the
  # sanitizer before it leaves, and with redaction.fail_closed a sanitizer that
  # cannot run REFUSES the call rather than sending raw text.
  requirement_extraction:
    chain: [kimi-cloud, qwen3-local]
    effort: medium

  bid_scoring:
    chain: [qwen3-local, llama-local]
    effort: low
    force_local: true

  color_review:
    chain: [qwen3-local, llama-local]
    effort: medium
    force_local: true

  # Per-role RFI routing — Hermes-Agent pattern 1: each role gets its own
  # model chain + effort tier. LOCAL ONLY (CUI content — never cloud LLMs).
  # effort=low for Writer (quantity/speed), medium for Editor (repair pass),
  # high for Reviewer/Researcher/Compliance (evaluation & gate functions).
  # All five are force_local: they draft and review OUR response prose, which is
  # raw CUI and cannot be usefully masked (mask the program names and there is
  # nothing left to write about).
  rfi_writer_drafting:
    chain: [qwen3-local, llama-local]
    effort: low
    force_local: true

  rfi_editor_drafting:
    chain: [qwen3-local, llama-local]
    effort: medium
    force_local: true

  rfi_reviewer_review:
    chain: [qwen3-local, llama-local]
    effort: high
    force_local: true

  rfi_researcher_knowledge:
