  # ── PLAN ORBAT Detail (vessel-centric, for intelligence analysis) ──────────
  # Sources: open-source OSINT (USNI News, Jane's, CSIS China Power Project).
  # displacement_t: full-load displacement in metric tons.
  # threat_ring_nm: approximate weapons engagement radius (nautical miles).
  # status: assessed operational readiness (active / trials / fitting_out).
  vessel_inventory:

    # ── Aircraft Carriers (CV/CVN) ─────────────────────────────────────────
    - hull_number: "16"
      vessel_name: Liaoning
      vessel_class: Kuznetsov (modified)
      vessel_type: CV
      nation: PRC
      displacement_t: 67_500
      home_port: Qingdao
      commissioned: 2012
      aircraft_capacity: ~36
      threat_ring_nm: 300
      notes: STOBAR; first Chinese carrier; training and operational roles
      status: active

    - hull_number: "17"
      vessel_name: Shandong
      vessel_class: Type 001A
      vessel_type: CV
      nation: PRC
      displacement_t: 70_000
      home_port: Sanya (Yulin Naval Base)
      commissioned: 2019
      aircraft_capacity: ~36
      threat_ring_nm: 300
      notes: STOBAR; first domestically designed carrier
      status: active

    - hull_number: "18"
      vessel_name: Fujian
      vessel_class: Type 003
      vessel_type: CVN
      nation: PRC
      displacement_t: 80_000
      home_port: Shanghai (Jiangnan Shipyard / fitting out)
      commissioned: 2024
      aircraft_capacity: ~60
      threat_ring_nm: 400
      notes: CATOBAR with electromagnetic catapults (EMALS); nuclear-capable air wing integration expected
      status: active

    # ── Destroyers ─────────────────────────────────────────────────────────
    - vessel_class: Type 055 (Renhai)
      vessel_type: DDG
      nation: PRC
      units_in_class: 8
      displacement_t: 13_000
      primary_weapons:
        - VLS cells: 112
        - HHQ-9B SAM
        - YJ-18 ASCM
        - CJ-10 land-attack cruise missile
      threat_ring_nm: 540       # YJ-18 range
      notes: World's second-largest guided-missile destroyer; CG equivalent capability
      status: active

    - vessel_class: Type 052D (Luyang III)
      vessel_type: DDG
      nation: PRC
      units_in_class: 25        # as of 2025
      displacement_t: 7_500
      primary_weapons:
        - VLS cells: 64
        - HHQ-9A/B SAM
        - YJ-12/YJ-18 ASCM
      threat_ring_nm: 300
      notes: Area-air-defense backbone of the PLAN surface force
      status: active

    # ── Submarines ─────────────────────────────────────────────────────────
    - vessel_class: Kilo (Project 636 Varshavyanka)
      vessel_type: SSK
      nation: PRC
      units_in_class: 2         # transferred from Russia; aging
      displacement_t: 3_076     # submerged
      primary_weapons:
        - 533mm torpedoes
        - Club-S (SS-N-27) ASCM
      threat_ring_nm: 220       # Club-S range
      notes: >
        Diesel-electric; "Black Hole" acoustic signature; aging platforms,
        primarily retained for crew training
      status: active

    - vessel_class: Type 039A/B (Yuan)
      vessel_type: SSK
      nation: PRC
      units_in_class: 22        # as of 2025
      displacement_t: 3_600     # submerged
      primary_weapons:
        - 533mm torpedoes
        - YJ-18 ASCM (tube-launched variant)
        - CY-5 anti-submarine rocket
      threat_ring_nm: 290
      notes: >
        AIP-equipped diesel-electric; workhorse of the PLAN conventional
        submarine force; quieter than older Song/Ming classes
      status: active

    # ── Amphibious Assault Ships (LHD) ────────────────────────────────────
    - vessel_class: Type 075 (Yushen)
      vessel_type: LHD
      nation: PRC
      units_in_class: 3
      displacement_t: 40_000
      embarked_aircraft: ~30    # helicopters / tiltrotors
      landing_craft: 2x LCAC + LCUs
      marines_embarked: ~1_800
      threat_ring_nm: 50        # self-defense only; dependent on escort
      notes: >
        China's first purpose-built LHD; well deck + flight deck; key enabler
        for amphibious operations against Taiwan or contested islands
      status: active
