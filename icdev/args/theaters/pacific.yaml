# CUI // SP-CTI
# STRATEGOS — Indo-Pacific Theater Configuration
# ─────────────────────────────────────────────────────────────────────────────
# Theater definition for the Indo-Pacific / Western Pacific operational area.
# Consumed by: tools/strategos/*, intelligence/oracle/sio_engine.py
#
# bounds: WGS-84 bounding box [min_lon, min_lat, max_lon, max_lat]
# pmtiles_file: base map tile archive served by the STRATEGOS map panel
# actors: belligerents / parties of interest with role and color
# orbat: PLAN Order of Battle — key surface and sub-surface platforms

theater:
  id: pacific
  name: Indo-Pacific Theater
  pmtiles_file: pacific.pmtiles

  # ── Geographic bounds ─────────────────────────────────────────────────────
  # Covers the Western Pacific from the South China Sea through the Philippine
  # Sea, East China Sea, and Taiwan Strait.  Extends east to ~180° to include
  # the Second Island Chain and Guam.
  bounds:
    min_lon:  90.0
    min_lat: -15.0
    max_lon: 180.0
    max_lat:  50.0

  # ── Actors ────────────────────────────────────────────────────────────────
  actors:
    - id: PRC
      name: "People's Republic of China"
      role: adversary
      color: "#E63946"          # red
      force_designator: PLAN    # People's Liberation Army Navy

    - id: TWN
      name: Taiwan (Republic of China)
      role: contested
      color: "#F4A261"          # amber
      force_designator: ROCN

    - id: USA
      name: United States of America
      role: friendly
      color: "#457B9D"          # blue
      force_designator: USN

    - id: JPN
      name: Japan
      role: friendly
      color: "#2A9D8F"          # teal
      force_designator: JMSDF

    - id: AUS
      name: Australia
      role: friendly
      color: "#264653"          # dark teal
      force_designator: RAN

    - id: PHL
      name: Philippines
      role: friendly
      color: "#E9C46A"          # gold
      force_designator: PN

  # ── Active domains ───────────────────────────────────────────────────────
  active_domains:
    - sea
    - air
    - space
    - cyber
    - land
    - ew
    - info

  # ── Escalation ladder (Taiwan Strait / Pacific-specific) ──────────────────
  escalation_ladder:
    - level: 1
      label: "Gray Zone"
      description: "Maritime militia incursions, island-building, fly-overs, disinformation"
      color: "#27ae60"
    - level: 2
      label: "Crisis Signaling"
      description: "PLAN exercise in Taiwan Strait, carrier deployments, sanctions threat"
      color: "#2ecc71"
    - level: 3
      label: "Quarantine / Blockade"
      description: "Maritime blockade of Taiwan, air exclusion zone, missile warning shots"
      color: "#f39c12"
    - level: 4
      label: "Limited Strikes"
      description: "Conventional missile strikes on air bases, radar, command nodes"
      color: "#e67e22"
    - level: 5
      label: "Amphibious Assault"
      description: "PLAN amphibious assault on Taiwan — LHD/LPD surge, airborne drops"
      color: "#e74c3c"
    - level: 6
      label: "Expanded Conflict"
      description: "USN/JMSDF intervention, Second Island Chain engagement, Guam strikes"
      color: "#c0392b"
    - level: 7
      label: "Nuclear Signaling"
      description: "DF-5B / JL-3 dispersal, PRC nuclear rhetoric, DEFCON elevation"
      color: "#8e44ad"
    - level: 8
      label: "EMP / Limited Nuclear"
      description: "High-altitude EMP test, tactical nuclear options on table"
      color: "#6c3483"
    - level: 9
      label: "Strategic Nuclear"
      description: "Theater nuclear exchange threatened; US triad on alert"
      color: "#4a235a"
    - level: 10
      label: "Existential"
      description: "Full strategic nuclear exchange"
      color: "#1a1a2e"

