# CUI // SP-CTI
# FORGE Academy Content Ontology
# Maps curriculum content to ICDEV ontology classes for KG integration.

# ---------------------------------------------------------------------------
# Content-type ontology (what a file *is*)
# ---------------------------------------------------------------------------
content_types:
  icdev:Lesson:
    description: "Instructional markdown content — explains a concept or technique."
    applies_to: ["step*.md", "step-*.md"]
  icdev:Lab:
    description: "Hands-on starter code / scaffold file."
    applies_to: ["*_starter.py"]
  icdev:Assessment:
    description: "Automated test / validation script."
    applies_to: ["*_test.py"]

